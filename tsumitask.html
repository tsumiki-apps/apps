@media (prefers-color-scheme:dark){:root{
  --paper:#0f0d07;--surface:#211d14;--surface-2:#2b2619;--ink:#efe8da;--ink-mid:#a89e8b;--ink-soft:#9f988a;
  --ghost:#8a8170;--line:#36301f;--accent:#d59a4d;--accent-2:#e0ab63;--accent-wash:#362a19;
  --good:#7fae82;--good-ink:#7fae82;--warn:#d9825a;--warn-ink:#d9825a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -18px rgba(0,0,0,.65);
  --scrim:rgba(0,0,0,.55);--fill:#d59a4d;--on-fill:#1d1a15;
}}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;font-size:16px;line-height:1.6;
  min-height:100dvh;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
.wrap{width:100%;max-width:640px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(120px + env(safe-area-inset-bottom))}
@media (min-width:600px){.wrap{padding-left:24px;padding-right:24px}}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 4px 16px}
h1{font-size:24px;font-weight:700;line-height:1.35}
.sync{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft)}
.sync i{width:10px;height:10px;border-radius:50%;background:var(--good)}
.sync.off i{background:none;border:2px solid var(--warn)}
.sync.busy i{background:var(--ghost)}

/* アイコン（currentColor で塗る） */
.ic{display:inline-block;flex:none;background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
.ic.apple{--m:var(--i-apple)}.ic.tsumiki{--m:var(--i-tsumiki)}.ic.private{--m:var(--i-private)}.ic.all{--m:var(--i-all)}

/* 括りの切り替え */
.bar{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface-2);border-radius:12px;padding:4px}
.tab{position:relative;height:48px;border-radius:8px;color:var(--ink-mid);display:flex;align-items:center;justify-content:center}
.tab[aria-pressed="true"]{background:var(--surface);color:var(--accent-2)}
.tab[aria-pressed="true"]::after{content:"";position:absolute;left:50%;bottom:5px;width:16px;height:3px;margin-left:-8px;border-radius:2px;background:var(--accent-2)}
.tab .ic{width:26px;height:26px}.tab .ic.apple{width:22px;height:26px}.tab .ic.tsumiki{width:31px;height:28px}

/* 一覧 */
.sec{margin-top:24px}
.sec h2{font-size:14px;font-weight:500;color:var(--ink-soft);margin:0 8px 8px;display:flex;align-items:center;gap:8px}
.sec h2.late{color:var(--warn-ink)}
.sec h2 .n{font-size:13px;font-weight:400}
ul{list-style:none;background:var(--surface);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
li{display:flex;align-items:center;gap:4px;min-height:56px;padding:0 8px 0 4px;border-bottom:1px solid var(--line)}
li:last-child{border-bottom:0}
.ck{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center}
.ck i{width:22px;height:22px;border:2px solid var(--ghost);border-radius:50%;position:relative}
li.done .ck i{border-color:var(--good)}
li.done .ck i::after{content:"";position:absolute;left:5px;top:1px;width:6px;height:11px;border:solid var(--good-ink);border-width:0 2px 2px 0;transform:rotate(45deg)}
.body{flex:1;min-width:0;min-height:44px;display:flex;align-items:center;gap:10px;text-align:left;padding:6px 4px}
.tt{flex:1;min-width:0;overflow-wrap:anywhere}
li.done .tt{color:var(--ink-soft);text-decoration:line-through}
.tg{color:var(--ink-mid);display:flex;align-items:center}
.tg .ic{width:18px;height:18px}.tg .ic.apple{width:15px;height:18px}.tg .ic.tsumiki{width:22px;height:20px}
.du{font-size:13px;color:var(--ink-soft);min-width:28px;text-align:right;white-space:nowrap}
.du.late{color:var(--warn-ink)}
.more{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 8px;font-size:14px;color:var(--ink-soft)}
.more svg{width:14px;height:14px;transition:transform .2s}
.more[aria-expanded="true"] svg{transform:rotate(90deg)}
.empty{display:flex;flex-direction:column;align-items:center;gap:12px;padding:72px 0 0;color:var(--ink-soft);font-size:14px}
.empty .ic{width:44px;height:36px;color:var(--ghost)}

/* 追加ボタン */
.fab{position:fixed;right:max(20px,calc(50vw - 392px));bottom:calc(24px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:20px;
  background:var(--fill);color:var(--on-fill);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.fab svg{width:26px;height:26px}

/* シート */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:640px;background:var(--surface);border-radius:20px 20px 0 0;
  padding:12px 20px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .22s ease;max-height:92dvh;overflow:auto}
.sheet.on{transform:none}
@media (min-width:900px){.sheet{bottom:auto;top:50%;border-radius:20px;transform:translateY(-50%) scale(.98);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
  .sheet.on{transform:translateY(-50%);opacity:1;pointer-events:auto}.grab{display:none}}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.row{display:flex;gap:8px;align-items:center;margin-top:16px;flex-wrap:wrap}
.inp{width:100%;font:inherit;font-size:17px;min-height:48px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface-2);border-radius:12px;padding:4px;width:100%}
.chip{min-height:44px;padding:0 16px;border-radius:999px;background:var(--surface-2);color:var(--ink-mid);font-size:15px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--accent-wash);color:var(--accent-2);font-weight:500}
.chip input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.chip.date{position:relative}
.acts{display:flex;align-items:center;gap:8px;margin-top:24px}
.btn{min-height:48px;padding:0 20px;border-radius:12px;background:var(--surface-2);font-weight:500}
.btn.main{flex:1;background:var(--fill);color:var(--on-fill)}
.btn:disabled{opacity:.5}
.del{width:48px;height:48px;border-radius:12px;background:var(--surface-2);color:var(--warn-ink);display:flex;align-items:center;justify-content:center}
.del svg{width:20px;height:20px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--paper);
  border-radius:12px;padding:6px 6px 6px 16px;display:flex;align-items:center;gap:8px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{min-height:40px;padding:0 12px;color:var(--accent-wash);font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const CATS = ['apple','tsumiki','private'];
const CAT_NAME = {apple:'Apple（仕事）',tsumiki:'つみき',private:'プライベート'};

/* ========== 状態 ========== */
// tasks: id -> {id,title,cat,due,done,done_at,deleted,created_at,updated_at}
let st = {tasks:{}, dirty:{}, lastPull:null};
let pref = {filter:'all', lastCat:'private', doneOpen:false};
try{ const s=JSON.parse(localStorage.getItem(KEY)); if(s&&s.tasks) st=Object.assign(st,s); }catch(e){}
try{ Object.assign(pref, JSON.parse(localStorage.getItem(PREF))||{}); }catch(e){}

const savePref  = ()=>{ try{ localStorage.setItem(PREF, JSON.stringify(pref)); }catch(e){} };

/* ========== 日付 ========== */
const pad = n=>String(n).padStart(2,'0');
const ymd = d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addDays = (d,n)=>{ const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const today = ()=>ymd(new Date());
const tomorrow = ()=>ymd(addDays(new Date(),1));
const WD = ['日','月','火','水','木','金','土'];
function dueLabel(due){
  if(!due) return '';
  const t=today(), tm=tomorrow();
  if(due===t) return '今日';
  if(due===tm) return '明日';
  const d=new Date(due+'T00:00:00'), now=new Date(t+'T00:00:00');
  const diff=Math.round((d-now)/864e5);
  if(diff>1 && diff<7) return WD[d.getDay()];
  return (d.getMonth()+1)+'/'+d.getDate();
}
const nowIso = ()=>new Date().toISOString();
const newId = ()=> (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2));

/* ========== 描画 ========== */
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function visible(){
  return Object.values(st.tasks).filter(t=>!t.deleted && (pref.filter==='all' || t.cat===pref.filter));
}
function rowHtml(t){
  const lbl=dueLabel(t.due), late=!t.done && t.due && t.due<today();
  const tag = pref.filter==='all' ? `<span class="tg"><span class="ic ${CATS.includes(t.cat)?t.cat:'private'}" role="img" aria-label="${CAT_NAME[t.cat]||''}"></span></span>` : '';
  return `<li class="${t.done?'done':''}" data-id="${esc(t.id)}">
    <button class="ck" data-act="toggle" role="checkbox" aria-checked="${t.done}" aria-label="${esc(t.title)}"><i></i></button>
    <button class="body" data-act="edit"><span class="tt">${esc(t.title)}</span>${tag}<span class="du${late?' late':''}">${esc(lbl)}</span></button>
  </li>`;
}
function render(){
  document.querySelectorAll('#bar .tab').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.f===pref.filter)));
  const t0=today(), t1=tomorrow();
  const all=visible();
  const open=all.filter(t=>!t.done);
  const byDue=(a,b)=>(a.due||'9999').localeCompare(b.due||'9999') || (a.created_at||'').localeCompare(b.created_at||'');
  const groups=[
    ['期限切れ', open.filter(t=>t.due && t.due<t0).sort(byDue), 'late'],
    ['今日',     open.filter(t=>t.due===t0).sort(byDue)],
    ['明日',     open.filter(t=>t.due===t1).sort(byDue)],
    ['この先',   open.filter(t=>t.due && t.due>t1).sort(byDue)],
    ['いつか',   open.filter(t=>!t.due).sort((a,b)=>(a.created_at||'').localeCompare(b.created_at||''))],
  ];
  const done=all.filter(t=>t.done).sort((a,b)=>(b.done_at||'').localeCompare(a.done_at||''));
  let h='';
  for(const [name,items,cls] of groups){
    if(!items.length) continue;
    h+=`<section class="sec"><h2 class="${cls||''}">${name}<span class="n">${items.length}</span></h2><ul>${items.map(rowHtml).join('')}</ul></section>`;
  }
  if(!open.length) h+=`<div class="empty"><span class="ic all"></span>なし</div>`;
  if(done.length){
    h+=`<section class="sec"><button class="more" id="doneBtn" aria-expanded="${pref.doneOpen}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>完了<span class="n">${done.length}</span></button>`
      + (pref.doneOpen?`<ul>${done.map(rowHtml).join('')}</ul>`:'') + `</section>`;
  }
  $('#list').innerHTML=h;
}

/* ========== 変更 ========== */
function put(t){
  t.updated_at=nowIso();
  st.tasks[t.id]=t; st.dirty[t.id]=1; saveLocal(); render(); push();
}
let toastTimer=null, undoFn=null;
function toast(msg, undo){
  $('#toastMsg').textContent=msg; undoFn=undo||null; $('#toastUndo').hidden=!undo;
  $('#toast').classList.add('on'); clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{ $('#toast').classList.remove('on'); undoFn=null; }, 5000);
}
$('#toastUndo').onclick=()=>{ if(undoFn) undoFn(); undoFn=null; $('#toast').classList.remove('on'); };

$('#bar').addEventListener('click',e=>{
  const b=e.target.closest('.tab'); if(!b) return;
  pref.filter=b.dataset.f; savePref(); render();
});
$('#list').addEventListener('click',e=>{
  if(e.target.closest('#doneBtn')){ pref.doneOpen=!pref.doneOpen; savePref(); render(); return; }
  const b=e.target.closest('[data-act]'); if(!b) return;
  const id=b.closest('li').dataset.id, t=st.tasks[id]; if(!t) return;
  if(b.dataset.act==='toggle'){
    const before={done:t.done, done_at:t.done_at};
    t.done=!t.done; t.done_at=t.done?nowIso():null; put(t);
    const again=document.querySelector(`li[data-id="${CSS.escape(id)}"] .ck`); if(again) again.focus();
    if(t.done) toast('完了', ()=>{ const x=st.tasks[id]; x.done=before.done; x.done_at=before.done_at; put(x); });
  } else openSheet(t);
});

/* ========== シート（追加・編集） ========== */
let editing=null, fCat='private', fDue=null, lastFocus=null;
function setCat(c){ fCat=c; document.querySelectorAll('#fCat .tab').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.c===c))); }
function setDue(d){
  fDue=d||null;
  const t0=today(), t1=tomorrow();
  const kind = !fDue ? 'none' : fDue===t0 ? 'today' : fDue===t1 ? 'tomorrow' : 'date';
  document.querySelectorAll('#fDue .chip[data-d]').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.d===kind)));
  $('#dateChip').setAttribute('aria-pressed', String(kind==='date'));
  $('#dateLbl').textContent = kind==='date' ? dueLabel(fDue) : '日付';
  $('#fDate').value = fDue||'';
}
function openSheet(t){
  lastFocus=document.activeElement;
  editing=t||null;
  $('#shTitle').textContent = t ? '編集' : '追加';
  $('#fTitle').value = t ? t.title : '';
  setCat(t ? t.cat : (pref.filter!=='all' ? pref.filter : pref.lastCat));
  setDue(t ? t.due : today());
  $('#fDel').hidden = !t;
  $('#sheet').inert=false; $('#sheet').classList.add('on'); $('#scrim').classList.add('on'); $('#sheet').setAttribute('aria-hidden','false');
  document.querySelectorAll('.wrap,.fab').forEach(x=>x.inert=true);
  updSave();
  setTimeout(()=>$('#fTitle').focus(), t?0:60);
}
function closeSheet(){
  $('#sheet').classList.remove('on'); $('#scrim').classList.remove('on'); $('#sheet').setAttribute('aria-hidden','true');
  document.querySelectorAll('.wrap,.fab').forEach(x=>x.inert=false);
  $('#sheet').inert=true;
  editing=null;
  const back=(lastFocus && document.contains(lastFocus) && lastFocus!==document.body && !$('#sheet').contains(lastFocus)) ? lastFocus : $('#addBtn');
  back.focus();
}
function updSave(){ $('#fSave').disabled = !$('#fTitle').value.trim(); }
$('#fTitle').addEventListener('input',updSave);
$('#fTitle').addEventListener('keydown',e=>{ if(e.key==='Enter' && !e.isComposing){ e.preventDefault(); save(); } });
$('#fCat').addEventListener('click',e=>{ const b=e.target.closest('.tab'); if(b) setCat(b.dataset.c); });
$('#fDue').addEventListener('click',e=>{
  const b=e.target.closest('.chip[data-d]'); if(!b) return;
  setDue({today:today(), tomorrow:tomorrow(), none:null}[b.dataset.d]);
});
$('#dateChip').addEventListener('click',e=>{
  const i=$('#fDate'); if(e.target===i) return;
  e.preventDefault(); try{ i.showPicker(); }catch(_){ i.focus(); i.click(); }
});
$('#fDate').addEventListener('change',e=>setDue(e.target.value||null));
function save(){
  const title=$('#fTitle').value.trim(); if(!title) return;
  if(editing){
    const t=st.tasks[editing.id]; t.title=title; t.cat=fCat; t.due=fDue; put(t);
  } else {
    put({id:newId(), title, cat:fCat, due:fDue, done:false, done_at:null, deleted:false, created_at:nowIso()});
  }
  pref.lastCat=fCat; savePref(); closeSheet();
}
$('#fSave').onclick=save;
$('#fCancel').onclick=closeSheet;
$('#scrim').onclick=closeSheet;
$('#addBtn').onclick=()=>openSheet(null);
$('#fDel').onclick=()=>{
  const t=st.tasks[editing.id]; closeSheet();
  t.deleted=true; put(t);
  toast('削除', ()=>{ const x=st.tasks[t.id]; x.deleted=false; put(x); });
};
document.addEventListener('keydown',e=>{
  if(e.key==='Escape' && !e.isComposing && e.keyCode!==229 && $('#sheet').classList.contains('on')) closeSheet();
  if(e.key==='Tab' && $('#sheet').classList.contains('on')){
    const f=[...$('#sheet').querySelectorAll('button:not([hidden]):not(:disabled),input')].filter(x=>x.offsetParent!==null);
    if(!f.length) return;
    if(e.shiftKey && document.activeElement===f[0]){ e.preventDefault(); f[f.length-1].focus(); }
    else if(!e.shiftKey && document.activeElement===f[f.length-1]){ e.preventDefault(); f[0].focus(); }
  }
});

/* ========== 同期（1件ずつ・新しい編集が勝つ・時刻はサーバーが付ける） ========== */
function setSync(s){ const b=$('#sync'); b.classList.remove('off','busy'); if(s!=='ok') b.classList.add(s);
  b.setAttribute('aria-label', {ok:'同期済み',busy:'同期中',off:'オフライン（あとで送ります）'}[s]); b.title=b.getAttribute('aria-label'); }
const ms = s=>s ? Date.parse(s) : 0;          // 「…Z」と「…+00:00」を同じ物差しで比べる
const toRow = t=>({id:t.id, title:t.title, cat:t.cat, due:t.due||null, done:!!t.done, done_at:t.done_at||null,
  deleted:!!t.deleted, created_at:t.created_at, updated_at:t.updated_at});
const fromRow = r=>({id:r.id, title:r.title, cat:CATS.includes(r.cat)?r.cat:'private', due:r.due, done:!!r.done, done_at:r.done_at,
  deleted:!!r.deleted, created_at:r.created_at||'', updated_at:r.updated_at});
// サーバーの行を手元に取り込む。手元に「まだ送っていない、より新しい編集」があるときだけ手元を残す
function merge(rows){
  let changed=false, touchedEditing=false;
  for(const r of rows){
    const cur=st.tasks[r.id];
    if(cur && st.dirty[r.id] && ms(cur.updated_at)>ms(r.updated_at)) continue;
    if(cur && ms(cur.updated_at)===ms(r.updated_at) && !st.dirty[r.id] && cur.title===r.title && cur.done===!!r.done && cur.deleted===!!r.deleted && cur.cat===r.cat && (cur.due||null)===(r.due||null)) continue;
    st.tasks[r.id]=fromRow(r); delete st.dirty[r.id]; changed=true;
    if(editing && editing.id===r.id) touchedEditing=true;
  }
  if(changed){ saveLocal(); if(!$('#sheet').classList.contains('on')) render(); else pendingRender=true; }
  if(touchedEditing) toast('別の端末で変更あり');
}
let pendingRender=false, busy=false, again=false;
// 取りに行く → 送る、を1本の列で回す（同時に走らせない）
async function sync(){
  if(TEST){ setSync('ok'); return; }
  if(!getSb()){ setSync('off'); return; }
  if(busy){ again=true; return; }
  busy=true; setSync('busy');
  try{
    // 1) 取りに行く：サーバー時刻 server_at で続きから（同時刻を落とさないよう gte・取り込みは何度でも同じ結果）
    for(let page=0; page<20; page++){
      let q=sb.from(TABLE).select('*').eq('owner',OWNER).order('server_at',{ascending:true}).limit(500);
      if(st.lastPull) q=q.gte('server_at', st.lastPull);
      const {data,error}=await q; if(error) throw error;
      if(data.length) merge(data);
      const last=data.length ? data[data.length-1].server_at : null;
      if(last) { const moved = last!==st.lastPull; st.lastPull=last; saveLocal(); if(data.length<500 || !moved) break; } else break;
    }
    // 2) 送る：サーバーは「より新しい編集」だけを通し、今の行を返す
    const ids=Object.keys(st.dirty);
    if(ids.length){
      const sent=ids.map(id=>st.tasks[id]).filter(Boolean).map(toRow);
      const {data,error}=await sb.rpc('tsumitask_put',{rows:sent}); if(error) throw error;
      const sentAt=Object.fromEntries(sent.map(r=>[r.id,r.updated_at]));
      for(const r of data||[]){
        const cur=st.tasks[r.id];
        if(cur && cur.updated_at!==sentAt[r.id]) continue;      // 送っている間にまた変わった → 次の回で送る
        delete st.dirty[r.id];
        if(ms(r.updated_at)!==ms(sentAt[r.id])) merge([r]);       // サーバーの方が新しかった → そちらに合わせる
      }
      saveLocal();
    }
    setSync(Object.keys(st.dirty).length ? 'busy' : 'ok');
  }catch(e){
    setSync('off');
  }finally{
    busy=false;
    if(again){ again=false; setTimeout(sync,0); }
  }
}
function push(){ sync(); }
const _close=closeSheet;
closeSheet=function(){ _close(); if(pendingRender){ pendingRender=false; render(); } };
$('#fCancel').onclick=closeSheet; $('#scrim').onclick=closeSheet;
$('#sync').onclick=()=>sync();

let rtOn=false;
function getSb(){
  if(TEST) return null;
  if(!sb && window.supabase && window.supabase.createClient) sb=supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
  if(sb && !rtOn){
    rtOn=true;
    sb.channel('tsumitask-rt').on('postgres_changes',{event:'*',schema:'public',table:TABLE,filter:'owner=eq.'+OWNER},
      p=>{ if(p.new&&p.new.id) merge([p.new]); }).subscribe();
  }
  return sb;
}
if(!TEST){
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ render(); sync(); } });
  addEventListener('online',sync);
  setInterval(()=>{ if(!document.hidden) sync(); }, 60000);
}

/* 日付が変わったら見出しを付け直す */
let day=today(); setInterval(()=>{ if(today()!==day){ day=today(); render(); if($('#sheet').classList.contains('on')) setDue(fDue); } }, 30000);

render();
if(TEST) setSync('ok'); else { sync(); addEventListener('load',()=>{ if(!sb) sync(); }); }
</script>

<style>
  #tsumikiEdge{position:fixed; top:0; bottom:0; left:0; width:22px; z-index:999;}
  #tsumikiPeek{
    position:fixed; top:50%; left:0; z-index:1001; margin-top:-23px;
    width:46px; height:46px; display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.92);
    -webkit-backdrop-filter:saturate(180%) blur(14px); backdrop-filter:saturate(180%) blur(14px);
    border:1px solid rgba(0,0,0,.06); border-radius:50%;
    box-shadow:0 6px 20px rgba(0,0,0,.18);
    color:#0071e3; font-size:24px; font-weight:600; line-height:1;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Helvetica Neue",Arial,sans-serif;
    transform:translateX(-70px) scale(.8); opacity:0; pointer-events:none;
  }
</style>
<div id="tsumikiEdge"></div>
<div id="tsumikiPeek">‹</div>
<script>
  (function(){
    var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
      || window.navigator.standalone === true;
    var fromTsumiki = false;
    try{
      if(document.referrer){
        var r = new URL(document.referrer);
        fromTsumiki = (r.origin === location.origin);
      }
    }catch(e){}
    if(!(standalone && fromTsumiki)) return;

    var peek = document.getElementById('tsumikiPeek');
    var edge = document.getElementById('tsumikiEdge');

    function goBack(){ location.href = 'index.html'; }

    /* --- 左端エッジスワイプで戻る（iOS純正の戻る操作。見えるボタンは置かない） --- */
    var sx=0, sy=0, prog=0, dragging=false, W=window.innerWidth;
    var TRIGGER = Math.min(120, W*0.32);
    window.addEventListener('resize', function(){ W=window.innerWidth; TRIGGER=Math.min(120, W*0.32); });

    function reset(){
      dragging = false; prog = 0;
      peek.style.transition = 'transform .25s ease, opacity .25s ease';
      peek.style.transform = 'translateX(-70px) scale(.8)';
      peek.style.opacity = 0;
    }
    function start(e){
      var t = e.touches ? e.touches[0] : e;
      if(t.clientX > 26) return;
      sx = t.clientX; sy = t.clientY; prog = 0; dragging = true;
      peek.style.transition = 'none';
    }
    function move(e){
      if(!dragging) return;
      var t = e.touches ? e.touches[0] : e;
      var dx = t.clientX - sx, dy = t.clientY - sy;
      if(Math.abs(dy) > Math.abs(dx) + 12){ reset(); return; }
      if(dx < 0) dx = 0;
      prog = Math.min(dx / TRIGGER, 1);
      peek.style.transform = 'translateX(' + (-70 + prog*82) + 'px) scale(' + (0.8 + prog*0.2) + ')';
      peek.style.opacity = prog;
      if(dx > 6 && e.cancelable) e.preventDefault();
    }
    function end(){
      if(!dragging) return;
      dragging = false;
      if(prog >= 0.999){
        peek.style.transition = 'transform .25s ease, opacity .25s ease';
        peek.style.transform = 'translateX(20px) scale(1.05)';
        peek.style.opacity = 1;
        goBack();
      }else{
        reset();
      }
    }
    edge.addEventListener('touchstart', start, {passive:true});
    window.addEventListener('touchmove', move, {passive:false});
    window.addEventListener('touchend', end, {passive:true});
    window.addEventListener('touchcancel', end, {passive:true});
  })();
</script>
<!-- /tsumiki-back-button -->
