<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="apple-touch-icon" href="icons/icon-kokuchi.png">
<meta name="apple-mobile-web-app-title" content="告知づくり">
<title>告知づくり</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f5f4f0;--surface:#fffefb;--surface-2:#efece5;--ink:#1d1a15;--ink-mid:#5b554a;--ink-soft:#666154;
  --ghost:#887f70;--line:#e2ded4;--line-2:#d8d3c7;--accent:#b06f26;--accent-2:#8a5a24;--accent-wash:#f0e4d1;
  --good-ink:#416845;--warn-wash:#f2e0d4;--warn-ink:#974624;
  /* 画像の中身の色（元の告知画像に合わせた色・画面の配色とは別・ダークでも変えない） */
  --o-blue:#6b8fe3;--o-orange:#e0a25a;--o-pink:#d97aa8;--o-green:#5aa57e;--o-violet:#9b7be3;
  --o-ph-fill:rgba(120,120,140,.08);--o-ph-line:rgba(120,120,140,.45);--o-ph-text:rgba(90,90,110,.7);
  --o-rm-bg:#f4f4f7;--o-rm-dot:#d6d7de;--o-rm-ink:#111114;--o-rm-red:#e0362a;--o-shadow:rgba(0,0,0,.08);--o-img-shadow:rgba(0,0,0,.2);--o-frame:#d4d4da;
  --o-white:#ffffff;--o-rule:#e3e3e8;--o-app-top:#3fe8c7;--o-app-bot:#268cdc;
  --o-warn-bg:#fde9e5;--o-warn-line:#f2b9ae;--o-warn-ink:#d8402e;
  --o-nw-bg1:#f3effd;--o-nw-bg2:#f6f1fb;--o-nw-bg3:#fbeef4;--o-nw-ring:rgba(190,170,225,.18);--o-nw-spark:rgba(185,165,225,.72);
  --o-nw-pill:rgba(255,255,255,.6);--o-nw-violet:#9146d8;--o-nw-ink:#2b2440;--o-nw-violet2:#8e3fd6;--o-nw-shadow:rgba(60,40,90,.22);
  --o-rd-bg1:#ffffff;--o-rd-bg2:#fbfbfe;--o-rd-bg3:#f5f6fb;--o-rd-ink:#1d1d1f;--o-rd-link:#0066cc;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#0f0d07;--surface:#211d14;--surface-2:#2b2619;--ink:#efe8da;--ink-mid:#a89e8b;--ink-soft:#9f988a;
  --ghost:#887f70;--line:#36301f;--line-2:#443d2b;--accent:#d59a4d;--accent-2:#e0ab63;--accent-wash:#362a19;
  --good-ink:#7fae82;--warn-wash:#39251a;--warn-ink:#d9825a;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;
  min-height:100dvh;-webkit-text-size-adjust:100%}
.wrap{max-width:1280px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
h1{font-size:20px;font-weight:700;margin:4px 0 14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.top h1{margin:0}
.help{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border-radius:12px;color:var(--ink-mid);text-decoration:none;font-size:14px}
.help svg{width:20px;height:20px}
.grid{display:grid;gap:16px}
.preview{position:sticky;top:0;z-index:2;background:var(--paper);padding:8px 0}
@media (min-width:900px){.grid{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);align-items:start}
  .preview{top:16px;padding:0}}
.stage{border-radius:12px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.stage canvas{display:block;width:100%;height:auto}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;background:var(--surface-2);border-radius:12px;padding:4px;margin-bottom:8px}
.seg button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;border:0;border-radius:9px;
  background:transparent;color:var(--ink-mid);font:inherit;font-size:14px;font-weight:500;cursor:pointer;padding:6px 4px;line-height:1.3}
.seg button svg{width:20px;height:20px;flex:none}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line-2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:grid;gap:14px}
.f{display:grid;gap:6px;font-size:14px;font-weight:500;color:var(--ink-mid)}
.f small{font-size:13px;font-weight:400;color:var(--ink-soft)}
.f .lb{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
textarea,input[type=text],input[type=url]{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);
  border:1px solid var(--line-2);border-radius:8px;padding:10px 12px;min-height:44px;resize:vertical}
textarea{min-height:120px;line-height:1.5}
.img{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.img .thumb{width:88px;height:50px;border-radius:6px;border:1px solid var(--line-2);background:var(--surface-2) center/contain no-repeat;flex:none}
button.b,label.b{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;border-radius:12px;border:0;
  font:inherit;font-size:15px;font-weight:500;cursor:pointer;padding:10px 14px;background:var(--surface-2);color:var(--ink);overflow:hidden}
button.b svg,label.b svg{width:20px;height:20px;flex:none}
button.main{background:var(--accent-2);color:var(--paper);width:100%}
.img input{position:absolute;inset:0;opacity:0;width:100%;height:100%;font-size:16px;cursor:pointer}
.opt{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:var(--surface-2);border-radius:12px;padding:4px}
.opt button{display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;border:0;border-radius:9px;background:transparent;
  color:var(--ink-mid);font:inherit;font-size:15px;font-weight:500;cursor:pointer}
.opt button svg{width:20px;height:20px;flex:none}
.opt button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line-2)}
.img .thumb.sq{width:50px}
.b:focus-visible,.opt button:focus-visible,textarea:focus-visible,input[type=text]:focus-visible,input[type=url]:focus-visible,.img label.b:has(input:focus-visible){outline:2px solid var(--accent-2);outline-offset:2px}
.row.pair.over{opacity:.55}
.row.pair.over::after{content:'画像に出ません';grid-column:1/-1;font-size:12px;color:var(--ink-soft)}
.rows{display:grid;gap:8px}
.row{display:flex;gap:6px;align-items:center}
.row input{flex:1;min-width:0}
.row.pair{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:6px;align-items:center;padding:8px 4px 8px 8px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.row.pair .two{display:grid;gap:6px}
.rows:has(.pair){gap:10px}
.row .x{width:44px;height:44px;min-height:44px;padding:0;flex:none;background:transparent;color:var(--ink-soft)}
.add[hidden]{display:none}
.add{justify-self:start;background:transparent;color:var(--accent-2);padding:10px 4px}
.note{font-size:14px;color:var(--warn-ink);margin:0;line-height:1.5}
.note.ok{color:var(--good-ink)}
.note:empty{display:none}
.hint{font-size:13px;color:var(--ink-soft);margin:8px 2px 0}
@media (max-width:899px){.hint{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>告知づくり</h1><a class="help" href="kokuchi-tsukaikata.html" aria-label="使い方"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12a10 10 0 1 0 20 0a10 10 0 1 0-20 0"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>使い方</a></div>
  <div class="seg" id="seg" role="group" aria-label="型"></div>
  <div class="grid">
    <div class="preview">
      <div class="stage"><canvas id="cv" width="3840" height="2160" aria-label="できあがり"></canvas></div>
      <p class="hint">画像は ⌘V・ドロップでも入れられます</p>
    </div>
    <div class="card" id="form"></div>
  </div>
</div>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
const W=1920,H=1080,SC=2;
const FONT='-apple-system,"SF Pro Display","Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif';
const f=(w,px)=>`${w} ${px}px ${FONT}`;
/* 画像の中身の色（:root の --o-* から読む） */
const CS=getComputedStyle(document.documentElement);
const C=n=>CS.getPropertyValue('--o-'+n).trim();

/* ---------- 線画アイコン（24の升目） ---------- */
const IC={
  book:['M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z','M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z'],
  bulb:['M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5','M9 18h6','M10 22h4'],
  pencil:['M21.2 6.8a2.8 2.8 0 0 0-4-4L3.8 16.2a2 2 0 0 0-.5.8L2 21.4a.5.5 0 0 0 .6.6l4.4-1.3a2 2 0 0 0 .8-.5z','M15 5l4 4'],
  check:['M2 12a10 10 0 1 0 20 0a10 10 0 1 0-20 0','M9 12l2 2 4-4'],
  cal:['M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z','M16 2v4','M8 2v4','M3 10h18','M7 14h10','M7 18h6'],
  play:['M2 12a10 10 0 1 0 20 0a10 10 0 1 0-20 0','M10 8l6 4-6 4z'],
  msg:['M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z'],
  star:['M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z'],
  cap:['M22 10v6','M2 10l10-5 10 5-10 5z','M6 12v5c3 3 9 3 12 0v-5'],
  photo:['M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z','M7 9a2 2 0 1 0 4 0a2 2 0 1 0-4 0','M21 15l-3.1-3.1a2 2 0 0 0-2.8 0L6 21'],
  ipad:['M6 2h12a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z','M12 18h.01'],
  x:['M18 6L6 18','M6 6l12 12'],
  warn:['M10.3 3.9a2 2 0 0 1 3.4 0l8.2 14.2a2 2 0 0 1-1.7 3H3.8a2 2 0 0 1-1.7-3z','M12 9.5v4.5','M12 17.6v.1'],
  alignL:['M4 6h16','M4 12h10','M4 18h13'],
  alignC:['M4 6h16','M7 12h10','M5.5 18h13'],
  alignR:['M4 6h16','M10 12h10','M7 18h13'],
  plus:['M12 5v14','M5 12h14'],
  app:['M7 3h10a4 4 0 0 1 4 4v10a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V7a4 4 0 0 1 4-4z'],
  save:['M12 3v12','M7 10l5 5 5-5','M5 21h14'],
};
const P2={};for(const k in IC)P2[k]=IC[k].map(d=>new Path2D(d));
function icon(name,x,y,size,color,lw=1.8){
  ctx.save();ctx.translate(x,y);ctx.scale(size/24,size/24);
  ctx.strokeStyle=color;ctx.lineWidth=lw;ctx.lineCap='round';ctx.lineJoin='round';
  for(const p of P2[name])ctx.stroke(p);ctx.restore();
}
const ROW=[['book','blue'],['bulb','orange'],['pencil','pink'],['check','green'],['cal','blue'],['play','violet'],['msg','orange'],['star','pink'],['cap','green']];
function iconRow(y,alpha=1){
  ctx.save();ctx.globalAlpha=alpha;
  const n=ROW.length,step=210,x0=W/2-step*(n-1)/2,sz=96;
  ROW.forEach(([k,c],i)=>icon(k,x0+i*step-sz/2,y-sz/2,sz,C(c),2));
  ctx.restore();
}

/* ---------- 共通の描画部品 ---------- */
let warns=[]; // 描いたときに入りきらなかったもの
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function fitImg(img,x,y,w,h){
  const s=Math.min(w/img.width,h/img.height),dw=img.width*s,dh=img.height*s;
  return {x:x+(w-dw)/2,y:y+(h-dh)/2,w:dw,h:dh};
}
function placeholder(x,y,w,h,text){
  ctx.save();rr(x,y,w,h,18);ctx.fillStyle=C('ph-fill');ctx.fill();
  ctx.setLineDash([14,10]);ctx.lineWidth=3;ctx.strokeStyle=C('ph-line');ctx.stroke();
  ctx.setLineDash([]);ctx.fillStyle=C('ph-text');ctx.font=f(500,36);ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(text,x+w/2,y+h/2);ctx.restore();
}
/* 幅に入るまで字を小さくする。最小でも入らなければ warn に名前を積む */
function fitText(t,weight,px,maxW,min,label){
  let s=px;ctx.font=f(weight,s);
  while(s>min&&ctx.measureText(t).width>maxW){s-=2;ctx.font=f(weight,s)}
  if(label&&ctx.measureText(t).width>maxW+1)warns.push(`${label}が長くて入りきりません`);
  return s;
}
/* 入りきらない分は … で切って描く */
function clipText(t,maxW){
  if(ctx.measureText(t).width<=maxW)return t;
  while(t.length>1&&ctx.measureText(t+'…').width>maxW)t=t.slice(0,-1);
  return t+'…';
}
/* 新しい研修の注意の札：右端 1814 にそろえ、研修の画面にかからない幅まで（count=true のときだけ入りきらない知らせを積む） */
function warnBox(w,count){
  const wt=(w||'').trim();if(!wt)return null;
  const maxTW=1814-1040-130;
  const sz=fitText(wt,700,36,maxTW,24,count?'注意':null);const t=clipText(wt,maxTW);const tw=ctx.measureText(t).width;
  const pw=tw+130;return {x:1814-pw,y:662,w:pw,t,sz};
}
/* アプリのアイコン：正方形に切り抜き（真ん中を使う）、角を丸め、影を付ける */
function appIcon(im,x,y,a){
  const r=a*.24;
  ctx.save();ctx.shadowColor=C('img-shadow');ctx.shadowBlur=40;ctx.shadowOffsetY=12;rr(x,y,a,a,r);ctx.fillStyle=C('white');ctx.fill();ctx.restore();
  const m=Math.min(im.width,im.height);
  ctx.save();rr(x,y,a,a,r);ctx.clip();ctx.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,x,y,a,a);ctx.restore();
}
function sparkle(cx,cy,r,color,lw){
  ctx.save();ctx.strokeStyle=color;ctx.lineWidth=lw;ctx.lineJoin='round';ctx.beginPath();
  ctx.moveTo(cx,cy-r);ctx.quadraticCurveTo(cx,cy,cx+r,cy);ctx.quadraticCurveTo(cx,cy,cx,cy+r);
  ctx.quadraticCurveTo(cx,cy,cx-r,cy);ctx.quadraticCurveTo(cx,cy,cx,cy-r);ctx.stroke();ctx.restore();
}

/* ---------- 型（ここに足せば型が増える） ----------
   fields の並び＝入力欄の並び。kind: 'img'（画像）/ 'area'（複数行）/ なし（1行） */
const TYPES={
  roadmap:{
    name:'新しい研修',icon:'cap',
    fields:[
      {k:'img',label:'研修の画面',kind:'img'},
      {k:'t1',label:'見出し',def:'Learning Roadmap'},
      {k:'t2',label:'見出し2',hint:'赤',def:'Product Zone'},
      {k:'title',label:'研修名',hint:'空なら出しません',def:'サンプル研修\n基礎編',kind:'area',rows:3},
      {k:'talign',label:'研修名の揃え',kind:'choice',def:'left',opts:[['left','左','alignL'],['center','中央','alignC'],['right','右','alignR']]},
      {k:'date',label:'締切',def:'11/30'},
      {k:'apps',label:'アプリのアイコン',hint:'2つまで・空なら見本',kind:'imgs',slots:['app1','app2']},
      {k:'warn',label:'注意',hint:'空なら出しません',def:'契約用iPadじゃないとできません！'},
    ],
    draw(s,img,gi){
      ctx.fillStyle=C('rm-bg');ctx.fillRect(0,0,W,H);
      ctx.fillStyle=C('rm-dot');
      for(let y=20;y<H;y+=40)for(let x=20;x<W;x+=40){ctx.beginPath();ctx.arc(x,y,2,0,7);ctx.fill()}
      ctx.textBaseline='alphabetic';ctx.textAlign='left';
      ctx.fillStyle=C('rm-ink');const s1=fitText(s.t1,800,92,880,48,'見出し');ctx.fillText(clipText(s.t1,880),124,196);
      ctx.fillStyle=C('rm-red');fitText(s.t2,500,Math.min(92,s1+4),880,48,'見出し2');ctx.fillText(clipText(s.t2,880),124,292);
      // 研修の画面（枠の上に寄せる）
      // 研修名との間を空けるため幅は870で固定（研修名を入れ消ししても画像の大きさが変わらない）。画像は枠の左上に寄せる
      const bx=122,by=352,bw=870,bh=482;
      if(img){const r=fitImg(img,bx,by,bw,bh);r.x=bx;r.y=by;ctx.save();ctx.shadowColor=C('img-shadow');ctx.shadowBlur=40;ctx.shadowOffsetY=12;
        ctx.drawImage(img,r.x,r.y,r.w,r.h);ctx.restore();ctx.strokeStyle=C('frame');ctx.lineWidth=2;ctx.strokeRect(r.x,r.y,r.w,r.h)}
      else placeholder(bx,by,bw,bh,'研修の画面');
      // アプリのアイコン：0〜1つは札の右に216角。2つのときは176角を2つ並べ、札を細くして高さの真ん中をそろえる
      const apps=['app1','app2'].map(gi).filter(Boolean);
      const two=apps.length===2,as=two?176:216,gap=20;
      const ax=two?1814-as*2-gap:1596,ay=two?106+(218-as)/2:108;
      const pw0=two?ax-36-1036:518;
      // 締切の札
      ctx.save();ctx.shadowColor=C('shadow');ctx.shadowBlur=30;ctx.shadowOffsetY=8;
      rr(1036,106,pw0,218,36);ctx.fillStyle=C('white');ctx.fill();ctx.restore();
      icon('cal',1082,142,56,C('orange'),1.9);
      {const l=two?1150:1110,r=1036+pw0-(two?28:66),dw=r-l,dc=two?(l+r)/2:1300,mw=two?dw:380;
        ctx.fillStyle=C('rm-ink');ctx.textAlign='center';fitText(s.date,400,90,mw,40,'締切');ctx.fillText(clipText(s.date,mw),dc,243);}
      ctx.fillStyle=C('rule');rr(1076,290,pw0-80,4,2);ctx.fill();
      if(!apps.length){
        // 見本のアイコン（輪は下ほど白くならないよう控えめに）
        ctx.save();ctx.shadowColor=C('shadow');ctx.shadowBlur=30;ctx.shadowOffsetY=8;
        const g=ctx.createLinearGradient(ax,ay,ax,ay+as);g.addColorStop(0,C('app-top'));g.addColorStop(1,C('app-bot'));
        rr(ax,ay,as,as,as*.24);ctx.fillStyle=g;ctx.fill();ctx.restore();
        ctx.save();rr(ax,ay,as,as,as*.24);ctx.clip();ctx.fillStyle=C('white');
        [[100,.12],[80,.2],[60,.38],[40,1]].forEach(([r,a],i)=>{ctx.globalAlpha=a;ctx.beginPath();ctx.arc(ax+as/2,ay+as/2+10+i*6,r,0,7);ctx.fill()});
        ctx.restore();
      }else apps.forEach((im,i)=>appIcon(im,ax+i*(as+gap),ay,as));
      // 研修名（研修の画面の右・締切の札の下と注意の札の上のあいだの真ん中）
      // 折り返しは語のまとまりで。行頭に句読点・閉じ括弧を置かず、行末に開き括弧を残さない
      const tsrc=(s.title||'').split('\n').map(x=>x.trim()).filter(Boolean);
      if(tsrc.length){
        const tx=1036,tmw=1814-1036-40,TW=700;
        const al=['left','center','right'].includes(s.talign)?s.talign:'left';
        const NOHEAD='、。，．,.）)」』】〕〉》］｝]}ー～〜！？!?‼⁉：:；;・…゛゜ぁぃぅぇぉっゃゅょゎァィゥェォッャュョヮ々';
        const NOTAIL='（(「『【〔〈《［｛[{“';
        const seg=t=>{try{if(window.Intl&&Intl.Segmenter)return [...new Intl.Segmenter('ja',{granularity:'word'}).segment(t)].map(x=>x.segment)}catch(e){}
          return t.match(/[A-Za-z0-9]+|\s+|./gu)||[]};
        const wrap=sz=>{ctx.font=f(TW,sz);const out=[];
          for(const l of tsrc){
            let cur='';
            const push=()=>{if(cur.trim())out.push(cur.trim());cur=''};
            for(let tok of seg(l)){
              if(ctx.measureText(cur+tok).width<=tmw||!cur.trim()){
                // 1語だけで幅を超えるときは字で割る
                if(!cur.trim()&&ctx.measureText(tok).width>tmw){for(const ch of tok){if(cur&&ctx.measureText(cur+ch).width>tmw)push();cur+=ch}}
                else cur+=tok;
                continue;
              }
              // 行頭禁則：2字まで・右の余裕40pxに収まるならこの行にぶら下げる。
              // 収まらなければ、この行の最後の1字を次の行へ送って一緒に始める（追い出し）
              let hang='';while(hang.length<tok.length&&NOHEAD.includes(tok[hang.length]))hang+=tok[hang.length];
              if(hang){
                if(hang.length<=2&&ctx.measureText(cur+hang).width<=tmw+40){cur+=hang;tok=tok.slice(hang.length);if(!tok)continue}
                else if(cur.length>1){
                  // ぶら下げた記号もいっしょに、記号でない字までさかのぼって送る
                  const cs=[...cur];let mv='';while(cs.length>1){const c=cs.pop();mv=c+mv;if(!NOHEAD.includes(c))break}
                  cur=cs.join('');push();cur=mv+tok;
                  if(ctx.measureText(cur).width>tmw){const t2=cur;cur='';for(const ch of t2){if(cur&&ctx.measureText(cur+ch).width>tmw)push();cur+=ch}}
                  continue}
              }
              // 行末禁則：開き括弧は次の行へ送る
              let carry='';while(cur.length>1&&NOTAIL.includes(cur[cur.length-1])){carry=cur[cur.length-1]+carry;cur=cur.slice(0,-1)}
              push();cur=carry+tok;
              if(ctx.measureText(cur).width>tmw){const t2=cur;cur='';for(const ch of t2){if(cur&&ctx.measureText(cur+ch).width>tmw)push();cur+=ch}}
            }
            push();
          }
          return out};
        // 64px から 48px まで縮めて3行に。だめなら 4行まで（44pxまで）
        let tp=64,tl=wrap(tp);

        const LH=tp*1.22,blockH=tp*.92+LH*(tl.length-1);
        const top=324,bottom=s.warn.trim()?662:834;
        const y0=top+(bottom-top-blockH)/2+tp*.92;

        // ※ warnBox は字の大きさを変えるので、先に測ってから研修名の字にする
        const wb=warnBox(s.warn),cx=wb?wb.x+wb.w/2:(1036+1814)/2,rx=1814;
        ctx.font=f(TW,tp);ctx.fillStyle=C('rm-ink');ctx.textAlign='left';ctx.textBaseline='alphabetic';
        const mw=Math.max(...tl.map(l=>ctx.measureText(l).width));
        const ccx=(cx-mw/2>=1036&&cx+mw/2<=1814)?cx:(1036+1814)/2; // 注意が短くて札の真ん中に置けないときは列の真ん中
        tl.forEach((l,k)=>{const w=ctx.measureText(l).width;
          let x=al==='center'?ccx-w/2:al==='right'?rx-w:tx;x=Math.max(1036,Math.min(1814-w,x));
          ctx.fillText(l,x,y0+k*LH)});

      if(wb){

/* ---------- 状態（この端末の中だけに保存） ---------- */
const KEY='kokuchi.v1';
let st={type:'roadmap',v:{}};
try{const o=JSON.parse(localStorage.getItem(KEY)||'null');
  if(o&&TYPES[o.type])st.type=o.type;
  if(o&&o.v&&typeof o.v==='object')st.v=o.v;
}catch(e){}
{const q=new URLSearchParams(location.search).get('type');if(q&&TYPES[q])st.type=q}
for(const t in TYPES){if(!st.v[t]||typeof st.v[t]!=='object')st.v[t]={};
  for(const fd of TYPES[t].fields)if(fd.kind!=='img'&&fd.kind!=='imgs'&&(typeof st.v[t][fd.k]!=='string'||(fd.opts&&!fd.opts.some(o=>o[0]===st.v[t][fd.k]))))st.v[t][fd.k]=fd.def}
/* 研修とリンクの文字列を「題名とURLの組」に分ける。昔の自由に書いた形も落とさない：
   空行で区切る／URLが2つ目なら次の件／URLのあとに題名が来たら次の件／題名が2行なら空白でつなぐ */
const isUrl=x=>/^https?:\/\//i.test(x);
function parseLinks(str){
  const out=[];let cur=null;
  for(const raw of String(str).split('\n')){const x=raw.trim();
    if(!x){cur=null;continue}
    if(!cur||cur.u){cur={t:'',u:''};out.push(cur)}
    if(isUrl(x))cur.u=x;else cur.t=cur.t?cur.t+' '+x:x;
  }
  return out;
}
const imgs={}; // 画像（保存は別キー）。名前は 型（主の画像）か 型.欄（アプリのアイコンなど）
const ik=(t,k)=>k&&k!=='img'?t+'.'+k:t;
const slotsOf=t=>TYPES[t].fields.flatMap(fd=>fd.kind==='img'?[fd.k]:fd.kind==='imgs'?fd.slots:[]);
function save(){try{localStorage.setItem(KEY,JSON.stringify(st));return true}catch(e){say('入力を覚えておけません（容量がいっぱい）。画像を外すと空きます');return false}}
function saveImg(key,data){
  try{if(data)localStorage.setItem(KEY+'.img.'+key,data);else localStorage.removeItem(KEY+'.img.'+key);return true}
  catch(e){return false} // 失敗しても前に覚えた画像は消さない
}
function loadImgs(){return Promise.all(Object.keys(TYPES).flatMap(t=>slotsOf(t).map(k=>ik(t,k))).map(key=>new Promise(r=>{
  let d=null;try{d=localStorage.getItem(KEY+'.img.'+key)}catch(e){}
  if(!d)return r();const im=new Image();im.onload=()=>{imgs[key]=im;r()};im.onerror=()=>r();im.src=d})))}

/* 保存ボタンの上に出すひとこと（一時の知らせ）と、入りきらない知らせ */
let msg='',msgOk=false;
function say(t,ok=false){msg=t||'';msgOk=ok;showNote()}
function showNote(){const n=$('note');if(!n)return;
  const t=msg||warns.join('／');n.textContent=t;n.classList.toggle('ok',!!msg&&msgOk)}

/* ---------- 画面 ---------- */
function svgIcon(name){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[name].map(d=>`<path d="${d}"/>`).join('')}</svg>`}
function buildSeg(){
  $('seg').innerHTML=Object.entries(TYPES).map(([k,t])=>`<button type="button" data-t="${k}" aria-pressed="${k===st.type}">${svgIcon(t.icon)}${t.name}</button>`).join('');
  $('seg').querySelectorAll('button').forEach(b=>b.onclick=()=>{st.type=b.dataset.t;save();say('');buildSeg();buildForm();draw()});
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function buildForm(){
  const t=TYPES[st.type],v=st.v[st.type];
  const lb=fd=>`<span class="lb">${fd.label}${fd.hint?`<small>${fd.hint}</small>`:''}</span>`;
  const slot=(k,sq,nm)=>`<div class="img"><div class="thumb${sq?' sq':''}" data-th="${k}"></div>
        <label class="b">${svgIcon('photo')}選ぶ<input type="file" accept="image/*" data-file="${k}" aria-label="${nm}を選ぶ"></label>
        <button type="button" class="b" data-clr="${k}" aria-label="${nm}を外す">${svgIcon('x')}外す</button></div>`;
  let h='';
  for(const fd of t.fields){
    if(fd.kind==='img'){
      h+=`<div class="f">${lb(fd)}${slot(fd.k,false,fd.label)}</div>`;
    }else if(fd.kind==='imgs'){
      h+=`<div class="f">${lb(fd)}<div class="rows">${fd.slots.map((k,i)=>slot(k,true,fd.label+(i+1))).join('')}</div></div>`;
    }else if(fd.kind==='choice'){
      h+=`<div class="f">${lb(fd)}<div class="opt" role="group" aria-label="${fd.label}">${fd.opts.map(([val,name,ic])=>
        `<button type="button" data-c="${fd.k}" data-v="${val}" aria-pressed="${(v[fd.k]||fd.def)===val}">${svgIcon(ic)}${name}</button>`).join('')}</div></div>`;
    }else if(fd.kind==='pairs'||fd.kind==='list'){
      h+=`<div class="f">${lb(fd)}<div class="rows" data-rows="${fd.k}"></div>
        <button type="button" class="b add" data-add="${fd.k}">${svgIcon('plus')}追加</button></div>`;
    }else if(fd.kind==='area'){
      h+=`<label class="f">${lb(fd)}<textarea data-k="${fd.k}" rows="${fd.rows||4}">${esc(v[fd.k])}</textarea></label>`;
    }else{
      h+=`<label class="f">${lb(fd)}<input type="text" data-k="${fd.k}" value="${esc(v[fd.k])}"></label>`;
    }
  }
  h+=`<p class="note" id="note" role="status"></p><button type="button" class="b main" id="save">${svgIcon('save')}画像を保存</button>`;
  $('form').innerHTML=h;
  $('form').querySelectorAll('[data-k]').forEach(el=>el.oninput=()=>{v[el.dataset.k]=el.value;save();if(msgOk)msg='';draw()});
  $('form').querySelectorAll('[data-file]').forEach(fi=>fi.onchange=()=>{if(fi.files[0])takeFile(fi.files[0],fi.dataset.file);fi.value=''});
  $('form').querySelectorAll('[data-clr]').forEach(c=>c.onclick=()=>{const key=ik(st.type,c.dataset.clr);delete imgs[key];saveImg(key,null);say('');thumb();draw()});
  $('form').querySelectorAll('[data-c]').forEach(bt=>bt.onclick=()=>{v[bt.dataset.c]=bt.dataset.v;save();
    $('form').querySelectorAll(`[data-c="${bt.dataset.c}"]`).forEach(x=>x.setAttribute('aria-pressed',x===bt));draw()});
  for(const fd of t.fields)if(fd.kind==='pairs'||fd.kind==='list')rowsUI(fd,v);
  $('save').onclick=doSave;
  thumb();showNote();
}
/* 1件ずつの入力欄。保存は今までどおり1つの文字列（list＝1行に1人／pairs＝題名とURLの2行を空行で区切る） */
const rowsMem={}; // 打ちかけの空の行も消さずに見せるため、画面の行は別に覚えておく
function rowsUI(fd,v){
  const box=document.querySelector(`[data-rows="${fd.k}"]`),add=document.querySelector(`[data-add="${fd.k}"]`);
  const id=st.type+'.'+fd.k;
  if(!rowsMem[id]){
    if(fd.kind==='list')rowsMem[id]=v[fd.k].split('\n').map(x=>x.trim()).filter(Boolean);
    else rowsMem[id]=parseLinks(v[fd.k]);
    if(!rowsMem[id].length)rowsMem[id].push(fd.kind==='list'?'':{t:'',u:''});
  }
  const rows=rowsMem[id];
  const store=()=>{
    v[fd.k]=fd.kind==='list'?rows.map(x=>x.trim()).filter(Boolean).join('\n')
      :rows.filter(r=>r.t.trim()||r.u.trim()).map(r=>[r.t.trim(),r.u.trim()].filter(Boolean).join('\n')).join('\n\n');
    save();if(msgOk)msg='';draw()};
  const xb=i=>`<button type="button" class="b x" data-del="${i}" aria-label="${fd.kind==='list'?fd.label:'研修'}${i+1}を消す">${svgIcon('x')}</button>`;
  const paint=()=>{
    box.innerHTML=rows.map((r,i)=>fd.kind==='list'
      ?`<div class="row"><input type="text" data-i="${i}" value="${esc(r)}" aria-label="${fd.label}${i+1}">${xb(i)}</div>`
      :`<div class="row pair${fd.max&&i>=fd.max?' over':''}"><div class="two"><input type="text" data-i="${i}" data-p="t" value="${esc(r.t)}" placeholder="題名" aria-label="題名${i+1}">
        <input type="url" inputmode="url" data-i="${i}" data-p="u" value="${esc(r.u)}" placeholder="URL" aria-label="URL${i+1}"></div>${xb(i)}</div>`).join('');
    box.querySelectorAll('input').forEach(el=>el.oninput=()=>{const i=+el.dataset.i;
      if(fd.kind==='list')rows[i]=el.value;else rows[i][el.dataset.p]=el.value;store()});
    box.querySelectorAll('[data-del]').forEach(bt=>bt.onclick=()=>{rows.splice(+bt.dataset.del,1);
      if(!rows.length)rows.push(fd.kind==='list'?'':{t:'',u:''});paint();store()});
    add.hidden=!!fd.max&&rows.length>=fd.max;
  };
  add.onclick=()=>{if(fd.max&&rows.length>=fd.max)return;rows.push(fd.kind==='list'?'':{t:'',u:''});paint();
    const ins=box.querySelectorAll('input');const last=fd.kind==='list'?ins[ins.length-1]:ins[ins.length-2];if(last)last.focus()};
  paint();
}
function thumb(){document.querySelectorAll('[data-th]').forEach(th=>{const im=imgs[ik(st.type,th.dataset.th)];th.style.backgroundImage=im?`url(${im.src})`:'none'})}

function takeFile(file,slot){
  if(!file)return;
  if(file.type&&!/^image\//.test(file.type)){say('画像のファイルを選んでください');return}
  const t=ik(st.type,slot);const url=URL.createObjectURL(file);const im=new Image();
  im.onload=()=>{ // 長い辺 2400px までに縮めて覚える。透けている所は白にする
    const m=2400,s=Math.min(1,m/Math.max(im.width,im.height));
    const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));
    const x=c.getContext('2d');x.fillStyle=C('white');x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
    URL.revokeObjectURL(url);
    const data=c.toDataURL('image/jpeg',0.9);c.width=c.height=0;
    const im2=new Image();im2.onload=()=>{
      imgs[t]=im2;
      if(saveImg(t,data))say('');else say('画像が大きくて覚えておけません。今は使えますが、開き直すと前の画像に戻ります');
      thumb();draw()};
    im2.src=data;
  };
  im.onerror=()=>{URL.revokeObjectURL(url);say('この画像は読めませんでした')};
  im.src=url;
}
document.addEventListener('paste',e=>{
  for(const it of (e.clipboardData||{}).items||[])if(it.kind==='file'&&/^image\//.test(it.type)){takeFile(it.getAsFile());e.preventDefault();return}
});
const hasFiles=e=>e.dataTransfer&&[...e.dataTransfer.types].includes('Files');
document.addEventListener('dragover',e=>{if(hasFiles(e))e.preventDefault()});
document.addEventListener('drop',e=>{if(!hasFiles(e))return;e.preventDefault();const fl=e.dataTransfer.files[0];
  // 画像の欄の上に落としたらその欄へ（アプリのアイコンなど）。ほかは主の画像へ
  const box=e.target.closest&&e.target.closest('.img'),fi=box&&box.querySelector('[data-file]');if(fl)takeFile(fl,fi?fi.dataset.file:'img')});

/* ---------- 描く ---------- */
let blob=null,blobVer=-1,ver=0,timer=0;
function draw(){
  warns=[];
  ctx.setTransform(SC,0,0,SC,0,0);ctx.clearRect(0,0,W,H);ctx.globalAlpha=1;
  try{TYPES[st.type].draw(st.v[st.type],imgs[st.type]||null,k=>imgs[ik(st.type,k)]||null)}catch(e){warns.push('描けませんでした：'+e.message)}
  showNote();
  ver++;blob=null;clearTimeout(timer);const my=ver;
  if(imgs[st.type])timer=setTimeout(()=>cv.toBlob(b=>{if(my===ver){blob=b;blobVer=my}},'image/png'),400);
}
const isMobile=()=>/iPhone|iPad|Android/.test(navigator.userAgent)||(/Macintosh/.test(navigator.userAgent)&&navigator.maxTouchPoints>1);
let saving=false;
async function doSave(){
  if(saving)return;
  if(!imgs[st.type]){say(`${TYPES[st.type].fields.find(x=>x.kind==='img').label}が入っていません`);return}
  saving=true;
  try{
    const my=ver;const ready=!!blob&&blobVer===my;
    const b=ready?blob:await new Promise(r=>cv.toBlob(r,'image/png'));
    if(!b){say('保存できませんでした');return}
    const d=new Date(),p=n=>String(n).padStart(2,'0');
    const name=`告知_${TYPES[st.type].name}_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}.png`;
    const file=new File([b],name,{type:'image/png'});
    if(isMobile()&&navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file]});say('共有の画面を閉じました。「画像を保存」を選んでいれば写真に入っています',true);return}
      catch(e){
        if(e.name==='AbortError')return;
        if(!ready&&ver===my){blob=b;blobVer=my;say('用意できました。もう一度「画像を保存」を押してください');return}
      }
    }
    const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    say(`保存しました（${name}）`,true);
  }finally{saving=false}
}

buildSeg();buildForm();draw();
loadImgs().then(()=>{thumb();draw()});
(document.fonts&&document.fonts.ready||Promise.resolve()).then(draw);
})();
</script>
<!-- tsumiki-back-button -->
<style>
  #tsumikiEdge{position:fixed; top:0; bottom:0; left:0; width:22px; z-index:999;}
  #tsumikiPeek{
    position:fixed; top:50%; left:0; z-index:1001; margin-top:-23px;
    width:46px; height:46px; display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.92);
    -webkit-backdrop-filter:saturate(180%) blur(14px); backdrop-filter:saturate(180%) blur(14px);
    border:1px solid rgba(0,0,0,.06); border-radius:50%;
    box-shadow:0 6px 20px rgba(0,0,0,.18);
    color:#0071e3; font-size:24px; font-weight:600; line-height:1;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Helvetica Neue",Arial,sans-serif;
    transform:translateX(-70px) scale(.8); opacity:0; pointer-events:none;
  }
</style>
<div id="tsumikiEdge"></div>
<div id="tsumikiPeek">‹</div>
<script>
  (function(){
    var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
      || window.navigator.standalone === true;
    var fromTsumiki = false;
    try{
      if(document.referrer){
        var r = new URL(document.referrer);
        fromTsumiki = (r.origin === location.origin);
      }
    }catch(e){}
    if(!(standalone && fromTsumiki)) return;

    var peek = document.getElementById('tsumikiPeek');
    var edge = document.getElementById('tsumikiEdge');

    function goBack(){ location.href = 'index.html'; }

    /* --- 左端エッジスワイプで戻る（iOS純正の戻る操作。見えるボタンは置かない） --- */
    var sx=0, sy=0, prog=0, dragging=false, W=window.innerWidth;
    var TRIGGER = Math.min(120, W*0.32);
    window.addEventListener('resize', function(){ W=window.innerWidth; TRIGGER=Math.min(120, W*0.32); });

    function reset(){
      dragging = false; prog = 0;
      peek.style.transition = 'transform .25s ease, opacity .25s ease';
      peek.style.transform = 'translateX(-70px) scale(.8)';
      peek.style.opacity = 0;
    }
    function start(e){
      var t = e.touches ? e.touches[0] : e;
      if(t.clientX > 26) return;
      sx = t.clientX; sy = t.clientY; prog = 0; dragging = true;
      peek.style.transition = 'none';
    }
    function move(e){
      if(!dragging) return;
      var t = e.touches ? e.touches[0] : e;
      var dx = t.clientX - sx, dy = t.clientY - sy;
      if(Math.abs(dy) > Math.abs(dx) + 12){ reset(); return; }
      if(dx < 0) dx = 0;
      prog = Math.min(dx / TRIGGER, 1);
      peek.style.transform = 'translateX(' + (-70 + prog*82) + 'px) scale(' + (0.8 + prog*0.2) + ')';
      peek.style.opacity = prog;
      if(dx > 6 && e.cancelable) e.preventDefault();
    }
    function end(){
      if(!dragging) return;
      dragging = false;
      if(prog >= 0.999){
        peek.style.transition = 'transform .25s ease, opacity .25s ease';
        peek.style.transform = 'translateX(20px) scale(1.05)';
        peek.style.opacity = 1;
        goBack();
      }else{
        reset();
      }
    }
    edge.addEventListener('touchstart', start, {passive:true});
    window.addEventListener('touchmove', move, {passive:false});
    window.addEventListener('touchend', end, {passive:true});
    window.addEventListener('touchcancel', end, {passive:true});
  })();
</script>
<!-- /tsumiki-back-button -->
