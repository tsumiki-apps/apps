<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="apple-touch-icon" href="icons/icon-kokuchi.png">
<meta name="apple-mobile-web-app-title" content="告知づくり">
<title>告知づくり</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f5f4f0;--surface:#fffefb;--surface-2:#efece5;--ink:#1d1a15;--ink-mid:#5b554a;--ink-soft:#666154;
  --ghost:#887f70;--line:#e2ded4;--line-2:#d8d3c7;--accent:#b06f26;--accent-2:#8a5a24;--accent-wash:#f0e4d1;
  --warn-wash:#f2e0d4;--warn-ink:#974624;
  /* 画像の中身の色（元の告知画像に合わせた色・画面の配色とは別） */
  --o1:#6b8fe3;--o2:#e0a25a;--o3:#d97aa8;--o4:#5aa57e;--o5:#9b7be3;--o6:rgba(120,120,140,.08);--o7:rgba(120,120,140,.45);--o8:rgba(90,90,110,.7);--o9:#f4f4f7;--o10:#cfd0d8;--o11:#111114;--o12:#e0362a;--o13:rgba(0,0,0,.08);--o14:#d4d4da;--o15:rgba(0,0,0,.07);--o16:#ffffff;--o17:#e3e3e8;--o18:#74e6c6;--o19:#3d84e0;--o20:rgba(255,255,255,${a});--o21:#fde9e5;--o22:#f2b9ae;--o23:#d8402e;--o24:#f7f3fc;--o25:#f6f1fb;--o26:#fcecf2;--o27:rgba(190,170,225,.18);--o28:rgba(185,165,225,.7);--o29:rgba(185,165,225,.75);--o30:rgba(185,165,225,.6);--o31:rgba(255,255,255,.6);--o32:#9146d8;--o33:#2b2440;--o34:#8e3fd6;--o35:rgba(60,40,90,.22);--o36:#fff;--o37:#fbfbfe;--o38:#eceffa;--o39:#1d1d1f;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#0f0d07;--surface:#211d14;--surface-2:#2b2619;--ink:#efe8da;--ink-mid:#a89e8b;--ink-soft:#9f988a;
  --ghost:#887f70;--line:#36301f;--line-2:#443d2b;--accent:#d59a4d;--accent-2:#e0ab63;--accent-wash:#362a19;
  --warn-wash:#39251a;--warn-ink:#d9825a;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;
  min-height:100dvh;-webkit-text-size-adjust:100%}
.wrap{max-width:1280px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
h1{font-size:20px;font-weight:700;margin:4px 0 14px}
.grid{display:grid;gap:16px}
@media (min-width:900px){.grid{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);align-items:start}
  .preview{position:sticky;top:16px}}
.stage{border-radius:12px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.stage canvas{display:block;width:100%;height:auto}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;background:var(--surface-2);border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;border:0;border-radius:9px;
  background:transparent;color:var(--ink-mid);font:inherit;font-size:14px;font-weight:500;cursor:pointer;padding:6px 4px;line-height:1.3}
.seg button svg{width:20px;height:20px;flex:none}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line-2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:grid;gap:14px}
label.f{display:grid;gap:6px;font-size:14px;font-weight:500;color:var(--ink-mid)}
label.f small{font-size:13px;font-weight:400;color:var(--ink-soft)}
textarea,input[type=text]{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);
  border:1px solid var(--line-2);border-radius:8px;padding:10px 12px;min-height:44px;resize:vertical}
textarea{min-height:120px;line-height:1.5}
.img{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.img .thumb{width:88px;height:50px;border-radius:6px;border:1px solid var(--line-2);background:var(--surface-2) center/contain no-repeat;flex:none}
button.b,label.b{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;border-radius:12px;border:0;
  font:inherit;font-size:15px;font-weight:500;cursor:pointer;padding:10px 14px;background:var(--surface-2);color:var(--ink)}
button.b svg,label.b svg{width:20px;height:20px;flex:none}
button.main{background:var(--accent-2);color:var(--paper);width:100%}
.img input{position:absolute;opacity:0;width:1px;height:1px}
.note{font-size:13px;color:var(--warn-ink);min-height:1em;margin:8px 2px 0}
.note:empty{display:none}
.hint{font-size:13px;color:var(--ink-soft);margin:8px 2px 0}
@media (max-width:899px){.hint{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <h1>告知づくり</h1>
  <div class="seg" id="seg" role="group" aria-label="型"></div>
  <div class="grid">
    <div class="preview">
      <div class="stage"><canvas id="cv" width="3840" height="2160" aria-label="できあがり"></canvas></div>
      <p class="note" id="note"></p>
      <p class="hint">画像は ⌘V でも貼れます</p>
    </div>
    <div class="card" id="form"></div>
  </div>
</div>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
const W=1920,H=1080,SC=2;
/* 画像の中身の色（:root の --o* から読む・ダークでも変えない） */
const O={};{const cs=getComputedStyle(document.documentElement);for(let i=1;i<=39;i++)O['o'+i]=cs.getPropertyValue('--o'+i).trim()}
const FONT='-apple-system,"SF Pro Display","Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif';
const f=(w,px)=>`${w} ${px}px ${FONT}`;

/* ---------- 線画アイコン（24の升目） ---------- */
const IC={
  book:['M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z','M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z'],
  bulb:['M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5','M9 18h6','M10 22h4'],
  pencil:['M21.2 6.8a2.8 2.8 0 0 0-4-4L3.8 16.2a2 2 0 0 0-.5.8L2 21.4a.5.5 0 0 0 .6.6l4.4-1.3a2 2 0 0 0 .8-.5z','M15 5l4 4'],
  check:['M2 12a10 10 0 1 0 20 0a10 10 0 1 0-20 0','M9 12l2 2 4-4'],
  cal:['M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z','M16 2v4','M8 2v4','M3 10h18','M8 14h.01','M12 14h.01','M16 14h.01','M8 18h.01','M12 18h.01'],
  play:['M2 12a10 10 0 1 0 20 0a10 10 0 1 0-20 0','M10 8l6 4-6 4z'],
  msg:['M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z'],
  star:['M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z'],
  cap:['M22 10v6','M2 10l10-5 10 5-10 5z','M6 12v5c3 3 9 3 12 0v-5'],
  photo:['M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z','M7 9a2 2 0 1 0 4 0a2 2 0 1 0-4 0','M21 15l-3.1-3.1a2 2 0 0 0-2.8 0L6 21'],
  ipad:['M6 2h12a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z','M12 18h.01'],
};
const P2={};for(const k in IC)P2[k]=IC[k].map(d=>new Path2D(d));
function icon(name,x,y,size,color,lw=1.8){
  ctx.save();ctx.translate(x,y);ctx.scale(size/24,size/24);
  ctx.strokeStyle=color;ctx.lineWidth=lw;ctx.lineCap='round';ctx.lineJoin='round';
  for(const p of P2[name])ctx.stroke(p);ctx.restore();
}
const ROW=[['book',O['o1']],['bulb',O['o2']],['pencil',O['o3']],['check',O['o4']],['cal',O['o1']],['play',O['o5']],['msg',O['o2']],['star',O['o3']],['cap',O['o4']]];
function iconRow(y,alpha=1){
  ctx.save();ctx.globalAlpha=alpha;
  const n=ROW.length,step=200,x0=W/2-step*(n-1)/2;
  ROW.forEach(([k,c],i)=>icon(k,x0+i*step-42,y-42,84,c,1.6));
  ctx.restore();
}

/* ---------- 共通の描画部品 ---------- */
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function fitImg(img,x,y,w,h){ // 枠に収める（はみ出さない）
  const s=Math.min(w/img.width,h/img.height),dw=img.width*s,dh=img.height*s;
  return {x:x+(w-dw)/2,y:y+(h-dh)/2,w:dw,h:dh};
}
function placeholder(x,y,w,h,text){
  ctx.save();rr(x,y,w,h,18);ctx.fillStyle=O['o6'];ctx.fill();
  ctx.setLineDash([14,10]);ctx.lineWidth=3;ctx.strokeStyle=O['o7'];ctx.stroke();
  ctx.setLineDash([]);ctx.fillStyle=O['o8'];ctx.font=f(500,36);ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(text,x+w/2,y+h/2);ctx.restore();
}
function shrinkText(t,weight,px,maxW,min=20){
  let s=px;ctx.font=f(weight,s);
  while(s>min&&ctx.measureText(t).width>maxW){s-=2;ctx.font=f(weight,s)}
  return s;
}
function sparkle(cx,cy,r,color,lw){
  ctx.save();ctx.strokeStyle=color;ctx.lineWidth=lw;ctx.lineJoin='round';ctx.beginPath();
  ctx.moveTo(cx,cy-r);ctx.quadraticCurveTo(cx,cy,cx+r,cy);ctx.quadraticCurveTo(cx,cy,cx,cy+r);
  ctx.quadraticCurveTo(cx,cy,cx-r,cy);ctx.quadraticCurveTo(cx,cy,cx,cy-r);ctx.stroke();ctx.restore();
}

/* ---------- 型（ここに足せば型が増える） ---------- */
const TYPES={
  roadmap:{
    name:'新しい研修',icon:'cap',
    fields:[
      {k:'t1',label:'見出し',def:'Learning Roadmap'},
      {k:'t2',label:'見出し（赤）',def:'Product Zone'},
      {k:'date',label:'締切',def:'11/30'},
      {k:'warn',label:'注意（空なら出さない）',def:'契約用iPadじゃないとできません！'},
      {k:'img',label:'研修の画面',kind:'img'},
    ],
    draw(s,img){
      ctx.fillStyle=O['o9'];ctx.fillRect(0,0,W,H);
      ctx.fillStyle=O['o10'];
      for(let y=20;y<H;y+=40)for(let x=20;x<W;x+=40){ctx.beginPath();ctx.arc(x,y,2.2,0,7);ctx.fill()}
      ctx.textBaseline='alphabetic';ctx.textAlign='left';
      ctx.fillStyle=O['o11'];const s1=shrinkText(s.t1,800,92,880);ctx.fillText(s.t1,124,200);
      ctx.fillStyle=O['o12'];shrinkText(s.t2,500,Math.min(92,s1+4),880);ctx.fillText(s.t2,124,295);
      // 研修の画面
      const bx=122,by=352,bw=902,bh=482;
      if(img){const r=fitImg(img,bx,by,bw,bh);r.y=by;ctx.save();ctx.shadowColor=O['o13'];ctx.shadowBlur=24;ctx.shadowOffsetY=6;
        ctx.drawImage(img,r.x,r.y,r.w,r.h);ctx.restore();ctx.strokeStyle=O['o14'];ctx.lineWidth=2;ctx.strokeRect(r.x,r.y,r.w,r.h)}
      else placeholder(bx,by,bw,bh,'研修の画面');
      // 締切の札
      ctx.save();ctx.shadowColor=O['o15'];ctx.shadowBlur=30;ctx.shadowOffsetY=8;
      rr(1036,106,518,218,36);ctx.fillStyle=O['o16'];ctx.fill();ctx.restore();
      icon('cal',1082,142,56,O['o2'],1.9);
      ctx.fillStyle=O['o11'];ctx.textAlign='center';shrinkText(s.date,400,104,380);ctx.fillText(s.date,1300,252);
      ctx.fillStyle=O['o17'];rr(1076,290,438,4,2);ctx.fill();
      // アプリのアイコン
      const ax=1596,ay=108,as=216;ctx.save();
      const g=ctx.createLinearGradient(ax,ay,ax,ay+as);g.addColorStop(0,O['o18']);g.addColorStop(1,O['o19']);
      rr(ax,ay,as,as,52);ctx.fillStyle=g;ctx.fill();ctx.clip();
      [[118,.22],[94,.3],[70,.5],[46,1]].forEach(([r,a],i)=>{ctx.beginPath();ctx.arc(ax+as/2,ay+as/2+16+i*8,r*0.95,0,7);ctx.fillStyle=`rgba(255,255,255,${a})`;ctx.fill()});
      ctx.restore();
      // 注意の札
      if(s.warn.trim()){
        ctx.font=f(700,40);const tw=Math.min(ctx.measureText(s.warn).width,700);const pw=tw+150,px=1814-pw,py=662;
        rr(px,py,pw,80,40);ctx.fillStyle=O['o21'];ctx.fill();ctx.strokeStyle=O['o22'];ctx.lineWidth=3;ctx.stroke();
        icon('ipad',px+40,py+22,36,O['o23'],2);
        ctx.fillStyle=O['o23'];ctx.textAlign='left';ctx.textBaseline='middle';shrinkText(s.warn,700,40,700);ctx.fillText(s.warn,px+96,py+42);
        ctx.textBaseline='alphabetic';
      }
      iconRow(953);
    }
  },
  news:{
    name:'お知らせ',icon:'msg',
    fields:[
      {k:'tag',label:'札',def:'FY27 Q1 W8'},
      {k:'title',label:'見出し（改行できます）',def:'Team\nNews Letter',kind:'area',rows:2},
      {k:'l1',label:'ひとこと',def:'最新号が届きました'},
      {k:'l2',label:'ひとこと（紫）',def:'ぜひチェックしてね👀'},
      {k:'img',label:'実物（PDFの画面など）',kind:'img'},
    ],
    draw(s,img){
      const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,O['o24']);g.addColorStop(.6,O['o25']);g.addColorStop(1,O['o26']);
      ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
      ctx.save();ctx.lineWidth=3;ctx.strokeStyle=O['o27'];
      ctx.beginPath();ctx.arc(80,860,300,0,7);ctx.stroke();ctx.beginPath();ctx.arc(1700,980,420,0,7);ctx.stroke();ctx.restore();
      sparkle(170,190,40,O['o28'],3);sparkle(1050,110,56,O['o29'],3);sparkle(1112,170,28,O['o30'],3);
      // 札
      ctx.textBaseline='middle';ctx.textAlign='left';
      ctx.font=f(800,40);const nw=ctx.measureText('NEW').width;ctx.font=f(700,40);const tw=ctx.measureText(s.tag).width;
      const pw=nw+tw+100;rr(152,252,pw,72,36);ctx.fillStyle=O['o31'];ctx.fill();ctx.strokeStyle=O['o32'];ctx.lineWidth=4;ctx.stroke();
      ctx.fillStyle=O['o32'];ctx.font=f(800,40);ctx.fillText('NEW',186,290);ctx.fillStyle=O['o33'];ctx.font=f(700,40);ctx.fillText(s.tag,186+nw+26,290);
      // 見出し
      ctx.textBaseline='alphabetic';ctx.fillStyle=O['o33'];
      const lines=s.title.split('\n').slice(0,3);let px=128;
      for(const l of lines)px=Math.min(px,shrinkText(l,800,128,920,60));
      ctx.font=f(800,px);let y=380+px*.95;
      for(const l of lines){ctx.fillText(l,148,y);y+=px*1.08}
      y+=36;ctx.font=f(800,62);ctx.fillStyle=O['o33'];shrinkText(s.l1,800,62,900);ctx.fillText(s.l1,152,y);
      y+=86;ctx.fillStyle=O['o34'];shrinkText(s.l2,800,62,900);ctx.fillText(s.l2,152,y);
      // 実物（傾けて）
      ctx.save();ctx.translate(1470,560);ctx.rotate(4*Math.PI/180);
      const bw=700,bh=860;
      if(img){const r=fitImg(img,-bw/2,-bh/2,bw,bh);ctx.save();ctx.shadowColor=O['o35'];ctx.shadowBlur=50;ctx.shadowOffsetY=18;
        rr(r.x,r.y,r.w,r.h,16);ctx.fillStyle=O['o36'];ctx.fill();ctx.restore();
        ctx.save();rr(r.x,r.y,r.w,r.h,16);ctx.clip();ctx.drawImage(img,r.x,r.y,r.w,r.h);ctx.restore()}
      else placeholder(-bw/2+60,-bh/2,bw-120,bh,'実物');
      ctx.restore();
    }
  },
  remind:{
    name:'未完了の人',icon:'check',
    fields:[
      {k:'to',label:'お願いする相手',def:'Ken, Mai, Sota'},
      {k:'date',label:'期限',def:'11/30'},
      {k:'img',label:'研修の画面',kind:'img'},
      {k:'links',label:'研修とリンク',hint:'1行目に題名、2行目にURL。空行で区切ると複数',def:'iPhone 修理演習：カバー\nhttps://example.com/course/A-001\n\niPhone について知る：修理演習\nhttps://example.com/course/A-002',kind:'area',rows:6},
      {k:'names',label:'終わっていない人',hint:'1行に1人',def:'Aoi Tanaka\nHaruto Sato\nYui Kobayashi\nRen Yamada\nMio Ito\nSora Watanabe',kind:'area',rows:8},
    ],
    draw(s,img){
      const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,O['o16']);g.addColorStop(.55,O['o37']);g.addColorStop(1,O['o38']);
      ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
      iconRow(935,.45);
      ctx.fillStyle=O['o39'];ctx.textAlign='center';ctx.textBaseline='alphabetic';
      const h1=`${s.to}へサポートのお願い📚`,h2=`期限${s.date}が迫っているトレーニングが未完了のメンバーがいます`;
      shrinkText(h1,500,42,1700);ctx.fillText(h1,W/2,108);shrinkText(h2,500,42,1700);ctx.fillText(h2,W/2,166);
      // 研修の画面
      const bx=48,by=200,bw=1290,bh=560;
      ctx.fillStyle=O['o16'];ctx.fillRect(bx,by,bw,bh);
      if(img){const r=fitImg(img,bx+30,by+30,bw-60,bh-60);ctx.drawImage(img,r.x,r.y,r.w,r.h)}
      else placeholder(bx+30,by+30,bw-60,bh-60,'研修の画面');
      // リンク
      const blocks=s.links.split(/\n\s*\n/).map(b=>b.split('\n').map(x=>x.trim()).filter(Boolean)).filter(b=>b.length);
      ctx.textAlign='left';let y=812;const lh=blocks.length>2?44:52;const fs=blocks.length>2?26:30;
      for(const b of blocks.slice(0,4)){
        for(const [i,l] of b.slice(0,2).entries()){
          ctx.fillStyle=O['o39'];shrinkText(l,500,fs,1260,16);ctx.fillText(l,128,y);
          if(i===1||/^https?:/.test(l)){const w=ctx.measureText(l).width;ctx.fillRect(128,y+6,w,2.5)}
          y+=lh;
        }
        y+=lh*.5;
      }
      // 名前
      const names=s.names.split('\n').map(x=>x.trim()).filter(Boolean);
      const top=230,bottom=830,colW=500;
      let size=50,cols=1;
      const fits=(sz,c)=>Math.ceil(names.length/c)*sz*1.42<=bottom-top;
      while(size>30&&!fits(size,1))size-=2;
      if(!fits(size,1)){cols=2;size=40;while(size>22&&!fits(size,2))size-=2}
      ctx.fillStyle=O['o39'];ctx.font=f(400,size);
      const per=Math.ceil(names.length/cols),cw=cols===1?colW:270;
      names.forEach((n,i)=>{const c=Math.floor(i/per),r=i%per;
        shrinkText(n,400,size,cw-16,14);ctx.fillText(n,1385+c*cw,top+size+r*size*1.42)});
    }
  },
};

/* ---------- 状態（この端末の中だけに保存） ---------- */
const KEY='kokuchi.v1';
let st={type:'roadmap',v:{}};
try{const o=JSON.parse(localStorage.getItem(KEY)||'null');if(o&&TYPES[o.type])st=o}catch(e){}
{const q=new URLSearchParams(location.search).get('type');if(q&&TYPES[q])st.type=q}
for(const t in TYPES){st.v[t]=st.v[t]||{};for(const fd of TYPES[t].fields)if(fd.kind!=='img'&&st.v[t][fd.k]==null)st.v[t][fd.k]=fd.def}
const imgs={}; // 型ごとの画像（保存は別キー）
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function saveImg(t,data){try{if(data)localStorage.setItem(KEY+'.img.'+t,data);else localStorage.removeItem(KEY+'.img.'+t)}catch(e){note('画像が大きくて覚えておけません（今は使えます）')}}
function loadImgs(){return Promise.all(Object.keys(TYPES).map(t=>new Promise(r=>{
  const d=localStorage.getItem(KEY+'.img.'+t);if(!d)return r();const im=new Image();im.onload=()=>{imgs[t]=im;r()};im.onerror=()=>r();im.src=d})))}

function note(t){$('note').textContent=t||''}

/* ---------- 画面 ---------- */
function svgIcon(name){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[name].map(d=>`<path d="${d}"/>`).join('')}</svg>`}
function buildSeg(){
  $('seg').innerHTML=Object.entries(TYPES).map(([k,t])=>`<button type="button" data-t="${k}" aria-pressed="${k===st.type}">${svgIcon(t.icon)}${t.name}</button>`).join('');
  $('seg').querySelectorAll('button').forEach(b=>b.onclick=()=>{st.type=b.dataset.t;save();buildSeg();buildForm();draw()});
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function buildForm(){
  const t=TYPES[st.type],v=st.v[st.type];
  let h='';
  for(const fd of t.fields){
    if(fd.kind==='img'){
      h+=`<div class="f"><label class="f" style="margin-bottom:6px">${fd.label}</label><div class="img">
        <div class="thumb" id="thumb"></div>
        <label class="b">${svgIcon('photo')}選ぶ<input type="file" accept="image/*" id="file"></label>
        <button type="button" class="b" id="clr" aria-label="画像を外す">外す</button></div></div>`;
    }else if(fd.kind==='area'){
      h+=`<label class="f">${fd.label}${fd.hint?`<small>${fd.hint}</small>`:''}<textarea data-k="${fd.k}" rows="${fd.rows||4}">${esc(v[fd.k])}</textarea></label>`;
    }else{
      h+=`<label class="f">${fd.label}<input type="text" data-k="${fd.k}" value="${esc(v[fd.k])}"></label>`;
    }
  }
  h+=`<button type="button" class="b main" id="save"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>画像を保存</button>`;
  $('form').innerHTML=h;
  $('form').querySelectorAll('[data-k]').forEach(el=>el.oninput=()=>{v[el.dataset.k]=el.value;save();draw()});
  const fi=$('file');if(fi)fi.onchange=()=>{if(fi.files[0])takeFile(fi.files[0]);fi.value=''};
  const c=$('clr');if(c)c.onclick=()=>{delete imgs[st.type];saveImg(st.type,null);draw()};
  $('save').onclick=doSave;
  thumb();
}
function thumb(){const th=$('thumb');if(th)th.style.backgroundImage=imgs[st.type]?`url(${imgs[st.type].src})`:'none'}

function takeFile(file){
  if(!file||!/^image\//.test(file.type))return;
  const url=URL.createObjectURL(file);const im=new Image();
  im.onload=()=>{ // 長い辺 2400px までに縮めて覚える
    const m=2400,s=Math.min(1,m/Math.max(im.width,im.height));
    const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);
    const t=st.type;let data=c.toDataURL('image/jpeg',0.9);
    const im2=new Image();im2.onload=()=>{imgs[t]=im2;saveImg(t,data);note('');thumb();draw()};im2.src=data;
  };
  im.onerror=()=>note('この画像は読めませんでした');
  im.src=url;
}
document.addEventListener('paste',e=>{
  for(const it of (e.clipboardData||{}).items||[])if(it.kind==='file'&&/^image\//.test(it.type)){takeFile(it.getAsFile());e.preventDefault();return}
});
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>{e.preventDefault();const fl=e.dataTransfer.files[0];if(fl)takeFile(fl)});

/* ---------- 描く ---------- */
let blob=null,ver=0,timer=0;
function draw(){
  ctx.setTransform(SC,0,0,SC,0,0);ctx.clearRect(0,0,W,H);
  try{TYPES[st.type].draw(st.v[st.type],imgs[st.type]||null)}catch(e){note('描けませんでした：'+e.message)}
  ver++;blob=null;clearTimeout(timer);const my=ver;
  timer=setTimeout(()=>cv.toBlob(b=>{if(my===ver)blob=b},'image/png'),400);
}
let saving=false;
async function doSave(){
  if(saving)return;
  const ready=!!blob;let b=blob||await new Promise(r=>cv.toBlob(r,'image/png'));
  if(!b){note('保存できませんでした');return}
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  const name=`告知_${TYPES[st.type].name}_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}.png`;
  const file=new File([b],name,{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[file]})&&/iPhone|iPad|Android/.test(navigator.userAgent)){
    try{saving=true;await navigator.share({files:[file]});return}
    catch(e){if(e.name==='AbortError')return;if(!ready){blob=b;note('用意できました。もう一度「画像を保存」を押してください');return}}
    finally{saving=false}
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}

buildSeg();buildForm();draw();
loadImgs().then(()=>{thumb();draw()});
(document.fonts&&document.fonts.ready||Promise.resolve()).then(draw);
})();
</script>
<!-- tsumiki-back-button -->
<style>
  #tsumikiEdge{position:fixed; top:0; bottom:0; left:0; width:22px; z-index:999;}
  #tsumikiPeek{
    position:fixed; top:50%; left:0; z-index:1001; margin-top:-23px;
    width:46px; height:46px; display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.92);
    -webkit-backdrop-filter:saturate(180%) blur(14px); backdrop-filter:saturate(180%) blur(14px);
    border:1px solid rgba(0,0,0,.06); border-radius:50%;
    box-shadow:0 6px 20px rgba(0,0,0,.18);
    color:#0071e3; font-size:24px; font-weight:600; line-height:1;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Helvetica Neue",Arial,sans-serif;
    transform:translateX(-70px) scale(.8); opacity:0; pointer-events:none;
  }
</style>
<div id="tsumikiEdge"></div>
<div id="tsumikiPeek">‹</div>
<script>
  (function(){
    var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
      || window.navigator.standalone === true;
    var fromTsumiki = false;
    try{
      if(document.referrer){
        var r = new URL(document.referrer);
        fromTsumiki = (r.origin === location.origin);
      }
    }catch(e){}
    if(!(standalone && fromTsumiki)) return;

    var peek = document.getElementById('tsumikiPeek');
    var edge = document.getElementById('tsumikiEdge');

    function goBack(){ location.href = 'index.html'; }

    /* --- 左端エッジスワイプで戻る（iOS純正の戻る操作。見えるボタンは置かない） --- */
    var sx=0, sy=0, prog=0, dragging=false, W=window.innerWidth;
    var TRIGGER = Math.min(120, W*0.32);
    window.addEventListener('resize', function(){ W=window.innerWidth; TRIGGER=Math.min(120, W*0.32); });

    function reset(){
      dragging = false; prog = 0;
      peek.style.transition = 'transform .25s ease, opacity .25s ease';
      peek.style.transform = 'translateX(-70px) scale(.8)';
      peek.style.opacity = 0;
    }
    function start(e){
      var t = e.touches ? e.touches[0] : e;
      if(t.clientX > 26) return;
      sx = t.clientX; sy = t.clientY; prog = 0; dragging = true;
      peek.style.transition = 'none';
    }
    function move(e){
      if(!dragging) return;
      var t = e.touches ? e.touches[0] : e;
      var dx = t.clientX - sx, dy = t.clientY - sy;
      if(Math.abs(dy) > Math.abs(dx) + 12){ reset(); return; }
      if(dx < 0) dx = 0;
      prog = Math.min(dx / TRIGGER, 1);
      peek.style.transform = 'translateX(' + (-70 + prog*82) + 'px) scale(' + (0.8 + prog*0.2) + ')';
      peek.style.opacity = prog;
      if(dx > 6 && e.cancelable) e.preventDefault();
    }
    function end(){
      if(!dragging) return;
      dragging = false;
      if(prog >= 0.999){
        peek.style.transition = 'transform .25s ease, opacity .25s ease';
        peek.style.transform = 'translateX(20px) scale(1.05)';
        peek.style.opacity = 1;
        goBack();
      }else{
        reset();
      }
    }
    edge.addEventListener('touchstart', start, {passive:true});
    window.addEventListener('touchmove', move, {passive:false});
    window.addEventListener('touchend', end, {passive:true});
    window.addEventListener('touchcancel', end, {passive:true});
  })();
</script>
<!-- /tsumiki-back-button -->
</body>
</html>
