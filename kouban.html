<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>香盤メーカーは引っ越しました</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--paper:#F4F2EE;--ink:#242321;--muted:#77736B;--hair:#D8D4CC;--control:#F8F7F4;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);
    font-family:'Zen Maru Gothic',-apple-system,BlinkMacSystemFont,"Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;line-height:1.8;}
  h1{font-size:20px;font-weight:700;margin-bottom:14px;}
  p{font-size:14px;color:var(--muted);max-width:24em;margin:0 auto;}
  .btns{margin-top:26px;display:flex;flex-direction:column;gap:12px;align-items:center;}
  a.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;
    padding:14px 26px;font-size:15px;font-weight:700;text-decoration:none;min-width:16rem;}
  a.main{background:var(--ink);color:var(--paper);}
  a.sub{border:1px solid var(--hair);color:var(--muted);}
  .note{margin-top:18px;font-size:12px;color:var(--muted);}
</style>
</head>
<body>
<div>
  <h1>香盤メーカーは引っ越しました</h1>
  <p>新しい置き場所で今までどおり使えます。ブックマークは新しいURLに更新してください。</p>
  <div class="btns" id="btns">
    <a class="btn main" id="moveBtn" href="https://tsumiki-apps.github.io/tools/kouban.html">新しい香盤メーカーを開く</a>
  </div>
  <p class="note" id="note"></p>
</div>

<script>
(function(){
  var NEW_URL = "https://tsumiki-apps.github.io/tools/kouban.html";
  try{
    var raw = localStorage.getItem("kouban:appData:v1");
    if(raw){
      var d = JSON.parse(raw);
      var n = (d.roles||[]).length + (d.scenes||[]).length;
      if(n > 0){
        // この端末に残っているデータを ?data= に載せて新URLへ持っていく
        var enc = LZString.compressToEncodedURIComponent(raw);
        var a = document.getElementById("moveBtn");
        a.href = NEW_URL + "?data=" + enc;
        a.textContent = "データごと引っ越して開く";
        document.getElementById("note").textContent =
          "この端末に保存されていたデータ（役" + (d.roles||[]).length + "・場面" + (d.scenes||[]).length + "）も一緒に移ります。";
      }
    }
  }catch(e){}
})();
</script>
</body>
</html>
