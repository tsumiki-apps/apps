<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="apple-touch-icon" href="icons/icon-jikyu.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="時給計算">
<meta name="theme-color" content="#f5f4f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131109" media="(prefers-color-scheme: dark)">
<title>時給計算</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f5f4f0; --surface:#fffefb; --surface-2:#efece5; --ink:#1d1a15;
    --ink-mid:#5b554a; --ink-soft:#8f8877; --line:#e2ded4; --line-2:#d8d3c7;
    --accent:#b06f26; --accent-2:#8a5a24; --accent-wash:#f0e4d1;
    --good:#4c7a51; --good-wash:#dde9dd; --warn:#b0522a; --warn-wash:#f2e0d4;
    --shadow:0 1px 2px rgba(40,32,18,.05), 0 10px 26px -16px rgba(40,32,18,.18);
    --serif:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Songti SC",serif;
    --sans:"Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,Meiryo,sans-serif;
    /* つみきのブランド名（公式ロゴの横のタイトル）だけに使う公式書体。
       本文・見出しの明朝（--serif）はこのアプリの意匠なのでそのまま。
       読み込めない環境では Hiragino Maru Gothic ProN → 通常のゴシックへ落ちる */
    --brand-font:'Zen Maru Gothic',-apple-system,BlinkMacSystemFont,"Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#131109; --surface:#1d1a12; --surface-2:#26221a; --ink:#efe8da;
      --ink-mid:#a89e8b; --ink-soft:#7d7566; --line:#2f2b21; --line-2:#3a352a;
      --accent:#d59a4d; --accent-2:#e0ab63; --accent-wash:#362a19;
      --good:#7fae82; --good-wash:#23301f; --warn:#d9825a; --warn-wash:#39251a;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 30px -18px rgba(0,0,0,.65);
    }
  }
  :root[data-theme="light"]{
    --paper:#f5f4f0; --surface:#fffefb; --surface-2:#efece5; --ink:#1d1a15;
    --ink-mid:#5b554a; --ink-soft:#8f8877; --line:#e2ded4; --line-2:#d8d3c7;
    --accent:#b06f26; --accent-2:#8a5a24; --accent-wash:#f0e4d1;
    --good:#4c7a51; --good-wash:#dde9dd; --warn:#b0522a; --warn-wash:#f2e0d4;
    --shadow:0 1px 2px rgba(40,32,18,.05), 0 10px 26px -16px rgba(40,32,18,.18);
  }
  :root[data-theme="dark"]{
    --paper:#131109; --surface:#1d1a12; --surface-2:#26221a; --ink:#efe8da;
    --ink-mid:#a89e8b; --ink-soft:#7d7566; --line:#2f2b21; --line-2:#3a352a;
    --accent:#d59a4d; --accent-2:#e0ab63; --accent-wash:#362a19;
    --good:#7fae82; --good-wash:#23301f; --warn:#d9825a; --warn-wash:#39251a;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 30px -18px rgba(0,0,0,.65);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink); font-family:var(--sans);
    line-height:1.6; -webkit-font-smoothing:antialiased; font-feature-settings:"palt" 1; -webkit-text-size-adjust:100%;
  }
  .tnum{font-variant-numeric:tabular-nums;}

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--paper) 88%, transparent);
    backdrop-filter:saturate(1.3) blur(10px); -webkit-backdrop-filter:saturate(1.3) blur(10px);
    border-bottom:1px solid var(--line); padding:calc(env(safe-area-inset-top) + 12px) 18px 12px;
    display:flex; align-items:center; gap:10px;
  }
  .brand{display:flex; align-items:center; gap:10px; min-width:0;}
  .brand .mark{  /* つみき公式ロゴ（アイソメの積み木3つ）＝index.html と同一座標 */
    width:22px; height:22px; flex:none; display:block; border-radius:5px;
    box-shadow:0 2px 7px rgba(36,35,33,.18);
  }
  .brand h1{font-family:var(--brand-font); font-weight:700; font-size:1.1rem; margin:0; letter-spacing:.02em; white-space:nowrap;}
  .spacer{flex:1;}
  .iconbtn{
    width:34px; height:34px; flex:none; border:1px solid var(--line); background:var(--surface);
    border-radius:9px; color:var(--ink-mid); display:grid; place-items:center; cursor:pointer;
  }
  .iconbtn:active{transform:scale(.94);}
  .sync-dot{width:8px; height:8px; border-radius:50%; background:var(--ink-soft); flex:none;}
  .sync-dot.ok{background:var(--good);} .sync-dot.off{background:var(--accent);}

  /* ---------- メニュー（三本線 → 引き出し） ----------
     z-index は戻るボタン（#tsumikiEdge=999 / #tsumikiPeek=1001）より上。
     開いている間は左端エッジスワイプ（戻る）を覆って誤爆を防ぐ。 */
  .menu-mask{
    position:fixed; inset:0; background:rgba(24,19,10,.42); z-index:1010;
    opacity:0; pointer-events:none; transition:opacity .22s;
  }
  .menu-mask.show{opacity:1; pointer-events:auto;}
  .drawer{
    position:fixed; top:0; left:0; bottom:0; width:min(80vw,286px); z-index:1011;
    background:var(--surface); border-right:1px solid var(--line);
    box-shadow:0 0 44px -10px rgba(24,19,10,.4);
    transform:translateX(-101%); transition:transform .26s cubic-bezier(.22,.61,.36,1);
    padding:calc(env(safe-area-inset-top) + 14px) 12px calc(env(safe-area-inset-bottom) + 14px);
    display:flex; flex-direction:column; gap:12px; overflow-y:auto; overscroll-behavior:contain;
  }
  .drawer.show{transform:none;}
  .dr-head{display:flex; align-items:center; gap:9px; padding:2px 8px 12px; border-bottom:1px solid var(--line);}
  .dr-head .mark{  /* つみき公式ロゴ（アイソメの積み木3つ）＝index.html と同一座標 */
    width:18px; height:18px; flex:none; display:block; border-radius:4px;
    box-shadow:0 2px 7px rgba(36,35,33,.18);
  }
  .dr-head b{font-family:var(--brand-font); font-weight:700; font-size:.98rem; letter-spacing:.02em;}
  .dr-nav{display:grid; gap:3px;}
  .dr-item{
    display:flex; align-items:center; gap:11px; padding:12px 11px; border-radius:12px;
    text-decoration:none; color:var(--ink); font-size:.95rem; font-weight:700; line-height:1.35;
  }
  .dr-item svg{
    width:19px; height:19px; flex:none; color:var(--ink-soft);
    stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round;
  }
  .dr-item:active{background:var(--surface-2);}
  .dr-item.current{background:var(--accent-wash); color:var(--accent-2);}
  .dr-item.current svg{color:var(--accent-2);}
  .dr-item.soon{color:var(--ink-soft); font-weight:600;}
  .dr-item .soon-tag{
    margin-left:auto; flex:none; font-size:.66rem; font-weight:700; letter-spacing:.04em;
    color:var(--ink-soft); border:1px solid var(--line-2); border-radius:99px; padding:2px 7px;
  }
  .dr-note{margin-top:auto; padding:12px 10px 0; font-size:.72rem; color:var(--ink-soft); line-height:1.5;}

  /* ---------- layout ---------- */
  main{max-width:600px; margin:0 auto; padding:16px 16px calc(env(safe-area-inset-bottom) + 40px); display:grid; gap:15px;}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow); padding:18px 19px;}
  .label{font-size:.74rem; font-weight:700; letter-spacing:.06em; color:var(--accent-2); text-transform:uppercase;}

  /* PC・タブレット幅：横をつかう。
     案件を並べて一覧性を上げ、開いた案件だけ横いっぱいに広げて記録を見やすくする。
     入力欄は伸ばしすぎない（金額や時刻の欄が1000px幅だと逆に使いにくいため）。 */
  @media (min-width:760px) and (max-width:1079px){
    main{max-width:720px;}
  }
  @media (min-width:1080px){
    main{max-width:1180px; padding:22px 20px calc(env(safe-area-inset-bottom) + 40px); gap:18px;}
    /* 案件カードは上の集計カードと同じ幅（1枚ずつ縦に並べる）。
       横に並べると、集計カードだけ横長で案件カードが小さく見えて不揃いになるため。 */
    .jlist{gap:14px;}
    .set-row, .fee-row{max-width:440px;}   /* 金額の欄だけは伸ばさない（横に長いと逆に使いにくい） */
    .lf{max-width:660px;}
  }

  /* ---------- サマリー ---------- */
  .sum{display:flex; gap:8px; margin:11px 0 13px;}
  .sum span{
    flex:1; min-width:0; text-align:center; background:var(--surface-2); border:1px solid var(--line);
    border-radius:11px; padding:8px 4px; font-size:.75rem; color:var(--ink-mid); font-weight:700;
  }
  .sum b{
    display:block; font-family:var(--serif); line-height:1.25; color:var(--ink);
    /* 「10時間30分」のような長い値でも3分割のタイルに収まるよう、画面幅で伸び縮みさせる */
    font-size:clamp(1rem, 4.3vw, 1.35rem);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .sum span.hit{border-color:var(--good); background:var(--good-wash);}
  .sum span.hit b{color:var(--good);}
  .sum span.miss{border-color:var(--warn); background:var(--warn-wash);}
  .sum span.miss b{color:var(--warn);}

  .set-row{
    display:flex; align-items:center; gap:9px; background:var(--surface-2); border:1px solid var(--line);
    border-radius:11px; padding:9px 12px; font-size:.82rem; color:var(--ink-mid); font-weight:700;
  }
  .set-row input{
    width:92px; flex:none; border:1.5px solid var(--line); background:var(--surface); border-radius:9px;
    padding:7px 10px; font-size:16px; color:var(--ink); font-family:var(--sans); text-align:right;
  }
  .set-row input:focus{outline:2px solid var(--accent-wash); border-color:var(--accent);}
  .set-row .unit{margin-left:auto; color:var(--ink-soft); font-weight:400;}
  .note{font-size:.78rem; color:var(--ink-soft); margin:11px 2px 0; line-height:1.55;}

  .add{display:flex; gap:8px; margin-top:13px;}
  .add input{
    flex:1; min-width:0; border:1.5px solid var(--line); background:var(--surface-2); border-radius:11px;
    padding:11px 13px; font-size:16px; color:var(--ink); font-family:var(--sans);
  }
  .add input:focus{outline:2px solid var(--accent-wash); border-color:var(--accent);}
  .add button{
    flex:none; border:none; border-radius:11px; padding:0 17px; font-weight:700; font-size:.95rem;
    font-family:var(--sans); cursor:pointer; color:#fff; background:linear-gradient(155deg,var(--accent),var(--accent-2));
  }
  .add button:active{transform:scale(.97);}

  /* ---------- 案件カード ---------- */
  .gh{
    display:flex; align-items:center; gap:8px; margin:0 2px 9px; font-size:.78rem;
    font-weight:700; letter-spacing:.04em; color:var(--ink-soft);
  }
  .gh .n{font-family:var(--serif); font-size:.95rem; color:var(--ink-mid);}
  .jlist{display:grid; gap:9px;}
  .j-card{background:var(--surface-2); border:1.5px solid var(--line); border-radius:14px; overflow:hidden;}
  .j-card.open{border-color:var(--accent); background:var(--surface);}
  .j-card.st-done{opacity:.66;}
  .j-head{display:flex; align-items:center; gap:11px; padding:13px 14px; cursor:pointer;}
  .j-t{flex:1; min-width:0;}
  .j-name{font-weight:700; font-size:.98rem; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .j-sub{display:block; font-size:.79rem; color:var(--ink-soft); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .j-rate{flex:none; text-align:right; line-height:1.15;}
  .j-rate b{font-family:var(--serif); font-size:1.22rem; color:var(--ink);}
  .j-rate span{display:block; font-size:.66rem; color:var(--ink-soft); letter-spacing:.02em;}
  .j-rate.hit b{color:var(--good);}
  .j-rate.miss b{color:var(--warn);}
  .j-rate.none b{color:var(--ink-soft); font-size:1.05rem;}
  .caret{flex:none; color:var(--ink-soft); transition:transform .2s;}
  .j-card.open .caret{transform:rotate(180deg);}
  .j-body{padding:2px 14px 15px; border-top:1px solid var(--line);}
  .j-field{margin-top:14px;}
  .j-field > label{display:block; font-size:.75rem; font-weight:700; color:var(--ink-mid); margin:0 0 6px;}
  .fee-row{display:flex; align-items:center; gap:9px;}
  .fee-row input{
    flex:1; min-width:0; border:1.5px solid var(--line); background:var(--paper); border-radius:11px;
    padding:10px 12px; font-size:16px; color:var(--ink); font-family:var(--sans); text-align:right;
  }
  .fee-row input:focus{outline:2px solid var(--accent-wash); border-color:var(--accent);}
  .fee-row .unit{flex:none; font-size:.82rem; color:var(--ink-soft); font-weight:700;}

  /* ---------- 記録 ---------- */
  .logs-head{display:flex; align-items:baseline; gap:8px; margin:16px 0 7px;}
  .logs-head .t{font-size:.75rem; font-weight:700; color:var(--ink-mid);}
  .logs-head .tot{margin-left:auto; font-size:.8rem; color:var(--ink-mid); font-weight:700;}
  .logs{display:grid; gap:6px;}
  .log{
    display:grid; grid-template-columns:auto 1fr auto auto; align-items:center; column-gap:9px; row-gap:2px;
    background:var(--paper); border:1px solid var(--line); border-radius:11px; padding:8px 9px 8px 11px;
  }
  .log .d{font-size:.78rem; color:var(--ink-soft); font-weight:700; white-space:nowrap;}
  .log .t{font-size:.85rem; font-weight:700; white-space:nowrap;}
  .log .h{font-size:.8rem; color:var(--ink-mid); font-weight:700; white-space:nowrap;}
  .log .x{
    border:none; background:transparent; color:var(--ink-soft); font-size:1.1rem; line-height:1;
    padding:4px 2px 4px 6px; cursor:pointer; font-family:var(--sans);
  }
  .log .m{grid-column:1/-1; font-size:.78rem; color:var(--ink-soft); word-break:break-word;}
  .log .over{font-size:.7rem; color:var(--accent-2); font-weight:700;}
  .logs-empty{font-size:.82rem; color:var(--ink-soft); padding:4px 2px;}

  .lf{background:var(--paper); border:1.5px solid var(--accent); border-radius:12px; padding:12px; display:grid; gap:9px; margin-top:7px;}
  .lf-row{display:flex; align-items:center; gap:8px;}
  .lf-row > label{flex:none; width:38px; font-size:.75rem; font-weight:700; color:var(--ink-mid);}
  .lf input[type=date], .lf input[type=time], .lf input[type=text]{
    flex:1; min-width:0; border:1.5px solid var(--line); background:var(--surface); border-radius:10px;
    padding:9px 11px; font-size:16px; color:var(--ink); font-family:var(--sans);
  }
  .lf input:focus{outline:2px solid var(--accent-wash); border-color:var(--accent);}
  .lf .tilde{flex:none; color:var(--ink-soft); font-weight:700;}
  .lf-live{font-size:.85rem; font-weight:700; color:var(--accent-2); text-align:center;}
  .lf-live.bad{color:var(--warn);}
  .lf-btns{display:grid; grid-template-columns:1fr 1.4fr; gap:8px;}
  .lf-btns button{
    border:1.5px solid var(--line); background:var(--surface-2); border-radius:11px; padding:11px 4px;
    font-family:var(--sans); font-size:.9rem; font-weight:700; color:var(--ink-mid); cursor:pointer;
  }
  .lf-btns button.pri{border:none; color:#fff; background:linear-gradient(155deg,var(--accent),var(--accent-2));}
  .lf-btns button:active{transform:scale(.98);}
  .addlog{
    width:100%; margin-top:8px; border:1.5px dashed var(--line-2); background:transparent; border-radius:11px;
    padding:11px; font-family:var(--sans); font-size:.88rem; font-weight:700; color:var(--ink-mid); cursor:pointer;
  }
  .addlog:active{transform:scale(.99);}

  .j-foot{display:flex; justify-content:space-between; align-items:center; margin-top:15px;}
  .j-foot button{
    border:none; background:transparent; font-family:var(--sans); font-size:.82rem; font-weight:700;
    color:var(--ink-soft); cursor:pointer; text-decoration:underline; text-underline-offset:3px; padding:4px 2px;
  }
  .j-foot button.del{color:var(--warn);}

  /* ---------- 空・トースト ---------- */
  .empty{display:grid; gap:12px; justify-items:center; text-align:center; padding:16px 0 2px;}
  .empty .em{font-size:2rem;}
  .empty p{margin:0; color:var(--ink-mid); font-size:.94rem;}
  .empty .hint{font-size:.8rem; color:var(--ink-soft);}
  #toast{
    position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 22px); transform:translate(-50%,20px);
    background:var(--ink); color:var(--paper); padding:11px 17px; border-radius:12px; font-size:.9rem;
    display:flex; align-items:center; gap:12px; opacity:0; pointer-events:none; transition:.25s; z-index:40; max-width:90vw;
    box-shadow:0 10px 34px -8px rgba(0,0,0,.45);
  }
  #toast.show{opacity:1; transform:translate(-50%,0);}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>
<!-- tsumiki-embed -->
<!-- 独立ロードマップ(dokuritsu.html)の中に埋め込まれて開かれたときは、
     自分のヘッダー・メニュー・戻るスワイプを隠して中身だけを見せる。
     単体（このURLを直接開く）で使うときは今まで通り何も変わらない。 -->
<style>
  html.embed .topbar,
  html.embed .drawer,
  html.embed .menu-mask,
  html.embed #tsumikiEdge,
  html.embed #tsumikiPeek{display:none !important;}
</style>
<script>
(function(){
  var q; try{ q=new URLSearchParams(location.search); }catch(e){ return; }
  if(q.get('embed')!=='1' || window.parent===window) return;
  var el=document.documentElement;
  el.classList.add('embed');
  function setTheme(t){
    if(t==='light'||t==='dark') el.setAttribute('data-theme',t);
    else el.removeAttribute('data-theme');
  }
  setTheme(q.get('theme'));                 /* 開いた時点の親のテーマに合わせる */
  window.addEventListener('message', function(ev){   /* 親でテーマを切り替えたら追従 */
    if(ev.source!==window.parent) return;
    var d=ev.data;
    if(!d || d.type!=='tsumiki-embed-theme') return;
    setTheme(d.theme);
  });
})();
</script>
<!-- /tsumiki-embed -->
</head>
<body>
  <header class="topbar">
    <button class="iconbtn" id="menuBtn" aria-label="メニュー" aria-expanded="false" aria-controls="drawer">
      <svg viewBox="0 0 24 24" style="width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/></svg>
    </button>
    <div class="brand"><svg class="mark" viewBox="0 0 100 100" aria-label="つみき"><rect width="100" height="100" rx="24" fill="#242321"/><g fill="#242321" stroke="#F4F2EE" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"><polygon points="35,46 50,53.5 35,61 20,53.5"/><polygon points="20,53.5 35,61 35,76 20,68.5"/><polygon points="50,53.5 35,61 35,76 50,68.5"/><polygon points="65,46 80,53.5 65,61 50,53.5"/><polygon points="50,53.5 65,61 65,76 50,68.5"/><polygon points="80,53.5 65,61 65,76 80,68.5"/><polygon points="50,24 65,31.5 50,39 35,31.5"/><polygon points="35,31.5 50,39 50,54 35,46.5"/><polygon points="65,31.5 50,39 50,54 65,46.5"/></g></svg><h1>時給計算</h1></div>
    <span class="spacer"></span>
    <span class="sync-dot" id="syncDot" title="同期状態"></span>
    <button class="iconbtn" id="themeBtn" aria-label="表示切替">
      <svg viewBox="0 0 24 24" style="width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round"><path d="M19 13.5A7 7 0 1 1 10.5 5a5.5 5.5 0 0 0 8.5 8.5z"/></svg>
    </button>
  </header>

  <main id="page"></main>

  <div class="menu-mask" id="menuMask"></div>
  <aside class="drawer" id="drawer" aria-label="メニュー" aria-hidden="true">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ===================== Supabase（つみき共通プロジェクト） ===================== */
const SUPABASE_URL  = 'https://okbjqtdirrathscctyvx.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9rYmpxdGRpcnJhdGhzY2N0eXZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzMjI4NTIsImV4cCI6MjA5NTg5ODg1Mn0.T-1AOK6vCD6uGdqrVGXjPui3L6WPSNrnygS-IHyfZ6Y';
const sb = (window.supabase && window.supabase.createClient) ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON) : null;
const STATE_TABLE = 'tsumiki_roadmap_state';
const STATE_ID = 'kodai_jikyu_v1';          /* 独立ロードマップ・声かけメモとは別の行 */
const KEY = 'tsumiki_jikyu_v1';

/* ===================== ユーティリティ ===================== */
function uid(){ return Date.now().toString(36) + Math.floor(Math.random()*1e6).toString(36); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function z2(n){ return String(n).padStart(2,'0'); }
function iso(d){ return d.getFullYear()+'-'+z2(d.getMonth()+1)+'-'+z2(d.getDate()); }
function todayISO(){ return iso(new Date()); }
function parseISO(s){ const [y,m,d]=String(s).split('-').map(Number); return new Date(y,(m||1)-1,d||1); }
const WD=['日','月','火','水','木','金','土'];
function fmtMD(s){ const d=parseISO(s); return (d.getMonth()+1)+'/'+d.getDate()+'('+WD[d.getDay()]+')'; }
function yen(n){ return Math.round(n).toLocaleString('ja-JP'); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1700); }

/* 「14:30」→ 870分。壊れていたら null */
function toMin(t){ const m=/^(\d{1,2}):(\d{2})$/.exec(String(t||'')); if(!m) return null; const h=+m[1], mi=+m[2]; if(h>23||mi>59) return null; return h*60+mi; }
/* 1件の長さ。終了が開始より前なら日をまたいだものとして +24時間 */
function logMin(l){ const s=toMin(l.start), e=toMin(l.end); if(s==null||e==null) return 0; let d=e-s; if(d<0) d+=1440; return d; }
function isOvernight(l){ const s=toMin(l.start), e=toMin(l.end); return s!=null && e!=null && e<s; }
function fmtDur(min){
  if(!min) return '0分';
  const h=Math.floor(min/60), m=min%60;
  if(!h) return m+'分';
  return m ? h+'時間'+m+'分' : h+'時間';
}
/* サマリーの小さなタイル用。10時間を超えたら「10.5時間」と縮めて桁あふれを防ぐ */
function fmtDurShort(min){
  if(min < 600) return fmtDur(min);
  const h=Math.floor(min/60), m=min%60;
  return m ? h+'.'+Math.round(m/6)+'時間' : h+'時間';
}
/* 現在時刻を15分単位に丸める */
function nowRounded(back){
  const d=new Date();
  d.setMinutes(Math.round(d.getMinutes()/15)*15, 0, 0);
  if(back) d.setMinutes(d.getMinutes()-back);
  return z2(d.getHours())+':'+z2(d.getMinutes());
}

/* ===================== 状態 ===================== */
/* job = {id, name, fee:'', status:'active'|'done', createdAt, logs:[{id,date,start,end,memo}]} */
function blank(){ return { v:1, settings:{ targetRate:'' }, jobs:[] }; }
let db = blank();
let online = null;
let lastPushed = '';
let openId = null;       /* 開いている案件カード（編集中はリアルタイム上書きを止める） */
let adding = null;       /* 記録フォームを開いている案件id */

function migrate(){
  if(!db.settings || typeof db.settings!=='object') db.settings={targetRate:''};
  if(typeof db.settings.targetRate!=='string') db.settings.targetRate = db.settings.targetRate ? String(db.settings.targetRate) : '';
  if(!Array.isArray(db.jobs)) db.jobs=[];
  db.jobs = db.jobs.filter(j=>j && typeof j==='object');
  db.jobs.forEach(j=>{
    if(!j.id) j.id=uid();
    ['name','fee','createdAt'].forEach(k=>{ if(typeof j[k]!=='string') j[k]= j[k]==null ? '' : String(j[k]); });
    if(!j.createdAt) j.createdAt=todayISO();
    if(!/^(active|done)$/.test(j.status)) j.status='active';
    if(!Array.isArray(j.logs)) j.logs=[];
    j.logs = j.logs.filter(l=>l && typeof l==='object');
    j.logs.forEach(l=>{
      if(!l.id) l.id=uid();
      ['date','start','end','memo'].forEach(k=>{ if(typeof l[k]!=='string') l[k]=''; });
    });
  });
}

/* ===================== 永続化・同期 ===================== */
function loadLocal(){ try{ const s=localStorage.getItem(KEY); if(s){ db=Object.assign(blank(), JSON.parse(s)); migrate(); } }catch(e){} }
let saveTimer=null;
function save(){
  localStorage.setItem(KEY, JSON.stringify(db));
  if(!sb) return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    lastPushed = JSON.stringify(db);
    const { error } = await sb.from(STATE_TABLE).upsert({ id:STATE_ID, state:db, updated_at:new Date().toISOString() });
    if(error){ online=false; } else if(online!==true){ online=true; }
    renderSync();
  }, 350);
}
async function loadRemote(){
  if(!sb){ online=false; renderSync(); return; }
  const { data, error } = await sb.from(STATE_TABLE).select('state').eq('id',STATE_ID).maybeSingle();
  if(error){ online=false; renderSync(); return; }
  online=true;
  if(data && data.state && typeof data.state==='object'){
    db=Object.assign(blank(), data.state); migrate();
    localStorage.setItem(KEY, JSON.stringify(db));
    if(!openId) render();
  } else if(db.jobs.length){ save(); }
  renderSync();
}
function subscribeRealtime(){
  if(!sb) return;
  sb.channel('tsumiki-jikyu-rt')
    .on('postgres_changes', { event:'*', schema:'public', table:STATE_TABLE, filter:'id=eq.'+STATE_ID }, (payload)=>{
      const incoming = JSON.stringify((payload.new && payload.new.state) || {});
      if(incoming === lastPushed) return;
      if(openId) return;                       /* 編集中は上書きしない */
      const active=document.activeElement;
      if(active && /INPUT|TEXTAREA/.test(active.tagName)) return;
      if(payload.new && payload.new.state){
        db=Object.assign(blank(), payload.new.state); migrate();
        localStorage.setItem(KEY, JSON.stringify(db));
        render();
      }
    }).subscribe();
}
function renderSync(){
  const dot=document.getElementById('syncDot');
  dot.classList.remove('ok','off');
  if(!sb){ dot.title='この端末に保存'; return; }
  if(online===true){ dot.classList.add('ok'); dot.title='クラウド同期中'; }
  else if(online===false){ dot.classList.add('off'); dot.title='オフライン'; }
}

/* ===================== 計算 ===================== */
function job(id){ return db.jobs.find(j=>j.id===id) || null; }
function jobMin(j){ return j.logs.reduce((a,l)=>a+logMin(l),0); }
function feeOf(j){ const n=Number(String(j.fee).replace(/[^\d.-]/g,'')); return isFinite(n)&&n>0 ? n : 0; }
function jobRate(j){ const min=jobMin(j), fee=feeOf(j); return (min>0 && fee>0) ? fee/(min/60) : null; }
function targetRate(){ const n=Number(db.settings.targetRate); return isFinite(n)&&n>0 ? n : 0; }
function rateCls(r){ const t=targetRate(); if(r==null) return 'none'; if(!t) return ''; return r>=t ? 'hit' : 'miss'; }
function totals(){
  let min=0, fee=0, minAll=0;
  db.jobs.forEach(j=>{
    const m=jobMin(j); minAll+=m;
    if(feeOf(j)>0 && m>0){ min+=m; fee+=feeOf(j); }   /* 平均時給は「報酬も時間もある案件」だけで出す */
  });
  return { minAll, rate: (min>0&&fee>0) ? fee/(min/60) : null, jobs: db.jobs.length };
}

/* ===================== 描画 ===================== */
const ICO_CARET=`<svg class="caret" viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round"><path d="M6 9l6 6 6-6"/></svg>`;

function sortedLogs(j){
  return j.logs.slice().sort((a,b)=>{
    if(a.date!==b.date) return a.date<b.date ? 1 : -1;
    return (toMin(a.start)||0) < (toMin(b.start)||0) ? 1 : -1;
  });
}

function jobCard(j){
  const min=jobMin(j), r=jobRate(j), open=(openId===j.id);
  const sub = feeOf(j)>0
    ? '報酬 '+yen(feeOf(j))+'円（税別） ・ '+fmtDur(min)
    : (min>0 ? fmtDur(min)+' ・ 報酬を入れると時給が出ます' : '報酬と時間を入れると時給が出ます');
  let h=`<div class="j-card ${open?'open':''} ${j.status==='done'?'st-done':''}">
    <div class="j-head" data-act="j-open" data-id="${j.id}" role="button" tabindex="0">
      <span class="j-t"><span class="j-name">${esc(j.name)}</span><span class="j-sub">${esc(sub)}</span></span>
      <span class="j-rate ${rateCls(r)}" data-rate="${j.id}"><b class="tnum">${r==null?'—':yen(r)}</b><span>円 / 時間</span></span>
      ${ICO_CARET}
    </div>`;
  if(!open) return h+`</div>`;

  h+=`<div class="j-body">
    <div class="j-field">
      <label for="fee-${j.id}">報酬（税別・円）</label>
      <div class="fee-row">
        <input type="number" id="fee-${j.id}" data-fee="${j.id}" inputmode="numeric" placeholder="例：30000" value="${esc(j.fee)}">
        <span class="unit">円</span>
      </div>
    </div>

    <div class="logs-head"><span class="t">記録した時間</span><span class="tot" id="oTot">${fmtDur(min)}</span></div>`;

  const logs=sortedLogs(j);
  if(logs.length){
    h+=`<div class="logs">`;
    logs.forEach(l=>{
      h+=`<div class="log">
        <span class="d">${l.date?fmtMD(l.date):'—'}</span>
        <span class="t">${esc(l.start)}<span style="color:var(--ink-soft)"> – </span>${esc(l.end)}${isOvernight(l)?'<span class="over"> 翌</span>':''}</span>
        <span class="h">${fmtDur(logMin(l))}</span>
        <button class="x" data-act="log-del" data-id="${j.id}" data-lid="${l.id}" aria-label="この記録を消す">×</button>
        ${l.memo?`<span class="m">${esc(l.memo)}</span>`:''}
      </div>`;
    });
    h+=`</div>`;
  } else {
    h+=`<div class="logs-empty">まだ記録がありません。作業や打ち合わせをした時間を足していきます。</div>`;
  }

  if(adding===j.id){
    h+=`<div class="lf">
      <div class="lf-row"><label for="lfDate">日付</label><input type="date" id="lfDate" value="${todayISO()}"></div>
      <div class="lf-row">
        <label for="lfStart">時間</label>
        <input type="time" id="lfStart" step="300" value="${nowRounded(60)}">
        <span class="tilde">–</span>
        <input type="time" id="lfEnd" step="300" value="${nowRounded(0)}" aria-label="終了時刻">
      </div>
      <div class="lf-row"><label for="lfMemo">メモ</label><input type="text" id="lfMemo" placeholder="任意（例：打ち合わせ・実装）" autocomplete="off"></div>
      <div class="lf-live" id="lfLive">1時間</div>
      <div class="lf-btns">
        <button data-act="log-cancel">やめる</button>
        <button class="pri" data-act="log-save" data-id="${j.id}">この時間を記録する</button>
      </div>
    </div>`;
  } else {
    h+=`<button class="addlog" data-act="log-new" data-id="${j.id}">＋ 時間を記録する</button>`;
  }

  h+=`<div class="j-foot">
      <button data-act="j-status" data-id="${j.id}">${j.status==='done'?'進行中に戻す':'この案件を完了にする'}</button>
      <button class="del" data-act="j-del" data-id="${j.id}">削除</button>
    </div>
  </div></div>`;
  return h;
}

function render(){
  const st=totals(), t=targetRate();
  const cls = st.rate==null ? '' : (t ? (st.rate>=t?'hit':'miss') : '');
  let h='';

  h+=`<div class="card">
    <span class="label">時給計算</span>
    <div class="sum">
      <span><b class="tnum" id="sumTime">${fmtDurShort(st.minAll)}</b>合計時間</span>
      <span class="${cls}" id="sumRateWrap"><b class="tnum" id="sumRate">${st.rate==null?'—':yen(st.rate)}</b>平均時給(円)</span>
      <span><b class="tnum" id="sumJobs">${st.jobs}</b>案件</span>
    </div>
    <div class="set-row">
      <label for="tgt">目標時給</label>
      <input type="number" id="tgt" inputmode="numeric" placeholder="5000" value="${esc(db.settings.targetRate)}">
      <span class="unit">円 / 時間</span>
    </div>
    <div class="add">
      <input type="text" id="jobName" placeholder="案件の名前（例：香盤メーカー／A社さま）" autocomplete="off" enterkeyhint="done">
      <button data-act="j-add">＋ 追加</button>
    </div>
    <p class="note">移動時間は入れません。その場にいて作業・打ち合わせをした時間だけを記録します。</p>
  </div>`;

  if(!db.jobs.length){
    h+=`<div class="card"><div class="empty">
      <span class="em">⏱</span>
      <p>まだ案件がありません。</p>
      <span class="hint">案件を作って報酬を入れ、かかった時間を足していくと「実質時給」が出ます</span>
    </div></div>`;
  } else {
    const act=db.jobs.filter(j=>j.status==='active').sort((a,b)=>a.createdAt<b.createdAt?1:-1);
    const dn =db.jobs.filter(j=>j.status==='done').sort((a,b)=>a.createdAt<b.createdAt?1:-1);
    [{k:'進行中', list:act},{k:'完了', list:dn}].forEach(g=>{
      if(!g.list.length) return;
      h+=`<div><div class="gh">${g.k}<span class="n">${g.list.length}</span></div><div class="jlist">${g.list.map(jobCard).join('')}</div></div>`;
    });
  }

  document.getElementById('page').innerHTML=h;
  renderSync();
  if(adding){ updateLive(); }
}

/* 入力のたびに数字だけを差し替える（再描画するとキーボードが閉じるため） */
function setTxt(id, txt){ const e=document.getElementById(id); if(e) e.textContent=txt; }
function refreshNums(){
  const st=totals(), t=targetRate();
  setTxt('sumTime', fmtDurShort(st.minAll));
  setTxt('sumRate', st.rate==null?'—':yen(st.rate));
  setTxt('sumJobs', String(st.jobs));
  const w=document.getElementById('sumRateWrap');
  if(w) w.className = st.rate==null ? '' : (t ? (st.rate>=t?'hit':'miss') : '');
  /* 目標時給を変えると、閉じている案件の色も変わる。開いている/いないに関わらず全部そろえる */
  document.querySelectorAll('[data-rate]').forEach(el=>{
    const j=job(el.dataset.rate); if(!j) return;
    const r=jobRate(j);
    el.className='j-rate '+rateCls(r);
    el.querySelector('b').textContent = r==null?'—':yen(r);
  });
  if(openId){ const j=job(openId); if(j) setTxt('oTot', fmtDur(jobMin(j))); }
}
function updateLive(){
  const s=document.getElementById('lfStart'), e=document.getElementById('lfEnd'), live=document.getElementById('lfLive');
  if(!s||!e||!live) return;
  const min=logMin({start:s.value, end:e.value});
  const over=isOvernight({start:s.value, end:e.value});
  live.textContent = min ? fmtDur(min)+(over?'（日をまたいで計算）':'') : '開始と終了が同じ時刻です';
  live.classList.toggle('bad', !min);
}

/* ===================== 操作 ===================== */
document.getElementById('page').addEventListener('click', e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const act=b.dataset.act, id=b.dataset.id;

  if(act==='j-add'){
    const inp=document.getElementById('jobName');
    const name=(inp.value||'').trim();
    if(!name){ inp.focus(); return; }
    const j={id:uid(), name, fee:'', status:'active', createdAt:todayISO(), logs:[]};
    db.jobs.push(j); save(); inp.value='';
    openId=j.id; adding=null; render();
    return;
  }
  if(act==='j-open'){ openId = (openId===id) ? null : id; adding=null; render(); return; }
  if(act==='j-status'){ const j=job(id); if(!j) return; j.status = j.status==='done'?'active':'done'; save(); render(); return; }
  if(act==='j-del'){
    const j=job(id); if(!j) return;
    if(!confirm('「'+j.name+'」を削除します。記録した時間も消えます。よろしいですか？')) return;
    db.jobs=db.jobs.filter(x=>x.id!==id); if(openId===id) openId=null; adding=null;
    save(); render(); toast('案件を削除しました');
    return;
  }
  if(act==='log-new'){ adding=id; render(); const d=document.getElementById('lfStart'); if(d) d.focus({preventScroll:true}); return; }
  if(act==='log-cancel'){ adding=null; render(); return; }
  if(act==='log-del'){
    const j=job(id); if(!j) return;
    j.logs=j.logs.filter(l=>l.id!==b.dataset.lid);
    save(); render(); toast('記録を消しました');
    return;
  }
  if(act==='log-save'){
    const j=job(id); if(!j) return;
    const date=document.getElementById('lfDate').value || todayISO();
    const start=document.getElementById('lfStart').value;
    const end=document.getElementById('lfEnd').value;
    const memo=(document.getElementById('lfMemo').value||'').trim();
    if(!start || !end){ toast('開始と終了の時刻を入れてください'); return; }
    const min=logMin({start,end});
    if(!min){ toast('開始と終了が同じ時刻です'); return; }
    j.logs.push({id:uid(), date, start, end, memo});
    adding=null; save(); render(); toast(fmtDur(min)+' を記録しました');
    return;
  }
});

document.getElementById('page').addEventListener('input', e=>{
  const el=e.target;
  if(el.id==='tgt'){ db.settings.targetRate=el.value; save(); refreshNums(); return; }
  if(el.dataset && el.dataset.fee){
    const j=job(el.dataset.fee); if(!j) return;
    j.fee=el.value; save(); refreshNums(); return;
  }
  if(el.id==='lfStart' || el.id==='lfEnd'){ updateLive(); return; }
});
document.getElementById('page').addEventListener('keydown', e=>{
  if(e.key!=='Enter') return;
  if(e.target.id==='jobName'){ e.preventDefault(); document.querySelector('[data-act="j-add"]').click(); }
});

/* ===================== メニュー（引き出し） ===================== */
(function(){
  const btn=document.getElementById('menuBtn');
  const dr=document.getElementById('drawer');
  const mask=document.getElementById('menuMask');
  function setOpen(on){
    dr.classList.toggle('show', on);
    mask.classList.toggle('show', on);
    dr.setAttribute('aria-hidden', on?'false':'true');
    btn.setAttribute('aria-expanded', on?'true':'false');
    document.body.style.overflow = on ? 'hidden' : '';
    if(on){ const f=dr.querySelector('a.dr-item'); if(f) f.focus({preventScroll:true}); }
  }
  btn.addEventListener('click', ()=> setOpen(!dr.classList.contains('show')));
  mask.addEventListener('click', ()=> setOpen(false));
  dr.addEventListener('click', e=>{ if(e.target.closest('.dr-item.current, .dr-item.soon')) setOpen(false); });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape' && dr.classList.contains('show')) setOpen(false); });
})();

/* ===================== テーマ ===================== */
const TKEY='tsumiki_theme';
function applyTheme(){
  const t=localStorage.getItem(TKEY);
  if(t==='light'||t==='dark') document.documentElement.setAttribute('data-theme',t);
  else document.documentElement.removeAttribute('data-theme');
}
document.getElementById('themeBtn').addEventListener('click', ()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const next = cur==='light' ? 'dark' : (cur==='dark' ? '' : 'light');
  if(next) localStorage.setItem(TKEY,next); else localStorage.removeItem(TKEY);
  applyTheme();
  toast(next==='light'?'ライト表示':(next==='dark'?'ダーク表示':'端末の設定に合わせます'));
});
applyTheme();

/* ===================== 起動 ===================== */
loadLocal();
render();
if(sb){ loadRemote(); subscribeRealtime(); }
</script>

<style>
  #tsumikiEdge{position:fixed; top:0; bottom:0; left:0; width:22px; z-index:999;}
  #tsumikiPeek{
    position:fixed; top:50%; left:0; z-index:1001; margin-top:-23px;
    width:46px; height:46px; display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.92);
    -webkit-backdrop-filter:saturate(180%) blur(14px); backdrop-filter:saturate(180%) blur(14px);
    border:1px solid rgba(0,0,0,.06); border-radius:50%;
    box-shadow:0 6px 20px rgba(0,0,0,.18);
    color:#0071e3; font-size:24px; font-weight:600; line-height:1;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Helvetica Neue",Arial,sans-serif;
    transform:translateX(-70px) scale(.8); opacity:0; pointer-events:none;
  }
</style>
<div id="tsumikiEdge"></div>
<div id="tsumikiPeek">‹</div>
<script>
  (function(){
    var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
      || window.navigator.standalone === true;
    var fromTsumiki = false;
    try{
      if(document.referrer){
        var r = new URL(document.referrer);
        fromTsumiki = (r.origin === location.origin);
      }
    }catch(e){}
    if(!(standalone && fromTsumiki)) return;

    var peek = document.getElementById('tsumikiPeek');
    var edge = document.getElementById('tsumikiEdge');

    function goBack(){ location.href = 'index.html'; }

    /* --- 左端エッジスワイプで戻る（iOS純正の戻る操作。見えるボタンは置かない） --- */
    var sx=0, sy=0, prog=0, dragging=false, W=window.innerWidth;
    var TRIGGER = Math.min(120, W*0.32);
    window.addEventListener('resize', function(){ W=window.innerWidth; TRIGGER=Math.min(120, W*0.32); });

    function reset(){
      dragging = false; prog = 0;
      peek.style.transition = 'transform .25s ease, opacity .25s ease';
      peek.style.transform = 'translateX(-70px) scale(.8)';
      peek.style.opacity = 0;
    }
    function start(e){
      var t = e.touches ? e.touches[0] : e;
      if(t.clientX > 26) return;
      sx = t.clientX; sy = t.clientY; prog = 0; dragging = true;
      peek.style.transition = 'none';
    }
    function move(e){
      if(!dragging) return;
      var t = e.touches ? e.touches[0] : e;
      var dx = t.clientX - sx, dy = t.clientY - sy;
      if(Math.abs(dy) > Math.abs(dx) + 12){ reset(); return; }
      if(dx < 0) dx = 0;
      prog = Math.min(dx / TRIGGER, 1);
      peek.style.transform = 'translateX(' + (-70 + prog*82) + 'px) scale(' + (0.8 + prog*0.2) + ')';
      peek.style.opacity = prog;
      if(dx > 6 && e.cancelable) e.preventDefault();
    }
    function end(){
      if(!dragging) return;
      dragging = false;
      if(prog >= 0.999){
        peek.style.transition = 'transform .25s ease, opacity .25s ease';
        peek.style.transform = 'translateX(20px) scale(1.05)';
        peek.style.opacity = 1;
        goBack();
      }else{
        reset();
      }
    }
    edge.addEventListener('touchstart', start, {passive:true});
    window.addEventListener('touchmove', move, {passive:false});
    window.addEventListener('touchend', end, {passive:true});
    window.addEventListener('touchcancel', end, {passive:true});
  })();
</script>
<!-- /tsumiki-back-button -->
