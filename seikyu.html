<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="apple-touch-icon" href="icons/icon-seikyu.png">
<meta name="apple-mobile-web-app-title" content="請求書">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f4f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131109" media="(prefers-color-scheme: dark)">
<title>請求書</title>
<style>
  :root{
    --paper:#f5f4f0; --surface:#fffefb; --surface-2:#efece5; --ink:#1d1a15;
    --ink-mid:#5b554a; --ink-soft:#8f8877; --line:#e2ded4; --line-2:#d8d3c7;
    --accent:#b06f26; --accent-2:#8a5a24; --accent-wash:#f0e4d1;
    --good:#4c7a51; --good-wash:#dde9dd; --warn:#b0522a; --warn-wash:#f2e0d4;
    --shadow:0 1px 2px rgba(40,32,18,.05), 0 10px 26px -16px rgba(40,32,18,.18);
    --serif:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Songti SC",serif;
    --sans:"Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,Meiryo,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#131109; --surface:#1d1a12; --surface-2:#26221a; --ink:#efe8da;
      --ink-mid:#a89e8b; --ink-soft:#7d7566; --line:#2f2b21; --line-2:#3a352a;
      --accent:#d59a4d; --accent-2:#e0ab63; --accent-wash:#362a19;
      --good:#7fae82; --good-wash:#23301f; --warn:#d9825a; --warn-wash:#39251a;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 30px -18px rgba(0,0,0,.65);
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--paper); color:var(--ink); font-family:var(--sans);
    line-height:1.6; -webkit-font-smoothing:antialiased; font-feature-settings:"palt" 1; -webkit-text-size-adjust:100%;
  }
  .tnum{font-variant-numeric:tabular-nums;}

  /* ---------- 上のバー ---------- */
  .topbar{
    position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--paper) 88%, transparent);
    backdrop-filter:saturate(1.3) blur(10px); -webkit-backdrop-filter:saturate(1.3) blur(10px);
    border-bottom:1px solid var(--line); padding:calc(env(safe-area-inset-top) + 12px) 0 12px;
  }
  .topbar .inner{max-width:620px; margin:0 auto; padding:0 16px; display:flex; align-items:center; gap:10px;}
  .brand{display:flex; align-items:center; gap:10px; min-width:0;}
  .brand .mark{  /* つみき公式ロゴ（アイソメの積み木3つ）＝index.html と同一座標 */
    width:22px; height:22px; flex:none; display:block; border-radius:5px;
    box-shadow:0 2px 7px rgba(36,35,33,.18);
  }
  .brand h1{font-family:var(--serif); font-weight:600; font-size:1.1rem; margin:0; letter-spacing:.02em; white-space:nowrap;}
  .spacer{flex:1;}
  .iconbtn{
    width:34px; height:34px; flex:none; border:1px solid var(--line); background:var(--surface);
    border-radius:9px; color:var(--ink-mid); display:grid; place-items:center; cursor:pointer; padding:0;
  }
  .iconbtn:active{transform:scale(.94);}
  .iconbtn svg{width:19px; height:19px; stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round;}
  .backbtn{
    border:0; background:none; color:var(--accent); font-family:var(--sans); font-size:.92rem;
    padding:6px 4px 6px 0; cursor:pointer; display:flex; align-items:center; gap:3px;
  }

  /* ---------- 本文 ---------- */
  .wrap{max-width:620px; margin:0 auto; padding:16px 16px calc(env(safe-area-inset-bottom) + 96px);}
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:15px;
    padding:15px 15px 16px; box-shadow:var(--shadow); margin-bottom:13px;
  }
  .label{
    display:block; font-size:.7rem; font-weight:700; letter-spacing:.09em;
    color:var(--ink-soft); text-transform:uppercase; margin-bottom:2px;
  }
  .label.accent{color:var(--accent-2);}
  .gnote{font-size:.78rem; color:var(--ink-soft); line-height:1.65;}
  .sec-h{font-family:var(--serif); font-size:1.02rem; font-weight:600; margin:0 0 10px;}

  /* ---------- 入力 ---------- */
  .field{margin-bottom:11px;}
  .field:last-child{margin-bottom:0;}
  .field > span.ft{display:block; font-size:.76rem; color:var(--ink-mid); margin-bottom:4px; font-weight:600;}
  input[type=text], input[type=date], input[type=number], input[type=email], textarea, select{
    width:100%; font-family:var(--sans); font-size:16px;   /* iOSの自動ズーム防止＝16px以上 */
    color:var(--ink); background:var(--surface-2); border:1px solid var(--line);
    border-radius:10px; padding:10px 11px; line-height:1.5; -webkit-appearance:none; appearance:none;
  }
  select{background-image:linear-gradient(45deg,transparent 50%,var(--ink-soft) 50%),linear-gradient(135deg,var(--ink-soft) 50%,transparent 50%);
    background-position:calc(100% - 15px) calc(50% + 1px), calc(100% - 10px) calc(50% + 1px);
    background-size:5px 5px,5px 5px; background-repeat:no-repeat; padding-right:30px;}
  textarea{min-height:76px; resize:vertical;}
  input:focus, textarea:focus, select:focus{outline:none; border-color:var(--accent); background:var(--surface);}
  input.num{text-align:right; font-variant-numeric:tabular-nums;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:9px;}
  @media (max-width:400px){ .row2.tight{grid-template-columns:1fr;} }

  /* ---------- ボタン ---------- */
  .btn{
    font-family:var(--sans); font-size:.92rem; font-weight:600; border-radius:11px;
    padding:11px 15px; border:1px solid var(--line-2); background:var(--surface);
    color:var(--ink); cursor:pointer; line-height:1.3;
  }
  .btn:active{transform:scale(.98);}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn.ghost{background:transparent;}
  .btn.sm{font-size:.82rem; padding:8px 11px; border-radius:9px;}
  .btn.danger{color:var(--warn); border-color:var(--warn);}
  .btnrow{display:flex; gap:9px; flex-wrap:wrap;}
  .edit-link{
    border:0; background:none; color:var(--accent); font-family:var(--sans);
    font-size:.83rem; padding:4px 0; cursor:pointer;
  }
  .card-foot{display:flex; gap:14px; flex-wrap:wrap; margin-top:12px; padding-top:11px; border-top:1px solid var(--line);}

  /* 画面の下に固定する主ボタン（作成中はいつでも押せる） */
  .fab{
    position:fixed; left:0; right:0; bottom:0; z-index:15;
    padding:11px 16px calc(env(safe-area-inset-bottom) + 11px);
    background:color-mix(in srgb, var(--paper) 90%, transparent);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
  }
  .fab .inner{max-width:620px; margin:0 auto; display:flex; gap:9px;}
  .fab .btn{flex:1;}

  /* ---------- 一覧 ---------- */
  .inv{
    display:flex; align-items:center; gap:11px; width:100%; text-align:left;
    border:0; border-bottom:1px solid var(--line); background:none; color:inherit;
    font-family:var(--sans); padding:12px 2px; cursor:pointer;
  }
  .inv:last-child{border-bottom:0;}
  .inv:active{background:var(--surface-2);}
  .inv .ib{flex:1; min-width:0;}
  .inv .cl{display:block; font-size:.95rem; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .inv .mt{display:block; font-size:.75rem; color:var(--ink-soft); margin-top:1px;}
  .inv .am{font-size:.98rem; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap;}
  .chip{
    font-size:.68rem; font-weight:700; padding:2px 7px; border-radius:99px; white-space:nowrap;
    background:var(--surface-2); color:var(--ink-soft); border:1px solid var(--line);
  }
  .chip.sent{background:var(--accent-wash); color:var(--accent-2); border-color:transparent;}
  .chip.paid{background:var(--good-wash); color:var(--good); border-color:transparent;}
  .chip.over{background:var(--warn-wash); color:var(--warn); border-color:transparent;}
  .empty{text-align:center; color:var(--ink-soft); padding:26px 8px; font-size:.87rem;}
  .empty .em{font-size:1.9rem; display:block; margin-bottom:8px;}

  /* ---------- 明細の行 ---------- */
  .line{border:1px solid var(--line); border-radius:12px; padding:11px; margin-bottom:9px; background:var(--surface-2);}
  .line-h{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
  .line-h .n{font-size:.72rem; font-weight:700; color:var(--ink-soft); letter-spacing:.06em;}
  .line-h .del{margin-left:auto; border:0; background:none; color:var(--ink-soft); font-size:1.1rem; cursor:pointer; padding:0 4px; line-height:1;}
  .line input, .line select, .line textarea{background:var(--surface);}
  .line .amtrow{display:grid; grid-template-columns:1fr 1.1fr; gap:8px; margin-top:8px;}

  /* 合計 */
  .sum{margin-top:13px; border-top:1px solid var(--line); padding-top:11px;}
  .sum .r{display:flex; align-items:baseline; gap:10px; font-size:.87rem; padding:3px 0; color:var(--ink-mid);}
  .sum .r .v{margin-left:auto; font-variant-numeric:tabular-nums;}
  .sum .r.total{font-size:1.12rem; font-weight:700; color:var(--ink); margin-top:6px; padding-top:9px; border-top:1px solid var(--line);}

  /* 出す前チェック */
  .chk{display:flex; align-items:flex-start; gap:9px; padding:8px 0; font-size:.86rem; cursor:pointer;}
  .chk input{width:19px; height:19px; flex:none; margin:2px 0 0; accent-color:var(--accent);}

  .toast{
    position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 82px); transform:translateX(-50%) translateY(8px);
    background:var(--ink); color:var(--paper); font-size:.83rem; padding:9px 15px; border-radius:99px;
    opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:60; max-width:88vw; text-align:center;
  }
  .toast.show{opacity:1; transform:translateX(-50%);}

  /* ===================== 請求書そのもの（プレビュー＆印刷） =====================
     ここは画面のテーマに追従させない。紙は常に白＋黒で、暗い画面でも
     「印刷したらこう出る」が一致するようにする（印刷事故を防ぐため）。 */
  .sheet{
    display:none; background:#fff; color:#1d1a15; font-family:var(--sans);
    max-width:760px; margin:0 auto; padding:26px 20px 40px; line-height:1.7;
  }
  body.previewing .wrap, body.previewing .fab{display:none;}
  body.previewing .sheet{display:block;}
  .sheet .sh-title{
    font-family:var(--serif); font-size:1.7rem; letter-spacing:.34em; text-indent:.34em;
    text-align:center; font-weight:600; margin:4px 0 20px;
  }
  .sheet .meta{width:100%; border-collapse:collapse; font-size:.8rem; margin-left:auto; max-width:290px;}
  .sheet .meta td{padding:2px 0; vertical-align:top;}
  .sheet .meta td:first-child{color:#5b554a; white-space:nowrap; padding-right:12px;}
  .sheet .meta td:last-child{text-align:right; font-variant-numeric:tabular-nums;}
  .sheet .to{font-size:1.16rem; font-weight:600; margin:16px 0 3px; border-bottom:1px solid #1d1a15; padding-bottom:5px; display:inline-block; min-width:56%;}
  .sheet .lead{font-size:.83rem; margin:12px 0 16px; color:#3d382f;}
  .sheet .subj{font-size:.92rem; margin:0 0 14px;}
  .sheet .grand{
    display:flex; align-items:baseline; gap:12px; border-top:2px solid #1d1a15; border-bottom:2px solid #1d1a15;
    padding:11px 4px; margin-bottom:6px;
  }
  .sheet .grand .gl{font-size:.92rem; font-weight:600; letter-spacing:.08em;}
  .sheet .grand .gv{margin-left:auto; font-size:1.5rem; font-weight:700; font-variant-numeric:tabular-nums;}
  .sheet .taxnote{font-size:.74rem; color:#5b554a; margin:0 0 22px;}
  .sheet h3{font-size:.78rem; font-weight:700; letter-spacing:.12em; color:#5b554a; margin:22px 0 8px; border-bottom:1px solid #d8d3c7; padding-bottom:5px;}
  .sheet table.det{width:100%; border-collapse:collapse; font-size:.8rem;}
  .sheet table.det th{
    background:#f2efe8; font-weight:600; font-size:.72rem; letter-spacing:.05em; color:#5b554a;
    border:1px solid #d8d3c7; padding:6px 7px; text-align:left;
  }
  .sheet table.det td{border:1px solid #d8d3c7; padding:7px; vertical-align:top;}
  .sheet table.det td.no{width:2.2em; text-align:right; color:#8f8877; font-variant-numeric:tabular-nums;}
  .sheet table.det td.nm{font-weight:600; width:31%;}
  .sheet table.det td.am{text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; width:22%;}
  .sheet table.det tr.sub td{background:#faf8f4;}
  .sheet table.det tr.tot td{background:#f2efe8; font-weight:700; font-size:.88rem;}
  .sheet .bank{width:100%; border-collapse:collapse; font-size:.82rem; max-width:420px;}
  .sheet .bank td{padding:4px 0; vertical-align:top;}
  .sheet .bank td:first-child{color:#5b554a; width:7.4em; white-space:nowrap;}
  .sheet ul.notes{margin:0; padding-left:1.15em; font-size:.8rem;}
  .sheet ul.notes li{margin-bottom:5px;}
  .sheet .from{
    margin-top:26px; border-top:1px solid #d8d3c7; border-bottom:1px solid #d8d3c7;
    padding:12px 2px; font-size:.8rem; line-height:1.75;
  }
  .sheet .from b{font-size:.92rem; font-family:var(--serif); letter-spacing:.03em;}
  .sheet .warnbox{
    border:1px dashed #b0522a; color:#b0522a; border-radius:9px; padding:9px 11px;
    font-size:.78rem; margin-bottom:16px;
  }

  /* 画面が狭いときのプレビュー。A4の表をそのまま375pxに入れると「内容」欄が
     1文字ずつ折れるので、ここだけ詰める（印刷はA4のままなので影響しない） */
  @media screen and (max-width:520px){
    .sheet{padding:20px 14px 34px;}
    .sheet table.det{font-size:.74rem;}
    .sheet table.det td{padding:6px 5px;}
    .sheet table.det td.nm{width:27%;}
    .sheet table.det td.am{width:24%;}
    .sheet .sh-title{font-size:1.45rem;}
    .sheet .grand .gv{font-size:1.3rem;}
  }

  .pv-bar{
    position:sticky; top:0; z-index:30; display:none; gap:9px; align-items:center;
    padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;
    background:color-mix(in srgb, var(--paper) 92%, transparent);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
  }
  body.previewing .pv-bar{display:flex;}
  body.previewing .topbar{display:none;}

  /* 印刷（＝PDFで保存）。A4に紙だけを流す */
  @page{size:A4; margin:15mm 14mm 16mm;}
  @media print{
    body{background:#fff;}
    .topbar, .wrap, .fab, .pv-bar, .toast, #tsumikiEdge, #tsumikiPeek{display:none !important;}
    .sheet{display:block !important; max-width:none; margin:0; padding:0;}
    .sheet table.det, .sheet .from, .sheet .bank{break-inside:avoid;}
    .sheet h3{break-after:avoid;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="inner">
    <button class="backbtn" id="btnBack" style="display:none;">‹ 一覧</button>
    <span class="brand" id="brand"><svg class="mark" viewBox="0 0 100 100" aria-label="つみき"><rect width="100" height="100" rx="24" fill="#242321"/><g fill="#242321" stroke="#F4F2EE" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"><polygon points="35,46 50,53.5 35,61 20,53.5"/><polygon points="20,53.5 35,61 35,76 20,68.5"/><polygon points="50,53.5 35,61 35,76 50,68.5"/><polygon points="65,46 80,53.5 65,61 50,53.5"/><polygon points="50,53.5 65,61 65,76 50,68.5"/><polygon points="80,53.5 65,61 65,76 80,68.5"/><polygon points="50,24 65,31.5 50,39 35,31.5"/><polygon points="35,31.5 50,39 50,54 35,46.5"/><polygon points="65,31.5 50,39 50,54 65,46.5"/></g></svg><h1>請求書</h1></span>
    <span class="spacer"></span>
    <button class="iconbtn" id="btnSet" aria-label="自分の情報の設定">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.5 19.3a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.14 15a1.7 1.7 0 0 0-1.56-1H2.5a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1.05 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 8.5 4.6a1.7 1.7 0 0 0 1-1.56V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V10a1.7 1.7 0 0 0 1.56 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"/></svg>
    </button>
  </div>
</div>

<div class="pv-bar">
  <button class="btn ghost sm" id="pvClose">‹ 編集にもどる</button>
  <span class="spacer"></span>
  <button class="btn primary sm" id="pvPrint">印刷 / PDFで保存</button>
</div>

<main class="wrap" id="wrap"></main>
<div class="fab" id="fab"><div class="inner"></div></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================================
   請求書（つみき）
   ねらい＝`契約書ひな形_Tsumiki/08_請求書_ひな形.md` を、毎回そのまま発行できる形にする。
   ひな形から必ず引き継ぐ4点（消すと請求書として弱くなる）:
     1. 支払期限を自分で書く（フリーランス新法 第4条＝受領日から60日以内）
     2. 免税事業者である旨（登録番号を入れたときだけ番号と消費税を出す）
     3. 鍵つきライセンスの条件を1行（契約書を結ばない小案件では唯一の証跡）
     4. 振込手数料の負担
   自分の情報（屋号・住所・振込先）は**この端末のlocalStorageにだけ**置く。
   ここは公開リポジトリなので、ソースには一切書き込まない。
   ========================================================================= */

const KEY='tsumiki_seikyu_v1';

function blank(){
  return {
    me:{ biz:'', rep:'', zip:'', addr:'', mail:'', web:'', tno:'',
         bankInst:'', bankBranch:'', bankType:'普通', bankNo:'', bankHolder:'' },
    prefix:'TSM-I',      /* 番号の頭。見積は TSM-、請求は TSM-I- で分ける */
    serial:{},           /* {'2026': 3} ＝その年に何件出したか */
    invoices:[]
  };
}
let db=blank();
let view='list';      /* list | edit | set */
let curId=null;       /* いま編集している請求書 */

function load(){ try{ const s=localStorage.getItem(KEY); if(s) db=Object.assign(blank(), JSON.parse(s)); }catch(e){} }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){ toast('保存できませんでした'); } }
load();

/* ---------- 小さい道具 ---------- */
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl2br=s=>esc(s).replace(/\n/g,'<br>');
function todayISO(){ const d=new Date(); return isoOf(d); }
function isoOf(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDays(iso,n){ const [y,m,d]=iso.split('-').map(Number); const t=new Date(y,m-1,d); t.setDate(t.getDate()+n); return isoOf(t); }
function fmtJP(iso){ if(!iso) return '—'; const [y,m,d]=iso.split('-'); return `${y}年${Number(m)}月${Number(d)}日`; }
function fmtMD(iso){ if(!iso) return ''; const [,m,d]=iso.split('-'); return `${Number(m)}/${Number(d)}`; }
function yen(n){ return '￥'+Number(n||0).toLocaleString('ja-JP'); }
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }

let toastT=null;
function toast(msg){
  const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'), 2000);
}

/* ---------- 請求書の作成 ----------
   明細の初期値はひな形 08 のNo.1〜5をそのまま。0円の行も残す＝
   「無償で出している価値」が相手の目に見えるようにするため（値引きに見せない）。 */
function newInvoice(){
  const issue=todayISO();
  return {
    id:uid(), no:nextNo(issue), issue, due:addDays(issue,60),
    client:'', subject:'',
    lines:[

function defaultNotes(){

/* 番号は年ごとの連番。TSM-I-2026-001 */
function nextNo(iso){
  const y=iso.slice(0,4);
  const n=(db.serial[y]||0)+1;
  return `${db.prefix}-${y}-${String(n).padStart(3,'0')}`;
}
function bumpSerial(iso){
  const y=iso.slice(0,4);
  db.serial[y]=(db.serial[y]||0)+1;
}
function cur(){ return db.invoices.find(x=>x.id===curId)||null; }

/* ---------- 金額の計算 ----------
   kind: yen=金額を請求 / incl=委託料に含む(0) / free=無償(0)
   税は「登録番号があるか」で決まる。免税のうちは一切加算しない（ひな形の要件2）。 */
function calc(inv){
  const sub=inv.lines.reduce((s,l)=> s + (l.kind==='yen' ? Number(l.amount||0) : 0), 0);
  const disc=Number(inv.discAmount||0);
  const base=Math.max(0, sub-disc);
  const taxable=!!(db.me.tno||'').trim();
  const tax=taxable?Math.floor(base*0.1):0;
  return {sub, disc, base, taxable, tax, total:base+tax};
}

/* ---------- 状態 ---------- */
function statusOf(inv){
  if(inv.status==='paid') return {k:'paid', t:'入金済'};
  if(inv.status==='sent'){
    if(inv.due && todayISO()>inv.due) return {k:'over', t:'期限すぎ'};
    return {k:'sent', t:'送付済'};
  }
  return {k:'draft', t:'下書き'};
}

function renderList(){
  const inv=db.invoices.slice().sort((a,b)=> (b.issue||'').localeCompare(a.issue||'') || b.no.localeCompare(a.no));
  let h='';

  /* 設定が空のうちは、先に埋めてもらう。ここが空だと請求書として成立しない */
  if(!db.me.biz || !db.me.bankNo){
    h+=`<div class="card" style="border-color:var(--accent);">
      <span class="label accent">さいしょに</span>
      <p style="margin:6px 0 11px; font-size:.88rem;">屋号・住所・振込先を一度だけ入れておくと、以後の請求書に自動で入ります。<br>

  const waiting=inv.filter(x=>x.status==='sent');

  h+=`<div class="card">`;

/* 支払期限が法の枠から外れていないか、その場で言う */
function dueWarn(inv){
  if(!inv.issue||!inv.due) return '';
  const d=daysBetween(inv.issue, inv.due);
  if(d>60) return `<p class="gnote" style="color:var(--warn); margin:0;">発行日から${d}日後です。フリーランス新法 第4条では「受領日から60日以内」。${fmtJP(addDays(inv.issue,60))} までに縮めてください。</p>`;
  if(d<0)  return `<p class="gnote" style="color:var(--warn); margin:0;">期限が発行日より前になっています。</p>`;
  return `<p class="gnote" style="margin:0;">発行日から${d}日後。フリーランス新法 第4条（受領日から60日以内）の枠内です。</p>`;
}

/* =========================== 操作 =========================== */
document.addEventListener('click', e=>{
  const btn=e.target.closest('[data-act]'); if(!btn) return;
  const act=btn.dataset.act;
  const inv=cur();

  if(act==='new'){
    const x=newInvoice();
    db.invoices.push(x); bumpSerial(x.issue); save();
    curId=x.id; view='edit'; render(); return;
  }
  if(act==='open'){ curId=btn.dataset.id; view='edit'; render(); return; }
  if(act==='go-set'){ view='set'; render(); return; }
  if(act==='set-done'){ view='list'; render(); return; }

  if(!inv) return;

  if(act==='line-add'){
    inv.lines.push({id:uid(), name:'', detail:'', kind:'yen', amount:0}); save(); render(); return;
  }
  if(act==='line-del'){
    if(inv.lines.length<=1){ toast('最後の1行は消せません'); return; }
    inv.lines=inv.lines.filter(l=>l.id!==btn.dataset.id); save(); render(); return;
  }
  if(act==='notes-reset'){ inv.notes=defaultNotes(); save(); render(); toast('ひな形の文にもどしました'); return; }

  if(act==='mark-sent'){ inv.status='sent'; inv.sentAt=todayISO(); save(); render(); toast('送付済にしました'); return; }
  if(act==='mark-paid'){ inv.status='paid'; inv.paidAt=todayISO(); save(); render(); toast('入金済にしました 🎉'); return; }
  if(act==='mark-draft'){ inv.status='draft'; inv.sentAt=''; save(); render(); return; }

  if(act==='del'){
    if(!confirm(`${inv.no}（${inv.client||'宛先未記入'}）を消します。よろしいですか？`)) return;
    db.invoices=db.invoices.filter(x=>x.id!==inv.id); curId=null; save();
    view='list'; render(); toast('消しました'); return;
  }

  if(act==='preview'){
    renderSheet(inv); document.body.classList.add('previewing'); window.scrollTo(0,0); return;
  }
});

/* 入力は打った端から保存する（描き直さないのでカーソルが飛ばない） */
document.addEventListener('input', e=>{
  const el=e.target;

  if(el.dataset.me!==undefined){ db.me[el.dataset.me]=el.value; save(); return; }
  if(el.dataset.pref!==undefined){ db.prefix=el.value.trim()||'TSM-I'; save(); return; }

  const inv=cur(); if(!inv) return;

  if(el.dataset.chk!==undefined){
    if(!inv.checked) inv.checked=[false,false,false,false];
    inv.checked[Number(el.dataset.chk)]=el.checked; save();
    /* 4つ揃うと「送った」が押せるようになるので、そこだけ描き直す */
    renderEdit(); return;
  }
  if(el.dataset.line!==undefined){
    const l=inv.lines.find(x=>x.id===el.dataset.line); if(!l) return;
    const f=el.dataset.f;
    if(f==='amount') l.amount=Number(el.value||0); else l[f]=el.value;
    save();
    if(f==='amount') refreshSum();
    return;
  }
  const f=el.dataset.f; if(!f) return;
  if(f==='notesText'){ inv.notes=el.value.split('\n'); save(); return; }
  if(f==='discAmount'){ inv.discAmount=Number(el.value||0); save(); refreshSum(); return; }
  inv[f]=el.value; save();
  if(f==='issue'){
    /* 発行日を変えたら期限も追従させる（60日の枠を自分で崩さないため） */
    inv.due=addDays(inv.issue,60);
    const d=wrap.querySelector('[data-f="due"]'); if(d) d.value=inv.due;
    save(); refreshDueWarn();
  }
  if(f==='due') refreshDueWarn();
});

/* select（種別）は change で拾う。金額欄の有効/無効が変わるので描き直す */
document.addEventListener('change', e=>{
  const el=e.target;
  if(el.dataset.me==='bankType'){ db.me.bankType=el.value; save(); return; }
  const inv=cur(); if(!inv) return;
  if(el.dataset.line!==undefined && el.dataset.f==='kind'){
    const l=inv.lines.find(x=>x.id===el.dataset.line); if(!l) return;
    l.kind=el.value; if(l.kind!=='yen') l.amount=0;
    save(); renderEdit(); return;
  }
});

/* 合計だけ差し替える（入力中に全体を描き直すとカーソルが飛ぶ） */
function refreshSum(){
  const inv=cur(); if(!inv) return;
  const c=calc(inv), box=wrap.querySelector('.sum'); if(!box) return;
  box.innerHTML=`
    <div class="r"><span>小計</span><span class="v">${yen(c.sub)}</span></div>
    ${c.disc?`<div class="r"><span>${esc(inv.discLabel||'値引き')}</span><span class="v">− ${yen(c.disc)}</span></div>`:''}
    ${c.taxable?`<div class="r"><span>消費税等（10%）</span><span class="v">${yen(c.tax)}</span></div>`
               :`<div class="r"><span>消費税等</span><span class="v">加算なし（免税事業者）</span></div>`}
    <div class="r total"><span>ご請求金額</span><span class="v">${yen(c.total)}</span></div>`;
}
/* 期限の注意書きだけ差し替える。入れ物は常に残しておき、中身（文と色）を入れ替える */
function refreshDueWarn(){
  const inv=cur(); if(!inv) return;
  const box=wrap.querySelector('#dueWarn'); if(!box) return;
  box.outerHTML=`<div id="dueWarn">${dueWarn(inv)}</div>`;
}

document.getElementById('btnBack').onclick=()=>{ view='list'; curId=null; render(); };
document.getElementById('btnSet').onclick =()=>{ view= (view==='set'?'list':'set'); render(); };
document.getElementById('pvClose').onclick=()=>{ document.body.classList.remove('previewing'); };
document.getElementById('pvPrint').onclick=()=>{ window.print(); };

render();
</script>
<!-- tsumiki-back-button -->
<style>
  #tsumikiEdge{position:fixed; top:0; bottom:0; left:0; width:22px; z-index:999;}
  #tsumikiPeek{
    position:fixed; top:50%; left:0; z-index:1001; margin-top:-23px;
    width:46px; height:46px; display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.92);
    -webkit-backdrop-filter:saturate(180%) blur(14px); backdrop-filter:saturate(180%) blur(14px);
    border:1px solid rgba(0,0,0,.06); border-radius:50%;
    box-shadow:0 6px 20px rgba(0,0,0,.18);
    color:#0071e3; font-size:24px; font-weight:600; line-height:1;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Helvetica Neue",Arial,sans-serif;
    transform:translateX(-70px) scale(.8); opacity:0; pointer-events:none;
  }
</style>
<div id="tsumikiEdge"></div>
<div id="tsumikiPeek">‹</div>
<script>
  (function(){
    var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
      || window.navigator.standalone === true;
    var fromTsumiki = false;
    try{
      if(document.referrer){
        var r = new URL(document.referrer);
        fromTsumiki = (r.origin === location.origin);
      }
    }catch(e){}
    if(!(standalone && fromTsumiki)) return;

    var peek = document.getElementById('tsumikiPeek');
    var edge = document.getElementById('tsumikiEdge');

    function goBack(){ location.href = 'index.html'; }

    /* --- 左端エッジスワイプで戻る（iOS純正の戻る操作。見えるボタンは置かない） --- */
    var sx=0, sy=0, prog=0, dragging=false, W=window.innerWidth;
    var TRIGGER = Math.min(120, W*0.32);
    window.addEventListener('resize', function(){ W=window.innerWidth; TRIGGER=Math.min(120, W*0.32); });

    function reset(){
      dragging = false; prog = 0;
      peek.style.transition = 'transform .25s ease, opacity .25s ease';
      peek.style.transform = 'translateX(-70px) scale(.8)';
      peek.style.opacity = 0;
    }
    function start(e){
      var t = e.touches ? e.touches[0] : e;
      if(t.clientX > 26) return;
      sx = t.clientX; sy = t.clientY; prog = 0; dragging = true;
      peek.style.transition = 'none';
    }
    function move(e){
      if(!dragging) return;
      var t = e.touches ? e.touches[0] : e;
      var dx = t.clientX - sx, dy = t.clientY - sy;
      if(Math.abs(dy) > Math.abs(dx) + 12){ reset(); return; }
      if(dx < 0) dx = 0;
      prog = Math.min(dx / TRIGGER, 1);
      peek.style.transform = 'translateX(' + (-70 + prog*82) + 'px) scale(' + (0.8 + prog*0.2) + ')';
      peek.style.opacity = prog;
      if(dx > 6 && e.cancelable) e.preventDefault();
    }
    function end(){
      if(!dragging) return;
      dragging = false;
      if(prog >= 0.999){
        peek.style.transition = 'transform .25s ease, opacity .25s ease';
        peek.style.transform = 'translateX(20px) scale(1.05)';
        peek.style.opacity = 1;
        goBack();
      }else{
        reset();
      }
    }
    edge.addEventListener('touchstart', start, {passive:true});
    window.addEventListener('touchmove', move, {passive:false});
    window.addEventListener('touchend', end, {passive:true});
    window.addEventListener('touchcancel', end, {passive:true});
  })();
</script>
<!-- /tsumiki-back-button -->
</body>
