<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="apple-touch-icon" href="icons/icon-genka.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="げんか">
<meta name="theme-color" content="#f5f4f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f0d07" media="(prefers-color-scheme: dark)">
<title>げんか</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f5f4f0; --surface:#fffefb; --surface-2:#efece5; --ink:#1d1a15;
    --ink-mid:#5b554a; --ink-soft:#8f8877; --line:#e2ded4; --line-2:#d8d3c7;
    --accent:#b06f26; --accent-2:#8a5a24; --accent-wash:#f0e4d1;
    --good:#4c7a51; --good-wash:#dde9dd; --warn:#b0522a; --warn-wash:#f2e0d4;
    /* 費目の色＝和の顔料（黄土・弁柄・藍・苔・鳶・紫紺）。順番に割り当てる */
    --c1:#b07a2c; --c2:#a3523c; --c3:#4c6478; --c4:#63764e; --c5:#8a6a4e; --c6:#6a5878;
    --shadow:0 1px 2px rgba(40,32,18,.05), 0 10px 26px -16px rgba(40,32,18,.18);
    /* 書体は他のつみきアプリと同じ丸ゴシック（Zen Maru Gothic）。
       --display は見出し・金額用、--sans は本文用。読み込めない環境では
       Hiragino Maru Gothic ProN → 通常のゴシックへ順に落ちる */
    --display:'Zen Maru Gothic',-apple-system,BlinkMacSystemFont,"Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
    --sans:'Zen Maru Gothic',-apple-system,BlinkMacSystemFont,"Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#0f0d07; --surface:#211d14; --surface-2:#2b2619; --ink:#efe8da;
      --ink-mid:#a89e8b; --ink-soft:#847c6c; --line:#36301f; --line-2:#443d2b;
      --accent:#d59a4d; --accent-2:#e0ab63; --accent-wash:#362a19;
      --good:#7fae82; --good-wash:#23301f; --warn:#d9825a; --warn-wash:#39251a;
      --c1:#d5a055; --c2:#cb7b62; --c3:#7d9bb4; --c4:#94ab79; --c5:#c0a180; --c6:#a08cb2;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 30px -18px rgba(0,0,0,.65);
    }
  }
  :root[data-theme="light"]{
    --paper:#f5f4f0; --surface:#fffefb; --surface-2:#efece5; --ink:#1d1a15;
    --ink-mid:#5b554a; --ink-soft:#8f8877; --line:#e2ded4; --line-2:#d8d3c7;
    --accent:#b06f26; --accent-2:#8a5a24; --accent-wash:#f0e4d1;
    --c1:#b07a2c; --c2:#a3523c; --c3:#4c6478; --c4:#63764e; --c5:#8a6a4e; --c6:#6a5878;
    --shadow:0 1px 2px rgba(40,32,18,.05), 0 10px 26px -16px rgba(40,32,18,.18);
  }
  :root[data-theme="dark"]{
    --paper:#0f0d07; --surface:#211d14; --surface-2:#2b2619; --ink:#efe8da;
    --ink-mid:#a89e8b; --ink-soft:#847c6c; --line:#36301f; --line-2:#443d2b;
    --accent:#d59a4d; --accent-2:#e0ab63; --accent-wash:#362a19;
    --c1:#d5a055; --c2:#cb7b62; --c3:#7d9bb4; --c4:#94ab79; --c5:#c0a180; --c6:#a08cb2;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 30px -18px rgba(0,0,0,.65);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink); font-family:var(--sans);
    line-height:1.6; -webkit-font-smoothing:antialiased; font-feature-settings:"palt" 1; -webkit-text-size-adjust:100%;
  }
  .tnum{font-variant-numeric:tabular-nums;}

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--paper) 88%, transparent);
    backdrop-filter:saturate(1.3) blur(10px); -webkit-backdrop-filter:saturate(1.3) blur(10px);
    border-bottom:1px solid var(--line); padding:calc(env(safe-area-inset-top) + 12px) 18px 12px;
    display:flex; align-items:center; gap:10px;
  }
  .brand{display:flex; align-items:center; gap:10px; min-width:0;}
  .brand .cube{
    width:22px; height:22px; flex:none;
    background:
      linear-gradient(var(--accent),var(--accent)) left top/9px 9px no-repeat,
      linear-gradient(var(--accent),var(--accent)) right top/9px 9px no-repeat,
      linear-gradient(var(--accent-2),var(--accent-2)) center bottom/9px 9px no-repeat;
  }
  .brand h1{font-family:var(--display); font-weight:600; font-size:1.1rem; margin:0; letter-spacing:.02em; white-space:nowrap;}
  .spacer{flex:1;}
  /* 合計が画面の外に出たら、ここに小さく出る */
  .mini{
    font-family:var(--display); font-weight:500; font-size:1.02rem; color:var(--ink); flex:none;
    opacity:0; transform:translateY(5px); transition:opacity .2s ease, transform .2s ease;
    white-space:nowrap; pointer-events:none;
  }
  .mini.show{opacity:1; transform:none;}
  .mini u{
    font-family:var(--sans); font-size:.68rem; font-weight:700; color:var(--ink-soft);
    text-decoration:none; margin-right:5px; letter-spacing:.04em;
  }
  .sync-dot{width:8px; height:8px; border-radius:50%; background:var(--ink-soft); flex:none;}
  .sync-dot.ok{background:var(--good);} .sync-dot.off{background:var(--accent);}

  /* ---------- layout ---------- */
  main{max-width:600px; margin:0 auto; padding:16px 16px calc(env(safe-area-inset-bottom) + 44px); display:grid; gap:15px;}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow); padding:18px 19px;}
  .label{font-size:.74rem; font-weight:700; letter-spacing:.06em; color:var(--accent-2);}
  @media (min-width:1080px){ main{max-width:860px;} }

  /* ---------- 結果カード（答えの台紙） ---------- */
  .hero{padding:16px 19px 19px;}
  .hero-h{display:flex; align-items:center; gap:10px;}
  .hero-h .cap{font-size:.78rem; font-weight:700; color:var(--ink-soft); letter-spacing:.04em; min-width:0;}

  /* 月／年の切り替え（主役の数字より控えめに） */
  .viewseg{
    margin-left:auto; flex:none; display:flex; background:var(--surface-2);
    border:1px solid var(--line); border-radius:999px; padding:2px;
  }
  .viewseg button{
    border:none; background:transparent; border-radius:999px; padding:6px 13px;
    font-family:var(--sans); font-size:.82rem; font-weight:700; color:var(--ink-soft); cursor:pointer;
  }
  .viewseg button.on{background:var(--surface); color:var(--accent-2); box-shadow:0 1px 2px rgba(40,32,18,.10);}
  .viewseg button:active, .useg button:active{transform:scale(.96);}

  /* ---------- 合計 ---------- */
  .total{margin:6px 0 0;}
  .total .big{
    display:block; font-family:var(--display); font-weight:500; color:var(--ink); line-height:1.1;
    font-size:clamp(2.1rem, 12.5vw, 3.2rem); letter-spacing:-.01em;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .total .sub{font-size:.83rem; color:var(--ink-soft); margin-top:5px;}
  .total .big.zero{color:var(--line-2);}   /* まだ答えではない、と分かる薄さ */
  @keyframes bump{from{opacity:.45; transform:translateY(2px);} to{opacity:1; transform:none;}}
  .total .big.bump{animation:bump .26s ease-out;}
  @media (prefers-reduced-motion: reduce){ .total .big.bump{animation:none;} }
  .bd-empty{
    margin:15px 0 0; padding-top:14px; border-top:1px solid var(--line);
    font-size:.82rem; color:var(--ink-soft); line-height:1.6;
  }

  /* ---------- 内訳（帯グラフ＋凡例） ---------- */
  .band{
    display:flex; height:11px; border-radius:999px; overflow:hidden;
    background:var(--surface-2); margin:15px 0 3px;
  }
  .band i{display:block; height:100%;}
  .band i + i{box-shadow:inset 1.5px 0 0 var(--surface);}   /* 隣り合う色の境目 */
  .lg{display:grid;}
  .lg-row{
    display:flex; align-items:center; gap:9px;
    padding:8px 0; border-top:1px solid var(--line);
  }
  .lg-row .dot{width:9px; height:9px; border-radius:3px; flex:none;}
  .lg-row .n{
    font-size:.87rem; font-weight:600; min-width:0; color:var(--ink-mid);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .lg-row .p{margin-left:auto; font-size:.76rem; color:var(--ink-soft); flex:none;}
  .lg-row .v{font-family:var(--display); font-weight:500; font-size:1rem; flex:none; text-align:right;}

  /* ---------- 入力 ---------- */
  .cat-h{display:flex; align-items:center; gap:9px; margin:0 0 11px; min-width:0;}
  .cat-h h2{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .cat-h .dot{width:9px; height:9px; border-radius:3px; flex:none;}
  .cat-h h2{font-family:var(--display); font-size:1.16rem; font-weight:600; margin:0; letter-spacing:.03em;}
  .cat-h .csum{margin-left:auto; font-family:var(--display); font-weight:500; font-size:.88rem; color:var(--ink-soft);}
  .cat-h .csum.zero{color:var(--line-2);}
  /* 明細は「箱」ではなく罫線で区切る。カード＞箱＞入力欄 の三重を二重に落とす */
  .items{display:grid;}
  .item{padding:11px 0 12px; border-top:1px solid var(--line); display:grid; gap:8px;}
  .items > .item:first-child{border-top:none; padding-top:1px;}
  .item .r1{display:flex; align-items:center; gap:6px; min-width:0;}
  .item .nm{
    flex:1; min-width:0; border:none; background:transparent; padding:2px 0;
    font-family:var(--sans); font-size:16px; font-weight:600; color:var(--ink-mid);
  }
  .item .nm::placeholder{font-weight:400;}
  .item .nm:focus{outline:none; box-shadow:0 1.5px 0 var(--accent);}
  .item .del{
    flex:none; width:40px; height:38px; margin:-4px -10px -4px 0; border:none; background:none;
    color:var(--ink-soft); font-size:1.05rem; line-height:1; cursor:pointer; padding:0; opacity:.5;
  }
  .item .del:active{transform:scale(.88); opacity:1;}
  .item .r2{display:flex; align-items:center; gap:8px; min-width:0;}
  /* ¥ は欄の外に浮かせず、欄の一部にする */
  .fld{
    flex:1; min-width:0; display:flex; align-items:center; gap:6px;
    background:var(--surface-2); border:1.5px solid var(--line); border-radius:10px; padding:0 11px;
  }
  .fld:focus-within{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-wash);}
  .fld .yen{flex:none; color:var(--ink-soft); font-size:.95rem;}
  .fld .amt{
    flex:1; min-width:0; border:none; background:transparent; outline:none;
    padding:10px 0; font-size:16px; font-weight:500; color:var(--ink); font-family:var(--sans);
    text-align:right; font-variant-numeric:tabular-nums;
  }
  .useg{flex:none; display:flex; background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:2px;}
  .useg button{
    border:none; background:transparent; border-radius:8px; padding:7px 10px;
    font-family:var(--sans); font-size:.79rem; font-weight:700; color:var(--ink-soft); cursor:pointer;
  }
  .useg button.on{
    background:var(--surface); color:var(--accent-2);
    box-shadow:0 1px 2px rgba(40,32,18,.10), inset 0 0 0 1px var(--line-2);
  }
  /* 計算する行（時給×時間・取得価格÷耐用年数）。
     上の段にかけ算/わり算の材料、下の段に「＝ いくら」を出す */
  .fld .suf{flex:none; color:var(--ink-soft); font-size:.78rem; white-space:nowrap;}
  .item .times{flex:none; color:var(--ink-soft); font-size:.92rem; font-weight:700;}
  .item .r3{display:flex; align-items:center; gap:8px; min-width:0;}
  .item .unitfix{font-size:.79rem; font-weight:700; color:var(--ink-soft); padding:7px 3px;}
  .item .calc{
    margin-left:auto; font-family:var(--display); font-weight:500; font-size:1rem;
    color:var(--ink); font-variant-numeric:tabular-nums; white-space:nowrap;
  }
  .item .calc.zero{color:var(--line-2);}
  /* 追加は「＋」ひとつ。押したときだけ、どの入れ方かを選ばせる
     （3つのボタンを常に並べると、カードごとに賑やかになりすぎる） */
  .adds{margin-top:12px; display:grid; gap:7px;}
  .additem{
    width:100%; border:1.5px dashed var(--line-2); background:transparent; border-radius:11px;
    padding:10px; font-family:var(--sans); font-size:.85rem; font-weight:700; color:var(--ink-soft); cursor:pointer;
  }
  .additem:active{background:var(--surface-2);}
  .addpick{display:grid; gap:7px; padding:9px; border:1.5px dashed var(--line-2); border-radius:11px;}
  .addpick[hidden]{display:none;}
  .addpick button{
    width:100%; border:1px solid var(--line); background:var(--surface-2); border-radius:9px;
    padding:11px 12px; font-family:var(--sans); font-size:.87rem; font-weight:700; color:var(--ink-mid);
    cursor:pointer; text-align:left;
  }
  .addpick button:active{background:var(--accent-wash); color:var(--accent-2);}
  .addpick button u{display:block; font-size:.74rem; font-weight:400; color:var(--ink-soft); text-decoration:none; margin-top:2px;}

  .btn{
    width:100%; border:none; border-radius:13px; padding:14px; font-weight:700; font-size:1rem;
    font-family:var(--sans); cursor:pointer; color:#fff; background:linear-gradient(155deg,var(--accent),var(--accent-2));
  }
  .btn:active{transform:scale(.98);}
  .btn.ghost{background:none; color:var(--ink-mid); border:1.5px solid var(--line-2);}
  .note{font-size:.78rem; color:var(--ink-soft); margin:11px 2px 0; line-height:1.55;}
  .linkbtn{
    display:block; margin:-3px auto 0; padding:11px 16px; background:none; border:none;
    font-family:var(--sans); font-size:.8rem; font-weight:700; color:var(--ink-soft);
    text-decoration:underline; text-underline-offset:3px; cursor:pointer;
  }
  .linkbtn:active{color:var(--warn);}

  .toast{
    position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 22px); transform:translate(-50%,14px);
    background:var(--ink); color:var(--paper); padding:10px 16px; border-radius:99px; font-size:.85rem;
    font-weight:700; opacity:0; pointer-events:none; transition:.22s; z-index:50;
  }
  .toast.show{opacity:1; transform:translate(-50%,0);}

  /* ---------- PDF（印刷）用のシート ----------
     ⚠️ 印刷用の見た目は @media print の外に置く。中に入れると画面では高さを測れず、
        「A4縦1枚に収まるか」を判定できない（fitSheet() が採寸に使う）。
        表示の切り替えだけを @media print と .measuring で行う。
     大きさはすべて --u（＝基準の文字サイズ・px）のかけ算で書く。
     fitSheet() が --u を小さくするだけで、余白も文字も同じ比率で縮む。
     mm や pt で直書きすると縮まず、はみ出した1行のために2枚目ができる。
     行の間の詰め具合も変数（--pr など）にしてある。項目が多いときは
     まず**行間だけ**を詰め（.tight）、それでも入らないときに文字を縮める。
     文字の大きさは最後に手をつける＝紙に出したとき読めることを優先する。 */
  .sheet{display:none;}
  .sheet.measuring{
    display:block !important;
    position:fixed; top:0; left:-9999px;   /* 画面には出さない。採寸のためだけに置く */
    width:182mm;                            /* A4縦(210mm) − 左右余白14mm×2 */
  }
  @media print{
    @page{size:A4 portrait; margin:15mm 14mm;}
    body{background:#fff; color:#000;}
    .topbar, main, .toast, #tsumikiEdge, #tsumikiPeek{display:none !important;}
    .sheet{display:block !important;}
    /* ⚠️ 紙の中身の幅を自分で決める（＝画面の幅に左右されない）。
       iPhone の Safari は、印刷のとき「画面の幅（例:390px）で組んだものを紙幅まで
       引き伸ばす」。幅を決めておかないと、パソコンでは1枚でも iPhone では字が
       大きく組まれて縦にあふれ、2枚目ができる。182mm＝A4の本文幅（210−14×2）で、
       採寸に使う .sheet.measuring と同じ値。両者は必ず一致させること。 */
    .sheet{width:182mm; margin:0 auto;}
    /* 文字の自動拡大も止める（iOS は印刷時に本文を勝手に大きくすることがある） */
    html, body{-webkit-text-size-adjust:none; text-size-adjust:none;}
  }
  .sheet{
    --u:13.33px;                            /* 10pt 相当。fitSheet() が上書きする */
    --lh:1.45;                              /* 行の高さ */
    --pr:.62;                               /* 各行の上下の余白 */
    --pc:1.42;                              /* 分類の行の上の空き（かたまりの区切り） */
    --gs:2.27;                              /* 合計の箱の上の空き */
    --gs2:1.98;                             /*      同じ箱の下の空き */
    --ps:1.42;                              /*      箱の中の上下の余白 */
    --gf:2.27;                              /* 注意書きの上の空き */
    font-family:var(--display); color:#000; font-size:var(--u); line-height:var(--lh);
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }
  /* 項目が多いとき。文字の大きさは変えず、たての空きだけを詰める */
  .sheet.tight{--lh:1.28; --pr:.3; --pc:.72; --gs:1.1; --gs2:1.0; --ps:.9; --gf:1.1;}
  .sheet .sh-h{
    display:flex; align-items:center; gap:calc(.95*var(--u));
    border-bottom:2px solid #000; padding-bottom:calc(.6*var(--u)); margin-bottom:calc(.3*var(--u));
  }
  /* つみきのしるし（積み木3つ）。線だけで描いてあるので紙でも潰れず、
     --u に合わせて題字と一緒に縮む。画像ではなくSVG＝どの大きさでも輪郭がぼけない */
  .sheet .sh-logo{
    width:calc(2.9*var(--u)); height:calc(2.9*var(--u)); flex:none;
    fill:none; stroke:#000; stroke-width:4.2; stroke-linejoin:round; stroke-linecap:round;
  }
  .sheet .sh-hx{flex:1; min-width:0;}
  .sheet h1{font-size:calc(1.9*var(--u)); margin:0; font-weight:600; letter-spacing:.04em;}
  .sheet .sh-meta{font-size:calc(.9*var(--u)); color:#444; margin-top:calc(.3*var(--u)); display:flex;}
  .sheet .sh-meta .r{margin-left:auto;}
  .sheet .sh-sum{
    display:flex; gap:calc(2.8*var(--u));
    margin:calc(var(--gs)*var(--u)) 0 calc(var(--gs2)*var(--u)); padding:calc(var(--ps)*var(--u)) calc(1.7*var(--u));
    border:1.2pt solid #000; border-radius:2mm;
  }
  .sheet .sh-sum div{flex:1;}
  .sheet .sh-sum span{display:block; font-size:calc(.85*var(--u)); color:#444; letter-spacing:.06em;}
  .sheet .sh-sum b{display:block; font-size:calc(1.7*var(--u)); font-weight:600; margin-top:calc(.28*var(--u));}
  .sheet table{width:100%; border-collapse:collapse; font-size:var(--u);}
  .sheet thead th{
    text-align:right; font-size:calc(.85*var(--u)); font-weight:600; color:#444; letter-spacing:.06em;
    border-bottom:1pt solid #000; padding:0 0 calc(.57*var(--u));
  }
  .sheet thead th:first-child{text-align:left;}
  .sheet td{padding:calc(var(--pr)*var(--u)) 0; border-bottom:.4pt solid #ccc; text-align:right; font-variant-numeric:tabular-nums;}
  .sheet td:first-child{text-align:left;}
  /* 行のクラスは sh- を付ける。画面用の .item（角丸のベージュ箱・display:grid）が
     印刷シートの <tr> にも当たって表が崩れるため（2026-08-11 検証で発覚）。 */
  .sheet tr.sh-cat td{
    border-bottom:.6pt solid #666; padding-top:calc(var(--pc)*var(--u)); font-weight:600; font-size:calc(1.05*var(--u));
  }
  .sheet tr.sh-item td:first-child{padding-left:calc(1.42*var(--u)); color:#222;}
  .sheet tr.sh-item td{font-size:calc(.95*var(--u)); color:#222;}
  .sheet tr.sh-grand td{border-top:1.2pt solid #000; border-bottom:none; padding-top:calc(.85*var(--u)); font-size:calc(1.2*var(--u)); font-weight:600;}
  .sheet tr.sh-cat, .sheet tr.sh-item{break-inside:avoid;}
  .sheet .sh-unit{color:#888; font-size:calc(.8*var(--u));}
  .sheet .sh-f{

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* =========================================================================
   げんか — つみき事業の原価を、月ごと／年ごとに出してPDFにする。

   設計のねらい:
     - 項目ごとに「月額で入れるか／年額で入れるか」を選べる。パソコンのように
       年に一度のものを月額に直す暗算をさせない。内部は必ず月額に正規化して持つ。
     - 数字はすべて本人が入れる。過去の実測値や相場を既定値として入れない
       （2026-08-11 本人指定：完全に無の状態から始める）。
     - 項目には3種類ある。
         kind:'amt'  金額をそのまま入れる
         kind:'rate' 時給 × 想定稼働時間（人件費用）
         kind:'life' 取得価格 ÷ 耐用年数（パソコンなど、何年か使うもの）
       計算する2種類は答えを保存せず、材料（rate/hours, cost/years）だけを持って
       表示のたびに計算する＝片方だけ直したときに古い答えが残らない。
       life は性質上いつも年額なので unit は 'y' に固定する。

   同期の設計（⚠️ここは事故の再発防止が本体）:
     - iPhone と MacBook で同じ Supabase の1行（kodai_genka_v1）を共有する。
     - 採用は **ドキュメント丸ごと置換ではなく、項目id単位の和集合マージ**。
       全置換にすると、片方の端末が未送信のまま他方が保存した瞬間に
       相手の入力が丸ごと消える（credit で実際に起きた事故）。
       → Knowledge/supabase-sync-whole-doc-data-loss.md
     - 和集合だけだと「消したものが甦る」ので、削除は tombstone（del）で表す。
     - 最初から入っている7項目は **固定id**。両方の端末がまっさらから始めても
       同じidなので、マージで7項目が14項目に増えない。
   ========================================================================= */

const KEY = 'tsumiki_genka_v1';

/* ===================== Supabase（つみき共通プロジェクト） ===================== */
const SUPABASE_URL  = 'https://okbjqtdirrathscctyvx.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9rYmpxdGRpcnJhdGhzY2N0eXZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzMjI4NTIsImV4cCI6MjA5NTg5ODg1Mn0.T-1AOK6vCD6uGdqrVGXjPui3L6WPSNrnygS-IHyfZ6Y';
const sb = (window.supabase && window.supabase.createClient) ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON) : null;
const STATE_TABLE = 'tsumiki_roadmap_state';
const STATE_ID    = 'kodai_genka_v1';   /* 時給計算・自由帳とは別の行 */

const nowISO = () => new Date().toISOString();
const uid = () => Date.now().toString(36) + Math.floor(Math.random()*1e6).toString(36);

/* まだ誰も触っていない印。
   ⚠️ 初期項目の upd を「現在時刻」にすると、まっさらな2台目を開いた瞬間に
   その空っぽの項目が1台目の実データより新しいと判定され、金額を消してしまう。
   初期値は常に最古にして、実際に編集されたものが必ず勝つようにする。 */
const EPOCH = '1970-01-01T00:00:00.000Z';

/* 初期の骨組み。金額は空。名前は書き換えられる。
   id は固定（端末をまたいでも同じ項目として突き合わせるため）。
   t を渡すのは「ぜんぶ空にする」のときだけ＝その操作は他の端末にも伝える。 */
function seed(t){
  t = t || EPOCH;
  return {
    v: 2,
    view: 'm',
    updatedAt: t,
    del: {},
    cats: [
      {id:'infra', name:'インフラ', upd:t, items:[
        it0('rent', '家賃（ライフライン＋ネット込）', 'amt', 'm', t),
      ]},
      {id:'aihw', name:'AI・ハードウェア', upd:t, items:[
        it0('ai',  'AIサブスク',               'amt',  'm', t),
        it0('pc',  'パソコン',                 'life', 'y', t),
        it0('acc', 'アクセサリー類（まとめて）', 'amt',  'y', t),
      ]},
      {id:'labor', name:'人件費', upd:t, items:[
        it0('salary', '自分の人件費',           'rate', 'm', t),
        it0('extra',  '残業・追加作業の見込み',  'amt',  'm', t),
      ]},
      {id:'sales', name:'営業費', upd:t, items:[
        it0('hearing', 'ヒアリング費用（交通費＋飲食の上限）', 'amt', 'm', t),
      ]},
    ],
  };
}
/* 空の項目1つぶん。持ち物（amt/rate/hours/cost/years）は全部そろえておく＝
   端末どうしで形が食い違わない */
function it0(id, name, kind, unit, t){
  return {id, name, kind, amt:'', rate:'', hours:'', cost:'', years:'', unit, upd:t};
}

/* ---- 形をそろえる（旧v1＝idなしの保存からの引き上げも兼ねる） ---- */
function normalize(o){
  const base = seed();
  if(!o || typeof o !== 'object' || !Array.isArray(o.cats)) return base;
  const t = nowISO();
  const s = {
    v: 2,
    view: (o.view === 'y') ? 'y' : 'm',
    updatedAt: typeof o.updatedAt === 'string' ? o.updatedAt : t,
    del: (o.del && typeof o.del === 'object') ? {...o.del} : {},
    cats: [],
  };
  o.cats.forEach((c, ci) => {
    if(!c || typeof c !== 'object') return;
    const bc = base.cats[ci];
    const cat = {
      id: typeof c.id === 'string' && c.id ? c.id : (bc ? bc.id : 'cat' + ci),
      name: typeof c.name === 'string' ? c.name : (bc ? bc.name : ''),
      upd: typeof c.upd === 'string' ? c.upd : t,
      items: [],
    };
    (Array.isArray(c.items) ? c.items : []).forEach((it, ii) => {
      if(!it || typeof it !== 'object') return;
      const bi = bc && bc.items[ii];
      const id = typeof it.id === 'string' && it.id ? it.id : (bi ? bi.id : uid());
      const amt = typeof it.amt === 'string' ? it.amt : (it.amt == null ? '' : String(it.amt));
      /* 旧データ（kind が無い）の引き上げ。初期からある2項目だけ、計算する行に
         切り替える（人件費＝時給×時間、パソコン＝取得価格÷耐用年数）。
         ⚠️ 入っていた金額は消さない。パソコンは amt をそのまま残したうえで
         取得価格(cost)にも写す。古い版が残っている端末（ホーム画面のPWAは
         しばらく前の版を掴んでいることがある）で 0円 に見えないようにするため。 */
      const KINDS = {rate:1, life:1, amt:1};
      const kind = KINDS[it.kind] ? it.kind
                 : (id === 'salary' && amt === '' ? 'rate'
                 : (id === 'pc' ? 'life' : 'amt'));
      const str = (v, k) => typeof v[k] === 'string' ? v[k] : (v[k] == null ? '' : String(v[k]));
      const cost = str(it, 'cost') || (kind === 'life' && !KINDS[it.kind] ? amt : '');
      cat.items.push({
        id: id,
        name: typeof it.name === 'string' ? it.name : '',
        kind: kind,
        amt:  amt,
        rate:  str(it, 'rate'),
        hours: str(it, 'hours'),
        cost:  cost,
        years: str(it, 'years'),
        /* 耐用年数で割る行は、いつでも「1年あたり」。月/年の切り替えは持たない */
        unit: kind === 'life' ? 'y' : (it.unit === 'y' ? 'y' : 'm'),
        upd:  typeof it.upd === 'string' ? it.upd : t,
      });
    });
    s.cats.push(cat);
  });
  if(!s.cats.length) return base;
  return s;
}

/* ---- 和集合マージ。片方にしかない項目を消さない ----
   時刻が同着（同じミリ秒）のときは a 側を残す。呼び出しは常に mergeState(手元, 相手)
   なので「引き分けなら手元が勝つ」。人の操作が1ミリ秒差で並ぶことは実際には無い。 */
function mergeState(a, b){
  const del = {};
  [a.del, b.del].forEach(d => { for(const k in d){ if(!del[k] || d[k] > del[k]) del[k] = d[k]; } });

  const byId = {}, order = [];
  [a, b].forEach(s => s.cats.forEach(c => {
    if(!byId[c.id]){ byId[c.id] = {id:c.id, name:c.name, upd:c.upd, items:[]}; order.push(c.id); }
    else if((c.upd || '') > (byId[c.id].upd || '')){ byId[c.id].name = c.name; byId[c.id].upd = c.upd; }
  }));

  [a, b].forEach(s => s.cats.forEach(c => {
    const tgt = byId[c.id];
    c.items.forEach(it => {
      const ex = tgt.items.find(x => x.id === it.id);
      if(!ex) tgt.items.push({...it});
      else if((it.upd || '') > (ex.upd || '')) Object.assign(ex, it);
    });
  }));

  /* 削除の適用。ただし削除より後に編集された項目は生き残らせる（消し合いの競合対策） */
  order.forEach(id => {
    const c = byId[id];
    c.items = c.items.filter(it => !(del[it.id] && !((it.upd || '') > del[it.id])));
  });

  /* 古いtombstoneは捨てる（無限に増やさない。半年で十分） */
  const limit = new Date(Date.now() - 180*86400000).toISOString();
  const del2 = {};
  for(const k in del) if(del[k] > limit) del2[k] = del[k];

  const newer = ((a.updatedAt || '') >= (b.updatedAt || '')) ? a : b;
  return { v:2, view:newer.view, updatedAt:newer.updatedAt, del:del2, cats:order.map(id => byId[id]) };
}

/* 内容の指紋。updatedAt を除くので「中身が同じなら押し戻さない」判定に使える */
function sig(s){
  return JSON.stringify({
    view: s.view, del: s.del,
    cats: s.cats.map(c => [c.id, c.name,
      c.items.map(i => [i.id, i.name, i.kind, i.amt, i.rate, i.hours, i.cost, i.years, i.unit])]),
  });
}

let S = normalize(loadLocal());
let online = null;
let pending = null;      /* 入力中に届いたリモート。手が止まったら反映する */

function loadLocal(){
  try{ const raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
}
function saveLocal(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
}

/* ---- 保存（ローカルは即時、クラウドは350msまとめて） ---- */
let saveTimer = null, lastPushedSig = '';
function save(){
  S.updatedAt = nowISO();
  saveLocal();
  if(!sb) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(push, 350);
}
async function push(){
  if(!sb) return;
  lastPushedSig = sig(S);
  const { error } = await sb.from(STATE_TABLE)
    .upsert({ id:STATE_ID, state:S, updated_at:nowISO() });
  online = !error;
  renderSync();
}
/* 画面を閉じる直前の取りこぼしを減らす */
function flushSave(){ if(saveTimer){ clearTimeout(saveTimer); saveTimer = null; push(); } }
window.addEventListener('pagehide', flushSave);
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'hidden') flushSave(); });

/* ---- 受け取り。必ずマージしてから採用し、相手に足りなければ押し戻す ---- */
function adopt(remoteRaw){
  const remote = normalize(remoteRaw);
  const merged = mergeState(S, remote);
  S = merged;
  saveLocal();
  /* ⚠️ 中身が同じでも必ず画面を作り直す（2026-08-12 のバグ）。
     mergeState は項目の入れ物（オブジェクト）を作り直すので、作り直さないと
     入力欄のイベントは「もう S にいない古い入れ物」に書き込み続ける。
     ＝打っても保存されない・合計に入らない。見た目が同じでも作り直すこと。
     入力中に走らせると文字が消えるので、呼ぶ側が typing() で止めている。 */
  paintView(); renderCats(); recalc();
  /* マージ結果がリモートより豊かなら押し戻す＝どれか1台に残っていれば自己修復 */
  if(sig(merged) !== sig(remote)){ S.updatedAt = nowISO(); saveLocal(); push(); }
}

function typing(){
  const a = document.activeElement;
  return !!(a && /INPUT|TEXTAREA/.test(a.tagName));
}

async function loadRemote(){
  if(!sb){ online = false; renderSync(); return; }
  const { data, error } = await sb.from(STATE_TABLE).select('state').eq('id', STATE_ID).maybeSingle();
  if(error){ online = false; renderSync(); return; }
  online = true;
  /* 開いた直後にもう打ち始めていることがある。adopt は画面を作り直すので、
     打っている最中は割り込まず、手が離れてから反映する（下の focusout） */
  if(data && data.state && typeof data.state === 'object'){
    if(typing()) pending = data.state; else adopt(data.state);
  }
  else push();                       /* まだ行が無い＝この端末の中身で作る */
  renderSync();
}

function subscribeRealtime(){
  if(!sb) return;
  sb.channel('tsumiki-genka-rt')
    .on('postgres_changes', { event:'*', schema:'public', table:STATE_TABLE, filter:'id=eq.'+STATE_ID }, payload => {
      const st = payload.new && payload.new.state;
      if(!st) return;
      if(sig(normalize(st)) === lastPushedSig) return;   /* 自分が押したものの跳ね返り */
      if(typing()){ pending = st; return; }              /* 入力中は差し込まない */
      adopt(st);
    })
    .subscribe();
}
/* 入力から手が離れたら、待たせていたリモートを反映する */
document.addEventListener('focusout', () => {
  setTimeout(() => {
    if(pending && !typing()){ const p = pending; pending = null; adopt(p); }
  }, 120);
});

function renderSync(){
  const dot = document.getElementById('syncDot');
  dot.classList.remove('ok', 'off');
  if(!sb){ dot.title = 'この端末に保存'; return; }
  if(online === true){ dot.classList.add('ok'); dot.title = 'クラウド同期中'; }
  else if(online === false){ dot.classList.add('off'); dot.title = 'オフライン（この端末に保存）'; }
}

/* ===================== お金の計算（内部は月額に統一） ===================== */
const num  = v => { const n = parseFloat(String(v).replace(/[^\d.-]/g,'')); return isFinite(n) ? n : 0; };

/* その項目の「入力どおりの額」。計算する行はここで計算する。
   rate: unit が m なら hours は1ヶ月ぶんの時間、y なら1年ぶんの時間。
   life: 取得価格 ÷ 耐用年数＝1年ぶん（unit は必ず y）。年数が空なら0円扱いにして
         ゼロ割り（Infinity）を作らない。 */
const val = it => {
  if(it.kind === 'rate') return num(it.rate) * num(it.hours);
  if(it.kind === 'life'){ const y = num(it.years); return y > 0 ? num(it.cost) / y : 0; }
  return num(it.amt);
};

const perM = it => it.unit === 'y' ? val(it) / 12 : val(it);
const catM = c  => c.items.reduce((s,it) => s + perM(it), 0);
const allM = () => S.cats.reduce((s,c) => s + catM(c), 0);

/* 年額は「月額×12」ではなく、年入力のものは入力値そのまま足す。
   ÷12→×12 の丸め誤差で1円ずれるのを避ける。 */
const perY = it => it.unit === 'y' ? val(it) : val(it) * 12;
const catY = c  => c.items.reduce((s,it) => s + perY(it), 0);
const allY = () => S.cats.reduce((s,c) => s + catY(c), 0);

const yen = n => '¥' + Math.round(n).toLocaleString('ja-JP');

/* 費目の色。帯グラフ・凡例・入力カードの見出しで同じ色を使い、目で結べるようにする */
const catColor = ci => 'var(--c' + (ci % 6 + 1) + ')';

/* 入力欄の表示用。保存するのは rawAmt の結果＝数字だけの文字列 */
const rawAmt = v => String(v == null ? '' : v).replace(/[^\d.]/g, '');
function fmtAmt(v){
  const s = rawAmt(v);
  if(s === '') return '';
  const [i, d] = s.split('.');
  const head = i === '' ? '0' : Number(i).toLocaleString('ja-JP');
  return d === undefined ? head : head + '.' + d;
}

/* ===================== 入力欄（追加・削除のときだけ描き直す） ===================== */
function renderCats(){
  const wrap = document.getElementById('cats');
  wrap.innerHTML = '';

  S.cats.forEach((c, ci) => {
    const sec = document.createElement('section');
    sec.className = 'card';
    sec.innerHTML =
      '<div class="cat-h"><span class="dot" style="background:' + catColor(ci) + '"></span>' +
      '<h2></h2><span class="csum tnum" data-csum="' + ci + '"></span></div>' +
      '<div class="items"></div>' +
      '<div class="adds">' +
        '<button class="additem">＋ 項目を追加</button>' +
        '<div class="addpick" hidden>' +
          '<button data-k="amt">金額を入れる<u>毎月／毎年かかる額がわかっているもの</u></button>' +
          '<button data-k="rate">時給 × 想定稼働時間<u>人の手間から出すもの</u></button>' +
          '<button data-k="life">取得価格 ÷ 耐用年数<u>パソコンなど、何年か使うもの</u></button>' +
        '</div>' +
      '</div>';

    sec.querySelector('h2').textContent = c.name;

    const list = sec.querySelector('.items');
    c.items.forEach(it => list.appendChild(itemEl(c, it)));

    /* ＋ を押したときだけ、どの入れ方かを選ばせる */
    const pick = sec.querySelector('.addpick');
    const plus = sec.querySelector('.additem');
    plus.addEventListener('click', () => {
      pick.hidden = !pick.hidden;
      plus.textContent = pick.hidden ? '＋ 項目を追加' : '× 閉じる';
    });
    pick.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
      const k = b.dataset.k;
      c.items.push({id:uid(), name:'', kind:k, amt:'', rate:'', hours:'', cost:'', years:'',
                    unit:(k === 'life' ? 'y' : 'm'), upd:nowISO()});
      save(); renderCats(); recalc();
    }));

    wrap.appendChild(sec);
  });
}

function itemEl(cat, it){
  const rate = (it.kind === 'rate'), life = (it.kind === 'life');
  const el = document.createElement('div');
  el.className = 'item';
  el.innerHTML =
    '<div class="r1">' +
      '<input class="nm" type="text" placeholder="項目の名前">' +
      '<button class="del" aria-label="この項目を消す">×</button>' +
    '</div>' +
    (rate
      /* 時給の行は2段。上でかけ算の材料、下で「月額か年額か」と答え */
      ? '<div class="r2">' +
          '<div class="fld"><span class="yen">¥</span>' +
            '<input class="amt f-rate" type="text" inputmode="decimal" placeholder="0" aria-label="時給">' +
            '<span class="suf">/時</span></div>' +
          '<span class="times">×</span>' +
          '<div class="fld">' +
            '<input class="amt f-hours" type="text" inputmode="decimal" placeholder="0" aria-label="想定稼働時間">' +
            '<span class="suf hsuf">時間</span></div>' +
        '</div>' +
        '<div class="r3">' +
          '<div class="useg">' +
            '<button data-u="m">月額</button><button data-u="y">年額</button>' +
          '</div>' +
          '<span class="calc tnum" data-calc="' + it.id + '"></span>' +
        '</div>'
    : life
      /* 耐用年数の行も2段。答えはいつも「1年あたり」なので月/年の切り替えは出さない */
      ? '<div class="r2">' +
          '<div class="fld"><span class="yen">¥</span>' +
            '<input class="amt f-cost" type="text" inputmode="decimal" placeholder="0" aria-label="取得価格"></div>' +
          '<span class="times">÷</span>' +
          '<div class="fld">' +
            '<input class="amt f-years" type="text" inputmode="decimal" placeholder="0" aria-label="耐用年数">' +
            '<span class="suf">年</span></div>' +
        '</div>' +
        '<div class="r3">' +
          '<span class="unitfix">1年あたり</span>' +
          '<span class="calc tnum" data-calc="' + it.id + '"></span>' +
        '</div>'
      : '<div class="r2">' +
          '<div class="fld"><span class="yen">¥</span>' +
            '<input class="amt" type="text" inputmode="decimal" placeholder="0"></div>' +
          '<div class="useg">' +
            '<button data-u="m">月額</button><button data-u="y">年額</button>' +
          '</div>' +
        '</div>');

  const nm  = el.querySelector('.nm');
  nm.value  = it.name;

  const hsuf = el.querySelector('.hsuf');
  const paintUnit = () => {
    el.querySelectorAll('.useg button').forEach(b => b.classList.toggle('on', b.dataset.u === it.unit));
    if(hsuf) hsuf.textContent = it.unit === 'y' ? '時間/年' : '時間/月';
  };
  paintUnit();

  nm.addEventListener('input',  () => { it.name = nm.value; it.upd = nowISO(); save(); buildSheet(); });

  /* 金額は「生の数字」で持ち、手を離したときだけ 3桁区切りにして見せる。
     入力中に整形するとカーソルが末尾に飛ぶので、そこはさわらない。 */
  const bindNum = (input, key) => {
    input.value = fmtAmt(it[key]);
    input.addEventListener('input', () => { it[key] = rawAmt(input.value); it.upd = nowISO(); save(); recalc(); });
    input.addEventListener('focus', () => { input.value = it[key]; });
    input.addEventListener('blur',  () => { input.value = fmtAmt(it[key]); });
  };
  if(rate){
    bindNum(el.querySelector('.f-rate'),  'rate');
    bindNum(el.querySelector('.f-hours'), 'hours');
  }else if(life){
    bindNum(el.querySelector('.f-cost'),  'cost');
    bindNum(el.querySelector('.f-years'), 'years');
  }else{
    bindNum(el.querySelector('.amt'), 'amt');
  }

  el.querySelectorAll('.useg button').forEach(b => {
    b.addEventListener('click', () => { it.unit = b.dataset.u; it.upd = nowISO(); paintUnit(); save(); recalc(); });
  });

  el.querySelector('.del').addEventListener('click', () => {
    const i = cat.items.indexOf(it);
    if(i < 0) return;
    cat.items.splice(i, 1);
    S.del[it.id] = nowISO();          /* 墓標。これが無いと他の端末から甦る */
    save(); renderCats(); recalc();
  });

  return el;
}

/* ===================== 合計・内訳 ===================== */
/* 計算する行（時給×時間・価格÷耐用年数）の「＝ いくら」。
   合計が0のときも出したいので、recalc の早期 return より前に呼ぶ。 */
function paintCalcs(){
  S.cats.forEach(c => c.items.forEach(it => {
    if(it.kind !== 'rate' && it.kind !== 'life') return;
    const e = document.querySelector('[data-calc="' + it.id + '"]');
    if(!e) return;
    const v = val(it);
    e.textContent = v > 0 ? '＝ ' + yen(v) : '＝ —';
    e.classList.toggle('zero', !(v > 0));
  }));
}

function recalc(){
  paintCalcs();
  const m = allM(), y = allY();
  const isM = S.view === 'm';

  document.getElementById('totCap').textContent = isM ? '1ヶ月あたりの原価' : '1年あたりの原価';

  /* 合計が変わったら軽く現れ直す。ただし入力中は毎打鍵でちらつくので静かにしておく */
  const bigEl = document.getElementById('totBig'), nextBig = yen(isM ? m : y);
  if(bigEl.textContent !== nextBig && bigEl.textContent !== '' && !typing()){
    bigEl.classList.remove('bump'); void bigEl.offsetWidth; bigEl.classList.add('bump');
  }
  bigEl.textContent = nextBig;
  const sub = document.getElementById('totSub');
  sub.textContent = isM ? ('1年あたり ' + yen(y)) : ('1ヶ月あたり ' + yen(m));
  sub.style.visibility = (m > 0 || y > 0) ? 'visible' : 'hidden';   /* 0のとき「¥0」を二度言わない */

  const mini = document.getElementById('miniTot');
  mini.innerHTML = '<u>' + (isM ? '月' : '年') + '</u>' + yen(isM ? m : y);

  const total = isM ? m : y;
  const bd = document.getElementById('breakdown');
  bd.innerHTML = '';

  /* まだ何も入っていないとき。空の帯と「—」を並べるより、次にすることを言う */
  if(total <= 0){
    document.getElementById('totBig').classList.add('zero');
    bd.innerHTML = '<p class="bd-empty">下の欄に金額を入れると、ここに内訳が出ます。</p>';
    S.cats.forEach((c, ci) => {
      const t = document.querySelector('[data-csum="' + ci + '"]');
      if(t){ t.textContent = '—'; t.classList.add('zero'); }
    });
    buildSheet();
    return;
  }
  document.getElementById('totBig').classList.remove('zero');

  /* 帯グラフ＝構成比。合計に対して各費目が占める幅をそのまま並べる */
  const band = document.createElement('div');
  band.className = 'band';
  S.cats.forEach((c, ci) => {
    const v = isM ? catM(c) : catY(c);
    if(total <= 0 || v <= 0) return;
    const seg = document.createElement('i');
    seg.style.width = (v / total * 100).toFixed(2) + '%';
    seg.style.background = catColor(ci);
    band.appendChild(seg);
  });
  bd.appendChild(band);

  const lg = document.createElement('div');
  lg.className = 'lg';
  S.cats.forEach((c, ci) => {
    const v = isM ? catM(c) : catY(c);
    const p = total > 0 ? (v / total * 100) : 0;
    const row = document.createElement('div');
    row.className = 'lg-row';
    row.innerHTML =
      '<span class="dot" style="background:' + catColor(ci) + '"></span>' +
      '<span class="n"></span>' +
      '<span class="p tnum">' + (total > 0 ? p.toFixed(0) + '%' : '—') + '</span>' +
      '<span class="v tnum">' + yen(v) + '</span>';
    row.querySelector('.n').textContent = c.name;
    lg.appendChild(row);
  });
  bd.appendChild(lg);

  S.cats.forEach((c, ci) => {
    const t = document.querySelector('[data-csum="' + ci + '"]');
    if(!t) return;
    const v = isM ? catM(c) : catY(c);
    t.textContent = v > 0 ? yen(v) : '—';
    t.classList.toggle('zero', !(v > 0));
  });

  buildSheet();
}

/* ===================== 印刷（PDF）用のページ ===================== */

/* つみきのしるし。ホーム画面のアイコン（icons/icon-index.png）と同じ形＝
   積み木を3つ、下に2つ・上に1つ積んだ図を、線だけで描き直したもの。
   画像を貼らずにSVGで持つ理由は3つ。
     ①紙は画面よりずっと細かいので、PNGだと輪郭がぼやける
     ②アイコンは黒地に白の線＝紙に出すと真っ黒な四角になってしまう
     ③大きさを --u に合わせて変えても、線の太さの比が崩れない
   立方体1つは「六角形の輪郭＋中のY字」。頂点の名前は
     T=てっぺん UR/UL=上の左右 LR/LL=下の左右 B=いちばん下 C=手前の角
   の6+1点で、幅28・高さ32。下2つは左右にずらし、上の1つはその谷（0,8）に
   ぴったり載る＝3つの立方体が辺を共有して噛み合う。 */
const LOGO_SVG = (() => {
  const cube = (x, y) =>
    /* 輪郭（六角形） */
    '<path d="M' + x + ' ' + y + 'L' + (x+14) + ' ' + (y+8) + 'L' + (x+14) + ' ' + (y+24) +
      'L' + x + ' ' + (y+32) + 'L' + (x-14) + ' ' + (y+24) + 'L' + (x-14) + ' ' + (y+8) + 'Z"/>' +
    /* 中のY字＝手前の角から、上の左右と真下へ */
    '<path d="M' + x + ' ' + (y+16) + 'L' + (x-14) + ' ' + (y+8) +
      'M' + x + ' ' + (y+16) + 'L' + (x+14) + ' ' + (y+8) +
      'M' + x + ' ' + (y+16) + 'L' + x + ' ' + (y+32) + '"/>';
  return '<svg class="sh-logo" viewBox="-31 -27 62 62" aria-hidden="true">' +
         cube(-14, 0) + cube(14, 0) + cube(0, -24) + '</svg>';
})();

function buildSheet(){
  const d = new Date();
  const stamp = d.getFullYear() + '年' + (d.getMonth()+1) + '月' + d.getDate() + '日';

  let rows = '';
  S.cats.forEach(c => {
    const used = c.items.filter(it => val(it) !== 0 || it.name.trim() !== '');
    if(!used.length) return;
    rows += '<tr class="sh-cat"><td>' + esc(c.name) + '</td><td>' + yen(catM(c)) + '</td><td>' + yen(catY(c)) + '</td></tr>';
    used.forEach(it => {
      const nm = it.name.trim() || '（名前なし）';
      const per = it.unit === 'y' ? '年' : '月';
      /* 計算した行は、答えだけでなく「どう出したか」を紙にも残す */
      const tag = it.kind === 'rate'
        ? ('時給' + yen(num(it.rate)) + ' × ' + fmtAmt(it.hours || '0') + '時間/' + per)
        : it.kind === 'life'
        ? (yen(num(it.cost)) + ' ÷ ' + fmtAmt(it.years || '0') + '年')
        : (per + '額で入力');
      rows += '<tr class="sh-item"><td>' + esc(nm) + '<span class="sh-unit">　' + tag + '</span></td>' +
              '<td>' + yen(perM(it)) + '</td><td>' + yen(perY(it)) + '</td></tr>';
    });
  });
  rows += '<tr class="sh-grand"><td>合計</td><td>' + yen(allM()) + '</td><td>' + yen(allY()) + '</td></tr>';

  document.getElementById('sheet').innerHTML =
    '<div class="sh-h">' + LOGO_SVG +
    '<div class="sh-hx"><h1>つみき事業　原価表</h1>' +
    '<div class="sh-meta"><span>屋号：Tsumiki</span><span class="r">作成日：' + stamp + '</span></div></div></div>' +
    '<div class="sh-sum">' +
      '<div><span>1ヶ月あたりの原価</span><b>' + yen(allM()) + '</b></div>' +
      '<div><span>1年あたりの原価</span><b>' + yen(allY()) + '</b></div>' +
    '</div>' +
    '<table><thead><tr><th>項目</th><th>月額</th><th>年額</th></tr></thead><tbody>' + rows + '</tbody></table>' +
    '<div class="sh-f">・年額で入力した項目の月額は、年額を12で割った額です（1円未満は四捨五入）。<br>' +
    '・この表は入力した金額をそのまま集計したものです。減価償却・事業按分・税や手数料は含みません。</div>';
}

/* ---- A4縦1枚に収める ----
   紙の高さは決まっているのに、項目は増える。そこで印刷の直前に高さを測って、
   入りきる大きさまで自分で縮める。手を入れる順番は
     ①ふつうの見た目のまま → ②行間だけ詰める（.tight・文字は同じ大きさ）
     → ③それでも入らなければ文字も少しずつ小さく（下限あり）
   文字を最後にするのは、紙に出したとき読めることを優先するため。
   採寸は .measuring で画面の外にA4の本文幅で置き、scrollHeight を読む。
   ⚠️ 下限まで縮めても入らない量（項目が数十）なら、無理に1枚にしない。
      読めない1枚より読める2枚。表の見出しは2枚目にも自動で付く（thead）。 */
const SH_U0  = 13.33;   /* 基準＝10pt。ふつうの量ならこの大きさで出る */
const SH_MIN = 9.3;     /* これ以下には縮めない（約7pt） */

function fitSheet(){
  const sheet = document.getElementById('sheet');
  if(!sheet) return;

  /* mm→px の実測。ブラウザによって変わるので係数を決め打ちにしない */
  const probe = document.createElement('div');
  probe.style.cssText = 'position:fixed; left:-9999px; top:0; height:100mm;';
  document.body.appendChild(probe);
  const mm = probe.getBoundingClientRect().height / 100;
  probe.remove();

  /* A4縦(297mm) − 上下余白15mm×2。ぴったりを狙うと、書体や機種のわずかな差で
     最後の1行がこぼれて2枚目ができる。
     ⚠️ 余らせる量は多め（13mm）。iPhone の Safari は @page の余白をそのまま
        使わないことがあり、手元のパソコンで「あと1mm入る」の詰め方をすると、
        iPhone でだけ2枚目ができる。読みやすさは --u で保てるので、ここは
        安全側に振る。 */
  const avail = 267 * mm * 0.95;
  sheet.classList.remove('tight');
  sheet.style.setProperty('--u', SH_U0 + 'px');
  sheet.classList.add('measuring');

  if(sheet.scrollHeight > avail){
    /* ② 行間を詰める */
    sheet.classList.add('tight');

    /* ③ 1回の計算では行の折り返しが変わってずれるので、収まるまで数回だけ詰める */
    let u = SH_U0;
    for(let i = 0; i < 6 && u > SH_MIN; i++){
      const h = sheet.scrollHeight;
      if(h <= avail) break;
      u = Math.max(SH_MIN, u * (avail / h) * 0.995);
      sheet.style.setProperty('--u', u + 'px');
    }
  }

  sheet.classList.remove('measuring');
}

const esc = s => String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

/* ===================== 画面まわり ===================== */
document.querySelectorAll('#viewSeg button').forEach(b => {
  b.addEventListener('click', () => {
    S.view = b.dataset.v;
    paintView(); save(); recalc();
  });
});

/* 採寸（fitSheet）は入力のたびではなく、PDFにする直前だけ。
   buildSheet は文字を打つたびに走るので、そこに入れると毎回レイアウトを測り直すことになる */
document.getElementById('btnPdf').addEventListener('click', () => { buildSheet(); fitSheet(); window.print(); });

/* ボタンを使わず ⌘P で印刷したときも、同じように1枚に収める */
window.addEventListener('beforeprint', () => { buildSheet(); fitSheet(); });

document.getElementById('btnReset').addEventListener('click', () => {
  if(!confirm('入れた金額をぜんぶ消して、まっさらに戻します。\niPhone・MacBook の両方が空になります。よろしいですか？')) return;
  const fresh = seed(nowISO());   /* 「空にした」を他の端末にも伝えるので、ここだけ現在時刻 */
  /* 自分で足した項目は墓標を立てないと、もう片方の端末から戻ってくる */
  const keep = new Set();
  fresh.cats.forEach(c => c.items.forEach(it => keep.add(it.id)));
  const del = {...S.del}, t = nowISO();
  S.cats.forEach(c => c.items.forEach(it => { if(!keep.has(it.id)) del[it.id] = t; }));
  fresh.del = del;
  S = fresh;
  save(); paintView(); renderCats(); recalc();
  toast('まっさらに戻しました');
});

function paintView(){
  document.querySelectorAll('#viewSeg button').forEach(b => b.classList.toggle('on', b.dataset.v === S.view));
}

let toastT = null;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('show'), 1800);
}

/* 合計がトップバーの下に隠れたら、バーの中の小さい合計に引き継ぐ */
(function(){
  const big = document.getElementById('totBig');
  const mini = document.getElementById('miniTot');
  if(!('IntersectionObserver' in window)) return;
  new IntersectionObserver(es => {
    mini.classList.toggle('show', !es[0].isIntersecting);
  }, { rootMargin: '-62px 0px 0px 0px', threshold: 0 }).observe(big);
})();

paintView();
renderCats();
recalc();
renderSync();
loadRemote();
subscribeRealtime();
</script>

<!-- tsumiki-back-button -->
<style>
  #tsumikiEdge{position:fixed; top:0; bottom:0; left:0; width:22px; z-index:999;}
  #tsumikiPeek{
    position:fixed; top:50%; left:0; z-index:1001; margin-top:-23px;
    width:46px; height:46px; display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.92);
    -webkit-backdrop-filter:saturate(180%) blur(14px); backdrop-filter:saturate(180%) blur(14px);
    border:1px solid rgba(0,0,0,.06); border-radius:50%;
    box-shadow:0 6px 20px rgba(0,0,0,.18);
    color:#0071e3; font-size:24px; font-weight:600; line-height:1;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Helvetica Neue",Arial,sans-serif;
    transform:translateX(-70px) scale(.8); opacity:0; pointer-events:none;
  }
</style>
<div id="tsumikiEdge"></div>
<div id="tsumikiPeek">‹</div>
<script>
  (function(){
    var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
      || window.navigator.standalone === true;
    var fromTsumiki = false;
    try{
      if(document.referrer){
        var r = new URL(document.referrer);
        fromTsumiki = (r.origin === location.origin);
      }
    }catch(e){}
    if(!(standalone && fromTsumiki)) return;

    var peek = document.getElementById('tsumikiPeek');
    var edge = document.getElementById('tsumikiEdge');

    function goBack(){ location.href = 'index.html'; }

    /* --- 左端エッジスワイプで戻る（iOS純正の戻る操作。見えるボタンは置かない） --- */
    var sx=0, sy=0, prog=0, dragging=false, W=window.innerWidth;
    var TRIGGER = Math.min(120, W*0.32);
    window.addEventListener('resize', function(){ W=window.innerWidth; TRIGGER=Math.min(120, W*0.32); });

    function reset(){
      dragging = false; prog = 0;
      peek.style.transition = 'transform .25s ease, opacity .25s ease';
      peek.style.transform = 'translateX(-70px) scale(.8)';
      peek.style.opacity = 0;
    }
    function start(e){
      var t = e.touches ? e.touches[0] : e;
      if(t.clientX > 26) return;
      sx = t.clientX; sy = t.clientY; prog = 0; dragging = true;
      peek.style.transition = 'none';
    }
    function move(e){
      if(!dragging) return;
      var t = e.touches ? e.touches[0] : e;
      var dx = t.clientX - sx, dy = t.clientY - sy;
      if(Math.abs(dy) > Math.abs(dx) + 12){ reset(); return; }
      if(dx < 0) dx = 0;
      prog = Math.min(dx / TRIGGER, 1);
      peek.style.transform = 'translateX(' + (-70 + prog*82) + 'px) scale(' + (0.8 + prog*0.2) + ')';
      peek.style.opacity = prog;
      if(dx > 6 && e.cancelable) e.preventDefault();
    }
    function end(){
      if(!dragging) return;
      dragging = false;
      if(prog >= 0.999){
        peek.style.transition = 'transform .25s ease, opacity .25s ease';
        peek.style.transform = 'translateX(20px) scale(1.05)';
        peek.style.opacity = 1;
        goBack();
      }else{
        reset();
      }
    }
    edge.addEventListener('touchstart', start, {passive:true});
    window.addEventListener('touchmove', move, {passive:false});
    window.addEventListener('touchend', end, {passive:true});
    window.addEventListener('touchcancel', end, {passive:true});
  })();
</script>
<!-- /tsumiki-back-button -->
