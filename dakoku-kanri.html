<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="apple-touch-icon" href="icons/icon-dakoku-kanri.png">
<meta name="apple-mobile-web-app-title" content="打刻管理">
<title>打刻管理 — 勤務表・書き出し</title>
<style>
  :root{
    --bg:#eef3f8; --card:#ffffff; --ink:#1a2734; --sub:#7488a0;
    --line:#e2e9f1; --accent:#2f6fd6; --accent2:#5a95ea;
    --in:#2f9e6b; --out:#e0663b; --ok:#34c759; --radius:20px; --kyu:#c0442a;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  [hidden]{display:none !important;}
  html,body{overscroll-behavior-y:none;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Helvetica Neue",Arial,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.6;
    padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 24px);
    -webkit-font-smoothing:antialiased; min-height:100vh;
  }
  .wrap{max-width:640px; margin:0 auto; padding:0 16px;}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
  input,select,textarea{font-family:inherit; font-size:16px;}

  /* ===== ログイン ===== */
  .login{min-height:78vh; display:flex; flex-direction:column; justify-content:center; gap:14px; text-align:center;}
  .login .logo{font-size:50px;}
  .login h1{font-size:23px; font-weight:800; letter-spacing:-.02em;}
  .login p{color:var(--sub); font-size:13px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:20px 18px;}
  .login input{width:100%; border:2px solid var(--line); border-radius:14px; padding:13px 14px; margin-bottom:10px;}
  .login input.code{text-align:center; letter-spacing:.24em; font-weight:700; font-size:20px; text-transform:uppercase;}
  .login input:focus{outline:none; border-color:var(--accent);}
  .btn-primary{background:var(--accent); color:#fff; font-weight:800; font-size:16px; border-radius:14px; padding:14px; width:100%;}
  .btn-primary:disabled{opacity:.5;}
  .btn-sub{background:var(--bg); color:var(--accent); font-weight:800; font-size:15px; border-radius:14px; padding:13px; width:100%;}
  .muted{color:var(--sub); font-size:12px;}
  .err{color:var(--out); font-size:13px; min-height:18px;}
  .divider{display:flex; align-items:center; gap:10px; color:var(--sub); font-size:12px; margin:4px 0;}
  .divider::before,.divider::after{content:''; flex:1; height:1px; background:var(--line);}

  /* ===== ヘッダー ===== */
  header{padding:20px 4px 6px; display:flex; align-items:center; gap:10px;}
  header h1{font-size:19px; font-weight:800; letter-spacing:-.02em; cursor:pointer;}
  header h1::after{content:'✎'; font-size:12px; color:var(--sub); margin-left:6px; font-weight:600; vertical-align:middle;}
  header .sync{margin-left:auto; display:flex; align-items:center; gap:6px;
    font-size:11px; color:var(--sub); background:var(--card); border:1px solid var(--line);
    border-radius:999px; padding:5px 10px;}
  .sync .dot{width:7px; height:7px; border-radius:50%; background:var(--ok);}
  .sync .dot.off{background:#c7c7cc;}

  .tabs{display:flex; gap:6px; background:var(--card); border:1px solid var(--line);
    border-radius:14px; padding:5px; margin:6px 0 12px;}
  .tabs button{flex:1; padding:10px; border-radius:10px; font-weight:700; font-size:14px; color:var(--sub);}
  .tabs button.on{background:var(--accent); color:#fff;}

  /* ===== 従業員一覧 ===== */
  .wlist{display:flex; flex-direction:column; gap:9px;}
  .wcard{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px;
    display:flex; align-items:center; gap:12px;}
  .wcard.inactive{opacity:.55;}
  .wcard .info{flex:1; min-width:0;}
  .wcard .nm{font-weight:800; font-size:16px;}
  .wcard .st{font-size:12px; color:var(--sub);}
  .wcard .st .stdot{color:var(--in); font-weight:700;}
  .wcard .codechip{background:var(--bg); border:1px dashed var(--accent); color:var(--accent);
    font-weight:800; font-size:16px; letter-spacing:.12em; border-radius:10px; padding:6px 10px; font-variant-numeric:tabular-nums;}
  .addrow{margin-top:14px; text-align:center;}
  .addrow button{color:var(--accent); font-weight:700; font-size:15px; padding:12px 18px;
    border:1px dashed var(--accent); border-radius:12px;}
  .empty{text-align:center; color:var(--sub); padding:34px 0; font-size:14px;}
  .footlinks{margin-top:24px; text-align:center; display:flex; flex-direction:column; gap:10px;}
  .footlinks button{color:var(--sub); font-size:13px; text-decoration:underline;}

  /* ===== 勤務表 ===== */
  .pickrow{display:flex; gap:8px; margin-bottom:10px;}
  .pickrow select{flex:1; border:1px solid var(--line); background:var(--card); border-radius:12px; padding:11px 12px;}
  .monthbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .monthbar button{width:38px; height:38px; border-radius:12px; background:var(--card);
    border:1px solid var(--line); font-size:18px; font-weight:800; color:var(--accent);}
  .monthbar .mlabel{font-size:16px; font-weight:800; text-align:center; line-height:1.25;}
  .monthbar .mlabel small{display:block; font-size:11px; color:var(--sub); font-weight:600;}
  .sumcard{background:var(--accent); color:#fff; border-radius:var(--radius); padding:15px 18px; margin-bottom:12px;}
  .sumcard .top{display:flex; justify-content:space-between; align-items:baseline;}
  .sumcard .top .k{font-size:13px; opacity:.92;} .sumcard .top .v{font-size:24px; font-weight:800; font-variant-numeric:tabular-nums;}
  .sumcard .brk{display:flex; gap:8px; margin-top:10px;}
  .sumcard .brk div{flex:1; background:rgba(255,255,255,.16); border-radius:10px; padding:6px 8px; text-align:center;}
  .sumcard .brk .bk{font-size:10px; opacity:.9;} .sumcard .brk .bv{font-size:15px; font-weight:800; font-variant-numeric:tabular-nums;}
  .exportrow{display:flex; gap:8px; margin-bottom:14px;}
  .exportrow button{flex:1; background:var(--card); border:1px solid var(--line); color:var(--accent);
    font-weight:800; font-size:14px; border-radius:12px; padding:12px;}
  .reclist{display:flex; flex-direction:column; gap:8px;}
  .rec{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:11px 13px;
    display:flex; align-items:center; gap:11px;}
  .rec .d{width:46px; flex:0 0 auto; text-align:center;}
  .rec .d .day{font-size:17px; font-weight:800;}
  .rec .d .wd{font-size:11px; color:var(--sub);}
  .rec .d .wd.sat{color:#3a7bd5;} .rec .d .wd.sun,.rec .d .wd.hol{color:var(--kyu);}
  .rec .mid{flex:1; min-width:0;}
  .rec .mid .io{font-size:14px; font-variant-numeric:tabular-nums; font-weight:700;}
  .rec .mid .io .open{color:var(--out);}
  .rec .mid .pj{font-size:11px; color:var(--sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .rec .bk{flex:0 0 auto; text-align:right;}
  .rec .bk .main{font-weight:800; font-variant-numeric:tabular-nums; font-size:15px;}
  .rec .bk .tag{font-size:10px; font-weight:700; border-radius:6px; padding:1px 6px; display:inline-block;}
  .rec .bk .tag.hei{background:#e7f0fb; color:var(--accent);}
  .rec .bk .tag.kyu{background:#fbe9e4; color:var(--kyu);}
  .rec .bk .z{font-size:11px; color:var(--out); font-weight:700;}
  .rec .bk .main.zero{color:var(--sub); font-weight:600;}
  .addrow2{margin:12px 0 0; text-align:center;}
  .addrow2 button{color:var(--accent); font-weight:700; font-size:14px; padding:10px 16px;
    border:1px dashed var(--accent); border-radius:12px;}

  /* ===== モーダル ===== */
  .modal{position:fixed; inset:0; background:rgba(20,30,44,.42); display:flex; align-items:flex-end;
    justify-content:center; z-index:50;}
  .sheet{background:var(--card); border-radius:22px 22px 0 0; width:100%; max-width:640px;
    padding:20px 18px calc(env(safe-area-inset-bottom) + 20px); animation:up .22s ease; max-height:90vh; overflow-y:auto;}
  @keyframes up{from{transform:translateY(30px); opacity:.5;} to{transform:none; opacity:1;}}
  .sheet h3{font-size:17px; font-weight:800; margin-bottom:14px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; color:var(--sub); margin-bottom:5px; font-weight:700;}
  .field input{width:100%; border:2px solid var(--line); border-radius:12px; padding:11px 12px;}
  .field input:focus{outline:none; border-color:var(--accent);}
  .togglerow{display:flex; align-items:center; justify-content:space-between; padding:6px 2px 12px;}
  .switch{position:relative; width:50px; height:30px;}
  .switch input{display:none;}
  .switch .sl{position:absolute; inset:0; background:#cbd6e4; border-radius:999px; transition:.2s;}
  .switch .sl::before{content:''; position:absolute; width:24px; height:24px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s;}
  .switch input:checked + .sl{background:var(--in);}
  .switch input:checked + .sl::before{transform:translateX(20px);}
  .sheet .row{display:flex; gap:10px; margin-top:6px;}
  .sheet .row .btn-primary{flex:1;}
  .btn-ghost{flex:0 0 auto; padding:14px 16px; border-radius:14px; background:var(--bg); color:var(--sub); font-weight:700;}
  .btn-del{color:var(--out); font-size:13px; text-decoration:underline; margin-top:12px; display:block; text-align:center; width:100%;}
  .codebig{text-align:center; background:var(--bg); border-radius:14px; padding:16px; margin-bottom:10px;}
  .codebig .c{font-size:34px; font-weight:800; letter-spacing:.2em; color:var(--accent); font-variant-numeric:tabular-nums;}
  .codebig .h{font-size:12px; color:var(--sub);}

  .toast{position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 26px); transform:translateX(-50%);
    background:#1a2734; color:#fff; padding:11px 18px; border-radius:999px; font-size:14px; font-weight:700;
    z-index:80; opacity:0; transition:opacity .2s; pointer-events:none;}
  .toast.show{opacity:1;}

  /* ===== 印刷（PDF）用 ===== */
  #printArea{display:none;}
  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{display:block; position:absolute; left:0; top:0; width:100%; padding:10px;}
  }
  #printArea .ttl{font-size:17px; font-weight:800; text-align:center; margin-bottom:6px;}
  #printArea .sum{font-size:12px; margin-bottom:8px; display:flex; gap:14px; flex-wrap:wrap; justify-content:center;}
  #printArea table{width:100%; border-collapse:collapse; font-size:11px;}
  #printArea th,#printArea td{border:1px solid #666; padding:3px 4px; text-align:center;}
  #printArea th{background:#eef3f8;}
  #printArea td.pj{text-align:left; font-size:10px;}
  #printArea .sat{color:#2b5fb0;} #printArea .sun,#printArea .hol{color:#c0442a;}
  #printArea tr.total td{font-weight:800; background:#f4f7fb;}
  #printArea .stamp{margin-top:12px; display:flex; gap:16px; justify-content:flex-end;}
  #printArea .stamp .box{border:1px solid #666; width:110px; height:70px; font-size:10px; text-align:center; padding:4px;}
</style>
</head>
<body>

<!-- ログイン -->
<div class="wrap login" id="loginView">
  <div class="logo">🗂️</div>
  <h1>打刻管理</h1>
  <p>派遣会社（管理者）用</p>
  <div class="card">
    <input class="code" id="adminCode" maxlength="8" autocomplete="off" autocapitalize="characters" placeholder="管理者コード">
    <button class="btn-primary" id="loginBtn">ログイン</button>
    <div class="err" id="loginErr"></div>
  </div>
  <div class="divider">はじめての方</div>
  <div class="card">
    <input id="orgName" placeholder="会社・事業所名（例：〇〇スタッフ）" autocomplete="off">
    <button class="btn-sub" id="createBtn">新しく登録する</button>
    <div class="muted" style="margin-top:8px">登録すると管理者コードが発行されます。<br>大切に保管してください。</div>
  </div>
</div>

<!-- アプリ -->
<div class="wrap" id="appView" hidden>
  <header>
    <h1 id="hOrg">—</h1>
    <div class="sync"><span class="dot" id="syncDot"></span><span id="syncTxt">同期</span></div>
  </header>

  <div class="tabs">
    <button id="tabW" class="on">従業員</button>
    <button id="tabT">勤務表</button>
  </div>

  <!-- 従業員タブ -->
  <section id="wTab">
    <div class="wlist" id="wList"></div>
    <div class="addrow"><button id="addWBtn">＋ 従業員を追加</button></div>
    <div class="footlinks">
      <button id="settingsBtn">会社名・提出先の設定</button>
      <button id="showCodeBtn">管理者コードを表示</button>
      <button id="logoutBtn">ログアウト</button>
    </div>
  </section>

  <!-- 勤務表タブ -->
  <section id="tTab" hidden>
    <div class="pickrow"><select id="workerSel"></select></div>
    <div class="monthbar">
      <button id="mPrev">‹</button>
      <div class="mlabel" id="mLabel">—<small id="mRange"></small></div>
      <button id="mNext">›</button>
    </div>
    <div class="sumcard">
      <div class="top"><div class="k">実働合計 <span id="sumDays"></span></div><div class="v" id="sumTotal">—</div></div>
      <div class="brk">
        <div><div class="bk">平日勤務</div><div class="bv" id="sumHei">—</div></div>
        <div><div class="bk">残業</div><div class="bv" id="sumZan">—</div></div>
        <div><div class="bk">休日出勤</div><div class="bv" id="sumKyu">—</div></div>
      </div>
    </div>
    <div class="exportrow">
      <button id="xlsxBtn">📊 Excel書き出し</button>
      <button id="pdfBtn">📄 PDF書き出し</button>
    </div>
    <div class="reclist" id="recList"></div>
    <div class="addrow2"><button id="addRecBtn">＋ 記録を追加</button></div>
  </section>
</div>

<div id="printArea"></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script>
const SUPABASE_URL='https://okbjqtdirrathscctyvx.supabase.co';
const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9rYmpxdGRpcnJhdGhzY2N0eXZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzMjI4NTIsImV4cCI6MjA5NTg5ODg1Mn0.T-1AOK6vCD6uGdqrVGXjPui3L6WPSNrnygS-IHyfZ6Y';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON);
const LS_KEY='dakoku_admin_code';

/* ===== 共通ロジック（労働者アプリと同一） ===== */
const BREAK_MIN=60, ROUND_MIN=15, DAY_MIN=480, PERIOD_START=21;
function round15(d){ const ms=ROUND_MIN*60*1000; return new Date(Math.round(new Date(d).getTime()/ms)*ms); }
function netMinutes(inTs,outTs){ if(!inTs||!outTs) return null; let g=(round15(outTs)-round15(inTs))/60000; if(g<=0) return 0; if(g>BREAK_MIN) g-=BREAK_MIN; return Math.max(0,Math.round(g)); }
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
const WD=['日','月','火','水','木','金','土'];
const JP_HOLIDAYS=new Set(['2025-01-01','2025-01-13','2025-02-11','2025-02-23','2025-02-24','2025-03-20','2025-04-29','2025-05-03','2025-05-04','2025-05-05','2025-05-06','2025-07-21','2025-08-11','2025-09-15','2025-09-23','2025-10-13','2025-11-03','2025-11-23','2025-11-24','2026-01-01','2026-01-12','2026-02-11','2026-02-23','2026-03-20','2026-04-29','2026-05-03','2026-05-04','2026-05-05','2026-05-06','2026-07-20','2026-08-11','2026-09-21','2026-09-22','2026-09-23','2026-10-12','2026-11-03','2026-11-23','2027-01-01','2027-01-11','2027-02-11','2027-02-23','2027-03-21','2027-03-22','2027-04-29','2027-05-03','2027-05-04','2027-05-05','2027-07-19','2027-08-11','2027-09-20','2027-09-23','2027-10-11','2027-11-03','2027-11-23']);
function isHolidayDate(d){ const w=d.getDay(); if(w===0||w===6) return true; return JP_HOLIDAYS.has(ymd(d)); }
function buckets(inTs,outTs){
  if(!inTs||!outTs) return {actual:null,hei:0,zan:0,kyu:0,open:!!inTs};
  const a=netMinutes(inTs,outTs), d=new Date(inTs);
  if(isHolidayDate(d)) return {actual:a,hei:0,zan:0,kyu:a,open:false};
  return {actual:a,hei:Math.min(a,DAY_MIN),zan:Math.max(a-DAY_MIN,0),kyu:0,open:false};
}
function fmtHM(min){ if(min==null) return '--'; const s=min<0?'-':''; min=Math.abs(min); return s+Math.floor(min/60)+':'+String(min%60).padStart(2,'0'); }
function fmtClock(ts){ if(!ts) return ''; const d=round15(ts); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function periodRange(year,m1){ return {from:new Date(year,m1-2,PERIOD_START), to:new Date(year,m1-1,PERIOD_START)}; }
function periodOfToday(){ const d=new Date(); let y=d.getFullYear(), m1=d.getMonth()+1; if(d.getDate()>=PERIOD_START){ m1++; if(m1>12){m1=1;y++;} } return {y,m1}; }
function fmtMD(d){ return `${d.getMonth()+1}/${d.getDate()}`; }

let admin=null, org=null, workers=[], selWorker=null, per=periodOfToday();

async function rpc(fn,params){ const {data,error}=await sb.rpc(fn,params); setSync(!error); if(error) throw error; return data; }
function setSync(ok){ const d=document.getElementById('syncDot'),t=document.getElementById('syncTxt'); if(!d)return; d.classList.toggle('off',!ok); t.textContent=ok?'同期':'オフライン'; }
let toastT; function toast(m){ const el=document.getElementById('toast'); el.textContent=m; el.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),1900); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ===== ログイン / 登録 ===== */
const adminInput=document.getElementById('adminCode');
adminInput.addEventListener('input',()=>{ adminInput.value=adminInput.value.toUpperCase().replace(/[^A-Z0-9]/g,''); });
document.getElementById('loginBtn').addEventListener('click',doLogin);
adminInput.addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });
document.getElementById('createBtn').addEventListener('click',doCreate);

async function doLogin(){
  const c=adminInput.value.trim().toUpperCase(); const err=document.getElementById('loginErr'); err.textContent='';
  if(c.length<6){ err.textContent='管理者コードを入力してください'; return; }
  try{
    const info=await rpc('dakoku_admin_login',{p_admin:c});
    if(!info){ err.textContent='そのコードは見つかりません'; return; }
    admin=c; org=info; localStorage.setItem(LS_KEY,c); enterApp();
  }catch(e){ err.textContent='通信に失敗しました'; }
}
async function doCreate(){
  const name=document.getElementById('orgName').value.trim(); const err=document.getElementById('loginErr'); err.textContent='';
  if(!name){ err.textContent='会社・事業所名を入力してください'; return; }
  try{
    const res=await rpc('dakoku_admin_create_org',{p_name:name});
    admin=res.admin_code; org={org_id:res.org_id,name:res.name,haken_moto:'',haken_saki:''}; localStorage.setItem(LS_KEY,admin);
    alert('登録しました。\n\n管理者コード：'+res.admin_code+'\n\nこのコードでログインします。必ず控えてください。');
    enterApp();
  }catch(e){ err.textContent='登録に失敗しました'; }
}
async function enterApp(){
  document.getElementById('loginView').hidden=true;
  document.getElementById('appView').hidden=false;
  document.getElementById('hOrg').textContent=org.name;
  per=periodOfToday();
  await loadWorkers();
}

/* ===== タブ ===== */
const tabW=document.getElementById('tabW'), tabT=document.getElementById('tabT');
tabW.addEventListener('click',()=>switchTab('w'));
tabT.addEventListener('click',()=>switchTab('t'));
function switchTab(t){
  const w=t==='w';
  tabW.classList.toggle('on',w); tabT.classList.toggle('on',!w);
  document.getElementById('wTab').hidden=!w; document.getElementById('tTab').hidden=w;
  if(w){ loadWorkers(); } else { fillWorkerSelect(); loadTimesheet(); }
}

/* ===== 従業員一覧 ===== */
async function loadWorkers(){
  try{ workers=await rpc('dakoku_admin_workers',{p_admin:admin}); }catch(e){ toast('読み込み失敗'); return; }
  renderWorkers();
}
function renderWorkers(){
  const list=document.getElementById('wList'); list.innerHTML='';
  if(!workers.length){ list.innerHTML='<div class="empty">従業員がまだいません。<br>「＋ 従業員を追加」から登録してください。</div>'; return; }
  workers.forEach(w=>{
    const el=document.createElement('div'); el.className='wcard'+(w.active?'':' inactive');

function fillWorkerSelect(){

let curRecs=[], loadSeq=0;
async function loadTimesheet(){
  const seq=++loadSeq;
  if(!workers.length){ await loadWorkersQuiet(); }
  const {from,to}=periodRange(per.y,per.m1);
  document.getElementById('mLabel').innerHTML=`${per.y}年${per.m1}月度<small>${fmtMD(from)}〜${fmtMD(new Date(to-86400000))}</small>`;
  if(!selWorker){ document.getElementById('recList').innerHTML='<div class="empty">従業員を追加してください</div>';
    ['sumTotal','sumDays','sumHei','sumZan','sumKyu'].forEach(id=>document.getElementById(id).textContent='—'); return; }
  let recs=[];
  try{ recs=await rpc('dakoku_admin_records',{p_admin:admin,p_worker:selWorker.id,p_from:from.toISOString(),p_to:to.toISOString()}); }
  catch(e){ toast('読み込み失敗'); recs=[]; }
  if(seq!==loadSeq) return;   // 新しい読込が来ていたら古い結果は破棄
  curRecs=recs; renderTimesheet();
}
async function loadWorkersQuiet(){ try{ workers=await rpc('dakoku_admin_workers',{p_admin:admin}); fillWorkerSelect(); }catch(e){} }

function renderTimesheet(){
  const list=document.getElementById('recList'); list.innerHTML='';
  let tHei=0,tZan=0,tKyu=0,days=0;
  if(!curRecs.length){ list.innerHTML='<div class="empty">この月度の記録はありません</div>'; }
  curRecs.forEach(r=>{
    const din=new Date(r.clock_in), b=buckets(r.clock_in,r.clock_out);
    if(b.actual!=null){ tHei+=b.hei; tZan+=b.zan; tKyu+=b.kyu; if(b.actual>0) days++; }
    const wd=din.getDay(), hol=isHolidayDate(din), wdc=hol?(wd===6?'sat':'hol'):'';
    const io=r.clock_out?`${fmtClock(r.clock_in)} → ${fmtClock(r.clock_out)}`:`${fmtClock(r.clock_in)} → <span class="open">退勤未</span>`;
    let bkHtml;
    if(b.actual==null){ bkHtml=`<div class="main zero">—</div>`; }
    else if(b.kyu>0){ bkHtml=`<div class="main">${fmtHM(b.kyu)}</div><span class="tag kyu">休日出勤</span>`; }
    else{ bkHtml=`<div class="main">${fmtHM(b.hei)}</div>`+(b.zan>0?`<div class="z">残 ${fmtHM(b.zan)}</div>`:`<span class="tag hei">平日</span>`); }
    const el=document.createElement('div'); el.className='rec';
    el.innerHTML=`<div class="d"><div class="day">${din.getDate()}</div><div class="wd ${wdc}">${WD[wd]}</div></div>
      <div class="mid"><div class="io">${io}</div><div class="pj">${esc(r.project||'')}</div></div>
      <div class="bk">${bkHtml}</div>`;
    el.addEventListener('click',()=>openRecEdit(r));
    list.appendChild(el);
  });
  document.getElementById('sumHei').textContent=fmtHM(tHei);
  document.getElementById('sumZan').textContent=fmtHM(tZan);
  document.getElementById('sumKyu').textContent=fmtHM(tKyu);
  document.getElementById('sumTotal').textContent=fmtHM(tHei+tZan+tKyu);
  document.getElementById('sumDays').textContent=`／ 稼働 ${days} 日`;
}

/* ===== 月次テーブル生成（Excel/PDF共通） ===== */
function buildDayRows(){
  const {from,to}=periodRange(per.y,per.m1);
  const byDay={};
  curRecs.forEach(r=>{ const d=new Date(r.clock_in); const key=ymd(d); (byDay[key]=byDay[key]||[]).push(r); });
  const rows=[]; let tHei=0,tZan=0,tKyu=0,workdays=0;
  for(let dt=new Date(from); dt<to; dt.setDate(dt.getDate()+1)){
    const key=ymd(dt), wd=dt.getDay(), hol=isHolidayDate(dt);
    const recs=(byDay[key]||[]).slice().sort((a,b)=>new Date(a.clock_in)-new Date(b.clock_in));
    let hei=0,zan=0,kyu=0,worked=false,anyOpen=false,inS='',outS='',pj='';
    if(recs.length){
      const first=recs[0], last=recs[recs.length-1];
      inS=fmtClock(first.clock_in); outS=last.clock_out?fmtClock(last.clock_out):'';
      if(!last.clock_out) anyOpen=true;
      pj=(recs.find(r=>r.project&&r.project.trim())||{}).project||'';
      recs.forEach(r=>{ const b=buckets(r.clock_in,r.clock_out); if(b.actual!=null){ hei+=b.hei; zan+=b.zan; kyu+=b.kyu; if(b.actual>0) worked=true; } });
    }
    if(worked){ tHei+=hei; tZan+=zan; tKyu+=kyu; workdays++; }
    const bizName = recs.length ? (pj || (hol?'休日':'')) : (hol?'休日':'');
    rows.push({ mo:dt.getMonth()+1, day:dt.getDate(), wd, hol, biz:bizName,
      inS, outS:outS||(anyOpen?'（未）':''), brk: worked?'1:00':'',
      hei: worked&&hei?fmtHM(hei):'', zan: worked&&zan?fmtHM(zan):'', kyu: worked&&kyu?fmtHM(kyu):'',
      worked });
  }
  return {rows,tHei,tZan,tKyu,workdays};
}

document.getElementById('xlsxBtn').addEventListener('click',exportXlsx);
async function exportXlsx(){
  if(!selWorker){ toast('従業員を選んでください'); return; }
  const {rows,tHei,tZan,tKyu,workdays}=buildDayRows();
  const wb=new ExcelJS.Workbook();
  const ws=wb.addWorksheet(`${per.y}年${per.m1}月度`, {pageSetup:{paperSize:9, orientation:'portrait', fitToPage:true, fitToWidth:1, fitToHeight:1, margins:{left:0.4,right:0.4,top:0.5,bottom:0.5,header:0.2,footer:0.2}}});
  ws.columns=[{width:5},{width:5},{width:6},{width:32},{width:10},{width:10},{width:8},{width:11},{width:11},{width:11}];
  const thin={style:'thin',color:{argb:'FF666666'}};
  const border={top:thin,left:thin,bottom:thin,right:thin};
  const ctr={vertical:'middle',horizontal:'center'};

  // タイトル
  ws.mergeCells('A1:J1');
  const t=ws.getCell('A1'); t.value=`${per.y}年 ${per.m1}月度　勤 怠 管 理 表`;
  t.font={size:15,bold:true}; t.alignment=ctr; ws.getRow(1).height=26;

  // サマリー
  ws.mergeCells('A2:B2'); ws.getCell('A2').value='出向者';
  ws.mergeCells('C2:D2'); ws.getCell('C2').value=selWorker.name;
  ws.getCell('E2').value='出勤日数'; ws.getCell('F2').value=workdays+'日';
  ws.getCell('G2').value='平日勤務'; ws.getCell('H2').value=fmtHM(tHei);
  ws.getCell('I2').value='残業'; ws.getCell('J2').value=fmtHM(tZan);
  ws.mergeCells('A3:B3'); ws.getCell('A3').value='派遣先';
  ws.mergeCells('C3:F3'); ws.getCell('C3').value=selWorker.site||'';
  ws.getCell('G3').value='休日出勤'; ws.mergeCells('H3:J3'); ws.getCell('H3').value=fmtHM(tKyu);
  for(const addr of ['A2','C2','E2','F2','G2','H2','I2','J2','A3','C3','G3','H3']){
    const c=ws.getCell(addr); c.border=border; c.alignment=ctr;
    if(['A2','E2','G2','A3','G3'].includes(addr)){ c.font={bold:true}; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFEEF3F8'}}; }
    else c.font={bold:true};
  }

  // ヘッダー
  const hdr=['月','日','曜日','業務内容','始業時刻','終業時刻','休憩','平日勤務','残業時間','休日出勤'];
  const hr=ws.getRow(5); hdr.forEach((v,i)=>{ const c=hr.getCell(i+1); c.value=v; c.font={bold:true}; c.alignment=ctr;
    c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFEEF3F8'}}; c.border=border; }); hr.height=20;

  // 日別
  let ri=6;
  rows.forEach(r=>{
    const row=ws.getRow(ri++);
    const vals=[r.mo, r.day, WD[r.wd], r.biz, r.inS, r.outS, r.brk, r.hei, r.zan, r.kyu];
    vals.forEach((v,i)=>{ const c=row.getCell(i+1); c.value=v; c.border=border;
      c.alignment=(i===3)?{vertical:'middle',horizontal:'left'}:ctr; c.font={size:11};
      if(i===2 && r.hol){ c.font={size:11,color:{argb: r.wd===6?'FF2B5FB0':'FFC0442A'}}; }
    });
  });

  // 合計
  const tr=ws.getRow(ri++);
  ws.mergeCells(`A${tr.number}:G${tr.number}`);
  const tc=ws.getCell(`A${tr.number}`); tc.value=`合計　（稼働 ${workdays} 日）`; tc.alignment={vertical:'middle',horizontal:'right'}; tc.font={bold:true};
  [['H',fmtHM(tHei)],['I',fmtHM(tZan)],['J',fmtHM(tKyu)]].forEach(([col,v])=>{ const c=ws.getCell(`${col}${tr.number}`); c.value=v; c.font={bold:true}; c.alignment=ctr; });
  for(let i=1;i<=10;i++){ tr.getCell(i).border=border; tr.getCell(i).fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFF4F7FB'}}; }

  // 確認印
  ri++;
  const sr=ri;
  ws.getCell(`G${sr}`).value='確 認 印'; ws.getCell(`G${sr}`).alignment=ctr; ws.getCell(`G${sr}`).font={bold:true};
  ws.mergeCells(`H${sr}:H${sr+3}`); ws.mergeCells(`I${sr}:I${sr+3}`); ws.mergeCells(`J${sr}:J${sr+3}`);
  ws.getCell(`H${sr}`).value=(org.haken_moto||'派遣元'); ws.getCell(`I${sr}`).value=(org.haken_saki||'派遣先'); ws.getCell(`J${sr}`).value='';
  [`H${sr}`,`I${sr}`,`J${sr}`].forEach(a=>{ const c=ws.getCell(a); c.border=border; c.alignment={vertical:'top',horizontal:'center'}; c.font={size:10}; });

  const buf=await wb.xlsx.writeBuffer();
  const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download=`勤怠管理表_${selWorker.name}_${per.y}年${String(per.m1).padStart(2,'0')}月度.xlsx`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),3000);
  toast('Excelを書き出しました');
}

    box-shadow:0 6px 20px rgba(0,0,0,.18);
    color:#0071e3; font-size:24px; font-weight:600; line-height:1;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Helvetica Neue",Arial,sans-serif;
    transform:translateX(-70px) scale(.8); opacity:0; pointer-events:none;
  }
</style>
<div id="tsumikiEdge"></div>
<div id="tsumikiPeek">‹</div>
<script>
  (function(){
    var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
      || window.navigator.standalone === true;
    var fromTsumiki = false;
    try{
      if(document.referrer){
        var r = new URL(document.referrer);
        fromTsumiki = (r.origin === location.origin);
      }
    }catch(e){}
    if(!(standalone && fromTsumiki)) return;

    var peek = document.getElementById('tsumikiPeek');
    var edge = document.getElementById('tsumikiEdge');

    function goBack(){ location.href = 'index.html'; }

    /* --- 左端エッジスワイプで戻る（iOS純正の戻る操作。見えるボタンは置かない） --- */
    var sx=0, sy=0, prog=0, dragging=false, W=window.innerWidth;
    var TRIGGER = Math.min(120, W*0.32);
    window.addEventListener('resize', function(){ W=window.innerWidth; TRIGGER=Math.min(120, W*0.32); });

    function reset(){
      dragging = false; prog = 0;
      peek.style.transition = 'transform .25s ease, opacity .25s ease';
      peek.style.transform = 'translateX(-70px) scale(.8)';
      peek.style.opacity = 0;
    }
    function start(e){
      var t = e.touches ? e.touches[0] : e;
      if(t.clientX > 26) return;
      sx = t.clientX; sy = t.clientY; prog = 0; dragging = true;
      peek.style.transition = 'none';
    }
    function move(e){
      if(!dragging) return;
      var t = e.touches ? e.touches[0] : e;
      var dx = t.clientX - sx, dy = t.clientY - sy;
      if(Math.abs(dy) > Math.abs(dx) + 12){ reset(); return; }
      if(dx < 0) dx = 0;
      prog = Math.min(dx / TRIGGER, 1);
      peek.style.transform = 'translateX(' + (-70 + prog*82) + 'px) scale(' + (0.8 + prog*0.2) + ')';
      peek.style.opacity = prog;
      if(dx > 6 && e.cancelable) e.preventDefault();
    }
    function end(){
      if(!dragging) return;
      dragging = false;
      if(prog >= 0.999){
        peek.style.transition = 'transform .25s ease, opacity .25s ease';
        peek.style.transform = 'translateX(20px) scale(1.05)';
        peek.style.opacity = 1;
        goBack();
      }else{
        reset();
      }
    }
    edge.addEventListener('touchstart', start, {passive:true});
    window.addEventListener('touchmove', move, {passive:false});
    window.addEventListener('touchend', end, {passive:true});
    window.addEventListener('touchcancel', end, {passive:true});
  })();
</script>
<!-- /tsumiki-back-button -->
</body>
</html>
