<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="apple-touch-icon" href="icons/icon-kagifuda.png">
<meta name="apple-mobile-web-app-title" content="かぎふだ">
<title>かぎふだ — プロダクトキーをカードに</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F4F2EE; --card:#FBFAF7; --surface:#ECE9E3;
    --ink:#242321; --sub:#77736B; --line:#D8D4CC; --ghost:#BEB9B0;
    --gold:#B08A3E;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family:'Zen Maru Gothic',-apple-system,BlinkMacSystemFont,"Hiragino Maru Gothic ProN","Hiragino Sans","Helvetica Neue",Arial,sans-serif;
    background:var(--paper); color:var(--ink);
    -webkit-text-size-adjust:100%; line-height:1.6;
    padding:max(20px,env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom));
  }
  .wrap{ max-width:520px; margin:0 auto; }
  header.hd{ text-align:center; margin:6px 0 22px; }
  header.hd .mark{ font-size:12px; letter-spacing:.22em; color:var(--gold); margin:0 0 4px; }
  header.hd h1{ font-size:22px; font-weight:700; margin:0 0 4px; }
  header.hd p{ font-size:12.5px; color:var(--sub); margin:0; }

  .field{ margin:0 0 16px; }
  .field > label{ display:block; font-size:13px; font-weight:700; margin:0 0 7px; color:var(--ink); }
  .field .hint{ font-weight:400; color:var(--sub); font-size:12px; }
  input[type=text], input[type=date], select{
    width:100%; font-family:inherit; font-size:16px; color:var(--ink);
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:12px 13px; outline:none; -webkit-appearance:none; appearance:none;
  }
  input:focus, select:focus{ border-color:var(--ghost); }
  input::placeholder{ color:var(--ghost); }
  .row2{ display:flex; gap:10px; }
  .row2 > *{ flex:1; min-width:0; }

  select.preset{
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' fill='none' stroke='%2377736B' stroke-width='1.6' stroke-linecap='round'/></svg>");
    background-repeat:no-repeat; background-position:right 13px center; padding-right:34px;
  }

  .iconrow{ display:flex; align-items:center; gap:12px; }
  .iconprev{
    width:56px; height:56px; border-radius:50%; flex:none;
    background:var(--surface); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    color:var(--ghost); font-size:11px; text-align:center;
  }
  .iconprev img{ width:100%; height:100%; object-fit:cover; }
  .filebtn{
    font-family:inherit; font-size:13px; font-weight:700; color:var(--ink);
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:9px 14px; cursor:pointer;
  }
  .txtbtn{ font-family:inherit; font-size:12.5px; color:var(--sub); background:none; border:none; cursor:pointer; padding:6px 2px; text-decoration:underline; }

  .preview{ margin:24px 0 0; text-align:center; }
  .preview .stage{
    background:var(--surface); border-radius:16px; padding:16px;
    border:1px solid var(--line);
  }
  canvas#card{ width:100%; height:auto; max-width:360px; border-radius:8px;
    box-shadow:0 8px 30px rgba(36,35,33,.14); display:block; margin:0 auto; }

  .actions{ margin:18px 0 0; display:flex; flex-direction:column; gap:10px; }
  .btn{
    font-family:inherit; font-size:15px; font-weight:700; text-align:center;
    padding:14px; border-radius:12px; border:none; cursor:pointer; width:100%;
  }
  .btn.primary{ background:var(--ink); color:var(--paper); }
  .btn.ghost{ background:var(--card); color:var(--ink); border:1px solid var(--line); }
  .note{ font-size:11.5px; color:var(--sub); text-align:center; margin:14px 6px 0; line-height:1.7; }
  .err{ color:#B4553E; font-size:12.5px; margin:6px 0 0; min-height:1em; }
</style>
</head>
<body>
<div class="wrap">
  <header class="hd">
    <p class="mark">TSUMIKI · PRODUCT KEY</p>
    <h1>かぎふだ</h1>
    <p>プロダクトキーを、お渡し用のカード画像に</p>
  </header>

  <div class="field">
    <label for="preset">アプリを選ぶ <span class="hint">（名前とURLを自動入力）</span></label>
    <select id="preset" class="preset">
      <option value="">— 手入力する —</option>
    </select>
  </div>

  <div class="field">
    <label for="app">アプリ名</label>
    <input type="text" id="app" placeholder="例：香盤メーカー Pro" autocomplete="off">
  </div>

  <div class="field">
    <label for="url">アプリURL <span class="hint">（QRコードになります・空欄可）</span></label>
    <input type="text" id="url" placeholder="https://tools.tsumiki-apps.com/xxx.html" autocomplete="off" inputmode="url">
  </div>

  <div class="field">
    <label for="customer">お客様名 <span class="hint">（「さま専用」と表示・空欄可）</span></label>
    <input type="text" id="customer" placeholder="例：山田 太郎" autocomplete="off">
  </div>

  <div class="field">
    <label for="key">プロダクトキー</label>
    <input type="text" id="key" placeholder="TSUMIKI-XXXX-XXXX-XXXX" autocomplete="off" autocapitalize="characters" spellcheck="false">
    <p class="err" id="keyErr"></p>
  </div>

  <div class="field">
    <label>アイコン画像 <span class="hint">（任意・正方形のPNG推奨）</span></label>
    <div class="iconrow">
      <div class="iconprev" id="iconPrev">なし</div>
      <button type="button" class="filebtn" id="iconBtn">画像を選ぶ</button>
      <button type="button" class="txtbtn" id="iconClear" style="display:none">外す</button>
      <input type="file" id="iconFile" accept="image/*" hidden>
    </div>
  </div>

  <div class="field">
    <label for="date">発行日</label>
    <input type="date" id="date">
  </div>

  <div class="preview">
    <div class="stage">
      <canvas id="card" width="1080" height="1350"></canvas>
    </div>
  </div>

  <div class="actions">
    <button type="button" class="btn primary" id="dl">画像をダウンロード</button>
    <button type="button" class="btn ghost" id="save">このアプリを一覧に保存</button>
  </div>

  <p class="note">キーはこの端末の中だけで画像化されます（サーバーには送られません）。<br>保存したアプリはこの端末にだけ記憶されます。</p>
</div>

    { name:"クレジット",       url:"https://tools.tsumiki-apps.com/credit.html" }
  ];

  function loadApps(){
    var saved = [];
    try{ saved = JSON.parse(localStorage.getItem(LS_KEY) || "[]"); }catch(e){ saved = []; }
    var map = {}, out = [];
    DEFAULT_APPS.concat(saved).forEach(function(a){
      if(!a || !a.name) return;
      map[a.name] = a; // 後勝ち（保存が既定を上書き）
    });
    Object.keys(map).forEach(function(k){ out.push(map[k]); });
    return out;
  }
  function saveApp(app, url){
    if(!app) return;
    var saved = [];
    try{ saved = JSON.parse(localStorage.getItem(LS_KEY) || "[]"); }catch(e){ saved = []; }
    saved = saved.filter(function(a){ return a && a.name !== app; });
    saved.push({ name:app, url:url });
    localStorage.setItem(LS_KEY, JSON.stringify(saved));
  }
  function refreshPreset(){
    var sel = $("preset");
    var cur = sel.value;
    while(sel.options.length > 1) sel.remove(1);
    loadApps().forEach(function(a){
      var o = document.createElement("option");
      o.value = a.name; o.textContent = a.name; o.dataset.url = a.url || "";
      sel.appendChild(o);
    });
    sel.value = cur;
  }

  // ---- 描画ユーティリティ ----
  function goldGrad(x0,y0,x1,y1){
    var g = ctx.createLinearGradient(x0,y0,x1,y1);
    g.addColorStop(0, GOLD_HI); g.addColorStop(0.5, GOLD); g.addColorStop(1, GOLD_LO);
    return g;
  }
  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }
  // 文字間隔つき中央寄せテキスト（自前実装で確実に中央＆収まる）
  function spacedWidth(text, spacing){
    var w = 0;
    for(var i=0;i<text.length;i++){ w += ctx.measureText(text[i]).width; if(i<text.length-1) w += spacing; }
    return w;
  }
  function drawSpacedCenter(text, cx, y, spacing){
    var total = spacedWidth(text, spacing);
    var x = cx - total/2;
    for(var i=0;i<text.length;i++){
      ctx.fillText(text[i], x, y);
      x += ctx.measureText(text[i]).width + spacing;
    }
  }
  function fitFont(text, weight, maxW, startPx, spacing){
    var px = startPx;
    while(px > 14){
      ctx.font = weight + " " + px + 'px "Zen Maru Gothic", sans-serif';
      if(spacedWidth(text, spacing) <= maxW) break;
      px -= 2;
    }
    return px;
  }

  function drawSeal(cx, cy, r){
    // 箔っぽい二重リングの認証印＋つみきの三角ブロック
    ctx.save();
    ctx.lineWidth = 5;
    ctx.strokeStyle = goldGrad(cx-r, cy-r, cx+r, cy+r);
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.stroke();
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy, r-9, 0, Math.PI*2); ctx.stroke();
    // つみきブロック（3つの小さな正方形をピラミッド状に）
    ctx.fillStyle = goldGrad(cx-r, cy-r, cx+r, cy+r);
    var s = r*0.30, gap = 3;
    ctx.fillRect(cx - s/2, cy - s - gap/2 - 4, s, s);       // 上
    ctx.fillRect(cx - s - gap/2, cy + gap/2 - 4, s, s);     // 下左
    ctx.fillRect(cx + gap/2, cy + gap/2 - 4, s, s);         // 下右
    // 下の小さな文字
    ctx.fillStyle = GOLD;
    ctx.font = '700 13px "Zen Maru Gothic", sans-serif';
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("認証", cx, cy + r - 20);
    ctx.restore();
  }

  function drawQR(url, cx, top, size){
    var qr;
    try{
      qr = qrcode(0, "M");
      qr.addData(url);
      qr.make();
    }catch(e){ return top; }
    var n = qr.getModuleCount();
    var quiet = 4;
    var cell = size / (n + quiet*2);
    var x0 = cx - size/2, y0 = top;
    // 白地の下敷き（角丸）
    ctx.save();
    ctx.fillStyle = "#FFFFFF";
    roundRect(x0 - 10, y0 - 10, size + 20, size + 20, 14); ctx.fill();
    ctx.strokeStyle = LINE; ctx.lineWidth = 1.5;
    roundRect(x0 - 10, y0 - 10, size + 20, size + 20, 14); ctx.stroke();
    ctx.fillStyle = INK;
    for(var r=0;r<n;r++){
      for(var c=0;c<n;c++){
        if(qr.isDark(r,c)){
          var px = x0 + (c + quiet) * cell;
          var py = y0 + (r + quiet) * cell;
          ctx.fillRect(Math.floor(px), Math.floor(py), Math.ceil(cell)+1, Math.ceil(cell)+1);
        }
      }
    }
    ctx.restore();
    return y0 + size;
  }

  function render(){
    ctx.clearRect(0,0,W,H);
    // 背景
    ctx.fillStyle = PAPER; ctx.fillRect(0,0,W,H);
    // 内側パネル
    ctx.fillStyle = PANEL;
    roundRect(28,28,W-56,H-56,26); ctx.fill();

    // 二重の金枠
    ctx.save();
    ctx.strokeStyle = goldGrad(56,56,W-56,H-56);
    ctx.lineWidth = 3;
    roundRect(56,56,W-112,H-112,18); ctx.stroke();
    ctx.lineWidth = 1.5;
    roundRect(70,70,W-140,H-140,12); ctx.stroke();
    ctx.restore();

    var cx = W/2;
    var innerL = 150, innerR = W-150, innerW = innerR - innerL;

    ctx.textBaseline = "alphabetic";
    ctx.textAlign = "left";

    // 見出し
    ctx.fillStyle = GOLD;
    ctx.font = '700 22px "Zen Maru Gothic", sans-serif';
    drawSpacedCenter("CERTIFICATE OF LICENSE", cx, 158, 5);
    // 見出し下の飾り線
    ctx.strokeStyle = goldGrad(cx-70,0,cx+70,0); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(cx-70,178); ctx.lineTo(cx+70,178); ctx.stroke();

    // TSUMIKI ワードマーク
    ctx.fillStyle = INK;
    ctx.font = '700 58px "Zen Maru Gothic", sans-serif';
    drawSpacedCenter("TSUMIKI", cx, 262, 10);
    ctx.fillStyle = SUB;
    ctx.font = '500 22px "Zen Maru Gothic", sans-serif';
    drawSpacedCenter("プロダクトキー証明書", cx, 300, 3);

    // 認証印（右上）
    drawSeal(892, 250, 64);

    // 区切り線
    ctx.strokeStyle = LINE; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(innerL, 350); ctx.lineTo(innerR, 350); ctx.stroke();

    // アイコン＋アプリ名
    var appY = 470;
    if(state.iconImg){
      var ic = 118, icx = cx, icy = 445;
      ctx.save();
      ctx.beginPath(); ctx.arc(icx, icy, ic/2, 0, Math.PI*2); ctx.closePath();
      ctx.fillStyle = PANEL; ctx.fill();
      ctx.clip();
      // cover 配置
      var img = state.iconImg, iw = img.naturalWidth, ih = img.naturalHeight;
      var scale = Math.max(ic/iw, ic/ih);
      var dw = iw*scale, dh = ih*scale;
      ctx.drawImage(img, icx - dw/2, icy - dh/2, dw, dh);
      ctx.restore();
      ctx.strokeStyle = LINE; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(icx, icy, ic/2, 0, Math.PI*2); ctx.stroke();
      appY = 560;
    }
    var appName = state.app || "アプリ名";
    ctx.fillStyle = state.app ? INK : "#C7C2B8";
    var apx = fitFont(appName, "700", innerW, 42, 1);
    ctx.font = '700 ' + apx + 'px "Zen Maru Gothic", sans-serif';
    drawSpacedCenter(appName, cx, appY, 1);

    // PRODUCT KEY ラベル
    ctx.fillStyle = SUB;
    ctx.font = '700 20px "Zen Maru Gothic", sans-serif';
    drawSpacedCenter("PRODUCT KEY", cx, 636, 6);

    // キー本体（下敷きの角丸ボックス）
    var boxY = 662, boxH = 108;
    ctx.fillStyle = "#F1EEE8";
    roundRect(innerL, boxY, innerW, boxH, 16); ctx.fill();
    ctx.strokeStyle = LINE; ctx.lineWidth = 1.5;
    roundRect(innerL, boxY, innerW, boxH, 16); ctx.stroke();

    var keyText = state.key || "TSUMIKI-XXXX-XXXX-XXXX";
    ctx.fillStyle = state.key ? INK : "#BEB9B0";
    var kpx = fitFont(keyText, "700", innerW - 60, 46, 3);
    ctx.font = '700 ' + kpx + 'px "Zen Maru Gothic", sans-serif';
    drawSpacedCenter(keyText, cx, boxY + boxH/2 + kpx*0.36, 3);

    // お客様名
    if(state.customer){
      ctx.fillStyle = INK;
      ctx.font = '500 34px "Zen Maru Gothic", sans-serif';
      var label = state.customer + " さま 専用";
      var lpx = fitFont(label, "500", innerW - 40, 34, 1);
      ctx.font = '500 ' + lpx + 'px "Zen Maru Gothic", sans-serif';
      // 両脇の小さな飾り
      var lw = spacedWidth(label, 1);
      ctx.strokeStyle = LINE; ctx.lineWidth = 1.5;
      var deco = 34;
      ctx.beginPath(); ctx.moveTo(cx - lw/2 - 16 - deco, 848); ctx.lineTo(cx - lw/2 - 16, 848); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx + lw/2 + 16, 848); ctx.lineTo(cx + lw/2 + 16 + deco, 848); ctx.stroke();
      ctx.fillStyle = INK;
      drawSpacedCenter(label, cx, 858, 1);
    }

    // QR
    var qrBottom = 900;
    if(state.url){
      qrBottom = drawQR(state.url, cx, 916, 196);
      ctx.fillStyle = SUB;
      ctx.font = '500 21px "Zen Maru Gothic", sans-serif';
      drawSpacedCenter("スマホで読み取ってアプリを開く", cx, qrBottom + 44, 1);
    }

    // 発行日
    ctx.fillStyle = SUB;
    ctx.font = '400 21px "Zen Maru Gothic", sans-serif';
    var d = fmtDate(state.date);
    drawSpacedCenter("発行日 " + d, cx, 1246, 2);
  }

  function fmtDate(v){
    if(!v) return "";
    var p = v.split("-");
    if(p.length !== 3) return v;
    return p[0] + "." + p[1] + "." + p[2];
  }

  // ---- 入力ハンドラ ----
  function sync(){
    state.app = $("app").value.trim();
    state.url = $("url").value.trim();
    state.customer = $("customer").value.trim();
    state.key = $("key").value.trim().toUpperCase();
    state.date = $("date").value;
    render();
  }

  ["app","url","customer","key","date"].forEach(function(id){
    $(id).addEventListener("input", sync);
  });
  $("key").addEventListener("blur", function(){
    // キーをそのままに、表示だけ大文字化
    $("key").value = $("key").value.toUpperCase();
    sync();
  });

  $("preset").addEventListener("change", function(){
    var opt = this.options[this.selectedIndex];
    if(!opt || !opt.value) return;
    $("app").value = opt.value;
    if(opt.dataset.url) $("url").value = opt.dataset.url;
    sync();
  });

  // アイコン
  $("iconBtn").addEventListener("click", function(){ $("iconFile").click(); });
  $("iconFile").addEventListener("change", function(){
    var f = this.files && this.files[0];
    if(!f) return;
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        state.iconImg = img;
        var prev = $("iconPrev");
        prev.innerHTML = "";
        var pi = new Image(); pi.src = e.target.result;
        prev.appendChild(pi);
        $("iconClear").style.display = "";
        render();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(f);
  });
  $("iconClear").addEventListener("click", function(){
    state.iconImg = null;
    $("iconFile").value = "";
    $("iconPrev").textContent = "なし";
    this.style.display = "none";
    render();
  });

  // 保存
  $("save").addEventListener("click", function(){
    var app = $("app").value.trim();
    if(!app){ flash(this, "アプリ名を入れてください"); return; }
    saveApp(app, $("url").value.trim());
    refreshPreset();
    flash(this, "保存しました ✓");
  });
  function flash(btn, msg){
    var old = btn.textContent; btn.textContent = msg; btn.disabled = true;
    setTimeout(function(){ btn.textContent = old; btn.disabled = false; }, 1400);
  }

  // ダウンロード
  $("dl").addEventListener("click", function(){
    render();
    var app = (state.app || "app").replace(/[\/\\:*?"<>|\s]+/g, "_");
    var cust = (state.customer || "").replace(/[\/\\:*?"<>|\s]+/g, "_");
    var name = "TSUMIKIキー_" + app + (cust ? "_" + cust : "") + ".png";
    canvas.toBlob(function(blob){
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = name;
      document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    }, "image/png");
  });

  // ---- 初期化 ----
  function todayStr(){
    var d = new Date();
    var m = ("0"+(d.getMonth()+1)).slice(-2);
    var day = ("0"+d.getDate()).slice(-2);
    return d.getFullYear() + "-" + m + "-" + day;
  }
  $("date").value = todayStr();
  state.date = $("date").value;
  refreshPreset();

  // フォント読込後に初回描画（キャンバスにWebフォントを確実に反映）
  function firstRender(){ sync(); }
  if(document.fonts && document.fonts.ready){
    Promise.all([
      document.fonts.load('700 58px "Zen Maru Gothic"'),
      document.fonts.load('500 24px "Zen Maru Gothic"'),
      document.fonts.load('400 21px "Zen Maru Gothic"')
    ]).then(firstRender).catch(firstRender);
    document.fonts.ready.then(render);
  }else{
    firstRender();
  }
})();
</script>
<!-- tsumiki-back-button -->
<style>
  #tsumikiEdge{position:fixed; top:0; bottom:0; left:0; width:22px; z-index:999;}
  #tsumikiPeek{
    position:fixed; top:50%; left:0; z-index:1001; margin-top:-23px;
    width:46px; height:46px; display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.92);
    -webkit-backdrop-filter:saturate(180%) blur(14px); backdrop-filter:saturate(180%) blur(14px);
    border:1px solid rgba(0,0,0,.06); border-radius:50%;
    box-shadow:0 6px 20px rgba(0,0,0,.18);
    color:#0071e3; font-size:24px; font-weight:600; line-height:1;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Helvetica Neue",Arial,sans-serif;
    transform:translateX(-70px) scale(.8); opacity:0; pointer-events:none;
  }
</style>
<div id="tsumikiEdge"></div>
<div id="tsumikiPeek">‹</div>
<script>
  (function(){
    var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
      || window.navigator.standalone === true;
    var fromTsumiki = false;
    try{
      if(document.referrer){
        var r = new URL(document.referrer);
        fromTsumiki = (r.origin === location.origin);
      }
    }catch(e){}
    if(!(standalone && fromTsumiki)) return;

    var peek = document.getElementById('tsumikiPeek');
    var edge = document.getElementById('tsumikiEdge');

    function goBack(){ location.href = 'index.html'; }

    /* --- 左端エッジスワイプで戻る（iOS純正の戻る操作。見えるボタンは置かない） --- */
    var sx=0, sy=0, prog=0, dragging=false, W=window.innerWidth;
    var TRIGGER = Math.min(120, W*0.32);
    window.addEventListener('resize', function(){ W=window.innerWidth; TRIGGER=Math.min(120, W*0.32); });

    function reset(){
      dragging = false; prog = 0;
      peek.style.transition = 'transform .25s ease, opacity .25s ease';
      peek.style.transform = 'translateX(-70px) scale(.8)';
      peek.style.opacity = 0;
    }
    function start(e){
      var t = e.touches ? e.touches[0] : e;
      if(t.clientX > 26) return;
      sx = t.clientX; sy = t.clientY; prog = 0; dragging = true;
      peek.style.transition = 'none';
    }
    function move(e){
      if(!dragging) return;
      var t = e.touches ? e.touches[0] : e;
      var dx = t.clientX - sx, dy = t.clientY - sy;
      if(Math.abs(dy) > Math.abs(dx) + 12){ reset(); return; }
      if(dx < 0) dx = 0;
      prog = Math.min(dx / TRIGGER, 1);
      peek.style.transform = 'translateX(' + (-70 + prog*82) + 'px) scale(' + (0.8 + prog*0.2) + ')';
      peek.style.opacity = prog;
      if(dx > 6 && e.cancelable) e.preventDefault();
    }
    function end(){
      if(!dragging) return;
      dragging = false;
      if(prog >= 0.999){
        peek.style.transition = 'transform .25s ease, opacity .25s ease';
        peek.style.transform = 'translateX(20px) scale(1.05)';
        peek.style.opacity = 1;
        goBack();
      }else{
        reset();
      }
    }
    edge.addEventListener('touchstart', start, {passive:true});
    window.addEventListener('touchmove', move, {passive:false});
    window.addEventListener('touchend', end, {passive:true});
    window.addEventListener('touchcancel', end, {passive:true});
  })();
</script>
<!-- /tsumiki-back-button -->
</body>
