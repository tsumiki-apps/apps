<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="apple-touch-icon" href="icons/icon-tsumigi.png">
<meta name="apple-mobile-web-app-title" content="つみ木">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="light dark">
<title>つみ木</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 色・書体・角丸・影・動きの正本は ~/制作物/DESIGN.md。ここで色を発明しない。 */
:root{
  --paper:#f5f4f0; --surface:#fffefb; --surface-2:#efece5;
  --ink:#1d1a15; --ink-mid:#5b554a; --ink-soft:#666154; --sub:#68645d; --ghost:#887f70;
  --line:#e2ded4; --line-2:#d8d3c7;
  --accent:#b06f26; --accent-2:#8a5a24; --accent-wash:#f0e4d1;
  --warn-ink:#974624; --warn-wash:#f2e0d4;
  --w1:#f1e8da; --w2:#f1dfda; --w3:#e0e6eb; --w4:#e6ebe0; --w5:#ede5de; --w6:#e6e2e9;
  --fill:var(--accent-2); --on-fill:var(--paper);
  --radius:20px;
  --shadow:0 1px 2px rgba(40,32,18,.05), 0 10px 26px -16px rgba(40,32,18,.18);
  --scrim:rgba(29,26,21,.42);
  --ease:cubic-bezier(0.2,0,0,1);
  /* 回る数字の上下を溶かすマスク（色ではなく不透明度だけを使う） */
  /* 予定ごとの色（50色）。小さな丸と印にだけ使い、文字を乗せない（DESIGN.md「顔料は細い印に」）。
     OKLab で、それまでに選んだ色からいちばん遠い色を順に拾った（最小の差 0.065・紙の地に 3:1 以上）。番号の若い色ほど互いに遠い */
  --c0:#a96a19; --c1:#183d9c; --c2:#996fda; --c3:#850344; --c4:#0e5715; --c5:#0ca084; --c6:#606881; --c7:#d35985; --c8:#088fe3; --c9:#753597;
  --c10:#673c14; --c11:#317d01; --c12:#b33738; --c13:#9c808d; --c14:#344b5b; --c15:#3862c4; --c16:#719901; --c17:#a33a82; --c18:#794560; --c19:#6d6c32;
  --c20:#d85f3e; --c21:#0c665a; --c22:#4c94ac; --c23:#938b50; --c24:#658273; --c25:#015c95; --c26:#9d60a2; --c27:#915848; --c28:#8a0700; --c29:#4d3781;
  --c30:#6e59a7; --c31:#73176f; --c32:#4e45ad; --c33:#63563e; --c34:#8b3e09; --c35:#498c4a; --c36:#b65a5f; --c37:#5f75c1; --c38:#565082; --c39:#b17a5e;
  --c40:#5a3f47; --c41:#207582; --c42:#8682b7; --c43:#9d1f40; --c44:#0685b6; --c45:#c35ead; --c46:#424c34; --c47:#25a351; --c48:#717de8; --c49:#3f7755;
  --fade:linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,.5) 11%, rgba(0,0,0,1) 22%, rgba(0,0,0,1) 78%, rgba(0,0,0,.5) 89%, rgba(0,0,0,0) 100%);
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#0f0d07; --surface:#211d14; --surface-2:#2b2619;
    --ink:#efe8da; --ink-mid:#a89e8b; --ink-soft:#9f988a; --sub:#a89e8b; --ghost:#9f988a;
    --line:#36301f; --line-2:#443d2b;
    --accent:#d59a4d; --accent-2:#e0ab63; --accent-wash:#362a19;
    --warn-ink:#d9825a; --warn-wash:#39251a;
    --w1:#362a19; --w2:#39251a; --w3:#2b2619; --w4:#23301f; --w5:#362a19; --w6:#2b2619;
    --fill:#d59a4d; --on-fill:#1d1a15;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 30px -18px rgba(0,0,0,.65);
    --scrim:rgba(15,13,7,.62);
    --c0:#f9b46c; --c1:#5987ec; --c2:#dbcafe; --c3:#d65c88; --c4:#5b9f5b; --c5:#74eece; --c6:#a7b0cb; --c7:#fec1d2; --c8:#b0daff; --c9:#bf7ee6;
    --c10:#b0815a; --c11:#7bc85f; --c12:#ff8a84; --c13:#e9cad9; --c14:#7790a2; --c15:#89b0ff; --c16:#bae76b; --c17:#f485cd; --c18:#c48aa7; --c19:#b6b579;
    --c20:#fec5b5; --c21:#62afa0; --c22:#98e1fa; --c23:#ded799; --c24:#aecdbc; --c25:#5aa5e4; --c26:#eba9f0; --c27:#df9f8e; --c28:#dc5f4e; --c29:#917dce;
    --c30:#b5a2f6; --c31:#c063ba; --c32:#908ffe; --c33:#aa9d83; --c34:#da8659; --c35:#93d992; --c36:#feaaac; --c37:#aec2fe; --c38:#9b97ce; --c39:#ffc6a9;
    --c40:#a2828b; --c41:#71bfcd; --c42:#d1cefe; --c43:#f06f84; --c44:#7ad0fe; --c45:#ffbbed; --c46:#869177; --c47:#7ef19b; --c48:#c9d2fe; --c49:#87c19c;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100dvh; background:var(--paper); color:var(--ink);
  font-family:'Zen Maru Gothic',"Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  font-size:16px; line-height:1.7; -webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top) 16px calc(104px + env(safe-area-inset-bottom));   /* 下は右下の＋に隠れない分 */
}
button,input{font:inherit; color:inherit}
button{-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
.sr{position:absolute; left:0; top:0; width:1px; height:1px; margin:-1px; padding:0; border:0; clip-path:inset(50%); white-space:nowrap}
.ic{width:20px; height:20px; flex:none; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:12px}

.wrap{max-width:1080px; margin:0 auto}
/* 右下の＋（今日の曜日で追加を開く） */
.fab{position:fixed; right:calc(16px + env(safe-area-inset-right)); bottom:calc(20px + env(safe-area-inset-bottom)); z-index:50; width:60px; height:60px; display:grid; place-items:center; border:0; border-radius:999px; background:var(--fill); color:var(--on-fill); box-shadow:var(--shadow); cursor:pointer; transition:transform .12s var(--ease)}
.fab:active{transform:scale(.94)}
.fab .ic{width:26px; height:26px; stroke-width:2.2}

/* ---- 見出し ---- */
.top{display:flex; align-items:center; gap:10px; padding:20px 0 16px}
.logo{width:34px; height:34px; flex:none; color:var(--ink)}
.top .logo + h1 + .iconbtn{margin-left:auto}                        /* 題名は画面に出さない（読み上げだけ） */
.iconbtn{
  width:44px; height:44px; flex:none; display:grid; place-items:center; padding:0;
  border:0; border-radius:12px; background:none; color:var(--ink-mid); cursor:pointer;
  transition:background-color .12s var(--ease), transform .12s var(--ease);
}
.iconbtn:active{transform:scale(.94); background:var(--surface-2)}
.sync[data-s="ok"]{color:var(--ink-mid)}
.sync[data-s="off"]{color:var(--ghost)}
.sync[data-s="err"]{color:var(--warn-ink)}
.sync[data-s="busy"] svg{opacity:.5}

/* ---- 段組み ---- */
.layout{display:grid; grid-template-columns:minmax(0,1fr); gap:16px; align-items:start}
@media (min-width:900px){
  .layout{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); gap:24px}
  .today{position:sticky; top:16px}
}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); min-width:0}
@media (max-width:600px){ .card{padding:16px} }
.head{display:flex; align-items:center; gap:10px; margin:0 0 14px; min-height:44px}
.head h2{margin:0; font-size:18px; font-weight:700; line-height:1.4; display:flex; align-items:center; gap:8px; flex:1; min-width:0}
.dot{width:36px; height:36px; flex:none; border-radius:999px; display:grid; place-items:center; font-size:16px; font-weight:700; background:var(--surface-2); color:var(--ink)}
.dot.now{background:var(--fill); color:var(--on-fill)}
.dot .ic{width:20px; height:20px}

/* ---- 雨の日のボタン ---- */
.rainbtn[aria-pressed="true"]{background:var(--accent-wash); color:var(--accent-2)}

/* ---- 今週できた数（Rare UI の「くるくる回る数字」の考え方・MIT） ---- */
.score{display:flex; align-items:center; gap:6px; color:var(--ink-mid); font-size:15px; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap}
.score .ic{width:18px; height:18px; color:var(--accent-2)}
.counter{display:inline-flex; color:var(--ink)}
.counter .win{display:block; height:1.5em; clip-path:inset(0); -webkit-mask-image:var(--fade); mask-image:var(--fade)}
.counter .col{display:block; transition:transform .24s var(--ease)}
.counter .col span{display:block; height:1.5em; line-height:1.5em; text-align:center}

/* ---- 今日のタイル ---- */
.tiles{display:grid; grid-template-columns:repeat(auto-fill,minmax(116px,1fr)); gap:12px}
.tile{
  position:relative; display:grid; gap:8px; padding:0; border:0; background:none; text-align:left;
  cursor:pointer; min-width:0; transition:transform .12s var(--ease);
}
.tile:active{transform:scale(.97)}
.tile:disabled{cursor:default; transform:none}
.tile .th{width:100%; aspect-ratio:1; border-radius:16px}
.tile .nm{font-size:15px; font-weight:700; line-height:1.45; overflow-wrap:anywhere}
.tile .th::after{content:""; position:absolute; inset:0; border-radius:inherit; background:var(--scrim); opacity:0; transition:opacity .12s var(--ease)}
.tile.on .th::after{opacity:1}
.stamp{
  position:absolute; top:0; left:0; right:0; aspect-ratio:1; display:grid; place-items:center; pointer-events:none;
}
.stamp i{
  width:52%; aspect-ratio:1; border-radius:999px; display:grid; place-items:center;
  background:var(--fill); color:var(--on-fill);
  opacity:0; transform:scale(.6) rotate(-14deg); transition:opacity .12s var(--ease), transform .2s var(--ease);
}
.stamp .ic{width:52%; height:52%; stroke-width:2.6}
.tile.on .stamp i{opacity:1; transform:scale(1) rotate(-8deg)}
/* 雨の日・記念日のマーク */
.mark{position:absolute; top:6px; right:6px; width:30px; height:30px; border-radius:999px; display:grid; place-items:center; background:var(--surface); color:var(--accent-2); box-shadow:var(--shadow); pointer-events:none}
.mark .ic{width:18px; height:18px}

/* ---- サムネイル ---- */
.th{position:relative; display:grid; place-items:center; overflow:hidden; background:var(--surface-2); color:var(--ink); flex:none}
.th img{width:100%; height:100%; object-fit:cover; display:block}
.th .ic{width:46%; height:46%; stroke-width:1.5}
.t1{background:var(--w1)} .t2{background:var(--w2)} .t3{background:var(--w3)}
.t4{background:var(--w4)} .t5{background:var(--w5)} .t6{background:var(--w6)}

/* ---- 空の画面 ---- */
.empty{display:grid; justify-items:center; gap:14px; padding:8px 0}
.illust{width:min(100%,200px); height:auto; fill:none; stroke:var(--ink-mid); stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.illust .soft{fill:var(--accent-wash); stroke:none}

/* ---- ボタン ---- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:0 20px;
  border:0; border-radius:12px; font-size:15px; font-weight:700; cursor:pointer; white-space:nowrap;
  transition:transform .12s var(--ease), opacity .12s var(--ease);
}
.btn:active{transform:scale(.97)}
.btn.fill{background:var(--fill); color:var(--on-fill)}
.btn.quiet{background:var(--surface-2); color:var(--ink)}
.btn:disabled{opacity:.45; cursor:default; transform:none}
.btn.wide{width:100%}

/* ---- 週の並び ---- */
.week{display:grid; gap:4px}
.row{
  display:grid; grid-template-columns:36px minmax(0,1fr) 20px; align-items:center; gap:12px;
  width:100%; min-height:64px; padding:10px 8px; border:0; border-radius:14px; background:none;
  text-align:left; cursor:pointer; transition:background-color .12s var(--ease);
}
.row:active{background:var(--surface-2)}
@media (hover:hover){ .row:hover{background:var(--surface-2)} }
.row.now{background:var(--accent-wash)}
/* 曜日の下（日付・期間・雨の日・記念日）を畳む */
.kfold-btn{display:grid; grid-template-columns:minmax(0,1fr) 20px; align-items:center; gap:12px; width:100%; min-height:48px; margin-top:6px; padding:4px 8px; border:0; border-top:1px solid var(--line); border-radius:0; background:none; color:var(--ink-mid); cursor:pointer; text-align:left}
.kfold-btn .icons{display:flex; align-items:center; gap:14px; padding-left:8px}
.kfold-btn .icons .ic{width:18px; height:18px}
.kfold-btn .icons .now{color:var(--accent-2)}
.kfold-btn > .chev{width:20px; height:20px; color:var(--ghost); transform:rotate(90deg); transition:transform .2s var(--ease)}
.kfold-btn[aria-expanded="true"] > .chev{transform:rotate(-90deg)}
.kfold-btn[aria-expanded="true"] .icons{visibility:hidden}
.row > .chev{color:var(--ghost); width:20px; height:20px}
.strip{display:flex; align-items:center; min-width:0; overflow:hidden}
.strip .th{width:40px; height:40px; border-radius:12px; box-shadow:0 0 0 2px var(--surface)}
.row.now .strip .th{box-shadow:0 0 0 2px var(--accent-wash)}
.strip .th + .th{margin-left:-8px}
.strip .more{margin-left:8px; font-size:14px; font-weight:700; color:var(--ink-mid); font-variant-numeric:tabular-nums}
.strip .names{margin-left:12px; min-width:0; font-size:14px; color:var(--ink-mid); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.strip .plus{width:40px; height:40px; border-radius:12px; border:1.5px dashed var(--line-2); display:grid; place-items:center; color:var(--ghost)}
@media (max-width:374px){ .strip .names{display:none} }

/* ---- シート（<dialog>） ---- */
dialog.sheet{
  border:0; padding:0; width:100%; max-width:min(560px, calc(100% - 32px)); max-height:88dvh;
  background:var(--surface); color:var(--ink); border-radius:var(--radius); box-shadow:var(--shadow);
  overflow:auto; overscroll-behavior:contain;
}
dialog.sheet::backdrop{background:var(--scrim)}
dialog.sheet[open]{animation:rise .2s var(--ease)}
@keyframes rise{from{opacity:0; transform:translateY(16px)}}
@media (max-width:600px){
  dialog.sheet{max-width:100%; margin:auto 0 0; border-radius:var(--radius) var(--radius) 0 0}
  .sheet-body{padding-bottom:calc(20px + env(safe-area-inset-bottom))}
}
.sheet-body{padding:16px 20px 20px}
.sheet .head{position:sticky; top:0; z-index:2; margin:0 -20px 8px; padding:8px 12px 8px 20px; background:var(--surface)}

/* 日のシートの一覧 */
.list{display:grid; gap:4px; margin:0 0 16px}
.item{display:grid; grid-template-columns:56px minmax(0,1fr) auto; align-items:center; gap:12px; padding:6px 0; transition:opacity .12s var(--ease)}
.item.gone{opacity:0}
.item .th{width:56px; height:56px; border-radius:14px}
.item .txt{display:grid; min-width:0}
.item .nm{font-size:16px; font-weight:700; line-height:1.45; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.item .sub{font-size:14px; color:var(--ink-mid); font-variant-numeric:tabular-nums}
.item .acts{display:flex; align-items:center}
.item:has(.del.open) [data-edit]{display:none}
.noitem{display:grid; justify-items:center; padding:8px 0 16px}
.noitem .illust{width:min(100%,160px)}

/* ---- その場で確かめる削除（Rare UI の Delete button を写したもの・MIT） ---- */
.del{display:inline-flex; align-items:center; height:44px; border-radius:12px; overflow:hidden; width:44px; transition:width .24s var(--ease)}
.del.open{width:132px; background:var(--surface-2)}
.del-trigger{width:44px; height:44px; flex:none; border:0; background:none; padding:0; display:grid; place-items:center; cursor:pointer; color:var(--ink-mid)}
.del-trigger svg{overflow:visible}
.del-lid{transform-box:view-box; transform-origin:3px 6px; transition:transform .24s var(--ease)}
.del.open .del-lid{transform:rotate(-35deg)}
.del-can{transition:transform .24s var(--ease)}
.del.open .del-can{transform:translateY(1.5px)}
.del-panel{display:flex; align-items:center; opacity:0; transform:translateX(-6px); pointer-events:none; transition:opacity .2s var(--ease), transform .2s var(--ease)}
.del.open .del-panel{opacity:1; transform:none; pointer-events:auto; transition-delay:.06s}
.del-circle{width:44px; height:44px; border:0; background:none; padding:0; display:grid; place-items:center; cursor:pointer; color:var(--ink-mid)}
.del-circle i{width:30px; height:30px; border-radius:999px; background:var(--surface); display:grid; place-items:center; transition:transform .12s var(--ease)}
.del-circle:active i{transform:scale(.84)}
.del-circle.yes{color:var(--warn-ink)}
.del-circle .ic{width:14px; height:14px; stroke-width:3}
.del-circle{opacity:0; transform:scale(.9); transition:opacity .2s var(--ease), transform .2s var(--ease)}
.del.open .del-circle{opacity:1; transform:none}
.del.open .del-circle:nth-child(1){transition-delay:.06s}
.del.open .del-circle:nth-child(2){transition-delay:.13s}

/* ---- 作る・直すシート ---- */
.pick{display:grid; justify-items:center; gap:12px; margin:4px 0 20px}
.pick .preview{width:132px; height:132px; border-radius:24px; border:0; padding:0; cursor:pointer}
.pick .preview .ic{width:44%; height:44%}
.pick-btns{display:flex; gap:8px}
.pick-btns .chev{width:16px; height:16px; transform:rotate(90deg); transition:transform .2s var(--ease)}
.pick-btns [aria-expanded="true"] .chev{transform:rotate(-90deg)}
/* 絵は畳んでおく（写真で足すのが普段なので） */
.fold{display:grid; grid-template-rows:0fr; transition:grid-template-rows .2s var(--ease)}
.fold.open{grid-template-rows:1fr}
.fold > div{overflow:hidden; min-height:0}
.presets{display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:8px; margin:0; padding:2px 2px 20px}
@media (max-width:374px){ .presets{grid-template-columns:repeat(4,minmax(0,1fr))} }
.preset{position:relative; display:block; cursor:pointer; min-width:44px}
.preset input{position:absolute; opacity:0; inset:0; margin:0; cursor:pointer}
.preset .th{width:100%; aspect-ratio:1; border-radius:14px; box-shadow:inset 0 0 0 1.5px transparent; transition:box-shadow .12s var(--ease)}
.preset .th .ic{width:52%; height:52%}
.preset:has(:checked) .th{box-shadow:inset 0 0 0 2.5px var(--ink)}
.preset:has(:focus-visible){outline:2px solid var(--accent); outline-offset:2px; border-radius:14px}
.field{display:flex; align-items:center; gap:10px; min-height:48px; padding:0 14px; margin:0 0 16px; border:1px solid var(--line-2); border-radius:12px; background:var(--surface)}
.field:focus-within{border-color:var(--accent)}
.field .ic{color:var(--ink-mid)}
.field input{flex:1; min-width:0; border:0; background:none; outline:none; font-size:16px; padding:10px 0}
.field input::placeholder{color:var(--ink-soft)}
.days{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:4px; margin:0 0 20px}
@media (max-width:374px){ .days{grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px} }
.day{position:relative; display:grid; place-items:center; min-height:44px; min-width:0; cursor:pointer; border-radius:999px; background:var(--surface-2); font-weight:700; font-size:15px; transition:background-color .12s var(--ease)}
.day input{position:absolute; inset:0; opacity:0; margin:0; cursor:pointer}
.day:has(:checked){background:var(--accent-wash); color:var(--accent-2); box-shadow:inset 0 0 0 1.5px var(--accent-2)}
.day:has(:focus-visible){outline:2px solid var(--accent); outline-offset:2px}
.kinds{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; margin:-12px 0 20px}
@media (max-width:374px){ .kinds{grid-template-columns:repeat(2,minmax(0,1fr))} }
/* 期間：日数のボタン（開始日から数えて終了日を入れる） */
.spans{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px; margin:-4px 0 16px}
.spans button{min-height:44px; min-width:0; border:0; border-radius:999px; background:var(--surface-2); color:var(--ink); font:inherit; font-size:15px; font-weight:700; font-variant-numeric:tabular-nums; cursor:pointer}
.spans button[aria-pressed="true"]{background:var(--accent-wash); color:var(--accent-2); box-shadow:inset 0 0 0 1.5px var(--accent-2)}
.kind{position:relative; display:flex; align-items:center; justify-content:center; gap:4px; white-space:nowrap; min-height:44px; min-width:0; cursor:pointer; border-radius:999px; background:var(--surface-2); font-weight:700; font-size:15px; transition:background-color .12s var(--ease)}
.kind input{position:absolute; inset:0; opacity:0; margin:0; cursor:pointer}
.kind:has(:checked){background:var(--accent-wash); color:var(--accent-2); box-shadow:inset 0 0 0 1.5px var(--accent-2)}
.kind:has(:focus-visible){outline:2px solid var(--accent); outline-offset:2px}
.field input[type="date"], .field input[type="time"]{-webkit-appearance:none; appearance:none; min-height:44px; text-align:left}
/* 時間帯（なし・午前・午後・夜・時刻） */
.tods{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:6px; margin:0 0 16px}
.tod{position:relative; display:flex; align-items:center; justify-content:center; gap:4px; white-space:nowrap; min-height:44px; min-width:0; cursor:pointer; border-radius:999px; background:var(--surface-2); font-weight:700; font-size:15px; transition:background-color .12s var(--ease)}
.tod .ic{width:18px; height:18px}
.tods.reps{grid-template-columns:repeat(3,minmax(0,1fr)); margin-top:-4px}
@media (max-width:374px){ .tod .ic{display:none} }
.tod input{position:absolute; inset:0; opacity:0; margin:0; cursor:pointer}
.tod:has(:checked){background:var(--accent-wash); color:var(--accent-2); box-shadow:inset 0 0 0 1.5px var(--accent-2)}
.tod:has(:focus-visible){outline:2px solid var(--accent); outline-offset:2px}
.tile .when{font-size:13px; font-weight:700; line-height:1.4; color:var(--ink-mid); font-variant-numeric:tabular-nums}
.foot{display:flex; gap:8px; position:sticky; bottom:0; z-index:1; margin:0 -20px; padding:12px 20px; background:var(--surface); border-top:1px solid var(--line)}   /* 保存はいつも見える位置に */
.field.need{border-color:var(--warn-ink)}
.tods.freq{grid-template-columns:repeat(2,minmax(0,1fr))}
.foot .btn.fill{flex:1}

/* ---- カレンダー ---- */
.cal-nav .chev-l{transform:scaleX(-1)}
.cal-nav h2{justify-content:center; font-variant-numeric:tabular-nums}
.cal{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); row-gap:2px; margin:0 -14px 16px}
.cal-wd{text-align:center; font-size:13px; font-weight:700; line-height:28px; color:var(--ink-mid)}
.cal-d{display:grid; grid-template-rows:30px 14px; justify-items:center; align-content:center; gap:2px; min-width:0; min-height:52px; padding:4px 0; border:0; border-radius:14px; background:none; font-size:15px; font-weight:700; font-variant-numeric:tabular-nums; cursor:pointer; transition:background-color .12s var(--ease)}
.cal-d:active{background:var(--surface-2)}
.cal-d .n{width:30px; height:30px; display:grid; place-items:center; border-radius:999px}
.cal-d.today .n{color:var(--accent-2); box-shadow:inset 0 0 0 1.5px var(--accent-2)}
.cal-d.sel .n{background:var(--fill); color:var(--on-fill); box-shadow:none}
.cal-d .cm{display:flex; align-items:center; gap:2px; height:14px; color:var(--accent-2)}
.cal-d .cm .ic{width:12px; height:12px; stroke-width:2.2}
/* 予定の丸（予定ごとの色）：まだ＝淡い地に輪、できた＝塗り */
.cal-d .cd{width:8px; height:8px; flex:none; border-radius:999px; background:color-mix(in oklab, var(--c, var(--accent-2)) 25%, var(--surface)); box-shadow:inset 0 0 0 1.5px var(--c, var(--accent-2))}
.cal-d .cd.ok{background:var(--c, var(--accent-2))}
.swatch{display:inline-block; width:10px; height:10px; margin-right:6px; border-radius:999px; background:var(--c, var(--accent-2)); vertical-align:.05em}
.cal-d .cmore{font-size:9px; line-height:1; font-weight:700; color:var(--accent-2)}
.cal-dh{display:flex; align-items:center; gap:10px; margin:0 0 12px; min-height:44px; padding-top:12px; border-top:1px solid var(--line)}
.cal-dh h3{margin:0; flex:1; min-width:0; font-size:16px; font-weight:700}

.toast{
  position:fixed; left:50%; top:auto; right:auto; z-index:2000; bottom:calc(env(safe-area-inset-bottom) + 96px); margin:0; border:0; overflow:visible;
  max-width:min(92vw,420px); padding:10px 18px; border-radius:999px; text-align:center; line-height:1.5;
  background:var(--ink); color:var(--paper); font-size:15px; font-weight:700;
  transform:translate(-50%,12px); opacity:0; pointer-events:none; transition:transform .2s var(--ease), opacity .2s var(--ease);
}
.toast.on{transform:translate(-50%,0); opacity:1}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:0s !important; animation-duration:0s !important; animation-iteration-count:1 !important}
}

var PRESETS = ['cafe','book','bath','music','sun','cake','leaf','moon','heart','game','film','bowl','rain','gift'];   /* 足すときは末尾に（色の割り当てがずれる） */
var KEEP_DAYS = 70;    /* 「できた」の印はこの日数だけ残す */

/* ---------- 純粋な関数（node でテストする範囲：ここから） ---------- */
function blank(){ return {items:{}, dels:{}, done:{}, rain:{}}; }
function clean(s){
  var out = blank();
  if (!s || typeof s !== 'object') return out;
  var it = s.items && typeof s.items === 'object' ? s.items : {};
  Object.keys(it).forEach(function(id){
    var v = it[id];
    if (!v || typeof v !== 'object' || typeof v.name !== 'string') return;
    var day = Math.max(0, Math.min(PERIOD, parseInt(v.day, 10) || 0));
    var th = v.th && v.th.k === 'img' && typeof v.th.src === 'string' && v.th.src.indexOf('data:image/') === 0
      ? {k:'img', src:v.th.src}
      : {k:'ic', ic: v.th && PRESETS.indexOf(v.th.ic) >= 0 ? v.th.ic : PRESETS[0]};
    out.items[id] = {id:id, day:day, name:v.name.slice(0, 24), th:th, ord:+v.ord || 0, upd:String(v.upd || '')};
    if (day === ANNIV && typeof v.md === 'string' && /^(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$/.test(v.md)) out.items[id].md = v.md;
    if (day === ANNIV && (v.rep === 'w' || v.rep === 'm' || v.rep === 'y')) out.items[id].rep = v.rep;
    if (day === ANNIV && typeof v.base === 'string' && /^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$/.test(v.base) && v.base.slice(5) === out.items[id].md) out.items[id].base = v.base;
    if (typeof v.zcol === 'number' && v.zcol % 1 === 0 && v.zcol >= 0 && v.zcol < TINTS) out.items[id].zcol = v.zcol;
    if ((day === ONCE || day === MONTHLY) && typeof v.ymd === 'string' && /^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$/.test(v.ymd)) out.items[id].ymd = v.ymd;
    if (day === MONTHLY && typeof v.dom === 'number' && v.dom % 1 === 0 && v.dom >= 1 && v.dom <= 31) out.items[id].dom = v.dom;
    var YMD = /^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$/;
    if (day === PERIOD && YMD.test(v.st) && YMD.test(v.en) && v.st <= v.en){ out.items[id].st = v.st; out.items[id].en = v.en; }
    if (typeof v.tm === 'string' && /^(am|pm|nt|([01]\d|2[0-3]):[0-5]\d)$/.test(v.tm)) out.items[id].tm = v.tm;
  });
  var d = s.dels && typeof s.dels === 'object' ? s.dels : {};
  Object.keys(d).forEach(function(id){ if (typeof d[id] === 'string') out.dels[id] = d[id]; });
  var dn = s.done && typeof s.done === 'object' ? s.done : {};
  Object.keys(dn).forEach(function(k){ var v = dn[k]; if (v && typeof v === 'object') out.done[k] = {on:!!v.on, upd:String(v.upd || '')}; });
  var rn = s.rain && typeof s.rain === 'object' ? s.rain : {};
  Object.keys(rn).forEach(function(k){ var v = rn[k]; if (/^\d{4}-\d{2}-\d{2}$/.test(k) && v && typeof v === 'object') out.rain[k] = {on:!!v.on, upd:String(v.upd || '')}; });
  return out;
}
function ymd(dt){
  return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
}
function dayIndex(dt){ return (dt.getDay() + 6) % 7; }             /* 月=0 … 日=6 */
function weekDates(dt){                                             /* その週の月曜〜日曜の 'YYYY-MM-DD' */
  var m = new Date(dt.getFullYear(), dt.getMonth(), dt.getDate() - dayIndex(dt));
  var out = [];
  for (var i = 0; i < 7; i++) out.push(ymd(new Date(m.getFullYear(), m.getMonth(), m.getDate() + i)));
  return out;
}
/* merge(a, b)。どちらの順で呼んでも、どの端末の時計でも同じ結果になる。
   ・同じ時刻で中身が違うときは、欄の多い方→中身の指紋の大きい方を採る（手元びいきだと2台で書き合いが止まらない）
   ・「できた」の印の70日は、データの中の一番新しい日付から数える（端末の時計で決めると境目で食い違う） */
function newer(x, y){
  if (!x) return y;
  if (!y) return x;
  if (x.upd !== y.upd) return y.upd > x.upd ? y : x;
  var kx = Object.keys(x).length, ky = Object.keys(y).length;       /* 同じ時刻なら欄の多い方＝古い端末が知らない欄（色・日付・時間帯）を落とした版に負けない */
  if (kx !== ky) return ky > kx ? y : x;
  return sig(y) > sig(x) ? y : x;
}
function shiftYmd(ymdStr, days){
  var p = ymdStr.split('-'), d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2] + days));
  return d.toISOString().slice(0, 10);
}
function merge(a, b){
  a = clean(a); b = clean(b);
  var out = blank();
  Object.keys(a.dels).concat(Object.keys(b.dels)).forEach(function(id){
    var x = a.dels[id] || '', y = b.dels[id] || '';
    out.dels[id] = x >= y ? x : y;
  });
  Object.keys(a.items).concat(Object.keys(b.items)).forEach(function(id){
    if (out.items[id]) return;
    var win = newer(a.items[id], b.items[id]);
    if (out.dels[id] && out.dels[id] >= win.upd) return;          /* 消したあとに直したものだけ残す */
    out.items[id] = win;
  });
  var keys = Object.keys(a.done).concat(Object.keys(b.done)), top = '';
  var rkeys = Object.keys(a.rain).concat(Object.keys(b.rain));
  keys.concat(rkeys).forEach(function(k){ if (/^\d{4}-\d{2}-\d{2}/.test(k) && k.slice(0, 10) > top) top = k.slice(0, 10); });
  var limit = top ? shiftYmd(top, -KEEP_DAYS) : '';
  keys.forEach(function(k){
    if (out.done[k] || k.slice(0, 10) < limit) return;
    var id = k.slice(11);
    if (!out.items[id] && out.dels[id]) return;                   /* 消したものの印は残さない */
    out.done[k] = newer(a.done[k], b.done[k]);
  });
  rkeys.forEach(function(k){
    if (out.rain[k] || k < limit) return;
    out.rain[k] = newer(a.rain[k], b.rain[k]);
  });
  return out;
}
function sig(s){                                                    /* 中身の指紋（キーの順番に左右されない） */
  function norm(v){
    if (Array.isArray(v)) return v.map(norm);
    if (v && typeof v === 'object'){ var o = {}; Object.keys(v).sort().forEach(function(k){ o[k] = norm(v[k]); }); return o; }
    return v;
  }
  return JSON.stringify(norm(s));
}
function itemsOf(s, day){
  return Object.keys(s.items).map(function(id){ return s.items[id]; })
    .filter(function(v){ return v.day === day; })
    .sort(function(x, y){
      var a = day === ANNIV ? x.md || '99' : day === ONCE ? x.ymd || '9999' : day === MONTHLY ? String(x.dom || 99).padStart(2, '0') : day === PERIOD ? x.st || '9999' : '',
          b = day === ANNIV ? y.md || '99' : day === ONCE ? y.ymd || '9999' : day === MONTHLY ? String(y.dom || 99).padStart(2, '0') : day === PERIOD ? y.st || '9999' : '';
      var p = todKey(x.tm), q = todKey(y.tm);
      return (a !== b ? (a < b ? -1 : 1) : 0) || (p !== q ? (p < q ? -1 : 1) : 0) || x.ord - y.ord || (x.id < y.id ? -1 : 1);
    });
}
function todKey(tm){                                                /* 並べる順：午前(0時)→時刻→午後(12時)→時刻→夜(18時)→時刻→時間帯なし */
  return tm === 'am' ? '00:00' : tm === 'pm' ? '12:00' : tm === 'nt' ? '18:00' : tm ? tm + ' ' : '99';
}
function isAnniv(v, ymdStr){                                        /* 記念日：毎週＝同じ曜日／毎月＝同じ日（無い月は月末）／毎年＝同じ月日（2月29日は平年なら28日） */
  var md = v.md;
  if (!md) return false;
  if (v.base && ymdStr < v.base) return false;                     /* 元の日より前には出さない */
  if (v.rep === 'w') return !!v.base && weekday(v.base) === weekday(ymdStr);
  if (v.rep === 'm') return isMonthDay(+md.slice(3), ymdStr);
  var m = ymdStr.slice(5), y = +ymdStr.slice(0, 4);
  if (md === m) return true;
  return md === '02-29' && m === '02-28' && !(y % 4 === 0 && (y % 100 !== 0 || y % 400 === 0));
}
function weekday(ymdStr){ var p = ymdStr.split('-'); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])).getUTCDay(); }
function annivCount(v, ymdStr){                                      /* 元の日から数えて何週・何か月・何年（その日が0なら空） */
  if (!v.base) return '';
  var y = +ymdStr.slice(0, 4) - +v.base.slice(0, 4), m = y * 12 + +ymdStr.slice(5, 7) - +v.base.slice(5, 7);
  var n = v.rep === 'w' ? Math.round(daysBetween(v.base, ymdStr) / 7) : v.rep === 'm' ? m : y;
  return n > 0 ? n + (v.rep === 'w' ? '週' : v.rep === 'm' ? 'か月' : '年') : '';
}
function daysBetween(a, b){                                         /* a から b まで何日（同じ日なら0） */
  var p = a.split('-'), q = b.split('-');
  return Math.round((Date.UTC(+q[0], +q[1] - 1, +q[2]) - Date.UTC(+p[0], +p[1] - 1, +p[2])) / 864e5);
}
function isMonthDay(dom, ymdStr){                                   /* 31日など、その月に無い日は月末に出す */
  if (!dom) return false;
  var y = +ymdStr.slice(0, 4), m = +ymdStr.slice(5, 7), d = +ymdStr.slice(8), last = new Date(Date.UTC(y, m, 0)).getUTCDate();
  return d === Math.min(dom, last);
}
function itemsForDate(s, ymdStr, di){                               /* その日に並ぶもの＝曜日＋（雨なら）雨の日＋その日の記念日・日付・毎月 */
  var r = s.rain[ymdStr];
  return itemsOf(s, di)
    .concat(r && r.on ? itemsOf(s, RAIN) : [])
    .concat(itemsOf(s, ANNIV).filter(function(v){ return isAnniv(v, ymdStr); }))
    .concat(itemsOf(s, ONCE).filter(function(v){ return v.ymd === ymdStr; }))
    .concat(itemsOf(s, MONTHLY).filter(function(v){ return isMonthDay(v.dom, ymdStr) && !(v.ymd && ymdStr < v.ymd); }))
    .concat(itemsOf(s, PERIOD).filter(function(v){ return v.st && v.st <= ymdStr && ymdStr <= v.en; }))
    .sort(function(x, y){ var p = todKey(x.tm), q = todKey(y.tm); return p === q ? 0 : p < q ? -1 : 1; });   /* 時間帯の順（同じなら今までの並び） */
}
/* 色番号。zcol を持つものはそれ、持たないもの（色を足す前に作ったもの）は、使われている数がいちばん少ない番号を ord 順に振る。
   保存はしない＝起動時に書き込まない。どの端末でも同じデータなら同じ色になる */
function leastTint(count){ var k = 0; for (var i = 1; i < TINTS; i++) if (count[i] < count[k]) k = i; return k; }
function tintsOf(s){
  var all = Object.keys(s.items).map(function(id){ return s.items[id]; })
    .sort(function(x, y){ return x.ord - y.ord || (x.id < y.id ? -1 : 1); });
  var out = {}, count = [];
  for (var i = 0; i < TINTS; i++) count.push(0);
  all.forEach(function(v){ if (v.zcol != null){ out[v.id] = v.zcol; count[v.zcol]++; } });
  all.forEach(function(v){ if (out[v.id] == null){ var k = leastTint(count); out[v.id] = k; count[k]++; } });
  return out;
}
function nextTint(s){                                               /* 新しく足すものの色 */
  var t = tintsOf(s), count = [];
  for (var i = 0; i < TINTS; i++) count.push(0);
  Object.keys(t).forEach(function(id){ count[t[id]]++; });
  return leastTint(count);
}
function weekScore(s, dt){                                          /* 今週できた数 / 1週間ぶんの数 */
  var dates = weekDates(dt), n = 0, total = 0;
  for (var i = 0; i < 7; i++){
    itemsForDate(s, dates[i], i).forEach(function(v){
      total++;
      var d = s.done[dates[i] + '|' + v.id];
      if (d && d.on) n++;
    });
  }
  return {n:n, total:total};
}
/* ---------- 純粋な関数（ここまで） ---------- */

var state = blank();
try { state = clean(JSON.parse(localStorage.getItem(KEY))); } catch (e) {}

function nowISO(){ return new Date().toISOString(); }
function uid(){
  var a = new Uint8Array(8); crypto.getRandomValues(a);
  return Date.now().toString(36) + Array.prototype.map.call(a, function(x){ return x.toString(16).padStart(2, '0'); }).join('').slice(0, 10);
}
function esc(t){ return String(t).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function $(q){ return document.querySelector(q); }
function tone(ic){ return 't' + (PRESETS.indexOf(ic) % 6 + 1); }
function thumb(th, cls){
  cls = cls || '';
  if (th.k === 'img') return '<span class="th ' + cls + '"><img src="' + esc(th.src) + '" alt=""></span>';
  return '<span class="th ' + tone(th.ic) + ' ' + cls + '"><svg class="ic" aria-hidden="true"><use href="#p-' + th.ic + '"/></svg></span>';
}
function mdLabel(md){ return md ? +md.slice(0, 2) + '月' + +md.slice(3) + '日' : ''; }
function kindOf(i){ return KINDS.filter(function(k){ return k.i === i; })[0]; }
function dotInner(i){ var k = kindOf(i); return k ? '<svg class="ic" aria-hidden="true"><use href="#p-' + k.ic + '"/></svg>' : DAYS[i]; }
function dayName(i){ var k = kindOf(i); return k ? k.nm : DAYS[i] + '曜'; }
function isRainy(key){ var r = state.rain[key || ymd(new Date())]; return !!(r && r.on); }
function dateLabel(date){                                          /* 今年なら月日だけ */
  if (!date) return '';
  return (date.slice(0, 4) === String(new Date().getFullYear()) ? '' : +date.slice(0, 4) + '年') + mdLabel(date.slice(5));
}
function todLabel(tm){ return tm === 'am' ? '午前' : tm === 'pm' ? '午後' : tm === 'nt' ? '夜' : tm ? String(+tm.slice(0, 2)) + tm.slice(2) : ''; }
function annivLabel(v){
  return v.rep === 'w' ? '毎週' + (v.base ? DAYS[(weekday(v.base) + 6) % 7] + '曜' : '') : v.rep === 'm' ? '毎月' + +v.md.slice(3) + '日' : '毎年' + mdLabel(v.md);
}
function whenLabel(v){ return [v.md ? annivLabel(v) : v.dom ? '毎月' + v.dom + '日' : v.ymd ? dateLabel(v.ymd) : v.st ? dateLabel(v.st) + '〜' + dateLabel(v.en) : '', todLabel(v.tm)].filter(Boolean).join(' '); }
function display(i){                                                /* 日付・期間は、これからの分を先に・終わった分は新しい順で後ろに（日付の先頭に毎月） */
  var list = itemsOf(state, i);
  if (i === ONCE) return itemsOf(state, MONTHLY).concat(onceOrder(list, i));
  return i === PERIOD ? onceOrder(list, i) : list;
}
function onceOrder(list, i){
  var t = ymd(new Date()), last = function(v){ return (i === ONCE ? v.ymd : v.en) || ''; };
  return list.filter(function(v){ return last(v) >= t; }).concat(list.filter(function(v){ return last(v) < t; }).reverse());
}
function hasOnceToday(){ var key = ymd(new Date()); return itemsOf(state, ONCE).some(function(v){ return v.ymd === key; }); }
function hasPeriodToday(){ var key = ymd(new Date()); return itemsOf(state, PERIOD).some(function(v){ return v.st && v.st <= key && key <= v.en; }); }
function hasMonthlyToday(){ var key = ymd(new Date()); return itemsOf(state, MONTHLY).some(function(v){ return isMonthDay(v.dom, key) && !(v.ymd && key < v.ymd); }); }
function hasAnnivToday(){ var key = ymd(new Date()); return itemsOf(state, ANNIV).some(function(v){ return isAnniv(v, key); }); }
var toastTimer = null;
function toast(t){
  var el = $('#toast'); el.textContent = t;
  if (el.showPopover){                                            /* シートより上に出す（dialog は最上層にいるので z-index では勝てない） */
    try { if (el.matches(':popover-open')) el.hidePopover(); el.showPopover(); } catch (e) {}
  }
  requestAnimationFrame(function(){ el.classList.add('on'); });
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){
    el.classList.remove('on');
    toastTimer = setTimeout(function(){ if (el.hidePopover) try { el.hidePopover(); } catch (e) {} }, 220);
  }, 1800);
}

function save(){
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch (e) { toast('端末の容量が足りません'); }
  SYNC.later();
}

/* ================= 描画 ================= */
var counterEl = $('#counter');
function setCounter(n){
  var s = String(n);
  if (counterEl.children.length !== s.length){
    counterEl.innerHTML = s.split('').map(function(){
      return '<span class="win"><span class="col">' + '0123456789'.split('').map(function(d){ return '<span>' + d + '</span>'; }).join('') + '</span></span>';
    }).join('');
    counterEl.offsetHeight;                                       /* 作った直後の位置を確定させてから回す */
  }
  Array.prototype.forEach.call(counterEl.querySelectorAll('.col'), function(col, i){
    col.style.transform = 'translateY(' + (-1.5 * +s[i]) + 'em)';
  });
}

function renderToday(){
  var dt = new Date(), di = dayIndex(dt), key = ymd(dt);
  $('#today-dot').textContent = DAYS[di];
  $('#today-h').innerHTML = '<span class="sr">今日 ' + DAYS[di] + '曜日</span>';
  var rainy = isRainy(key);
  $('#rain').setAttribute('aria-pressed', rainy);
  var list = itemsForDate(state, key, di), body = $('#today-body');
  if (!list.length){
    body.innerHTML =
      '<div class="empty">' +
        '<svg class="illust" viewBox="0 0 200 120" aria-hidden="true">' +
          '<circle class="soft" cx="100" cy="64" r="44"/>' +
          '<rect x="72" y="70" width="56" height="34" rx="7"/>' +
          '<path d="M100 70V50"/><path d="M100 56c-10 0-17-6-18-16 10 0 17 6 18 16z"/><path d="M100 50c0-10 7-16 17-17 0 10-7 17-17 17z"/>' +
          '<path d="M40 40l3 8 8 3-8 3-3 8-3-8-8-3 8-3zM158 24l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/>' +
        '</svg>' +
        '<button class="btn fill" type="button" data-add="' + di + '"><svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg>追加</button>' +
      '</div>';
  } else {
    body.innerHTML = tilesHtml(list, key, true);
  }
  renderScore();
}
function tilesHtml(list, key, can){                                /* can=false は先の日（まだ「できた」を付けない） */
  return '<div class="tiles" data-date="' + key + '">' + list.map(function(v){
    var on = !!(state.done[key + '|' + v.id] && state.done[key + '|' + v.id].on);
    return '<button class="tile' + (on ? ' on' : '') + '" type="button" data-done="' + esc(v.id) + '" aria-pressed="' + on + '"' + (can ? '' : ' disabled') + '>' +
      thumb(v.th) +
      (kindOf(v.day) ? '<span class="mark" aria-hidden="true"><svg class="ic"><use href="#p-' + kindOf(v.day).ic + '"/></svg></span>' : '') +
      '<span class="stamp" aria-hidden="true"><i><svg class="ic"><use href="#i-check"/></svg></i></span>' +
      '<span class="nm"><i class="swatch" aria-hidden="true"' + tint(v.id) + '></i>' + esc(v.name) + '</span>' +
      tileWhen(v, key) + '</button>';
  }).join('') + '</div>';
}
function tileWhen(v, key){                                         /* 期間は「何日目/全部で何日」・記念日は「何年」など */
  var w = [v.st ? (daysBetween(v.st, key) + 1) + '/' + (daysBetween(v.st, v.en) + 1) + '日' : v.md ? annivCount(v, key) : '', todLabel(v.tm)].filter(Boolean).join(' ');
  return w ? '<span class="when">' + w + '</span>' : '';
}
function renderScore(){
  var sc = weekScore(state, new Date());
  setCounter(sc.n);
  $('#total').textContent = sc.total;
  $('#score').hidden = !sc.total;
  $('#score-sr').textContent = '今週 ' + sc.total + '個のうち ' + sc.n + '個できた';
}

function renderWeek(){
  var di = dayIndex(new Date());
  var nowOf = {}; nowOf[di] = true; nowOf[RAIN] = isRainy(); nowOf[ANNIV] = hasAnnivToday(); nowOf[ONCE] = hasOnceToday() || hasMonthlyToday(); nowOf[PERIOD] = hasPeriodToday();
  function label(v){ var w = whenLabel(v); return (w ? w + ' ' : '') + v.name; }
  function row(i){
    var list = display(i), shown = list.slice(0, 3), now = !!nowOf[i];
    var strip = list.length
      ? shown.map(function(v){ return thumb(v.th); }).join('') +
        (list.length > shown.length ? '<span class="more">+' + (list.length - shown.length) + '</span>' : '') +
        '<span class="names">' + esc(list.map(label).join('・')) + '</span>'
      : '<span class="plus"><svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg></span>';
    return '<button class="row' + (now ? ' now' : '') + '" type="button" data-day="' + i + '" aria-label="' + dayName(i) + ' ' + (list.length ? esc(list.map(label).join('、')) : 'なし') + '">' +
      '<span class="dot' + (now ? ' now' : '') + '" aria-hidden="true">' + dotInner(i) + '</span>' +
      '<span class="strip" aria-hidden="true">' + strip + '</span>' +
      '<svg class="ic chev" aria-hidden="true"><use href="#i-chev"/></svg></button>';
  }

/* 写真を真ん中で正方形に切って 240px の JPEG にする（同期する中身を軽く保つ） */
function toThumb(file){
  return new Promise(function(ok, ng){
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function(){
      var s = Math.min(img.naturalWidth, img.naturalHeight), N = 240;
      if (!s){ URL.revokeObjectURL(url); ng(); return; }
      var c = document.createElement('canvas'); c.width = c.height = N;
      c.getContext('2d').drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, N, N);
      URL.revokeObjectURL(url);
      ok(c.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = function(){ URL.revokeObjectURL(url); ng(); };
    img.src = url;
  });
}

  function outside(e){
    var r = d.getBoundingClientRect();
    return e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom;
  }
  d.addEventListener('pointerdown', function(e){ downOutside = e.target === d && outside(e); });
  d.addEventListener('click', function(e){                          /* 外側で押して外側で離したときだけ閉じる */
    if (downOutside && e.target === d && outside(e)) d.close();
    downOutside = false;
  });
});

/* ================= クラウド同期 =================
   Supabase の tsumigi_state（id='kodai' の1行。rev は書くたびに1つ増える版番号）。
   ・まず rev だけ読む。前に合わせた版のままなら中身は取りに行かない（写真で重いため）
   ・版が変わっていたら中身を取って和集合し、「読んだ版のままなら書く」。
     その間にほかの端末が書いていたら0行になるので、読み直してやり直す（楽観ロック）
   ・リアルタイムの知らせは合図だけ。自分が書いた版の知らせは無視する
   ・失敗したら 5秒→10秒→…→60秒 と間を空けてやり直す。オフラインで開いたときは、つながったら部品を読み込み直す */
var SYNC = (function(){
  var TABLE = 'tsumigi_state', ID = 'kodai';
  var timer = null, busy = false, again = false, dirty = false, subscribed = false, rtTimer = null;
  var seenRev = -1, retryMs = 0, retryTimer = null, warnedFull = false;
  var btn = $('#sync');
  function paint(s){
    btn.dataset.s = s;
    btn.querySelector('use').setAttribute('href', s === 'ok' || s === 'busy' ? '#i-cloud' : '#i-cloud-off');
    btn.setAttribute('aria-label', s === 'off' ? 'この端末に保存' : s === 'err' ? 'オフライン' : s === 'busy' ? '同期中' : '同期ずみ');
  }
  function keep(){
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) { if (!warnedFull){ warnedFull = true; toast('端末の容量が足りません'); } }
  }
  function ensure(){
    if (sb || TEST) return !!sb;
    if (window.supabase && window.supabase.createClient){
      sb = window.supabase.createClient(SB_URL, SB_ANON);
      return true;
    }
    if (!document.getElementById('sb-js') && navigator.onLine !== false){
      var el = document.createElement('script');
      el.id = 'sb-js'; el.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
      el.onload = function(){ run(); };
      el.onerror = function(){ el.remove(); };
      document.head.appendChild(el);
    }
    return false;
  }
  function subscribe(){
    if (subscribed) return;
    subscribed = true;
    sb.channel('tsumigi-rt')
      .on('postgres_changes', {event:'*', schema:'public', table:TABLE, filter:'id=eq.' + ID}, function(p){
        var r = p && p.new && p.new.rev;
        if (r != null && +r === seenRev) return;                  /* 自分が書いた版 */
        clearTimeout(rtTimer); rtTimer = setTimeout(run, 300);
      })
      .subscribe();
  }
  function write(body, rev){
    var next = (rev || 0) + 1, t = nowISO();
    var q = rev === null
      ? sb.from(TABLE).insert({id:ID, state:body, rev:next, updated_at:t}).select('rev')
      : sb.from(TABLE).update({state:body, rev:next, updated_at:t}).eq('id', ID).eq('rev', rev).select('rev');
    return q.then(function(r){
      if (r && r.error){
        if (rev === null && r.error.code === '23505') return 'conflict';   /* 同時に1行目を作られた */
        throw new Error('write');
      }
      if (!r || !r.data || !r.data.length) return 'conflict';            /* 読んだあとに版が進んでいた */
      seenRev = next;
      return 'ok';
    });
  }
  function step(sending, n){
    sb.from(TABLE).select('rev').eq('id', ID).maybeSingle().then(function(res){
      if (!res || res.error) throw new Error('rev');
      var rev = res.data ? (+res.data.rev || 0) : null;
      if (rev === null) return write(clean(state), null);
      if (rev === seenRev) return sending ? write(state, rev) : 'same';  /* 前に合わせた版のまま＝手元が最新 */
      return sb.from(TABLE).select('state,rev').eq('id', ID).maybeSingle().then(function(r2){
        if (!r2 || r2.error || !r2.data) throw new Error('state');
        var remote = clean(r2.data.state), rv = +r2.data.rev || 0;
        var merged = merge(state, remote);
        if (sig(merged) !== sig(state)){ state = merged; keep(); renderAll(); }
        if (sig(merged) === sig(remote)){ seenRev = rv; return 'same'; }
        return write(merged, rv);
      });
    }).then(function(r){
      if (r === 'conflict'){
        if (n < 5){ step(true, n + 1); return; }
        throw new Error('conflict');
      }
      busy = false; retryMs = 0; paint('ok');
      if (again || dirty) run();
    }).catch(function(){
      busy = false;
      if (sending) dirty = true;
      paint('err');
      retryMs = Math.min(retryMs ? retryMs * 2 : 5000, 60000);
      clearTimeout(retryTimer); retryTimer = setTimeout(run, retryMs);
    });
  }
  function run(){
    if (!ensure()){ paint(TEST ? 'off' : 'err'); return; }
    subscribe();
    if (busy){ again = true; return; }
    busy = true; again = false; clearTimeout(retryTimer);
    var sending = dirty; dirty = false;
    paint('busy');
    step(sending, 0);
  }
  function later(){
    dirty = true;
    if (TEST && !sb) return;
    clearTimeout(timer); timer = setTimeout(run, 500);
  }
  function now(){ clearTimeout(timer); run(); }
  btn.addEventListener('click', now);
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible'){ renderAll(); now(); }
    else if (dirty) now();
  });
  window.addEventListener('pagehide', function(){ if (dirty) now(); });
  window.addEventListener('online', now);
  paint(TEST && !sb ? 'off' : 'busy');
  return {later:later, now:now};
})();

/* 日付が変わったら今日を描き直す */
(function tick(){
  var n = new Date(), next = new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1, 0, 0, 5);
  setTimeout(function(){ renderAll(); tick(); }, next - n);
})();

/* ================= 最初の描画（ここでは保存しない） ================= */
renderAll();
SYNC.now();
</script>
<!-- tsumiki-back-button -->
<style>
  #tsumikiEdge{position:fixed; top:0; bottom:0; left:0; width:22px; z-index:999;}
  #tsumikiPeek{
    position:fixed; top:50%; left:0; z-index:1001; margin-top:-23px;
    width:46px; height:46px; display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.92);
    -webkit-backdrop-filter:saturate(180%) blur(14px); backdrop-filter:saturate(180%) blur(14px);
    border:1px solid rgba(0,0,0,.06); border-radius:50%;
    box-shadow:0 6px 20px rgba(0,0,0,.18);
    color:#0071e3; font-size:24px; font-weight:600; line-height:1;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Helvetica Neue",Arial,sans-serif;
    transform:translateX(-70px) scale(.8); opacity:0; pointer-events:none;
  }
</style>
<div id="tsumikiEdge"></div>
<div id="tsumikiPeek">‹</div>
<script>
  (function(){
    var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
      || window.navigator.standalone === true;
    var fromTsumiki = false;
    try{
      if(document.referrer){
        var r = new URL(document.referrer);
        fromTsumiki = (r.origin === location.origin);
      }
    }catch(e){}
    if(!(standalone && fromTsumiki)) return;

    var peek = document.getElementById('tsumikiPeek');
    var edge = document.getElementById('tsumikiEdge');

    function goBack(){ location.href = 'index.html'; }

    /* --- 左端エッジスワイプで戻る（iOS純正の戻る操作。見えるボタンは置かない） --- */
    var sx=0, sy=0, prog=0, dragging=false, W=window.innerWidth;
    var TRIGGER = Math.min(120, W*0.32);
    window.addEventListener('resize', function(){ W=window.innerWidth; TRIGGER=Math.min(120, W*0.32); });

    function reset(){
      dragging = false; prog = 0;
      peek.style.transition = 'transform .25s ease, opacity .25s ease';
      peek.style.transform = 'translateX(-70px) scale(.8)';
      peek.style.opacity = 0;
    }
    function start(e){
      var t = e.touches ? e.touches[0] : e;
      if(t.clientX > 26) return;
      sx = t.clientX; sy = t.clientY; prog = 0; dragging = true;
      peek.style.transition = 'none';
    }
    function move(e){
      if(!dragging) return;
      var t = e.touches ? e.touches[0] : e;
      var dx = t.clientX - sx, dy = t.clientY - sy;
      if(Math.abs(dy) > Math.abs(dx) + 12){ reset(); return; }
      if(dx < 0) dx = 0;
      prog = Math.min(dx / TRIGGER, 1);
      peek.style.transform = 'translateX(' + (-70 + prog*82) + 'px) scale(' + (0.8 + prog*0.2) + ')';
      peek.style.opacity = prog;
      if(dx > 6 && e.cancelable) e.preventDefault();
    }
    function end(){
      if(!dragging) return;
      dragging = false;
      if(prog >= 0.999){
        peek.style.transition = 'transform .25s ease, opacity .25s ease';
        peek.style.transform = 'translateX(20px) scale(1.05)';
        peek.style.opacity = 1;
        goBack();
      }else{
        reset();
      }
    }
    edge.addEventListener('touchstart', start, {passive:true});
    window.addEventListener('touchmove', move, {passive:false});
    window.addEventListener('touchend', end, {passive:true});
    window.addEventListener('touchcancel', end, {passive:true});
  })();
</script>
<!-- /tsumiki-back-button -->
</body>
