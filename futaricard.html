/* ============ CSV 取り込み ============ */
function parseCsvLine(line){
  const res=[];let cur='',inQ=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(c==='"'){if(inQ&&line[i+1]==='"'){cur+='"';i++;continue;}inQ=!inQ;continue;}
    if(c===','&&!inQ){res.push(cur);cur='';continue;}
    cur+=c;
  }
  res.push(cur);return res;
}
function decodeBuffer(buf){
  try{return new TextDecoder('utf-8',{fatal:true}).decode(buf);}
  catch(e){try{return new TextDecoder('shift-jis',{fatal:false}).decode(buf);}
  catch(e2){return new TextDecoder('utf-8').decode(buf);}}
}
function hashStr(s){let h=0;for(let i=0;i<s.length;i++)h=((h<<5)-h+s.charCodeAt(i))|0;return Math.abs(h).toString(36);}
function findHeaderIdx(cols,cands){
  for(const c of cands){const i=cols.findIndex(h=>h.replace(/\s/g,'').includes(c));if(i>=0)return i;}
  return -1;
}
// 口座振替・支払い行（買い物ではない）は取り込まない
const PAYMENT_RE=/(口座振替|お支払い金額|ご入金|自動振替|カードお支払|リボお支払|ボーナス払い|お振替|繰越|前回ご請求|今回お支払)/;
const DATE_CELL_RE=/^\s*\d{4}[\/\-.]\d{1,2}[\/\-.]\d{1,2}\s*$/;
// セルを数値化（全角数字・¥・カンマ・空白・△▲・全角マイナスを吸収）。整数でなければNaN
function cellToInt(cell){
  const norm=String(cell||'').trim()
    .replace(/[０-９]/g,d=>'０１２３４５６７８９'.indexOf(d))
    .replace(/[▲△－]/g,'-').replace(/[¥￥,\s]/g,'');
  return /^-?\d+$/.test(norm)?parseInt(norm,10):NaN;
}
// 投資の積立（クレカ積立・投信・NISA など）は買い物ではないので、共同に入れず「こうだい個人」で取り込む
const PERSONAL_RE=/(投信|積立|つみたて|証券|ＮＩＳＡ|NISA)/i;
function mkItem(date,desc,amount,counter){
  const baseKey=date+'|'+desc+'|'+amount;
  counter[baseKey]=(counter[baseKey]||0)+1;
  const sfx=counter[baseKey]>1?'|'+counter[baseKey]:'';
  return {id:'tx_'+hashStr(baseKey+sfx), src:'csv', date, desc:desc.replace(/\s+/g,' '), amount, tag:PERSONAL_RE.test(desc)?'kodai':'share'};
}
// 「同じ明細か」を見るための鍵。CSVの出どころで変わる 空白・全角半角・長音/ハイフン・（注記）・／ｉＤ のゆれを吸う
function dupKey(it){
  const d=zenNum(String(it.desc||'')).toLowerCase()
    .replace(/[（(][^）)]*[）)]/g,'')
    .replace(/[\/／]\s*(id|nfc|ap|apl|qp|edy|waon|nanaco|ic|suica|pasmo|ec|app|qr|pay)\s*$/i,'')
    .replace(/[\s　]/g,'').replace(/[－ー—‐\-]/g,'ー');
  return it.date+'|'+it.amount+'|'+d;
}
// すでにある明細と数で突き合わせる（同じ日に同じ店・同じ金額が2回あっても、多いぶんだけ新しい明細として残す）
function dupFilter(existing, incoming){
  const have={}; existing.forEach(x=>{ const k=dupKey(x); have[k]=(have[k]||0)+1; });
  const fresh=[], dups=[];
  incoming.forEach(t=>{ const k=dupKey(t); if(have[k]>0){ have[k]--; dups.push(t); } else fresh.push(t); });
  return {fresh, dups};
}
async function parseCreditCSV(file){
  const buf=await file.arrayBuffer();
  const text=decodeBuffer(buf);
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  if(!lines.length){alert('CSVに明細がありません');return null;}
  // ヘッダー行の有無を判定：先頭行の第1列が日付なら「ヘッダー無し（三井住友Vpass等）」
  const first=parseCsvLine(lines[0]);
  if(DATE_CELL_RE.test(first[0]||'')) return parseHeaderless(lines);

  // ── ヘッダーあり（Amex等・列名で金額列を特定）──
  const header=first;
  const dIdx=findHeaderIdx(header,['ご利用日','利用日','取引日','日付','ご利用年月日','Date','TransactionDate']);
  const descIdx=findHeaderIdx(header,['ご利用内容','ご利用先','ご利用店名','ご利用店名・商品名','店名','内容','店舗','摘要','利用店名','加盟店名','Description','Merchant','明細','ご利用明細']);
  const AMT_BAD=/海外|現地|手数料|割引|ポイント|レート|為替|キャッシュバック|処理日|利用日/;
  const amtCand=header.map((h,i)=>({h,i})).filter(o=>/金額/.test(o.h)&&!AMT_BAD.test(o.h));
  let amtIdx=-1;
  if(amtCand.length){
    const pri=amtCand.find(o=>/ご利用金額|ご請求金額|請求金額|お支払金額|支払金額|利用金額|本体金額/.test(o.h));
    amtIdx=pri?pri.i:amtCand[0].i;
  }
  if(amtIdx<0)amtIdx=findHeaderIdx(header,['Amount','amount']);
  // 列名が無く、2行目以降に日付始まりの行がある＝ヘッダー無しの形
  // （三井住友の新しいCSV：1行目が「名義,カード番号,カード名」、カードごとに見出し行が挟まる）
  if(dIdx<0&&lines.slice(1).some(l=>DATE_CELL_RE.test(parseCsvLine(l)[0]||''))) return parseHeaderless(lines);
  if(dIdx<0||descIdx<0||amtIdx<0){
    alert('CSVのフォーマットが認識できませんでした。\nヘッダ: '+header.join(' / ')+'\n\n必要な列: ご利用日 / ご利用内容(店名) / 金額\nこのヘッダをClaudeに伝えてもらえれば対応を追加します。');
    return null;
  }
  const items=[]; const counter={};
  for(let i=1;i<lines.length;i++){
    const cols=parseCsvLine(lines[i]); if(cols.length<2)continue;
    const rawDate=(cols[dIdx]||'').trim();
    const desc=(cols[descIdx]||'').trim();
    const amount=cellToInt(cols[amtIdx]);
    if(!rawDate||!desc||!isFinite(amount)||amount===0)continue;
    if(PAYMENT_RE.test(desc))continue;
    items.push(mkItem(normDate(rawDate), desc, amount, counter));
  }
  return items;
}
// ヘッダー無し・列位置固定（三井住友Vpass: 日付,店名,利用者,支払区分,,支払月,利用金額,請求額,…）
function parseHeaderless(lines){
  const items=[]; const counter={}; let billed=null;
  for(const line of lines){
    const c=parseCsvLine(line);
    const dm=(c[0]||'').trim().match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/);
    // 1列目が空で数字が1つだけの行＝CSV末尾の「お支払い合計」→ カードの請求額として控える
    if(!dm){ if(!(c[0]||'').trim()){ const nums=c.map(cellToInt).filter(v=>isFinite(v)); if(nums.length===1) billed=nums[0]; } continue; }                                   // 日付でない行（合計・注記等）はスキップ
    const desc=(c[1]||'').trim();
    if(!desc)continue;
    // 金額＝第3列以降で最初の「きれいな整数」列（利用者/支払区分/支払月などの非数値列を自動でスキップ→利用金額を拾う）
    let amount=NaN;
    for(let i=2;i<c.length;i++){ const v=cellToInt(c[i]); if(isFinite(v)&&v!==0){amount=v;break;} }
    if(!isFinite(amount)||amount===0)continue;
    if(PAYMENT_RE.test(desc))continue;
    items.push(mkItem(dm[1]+'-'+String(+dm[2]).padStart(2,'0')+'-'+String(+dm[3]).padStart(2,'0'), desc, amount, counter));
  }
  if(billed!=null) items.billed=billed;
  return items;
}
/* ===== 取り込み先の自動ふりわけ ===== */
// 明細の日付から「年月」を取り出す（"2026-08-13" → "2026-08"）
function ymOf(dateStr){ const m=String(dateStr||'').match(/^(\d{4})-(\d{2})/); return m?m[1]+'-'+m[2]:''; }
function ymLabel(ym){ return ym?(+ym.slice(5,7))+'月分':'日付不明分'; }
function ymJa(ym){ return ym?ym.slice(0,4)+'年'+(+ym.slice(5,7))+'月':'日付が読めなかった分'; }

/* ===== お支払い日（1回のお支払い＝1つの期間） ===== */
function dOf(s){ return new Date(+s.slice(0,4), +s.slice(5,7)-1, +s.slice(8,10)); }
function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function lastDayOf(y,m){ return new Date(y,m,0).getDate(); }   // m は 1〜12
// 日本の祝日（春分・秋分は1980〜2099年の近似式）。お支払い日を次の営業日へずらすのに使う
function baseHoliday(d){
  const y=d.getFullYear(), m=d.getMonth()+1, day=d.getDate(), w=d.getDay(), nth=Math.ceil(day/7);
  if([[1,1],[2,11],[2,23],[4,29],[5,3],[5,4],[5,5],[8,11],[11,3],[11,23]].some(([mm,dd])=>mm===m&&dd===day)) return true;
  if(w===1&&((m===1&&nth===2)||(m===7&&nth===3)||(m===9&&nth===3)||(m===10&&nth===2))) return true;
  const k=Math.floor((y-1980)/4);
  if(m===3&&day===Math.floor(20.8431+0.242194*(y-1980))-k) return true;
  if(m===9&&day===Math.floor(23.2488+0.242194*(y-1980))-k) return true;
  return false;
}
function jpHoliday(d){
  if(baseHoliday(d)) return true;
  // 振替休日：日曜の祝日から祝日が続いたあとの最初の日
  for(let x=addDays(d,-1); baseHoliday(x); x=addDays(x,-1)) if(x.getDay()===0) return true;
  // 国民の休日：祝日にはさまれた日
  return d.getDay()!==0 && baseHoliday(addDays(d,-1)) && baseHoliday(addDays(d,1));
}
function bankClosed(d){ const w=d.getDay(), m=d.getMonth()+1, day=d.getDate(); return w===0||w===6||(m===12&&day===31)||(m===1&&day<=3)||jpHoliday(d); }
// お支払い月 "2026-09" → お支払い日 "2026-09-28"（設定の支払日。休みなら次の営業日）
function payDateOf(ym){
  const y=+ym.slice(0,4), m=+ym.slice(5,7);
  let d=new Date(y, m-1, Math.min(db.payDay||26, lastDayOf(y,m)));
  while(bankClosed(d)) d=addDays(d,1);
  return ymd(d);
}
// そのお支払いの利用期間（前の月の締め日まで）→ {from, to, ym＝締めの月}
function useRangeOf(pay){
  const y=+pay.slice(0,4), m=+pay.slice(5,7), cd=db.closeDay||31;
  const cy=m===1?y-1:y, cm=m===1?12:m-1;
  const py=cm===1?cy-1:cy, pm=cm===1?12:cm-1;
  const to=new Date(cy, cm-1, Math.min(cd, lastDayOf(cy,cm)));
  const from=addDays(new Date(py, pm-1, Math.min(cd, lastDayOf(py,pm))), 1);
  return {from:ymd(from), to:ymd(to), ym:cy+'-'+pad(cm)};
}
function payLabel(pay){ return (+pay.slice(5,7))+'月'+(+pay.slice(8,10))+'日払い'; }
// 締めの月 "2026-07" → そのお支払い日（翌月の支払日）
function payOfYm(ym){ const y=+ym.slice(0,4), m=+ym.slice(5,7); return payDateOf(m===12?(y+1)+'-01':y+'-'+pad(m+1)); }
// 画面に出す期間の名前。自動でついた名前（「7月分」「9月28日払い」）は「◯月分」＝使った月にそろえる。自分でつけた名前はそのまま
const AUTO_NAME_RE=/^(\d{1,2}月分|\d{1,2}月\d{1,2}日払い)$/;
function pname(p){
  if(!p) return '';
  if(!AUTO_NAME_RE.test(p.name||'')) return p.name||'名称未設定';
  const ym=p.pay?useRangeOf(p.pay).ym:(periodExplicitYm(p)||periodMainYm(p));
  return ym?ymLabel(ym):p.name;
}
// 「9月28日払い予定」／お支払い日を過ぎていれば「8月26日払い」
function payNote(pay){ return pay?payLabel(pay)+(pay>today()?'予定':''):''; }
function payJa(pay){ const d=dOf(pay); return (d.getMonth()+1)+'月'+d.getDate()+'日（'+'日月火水木金土'[d.getDay()]+'）'; }
function mdShort(s){ return (+s.slice(5,7))+'/'+(+s.slice(8,10)); }
function payRouteJa(pay){ const rg=useRangeOf(pay); return pay.slice(0,4)+'年'+payLabel(pay)+'（利用 '+mdShort(rg.from)+'〜'+mdShort(rg.to)+'）'; }
function csvSum(p){ return p.items.filter(it=>it.src==='csv').reduce((a,b)=>a+b.amount,0); }
// ファイル名の「202609」からお支払い月を読む（三井住友のCSVはお支払い月の名前で保存される）
function stmtYmFromName(name){
  const m=String(name||'').match(/(20\d{2})[-_]?(0[1-9]|1[0-2])(?!\d)/); return m?m[1]+'-'+m[2]:'';
}
// 期間が覚えている「対象の月」（設定済みのときだけ）
function periodExplicitYm(p){ return /^\d{4}-\d{2}$/.test(p.ym||'')?p.ym:''; }
// 中の明細から推定した「いちばん多い月」
function periodMainYm(p){
  const c={}; (p.items||[]).forEach(it=>{ const k=ymOf(it.date); if(k)c[k]=(c[k]||0)+1; });
  const e=Object.entries(c).sort((a,b)=>b[1]-a[1]); return e.length?e[0][0]:'';
}
// その期間に入っている月の一覧（古い順）
function periodYms(p){ return [...new Set((p.items||[]).map(it=>ymOf(it.date)).filter(Boolean))].sort(); }
// この月の明細を入れるべき期間（①覚えている月 ②名前 ③中身から推定 の順にさがす）
function findPeriodForYm(ym){
  if(!ym) return null;
  return db.periods.find(p=>periodExplicitYm(p)===ym)
      || db.periods.find(p=>!periodExplicitYm(p)&&periodMatchesYm(p,ym))
      || db.periods.find(p=>!periodExplicitYm(p)&&!/[0-9]月/.test(zenNum(p.name))&&periodMainYm(p)===ym)
      || null;
}
// 期間の名前がその年月を指しているか（「8月分」「2026年8月」「2026-08」などを許容）
function periodMatchesYm(p,ym){
  if(!ym) return false;
  const y=ym.slice(0,4), mm=ym.slice(5,7), m=String(+mm);
  const n=zenNum(p.name).replace(/\s|　/g,'');
  if(n.includes(y+'-'+mm)||n.includes(y+'/'+mm)||n.includes(y+'.'+mm)) return true;
  if(n.includes(y+'年'+m+'月')) return true;
  const other=n.match(/(\d{4})年/);                       // 別の年が書いてあるなら不一致
  if(other&&other[1]!==y) return false;
  return new RegExp('(^|[^0-9])'+m+'月').test(n);
}

/* ===== CSV 取り込み（月ごとにふりわけ→確認してから反映） ===== */
// 取り込み／仕分け 共通の「月ごとの入れ先えらび」
// mode:'import' … CSVの新しい明細を入れる ／ mode:'split' … いまある期間の中身を月ごとに分ける
let pendingRoute=null;
async function handleCSV(file){
  const parsed=await parseCreditCSV(file);
  if(!parsed) return;
  if(!parsed.length){ toast('取り込める明細がありませんでした'); return; }
  // ファイル名にお支払い月があれば、CSVまるごとを「1回のお支払い」として1つの期間に入れる
  const sym=stmtYmFromName(file.name);
  if(sym){
    const pay=payDateOf(sym), rg=useRangeOf(pay);
    const dates=parsed.map(t=>t.date).filter(Boolean).sort();
    const lo=ymd(addDays(dOf(rg.from),-62));   // 締めに間に合わず遅れて載る明細の余裕（約2か月）
    if(dates.length&&dates[0]>=lo&&dates[dates.length-1]<pay){
      const hit=db.periods.find(p=>p.pay===pay)||db.periods.find(p=>!p.pay&&periodExplicitYm(p)===rg.ym);
      pendingRoute={mode:'import', groups:[{ym:rg.ym, pay, billed:parsed.billed, items:parsed, dest:hit?hit.id:'__new__'}]};
      openRouteSheet(); return;
    }
  }
  const groups=groupByYm(parsed).map(g=>{
    const hit=findPeriodForYm(g.ym);
    // 日付が読めなかったぶんは、いま開いている期間を既定にする
    return {ym:g.ym, items:g.items, dest: hit?hit.id:(g.ym?'__new__':db.current)};
  });
  pendingRoute={mode:'import', groups};
  openRouteSheet();
}
function groupByYm(items){
  const map=new Map();
  items.forEach(t=>{ const k=ymOf(t.date); if(!map.has(k))map.set(k,[]); map.get(k).push(t); });
  return [...map.entries()].sort((x,y)=>x[0]<y[0]?-1:1).map(([ym,items])=>({ym,items}));
}
// いまある期間の中身を月ごとに分けなおす
function openSplitSheet(p){
  const groups=groupByYm(p.items).map(g=>{
    const hit=findPeriodForYm(g.ym);
    return {ym:g.ym, items:g.items, dest:(hit?hit.id:(g.ym?'__new__':p.id))};
  });
  pendingRoute={mode:'split', srcId:p.id, groups};
  openRouteSheet();
}
function routeDupCount(g){
  if(g.dest==='__new__'||g.dest==='__skip__') return 0;
  const p=db.periods.find(x=>x.id===g.dest); if(!p) return 0;
  if(pendingRoute.mode==='import') return dupFilter(p.items,g.items).dups.length;
  const idset=new Set(p.items.map(x=>x.id));
  return g.items.filter(t=>idset.has(t.id)&&p.id!==pendingRoute.srcId).length;
}
function sampleNames(items){
  const ns=[...new Set(items.map(it=>dispName(it)).filter(Boolean))].slice(0,3);
  return ns.join('・')+(items.length>ns.length?' 他':'');
}
function openRouteSheet(){
  const R=pendingRoute, gs=R.groups, split=(R.mode==='split');
  const src=split?db.periods.find(x=>x.id===R.srcId):null;
  const rows=gs.map((g,i)=>{
    const sum=g.items.reduce((a,b)=>a+b.amount,0);
    const per=split?[]:g.items.filter(it=>it.tag==='kodai');
    const perL=per.length?'<div class="rline">'+ic('user','ic-sm')+'<span class="dot k"></span>'+esc(nm('kodai'))+'個人（積立など） '+per.length+'件・'+yen(per.reduce((a,b)=>a+b.amount,0))+'</div>':'';
    const billL=(g.pay&&g.billed!=null)?(g.billed===sum
      ?'<div class="rline good">'+ic('check','ic-sm')+'請求 '+yen(g.billed)+' と一致</div>'
      :'<div class="rline warn">'+ic('alert','ic-sm')+'請求 '+yen(g.billed)+'／明細 '+yen(sum)+'</div>'):'';
    const opts=db.periods.map(x=>'<option value="'+x.id+'"'+(g.dest===x.id?' selected':'')+'>'+
        (split&&x.id===R.srcId?'そのまま「'+esc(pname(x))+'」':'「'+esc(pname(x))+'」に入れる')+'</option>').join('')+
      '<option value="__new__"'+(g.dest==='__new__'?' selected':'')+'>＋「'+esc(g.pay?ymLabel(useRangeOf(g.pay).ym):ymLabel(g.ym))+'」を新しく作る</option>'+
      (split?'':'<option value="__skip__">取り込まない</option>');
    return '<div class="rcard"><div class="rtop">'+ic('cal','ic-sm')+'<b>'+esc(g.pay?ymLabel(useRangeOf(g.pay).ym)+'・'+payNote(g.pay):ymJa(g.ym))+'</b><span class="num">'+g.items.length+'件・'+yen(sum)+'</span></div>'+
      '<div class="rsample">'+esc(sampleNames(g.items))+'</div>'+billL+perL+
      '<div class="selbox"><select class="in rtdest" data-i="'+i+'" aria-label="入れ先">'+opts+'</select>'+ic('chev','ic-sm')+'</div>'+
      '<div class="note" id="rtNote'+i+'"></div></div>';
  }).join('');
  openSheet(
    sheetHead(split?'split':'upload', split?'月ごとに分ける':'取り込み')+
    (split&&src?'<div class="note lead">'+ic('folder','ic-sm')+'<span>「'+esc(pname(src))+'」</span></div>':'')+
    rows+
    '<button class="btn primary wide" type="button" id="rtGo">'+ic('check')+(split?'分ける':'取り込む')+'</button>'+
    '<button class="btn quiet wide" type="button" id="rtCancel">やめる</button>'
  );
  const syncNotes=()=>{
    gs.forEach((g,i)=>{
      const el=ov.querySelector('#rtNote'+i); if(!el) return;
      el.className='note'; el.innerHTML='';
      if(g.dest==='__skip__'){ el.innerHTML=ic('ban','ic-sm')+'<span>取り込まない</span>'; return; }
      const to=db.periods.find(x=>x.id===g.dest);
      if(!to) return;
      const msgs=[]; let warn=false;
      const others=periodYms(to).filter(y=>y!==g.ym);
      const otherCnt=to.items.filter(it=>ymOf(it.date)&&ymOf(it.date)!==g.ym).length;
      if(g.ym&&otherCnt&&!g.pay&&!(split&&to.id===R.srcId)){
        warn=true; msgs.push('別の月（'+others.map(ymJa).join('・')+'）が'+otherCnt+'件あり');
      }
      const d=routeDupCount(g);
      if(d) msgs.push('重複 '+d+'件は除く');
      if(g.pay&&to.pay!==g.pay) msgs.push(payNote(g.pay)+'として保存');
      if(!msgs.length) return;
      el.className='note'+(warn?' warn':'');
      el.innerHTML=ic(warn?'alert':'info','ic-sm')+'<span>'+msgs.map(esc).join('<br>')+'</span>';
    });
  };
  ov.querySelectorAll('.rtdest').forEach(sel=>{ sel.onchange=()=>{ gs[+sel.dataset.i].dest=sel.value; syncNotes(); }; });
  syncNotes();
  ov.querySelector('#rtCancel').onclick=()=>{ pendingRoute=null; closeSheet(); };
  ov.querySelector('#rtGo').onclick=()=>{ R.mode==='split'?runSplit():runImport(); };
}
// 入れ先の期間を用意する（__new__ なら作る）。作ったかどうかも返す
function destPeriod(g){
  if(g.dest==='__new__'){ const np=newPeriod(g.pay?payLabel(g.pay):ymLabel(g.ym), g.ym); db.periods.unshift(np); return {p:np, created:true}; }
  return {p:db.periods.find(x=>x.id===g.dest)||null, created:false};
}
// 期間が「対象の月」をまだ覚えていなくて、中身がぜんぶその月なら覚えさせる
function rememberYm(p){
  if(periodExplicitYm(p)) return;
  const ys=periodYms(p);
  if(ys.length===1) p.ym=ys[0];
}
function runImport(){
  if(!pendingRoute||pendingRoute.mode!=='import') return;
  const log={at:nowMs(), entries:[]};
  let added=0, dup=0; const parts=[]; let lastPid=null; let metaChanged=false;
  pendingRoute.groups.forEach(g=>{
    if(g.dest==='__skip__') return;
    const {p,created}=destPeriod(g); if(!p) return;
    // お支払いの期間として覚える（取り消せるように、元の名前・お支払い日・請求額を控える）
    const meta=g.pay?{name:p.name, pay:p.pay, billed:p.billed}:null;
    if(g.pay){
      if(AUTO_NAME_RE.test(p.name)) p.name=payLabel(g.pay);   // 自分でつけた名前は変えない
      p.pay=g.pay; if(g.billed!=null) p.billed=g.billed;
      if(!periodExplicitYm(p)) p.ym=g.ym;
    }
    const metaHit=!!meta&&(meta.name!==p.name||meta.pay!==p.pay||meta.billed!==p.billed);
    if(metaHit) metaChanged=true;
    const {fresh,dups}=dupFilter(p.items,g.items);
    const ids=[]; dup+=dups.length;
    fresh.forEach(t=>{ p.items.push(t); ids.push(t.id); added++; });
    rememberYm(p);
    log.entries.push({periodId:p.id, itemIds:ids, createdPeriod:created, name:pname(p), meta:(created?null:meta)});
    if(ids.length||created||metaHit){ parts.push(pname(p)+' '+ids.length+'件'); lastPid=p.id; }
  });
  pendingRoute=null;
  if(!added && !metaChanged && !log.entries.some(e=>e.createdPeriod)){ closeSheet(); toast(dup?'全て取り込み済みでした':'取り込むものがありませんでした'); return; }
  db.lastImport=log;
  if(lastPid){ db.current=lastPid; curFilter='all'; }
  save(); closeSheet(); window.scrollTo(0,0);
  toast(parts.join('・')+'に追加'+(dup?'（重複'+dup+'件はスキップ）':''));
}
function runSplit(){
  if(!pendingRoute||pendingRoute.mode!=='split') return;
  const R=pendingRoute, src=db.periods.find(x=>x.id===R.srcId);
  if(!src){ pendingRoute=null; closeSheet(); return; }
  let moved=0; const parts=[];
  R.groups.forEach(g=>{
    if(g.dest===R.srcId) return;
    const {p}=destPeriod(g); if(!p||p.id===src.id) return;
    const ids=new Set(g.items.map(x=>x.id));
    const move=src.items.filter(it=>ids.has(it.id));
    src.items=src.items.filter(it=>!ids.has(it.id));
    const have=new Set(p.items.map(x=>x.id));
    move.forEach(it=>{ if(!have.has(it.id)){ p.items.push(it); moved++; } });
    rememberYm(p);
    parts.push(pname(p)+' '+move.length+'件');
  });
  delete src.mixOk; rememberYm(src);
  pendingRoute=null;
  if(!moved){ closeSheet(); toast('移すものがありませんでした'); return; }
  if(!db.periods.find(x=>x.id===db.current)) db.current=db.periods[0].id;
  save(); closeSheet(); window.scrollTo(0,0);
  toast(parts.join('・')+'へ移しました');
}

function undoLastImport(){
  const log=db.lastImport; if(!log) return;
  log.entries.slice().reverse().forEach(e=>{
    if(e.createdPeriod){ db.periods=db.periods.filter(p=>p.id!==e.periodId); return; }
    const p=db.periods.find(x=>x.id===e.periodId);
    if(p){ const s=new Set(e.itemIds); p.items=p.items.filter(it=>!s.has(it.id));
      if(e.meta){ p.name=e.meta.name;
        if(e.meta.pay) p.pay=e.meta.pay; else delete p.pay;
        if(e.meta.billed!=null) p.billed=e.meta.billed; else delete p.billed; } }
  });
  if(!db.periods.length){ const d=new Date(); db.periods=[newPeriod(monthLabel(d), d.getFullYear()+'-'+pad(d.getMonth()+1))]; }
  if(!db.periods.find(p=>p.id===db.current)){ db.current=db.periods[0].id; curFilter='all'; }
  delete db.lastImport;
  save(); closeSheet(); toast('前回の取り込みを取り消しました');
}
function lastImportSummary(){
  const log=db.lastImport; if(!log) return '';
  const n=log.entries.reduce((a,e)=>a+e.itemIds.length,0);
  const d=new Date(log.at);
  return (d.getMonth()+1)+'月'+d.getDate()+'日 '+pad(d.getHours())+':'+pad(d.getMinutes())+'・'+n+'件（'+log.entries.map(e=>e.name).join('・')+'）';
}

/* ============ トースト ============ */
let toastT=null;
function toast(msg){
  let t=document.getElementById('toast');
  if(!t){t=document.createElement('div'); t.id='toast'; t.className='toast'; t.setAttribute('role','status'); document.body.appendChild(t);}
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200);
}

/* ============ イベント ============ */
document.getElementById('periodBtn').onclick=openPeriods;
document.getElementById('settingsBtn').onclick=openSettings;
document.getElementById('addBtn').onclick=()=>openItem(curPeriod(),null);
document.getElementById('importBtn').onclick=()=>document.getElementById('csvInput').click();
document.getElementById('csvInput').addEventListener('change',e=>{ if(e.target.files[0])handleCSV(e.target.files[0]); e.target.value=''; });
document.getElementById('restoreInput').addEventListener('change',e=>{ if(e.target.files[0])handleRestore(e.target.files[0]); e.target.value=''; });

/* ============ 起動 ============ */
render();
loadRemote();
subscribeRealtime();
</script>

<style>
  #tsumikiEdge{position:fixed; top:0; bottom:0; left:0; width:22px; z-index:999;}
  #tsumikiPeek{
    position:fixed; top:50%; left:0; z-index:1001; margin-top:-23px;
    width:46px; height:46px; display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.92);
    -webkit-backdrop-filter:saturate(180%) blur(14px); backdrop-filter:saturate(180%) blur(14px);
    border:1px solid rgba(0,0,0,.06); border-radius:50%;
    box-shadow:0 6px 20px rgba(0,0,0,.18);
    color:#0071e3; font-size:24px; font-weight:600; line-height:1;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Helvetica Neue",Arial,sans-serif;
    transform:translateX(-70px) scale(.8); opacity:0; pointer-events:none;
  }
</style>
<div id="tsumikiEdge"></div>
<div id="tsumikiPeek">‹</div>
<script>
  (function(){
    var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
      || window.navigator.standalone === true;
    var fromTsumiki = false;
    try{
      if(document.referrer){
        var r = new URL(document.referrer);
        fromTsumiki = (r.origin === location.origin);
      }
    }catch(e){}
    if(!(standalone && fromTsumiki)) return;

    var peek = document.getElementById('tsumikiPeek');
    var edge = document.getElementById('tsumikiEdge');

    function goBack(){ location.href = 'index.html'; }

    /* --- 左端エッジスワイプで戻る（iOS純正の戻る操作。見えるボタンは置かない） --- */
    var sx=0, sy=0, prog=0, dragging=false, W=window.innerWidth;
    var TRIGGER = Math.min(120, W*0.32);
    window.addEventListener('resize', function(){ W=window.innerWidth; TRIGGER=Math.min(120, W*0.32); });

    function reset(){
      dragging = false; prog = 0;
      peek.style.transition = 'transform .25s ease, opacity .25s ease';
      peek.style.transform = 'translateX(-70px) scale(.8)';
      peek.style.opacity = 0;
    }
    function start(e){
      var t = e.touches ? e.touches[0] : e;
      if(t.clientX > 26) return;
      sx = t.clientX; sy = t.clientY; prog = 0; dragging = true;
      peek.style.transition = 'none';
    }
    function move(e){
      if(!dragging) return;
      var t = e.touches ? e.touches[0] : e;
      var dx = t.clientX - sx, dy = t.clientY - sy;
      if(Math.abs(dy) > Math.abs(dx) + 12){ reset(); return; }
      if(dx < 0) dx = 0;
      prog = Math.min(dx / TRIGGER, 1);
      peek.style.transform = 'translateX(' + (-70 + prog*82) + 'px) scale(' + (0.8 + prog*0.2) + ')';
      peek.style.opacity = prog;
      if(dx > 6 && e.cancelable) e.preventDefault();
    }
    function end(){
      if(!dragging) return;
      dragging = false;
      if(prog >= 0.999){
        peek.style.transition = 'transform .25s ease, opacity .25s ease';
        peek.style.transform = 'translateX(20px) scale(1.05)';
        peek.style.opacity = 1;
        goBack();
      }else{
        reset();
      }
    }
    edge.addEventListener('touchstart', start, {passive:true});
    window.addEventListener('touchmove', move, {passive:false});
    window.addEventListener('touchend', end, {passive:true});
    window.addEventListener('touchcancel', end, {passive:true});
  })();
</script>
<!-- /tsumiki-back-button -->
</body>
</html>
