<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="apple-touch-icon" href="icons/icon-futaricard.png">
<meta name="apple-mobile-web-app-title" content="ふたりカード">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ふたりカード — 共同カードを比率でわける</title>
<style>
  :root{
    --bg:#f4f7fb; --card:#ffffff; --ink:#232a33; --sub:#7c8794;
    --line:#e6ecf3; --accent:#3b93ff; --accent2:#6fb0ff;
    --kodai:#3b93ff; --yuzu:#f5a623; --ok:#34c759; --danger:#e5484d;
    --radius:20px;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  [hidden]{display:none !important;}
  html,body{overscroll-behavior-y:none;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Helvetica Neue",Arial,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.6;
    padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 96px);
    -webkit-font-smoothing:antialiased; min-height:100vh;
  }
  .wrap{max-width:560px; margin:0 auto; padding:0 16px;}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
  input,select,textarea{font-family:inherit; font-size:16px;}

  /* ===== ヘッダー ===== */
  header{padding:24px 4px 6px; display:flex; align-items:center; gap:10px;}
  header .logo{font-size:28px; line-height:1;}
  header h1{font-size:22px; font-weight:800; letter-spacing:-.02em;}
  header .sync{display:flex; align-items:center; gap:6px; font-size:11px; color:var(--sub);
    background:var(--card); border:1px solid var(--line); border-radius:999px; padding:5px 10px;}
  .sync .dot{width:7px; height:7px; border-radius:50%; background:var(--ok);}
  .sync .dot.off{background:#c7c7cc;}
  .toolbar{display:flex; align-items:center; gap:8px; margin:10px 0 2px;}
  .periodsel{flex:1; display:flex; align-items:center; gap:7px; background:var(--card);
    border:1px solid var(--line); border-radius:14px; padding:11px 14px; font-weight:700; font-size:15px;
    min-width:0; text-align:left;}
  .periodsel .pn{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .periodsel .cnt{color:var(--sub); font-weight:600; font-size:12px; margin-left:auto; flex:0 0 auto;}
  .periodsel .chev{color:#c2cdd9; flex:0 0 auto;}
  .iconbtn{width:44px; height:44px; flex:0 0 auto; display:flex; align-items:center; justify-content:center;
    background:var(--card); border:1px solid var(--line); border-radius:14px; font-size:19px;}
  .iconbtn:active{transform:scale(.95);}

  /* ===== 結果カード ===== */
  .result{background:linear-gradient(135deg,#eaf3ff,#e3ecff); border:1px solid #d6e5fb;
    border-radius:var(--radius); padding:18px 18px 20px; margin-top:12px;}
  .result .lab{font-size:12px; color:#5f7fae; font-weight:700; letter-spacing:.02em;}
  .result .totalrow{display:flex; align-items:baseline; gap:8px; margin-top:2px;}
  .result .total{font-size:30px; font-weight:800; letter-spacing:-.02em;}
  .result .total small{font-size:18px; font-weight:700;}
  .result .totalsub{font-size:11px; color:#6f8bb3;}
  .splitcards{display:grid; grid-template-columns:1fr 1fr; gap:11px; margin-top:14px;}
  .pc{background:var(--card); border-radius:16px; padding:13px 14px; border:1px solid rgba(255,255,255,.7);}
  .pc .nm{font-size:12px; color:var(--sub); font-weight:700; display:flex; align-items:center; gap:6px;}
  .pc .nm .ic{width:9px; height:9px; border-radius:50%; flex:0 0 auto;}
  .pc .vl{font-size:23px; font-weight:800; margin-top:3px; letter-spacing:-.02em;}
  .pc .vl small{font-size:14px; font-weight:700;}
  .pc .sb{font-size:10.5px; color:var(--sub); margin-top:1px;}

  /* 比率スライダー */
  .ratiobox{background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:14px 15px; margin-top:12px;}
  .ratiobox .rt{display:flex; align-items:center; font-size:12px; font-weight:700; color:var(--sub);}
  .ratiobox .rt .rr{margin-left:auto; color:var(--ink);}
  .ratiobox .rt .rr .k{color:var(--kodai);} .ratiobox .rt .rr .y{color:var(--yuzu);}
  .rslide{position:relative; margin-top:12px;}
  .rslide input[type=range]{width:100%; -webkit-appearance:none; appearance:none; height:8px; border-radius:999px;
    background:linear-gradient(to right,var(--kodai) 0%,var(--kodai) var(--p,50%),var(--yuzu) var(--p,50%),var(--yuzu) 100%);
    outline:none;}
  .rslide input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:26px; height:26px; border-radius:50%;
    background:#fff; border:2px solid var(--line); box-shadow:0 2px 6px rgba(0,0,0,.18); cursor:pointer;}
  .rpresets{display:flex; gap:7px; margin-top:11px;}
  .rpresets button{flex:1; padding:8px 4px; border-radius:10px; border:1px solid var(--line);
    background:var(--bg); font-weight:700; font-size:12px; color:var(--sub);}
  .rpresets button.on{border-color:var(--accent); background:rgba(59,147,255,.10); color:var(--accent);}

  /* 内訳ミニ */
  .minibd{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}
  .chip{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700;
    padding:6px 11px; border-radius:999px; background:var(--card); border:1px solid var(--line); color:var(--sub);}
  .chip b{color:var(--ink); font-weight:800;}
  .chip .d{width:8px; height:8px; border-radius:2px;}

  /* ===== 明細 ===== */
  .listhead{display:flex; align-items:center; margin:22px 4px 8px;}
  .listhead h2{font-size:14px; font-weight:800;}
  .listhead .filters{margin-left:auto; display:flex; gap:6px;}
  .listhead .filters button{font-size:11px; font-weight:700; color:var(--sub); padding:5px 10px;
    border-radius:999px; background:var(--card); border:1px solid var(--line);}
  .listhead .filters button.on{color:var(--accent); border-color:var(--accent); background:rgba(59,147,255,.08);}

  .daygroup{font-size:11px; font-weight:700; color:var(--sub); margin:14px 4px 6px;}
  .entry{display:flex; align-items:center; gap:11px; background:var(--card);
    border:1px solid var(--line); border-radius:14px; padding:11px 13px; margin-bottom:8px;}
  .entry:active{transform:scale(.994);}
  .entry.excl{opacity:.5;}
  .entry .info{min-width:0; flex:1;}
  .entry .ti{font-size:14.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .entry .me{font-size:11px; color:var(--sub); display:flex; gap:7px; align-items:center; margin-top:1px;}
  .entry .amt{font-weight:800; font-size:15.5px; flex:0 0 auto;}
  .entry .amt.minus{color:var(--ok);}
  .tag{font-size:10px; font-weight:800; padding:2px 8px; border-radius:999px; flex:0 0 auto;}
  .tag.share{background:rgba(120,120,128,.12); color:#5a6470;}
  .tag.kodai{background:rgba(59,147,255,.13); color:#1f6fd6;}
  .tag.yuzu{background:rgba(245,166,35,.16); color:#c47e0a;}
  .tag.excl{background:rgba(120,120,128,.10); color:#98a0aa;}

  /* 請求書を画像で作るボタン／プレビュー */
  .billbtn{width:100%; display:flex; align-items:center; justify-content:center; gap:7px;
    margin-top:12px; padding:14px; border-radius:15px; font-weight:800; font-size:14.5px;
    background:var(--card); border:1px solid var(--line); color:var(--accent);}
  .billbtn:active{transform:scale(.98);}
  .billimg{display:block; width:100%; border-radius:14px; border:1px solid var(--line); background:#fff;}

  .empty{text-align:center; color:var(--sub); padding:42px 20px;}
  .empty .big{font-size:44px;} .empty p{margin-top:10px; font-size:14px;}
  .empty .ib{display:inline-block; margin-top:16px; background:var(--accent); color:#fff;
    padding:12px 22px; border-radius:14px; font-weight:700; font-size:14px;}

  /* ===== 下部アクションバー ===== */
  .actionbar{position:fixed; left:0; right:0; bottom:0; z-index:40;
    padding:10px 16px calc(env(safe-area-inset-bottom) + 10px);
    background:linear-gradient(to top, var(--bg) 72%, rgba(244,247,251,0));
    display:flex; gap:9px; max-width:560px; margin:0 auto;}
  .btn{flex:1; display:flex; align-items:center; justify-content:center; gap:6px;
    padding:14px; border-radius:15px; font-weight:700; font-size:15px;
    background:var(--card); border:1px solid var(--line); color:var(--ink);}
  .btn.primary{background:var(--accent); color:#fff; border-color:var(--accent);
    box-shadow:0 6px 18px rgba(59,147,255,.32);}
  .btn:active{transform:scale(.97);}

  /* ===== モーダル ===== */
  .ov{position:fixed; inset:0; z-index:100; background:rgba(20,30,45,.42);
    display:flex; align-items:flex-end; justify-content:center; opacity:0; pointer-events:none;
    transition:opacity .2s ease; backdrop-filter:blur(2px);}
  .ov.show{opacity:1; pointer-events:auto;}
  .sheet{width:100%; max-width:560px; background:var(--bg); border-radius:24px 24px 0 0;
    padding:8px 18px calc(env(safe-area-inset-bottom) + 22px); max-height:92vh; overflow-y:auto;
    transform:translateY(20px); transition:transform .25s cubic-bezier(.2,.8,.2,1);
    -webkit-overflow-scrolling:touch;}
  .ov.show .sheet{transform:translateY(0);}
  .grip{width:38px; height:5px; border-radius:3px; background:#d6dee8; margin:6px auto 14px;}
  .sheet h2{font-size:19px; font-weight:800; margin-bottom:4px;}
  .sheet .sd{font-size:12px; color:var(--sub); margin-bottom:16px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; font-weight:700; color:var(--sub); margin-bottom:6px;}
  .field input[type=text],.field input[type=number],.field input[type=date],.field select,.field textarea{
    width:100%; padding:13px 14px; border:1px solid var(--line); border-radius:13px;
    background:var(--card); color:var(--ink); outline:none;}
  .field textarea{line-height:1.7; resize:vertical; min-height:112px;}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);}
  .quick{display:flex; gap:7px; flex-wrap:wrap;}
  .quick button{padding:9px 13px; border-radius:11px; border:1px solid var(--line);
    background:var(--card); font-weight:700; font-size:13px; color:var(--sub);}
  .quick button:active{transform:scale(.96);}
  .seg{display:flex; gap:7px; flex-wrap:wrap;}
  .seg button{flex:1 1 auto; min-width:calc(50% - 4px); padding:12px 6px; border-radius:12px; border:1.5px solid var(--line);
    background:var(--card); font-weight:700; font-size:14px; color:var(--sub); transition:all .12s;}
  .seg.small button{min-width:calc(33.333% - 5px); padding:11px 4px; font-size:12.5px;}
  .seg button.on{border-color:var(--accent); background:rgba(59,147,255,.10); color:var(--ink);}
  .seg button.on.share{border-color:#8a94a0; background:rgba(120,120,128,.12); color:#4a545f;}
  .seg button.on.k{border-color:var(--kodai); background:rgba(59,147,255,.12); color:#1f6fd6;}
  .seg button.on.y{border-color:var(--yuzu); background:rgba(245,166,35,.14); color:#c47e0a;}
  .seg button.on.x{border-color:#98a0aa; background:rgba(120,120,128,.10); color:#6b7480;}
  .sheetbtns{display:flex; gap:9px; margin-top:8px;}
  .sheetbtns .save{flex:1; background:var(--accent); color:#fff; padding:15px; border-radius:14px; font-weight:800; font-size:16px;}
  .sheetbtns .save:active{transform:scale(.97);}
  .delbtn{width:100%; text-align:center; color:var(--danger); font-weight:700; font-size:14px; padding:14px; margin-top:4px;}
  .secbtn{width:100%; display:flex; align-items:center; gap:10px; text-align:left; background:var(--card);
    border:1px solid var(--line); padding:15px; border-radius:14px; font-weight:700; font-size:15px; margin-top:10px;}
  .secbtn .em{font-size:18px;}
  .secbtn small{display:block; font-weight:500; font-size:11.5px; color:var(--sub);}
  .hint{font-size:11px; color:var(--sub); text-align:center; margin-top:10px; line-height:1.7;}

  /* 期間ピッカー行 */
  .prow{display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line);
    border-radius:14px; padding:13px 14px; margin-bottom:8px;}
  .prow.on{border-color:var(--accent); background:rgba(59,147,255,.06);}
  .prow .pi{min-width:0; flex:1;}
  .prow .pi .pnm{font-weight:700; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .prow .pi .pmt{font-size:11px; color:var(--sub);}
  .prow .pv{font-weight:800; font-size:13px; color:var(--sub); flex:0 0 auto;}

  /* ===== PC：横幅を活用（左＝集計＆比率を画面に固定／右＝明細一覧）===== */
  @media(min-width:900px){
    .wrap{max-width:min(1180px,94vw);}
    header{padding-top:30px;}
    .periodsel{flex:0 1 460px; margin-right:auto;}
    .pgrid{display:grid; grid-template-columns:376px minmax(0,1fr); gap:24px; align-items:start; margin-top:14px;}
    .col-summary{position:sticky; top:16px;}
    .result{margin-top:0;}
    .listhead{margin-top:0;}
    .actionbar{max-width:min(1180px,94vw); justify-content:flex-end; gap:12px;}
    .actionbar .btn{flex:0 0 auto; min-width:200px;}
  }

  .toast{position:fixed; bottom:calc(env(safe-area-inset-bottom) + 100px); left:50%; transform:translateX(-50%) translateY(20px);
    background:#232a33; color:#fff; padding:11px 20px; border-radius:999px; font-size:13px; font-weight:600;
    z-index:200; opacity:0; transition:all .25s ease; pointer-events:none; white-space:nowrap; max-width:88vw;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="logo">💳</span>
    <h1>ふたりカード</h1>
    <span class="sync" id="syncBadge"><span class="dot off"></span><span id="syncTxt">この端末</span></span>
  </header>

  <div class="toolbar">
    <button class="periodsel" id="periodBtn">
      <span class="pn" id="periodName">期間</span>
      <span class="cnt" id="periodCnt"></span>
      <span class="chev">▾</span>
    </button>
    <button class="iconbtn" id="settingsBtn" aria-label="設定">⚙️</button>
  </div>

  <div id="body"></div>
</div>

<div class="actionbar" id="actionBar">
  <button class="btn" id="addBtn">＋ 手動追加</button>
  <button class="btn primary" id="importBtn">📄 CSVを読み込む</button>
</div>
<input type="file" id="csvInput" accept=".csv" hidden>
<input type="file" id="restoreInput" accept=".json" hidden>

<div class="ov" id="ov"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============ Supabase 同期（個人用1行ブロブ・yuzuwari等と同じ方式） ============ */
const SUPABASE_URL='https://okbjqtdirrathscctyvx.supabase.co';
const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9rYmpxdGRpcnJhdGhzY2N0eXZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzMjI4NTIsImV4cCI6MjA5NTg5ODg1Mn0.T-1AOK6vCD6uGdqrVGXjPui3L6WPSNrnygS-IHyfZ6Y';
const STATE_TABLE='futaricard_state', STATE_ID='kodai';
const sb=(window.supabase&&window.supabase.createClient)?supabase.createClient(SUPABASE_URL,SUPABASE_ANON):null;
let cloudReady=false, applyingRemote=false;

/* ============ データ ============ */
const LS_KEY='futaricard_db_v1';
// 請求書の画像に載せる振込先（設定でいつでも書き換え可・空行は無視）
const BANK_DEFAULT=['三井住友銀行','オリーブBlue支店（支店番号 783）','普通 0833691','名義 タカハシコウダイ'];
function defaultDB(){
  const p=newPeriod(monthLabel(new Date()));
  return { names:{kodai:'こうだい', yuzu:'ゆずは'}, defaultRatio:50, bank:BANK_DEFAULT.slice(),
    periods:[p], current:p.id, updatedAt:0 };
}
function newPeriod(name){ return {id:uid(), name, items:[], ratio:null, createdAt:nowMs()}; }
let db=load();
function load(){
  try{const r=JSON.parse(localStorage.getItem(LS_KEY)); if(r&&r.periods&&r.periods.length) return migrate(r);}catch(e){}
  return defaultDB();
}
function migrate(r){
  if(r.defaultRatio==null)r.defaultRatio=50;
  if(!r.names)r.names={kodai:'こうだい',yuzu:'ゆずは'};
  if(r.names.yuzu==='ゆず')r.names.yuzu='ゆずは'; // 旧デフォルト名を正式名に自動更新
  if(!Array.isArray(r.bank))r.bank=BANK_DEFAULT.slice();
  if(!r.current||!r.periods.find(p=>p.id===r.current))r.current=r.periods[0].id;
  return r;
}
let saveTimer=null;
function save(opts={}){
  db.updatedAt=nowMs();
  localStorage.setItem(LS_KEY, JSON.stringify(db));
  if(!opts.noRender) render();
  if(!applyingRemote){ clearTimeout(saveTimer); saveTimer=setTimeout(pushCloud, 600); }
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function nowMs(){return Date.now();}

/* ============ クラウド ============ */
async function loadRemote(){
  if(!sb) return;
  try{
    const {data,error}=await sb.from(STATE_TABLE).select('state,updated_at').eq('id',STATE_ID).maybeSingle();
    if(error){console.warn(error);return;}
    cloudReady=true; setSync(true);
    if(data&&data.state&&data.state.periods){
      if((data.state.updatedAt||0) >= (db.updatedAt||0)){
        applyingRemote=true; db=migrate(data.state); applyingRemote=false;
        localStorage.setItem(LS_KEY, JSON.stringify(db)); render();
      } else { pushCloud(); }
    } else { pushCloud(); }
  }catch(e){console.warn(e);}
}
async function pushCloud(){
  if(!sb||!cloudReady) return;
  try{ await sb.from(STATE_TABLE).upsert({id:STATE_ID, state:db, updated_at:new Date().toISOString()}); }
  catch(e){console.warn(e);}
}
function subscribeRealtime(){
  if(!sb) return;
  sb.channel('futaricard-rt')
    .on('postgres_changes',{event:'*',schema:'public',table:STATE_TABLE,filter:'id=eq.'+STATE_ID},
      payload=>{
        const st=payload.new&&payload.new.state;
        if(st&&st.periods&&(st.updatedAt||0)>(db.updatedAt||0)){
          applyingRemote=true; db=migrate(st); applyingRemote=false;
          localStorage.setItem(LS_KEY, JSON.stringify(db)); render();
        }
      }).subscribe();
}
function setSync(on){
  const dot=document.querySelector('#syncBadge .dot');
  document.getElementById('syncTxt').textContent = on?'同期中':'この端末';
  if(dot) dot.classList.toggle('off', !on);
}

/* ============ 計算 ============ */
// 明細の tag: 'share'(共同) / 'kodai' / 'yuzu' / 'excl'(対象外)
function curPeriod(){ return db.periods.find(p=>p.id===db.current)||db.periods[0]; }
function ratioOf(p){ return (p.ratio==null?db.defaultRatio:p.ratio); } // こうだいの取り分%
// 明細ごとに it.ratio（こうだいの取り分%）を持てる。未設定なら期間の比率にしたがう。
// overrideR はスライダー操作中のプレビュー用（保存せずに期間の比率だけ差し替える）
function calc(p,overrideR){
  const r=(overrideR==null?ratioOf(p):overrideR);
  let share=0, defShare=0, kPer=0, yPer=0, excl=0, kShare=0, yShare=0;
  p.items.forEach(it=>{
    const a=it.amount;
    if(it.tag==='kodai') kPer+=a;
    else if(it.tag==='yuzu') yPer+=a;
    else if(it.tag==='excl') excl+=a;
    else{ // share
      share+=a;
      if(it.ratio!=null){ const k=Math.round(a*it.ratio/100); kShare+=k; yShare+=a-k; }
      else defShare+=a;
    }
  });
  const kDef=Math.round(defShare*r/100);
  kShare+=kDef; yShare+=defShare-kDef;
  const kodai=kShare+kPer;
  const yuzu=yShare+yPer;
  return {share, defShare, kPer, yPer, excl, r, kShare, yShare, kodai, yuzu, cardTotal:kodai+yuzu};
}
// 個別のわけかたを設定した共同明細（画像や注意書きで使う）
function customRatioItems(p){ return p.items.filter(it=>(it.tag||'share')==='share'&&it.ratio!=null); }
function ratioLabel(r){ return r+'：'+(100-r); }
function yen(n){const s=n<0?'-':''; return s+'¥'+Math.abs(Math.round(n)).toLocaleString('ja-JP');}
function nm(id){return db.names[id]||id;}

/* ===== 明細名を見やすく整形（表示専用・元の明細descは常に保持） ===== */
// 全角英数字→半角
function zenNum(s){return String(s).replace(/[Ａ-Ｚａ-ｚ０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));}
// 照合用：区切り記号・空白を除いて小文字化
const MERCH_SEP=/[ー－—\-・／\/\s　]/g;
// 既知チェーン→短い正式名（先頭一致で判定＝誤爆しにくい）
const MERCH_BRANDS=[
  {n:'Amazon',k:['アマゾン','amazon']},{n:'Apple',k:['アップル','apple','itunes']},
  {n:'マクドナルド',k:['マクドナルド']},{n:'セブンイレブン',k:['セブンイレブン']},
  {n:'ローソン',k:['ローソン','lawson']},{n:'ファミリーマート',k:['ファミリーマート']},
  {n:'ミニストップ',k:['ミニストップ']},{n:'すき家',k:['すき家']},{n:'松屋',k:['松屋']},
  {n:'吉野家',k:['吉野家']},{n:'スシロー',k:['スシロー']},{n:'ガスト',k:['ガスト']},
  {n:'サイゼリヤ',k:['サイゼリヤ']},{n:'モスバーガー',k:['モスバーガー','モスフード']},
  {n:'ケンタッキー',k:['ケンタッキー','kfc']},{n:'ドミノ・ピザ',k:['ドミノピザ','ドミノ']},
  {n:'スターバックス',k:['スターバックス','starbucks']},{n:'ドトール',k:['ドトール']},
  {n:'タリーズ',k:['タリーズ']},{n:'コメダ珈琲',k:['コメダ']},
  {n:'ユニクロ',k:['ユニクロ','uniqlo']},{n:'GU',k:['ジーユー']},{n:'無印良品',k:['無印良品']},
  {n:'マツモトキヨシ',k:['マツモトキヨシ','マツキヨ']},{n:'クリエイト',k:['クリエイトエス','クリエイト']},
  {n:'ウエルシア',k:['ウエルシア']},{n:'サンドラッグ',k:['サンドラッグ']},{n:'ツルハドラッグ',k:['ツルハ']},
  {n:'ドン・キホーテ',k:['ドンキホーテ']},{n:'ダイソー',k:['ダイソー','daiso']},{n:'セリア',k:['セリア']},
  {n:'カルディ',k:['カルディ','kaldi']},{n:'成城石井',k:['成城石井']},
  {n:'イトーヨーカドー',k:['イトーヨーカドー']},{n:'マルエツ',k:['マルエツ']},{n:'いなげや',k:['いなげや']},
  {n:'サミット',k:['サミットストア','サミット']},{n:'オーケー',k:['オーケーストア','オーケー']},
  {n:'まいばすけっと',k:['まいばすけっと']},{n:'業務スーパー',k:['業務スーパー']},{n:'コストコ',k:['コストコ','costco']},
  {n:'Netflix',k:['netflix']},{n:'Spotify',k:['spotify']},{n:'Uber Eats',k:['ubereats']},
];
function cleanMerchant(desc){
  let s=String(desc||'').trim();
  if(!s)return String(desc||'');
  // 文字化け「?」→カタカナ隣接は長音「ー」と推定
  s=s.replace(/([ァ-ヶ])[?？]/g,'$1ー').replace(/ー{2,}/g,'ー');
  // 決済手段のサフィックス（／ｉＤ ／ＮＦＣ ／ＡＰ 等）を末尾から除去
  s=s.replace(/[\/／]\s*(?:ｉＤ|id|ＮＦＣ|nfc|ＡＰ|ap|ＡＰＬ|apl|ＱＰ|qp|クイックペイ|ＥＤＹ|edy|ＷＡＯＮ|waon|ｎａｎａｃｏ|nanaco|ｉｃ|ic|ｓｕｉｃａ|suica|ｐａｓｍｏ|pasmo|ＥＣ|ec|ＡＰＰ|app|ｑｒ|qr|ｐａｙ|pay)\s*$/i,'');
  // 先頭の店舗コード（4桁以上の数字＋直後が日本語）を除去
  s=s.replace(/^[0-9０-９]{4,}(?=[ぁ-んァ-ヶ一-龠])/,'');
  // 既知チェーン→短い正式名（先頭一致）
  const flat=zenNum(s).toLowerCase().replace(MERCH_SEP,'');
  for(const b of MERCH_BRANDS){ for(const k of b.k){ const kf=k.toLowerCase().replace(MERCH_SEP,''); if(kf&&flat.indexOf(kf)===0)return b.n; } }
  // 未知店名：全角英数を半角化・余分な空白/「?」を整理
  s=zenNum(s).replace(/[?？]/g,'').replace(/[\s　]{2,}/g,' ').trim();
  return s||String(desc||'');
}
// 表示名：ユーザー編集(label)優先 → CSVは自動整形 → 手動明細はそのまま
function dispName(it){
  if(it.label&&it.label.trim())return it.label.trim();
  return it.src==='csv'?cleanMerchant(it.desc):(it.desc||'');
}

function bindBody(p){
  const ei=document.getElementById('emptyImport'); if(ei) ei.onclick=()=>document.getElementById('csvInput').click();
  const ratio=document.getElementById('ratio');
  if(ratio){
    ratio.oninput=e=>{ const v=+e.target.value; e.target.parentElement.style.setProperty('--p',v+'%');
      document.querySelectorAll('#rpresets button').forEach(b=>b.classList.toggle('on',+b.dataset.v===v));
      // ラベルだけ即時更新（保存はchangeで）
      const rr=document.querySelector('.ratiobox .rr');
      if(rr) rr.innerHTML='<span class="k">'+esc(nm('kodai'))+' '+v+'%</span> / <span class="y">'+esc(nm('yuzu'))+' '+(100-v)+'%</span>';
      liveSplit(p,v);
    };
    ratio.onchange=e=>{ curPeriod().ratio=+e.target.value; save(); };
  }
  document.querySelectorAll('#rpresets button').forEach(b=>b.onclick=()=>{ curPeriod().ratio=+b.dataset.v; save(); });
  const bb=document.getElementById('billBtn'); if(bb) bb.onclick=openBill;
  document.querySelectorAll('#filters button').forEach(b=>b.onclick=()=>{ curFilter=b.dataset.f; render(); });
  document.querySelectorAll('#body .entry').forEach(el=>el.onclick=()=>openItem(p, p.items.find(x=>x.id===el.dataset.id)));
}
// スライダー操作中の即時プレビュー（保存はしない）。個別のわけかたを設定した明細はそのまま。
function liveSplit(p,v){
  const c=calc(p,v);
  const cards=document.querySelectorAll('.splitcards .pc .vl');
  const subs=document.querySelectorAll('.splitcards .pc .sb');
  if(cards[0]) cards[0].innerHTML='<small>¥</small>'+Math.round(c.kodai).toLocaleString('ja-JP');
  if(cards[1]) cards[1].innerHTML='<small>¥</small>'+Math.round(c.yuzu).toLocaleString('ja-JP');
  if(subs[0]) subs[0].textContent='共同'+yen(c.kShare)+(c.kPer?'＋個人'+yen(c.kPer):'');
  if(subs[1]) subs[1].textContent='共同'+yen(c.yShare)+(c.yPer?'＋個人'+yen(c.yPer):'');
}

/* ============ 日付ヘルパ ============ */
function pad(n){return String(n).padStart(2,'0');}
function today(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function monthLabel(d){return (d.getMonth()+1)+'月分'+(d.getMonth()===11?'':'');}
function normDate(s){ // "2026/01/07" や "2026-1-7" → "2026-01-07"
  const m=String(s||'').match(/(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
  if(!m)return String(s||'');
  return m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);
}
function fmtDate(d){
  const m=String(d||'').match(/^(\d{4})-(\d{2})-(\d{2})$/); if(!m)return d||'日付なし';
  const y=+m[1],mo=+m[2],day=+m[3];
  const wd=['日','月','火','水','木','金','土'][new Date(y,mo-1,day).getDay()];
  return mo+'月'+day+'日('+wd+')';
}
function fmtDateShort(d){
  const m=String(d||'').match(/^(\d{4})-(\d{2})-(\d{2})$/); if(!m)return d||'';
  return (+m[2])+'/'+(+m[3]);
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

      '<button data-v="yuzu" class="'+(it.tag==='yuzu'?'on y':'')+'">'+esc(nm('yuzu'))+'個人</button>'+
      '<button data-v="excl" class="'+(it.tag==='excl'?'on x':'')+'">対象外</button>'+

      '<div class="seg small" id="iRatio">'+
        '<button data-v="">期間どおり '+ratioLabel(ratioOf(p))+'</button>'+
        '<button data-v="50">50：50</button>'+
        '<button data-v="60">60：40</button>'+
        '<button data-v="70">70：30</button>'+
        '<button data-v="custom">自分で決める</button>'+
      '</div>'+
      '<div id="iRatioNumWrap" style="margin-top:9px" hidden>'+
        '<input type="number" inputmode="numeric" id="iRatioNum" min="0" max="100" step="5" placeholder="60">'+
        '<div class="hint" style="text-align:left;margin-top:6px" id="iRatioNumHint"></div>'+
      '</div>'+
    '</div>'+
    '<div class="field"><label>日付</label><input type="date" id="iDate" value="'+(normDate(it.date)||today())+'"></div>'+
    ((existing&&db.periods.length>1)?'<div class="field"><label>どの期間に入れる？</label><select id="iMove">'+

  ov.querySelectorAll('#iQuick button').forEach(b=>b.onclick=()=>{
    const d=ov.querySelector('#iDesc'); d.value=b.dataset.n;

  });

  function syncRatioUI(){
    ov.querySelector('#iRatioField').hidden=(tag!=='share');
    ov.querySelectorAll('#iRatio button').forEach(b=>{
      const v=b.dataset.v;
      const on=(v===''&&ratio==null) || (v==='custom'&&customMode)
        || (v!==''&&v!=='custom'&&!customMode&&ratio!=null&&+v===ratio);
      b.classList.toggle('on',on);
    });
    ov.querySelector('#iRatioNumWrap').hidden=!customMode;
    if(customMode){
      const n=ov.querySelector('#iRatioNum');
      if(document.activeElement!==n) n.value=(ratio==null?'':ratio);
      ov.querySelector('#iRatioNumHint').textContent=
        (ratio==null?'':nm('kodai')+' '+ratio+'％ ／ '+nm('yuzu')+' '+(100-ratio)+'％');

    syncRatioUI();
  });
  ov.querySelectorAll('#iRatio button').forEach(b=>b.onclick=()=>{

    if(existing){
      existing.date=date; existing.amount=amount; existing.tag=tag;
      if(rt==null) delete existing.ratio; else existing.ratio=rt;
      if(existing.src==='csv'){
        // 元の明細(desc)は保持し再取込のズレを防ぐ。表示名の手直しはlabelへ（自動整形と同じなら解除）
        if(nameVal && nameVal!==cleanMerchant(existing.desc)) existing.label=nameVal; else delete existing.label;
      } else { existing.desc=nameVal; delete existing.label; }
    } else {
      const nit={id:uid(),src:'manual',date,desc:nameVal,amount,tag};
      if(rt!=null) nit.ratio=rt;
      curPeriod().items.push(nit);
    }
    let moved=null;
    const mv=ov.querySelector('#iMove');
    if(existing&&mv&&mv.value!==p.id){
      const to=db.periods.find(x=>x.id===mv.value);
      if(to&&!to.items.some(x=>x.id===existing.id)){
        p.items=p.items.filter(x=>x.id!==existing.id);
        to.items.push(existing);
        moved=to.name;
      }
    }
    save(); closeSheet(); toast(moved?('「'+moved+'」へ移しました ✓'):(existing?'保存しました':'追加しました ✓'));
  };
  if(existing){
    ov.querySelector('#iDel').onclick=()=>{
      const p2=curPeriod(); p2.items=p2.items.filter(x=>x.id!==existing.id); save(); closeSheet(); toast('削除しました');
    };
  }
  if(!existing) setTimeout(()=>{const a=ov.querySelector('#iAmt'); if(a)a.focus();},300);
}

/* ============ 期間ピッカー ============ */
function openPeriods(){
  const rows=db.periods.map(p=>{
    const c=calc(p);
    return '<button class="prow '+(p.id===db.current?'on':'')+'" data-id="'+p.id+'">'+
      '<div class="pi"><div class="pnm">'+esc(p.name)+'</div>'+
        '<div class="pmt">'+p.items.length+'件・合計 '+yen(c.cardTotal)+'</div></div>'+
      '<span class="pv">'+esc(nm('kodai'))+' '+yen(c.kodai)+'</span></button>';
  }).join('');
  openSheet(
    '<h2>期間をえらぶ</h2>'+
    '<div class="sd">月ごとに明細をまとめられます。CSVは<b>明細の日付を見て、月ごとの期間へ自動でふりわけ</b>ます（取り込む前に入れ先を確認できます）。</div>'+
    rows+
    '<button class="secbtn" id="newPeriod"><span class="em">＋</span><div>あたらしい期間をつくる<small>いまの期間はそのまま残ります</small></div></button>'
  );
  ov.querySelectorAll('.prow').forEach(el=>el.onclick=()=>{ db.current=el.dataset.id; curFilter='all'; save(); closeSheet(); window.scrollTo(0,0); });
  ov.querySelector('#newPeriod').onclick=()=>{ closeSheet(); setTimeout(openNewPeriod,260); };
}
function openNewPeriod(){
  openSheet(
    '<h2>あたらしい期間</h2>'+
    '<div class="field"><label>期間の名前</label><input type="text" id="npName" placeholder="例：1月分 / 2026年1月" value="'+esc(monthLabel(new Date()))+'"></div>'+
    '<div class="sheetbtns"><button class="save" id="npSave">つくる</button></div>'
  );
  ov.querySelector('#npSave').onclick=()=>{
    const name=ov.querySelector('#npName').value.trim()||'名称未設定';
    const p=newPeriod(name); db.periods.unshift(p); db.current=p.id; curFilter='all';
    save(); closeSheet(); toast('「'+name+'」を作成しました ✓');
  };
  setTimeout(()=>{const i=ov.querySelector('#npName'); if(i)i.focus();},300);
}

  openSheet(

      '<input type="text" id="nameK" placeholder="あなた" value="'+esc(db.names.kodai)+'" style="margin-bottom:8px">'+

    '<div class="field"><label>共同ぶんの既定の比率（'+esc(db.names.kodai)+'の取り分 %）</label>'+

    '<button class="secbtn" id="renameP"><span class="em">✏️</span><div>この期間の名前を変える<small>いま：'+esc(p.name)+'</small></div></button>'+
    '<button class="secbtn" id="setShareAll"><span class="em">↩️</span><div>この期間を全部「共同」に戻す<small>個人・対象外の仕分けをリセット</small></div></button>'+
    (db.lastImport?'<button class="secbtn" id="undoImp"><span class="em">↺</span><div>前回のCSV取り込みを取り消す<small>'+esc(lastImportSummary())+'</small></div></button>':'')+
    '<button class="secbtn" id="exportBtn"><span class="em">⬇️</span><div>バックアップを書き出す<small>全期間をJSONファイルで保存</small></div></button>'+
    '<button class="secbtn" id="restoreBtn"><span class="em">⬆️</span><div>バックアップから復元<small>書き出したJSONを読み込む</small></div></button>'+
    (db.periods.length>1?'<button class="delbtn" id="delP">この期間を削除</button>':'')+
    '<div class="hint">明細は「共同／個人／対象外」で仕分けできます。<br>共同ぶんだけが比率でわけられ、個人はその人が全額、対象外は計算から外れます。</div>'
  );
  ov.querySelector('#nameK').onchange=commitNames; ov.querySelector('#nameY').onchange=commitNames;
  function commitNames(){
    db.names.kodai=ov.querySelector('#nameK').value.trim()||'こうだい';
    db.names.yuzu=ov.querySelector('#nameY').value.trim()||'ゆずは';
    save({noRender:true});
  }
  ov.querySelector('#defR').onchange=e=>{ let v=Math.max(0,Math.min(100,Math.round(+e.target.value||0))); db.defaultRatio=v; e.target.value=v; save({noRender:true}); };
  ov.querySelector('#bankTa').onchange=e=>{ db.bank=e.target.value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean).slice(0,6); save({noRender:true}); };
  ov.querySelector('#shareBtn').onclick=()=>{ commitNames(); closeSheet(); setTimeout(openShare,260); };
  ov.querySelector('#renameP').onclick=()=>{ commitNames(); closeSheet(); setTimeout(openRename,260); };
  ov.querySelector('#setShareAll').onclick=()=>{
    if(confirm('この期間の明細をすべて「共同」に戻しますか？')){ curPeriod().items.forEach(it=>it.tag='share'); commitNames(); save(); closeSheet(); toast('共同に戻しました'); }
  };
  const ui=ov.querySelector('#undoImp');
  if(ui) ui.onclick=()=>{ if(confirm('前回のCSV取り込みを取り消しますか？\n'+lastImportSummary()+'\n\n※取り込みで新しくできた期間は、その期間ごと消えます。')) undoLastImport(); };
  ov.querySelector('#exportBtn').onclick=exportBackup;
  ov.querySelector('#restoreBtn').onclick=()=>document.getElementById('restoreInput').click();

    if(confirm('「'+curPeriod().name+'」を削除しますか？\nこの期間の明細も消えます。')){
      db.periods=db.periods.filter(x=>x.id!==db.current); db.current=db.periods[0].id; curFilter='all';
      commitNames(); save(); closeSheet(); toast('削除しました');
    }
  };
}
/* ============ ゆずちゃんと共有（同じデータを2台で同期） ============ */
function shareUrl(){
  // 本番URL（このページ自身）。localhostでもpathnameで正しいパスになる
  return location.origin.replace(/^http:/,'https:') + location.pathname;
}
function openShare(){
  const url=shareUrl();
  openSheet(
    '<h2>🔗 ゆずちゃんと共有</h2>'+
    '<div class="sd">このアプリは、ひとつのデータをふたりで同期して使えます。下のリンクを <b>'+esc(nm('yuzu'))+'ちゃんの端末で開く</b>と、明細・仕分け・比率が<b>リアルタイムで両方に反映</b>されます（どちらが編集してもOK）。</div>'+
    '<div class="field"><label>共有リンク</label><input type="text" id="shareLink" value="'+esc(url)+'" readonly onclick="this.select()"></div>'+
    '<div class="sheetbtns"><button class="save" id="doShare">リンクを送る／コピー</button></div>'+
    '<div class="hint">'+esc(nm('yuzu'))+'ちゃんはホーム画面に追加すればアプリのように使えます。<br>※ このリンクを知っている人は同じデータを見られます。ふたりだけで使ってね。</div>'
  );
  ov.querySelector('#doShare').onclick=async()=>{
    try{
      if(navigator.share){ await navigator.share({title:'ふたりカード', text:'共同カードの精算をふたりで同期しよう', url}); return; }
      await navigator.clipboard.writeText(url); toast('リンクをコピーしました ✓');
    }catch(e){
      try{ await navigator.clipboard.writeText(url); toast('リンクをコピーしました ✓'); }
      catch(_){ const el=ov.querySelector('#shareLink'); if(el){el.focus(); el.select();} toast('リンクを選択しました。長押しでコピーしてね'); }
    }
  };
}

/* ============ 請求書（画像）============
   共同カードの引き落としは こうだい 側。ゆずはの負担分（共同ぶん×比率＋個人ぶん）を
   1枚のPNGにして、LINE等でそのまま送れるようにする。Canvasに直接描くので外部ライブラリ不要。 */
function bankLines(){ return (db.bank||[]).map(s=>String(s||'').trim()).filter(Boolean).slice(0,6); }
// 手動で足した明細（光熱費など別カード払い）が1件でもある期間は「カード合計」と呼べない
function hasManual(p){ return p.items.some(it=>it.src==='manual'); }
function roundRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
// 幅に収まらない文字列は末尾を「…」に詰める
function ellipsisText(c,str,maxW){str=String(str||'');if(c.measureText(str).width<=maxW)return str;let s=str;while(s.length&&c.measureText(s+'…').width>maxW)s=s.slice(0,-1);return s+'…';}
let billCanvas=null;
function openBill(){
  const p=curPeriod(), c=calc(p);
  if(c.yuzu<=0){ toast(nm('yuzu')+'さんへの請求はありません'); return; }
  billCanvas=buildBillCanvas(p);
  openSheet(
    '<h2>📄 請求書（画像）</h2>'+
    '<div class="sd">'+esc(p.name)+'／'+esc(nm('yuzu'))+'さんへ '+yen(c.yuzu)+'</div>'+
    '<img class="billimg" src="'+billCanvas.toDataURL('image/png')+'" alt="請求書">'+
    '<div class="hint" style="margin:10px 0 12px">この画像をそのまま送れます。「共有／保存」から LINE・メール・写真への保存ができます。</div>'+
    '<div class="sheetbtns"><button class="save" id="billShare">共有／保存</button></div>'
  );
  ov.querySelector('#billShare').onclick=shareBill;
}
function shareBill(){
  const cv=billCanvas; if(!cv) return;
  cv.toBlob(async(blob)=>{
    if(!blob){ toast('画像の生成に失敗しました'); return; }
    const file=new File([blob],'futaricard.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file],title:'共同カードのご精算'}); return; }
      catch(e){ if(e&&e.name==='AbortError') return; }
    }
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download='futaricard-'+today()+'.png';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),1500);
  },'image/png');
}
function buildBillCanvas(p){
  const c=calc(p);
  const S=2,W=720,ML=56,MR=56,CW=W-ML-MR;
  const ACCENT='#3b93ff',INK='#232a33',SUB='#7c8794',LINE='#e2e9f2',PAPER='#f4f7fb',SURF='#ffffff';
  const FONT="'Hiragino Sans',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif";
  const mc=document.createElement('canvas').getContext('2d');
  const bank=bankLines();

  // ブロックを先に組み立てて高さを決める。各ブロックの右の金額は「相手の負担額」で、
  // 足すとお支払い合計にぴったり一致するようにする（①＋②＋③＝合計）
  const rowH=46, subLH=27, itemH=38, noteH=26, blockPad=16;
  const byDate=(a,b)=>(a.date||'').localeCompare(b.date||'');
  const shareItems=p.items.filter(it=>(it.tag||'share')==='share');
  const cardShare=shareItems.filter(it=>it.src!=='manual').sort(byDate);
  const manShare=shareItems.filter(it=>it.src==='manual').sort(byDate);
  const yOf=it=>it.amount-Math.round(it.amount*it.ratio/100); // 個別比率の相手負担
  // 期間の比率でわける分は calc() と同じく「まとめて1回だけ」四捨五入する。
  // カード側を先に計算し、手動側はその残り＝端数のズレが出ないようにする。
  const defCardSum=cardShare.filter(it=>it.ratio==null).reduce((s,it)=>s+it.amount,0);
  const yDefAll=c.defShare-Math.round(c.defShare*c.r/100);
  const yDefCard=defCardSum-Math.round(defCardSum*c.r/100);
  const yDefMan=yDefAll-yDefCard;
  const cardCustom=cardShare.filter(it=>it.ratio!=null);
  const manDef=manShare.filter(it=>it.ratio==null);
  // 手動ぶんの明細ごとの負担額（最後の1件で端数を吸収して合計を合わせる）
  let acc=0;
  const manDefY=manDef.map((it,i)=>{
    if(i===manDef.length-1) return yDefMan-acc;
    const v=it.amount-Math.round(it.amount*c.r/100); acc+=v; return v;
  });
  const ratioNote=(it)=>yen(it.amount)+' を '+(it.ratio!=null?ratioLabel(it.ratio):'期間どおり '+ratioLabel(c.r))+' でわけた分';

  const blocks=[];
  if(cardShare.length){
    const subs=[];
    if(defCardSum!==0) subs.push('カードの共同 '+yen(defCardSum)+' を '+nm('kodai')+' '+c.r+'％ ／ '+nm('yuzu')+' '+(100-c.r)+'％ でわけた分');
    if(cardCustom.length) subs.push('わけかたを個別に決めたもの');
    blocks.push({label:'共同でつかった分（カード）',
      amount:yDefCard+cardCustom.reduce((s,it)=>s+yOf(it),0), subs,
      items:cardCustom.map(it=>({date:it.date,name:dispName(it),amount:yOf(it),note:ratioNote(it)}))});
  }
  if(manShare.length){
    blocks.push({label:'手動で追加した分',
      amount:yDefMan+manShare.filter(it=>it.ratio!=null).reduce((s,it)=>s+yOf(it),0),
      subs:['カードに載らない光熱費などをこちらに足しています'],
      items:manShare.map(it=>({date:it.date,name:dispName(it),
        amount:(it.ratio!=null?yOf(it):manDefY[manDef.indexOf(it)]), note:ratioNote(it)}))});
  }
  if(c.yPer!==0){
    const per=p.items.filter(it=>it.tag==='yuzu').sort(byDate);
    blocks.push({label:nm('yuzu')+' の個人ぶん', amount:c.yPer, subs:[],
      items:per.map(it=>({date:it.date,name:dispName(it),amount:it.amount,note:null}))});
  }
  // ①②③…と番号を振り、合計の見出しに「①＋②」と足し算を書いて対応を分かるようにする
  const MARKS='①②③④⑤';
  blocks.forEach((b,i)=>{
    if(blocks.length>1) b.label=MARKS[i]+' '+b.label;
    b.h=rowH+b.subs.length*subLH+b.items.reduce((s,it)=>s+itemH+(it.note?noteH:0),0)+blockPad;
  });
  const totalLabel='お支払い合計'+(blocks.length>1?'（'+blocks.map((b,i)=>MARKS[i]).join('＋')+'）':'');
  const blocksH=blocks.reduce((s,b)=>s+b.h,0);

  // 合計の下に置く補足（1行が長いと切れるので分けて2行にする）
  const totalSubs=[(hasManual(p)?'この期間の合計 ':'カード合計 ')+yen(c.cardTotal)+' のうち '+nm('yuzu')+' さんの負担分です'];
  if(c.excl) totalSubs.push('（対象外の '+yen(c.excl)+' は計算から外しています）');

  const topPad=56,eyebrowH=30,titleH=54,metaH=34,gap1=24,secH=40,afterBlocks=12,
        totalH=76,totalSubLH=28,gap2=28,gap3=22,footH=28,botPad=48;
  const totalSubH=totalSubs.length*totalSubLH+6;
  const acctH=bank.length?92+(bank.length-1)*32:0;
  const H=topPad+eyebrowH+titleH+metaH+gap1+secH+blocksH+afterBlocks+totalH+totalSubH
        +(acctH?gap2+acctH+gap3:gap3)+footH+botPad;

  const cv=document.createElement('canvas'); cv.width=W*S; cv.height=H*S;
  const g=cv.getContext('2d'); g.scale(S,S); g.textBaseline='alphabetic';
  g.fillStyle=PAPER; g.fillRect(0,0,W,H);
  let y=topPad;

  g.textAlign='left'; g.fillStyle=SUB; g.font=`600 22px ${FONT}`;
  g.fillText('共同カードのご精算',ML,y+20); y+=eyebrowH;
  g.fillStyle=INK; g.font=`700 38px ${FONT}`;
  g.fillText(ellipsisText(g,nm('yuzu')+' さんへ',CW),ML,y+38); y+=titleH;
  const issued=today().replace(/-/g,'/');
  g.fillStyle=SUB; g.font=`400 20px ${FONT}`;
  g.fillText(ellipsisText(g,p.name+' ／ 発行日 '+issued,CW),ML,y+20); y+=metaH+gap1;

  g.fillStyle=SUB; g.font=`600 22px ${FONT}`; g.fillText('ご請求の内訳',ML,y+20);
  g.strokeStyle=LINE; g.lineWidth=1; g.beginPath(); g.moveTo(ML,y+34.5); g.lineTo(W-MR,y+34.5); g.stroke();
  y+=secH;

  const DATE_W=64;
  blocks.forEach(b=>{
    g.textAlign='left'; g.fillStyle=INK; g.font=`600 26px ${FONT}`;
    g.fillText(ellipsisText(g,b.label,CW-190),ML,y+28);
    g.textAlign='right'; g.fillStyle=ACCENT; g.font=`700 30px ${FONT}`;
    g.fillText(yen(b.amount),W-MR,y+29);
    let sy=y+rowH+20;
    g.textAlign='left'; g.fillStyle=SUB; g.font=`400 19px ${FONT}`;
    b.subs.forEach(t=>{ g.fillText(ellipsisText(g,t,CW),ML,sy); sy+=subLH; });
    b.items.forEach(it=>{
      g.textAlign='left'; g.fillStyle=SUB; g.font=`400 19px ${FONT}`;
      g.fillText(fmtDateShort(it.date),ML+8,sy);
      g.fillStyle=INK; g.font=`400 21px ${FONT}`;
      mc.font=`400 21px ${FONT}`;
      g.fillText(ellipsisText(mc,it.name||'（無題）',CW-DATE_W-8-150),ML+8+DATE_W,sy);
      g.textAlign='right'; g.font=`600 21px ${FONT}`;
      g.fillText(yen(it.amount),W-MR,sy);
      sy+=itemH;
      if(it.note){ // 元の金額とわけかたを1行下に小さく添える
        g.textAlign='left'; g.fillStyle=SUB; g.font=`400 18px ${FONT}`;
        g.fillText(ellipsisText(g,it.note,CW-DATE_W-8),ML+8+DATE_W,sy-10);
        sy+=noteH;
      }
    });
    g.strokeStyle=LINE; g.beginPath(); g.moveTo(ML,y+b.h-9.5); g.lineTo(W-MR,y+b.h-9.5); g.stroke();
    y+=b.h;
  });
  y+=afterBlocks;

  g.textAlign='left'; g.fillStyle=INK; g.font=`700 24px ${FONT}`;
  g.fillText(ellipsisText(g,totalLabel,CW-230),ML,y+38);
  g.textAlign='right'; g.fillStyle=ACCENT; g.font=`800 42px ${FONT}`; g.fillText(yen(c.yuzu),W-MR,y+44);
  y+=totalH;
  g.textAlign='left'; g.fillStyle=SUB; g.font=`400 19px ${FONT}`;
  let ty=y+18;
  totalSubs.forEach(t=>{ g.fillText(ellipsisText(g,t,CW),ML,ty); ty+=totalSubLH; });
  y+=totalSubH;

  if(acctH){
    y+=gap2;
    roundRect(g,ML,y,CW,acctH,18); g.fillStyle=SURF; g.fill();
    g.strokeStyle=LINE; g.lineWidth=1; g.stroke();
    const bx=ML+26; let by=y+38;
    g.textAlign='left'; g.fillStyle=SUB; g.font=`600 20px ${FONT}`; g.fillText('お振込先',bx,by); by+=34;
    bank.forEach((ln,i)=>{
      g.fillStyle=INK; g.font=(i===0?`700 25px ${FONT}`:`400 22px ${FONT}`);
      g.fillText(ellipsisText(g,ln,CW-52),bx,by); by+=32;
    });
    y+=acctH+gap3;
  } else { y+=gap3; }

  g.textAlign='center'; g.fillStyle=SUB; g.font=`400 18px ${FONT}`; g.fillText('ふたりカード',W/2,y+18);
  return cv;
}

/* ============ バックアップ ============ */
function exportBackup(){
  const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='futaricard-backup-'+today()+'.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000); toast('書き出しました ✓');
}
function handleRestore(file){
  const rd=new FileReader();
  rd.onload=()=>{
    try{ const r=JSON.parse(rd.result);
      if(!r||!r.periods) throw 0;
      if(!confirm('バックアップから復元しますか？\nいまのデータは置きかわります。')) return;
      db=migrate(r); save(); closeSheet(); toast('復元しました ✓');
    }catch(e){ toast('ファイルを読めませんでした'); }
  };
  rd.readAsText(file);
}

/* ============ CSV 取り込み ============ */
function parseCsvLine(line){
  const res=[];let cur='',inQ=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(c==='"'){if(inQ&&line[i+1]==='"'){cur+='"';i++;continue;}inQ=!inQ;continue;}
    if(c===','&&!inQ){res.push(cur);cur='';continue;}
    cur+=c;
  }
  res.push(cur);return res;
}
function decodeBuffer(buf){
  try{return new TextDecoder('utf-8',{fatal:true}).decode(buf);}
  catch(e){try{return new TextDecoder('shift-jis',{fatal:false}).decode(buf);}
  catch(e2){return new TextDecoder('utf-8').decode(buf);}}
}
function hashStr(s){let h=0;for(let i=0;i<s.length;i++)h=((h<<5)-h+s.charCodeAt(i))|0;return Math.abs(h).toString(36);}
function findHeaderIdx(cols,cands){
  for(const c of cands){const i=cols.findIndex(h=>h.replace(/\s/g,'').includes(c));if(i>=0)return i;}
  return -1;
}
// 口座振替・支払い行（買い物ではない）は取り込まない
const PAYMENT_RE=/(口座振替|お支払い金額|ご入金|自動振替|カードお支払|リボお支払|ボーナス払い|お振替|繰越|前回ご請求|今回お支払)/;
const DATE_CELL_RE=/^\s*\d{4}[\/\-.]\d{1,2}[\/\-.]\d{1,2}\s*$/;
// セルを数値化（全角数字・¥・カンマ・空白・△▲・全角マイナスを吸収）。整数でなければNaN
function cellToInt(cell){
  const norm=String(cell||'').trim()
    .replace(/[０-９]/g,d=>'０１２３４５６７８９'.indexOf(d))
    .replace(/[▲△－]/g,'-').replace(/[¥￥,\s]/g,'');
  return /^-?\d+$/.test(norm)?parseInt(norm,10):NaN;
}
function mkItem(date,desc,amount,counter){
  const baseKey=date+'|'+desc+'|'+amount;
  counter[baseKey]=(counter[baseKey]||0)+1;
  const sfx=counter[baseKey]>1?'|'+counter[baseKey]:'';
  return {id:'tx_'+hashStr(baseKey+sfx), src:'csv', date, desc:desc.replace(/\s+/g,' '), amount, tag:'share'};
}
async function parseCreditCSV(file){
  const buf=await file.arrayBuffer();
  const text=decodeBuffer(buf);
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  if(!lines.length){alert('CSVに明細がありません');return null;}
  // ヘッダー行の有無を判定：先頭行の第1列が日付なら「ヘッダー無し（三井住友Vpass等）」
  const first=parseCsvLine(lines[0]);
  if(DATE_CELL_RE.test(first[0]||'')) return parseHeaderless(lines);

  // ── ヘッダーあり（Amex等・列名で金額列を特定）──
  const header=first;
  const dIdx=findHeaderIdx(header,['ご利用日','利用日','取引日','日付','ご利用年月日','Date','TransactionDate']);
  const descIdx=findHeaderIdx(header,['ご利用内容','ご利用先','ご利用店名','ご利用店名・商品名','店名','内容','店舗','摘要','利用店名','加盟店名','Description','Merchant','明細','ご利用明細']);
  const AMT_BAD=/海外|現地|手数料|割引|ポイント|レート|為替|キャッシュバック|処理日|利用日/;
  const amtCand=header.map((h,i)=>({h,i})).filter(o=>/金額/.test(o.h)&&!AMT_BAD.test(o.h));
  let amtIdx=-1;
  if(amtCand.length){
    const pri=amtCand.find(o=>/ご利用金額|ご請求金額|請求金額|お支払金額|支払金額|利用金額|本体金額/.test(o.h));
    amtIdx=pri?pri.i:amtCand[0].i;
  }
  if(amtIdx<0)amtIdx=findHeaderIdx(header,['Amount','amount']);
  if(dIdx<0||descIdx<0||amtIdx<0){
    alert('CSVのフォーマットが認識できませんでした。\nヘッダ: '+header.join(' / ')+'\n\n必要な列: ご利用日 / ご利用内容(店名) / 金額\nこのヘッダをClaudeに伝えてもらえれば対応を追加します。');
    return null;
  }
  const items=[]; const counter={};
  for(let i=1;i<lines.length;i++){
    const cols=parseCsvLine(lines[i]); if(cols.length<2)continue;
    const rawDate=(cols[dIdx]||'').trim();
    const desc=(cols[descIdx]||'').trim();
    const amount=cellToInt(cols[amtIdx]);
    if(!rawDate||!desc||!isFinite(amount)||amount===0)continue;
    if(PAYMENT_RE.test(desc))continue;
    items.push(mkItem(normDate(rawDate), desc, amount, counter));
  }
  return items;
}
// ヘッダー無し・列位置固定（三井住友Vpass: 日付,店名,利用者,支払区分,,支払月,利用金額,請求額,…）
function parseHeaderless(lines){
  const items=[]; const counter={};
  for(const line of lines){
    const c=parseCsvLine(line);
    const dm=(c[0]||'').trim().match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/);
    if(!dm)continue;                                   // 日付でない行（合計・注記等）はスキップ
    const desc=(c[1]||'').trim();
    if(!desc)continue;
    // 金額＝第3列以降で最初の「きれいな整数」列（利用者/支払区分/支払月などの非数値列を自動でスキップ→利用金額を拾う）
    let amount=NaN;
    for(let i=2;i<c.length;i++){ const v=cellToInt(c[i]); if(isFinite(v)&&v!==0){amount=v;break;} }
    if(!isFinite(amount)||amount===0)continue;
    if(PAYMENT_RE.test(desc))continue;
    items.push(mkItem(dm[1]+'-'+String(+dm[2]).padStart(2,'0')+'-'+String(+dm[3]).padStart(2,'0'), desc, amount, counter));
  }
  return items;
}
/* ===== 取り込み先の自動ふりわけ ===== */
// 明細の日付から「年月」を取り出す（"2026-08-13" → "2026-08"）
function ymOf(dateStr){ const m=String(dateStr||'').match(/^(\d{4})-(\d{2})/); return m?m[1]+'-'+m[2]:''; }
function ymLabel(ym){ return ym?(+ym.slice(5,7))+'月分':'日付不明ぶん'; }
function ymJa(ym){ return ym?ym.slice(0,4)+'年'+(+ym.slice(5,7))+'月':'日付が読めなかったぶん'; }
// 期間の名前がその年月を指しているか（「8月分」「2026年8月」「2026-08」などを許容）
function periodMatchesYm(p,ym){
  if(!ym) return false;
  const y=ym.slice(0,4), mm=ym.slice(5,7), m=String(+mm);
  const n=zenNum(p.name).replace(/\s|　/g,'');
  if(n.includes(y+'-'+mm)||n.includes(y+'/'+mm)||n.includes(y+'.'+mm)) return true;
  if(n.includes(y+'年'+m+'月')) return true;
  const other=n.match(/(\d{4})年/);                       // 別の年が書いてあるなら不一致
  if(other&&other[1]!==y) return false;
  return new RegExp('(^|[^0-9])'+m+'月').test(n);
}

/* ===== CSV 取り込み（月ごとにふりわけ→確認してから反映） ===== */
let pendingImport=null;
async function handleCSV(file){
  const parsed=await parseCreditCSV(file);
  if(!parsed) return;
  if(!parsed.length){ toast('取り込める明細がありませんでした'); return; }
  // 年月ごとにまとめる（古い月が上）
  const map=new Map();
  parsed.forEach(t=>{ const k=ymOf(t.date); if(!map.has(k))map.set(k,[]); map.get(k).push(t); });
  const groups=[...map.entries()].sort((x,y)=>x[0]<y[0]?-1:1).map(([ym,items])=>{
    const hit=db.periods.find(p=>periodMatchesYm(p,ym));
    // 日付が読めなかったぶんは、いま開いている期間を既定にする
    return {ym, items, dest: hit?hit.id:(ym?'__new__':db.current)};
  });
  pendingImport={groups};
  openImportSheet();
}
function importDupCount(g){
  if(g.dest==='__new__'||g.dest==='__skip__') return 0;
  const p=db.periods.find(x=>x.id===g.dest); if(!p) return 0;
  const idset=new Set(p.items.map(x=>x.id));
  return g.items.filter(t=>idset.has(t.id)).length;
}
function openImportSheet(){
  const gs=pendingImport.groups;
  const rows=gs.map((g,i)=>{
    const sum=g.items.reduce((a,b)=>a+b.amount,0);
    const opts=db.periods.map(p=>'<option value="'+p.id+'"'+(g.dest===p.id?' selected':'')+'>「'+esc(p.name)+'」に入れる</option>').join('')
      +'<option value="__new__"'+(g.dest==='__new__'?' selected':'')+'>＋「'+esc(ymLabel(g.ym))+'」を新しくつくって入れる</option>'
      +'<option value="__skip__">取り込まない</option>';
    return '<div class="field"><label>'+esc(ymJa(g.ym))+'　'+g.items.length+'件・'+yen(sum)+'</label>'+
      '<select class="impdest" data-i="'+i+'">'+opts+'</select>'+
      '<div class="hint" style="text-align:left;margin-top:6px" id="impNote'+i+'"></div></div>';
  }).join('');
  openSheet(
    '<h2>どこに取り込む？</h2>'+
    '<div class="sd">明細の日付を見て、月ごとに自動でふりわけました。入れ先はここで変えられます。</div>'+
    rows+
    '<div class="sheetbtns"><button class="save" id="impGo">この内容で取り込む</button></div>'+
    '<button class="delbtn" id="impCancel" style="color:var(--sub)">やめる</button>'
  );
  const syncNotes=()=>{
    gs.forEach((g,i)=>{
      const el=ov.querySelector('#impNote'+i); if(!el) return;
      if(g.dest==='__skip__'){ el.textContent='この月は取り込みません'; return; }
      const d=importDupCount(g);
      el.textContent = d?('同じ明細が'+d+'件すでにあります（重複はスキップします）'):'';
    });
  };
  ov.querySelectorAll('.impdest').forEach(sel=>{
    sel.onchange=()=>{ gs[+sel.dataset.i].dest=sel.value; syncNotes(); };
  });
  syncNotes();
  ov.querySelector('#impCancel').onclick=()=>{ pendingImport=null; closeSheet(); };
  ov.querySelector('#impGo').onclick=runImport;
}
function runImport(){
  if(!pendingImport) return;
  const log={at:nowMs(), entries:[]};
  let added=0, dup=0; const parts=[]; let lastPid=null;
  pendingImport.groups.forEach(g=>{
    if(g.dest==='__skip__') return;
    let p, created=false;
    if(g.dest==='__new__'){ p=newPeriod(ymLabel(g.ym)); db.periods.unshift(p); created=true; }
    else p=db.periods.find(x=>x.id===g.dest);
    if(!p) return;
    const idset=new Set(p.items.map(x=>x.id));
    const ids=[];
    g.items.forEach(t=>{ if(idset.has(t.id)){dup++;return;} p.items.push(t); idset.add(t.id); ids.push(t.id); added++; });
    log.entries.push({periodId:p.id, itemIds:ids, createdPeriod:created, name:p.name});
    if(ids.length||created){ parts.push(p.name+' '+ids.length+'件'); lastPid=p.id; }
  });
  pendingImport=null;
  if(!added && !log.entries.some(e=>e.createdPeriod)){ closeSheet(); toast(dup?'すべて取り込み済みでした':'取り込むものがありませんでした'); return; }
  db.lastImport=log;
  if(lastPid){ db.current=lastPid; curFilter='all'; }
  save(); closeSheet(); window.scrollTo(0,0);
  toast(parts.join('・')+'に追加'+(dup?'（重複'+dup+'件はスキップ）':'')+' ✓');
}
function undoLastImport(){
  const log=db.lastImport; if(!log) return;
  log.entries.slice().reverse().forEach(e=>{
    if(e.createdPeriod){ db.periods=db.periods.filter(p=>p.id!==e.periodId); return; }
    const p=db.periods.find(x=>x.id===e.periodId);
    if(p){ const s=new Set(e.itemIds); p.items=p.items.filter(it=>!s.has(it.id)); }
  });
  if(!db.periods.length) db.periods=[newPeriod(monthLabel(new Date()))];
  if(!db.periods.find(p=>p.id===db.current)){ db.current=db.periods[0].id; curFilter='all'; }
  delete db.lastImport;
  save(); closeSheet(); toast('前回の取り込みを取り消しました');
}
function lastImportSummary(){
  const log=db.lastImport; if(!log) return '';
  const n=log.entries.reduce((a,e)=>a+e.itemIds.length,0);
  const d=new Date(log.at);
  return (d.getMonth()+1)+'月'+d.getDate()+'日 '+pad(d.getHours())+':'+pad(d.getMinutes())+'・'+n+'件（'+log.entries.map(e=>e.name).join('・')+'）';
}

/* ============ トースト ============ */
let toastT=null;
function toast(msg){
  let t=document.getElementById('toast');
  if(!t){t=document.createElement('div'); t.id='toast'; t.className='toast'; document.body.appendChild(t);}
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200);
}

/* ============ イベント ============ */
document.getElementById('periodBtn').onclick=openPeriods;
document.getElementById('settingsBtn').onclick=openSettings;
document.getElementById('addBtn').onclick=()=>openItem(curPeriod(),null);
document.getElementById('importBtn').onclick=()=>document.getElementById('csvInput').click();
document.getElementById('csvInput').addEventListener('change',e=>{ if(e.target.files[0])handleCSV(e.target.files[0]); e.target.value=''; });
document.getElementById('restoreInput').addEventListener('change',e=>{ if(e.target.files[0])handleRestore(e.target.files[0]); e.target.value=''; });

/* ============ 起動 ============ */
render();
loadRemote();
subscribeRealtime();
</script>

<style>
  #tsumikiEdge{position:fixed; top:0; bottom:0; left:0; width:22px; z-index:999;}
  #tsumikiPeek{
    position:fixed; top:50%; left:0; z-index:1001; margin-top:-23px;
    width:46px; height:46px; display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.92);
    -webkit-backdrop-filter:saturate(180%) blur(14px); backdrop-filter:saturate(180%) blur(14px);
    border:1px solid rgba(0,0,0,.06); border-radius:50%;
    box-shadow:0 6px 20px rgba(0,0,0,.18);
    color:#0071e3; font-size:24px; font-weight:600; line-height:1;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Helvetica Neue",Arial,sans-serif;
    transform:translateX(-70px) scale(.8); opacity:0; pointer-events:none;
  }
</style>
<div id="tsumikiEdge"></div>
<div id="tsumikiPeek">‹</div>
<script>
  (function(){
    var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
      || window.navigator.standalone === true;
    var fromTsumiki = false;
    try{
      if(document.referrer){
        var r = new URL(document.referrer);
        fromTsumiki = (r.origin === location.origin);
      }
    }catch(e){}
    if(!(standalone && fromTsumiki)) return;

    var peek = document.getElementById('tsumikiPeek');
    var edge = document.getElementById('tsumikiEdge');

    function goBack(){ location.href = 'index.html'; }

    /* --- 左端エッジスワイプで戻る（iOS純正の戻る操作。見えるボタンは置かない） --- */
    var sx=0, sy=0, prog=0, dragging=false, W=window.innerWidth;
    var TRIGGER = Math.min(120, W*0.32);
    window.addEventListener('resize', function(){ W=window.innerWidth; TRIGGER=Math.min(120, W*0.32); });

    function reset(){
      dragging = false; prog = 0;
      peek.style.transition = 'transform .25s ease, opacity .25s ease';
      peek.style.transform = 'translateX(-70px) scale(.8)';
      peek.style.opacity = 0;
    }
    function start(e){
      var t = e.touches ? e.touches[0] : e;
      if(t.clientX > 26) return;
      sx = t.clientX; sy = t.clientY; prog = 0; dragging = true;
      peek.style.transition = 'none';
    }
    function move(e){
      if(!dragging) return;
      var t = e.touches ? e.touches[0] : e;
      var dx = t.clientX - sx, dy = t.clientY - sy;
      if(Math.abs(dy) > Math.abs(dx) + 12){ reset(); return; }
      if(dx < 0) dx = 0;
      prog = Math.min(dx / TRIGGER, 1);
      peek.style.transform = 'translateX(' + (-70 + prog*82) + 'px) scale(' + (0.8 + prog*0.2) + ')';
      peek.style.opacity = prog;
      if(dx > 6 && e.cancelable) e.preventDefault();
    }
    function end(){
      if(!dragging) return;
      dragging = false;
      if(prog >= 0.999){
        peek.style.transition = 'transform .25s ease, opacity .25s ease';
        peek.style.transform = 'translateX(20px) scale(1.05)';
        peek.style.opacity = 1;
        goBack();
      }else{
        reset();
      }
    }
    edge.addEventListener('touchstart', start, {passive:true});
    window.addEventListener('touchmove', move, {passive:false});
    window.addEventListener('touchend', end, {passive:true});
    window.addEventListener('touchcancel', end, {passive:true});
  })();
</script>
