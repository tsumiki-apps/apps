<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="apple-touch-icon" href="icons/icon-health.png">
<meta name="apple-mobile-web-app-title" content="からだ帳">
<meta name="theme-color" content="#f5f4f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f0d07" media="(prefers-color-scheme: dark)">
<title>からだ帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f5f4f0; --card:#fffefb; --surface-2:#efece5; --ink:#1d1a15; --ink-mid:#5b554a; --ink-soft:#666154;
  --ghost:#887f70; --line:#e2ded4; --line-2:#d8d3c7;
  --accent:#b06f26; --accent-2:#8a5a24; --accent-wash:#f0e4d1;
  --good:#4c7a51; --good-wash:#dde9dd; --good-ink:#416845;
  --warn:#b0522a; --warn-wash:#f2e0d4; --warn-ink:#974624;
  --radius:20px; --on-fill:#f5f4f0;
  --shadow:0 1px 2px rgba(40,32,18,.05), 0 10px 26px -16px rgba(40,32,18,.18);
  --ease:cubic-bezier(.2,0,0,1);
  --font:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Hiragino Sans',sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#0f0d07; --card:#211d14; --surface-2:#2b2619; --ink:#efe8da; --ink-mid:#a89e8b; --ink-soft:#9f988a;
    --ghost:#7d7462; --line:#36301f; --line-2:#443d2b;
    --accent:#d59a4d; --accent-2:#e0ab63; --accent-wash:#362a19;
    --good:#7fae82; --good-wash:#23301f; --good-ink:#7fae82;
    --warn:#d9825a; --warn-wash:#39251a; --warn-ink:#d9825a;
    --on-fill:#1d1a15;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 30px -18px rgba(0,0,0,.65);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.7 var(--font);min-height:100dvh;-webkit-text-size-adjust:100%}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px calc(40px + env(safe-area-inset-bottom))}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
[hidden]{display:none!important}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.date{font-size:14px;color:var(--ink-mid);margin:0}
h1{font-size:28px;font-weight:700;margin:0;line-height:1.3}
.iconbtn{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;border:0;background:var(--surface-2);color:var(--ink-mid);cursor:pointer}

/* ぐにゃりタブ（design_refs/rareui.motion.md ①） */
.gnav{overflow-x:auto;max-width:100%;scrollbar-width:none}
.gnav::-webkit-scrollbar{display:none}
.gnav ul{display:flex;align-items:center;list-style:none;margin:0;padding:2px 0}
.gnav li{position:relative;background:var(--surface-2);flex:none}
.gnav li.on{background:var(--accent-2)}
.gnav button{display:flex;align-items:center;border:0;background:none;padding:10px 20px;font:500 15px/24px var(--font);color:var(--ink-mid);cursor:pointer;min-height:44px}
.gnav li.on button{color:var(--on-fill)}
.gnav .neck{position:absolute;top:0;right:100%;height:100%;pointer-events:none;display:block}

.verdict{display:flex;align-items:center;gap:12px;border-radius:12px;padding:14px 16px;margin:0 0 16px;font-weight:700;font-size:18px}
.verdict.warn{background:var(--warn-wash);color:var(--warn-ink)}
.verdict.good{background:var(--good-wash);color:var(--good-ink)}
.verdict.flat{background:var(--surface-2);color:var(--ink)}
.verdict svg.i{width:28px;height:28px}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.tile .lab{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:500;color:var(--ink-mid)}
.tile .num{font-size:34px;font-weight:700;line-height:1.2;margin-top:6px;font-variant-numeric:tabular-nums}
.tile .num small{font-size:14px;font-weight:500;color:var(--ink-mid);margin-left:2px}
.tile .when{font-size:13px;color:var(--ink-soft)}
.delta{display:inline-flex;align-items:center;gap:2px;font-size:13px;font-weight:500;border-radius:9999px;padding:1px 8px}
.delta.down{background:var(--warn-wash);color:var(--warn-ink)}
.delta.up{background:var(--good-wash);color:var(--good-ink)}
.delta.flat{background:var(--surface-2);color:var(--ink-mid)}
.spark{display:block;width:100%;height:36px;margin-top:8px}

.cols{display:grid;gap:12px;margin-top:12px}
@media (min-width:900px){ .cols{grid-template-columns:2fr 1fr} }
h2{font-size:18px;font-weight:700;margin:0;line-height:1.4}
.subt{font-size:13px;color:var(--ink-soft);margin:2px 0 10px}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);font-size:13px;border-radius:8px;padding:4px 10px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity 120ms var(--ease)}
.tip.show{opacity:1}
.src{font-size:12px;letter-spacing:.08em;color:var(--ink-soft);margin:8px 0 0}

.stale{list-style:none;margin:8px 0 0;padding:0}
.stale li{display:flex;align-items:center;gap:10px;min-height:52px;border-top:1px solid var(--line)}
.stale li:first-child{border-top:0}
.stale .v{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.stale .d{font-size:13px;color:var(--warn-ink);background:var(--warn-wash);border-radius:9999px;padding:0 8px}
.stale .none{color:var(--ink-soft);font-size:14px}

/* 合言葉・空の画面 */
.gate,.empty{max-width:420px;margin:12vh auto 0;padding:0 16px;text-align:center}
.gate svg.big,.empty svg.big{width:72px;height:72px;fill:none;stroke:var(--ink-mid);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.gate form{display:flex;gap:8px;margin-top:20px}
.gate input{flex:1;min-width:0;height:44px;font:16px var(--font);color:var(--ink);background:var(--card);border:1px solid var(--line-2);border-radius:12px;padding:0 14px}
.btn{height:44px;border:0;border-radius:12px;padding:0 20px;font:500 15px var(--font);background:var(--accent-2);color:var(--on-fill);cursor:pointer}
.msg{font-size:14px;color:var(--warn-ink);min-height:1.7em;margin:8px 0 0}
.empty p{color:var(--ink-mid);margin:12px 0 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<style>
/* ================================================================
   つみき用「ネイティブ部品」CSS  v2  (2026-09-09)
   sashimi UI (MIT / yuto-hasegawa) の作り方を参考に、
   つみきの決まりごと（タップ44px・入力16px・8幅・変数名）へ書き直したもの。
   コードはコピーではなく書き直し。考え方の出どころだけ上に記す。

   使い方：単一HTMLの <style> にこのまま貼る。クラスはすべて tn- 始まり。
   色は既存アプリの変数（--card/--ink/--sub/--line/--accent/--radius など）を
   そのまま使う。無いアプリでも下の既定値で動く。
   ================================================================ */

/* すべてを @layer tn に入れてある。
   層に入れた規則は、層に入っていないアプリ側の規則に**必ず負ける**（順番も詳細度も関係ない）。
   だから tn.css を </head> の直前＝アプリのCSSより後に入れても、
   アプリが持っている見た目が勝つ。上書きに !important は要らない。 */
@layer tn {

:root{
  /* 既存アプリの変数があればそちらが勝つ。無ければ次の候補→最後に既定値。
     ⚠ --accent を持たないアプリに青を差し込まないよう、accent は最後に --ink へ落とす
        （墨色なら何色のアプリに混ぜても浮かない）。 */
  --tn-paper:      var(--paper,  var(--card, var(--surface, #ffffff)));
  --tn-ink:        var(--ink,     var(--text,  #1d1d1f));
  --tn-sub:        var(--sub,     var(--muted, #6e6e73));
  --tn-line:       var(--line,    var(--hair,  #e3e3e6));
  --tn-accent:     var(--accent,  var(--ink,   #0071e3));
  /* 塗りつぶしの地は --accent-2（濃い側）。DESIGN.md いわく --accent に白文字は 4.08:1 で不合格 */
  --tn-fill:       var(--accent-2, var(--tn-accent));
  --tn-on-fill:    var(--paper,    #ffffff);
  --tn-radius:     var(--radius, 14px);
  --tn-good:       var(--good,   var(--ok,   #34c759));
  --tn-warn:       var(--warn,   #ff9500);
  --tn-danger:     var(--danger, var(--red,  #ff3b30));
  /* 洗い色の帯に載せる文字は濃い側を使う（--good をそのまま置くと 3.98:1） */
  --tn-good-ink:   var(--good-ink, var(--tn-good));
  --tn-warn-ink:   var(--warn-ink, var(--tn-warn));

  /* 1色から淡い面を自動でつくる（--accent-soft などを手で持たなくていい） */
  --tn-accent-wash: color-mix(in srgb, var(--tn-accent) 12%, transparent);
  --tn-hover:       color-mix(in srgb, var(--tn-ink)    5%, transparent);

  --tn-tap: 44px;          /* つみきの最小タップ。ここだけ直せば全部そろう */
  --tn-gap: 12px;
}

/* ---- 触れるものすべてに同じフォーカスの輪（キーボード操作のときだけ出る） ---- */
:where(.tn-choice,.tn-optrow):has(:focus-visible),
:where(.tn-chip,.tn-tab,.tn-acc>summary,.tn-check,.tn-radio,.tn-switch,.tn-row):focus-visible{
  outline:2px solid var(--tn-accent); outline-offset:2px; border-radius:8px;
}

/* ================================================================
   1. tn-choice — 押せる選択カード（JS 0行）
   <label class="tn-choice"><input type="radio" class="tn-radio" name="x">
     <b>おまかせ</b><small>その日のおすすめ</small></label>
   選ばれたかどうかは :has(:checked) が見てくれる。
   ================================================================ */
.tn-choice{
  display:grid; grid-template-columns:auto 1fr; align-items:start;
  column-gap:var(--tn-gap); row-gap:2px;
  width:100%; min-height:var(--tn-tap); padding:14px;
  box-sizing:border-box; cursor:pointer;
  background:var(--tn-paper); color:var(--tn-ink);
  border:1px solid var(--tn-line); border-radius:var(--tn-radius);
  transition:background .15s, border-color .15s;
}
.tn-choice > :not(input){ grid-column:2; }
.tn-choice > input{ grid-row:1; margin:0; margin-top:2px; }
@supports (margin-top:1lh){ .tn-choice > input{ margin-top:calc((1lh - 22px) / 2) } }
.tn-choice > small{ color:var(--tn-sub); font-size:13px; line-height:1.5; }
.tn-choice:has(:checked){
  background:var(--tn-accent-wash); border-color:var(--tn-accent);
}
.tn-choice:has(:disabled){ opacity:.5; cursor:default; }
@media (hover:hover){ .tn-choice:hover:not(:has(:disabled)){ background:var(--tn-hover); } }
.tn-choice:active:not(:has(:disabled)){ transform:scale(.99); }

/* ================================================================
   2. tn-check / tn-radio — チェックと丸。画像もJSも使わない
   ✓ は疑似要素2本の線を「短い方 → 長い方」の順に伸ばして描く。
   ※ input 自体は22px。指で押す44pxは必ず親の .tn-optrow / .tn-choice が持つ。
   <label class="tn-optrow"><input type="checkbox" class="tn-check">同意する</label>
   ================================================================ */
.tn-optrow{
  display:flex; align-items:center; gap:10px;
  min-height:var(--tn-tap); padding:4px 2px; cursor:pointer;
}
.tn-optrow:has(:disabled){ opacity:.45; cursor:default }

.tn-check,.tn-radio{
  appearance:none; -webkit-appearance:none; background-color:transparent;
  position:relative; flex:0 0 auto; box-sizing:border-box;
  width:22px; height:22px; min-width:22px; margin:0; padding:0; cursor:pointer;
}

.tn-check{
  border-radius:7px; box-shadow:inset 0 0 0 2px var(--tn-line);
  background-image:radial-gradient(circle, var(--tn-fill) 50%, transparent 50%);
  background-position:center; background-repeat:no-repeat; background-size:0 0;
  transition:box-shadow .15s, background-size 60ms cubic-bezier(1,.35,1,.27);
}
.tn-check:checked{
  box-shadow:inset 0 0 0 2px var(--tn-fill);
  background-size:44px 44px;
  transition:box-shadow .15s, background-size .16s ease-out;
}
/* ✓ は「線2本を順に伸ばす」書き方もできるが、それだと ::before と ::after を
   両方使い切ってしまい、44px の当たり判定（下の .tn-hit）を載せる場所が無くなる。
   つみきは 44px のほうが決まりごとなので、✓ は ::before ひとつ＝角を回した枠で描く。 */
.tn-check::before{
  content:""; position:absolute; left:7.5px; top:3.5px;
  width:5.5px; height:11px; box-sizing:border-box;
  border:solid var(--tn-on-fill); border-width:0 2.6px 2.6px 0;
  transform:rotate(45deg) scale(.2); transform-origin:center; opacity:0;
  transition:transform 120ms cubic-bezier(.5,1.5,.5,1), opacity 90ms ease-out;
}
.tn-check:checked::before{ transform:rotate(45deg) scale(1); opacity:1 }

.tn-radio{
  border-radius:50%; border:2px solid var(--tn-line); transition:border-color .15s;
}
.tn-radio::before{
  content:""; position:absolute; inset:50% auto auto 50%;
  width:0; height:0; border-radius:50%; background:var(--tn-fill);
  transform:translate(-50%,-50%); transition:width .12s ease-out, height .12s ease-out;
}
.tn-radio:checked{ border-color:var(--tn-fill) }
.tn-radio:checked::before{ width:12px; height:12px }

.tn-check:disabled,.tn-radio:disabled{ cursor:default }
.tn-check:disabled:not(:checked),.tn-radio:disabled:not(:checked){ opacity:.45 }

/* ================================================================
   3. tn-switch — 入／切のつまみ（input[type=checkbox] 1個だけ）
   ================================================================ */
.tn-switch{
  appearance:none; -webkit-appearance:none;
  position:relative; flex:0 0 auto; vertical-align:middle;
  width:52px; height:32px; margin:0; border-radius:999px; cursor:pointer;
  background:var(--tn-line); transition:background-color .18s ease;
}
.tn-switch::before{                      /* つまみ。見た目は ::before に統一し
                                            ::after は当たり判定(.tn-hit)に空けておく */
  content:""; position:absolute; top:3px; left:3px;
  width:26px; height:26px; border-radius:50%; background:var(--tn-paper);
  box-shadow:0 1px 3px rgba(0,0,0,.25);
  transition:left .18s ease;
}
.tn-switch:checked{ background:var(--tn-fill); }
.tn-switch:checked::before{ left:23px; }
.tn-switch:disabled{ opacity:.45; cursor:default; }

/* ================================================================
   4. tn-acc — 開いて読むところ（details / summary。JS 0行）
   <details class="tn-acc"><summary>くわしく</summary><p>…</p></details>
   ================================================================ */
.tn-acc{
  width:100%; box-sizing:border-box; overflow:hidden;
  background:var(--tn-paper); border:1px solid var(--tn-line);
  border-radius:var(--tn-radius);
}
.tn-acc > summary{
  display:flex; align-items:center; gap:8px;
  min-height:var(--tn-tap); padding:14px 16px;
  font-weight:700; list-style:none; cursor:pointer;
}
.tn-acc > summary::-webkit-details-marker{ display:none; }
.tn-acc > summary::after{                /* ▾ を線2本で作る（画像不要） */
  content:""; width:.5em; height:.5em; margin-inline-start:auto;
  border-right:2px solid currentColor; border-bottom:2px solid currentColor;
  transform:translateY(-2px) rotate(45deg); transition:transform .18s ease-out;
}
.tn-acc[open] > summary::after{ transform:translateY(2px) rotate(225deg); }
.tn-acc > :not(summary){ margin:0 16px 16px; }
@media (hover:hover){ .tn-acc > summary:hover{ background:var(--tn-hover); } }

/* ================================================================
   5. tn-sheet — ダイアログ（<dialog>。Escで閉じる・背面固定はブラウザ任せ）
   出す: el.showModal()   閉じる: el.close()
   ================================================================ */
.tn-sheet{
  border:0; padding:0; max-width:min(560px, calc(100% - 32px));
  width:100%; box-sizing:border-box;
  background:var(--tn-paper); color:var(--tn-ink);
  border-radius:var(--tn-radius);
  box-shadow:0 10px 40px rgba(0,0,0,.18);
}
.tn-sheet::backdrop{ background:rgba(0,0,0,.45); }
.tn-sheet > .tn-sheet-body{ padding:20px; }
/* 幅600px以下では下からせり上がる「シート」にする */
@media (max-width:600px){
  .tn-sheet{
    max-width:100%; margin:auto auto 0; 
    border-radius:var(--tn-radius) var(--tn-radius) 0 0;
    padding-bottom:env(safe-area-inset-bottom);
  }
}

/* ================================================================
   6. tn-kv — 明細（<dl>。合計・内訳・レシート）
   ================================================================ */
.tn-kv{
  display:grid; grid-template-columns:1fr auto;
  column-gap:16px; row-gap:8px; margin:0;
}
.tn-kv dt{ color:var(--tn-sub); }
.tn-kv dd{ margin:0; justify-self:end; font-variant-numeric:tabular-nums; }
.tn-kv .tn-total{ font-weight:700; color:var(--tn-ink); }

/* ================================================================
   7. tn-meter / tn-bar / tn-spin / tn-skel — 量と待ち時間
   <meter class="tn-meter" value=".8" low=".3" high=".7" optimum=".1">
   → しきい値を超えると自動で色が変わる（JSで色を出し分けなくていい）
   ================================================================ */
.tn-meter{
  appearance:none; -webkit-appearance:none;
  width:100%; height:10px; border:0; border-radius:999px; overflow:hidden;
  background:var(--tn-line);
}
.tn-meter::-webkit-meter-bar{ background:var(--tn-line); border:0; border-radius:999px; }
.tn-meter::-webkit-meter-optimum-value        { background:var(--tn-good);   border-radius:999px; }
.tn-meter::-webkit-meter-suboptimum-value     { background:var(--tn-warn);   border-radius:999px; }
.tn-meter::-webkit-meter-even-less-good-value { background:var(--tn-danger); border-radius:999px; }
.tn-meter::-moz-meter-bar{ background:var(--tn-good); border-radius:999px; }
.tn-meter:-moz-meter-sub-optimum::-moz-meter-bar{ background:var(--tn-warn); }
.tn-meter:-moz-meter-sub-sub-optimum::-moz-meter-bar{ background:var(--tn-danger); }

.tn-bar{
  appearance:none; -webkit-appearance:none;
  position:relative; width:100%; height:8px; border:0; border-radius:999px;
  overflow:hidden; background:var(--tn-line);
}
.tn-bar::-webkit-progress-bar{ background:var(--tn-line); }
.tn-bar::-webkit-progress-value{ background:var(--tn-accent); border-radius:999px; }
.tn-bar::-moz-progress-bar{ background:var(--tn-accent); }
.tn-bar:indeterminate::before{
  content:""; position:absolute; inset:0; background:var(--tn-accent);
  transform-origin:0 50%; animation:tn-run 1s linear infinite;
}
@keyframes tn-run{
  0%{ transform:translateX(0) scaleX(0) }
  40%{ transform:translateX(0) scaleX(.4) }
  100%{ transform:translateX(100%) scaleX(.5) }
}

.tn-spin{                                  /* ぐるぐる（画像もJSも無し） */
  width:32px; height:32px; border-radius:50%;
  border:3px solid var(--tn-line); border-top-color:var(--tn-accent);
  animation:tn-turn .8s linear infinite;
}
@keyframes tn-turn{ to{ transform:rotate(360deg) } }

.tn-skel{                                  /* 読み込み中の灰色の板 */
  border-radius:12px; background:var(--tn-line); position:relative; overflow:hidden;
}
.tn-skel::after{
  content:""; position:absolute; inset:0;
  background:linear-gradient(100deg, transparent 20%,
             color-mix(in srgb, var(--tn-paper) 70%, transparent) 50%, transparent 80%);
  animation:tn-sweep 1.1s linear infinite;
}
@keyframes tn-sweep{ from{ transform:translateX(-100%) } to{ transform:translateX(100%) } }

@media (prefers-reduced-motion:reduce){
  .tn-spin,.tn-skel::after,.tn-bar:indeterminate::before{ animation:none }
  /* 止めるのは tn の部品だけ。アプリ全体に !important を撃たない
     （@layer の中の !important は層の外＝アプリ側の指定に勝ってしまう）。
     JS側の動きは tn.js の TN.reduced() が別に見ている。 */
  [class*="tn-"], [class*="tn-"] *{ transition-duration:.01ms }
}

/* ================================================================
   8. tn-note — おしらせの囲み。1色から淡い面を color-mix で作る
   ================================================================ */
.tn-note{
  padding:14px 16px; margin:0; border-radius:var(--tn-radius);
  background:var(--tn-accent-wash);
  border:1px solid color-mix(in srgb, var(--tn-accent) 25%, transparent);
}
.tn-note.tn-good  { background:color-mix(in srgb, var(--tn-good)   12%, transparent);
                    border-color:color-mix(in srgb, var(--tn-good)   28%, transparent); }
.tn-note.tn-warn  { background:color-mix(in srgb, var(--tn-warn)   14%, transparent);
                    border-color:color-mix(in srgb, var(--tn-warn)   32%, transparent); }

                    border-color:color-mix(in srgb, var(--tn-danger) 28%, transparent); }

/* ================================================================
   9. tn-chip / tn-tabs — 絞り込みと切り替え（どちらも44px）
   ================================================================ */
.tn-chip{
  display:inline-flex; align-items:center; justify-content:center;
  min-height:var(--tn-tap); padding:0 16px; box-sizing:border-box;
  font:inherit; font-size:14px; font-weight:700; line-height:1;
  color:var(--tn-ink); background:var(--tn-paper);
  border:1px solid var(--tn-line); border-radius:999px;
  cursor:pointer; white-space:nowrap;
}
.tn-chip.on{ color:var(--tn-fill); background:var(--tn-accent-wash); border-color:var(--tn-fill); }
.tn-chip:disabled{ opacity:.45; cursor:default; }
.tn-chips{ display:flex; gap:8px; overflow-x:auto; padding-bottom:4px;
           scrollbar-width:none; -webkit-overflow-scrolling:touch; }
.tn-chips::-webkit-scrollbar{ display:none }

.tn-tabs{ display:flex; gap:4px; border-bottom:1px solid var(--tn-line); overflow-x:auto;
          scrollbar-width:none } .tn-tabs::-webkit-scrollbar{ display:none }
.tn-tab{
  position:relative; flex:0 0 auto;
  display:inline-flex; align-items:center; justify-content:center;
  min-width:64px; min-height:var(--tn-tap); padding:0 16px;
  font:inherit; font-weight:600; color:var(--tn-sub);

}
.tn-tab.on{ color:var(--tn-fill); font-weight:700 }

}

/* ================================================================

   ================================================================ */

.tn-table{ border-collapse:collapse; width:100%; min-width:max-content }
.tn-table thead{ border-bottom:1px solid var(--tn-line) }
.tn-table th{ color:var(--tn-sub); font-weight:600; text-align:left;
              padding:8px 12px; white-space:nowrap }
.tn-table td{ padding:12px; vertical-align:middle }
.tn-table tbody tr + tr{ border-top:1px solid var(--tn-line) }
.tn-table .tn-num{ text-align:right; font-variant-numeric:tabular-nums }

/* ================================================================
   11. tn-row — 一覧の1行（押せる行）。押した波紋を親の中に閉じ込める

   ================================================================ */
.tn-row{
  position:relative; isolation:isolate; overflow:hidden;
  display:flex; align-items:center; gap:10px;
  width:100%; min-height:var(--tn-tap); padding:12px 14px;
  box-sizing:border-box; text-align:left; font:inherit; color:inherit;
  background:none; border:0; border-radius:var(--tn-radius); cursor:pointer;
}
.tn-row::before{
  content:""; position:absolute; left:50%; top:50%; z-index:-1;
  width:120%; aspect-ratio:1; border-radius:50%;
  background:var(--tn-ink); opacity:0;
  transform:translate(-50%,-50%); transition:all 260ms ease-out;
}
.tn-row:active::before{ width:0; height:0; opacity:.14; transition:none }
.tn-row.on{ background:var(--tn-accent-wash); color:var(--tn-fill) }

/* ================================================================
   12. 文字まわり — 蛍光ペンと注記
   ================================================================ */
.tn-mark{
  padding-inline:.1em;
  background:linear-gradient(transparent 58%, var(--tn-accent-wash) 58%);
}
.tn-hint{ margin:4px 0 0; font-size:13px; line-height:1.5; color:var(--tn-sub) }
.tn-hint.tn-danger{ color:var(--tn-danger) }

/* ================================================================
   13. tn-toast — 一瞬出て消える知らせ（93本中53本が自作していた）
   <div class="tn-toast" id="toast"></div>
   出す: t.textContent='保存しました'; t.classList.add('on');
   消す: setTimeout(()=>t.classList.remove('on'), 2200);
   ================================================================ */
.tn-toast{
  position:fixed; left:50%; z-index:2000;
  bottom:calc(env(safe-area-inset-bottom) + 24px);
  max-width:min(92vw, 420px); padding:12px 18px;
  box-sizing:border-box; text-align:center; line-height:1.5;
  color:var(--tn-paper); background:rgba(28,28,30,.94);
  border-radius:999px; box-shadow:0 6px 24px rgba(0,0,0,.28);
  transform:translate(-50%, 12px); opacity:0; pointer-events:none;
  transition:transform .22s ease, opacity .22s ease;
}
.tn-toast.on{ transform:translate(-50%, 0); opacity:1 }

/* ================================================================
   14. tn-empty — まだ何も無いときの画面（93本中55本が自作していた）
   <div class="tn-empty"><span class="tn-empty-em">📄</span>
     まだ1枚もありません。<br>ここから最初の1枚を。</div>
   ================================================================ */
.tn-empty{
  text-align:center; color:var(--tn-sub);
  font-size:14px; line-height:1.8; padding:44px 20px;
}
.tn-empty-em{
  display:block; font-size:40px; line-height:1;
  margin-bottom:10px; opacity:.85;
}

/* ================================================================
   15. tn-seg — ひとつながりの切り替え（93本中20本が自作していた）
   タブと違い「枠の中で選ぶ」型。等分に伸びる。
   <div class="tn-seg"><button class="on">日</button><button>週</button></div>
   ================================================================ */
.tn-seg{
  display:flex; gap:4px; padding:4px; box-sizing:border-box;
  background:var(--tn-hover); border-radius:999px;
}
.tn-seg > button{
  flex:1 1 0; min-width:0; min-height:var(--tn-tap);
  padding:0 12px; font:inherit; font-size:14px; font-weight:700;
  color:var(--tn-sub); background:transparent; border:0; border-radius:999px;
  cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  transition:background .15s, color .15s;
}
.tn-seg > button.on{
  color:var(--tn-fill); background:var(--tn-paper);
  box-shadow:0 1px 3px rgba(0,0,0,.12);
}
.tn-seg > button:disabled{ opacity:.45; cursor:default }

/* ================================================================
   16. tn-badge — 種類や状態の小さな札（93本中11本が自作していた）
   ================================================================ */
.tn-badge{
  display:inline-flex; align-items:center; flex:0 0 auto;
  padding:2px 9px; border-radius:999px;
  font-size:11px; font-weight:800; letter-spacing:.02em; line-height:1.6;
  color:var(--tn-fill); background:var(--tn-accent-wash);
}
.tn-badge.tn-good  { color:var(--tn-good-ink); background:color-mix(in srgb, var(--tn-good)   14%, transparent) }
.tn-badge.tn-warn  { color:var(--tn-warn-ink); background:color-mix(in srgb, var(--tn-warn)   16%, transparent) }
.tn-badge.tn-danger{ color:var(--tn-danger); background:color-mix(in srgb, var(--tn-danger) 12%, transparent) }
.tn-badge.tn-quiet { color:var(--tn-sub);    background:var(--tn-hover) }

/* ================================================================
   17. tn-field / tn-input — 入力ひと組（ラベル＋欄＋補足）
   つみきの決まり「入力欄は16px以上・高さ44px」をここで守る。
   iOSは16px未満の入力欄に触ると画面を勝手に拡大するので下げない。
   ================================================================ */
.tn-field{ display:flex; flex-direction:column; gap:5px }
.tn-field > label{
  font-size:12px; font-weight:700; color:var(--tn-sub);
  letter-spacing:.02em; padding-inline-start:2px;
}
.tn-input,.tn-textarea,.tn-select{
  width:100%; box-sizing:border-box; font:inherit; font-size:16px;
  color:var(--tn-ink); background:var(--tn-paper);
  border:1px solid var(--tn-line); border-radius:10px;
  padding:11px 12px; min-height:var(--tn-tap);
}
.tn-textarea{ resize:vertical; line-height:1.6 }
.tn-select{
  appearance:none; -webkit-appearance:none; padding-inline-end:34px;
  /* ▾ は背景のグラデーション2本で描く（画像もSVGも読み込まない） */
  background-image:
    linear-gradient(45deg,  transparent 50%, currentColor 50%, currentColor 58%, transparent 58%),
    linear-gradient(-45deg, transparent 50%, currentColor 50%, currentColor 58%, transparent 58%);
  background-size:6px 6px, 6px 6px;
  background-position:right 18px center, right 13px center;
  background-repeat:no-repeat;
}
.tn-input:focus,.tn-textarea:focus,.tn-select:focus{
  outline:none; border-color:var(--tn-fill);
}
.tn-input:disabled,.tn-textarea:disabled,.tn-select:disabled{
  opacity:.55; cursor:default;
}
.tn-input.tn-danger,.tn-textarea.tn-danger,.tn-select.tn-danger{ border-color:var(--tn-danger) }

/* ================================================================
   18. tn-search — さがす欄（虫めがねは疑似要素の丸と線で描く）

   ================================================================ */

.tn-search > .tn-input{ padding-inline-start:38px }
.tn-search::before{                     /* レンズ */
  content:""; position:absolute; left:14px; top:50%; margin-top:-8px;
  width:11px; height:11px; box-sizing:border-box;
  border:2px solid var(--tn-sub); border-radius:50%; opacity:.9;
}
.tn-search::after{                      /* 柄 */
  content:""; position:absolute; left:24px; top:50%; margin-top:2px;
  width:5px; height:2px; border-radius:2px;
  background:var(--tn-sub); transform:rotate(45deg); opacity:.9;
}
.tn-search > .tn-input::-webkit-search-decoration,
.tn-search > .tn-input::-webkit-search-cancel-button{ -webkit-appearance:none }

/* ================================================================
   19. tn-hit — 見た目はそのままで「押せる範囲」だけ44pxに広げる
   つみきの決まり「タップ44px」を、22pxのチェックや24pxの×ボタンで守るための道具。
   透明な板を疑似要素で敷くだけなので、並びも大きさもずれない。

   <button class="row-del tn-hit">×</button>
   <input type="checkbox" class="tn-check tn-hit">

   使えない場所・注意:
   - その要素が ::after を自分で使っていると付けられない。
     tn-check / tn-radio / tn-switch は、そのために ::after を空けてある。
   - 透明な板が左右上下にはみ出す。**11px以内に別の押せるものがあると

   ================================================================ */
.tn-hit{ position:relative }
.tn-hit::after{

.tn-hit.tn-hit-left::after { left:0;  transform:translateY(-50%) }
.tn-hit.tn-hit-right::after{ left:auto; right:0; transform:translateY(-50%) }
}

/* ================================================================
   つみき用「動きの下ごしらえ」JS  v1  (2026-09-09)

   tn.css の相棒。CSS では書けない2つだけを持つ。
     1. rnd()    …… 決定論の擬似乱数（Math.random() の置き換え）
     2. reveal() …… 見えたら再生・押したらもう一度

   考え方の出どころ: lieflat-charts（PolyForm Noncommercial）。
   ライセンスが非商用なので**コードは写していない**。借りたのは
   「デモの乱数は決定論にする」「再生前に必ずタイマーを掃除する」
   という2つの考え方だけで、中身はつみき用に書き直したもの。
   調査 → ~/つみき出力/道具としらべ/単発まとめ/V1/メモ/lieflat-charts_調査と採用可否_2026-09-08.md

   使い方: 単一HTMLの <script> にこのまま貼る（or python3 inject_tn.py <HTML>）。
   ぶら下がる名前は window.TN の1つだけ。既存コードとぶつからない。
   ================================================================ */
(function (global) {
  'use strict';

  /* ── 1 · 決定論の擬似乱数 ────────────────────────────────
     Math.random() を使わない。リロードのたびに形が変わると、
     スクショも録画も「前と同じか」の見比べも全部あてにならなくなる。
     つみきは「架空データの複製から画面を撮る」運用（お返事カード・IG投稿）
     をしているので、ここが変わると成果物が毎回ちがう絵になる。

     同じ (i, k) を渡せば、いつ・どの端末で呼んでも同じ 0〜1 が返る。
     i = 何番目か、k = 用途の区別（x座標なら 0、y座標なら 1、など）。

     ※ 参考にした式（`((i*73856093)^(k*19349663))%1000/1000`）は
       **k=0 のとき 0.000 / 0.093 / 0.186 … と等差の直線になる**（実測）。
       既定の k=0 でいちばん使うのに散らばらないので、ここは採らずに
       32bit のかき混ぜ（xor と乗算を交互に）に置き換えてある。     */
  function rnd(i, k) {
    var h = Math.imul((i | 0) + 0x9e3779b9, 0x85ebca6b);
    h ^= Math.imul(((k === undefined ? 0 : k) | 0) + 0xc2b2ae35, 0x27d4eb2f);
    h ^= h >>> 15; h = Math.imul(h, 0x2545f491);
    h ^= h >>> 13; h = Math.imul(h, 0x3d73373b);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }

  /* lo〜hi に散らす（rnd の範囲つき版） */
  function rndIn(i, k, lo, hi) {
    return lo + rnd(i, k) * (hi - lo);
  }

  /* 配列から決定論的に1つ選ぶ（アイコン・色・名前のダミー割り当て用） */
  function pick(list, i, k) {
    if (!list || !list.length) return undefined;
    return list[Math.floor(rnd(i, k) * list.length) % list.length];
  }

  /* 配列を決定論的に並べ替える（シャッフルしたいが毎回同じ順がいいとき） */
  function shuffle(list, k) {
    return list
      .map(function (v, i) { return [rnd(i, k), v]; })
      .sort(function (a, b) { return a[0] - b[0]; })
      .map(function (p) { return p[1]; });
  }

  /* ── 2 · 見えたら再生・押したらもう一度 ──────────────────
     画面に入ってから描く。入場アニメが「スクロールする前に終わっていた」
     を防ぐ。押すともう一度。

     肝は**再生前にタイマーを全部消すこと**。消さないと、連打したぶん
     setInterval が積み上がって、だんだん速くなる／二重に描かれる。

       TN.reveal('chart', function (el, ctx) {
         el.innerHTML = '';
         ctx.keep(setInterval(tick, 16));   // ← 自分で作ったタイマーは keep に預ける
         if (ctx.reduced) { drawInstantly(el); return; }   // 動きを減らす設定のとき
         drawWithAnimation(el);
       });

     opt: { threshold: 0.3, replay: true, once: true }
       threshold … どれだけ見えたら再生するか（0〜1）
       replay    … クリックで再生し直すか（既定 true）
       once      … 一度再生したら監視をやめるか（既定 true）             */

  var kept = new Map();   // 要素 → そこで動いているタイマーの控え

  function clearKept(el) {
    var list = kept.get(el) || [];
    for (var i = 0; i < list.length; i++) {
      clearTimeout(list[i]);
      clearInterval(list[i]);
    }
    kept.set(el, []);

    return !!(global.matchMedia &&

  }

  function reveal(target, draw, opt) {
    var el = typeof target === 'string' ? document.getElementById(target) : target;
    if (!el || typeof draw !== 'function') return null;

    var o = opt || {};
    var threshold = o.threshold === undefined ? 0.3 : o.threshold;
    var replay = o.replay === undefined ? true : o.replay;
    var once = o.once === undefined ? true : o.once;
    var fallback = o.fallback === undefined ? 1200 : o.fallback;
    var drawn = false;

    function go() {
      drawn = true;
      clearKept(el);   // ← ここで kept.get(el) は必ず空配列になる
      draw(el, {
        rnd: rnd,
        reduced: reduced(),
        keep: function (id) { kept.get(el).push(id); return id; }
      });
    }

    // 動きを減らす設定なら、監視もアニメもせずその場で1回だけ描く
    if (reduced() || !global.IntersectionObserver) {
      go();
    } else {
      var io = new IntersectionObserver(function (entries) {
        if (!entries[0].isIntersecting) return;
        go();
        if (once) io.disconnect();
      }, { threshold: threshold });
      io.observe(el);

      /* 保険。**画面に寸法が無いところでは IntersectionObserver は永久に発火しない**
         （Claude のブラウザペインは innerWidth/innerHeight とも 0・2026-09-09 実測。
          スクショ用のヘッドレス、PDF書き出し、display:none の iframe も同じ）。
         そのまま放っておくと図が白いまま焼き付く。だから寸法が無いときだけ、
         少し待ってから描く。ふつうのブラウザの「下のほうにある要素」は
         寸法があるので、ここは通らない＝スクロールするまで待つ挙動のまま。 */
      if (fallback) {

          if (!global.innerWidth || !global.innerHeight) go();

      el.style.cursor = 'pointer';
      el.addEventListener('click', go);
    }
    return go;   // 呼び出し側から手で再生したいとき用
  }

  global.TN.reveal = reveal;
  global.TN.reduced = reduced;

      <p class="subt" id="sleepSub"></p>
      <div class="chart" id="sleepChart"><div class="tip" id="tip"></div></div>
      <p class="src" id="srcLine">APPLE WATCH</p>
    </section>
    <section class="card">
      <h2 id="staleHead">止まっている</h2>
      <ul class="stale" id="stale"></ul>
    </section>
  </div>
</div>

<script>
/* ================================================================
   からだ帳 — Apple Watch のヘルスケアを1枚で見る（自分専用）
   ・データは Supabase の health_daily（anon から閉じてある）。
     読むのは合言葉つきRPC health_list だけ。書き込みはこの画面からは一切しない。
   ・合言葉は Work アプリと共通（localStorage tsumikiAppKey・PBKDF2 15万回・career.js と同じ）。
   ・ファイル名に「_テスト」を含む複製では本物に繋がず、架空データ（TN.rnd）で描く。
   ================================================================ */
var TEST = /_テスト/.test(decodeURIComponent(location.href));
var SB_URL = 'https://okbjqtdirrathscctyvx.supabase.co';
var SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9rYmpxdGRpcnJhdGhzY2N0eXZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzMjI4NTIsImV4cCI6MjA5NTg5ODg1Mn0.T-1AOK6vCD6uGdqrVGXjPui3L6WPSNrnygS-IHyfZ6Y';
var KEY_STORE = TEST ? 'tsumikiAppKey_テスト' : 'tsumikiAppKey';
var KDF_SALT = 'tsumiki-app-lock-v1', KDF_ITER = 150000;

const $ = id => document.getElementById(id);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const DAY = 864e5;
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const md = s => { const d = parse(s); return `${d.getMonth()+1}/${d.getDate()}`; };
const hm = min => { const t = Math.round(min); return `${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`; };
const avg = a => a.length ? a.reduce((s,v)=>s+v,0)/a.length : NaN;
const WD = ['日','月','火','水','木','金','土'];

/* 指標の定義。key は health_daily.metric と同じ名前 */
const M = {
  sleep:    {name:'睡眠',       icon:'moon',  unit:'',      fmt:v=>hm(v), better:'up'},
  hrv:      {name:'心拍変動',   icon:'wave',  unit:'ms',    fmt:v=>Math.round(v), better:'up'},
  rhr:      {name:'安静時心拍', icon:'heart', unit:'拍/分', fmt:v=>Math.round(v), better:'down'},
  exercise: {name:'運動',       icon:'run',   unit:'分',    fmt:v=>Math.round(v), better:'up'},
  vo2:      {name:'心肺機能',   icon:'lungs', unit:'',      fmt:v=>(+v).toFixed(1)},
  weight:   {name:'体重',       icon:'scale', unit:'kg',    fmt:v=>(+v).toFixed(1)},
  walk:     {name:'歩行速度',   icon:'walk',  unit:'km/h',  fmt:v=>(+v).toFixed(1)},
};
const STALE_DAYS = 14;

/* ---------------- 合言葉 ---------------- */
async function deriveToken(pass){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({name:'PBKDF2', salt:enc.encode(KDF_SALT), iterations:KDF_ITER, hash:'SHA-256'}, base, 256);
  return Array.from(new Uint8Array(bits)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function getTok(){ try { return localStorage.getItem(KEY_STORE); } catch(e){ return null; } }
function setTok(t){ try { t ? localStorage.setItem(KEY_STORE, t) : localStorage.removeItem(KEY_STORE); } catch(e){} }

/* ---------------- 読み込み ---------------- */
async function fetchRows(tok){
  if (TEST) return fakeRows();
  const from = iso(new Date(Date.now() - 400*DAY));
  const r = await fetch(`${SB_URL}/rest/v1/rpc/health_list`, {
    method:'POST',
    headers:{'apikey':SB_ANON,'Authorization':'Bearer '+SB_ANON,'Content-Type':'application/json'},
    body: JSON.stringify({p_token:tok, p_from:from})
  });
  if (r.status === 400 || r.status === 401 || r.status === 403) {
    const t = await r.text();
    if (/unauthorized/.test(t)) { const e = new Error('unauthorized'); e.auth = true; throw e; }
    throw new Error(t);
  }
  if (!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}

/* 複製（_テスト）だけで使う架空データ。決定論なので毎回同じ形になる */
function fakeRows(){
  const out = [], today = new Date(); today.setHours(0,0,0,0);
  for (let i = 60; i >= 0; i--) {
    const d = iso(new Date(today - i*DAY)), k = 60 - i;
    out.push({d, m:'sleep', v: i === 0 ? 230 : Math.round(TN.rndIn(k,1,320,460))});
    out.push({d, m:'hrv', v: Math.round(TN.rndIn(k,2,38,54))});
    out.push({d, m:'rhr', v: Math.round(TN.rndIn(k,3,55,62))});
    out.push({d, m:'exercise', v: Math.round(TN.rndIn(k,4,5,45))});
    out.push({d, m:'walk', v: +TN.rndIn(k,5,4.2,4.9).toFixed(1)});
  }
  out.push({d: iso(new Date(today - 69*DAY)), m:'vo2', v:45.4});
  out.push({d: iso(new Date(today - 207*DAY)), m:'weight', v:78});
  return out;
}

/* ---------------- 描画 ---------------- */
let byMetric = {}, period = 0;

function series(key){ return (byMetric[key] || []); }           // [{d, v}] 日付順
function lastOf(key){ const s = series(key); return s[s.length-1] || null; }
function daysAgo(dstr){ const t = new Date(); t.setHours(0,0,0,0); return Math.round((t - parse(dstr))/DAY); }

function render(rows){
  byMetric = {};
  rows.forEach(r => (byMetric[r.m] = byMetric[r.m] || []).push({d:r.d, v:+r.v}));
  Object.values(byMetric).forEach(a => a.sort((x,y)=>x.d<y.d?-1:1));

  if (!rows.length) {
    showEmpty('データ待ち', 'ヘルスケアの書き出しを取り込むと出ます');
    return;
  }
  $('empty').hidden = true; $('main').hidden = false;

  const t = new Date();
  $('date').textContent = `${t.getMonth()+1}月${t.getDate()}日（${WD[t.getDay()]}）`;

  renderVerdict();
  renderTiles();
  renderSleep();
  renderStale();
  $('srcLine').textContent = TEST ? 'テスト用の架空データ' : 'APPLE WATCH ／ ヘルスケア';
}

function base7(key){
  const s = series(key), last = s[s.length-1]; if (!last) return NaN;
  const end = parse(last.d), from = new Date(end - 7*DAY);
  return avg(s.filter(x => { const d = parse(x.d); return d >= from && d < end; }).map(x=>x.v));
}

function renderVerdict(){
  const el = $('verdict');
  const s = lastOf('sleep'), h = lastOf('hrv');
  let cls = 'flat', icon = 'dash', text = 'いつもどおり';
  const newest = [s, h, lastOf('rhr')].filter(Boolean).map(x=>x.d).sort().pop();
  if (!newest || daysAgo(newest) > 1) { cls='warn'; icon='reload'; text = newest ? `データが古い（${md(newest)}まで）` : 'データ待ち'; }
  else if (s && daysAgo(s.d) <= 1 && s.v < 360) { cls='warn'; icon='moon'; text='寝不足。今日は軽めに'; }
  else if (h && daysAgo(h.d) <= 1 && h.v < base7('hrv')*0.85) { cls='warn'; icon='wave'; text='回復がまだ。無理しない'; }
  else if (s && daysAgo(s.d) <= 1 && s.v >= 420) { cls='good'; icon='sun'; text='よく眠れた日'; }
  el.className = 'verdict ' + cls;
  el.innerHTML = `<svg class="i"><use href="#${icon}"/></svg>${text}`;
}

function spark(vals){
  if (vals.length < 2) return '';
  const w=120,h=36,p=4, lo=Math.min(...vals), hi=Math.max(...vals);
  const x=i=>p+i*(w-2*p)/(vals.length-1), y=v=>h-p-(v-lo)/((hi-lo)||1)*(h-2*p);
  const d=vals.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' '), L=vals.length-1;
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <path d="${d}" fill="none" stroke="var(--ink-mid)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(L)}" cy="${y(vals[L])}" r="4" fill="var(--ink)" stroke="var(--card)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}

function renderTiles(){
  $('tiles').innerHTML = ['sleep','hrv','rhr','exercise'].map(key => {
    const m = M[key], last = lastOf(key);
    if (!last) return `<div class="card tile"><div class="lab"><svg class="i"><use href="#${m.icon}"/></svg>${m.name}</div><div class="num">—</div></div>`;
    const base = base7(key), diff = last.v - base, rel = Math.abs(diff)/(base||1);
    let delta = '';
    if (key === 'exercise' && daysAgo(last.d) === 0) {
      delta = `<span class="delta flat">途中</span>`;
    } else if (isFinite(base)) {
      const good = m.better === 'up' ? diff > 0 : diff < 0;
      const cls = rel < .05 ? 'flat' : (good ? 'up' : 'down');
      delta = `<span class="delta ${cls}">${rel < .05 ? '→' : (diff > 0 ? '↑' : '↓')} 7日平均</span>`;
    }
    const ago = daysAgo(last.d), when = ago === 0 ? '' : `<div class="when">${md(last.d)}</div>`;
    return `<div class="card tile"><div class="lab"><svg class="i"><use href="#${m.icon}"/></svg>${m.name}</div>
      <div class="num">${m.fmt(last.v)}<small>${m.unit}</small></div>${when}${delta}${spark(series(key).slice(-7).map(x=>x.v))}</div>`;
  }).join('');
}

/* 期間: 0=日（直近14日）/ 1=週（直近12週の平均）/ 2=月（直近12か月の平均） */
function sleepBuckets(){
  const s = series('sleep');
  if (period === 0) {
    const map = new Map(s.map(x => [x.d, x.v])), t = new Date(); t.setHours(0,0,0,0);
    return Array.from({length:14}, (_, k) => { const d = iso(new Date(t - (13-k)*DAY));
      return {label: String(parse(d).getDate()), tip: md(d), v: map.has(d) ? map.get(d) : null}; });
  }
  const groups = new Map();
  s.forEach(x => {
    const d = parse(x.d);
    let k, label, tip;
    if (period === 1) { const mon = new Date(d - ((d.getDay()+6)%7)*DAY); k = iso(mon); label = md(k); tip = md(k)+'の週'; }
    else { k = `${d.getFullYear()}-${d.getMonth()+1}`; label = `${d.getMonth()+1}月`; tip = `${d.getFullYear()}年${d.getMonth()+1}月`; }
    if (!groups.has(k)) groups.set(k, {label, tip, vals:[]});
    groups.get(k).vals.push(x.v);
  });
  return [...groups.values()].slice(-12).map(g => ({label:g.label, tip:g.tip+'（平均）', v:avg(g.vals)}));
}

function renderSleep(){
  const B = sleepBuckets(), n = B.length, host = $('sleepChart'), tip = $('tip');
  host.querySelectorAll('svg').forEach(e=>e.remove());
  const unit = ['日','週','か月'][period];
  const has = B.filter(b => b.v != null);
  if (!has.length) { $('sleepHead').textContent = '睡眠の記録無し'; $('sleepSub').textContent = ''; return; }
  const hit = has.filter(b => b.v >= 420).length;
  $('sleepHead').textContent = period === 0 ? `7時間に届いたのは記録のある${has.length}日で${hit}日` : `平均が7時間に届いたのは${n}${unit}で${hit}`;
  $('sleepSub').textContent = `睡眠時間 ・ 直近${n}${unit}${period ? '（平均）' : ''} ・ 点線＝7時間`;

  const W=340,H=180,pl=22,pr=4,pt=12,pb=24, maxH=Math.max(9, Math.ceil(Math.max(...has.map(b=>b.v))/60));
  const bw=(W-pl-pr)/n, y=min=>pt+(1-min/60/maxH)*(H-pt-pb);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="睡眠時間の棒グラフ">`;
  [0,3,6,9].filter(v=>v<=maxH).forEach(v=>{ s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v*60)}" y2="${y(v*60)}" stroke="var(--line)"/>
    <text x="${pl-6}" y="${y(v*60)+4}" text-anchor="end" font-size="12" fill="var(--ink-soft)">${v}</text>`; });
  const every = n > 8 ? 2 : 1;
  B.forEach((b,i)=>{
    if (b.v == null) {
      if ((n-1-i) % every === 0) s+=`<text x="${pl+i*bw+bw/2}" y="${H-6}" text-anchor="middle" font-size="12" fill="var(--ink-soft)">${b.label}</text>`;
      return;
    }
    const x=pl+i*bw+bw*.2, w=bw*.6, top=y(b.v), bot=y(0), r=Math.min(4,w/2), last=i===n-1;
    const low = b.v < 360;
    s+=`<path d="M${x} ${bot}V${top+r}Q${x} ${top} ${x+r} ${top}H${x+w-r}Q${x+w} ${top} ${x+w} ${top+r}V${bot}Z" fill="${last && low ? 'var(--warn)' : 'var(--ink-mid)'}" opacity="${last ? 1 : .55}"/>`;
    if ((n-1-i) % every === 0) s+=`<text x="${pl+i*bw+bw/2}" y="${H-6}" text-anchor="middle" font-size="12" fill="var(--ink-soft)">${b.label}</text>`;
  });
  s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(420)}" y2="${y(420)}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="4 4"/>`;
  s+=`<text x="${W-pr}" y="${y(420)-6}" text-anchor="end" font-size="12" fill="var(--ink-mid)">7時間</text></svg>`;
  host.insertAdjacentHTML('afterbegin', s);
  const svg = host.querySelector('svg');
  const show = e => {
    const box = svg.getBoundingClientRect(), k = box.width/W;
    const i = Math.max(0, Math.min(n-1, Math.floor(((e.clientX-box.left)/k - pl)/bw)));
    tip.textContent = `${B[i].tip}　${B[i].v == null ? '記録なし' : hm(B[i].v)}`;
    tip.style.left = ((pl+i*bw+bw/2)*k)+'px'; tip.style.top = (y(B[i].v == null ? 0 : B[i].v)*k)+'px'; tip.classList.add('show');
  };
  svg.addEventListener('pointermove', show); svg.addEventListener('click', show);
  svg.addEventListener('pointerleave', ()=>tip.classList.remove('show'));
}

function renderStale(){
  const items = ['vo2','weight','walk','sleep','hrv','rhr','exercise']
    .map(k => ({k, last: lastOf(k)}))
    .filter(o => o.last && daysAgo(o.last.d) > STALE_DAYS);
  $('staleHead').textContent = items.length ? '止まっている' : '止まっているもの無し';
  $('stale').innerHTML = items.length
    ? items.map(o => `<li><svg class="i"><use href="#${M[o.k].icon}"/></svg>${M[o.k].name}<span class="v">${M[o.k].fmt(o.last.v)}${M[o.k].unit}</span><span class="d">${md(o.last.d)}</span></li>`).join('')
    : `<li class="none"><svg class="i"><use href="#sun"/></svg>全部${STALE_DAYS}日以内に更新</li>`;
}

/* ---------------- 起動 ---------------- */
let busy = false;
function showEmpty(head, msg){ $('main').hidden = true; $('gate').hidden = true; $('empty').hidden = false; $('emptyHead').textContent = head; $('emptyMsg').textContent = msg; }
async function load(){
  if (busy) return;
  const tok = TEST ? 'test' : getTok();
  if (!tok) { $('gate').hidden = false; $('main').hidden = true; $('empty').hidden = true; setTimeout(()=>$('pass').focus(), 50); return; }
  busy = true;
  if ($('main').hidden) showEmpty('読み込み中', '');
  $('reload').disabled = $('reload2').disabled = true;
  try {
    render(await fetchRows(tok));
  } catch (e) {
    if (e.auth) { setTok(null); $('empty').hidden = true; $('main').hidden = true; $('gate').hidden = false; $('gateMsg').textContent = '合言葉が違います'; }
    else showEmpty('読み込めませんでした', '通信を確かめて、もう一度');
  } finally {
    busy = false; $('reload').disabled = $('reload2').disabled = false;
  }
}
let deriving = false;
$('gateForm').addEventListener('submit', async e => {
  e.preventDefault();
  const p = $('pass').value; if (!p || deriving) return;
  deriving = true;
  $('gateMsg').textContent = '';
  let t;
  try { t = await deriveToken(p); } catch (err) { deriving = false; $('gateMsg').textContent = 'この端末では使えません'; return; }
  setTok(t); $('pass').value = ''; $('gate').hidden = true; deriving = false;
  load();
});
$('reload').addEventListener('click', load);
$('reload2').addEventListener('click', load);

/* ---------------- ぐにゃりタブ：design_refs/rareui.motion.demo.html から移植 ---------------- */
const springs=new Set();
class Spring{constructor(v){this.v=v;this.target=v;this.vel=0;springs.add(this)}
  set(t){this.target=t} jump(t){this.target=this.v=t;this.vel=0}
  step(dt){let l=dt;while(l>0){const h=Math.min(l,1/240);l-=h;const a=-200*(this.v-this.target)-28*this.vel;this.vel+=a*h;this.v+=this.vel*h}}}
const jobs=new Set(); let lastT=performance.now();
(function loop(now){const dt=Math.min((now-lastT)/1000,1/20);lastT=now;springs.forEach(s=>s.step(dt));jobs.forEach(f=>f());requestAnimationFrame(loop)})(lastT);
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function gooeyNav(host,items,{span=20,corner=12,onChange}={}){
  const ul=document.createElement('ul');host.appendChild(ul);let active=0;
  const segs=items.map((label,i)=>{
    const li=document.createElement('li'),btn=document.createElement('button');
    btn.type='button';btn.textContent=label;btn.onclick=()=>select(i);
    let path=null,stops=null;
    if(i>0){const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
      svg.setAttribute('class','neck');svg.setAttribute('width',span);svg.setAttribute('viewBox',`0 0 ${span} 100`);
      svg.setAttribute('preserveAspectRatio','none');svg.setAttribute('aria-hidden','true');
      const gid='nk'+i;svg.innerHTML=`<defs><linearGradient id="${gid}" x1="0" x2="1"><stop offset="0"/><stop offset="1"/></linearGradient></defs><path fill="url(#${gid})"/>`;
      path=svg.querySelector('path');stops=svg.querySelectorAll('stop');li.appendChild(svg);}
    li.appendChild(btn);ul.appendChild(li);
    return{li,path,stops,gap:new Spring(i===0?0:-1)};
  });
  const neck=g=>{if(!(g>0))return'';const w=100*(1-g/(span*.22));if(w<=0)return'';const s=span-g,m=s+g/2;return`M${s} 0 Q${m} ${100-w} ${span} 0 L${span} 100 Q${m} ${w} ${s} 100 Z`};
  const open=k=>k===0||k===items.length||k-1===active||k===active;
  function select(i){active=i;segs.forEach((s,k)=>{
    s.li.classList.toggle('on',k===active);const t=k===0?0:(open(k)?span:-1);reduced?s.gap.jump(t):s.gap.set(t);
    s.li.style.borderTopLeftRadius=s.li.style.borderBottomLeftRadius=(open(k)?corner:0)+'px';
    s.li.style.borderTopRightRadius=s.li.style.borderBottomRightRadius=(open(k+1)?corner:0)+'px';
    if(s.stops){s.stops[0].setAttribute('stop-color',k-1===active?css('--accent-2'):css('--surface-2'));
      s.stops[1].setAttribute('stop-color',k===active?css('--accent-2'):css('--surface-2'));}
  }); onChange&&onChange(i);}
  jobs.add(()=>segs.forEach(s=>{s.li.style.marginLeft=s.gap.v+'px';if(s.path)s.path.setAttribute('d',neck(s.gap.v))}));
  select(0);
}
gooeyNav($('gnav'),['日','週','月'],{onChange:i=>{period=i; if(Object.keys(byMetric).length) renderSleep();}});

load();
</script>
<!-- tsumiki-back-button -->
<style>
  #tsumikiEdge{position:fixed; top:0; bottom:0; left:0; width:22px; z-index:999;}
  #tsumikiPeek{
    position:fixed; top:50%; left:0; z-index:1001; margin-top:-23px;
    width:46px; height:46px; display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.92);
    -webkit-backdrop-filter:saturate(180%) blur(14px); backdrop-filter:saturate(180%) blur(14px);
    border:1px solid rgba(0,0,0,.06); border-radius:50%;
    box-shadow:0 6px 20px rgba(0,0,0,.18);
    color:#0071e3; font-size:24px; font-weight:600; line-height:1;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Helvetica Neue",Arial,sans-serif;
    transform:translateX(-70px) scale(.8); opacity:0; pointer-events:none;
  }
</style>
<div id="tsumikiEdge"></div>
<div id="tsumikiPeek">‹</div>
<script>
  (function(){
    var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
      || window.navigator.standalone === true;
    var fromTsumiki = false;
    try{
      if(document.referrer){
        var r = new URL(document.referrer);
        fromTsumiki = (r.origin === location.origin);
      }
    }catch(e){}
    if(!(standalone && fromTsumiki)) return;

    var peek = document.getElementById('tsumikiPeek');
    var edge = document.getElementById('tsumikiEdge');

    function goBack(){ location.href = 'index.html'; }

    /* --- 左端エッジスワイプで戻る（iOS純正の戻る操作。見えるボタンは置かない） --- */
    var sx=0, sy=0, prog=0, dragging=false, W=window.innerWidth;
    var TRIGGER = Math.min(120, W*0.32);
    window.addEventListener('resize', function(){ W=window.innerWidth; TRIGGER=Math.min(120, W*0.32); });

    function reset(){
      dragging = false; prog = 0;
      peek.style.transition = 'transform .25s ease, opacity .25s ease';
      peek.style.transform = 'translateX(-70px) scale(.8)';
      peek.style.opacity = 0;
    }
    function start(e){
      var t = e.touches ? e.touches[0] : e;
      if(t.clientX > 26) return;
      sx = t.clientX; sy = t.clientY; prog = 0; dragging = true;
      peek.style.transition = 'none';
    }
    function move(e){
      if(!dragging) return;
      var t = e.touches ? e.touches[0] : e;
      var dx = t.clientX - sx, dy = t.clientY - sy;
      if(Math.abs(dy) > Math.abs(dx) + 12){ reset(); return; }
      if(dx < 0) dx = 0;
      prog = Math.min(dx / TRIGGER, 1);
      peek.style.transform = 'translateX(' + (-70 + prog*82) + 'px) scale(' + (0.8 + prog*0.2) + ')';
      peek.style.opacity = prog;
      if(dx > 6 && e.cancelable) e.preventDefault();
    }
    function end(){
      if(!dragging) return;
      dragging = false;
      if(prog >= 0.999){
        peek.style.transition = 'transform .25s ease, opacity .25s ease';
        peek.style.transform = 'translateX(20px) scale(1.05)';
        peek.style.opacity = 1;
        goBack();
      }else{
        reset();
      }
    }
    edge.addEventListener('touchstart', start, {passive:true});
    window.addEventListener('touchmove', move, {passive:false});
    window.addEventListener('touchend', end, {passive:true});
    window.addEventListener('touchcancel', end, {passive:true});
  })();
</script>
<!-- /tsumiki-back-button -->
</body>
</html>
