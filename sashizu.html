<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="apple-touch-icon" href="icons/icon-sashizu.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ことづて">
<meta name="theme-color" content="#F4F2EE">
<title>ことづて — Claude Codeへの指示メモ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* いつつ warm-mono（紙×墨）。やることばこ と同じ配色。 */
    --bg: #F4F2EE;
    --card: #FBFAF8;
    --text: #242321;
    --sub: #77736B;
    --line: #D8D4CC;
    --ghost: #BEB9B0;
    --surface: #ECE9E3;
    --chip: #ECE9E3;
    --green: #5f8f6a;
    --red: #b06a52;
    --orange: #b08a3e;
    --gray: #BEB9B0;
    --radius: 18px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    font-family: 'Zen Maru Gothic', -apple-system, BlinkMacSystemFont, "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    padding-bottom: calc(60px + env(safe-area-inset-bottom));
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; }

  /* ===== ヘッダー ===== */
  header { padding: 26px 4px 6px; text-align: center; }
  h1 { font-size: 22px; font-weight: 700; letter-spacing: .04em; margin: 12px 0 2px; }
  .tagline { color: var(--sub); font-size: 13px; }
  .sync {
    display: inline-flex; align-items: center; gap: 5px; margin-top: 7px;
    font-size: 11.5px; font-weight: 600; color: var(--sub);
    background: var(--card); border: 1px solid var(--line); border-radius: 999px;
    padding: 3px 11px; cursor: default;
  }
  .sync .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gray); }
  .sync.ok .dot { background: var(--green); }
  .sync.off .dot { background: var(--orange); }

  /* ===== 追加フォーム ===== */
  .add-card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px; margin: 14px 0 6px;
  }
  .add-card input, .add-card textarea {
    width: 100%; border: none; background: transparent; font: inherit; color: var(--text);
    font-size: 16px; padding: 6px 2px; outline: none;
  }
  .add-card input { font-weight: 700; }
  .add-card input::placeholder, .add-card textarea::placeholder { color: var(--ghost); font-weight: 400; }
  .add-card textarea {
    resize: none; min-height: 42px; max-height: 40vh; overflow-y: auto;
    border-top: 1px dashed var(--line); margin-top: 4px; font-size: 16px; line-height: 1.6;
  }
  .add-foot { display: flex; justify-content: flex-end; margin-top: 8px; }
  .add-btn {
    border: none; cursor: pointer; font: inherit; font-weight: 700; font-size: 14px;
    background: var(--text); color: var(--card); border-radius: 999px; padding: 9px 20px;
    display: inline-flex; align-items: center; gap: 6px;
    transition: opacity .15s;
  }
  .add-btn:disabled { opacity: .35; cursor: default; }

  /* ===== フィルターチップ ===== */
  .chips {
    display: flex; gap: 6px; overflow-x: auto; padding: 10px 0 12px;
    -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; border: 1px solid var(--line); background: var(--card); color: var(--sub);
    font: inherit; font-size: 12.5px; font-weight: 600; border-radius: 999px;
    padding: 6px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
  }
  .chip .n { font-size: 11px; opacity: .75; }
  .chip.on { background: var(--text); color: var(--card); border-color: var(--text); }

  /* ===== カード ===== */
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 13px 14px; margin-bottom: 10px;
  }
  .c-top { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
  .pill {
    border: none; cursor: pointer; font: inherit; font-size: 12px; font-weight: 700;
    border-radius: 999px; padding: 5px 12px;
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--chip); color: var(--text);
  }
  .pill.st-idea   { background: var(--surface); color: var(--sub); }
  .pill.st-asked  { background: var(--text); color: var(--card); }
  .pill.st-review { background: rgba(176,138,62,.14); color: var(--orange); }
  .pill.st-fix    { background: rgba(176,106,82,.13); color: var(--red); }
  .pill.st-done   { background: rgba(95,143,106,.14); color: var(--green); }
  .c-actions { margin-left: auto; display: flex; gap: 2px; }
  .icon-btn {
    border: none; background: none; cursor: pointer; color: var(--sub);
    width: 36px; height: 36px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
  }
  .icon-btn:active { background: var(--surface); }
  .c-title { font-size: 15.5px; font-weight: 700; word-break: break-word; cursor: pointer; }
  .c-body {
    font-size: 13.5px; color: var(--sub); white-space: pre-wrap; word-break: break-word;
    margin-top: 4px; cursor: pointer;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .c-body.open { display: block; -webkit-line-clamp: unset; overflow: visible; }
  .c-more { font-size: 11px; color: var(--ghost); margin-top: 3px; }
  .card.is-done .c-title { color: var(--ghost); }
  .card.is-done .c-body { color: var(--ghost); }

  /* メモ件数バッジ（一覧カード） */
  .c-meta {
    display: flex; align-items: center; gap: 8px; margin-top: 7px;
    font-size: 12px; color: var(--sub); cursor: pointer;
  }
  .c-meta .mnum {
    background: var(--surface); border-radius: 999px; padding: 3px 10px; font-weight: 600;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .c-meta .mdone { color: var(--green); font-weight: 600; }
  .c-meta .mnone { color: var(--ghost); }
  .c-meta .mchev { margin-left: auto; color: var(--ghost); display: flex; transition: transform .18s; }
  .c-meta.open .mchev { transform: rotate(90deg); }
  .card.is-done .c-meta .mnum { background: transparent; color: var(--ghost); }

  /* ===== カード内に開くメモ（アコーディオン） ===== */
  .n-list {
    margin: 10px -4px 0; padding: 11px 0 2px 11px;
    border-top: 1px dashed var(--line); border-left: 2px solid var(--line);
    margin-left: 3px;
  }
  .note {
    background: var(--surface); border-radius: 13px; padding: 10px 11px; margin-bottom: 8px;
  }
  .note .n-top { display: flex; align-items: center; gap: 7px; margin-bottom: 5px; }
  .note .n-idx { font-size: 11px; color: var(--ghost); font-weight: 600; }
  .note .n-act { margin-left: auto; display: flex; gap: 2px; }
  .note .icon-btn:active { background: var(--card); }
  .note .pill { font-size: 11.5px; padding: 4px 10px; }
  .note .n-head { font-size: 14px; font-weight: 700; word-break: break-word; margin-bottom: 2px; }
  .note .n-body {
    font-size: 13.5px; color: var(--text); white-space: pre-wrap; word-break: break-word; line-height: 1.65;
  }
  .note .n-empty { font-size: 12.5px; color: var(--ghost); }
  .note.is-done .n-head, .note.is-done .n-body { color: var(--ghost); }
  .add-note {
    width: 100%; border: 1px dashed var(--line); background: transparent; cursor: pointer;
    font: inherit; font-size: 13.5px; font-weight: 700; color: var(--sub);
    border-radius: 13px; padding: 12px; margin-bottom: 8px;
  }
  .add-note:active { background: var(--surface); }

  .empty {
    text-align: center; color: var(--sub); font-size: 14px;
    padding: 44px 20px; line-height: 1.8;
  }
  .empty .e-ico { font-size: 40px; display: block; margin-bottom: 10px; opacity: .8; filter: grayscale(1); }

  /* ===== 完了済みセクション ===== */
  .done-toggle {
    width: 100%; border: none; background: none; cursor: pointer; font: inherit;
    font-size: 12.5px; font-weight: 600; color: var(--sub);
    display: flex; align-items: center; gap: 6px; padding: 14px 4px 8px;
  }
  .done-toggle svg { transition: transform .15s; }
  .done-toggle.open svg { transform: rotate(90deg); }

  /* ===== ボトムシート ===== */
  .overlay {
    position: fixed; inset: 0; background: rgba(36,35,33,.32); z-index: 1100;
    display: none; align-items: flex-end; justify-content: center;
  }
  .overlay.show { display: flex; }
  .sheet {
    background: var(--bg); border-radius: 22px 22px 0 0; width: 100%; max-width: 640px;
    padding: 18px 18px calc(20px + env(safe-area-inset-bottom));
    max-height: 86vh; overflow-y: auto;
  }
  .sheet h2 { font-size: 15px; font-weight: 700; margin: 0 0 12px; text-align: center; }
  .st-opt {
    width: 100%; border: 1px solid var(--line); background: var(--card); cursor: pointer;
    font: inherit; font-size: 15px; font-weight: 600; color: var(--text);
    border-radius: 14px; padding: 13px 16px; margin-bottom: 8px;
    display: flex; align-items: center; gap: 10px; text-align: left;
  }
  .st-opt .st-desc { margin-left: auto; font-size: 11px; color: var(--ghost); font-weight: 400; }
  .st-opt.cur { border-color: var(--text); box-shadow: 0 0 0 1px var(--text) inset; }
  .sheet-cancel {
    width: 100%; border: none; background: none; cursor: pointer; font: inherit;
    font-size: 14px; font-weight: 600; color: var(--sub); padding: 12px; margin-top: 2px;
  }

  /* 編集シート */
  .e-field { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; margin-bottom: 10px; }
  .e-field label { display: block; font-size: 11px; font-weight: 600; color: var(--sub); margin-bottom: 2px; }
  .e-field input, .e-field textarea {
    width: 100%; border: none; background: transparent; font: inherit; color: var(--text);
    font-size: 16px; padding: 2px 0; outline: none;
  }
  .e-field input { font-weight: 700; }
  .e-field textarea { resize: none; min-height: 90px; max-height: 40vh; overflow-y: auto; line-height: 1.6; }
  .sheet-btns { display: flex; gap: 8px; margin-top: 4px; }
  .sheet-btns .del {
    border: 1px solid var(--line); background: var(--card); color: var(--red);
    font: inherit; font-size: 14px; font-weight: 700; border-radius: 999px; padding: 11px 18px; cursor: pointer;
  }
  .sheet-btns .save {
    flex: 1; border: none; background: var(--text); color: var(--card);
    font: inherit; font-size: 14px; font-weight: 700; border-radius: 999px; padding: 11px; cursor: pointer;
  }

  /* ===== トースト ===== */
  #toast {
    position: fixed; left: 50%; bottom: calc(26px + env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(16px);
    background: var(--text); color: var(--card); font-size: 13px; font-weight: 600;
    padding: 10px 18px; border-radius: 999px; opacity: 0; pointer-events: none;
    transition: all .25s; z-index: 1200; white-space: nowrap;
    display: flex; align-items: center; gap: 10px;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
  #toast .undo {
    border: none; background: rgba(251,250,248,.16); color: var(--card);
    font: inherit; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 4px 12px; cursor: pointer;
  }

  footer { text-align: center; color: var(--ghost); font-size: 11px; padding: 26px 0 8px; }

  /* ===== 復旧シート（保険から拾い戻す） ===== */
  .rescue-btn {
    border: none; background: none; cursor: pointer; font: inherit;
    font-size: 12px; font-weight: 600; color: var(--sub); padding: 8px 14px; margin-bottom: 4px;
  }
  .rc-lead, .rc-none { font-size: 12.5px; color: var(--sub); line-height: 1.75; margin-bottom: 12px; text-align: center; }
  .rc-lead .rc-note, .rc-none .rc-note { display: block; color: var(--ghost); font-size: 11.5px; margin-top: 4px; }
  .rc-row {
    display: flex; align-items: flex-start; gap: 10px;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px; margin-bottom: 8px; cursor: pointer;
  }
  .rc-row input { width: 20px; height: 20px; margin: 1px 0 0; flex: none; accent-color: var(--text); }
  .rc-txt { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .rc-kind { font-size: 10.5px; font-weight: 700; color: var(--ghost); }
  .rc-title { font-size: 14.5px; font-weight: 700; word-break: break-word; }
  .rc-sub { font-size: 12.5px; color: var(--sub); word-break: break-word; }
  .rc-at { font-size: 11px; color: var(--ghost); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📮 ことづて</h1>
    <div class="tagline">Claude Code への指示メモ</div>
    <div class="sync" id="syncChip"><span class="dot"></span><span id="syncText">接続中…</span></div>
  </header>

  <div class="add-card">
    <input id="addTitle" type="text" placeholder="タイトル（何をしてほしいか）" autocomplete="off">
    <textarea id="addBody" placeholder="最初のメモ（Claudeに渡す指示文）" rows="2"></textarea>
    <div class="add-foot">
      <button class="add-btn" id="addBtn" disabled>＋ 追加</button>
    </div>
  </div>

  <div class="chips" id="chips"></div>

  <main id="list"></main>

  <div id="doneWrap"></div>

  <footer>
    <button class="rescue-btn" id="rescueBtn">🛟 消えたメモを探す</button>
    <div>tsumiki-apps.github.io</div>
  </footer>
</div>

<!-- ステータス選択シート -->
<div class="overlay" id="stOverlay">
  <div class="sheet">
    <h2 id="stTitle">ステータスを変更</h2>
    <div id="stOpts"></div>
    <button class="sheet-cancel" id="stCancel">キャンセル</button>
  </div>
</div>

<!-- 編集シート（ことづて＝タイトル） -->
<div class="overlay" id="edOverlay">
  <div class="sheet">
    <h2>ことづてを編集</h2>
    <div class="e-field">
      <label>タイトル</label>
      <input id="edTitle" type="text" autocomplete="off">
    </div>
    <div class="sheet-btns">
      <button class="del" id="edDelete">削除</button>
      <button class="save" id="edSave">保存</button>
    </div>
    <button class="sheet-cancel" id="edCancel">キャンセル</button>
  </div>
</div>

<!-- メモ編集シート -->
<div class="overlay" id="ntOverlay">
  <div class="sheet">
    <h2 id="ntHead">メモを追加</h2>
    <div class="e-field">
      <label>小見出し（任意）</label>
      <input id="ntTitle" type="text" autocomplete="off" placeholder="例：2個目の指示">
    </div>
    <div class="e-field">
      <label>メモ（Claudeに渡す指示文）</label>
      <textarea id="ntBody"></textarea>
    </div>
    <div class="sheet-btns">
      <button class="del" id="ntDelete">削除</button>
      <button class="save" id="ntSave">保存</button>
    </div>
    <button class="sheet-cancel" id="ntCancel">キャンセル</button>
  </div>
</div>

<!-- 復旧シート（この端末に残っている保険から拾い戻す） -->
<div class="overlay" id="rcOverlay">
  <div class="sheet">
    <h2>🛟 消えたメモを探す</h2>
    <div id="rcBody"></div>
    <div class="sheet-btns"><button class="save" id="rcRestore">選んだものを戻す</button></div>
    <button class="sheet-cancel" id="rcCancel">閉じる</button>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ===================== Supabase（やることばこ等と同じプロジェクト） ===================== */
const SUPABASE_URL  = 'https://okbjqtdirrathscctyvx.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9rYmpxdGRpcnJhdGhzY2N0eXZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzMjI4NTIsImV4cCI6MjA5NTg5ODg1Mn0.T-1AOK6vCD6uGdqrVGXjPui3L6WPSNrnygS-IHyfZ6Y';
const sb = (window.supabase && window.supabase.createClient) ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON) : null;
const STATE_TABLE = 'sashizu_state';
const STATE_ID = 'kodai';        // 個人の複数端末で共有する1行
const KEY = 'sashizu_db_v1';
const SYNCED_KEY = 'sashizu_synced_v1';   // 最後にクラウドと一致した時刻
const BAK_KEY = 'sashizu_bak_v1';         // 取りこぼし保険：直近の状態スナップショット
const DEV_KEY = 'sashizu_dev_v1';         // 端末ID（自分の書き込みのエコー判定用）

/* ===================== ステータス定義 ===================== */
const STATUSES = [
  { key:'idea',   emoji:'💡', label:'アイデア', desc:'思いついた段階' },
  { key:'asked',  emoji:'🚀', label:'依頼中',   desc:'Claudeに指示を出した' },
  { key:'review', emoji:'👀', label:'確認待ち', desc:'自分のチェック待ち' },
  { key:'fix',    emoji:'🔧', label:'修正中',   desc:'直しを依頼している' },
  { key:'done',   emoji:'✅', label:'完了',     desc:'実装済み' },
];
const ST = Object.fromEntries(STATUSES.map(s=>[s.key,s]));

/* ===================== ユーティリティ ===================== */
function uid(){ return Date.now().toString(36) + Math.floor(Math.random()*1e6).toString(36); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function autoGrow(el){ el.style.height='auto'; el.style.height=(el.scrollHeight+2)+'px'; }
function toast(msg){
  const t=document.getElementById('toast');
  t.innerHTML=''; t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1700);
}
function undoToast(msg, undoFn){
  const t=document.getElementById('toast');
  t.innerHTML='';
  const span=document.createElement('span'); span.textContent=msg; t.appendChild(span);
  const btn=document.createElement('button'); btn.className='undo'; btn.textContent='取り消す'; t.appendChild(btn);
  t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>{ t.classList.remove('show'); },4200);
  btn.onclick=()=>{ clearTimeout(t._t); t.classList.remove('show'); undoFn(); };
}
async function copyText(text){
  const s = String(text==null?'':text);
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){ await navigator.clipboard.writeText(s); return true; }
  }catch(e){}
  try{
    const ta = document.createElement('textarea');
    ta.value = s; ta.setAttribute('readonly','');
    ta.style.position='fixed'; ta.style.top='0'; ta.style.left='0'; ta.style.opacity='0';
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, s.length);
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  }catch(e){ return false; }
}
const ICON = {
  copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>',
  edit:'<path d="M5 19h3l9.5-9.5a1.8 1.8 0 0 0-2.5-2.5L5 16.5V19z"/>',
  chev:'<path d="M9 6l6 6-6 6"/>',
  note:'<path d="M6 4h9l4 4v12H6z"/><path d="M15 4v4h4"/><path d="M9 12h7M9 16h5"/>',
};
function svg(name, size){ return '<svg viewBox="0 0 24 24" style="width:'+(size||20)+'px;height:'+(size||20)+'px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round">'+ICON[name]+'</svg>'; }

/* ===================== 状態 ===================== */
function blank(){ return { items:[] }; }
let db = blank();
let online = null;
let pendingSave = false;     // ローカルに「まだクラウドへ届いていない変更」がある
let syncedAt = 0;            // これより後に触ったものは「クラウドがまだ知らない」とみなす
const DEV_ID = (function(){
  try{
    let v = localStorage.getItem(DEV_KEY);
    if(!v){ v = uid(); localStorage.setItem(DEV_KEY, v); }
    return v;
  }catch(e){ return uid(); }
})();
let filter = 'all';          // 'all' | status key（doneは下の畳みセクション固定）
let doneOpen = false;
let sheetItemId = null;      // ステータス/編集シートの対象ことづて
let sheetNoteId = null;      // ステータス/編集シートの対象メモ（null＝ことづて自体）
let sheetOpen = false;       // シート表示中はリアルタイム上書き描画を遅延
let pendingRender = false;
let openIds = new Set();     // カードを開いてメモを表示中のことづて

/* ===================== 永続化・同期 ===================== */
function blankNote(body, head){
  const now = Date.now();
  return { id:uid(), head:head||'', body:body||'', status:'idea', ts:now, updated:now };
}
/* ステータスは「ことづて（タイトル）」だけが持つ。メモは本文だけを持ち、ステータスは触らない。 */
function recalc(x){
  const notes = x.notes || [];
  /* 旧バージョンのページで開いた時に中身が消えて見えないための保険（表示には使わない） */
  x.body = notes.map(n=> (n.head ? '【'+n.head+'】\n' : '') + n.body).join('\n\n');
}
function migrate(state){
  const st = state || db;
  if(!Array.isArray(st.items)) st.items = [];
  st.items.forEach(x=>{
    if(!x.id) x.id = uid();
    if(!ST[x.status]) x.status = 'idea';
    if(!x.ts) x.ts = Date.now();
    if(!x.updated) x.updated = x.ts;
    if(!Array.isArray(x.notes)){
      /* 旧データ：詳細1本 → メモ1件目に移す */
      x.notes = [];
      if(x.body && x.body.trim()){
        const n = blankNote(x.body.trim());
        n.status = x.status; n.ts = x.ts; n.updated = x.updated;
        if(x.status==='done') n.doneAt = x.doneAt || x.updated;
        x.notes.push(n);
      }
    }
    x.notes.forEach(n=>{
      if(!n.id) n.id = uid();
      if(!ST[n.status]) n.status = 'idea';
      if(typeof n.head !== 'string') n.head = '';
      if(typeof n.body !== 'string') n.body = '';
      if(!n.ts) n.ts = Date.now();
      if(!n.updated) n.updated = n.ts;
    });
    recalc(x);
  });
}
function findItem(id){ return db.items.find(i=>i.id===id) || null; }
function findNote(x, id){ return (x && x.notes || []).find(n=>n.id===id) || null; }
/* コピー文：ことづてのタイトル＋そのメモ */
function noteText(x, n){
  let s = x.title;
  if(n.head) s += '\n\n【' + n.head + '】';
  if(n.body) s += (n.head ? '\n' : '\n\n') + n.body;
  return s;
}
function loadLocal(){
  try{ const s=localStorage.getItem(KEY); if(s) db=Object.assign(blank(), JSON.parse(s)); }catch(e){}
  try{ syncedAt = parseInt(localStorage.getItem(SYNCED_KEY)||'0', 10) || 0; }catch(e){ syncedAt = 0; }
}
function markSynced(t){
  syncedAt = t || Date.now();
  try{ localStorage.setItem(SYNCED_KEY, String(syncedAt)); }catch(e){}
}
/* 取りこぼし保険：クラウドの状態を当てる直前のローカルを数世代残す。
   何かが消えた時に、ここから中身を拾い出して戻せる。 */
function snapshot(reason){
  let arr = [];
  try{ arr = JSON.parse(localStorage.getItem(BAK_KEY) || '[]'); }catch(e){ arr = []; }
  if(!Array.isArray(arr)) arr = [];
  arr.push({ at:Date.now(), reason:reason||'', state:deepCopy(db) });
  while(arr.length > 20) arr.shift();
  /* 容量オーバーで丸ごと保存できない時は、古い世代を捨てて入るところまで残す
     （ここで諦めると「保険が1件も無い」状態になってしまう） */
  while(arr.length){
    try{ localStorage.setItem(BAK_KEY, JSON.stringify(arr)); return; }
    catch(e){ arr.shift(); }
  }
}

let saveTimer=null;
function save(){
  db.rev = Date.now();          // どちらが新しいかの判定に使う
  db.by  = DEV_ID;              // 自分の書き込みのエコー判定に使う
  pendingSave = true;
  localStorage.setItem(KEY, JSON.stringify(db));
  if(!sb) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(push, 350);
}
/* クラウドへ送る。送信中に増えた変更は pendingSave を落とさない（落とすと次の取り込みで消える）。 */
async function push(){
  if(!sb) return;
  clearTimeout(saveTimer);
  const sending = db.rev || 0;
  const { error } = await sb.from(STATE_TABLE)
    .upsert({ id:STATE_ID, state: db, updated_at:new Date().toISOString() });
  if(error){ online=false; }
  else{
    online = true;
    if((db.rev||0) === sending){ pendingSave = false; markSynced(); }
  }
  renderSync();
}
/* 中身を丸ごと複製する。Object.assign は中の配列・オブジェクトを「共有」してしまうので、
   これを使わないと土台にしたリモートまで一緒に書き換わる（＝比較が壊れて未送信分が消える）。 */
function deepCopy(v){ try{ return JSON.parse(JSON.stringify(v)); }catch(e){ return v; } }
/* リモートを土台に、ローカルにしか無い「最後の同期より後の変更」を差し戻す。
   ＝ 打ったばかりのメモが、届く前の古いリモートで塗り潰されるのを防ぐ。
   ★ remote は呼び出し元で「比較の基準」として使うので、絶対に触らない（複製してから組み立てる）。 */
function mergeRemote(remote){
  const out = Object.assign(blank(), deepCopy(remote));
  if(!Array.isArray(out.items)) out.items = [];
  const byId = new Map(out.items.map(x=>[x.id, x]));
  (db.items||[]).forEach(lx=>{
    const rx = byId.get(lx.id);
    if(!rx){
      /* リモートに無い：同期後に作った物だけ戻す（前から在って消えた物＝他端末での削除は尊重） */
      if((lx.updated||lx.ts||0) > syncedAt) out.items.push(deepCopy(lx));
      return;
    }
    if((lx.updated||0) > (rx.updated||0)){
      rx.title = lx.title; rx.status = lx.status; rx.updated = lx.updated;
      if(lx.doneAt) rx.doneAt = lx.doneAt; else delete rx.doneAt;
    }
    if(!Array.isArray(rx.notes)) rx.notes = [];
    const nById = new Map(rx.notes.map(n=>[n.id, n]));
    (lx.notes||[]).forEach(ln=>{
      const rn = nById.get(ln.id);
      if(!rn){
        if((ln.updated||ln.ts||0) > syncedAt) rx.notes.push(deepCopy(ln));
        return;
      }
      if((ln.updated||0) > (rn.updated||0)){ rn.head = ln.head; rn.body = ln.body; rn.updated = ln.updated; }
    });
    rx.notes.sort((a,b)=>(a.ts||0)-(b.ts||0));   // 作った順に整える
  });
  return out;
}
/* 中身だけを比べるための正規化文字列。
   保存先が jsonb（＝Postgres がキーの順番を並べ替える型）なので、
   素の JSON.stringify では同じ中身でも別物に見えてしまう。 */
function canon(v){
  if(Array.isArray(v)) return '['+v.map(canon).join(',')+']';
  if(v && typeof v==='object'){
    return '{'+Object.keys(v).filter(k=>k!=='rev'&&k!=='by').sort()
      .map(k=>JSON.stringify(k)+':'+canon(v[k])).join(',')+'}';
  }
  return JSON.stringify(v);
}
/* 受け取ったリモートを画面へ反映する（取り込み口はここ1つに統一） */
function applyRemote(remote){
  const remSig = canon(remote);     // ★ マージより先に採る（後で採ると、万一触られていた時に気づけない）
  const merged = mergeRemote(remote);
  migrate(merged);                  // 旧形式の変換は比較の前に済ませる（比較がずれないように）
  const mySig = canon(db), mergedSig = canon(merged);
  if(mergedSig !== mySig){          // 画面の中身が変わる時だけ差し替える
    snapshot(mergedSig === remSig ? 'remote' : 'merge');
    db = merged;
    localStorage.setItem(KEY, JSON.stringify(db));
    if(sheetOpen){ pendingRender = true; } else { render(); }
  }
  if(mergedSig !== remSig){ save(); }              // クラウドが古い → こちらの分を返す
  else { pendingSave = false; markSynced(); }
}
async function loadRemote(){
  if(!sb){ online=false; renderSync(); return; }
  const { data, error } = await sb.from(STATE_TABLE).select('state').eq('id', STATE_ID).maybeSingle();
  if(error){ online=false; renderSync(); return; }
  online = true;
  if(data && data.state && typeof data.state==='object' && Array.isArray(data.state.items)){
    applyRemote(data.state);
  } else {
    // リモートにまだ行が無い → 今あるローカルを種として上げる
    if(db.items.length) save();
  }
  renderSync();
}
function subscribeRealtime(){
  if(!sb) return;
  sb.channel('sashizu-rt')
    .on('postgres_changes', { event:'*', schema:'public', table:STATE_TABLE, filter:'id=eq.'+STATE_ID },
      (payload)=>{
        const st = payload.new && payload.new.state;
        if(!st || !Array.isArray(st.items)) return;
        /* 自分が今さっき送った物のエコーは無視（jsonbはキー順が変わるので文字列比較では判定できない） */
        if(st.by === DEV_ID && (st.rev||0) <= (db.rev||0)) return;
        applyRemote(st);
      })
    .subscribe();
}
function renderSync(){
  const chip = document.getElementById('syncChip');
  const txt = document.getElementById('syncText');
  chip.classList.remove('ok','off');
  if(!sb){ txt.textContent='この端末に保存'; return; }
  if(online===true){ chip.classList.add('ok'); txt.textContent='クラウド同期中'; }
  else if(online===false){ chip.classList.add('off'); txt.textContent='オフライン（この端末に保存）'; }
  else { txt.textContent='接続中…'; }
}

/* ===================== 描画 ===================== */
function activeItems(){ return db.items.filter(x=>x.status!=='done'); }
function doneItems(){ return db.items.filter(x=>x.status==='done'); }

function render(){
  renderChips();
  renderList();
  renderDone();
}
function renderChips(){
  const el = document.getElementById('chips');
  const act = activeItems();
  let html = '<button class="chip'+(filter==='all'?' on':'')+'" data-filter="all">すべて <span class="n">'+act.length+'</span></button>';
  STATUSES.filter(s=>s.key!=='done').forEach(s=>{
    const n = act.filter(x=>x.status===s.key).length;
    html += '<button class="chip'+(filter===s.key?' on':'')+'" data-filter="'+s.key+'">'+s.emoji+' '+s.label+' <span class="n">'+n+'</span></button>';
  });
  el.innerHTML = html;
  el.querySelectorAll('.chip').forEach(b=>{
    b.onclick = ()=>{ filter = b.dataset.filter; render(); };
  });
}
function cardHTML(x){
  const s = ST[x.status];
  const isDone = x.status==='done';
  const notes = x.notes || [];
  let html = '<div class="card'+(isDone?' is-done':'')+'" data-id="'+x.id+'">';
  html += '<div class="c-top">';
  html += '<button class="pill st-'+x.status+'" data-st="'+x.id+'">'+s.emoji+' '+s.label+'</button>';
  html += '<div class="c-actions">';
  html += '<button class="icon-btn" data-edit="'+x.id+'" title="タイトルを編集">'+svg('edit')+'</button>';
  html += '</div></div>';
  const open = openIds.has(x.id);
  html += '<div class="c-title" data-open="'+x.id+'">'+esc(x.title)+'</div>';
  html += '<div class="c-meta'+(open?' open':'')+'" data-open="'+x.id+'">';
  if(notes.length){
    html += '<span class="mnum">'+svg('note',13)+' メモ '+notes.length+'</span>';
  }else{
    html += '<span class="mnone">メモなし・タップで追加</span>';
  }
  html += '<span class="mchev">'+svg('chev',16)+'</span>';
  html += '</div>';
  if(open){
    html += '<div class="n-list">';
    html += '<button class="add-note" data-addnote="'+x.id+'">＋ メモを追加</button>';
    /* 最新のメモを一番上に表示。番号バッジは作った順（下=1、上=最新）を維持するため、
       元の配列インデックス i はそのまま渡して並びだけ逆にする。 */
    html += notes.map((n,i)=>[n,i]).reverse().map(pair=>noteHTML(x,pair[0],pair[1])).join('');
    html += '</div>';
  }
  html += '</div>';
  return html;
}
function renderList(){
  const el = document.getElementById('list');
  let items = activeItems();
  if(filter!=='all') items = items.filter(x=>x.status===filter);
  items = items.slice().sort((a,b)=>(b.ts||0)-(a.ts||0));
  if(!items.length){
    el.innerHTML = '<div class="empty"><span class="e-ico">📮</span>'+
      (filter==='all' ? '上の入力欄から<br>Claudeへの指示メモを足していこう' : 'この段階のことづては<br>いまはありません')+'</div>';
    return;
  }
  el.innerHTML = items.map(cardHTML).join('');
  bindCardEvents(el);
}
function renderDone(){
  const el = document.getElementById('doneWrap');
  const items = doneItems().slice().sort((a,b)=>(b.doneAt||b.updated||0)-(a.doneAt||a.updated||0));
  if(!items.length){ el.innerHTML=''; return; }
  let html = '<button class="done-toggle'+(doneOpen?' open':'')+'" id="doneToggle">'+svg('chev',14)+'✅ 完了済み（'+items.length+'）</button>';
  if(doneOpen) html += items.map(cardHTML).join('');
  el.innerHTML = html;
  document.getElementById('doneToggle').onclick = ()=>{ doneOpen=!doneOpen; renderDone(); };
  if(doneOpen) bindCardEvents(el);
}
function bindCardEvents(root){
  root.querySelectorAll('[data-st]').forEach(b=>{
    b.onclick = ()=>{
      const x = findItem(b.dataset.st); if(!x) return;
      /* ステータスはことづて（タイトル）にだけ紐づく。いつでもここから変えられる。 */
      openStatusSheet(x.id, null);
    };
  });
  root.querySelectorAll('[data-edit]').forEach(b=>{ b.onclick = ()=> openEditSheet(b.dataset.edit); });
  root.querySelectorAll('[data-open]').forEach(b=>{ b.onclick = ()=> toggleOpen(b.dataset.open); });
  root.querySelectorAll('[data-addnote]').forEach(b=>{ b.onclick = ()=> openNoteSheet(b.dataset.addnote, null); });
  root.querySelectorAll('[data-nst]').forEach(b=>{
    b.onclick = ()=> openStatusSheet(b.dataset.item, b.dataset.nst);
  });
  root.querySelectorAll('[data-nedit]').forEach(b=>{
    b.onclick = ()=> openNoteSheet(b.dataset.item, b.dataset.nedit);
  });
  root.querySelectorAll('[data-ncopy]').forEach(b=>{
    b.onclick = async ()=>{
      const x = findItem(b.dataset.item); if(!x) return;
      const n = findNote(x, b.dataset.ncopy); if(!n) return;
      const ok = await copyText(noteText(x, n));
      toast(ok ? 'コピーしました' : 'コピーできませんでした');
    };
  });
}
function toggleOpen(id){
  if(openIds.has(id)) openIds.delete(id); else openIds.add(id);
  render();
}

/* カードを開いた時に中に並ぶメモ */
function noteHTML(x, n, i){
  let html = '<div class="note">';
  html += '<div class="n-top">';
  html += '<span class="n-idx">'+(i+1)+'</span>';
  html += '<div class="n-act">';
  html += '<button class="icon-btn" data-ncopy="'+n.id+'" data-item="'+x.id+'" title="コピー">'+svg('copy',18)+'</button>';
  html += '<button class="icon-btn" data-nedit="'+n.id+'" data-item="'+x.id+'" title="編集">'+svg('edit',18)+'</button>';
  html += '</div></div>';
  if(n.head) html += '<div class="n-head">'+esc(n.head)+'</div>';
  html += n.body ? '<div class="n-body">'+esc(n.body)+'</div>'
                 : '<div class="n-empty">（本文なし）</div>';
  html += '</div>';
  return html;
}

/* ===================== 追加 ===================== */
const addTitle = document.getElementById('addTitle');
const addBody = document.getElementById('addBody');
const addBtn = document.getElementById('addBtn');
function refreshAddBtn(){ addBtn.disabled = !addTitle.value.trim(); }
/* 入力欄の下書きを自動保存。リロードや誤操作で打ちかけが消えないように。 */
const DRAFT_KEY = 'sashizu_draft_v1';
function saveDraft(){
  try{
    const t=addTitle.value, b=addBody.value;
    if(t || b) localStorage.setItem(DRAFT_KEY, JSON.stringify({t,b}));
    else localStorage.removeItem(DRAFT_KEY);
  }catch(e){}
}
function restoreDraft(){
  try{
    const s=localStorage.getItem(DRAFT_KEY); if(!s) return;
    const d=JSON.parse(s);
    if(d && (d.t || d.b)){ addTitle.value=d.t||''; addBody.value=d.b||''; autoGrow(addBody); refreshAddBtn(); }
  }catch(e){}
}
function clearDraft(){ try{ localStorage.removeItem(DRAFT_KEY); }catch(e){} }
addTitle.addEventListener('input', ()=>{ refreshAddBtn(); saveDraft(); });
addBody.addEventListener('input', ()=>{ autoGrow(addBody); saveDraft(); });
addBtn.onclick = ()=>{
  const title = addTitle.value.trim();
  if(!title) return;
  const body = addBody.value.trim();
  const item = { id:uid(), title, body:'', notes:[], status:'idea', ts:Date.now(), updated:Date.now() };
  if(body) item.notes.push(blankNote(body));
  recalc(item);
  db.items.push(item);
  addTitle.value=''; addBody.value=''; autoGrow(addBody); refreshAddBtn(); clearDraft();
  save(); render();
  toast('💡 アイデアに追加しました');
};

/* ===================== ステータスシート ===================== */
const stOverlay = document.getElementById('stOverlay');
function openStatusSheet(itemId, noteId){
  const x = findItem(itemId); if(!x) return;
  const target = noteId ? findNote(x, noteId) : x;
  if(!target) return;
  sheetItemId = itemId; sheetNoteId = noteId || null; sheetOpen = true;
  document.getElementById('stTitle').textContent = noteId ? 'このメモのステータス' : 'ステータスを変更';
  const el = document.getElementById('stOpts');
  el.innerHTML = STATUSES.map(s=>
    '<button class="st-opt'+(s.key===target.status?' cur':'')+'" data-key="'+s.key+'">'+
    s.emoji+' '+s.label+'<span class="st-desc">'+s.desc+'</span></button>'
  ).join('');
  el.querySelectorAll('.st-opt').forEach(b=>{
    b.onclick = ()=>{
      const x2 = findItem(sheetItemId);
      const t2 = x2 ? (sheetNoteId ? findNote(x2, sheetNoteId) : x2) : null;
      if(t2 && t2.status !== b.dataset.key){
        t2.status = b.dataset.key;
        t2.updated = Date.now();
        if(b.dataset.key==='done'){ t2.doneAt = Date.now(); } else { delete t2.doneAt; }
        if(sheetNoteId){ x2.updated = Date.now(); recalc(x2); }
        save();
        const s = ST[b.dataset.key];
        toast(s.emoji+' '+s.label+' にしました');
      }
      closeSheets();
    };
  });
  stOverlay.classList.add('show');
}
document.getElementById('stCancel').onclick = closeSheets;
stOverlay.addEventListener('click', e=>{ if(e.target===stOverlay) closeSheets(); });

/* ===================== 編集シート ===================== */
const edOverlay = document.getElementById('edOverlay');
const edTitle = document.getElementById('edTitle');
function openEditSheet(id){
  const x = findItem(id); if(!x) return;
  sheetItemId = id; sheetNoteId = null; sheetOpen = true;
  edTitle.value = x.title;
  edOverlay.classList.add('show');
}
document.getElementById('edSave').onclick = ()=>{
  const x = findItem(sheetItemId);
  if(x){
    const t = edTitle.value.trim();
    if(!t){ toast('タイトルを入力してください'); return; }
    x.title = t; x.updated = Date.now();
    save();
  }
  closeSheets();
  toast('保存しました');
};
document.getElementById('edDelete').onclick = ()=>{
  const x = findItem(sheetItemId);
  closeSheets();
  if(!x) return;
  openIds.delete(x.id);
  const idx = db.items.indexOf(x);
  db.items.splice(idx,1); save(); render();
  undoToast('ことづてを削除しました', ()=>{ db.items.splice(Math.min(idx,db.items.length),0,x); save(); render(); });
};
document.getElementById('edCancel').onclick = closeSheets;
edOverlay.addEventListener('click', e=>{ if(e.target===edOverlay) closeSheets(); });

/* ===================== メモ編集シート ===================== */
const ntOverlay = document.getElementById('ntOverlay');
const ntTitle = document.getElementById('ntTitle');
const ntBody = document.getElementById('ntBody');
/* 打ちかけのメモも下書き保存する。保存前に画面が落ちても、同じメモを開けば戻る。 */
const NDRAFT_KEY = 'sashizu_note_draft_v1';
function saveNoteDraft(){
  try{
    const h=ntTitle.value, b=ntBody.value;
    if(!sheetItemId || (!h && !b)){ localStorage.removeItem(NDRAFT_KEY); return; }
    localStorage.setItem(NDRAFT_KEY, JSON.stringify({ item:sheetItemId, note:sheetNoteId||'', h, b }));
  }catch(e){}
}
function clearNoteDraft(){ try{ localStorage.removeItem(NDRAFT_KEY); }catch(e){} }
function readNoteDraft(itemId, noteId){
  try{
    const d = JSON.parse(localStorage.getItem(NDRAFT_KEY)||'null');
    if(d && d.item===itemId && (d.note||'')===(noteId||'')) return d;
  }catch(e){}
  return null;
}
ntTitle.addEventListener('input', saveNoteDraft);
ntBody.addEventListener('input', ()=>{ autoGrow(ntBody); saveNoteDraft(); });

/* ===================== リスト入力ショートカット =====================
   指示テキスト欄で Markdown 風の箇条書きを楽に打てるように。
   ・「-」「*」＋スペース → 「• 」箇条書きに変換、Enterで継続（空のままEnter＝解除）
   ・「1.」＋スペース → 番号リスト、Enterで「2.」「3.」…自動採番（1) 形式もOK）
   ・「[]」＋スペース → 「- [ ] 」チェック項目に変換、Enterで継続
   ★keydown ではなく beforeinput で判定：iOSのソフトキーボードは keydown を
     まともに発火せず（Space/Enterが keyCode:229 になる）効かないため。*/
const RE_CHECK=/^(\s*)([-*])\s+\[[ xX]?\]\s+/, RE_NUM=/^(\s*)(\d+)([.)])\s+/, RE_BUL=/^(\s*)([-*•])\s+/;
function lineHeadStart(v,pos){ return v.lastIndexOf('\n',pos-1)+1; }
/* Enter（改行が入る直前）：リストを継続 or 解除。処理したら true。 */
function listContinue(ta,e){
  if(ta.selectionStart!==ta.selectionEnd) return false;
  const v=ta.value, pos=ta.selectionStart, start=lineHeadStart(v,pos), line=v.slice(start,pos);
  let m, marker=null, cs=0;
  if((m=line.match(RE_CHECK))){ marker=m[1]+m[2]+' [ ] '; cs=m[0].length; }
  else if((m=line.match(RE_NUM))){ marker=m[1]+(parseInt(m[2],10)+1)+m[3]+' '; cs=m[0].length; }
  else if((m=line.match(RE_BUL))){ marker=m[1]+m[2]+' '; cs=m[0].length; }
  else return false;
  if(line.slice(cs).trim()===''){ // 中身が空 → マーカーを消してリスト解除
    e.preventDefault(); ta.value=v.slice(0,start)+v.slice(pos); ta.selectionStart=ta.selectionEnd=start; return true;
  }
  e.preventDefault(); const ins='\n'+marker; ta.value=v.slice(0,pos)+ins+v.slice(pos);
  ta.selectionStart=ta.selectionEnd=pos+ins.length; return true;
}
/* スペースが入る直前：行頭が [] / [ ] なら「- [ ] 」に変換。処理したら true。 */
function listSpace(ta,e){
  if(ta.selectionStart!==ta.selectionEnd) return false;
  const v=ta.value, pos=ta.selectionStart, start=lineHeadStart(v,pos), line=v.slice(start,pos);
  let m, r=null;
  if((m=line.match(/^(\s*)\[( ?)\]$/))) r=m[1]+'- [ ] ';   // [] → チェック項目
  else if((m=line.match(/^(\s*)[-*•]$/))) r=m[1]+'• ';      // - / * → 箇条書き（•に変換）
  else return false;
  e.preventDefault(); ta.value=v.slice(0,start)+r+v.slice(pos);
  ta.selectionStart=ta.selectionEnd=start+r.length; return true;
}
function attachListShortcuts(ta, after){
  ta.addEventListener('beforeinput', e=>{
    if(e.isComposing) return; // 日本語変換の確定Enter等は無視
    let handled=false;
    const t=e.inputType;
    if(t==='insertLineBreak'||t==='insertParagraph') handled=listContinue(ta,e);
    else if(t==='insertText'&&(e.data===' '||e.data==='　')) handled=listSpace(ta,e);
    if(handled&&after) after();
  });
}
attachListShortcuts(addBody, ()=>{ autoGrow(addBody); saveDraft(); });
attachListShortcuts(ntBody, ()=>{ autoGrow(ntBody); });
function openNoteSheet(itemId, noteId){
  const x = findItem(itemId); if(!x) return;
  const n = noteId ? findNote(x, noteId) : null;
  if(noteId && !n) return;
  sheetItemId = itemId; sheetNoteId = noteId || null; sheetOpen = true;
  document.getElementById('ntHead').textContent = n ? 'メモを編集' : 'メモを追加';
  document.getElementById('ntDelete').style.display = n ? '' : 'none';
  ntTitle.value = n ? n.head : '';
  ntBody.value = n ? n.body : '';
  const d = readNoteDraft(itemId, noteId);   // 打ちかけが残っていれば戻す
  if(d && (d.h !== ntTitle.value || d.b !== ntBody.value)){
    ntTitle.value = d.h || ''; ntBody.value = d.b || '';
    setTimeout(()=>toast('打ちかけのメモを戻しました'), 250);
  }
  ntOverlay.classList.add('show');
  setTimeout(()=>{ autoGrow(ntBody); if(!n) ntBody.focus(); }, 0);
}
document.getElementById('ntSave').onclick = ()=>{
  const x = findItem(sheetItemId);
  if(!x){ closeSheets(); return; }
  const head = ntTitle.value.trim();
  const body = ntBody.value.trim();
  if(!head && !body){ toast('メモを入力してください'); return; }
  const editing = !!sheetNoteId;
  if(sheetNoteId){
    const n = findNote(x, sheetNoteId);
    if(n){ n.head = head; n.body = body; n.updated = Date.now(); }
  }else{
    const n = blankNote(body, head);
    x.notes.push(n);
  }
  x.updated = Date.now();
  recalc(x); save();
  clearNoteDraft();
  closeSheets();
  toast(editing ? '保存しました' : 'メモを追加しました');
};
document.getElementById('ntDelete').onclick = ()=>{
  const x = findItem(sheetItemId);
  const nid = sheetNoteId;
  clearNoteDraft();
  closeSheets();
  if(!x || !nid) return;
  const n = findNote(x, nid); if(!n) return;
  const idx = x.notes.indexOf(n);
  x.notes.splice(idx,1); recalc(x); save(); render();
  undoToast('メモを削除しました', ()=>{
    x.notes.splice(Math.min(idx,x.notes.length),0,n); recalc(x); save(); render();
  });
};
/* 「キャンセル」は打ちかけを捨てる。背景タップ（誤タップ）は捨てずに残す。 */
document.getElementById('ntCancel').onclick = ()=>{ clearNoteDraft(); closeSheets(); };
ntOverlay.addEventListener('click', e=>{ if(e.target===ntOverlay) closeSheets(); });

function closeSheets(){
  stOverlay.classList.remove('show');
  edOverlay.classList.remove('show');
  ntOverlay.classList.remove('show');
  rcOverlay.classList.remove('show');
  sheetItemId = null; sheetNoteId = null; sheetOpen = false;
  if(pendingRender){ pendingRender=false; }
  render();
}

/* ===================== 復旧シート =====================
   クラウドの状態を当てる直前に取ってある snapshot（最大20世代）と今の画面を突き合わせ、
   「保険には在るのに今は無い」ことづて／メモを拾い戻せるようにする。
   ★ 保険は端末ごとに別（localStorage）。消えた端末で開く必要がある。 */
const rcOverlay = document.getElementById('rcOverlay');
let rcFound = { items:[], notes:[] };
function readBackups(){
  try{ const a = JSON.parse(localStorage.getItem(BAK_KEY) || '[]'); return Array.isArray(a) ? a : []; }
  catch(e){ return []; }
}
function findLost(){
  const nowItems = new Map((db.items||[]).map(x=>[x.id, x]));
  const lostItems = new Map(), lostNotes = new Map();
  readBackups().forEach(bk=>{
    const st = bk && bk.state;
    if(!st || !Array.isArray(st.items)) return;
    st.items.forEach(bx=>{
      const cur = nowItems.get(bx.id);
      if(!cur){                                   // ことづてごと消えている
        const prev = lostItems.get(bx.id);
        if(!prev || (bx.updated||bx.ts||0) >= (prev.item.updated||prev.item.ts||0)){
          lostItems.set(bx.id, { item:bx, at:bk.at||0 });   // 一番新しい内容を採る
        }
        return;
      }
      const has = new Set((cur.notes||[]).map(n=>n.id));
      (bx.notes||[]).forEach(bn=>{                // ことづては在るがメモだけ消えている
        if(has.has(bn.id)) return;
        const k = bx.id+'/'+bn.id, prev = lostNotes.get(k);
        if(!prev || (bn.updated||bn.ts||0) >= (prev.note.updated||prev.note.ts||0)){
          lostNotes.set(k, { itemId:bx.id, itemTitle:cur.title, note:bn, at:bk.at||0 });
        }
      });
    });
  });
  return { items:[...lostItems.values()], notes:[...lostNotes.values()] };
}
function fmtAt(t){
  if(!t) return '不明';
  const d = new Date(t);
  return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function clip(s, n){ s = String(s==null?'':s).replace(/\s+/g,' ').trim(); return s.length>n ? s.slice(0,n)+'…' : s; }
function openRescue(){
  rcFound = findLost();
  const total = rcFound.items.length + rcFound.notes.length;
  const el = document.getElementById('rcBody');
  if(!total){
    el.innerHTML = '<div class="rc-none">この端末の保険には、消えたことづて・メモは見つかりませんでした。'+
      '<span class="rc-note">保険は端末ごとに別々です。iPhone・Mac それぞれで開いてみてください。</span></div>';
  }else{
    let html = '<div class="rc-lead">保険に残っていて、いまの一覧に無いものです。'+
      '<span class="rc-note">自分で削除したものも混ざります。戻したいものだけ選んでください。</span></div>';
    rcFound.items.forEach((r,i)=>{
      const body = (r.item.notes||[]).map(n=>(n.head?'【'+n.head+'】':'')+n.body).join(' / ');
      html += '<label class="rc-row"><input type="checkbox" data-rci="'+i+'">'+
        '<span class="rc-txt"><span class="rc-kind">ことづて</span>'+
        '<span class="rc-title">'+esc(r.item.title||'(無題)')+'</span>'+
        (body ? '<span class="rc-sub">'+esc(clip(body,70))+'</span>' : '')+
        '<span class="rc-at">メモ'+((r.item.notes||[]).length)+'件・保険 '+fmtAt(r.at)+'</span>'+
        '</span></label>';
    });
    rcFound.notes.forEach((r,i)=>{
      html += '<label class="rc-row"><input type="checkbox" data-rcn="'+i+'">'+
        '<span class="rc-txt"><span class="rc-kind">メモ</span>'+
        '<span class="rc-title">'+esc(r.note.head || clip(r.note.body,30) || '(無題)')+'</span>'+
        '<span class="rc-sub">'+esc(clip(r.note.body,70))+'</span>'+
        '<span class="rc-at">「'+esc(clip(r.itemTitle,20))+'」の中・保険 '+fmtAt(r.at)+'</span>'+
        '</span></label>';
    });
    el.innerHTML = html;
  }
  document.getElementById('rcRestore').parentNode.style.display = total ? '' : 'none';
  sheetOpen = true;                 // 復旧中はリアルタイム上書き描画を止める
  rcOverlay.classList.add('show');
}
document.getElementById('rescueBtn').onclick = openRescue;
document.getElementById('rcCancel').onclick = closeSheets;
rcOverlay.addEventListener('click', e=>{ if(e.target===rcOverlay) closeSheets(); });
document.getElementById('rcRestore').onclick = ()=>{
  const now = Date.now();
  let n = 0;
  rcOverlay.querySelectorAll('[data-rci]:checked').forEach(cb=>{
    const r = rcFound.items[parseInt(cb.dataset.rci,10)]; if(!r) return;
    if(findItem(r.item.id)) return;               // 待っている間に戻ってきていたら二重に足さない
    const x = deepCopy(r.item);
    x.updated = now;                              // 「今つけた変更」にしてクラウドへ確実に送る
    (x.notes||[]).forEach(nt=>{ nt.updated = now; });
    db.items.push(x); n++;
  });
  rcOverlay.querySelectorAll('[data-rcn]:checked').forEach(cb=>{
    const r = rcFound.notes[parseInt(cb.dataset.rcn,10)]; if(!r) return;
    const x = findItem(r.itemId); if(!x || findNote(x, r.note.id)) return;
    const nt = deepCopy(r.note);
    nt.updated = now;
    x.notes.push(nt);
    x.notes.sort((a,b)=>(a.ts||0)-(b.ts||0));     // 作った順に戻す
    x.updated = now; recalc(x); n++;
  });
  if(!n){ toast('戻すものが選ばれていません'); return; }
  migrate();
  save();
  closeSheets();
  toast(n+'件を戻しました');
};

/* ===================== 起動 ===================== */
loadLocal();
migrate();
render();
restoreDraft();
renderSync();
loadRemote();
subscribeRealtime();
/* 画面を離れる時は、350msの待ちを飛ばして今すぐ送る（iOSは裏に回るとタイマーが止まるため）。
   戻ってきた時は取り込む。未送信が残っていれば mergeRemote が差し戻すので消えない。 */
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden){ if(pendingSave) push(); }
  else loadRemote();
});
window.addEventListener('pagehide', ()=>{ if(pendingSave) push(); });
/* 通信が復活したら自動で繋ぎ直す（手動リロード不要でオフライン表示を解消） */
window.addEventListener('online', ()=>{ if(pendingSave) push(); loadRemote(); });
/* 20秒ごと：未送信が残っていれば送り直し、オフライン表示なら繋ぎ直す */
setInterval(()=>{
  if(!sb || navigator.onLine===false) return;
  if(pendingSave) push();
  else if(online!==true) loadRemote();
}, 20000);
</script>
<!-- tsumiki-back-button -->
<style>
  #tsumikiEdge{position:fixed; top:0; bottom:0; left:0; width:22px; z-index:999;}
  #tsumikiPeek{
    position:fixed; top:50%; left:0; z-index:1001; margin-top:-23px;
    width:46px; height:46px; display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.92);
    -webkit-backdrop-filter:saturate(180%) blur(14px); backdrop-filter:saturate(180%) blur(14px);
    border:1px solid rgba(0,0,0,.06); border-radius:50%;
    box-shadow:0 6px 20px rgba(0,0,0,.18);
    color:#0071e3; font-size:24px; font-weight:600; line-height:1;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Helvetica Neue",Arial,sans-serif;
    transform:translateX(-70px) scale(.8); opacity:0; pointer-events:none;
  }
</style>
<div id="tsumikiEdge"></div>
<div id="tsumikiPeek">‹</div>
<script>
  (function(){
    var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
      || window.navigator.standalone === true;
    var fromTsumiki = false;
    try{
      if(document.referrer){
        var r = new URL(document.referrer);
        fromTsumiki = (r.origin === location.origin);
      }
    }catch(e){}
    if(!(standalone && fromTsumiki)) return;

    var peek = document.getElementById('tsumikiPeek');
    var edge = document.getElementById('tsumikiEdge');

    function goBack(){ location.href = 'index.html'; }

    /* --- 左端エッジスワイプで戻る（iOS純正の戻る操作。見えるボタンは置かない） --- */
    var sx=0, sy=0, prog=0, dragging=false, W=window.innerWidth;
    var TRIGGER = Math.min(120, W*0.32);
    window.addEventListener('resize', function(){ W=window.innerWidth; TRIGGER=Math.min(120, W*0.32); });

    function reset(){
      dragging = false; prog = 0;
      peek.style.transition = 'transform .25s ease, opacity .25s ease';
      peek.style.transform = 'translateX(-70px) scale(.8)';
      peek.style.opacity = 0;
    }
    function start(e){
      var t = e.touches ? e.touches[0] : e;
      if(t.clientX > 26) return;
      sx = t.clientX; sy = t.clientY; prog = 0; dragging = true;
      peek.style.transition = 'none';
    }
    function move(e){
      if(!dragging) return;
      var t = e.touches ? e.touches[0] : e;
      var dx = t.clientX - sx, dy = t.clientY - sy;
      if(Math.abs(dy) > Math.abs(dx) + 12){ reset(); return; }
      if(dx < 0) dx = 0;
      prog = Math.min(dx / TRIGGER, 1);
      peek.style.transform = 'translateX(' + (-70 + prog*82) + 'px) scale(' + (0.8 + prog*0.2) + ')';
      peek.style.opacity = prog;
      if(dx > 6 && e.cancelable) e.preventDefault();
    }
    function end(){
      if(!dragging) return;
      dragging = false;
      if(prog >= 0.999){
        peek.style.transition = 'transform .25s ease, opacity .25s ease';
        peek.style.transform = 'translateX(20px) scale(1.05)';
        peek.style.opacity = 1;
        goBack();
      }else{
        reset();
      }
    }
    edge.addEventListener('touchstart', start, {passive:true});
    window.addEventListener('touchmove', move, {passive:false});
    window.addEventListener('touchend', end, {passive:true});
    window.addEventListener('touchcancel', end, {passive:true});
  })();
</script>
<!-- /tsumiki-back-button -->
