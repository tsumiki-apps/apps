<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>つみきリモート</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="つみきリモート">
<meta name="theme-color" content="#0e0f12">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root{
    --bg:#0e0f12; --panel:#16181d; --line:#262a32; --fg:#e8eaed; --dim:#8b93a1;
    --busy:#c084fc; --wait:#f59e0b; --idle:#3f4653; --accent:#22c55e;
    /* 作業中タブの枠だけ薄い紫。ドット(--busy)はそのままの濃さ。
       返答待ち(オレンジ)より弱くして「返事を待って止まっている＝先に見るべき」を目立たせる */
    --busy-line:rgba(192,132,252,.4);
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overscroll-behavior:none;overflow:hidden}
  /* body を position:fixed で流れから外す＝「文書そのもの」がスクロールしなくなる。
     iOS はキーボードが出ると文書を勝手にスクロールし、閉じても戻さないことがある。
     すると画面全体が下にズレたように見える（上端を触ったときに起きやすい）。
     中身のスクロールは #out / nav / #keys が各自持っているので、これで困らない。
     ※ overflow:hidden だけでは iOS に効かない。位置を固定するのが要点（2026-08-11） */
  body{
    background:var(--bg);color:var(--fg);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;
    display:flex;flex-direction:column;height:100dvh;
    position:fixed;top:0;left:0;right:0;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  }

  header{display:flex;align-items:center;gap:8px;padding:10px 14px 8px;flex:0 0 auto;flex-wrap:nowrap}
  header .title{flex:1 1 auto;font-weight:700;font-size:15px;letter-spacing:.02em;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;min-width:0}
  header button{white-space:nowrap;flex:0 0 auto}
  header .conn{font-size:11px;color:var(--dim);display:flex;align-items:center;gap:5px;
    white-space:nowrap;flex:0 0 auto}
  /* 狭い画面では緑の点だけ残して文字は隠す（ボタンが折り返すのを防ぐ） */
  @media (max-width:430px){ header .conn .txt{display:none} }
  header .conn::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--idle)}
  header .conn.on::before{background:var(--accent)}
  header .conn.err::before{background:#ef4444}

  /* Claude の残量。上が5時間枠、下が週枠。電池と同じで、使うほど減る。
     ヘッダーは iPhone 390px でぎゅうぎゅうなので、普段は数字を出さず棒だけ。
     押せば内訳（残り％とリセット時刻）をトーストで出す。
     残り20%を切ったときだけ数字が横に出る＝知りたい時だけ情報が増える。
     ※ 一度「数字を常に出す」に変えたが、ヘッダーが静かなほうがよいので戻した
     （2026-08-13・本人の指示）。残りが多いあいだ棒だけになるのは承知のうえ。 */
  #usage{display:flex;align-items:center;gap:5px;padding:8px 2px;background:none;border:none}
  #usage[hidden]{display:none}
  #usage .bars{display:flex;flex-direction:column;gap:4px}
  /* 溝（減った分）は黒地に沈まない明るさにする。ここが見えないと、ただの
     横線2本＝メニューの三本線に見えてしまい、目盛りだと分からない */
  #usage .bar{width:26px;height:3px;border-radius:2px;background:#39404d;overflow:hidden}
  #usage .bar i{display:block;height:100%;width:0;border-radius:2px;background:var(--dim);
    transition:width .3s,background-color .3s}
  #usage .bar i.warn{background:var(--wait)}
  #usage .bar i.crit{background:#ef4444}
  #usage .bar.off{opacity:.35}
  #usage .num{font-size:10px;color:var(--wait);font-variant-numeric:tabular-nums}
  #usage .num.crit{color:#ef4444}
  #usage .num[hidden]{display:none}

  /* MacBook の電池。Claude の残量と並ぶが、意味の違う数字なので形を変える。
     棒3本にすると「どれがどれ？」になるので、こちらは電池の絵にする
     （説明なしで何の残量か分かる形。単位も割合も言わなくていい）。
     電源につながっているときは⚡だけ＝そのとき残量は気にする必要がない。 */
  #batt{display:flex;align-items:center;gap:3px;padding:8px 2px;background:none;border:none}
  #batt[hidden]{display:none}
  #batt .bolt{font-size:9px;color:var(--accent);line-height:1}
  #batt .bolt[hidden]{display:none}
  #batt .cell{
    position:relative;width:22px;height:11px;padding:1.5px;
    border:1px solid #6b7280;border-radius:3px;
  }
  /* 電池の＋極。これが無いと、ただの角丸の箱に見える */
  #batt .cell::after{
    content:"";position:absolute;left:100%;top:3px;width:2px;height:5px;
    background:#6b7280;border-radius:0 1px 1px 0;
  }
  #batt .cell i{display:block;height:100%;width:0;border-radius:1px;
    background:var(--dim);transition:width .3s,background-color .3s}
  #batt .cell i.warn{background:var(--wait)}
  #batt .cell i.crit{background:#ef4444}
  #batt .num{font-size:10px;color:var(--wait);font-variant-numeric:tabular-nums}
  #batt .num.crit{color:#ef4444}
  #batt .num[hidden]{display:none}
  /* 届いていないあいだは隠す。電池は「離れているあいだに減るもの」なので、
     古い値を出すのがいちばん危ない（満タンに見えて、実は切れている） */
  body.offline #batt{display:none}

  nav{display:flex;gap:8px;padding:0 14px 10px;overflow-x:auto;flex:0 0 auto;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  .tab{
    flex:0 0 auto;min-width:78px;padding:8px 10px;border-radius:12px;
    background:var(--panel);border:1px solid var(--line);text-align:left;color:var(--fg);
    font:inherit;font-size:12px;line-height:1.3;
  }
  /* 題名は折り返して全文出す。伸びるのは縦だけ（横に伸ばすと隣のタブが
     画面から消えて、切り替え先が見えなくなる） */
  .tab .n{font-weight:700;font-size:13px;max-width:11.5em;
    white-space:normal;overflow-wrap:anywhere}
  /* 状態（待機/作業中）と種類（Claude/シェル）は同じ行に置く。
     題名が2〜3行になるぶん、ここで1行返す */
  .tab .meta{display:flex;align-items:center;gap:6px;margin-top:4px}
  .tab .st{display:flex;align-items:center;gap:5px;color:var(--dim);font-size:10px}
  .tab .st::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--idle);flex:0 0 auto}
  .tab.busy .st::before{background:var(--busy);animation:pulse 1.2s ease-in-out infinite}
  .tab.waiting .st::before{background:var(--wait)}
  .tab.waiting .st{color:var(--wait)}
  .tab[aria-selected="true"]{background:#1f232b;border-color:#3b4250}
  /* 状態の枠。選択中(aria-selected)より後に置いて色で勝たせる＝いま開いている
     タブでも「作業中/返答待ち」が枠から消えない（選択中は背景の明るさで示す）。
     枠は点滅させない（タブが並ぶと目がちらつく）。動きはドットの点滅が担当 */
  .tab.busy{border-color:var(--busy-line)}
  .tab.waiting{border-color:var(--wait)}
  @keyframes pulse{50%{opacity:.35}}
  .tab .kind{
    font-size:9px;letter-spacing:.04em;padding:1px 5px;border-radius:5px;flex:0 0 auto;
    display:inline-block;background:#20242c;color:var(--dim);
  }
  .tab .kind.claude,.tab .kind.agent{background:#13301f;color:#4ade80}
  .tab .kind.shell{background:#2a2320;color:#d9a86c}
  /* モデルごとの色。Anthropic が自分のサイトで使っている色をそのまま借りる
     （anthropic.com の --swatch--clay / fig / sky / cactus）。
     文字はその色のまま、下地は同じ色を黒に沈めたもの＝小さな札でも色で見分けがつき、
     字も読める明るさが残る（黒地との明暗比 4.8〜9.6）。
     色は変数で持たせて、札（下地＋文字）と、選ぶ画面の丸い印で同じものを使う。
     ⚠️ 種類の色（.claude / .shell）より後に書くこと。強さが同じなので、
        後に書いたほうが勝つ＝モデルが分かっているときだけ色が変わる */
  .m-opus  {--mfg:#d97757;--mbg:#271510}   /* clay   ＝ Claude 本体の色 */
  .m-fable {--mfg:#c46686;--mbg:#231218}   /* fig    ＝ いちばん賢い＝目立たせる */
  .m-sonnet{--mfg:#6a9bcc;--mbg:#131c25}   /* sky    ＝ 速くて安い */
  .m-haiku {--mfg:#bcd1ca;--mbg:#222624}   /* cactus ＝ いちばん速い＝いちばん軽い色 */
  .tab .kind.m-opus,.tab .kind.m-fable,.tab .kind.m-sonnet,.tab .kind.m-haiku{
    background:var(--mbg);color:var(--mfg);
  }
  /* ＋とドット絵の2段を、札の真ん中に置く。
     line-height:1 が要点＝文字の標準の行間（1.5）のままだと ＋ の下に見えない
     余白がぶら下がり、2段の塊が上に寄って見える（真ん中に見えない） */
  .tab.add{
    min-width:56px;text-align:center;color:var(--dim);font-size:17px;
    padding:8px 6px;line-height:1;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  }
  /* 「Claude」の字の代わりに置いた Claude Code のドット絵。小さな札の中では
     読ませるより「見て分かる」ほうが速い。色は本家の #cc785c。
     24×15px＝絵のマス目とちょうど1対1。ここより小さくすると目のスリットが消える */
  .tab.add .cmark{width:24px;height:15px;display:block;fill:#cc785c;
    shape-rendering:crispEdges}

  /* オフラインの帯。ヘッダーの丸い点は狭い画面だと色しか出ない＝「古い内容を
     見ている」と気づけない。取り違えると事故になるので、文字で言い切る場所を
     画面の中に持つ（2026-08-12） */
  #stale{
    flex:0 0 auto;margin:0 10px 6px;padding:7px 10px;border-radius:10px;
    background:rgba(245,158,11,.13);border:1px solid rgba(245,158,11,.32);
    color:var(--wait);font-size:11px;line-height:1.45;
  }
  #stale[hidden]{display:none}
  /* 届いていないあいだ、札の「作業中」は今の話ではない（点滅は動いている合図に
     見えてしまう）。止めて、薄くして、古い情報だと分かるようにする */
  body.offline nav{opacity:.5}
  body.offline .tab.busy .st::before,
  body.offline #dest.busy::before{animation:none}

  main{flex:1 1 auto;min-height:0;margin:0 10px;border:1px solid var(--line);border-radius:14px;background:#0b0c0f;overflow:hidden}
  #out{
    margin:0;padding:12px;height:100%;overflow:auto;-webkit-overflow-scrolling:touch;
    font-family:var(--mono);font-size:11px;line-height:1.45;color:#d5d9e0;
    /* スマホでは常に折り返す。横スクロールしながら読むのは現実的でない */
    white-space:pre-wrap;overflow-wrap:anywhere;
  }
  /* 画面の塗り分け。黒地に彩度の高い色を敷くと文字が沈むので、面はごく薄く、
     手がかりは左端の線に持たせる（紙の蛍光ペンが成立するのは白地だから） */
  #out .blk{display:block;padding:2px 8px;border-left:2px solid transparent;margin:0 -4px}
  #out .say{background:rgba(34,197,94,.09);border-left-color:#22c55e;color:#eef3ee}
  #out .ask{background:rgba(245,158,11,.13);border-left-color:#f59e0b;color:#fdf3e2}
  #out .me {background:rgba(255,255,255,.05);border-left-color:#4b525e}
  #out .dim{color:#8b93a1}

  /* 端末が ┌─┬┐ で描いた表。ターミナルは「文字何個ぶん」で桁を合わせているので、
     幅がその半分しかないスマホでは必ず折り返し、罫線が二重に見えて読めなくなる
     （2026-08-12）。折り返さず横スクロールにすると今度は全体が見えない。
     なので枠線を読み取って本物の <table> に組み直す＝桁合わせをブラウザに任せる。
     日本語は等幅フォントでも半角2つぶんぴったりにはならないので、文字数で
     揃えている限りどのみち縦線はズレる。表に直せばその問題ごと無くなる */
  #out .tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:4px 0 6px}
  #out .tbl{
    border-collapse:collapse;max-width:100%;
    font-size:10.5px;line-height:1.35;white-space:normal;
  }
  #out .tbl th,#out .tbl td{
    border:1px solid var(--line);padding:3px 6px;
    text-align:left;vertical-align:top;overflow-wrap:anywhere;
  }
  #out .tbl th{background:#161a20;color:#aab2c0;font-weight:700}

  /* 端末が ╭─╮ で描いた選択ダイアログを組み直したもの。中身は桁合わせを捨てて
     普通に折り返す＝スマホの幅で素直に読める。色は .ask（返答待ち）と同じ意味 */
  #out .dlg{
    display:block;margin:4px -4px 6px;padding:8px 10px;border-radius:10px;
    border-left:2px solid #f59e0b;background:rgba(245,158,11,.13);color:#fdf3e2;
    white-space:normal;overflow-wrap:break-word;
  }
  #out .dlg.done{border-left-color:#4b525e;background:rgba(255,255,255,.04);color:var(--dim)}
  #out .dtx{margin:2px 0;line-height:1.6}
  #out .dsep{margin:6px 0;padding-top:6px;border-top:1px dashed var(--line);
    font-size:10px;color:var(--dim)}
  /* 罫線が入った中身（表・差分）は桁が崩れると意味が変わるので、折り返さず横に流す */
  #out .dlg .draw{margin:4px 0;padding:6px 8px;border-radius:8px;background:#0b0c0f;
    white-space:pre;overflow-x:auto;-webkit-overflow-scrolling:touch;
    font-size:10.5px;line-height:1.4;color:#aab2c0}
  /* 選択肢はそのまま押せる。指1本ぶん（44px）の高さを確保する */
  #out .dopt{
    display:flex;align-items:flex-start;gap:8px;width:100%;min-height:38px;
    margin:3px 0;padding:8px 10px;border-radius:10px;text-align:left;
    border:1px solid var(--line);background:#161a20;color:var(--fg);
    font:inherit;line-height:1.5;
  }
  #out .dopt.sel{border-color:#f59e0b;background:rgba(245,158,11,.18)}
  #out .dopt:active{background:#242932}
  #out .dopt[disabled]{opacity:.55;background:transparent}
  #out .dnum{flex:0 0 auto;min-width:17px;height:17px;border-radius:5px;margin-top:1px;
    background:#2a303a;color:#aab2c0;font-size:10px;font-weight:700;
    display:flex;align-items:center;justify-content:center}
  #out .dopt.sel .dnum{background:#f59e0b;color:#1a1205}
  #out .dlab{flex:1 1 auto;min-width:0}
  #out .ddesc{display:block;margin-top:2px;font-size:10.5px;color:var(--dim);line-height:1.5}

  /* 下端は iPhone のホームバー領域（触れない帯）。そこに 8px を足すと
     黒い余りが増えるだけなので、max() で「多い方」を使うだけにする */
  /* position:relative ＝ トーストの位置の基準。footer が伸び縮みしても
     トーストが必ずその真上に乗るようにするため（.toast のコメント参照） */
  footer{flex:0 0 auto;padding:6px 10px max(6px, env(safe-area-inset-bottom));position:relative}

  /* 送り先バー。iOS はキーボードを出すとき画面全体を押し上げるので、ヘッダーも
     タブ行も画面の上へ消える＝打っている最中に「いま誰に送ろうとしているのか」
     が分からなくなる。入力欄の真上＝キーボードのすぐ上に置けば、押し上げられても
     必ず一緒についてくるので、打っている間ずっと見える（2026-08-11）。
     点の色はタブと同じ意味：グレー=待機／紫の点滅=作業中／オレンジ=返答待ち */
  #dest{
    display:flex;align-items:center;gap:6px;padding:1px 4px 6px;
    font-size:11px;color:var(--dim);line-height:1.3;
  }
  #dest[hidden]{display:none}
  #dest::before{content:"";width:6px;height:6px;border-radius:50%;
    background:var(--idle);flex:0 0 auto}
  #dest.busy::before{background:var(--busy);animation:pulse 1.2s ease-in-out infinite}
  #dest.waiting{color:var(--wait)}
  #dest.waiting::before{background:var(--wait)}
  /* 長い題名は1行で切る。ここで折り返すと入力欄が下に押されて動くので、
     縦の高さは何があっても変えない */
  /* 幅は「文字のぶんだけ」（1 1 auto にすると行いっぱいに伸びて、隣のモデル名が
     右端まで離れる＝題名の続きに見えない）。長いときはここが縮んで題名が切れる */
  #dest .dn{flex:0 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* 題名の右にモデル名。札の中の同じ札と見た目を揃える（同じものだと分かるように）。
     縮まないので、題名が長いときは題名のほうが先に切られる＝送り先のモデルは必ず見える */
  #dest .dm{
    flex:0 0 auto;font-size:9px;letter-spacing:.04em;padding:1px 5px;border-radius:5px;
    background:var(--mbg,#13301f);color:var(--mfg,#4ade80);
  }
  #dest .dm[hidden]{display:none}

  #keys{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
  #keys::-webkit-scrollbar{display:none}
  #keys button{
    flex:0 0 auto;padding:7px 12px;border-radius:9px;background:var(--panel);
    border:1px solid var(--line);color:var(--fg);font:inherit;font-size:12px;
  }
  #keys button:active{background:#242932}
  /* 添えた画像の札。以前は Mac 側の保存先パス（70文字ほど）を文字として入力欄に
     流し込んでいたが、1行の入力欄がそれだけで埋まり、本文を打ち直そうとタップすると
     カーソルがパスの中に落ちる → Backspace で末尾が欠け、送っても Claude 側では
     「そんなファイルはない」になる（欠けたことに気づけない）。札は文字ではないので
     壊しようがなく、入力欄はまるごと本文用に空く（2026-08-11） */
  #atts{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
  #atts[hidden]{display:none}
  #atts::-webkit-scrollbar{display:none}
  .att{
    flex:0 0 auto;display:flex;align-items:center;
    background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;
  }
  .att.up{opacity:.45}
  .att img,.att .ph{
    width:38px;height:38px;border-radius:7px;background:#242932;
    object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:15px;
  }
  /* ✕ は指で押せる幅を確保する（画像側を狭めずボタン側で稼ぐ） */
  .att button{
    width:32px;height:38px;border:none;background:none;color:var(--dim);
    font:inherit;font-size:15px;line-height:1;
  }
  .row{display:flex;gap:8px;align-items:flex-end}
  /* 入力欄。改行のぶんだけ縦に伸びる（LINE と同じ）。
     ・font-size は 16px 以上（これを下回ると iOS が勝手に拡大する）
     ・伸びるのは5行まで。それ以上は中でスクロールさせる＝入力欄が画面を
       埋めて、上の作業画面が見えなくなるのを防ぐ
     ・高さの計算は JS 側（autoGrow）。max-height と行の高さはここと揃える */
  #cmd{
    flex:1 1 auto;min-width:0;padding:10px 14px;border-radius:20px;background:var(--panel);
    border:1px solid var(--line);color:var(--fg);font:inherit;font-size:16px;
    line-height:22px;resize:none;overflow-y:auto;max-height:132px;
    -webkit-overflow-scrolling:touch;
  }
  #cmd:focus{outline:none;border-color:#3b4250}
  #pick{
    flex:0 0 auto;width:40px;height:40px;border-radius:50%;background:var(--panel);
    border:1px solid var(--line);color:var(--dim);font-size:20px;line-height:1;
  }
  #pick:disabled{opacity:.35}
  #send{
    flex:0 0 auto;width:40px;height:40px;border-radius:50%;border:none;
    background:var(--accent);color:#06240f;font-size:18px;font-weight:700;
  }
  #send:disabled{opacity:.35}

  #gate{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;padding:24px;z-index:9}
  #gate.show{display:flex}
  #gate p{color:var(--dim);font-size:13px;text-align:center;margin:0;max-width:280px}
  #gate input{width:100%;max-width:320px;padding:11px 14px;border-radius:12px;background:var(--panel);
    border:1px solid var(--line);color:var(--fg);font-size:16px;font-family:var(--mono)}
  #gate button{padding:11px 22px;border-radius:12px;border:none;background:var(--accent);
    color:#06240f;font:inherit;font-weight:700;font-size:15px}
  #menu,#reload{
    padding:6px 10px;border-radius:8px;background:var(--panel);
    border:1px solid var(--line);color:var(--dim);font:inherit;font-size:13px;line-height:1;
  }
  #reload{font-size:15px}
  #reload:active{color:var(--fg);border-color:#3b4250}

  #viewer{position:fixed;inset:0;z-index:40;background:var(--bg);
    display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  #viewer[hidden]{display:none}
  .viewerbar{display:flex;align-items:center;gap:8px;padding:8px 10px;flex:0 0 auto}
  .viewerbar button{
    padding:6px 10px;border-radius:8px;background:var(--panel);
    border:1px solid var(--line);color:var(--fg);font:inherit;font-size:12px;white-space:nowrap;
  }
  #viewername{flex:1 1 auto;min-width:0;font-size:11px;color:var(--dim);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
  #viewerframe{flex:1 1 auto;width:100%;border:0;background:#fff;min-height:0}

  #sheet{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.55);
    display:flex;align-items:flex-end}
  #sheet[hidden]{display:none}
  .sheetbox{
    width:100%;background:#14161b;border-top-left-radius:18px;border-top-right-radius:18px;
    border-top:1px solid var(--line);padding:14px 12px calc(14px + env(safe-area-inset-bottom));
    max-height:78dvh;display:flex;flex-direction:column;gap:8px;
  }
  .sheethead{font-size:12px;color:var(--dim);padding:2px 6px 6px}
  .sheetbody{overflow-y:auto;display:flex;flex-direction:column;gap:6px;min-height:0}
  .sheetbody button{
    text-align:left;padding:13px 14px;border-radius:12px;background:var(--panel);
    border:1px solid var(--line);color:var(--fg);font:inherit;font-size:15px;
  }
  .sheetbody button:disabled{opacity:.35}
  .sheetbody .sub{display:block;font-size:11px;color:var(--dim);margin-top:3px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sheetbody .on{color:var(--accent)}
  /* モデルを選ぶ画面の丸い印。名前そのものに色を付けないのは、「（前回）」の緑と
     ぶつかるため。印なら両方いっぺんに見える＝色と札の対応も覚えられる */
  .sheetbody .dot{display:inline-block;width:9px;height:9px;border-radius:50%;
    margin-right:8px;background:var(--mfg,var(--dim))}
  /* まとめて終わらせる前に「何が消えるか」を1件ずつ見せる。
     数だけ出しても、押していいのか判断できない */
  .sheetbody .killlist{display:flex;flex-direction:column;gap:2px;padding:0 8px 4px}
  .sheetbody .killrow{font-size:12px;color:var(--dim);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sheetbody .killrow.warn{color:var(--wait)}
  .sheetcancel{
    padding:13px;border-radius:12px;background:#20242c;border:1px solid var(--line);
    color:var(--fg);font:inherit;font-size:15px;font-weight:700;
  }
  /* トーストは footer の子にして「footer の上端のさらに上」に置く。
     以前は bottom:96px の決め打ちだったが、送り先バーや画像の札が増えて
     footer が伸びるたびに位置がずれ、esc/↓/tab/1 のキー行を覆っていた
     （タップ自体は貫通するが、何を押しているのか見えない）。
     100% 基準なら footer が何段になっても必ず真上に出る（2026-08-12） */
  .toast{position:absolute;left:50%;bottom:calc(100% + 4px);transform:translateX(-50%);
    background:#242932;color:var(--fg);padding:8px 14px;border-radius:10px;font-size:12px;
    opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;
    max-width:calc(100% - 20px);text-align:center;white-space:pre-line;line-height:1.6;
    /* left:50% だけだと「使える幅」が画面の半分と見なされ、長い文が細長い塊に
       折り返される。max-content にして、上限だけ max-width で止める */
    width:max-content}
  .toast.show{opacity:1}
</style>
</head>
<body>

<header>
  <span class="title">つみきリモート</span>
  <span class="conn" id="conn"><span class="txt">接続待ち</span></span>
  <button id="usage" hidden aria-label="Claudeの残量"><span class="bars">
    <span class="bar" id="bar5"><i></i></span>
    <span class="bar" id="bar7"><i></i></span>
  </span><span class="num" id="unum" hidden></span></button>
  <button id="batt" hidden aria-label="MacBookの電池"><span class="bolt" hidden>⚡︎</span><span
    class="cell"><i></i></span><span class="num" id="bnum" hidden></span></button>
  <button id="reload" aria-label="読み込み直す">↻</button>
  <button id="menu" aria-label="メニュー">⋯</button>
</header>

<nav id="tabs"></nav>

<div id="stale" hidden></div>

<main><pre id="out">セッションを選んでください。</pre></main>

<footer>
  <div id="dest" hidden><span class="dn"></span><span class="dm" hidden></span></div>
  <div id="keys">
    <button data-key="Escape">esc</button>
    <button data-key="Enter">⏎</button>
    <button data-key="Up">↑</button>
    <button data-key="Down">↓</button>
    <button data-key="Tab">tab</button>
    <button data-text="1" data-enter="1">1</button>
    <button data-text="2" data-enter="1">2</button>
    <button data-text="3" data-enter="1">3</button>
    <button data-text="4" data-enter="1">4</button>
    <button data-text="5" data-enter="1">5</button>
    <button data-key="C-c">Ctrl-C</button>
    <button data-key="C-d">Ctrl-D</button>
  </div>
  <div id="atts" hidden></div>
  <div class="row">
    <button id="pick" title="画像を送る">＋</button>
    <textarea id="cmd" rows="1" placeholder="指示を入力…" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="enter"></textarea>
    <button id="send" disabled>↑</button>
  </div>
  <input id="file" type="file" accept="image/*" multiple hidden>
  <div class="toast" id="toast"></div>
</footer>

<div id="gate">
  <p>合言葉（トークン）を貼り付けてください。一度入れれば次からは不要です。</p>
  <input id="tokenInput" placeholder="token" autocapitalize="off" autocorrect="off" spellcheck="false">
  <button id="tokenSave">つなぐ</button>
</div>

<div id="viewer" hidden>
  <div class="viewerbar">
    <button id="viewerback">‹ もどる</button>
    <span id="viewername"></span>
    <button id="viewersafari">Safariで開く</button>
  </div>
  <iframe id="viewerframe" title="制作物のプレビュー"></iframe>
</div>

<div id="sheet" hidden>
  <div class="sheetbox">
    <div class="sheethead" id="sheettitle">メニュー</div>
    <div class="sheetbody" id="sheetbody"></div>
    <button class="sheetcancel" id="sheetcancel">とじる</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  var LS = 'tsumiki-remote-token';
  var url = new URL(location.href);
  var token = url.searchParams.get('t') || localStorage.getItem(LS) || '';
  if (token) {
    localStorage.setItem(LS, token);
    // URL からトークンは消さない。消すと「ホーム画面に追加」で保存されるURLから
    // トークンが落ち、起動しても合言葉を聞かれてしまう（iOSはホーム画面アプリと
    // Safari で localStorage が別領域なので、保存済みの値も引き継がれない）。
    // manifest も同じ理由でトークン付きで取りに行く（start_url を作らせるため）。
    var mf = document.querySelector('link[rel="manifest"]');
    if (mf) mf.href = 'manifest.json?t=' + encodeURIComponent(token);
  }

  var el = {
    tabs: document.getElementById('tabs'),
    out: document.getElementById('out'),
    cmd: document.getElementById('cmd'),
    send: document.getElementById('send'),
    conn: document.getElementById('conn'),
    keys: document.getElementById('keys'),
    dest: document.getElementById('dest'),
    destName: document.querySelector('#dest .dn'),
    destModel: document.querySelector('#dest .dm'),
    gate: document.getElementById('gate'),
    tokenInput: document.getElementById('tokenInput'),
    tokenSave: document.getElementById('tokenSave'),
    toast: document.getElementById('toast'),
    usage: document.getElementById('usage'),
    bar5: document.getElementById('bar5'),
    bar7: document.getElementById('bar7'),
    unum: document.getElementById('unum'),
    stale: document.getElementById('stale'),
    batt: document.getElementById('batt'),
    bolt: document.querySelector('#batt .bolt'),
    cell: document.querySelector('#batt .cell'),
    bnum: document.getElementById('bnum')
  };

  var current = localStorage.getItem('tsumiki-remote-session') || '';
  var sessions = [];
  var timer = null;
  var toastTimer = null;

  var LABEL = { busy: '作業中', waiting: '返答待ち', idle: '待機' };
  // 「AIに話しかけたつもりでシェルに打っていた」を防ぐための表示
  var KIND = { claude: 'Claude', agent: 'AI', shell: 'シェル', other: '実行中' };

  // ＋の下に置く Claude Code のドット絵（公式のあの子）。24×15 のマス目で、
  // 1マス＝1px になる大きさで出すと角がにじまない。
  // 目は「塗らない穴」にしてある（fill-rule:evenodd）＝下地の色を選ばないので、
  // 札の色を変えても目に四角い継ぎ足しが出ない。だから胴と耳は重ねずに並べる
  // （重ねると evenodd の打ち消しで胴に穴が空く）
  var CLAUDE_MARK =
    '<svg class="cmark" viewBox="0 0 24 15" aria-hidden="true">' +
    '<path fill-rule="evenodd" d="' +
      'M3 0h18v12H3z' +                       // 胴
      'M0 6h3v3H0z M21 6h3v3h-3z' +           // 左右の耳（横に出るところ）
      'M4 12h2v3H4z M7 12h2v3H7z' +           // 前足
      'M15 12h2v3h-2z M18 12h2v3h-2z' +       // 後足
      'M6 3h1v3H6z M17 3h1v3h-1z' +           // 目（穴）
    '"/></svg>';

  function toast(msg, ms) {
    el.toast.textContent = msg;
    el.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.toast.classList.remove('show'); }, ms || 1600);
  }

  function api(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({ 'x-token': token }, opts.headers || {});
    if (opts.body) opts.headers['content-type'] = 'application/json';
    // 届かなかったときの言い方をここで揃える。Safari の素の文言は "Load failed" で、
    // 出先で見ても何が起きたのか分からない（2026-08-12）
    return fetch(path, opts).catch(function () {
      throw new Error('MacBook に届きません');
    }).then(function (r) {
      if (r.status === 401) { gate(true); throw new Error('unauthorized'); }
      // 失敗したときは中身の error を読んで見せる。「http 500」だけだと
      // 何が起きたのか外出先から確かめようがない（2026-08-11）。
      if (!r.ok) {
        return r.json().catch(function () { return null; }).then(function (d) {
          throw new Error((d && d.error) ? d.error : 'http ' + r.status);
        });
      }
      return r.json();
    });
  }

  function gate(show) {
    el.gate.classList.toggle('show', !!show);
    if (show) el.tokenInput.value = '';
  }

  function setConn(state, text) {
    el.conn.className = 'conn ' + state;
    el.conn.firstElementChild.textContent = text;
  }

  // ---- Claude の残量（上の棒＝5時間枠、下の棒＝週枠）
  //
  // 棒は電池と同じで「残り」を塗る（使うほど短くなる）。数字は普段出さない。
  // 残り20%を切ったものがあるときだけ、その数字を横に出す。

  var usage = null;

  function remOf(b) { return b ? Math.max(0, 100 - b.used) : null; }

  function paintBar(bar, b) {
    var rem = remOf(b);
    bar.classList.toggle('off', rem === null);
    var fill = bar.firstElementChild;
    fill.style.width = (rem === null ? 0 : rem) + '%';
    fill.className = rem === null ? '' : (rem <= 10 ? 'crit' : (rem <= 30 ? 'warn' : ''));
  }

  function renderUsage(u) {
    usage = (u && (u.session || u.week)) ? u : null;
    el.usage.hidden = !usage;
    if (!usage) return;
    paintBar(el.bar5, usage.session);
    paintBar(el.bar7, usage.week);
    // 少ない方＝先に詰まる方の数字だけ出す。両方あるときは小さい方。
    var rems = [remOf(usage.session), remOf(usage.week)].filter(function (r) { return r !== null; });
    var worst = Math.min.apply(null, rems);
    el.unum.hidden = !(worst <= 20);
    el.unum.textContent = '残' + worst + '%';
    el.unum.className = 'num' + (worst <= 10 ? ' crit' : '');
  }

  // リセットの時刻。近いうちなら「あと◯時間◯分」、先なら日付と時刻。
  function resetText(iso) {
    if (!iso) return '';
    var t = new Date(iso).getTime();
    if (!isFinite(t)) return '';
    var d = t - Date.now();
    if (d <= 0) return 'まもなくリセット';
    if (d < 24 * 3600 * 1000) {
      var h = Math.floor(d / 3600000);
      var m = Math.floor((d % 3600000) / 60000);
      return 'あと' + (h ? h + '時間' : '') + m + '分';
    }
    var x = new Date(t);
    return (x.getMonth() + 1) + '/' + x.getDate() + ' ' +
      x.getHours() + ':' + String(x.getMinutes()).padStart(2, '0') + 'にリセット';
  }

  function usageLine(label, b) {
    if (!b) return label + ' —';
    var r = resetText(b.resetsAt);
    return label + ' 残' + remOf(b) + '%' + (r ? '（' + r + '）' : '');
  }

  el.usage.addEventListener('click', function () {
    if (!usage) return;
    toast(usageLine('5時間', usage.session) + '\n' + usageLine('週', usage.week), 2800);
  });

  // ---- MacBook の電池
  //
  // 電源につながっていれば⚡だけ出して、残量の色は静かなまま（気にしなくていい）。
  // 電源が無いときだけ、減るほど色が変わる。20%を切ったら数字も出す。
  // ここが尽きると全部のセッションが消えるので、Claude の残量より重い数字。

  var battery = null;

  function renderBatt(b) {
    battery = (b && typeof b.pct === 'number') ? b : null;
    el.batt.hidden = !battery;
    if (!battery) return;
    var fill = el.cell.firstElementChild;
    fill.style.width = battery.pct + '%';
    fill.className = battery.ac ? '' : (battery.pct <= 10 ? 'crit' : (battery.pct <= 20 ? 'warn' : ''));
    el.bolt.hidden = !battery.ac;
    el.bnum.hidden = battery.ac || battery.pct > 20;
    el.bnum.textContent = battery.pct + '%';
    el.bnum.className = 'num' + (battery.pct <= 10 ? ' crit' : '');
  }

  function battLine() {
    var b = battery;
    var head = 'MacBook ' + b.pct + '%';
    if (b.charging) return head + '・充電中';
    if (b.ac) return head + '・電源につないでいます';
    var rest = b.remainMin
      ? 'あと' + (b.remainMin >= 60 ? Math.floor(b.remainMin / 60) + '時間' : '') + (b.remainMin % 60) + '分'
      : '残り時間は計算中';
    // 切れたら全部止まる、というのはここでしか言えない
    return head + '・電源なし（' + rest + '）\n切れると作業場所ごと終わります';
  }

  el.batt.addEventListener('click', function () {
    if (battery) toast(battLine(), 2800);
  });

  // ---- 最後に見た内容を iPhone の中に残す（オフラインでも開けるように）
  //
  // 画面そのもの（HTML）は sw.js が写しを持つ。ここで残すのは「中身」の方＝
  // セッションの一覧と、それぞれで見えていた画面の文字。届かないときはこれを描く。
  // 何も残していないと、Mac に届かない＝真っ白、になる（2026-08-12）。
  //
  // 1.5秒ごとに書くと、そのたび数十KBの書き込みで画面が引っかかるので、
  // 変わったときだけ・SNAP_EVERY_MS に1回までにする。閉じる直前にも1回書く。
  var SNAP = 'tsumiki-remote-snap';
  var SNAP_EVERY_MS = 5000;
  // 1セッションぶんの上限（文字数）。400行ぶんの画面がだいたい入る大きさ。
  // 溢れたら末尾＝新しい方を残す（上が切れる）
  var PANE_MAX = 40000;
  var panes = {};            // name -> 最後に見えていた画面
  var snapAt = 0;            // その中身を見た時刻
  var snapDirty = false;
  var snapSavedAt = 0;
  var offline = false;

  function snapBody(only) {
    var keep = {};
    // いま席にあるものだけ残す。終わらせた席の画面まで抱えても場所を食うだけ
    sessions.forEach(function (s) {
      if (only && s.name !== only) return;
      var t = panes[s.name];
      if (t) keep[s.name] = t.length > PANE_MAX ? t.slice(-PANE_MAX) : t;
    });
    return JSON.stringify({
      at: Date.now(), sessions: sessions, current: current, usage: usage, panes: keep
    });
  }

  function saveSnap(force) {
    if (!snapDirty && !force) return;
    if (!force && Date.now() - snapSavedAt < SNAP_EVERY_MS) return;
    try {
      localStorage.setItem(SNAP, snapBody(null));
    } catch (e) {
      // 入りきらないときは、いま見ている1つだけにして入れ直す
      try { localStorage.setItem(SNAP, snapBody(current)); } catch (e2) { return; }
    }
    snapDirty = false;
    snapSavedAt = Date.now();
  }

  // 「いつの内容か」。今日なら時刻だけ、昨日以前は日付から言う
  function stampText(ms) {
    var d = new Date(ms), now = new Date();
    var p = function (x) { return ('0' + x).slice(-2); };
    var hm = p(d.getHours()) + ':' + p(d.getMinutes());
    if (d.toDateString() === now.toDateString()) return hm;
    return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + hm;
  }

  function setOffline(yes) {
    offline = !!yes;
    el.stale.hidden = !offline;
    document.body.classList.toggle('offline', offline);
    if (!offline) return;
    // 375px で1行に収まる長さにする（折り返して1文字だけ次の行に残ると読みにくい）
    el.stale.textContent = snapAt
      ? 'MacBook に届きません・下は ' + stampText(snapAt) + ' 時点の内容です'
      : 'MacBook に届きません・保存された内容はまだありません';
  }

  // 届かないときに、残してある画面を出す
  function showCachedPane() {
    var t = panes[current];
    if (t == null) {
      // 残していない席に切り替えたとき。前の席の画面を出したままにすると
      // 「切り替わっていないのに切り替わったように見える」ので、はっきり言う
      if (lastText === null) {
        lastText = '';
        el.out.textContent = 'この作業場所の内容は保存されていません。つながったら出ます。';
      }
      return;
    }
    if (t !== lastText) { lastText = t; renderScreen(t); el.out.scrollTop = el.out.scrollHeight; }
  }

  function restoreSnap() {
    var raw = null, d = null;
    try { raw = localStorage.getItem(SNAP); } catch (e) { return; }
    if (!raw) return;
    try { d = JSON.parse(raw); } catch (e) { return; }
    if (!d || !d.sessions || !d.sessions.length) return;

    sessions = d.sessions;
    panes = d.panes || {};
    snapAt = d.at || 0;
    if (!sessions.some(function (s) { return s.name === current; })) {
      current = d.current || sessions[0].name;
    }
    el.send.disabled = false;
    renderUsage(d.usage);
    renderTabs();
    showCachedPane();
    // まだ「つながらない」と決まったわけではないので、帯はここでは出さない。
    // 最初の問い合わせが失敗したときに setOffline(true) で出す
  }

  function atBottom() {
    return el.out.scrollHeight - el.out.scrollTop - el.out.clientHeight < 40;
  }

  function renderTabs() {
    el.tabs.innerHTML = '';
    sessions.forEach(function (s, i) {
      var b = document.createElement('button');
      b.className = 'tab ' + s.status;
      b.setAttribute('aria-selected', String(s.name === current));
      // 種類の札は、モデルが分かっていればモデル名にして、色もそのモデルの色にする
      // （「Claude」と「Opus」を並べない＝札が狭いのと、Claude であることは
      //   もう場所で分かっているため）
      var chip = modelChip(s);
      b.innerHTML = '<div class="n">' + (i + 1) + '・' + escapeHtml(s.title || s.name) + '</div>' +
                    '<div class="meta">' +
                      '<span class="st">' + LABEL[s.status] + '</span>' +
                      '<span class="kind ' + s.kind + (chip ? ' ' + chip.cls : '') + '">' +
                        (chip ? chip.label : KIND[s.kind]) +
                      '</span>' +
                    '</div>';
      // 1回目＝切り替え、選ばれている札をもう一度＝その席のメニュー。
      // 「◯秒以内に2回」にはしない。出る/出ないが目に見えず、指の速さで
      // 結果が変わる＝同じ操作なのに違うことが起きる、になるため（2026-08-12）
      b.onclick = function () {
        if (s.name === current) sessionMenu(s.name);
        else select(s.name);
      };
      el.tabs.appendChild(b);
    });
    var add = document.createElement('button');
    add.className = 'tab add';
    // 文字を出さないので、読み上げ用の名前はここで補う
    add.setAttribute('aria-label', 'Claude を追加');
    add.innerHTML = '＋' + CLAUDE_MARK;
    add.onclick = function () { newClaudeMenu(); };
    el.tabs.appendChild(add);

    // ＋シェルは置かない（使っていないので、押し間違いの元だけが残る）。
    // シェルの席を作る道は残してある（newSession('shell') とサーバーの /api/new）。
    // すでにある席がシェルだったときの表示も、下の文言や札の色でそのまま効く

    // 素のシェルに日本語で話しかけてしまう事故を、入力欄の文言で防ぐ
    var cur = sessions.filter(function (s) { return s.name === current; })[0];
    el.cmd.placeholder = (cur && cur.kind === 'shell')
      ? 'コマンドを入力…（AIではありません）'
      : '指示を入力…';
    pickBtn.disabled = !cur;

    // 入力欄の真上に「いまの送り先」を出す。番号はタブの番号と揃える
    el.dest.hidden = !cur;
    if (cur) {
      el.dest.className = cur.status;
      el.destName.textContent =
        (sessions.indexOf(cur) + 1) + '・' + (cur.title || cur.name);
      // 送り先のモデルも同じ行に出す（打っている間ずっと見えるのはこの行だけ）。
      // 色は札と同じ＝上の札と目でつながる
      var curChip = modelChip(cur);
      el.destModel.textContent = curChip ? curChip.label : '';
      el.destModel.className = 'dm' + (curChip ? ' ' + curChip.cls : '');
      el.destModel.hidden = !curChip;
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function select(name) {
    current = name;
    lastText = null;   // 別のセッションに切り替えたら描き直す
    localStorage.setItem('tsumiki-remote-session', name);
    el.send.disabled = false;
    renderTabs();
    // 届かないときは、その席の残してある画面に切り替える（切り替え自体は効く）
    refreshPane(true).catch(function () { showCachedPane(); });
  }

  // ＋Claude を押したときに選ぶモデル。arg は起動時の --model に渡す合図で、
  // 'default' は Claude Code のおすすめ（Opus 5・1M 文脈）。
  // ⚠️ 起動時の --model は、その席だけに効く（Mac 側の既定は変わらない）。
  //    動いている席に /model を打つやり方だと既定まで書き換わるので採らない。
  // label は札に出す短い名前（狭いので「（おすすめ）」等は落とす）、
  // cls は色を決める札の名前（CSS の .m-* ＝ Anthropic 本家の色）
  var MODELS = [
    { arg: 'default', label: 'Opus',   cls: 'm-opus',   name: 'Opus（おすすめ）' },
    { arg: 'fable',   label: 'Fable',  cls: 'm-fable',  name: 'Fable' },
    { arg: 'sonnet',  label: 'Sonnet', cls: 'm-sonnet', name: 'Sonnet' },
    { arg: 'haiku',   label: 'Haiku',  cls: 'm-haiku',  name: 'Haiku' }
  ];
  var LAST_MODEL = 'tsumiki-remote-model';

  // 選ぶ画面には出さないが、サーバーは 'opus' も受け付けるので、
  // その名前で始まっている席も名前で出せるようにしておく
  var MODEL_CHIP = { opus: { label: 'Opus', cls: 'm-opus' } };
  MODELS.forEach(function (m) { MODEL_CHIP[m.arg] = { label: m.label, cls: m.cls }; });

  // その席が「どのモデルで始まったか」＝札に出す名前と色。始めるときに選んで
  // いれば、サーバーが席そのものに書いてくれている（→ server.js の MODEL_OPT）。
  // 知らない名前・アプリの外で作られた席は null ＝呼び出し側で従来の表示に戻す。
  // typeof で確かめているのは、'constructor' のような特別な名前が入ってきても
  // 中身の分からないものを画面に混ぜないため
  function modelChip(s) {
    if (!s || s.kind !== 'claude') return null;
    var c = MODEL_CHIP[s.model];
    return (c && typeof c.label === 'string') ? c : null;
  }

  // 席ができたあとからモデルを見分ける手がかりは画面の中にしか無いので、
  // せめて「前回どれで始めたか」だけは覚えておいて印をつける
  function newClaudeMenu() {
    var last = localStorage.getItem(LAST_MODEL);
    openSheet('どのモデルで始める？');
    MODELS.forEach(function (m) {
      sheetItem(m.name, m.arg === last ? '前回' : '',
        function () { closeSheet(); newSession('claude', m); },
        { on: m.arg === last, dot: m.cls });
    });
  }

  function newSession(kind, model) {
    // 空いている名前を探す。見えているものが全部＝tmux にあるものが全部なので、
    // 一覧を数えるだけでよい（隠れて席を占めているものはもう無い）
    var used = {};
    sessions.forEach(function (s) { used[s.name] = 1; });
    var prefix = kind === 'shell' ? 'sh' : 'work';
    var name = '';
    for (var i = 1; i <= 20 && !name; i++) if (!used[prefix + i]) name = prefix + i;
    if (!name) return toast('満席です（' + prefix + '1〜20 すべて使用中）');
    var body = { name: name, cols: measureCols() || undefined };
    if (kind === 'claude') body.run = 'claude';
    if (kind === 'claude' && model) body.model = model.arg;
    api('/api/new', { method: 'POST', body: JSON.stringify(body) })
      .then(function () {
        if (kind === 'claude' && model) localStorage.setItem(LAST_MODEL, model.arg);
        toast(name + (kind === 'claude'
          ? ' で ' + (model ? model.label : 'Claude') + ' を起動中…'
          : ' を作りました'));
        select(name);
        tick(true);
      })
      .catch(function (e) { toast('失敗: ' + e.message); });
  }

  // ホーム画面アプリは一度開くと開きっぱなしになる。Mac 側でアプリを直しても
  // 画面は古いままなので、押したボタンが古い動きをする（＝直したのに壊れて見える）。
  // サーバーが配る「版」が変わったら、書きかけを預けて読み込み直す。
  //
  // ⚠️ 版が変わった「瞬間」に読み直さない（2026-08-12）。直している最中は
  // ファイルが何度も保存されるので、そのたびに開き直して画面がガタガタ切り替わる
  // （＝直っている途中の版を何度も見せられる）。版が VER_SETTLE_MS のあいだ
  // 同じままになった＝手が止まった、と分かってから1回だけ読み直す。
  var DRAFT = 'tsumiki-remote-draft';
  var VER_SETTLE_MS = 8000;
  var seenVersion = null;
  var newVersion = null;      // 見つけた新しい版（まだ落ち着いていない）
  var newVersionAt = 0;
  var reloading = false;

  // 書きかけは本文だけでなく、添えた画像の札も一緒に預ける。
  // 画像そのものは Mac に置いた後なので、パスと小さな見本だけで戻せる
  function saveDraft() {
    try {
      var body = el.cmd.value || '';
      var keep = atts.filter(function (a) { return a.path; })
        .map(function (a) { return { p: a.path, t: a.thumb }; });
      if (!body && !keep.length) return localStorage.removeItem(DRAFT);
      localStorage.setItem(DRAFT, JSON.stringify({ t: body, a: keep }));
    } catch (e) { /* 入らなくても本文優先で諦める */ }
  }

  function checkVersion(v) {
    if (!v || reloading) return;
    if (seenVersion === null) { seenVersion = v; return; }
    if (v === seenVersion) { newVersion = null; return; }   // 元に戻ったら忘れる
    // 新しい版を見つけた／さらに別の版に変わった＝まだ直している最中。待ち直す
    if (v !== newVersion) { newVersion = v; newVersionAt = Date.now(); return; }
    if (Date.now() - newVersionAt < VER_SETTLE_MS) return;
    reloading = true;
    saveDraft();
    toast('新しい版になりました。開き直します');
    clearInterval(timer);
    setTimeout(function () { location.reload(); }, 700);
  }

  function refreshState() {
    return api('/api/state').then(function (d) {
      checkVersion(d.version);
      renderUsage(d.usage);
      renderBatt(d.battery);
      sessions = d.sessions;
      if (!sessions.length) {
        current = '';
        el.send.disabled = true;
        lastText = null;
        el.out.textContent = 'まだ作業場所がありません。＋Claude で作ってください。';
      } else if (!sessions.some(function (s) { return s.name === current; })) {
        current = sessions[0].name;
        el.send.disabled = false;
      } else {
        el.send.disabled = false;
      }
      renderTabs();
      setConn('on', 'つながっています');
      setOffline(false);
      snapAt = Date.now();
      snapDirty = true;
    });
  }

  // 画面の行を「誰の言葉か」で分類する。Claude Code の行頭記号が手がかり。
  //   ⏺ Bash(...)  ツールの呼び出し     ⎿ その結果
  //   ⏺ ふつうの文  Claude の返答        ❯ 自分が打った行
  //   │ ╭ ╰        選択肢などの枠        ✻ 進行中の表示
  var RE_TOOL = /^⏺\s+[A-Za-z][A-Za-z0-9_]*\(/;
  var RE_SAY = /^⏺\s/;
  var RE_RESULT = /^\s*⎿/;
  var RE_ME = /^❯\s/;
  // 枠は行の頭から描かれる。深く字下げされた縦線は「右側に並んだ絵」の一部なので
  // 拾わない（拾うと、その後ろの字下げ行・空行までオレンジのベタ塗りになる。2026-08-16）
  var RE_BOX = /^ {0,3}[│┃╭╮╰╯├┤]/;
  var RE_STATUS = /^\s*[✻✽✶✳✢*]\s/;

  function classify(line, prevCls) {
    if (!line.trim()) return prevCls;                 // 空行は直前のかたまりを続ける
    if (RE_ME.test(line)) return 'me';
    if (RE_TOOL.test(line)) return 'dim';
    if (RE_SAY.test(line)) return 'say';
    if (RE_RESULT.test(line)) return 'dim';
    if (RE_STATUS.test(line)) return 'dim';
    if (RE_BOX.test(line)) return 'ask';
    if (/^\s/.test(line)) return prevCls;             // 字下げは前の行の続き
    return '';
  }

  // 表の枠線。┌├└ で始まる行が罫線、│ で始まる行が中身。
  // ╭╮╰╯（角が丸い方）は Claude Code の確認ダイアログなので、ここでは拾わない
  var RE_T_TOP = /^\s*┌[─┬]+┐\s*$/;
  var RE_T_MID = /^\s*├[─┼]+┤\s*$/;
  var RE_T_BOT = /^\s*└[─┴]+┘\s*$/;
  var RE_T_ROW = /^\s*│(.*)│\s*$/;

  // i 行目から表が始まっていれば、中身と終わりの行番号を返す。
  // 途中で表でない行が来たら諦めて null＝生のまま出す。表を描いている最中
  // （下の罫線がまだ来ていない）も同じで、出来かけを表に組むとガタつくため
  function takeTable(lines, i) {
    if (!RE_T_TOP.test(lines[i])) return null;
    var rows = [];
    for (var j = i + 1; j < lines.length; j++) {
      if (RE_T_BOT.test(lines[j])) return rows.length ? { end: j, rows: rows } : null;
      if (RE_T_MID.test(lines[j])) continue;
      var m = RE_T_ROW.exec(lines[j]);
      if (!m) return null;
      rows.push(m[1].split('│').map(function (c) { return c.trim(); }));
    }
    return null;
  }

  function tableEl(rows) {
    var wrap = document.createElement('div');
    wrap.className = 'tblwrap';
    var table = document.createElement('table');
    table.className = 'tbl';
    rows.forEach(function (cells, ri) {
      var tr = document.createElement('tr');
      cells.forEach(function (text) {
        var cell = document.createElement(ri === 0 ? 'th' : 'td');
        cell.textContent = text;
        tr.appendChild(cell);
      });
      table.appendChild(tr);
    });
    wrap.appendChild(table);
    return wrap;
  }

  // ---------------------------------------- 角丸の枠＝Claude Code の選択ダイアログ
  //
  // 「どれにしますか？」「実行していい？」で出てくる ╭─╮ の箱。中身は端末の桁数で
  // 折り返された「絵」なので、そのまま出すと罫線が散らばる（2026-08-13）。
  // 枠を読み取って捨て、中身を普通の文章と選択肢に組み直す＝桁合わせから解放する。
  // ついでに選択肢はそのまま押せるようにする（押す＝クイックキーの 1〜5 と同じ）。
  var RE_D_TOP = /^\s*╭─*╮\s*$/;
  var RE_D_BOT = /^\s*╰─*╯\s*$/;
  var RE_D_SEP = /^\s*├─.*┤\s*$/;          // ├── ✂ ── 7 lines hidden ──┤
  var RE_D_ROW = /^\s*│(.*)$/;
  var RE_DRAW = /[─│┌┐└┘├┤┬┴┼╭╮╰╯━┃]/;    // 中身に混じった罫線（表・差分など）
  var RE_OPT = /^\s*([❯>›]\s+)?(\d{1,2})[.)]\s+(.+)$/;

  // 全角＝半角2つぶん。端末はこの数え方で桁を合わせているので、
  // 「その行が枠いっぱいまで届いていたか（＝折り返された行か）」もこれで測る
  var RE_WIDE = /[ᄀ-ᅟ⺀-〾ぁ-㏿㐀-䶿一-鿿ꀀ-꓏가-힣豈-﫿︰-﹯＀-｠￠-￦]/;
  function dispw(s) {
    var w = 0;
    for (var i = 0; i < s.length; i++) w += RE_WIDE.test(s[i]) ? 2 : 1;
    return w;
  }

  // 端末が折り返しただけの行をつなぎ直す。日本語はそのまま、英語は空白を挟む
  function joinWrapped(a, b) {
    if (!a) return b;
    if (!b) return a;
    return (RE_WIDE.test(a.slice(-1)) || RE_WIDE.test(b[0])) ? a + b : a + ' ' + b;
  }

  // i 行目から角丸の箱が始まっていれば、中身と終わりの行番号を返す。
  // 閉じていない（まだ描いている最中）なら null＝生のまま出す
  function takeDialog(lines, i) {
    if (!RE_D_TOP.test(lines[i])) return null;
    var inner = Math.max(1, dispw(lines[i].trim()) - 2);
    var rows = [];
    for (var j = i + 1; j < lines.length; j++) {
      if (RE_D_BOT.test(lines[j])) return rows.length ? { end: j, inner: inner, rows: rows } : null;
      if (RE_D_SEP.test(lines[j])) { rows.push({ sep: true, text: lines[j] }); continue; }
      var m = RE_D_ROW.exec(lines[j]);
      if (!m) return null;
      // 右端の縦線は消す。tmux は行末の空白を落とすので、無いこともある
      rows.push({ sep: false, text: m[1].replace(/│\s*$/, '').replace(/\s+$/, '') });
    }
    return null;
  }

  // 箱の中身を「文章・選択肢・罫線のかたまり・区切り」に分ける。
  //
  // 難しいのは「その行は、前の行が折り返しただけなのか／別の行なのか」の見分け。
  // 手がかりは2つ：①前の行が枠いっぱいまで届いていたら折り返し（日本語は必ずこう
  // なる。英語は単語の途中で切らないぶん少し手前で終わるので、遊びを持たせる）
  // ②選択肢より深く字下げされていたら、その選択肢にぶら下がる説明文。
  // 迷ったらつながない＝行が分かれて少し不格好、で済ませる（誤ってつなぐと文が壊れる）
  function dialogItems(d) {
    var items = [], cur = null;
    var slack = Math.min(12, Math.max(3, Math.round(d.inner * 0.12)));
    function add(cur, s) {
      var f = cur.into || 'text';
      cur[f] = joinWrapped(cur[f] || '', s.trim());
      cur.w = dispw(s);
    }
    d.rows.forEach(function (row) {
      if (row.sep) {
        cur = null;
        var t = row.text.replace(/[├┤─✂]/g, ' ').replace(/\s+/g, ' ').trim();
        var n = /(\d+)\s*lines?\s*hidden/i.exec(t);
        items.push({ t: 'sep', text: n ? '途中の' + n[1] + '行は端末に入りきらず省略されています' : t });
        return;
      }
      var s = row.text;
      if (!s.trim()) { cur = null; return; }          // 空行＝段落の切れ目
      if (RE_DRAW.test(s)) {                          // 表や差分。桁を崩さず出す
        if (cur && cur.t === 'raw') cur.lines.push(s);
        else items.push(cur = { t: 'raw', lines: [s] });
        return;
      }
      var ind = s.length - s.replace(/^\s+/, '').length;
      var m = RE_OPT.exec(s);
      if (m) {
        items.push(cur = { t: 'opt', n: m[2], sel: !!m[1], text: m[3].trim(),
          desc: '', into: 'text', ind: ind, w: dispw(s) });
        return;
      }
      // ① 前の行が枠いっぱい＝折り返しの続き
      if (cur && (cur.t === 'p' || cur.t === 'opt') && cur.w >= d.inner - slack) { add(cur, s); return; }
      // ② 選択肢より深い字下げ＝その選択肢の説明文
      if (cur && cur.t === 'opt' && ind > cur.ind) { cur.into = 'desc'; add(cur, s); return; }
      items.push(cur = { t: 'p', text: s.trim(), into: 'text', ind: ind, w: dispw(s) });
    });
    return items;
  }

  function dialogEl(d) {
    var box = document.createElement('div');
    box.className = 'dlg';
    dialogItems(d).forEach(function (it) {
      if (it.t === 'sep') {
        var sep = document.createElement('div');
        sep.className = 'dsep';
        sep.textContent = it.text;
        box.appendChild(sep);
        return;
      }
      if (it.t === 'raw') {
        // 中に表が入っていれば、外と同じように本物の <table> に組み直す
        for (var k = 0; k < it.lines.length; k++) {
          var tbl = takeTable(it.lines, k);
          if (tbl) { box.appendChild(tableEl(tbl.rows)); k = tbl.end; continue; }
          var pre = document.createElement('pre');
          pre.className = 'draw';
          var buf = [];
          for (; k < it.lines.length && !takeTable(it.lines, k); k++) buf.push(it.lines[k]);
          k--;
          pre.textContent = buf.join('\n');
          box.appendChild(pre);
        }
        return;
      }
      if (it.t === 'opt') {
        var b = document.createElement('button');
        b.className = 'dopt' + (it.sel ? ' sel' : '');
        b.dataset.opt = it.n;
        b.dataset.label = it.text;      // 押したときの言い添え用（説明文は混ぜない）
        b.innerHTML = '<span class="dnum"></span><span class="dlab"></span>';
        b.firstChild.textContent = it.n;
        b.lastChild.textContent = it.text;
        if (it.desc) {
          var dd = document.createElement('span');
          dd.className = 'ddesc';
          dd.textContent = it.desc;
          b.lastChild.appendChild(dd);
        }
        box.appendChild(b);
        return;
      }
      var p = document.createElement('div');
      p.className = 'dtx';
      p.textContent = it.text;
      box.appendChild(p);
    });
    return box;
  }

  // ------------------------------------- 選択肢とプレビューが左右に並ぶ画面（2026-08-16）
  //
  // Claude Code の質問は、選択肢に「プレビュー」が付くと横並びの2段組になる。
  //   ❯ 1. 週単位                  ┌───────────────┐
  //     2. 月単位                  │ 週            │
  //     3. 日付（暦日）            │ W1  W2  W3    │
  // つまり1行の中に「左＝選択肢／右＝絵」が同居する。角丸の箱（╭─╮）ではないので
  // takeDialog は拾えず、生のまま出ていた。すると
  //   ・選択肢が押せない（右の罫線が混ざって「1.」の行として読めない）
  //   ・右の絵が29桁ぶん字下げされたまま流れる＝画面の大半が空白
  //   ・│ で始まる行を「返答待ち」と見なす塗り分けが、後ろの字下げ行・空行まで
  //     連れて行って、画面いっぱいがオレンジのベタ塗りになる
  // が起きる（2026-08-16 報告のスクショ）。桁で切って左右に分け、
  // 左は押せる選択肢に、右は絵として別枠に置き直す＝2段組をほどく。
  var RE_P_TOP = /^[┌╭][─┬]+[┐╮]\s*$/;
  var RE_P_BOT = /^[└╰][─┴]+[┘╯]\s*$/;

  // 「何桁目で切るか」は端末の数え方（全角＝2桁）。文字数で切ると、左に日本語が
  // 入っているぶんだけズレて右の箱を切り損ねる（最初これで拾えなかった）
  function cutAt(s, col) {
    var w = 0, i = 0;
    for (; i < s.length && w < col; i++) w += RE_WIDE.test(s[i]) ? 2 : 1;
    return [s.slice(0, i), s.slice(i)];
  }

  // i 行目から2段組が始まっていれば、左右に切り分けて返す。
  // 閉じていない（描いている最中）なら null＝生のまま出す
  function takeSideBySide(lines, i) {
    var at = lines[i].search(/[┌╭]/);
    if (at <= 0) return null;                       // 行頭の箱は普通の表。2段組ではない
    if (!RE_P_TOP.test(lines[i].slice(at))) return null;
    var c = dispw(lines[i].slice(0, at));           // 箱が始まる「桁」
    if (!RE_OPT.test(lines[i].slice(0, at))) return null;  // 左が選択肢でなければ別物
    var left = [lines[i].slice(0, at)], right = [], end = -1, p;
    for (var j = i + 1; j < lines.length; j++) {
      p = cutAt(lines[j], c);
      left.push(p[0]);
      if (RE_P_BOT.test(p[1])) { end = j; break; }
      right.push(p[1]);
    }
    if (end < 0) return null;
    // 箱の下にぶら下がる右側の続き（「Notes: press n to add notes」など）も連れて行く。
    // 左が空のまま右だけ続いている間＝まだ2段組の中
    for (var k = end + 1; k < lines.length; k++) {
      p = cutAt(lines[k], c);
      if (p[0].trim()) break;
      if (p[1].trim()) right.push(p[1]);
      end = k;
    }
    return { end: end, left: left, right: right };
  }

  // 左の列＝選択肢。左の列も幅が狭いので、長い選択肢は端末が折り返している。
  // 選択肢より深く字下げされていたら、その選択肢の続き（ダイアログと同じ見分け方）
  function sideOptions(leftLines) {
    var items = [], cur = null;
    leftLines.forEach(function (s) {
      if (!s.trim()) { cur = null; return; }
      var m = RE_OPT.exec(s);
      var ind = s.length - s.replace(/^\s+/, '').length;
      if (m) {
        items.push(cur = { t: 'opt', n: m[2], sel: !!m[1], text: m[3].trim(), ind: ind });
        return;
      }
      if (cur && cur.t === 'opt' && ind > cur.ind) { cur.text = joinWrapped(cur.text, s.trim()); return; }
      items.push(cur = { t: 'p', text: s.trim(), ind: ind });
    });
    return items;
  }

  // 右の列＝プレビュー。外枠の │ …… │ は画面の幅を食うだけなので剥がす。
  // 「├── ✂ ── N lines hidden ──┤」は端末の幅で2行に割れていることがあるので、
  // ✂ を見つけたら ┤ が来るまで束ねてから読む
  function sidePreview(rightLines) {
    var out = [], buf = null;
    rightLines.forEach(function (s) {
      if (buf !== null) {
        // 端末は桁で断ち切るだけ＝単語の途中で割れている（「12 lin」「es hidden」）。
        // 間に空白を足すとくっつかないので、そのまま繋ぐ
        buf += s.trim();
        if (s.indexOf('┤') >= 0) { out.push({ sep: buf }); buf = null; }
        return;
      }
      if (s.indexOf('✂') >= 0 && /^\s*├/.test(s)) {
        buf = s.trim();
        if (s.indexOf('┤') >= 0) { out.push({ sep: buf }); buf = null; }
        return;
      }
      out.push({ line: s.replace(/^\s*│/, '').replace(/│\s*$/, '').replace(/\s+$/, '') });
    });
    if (buf !== null) out.push({ sep: buf });
    return out;
  }

  function sideBySideEl(sb) {
    var box = document.createElement('div');
    box.className = 'dlg';
    sideOptions(sb.left).forEach(function (it) {
      if (it.t === 'p') {
        var p = document.createElement('div');
        p.className = 'dtx';
        p.textContent = it.text;
        box.appendChild(p);
        return;
      }
      var b = document.createElement('button');
      b.className = 'dopt' + (it.sel ? ' sel' : '');
      b.dataset.opt = it.n;
      b.dataset.label = it.text;
      b.innerHTML = '<span class="dnum"></span><span class="dlab"></span>';
      b.firstChild.textContent = it.n;
      b.lastChild.textContent = it.text;
      box.appendChild(b);
    });
    // プレビューは端末の狭い列に押し込まれて元から崩れているので、直さず
    // 「絵」として横スクロールの別枠に置く。読みたい人だけ横に流して読む
    var pv = sidePreview(sb.right);
    var buf = [];
    function flush() {
      while (buf.length && !buf[buf.length - 1].trim()) buf.pop();
      while (buf.length && !buf[0].trim()) buf.shift();
      if (!buf.length) return;
      var pre = document.createElement('pre');
      pre.className = 'draw';
      pre.textContent = buf.join('\n');
      box.appendChild(pre);
      buf = [];
    }
    pv.forEach(function (r) {
      if (r.sep === undefined) { buf.push(r.line); return; }
      flush();
      var t = r.sep.replace(/[├┤─✂]/g, ' ').replace(/\s+/g, ' ').trim();
      var n = /(\d+)\s*lines?\s*hidden/i.exec(t);
      var sep = document.createElement('div');
      sep.className = 'dsep';
      sep.textContent = n ? '途中の' + n[1] + '行は端末に入りきらず省略されています' : t;
      box.appendChild(sep);
    });
    flush();
    return box;
  }

  function renderScreen(text) {
    var lines = text.split('\n');
    var frag = document.createDocumentFragment();
    var block = null, cls = '', prev = '';
    var dlgs = [];
    for (var i = 0; i < lines.length; i++) {
      var dlg = takeDialog(lines, i);
      if (dlg) {
        // 枠は「かたまり」の外に出す。中で色を塗り直すので、外側の帯に乗せると二重になる。
        // 枠の次の空行に色が伸びないよう、直前の分類も切っておく
        block = null; cls = ''; prev = '';
        var de = dialogEl(dlg);
        frag.appendChild(de);
        dlgs.push(de);
        i = dlg.end;
        continue;
      }
      var sbs = takeSideBySide(lines, i);
      if (sbs) {
        // ダイアログと同じ扱い＝外の帯には乗せない。ここで分類も切っておかないと、
        // 右側の字下げ行を拾ったオレンジがこの後ろまで続いてしまう
        block = null; cls = ''; prev = '';
        var se = sideBySideEl(sbs);
        frag.appendChild(se);
        dlgs.push(se);
        i = sbs.end;
        continue;
      }
      var tbl = takeTable(lines, i);
      if (tbl) {
        // いま塗っているかたまりの中に入れる＝表も「Claude の発言」の一部として
        // 帯が途切れない。表の行は分類にかけない（│ で始まるので、そのままだと
        // 確認ダイアログと同じオレンジに塗られてしまう）
        (block || frag).appendChild(tableEl(tbl.rows));
        i = tbl.end;
        continue;
      }
      var c = classify(lines[i], prev) || '';
      if (!block || c !== cls) {
        block = document.createElement('span');
        block.className = 'blk ' + c;
        frag.appendChild(block);
        cls = c;
      }
      block.appendChild(document.createTextNode(lines[i] + '\n'));
      prev = c;
    }
    // 押せるのは一番下の枠だけ。履歴に残った古い枠まで押せると、
    // 遡って読んでいるつもりが、いまの質問に答えてしまう
    dlgs.forEach(function (de, k) {
      if (k === dlgs.length - 1) return;
      de.classList.add('done');
      Array.prototype.forEach.call(de.querySelectorAll('.dopt'), function (b) { b.disabled = true; });
    });
    el.out.textContent = '';
    el.out.appendChild(frag);
  }

  // ------------------------------------------------ この画面に入る「桁数」を測る
  //
  // ターミナルは「半角が何個ぶん」で桁を合わせている。だから Mac 側の端末を
  // この画面に入る桁数まで狭めてやれば、Claude Code は最初から折り返した絵を
  // 描いてくれて、罫線が散らばらない（2026-08-13）。
  // 決め打ちにしないのは、iPhone の機種・横向き・文字サイズで変わるため。
  // 実測する（フォントの読み込み待ちで最初だけズレることがあるので毎回測る）。
  var colProbe = null;
  function measureCols() {
    if (!colProbe) {
      colProbe = document.createElement('span');
      colProbe.setAttribute('aria-hidden', 'true');
      colProbe.style.cssText = 'position:absolute;visibility:hidden;white-space:pre;top:0;left:0';
      colProbe.textContent = new Array(101).join('0');   // 半角100個
    }
    // 描き直すたびに #out は空にされるので、外れていたら入れ直す
    if (colProbe.parentNode !== el.out) el.out.appendChild(colProbe);
    // .blk は左右に padding 8px・margin -4px を持つので、本文が使える幅はその内側
    var per = colProbe.getBoundingClientRect().width / 100;
    var avail = el.out.clientWidth - 24 + 8 - 16;        // #out padding / .blk margin / .blk padding
    if (!(per > 0) || !(avail > 0)) return 0;
    return Math.max(40, Math.min(120, Math.floor(avail / per)));
  }

  var lastText = null;
  function refreshPane(force) {
    if (!current) return Promise.resolve();
    var cols = measureCols();
    return api('/api/pane?name=' + encodeURIComponent(current) + '&lines=400'
      + (cols ? '&cols=' + cols : '')).then(function (d) {
      var stick = force || atBottom();
      var text = d.text || '(空)';
      if (text !== lastText) { lastText = text; renderScreen(text); }
      if (stick) el.out.scrollTop = el.out.scrollHeight;
      if (panes[current] !== text) { panes[current] = text; snapDirty = true; }
      saveSnap();
    });
  }

  // force = 初回・復帰・送信直後。定期ポーリングだけ「見えているとき」に絞る
  function tick(force) {
    if (document.hidden && force !== true) return;
    refreshState()
      .then(refreshPane)
      .catch(function (e) {
        if (e.message === 'unauthorized') return;
        setConn('err', 'つながりません');
        // 届かないあいだは、残してある最後の内容を出したままにする。
        // 消して真っ白にするより、「いつの内容か」を言い添えて見せる方がいい
        setOffline(true);
        showCachedPane();
      });
  }

  // 送り先が無いときに黙って何もしないと、「押しても画面が全く変わらない」に
  // なって原因が分からない。効かないなら効かないと言う（2026-08-12）
  function sendText(text, enter) {
    if (!current) return toast('送り先が選ばれていません');
    return api('/api/send', {
      method: 'POST',
      body: JSON.stringify({ name: current, text: text, enter: !!enter })
    }).then(function () { setTimeout(function () { tick(true); }, 250); })
      .catch(function (e) { toast('送信失敗: ' + e.message); });
  }

  function sendKey(key) {
    if (!current) return toast('送り先が選ばれていません');
    return api('/api/key', { method: 'POST', body: JSON.stringify({ name: current, key: key }) })
      .then(function () { setTimeout(function () { tick(true); }, 250); })
      .catch(function (e) { toast('送信失敗: ' + e.message); });
  }

  // 添えた画像（札）。送信の瞬間に「パス + 半角スペース + 本文」に組み立てる
  var atts = [];

  // 入力欄の高さを中身に合わせる。改行のぶんだけ伸びて、5行で止まる（LINE と同じ）。
  //
  // ⚠️ この画面は * { box-sizing:border-box }。scrollHeight には枠線が入らないのに
  // height には入るので、そのまま入れると毎回2px ずつ縮んでいく。枠線ぶんを足す。
  // いったん auto に戻すのは、消したときに縮められるようにするため。
  function autoGrow() {
    el.cmd.style.height = 'auto';
    el.cmd.style.height = (el.cmd.scrollHeight + 2) + 'px';
  }
  el.cmd.addEventListener('input', autoGrow);

  el.send.onclick = function () {
    var v = el.cmd.value.trim();
    if (atts.some(function (a) { return !a.path; })) return toast('画像を置いている途中です');
    var paths = atts.map(function (a) { return a.path; }).join(' ');
    var text = paths ? (v ? paths + ' ' + v : paths) : v;
    if (!text) return;
    el.cmd.value = '';
    autoGrow();                 // 1行に戻す
    atts = [];
    renderAtts();
    sendText(text, true);
  };
  // Enter は改行。送信は右の↑だけ（2026-08-13）。
  // 送信を Enter に持たせると、日本語の変換確定でも送信が走る＝書きかけが
  // 飛んでいく。改行を入れたいという要望と、この誤送信の両方がこれで消える。
  // クイックキーの ⏎ は別物（ターミナルに Enter を押す機能）なので残す。

  el.keys.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.key) sendKey(b.dataset.key);
    else if (b.dataset.text) sendText(b.dataset.text, b.dataset.enter === '1');
  });

  // 選択ダイアログの項目を押したら、その番号を送る＝クイックキーの 1〜5 と同じ動き。
  // 下のキー行まで指を運ばなくても、読んでいるその場で答えられる
  el.out.addEventListener('click', function (e) {
    var b = e.target.closest('.dopt');
    if (!b || b.disabled) return;
    sendText(b.dataset.opt, true);
    toast(b.dataset.opt + '「' + (b.dataset.label || '') + '」を選びました');
  });

  el.tokenSave.onclick = function () {
    token = el.tokenInput.value.trim();
    localStorage.setItem(LS, token);
    gate(false);
    tick(true);
  };

  // 画像を送る。Claude Code は画像そのものを受け取れないので、Mac に置いてから
  // 「そのファイルの場所」を文章の先頭に付けて送る。ただしパスは入力欄には入れず、
  // 入力欄の上の「札」として持つ（理由は #atts の CSS のところ）。
  // 文章を足してから送れるよう、勝手に送信はしない。
  var pickBtn = document.getElementById('pick');
  var fileInput = document.getElementById('file');
  var attsBox = document.getElementById('atts');
  var attSeq = 0;

  pickBtn.onclick = function () { fileInput.click(); };

  function renderAtts() {
    attsBox.innerHTML = '';
    attsBox.hidden = !atts.length;
    atts.forEach(function (a) {
      var box = document.createElement('span');
      box.className = 'att' + (a.path ? '' : ' up');   // 置いている最中は薄く
      if (a.thumb) {
        var img = document.createElement('img');
        img.src = a.thumb;
        img.alt = '添えた画像';
        box.appendChild(img);
      } else {
        var ph = document.createElement('span');
        ph.className = 'ph';
        ph.textContent = a.path ? '🖼' : '…';
        box.appendChild(ph);
      }
      var x = document.createElement('button');
      x.textContent = '✕';
      x.setAttribute('aria-label', '画像を取り消す');
      x.onclick = function () {
        atts = atts.filter(function (b) { return b.id !== a.id; });
        renderAtts();
      };
      box.appendChild(x);
      attsBox.appendChild(box);
    });
  }

  // 札に出す小さな画像を作る。元の写真そのままだと数MBあり、
  // 書きかけの預け先（localStorage）にも入らないし、スマホでは重い
  function makeThumb(dataUrl, cb) {
    var img = new Image();
    img.onerror = function () { cb(''); };
    img.onload = function () {
      try {
        var s = Math.min(1, 120 / Math.max(img.width, img.height));
        var c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.width * s));
        c.height = Math.max(1, Math.round(img.height * s));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        cb(c.toDataURL('image/jpeg', 0.6));
      } catch (e) { cb(''); }   // HEIC など、この端末で開けない形式
    };
    img.src = dataUrl;
  }

  // 1枚を読み込んで Mac に置く。終わったら done(置けたか) を呼ぶ
  function putOne(a, f, done) {
    var reader = new FileReader();
    reader.onerror = function () { drop(); toast('読み込めませんでした'); done(false); };
    reader.onload = function () {
      var dataUrl = String(reader.result);
      var base64 = dataUrl.split(',')[1] || '';
      makeThumb(dataUrl, function (t) { a.thumb = t; renderAtts(); });

      api('/api/upload', { method: 'POST', body: JSON.stringify({ data: base64 }) })
        .then(function (d) {
          // 置いている間に ✕ で取り消されていたら、そのまま捨てる
          if (!alive()) return done(false);
          a.path = d.path;
          renderAtts();
          done(true);
        })
        .catch(function (e) {
          drop();
          toast('送れません: ' + e.message);
          done(false);
        });
    };
    reader.readAsDataURL(f);

    function alive() { return atts.some(function (b) { return b.id === a.id; }); }
    function drop() {
      atts = atts.filter(function (b) { return b.id !== a.id; });
      renderAtts();
    }
  }

  // まとめて選べる。ただし読み込みも送りも1枚ずつ順番にやる（同時にやると
  // 数MBの写真が何枚もメモリに乗って、スマホのブラウザが落ちる）。
  // 札は選んだ瞬間に全部並べて、置き終わったものから薄いのが消えていく
  fileInput.onchange = function () {
    var files = Array.prototype.slice.call(fileInput.files || []);
    fileInput.value = '';
    if (!files.length || !current) return;

    var over = files.filter(function (f) { return f.size > 10 * 1024 * 1024; }).length;
    files = files.filter(function (f) { return f.size <= 10 * 1024 * 1024; });
    if (over) toast(over + '枚は10MBを超えるので外しました');
    if (!files.length) return;

    var queue = files.map(function (f) {
      var a = { id: ++attSeq, path: '', thumb: '' };
      atts.push(a);
      return { a: a, f: f };
    });
    renderAtts();

    var ok = 0;
    (function next(i) {
      if (i >= queue.length) {
        if (ok === 1) toast('画像を添えました。指示を書いて送信');
        else if (ok > 1) toast(ok + '枚 添えました。指示を書いて送信');
        return;
      }
      var q = queue[i];
      // 待っている間に ✕ で取り消されていたら飛ばす
      if (!atts.some(function (b) { return b.id === q.a.id; })) return next(i + 1);
      putOne(q.a, q.f, function (good) { if (good) ok++; next(i + 1); });
    })(0);
  };

  // 終わらせる = tmux ごと消す。作業場所の後始末はこれ1つだけ（戻せない）。
  // 「隠すだけ」も持っていた時期があるが、隠れたまま席を占め続けて満席になった
  function doKill(name) {
    api('/api/kill', { method: 'POST', body: JSON.stringify({ name: name }) })
      .then(function () {
        toast(name + ' を終わらせました');
        if (current === name) {
          current = '';
          localStorage.removeItem('tsumiki-remote-session');
        }
        tick(true);
      })
      .catch(function (e) { toast('終わらせられません: ' + e.message); });
  }

  // 選ばれている札をもう一度タップしたときのメニュー。⋯（右上）まで行かずに、
  // いま目の前にある1件をその場で片付けるための入口。
  // 中身は必ず「今の一覧」から引き直す（札は1.5秒ごとに作り直されるが、
  // 押した瞬間の状態＝作業中/返答待ちで判断したい）
  function sessionMenu(name) {
    var s = null, i = -1;
    sessions.forEach(function (x, k) { if (x.name === name) { s = x; i = k; } });
    if (!s) return;
    openSheet((i + 1) + '・' + (s.title || s.name));

    var head = document.createElement('div');
    head.className = 'sheethead';
    // ここは幅に余裕があるので、種類（Claude）とモデルの両方を出す
    var headChip = modelChip(s);
    head.textContent = s.name + ' ・ ' + LABEL[s.status] + ' ・ ' + KIND[s.kind]
      + (headChip ? ' ・ ' + headChip.label : '');
    sheetBody.appendChild(head);

    // 押したらすぐ終わる。確認シートは挟まない（ここに来るまでに
    //「札をタップ→もう一度タップ」を踏んでいて、題名も目の前に出ている＝
    // 間違った席を畳む余地が小さい。毎回2枚目を出すほうが邪魔）
    sheetItem('片付ける（終わらせる）',
      (s.status === 'busy' ? '⚠️ いま作業中です・' : '') + '押すとすぐ終わります（取り消せません）',
      function () { closeSheet(); doKill(s.name); });
  }

  // 席が埋まったときの後始末。作業中のものだけ残して、あとはまとめて終わらせる。
  // ⚠️ 「作業中」の判定は画面が動いたかどうかなので、何も出力しない長い処理
  //    （静かなビルド等）は待機に見える。だから消す前に必ず一覧を見せる。
  function killableList() {
    return sessions.filter(function (s) { return s.status !== 'busy'; });
  }

  function confirmKillIdle() {
    var list = killableList();
    if (!list.length) return toast('終わらせるものがありません');
    openSheet('作業中以外を終わらせますか？');

    var waiting = list.filter(function (s) { return s.status === 'waiting'; }).length;
    var head = document.createElement('div');
    head.className = 'sheethead';
    head.textContent = list.length + ' 件の Claude を終了します。会話の続きはできなくなります'
      + '（ファイルへの変更は残ります）。'
      + (waiting ? '⚠️ うち ' + waiting + ' 件は返答待ち＝あなたの返事を待って止まっているものです。' : '');
    sheetBody.appendChild(head);

    var box = document.createElement('div');
    box.className = 'killlist';
    list.forEach(function (s) {
      var row = document.createElement('div');
      row.className = 'killrow' + (s.status === 'waiting' ? ' warn' : '');
      row.textContent = '・' + (s.title || s.name) + '（' + s.name + '・' + LABEL[s.status] + '）';
      box.appendChild(row);
    });
    sheetBody.appendChild(box);

    sheetItem('やめる', '何もしません', function () { closeSheet(); });
    sheetItem('終わらせる', list.length + ' 件・取り消せません', function () {
      closeSheet();
      doKillMany(list.map(function (s) { return s.name; }));
    });
  }

  function doKillMany(names) {
    api('/api/killmany', { method: 'POST', body: JSON.stringify({ names: names }) })
      .then(function (d) {
        var msg = d.killed.length + ' 件を終わらせました';
        if (d.skipped.length) msg += '（' + d.skipped.length + ' 件は残しました）';
        toast(msg);
        if (d.killed.indexOf(current) >= 0) {
          current = '';
          localStorage.removeItem('tsumiki-remote-session');
        }
        tick(true);
      })
      .catch(function (e) { toast('終わらせられません: ' + e.message); });
  }

  // Mac の画面だけ消す（スリープはしない）。出先で消し忘れに気づいたとき用
  function doDark() {
    api('/api/displaysleep', { method: 'POST', body: '{}' })
      .then(function () { toast('Mac の画面を消しました'); })
      .catch(function (e) { toast('消せません: ' + e.message); });
  }

  // ---------------------------------------------------------- シート

  var sheet = document.getElementById('sheet');
  var sheetTitle = document.getElementById('sheettitle');
  var sheetBody = document.getElementById('sheetbody');

  function closeSheet() { sheet.hidden = true; sheetBody.innerHTML = ''; }
  document.getElementById('sheetcancel').onclick = closeSheet;
  sheet.onclick = function (e) { if (e.target === sheet) closeSheet(); };

  function sheetItem(label, sub, onclick, opts) {
    var b = document.createElement('button');
    // 色の印（モデルを選ぶ画面だけ）。名前の前に置く
    if (opts && opts.dot) {
      var d = document.createElement('span');
      d.className = 'dot ' + opts.dot;
      b.appendChild(d);
    }
    var t = document.createElement('span');
    t.textContent = label;
    if (opts && opts.on) t.className = 'on';
    b.appendChild(t);
    if (sub) {
      var s2 = document.createElement('span');
      s2.className = 'sub';
      s2.textContent = sub;
      b.appendChild(s2);
    }
    if (opts && opts.disabled) b.disabled = true;
    b.onclick = function () { onclick(); };
    sheetBody.appendChild(b);
    return b;
  }

  function openSheet(title) {
    sheetTitle.textContent = title;
    sheetBody.innerHTML = '';
    sheet.hidden = false;
  }

  // 右上の ↻。版が変わったときは自動で読み込み直すが、
  // 「反応がおかしい」と感じたときに自分で試せる場所が要る
  document.getElementById('reload').onclick = function () {
    saveDraft();
    location.reload();
  };

  // 説明文は置かない。何度も見る場所なので、毎回同じ説明が並ぶと
  // 4項目でも「読む画面」になってしまう。押せない項目は灰色で分かるので、
  // 理由（選ばれていない／0件）も言わない。
  // ただし「この作業場所を終わらせる」だけは確認シートを挟まず即実行なので、
  // どこが消えるか（席の名前）と危険の合図（⚠️）は文字数を使ってでも残す。
  document.getElementById('menu').onclick = function () {
    openSheet('版 ' + (seenVersion || '?'));
    sheetItem('制作物を見る', '', function () { openFileList(); });
    sheetItem('Mac の画面を消す', '', function () { closeSheet(); doDark(); });
    sheetItem('この作業場所を終わらせる', current ? '⚠️ ' + current : '',
      function () { closeSheet(); doKill(current); }, { disabled: !current });
    var killable = killableList();
    sheetItem('作業中以外を終わらせる', killable.length ? killable.length + ' 件' : '',
      function () { confirmKillIdle(); }, { disabled: !killable.length });
  };

  // ---------------------------------------------------------- 制作物を見る

  function openFileList() {
    openSheet('制作物（新しい順）');
    var loading = document.createElement('div');
    loading.className = 'sheethead';
    loading.textContent = '読み込み中…';
    sheetBody.appendChild(loading);

    api('/api/files').then(function (d) {
      sheetBody.innerHTML = '';
      if (!d.files.length) { sheetItem('ファイルがありません', d.root, closeSheet); return; }
      d.files.forEach(function (f) {
        var name = f.rel.split('/').pop();
        sheetItem(name, f.rel + ' ・ ' + fmtSize(f.size) + ' ・ ' + fmtWhen(f.mtime), function () {
          closeSheet();
          openPreview(f.rel);
        });
      });
    }).catch(function (e) {
      sheetBody.innerHTML = '';
      sheetItem('読み込めません', e.message, closeSheet);
    });
  }

  // このアプリの中で開く。iframe は同じサーバーを見るので、
  // 最初の1回でクッキーが配られ、CSSや画像の読み込みもそのまま通る。
  var viewer = document.getElementById('viewer');
  var viewerFrame = document.getElementById('viewerframe');
  var viewerName = document.getElementById('viewername');
  var viewerUrl = '';

  function previewUrl(rel) {
    return '/preview/' + rel.split('/').map(encodeURIComponent).join('/') +
           '?t=' + encodeURIComponent(token);
  }

  function openPreview(rel) {
    viewerUrl = previewUrl(rel);
    viewerName.textContent = rel;
    viewerFrame.src = viewerUrl;
    viewer.hidden = false;
  }

  document.getElementById('viewerback').onclick = function () {
    viewer.hidden = true;
    viewerFrame.src = 'about:blank';   // 中で動いているものを止める
  };

  // iCloud に入れたい・人に渡したいときだけ Safari へ。
  // Safari の共有ボタンから「ファイルに保存」で iCloud Drive に入る。
  document.getElementById('viewersafari').onclick = function () {
    if (viewerUrl) window.open(viewerUrl, '_blank');
  };

  function fmtSize(n) {
    if (n < 1024) return n + 'B';
    if (n < 1024 * 1024) return Math.round(n / 1024) + 'KB';
    return (n / 1024 / 1024).toFixed(1) + 'MB';
  }

  function fmtWhen(ms) {
    var d = new Date(ms), now = new Date();
    var p = function (x) { return ('0' + x).slice(-2); };
    if (d.toDateString() === now.toDateString()) return p(d.getHours()) + ':' + p(d.getMinutes());
    return (d.getMonth() + 1) + '/' + d.getDate();
  }

  document.addEventListener('visibilitychange', function () { if (!document.hidden) tick(true); });

  // 読み込み直す前に預けた書きかけを戻す（古い版は本文だけの文字列で入っている）
  try {
    var draft = localStorage.getItem(DRAFT);
    if (draft) {
      localStorage.removeItem(DRAFT);
      var d = null;
      try { d = JSON.parse(draft); } catch (e) {}
      if (d && typeof d === 'object') {
        el.cmd.value = d.t || '';
        atts = (d.a || []).map(function (x) {
          return { id: ++attSeq, path: x.p, thumb: x.t || '' };
        });
        renderAtts();
      } else {
        el.cmd.value = draft;
      }
      autoGrow();   // 改行入りの書きかけなら、その行数ぶん開いた状態で戻す
    }
  } catch (e) {}

  // 画面一式を iPhone の中に置いておく係。これが居ると、Mac に届かないときでも
  // 開いた瞬間に写しが出る（真っ白にならない）。
  // ⚠️ https でないと登録できない決まり。http のときは静かに失敗するだけ。
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
      .catch(function () { /* http で開いている・対応していない。普通に動く */ });
  }

  // 最後に見た内容を先に描く。つながっていれば1秒以内に本物へ入れ替わるので、
  // 出しても損はなく、つながっていないときだけ意味が出る
  restoreSnap();

  // 閉じる・裏に回る直前に必ず1回残す。次に開いたときここから始まる
  window.addEventListener('pagehide', function () { saveSnap(true); });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) saveSnap(true);
  });

  if (!token) gate(true);
  tick(true);
  timer = setInterval(tick, 1500);
})();
</script>
</body>
</html>
