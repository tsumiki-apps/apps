  // 行き先として形になっているか＝ドメインに「.」と2字以上の末尾がある（`https://fo` は無い）
  var RE_HOST_OK = /^(?:https?:\/\/)?[^\/]*[A-Za-z0-9-]\.[A-Za-z]{2,}(?:[:\/?#]|$)/;
  // 札を出すのは「中身のある値」だけ。◯◯ や ●● のような**例のための印**には出さない
  var RE_REAL = /[A-Za-z0-9ぁ-んァ-ヶー一-龠]/;
  // 合言葉は URL ほど強く削らない。「!」や「.」で終わるパスワードは珍しくないので残す
  var RE_VAL_TRIM = /[,;:'"）」』)\]}]+$/;

  // 合言葉（プロダクトキー）も写せるようにする。拾い方は2つ。
  //  ① 形で拾う＝`TSUMIKI-XXXX-XXXX-XXXX`。大文字と数字のかたまりをハイフンで
  //     3つ以上つないだもの。2つまで（`CLAUDE-CODE` など）は普通の言葉なので拾わない
  //  ② 名前で拾う＝「合言葉：◯◯」「パスワード: ◯◯」のように、名前を付けて渡している値。
  //     こちらは形が決まっていない合言葉（日本語の言葉など）でも拾える。
  //     `key:` `token:` のような普通の英単語は入れない（ログや JSON が札だらけになる）
  var RE_KEY = /[A-Z0-9]{4,}(?:-[A-Z0-9]{4,}){2,}/g;
  //  ③ ハイフンの無い一続きの合言葉＝`SAMPLE47` `SAMPLEKEY7`。お客様にお渡しするのは
  //     たいていこの形で、名前を付けずに書かれることも多い（実画面で12回出ていた）。
  //     ただし**英字だけ・数字だけは弾く**（`APPLESCRIPT` `20030112` が当たってしまう）。
  //     長い並びの一部（URLの中・16進の途中）も弾く＝前後の字を見て判断する
  var RE_KEY_BARE = /[A-Z0-9]{8,12}/g;
  var RE_KEY_EDGE = /[A-Za-z0-9_.\/=-]/;

  // つみきのURLは `https://` を省いて書かれることがある。ここは**行き先を絞る**のが肝で、
  // 「ドメインらしきもの」を拾うと `幅375px.jpeg` の `375px.jp` まで札を付けてしまう（実際に出た）
  var SITE = '(?:[A-Za-z0-9-]+\\.)*(?:tsumiki-apps\\.com|[A-Za-z0-9-]+\\.github\\.io)';
  var RE_SITE = new RegExp(SITE + '(?:/[' + URL_CH + ']*)?', 'g');
  var RE_KEY_HEAD = /^(?:合言葉|あいことば|プロダクトキー|ライセンスキー|パスワード|キー|コード)$/i;
  var KEY_LABEL = '(?:合言葉|あいことば|プロダクトキー|ライセンスキー|パスワード|product key|license key)';
  var VAL_CH = '[^\\s、。「」『』（）()`]+';
  // 囲い方は3通り。Claude は合言葉を `　` で囲んで書くことが多いので、これを外さない
  var QUOTED = '「([^」]+)」|『([^』]+)』|`([^`]+)`';
  var RE_LABELED = new RegExp(
    KEY_LABEL + '\\s*(?:は|が)?\\s*(?:'
      + '[:：=＝]\\s*(?:' + QUOTED + '|(' + VAL_CH + '))'   // 「合言葉：◯◯」
      + '|' + QUOTED                                          // 「合言葉は『◯◯』」
    + ')', 'gi');

  // 「合言葉は SAMPLE47 です」＝区切りの記号も囲いも無い言い方。ここで文章まで拾うと
  // 「パスワードが 間違っています」まで札を付けてしまうので、**半角6字以上のかたまり**に限る
  var RE_LABELED_BARE = new RegExp(KEY_LABEL + '\\s*(?:は|が)\\s+([\\x21-\\x7E]{6,})', 'gi');

  // 囲いが無いときは、値のうしろへ「です」「を」などがくっついてくる。半角の字で
  // 始まっている値なら、全角が出てきたところで切る（日本語そのものの合言葉は切らない）
  function cutAtWide(v) {
    var m = /^[\x21-\x7E]+/.exec(v);
    return m && m[0].length < v.length ? m[0] : v;
  }

  // 「桁いっぱいまで届いた行」の末尾が URL の途中で、次の行がその続きに見えるときだけ繋ぐ。
  // 端末が長い単語を割るときは必ず幅ぴったりまで埋まるので、これが「割られた」印になる。
  // 迷ったら繋がない＝今まで通り行が分かれるだけで、文章が壊れることはない
  // ⚠️ 端末の桁がそのまま折り返し幅とは限らない。**`⎿` の結果の枠はもっと狭い幅**で折り返される。
  // 桁だけを見ていると、この中のURLが切れたまま残る（実画面で7本が切れていた）。
  // そこで「同じ枠の中でいちばん長い行」を、その場の折り返し幅として使う
  function wrapLimits(lines, cols) {
    var lim = [], i, j, end, w;
    for (i = 0; i < lines.length; i++) lim[i] = cols;
    for (i = 0; i < lines.length; i++) {
      if (!/^\s*⎿/.test(lines[i])) continue;
      end = i + 1;                                    // 字下げの続くあいだが1つの枠
      while (end < lines.length && /^\s/.test(lines[end]) && lines[end].trim()) end++;
      for (j = i, w = 0; j < end; j++) w = Math.max(w, dispw(lines[j]));
      for (j = i; j < end; j++) lim[j] = Math.min(cols, w);
      i = end - 1;
    }
    return lim;
  }

  function joinUrlWraps(lines, cols) {
    if (!cols) return lines;
    var lim = wrapLimits(lines, cols);
    var out = [];
    for (var i = 0; i < lines.length; i++) {
      var cur = lines[i];
      var lastW = dispw(lines[i]);
      while (i + 1 < lines.length && lastW >= lim[i] - 1) {
        var tail = RE_URL_TAIL.exec(cur);
        if (!tail || !tail[0]) break;                 // 行末が URL の途中ではない
        var body = lines[i + 1].replace(/^\s+/, '');
        // 次の行が別のかたまりの始まり（⏺ ⎿ ❯ 罫線・空行）なら、続きではない
        if (!body || !RE_URL_HEAD.test(body)) break;
        cur += body;
        lastW = dispw(lines[i + 1]);
        i++;
      }
      out.push(cur);
    }
    return out;
  }

  // 札の絵。写す前は「紙が2枚重なった」印、写したあとはチェック
  var ICON_COPY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"'
    + ' stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
    + '<rect x="9" y="9" width="12" height="12" rx="2"/>'
    + '<path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
  var ICON_DONE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"'
    + ' stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
    + '<polyline points="20 6 9 17 4 12"/></svg>';

  // 写す札を1つ作る。行の中（リンク・合言葉）でも、かたまりの頭でも同じ形を使う
  function makeCopyBtn(what, copy) {
    var b = document.createElement('button');
    b.className = 'lcp';
    b.type = 'button';
    if (copy != null) b.dataset.copy = copy;
    b.dataset.what = what;
    b.title = what + 'をコピー';
    b.setAttribute('aria-label', what + 'をコピー');
    b.innerHTML = ICON_COPY;
    return b;
  }

  // 1行の中から「写せるもの」の場所を全部拾って、前から順に並べて返す
  function findTargets(text) {
    var hits = [], m;
    function push(at, raw, kind) {
      raw = raw.replace(kind === 'url' ? RE_URL_TRIM : RE_VAL_TRIM, '');
      // 中身の無い「例」には札を出さない（説明文の `合言葉：◯◯` に札が付いていた）
      if (kind === 'val' && !RE_REAL.test(raw)) return;
      // 行の端で切れて繋ぎ直せなかったURL（`https://fo` など）には札を出さない。
      // 押しても開けないものを渡すくらいなら、ただの字のままのほうがまし
      if (kind === 'url' && !RE_HOST_OK.test(raw)) return;
      if (raw) hits.push({ i: at, j: at + raw.length, s: raw, k: kind });
    }
    RE_URL.lastIndex = 0;
    while ((m = RE_URL.exec(text))) {
      push(m.index, m[0], 'url');
      RE_URL.lastIndex = m.index + m[0].length;
    }
    RE_KEY.lastIndex = 0;
    while ((m = RE_KEY.exec(text))) push(m.index, m[0], 'val');
    RE_KEY_BARE.lastIndex = 0;
    while ((m = RE_KEY_BARE.exec(text))) {
      var k = m[0];
      if (!/[A-Z]/.test(k) || !/[0-9]/.test(k)) continue;        // 英字だけ・数字だけは合言葉ではない
      if (RE_KEY_EDGE.test(text.charAt(m.index - 1))
          || RE_KEY_EDGE.test(text.charAt(m.index + k.length))) continue;   // 長い並びの一部
      push(m.index, k, 'val');
    }
    RE_SITE.lastIndex = 0;
    while ((m = RE_SITE.exec(text))) {
      // `https://` の途中や、メールアドレスの後半を二重に拾わない
      if (/[A-Za-z0-9._~:\/@-]/.test(text.charAt(m.index - 1))) continue;
      push(m.index, m[0], 'url');
    }
    RE_LABELED.lastIndex = 0;
    while ((m = RE_LABELED.exec(text))) {
      var v = m[1] || m[2] || m[3] || m[5] || m[6] || m[7];   // 囲いの中
      if (!v && m[4]) v = cutAtWide(m[4]);                    // 囲いが無いとき
      if (!v) continue;
      var at = text.indexOf(v, m.index);
      if (at >= 0) push(at, v, 'val');
    }
    RE_LABELED_BARE.lastIndex = 0;
    while ((m = RE_LABELED_BARE.exec(text))) {
      var b = text.indexOf(m[1], m.index);
      if (b >= 0) push(b, m[1], 'val');
    }
    // 前から順に。同じところから始まっていたら長い方を採る（URL の中の
    // 大文字の並びを合言葉と読みちがえる、といった重なりをここで捨てる）
    hits.sort(function (a, b) { return a.i - b.i || b.j - a.j; });
    var out = [], end = 0;
    hits.forEach(function (h) { if (h.i >= end) { out.push(h); end = h.j; } });
    return out;
  }

  // 1行ぶんの文字を「文章＋リンク／合言葉＋写す札」に組み直して足す。
  // asVal＝表の「合言葉」の列など、**中身まるごとが値だと分かっている**とき
  function addText(parent, text, asVal) {
    var hits = findTargets(text);
    if (!hits.length && asVal && text.trim() && RE_REAL.test(text.trim())) {
      hits = [{ i: text.indexOf(text.trim()), j: 0, s: text.trim(), k: 'val' }];
      hits[0].j = hits[0].i + hits[0].s.length;
    }
    if (!hits.length) { parent.appendChild(document.createTextNode(text)); return; }
    var at = 0;
    hits.forEach(function (h) {
      if (h.i > at) parent.appendChild(document.createTextNode(text.slice(at, h.i)));
      var what = h.k === 'url' ? 'リンク' : '合言葉';
      if (h.k === 'url') {
        var a = document.createElement('a');
        a.className = 'lnk';
        // 写す字は見えているまま。開く先だけ `https://` を補う（無いと相対リンクになって開けない）
        a.href = /^https?:\/\//.test(h.s) ? h.s : 'https://' + h.s;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.textContent = h.s;
        parent.appendChild(a);
      } else {
        var v = document.createElement('span');
        v.className = 'val';
        v.textContent = h.s;
        parent.appendChild(v);
      }
      parent.appendChild(makeCopyBtn(what, h.s));
      at = h.j;
    });
    if (at < text.length) parent.appendChild(document.createTextNode(text.slice(at)));
  }

  // ------------------------------- Claude が「どれにしますか」と聞くパネル（2026-08-24）
  //
  // 許可ダイアログ（╭─╮ の角丸の箱）とは**別の作り**。外枠が無く、
  // 「←  ☐ 質問1  ☐ 質問2  ✔ Submit  →」というタブの行で始まる。
  // takeDialog は角丸の箱しか拾わないので、この画面では押せる選択肢が
  // 一つも作られていなかった＝Kodai の「押しても選ばれない」の正体（2026-08-24 実測）。
  //
  // 実機に tmux でキーを送って測った結果：
  //  ・数字キーは**効くときと効かないときがある**。カーソルが自由記述の行
  //    （Type something / Chat about this）に乗っていると、数字はその入力欄に
  //    吸い込まれて選択が動かない。だから数字は使わない。
  //  ・↑↓ はどの行に乗っていても必ず効き、Enter がその行の決定。
  //    ＝画面から「いまカーソルがどこか（❯）」を読み、目当ての行まで動かして Enter。
  //  ・単一選択は Enter でそのまま次の質問へ進む。
  //  ・複数選択は行頭が [ ] で、Enter は入り／切りの切り替え。
  //    最後に**番号の無い「Submit」の行**まで下りて Enter＝確定。
  //  ・全部答えると「Review your answers」の確認画面に変わる（ここも同じ操作）。
  var RE_ASK_TAB  = /^\s*←\s/;
  var RE_ASK_FOOT = /Enter to select|Esc to cancel/;
  var RE_ASK_OPT  = /^(\s*)(❯)?\s*(\d{1,2})\.\s+(?:(\[[^\]]?\])\s*)?(.*)$/;
  var RE_ASK_GO   = /^(\s*)(❯)?\s*Submit\s*$/;
  var RE_ASK_CHK  = /[✔✓xX]/;
  // 端末に出るのは英語のまま。決まり文句だけ日本語に置き換える（形が変わったら原文が出る）
  var ASK_WORDS = {
    'Type something.': '自分の言葉で書く',
    'Type something': '自分の言葉で書く',
    'Chat about this': 'これについて相談する',
    'Submit answers': 'この内容で送る',
    'Cancel': 'やめる',
    'Review your answers': '回答の確認',
    'Ready to submit your answers?': 'この内容で送りますか？',
    '⚠ You have not answered all questions': '⚠ まだ答えていない質問があります'
  };
  function askWord(s) { return ASK_WORDS[s] || ASK_WORDS[s.replace(/\s+$/, '')] || s; }

  // i 行目からパネルが始まっていれば、タブの行・本文・終わりの行番号を返す
  function takeAskPanel(lines, i) {
    if (!RE_ASK_TAB.test(lines[i])) return null;
    // タブの行は、質問が多い／端末が狭いと折り返る。→ が出るまで束ねる
    var tab = lines[i], t = i;
    for (var k = 0; k < 3 && tab.indexOf('→') < 0 && t + 1 < lines.length; k++) tab += ' ' + lines[++t];
    if (tab.indexOf('Submit') < 0) return null;
    var body = [], end = t, foot = false;
    for (var j = t + 1; j < lines.length; j++) {
      if (RE_ASK_FOOT.test(lines[j])) { foot = true; end = j; break; }
      // Claude Code の地の文（⏺ の発言・⎿ の結果）が混じったら、それはパネルではない。
      // 履歴に「←  ☒ … ✔ Submit  →」という**文字列**が流れているだけ（撮った画面を
      // 貼ったときに実際に起きた）。ここで止めないと、後ろ90行を丸ごと飲み込む
      if (RE_SAY.test(lines[j]) || lines[j].indexOf('⎿') >= 0) return null;
      body.push(lines[j]);
      if (body.length > 40) return null;             // 本物のパネルはこんなに長くない
      end = j;
    }
    // 下の案内（「Enter to select · … · Esc」「to cancel」）は2行に割れていることがある
    if (foot) while (end + 1 < lines.length && lines[end + 1].trim() && !RE_ASK_TAB.test(lines[end + 1])
                     && dispw(lines[end + 1]) < 40) end++;
    // 選択肢とプレビューが左右に並ぶ形（2026-08-16 対応ぶん）は、そちらに任せる。
    // ここで丸ごと抱え込むと、右の絵まで飲み込んで前より悪くなる
    for (var m = 0; m < body.length; m++) if (takeSideBySide(body, m)) return null;
    var it = askItems(body);
    if (!it.rows.length) return null;                 // 選べる行が無ければパネルではない
    return { end: end, tab: tab, items: it };
  }

  // 本文を「文章」と「押せる行」に分ける。押せる行は**画面に出ている順**に並べる＝
  // ↑↓ を何回打てばそこへ行けるかが、この並びの差でそのまま出る
  function askItems(body) {
    var rows = [], paras = [], cur = null, para = null, tail = false;
    function flush() { if (para) { paras.push(para); para = null; } }
    body.forEach(function (raw) {
      var s = raw.replace(/^\s*│\s?/, '');           // 質問文に付く左の縦線を落とす
      if (RE_RULE.test(s)) { cur = null; flush(); tail = true; return; }
      if (!s.trim()) { cur = null; flush(); return; }
      var m = RE_ASK_OPT.exec(s);
      if (m) {
        flush();
        rows.push(cur = { k: 'opt', n: m[3], at: !!m[2], box: m[4] || '',
          on: !!m[4] && RE_ASK_CHK.test(m[4]), text: askWord((m[5] || '').trim()),
          desc: '', tail: tail });
        return;
      }
      var g = RE_ASK_GO.exec(s);
      if (g) { flush(); rows.push(cur = { k: 'go', at: !!g[2], text: 'これで決定', desc: '', tail: tail }); return; }
      if (cur) { cur.desc = joinWrapped(cur.desc, s.trim()); return; }
      // 確認画面の「● 質問…」「→ 答え」は別の行として立てる（つなぐと読めなくなる）
      if (para && !/^[●→⚠]/.test(s.trim())) { para = joinWrapped(para, s.trim()); return; }
      flush();
      para = s.trim();
    });
    flush();
    return { rows: rows, paras: paras };
  }

  function askPanelEl(a) {
    var box = document.createElement('div');
    box.className = 'dlg askp';
    // いまカーソルが乗っている行の番号。これが分からないと ↑↓ を何回打つか決められない
    var at = -1;
    a.items.rows.forEach(function (r, k) { if (r.at) at = k; });
    box.dataset.cur = at;

    // 上のタブ＝質問がいくつあって、どこまで答えたか。1問だけのときは出さない
    var chips = [], mm, re = /([☐☒])\s*([^☐☒✔→]+)/g;
    while ((mm = re.exec(a.tab))) chips.push({ on: mm[1] === '☒', t: mm[2].trim() });
    if (chips.length > 1) {
      var tb = document.createElement('div');
      tb.className = 'dtabs';
      chips.forEach(function (c, k) {
        var sp = document.createElement('span');
        if (c.on) sp.className = 'on';
        sp.textContent = (c.on ? '✓ ' : (k + 1) + '. ') + c.t;
        tb.appendChild(sp);
      });
      box.appendChild(tb);
    }

    a.items.paras.forEach(function (t) {
      var p = document.createElement('div');
      p.className = 'dtx';
      addText(p, askWord(t));
      box.appendChild(p);
    });

    var multi = a.items.rows.some(function (r) { return r.k === 'go'; });
    // 「決定（Submit）」の行があるものが複数選べる質問。連打よけの強さをここで変える
    if (multi) box.dataset.multi = '1';
    a.items.rows.forEach(function (r, k) {
      // ⚠️ button ではなく div。押す入口は下のキー行だけ（2026-08-24 やり直し）
      var b = document.createElement('div');
      b.className = 'aopt dopt' + (r.k === 'go' ? ' dgo' : '') + (r.tail ? ' dsub' : '')
        + (r.on ? ' on' : '') + (r.at ? ' cur' : '');
      // mv＝画面に出ている順。いまの ❯ の位置との差が、そのまま ↑↓ の回数になる
      b.dataset.mv = k;
      b.dataset.label = r.text;
      if (r.k === 'go') { b.dataset.go = '1'; b.textContent = r.text; box.appendChild(b); return; }
      b.dataset.num = r.n;                       // キー行の 1〜5 はこの番号で行を引く
      // 番号は**必ず出す**。押す入口がキー行だけになったので、番号が見えないと押せない。
      // 複数選べる質問は行頭がチェック箱に変わるが、そのときも番号を左に添える
      var num = document.createElement('span');
      num.className = 'dnum';
      num.textContent = r.n;
      b.appendChild(num);
      if (r.box) {
        var chk = document.createElement('span');
        chk.className = 'dchk';
        chk.textContent = r.on ? '✓' : '';
        b.appendChild(chk);
      }
      var lab = document.createElement('span');
      lab.className = 'dlab';
      lab.textContent = r.text;
      if (r.desc) {
        var dd = document.createElement('span');
        dd.className = 'ddesc';
        dd.textContent = r.desc;
        lab.appendChild(dd);
      }
      b.appendChild(lab);
      box.appendChild(b);
    });

    // 「答えない」も選べることを、選択肢と同じ形で見せる（2026-09-03）。
    // 番号の行と同じ見た目にしてあるが、番号ではなくキー行の `pause` で送る＝
    // 札の左には番号の代わりに `pause` と入れて、押す場所が分かるようにする。
    // ⚠️ 行そのものは押せない（`#out .askp .dopt{pointer-events:none}`）。
    //    押す入口をキー行に一本化した決まりはここでも崩さない
    var pz = document.createElement('div');
    pz.className = 'dopt dpause';
    var pk = document.createElement('span');
    pk.className = 'dnum dpk';
    pk.textContent = 'pause';
    pz.appendChild(pk);
    var pl = document.createElement('span');
    pl.className = 'dlab';
    pl.textContent = 'いまは答えない（この質問を閉じて止める）';
    var pd = document.createElement('span');
    pd.className = 'ddesc';
    pd.textContent = '席は「中断」になります。あとで続きから話しかけられます';
    pl.appendChild(pd);
    pz.appendChild(pl);
    box.appendChild(pz);

    // 全部答えたあとに出る確認画面（Review your answers）は、案内も別のことを言う
    var review = a.items.paras.some(function (t) { return t.indexOf('Review your answers') === 0; });
    var h = document.createElement('div');
    h.className = 'dhint';
    h.textContent = review
      ? '答えた内容の確認です。下のキー行の番号か ↑↓ ⏎ で選んでください'
      : multi
        ? 'いくつでも選べます。下の番号で入／切りして、最後に「決定」を押してください'
        : '下の番号を押すとその場で選ばれ、次の質問へ進みます';
    // どの場面でも「答えずに止める」道はある。案内の最後にそろえて添える
    h.textContent += '。答えずに止めるなら pause';
    box.appendChild(h);
    return box;
  }

  function renderScreen(text) {
    // 桁数は「取りに行ったとき」に決まるが、起動直後は保存しておいた画面を先に出す＝
    // まだ分かっていない。そのときは今この場で測る（同じ端末・同じ幅なので前回と同じ値になる）
    var cols = paneCols || measureCols();
    var lines = joinUrlWraps(text.split('\n'), cols);
    var frag = document.createDocumentFragment();
    var block = null, cls = '', prev = '';
    var dlgs = [];
    var wide = false;      // 広げたい＝答えを待っている2段組が画面の下にある
    var anySbs = false;    // 2段組が画面のどこかにある（戻すかどうかはこちらで見る）
    for (var i = 0; i < lines.length; i++) {
      // 質問パネル（AskUserQuestion）が先。タブの行で始まるので取り違えは起きない
      var ask = takeAskPanel(lines, i);
      if (ask) {
        block = null; cls = ''; prev = '';
        var ae = askPanelEl(ask);
        frag.appendChild(ae);
        dlgs.push(ae);
        i = ask.end;
        continue;
      }
      var dlg = takeDialog(lines, i);
      if (dlg) {
        // 枠は「かたまり」の外に出す。中で色を塗り直すので、外側の帯に乗せると二重になる。
        // 枠の次の空行に色が伸びないよう、直前の分類も切っておく
        block = null; cls = ''; prev = '';
        var de = dialogEl(dlg);
        frag.appendChild(de);
        dlgs.push(de);
        i = dlg.end;
        continue;
      }
      var sbs = takeSideBySide(lines, i);
      if (sbs) {
        anySbs = true;
        // いま画面に出ている（＝答えを待っている）2段組なら、端末を広げてもらう。
        // 下に付く案内（「Enter to select…」など）ぶんの余裕を見て終わり際かを判断する
        if (sbs.end >= lines.length - 14) wide = true;
        // ダイアログと同じ扱い＝外の帯には乗せない。ここで分類も切っておかないと、
        // 右側の字下げ行を拾ったオレンジがこの後ろまで続いてしまう
        block = null; cls = ''; prev = '';
        var se = sideBySideEl(sbs);
        frag.appendChild(se);
        dlgs.push(se);
        i = sbs.end;
        continue;
      }
      var tbl = takeTable(lines, i);
      if (tbl) {
        // いま塗っているかたまりの中に入れる＝表も「Claude の発言」の一部として
        // 帯が途切れない。表の行は分類にかけない（│ で始まるので、そのままだと
        // 確認ダイアログと同じオレンジに塗られてしまう）
        (block || frag).appendChild(tableEl(tbl.rows));
        i = tbl.end;
        continue;
      }
      if (RE_RULE.test(lines[i])) {
        block = null; cls = ''; prev = '';
        frag.appendChild(document.createElement('div')).className = 'rule';
        continue;
      }
      var c = classify(lines[i], prev) || '';
      if (!block || c !== cls) {
        block = document.createElement('span');
        block.className = 'blk ' + c;
        frag.appendChild(block);
        cls = c;
      }
      addText(block, lines[i] + '\n');
      prev = c;
    }
    // 押せるのは一番下の枠だけ。履歴に残った古い枠まで押せると、
    // 遡って読んでいるつもりが、いまの質問に答えてしまう
    dlgs.forEach(function (de, k) {
      if (k === dlgs.length - 1) return;
      de.classList.add('done');
      // 質問パネルの行は div なので disabled は効かない。そちらは livePanel() が
      // 「done が付いていたら触らない」で守っている（キー行が古い質問を動かさない）
      Array.prototype.forEach.call(de.querySelectorAll('button.dopt'), function (b) { b.disabled = true; });
    });
    el.out.textContent = '';
    el.out.appendChild(frag);
    syncKeys();
    // 広げるのは「答えを待っている2段組が画面の下にある」とき。
    // 戻すのは「2段組が画面から消えた」とき＝左右で条件を変える。
    // 同じ条件で戻すと、広げたせいで行数が変わって条件が外れ、往復になる
    wantWide = sentWide ? anySbs : wide;
  }

  // ------------------------------------------------ この画面に入る「桁数」を測る
  //
  // ターミナルは「半角が何個ぶん」で桁を合わせている。だから Mac 側の端末を
  // この画面に入る桁数まで狭めてやれば、Claude Code は最初から折り返した絵を
  // 描いてくれて、罫線が散らばらない（2026-08-13）。
  // 決め打ちにしないのは、iPhone の機種・横向き・文字サイズで変わるため。
  // 実測する（フォントの読み込み待ちで最初だけズレることがあるので毎回測る）。
  var colProbe = null;
  function measureCols() {
    if (!colProbe) {
      colProbe = document.createElement('span');
      colProbe.setAttribute('aria-hidden', 'true');
      colProbe.style.cssText = 'position:absolute;visibility:hidden;white-space:pre;top:0;left:0';
      colProbe.textContent = new Array(101).join('0');   // 半角100個
    }
    // 描き直すたびに #out は空にされるので、外れていたら入れ直す
    if (colProbe.parentNode !== el.out) el.out.appendChild(colProbe);
    // .blk は左右に padding 8px・margin -4px を持つので、本文が使える幅はその内側
    var per = colProbe.getBoundingClientRect().width / 100;
    // #out の余白は画面の広さで変わる（iPhone 12px / 600px以上 16px）。決め打ちにすると
    // iPad で1桁ぶんずれる。実際の値を読む（2026-08-31）
    var cs = getComputedStyle(el.out);
    var pad = (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0);
    var avail = el.out.clientWidth - pad + 8 - 16;       // #out padding / .blk margin / .blk padding
    if (!(per > 0) || !(avail > 0)) return 0;
    return Math.max(40, Math.min(120, Math.floor(avail / per)));
  }

  // --------------------------------- プレビュー付きの質問のときだけ、端末を広く借りる
  //
  // 選択肢に絵が付く質問は、端末の幅を「左＝選択肢／右＝絵」で山分けする。スマホに
  // 合わせた51桁だと絵の側が15桁ほどしか無く、45桁で描かれた図が Claude Code の中で
  // 折り返されて**こちらに届く前に壊れている**（だから受け取ってから直しようがない）。
  // 実測（2026-08-16）では 120桁にすると絵の側が44桁とれて、図はきれいなまま届く。
  // その44桁はスマホの51桁に収まるので、横スクロールもいらない。
  // 引き換えに、質問の上に出ている文章は120桁で折り返されたものが届く＝画面側でもう一度
  // 折り返されて少し不格好になる。答えた瞬間に元の幅へ戻るので、その間だけの辛抱。
  var WIDE_COLS = 120;
  var wantWide = false;
  // ⚠️ 広げると行数そのものが変わる。だから「広げる条件」と同じ条件で戻すと、
  // 広げた結果その条件が外れて戻り、戻るとまた条件が立って広がる…の往復になる
  // （2026-09-01 点検で判明）。札の乱れは判定側で直したが、tmux は1.5秒ごとに
  // 引き直されたまま＝画面がちらつき続ける。
  // 直しかたは2枚：
  //   ① 広げる条件と戻す条件を変える（下の wantWide の決め方）＝これが本筋
  //   ② それでも動くときのために、切り替えた直後は少し粘る＝下の HOLD
  var WIDE_HOLD_MS = 3000;
  var sentWide = false;    // いま端末を広げてもらっているか（実際に送った側）
  var wideAt = 0;          // 最後に切り替えた時刻

  // この巡回で送る桁数を決める。切り替えたばかりなら据え置く
  function wantedCols() {
    if (wantWide !== sentWide && Date.now() - wideAt >= WIDE_HOLD_MS) {
      sentWide = wantWide;
      wideAt = Date.now();
    }
    return sentWide ? WIDE_COLS : measureCols();
  }
  // いま出ている画面が「何桁で」描かれたものか。URL の折り返しを見分けるのに要る
  var paneCols = 0;

  var lastText = null;
  var touching = false;
  var touchTimer = null;
  el.out.addEventListener('touchstart', function () {
    clearTimeout(touchTimer);
    touching = true;
    // 指を離した合図が来ないことがある（ブラウザに操作を持っていかれたときなど）。
    // そのまま止めっぱなしにすると画面が固まって見えるので、必ず自分で戻す
    touchTimer = setTimeout(function () { touching = false; }, 3000);
  }, { passive: true });
  ['touchend', 'touchcancel'].forEach(function (ev) {
    // 指を離した瞬間ではなく少し待つ。touchend と click のあいだに描き直しが
    // 割り込むと、やはり押したものが消えてしまう
    el.out.addEventListener(ev, function () {
      clearTimeout(touchTimer);
      touchTimer = setTimeout(function () { touching = false; }, 500);
    }, { passive: true });
  });

  function refreshPane(force) {
    if (!current) return Promise.resolve();
    var cols = wantedCols();
    if (cols) paneCols = cols;
    var asked = current;
    return api('/api/pane?name=' + encodeURIComponent(current) + '&lines=400'
      + (cols ? '&cols=' + cols : ''), null, READ_TIMEOUT).then(function (d) {
      // ⚠️ 頼んだ席と、返ってきた席が同じときだけ使う（2026-09-02）。
      // サーバーは席名（d.name）を返しているのに照らし合わせていなかったので、
      // 席を切り替えた直後に古い席あての返事が後から着くと、その中身が
      // **新しい席の画面として**描かれ、写し（panes）にもその名前で入っていた。
      // state と pane を同時に投げるようにした（往復を1回減らす）ぶん、
      // 追い越しは起こりやすくなるので、ここは対で入れる。
      if (!d || d.name !== asked || asked !== current) return;
      var stick = force || atBottom();
      var text = d.text || '(空)';
      // 指を置いているあいだは描き直さない。押そうとしていた札が描き直しで消えると
      // 「押したのに何も起きない」になる。次の取得（2秒後）で追いつく
      if (text !== lastText && !touching) { lastText = text; renderScreen(text); }
      if (stick) el.out.scrollTop = el.out.scrollHeight;
      if (panes[current] !== text) { panes[current] = text; snapDirty = true; }
      saveSnap();
    });
  }

  // force = 初回・復帰・送信直後。定期ポーリングだけ「見えているとき」に絞る
  // 走っている巡回の開始時刻（0＝走っていない）。
  // ⚠️ 前の巡回が終わる前に次を投げない（2026-09-02）。届かない相手に1.5秒ごとに
  // 投げ足すと、詰まったときに要求が積み上がって Mac 側の呼び出しも増える。
  // ただし、万一この印を戻し損ねると**巡回が二度と走らない**＝出先で手も足も出ない。
  // それが一番こわいので、TICK_STUCK_MS を過ぎたものは見捨てて新しく始める。
  var tickAt = 0;
  var TICK_STUCK_MS = 15000;
  // 時刻合わせ（NTP）で巻き戻らない時計。逃げ道の15秒がそのぶん延びないように
  function perfNow() {
    return (window.performance && performance.now) ? performance.now() + 1 : Date.now();
  }

  function tick(force) {
    if (document.hidden && force !== true) return;
    // ⚠️ 「見に行け」と言われた巡回（復帰・送信の直後・席を作った直後）は捨てない。
    // 休むのは1.5秒ごとの定期巡回だけ。ここで force まで捨てると、出先で表に戻しても
    // 何も起きない時間ができる（2026-09-02 レビュー指摘）
    if (force !== true && tickAt && perfNow() - tickAt < TICK_STUCK_MS) return;
    var mine = perfNow();
    tickAt = mine;
    var release = function () { if (tickAt === mine) tickAt = 0; };
    // ⚠️ 「届きません」の帯を出すのは、状態の取得（/api/state）そのものが失敗したときだけ。
    // 画面の取得（/api/pane）だけが失敗する場面（席を終わらせた直後の 404 など）は
    // Mac には届いているので、帯を出して送信ボタンまで止めるのは言い過ぎになる
    // （帯が出ている間は押せない作りにしたため。2026-09-02）
    var stateOk = false, paneOk = false;
    var p;
    if (!current || !everSynced) {
      // 初回（と席が決まっていないとき）だけ順番に。どの席の画面を取ればよいかが
      // state を受け取るまで決まらないため
      p = Promise.resolve().then(refreshState)
        .then(function () { stateOk = true; everSynced = true; return refreshPane(); })
        .then(function () { paneOk = true; });
    } else {
      // 2回目からは**同時に投げる**（2026-09-02）。これまでは
      // refreshState().then(refreshPane) と直列で、1.5秒の巡回ごとに
      // 往復が1回ぶん余計に積まれていた。Tailscale+LTE の往復を60〜150msとすると、
      // 毎周期それだけ縮む（往復を0にはできないので、消えるのは1回ぶん）。
      // ⚠️ state が current を差し替えた周期は pane が1周ずれるので、
      //    refreshPane 側で席名を照らし合わせて捨てている
      // ⚠️ どちらも Promise.resolve() を挟む。中で同期に例外が出ても tick ごと
      // 落ちないようにするため（落ちると tickAt が戻らず、巡回が15秒に1回になる）
      var ps = Promise.resolve().then(refreshState).then(function () { stateOk = true; everSynced = true; });
      // pp を待ってから ps を見る作りなので、その隙に ps の失敗が「拾われていない」
      // 扱いになる。ここで一度受けておく（本来の失敗は下の p で拾う）
      ps.catch(function () {});
      // 先に失敗しても「拾われていない失敗」にしないため、その場で受けておく。
      // Promise.resolve() を挟むのは、refreshPane の中の画面計測が同期で投げても
      // tick ごと落ちないようにするため（そうなると ps が拾われない失敗になる）
      var paneErr = null;
      var pp = Promise.resolve().then(refreshPane)
        .then(function () { paneOk = true; })
        .catch(function (e) { paneErr = e; });
      // ⚠️ 画面（pp）のほうを先に待ち切る。state が先に失敗したときに pp を待たずに
      // 失敗の処理へ行くと、「画面は取れているか」が分からないまま帯を出してしまう
      // （pp は必ず成功するように書いてあるので、ここで詰まることはない）
      p = pp.then(function () { return ps; }).then(function () { if (paneErr) throw paneErr; });
    }
    p
      .catch(function (e) {
        if (e.message === 'unauthorized') return;
        if (stateOk) { showCachedPane(); return; }
        setConn('err', 'つながりません');
        // ⚠️ 画面（/api/pane）は取れているのに帯を出すと嘘になる（2026-09-02）。
        // 同時投げにしたので「一覧だけ落ちて画面は新しい」が起こりうる。そのときは
        // 緑の点だけ赤にして、「◯時時点の内容です」は出さない（実際は今の内容なので）
        if (paneOk) return;
        // 届かないあいだは、残してある最後の内容を出したままにする。
        // 消して真っ白にするより、「いつの内容か」を言い添えて見せる方がいい
        setOffline(true);
        showCachedPane();
      })
      .then(release, release);
  }

  // 送ったあと、画面を取りに行くタイミング（2026-09-02 に実測して短くした）。
  //
  // 実測：/api/send が返ってから tmux が画面に出すまでは **約10ms**（送信の往復こみで
  // 中央値29ms）。それを 250ms 待っていたので、240ms はまるまる余分だった。
  // ただし Claude Code 側の描き直しはもっと遅いことがあるので、1回では取りこぼす。
  // **早い1回＋保険の2回**にして、取りこぼしても次の巡回（1.5秒）を待たなくて済むようにする。
  // ここは押した直後＝いちばん見ている時間なので、通信が3回になっても構わない
  // （ふだんの巡回間隔は 1.5秒のまま。そちらを縮めると Mac 側の呼び出しが常時増える）。
  // ⚠️ 早い2回は**画面だけ**取り直す（/api/state は取らない）。札の色や残量は
  // 次の巡回で足りるのに、毎回いっしょに取ると席の数だけ tmux が余分に起きる
  // （1周期あたり 2N+3 本のうち、2N 側がまるごとムダになる）。
  // 最後の1回だけ、札と帯もそろえるために普通の巡回にする。
  var LOOK_PANE = [120, 450];
  var LOOK_FULL = 1000;
  function lookAgain() {
    LOOK_PANE.forEach(function (ms) {
      setTimeout(function () {
        if (document.hidden) return;
        refreshPane().catch(function () { /* 次の巡回が拾う */ });
      }, ms);
    });
    setTimeout(function () { tick(true); }, LOOK_FULL);
  }

  // 送り先が無いときに黙って何もしないと、「押しても画面が全く変わらない」に
  // なって原因が分からない。効かないなら効かないと言う（2026-08-12）
  //
  // ⚠️ 失敗を握りつぶさない（2026-09-02）。以前はここで catch してトーストを出すだけの
  // 「成功した Promise」を返していたので、呼び出し元は送れたのか失敗したのかを知れず、
  // 送信ボタンは書きかけを戻せなかった。トーストは今までどおり出したうえで投げ直す。
  // 失敗を気にしない呼び出し元（キー行・ダイアログ）は .catch で受け流している。
  function sendText(text, enter) {
    if (!current) { toast('送り先が選ばれていません'); return Promise.reject(new Error('送り先なし')); }
    return api('/api/send', {
      method: 'POST',
      body: JSON.stringify({ name: current, text: text, enter: !!enter })
    }).then(lookAgain)
      .catch(function (e) { toast('送信失敗: ' + e.message); throw e; });
  }

  // 中断の札を Mac 側に立てる／降ろす。画面の字だけに頼らないための口。
  // ⚠️ 立てるのは「送れた」あと。`/api/send` は札を降ろす作りなので、
  //    言葉で止めるときに先に立てると、そのすぐあとの送信で降ろされてしまう
  function markPause(name, on) {
    if (!name) return Promise.resolve();
    return api('/api/pause', { method: 'POST', body: JSON.stringify({ name: name, on: !!on }) })
      // 札が立たなくても、止める操作そのものは通っている。ここは黙って流す
      .catch(function () {});
  }

  function sendKey(key) {
    if (!current) return toast('送り先が選ばれていません');
    return api('/api/key', { method: 'POST', body: JSON.stringify({ name: current, key: key }) })
      // 何回か見に行く。1回だけだと、↑↓ で ❯ が動いた結果が次の巡回（1.5秒後）まで
      // 画面に出ず「効かなかった」ように見える
      .then(lookAgain)
      .catch(function (e) { toast('送信失敗: ' + e.message); });
  }

  // キーを順番に送る。質問パネルの「↓を3回打って Enter」のように、
  // 何回か動かしてから決める操作に使う。まとめて投げると tmux が取りこぼすので1つずつ
  function sendKeys(list) {
    if (!current) return toast('送り先が選ばれていません');
    return list.reduce(function (p, k) {
      return p.then(function () {
        return api('/api/key', { method: 'POST', body: JSON.stringify({ name: current, key: k }) });
      });
    }, Promise.resolve())
      // 端末が描き直すのを待って何回か取りに行く。1回だけだと、押した結果が
      // 次の巡回（1.5秒後）まで画面に出ず「効かなかった」ように見える
      .then(lookAgain)
      // 失敗はトーストで出したうえで投げ直す（呼び出し元が連打よけを外せるように）
      .catch(function (e) { toast('送信失敗: ' + e.message); throw e; });
  }

  // 添えた画像（札）。送信の瞬間に「パス + 半角スペース + 本文」に組み立てる
  var atts = [];

  // 入力欄の高さを中身に合わせる。改行のぶんだけ伸びて、5行で止まる（LINE と同じ）。
  //
  // ⚠️ この画面は * { box-sizing:border-box }。scrollHeight には枠線が入らないのに
  // height には入るので、そのまま入れると毎回2px ずつ縮んでいく。枠線ぶんを足す。
  // いったん auto に戻すのは、消したときに縮められるようにするため。
  function autoGrow() {
    el.cmd.style.height = 'auto';
    el.cmd.style.height = (el.cmd.scrollHeight + 2) + 'px';
  }
  el.cmd.addEventListener('input', autoGrow);

  // ⚠️ 入力欄は「送れたと分かる前」に空にする＝押した手応えはそのまま残す。
  // そのかわり、失敗したら書きかけを**必ず戻す**（2026-09-02）。
  // 以前は空にして投げっぱなしで、電波が切れかけ・500・合言葉切れのどれでも
  // 1.6秒のトーストが出るだけ。長々書いた指示がどこにも残らず、書き直すしかなかった
  // （打つたびの自動保存は無く、saveDraft は版の入れ替えと ↻ のときだけ走る）。
  el.send.onclick = function () {
    var v = el.cmd.value.trim();
    if (atts.some(function (a) { return !a.path; })) return toast('ファイルを置いている途中です');
    var paths = atts.map(function (a) { return a.path; }).join(' ');
    var text = paths ? (v ? paths + ' ' + v : paths) : v;
    if (!text) return;
    var keepText = el.cmd.value, keepAtts = atts;
    el.cmd.value = '';
    autoGrow();                 // 1行に戻す
    atts = [];
    renderAtts();
    sendText(text, true).catch(function (e) {
      // 書いている途中に戻ってきたときは、いま打っている字を消さない
      var back = false;
      if (!el.cmd.value) { el.cmd.value = keepText; autoGrow(); back = true; }
      if (!atts.length) { atts = keepAtts; renderAtts(); }
      // ⚠️ トーストは1枠しかない（後から出したものが前を塗り潰す）。理由を混ぜないと
      // 「本文が大きすぎます」も「MacBook に届きません」も一度も読めなくなる
      toast(back
        ? '送信できませんでした（' + e.message + '）。書いた文は戻しました'
        : '送信できませんでした（' + e.message + '）', 3600);
    });
  };
  // 外付けキーボード（iPad の Magic Keyboard・Mac）だけの近道＝⌘Enter / Ctrl+Enter で送る。
  // Enter 単体は改行のまま（下のコメントのとおり、変換確定で飛んでいくため）。
  // 変換中（isComposing / keyCode 229）は何もしない＝確定の Enter と重ならない。
  // 指で使う画面の見た目は何も変わらない（キーボードが無ければ存在しないのと同じ）。
  el.cmd.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' || e.isComposing || e.keyCode === 229) return;
    if (!e.metaKey && !e.ctrlKey) return;
    e.preventDefault();
    if (!el.send.disabled) el.send.click();
  });

  // Enter は改行。送信は右の↑だけ（2026-08-13）。
  // 送信を Enter に持たせると、日本語の変換確定でも送信が走る＝書きかけが
  // 飛んでいく。改行を入れたいという要望と、この誤送信の両方がこれで消える。
  // クイックキーの ⏎ は別物（ターミナルに Enter を押す機能）なので残す。

  // --------------------------------------- キー行が、質問パネルのときだけ振る舞いを変える
  //
  // Claude の質問パネル（AskUserQuestion）で **数字キーはあてにならない**。カーソルが
  // 自由記述の行（自分の言葉で書く／これについて相談する）に乗っていると、数字はその
  // 入力欄に吸い込まれて選択が動かない（2026-08-24 実機で計測）。↑↓ はどこに乗っていても
  // 必ず効く。だから質問パネルが出ているあいだは、キー行の 1〜5 を
  // 「文字の 1 を送る」から「❯ の位置から目当ての行まで ↑↓ ＋ Enter」に切り替える。
  //
  // 押す入口をキー行ひとつに絞ってあるのは意図的（2026-08-24 やり直し）。パネルの中も
  // 押せるようにすると、キー行の 1〜5 が「あってもなくても同じ」になり、どちらが正しい
  // 入口なのか分からなくなる。パネルは読むためのもの、選ぶのはキー行。

  // いま答えを待っている質問パネル。履歴に流れた古いものは done が付くので触らない
  function livePanel() {
    var ps = el.out.querySelectorAll('.askp');
    if (!ps.length) return null;
    var p = ps[ps.length - 1];
    return p.classList.contains('done') ? null : p;
  }

  // いま答えを待っている枠。質問パネル（.askp）と許可ダイアログ（角丸の箱）の
  // どちらも `.dlg` を持っている。**枠が出ているあいだは言葉を送らない**ための目印で、
  // 枠に文字を打ち込むと、選ぶどころか枠の中の入力欄に吸い込まれる
  function liveBox() {
    var ds = el.out.querySelectorAll('.dlg');
    if (!ds.length) return null;
    var d = ds[ds.length - 1];
    return d.classList.contains('done') ? null : d;
  }

  // 同じ選択肢の二度押しよけ（2026-09-02）。
  //
  // 押しても画面が新しくなるのは 0.6〜1.5秒あと。その間に**同じ番号**をもう一度押すと、
  // askMove は位置（dataset.cur）を更新済みなので移動キーは走らず、**Enter だけ**が
  // もう1本飛ぶ。一本目で質問が閉じていれば、その Enter は**次の質問の既定の行を
  // 勝手に決めてしまう**（取り消せない）。許可ダイアログの二度押しも、閉じたあとの
  // 素のプロンプトに「2」という一言を送ってしまう。
  //
  // ⚠️ 強さは質問の種類で変える（2026-09-02 レビューで組み替えた）。
  //
  // ・**1つだけ選ぶ質問**＝1回押したら、その枠では**どの番号も**押せなくする。
  //   一本目の Enter で質問が閉じたあと、違う番号を押すと ↑↓ と Enter が
  //   **素のプロンプト**に飛ぶ。Claude Code の入力欄で ↑↓ は履歴めくりなので、
  //   これは「2」という一言を送るより悪く、**前に打った指示をそのまま再送信**しうる。
  // ・**複数選べる質問**（「決定」の行があるもの）＝止めない。1→2→3 と続けて押すのも、
  //   同じ番号をもう一度押して**チェックを外す**のも正規の操作で、枠は閉じないため。
  //
  // 枠は画面を描き直すたびに作り直されるので、次の巡回で自然に解ける。
  // 画面が動かないまま固まったときのために、時間でも解けるようにしてある。
  var lastPick = null;                 // { panel: 枠, mv: 行, at: 時刻 }
  var PICK_LOCK_MS = 4000;

  function pickedTwice(panel, to) {
    if (!lastPick || lastPick.panel !== panel) return false;
    if (Date.now() - lastPick.at > PICK_LOCK_MS) return false;
    // 複数選べる質問は、同じ行の押し直し（＝チェックを外す）も含めて通す
    if (panel.dataset.multi === '1') return false;
    return true;
  }

  // その行まで ❯ を歩かせて Enter。位置で決めるので、入力欄に焦点があっても外さない
  function askMove(panel, row) {
    var from = parseInt(panel.dataset.cur, 10);
    var to = parseInt(row.dataset.mv, 10);
    if (isNaN(from) || from < 0) return toast('いまどこが選ばれているか読めません。Mac 側で操作してください', 3600);
    if (pickedTwice(panel, to)) {
      return toast('さっき選んだぶんを送っています。画面が変わるまでお待ちください', 2600);
    }
    var keys = [];
    for (var n = Math.abs(to - from); n > 0; n--) keys.push(to > from ? 'Down' : 'Up');
    keys.push('Enter');
    panel.dataset.cur = to;            // 送った直後の位置。次に画面を取れば本物に直る
    lastPick = { panel: panel, mv: to, at: Date.now() };
    // ⚠️ 送れなかったなら錠を外す。外さないと、圏外で1回押しただけで4秒間
    // 押し直せず、しかも「送っています」と嘘を言うことになる
    sendKeys(keys).catch(function () { lastPick = null; });
    toast('「' + (row.dataset.label || '') + '」を押しました');
  }

  // キー行を、いま出ている画面に合わせる。描き直すたびに呼ぶ
  function syncKeys() {
    var p = livePanel();
    el.kgo.hidden = !(p && p.querySelector('[data-go]'));
    Array.prototype.forEach.call(el.keys.querySelectorAll('button[data-text]'), function (b) {
      var dead = !!p && !p.querySelector('.aopt[data-num="' + b.dataset.text + '"]');
      if (dead) b.classList.add('off'); else b.classList.remove('off');
    });
    // 止める札は「動いている／聞かれている」ときだけ意味がある。待機の席では沈める
    // （押せなくはしない＝入力欄の書きかけを消す使い道は残る）
    var cur = sessions.filter(function (s) { return s.name === current; })[0];
    var st = cur ? statusOf(cur) : '';
    if (st && st !== 'idle') el.kpause.classList.remove('off'); else el.kpause.classList.add('off');
    // 戻す札は**中断の席にだけ**出す（「決定」と同じ考えかた）。いつでも出ていると
    // 「押したら何が起きるのか」が場面ごとに変わってしまい、札の意味が薄くなる
    el.kresume.hidden = st !== 'paused';
  }

  el.keys.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    var p = livePanel();
    if (b === el.kgo) {
      var go = p && p.querySelector('[data-go]');
      if (!go) return toast('いまは「決定」を押す場面ではありません');
      return askMove(p, go);
    }
    // 止める札。やることは1つ＝「止めて」と伝えること。ただし伝わる道が2つある。
    //  ・動いている最中／質問の枠が出ている／素のシェル → **キー**（esc）で止まる
    //  ・番号で聞かれている最中 → esc では**何も起きない**。Claude はもう入力待ちで
    //    止まっていて、押しても画面が変わらない＝「押したのに効かない」に見える。
    //    ここは **言葉**（`pause`）で伝える。受け取った Claude は手を止めて
    //    「⏸ 中断しました」と書く（共通ルール ~/.claude/CLAUDE.md で決めてある）
    // ⚠️ 素のシェルに言葉を送らないこと。`pause` が**コマンドとして走る**
    if (b === el.kpause) {
      var pcur = sessions.filter(function (s) { return s.name === current; })[0];
      var pst = pcur ? statusOf(pcur) : '';
      if (current) pauseWish = { name: current, at: Date.now() };
      renderTabs();                    // 縁を先に出す。Mac の返事は1〜2秒あとに来る
      var pname = current;
      if (!pcur || pcur.kind !== 'claude' || pst === 'busy' || liveBox()) {
        // キーの道。`/api/key` は札に触らないので、先に立ててよい。
        // ⚠️ 素のシェルには札を立てない。esc はほぼ何も起こさないので、
        //    「中断のまま」と出し続けるのは嘘になる
        if (pcur && pcur.kind === 'claude') markPause(pname, true);
        sendKey('Escape');
        return toast('pause を送りました。いまの作業を止めます');
      }
      // 言葉の道。送信が札を降ろすので、送れてから立てる
      sendText('pause', true).then(function () { markPause(pname, true); }, function () {});
      return toast('pause と伝えました。ここで止まります');
    }
    // 戻す札。止まっている席に「続けて」と一言送るだけ＝会話の続きから動き出す。
    // ⚠️ キーではなく**本文**を送る。esc で止めた席は素のプロンプトに戻っていて、
    //    キーを送っても何も起きない（Enter は空送信になる）
    // 戻す札。文字を送ると Mac 側が中断の札を降ろす（`/api/send`）ので、
    // ここでわざわざ降ろしに行かなくてよい
    if (b === el.kresume) {
      pauseWish = null;
      sendText(RESUME_WORD, true).then(function () { renderTabs(); }, function () {});
      return toast('resume を送りました。続きから動き出します');
    }
    if (b.dataset.key) return sendKey(b.dataset.key);
    if (!b.dataset.text) return;
    if (p) {
      var row = p.querySelector('.aopt[data-num="' + b.dataset.text + '"]');
      if (!row) return toast(b.dataset.text + ' の選択肢はありません');
      return askMove(p, row);
    }
    // 失敗はトーストで出るので、ここでは受け流す（送信ボタンと違い戻す本文が無い）
    sendText(b.dataset.text, b.dataset.enter === '1').catch(function () {});
  });

  // 許可ダイアログ（╭─╮ の角丸の箱）の項目は、これまでどおり押せる。
  // こちらは数字がそのまま効く画面なので、押す＝その番号を送るで確実に通る
  el.out.addEventListener('click', function (e) {
    var b = e.target.closest('.dopt');
    if (!b || b.disabled || b.classList.contains('aopt')) return;
    // 押したら**その枠ごと**押せなくする（2026-09-02）。画面が新しくなるのは
    // 0.6〜1.5秒あとなので、それまでに二度押しすると、閉じたあとの素のプロンプトに
    // 番号がもう1回飛ぶ＝Claude に「2」という一言を送ってしまう。
    // ⚠️ 押したボタンだけ止めても足りない。許可ダイアログは**必ず1つだけ選ぶ**もので、
    //    「1」の直後に「2」を押せば同じ事故が別のボタンで起きる。
    // 見た目は「答え終わった枠」と同じ薄さになる（`.dopt[disabled]`）ので、
    // 押せなくなったことが目で分かる。枠は次の描き直しで作り直される
    var box = b.closest('.dlg') || b.parentElement;
    var opts = Array.prototype.slice.call(box.querySelectorAll('.dopt'));
    var lock = function (on) { opts.forEach(function (x) { x.disabled = on; }); };
    lock(true);
    // 画面がまったく動かないまま終わることもあるので、時間でも解けるようにする
    // （キー行の 1〜5 や入力欄からは打てるが、ここだけ灰色のまま残るのは不親切）
    var unlock = setTimeout(function () { lock(false); }, PICK_LOCK_MS);
    sendText(b.dataset.opt, true).catch(function () {
      clearTimeout(unlock);
      lock(false);          // 送れなかったなら、もう一度押せるように戻す
    });
    toast(b.dataset.opt + '「' + (b.dataset.label || '') + '」を選びました');
  });

  // ------------------------------------------------ クリップボードへ写す
  //
  // iPhone は「どう開いているか」で通る道が変わる。https（Tailscale の名前）なら
  // 正式な口（navigator.clipboard）が使えるが、http（Tailscale の IP）だとそもそも
  // 無い。ホーム画面から起動したPWAでは正式な口が黙って空振りすることもある。
  // どちらか片方に賭けると「押したのに何も写らない」になるので、両方やる（2026-08-24）。

  // 昔ながらの道＝見えない入力欄に字を入れて、選んで、写す。
  // ⚠️ opacity:0 や 1px 四方に潰すと iOS は「見えていない」と見なして選択してくれない。
  //    画面の外へ出すだけにする（潰していたのが、写らなかった原因のひとつ）
  function legacyCopy(s) {
    // ⚠️ 下で画面外の入力欄に focus する＝書きかけの入力欄から焦点が外れ、
    // iOS はキーボードを畳んでしまう（書いている途中でコピー札を押しただけで
    // 打てなくなる。2026-09-01 点検で判明）。どこにいたかを覚えて、あとで戻す
    var back = document.activeElement;
    var backStart = null, backEnd = null;
    try {
      if (back && typeof back.selectionStart === 'number') {
        backStart = back.selectionStart; backEnd = back.selectionEnd;
      }
    } catch (e) { back = null; }

    var ta = document.createElement('textarea');
    ta.value = s;
    ta.setAttribute('readonly', '');    // キーボードを出さない
    ta.contentEditable = 'true';        // iOS はこれが無いと選ばせてくれない
    ta.style.cssText = 'position:absolute;left:-9999px;top:'
      + (window.pageYOffset || 0) + 'px;width:6em;height:3em;padding:0;border:0;'
      + 'outline:0;box-shadow:none;background:transparent;font-size:16px';
    document.body.appendChild(ta);
    var ok = false;
    try {
      var range = document.createRange();
      range.selectNodeContents(ta);
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      try { ta.focus({ preventScroll: true }); } catch (e2) { ta.focus(); }
      ta.setSelectionRange(0, s.length);
      ok = document.execCommand('copy');
      sel.removeAllRanges();
    } catch (e) { ok = false; }
    document.body.removeChild(ta);
    // 元いた場所に指を戻す。カーソルの位置（書きかけのどこにいたか）も戻す
    if (back && back !== document.body && typeof back.focus === 'function') {
      try { back.focus({ preventScroll: true }); } catch (e) { try { back.focus(); } catch (e2) {} }
      if (backStart !== null) {
        try { back.setSelectionRange(backStart, backEnd); } catch (e) {}
      }
    }
    return ok;
  }

  function copyText(s) {
    if (!s) return Promise.reject(new Error('コピーするものがありません'));
    var ok = legacyCopy(s);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(s).catch(function (e) {
        if (ok) return;                 // 片方が通っていればそれでいい
        throw e;
      });
    }
    return ok ? Promise.resolve() : Promise.reject(new Error('コピーできません'));
  }

  // どうしても写せなかったとき用。その字を「選んだ状態」にしておく＝
  // 長押しで iOS の「コピー」を出せば取れる。何も起きないよりはるかにまし
  function selectNode(node) {
    if (!node || node.nodeType !== 1) return false;
    try {
      var range = document.createRange();
      range.selectNodeContents(node);
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      return true;
    } catch (e) { return false; }
  }

  // URL の横の札。写したら、押した札そのものがチェックに変わる＝
  // どのリンクを取ったのかが分かる（言い添えだけだと取り違えに気づけない）
  el.out.addEventListener('click', function (e) {
    var b = e.target.closest('.lcp');
    if (!b) return;
    // 逃げ道で選ぶ相手＝直前のリンク／合言葉
    var link = b.previousSibling;
    copyText(b.dataset.copy || '').then(function () {
      b.classList.add('done');
      b.innerHTML = ICON_DONE;
      toast((b.dataset.what || '') + 'をコピーしました');
      setTimeout(function () {
        b.classList.remove('done');
        b.innerHTML = ICON_COPY;
      }, 2000);
    }, function () {
      if (selectNode(link)) toast('選んであります。長押しして「コピー」を選んでください', 3600);
      else toast('コピーできませんでした', 2600);
    });
  });

  el.tokenSave.onclick = function () {
    token = el.tokenInput.value.trim();
    localStorage.setItem(LS, token);
    gate(false);
    tick(true);
  };

  // 画像を送る。Claude Code は画像そのものを受け取れないので、Mac に置いてから
  // 「そのファイルの場所」を文章の先頭に付けて送る。ただしパスは入力欄には入れず、
  // 入力欄の上の「札」として持つ（理由は #atts の CSS のところ）。
  // 文章を足してから送れるよう、勝手に送信はしない。
  var pickBtn = document.getElementById('pick');
  var fileInput = document.getElementById('file');
  var attsBox = document.getElementById('atts');
  var attSeq = 0;
  // 1件あたりの上限。PDF は写真より重くなりがちなので 20MB まで見る
  // （サーバー側の /api/upload と揃えること）
  var MAX_ATT = 20 * 1024 * 1024;

  pickBtn.onclick = function () { fileInput.click(); };

  function renderAtts() {
    attsBox.innerHTML = '';
    attsBox.hidden = !atts.length;
    atts.forEach(function (a) {
      var box = document.createElement('span');
      box.className = 'att' + (a.path ? '' : ' up');   // 置いている最中は薄く
      if (a.name) box.title = a.name;
      if (a.thumb) {
        var img = document.createElement('img');
        img.src = a.thumb;
        img.alt = a.name || '添えたファイル';
        box.appendChild(img);
      } else {
        // PDF は見本の絵を作れない（この画面では開けない）。何を添えたかは
        // 種類の絵で示す。置いている最中だけ「…」
        var ph = document.createElement('span');
        ph.className = 'ph';
        ph.textContent = a.path ? (a.kind === 'pdf' ? '📄' : '🖼') : '…';
        box.appendChild(ph);
      }
      var x = document.createElement('button');
      x.textContent = '✕';
      x.setAttribute('aria-label', '添えたものを取り消す');
      x.onclick = function () {
        atts = atts.filter(function (b) { return b.id !== a.id; });
        renderAtts();
      };
      box.appendChild(x);
      attsBox.appendChild(box);
    });
  }

  // 札に出す小さな画像を作る。元の写真そのままだと数MBあり、
  // 書きかけの預け先（localStorage）にも入らないし、スマホでは重い
  function makeThumb(dataUrl, cb) {
    var img = new Image();
    img.onerror = function () { cb(''); };
    img.onload = function () {
      try {
        var s = Math.min(1, 120 / Math.max(img.width, img.height));
        var c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.width * s));
        c.height = Math.max(1, Math.round(img.height * s));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        cb(c.toDataURL('image/jpeg', 0.6));
      } catch (e) { cb(''); }   // HEIC など、この端末で開けない形式
    };
    img.src = dataUrl;
  }

  // 1件を読み込んで Mac に置く。終わったら done(置けたか) を呼ぶ
  function putOne(a, f, done) {
    var reader = new FileReader();
    reader.onerror = function () { drop(); toast('読み込めませんでした'); done(false); };
    reader.onload = function () {
      var dataUrl = String(reader.result);
      var base64 = dataUrl.split(',')[1] || '';
      // PDF はこの画面では絵にできないので見本を作らない（作ろうとすると
      // 読み込み失敗の待ち時間だけ増える）
      if (a.kind === 'pdf') renderAtts();
      else makeThumb(dataUrl, function (t) { a.thumb = t; renderAtts(); });

      api('/api/upload', { method: 'POST', body: JSON.stringify({ data: base64 }) })
        .then(function (d) {
          // 置いている間に ✕ で取り消されていたら、そのまま捨てる
          if (!alive()) return done(false);
          a.path = d.path;
          renderAtts();
          done(true);
        })
        .catch(function (e) {
          drop();
          toast('送れません: ' + e.message);
          done(false);
        });
    };
    reader.readAsDataURL(f);

    function alive() { return atts.some(function (b) { return b.id === a.id; }); }
    function drop() {
      atts = atts.filter(function (b) { return b.id !== a.id; });
      renderAtts();
    }
  }

  // まとめて選べる。ただし読み込みも送りも1枚ずつ順番にやる（同時にやると
  // 数MBの写真が何枚もメモリに乗って、スマホのブラウザが落ちる）。
  // 札は選んだ瞬間に全部並べて、置き終わったものから薄いのが消えていく
  fileInput.onchange = function () {
    var files = Array.prototype.slice.call(fileInput.files || []);
    fileInput.value = '';
    if (!files.length || !current) return;

    var over = files.filter(function (f) { return f.size > MAX_ATT; }).length;
    files = files.filter(function (f) { return f.size <= MAX_ATT; });
    if (!files.length) {
      if (over) toast(over + '件は20MBを超えるので外しました', 3000);
      return;
    }

    var queue = files.map(function (f) {
      var pdf = f.type === 'application/pdf' || /\.pdf$/i.test(f.name || '');
      var a = { id: ++attSeq, path: '', thumb: '', kind: pdf ? 'pdf' : 'img',
                name: f.name || '' };
      atts.push(a);
      return { a: a, f: f };
    });
    renderAtts();

    var ok = 0;
    (function next(i) {
      if (i >= queue.length) {
        // 外したものは最後の1行にまとめて出す。先に別のトーストで出しても、
        // 置き終わりの知らせで上書きされて読めない（2026-08-31）
        var dropped = over ? '（20MB超の' + over + '件は外しました）' : '';
        if (ok) toast(ok + '件 添えました。指示を書いて送信' + dropped, dropped ? 3600 : 2200);
        else if (dropped) toast(over + '件は20MBを超えるので外しました', 3000);
        return;
      }
      var q = queue[i];
      // 待っている間に ✕ で取り消されていたら飛ばす
      if (!atts.some(function (b) { return b.id === q.a.id; })) return next(i + 1);
      putOne(q.a, q.f, function (good) { if (good) ok++; next(i + 1); });
    })(0);
  };

  // 終わらせる = tmux ごと消す。作業場所の後始末はこれ1つだけ（戻せない）。
  // 「隠すだけ」も持っていた時期があるが、隠れたまま席を占め続けて満席になった
  function doKill(name) {
    api('/api/kill', { method: 'POST', body: JSON.stringify({ name: name }) })
      .then(function () {
        toast(name + ' を終わらせました');
        if (current === name) {
          current = '';
          localStorage.removeItem('tsumiki-remote-session');
        }
        tick(true);
      })
      .catch(function (e) { toast('終わらせられません: ' + e.message); });
  }

  // 選ばれている札をもう一度タップしたときのメニュー。⋯（右上）まで行かずに、
  // いま目の前にある1件をその場で片付けるための入口。
  // 中身は必ず「今の一覧」から引き直す（札は1.5秒ごとに作り直されるが、
  // 押した瞬間の状態＝作業中/返答待ちで判断したい）
  function sessionMenu(name) {
    var s = null, i = -1;
    sessions.forEach(function (x, k) { if (x.name === name) { s = x; i = k; } });
    if (!s) return;
    openSheet((i + 1) + '・' + (s.title || s.name));

    var head = document.createElement('div');
    head.className = 'sheethead';
    // ここは幅に余裕があるので、種類（Claude）とモデルの両方を出す
    var headChip = modelChip(s);
    head.textContent = s.name + ' ・ ' + LABEL[s.status] + ' ・ ' + KIND[s.kind]
      + (headChip ? ' ・ ' + headChip.label : '');
    sheetBody.appendChild(head);

    // 押したらすぐ終わる。確認シートは挟まない（ここに来るまでに
    //「札をタップ→もう一度タップ」を踏んでいて、題名も目の前に出ている＝
    // 間違った席を畳む余地が小さい。毎回2枚目を出すほうが邪魔）
    sheetItem('片付ける（終わらせる）',
      (s.status === 'busy' ? '⚠️ いま作業中です・' : '') + '押すとすぐ終わります（取り消せません）',
      function () { closeSheet(); doKill(s.name); });
  }

  // 席が埋まったときの後始末。作業中のものだけ残して、あとはまとめて終わらせる。
  // ⚠️ 「作業中」の判定は画面が動いたかどうかなので、何も出力しない長い処理
  //    （静かなビルド等）は待機に見える。だから消す前に必ず一覧を見せる。
  function killableList() {
    return sessions.filter(function (s) { return s.status !== 'busy'; });
  }

  function confirmKillIdle() {
    var list = killableList();
    if (!list.length) return toast('終わらせるものがありません');
    openSheet('作業中以外を終わらせますか？');

    // 中断も「あなたが止めたまま置いてある席」＝消す前に数を見せる仲間に入れる
    var held = function (s) { return s.status === 'waiting' || s.status === 'paused'; };
    var waiting = list.filter(held).length;
    var head = document.createElement('div');
    head.className = 'sheethead';
    head.textContent = list.length + ' 件の Claude を終了します。会話の続きはできなくなります'
      + '（ファイルへの変更は残ります）。'
      + (waiting ? '⚠️ うち ' + waiting + ' 件は返答待ち／中断＝あなたの返事を待って止まっているものです。' : '');
    sheetBody.appendChild(head);

    var box = document.createElement('div');
    box.className = 'killlist';
    list.forEach(function (s) {
      var row = document.createElement('div');
      row.className = 'killrow' + (held(s) ? ' warn' : '');
      row.textContent = '・' + (s.title || s.name) + '（' + s.name + '・' + LABEL[s.status] + '）';
      box.appendChild(row);
    });
    sheetBody.appendChild(box);

    sheetItem('やめる', '何もしません', function () { closeSheet(); });
    sheetItem('終わらせる', list.length + ' 件・取り消せません', function () {
      closeSheet();
      doKillMany(list.map(function (s) { return s.name; }));
    });
  }

  function doKillMany(names) {
    api('/api/killmany', { method: 'POST', body: JSON.stringify({ names: names }) })
      .then(function (d) {
        var msg = d.killed.length + ' 件を終わらせました';
        if (d.skipped.length) msg += '（' + d.skipped.length + ' 件は残しました）';
        toast(msg);
        if (d.killed.indexOf(current) >= 0) {
          current = '';
          localStorage.removeItem('tsumiki-remote-session');
        }
        tick(true);
      })
      .catch(function (e) { toast('終わらせられません: ' + e.message); });
  }

  // Mac の画面だけ消す（スリープはしない）。出先で消し忘れに気づいたとき用
  function doDark() {
    api('/api/displaysleep', { method: 'POST', body: '{}' })
      .then(function () { toast('Mac の画面を消しました'); })
      .catch(function (e) { toast('消せません: ' + e.message); });
  }

  // ---------------------------------------------------------- シート

  var sheet = document.getElementById('sheet');
  var sheetTitle = document.getElementById('sheettitle');
  var sheetBody = document.getElementById('sheetbody');

  function closeSheet() { sheet.hidden = true; sheetBody.innerHTML = ''; }
  document.getElementById('sheetcancel').onclick = closeSheet;
  sheet.onclick = function (e) { if (e.target === sheet) closeSheet(); };

  function sheetItem(label, sub, onclick, opts) {
    var b = document.createElement('button');
    // 色の印（モデルを選ぶ画面だけ）。名前の前に置く
    if (opts && opts.dot) {
      var d = document.createElement('span');
      d.className = 'dot ' + opts.dot;
      b.appendChild(d);
    }
    var t = document.createElement('span');
    t.textContent = label;
    if (opts && opts.on) t.className = 'on';
    b.appendChild(t);
    if (sub) {
      var s2 = document.createElement('span');
      s2.className = 'sub';
      s2.textContent = sub;
      b.appendChild(s2);
    }
    if (opts && opts.disabled) b.disabled = true;
    b.onclick = function () { onclick(); };
    sheetBody.appendChild(b);
    return b;
  }

  function openSheet(title) {
    sheetTitle.textContent = title;
    sheetBody.innerHTML = '';
    sheet.hidden = false;
  }

  // 右上の ↻。版が変わったときは自動で読み込み直すが、
  // 「反応がおかしい」と感じたときに自分で試せる場所が要る
  document.getElementById('reload').onclick = function () {
    saveDraft();
    location.reload();
  };

  // 説明文は置かない。何度も見る場所なので、毎回同じ説明が並ぶと
  // 4項目でも「読む画面」になってしまう。押せない項目は灰色で分かるので、
  // 理由（選ばれていない／0件）も言わない。
  // ただし「この作業場所を終わらせる」だけは確認シートを挟まず即実行なので、
  // どこが消えるか（席の名前）と危険の合図（⚠️）は文字数を使ってでも残す。
  document.getElementById('menu').onclick = function () {
    openSheet('版 ' + (seenVersion || '?'));
    sheetItem('制作物を見る', '', function () { openFiles(); });
    sheetItem('Mac の画面を消す', '', function () { closeSheet(); doDark(); });
    sheetItem('この作業場所を終わらせる', current ? '⚠️ ' + current : '',
      function () { closeSheet(); doKill(current); }, { disabled: !current });
    var killable = killableList();
    sheetItem('作業中以外を終わらせる', killable.length ? killable.length + ' 件' : '',
      function () { confirmKillIdle(); }, { disabled: !killable.length });
  };

  // ---------------------------------------------------------- 制作物を見る
  //
  // Apple の「ファイル」に寄せた全画面。
  //   さいきん … 新しい順のベタ並び（今までの一覧と同じ中身）
  //   フォルダ … 置き場をそのまま辿る（12個の仕分けがやっと効く）
  //   検索欄  … どこにいても、置き場ぜんぶから名前でさがす
  // 以前は下から出るシートに120件並べるだけで、600件以上ある置き場の
  // 少し前のものには辿り着けなかった（2026-09-04）。
  //
  // ⚠️ プレビューを開いてもこの一覧は閉じない（上に重なるだけ）。戻ると同じ場所・
  //    同じ並びに帰ってくる。前は一覧ごと閉じていて、2つ目を見るのに全部やり直しだった。

  var filesEl = document.getElementById('files');
  var fScroll = document.getElementById('fscroll');
  var fList = document.getElementById('flist');
  var fBarTitle = document.getElementById('fbartitle');
  var fBig = document.getElementById('fbig');
  var fBack = document.getElementById('fback');
  var fBackLabel = document.getElementById('fbacklabel');
  var fSeg = document.getElementById('fseg');
  var fQInput = document.getElementById('fq');
  var fQClear = document.getElementById('fqclear');
  var filesToast = document.getElementById('filestoast');

  var fMode = 'recent';   // 'recent' | 'browse'
  var fDir = '';          // フォルダを辿っているときの居場所（置き場からの相対）
  var fQuery = '';        // 検索の文字。空でないあいだは fMode より優先
  var fSeq = 0;           // 取りに行った順番。古い返事で画面を書き換えない
  var fStack = [];        // 積んだ履歴のぶんだけ、前の居場所が入る
  var fWantTop = 0;       // 描き終わってから戻すスクロール位置
  var fPushed = false;

  // 種類の絵。フォルダだけ塗りつぶし、あとは線画にする＝
  // 一覧を上から流し見たとき、青い塊が「入れ物」だと一目で分かる
  var FIC = {};
  (function () {
    var DOC =
      '<path d="M13.2 2.9H7.6A2.6 2.6 0 0 0 5 5.5v13A2.6 2.6 0 0 0 7.6 21.1h8.8A2.6 2.6 0 0 0 19 18.5V8.5z"' +
      ' fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>' +
      '<path d="M13.2 2.9v5.6H19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>';
    var LINES =
      '<path d="M8.4 13.4h6.2M8.4 16.6h3.8" fill="none" stroke="currentColor"' +
      ' stroke-width="1.6" stroke-linecap="round"/>';
    function ic(inner, cls) {
      return '<span class="ficon ' + cls + '"><svg viewBox="0 0 24 24" width="25" height="25"' +
        ' aria-hidden="true" focusable="false">' + inner + '</svg></span>';
    }
    FIC.folder = ic('<path d="M4.6 4.8h4.2c.6 0 1.1.2 1.5.7l1.1 1.3h8A2.6 2.6 0 0 1 22 9.4v8' +
      'A2.6 2.6 0 0 1 19.4 20H4.6A2.6 2.6 0 0 1 2 17.4V7.4a2.6 2.6 0 0 1 2.6-2.6z" fill="currentColor"/>',
      'ic-folder');
    FIC.img = ic('<rect x="3" y="5" width="18" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/>' +
      '<circle cx="8.6" cy="10" r="1.5" fill="currentColor"/>' +
      '<path d="M4.2 17.4 8.6 13l2.9 2.8 3.4-3.6 4.9 5.2" fill="none" stroke="currentColor"' +
      ' stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>', 'ic-img');
    FIC.pdf = ic(DOC + LINES, 'ic-pdf');
    FIC.txt = ic(DOC + LINES, 'ic-txt');
    FIC.code = ic(DOC + '<path d="M10.4 13.3 8.6 15.1l1.8 1.8M14 13.3l1.8 1.8-1.8 1.8"' +
      ' fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>',
      'ic-code');
    FIC.etc = ic(DOC, 'ic-etc');
  })();

  // 右上の札。いま「どちらに切り替わるか」の絵を出す（Apple と同じ）
  var IC_GRID = '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">' +
    '<rect x="3.5" y="3.5" width="7.5" height="7.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/>' +
    '<rect x="13" y="3.5" width="7.5" height="7.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/>' +
    '<rect x="3.5" y="13" width="7.5" height="7.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/>' +
    '<rect x="13" y="13" width="7.5" height="7.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>';
  var IC_LIST = '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">' +
    '<path d="M8.5 6h12M8.5 12h12M8.5 18h12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>' +
    '<circle cx="4.3" cy="6" r="1.4" fill="currentColor"/><circle cx="4.3" cy="12" r="1.4" fill="currentColor"/>' +
    '<circle cx="4.3" cy="18" r="1.4" fill="currentColor"/></svg>';

  var VIEW_LS = 'tsumiki-remote-files-view';
  var fView = 'list';
  try { if (localStorage.getItem(VIEW_LS) === 'grid') fView = 'grid'; } catch (e) {}
  var fLast = null;          // いま出ている中身。並べかたを変えるとき取り直さない

  var CODE_RE = /\.(html?|svg|js|css|json|xml)$/i;
  var TEXT_RE = /\.(md|txt|csv)$/i;

  function fKind(name) {
    if (IMG_RE.test(name)) return 'img';
    if (PDF_RE.test(name)) return 'pdf';
    if (CODE_RE.test(name)) return 'code';
    if (TEXT_RE.test(name)) return 'txt';
    return 'etc';
  }

  function fParent(rel) { var i = rel.lastIndexOf('/'); return i < 0 ? '' : rel.slice(0, i); }
  function fBase(rel) { return rel.split('/').pop(); }

  // 上の帯・大見出し・札の出しわけ。どの状態からでもここ1か所で決まるようにする
  function fChrome() {
    var title;
    // 操作の言葉は英語にする（2026-09-04 本人の指示）。ただし**フォルダ名と
    // ファイル名はそのまま**＝置き場の実物の名前を書き換えて見せない。
    // 不具合の知らせも日本語のまま（困ったときに読む文なので）
    if (fQuery) title = 'Search';
    else if (fMode === 'browse') title = fDir ? fBase(fDir) : 'Tsumiki';
    else title = 'Recents';
    fBarTitle.textContent = title;
    fBig.textContent = title;
    // 押したらどうなるかを絵にする（いまの状態ではなく、切り替わる先を出す）
    fViewBtn.innerHTML = fView === 'grid' ? IC_LIST : IC_GRID;
    // 札は「一番上にいて、さがしていないとき」だけ。潜ったら場所を示すほうが大事
    fSeg.hidden = !!fQuery || !!fDir;
    Array.prototype.forEach.call(fSeg.querySelectorAll('button'), function (x) {
      x.classList.toggle('on', x.getAttribute('data-seg') === fMode);
    });
    if (!fQuery && fMode === 'browse' && fDir) {
      var par = fParent(fDir);
      fBackLabel.textContent = par ? fBase(par) : 'Tsumiki';
    } else if (fQuery) {
      fBackLabel.textContent = 'Back';
    } else {
      fBackLabel.textContent = 'Close';
    }
  }

  var fViewBtn = document.getElementById('fview');

  fViewBtn.onclick = function () {
    fView = fView === 'grid' ? 'list' : 'grid';
    try { localStorage.setItem(VIEW_LS, fView); } catch (e) {}
    fChrome();
    // 中身はもう手元にある。取り直さずに並べ替えるだけ
    if (fLast) { fWantTop = 0; fPaint(fLast); }
  };

  function fNote(text) {
    var d = document.createElement('div');
    d.className = 'fnote';
    d.textContent = text;
    return d;
  }

  function fSection(text) {
    var d = document.createElement('div');
    d.className = 'fsection';
    d.textContent = text;
    return d;
  }

  function fSubOf(e) {
    if (e.dir) return typeof e.count === 'number' ? e.count + ' items' : '';
    var bits = [];
    // 新しい順・さがすの一覧では「どこに入っているか」がいちばん知りたい。
    // フォルダを辿っているときは自明なので出さない（名前の場所を食うだけ）
    // 相対パスをまるごと出すと、深いものは切れて読めない。
    // すぐ上のフォルダ名だけで「どこの話か」は十分わかる
    if (fQuery || fMode === 'recent') {
      var par = fParent(e.rel);
      bits.push(par ? fBase(par) : 'Tsumiki');
    }
    if (e.mtime) bits.push(fmtWhen(e.mtime));
    if (e.size) bits.push(fmtSize(e.size));
    return bits.join(' ・ ');
  }

  // 一覧に出す小さな写し。合言葉はクッキーで通す（URL には載せない＝
  // /preview/ のときと同じ理由）。?v= は元の絵の更新時刻で、描き直したら
  // URL が変わる＝端末に残った古い写しを見せない
  function thumbUrl(e) {
    return previewPath(e.rel) + '?thumb=1&v=' + encodeURIComponent(Math.round(e.mtime || 0));
  }

  // 先に必ず取りに行くサムネイルの数。一覧を描くたびに戻す
  var FIRST_THUMBS = 24;
  var fEager = 0;

  function fRow(e) {
    var b = document.createElement('button');
    b.className = 'frow' + (!e.dir && !e.open ? ' dim' : '');
    var kind = e.dir ? 'folder' : fKind(e.name);
    b.innerHTML = FIC[kind];                               // 絵はこちらが持っている定数だけ
    // png・jpg などは中身を小さく出す。取りに行けなかったら種類の印のまま
    if (kind === 'img' && e.open && fCookieOk) {
      var box = b.querySelector('.ficon');
      var im = document.createElement('img');
      // 先頭のひとかたまりは必ず取りに行き、残りは画面に入ってから（lazy）。
      // lazy だけにすると、開いた瞬間に見えている行まで出ないことがある
      // ＝ブラウザが「画面に入った」と判断するまで動かないため（2026-09-04 実測）
      im.loading = fEager > 0 ? 'eager' : 'lazy';
      fEager--;
      im.decoding = 'async';
      im.alt = '';
      im.onerror = function () { box.classList.remove('fthumb'); box.innerHTML = FIC[kind]
        .replace(/^<span[^>]*>/, '').replace(/<\/span>$/, ''); };
      box.classList.add('fthumb');
      box.innerHTML = '';
      box.appendChild(im);
      // ⚠️ src はここで入れない。**画面に並べ終えてから**入れる（2026-09-04 実測）。
      //    まだ document に入っていない <img> に src を入れると、lazy が
      //    「画面の外にある」と判断したまま戻ってこず、35枚とも1枚も取りに行かなかった
      //    （eager にすると即座に出たので、lazy の判定時期が原因だと確かめた）
      im.dataset.u = thumbUrl(e);
    }
    var main = document.createElement('span');
    main.className = 'fmain';
    var n = document.createElement('span');
    n.className = 'fname';
    n.textContent = e.name;                                 // 名前は必ず textContent
    main.appendChild(n);
    var sub = fSubOf(e);
    if (sub) {
      var s2 = document.createElement('span');
      s2.className = 'fsub';
      s2.textContent = sub;
      main.appendChild(s2);
    }
    b.appendChild(main);
    if (e.dir) {
      var c = document.createElement('span');
      c.className = 'fchev';
      c.textContent = '›';
      b.appendChild(c);
    }
    b.onclick = function () {
      if (e.dir) return fGo('browse', e.rel);
      if (!e.open) return ftoast('この形式はここでは開けません');
      openPreview(e.rel);
    };
    return b;
  }

  // 枡ひとつぶん（アイコン表示）。押したときの動きは行とまったく同じ
  function fCell(e) {
    var b = document.createElement('button');
    b.className = 'fcell' + (!e.dir && !e.open ? ' dim' : '');
    var kind = e.dir ? 'folder' : fKind(e.name);
    var box = document.createElement('span');
    box.className = 'fcicon' + (e.dir ? ' plain' : '');
    box.innerHTML = FIC[kind].replace(/^<span[^>]*>/, '').replace(/<\/span>$/, '');
    box.classList.add(e.dir ? 'ic-folder' : ('ic-' + kind));
    if (kind === 'img' && e.open && fCookieOk) {
      var im = document.createElement('img');
      im.loading = fEager > 0 ? 'eager' : 'lazy';
      fEager--;
      im.decoding = 'async';
      im.alt = '';
      im.onerror = function () {
        box.innerHTML = FIC[kind].replace(/^<span[^>]*>/, '').replace(/<\/span>$/, '');
      };
      box.innerHTML = '';
      im.dataset.u = thumbUrl(e);     // src は並べ終えてから（行のときと同じ理由）
      box.appendChild(im);
    }
    b.appendChild(box);
    var n = document.createElement('span');
    n.className = 'fcname';
    n.textContent = e.name;
    b.appendChild(n);
    if (e.dir && typeof e.count === 'number') {
      var c = document.createElement('span');
      c.className = 'fcsub';
      c.textContent = e.count + ' items';
      b.appendChild(c);
    }
    b.onclick = function () {
      if (e.dir) return fGo('browse', e.rel);
      if (!e.open) return ftoast('この形式はここでは開けません');
      openPreview(e.rel);
    };
    return b;
  }

  function fGroup(list) {
    var g = document.createElement('div');
    if (fView === 'grid') {
      g.className = 'fgrid';
      list.forEach(function (e) { g.appendChild(fCell(e)); });
      return g;
    }
    g.className = 'fgroup';
    list.forEach(function (e) { g.appendChild(fRow(e)); });
    return g;
  }

  function fPaint(entries) {
    fLast = entries;
    fEager = FIRST_THUMBS;
    fList.innerHTML = '';
    if (!entries.length) {
      fList.appendChild(fNote(fQuery ? 'No results for "' + fQuery + '"' : 'No items'));
      return;
    }
    var dirs = [], files = [];
    entries.forEach(function (e) { (e.dir ? dirs : files).push(e); });
    // さがしたときだけ2つに分ける。辿っているときは並び順（フォルダが先）で分かる
    if (fQuery && dirs.length && files.length) {
      fList.appendChild(fSection('Folders'));
      fList.appendChild(fGroup(dirs));
      fList.appendChild(fSection('Files'));
      fList.appendChild(fGroup(files));
    } else {
      fList.appendChild(fGroup(entries));
    }
    fScroll.scrollTop = fWantTop || 0;
    fBarSync();
    // 並べ終えてからサムネイルを頼む。ここまで来ていれば lazy が正しく効く＝
    // 画面に入っているぶんだけ取りに行く（120件を一度に引かない）
    Array.prototype.forEach.call(fList.querySelectorAll('img[data-u]'), function (im) {
      var u = im.dataset.u;
      delete im.dataset.u;
      im.src = u;
    });
  }

  function fBarSync() {
    fBarTitle.classList.toggle('show', fScroll.scrollTop > 34);
  }
  fScroll.addEventListener('scroll', fBarSync, { passive: true });

  // ⚠️ サムネイルは <img> で取りに行くので、合言葉をヘッダに載せられない。
  //    先に挨拶してクッキーをもらってから描く。もらえなかったときは種類の印だけで
  //    描く（一覧そのものは動く）。1回もらえば以降は使い回される
  var fCookieOk = false;

  function fLoad() {
    var seq = ++fSeq;
    fChrome();
    fList.innerHTML = '';
    fList.appendChild(fNote('Loading…'));
    var qs = fQuery ? '?q=' + encodeURIComponent(fQuery)
      : (fMode === 'browse' ? '?dir=' + encodeURIComponent(fDir) : '');
    var hello = ensurePreviewCookie().then(function () { fCookieOk = true; },
                                           function () { fCookieOk = false; });
    Promise.all([api('/api/files' + qs), hello]).then(function (r) {
      if (seq !== fSeq) return;          // そのあいだに別の場所へ移っていたら捨てる
      fPaint(r[0].entries || []);
    }).catch(function (e) {
      if (seq !== fSeq) return;
      fList.innerHTML = '';
      fList.appendChild(fNote(e.message || '読み込めませんでした'));
    });
  }

  // 居場所をひとまとめにして積む／戻す。履歴（端から引く動き）と数を合わせるので、
  // fStack に1つ積むときは history にも必ず1つ積む
  function fSnap() { return { mode: fMode, dir: fDir, q: fQuery, top: fScroll.scrollTop }; }

  function fRestore(s) {
    fMode = s.mode; fDir = s.dir; fQuery = s.q;
    fQInput.value = fQuery;
    fQClear.hidden = !fQuery;
    fWantTop = s.top;
    fLoad();
  }

  function fGo(mode, dir) {
    fStack.push(fSnap());
    try { history.pushState({ tsumikiFiles: 1 }, ''); } catch (e) {}
    fMode = mode; fDir = dir || ''; fQuery = '';
    fQInput.value = '';
    fQClear.hidden = true;
    fWantTop = 0;
    fLoad();
  }

  var fqTimer = null;

  function fSearch(text) {
    text = String(text || '').trim();
    if (text === fQuery) return;
    if (text && !fQuery) {                 // さがしはじめ＝戻れるように1つ積む
      fStack.push(fSnap());
      try { history.pushState({ tsumikiFiles: 1 }, ''); } catch (e) {}
    } else if (!text && fQuery && fStack.length) {
      history.back();                      // 空にした＝積んだところへ戻す
      return;
    }
    fQuery = text;
    fWantTop = 0;
    fLoad();
  }

  fQInput.oninput = function () {
    var v = fQInput.value;
    fQClear.hidden = !v;
    clearTimeout(fqTimer);
    fqTimer = setTimeout(function () { fSearch(v); }, 260);
  };
  fQInput.onkeydown = function (e) {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    clearTimeout(fqTimer);
    fSearch(fQInput.value);
    fQInput.blur();
  };
  fQClear.onclick = function () {
    clearTimeout(fqTimer);
    fQInput.value = '';
    fQClear.hidden = true;
    fSearch('');
    fQInput.blur();
  };

  Array.prototype.forEach.call(fSeg.querySelectorAll('button'), function (b) {
    b.onclick = function () {
      var seg = b.getAttribute('data-seg');
      if (seg === fMode && !fDir && !fQuery) return;
      fMode = seg; fDir = ''; fWantTop = 0;
      fLoad();
    };
  });

  var ftoastTimer = null;

  function ftoast(msg, ms) {
    filesToast.textContent = msg;
    filesToast.hidden = false;
    clearTimeout(ftoastTimer);
    ftoastTimer = setTimeout(hideFToast, ms || 1800);
  }

  function hideFToast() {
    clearTimeout(ftoastTimer);
    filesToast.hidden = true;
  }

  function openFiles() {
    closeSheet();
    filesEl.hidden = false;
    fStack = [];
    fQuery = '';
    fQInput.value = '';
    fQClear.hidden = true;
    hideFToast();
    if (!fPushed) {
      try { history.pushState({ tsumikiFiles: 1 }, ''); fPushed = true; } catch (e) {}
    }
    fWantTop = 0;
    fLoad();     // fMode / fDir は前に見ていた場所のまま＝続きから見られる
  }

  function closeFiles() {
    filesEl.hidden = true;
    fList.innerHTML = '';
    fStack = [];
    fQuery = '';
    fQInput.value = '';
    fQClear.hidden = true;
    hideFToast();
  }

  fBack.onclick = function () {
    if (fPushed || fStack.length) history.back();   // 閉じ方は popstate 側に1本化する
    else closeFiles();
  };

  // ⚠️ この popstate は**プレビューのものより先に**登録すること（この位置＝ソースの上）。
  //    先に走って「上にプレビューが乗っているならこちらは何もしない」と譲る形にしてある。
  //    順番が入れ替わると、プレビューを閉じた同じ1回で一覧も1つ戻ってしまう。
  window.addEventListener('popstate', function () {
    if (filesEl.hidden) return;
    if (!viewer.hidden) return;                     // いまのはプレビューの担当
    if (fStack.length) { fRestore(fStack.pop()); return; }
    fPushed = false;
    closeFiles();
  });

  // このアプリの中で開く。iframe は同じサーバーを見るので、
  // 最初の1回でクッキーが配られ、CSSや画像の読み込みもそのまま通る。
  var viewer = document.getElementById('viewer');
  var viewerFrame = document.getElementById('viewerframe');
  var viewerWrap = document.getElementById('viewerwrap');
  var viewerImg = document.getElementById('viewerimg');
  var viewerName = document.getElementById('viewername');
  var viewerCopy = document.getElementById('viewercopy');
  var viewerToast = document.getElementById('viewertoast');
  var viewerUrl = '';
  var viewerRel = '';
  var IMG_RE = /\.(png|jpe?g|gif|webp|svg)$/i;
  var HTML_RE = /\.html?$/i;
  var PDF_RE = /\.pdf$/i;
  var TXT_RE = /\.(md|txt|csv|json|js|css)$/i;

  function previewPath(rel) {
    return '/preview/' + rel.split('/').map(encodeURIComponent).join('/');
  }

  // 親（このアプリ）が自分で取りに行くときの URL。合言葉を付けてよい
  function previewUrl(rel) {
    return previewPath(rel) + '?t=' + encodeURIComponent(token);
  }

  // ⚠️ 枠（iframe）と <img> に渡す URL には**合言葉を付けない**（2026-09-02）。
  // 砂箱の中からでも自分の location.href は読めるので、URL に合言葉を入れると
  // `new Image().src = 'https://どこか/?t=' + 合言葉` で外へ持ち出せてしまう
  // （通信の封じ＝connect-src は fetch を止めるが、画像の読み込みは止めない）。
  // 代わりに、開く前に**親が1回だけ**合言葉つきで挨拶してクッキーを配ってもらう。
  // クッキーは HttpOnly なので中の文書からは読めず、Path=/preview/ なので
  // /api/ には付かない。
  var cookieReady = null;

  function ensurePreviewCookie() {
    if (cookieReady) return cookieReady;
    cookieReady = fetch('/preview/?t=' + encodeURIComponent(token), { credentials: 'same-origin' })
      .then(function (r) { if (!r.ok) throw new Error('合言葉を渡せません'); })
      .catch(function (e) { cookieReady = null; throw e; });
    return cookieReady;
  }

  // ⚠️ 枠（iframe）に src= で入れると、その移動が「戻る」の履歴に積まれる。
  //    2つめ3つめと開いていくと、戻るを押したときにアプリの画面ではなく
  //    枠のほうが1つ戻り、中身だけ空になって白い画面が残る（2026-09-01 実発生）。
  //    location.replace は履歴に積まないので、戻るは必ずこの画面に効く。
  function frameGo(url) {
    try {
      var w = viewerFrame.contentWindow;
      if (w && w.location && w.location.replace) { w.location.replace(url); return; }
    } catch (e) {}
    viewerFrame.src = url;   // 覗けないときの保険
  }

  // 中身が届いたら白い下地に戻す。about:blank のあいだは暗いまま。
  // ⚠️ 砂箱の枠では contentWindow.location が**必ず**例外になるので、そこを見て
  // 判断してはいけない（見ていたときは、中身が無くても白く光っていた）。
  // 「いま本物の中身を入れようとしているか」はこちらで覚えておく（2026-09-02）
  var frameShowing = false;
  viewerFrame.addEventListener('load', function () {
    if (frameShowing) viewerFrame.classList.remove('blank');
  });

  function openPreview(rel) {
    viewerUrl = previewPath(rel);   // 枠と <img> に渡すほう＝合言葉を付けない
    viewerRel = rel;
    viewerName.textContent = rel;
    viewerWrap.classList.remove('zoom');
    hidePick();
    // 挨拶（クッキー）の往復のあいだ白く光らないよう、先に暗くしておく
    viewerFrame.classList.add('blank');
    resetCopyBtn();
    hideVToast();
    if (!viewerPushed) {
      try { history.pushState({ tsumikiViewer: 1 }, ''); viewerPushed = true; } catch (e) {}
    }

    // ⚠️ 砂箱に入れるとブラウザ内蔵の PDF ビューアが止まり、PDF が開けなくなる
    // （砂箱に入った枠ではプラグインが一律で禁じられる。外す手立ては仕様に無い）。
    // PDF は文書の中から親の画面に手が届く道が無いので、ここだけ砂箱を外す。
    // ⚠️ **外してよいのは PDF のときだけ。** 毎回どちらかを必ず立て直すので、
    //    HTML が砂箱なしで開く道は残らない（else を消さないこと）
    if (PDF_RE.test(rel)) viewerFrame.removeAttribute('sandbox');
    else viewerFrame.setAttribute('sandbox', 'allow-scripts');

    // ⚠️ 中身を出す前に、合言葉のクッキーを配ってもらう。URL に合言葉を載せない
    // かわりなので、これが済むまで枠にも <img> にも中身を入れられない
    ensurePreviewCookie().then(function () {
      if (viewerRel !== rel) return;      // そのあいだに別のものを開いていたら捨てる
      if (IMG_RE.test(rel)) {
        // 画像はこの画面の中に「全体が入る大きさ」で出す（iframe に渡すと原寸で開く）
        viewerFrame.classList.add('blank', 'off');
        frameShowing = false;
        frameGo('about:blank');
        viewerImg.src = viewerUrl;
        viewerWrap.classList.add('on');
      } else {
        viewerWrap.classList.remove('on');
        viewerImg.removeAttribute('src');
        viewerFrame.classList.remove('off');
        viewerFrame.classList.add('blank');
        frameShowing = true;
        frameGo(viewerUrl);
      }
    }).catch(function (e) {
      vtoast(e.message || '開けませんでした', 2600);
    });
    viewer.hidden = false;
  }

  // タップで「全体表示 ⇄ 原寸」。原寸のときは指でずらして見られる
  viewerImg.onclick = function () { viewerWrap.classList.toggle('zoom'); };

  // ------------------------------------------- 本文をぜんぶ写す（右上の札）
  //
  // 出先で見ている制作物は、読むだけでなく「そのまま貼りたい」ことが多い。
  // iPhone の長押しは1段落ずつしか掴めず、長い文章では指がもたない。
  // 絵だけの札を1つ置いて、押したら中身を全部クリップボードに入れる。
  // 文字は書かない＝名前の場所を食わないし、戻ると左右でつり合う。
  //
  // ⚠️ この画面では footer の toast が下に隠れて見えないので、知らせは
  //    #viewertoast（この画面の中）に出す。

  var vtoastTimer = null;

  function vtoast(msg, ms) {
    viewerToast.textContent = msg;
    viewerToast.hidden = false;
    clearTimeout(vtoastTimer);
    vtoastTimer = setTimeout(hideVToast, ms || 1800);
  }

  function hideVToast() {
    clearTimeout(vtoastTimer);
    viewerToast.hidden = true;
  }

  var copyBackTimer = null;

  // 写せる相手（文字もの）のときだけ札を出す。画像とPDFには出しても押せるものが無い
  function resetCopyBtn() {
    clearTimeout(copyBackTimer);
    viewerCopy.classList.remove('done');
    viewerCopy.innerHTML = ICON_COPY;
    var canCopy = HTML_RE.test(viewerRel) || TXT_RE.test(viewerRel);
    viewerCopy.classList.toggle('off', !canCopy);
  }

  // 中身の取りかたは相手で変える。
  // HTML は「出来上がった見た目の字」が欲しい（タグを貼りたい人はいない）。
  //
  // ⚠️ 以前は iframe の中を覗いて取っていたが、枠を砂箱に入れたので覗けなくなった
  // （2026-09-02）。代わりに**親が元のファイルを取り直して、字だけ抜く**。
  // DOMParser は文書を組み立てるだけで、中の script を動かさないし、
  // 画像や外部の読み込みも起こさない＝しかけのある HTML でも安全に字が取れる。
  // 引き換えに、画面に出ている折り返しや余白とは少しだけ違う字並びになる。
  function htmlToText(src) {
    try {
      var d = new DOMParser().parseFromString(src, 'text/html');
      if (!d || !d.body) return '';
      // 読まない部分は落とす（貼り付けたときに邪魔になるため）
      Array.prototype.forEach.call(d.body.querySelectorAll('script,style,template'), function (n) {
        n.parentNode.removeChild(n);
      });
      // ⚠️ textContent はタグの隙間の空白しか拾わない。1行で書かれた HTML
      // （生成物・詰めて書いたもの・表）だと**全部つながって読めなくなる**ので、
      // 段落や行の区切りを自分で入れてから読む（前は iframe の innerText が
      // やってくれていた仕事。2026-09-02 のレビュー指摘）
      Array.prototype.forEach.call(d.body.querySelectorAll('br'), function (n) {
        n.parentNode.replaceChild(d.createTextNode('\n'), n);
      });
      Array.prototype.forEach.call(d.body.querySelectorAll('td,th'), function (n) {
        n.appendChild(d.createTextNode('\t'));
      });
      Array.prototype.forEach.call(d.body.querySelectorAll(
        'p,div,li,tr,h1,h2,h3,h4,h5,h6,section,article,header,footer,blockquote,pre,figure,hr,table,ul,ol,dl,dt,dd'
      ), function (n) { n.appendChild(d.createTextNode('\n')); });
      var t = d.body.textContent || '';
      // 空行が続くのを1つにまとめる（タグの隙間ぶんの改行が積み重なるため）
      return t.replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
    } catch (e) { return ''; }
  }

  // 一度取った中身は覚えておく（見た目の確認とコピーで二度取りに行かないため）
  var srcCache = { rel: '', text: null };

  function fetchText(rel) {
    if (srcCache.rel === rel && srcCache.text !== null) return Promise.resolve(srcCache.text);
    return fetch(previewUrl(rel), { credentials: 'same-origin' })
      .catch(function () { throw new Error('MacBook に届きません'); })
      .then(function (r) {
        // 合言葉が切れていたら、次に開くとき挨拶からやり直す
        // （やり直せないと、画面を開き直すまでプレビューが全部 401 になる）
        if (r.status === 401) { cookieReady = null; throw new Error('合言葉が切れました。開き直してください'); }
        if (!r.ok) throw new Error('読み込めません');
        return r.text();
      })
      .then(function (t) { srcCache = { rel: rel, text: t }; return t; });
  }


  function viewerText(rel) {
    return fetchText(rel).then(function (src) {
      if (!HTML_RE.test(rel)) return src;   // md/txt/csv は元のまま＝改行や空白が崩れない
      var t = htmlToText(src);
      return t || src;                      // 字が取れなければ元の中身を渡す
    });
  }

  // どうしても写せなかったとき用。
  // ⚠️ 以前は iframe の中を全部選んでいたが、枠を砂箱に入れたので中に手が届かない
  // （2026-09-02）。代わりに、この画面の中に**選べる字**を出して長押しで取ってもらう。
  // 画面の外に置くと iOS が「見えていない」と見なして選んでくれないので、
  // 見える場所に薄く出す（本体側のコピーと同じ理由）。
  var viewerPick = null;

  function selectForCopy(text) {
    try {
      if (!viewerPick) {
        viewerPick = document.createElement('pre');
        viewerPick.id = 'viewerpick';
        viewerFrame.parentNode.insertBefore(viewerPick, viewerFrame);
      }
      viewerPick.textContent = text;
      viewerPick.hidden = false;
      var range = document.createRange();
      range.selectNodeContents(viewerPick);
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      return true;
    } catch (e) { return false; }
  }

  function hidePick() {
    if (viewerPick) { viewerPick.hidden = true; viewerPick.textContent = ''; }
  }

  viewerCopy.onclick = function () {
    if (!viewerRel || viewerCopy.classList.contains('off')) return;
    viewerText(viewerRel).then(function (text) {
      if (!text) throw new Error('中身がありません');
      return copyText(text).then(function () {
        viewerCopy.classList.add('done');
        viewerCopy.innerHTML = ICON_DONE;
        vtoast('本文をぜんぶコピーしました');
        copyBackTimer = setTimeout(function () {
          viewerCopy.classList.remove('done');
          viewerCopy.innerHTML = ICON_COPY;
        }, 2000);
      }, function () {
        if (selectForCopy(text)) vtoast('選んであります。長押しして「コピー」を選んでください', 4200);
        else vtoast('コピーできませんでした', 2600);
      });
    }).catch(function (e) {
      vtoast(e.message || 'コピーできませんでした', 2600);
    });
  };

  // 保存は iOS の長押し（「写真に追加」）に任せる。ボタンからの共有シートは
  // https でつないだときしか使えず、<a download> に落とすとページごと
  // 「ファイルの受け取り画面」に移って戻れなくなる（2026-08-31 実発生）。
  // 画面には一言だけ出し、押す場所は「もどる」だけにする。

  // 「もどる」は指でも押せるが、端から引く動きでも戻したい。開いたときに履歴を
  // 1つ積んでおき、それが外れたら閉じる。押したときも history.back() を通すので、
  // 閉じ方は1本にまとまる。
  var viewerPushed = false;

  function closeViewer() {
    viewer.hidden = true;
    hidePick();          // 前に見た制作物の本文を画面の裏に残さない
    viewerFrame.classList.add('blank');
    frameGo('about:blank');            // 中で動いているものを止める
    viewerImg.removeAttribute('src');
    viewerWrap.classList.remove('on', 'zoom');
    viewerUrl = '';
    viewerRel = '';
    hideVToast();
  }

  document.getElementById('viewerback').onclick = function () {
    if (!viewerPushed) return closeViewer();
    // 中で開いた先へリンクを辿ったときなど、戻るが枠のほうに吸われることがある。
    // 少し待って閉じていなければ、こちらで閉じる＝白いまま残らない
    var fired = false;
    var once = function () { fired = true; };
    window.addEventListener('popstate', once);
    history.back();                            // 普通は popstate 側で閉じる
    setTimeout(function () {
      window.removeEventListener('popstate', once);
      if (!fired && !viewer.hidden) closeViewer();
    }, 400);
  };

  window.addEventListener('popstate', function () {
    if (viewer.hidden) return;
    viewerPushed = false;
    closeViewer();
  });

  function fmtSize(n) {
    if (n < 1024) return n + 'B';
    if (n < 1024 * 1024) return Math.round(n / 1024) + 'KB';
    return (n / 1024 / 1024).toFixed(1) + 'MB';
  }

  function fmtWhen(ms) {
    var d = new Date(ms), now = new Date();
    var p = function (x) { return ('0' + x).slice(-2); };
    if (d.toDateString() === now.toDateString()) return p(d.getHours()) + ':' + p(d.getMinutes());
    // 年をまたいだものは年も出す。置き場には去年のものも残っていて、
    // 「8/14」だけだと今年のものと見分けられない
    if (d.getFullYear() !== now.getFullYear()) {
      return d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate();
    }
    return (d.getMonth() + 1) + '/' + d.getDate();
  }

  document.addEventListener('visibilitychange', function () { if (!document.hidden) tick(true); });

  // 読み込み直す前に預けた書きかけを戻す（古い版は本文だけの文字列で入っている）
  try {
    var draft = localStorage.getItem(DRAFT);
    if (draft) {
      localStorage.removeItem(DRAFT);
      var d = null;
      try { d = JSON.parse(draft); } catch (e) {}
      if (d && typeof d === 'object') {
        el.cmd.value = d.t || '';
        atts = (d.a || []).map(function (x) {
          return { id: ++attSeq, path: x.p, thumb: x.t || '',
                   kind: x.k || 'img', name: x.n || '' };
        });
        renderAtts();
      } else {
        el.cmd.value = draft;
      }
      autoGrow();   // 改行入りの書きかけなら、その行数ぶん開いた状態で戻す
    }
  } catch (e) {}

  // 画面一式を iPhone の中に置いておく係。これが居ると、Mac に届かないときでも
  // 開いた瞬間に写しが出る（真っ白にならない）。
  // ⚠️ https でないと登録できない決まり。http のときは静かに失敗するだけ。
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
      .catch(function () { /* http で開いている・対応していない。普通に動く */ });
  }

  // 最後に見た内容を先に描く。つながっていれば1秒以内に本物へ入れ替わるので、
  // 出しても損はなく、つながっていないときだけ意味が出る
  restoreSnap();

  // 閉じる・裏に回る直前に必ず1回残す。次に開いたときここから始まる
  window.addEventListener('pagehide', function () { saveSnap(true); });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) saveSnap(true);
  });

  if (!token) gate(true);
  tick(true);
  timer = setInterval(tick, 1500);
})();
</script>
</body>
</html>
