<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="apple-touch-icon" href="icons/icon-money.png">
<meta name="apple-mobile-web-app-title" content="残高">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F4F2EE">
<title>お金の残高</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* いつつ（Itsutsu）と同じ warm neutral monochrome：温かいベージュ＋墨色、丸ゴシック。
     アクセントは墨1色（いつつのCTAと同じ）。不足の時だけ、赤ではなく温かいクレイで控えめに示す。 */
  :root {
    --bg: #F4F2EE;          /* paper：純白でない紙の背景 */
    --card: #FBFAF8;        /* 紙からわずかに浮く面（カード） */
    --field: #F1EEE9;       /* 入力欄のうっすらした面 */
    --tint: #ECE9E3;        /* surface：注釈・押下時の地色 */
    --text: #242321;        /* ink：主要な文字 */
    --sub: #77736B;         /* muted ink：補助の文字 */
    --line: #D8D4CC;        /* hairline：境界線 */
    --ghost: #BEB9B0;       /* 無効・空 */
    --accent: #242321;      /* 唯一のアクセント＝墨（いつつのCTAと同じ） */
    --accent-soft: #ECE9E3; /* 押下・帯の地色 */
    --neg: #B0573F;         /* 不足の時だけの温かいクレイ（純赤の代わり） */
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Zen Maru Gothic', -apple-system, BlinkMacSystemFont, "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 24px clamp(12px, 4vw, 20px) 56px;
    padding-left: max(clamp(12px, 4vw, 20px), env(safe-area-inset-left));
    padding-right: max(clamp(12px, 4vw, 20px), env(safe-area-inset-right));
    padding-bottom: calc(56px + env(safe-area-inset-bottom));
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 520px; margin: 0 auto; }
  h1 { font-size: clamp(19px, 5vw, 22px); font-weight: 600; text-align: center; margin: 0 0 16px; letter-spacing: .01em; }

  /* 狭い画面では縦1列（layout/colは存在しないものとして流す）。900px以上でだけ2カラムにする。 */
  .layout, .col-main, .col-side { display: contents; }

  .syncbar { text-align: center; margin: -6px 0 16px; }
  .sync-chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--sub);background:rgba(119,115,107,.14);padding:4px 10px;border-radius:999px}
  .sync-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--sub);flex:none}
  .sync-chip.ok .dot{background:var(--accent)}
  .sync-chip.off .dot{background:var(--neg)}
  .sync-toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:rgba(36,35,33,.92);color:#fff;font-size:13px;padding:10px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:9999}
  .sync-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* 移行のお知らせ帯（旧「済み」データがある時だけ初回1回） */
  .migrate {
    display: none; align-items: center; gap: 10px;
    background: var(--accent-soft); border-radius: 12px;
    padding: 11px 14px; margin-bottom: 16px; font-size: 12px; color: var(--sub);
  }
  .migrate.show { display: flex; }
  .migrate .x {
    margin-left: auto; flex-shrink: 0; border: none; background: none;
    color: var(--accent); font-size: 17px; line-height: 1; cursor: pointer;
    width: 44px; height: 44px; margin-right: -12px;
    display: flex; align-items: center; justify-content: center;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: clamp(14px, 4vw, 20px);
    margin-bottom: 14px;
    box-shadow: 0 1px 2px rgba(36,35,33,.04);
  }
  .card h2 {
    font-size: 15px; font-weight: 600; color: var(--text);
    margin: 0 0 12px;
    display: flex; align-items: baseline; justify-content: space-between;
    flex-wrap: wrap; gap: 2px 10px;
  }
  .card h2 .subtotal { font-size: 15px; font-weight: 600; color: var(--sub); }

  /* 結果カード */
  .result { text-align: center; padding: clamp(20px, 6vw, 30px) clamp(14px, 4vw, 20px); }
  .remain-label { font-size: 12px; color: var(--sub); }
  .remain-big {
    font-size: clamp(36px, 12vw, 56px); font-weight: 700; letter-spacing: -.02em; line-height: 1.1;
    color: var(--text); overflow-wrap: anywhere; margin-top: 2px;
  }
  .remain-big.minus { color: var(--neg); }
  .breakdown {
    display: flex; justify-content: center; align-items: baseline; flex-wrap: wrap;
    gap: 2px 6px; margin-top: 14px; font-size: 13px; color: var(--sub);
  }
  .breakdown span { white-space: nowrap; }
  .breakdown .op { color: var(--ghost); }
  .breakdown b { color: var(--text); font-weight: 600; }

  /* 入力行 */
  .item { display: flex; align-items: center; gap: clamp(6px, 2vw, 10px); padding: 6px 0; border-bottom: 1px solid var(--line); }
  .item:last-of-type { border-bottom: none; }
  .item input.name {
    flex: 1 1 90px; min-width: 0; font-size: 16px; padding: 0 11px; height: 46px;
    border: 1px solid var(--line); border-radius: 11px; background: var(--field);
    font-family: inherit; color: var(--text);
  }
  /* 金額側は固定px幅にせず、狭い画面では name より先に縮む（flex-shrink を大きく） */
  .item .amount-wrap { display: flex; align-items: center; gap: 4px; flex: 0 3 150px; min-width: 104px; }
  .item .amount-wrap .yen { color: var(--sub); font-size: 16px; flex: none; }
  .item input.amount {
    flex: 1 1 auto; width: auto; min-width: 0;
    text-align: right; font-size: 17px; padding: 0 11px; height: 46px;
    border: 1px solid var(--line); border-radius: 11px; background: var(--field);
    font-family: inherit; color: var(--text);
  }
  .item input:focus { outline: none; border-color: var(--accent); background: var(--card); }
  .item .del {
    width: 44px; height: 44px; flex: none; border-radius: 50%;
    border: 1px solid var(--line); background: var(--card); color: var(--sub);
    font-size: 18px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  .item .del:active { background: var(--accent-soft); }

  .btn-add {
    margin-top: 10px; width: 100%; padding: 12px; min-height: 48px;
    border: 1px dashed var(--ghost); border-radius: 12px; background: var(--field);
    color: var(--accent); font-size: 18px; font-family: inherit; cursor: pointer;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  .btn-add:active { background: var(--accent-soft); }

  /* 保存 / 新しい計算 */
  .calc-actions { display: flex; gap: 10px; margin: 0 0 14px; }
  .calc-actions button {
    flex: 1; padding: 12px; min-height: 48px; border-radius: 14px; font-size: 14px; font-weight: 600;
    font-family: inherit; cursor: pointer; border: 1px solid var(--line);
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  .ca-save { background: var(--accent); color: var(--card); border-color: var(--accent); }
  .ca-save:active { background: #3A3833; }
  .ca-new { background: var(--card); color: var(--accent); }
  .ca-new:active { background: var(--accent-soft); }

  /* 保存した計算 */
  .saved-item { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .saved-item:last-child { border-bottom: none; }
  .si-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .si-name { font-size: 15px; font-weight: 600; color: var(--text); min-width: 0; word-break: break-word; }
  .si-remain { font-size: 17px; font-weight: 700; color: var(--text); white-space: nowrap; }
  .si-remain.minus { color: var(--neg); }
  .si-bd { margin-top: 4px; font-size: 12px; color: var(--sub); }
  .si-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
  .si-date { font-size: 11px; color: var(--sub); }
  .si-foot { flex-wrap: wrap; gap: 8px; }
  .si-actions { display: flex; gap: 8px; }
  .si-actions button {
    padding: 0 16px; min-height: 44px; min-width: 64px;
    border: 1px solid var(--line); border-radius: 11px;
    background: var(--card); color: var(--accent); font-size: 13px; font-family: inherit; cursor: pointer;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  .si-actions button:active { background: var(--accent-soft); }
  .si-del { color: var(--sub); }
  .si-del:active { background: #F4E7E1; color: var(--neg); }

  /* ブレイクポイントは 600 と 900 の2本だけ */
  @media (min-width: 600px) {
    .wrap { max-width: 560px; }
    body { padding-top: 32px; }
  }
  @media (min-width: 900px) {
    .wrap { max-width: 980px; }
    /* 左＝結果と操作（画面に固定）／右＝入力と記録 */
    .layout {
      display: grid;
      grid-template-columns: minmax(0, .88fr) minmax(0, 1.12fr);
      gap: 18px; align-items: start;
    }
    .col-main, .col-side { display: block; min-width: 0; }
    .col-main { position: sticky; top: 28px; }
    .result { padding: 34px 24px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>お金の残高</h1>
  <div class="syncbar"><div class="sync-chip local" id="syncChip"><span class="dot"></span><span id="syncText"></span></div></div>

  <div class="migrate" id="migrateBar">
    <span>以前の「済み」も予定として合算しています</span>
    <button class="x" id="migrateClose" aria-label="閉じる">×</button>
  </div>

  <div class="layout">
  <div class="col-main">

  <!-- 結果 -->
  <div class="card result">
    <div class="remain-label">残り</div>
    <div class="remain-big" id="remainBig">¥0</div>
    <div class="breakdown">
      <span>🏦 <b id="bdBank">¥0</b></span>
      <span class="op">＋</span>
      <span>🤝 <b id="bdAdv">¥0</b></span>
      <span class="op">−</span>
      <span>💳 <b id="bdCard">¥0</b></span>
    </div>
  </div>

  <!-- 保存 / 新しい計算 -->
  <div class="calc-actions">
    <button class="ca-save" id="saveCalcBtn">💾 保存</button>
    <button class="ca-new" id="newCalcBtn">＋ 新しい計算</button>
  </div>

  </div><!-- /col-main -->
  <div class="col-side">

  <!-- 銀行 -->
  <div class="card">
    <h2>🏦 銀行 <span class="subtotal" id="subBanks">¥0</span></h2>
    <div id="banks"></div>
    <button class="btn-add" id="addBank" aria-label="銀行を追加">＋</button>
  </div>

  <!-- 引き落とし -->
  <div class="card">
    <h2>💳 引き落とし <span class="subtotal" id="subCards">¥0</span></h2>
    <div id="cards"></div>
    <button class="btn-add" id="addCard" aria-label="引き落としを追加">＋</button>
  </div>

  <!-- 入金 -->
  <div class="card">
    <h2>🤝 入金 <span class="subtotal" id="subAdv">¥0</span></h2>
    <div id="advs"></div>
    <button class="btn-add" id="addAdv" aria-label="入金を追加">＋</button>
  </div>

  <!-- 保存した計算 -->
  <div class="card" id="savedCard" style="display:none">
    <h2>📋 保存した計算 <span class="subtotal" id="savedCount"></span></h2>
    <div id="savedList"></div>
  </div>

  </div><!-- /col-side -->
  </div><!-- /layout -->
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ===== クラウド同期（money.html / forecast.html で共通） =====
   - AssetDB:   Supabaseクライアント（credit.html / たびのき と同じプロジェクトを再利用）
   - MoneySync: 残高(money-balance-v1)＋資産予測(money-forecast-v1)を money_state テーブルへ同期 */
(function () {
  "use strict";
  var SUPABASE_URL = "https://okbjqtdirrathscctyvx.supabase.co";
  var SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9rYmpxdGRpcnJhdGhzY2N0eXZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzMjI4NTIsImV4cCI6MjA5NTg5ODg1Mn0.T-1AOK6vCD6uGdqrVGXjPui3L6WPSNrnygS-IHyfZ6Y";
  window.AssetDB = (window.supabase && window.supabase.createClient)
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON) : null;

  window.MoneySync = (function () {
    var KEYS = ["money-balance-v1", "money-forecast-v1", "money-saved-v1"];
    var META = "money-sync-meta-v1";   // この端末の最終更新時刻
    var TABLE = "money_state", ID = "kodai";
    var sb = window.AssetDB;
    var online = null, pending = false, timer = null, lastPushed = "";

    function meta() { try { return JSON.parse(localStorage.getItem(META)) || {}; } catch (e) { return {}; } }
    function setMeta(m) { try { localStorage.setItem(META, JSON.stringify(m)); } catch (e) {} }
    function hasLocalData() { return !!(localStorage.getItem(KEYS[0]) || localStorage.getItem(KEYS[1])); }
    function blob() {
      var b = { updatedAt: meta().updatedAt || 0 };
      KEYS.forEach(function (k) {
        var raw = localStorage.getItem(k);
        if (raw) { try { b[k] = JSON.parse(raw); } catch (e) {} }
      });
      return b;
    }

    function schedule() {
      setMeta({ updatedAt: Date.now() });
      if (!sb) { renderChip(); return; }
      pending = true;
      clearTimeout(timer);
      timer = setTimeout(flush, 350);
    }
    function flush() {
      if (!sb || !pending) return;
      clearTimeout(timer);
      pending = false;
      var b = blob();
      b.updatedAt = meta().updatedAt || Date.now();
      lastPushed = JSON.stringify(b);
      sb.from(TABLE).upsert({ id: ID, state: b, updated_at: new Date().toISOString() })
        .then(function (r) {
          if (r && r.error) { online = false; pending = true; }
          else { online = true; }
          renderChip();
        })
        .catch(function () { online = false; pending = true; renderChip(); });
    }
    function touch() { setMeta({ updatedAt: Date.now() }); pending = true; flush(); }

    function applyRemote(incoming, toastMsg) {
      KEYS.forEach(function (k) {
        if (incoming[k] != null) {
          try { localStorage.setItem(k, JSON.stringify(incoming[k])); } catch (e) {}
        }
      });
      setMeta({ updatedAt: incoming.updatedAt || Date.now() });
      if (toastMsg) { toast(toastMsg); setTimeout(function () { location.reload(); }, 900); }
      else location.reload();
    }
    function isEditing() {
      var a = document.activeElement;
      return !!(a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA" || a.tagName === "SELECT"));
    }

    function init() {
      if (!sb) { online = false; renderChip(); return; }
      sb.from(TABLE).select("state").eq("id", ID).maybeSingle()
        .then(function (res) {
          if (res && res.error) { online = false; renderChip(); return; }
          online = true;
          var row = res && res.data;
          var localT = meta().updatedAt || 0;
          if (row && row.state && typeof row.state === "object") {
            var remoteT = row.state.updatedAt || 0;
            if (remoteT > localT) {
              if (!localT && hasLocalData()) {
                var useRemote = confirm("クラウドに保存済みの残高データが見つかりました。\n\nOK：クラウドのデータをこの端末に反映する\nキャンセル：この端末のデータを正としてクラウドへ送る");
                if (!useRemote) { touch(); subscribe(); renderChip(); return; }
              }
              applyRemote(row.state, null);
              return;
            }
            if (localT > remoteT) { pending = true; flush(); }
          } else if (hasLocalData()) {
            if (!localT) setMeta({ updatedAt: Date.now() });
            pending = true;
            flush();
          }
          subscribe();
          renderChip();
        })
        .catch(function () { online = false; renderChip(); });
    }
    function subscribe() {
      sb.channel("money-rt")
        .on("postgres_changes", { event: "*", schema: "public", table: TABLE, filter: "id=eq." + ID }, function (p) {
          var inc = p.new && p.new.state;
          if (!inc) return;
          if (JSON.stringify(inc) === lastPushed) return;
          if ((inc.updatedAt || 0) <= (meta().updatedAt || 0)) return;
          if (isEditing()) return;
          applyRemote(inc);
        })
        .subscribe();
    }

    function renderChip() {
      var chip = document.getElementById("syncChip"), txt = document.getElementById("syncText");
      if (!chip) return;
      chip.classList.remove("ok", "off", "local");
      if (!sb) { chip.classList.add("local"); txt.textContent = "この端末に保存"; return; }
      if (online === true) { chip.classList.add("ok"); txt.textContent = "クラウド同期"; }
      else if (online === false) { chip.classList.add("off"); txt.textContent = "オフライン"; }
      else { chip.classList.add("local"); txt.textContent = "接続中"; }
    }
    function toast(msg) {
      var t = document.getElementById("syncToast");
      if (!t) { t = document.createElement("div"); t.id = "syncToast"; t.className = "sync-toast"; document.body.appendChild(t); }
      t.textContent = msg;
      t.classList.add("show");
      clearTimeout(t._t);
      t._t = setTimeout(function () { t.classList.remove("show"); }, 1800);
    }

    document.addEventListener("visibilitychange", function () { if (document.visibilityState === "hidden") flush(); });
    window.addEventListener("pagehide", flush);

    return { schedule: schedule, touch: touch, init: init };
  })();
  window.MoneySync.init();
})();
</script>
<script>
(function () {
  "use strict";
  var STORAGE_KEY = "money-balance-v1";
  var MIGRATE_KEY = "money-migrate-dismiss-v1";
  var BANK_PH = "銀行名";
  var CARD_PH = "項目";
  var ADV_PH = "項目";

  var state = { banks: [], cards: [], advances: [] };
  var seq = 1;
  function nextId() { return "i" + (seq++) + "_" + Date.now().toString(36); }

  var el = {
    banks: document.getElementById("banks"),
    cards: document.getElementById("cards"),
    advs: document.getElementById("advs"),
    addBank: document.getElementById("addBank"),
    addCard: document.getElementById("addCard"),
    addAdv: document.getElementById("addAdv"),
    subBanks: document.getElementById("subBanks"),
    subCards: document.getElementById("subCards"),
    subAdv: document.getElementById("subAdv"),
    bdBank: document.getElementById("bdBank"),
    bdAdv: document.getElementById("bdAdv"),
    bdCard: document.getElementById("bdCard"),
    remainBig: document.getElementById("remainBig"),
    migrateBar: document.getElementById("migrateBar"),
    migrateClose: document.getElementById("migrateClose"),
    saveBtn: document.getElementById("saveCalcBtn"),
    newBtn: document.getElementById("newCalcBtn"),
    savedCard: document.getElementById("savedCard"),
    savedCount: document.getElementById("savedCount"),
    savedList: document.getElementById("savedList")
  };

  function toNum(v) {
    var n = parseInt(String(v).replace(/[^0-9]/g, ""), 10);
    return isNaN(n) || n < 0 ? 0 : n;
  }
  function yen(n) { return "¥" + Math.round(n).toLocaleString("ja-JP"); }
  function comma(n) { return Number(n).toLocaleString("ja-JP"); }

  // 旧フィールド(paid/day/cardId/repaid)は壊さず温存。name/amount だけ正規化する。
  function normItem(o) {
    var base = (o && typeof o === "object") ? o : {};
    var out = {};
    for (var k in base) { if (Object.prototype.hasOwnProperty.call(base, k)) out[k] = base[k]; }
    out.id = base.id ? String(base.id) : nextId();
    out.name = typeof base.name === "string" ? base.name : "";
    out.amount = toNum(base.amount);
    return out;
  }
  function makeItem() { return { id: nextId(), name: "", amount: 0 }; }

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var s = JSON.parse(raw);
        if (Array.isArray(s.banks)) state.banks = s.banks.map(normItem);
        if (Array.isArray(s.cards)) state.cards = s.cards.map(normItem);
        if (Array.isArray(s.advances)) state.advances = s.advances.map(normItem);
      }
    } catch (e) { /* ignore */ }
    if (state.banks.length === 0) state.banks.push(makeItem());
    if (state.cards.length === 0) state.cards.push(makeItem());
  }

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
    if (window.MoneySync) MoneySync.schedule();
  }

  // 旧「済み」データがある時だけ、初回1回の移行案内
  function maybeMigrateNotice() {
    var dismissed = false;
    try { dismissed = localStorage.getItem(MIGRATE_KEY) === "1"; } catch (e) {}
    if (dismissed) return;
    var hasPaid = state.cards.some(function (c) { return c.paid === true; });
    if (!hasPaid) return;
    el.migrateBar.classList.add("show");
    el.migrateClose.addEventListener("click", function () {
      el.migrateBar.classList.remove("show");
      try { localStorage.setItem(MIGRATE_KEY, "1"); } catch (e) {}
    });
  }

  function rowMarkup(placeholder) {
    return '<input class="name" type="text" placeholder="' + placeholder + '" value="">' +
      '<div class="amount-wrap"><span class="yen">¥</span>' +
      '<input class="amount" type="text" inputmode="numeric" placeholder="0" value=""></div>' +
      '<button class="del" aria-label="削除">×</button>';
  }

  function buildRows(listKey, container, placeholder) {
    container.innerHTML = "";
    state[listKey].forEach(function (item) {
      var row = document.createElement("div");
      row.className = "item";
      row.setAttribute("data-id", item.id);
      row.innerHTML = rowMarkup(placeholder);
      row.querySelector(".name").value = item.name;
      row.querySelector(".amount").value = item.amount ? comma(item.amount) : "";
      container.appendChild(row);
    });
  }

  function findItem(listKey, id) {
    var arr = state[listKey];
    for (var i = 0; i < arr.length; i++) if (arr[i].id === id) return arr[i];
    return null;
  }

  function wireList(listKey, container, placeholder) {
    container.addEventListener("input", function (e) {
      var row = e.target.closest(".item"); if (!row) return;
      var item = findItem(listKey, row.getAttribute("data-id")); if (!item) return;
      var t = e.target;
      if (t.classList.contains("name")) {
        item.name = t.value; save();
      } else if (t.classList.contains("amount")) {
        var n = toNum(t.value);
        item.amount = n;
        t.value = n ? comma(n) : "";
        try { t.setSelectionRange(t.value.length, t.value.length); } catch (x) {}
        render(); save();
      }
    });
    container.addEventListener("click", function (e) {
      var btn = e.target.closest(".del"); if (!btn) return;
      var row = e.target.closest(".item"); if (!row) return;
      var id = row.getAttribute("data-id");
      var item = findItem(listKey, id);
      if (item && (item.name || item.amount)) {
        if (!confirm("「" + (item.name || "無名") + "」を削除しますか？")) return;
      }
      state[listKey] = state[listKey].filter(function (x) { return x.id !== id; });
      buildRows(listKey, container, placeholder);
      render(); save();
    });
  }

  function sumList(listKey) {
    return state[listKey].reduce(function (a, x) { return a + toNum(x.amount); }, 0);
  }

  function render() {
    var b = sumList("banks");
    var cards = sumList("cards");
    var adv = sumList("advances");
    var remain = b + adv - cards;

    el.subBanks.textContent = yen(b);
    el.subCards.textContent = yen(cards);
    el.subAdv.textContent = yen(adv);

    el.bdBank.textContent = yen(b);
    el.bdAdv.textContent = yen(adv);
    el.bdCard.textContent = yen(cards);

    el.remainBig.textContent = (remain < 0 ? "−" : "") + yen(Math.abs(remain));
    el.remainBig.classList.toggle("minus", remain < 0);
  }

  function addItem(listKey, container, placeholder) {
    state[listKey].push(makeItem());
    buildRows(listKey, container, placeholder);
    render(); save();
    var rows = container.querySelectorAll(".item");
    if (rows.length) { var inp = rows[rows.length - 1].querySelector(".name"); if (inp) inp.focus(); }
  }

  function newCalc() {
    if (!confirm("入力をクリアしますか？\n（保存した記録は残ります）")) return;
    state.banks = [makeItem()];
    state.cards = [makeItem()];
    state.advances = [];
    buildRows("banks", el.banks, BANK_PH);
    buildRows("cards", el.cards, CARD_PH);
    buildRows("advances", el.advs, ADV_PH);
    render(); save();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  // ---- 保存した計算（記録） ----
  var SAVED_KEY = "money-saved-v1";
  var savedList = [];

  function loadSaved() {
    try { var r = localStorage.getItem(SAVED_KEY); var a = r ? JSON.parse(r) : []; if (Array.isArray(a)) savedList = a; }
    catch (e) { /* ignore */ }
  }
  function persistSaved() {
    try { localStorage.setItem(SAVED_KEY, JSON.stringify(savedList)); } catch (e) {}
    if (window.MoneySync) MoneySync.schedule();
  }
  function shortDate(ts) { var d = new Date(ts); return (d.getMonth() + 1) + "/" + d.getDate(); }

  function buildSaved() {
    if (!el.savedList) return;
    el.savedCard.style.display = savedList.length ? "" : "none";
    el.savedCount.textContent = savedList.length ? savedList.length + "件" : "";
    el.savedList.innerHTML = "";
    savedList.forEach(function (rec) {
      var r = rec.result || {};
      var minus = (r.remain || 0) < 0;
      var div = document.createElement("div");
      div.className = "saved-item";
      div.setAttribute("data-id", rec.id);
      div.innerHTML =
        '<div class="si-head"><span class="si-name"></span>' +
          '<span class="si-remain' + (minus ? " minus" : "") + '">' + (minus ? "−" : "") + yen(Math.abs(r.remain || 0)) + '</span></div>' +
        '<div class="si-bd">🏦' + yen(r.bank || 0) + '　＋ 🤝' + yen(r.adv || 0) + '　− 💳' + yen(r.card || 0) + '</div>' +
        '<div class="si-foot"><span class="si-date">' + shortDate(rec.savedAt) + '</span>' +
          '<span class="si-actions"><button class="si-load">戻す</button><button class="si-del">削除</button></span></div>';
      div.querySelector(".si-name").textContent = rec.name || "（無名）";
      el.savedList.appendChild(div);
    });
  }

  function saveCurrent() {
    var bank = sumList("banks"), adv = sumList("advances"), card = sumList("cards");
    if (bank === 0 && adv === 0 && card === 0) { alert("入力された金額がありません"); return; }
    var d = new Date();
    var def = (d.getMonth() + 1) + "/" + d.getDate() + " の残高";
    var name = prompt("名前をつけて保存", def);
    if (name === null) return;
    name = (name || "").trim() || def;
    savedList.unshift({
      id: nextId(), name: name, savedAt: Date.now(),
      snapshot: JSON.parse(JSON.stringify({ banks: state.banks, cards: state.cards, advances: state.advances })),
      result: { bank: bank, adv: adv, card: card, remain: bank + adv - card }
    });
    persistSaved(); buildSaved();
  }

  function restoreSaved(rec) {
    if (!confirm("「" + (rec.name || "無名") + "」を入力に戻しますか？\n（今の入力は上書きされます）")) return;
    var s = rec.snapshot || {};
    state.banks = (Array.isArray(s.banks) ? s.banks : []).map(normItem);
    state.cards = (Array.isArray(s.cards) ? s.cards : []).map(normItem);
    state.advances = (Array.isArray(s.advances) ? s.advances : []).map(normItem);
    if (state.banks.length === 0) state.banks.push(makeItem());
    if (state.cards.length === 0) state.cards.push(makeItem());
    buildRows("banks", el.banks, BANK_PH);
    buildRows("cards", el.cards, CARD_PH);
    buildRows("advances", el.advs, ADV_PH);
    render(); save();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function wireSaved() {
    if (el.savedList) {
      el.savedList.addEventListener("click", function (e) {
        var item = e.target.closest(".saved-item"); if (!item) return;
        var id = item.getAttribute("data-id");
        var rec = null;
        for (var i = 0; i < savedList.length; i++) if (savedList[i].id === id) rec = savedList[i];
        if (!rec) return;
        if (e.target.closest(".si-del")) {
          if (!confirm("「" + (rec.name || "無名") + "」を削除しますか？")) return;
          savedList = savedList.filter(function (x) { return x.id !== id; });
          persistSaved(); buildSaved();
        } else if (e.target.closest(".si-load")) {
          restoreSaved(rec);
        }
      });
    }
    if (el.saveBtn) el.saveBtn.addEventListener("click", saveCurrent);
    if (el.newBtn) el.newBtn.addEventListener("click", newCalc);
  }

  // init
  load();
  buildRows("banks", el.banks, BANK_PH);
  buildRows("cards", el.cards, CARD_PH);
  buildRows("advances", el.advs, ADV_PH);
  wireList("banks", el.banks, BANK_PH);
  wireList("cards", el.cards, CARD_PH);
  wireList("advances", el.advs, ADV_PH);
  render();
  maybeMigrateNotice();
  loadSaved();
  buildSaved();
  wireSaved();

  el.addBank.addEventListener("click", function () { addItem("banks", el.banks, BANK_PH); });
  el.addCard.addEventListener("click", function () { addItem("cards", el.cards, CARD_PH); });
  el.addAdv.addEventListener("click", function () { addItem("advances", el.advs, ADV_PH); });
})();
</script>

<!-- tsumiki-back-button -->
<style>
  #tsumikiEdge{position:fixed; top:0; bottom:0; left:0; width:22px; z-index:999;}
  #tsumikiPeek{
    position:fixed; top:50%; left:0; z-index:1001; margin-top:-23px;
    width:46px; height:46px; display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.92);
    -webkit-backdrop-filter:saturate(180%) blur(14px); backdrop-filter:saturate(180%) blur(14px);
    border:1px solid rgba(0,0,0,.06); border-radius:50%;
    box-shadow:0 6px 20px rgba(0,0,0,.18);
    color:#0071e3; font-size:24px; font-weight:600; line-height:1;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Helvetica Neue",Arial,sans-serif;
    transform:translateX(-70px) scale(.8); opacity:0; pointer-events:none;
  }
</style>
<div id="tsumikiEdge"></div>
<div id="tsumikiPeek">‹</div>
<script>
  (function(){
    var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
      || window.navigator.standalone === true;
    var fromTsumiki = false;
    try{
      if(document.referrer){
        var r = new URL(document.referrer);
        fromTsumiki = (r.origin === location.origin);
      }
    }catch(e){}
    if(!(standalone && fromTsumiki)) return;

    var peek = document.getElementById('tsumikiPeek');
    var edge = document.getElementById('tsumikiEdge');

    function goBack(){ location.href = 'index.html'; }

    /* --- 左端エッジスワイプで戻る（iOS純正の戻る操作。見えるボタンは置かない） --- */
    var sx=0, sy=0, prog=0, dragging=false, W=window.innerWidth;
    var TRIGGER = Math.min(120, W*0.32);
    window.addEventListener('resize', function(){ W=window.innerWidth; TRIGGER=Math.min(120, W*0.32); });

    function reset(){
      dragging = false; prog = 0;
      peek.style.transition = 'transform .25s ease, opacity .25s ease';
      peek.style.transform = 'translateX(-70px) scale(.8)';
      peek.style.opacity = 0;
    }
    function start(e){
      var t = e.touches ? e.touches[0] : e;
      if(t.clientX > 26) return;
      sx = t.clientX; sy = t.clientY; prog = 0; dragging = true;
      peek.style.transition = 'none';
    }
    function move(e){
      if(!dragging) return;
      var t = e.touches ? e.touches[0] : e;
      var dx = t.clientX - sx, dy = t.clientY - sy;
      if(Math.abs(dy) > Math.abs(dx) + 12){ reset(); return; }
      if(dx < 0) dx = 0;
      prog = Math.min(dx / TRIGGER, 1);
      peek.style.transform = 'translateX(' + (-70 + prog*82) + 'px) scale(' + (0.8 + prog*0.2) + ')';
      peek.style.opacity = prog;
      if(dx > 6 && e.cancelable) e.preventDefault();
    }
    function end(){
      if(!dragging) return;
      dragging = false;
      if(prog >= 0.999){
        peek.style.transition = 'transform .25s ease, opacity .25s ease';
        peek.style.transform = 'translateX(20px) scale(1.05)';
        peek.style.opacity = 1;
        goBack();
      }else{
        reset();
      }
    }
    edge.addEventListener('touchstart', start, {passive:true});
    window.addEventListener('touchmove', move, {passive:false});
    window.addEventListener('touchend', end, {passive:true});
    window.addEventListener('touchcancel', end, {passive:true});
  })();
</script>
<!-- /tsumiki-back-button -->
</body>
</html>
