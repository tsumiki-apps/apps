<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="apple-touch-icon" href="icons/icon-yarukoto.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="やることばこ">
<meta name="theme-color" content="#F4F2EE">
<title>やることばこ — やること・アイデア・買い物</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* いつつ warm-mono（紙×墨）。アクセント色は持たず、墨(ink)を主役に。 */
    --bg: #F4F2EE;        /* 紙 paper */
    --card: #FBFAF8;      /* 紙より明るいカード面 */
    --text: #242321;      /* 墨 ink */
    --sub: #77736B;       /* 補助 mutedInk */
    --line: #D8D4CC;      /* 罫線 hairline */
    --ghost: #BEB9B0;     /* かすれ */
    --surface: #ECE9E3;   /* 面 */
    --blue: #242321;      /* 旧青→墨に一本化 */
    --green: #5f8f6a;     /* 良い：くすんだ緑（完了・同期OK） */
    --red: #b06a52;       /* 削除：レンガ */
    --orange: #b08a3e;    /* 中間：くすんだ金（オフライン） */
    --gray: #BEB9B0;
    --purple: #242321;
    --chip: #ECE9E3;
    --accent: #242321;    /* アクセント＝墨 */
    --accent-soft: #ECE9E3;
    --radius: 18px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    font-family: 'Zen Maru Gothic', -apple-system, BlinkMacSystemFont, "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    padding-bottom: calc(120px + env(safe-area-inset-bottom));
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; }

  /* ===== ヘッダー ===== */
  header { padding: 26px 4px 6px; text-align: center; }
  h1 { font-size: 22px; font-weight: 700; letter-spacing: .04em; margin: 12px 0 2px; }
  .tagline { color: var(--sub); font-size: 13px; }
  .sync {
    display: inline-flex; align-items: center; gap: 5px; margin-top: 7px;
    font-size: 11.5px; font-weight: 600; color: var(--sub);
    background: var(--card); border: 1px solid var(--line); border-radius: 999px;
    padding: 3px 11px; cursor: default;
  }
  .sync .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gray); }
  .sync.ok .dot { background: var(--green); }
  .sync.off .dot { background: var(--orange); }
  .sync.local .dot { background: var(--gray); }

  /* ===== タブ ===== */
  .tabs {
    position: sticky; top: 0; z-index: 20;
    display: flex; gap: 6px; padding: 12px 0 10px;
    background: linear-gradient(var(--bg) 78%, rgba(244,242,238,0));
  }
  .tab {
    flex: 1; border: none; cursor: pointer; font: inherit;
    background: var(--card); color: var(--sub);
    border: 1px solid var(--line); border-radius: 14px;
    padding: 9px 4px 8px; font-size: 13px; font-weight: 600;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    transition: all .15s;
  }
  .tab .ti { display: flex; align-items: center; justify-content: center; height: 22px; }
  .tab .ti svg { width: 21px; height: 21px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .tab .tn { font-size: 11px; letter-spacing: .02em; }
  .tab .tc { width: 6px; height: 6px; border-radius: 50%; background: transparent; }
  .tab .tc.has { background: var(--text); }
  .tab.on { background: var(--accent); color: var(--card); border-color: var(--accent); box-shadow: 0 6px 18px rgba(36,35,33,.18); }
  .tab.on .tc.has { background: var(--card); }

  /* ===== リスト共通 ===== */
  .panel { display: none; }
  .panel.on { display: block; }
  .empty {
    text-align: center; color: var(--sub); font-size: 14px;
    padding: 48px 20px; line-height: 1.8;
  }
  .empty .e-ico { font-size: 40px; display: block; margin-bottom: 10px; opacity: .8; filter: grayscale(1); }
  .hint { text-align: center; font-size: 11px; color: var(--ghost); padding: 12px 0 2px; }

  .group-label {
    font-size: 12px; font-weight: 600; color: var(--sub);
    margin: 18px 4px 8px; display: flex; align-items: center; gap: 6px;
  }
  .group-label .gl-note { font-weight: 400; font-size: 11px; opacity: .8; }

  /* チェックリスト行（やること・買い物） */
  .row {
    display: flex; align-items: center; gap: 10px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 12px; margin-bottom: 8px;
  }
  .row .check {
    flex: 0 0 auto; width: 23px; height: 23px;
    border-radius: 50%; border: 2px solid var(--line);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    color: var(--card); font-size: 14px; transition: all .15s;
  }
  .row .check.on { background: var(--text); border-color: var(--text); }
  .row .body { flex: 1; min-width: 0; }
  .row .label { font-size: 15px; word-break: break-word; cursor: pointer; white-space: pre-wrap; }
  .row.is-done .check { opacity: .55; }
  .row.is-done .label { color: var(--ghost); text-decoration: line-through; }

  /* 左スワイプで削除（×ボタンの代わり） */
  .swipe { position: relative; border-radius: 14px; margin-bottom: 8px; overflow: hidden; }
  .swipe .swipe-del {
    position: absolute; inset: 0; background: var(--red);
    display: flex; align-items: center; justify-content: flex-end; padding-right: 22px;
    color: var(--card);
  }
  .swipe .swipe-del svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .swipe > .row, .swipe > .ibul { margin-bottom: 0; position: relative; will-change: transform; touch-action: pan-y; }
  .swipe.snap > .row, .swipe.snap > .ibul { transition: transform .22s cubic-bezier(.2,.7,.3,1); }
  /* やること・買い物のテキスト編集（インライン／内容に合わせて自動で伸びる） */
  .row .label-edit {
    width: 100%; font: inherit; font-size: 16px; line-height: 1.5; color: var(--text);
    border: none; border-bottom: 2px solid var(--accent); background: transparent;
    border-radius: 0; padding: 0 0 3px; margin: -1px 0; outline: none;
    display: block; resize: none; overflow: hidden; box-sizing: border-box;
  }
  .row .dx {
    flex: 0 0 auto; border: none; background: var(--chip); color: var(--sub);
    border-radius: 6px; width: 19px; height: 19px; line-height: 1;
    font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit;
  }
  .row .del {
    flex: 0 0 auto; align-self: center; border: none; background: none; cursor: pointer;
    color: #c7c7cc; font-size: 20px; padding: 0 2px; line-height: 1;
  }

  /* ===== アイデア：アプリ選択グリッド ===== */
  .idea-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    margin: 14px 0 24px;
  }
  .app-tile {
    display: flex; flex-direction: column; align-items: flex-start; gap: 5px;
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 15px 14px 13px; cursor: pointer; font-family: inherit; text-align: left;
  }
  .app-tile:active { transform: scale(.98); }
  .app-tile .at-emoji { font-size: 26px; line-height: 1; filter: grayscale(1); }
  .app-tile .at-label { font-size: 14px; font-weight: 700; color: var(--text); word-break: break-word; }
  .app-tile .at-count { font-size: 11.5px; font-weight: 600; color: var(--sub); }
  .app-tile.make { background: var(--surface); border-color: var(--line); }
  .app-tile.add {
    flex-direction: row; align-items: center; justify-content: center; gap: 8px;
    border-style: dashed; border-color: var(--accent);
  }
  .app-tile.add .at-emoji { font-size: 20px; }
  .app-tile.add .at-label { color: var(--accent); }
  /* アイデアグリッド内の全幅グループ見出し（あとで / 完了） */
  .idea-glabel {
    grid-column: 1 / -1;
    font-size: 12px; font-weight: 600; color: var(--sub);
    margin: 6px 4px 0; display: flex; align-items: center; gap: 6px;
  }
  .idea-glabel .gl-note { font-weight: 400; font-size: 11px; opacity: .8; }

  /* ===== アイデア：選んだアプリの箇条書き ===== */
  .idea-head { display: flex; flex-direction: column; gap: 8px; margin: 8px 0 16px; }
  .ih-back {
    align-self: flex-start; border: none; background: none; cursor: pointer;
    font-family: inherit; font-size: 14px; font-weight: 600; color: var(--accent); padding: 4px 0;
  }
  .ih-titlerow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .ih-title { display: flex; align-items: center; gap: 9px; font-size: 20px; font-weight: 700; min-width: 0; }
  .ih-title .ih-emoji { font-size: 24px; flex: 0 0 auto; filter: grayscale(1); }
  .ih-copyall {
    flex: 0 0 auto; border: 1px solid var(--line); cursor: pointer; font-family: inherit;
    background: var(--card); color: var(--text); border-radius: 50%;
    width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center;
  }
  .ih-copyall svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .ih-copyall:active { transform: scale(.96); }

  .ibul {
    display: flex; align-items: flex-start; gap: 9px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 12px 12px 12px 13px; margin-bottom: 8px;
  }
  .ibul .ib-check {
    flex: 0 0 auto; width: 21px; height: 21px; margin-top: 1px;
    border-radius: 50%; border: 2px solid var(--line); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--card); font-size: 13px; transition: all .15s;
  }
  .ibul .ib-check.on { background: var(--text); border-color: var(--text); }
  .ibul.is-done .ib-check { opacity: .55; }
  .ibul.is-done .ib-text { color: var(--ghost); text-decoration: line-through; }
  .ibul.is-later { border-style: dashed; }
  .ibul.is-later .ib-text { color: var(--sub); }
  .ibul .ib-text {
    flex: 1; min-width: 0; font-size: 15px; line-height: 1.5;
    white-space: pre-wrap; word-break: break-word; cursor: pointer; padding-top: 1px;
  }
  .ibul .ib-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .ibul .ib-main .ib-text { flex: none; }
  .ibul .ib-thumb {
    display: block; max-width: 100%; width: auto; max-height: 180px;
    border-radius: 10px; border: 1px solid var(--line); cursor: zoom-in;
    object-fit: cover; align-self: flex-start;
  }
  .ibul .ib-act { flex: 0 0 auto; display: flex; gap: 1px; align-items: flex-start; }
  .ibul .ib-act button {
    border: none; background: none; cursor: pointer; font-size: 16px;
    padding: 1px 4px; line-height: 1.3;
  }
  /* 画像の全画面ビューア */
  .img-viewer {
    position: fixed; inset: 0; z-index: 200; display: none;
    background: rgba(0,0,0,.88); align-items: center; justify-content: center;
    flex-direction: column; gap: 16px; padding: 20px;
  }
  .img-viewer.on { display: flex; }
  .img-viewer img { max-width: 100%; max-height: 78vh; border-radius: 10px; }
  .img-viewer .iv-bar { display: flex; gap: 12px; }
  .img-viewer .iv-bar button {
    border: none; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 700;
    border-radius: 999px; padding: 11px 20px;
  }
  .img-viewer .iv-close { background: var(--card); color: var(--text); }
  .img-viewer .iv-del { background: rgba(255,255,255,.16); color: #e8a892; }
  /* 追加バーのカメラボタン */
  .addbar .cam {
    flex: 0 0 auto; border: 1px solid var(--line); background: var(--card); cursor: pointer;
    border-radius: 12px; width: 46px; display: flex; color: var(--text);
    align-items: center; justify-content: center; align-self: stretch;
  }
  .addbar .cam svg { width: 21px; height: 21px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .addbar .cam:active { transform: scale(.95); }
  .ib-edit {
    flex: 1; min-width: 0; font: inherit; font-size: 15px; line-height: 1.5; color: var(--text);
    border: none; border-bottom: 2px solid var(--accent); background: transparent;
    padding: 0 0 3px; outline: none; resize: none; overflow: hidden; box-sizing: border-box;
  }

  /* ===== まとめて完了バー ===== */
  .bulk-bar { margin: 2px 4px 12px; }
  .bulk-bar button {
    width: 100%; border: 1px solid var(--line); background: var(--card);
    color: var(--sub); font-family: inherit; font-size: 13px; font-weight: 600;
    border-radius: 12px; padding: 11px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  }
  .bulk-bar button svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .bulk-bar button:active { transform: scale(.98); background: var(--surface); }

  /* アプリ選択ピッカー */
  .sheet-sub { font-size: 13px; color: var(--sub); margin: 2px 2px 14px; }
  .picker { display: flex; flex-direction: column; gap: 6px; max-height: 60vh; overflow-y: auto; }
  .pk-row {
    display: flex; align-items: center; gap: 11px;
    border: 1px solid var(--line); background: var(--bg); border-radius: 12px;
    padding: 11px 13px; cursor: pointer; font-family: inherit; text-align: left;
  }
  .pk-row:active { background: var(--accent-soft); }
  .pk-emoji { font-size: 20px; flex: 0 0 auto; filter: grayscale(1); }
  .pk-label { flex: 1; font-size: 15px; font-weight: 600; color: var(--text); }
  .pk-count { font-size: 12px; font-weight: 700; color: var(--sub); background: var(--chip); border-radius: 999px; padding: 2px 9px; }

  .foot-act { text-align: center; margin: 16px 0 4px; }
  .foot-act button {
    border: none; background: none; cursor: pointer; font-family: inherit;
    font-size: 13px; font-weight: 600; color: var(--sub);
  }

  /* ===== 下部の追加バー ===== */
  .addbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    padding: 10px 16px calc(12px + env(safe-area-inset-bottom));
    background: rgba(244,242,238,.86); backdrop-filter: saturate(180%) blur(18px);
    -webkit-backdrop-filter: saturate(180%) blur(18px);
    border-top: 1px solid var(--line);
  }
  .addbar-inner { max-width: 640px; margin: 0 auto; display: flex; gap: 9px; }
  .addbar input {
    flex: 1; min-width: 0; font: inherit; font-size: 16px;
    border: 1px solid var(--line); background: var(--card);
    border-radius: 13px; padding: 12px 14px; color: var(--text);
  }
  .addbar input:focus { outline: none; border-color: var(--accent); background: var(--card); }
  .addbar .add {
    flex: 0 0 auto; border: none; cursor: pointer; font-family: inherit;
    background: var(--accent); color: var(--card); font-size: 22px; font-weight: 600;
    border-radius: 13px; width: 52px; display: flex; align-items: center; justify-content: center;
  }
  .addbar .add.wide { width: auto; flex: 1; font-size: 16px; gap: 6px; }
  .addbar .add:active { transform: scale(.96); }

  /* ===== やること追加の丸ボタン（右下FAB） ===== */
  .fab {
    position: fixed; right: 20px; bottom: calc(26px + env(safe-area-inset-bottom));
    z-index: 35; width: 64px; height: 64px; border-radius: 50%;
    border: none; cursor: pointer; font-family: inherit;
    background: var(--accent); color: var(--card); font-size: 34px; font-weight: 300; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 24px rgba(36,35,33,.32);
  }
  .fab:active { transform: scale(.93); }

  /* ===== シート（アプリ選択ピッカー） ===== */
  .sheet-bg {
    position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.32);
    display: none; align-items: flex-end; justify-content: center;
  }
  .sheet-bg.on { display: flex; }
  .sheet {
    background: var(--card); width: 100%; max-width: 640px;
    border-radius: 22px 22px 0 0; padding: 20px 18px calc(20px + env(safe-area-inset-bottom));
    max-height: 90vh; overflow-y: auto;
  }
  .sheet h3 { font-size: 18px; font-weight: 700; margin: 0 0 4px; }
  .sheet-act { display: flex; gap: 10px; margin-top: 18px; }
  .sheet-act button {
    flex: 1; border: none; cursor: pointer; font-family: inherit;
    font-size: 16px; font-weight: 600; border-radius: 13px; padding: 13px;
  }
  .sheet-act .cancel { background: var(--chip); color: var(--text); }
  .sheet-act .confirm { background: var(--accent); color: var(--card); }
  .sheet-act .confirm:active { transform: scale(.98); }
  /* 長押しメニュー（アイデア1件の操作）— アイコン中心 */
  .act-list { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
  .act-list button {
    display: flex; align-items: center; gap: 13px; width: 100%; text-align: left;
    border: none; background: none; cursor: pointer; font-family: inherit;
    font-size: 15px; font-weight: 600; color: var(--text); padding: 13px 8px;
    border-radius: 12px;
  }
  .act-list button:active { background: var(--surface); }
  .act-list button.danger { color: var(--red); }
  .act-list button svg { width: 21px; height: 21px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }

  /* やること追加シートの入力欄 */
  .add-ta {
    width: 100%; font: inherit; font-size: 16px; color: var(--text);
    border: 1px solid var(--line); background: var(--bg);
    border-radius: 13px; padding: 12px 14px; min-height: 104px;
    line-height: 1.6; resize: none; margin-top: 4px;
  }
  .add-ta:focus { outline: none; border-color: var(--accent); background: var(--card); }

  .toast {
    position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(12px); z-index: 60;
    background: rgba(36,35,33,.96); color: #FBFAF8; font-size: 13px; font-weight: 600;
    padding: 9px 10px 9px 16px; border-radius: 999px; opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s; display: inline-flex; align-items: center; gap: 12px;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
  .toast .undo {
    border: none; background: rgba(255,255,255,.16); color: #FBFAF8; cursor: pointer;
    font-family: inherit; font-size: 13px; font-weight: 700; border-radius: 999px; padding: 5px 13px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>やることばこ</h1>
    <div class="sync local" id="syncChip"><span class="dot"></span><span id="syncText">この端末に保存</span></div>
  </header>

  <nav class="tabs">
    <button class="tab on" data-tab="todo"><span class="ti"><svg viewBox="0 0 24 24"><path d="M9 11l2.5 2.5L20 5"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg></span><span class="tn">やること</span><span class="tc" id="c-todo"></span></button>
    <button class="tab" data-tab="idea"><span class="ti"><svg viewBox="0 0 24 24"><path d="M9.5 18h5"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-3.8 10.7c.6.5.9 1.1.9 1.8v.5h5.8v-.5c0-.7.3-1.3.9-1.8A6 6 0 0 0 12 3z"/></svg></span><span class="tn">アイデア</span><span class="tc" id="c-idea"></span></button>
    <button class="tab" data-tab="shop"><span class="ti"><svg viewBox="0 0 24 24"><path d="M6 8h12l-1 11.2a1.5 1.5 0 0 1-1.5 1.3H8.5A1.5 1.5 0 0 1 7 19.2L6 8z"/><path d="M9 8.5V6.5a3 3 0 0 1 6 0v2"/></svg></span><span class="tn">買い物</span><span class="tc" id="c-shop"></span></button>
  </nav>

  <section class="panel on" id="panel-todo"></section>
  <section class="panel" id="panel-idea"></section>
  <section class="panel" id="panel-shop"></section>
</div>

<div class="addbar"><div class="addbar-inner" id="addbar"></div></div>

<!-- やること追加の丸ボタン（右下FAB） -->
<button class="fab" id="todoFab" style="display:none" aria-label="やることを追加">＋</button>

<!-- アプリ選択ピッカー -->
<div class="sheet-bg" id="sheetBg">
  <div class="sheet" id="sheet">
    <h3>どのアプリのアイデア？</h3>
    <p class="sheet-sub">アイデアを書きたいアプリを選んでください</p>
    <div class="picker" id="appPicker"></div>
    <div class="sheet-act">
      <button class="cancel" id="sheetCancel">閉じる</button>
    </div>
  </div>
</div>

<!-- やること追加シート -->
<div class="sheet-bg" id="addSheetBg">
  <div class="sheet" id="addSheet">
    <h3>やることを追加</h3>

// index.html(つみき) の categories からアプリ一覧を自動取り込み。
// 新アプリは「つみきに追加→公開」だけで、ここのアプリ選択にも自動で現れる。
async function loadCatalogFromIndex(){
  try{
    const res = await fetch('index.html', {cache:'no-store'});
    if(!res.ok) return;
    const html = await res.text();
    const m = html.match(/const\s+categories\s*=\s*\[([\s\S]*?)\];/);
    if(!m) return;
    const apps = [];
    const re = /\{\s*emoji:"([^"]*)",\s*title:"([^"]*)",\s*desc:"[^"]*",\s*href:"([^"]*)"\s*\}/g;
    let g;
    while((g = re.exec(m[1]))){
      const key = g[3].replace(/\.html$/,'');
      if(!key || key.startsWith('check')) continue;   // チェックルーム類は除外
      apps.push({ key, emoji:g[1], label:g[2] });
    }
    if(apps.length < 5) return;   // 解析失敗っぽいときは内蔵リストを維持
    APP_CATALOG = [{ key:'index', emoji:'🧱', label:'つみきTOP' }]
      .concat(apps, [{ key:'other', emoji:'📦', label:'その他' }]);
    render();   // 取り込めたら表示中の画面へ反映
  }catch(e){ /* オフライン等は内蔵リストのまま */ }
}
loadCatalogFromIndex();

// 旧アイデアの tag 文字列からアプリkeyを推定（見つからなければ null）
function matchApp(tag){
  if(!tag) return null;

  const tl = t.toLowerCase();
  for(const a of APP_CATALOG){
    const lbl = a.label.toLowerCase();
    if(a.key===tl || lbl===tl || lbl.includes(tl) || tl.includes(lbl) || tl.includes(a.key)) return a.key;
  }
  for(const k in APP_ALIAS){ if(t.includes(k)) return APP_ALIAS[k]; }
  return null;
}

/* ===================== ユーティリティ ===================== */
function uid(){ return Date.now().toString(36) + Math.floor(Math.random()*1e6).toString(36); }
// テキストエリアを中身の高さに合わせて自動で伸ばす（編集中に全文が見える）
function autoGrow(el){

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
// 日本語入力（IME）の「変換確定Enter」を送信と誤認しないためのガード。
// Macでは変換確定のEnterが isComposing=false / keyCode=13 で飛んでくることがあるので、
// 直前の compositionend からの経過時間でも変換確定かどうかを判定する。
// 返り値の関数が true を返したら、その Enter は送信せず無視する。
function imeGuard(el){
  let composing=false, endedAt=0;
  el.addEventListener('compositionstart', ()=>{ composing=true; });
  el.addEventListener('compositionend',   ()=>{ composing=false; endedAt=Date.now(); });
  return e => composing || e.isComposing || e.keyCode===229 || (Date.now()-endedAt) < 250;
}
// PC（マウス＋物理キーボードの端末）では、IMEの変換確定EnterとふつうのEnterを
// 完全には区別できないため、Enterでの追加・確定を一切しない。追加は「＋」ボタンのみ。
// スマホ・タブレット（タッチ操作）はこれまでどおりEnter（確定キー）で追加できる。
const IS_PC = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
function toast(msg){

}
/* 取り消しつきトースト：操作を実行→「取り消す」を押せば undoFn で元に戻す（confirm の置き換え） */
function undoToast(msg, undoFn){
  const t=document.getElementById('toast');
  t.innerHTML='';
  const span=document.createElement('span'); span.textContent=msg; t.appendChild(span);
  const btn=document.createElement('button'); btn.className='undo'; btn.textContent='取り消す'; t.appendChild(btn);
  t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>{ t.classList.remove('show'); },4200);
  btn.onclick=()=>{ clearTimeout(t._t); t.classList.remove('show'); undoFn(); };
}
/* 元の位置を覚えて取り除き、取り消せる削除（× と confirm の代わり） */
function softRemove(arr, item, label){

  arr.splice(idx,1); save();

}

function svg(name, size){ return '<svg viewBox="0 0 24 24" style="width:'+(size||21)+'px;height:'+(size||21)+'px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round">'+ICON[name]+'</svg>'; }
async function copyText(text){
  const s = String(text==null?'':text);
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){ await navigator.clipboard.writeText(s); return true; }
  }catch(e){}
  // フォールバック（iOS Safari / 非セキュアコンテキスト用）
  try{
    const ta = document.createElement('textarea');
    ta.value = s; ta.setAttribute('readonly','');
    ta.style.position='fixed'; ta.style.top='0'; ta.style.left='0'; ta.style.opacity='0';
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, s.length);
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  }catch(e){ return false; }
}
/* ===================== 状態 ===================== */
function blank(){ return { todos:[], ideas:[], shopping:[] }; }
let db = blank();
let online = null;        // null=確認中 true=同期OK false=オフライン（sbあり）
let lastPushed = '';
let tab = 'todo';
let ideaApp = null;       // null=アプリ選択グリッド / それ以外=そのアプリの箇条書き詳細

/* ===================== 永続化・同期 ===================== */
function migrate(){
  let o = 0;
  db.todos.forEach(x=>{ if(typeof x.order!=='number') x.order=o; o++; });
  o = 0;
  db.shopping.forEach(x=>{ if(typeof x.order!=='number') x.order=o; o++; });
  // 旧アイデア（title/memo/kind/tag/priority/status）→ 新アイデア（app別の箇条書き text）へ変換
  db.ideas.forEach(x=>{
    if(x.text===undefined && x.title!==undefined){
      const app = (x.kind==='plan') ? '_new' : (matchApp(x.tag) || '_new');
      let text = x.title || '';
      if(x.memo) text += '\n' + x.memo;
      x.app = app;
      x.text = text;
      delete x.title; delete x.memo; delete x.kind; delete x.tag;
      delete x.priority; delete x.status; delete x.prevStatus;
      if(!x.ts) x.ts = Date.now();
      if(!x.updated) x.updated = x.ts;
    }
    if(!x.app) x.app = '_new';
    if(x.text===undefined) x.text = '';
    if(!('done' in x)) x.done = false;
  });
}

/* 完了したものは日付が変わる00:00に自動的に消す */
function purgeDone(){
  const now = Date.now();
  const startOfToday = new Date();
  startOfToday.setHours(0,0,0,0);
  const cutoff = startOfToday.getTime();  // 今日の00:00より前に完了したものは消す
  let changed = false;
  const sweep = (arr)=>arr.filter(x=>{
    if(!x.done) return true;
    // 旧データで doneAt が無いものは、ここで起点を打って今日いっぱいの猶予を与える
    if(!x.doneAt){ x.doneAt = now; changed = true; return true; }
    if(x.doneAt < cutoff){ changed = true; return false; }
    return true;
  });
  db.todos = sweep(db.todos);
  db.shopping = sweep(db.shopping);
  db.ideas = sweep(db.ideas);
  return changed;
}

function loadLocal(){ try{ const s=localStorage.getItem(KEY); if(s) db=Object.assign(blank(), JSON.parse(s)); }catch(e){} }

let saveTimer=null;
function save(){
  localStorage.setItem(KEY, JSON.stringify(db));
  if(!sb) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async()=>{
    const payload = JSON.stringify(db);
    lastPushed = payload;
    const { error } = await sb.from(STATE_TABLE)
      .upsert({ id:STATE_ID, state: db, updated_at:new Date().toISOString() });
    if(error){ online=false; } else if(online!==true){ online=true; }
    renderSync();
  }, 350);
}
async function loadRemote(){
  if(!sb){ online=false; return; }
  const { data, error } = await sb.from(STATE_TABLE).select('state').eq('id', STATE_ID).maybeSingle();
  if(error){ online=false; renderSync(); return; }
  online = true;
  if(data && data.state && typeof data.state==='object'){
    db = Object.assign(blank(), data.state);   // リモート優先
    migrate();
    if(purgeDone()) save();
    localStorage.setItem(KEY, JSON.stringify(db));
    render();
  } else {
    // リモートにまだ行が無い → 今あるローカルを種として上げる
    if(db.todos.length || db.ideas.length || db.shopping.length) save();
  }
  renderSync();
}
function subscribeRealtime(){
  if(!sb) return;
  sb.channel('yarukoto-rt')
    .on('postgres_changes', { event:'*', schema:'public', table:STATE_TABLE, filter:'id=eq.'+STATE_ID },
      (payload)=>{
        const incoming = JSON.stringify((payload.new && payload.new.state) || {});
        if(incoming === lastPushed) return;     // 自分の書き込みのエコー
        if(payload.new && payload.new.state){
          db = Object.assign(blank(), payload.new.state);
          migrate();
          localStorage.setItem(KEY, JSON.stringify(db));
          render();
        }
      })
    .subscribe();
}
function renderSync(){
  const chip = document.getElementById('syncChip');
  const txt = document.getElementById('syncText');
  chip.classList.remove('ok','off','local');
  if(!sb){ chip.classList.add('local'); txt.textContent='この端末に保存'; return; }
  if(online===true){ chip.classList.add('ok'); txt.textContent='クラウド同期中'; }
  else if(online===false){ chip.classList.add('off'); txt.textContent='オフライン（この端末に保存）'; }
  else { chip.classList.add('local'); txt.textContent='接続中…'; }
}

/* ===================== 描画 ===================== */
const panels = { todo:'panel-todo', idea:'panel-idea', shop:'panel-shop' };

function render(){
  renderCounts();
  renderChecklist('todo');
  renderIdeas();
  renderChecklist('shop');
  renderAddbar();
}
function renderCounts(){
  const t = db.todos.filter(x=>!x.done).length;
  const i = db.ideas.filter(x=>!x.done && !x.later).length;  // 「あとで」はカウントしない
  const s = db.shopping.filter(x=>!x.done).length;
  // 件数は「ある／ない」を小さな点で示す（数字は出さない＝文字を減らす）
  const dot = (id,n)=>{ const el=document.getElementById(id); el.textContent=''; el.classList.toggle('has', n>0); el.title = n? n+'件' : ''; };

/* やること / 買い物 */
function sortActive(list){
  return list.slice().sort((a,b)=>(a.order||0)-(b.order||0));
}
function renderChecklist(kind){
  const isTodo = kind==='todo';
  const list = isTodo ? db.todos : db.shopping;
  const el = document.getElementById(isTodo ? 'panel-todo' : 'panel-shop');
  if(!list.length){
    el.innerHTML = '<div class="empty"><span class="e-ico">'+(isTodo?'📝':'🛒')+'</span>'+
      (isTodo ? '右下の ＋ ボタンから<br>やることを足していこう' : '下の入力欄から<br>買うものを追加しよう')+'</div>';
    return;
  }
  const active = sortActive(list.filter(x=>!x.done));
  const done = list.filter(x=>x.done);
  let html = '';
  if(active.length >= 2){
    html += '<div class="bulk-bar"><button data-completeall="'+kind+'">'+svg('check',16)+'すべて完了</button></div>';
  }
  html += active.map(x=>rowHTML(x, kind)).join('');
  if(done.length){
    html += '<div class="group-label">'+svg('check',14)+(isTodo?'完了':'買ったもの')+'</div>';
    html += done.map(x=>rowHTML(x, kind)).join('');
  }
  el.innerHTML = html;
}
function rowHTML(x, kind){
  // 左スワイプで削除（赤土の削除面を背後に敷く）。× ボタンは置かない。
  return '<div class="swipe" data-kind="'+kind+'" data-id="'+x.id+'">'+
    '<div class="swipe-del" aria-hidden="true">'+svg('trash',22)+'</div>'+
    '<div class="row'+(x.done?' is-done':'')+'" data-kind="'+kind+'" data-id="'+x.id+'">'+
      '<div class="check'+(x.done?' on':'')+'" data-act="toggle">'+(x.done?svg('check',13):'')+'</div>'+
      '<div class="body">'+
        '<div class="label" data-act="editText">'+esc(x.text)+'</div>'+
      '</div>'+
    '</div>'+
  '</div>';
}

/* アイデア — アプリ選択グリッド / 選んだアプリの箇条書き詳細 の2階層 */
function renderIdeas(){
  const el = document.getElementById('panel-idea');
  if(ideaApp){ renderIdeaDetail(el); return; }

  // 件数を集計（active=未完了かつ非あとで / laterCnt=あとで / total=全体）。
  // lastAct=アプリ内アイデアの最終更新時刻（群の中の並び替え用）。
  const total = {}, active = {}, laterCnt = {}, lastAct = {};
  db.ideas.forEach(x=>{
    total[x.app]=(total[x.app]||0)+1;
    const t = x.updated || x.ts || 0;
    if(t > (lastAct[x.app]||0)) lastAct[x.app] = t;
    if(x.done) return;
    // 「あとで」に送ったものは件数にカウントしない
    if(x.later) laterCnt[x.app]=(laterCnt[x.app]||0)+1;
    else active[x.app]=(active[x.app]||0)+1;
  });

  // アプリ制作(_new)以外で、アイデアを持つアプリkeyを3群に分ける（各群は新しい順）
  const byRecent = (a,b)=>(lastAct[b]||0)-(lastAct[a]||0);
  const keys = Object.keys(total).filter(k=>k!=='_new');
  const activeKeys = keys.filter(k=>(active[k]||0)>0).sort(byRecent);
  const laterKeys  = keys.filter(k=>(active[k]||0)===0 && (laterCnt[k]||0)>0).sort(byRecent);
  const doneKeys   = keys.filter(k=>(active[k]||0)===0 && (laterCnt[k]||0)===0).sort(byRecent);

  const tile = (a)=>{
    const n = active[a.key] || 0, L = laterCnt[a.key] || 0, tt = total[a.key] || 0;
    const label = n ? n+'件' : (L ? 'あとで'+L : (tt ? '完了' : 'メモする'));
    return '<button class="app-tile'+(a.key==='_new'?' make':'')+'" data-app="'+esc(a.key)+'">'+
      '<span class="at-emoji">'+a.emoji+'</span>'+
      '<span class="at-label">'+esc(a.label)+'</span>'+
      '<span class="at-count">'+label+'</span>'+
    '</button>';
  };
  const glabel = (txt)=>'<div class="idea-glabel">'+txt+'</div>';

  let html = '<div class="idea-grid">';
  // ① アイデアあり：✨アプリ制作を常に先頭固定 ＋ 未完了アイデアのあるアプリ
  html += tile(NEW_APP);
  html += activeKeys.map(k=>tile(bucketMeta(k))).join('');
  // ② あとで：アクティブ0件であとでが残っているアプリ
  if(laterKeys.length){
    html += glabel('あとで');
    html += laterKeys.map(k=>tile(bucketMeta(k))).join('');
  }
  // ③ 完了：完了のみ（当日だけ表示。翌0時に自動で消えます）
  if(doneKeys.length){
    html += glabel('完了');
    html += doneKeys.map(k=>tile(bucketMeta(k))).join('');
  }
  html += '<button class="app-tile add" data-pick="1"><span class="at-emoji">＋</span><span class="at-label">アプリを選ぶ</span></button>';
  html += '</div>';
  el.innerHTML = html;
}
function renderIdeaDetail(el){
  const meta = bucketMeta(ideaApp);
  const all = db.ideas.filter(x=>x.app===ideaApp);
  const active = all.filter(x=>!x.done && !x.later).sort((a,b)=>(a.ts||0) - (b.ts||0));  // 古い順＝新しく追加したものが下に並ぶ
  const later = all.filter(x=>!x.done && x.later).sort((a,b)=>(b.updated||b.ts||0) - (a.updated||a.ts||0));
  const done = all.filter(x=>x.done).sort((a,b)=>(b.doneAt||0) - (a.doneAt||0));
  let html = '<div class="idea-head">'+
    '<button class="ih-back" data-back="1">‹ アプリ一覧</button>'+
    '<div class="ih-titlerow">'+
      '<div class="ih-title"><span class="ih-emoji">'+meta.emoji+'</span>'+esc(meta.label)+'</div>'+
      (active.length ? '<button class="ih-copyall" data-copyall="1" aria-label="まとめてプロンプトをコピー" title="まとめてプロンプトをコピー">'+svg('copy',19)+'</button>' : '')+
    '</div>'+
  '</div>';
  if(!all.length){
    html += '<div class="empty"><span class="e-ico">'+meta.emoji+'</span>下の入力欄から<br>アイデアを箇条書きで足していこう</div>';
  } else {
    // 未完了（あとで🌙も含む）が2件以上なら、このアプリのアイデアをまとめて完了できるボタンを出す
    const completable = active.length + later.length;
    if(completable >= 2){
      html += '<div class="bulk-bar"><button data-completeallidea="1">'+svg('check',16)+'すべて完了</button></div>';
    }
    html += active.map(ideaItemHTML).join('');
    if(later.length){
      html += '<div class="group-label">'+svg('moon',14)+'あとで</div>';
      html += later.map(ideaItemHTML).join('');
    }
    if(done.length){
      html += '<div class="group-label">'+svg('check',14)+'完了</div>';
      html += done.map(ideaItemHTML).join('');
    }
    // 各行は タップ＝編集 / ◯タップ＝完了 / 左スワイプ＝削除 / 長押し＝メニュー
    html += '<div class="hint">長押しで メニュー ・ 左スワイプで削除</div>';
  }
  el.innerHTML = html;
}
function ideaItemHTML(x){
  // 操作は 長押しメニュー に集約（インラインのボタン列は置かない＝文字とアイコンを減らす）
  return '<div class="swipe" data-id="'+x.id+'">'+
    '<div class="swipe-del" aria-hidden="true">'+svg('trash',22)+'</div>'+
    '<div class="ibul'+(x.done?' is-done':'')+(x.later?' is-later':'')+'" data-id="'+x.id+'">'+
      '<div class="ib-check'+(x.done?' on':'')+'" data-act="toggle">'+(x.done?svg('check',13):'')+'</div>'+
      '<div class="ib-main">'+
        '<div class="ib-text" data-act="edit">'+esc(x.text)+'</div>'+
        (x.img ? '<img class="ib-thumb" src="'+x.img+'" data-act="viewimg" alt="スクショ" loading="lazy">' : '')+

/* 選んでいるアプリの通常アイデア（完了・あとでを除く）を、Claudeに渡すプロンプト文へ。
   表示と同じ並び（新しい順）で 1→ 2→ … と番号を振る。 */
function buildIdeaPrompt(){
  const meta = bucketMeta(ideaApp);
  const active = db.ideas.filter(x=>x.app===ideaApp && !x.done && !x.later)
    .sort((a,b)=>(a.ts||0) - (b.ts||0));  // 表示と同じ「古い順（新しいものが下）」で番号を振る
  if(!active.length) return '';
  let s = meta.label+'の改善がしたいです。\n';
  s += '以下の'+active.length+'個の改善を手伝ってください。\n';
  s += active.map((x,i)=>(i+1)+'→'+(x.text || (x.img ? '（スクショ参照）' : ''))).join('\n');
  s += '\n\nもしあなたに情報提供する必要があれば言ってください。\n';
  s += 'この指示においてなるべくあなたに作業を任せたいです。\n';
  s += 'すべての処理を承認しますので、できるだけあなたが操作してください。';
  return s;
}

function onChecklistClick(e){
  // スワイプ中・直後のタップは無視（誤操作防止）
  if(suppressClick){ e.stopPropagation(); return; }
  const completeAll = e.target.closest('[data-completeall]');
  if(completeAll){
    const kind = completeAll.dataset.completeall;
    const arr = kind==='todo' ? db.todos : db.shopping;
    const actives = arr.filter(x=>!x.done);
    if(!actives.length) return;
    const now = Date.now();
    actives.forEach(x=>{ x.done = true; x.doneAt = now; });
    save(); render();
    undoToast(actives.length+'件を完了', ()=>{ actives.forEach(x=>{ x.done=false; delete x.doneAt; }); save(); render(); });
    return;
  }
  const row = e.target.closest('.row'); if(!row) return;
  const kind = row.dataset.kind, id = row.dataset.id;
  const arr = kind==='todo' ? db.todos : db.shopping;
  const item = arr.find(x=>x.id===id); if(!item) return;
  const act = e.target.closest('[data-act]')?.dataset.act;
  if(act==='editText'){ startInlineEdit(row, item); }
  else if(act==='toggle'){
    item.done=!item.done; if(item.done) item.doneAt=Date.now(); save(); render();
    if(item.done) undoToast('完了', ()=>{ item.done=false; delete item.doneAt; save(); render(); });
  }
}

/* テキストをその場で編集（タップ→入力欄に変身） */
function startInlineEdit(row, item){
  const labelEl = row.querySelector('.label');
  if(!labelEl) return;
  const input = document.createElement('textarea');
  input.className = 'label-edit';
  input.value = item.text;
  input.rows = 1;
  input.setAttribute('enterkeyhint','done');
  labelEl.replaceWith(input);
  input.focus();
  autoGrow(input);   // 中身の高さに合わせて全文を表示
  input.addEventListener('input', ()=>autoGrow(input));
  // キャレットを末尾に
  const v = input.value; input.value=''; input.value=v;
  let committed = false;
  function commit(persist){
    if(committed) return; committed = true;
    if(persist){
      const nv = input.value.trim();
      if(nv && nv !== item.text){ item.text = nv; save(); }
    }
    render();
  }
  const isIME = imeGuard(input);
  input.addEventListener('keydown', e=>{
    // PCはEnterで確定しない（変換確定Enterと区別できないため）。欄の外をクリックで確定。
    if(e.key==='Enter'){ e.preventDefault(); if(!IS_PC && !isIME(e)) commit(true); }
    else if(e.key==='Escape'){ commit(false); }
  });
  input.addEventListener('blur', ()=>commit(true));
}

  addTodoInput.value = '';

  // 既存の最小orderより前に、入力順を保って積む（1行目が一番上）
  let base = db.todos.reduce((m,x)=>Math.min(m, x.order||0), 0);
  lines.forEach((text,i)=>{

  });
  save();
  closeAddSheet();
  render();
  toast(lines.length>1 ? (lines.length+'件追加しました') : '追加しました');
}

/* ===================== ジェスチャー（左スワイプ削除・長押しメニュー） ===================== */
// 行は .swipe でくるみ、中の .row / .ibul を指でなぞって左へ寄せると赤土の削除面が出る。
// しきい値まで寄せて離すと削除（取り消しトーストつき）。横より縦が勝てばスクロールに譲る。
let suppressClick = false;          // スワイプ直後のタップ誤発火を抑える
const SWIPE_MAX = 84, SWIPE_TRIGGER = 56, LONGPRESS_MS = 480;
function ideaArrFor(swipeEl){
  const kind = swipeEl.dataset.kind;
  if(kind==='todo') return {arr:db.todos, idea:false};
  if(kind==='shop') return {arr:db.shopping, idea:false};
  return {arr:db.ideas, idea:true};
}
function commitSwipeDelete(swipeEl){
  const inner = swipeEl.querySelector('.row,.ibul'); if(!inner) return;
  const {arr, idea} = ideaArrFor(swipeEl);
  const item = arr.find(x=>x.id===swipeEl.dataset.id); if(!item) return;
  swipeEl.classList.add('snap'); inner.style.transform = 'translateX(-110%)';
  setTimeout(()=>{ softRemove(arr, item, '削除しました'); if(idea){ renderCounts(); renderIdeas(); } else render(); }, 180);
}
function attachGestures(pid){
  const panel = document.getElementById(pid);
  let cur=null, inner=null, sx=0, sy=0, dx=0, decided='', lpTimer=null, lpFired=false;
  function clearLP(){ if(lpTimer){ clearTimeout(lpTimer); lpTimer=null; } }
  panel.addEventListener('touchstart', e=>{
    const sw = e.target.closest('.swipe'); if(!sw) return;
    if(e.touches.length>1) return;
    cur=sw; inner=sw.querySelector('.row,.ibul'); sx=e.touches[0].clientX; sy=e.touches[0].clientY;
    dx=0; decided=''; lpFired=false;
    cur.classList.remove('snap');
    // 長押し＝メニュー（アイデア詳細のみ）。指を動かさず押し続けたら開く。
    const isIdea = (pid==='panel-idea' && ideaApp);
    clearLP();
    if(isIdea){ lpTimer=setTimeout(()=>{ if(decided!=='h'){ lpFired=true; suppressClick=true; if(inner) inner.style.transform=''; openIdeaActSheet(sw.dataset.id); } }, LONGPRESS_MS); }
  }, {passive:true});
  panel.addEventListener('touchmove', e=>{
    if(!cur||lpFired) return;
    const x=e.touches[0].clientX, y=e.touches[0].clientY, ddx=x-sx, ddy=y-sy;
    if(!decided){
      if(Math.abs(ddx)<6 && Math.abs(ddy)<6) return;
      decided = (Math.abs(ddx) > Math.abs(ddy)+2) ? 'h' : 'v';
      if(decided!=='h'){ clearLP(); cur=null; return; }   // 縦スクロールに譲る
    }
    clearLP();
    dx = Math.max(-SWIPE_MAX, Math.min(0, ddx));
    if(inner) inner.style.transform = 'translateX('+dx+'px)';
    suppressClick = true;
    if(e.cancelable) e.preventDefault();
  }, {passive:false});
  function finish(){
    clearLP();
    if(cur && !lpFired){
      if(dx <= -SWIPE_TRIGGER){ commitSwipeDelete(cur); }
      else if(inner){ cur.classList.add('snap'); inner.style.transform=''; }
    }
    const had = !!cur || lpFired;
    cur=null; inner=null;
    if(had) setTimeout(()=>{ suppressClick=false; }, 260);
  }
  panel.addEventListener('touchend', finish, {passive:true});
  panel.addEventListener('touchcancel', finish, {passive:true});
  // PC：右クリックでアイデアのメニュー
  panel.addEventListener('contextmenu', e=>{
    if(pid!=='panel-idea' || !ideaApp) return;
    const sw = e.target.closest('.swipe'); if(!sw) return;
    e.preventDefault(); openIdeaActSheet(sw.dataset.id);
  });
}
['panel-todo','panel-shop','panel-idea'].forEach(attachGestures);

/* ===================== 画像の添付・表示 ===================== */
// 端末内で選んだ画像をリサイズ＆JPEG圧縮してから保存する（同期容量を抑える）
function fileToDataURL(file, maxDim, quality){
  maxDim = maxDim || 1280; quality = quality || 0.72;
  return new Promise((resolve, reject)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      URL.revokeObjectURL(url);
      let w = img.naturalWidth, h = img.naturalHeight;
      const scale = Math.min(1, maxDim / Math.max(w, h));
      w = Math.round(w * scale); h = Math.round(h * scale);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      try{ resolve(c.toDataURL('image/jpeg', quality)); }catch(e){ reject(e); }
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('decode')); };
    img.src = url;
  });
}
let pendingImgCb = null;
const imgInput = document.createElement('input');
imgInput.type = 'file'; imgInput.accept = 'image/*'; imgInput.style.display = 'none';
document.body.appendChild(imgInput);
imgInput.addEventListener('change', async ()=>{
  const f = imgInput.files && imgInput.files[0];
  imgInput.value = '';
  const cb = pendingImgCb; pendingImgCb = null;
  if(!f || !cb) return;
  try{ cb(await fileToDataURL(f)); }
  catch(e){ toast('画像を読み込めませんでした'); }
});
function pickImage(cb){ pendingImgCb = cb; imgInput.click(); }

let viewerItem = null;
const imgViewer = document.getElementById('imgViewer');
function openImgViewer(x){
  viewerItem = x;
  document.getElementById('ivImg').src = x.img;
  imgViewer.classList.add('on');
}
function closeImgViewer(){ imgViewer.classList.remove('on'); viewerItem = null; }
imgViewer.addEventListener('click', e=>{
  if(e.target === imgViewer || e.target.closest('[data-iv="close"]')){ closeImgViewer(); return; }
  if(e.target.closest('[data-iv="del"]')){
    if(viewerItem && confirm('このスクショを削除しますか？')){
      delete viewerItem.img; viewerItem.updated = Date.now(); save(); renderIdeas();
    }
    closeImgViewer();
  }
});

/* 箇条書きをその場で編集（タップ→入力欄に変身。複数行も可） */
function startIdeaEdit(bul, item){
  const textEl = bul.querySelector('.ib-text');
  if(!textEl || bul.querySelector('.ib-edit')) return;
  const input = document.createElement('textarea');
  input.className = 'ib-edit';
  input.value = item.text;
  input.rows = 1;
  textEl.replaceWith(input);
  input.focus();
  autoGrow(input);   // 中身の高さに合わせて全文を表示（行数の上限なし）
  input.addEventListener('input', ()=>autoGrow(input));
  const v = input.value; input.value=''; input.value=v;   // キャレットを末尾に
  let committed = false;
  function commit(persist){
    if(committed) return; committed = true;
    if(persist){
      const nv = input.value.trim();
      if(nv && nv !== item.text){ item.text = nv; item.updated = Date.now(); save(); }
    }
    renderIdeas();
  }
  const isIME = imeGuard(input);
  input.addEventListener('keydown', e=>{
    // PCはEnterで確定せず改行になる（変換確定Enterと区別できないため）。欄の外をクリックで確定。
    if(e.key==='Enter' && !e.shiftKey && !IS_PC && !isIME(e)){ e.preventDefault(); commit(true); }
    else if(e.key==='Escape'){ commit(false); }
  });
  input.addEventListener('blur', ()=>commit(true));
}

/* ===================== アプリ選択ピッカー ===================== */
const sheetBg = document.getElementById('sheetBg');
function openPicker(){
  const wrap = document.getElementById('appPicker');
  const counts = {};
  db.ideas.forEach(x=>{ counts[x.app] = (counts[x.app]||0) + 1; });
  const all = [NEW_APP].concat(APP_CATALOG);
  wrap.innerHTML = all.map(a=>
    '<button class="pk-row" data-pickapp="'+esc(a.key)+'">'+
      '<span class="pk-emoji">'+a.emoji+'</span>'+
      '<span class="pk-label">'+esc(a.label)+'</span>'+
      (counts[a.key] ? '<span class="pk-count">'+counts[a.key]+'</span>' : '')+
    '</button>'
  ).join('');
  sheetBg.classList.add('on');
}
function closeSheet(){ sheetBg.classList.remove('on'); }
document.getElementById('sheetCancel').onclick = closeSheet;
sheetBg.addEventListener('click', e=>{ if(e.target===sheetBg) closeSheet(); });
document.getElementById('appPicker').addEventListener('click', e=>{
  const row = e.target.closest('[data-pickapp]'); if(!row) return;
  closeSheet();
  openIdeaApp(row.dataset.pickapp);
});

/* ===================== 起動 ===================== */
loadLocal();
migrate();
if(purgeDone()) save();
render();
renderSync();
if(sb){ loadRemote(); subscribeRealtime(); }

/* 開いている間も定期的に掃除（1分ごとに期限切れをチェック） */
setInterval(()=>{ if(purgeDone()){ save(); render(); } }, 60*1000);
/* バックグラウンドから復帰したときも掃除 */
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden && purgeDone()){ save(); render(); }
});
</script>
<!-- tsumiki-back-button -->
<style>
  #tsumikiEdge{position:fixed; top:0; bottom:0; left:0; width:22px; z-index:999;}
  #tsumikiPeek{
    position:fixed; top:50%; left:0; z-index:1001; margin-top:-23px;
    width:46px; height:46px; display:flex; align-items:center; justify-content:center;
    background:rgba(251,250,248,.94);
    -webkit-backdrop-filter:saturate(180%) blur(14px); backdrop-filter:saturate(180%) blur(14px);
    border:1px solid rgba(0,0,0,.06); border-radius:50%;
    box-shadow:0 6px 20px rgba(0,0,0,.18);
    color:#242321; font-size:24px; font-weight:600; line-height:1;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Helvetica Neue",Arial,sans-serif;
    transform:translateX(-70px) scale(.8); opacity:0; pointer-events:none;
  }
</style>
<div id="tsumikiEdge"></div>
<div id="tsumikiPeek">‹</div>
<script>
  (function(){
    var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
      || window.navigator.standalone === true;
    var fromTsumiki = false;
    try{
      if(document.referrer){
        var r = new URL(document.referrer);
        fromTsumiki = (r.origin === location.origin);
      }
    }catch(e){}
    if(!(standalone && fromTsumiki)) return;

    var peek = document.getElementById('tsumikiPeek');
    var edge = document.getElementById('tsumikiEdge');

    function goBack(){ location.href = 'index.html'; }

    /* --- 左端エッジスワイプで戻る（iOS純正の戻る操作。見えるボタンは置かない） --- */
    var sx=0, sy=0, prog=0, dragging=false, W=window.innerWidth;
    var TRIGGER = Math.min(120, W*0.32);
    window.addEventListener('resize', function(){ W=window.innerWidth; TRIGGER=Math.min(120, W*0.32); });

    function reset(){
      dragging = false; prog = 0;
      peek.style.transition = 'transform .25s ease, opacity .25s ease';
      peek.style.transform = 'translateX(-70px) scale(.8)';
      peek.style.opacity = 0;
    }
    function start(e){
      var t = e.touches ? e.touches[0] : e;
      if(t.clientX > 26) return;
      sx = t.clientX; sy = t.clientY; prog = 0; dragging = true;
      peek.style.transition = 'none';
    }
    function move(e){
      if(!dragging) return;
      var t = e.touches ? e.touches[0] : e;
      var dx = t.clientX - sx, dy = t.clientY - sy;
      if(Math.abs(dy) > Math.abs(dx) + 12){ reset(); return; }
      if(dx < 0) dx = 0;
      prog = Math.min(dx / TRIGGER, 1);
      peek.style.transform = 'translateX(' + (-70 + prog*82) + 'px) scale(' + (0.8 + prog*0.2) + ')';
      peek.style.opacity = prog;
      if(dx > 6 && e.cancelable) e.preventDefault();
    }
    function end(){
      if(!dragging) return;
      dragging = false;
      if(prog >= 0.999){
        peek.style.transition = 'transform .25s ease, opacity .25s ease';
        peek.style.transform = 'translateX(20px) scale(1.05)';
        peek.style.opacity = 1;
        goBack();
      }else{
        reset();
      }
    }
    edge.addEventListener('touchstart', start, {passive:true});
    window.addEventListener('touchmove', move, {passive:false});
    window.addEventListener('touchend', end, {passive:true});
    window.addEventListener('touchcancel', end, {passive:true});
  })();
</script>
<!-- /tsumiki-back-button -->
