<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f4f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f0d07" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icons/icon-jukou.png">
<meta name="apple-mobile-web-app-title" content="受講率ノート">
<title>受講率ノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>
:root{
  --paper:#f5f4f0;--surface:#fffefb;--surface-2:#efece5;--ink:#1d1a15;--ink-mid:#5b554a;--ink-soft:#666154;
  --ghost:#887f70;--line:#e2ded4;--line-2:#d8d3c7;--accent:#b06f26;--accent-2:#8a5a24;--accent-wash:#f0e4d1;
  --good-ink:#416845;--warn-ink:#974624;--warn-wash:#f2e0d4;
  --hi:#33669e;--lo:#cdc6b6;--mark:#8a5a24;--tip:#1d1a15;--tip-ink:#f5f4f0;--tip-sub:#d8d3c7;
  --fill:#8a5a24;--on-fill:#f5f4f0;
  --pr-1:#33669e;--pr-2:#c08a2e;--pr-3:#7a4fa0;--pr-4:#b0503c;--pr-lo:#bdb5a3;
  --pr-ink:#1d1a15;--pr-soft:#666154;--pr-line:#e2ded4;--pr-mark:#8a5a24;--pr-wash:#f0e4d1;--pr-paper:#fffefb;
  --sh-1:rgba(40,32,18,.12);--sh-2:rgba(0,0,0,.45);--sh-3:rgba(0,0,0,.2);--scrim:rgba(0,0,0,.4);
}
@media (prefers-color-scheme:dark){:root{
  --paper:#0f0d07;--surface:#211d14;--surface-2:#2b2619;--ink:#efe8da;--ink-mid:#a89e8b;--ink-soft:#9f988a;
  --ghost:#8a8170;--line:#36301f;--line-2:#443d2b;--accent:#d59a4d;--accent-2:#e0ab63;--accent-wash:#362a19;
  --good-ink:#7fae82;--warn-ink:#d9825a;--warn-wash:#39251a;
  --hi:#7fa8dc;--lo:#5a5241;--mark:#e0ab63;--tip:#efe8da;--tip-ink:#1d1a15;--tip-sub:#5b554a;
  --fill:#d59a4d;--on-fill:#1d1a15;
}}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;font-size:16px;line-height:1.6;
  min-height:100dvh;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
.wrap{width:100%;max-width:720px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(48px + env(safe-area-inset-bottom))}
@media (min-width:600px){.wrap{padding-left:24px;padding-right:24px}}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 4px 16px}
h1{font-size:24px;font-weight:700;line-height:1.35}
.icobtn{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:14px;color:var(--ink-mid)}
.icobtn:active{background:var(--surface-2)}
.icobtn svg{width:22px;height:22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:16px}
@media (min-width:600px){.card{padding:20px}}
h2{font-size:17px;font-weight:700;line-height:1.4}
.meta{font-size:13px;color:var(--ink-soft)}

/* 切り替え（ATLAS／Learning・期間） */
.seg{display:flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px}
.seg button{flex:1;min-height:44px;border-radius:999px;font-size:14px;font-weight:500;color:var(--ink-mid);padding:0 12px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px var(--sh-1)}
.seg-wrap{padding:3px 0}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.bar .seg{flex:1 1 200px}
.bar .seg.small{flex:0 1 220px}

/* 指標のチップ（押すと強調） */
.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:4px 0 8px}
@media (min-width:600px){.chips{grid-template-columns:repeat(4,minmax(0,1fr))}}
.chip{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:64px;padding:8px 12px;border-radius:14px;
  border:1px solid var(--line);background:var(--surface);text-align:left}
.chip .nm{font-size:13px;color:var(--ink-mid);line-height:1.35}
.chip .v{font-size:22px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.chip .v small{font-size:13px;font-weight:500;color:var(--ink-soft);margin-left:2px}
.chip .d{font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{border-color:var(--hi);box-shadow:inset 0 0 0 1px var(--hi)}
.chip[aria-pressed="true"] .nm{color:var(--ink)}
.chip .sw{display:inline-block;width:14px;height:3px;border-radius:2px;background:var(--lo);vertical-align:middle;margin-right:6px}
.chip[aria-pressed="true"] .sw{background:var(--hi)}

/* グラフ */
.plot{position:relative;width:100%;touch-action:pan-y}
.plot svg{display:block;width:100%;overflow:visible}
.plot text{font-family:inherit}
.tip{position:absolute;z-index:3;background:var(--tip);color:var(--tip-ink);border-radius:12px;padding:8px 12px;
  font-size:13px;line-height:1.5;max-width:240px;pointer-events:none;box-shadow:0 8px 24px -12px var(--sh-2)}
.tip .td{color:var(--tip-sub);font-size:12px}
.tip .tc{font-weight:500;font-size:14px;margin:2px 0 4px;white-space:pre-wrap;overflow-wrap:anywhere}
.tip .tv{display:grid;grid-template-columns:auto auto;gap:0 12px;font-variant-numeric:tabular-nums}
.tip .tv .on{font-weight:700}
.empty{padding:32px 8px;text-align:center;color:var(--ink-soft);font-size:14px}

/* 入力 */
.ent-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.date-in{min-height:44px;font-size:16px;padding:0 12px;border:1px solid var(--line-2);border-radius:12px;background:var(--surface);color:var(--ink)}
.grp{margin-top:8px}
.grp h3{font-size:14px;font-weight:700;color:var(--ink-mid);margin:8px 2px 6px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:600px){.fields{grid-template-columns:repeat(4,minmax(0,1fr))}}
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:13px;color:var(--ink-mid);line-height:1.35;min-height:2.7em;display:flex;align-items:flex-end}
.f .in{position:relative}
.f input{width:100%;min-height:48px;font-size:20px;font-weight:700;padding:0 30px 0 12px;border:1px solid var(--line-2);border-radius:12px;
  background:var(--surface);color:var(--ink);font-variant-numeric:tabular-nums}
.f input::placeholder{color:var(--ghost);font-weight:500}
.f .pct{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--ink-soft);pointer-events:none}
.f input:focus{border-color:var(--accent-2);outline:none;box-shadow:0 0 0 2px var(--accent-wash)}
.f input.bad{border-color:var(--warn-ink)}
textarea{width:100%;min-height:76px;font-size:16px;padding:10px 12px;border:1px solid var(--line-2);border-radius:12px;background:var(--surface);
  color:var(--ink);resize:vertical;line-height:1.6}
textarea:focus{border-color:var(--accent-2);outline:none;box-shadow:0 0 0 2px var(--accent-wash)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.sw-label{display:flex;align-items:center;gap:10px;font-size:15px;cursor:pointer;min-height:44px}
.tg{appearance:none;-webkit-appearance:none;flex:none;font-size:16px;width:48px;height:28px;border-radius:999px;background:var(--line-2);position:relative;cursor:pointer;transition:background .15s}
.tg::before{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px var(--sh-3);transition:left .15s}
.tg:checked{background:var(--fill)}
.tg:checked::before{left:23px}
.btn{min-height:44px;padding:0 18px;border-radius:14px;font-size:15px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-main{background:var(--fill);color:var(--on-fill);font-weight:700;flex:1}
.btn-quiet{background:var(--surface-2);color:var(--ink)}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.hint{font-size:13px;color:var(--ink-mid);margin-top:6px}
.hint.warn{color:var(--warn-ink)}

/* 記録の一覧 */
details.log>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;min-height:44px}
details.log>summary::-webkit-details-marker{display:none}
details.log>summary .chev{transition:transform .2s;color:var(--ghost)}
details.log[open]>summary .chev{transform:rotate(180deg)}
.tbl{overflow-x:auto;margin-top:8px;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;font-size:13px;min-width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 8px;height:44px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-weight:500;color:var(--ink-mid);font-size:12px;vertical-align:bottom;line-height:1.35;white-space:normal;min-width:56px}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
td.cm{text-align:left;white-space:normal;min-width:180px;color:var(--ink)}
td.cm .off{color:var(--ink-soft);font-size:12px;margin-left:4px}
tr.pick{cursor:pointer}
tr.pick:active td{background:var(--surface-2)}
.gh{border-left:1px solid var(--line-2)}

/* 削除（その場で確かめる） */
.del{display:inline-flex;align-items:center;gap:4px}
.del .yes,.del .no{display:none}
.del.ask .yes,.del.ask .no{display:inline-flex}
.del.ask .go{display:none}
.btn-warn{background:var(--warn-wash);color:var(--warn-ink)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;
  background:var(--tip);color:var(--tip-ink);padding:10px 18px;border-radius:999px;font-size:14px;transition:all .2s;z-index:50;pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{transform:translate(-50%,0);opacity:1}

/* メニュー（書き出し・読み込み・印刷） */
dialog.sheet{border:0;border-radius:20px;padding:0;background:var(--surface);color:var(--ink);width:min(420px,calc(100% - 32px));margin:auto}
dialog.sheet::backdrop{background:var(--scrim)}
.sheet-body{padding:20px;display:flex;flex-direction:column;gap:8px}
.sheet-body .btn{justify-content:flex-start;width:100%}
.sheet-body .btn svg{width:20px;height:20px;flex:none}

/* 印刷用（画面では隠す） */
#printArea{display:none}
@media print{
  @page{size:A4 landscape;margin:12mm}
  :root{--ink:var(--pr-ink);--ink-mid:var(--pr-soft);--ink-soft:var(--pr-soft);--line:var(--pr-line);--line-2:var(--pr-line);--surface:var(--pr-paper);--paper:var(--pr-paper)}
  body{background:var(--pr-paper);min-height:0}
  .wrap,.toast,dialog,#tsumikiEdge,#tsumikiPeek{display:none!important}
  #printArea{display:block;color:var(--pr-ink)}
  .pr-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6mm}
  .pr-h h1{font-size:18pt}
  .pr-h .meta{font-size:10pt}
  .pr-sec{break-inside:avoid;margin-bottom:5mm}
  .pr-sec h2{font-size:13pt;margin-bottom:2mm}
  .pr-leg{display:flex;gap:6mm;font-size:9pt;margin-bottom:2mm;color:var(--pr-soft);flex-wrap:wrap}
  .pr-leg i{display:inline-block;width:5mm;height:1mm;border-radius:1px;vertical-align:middle;margin-right:1.5mm}
  .pr-sec>svg{width:100%;height:auto;display:block}
  .pr-tbl{break-before:page}
  .pr-tbl table{font-size:9pt;width:100%}
  .pr-tbl th,.pr-tbl td{padding:1.5mm 2mm;height:auto}
  .pr-tbl td.cm{min-width:0}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>受講率ノート</h1>
    <button class="icobtn" id="menuBtn" aria-label="メニュー">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg>
    </button>
  </header>

  <!-- グラフ -->
  <section class="card" aria-label="推移">
    <div class="bar">
      <div class="seg" role="group" aria-label="表">
        <button data-g="a" aria-pressed="true">ATLAS</button>
        <button data-g="l" aria-pressed="false">Learning</button>
      </div>
      <div class="seg small" role="group" aria-label="期間">
        <button data-r="30" aria-pressed="true">1か月</button>
        <button data-r="90" aria-pressed="false">3か月</button>
        <button data-r="0" aria-pressed="false">全部</button>
      </div>
    </div>
    <div class="chips" id="chips"></div>
    <div class="plot" id="plot"></div>
  </section>

  <!-- 入力 -->
  <section class="card" aria-label="記録する">
    <div class="ent-head">
      <h2 id="entTitle">今日の記録</h2>
      <input type="date" class="date-in" id="date" aria-label="日付">
    </div>
    <div id="fields"></div>
    <div class="grp">
      <h3>コメント</h3>
      <textarea id="cm" placeholder="この日のできごと（なくてもOK）" rows="2"></textarea>
      <div class="row">
        <label class="sw-label"><input type="checkbox" class="tg" id="show" checked>グラフに出す</label>
      </div>
    </div>
    <p class="hint" id="hint"></p>
    <div class="actions">
      <button class="btn btn-quiet" id="copyPrev">前回の数字</button>
      <button class="btn btn-main" id="save">保存</button>
    </div>
    <div class="actions" id="delRow" hidden>
      <span class="del" id="del">
        <button class="btn btn-quiet go">この日を消す</button>
        <button class="btn btn-warn yes">消す</button>
        <button class="btn btn-quiet no">やめる</button>
      </span>
    </div>
  </section>

  <!-- 一覧 -->
  <section class="card">
    <details class="log" id="log">
      <summary><h2>記録の一覧 <span class="meta" id="count"></span></h2>
        <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></summary>
      <div class="tbl" id="tbl"></div>
    </details>
  </section>
</div>

<dialog class="sheet" id="menu">
  <div class="sheet-body">
    <button class="btn btn-quiet" id="printBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 14h12v7H6z"/></svg>印刷</button>
    <button class="btn btn-quiet" id="expBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg>控えを保存</button>
    <button class="btn btn-quiet" id="impBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V9M7 14l5-5 5 5M4 3h16"/></svg>控えから戻す</button>
    <input type="file" id="impFile" accept="application/json,.json" hidden>
    <p class="meta" style="margin:4px 4px 8px">記録はこの端末の中だけに保存しています。</p>
    <button class="btn btn-quiet" id="closeMenu" style="justify-content:center">閉じる</button>
  </div>
</dialog>

<div id="printArea"></div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
'use strict';
const KEY = 'jukou.v1';
const GROUPS = {
  a:{name:'ATLAS', m:[
    {nm:'Total（全体）', en:'Total'},
    {nm:'New Required (<30 days)（新しい必須・30日以内）', en:'New Required (<30 days)'},
    {nm:'Required (>30 days)（必須・30日超え）', en:'Required (>30 days)'},
    {nm:'Required（必須）', en:'Required'}]},
  l:{name:'Learning', m:[
    {nm:'Onboarding (Core)（オンボーディング・共通）', en:'Onboarding (Core)'},
    {nm:'Onboarding (Role)（オンボーディング・職種別）', en:'Onboarding (Role)'},
    {nm:'New Required (<30 days)（新しい必須・30日以内）', en:'New Required (<30 days)'},
    {nm:'Required (>30 days)（必須・30日超え）', en:'Required (>30 days)'}]}
};
const WD = '日月火水木金土';
const $ = s => document.querySelector(s);

/* ---------- 保存 ---------- */
function load(){
  try{ const d = JSON.parse(localStorage.getItem(KEY)||'null'); if(d && d.entries) return d; }catch(e){}
  return {v:1, entries:{}};
}
let db = load();
function persist(){ localStorage.setItem(KEY, JSON.stringify(db)); }

/* ---------- 日付 ---------- */
function todayStr(){ const d=new Date(); return ymd(d); }
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parse(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function md(s){ const d=parse(s); return (d.getMonth()+1)+'/'+d.getDate(); }
function mdw(s){ const d=parse(s); return md(s)+'（'+WD[d.getDay()]+'）'; }
function dayNum(s){ return Math.round(parse(s).getTime()/864e5); }
const sortedDates = () => Object.keys(db.entries).sort();

/* ---------- 状態 ---------- */
const st = {g:'a', r:30, hi:0, tipDate:null};

/* ---------- 入力欄 ---------- */
const fieldsEl = $('#fields');
function buildFields(){
  let h='';
  for(const g of ['a','l']){
    h += `<div class="grp"><h3>${GROUPS[g].name}</h3><div class="fields">`;
    GROUPS[g].m.forEach((m,i)=>{
      const id=`v_${g}${i}`;
      h += `<div class="f"><label for="${id}">${esc(m.nm)}</label><div class="in"><input id="${id}" data-g="${g}" data-i="${i}" type="text" inputmode="decimal" enterkeyhint="next" autocomplete="off" aria-describedby="hint"><span class="pct">%</span></div></div>`;
    });
    h += `</div></div>`;
  }
  fieldsEl.innerHTML = h;
}
buildFields();
const inputs = [...fieldsEl.querySelectorAll('input')];
inputs.forEach((el,idx)=>{
  el.addEventListener('keydown', e=>{
    if(e.key==='Enter'){ e.preventDefault(); (inputs[idx+1]||$('#cm')).focus(); }
  });
  el.addEventListener('input', ()=>{ el.value = el.value.replace(/[０-９．]/g, c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[^0-9.]/g,''); el.classList.remove('bad'); setHint(''); });
});

function readNum(el){
  const s = el.value.trim(); if(s==='') return null;
  const n = Number(s); if(!isFinite(n) || n<0 || n>100) return NaN;
  return Math.round(n*10)/10;
}
function prevOf(date){
  const ds = sortedDates().filter(d=>d<date); return ds.length ? ds[ds.length-1] : null;
}
function setHint(t,warn){ const h=$('#hint'); h.textContent=t; h.classList.toggle('warn',!!warn); }

function fillForm(date){
  $('#date').value = date;
  const e = db.entries[date];
  const isToday = date===todayStr();
  $('#entTitle').textContent = e ? (isToday?'今日の記録（保存済み）':mdw(date)+'の記録') : (isToday?'今日の記録':mdw(date)+'の記録');
  const p = db.entries[prevOf(date)];
  inputs.forEach(el=>{
    const g=el.dataset.g, i=+el.dataset.i;
    const v = e && e[g] ? e[g][i] : null;
    el.value = v==null ? '' : String(v);
    const pv = p && p[g] ? p[g][i] : null;
    el.placeholder = pv==null ? '' : String(pv);
    el.classList.remove('bad');
  });
  $('#cm').value = e ? (e.c||'') : '';
  $('#show').checked = e ? e.show!==false : true;
  $('#delRow').hidden = !e;
  $('#del').classList.remove('ask');
  $('#copyPrev').hidden = !p;
  setHint(p ? `薄い数字は前回（${md(prevOf(date))}）の値です。` : '');
}
$('#date').addEventListener('change', ()=>{ if($('#date').value) fillForm($('#date').value); });
$('#copyPrev').addEventListener('click', ()=>{
  const p = db.entries[prevOf($('#date').value)]; if(!p) return;
  inputs.forEach(el=>{ if(el.value.trim()==='' ){ const v=p[el.dataset.g]?.[+el.dataset.i]; if(v!=null) el.value=String(v);} });
  const firstEmpty = inputs.find(el=>el.value==='');
  toast('空いている欄に前回の数字を入れました');
});
$('#save').addEventListener('click', ()=>{
  const date = $('#date').value;
  if(!date){ setHint('日付を選んでください',true); return; }
  const rec = {a:[null,null,null,null], l:[null,null,null,null]};
  let bad=null, any=false;
  inputs.forEach(el=>{
    const n = readNum(el);
    if(Number.isNaN(n)){ el.classList.add('bad'); bad = bad||el; }
    else { rec[el.dataset.g][+el.dataset.i]=n; if(n!=null) any=true; }
  });
  if(bad){ setHint('0〜100 の数字で入れてください',true); bad.focus(); return; }
  const c = $('#cm').value.trim();
  if(!any && !c){ setHint('数字かコメントを1つ以上入れてください',true); return; }
  rec.c = c; rec.show = $('#show').checked; rec.t = Date.now();
  db.entries[date] = rec; persist();
  toast(mdw(date)+' を保存しました');
  st.tipDate = date;
  renderAll(); fillForm(date);
});
/* 削除：その場で確かめる（confirm を使わない） */
const delEl = $('#del');
delEl.querySelector('.go').addEventListener('click', ()=>delEl.classList.add('ask'));
delEl.querySelector('.no').addEventListener('click', ()=>delEl.classList.remove('ask'));
delEl.querySelector('.yes').addEventListener('click', ()=>{
  const date=$('#date').value; delete db.entries[date]; persist();
  toast(mdw(date)+' を消しました'); st.tipDate=null; renderAll(); fillForm(date);
});

/* ---------- 切り替え ---------- */
document.querySelectorAll('[data-g]').forEach(b=>{ if(b.tagName!=='BUTTON') return;
  b.addEventListener('click',()=>{ st.g=b.dataset.g; st.hi=0; st.tipDate=null; document.querySelectorAll('button[data-g]').forEach(x=>x.setAttribute('aria-pressed',x===b)); renderAll(); }); });
document.querySelectorAll('[data-r]').forEach(b=>b.addEventListener('click',()=>{ st.r=+b.dataset.r; st.tipDate=null; document.querySelectorAll('[data-r]').forEach(x=>x.setAttribute('aria-pressed',x===b)); renderChart(); }));

/* ---------- チップ（最新値） ---------- */
function latest(g,i){
  const ds = sortedDates();
  for(let k=ds.length-1;k>=0;k--){ const v=db.entries[ds[k]][g]?.[i]; if(v!=null){
    let prev=null; for(let j=k-1;j>=0;j--){ const pv=db.entries[ds[j]][g]?.[i]; if(pv!=null){prev=pv;break;} }
    return {v, d:ds[k], diff: prev==null?null:Math.round((v-prev)*10)/10};
  } }
  return null;
}
function renderChips(){
  const G=GROUPS[st.g];
  $('#chips').innerHTML = G.m.map((m,i)=>{
    const L=latest(st.g,i);
    const diff = L&&L.diff!=null ? (L.diff>0?`＋${L.diff}`:L.diff<0?`−${Math.abs(L.diff)}`:'±0') : '';
    return `<button class="chip" data-i="${i}" aria-pressed="${i===st.hi}"><span class="nm"><span class="sw"></span>${esc(m.nm)}</span>`+
      `<span class="v">${L?L.v:'—'}${L?'<small>%</small>':''}</span><span class="d">${L?md(L.d)+(diff?' ・ '+diff:''):'まだ記録なし'}</span></button>`;
  }).join('');
  $('#chips').querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{ st.hi=+c.dataset.i; renderChips(); renderChart(); }));
}

/* ---------- グラフ（共通の描画） ---------- */
function niceMin(vals){ const mn=Math.min(...vals); let f=Math.floor((mn-2)/10)*10; return Math.max(0,Math.min(f,90)); }
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* opts: g, hi(-1=全部同じ濃さ), dates[], W, mode('screen'|'print'), colors */
function chartSVG(o){
  const {g,dates,W,mode,col} = o;
  const pr = mode==='print';
  const flags = pr ? dates.filter(d=>{const e=db.entries[d]; return e.c && e.show!==false;}) : [];
  const fs = pr?11:11;
  const L=34, R=pr?34:14, B=26;
  // 旗の段組み（印刷）：左から順に、重ならない段へ
  const ctx = document.createElement('canvas').getContext('2d'); ctx.font = `500 ${fs}px "Zen Maru Gothic", sans-serif`;
  const d0 = dates.length?dayNum(dates[0]):0, d1 = dates.length?dayNum(dates[dates.length-1]):1;
  const span = Math.max(1,d1-d0);
  const px = d => L + (dates.length===1 ? (W-L-R)/2 : (dayNum(d)-d0)*(W-L-R)/span);
  let rows=[], placed=[];
  for(const d of flags){
    let t = db.entries[d].c.replace(/\s+/g,' ');
    if(t.length>40) t=t.slice(0,39)+'…';
    const lab = md(d)+'  '+t;
    const w = Math.ceil(ctx.measureText(lab).width)+16;
    const X = px(d);
    let x0 = Math.min(Math.max(X-w/2, 0), W-w);
    let r=0; while(rows[r]!=null && rows[r] > x0-6) r++;
    rows[r] = x0+w; placed.push({d,lab,w,x0,r,X});
  }
  const flagH = placed.length ? (rows.length*22+8) : 0;
  const T = (pr?10:10) + flagH;
  const H = (pr?190:240) + flagH;
  const ph = H-T-B;
  const all=[]; dates.forEach(d=>{ (db.entries[d][g]||[]).forEach(v=>{ if(v!=null) all.push(v); }); });
  const ymin = all.length? niceMin(all):60, ymax=100;
  const py = v => T + (ymax-v)*ph/(ymax-ymin);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${GROUPS[g].name}の推移">`;
  // 目盛り
  const step = (ymax-ymin)>40?20:10;
  for(let v=ymin; v<=ymax; v+=step){
    s += `<line x1="${L}" x2="${W-R}" y1="${py(v)}" y2="${py(v)}" stroke="${col.line}" stroke-width="1"/>`;
    s += `<text x="${L-6}" y="${py(v)+4}" text-anchor="end" font-size="11" fill="${col.soft}">${v}</text>`;
  }
  // 日付の目盛り（多すぎないように）
  if(dates.length){
    const maxTicks = Math.max(2, Math.floor((W-L-R)/56));
    const every = Math.max(1, Math.ceil(dates.length/maxTicks));
    const ticks = dates.filter((d,i)=>i%every===0);
    if(ticks[ticks.length-1]!==dates[dates.length-1] && dates.length>1){
      const last=dates[dates.length-1]; if(px(last)-px(ticks[ticks.length-1])<40) ticks.pop(); ticks.push(last);
    }
    ticks.forEach(d=>{ s += `<text x="${px(d)}" y="${H-8}" text-anchor="middle" font-size="11" fill="${col.soft}">${md(d)}</text>`; });
  }
  // 旗（印刷）
  placed.forEach(p=>{
    const y = 4 + p.r*22;
    s += `<line x1="${p.X}" x2="${p.X}" y1="${y+20}" y2="${T+ph}" stroke="${col.mark}" stroke-width="1" stroke-dasharray="3 3"/>`;
    s += `<rect x="${p.x0}" y="${y}" width="${p.w}" height="20" rx="10" fill="${col.wash}"/>`;
    s += `<text x="${p.x0+8}" y="${y+14}" font-size="${fs}" font-weight="500" fill="${col.mark}">${esc(p.lab)}</text>`;
  });
  // 線（強調以外を先に）
  const order = [0,1,2,3].filter(i=>i!==o.hi); if(o.hi>=0) order.push(o.hi);
  const ends=[];
  order.forEach(i=>{
    const on = o.hi<0 || i===o.hi;
    const color = o.hi<0 ? col.series[i] : (on?col.hi:col.lo);
    let path='', pen=false;
    dates.forEach(d=>{ const v=db.entries[d][g]?.[i]; if(v==null){pen=false;return;} path += (pen?'L':'M')+px(d).toFixed(1)+','+py(v).toFixed(1); pen=true; });
    const dash = (o.hi<0 && col.dash && col.dash[i]) ? ` stroke-dasharray="${col.dash[i]}"` : '';
    s += `<path d="${path}" fill="none" stroke="${color}" stroke-width="${on?2.2:1.6}"${dash} stroke-linejoin="round" stroke-linecap="round"/>`;
    // 点：記録が少ないときと最後の点
    const pts = dates.filter(d=>db.entries[d][g]?.[i]!=null);
    const showAll = pts.length<=12;
    pts.forEach((d,k)=>{ if(!showAll && k!==pts.length-1) return; const v=db.entries[d][g][i];
      s += `<circle cx="${px(d)}" cy="${py(v)}" r="${on?3.5:2.5}" fill="${color}" stroke="${col.surface}" stroke-width="2"/>`; });
    if(pr && pts.length){ const d=pts[pts.length-1], v=db.entries[d][g][i]; ends.push({x:px(d)+7, y:py(v), v, c:color}); }
  });
  // 右端の数字：近いものは上下にずらして重ならないように
  ends.sort((p,q)=>p.y-q.y);
  for(let k=1;k<ends.length;k++){ if(ends[k].y-ends[k-1].y<12) ends[k].y=ends[k-1].y+12; }
  ends.forEach(e=>{ s += `<text x="${e.x}" y="${e.y+4}" font-size="10" font-weight="700" fill="${col.ink}">${e.v}</text>`; });
  // コメントの印（画面）
  if(!pr){
    dates.forEach(d=>{ const e=db.entries[d]; if(!e.c || e.show===false) return;
      const v = e[g]?.[o.hi]; const y = v==null ? T+ph : py(v);
      s += `<circle cx="${px(d)}" cy="${y}" r="7" fill="${col.surface}" stroke="${col.mark}" stroke-width="2"/><circle cx="${px(d)}" cy="${y}" r="2.6" fill="${col.mark}"/>`;
    });
    if(st.tipDate && dates.includes(st.tipDate)){
      s += `<line x1="${px(st.tipDate)}" x2="${px(st.tipDate)}" y1="${T}" y2="${T+ph}" stroke="${col.soft}" stroke-width="1" stroke-dasharray="2 3"/>`;
    }
  }
  s += `</svg>`;
  return {svg:s, px, py, T, ph, H};
}

function colors(print){
  if(print) return {line:css('--pr-line'),soft:css('--pr-soft'),ink:css('--pr-ink'),hi:css('--pr-1'),lo:css('--pr-lo'),mark:css('--pr-mark'),wash:css('--pr-wash'),surface:css('--pr-paper'),
    series:[css('--pr-1'),css('--pr-2'),css('--pr-3'),css('--pr-4')], dash:['','6 3','2 3','8 3 2 3']};
  return {line:css('--line'),soft:css('--ink-soft'),ink:css('--ink'),hi:css('--hi'),lo:css('--lo'),mark:css('--mark'),wash:css('--accent-wash'),surface:css('--surface'),series:[]};
}
function rangeDates(){
  const ds = sortedDates().filter(d=>{ const e=db.entries[d]; return (e[st.g]||[]).some(v=>v!=null) || (e.c && e.show!==false); });
  if(!st.r || !ds.length) return ds;
  const last = dayNum(ds[ds.length-1]);
  return ds.filter(d=>dayNum(d) > last-st.r);
}

/* ---------- グラフ（画面） ---------- */
const plot = $('#plot');
let geo=null;
function renderChart(){
  const dates = rangeDates();
  if(!dates.length){ plot.innerHTML = `<div class="empty">まだ記録がありません。下の「今日の記録」から入れると、ここに線が出ます。</div>`; geo=null; return; }
  const W = Math.max(240, Math.round(plot.getBoundingClientRect().width)||320);
  const r = chartSVG({g:st.g, hi:st.hi, dates, W, mode:'screen', col:colors(false)});
  geo = {dates, ...r, W};
  plot.innerHTML = r.svg;
  if(st.tipDate && dates.includes(st.tipDate)) showTip(st.tipDate);
}
function nearest(x){
  let best=null, bd=1e9; for(const d of geo.dates){ const dx=Math.abs(geo.px(d)-x); if(dx<bd){bd=dx;best=d;} } return best;
}
function showTip(d){
  const e = db.entries[d]; const G=GROUPS[st.g];
  const tip = document.createElement('div'); tip.className='tip';
  let h = `<div class="td">${mdw(d)}</div>`;
  if(e.c && e.show!==false) h += `<div class="tc">${esc(e.c)}</div>`;
  h += `<div class="tv">` + G.m.map((m,i)=>{ const v=e[st.g]?.[i]; return `<span class="${i===st.hi?'on':''}">${esc(m.nm)}</span><span class="${i===st.hi?'on':''}" style="text-align:right">${v==null?'—':v+'%'}</span>`; }).join('') + `</div>`;
  tip.innerHTML = h;
  plot.querySelector('.tip')?.remove();
  plot.appendChild(tip);
  const X = geo.px(d), v = e[st.g]?.[st.hi]; const Y = v==null ? geo.T+geo.ph : geo.py(v);
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let left = Math.min(Math.max(X - tw/2, 0), geo.W - tw);
  let top = Y + 14; if(top + th > geo.H + 8) top = Math.max(0, Y - th - 14);
  tip.style.left = left+'px'; tip.style.top = top+'px';
}
plot.addEventListener('click', ev=>{
  if(!geo) return;
  const rect = plot.getBoundingClientRect();
  const x = (ev.clientX-rect.left) * geo.W/rect.width;
  const d = nearest(x);
  st.tipDate = (st.tipDate===d) ? null : d;
  renderChart();
});
let rz, lastW=0; const reflow=()=>{ const w=Math.round(plot.getBoundingClientRect().width); if(w && w!==lastW){ lastW=w; renderChart(); } };
if(window.ResizeObserver) new ResizeObserver(()=>{ clearTimeout(rz); rz=setTimeout(reflow,60); }).observe(plot);
window.addEventListener('resize', ()=>{ clearTimeout(rz); rz=setTimeout(reflow,120); });
document.fonts && document.fonts.ready.then(()=>renderChart());
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', renderChart);

/* ---------- 一覧 ---------- */
function renderTable(){
  const ds = sortedDates().reverse();
  $('#count').textContent = ds.length ? ds.length+'日' : '';
  if(!ds.length){ $('#tbl').innerHTML = `<div class="empty">まだ記録がありません</div>`; return; }
  $('#tbl').innerHTML = tableHTML(ds, true);
  $('#tbl').querySelectorAll('tr.pick').forEach(tr=>tr.addEventListener('click',()=>{ fillForm(tr.dataset.d); document.querySelector('[aria-label="記録する"]').scrollIntoView({behavior:'smooth',block:'start'}); }));
}
function tableHTML(ds, pick){
  let h = `<table><thead><tr><th>日付</th>`;
  ['a','l'].forEach(g=>GROUPS[g].m.forEach((m,i)=>{ h += `<th class="${i===0?'gh':''}">${g==='a'?'ATLAS':'Learning'}<br>${esc(m.nm)}</th>`; }));
  h += `<th class="gh" style="text-align:left">コメント</th></tr></thead><tbody>`;
  ds.forEach(d=>{ const e=db.entries[d];
    h += `<tr class="${pick?'pick':''}" data-d="${d}"><td>${mdw(d)}</td>`;
    ['a','l'].forEach(g=>[0,1,2,3].forEach(i=>{ const v=e[g]?.[i]; h += `<td class="${i===0?'gh':''}">${v==null?'—':v}</td>`; }));
    h += `<td class="cm gh">${e.c?esc(e.c):''}${e.c&&e.show===false?'<span class="off">（グラフに出さない）</span>':''}</td></tr>`;
  });
  return h + `</tbody></table>`;
}

/* ---------- 印刷 ---------- */
function buildPrint(){
  const col = colors(true);
  const W = 1100;
  let h = `<div class="pr-h"><h1>受講率ノート</h1><span class="meta">${st.r?('直近'+(st.r===30?'1か月':'3か月')):'全期間'}・${mdw(todayStr())} 印刷</span></div>`;
  for(const g of ['a','l']){
    const save=st.g; st.g=g; const dates=rangeDates(); st.g=save;
    if(!dates.length) continue;
    const r = chartSVG({g, hi:-1, dates, W, mode:'print', col});
    h += `<section class="pr-sec"><h2>${GROUPS[g].name}</h2><div class="pr-leg">`+
      GROUPS[g].m.map((m,i)=>`<span><svg width="26" height="8" style="vertical-align:middle;margin-right:4px"><line x1="1" y1="4" x2="25" y2="4" stroke="${col.series[i]}" stroke-width="2.2" stroke-dasharray="${col.dash[i]}"/></svg>${esc(m.nm)}</span>`).join('')+`</div>${r.svg}</section>`;
  }
  const ds = (()=>{ const all=sortedDates(); if(!st.r||!all.length) return all; const last=dayNum(all[all.length-1]); return all.filter(d=>dayNum(d)>last-st.r); })().reverse();
  if(ds.length) h += `<section class="pr-tbl"><h2 style="font-size:13pt;margin-bottom:3mm">記録の一覧</h2>${tableHTML(ds,false)}</section>`;
  $('#printArea').innerHTML = h;
}
window.addEventListener('beforeprint', buildPrint);
$('#printBtn').addEventListener('click', ()=>{ $('#menu').close(); buildPrint(); setTimeout(()=>window.print(), 50); });

/* ---------- 控え ---------- */
$('#menuBtn').addEventListener('click', ()=>$('#menu').showModal());
$('#closeMenu').addEventListener('click', ()=>$('#menu').close());
$('#menu').addEventListener('click', e=>{ if(e.target===$('#menu')) $('#menu').close(); });
$('#expBtn').addEventListener('click', ()=>{
  const blob = new Blob([JSON.stringify(db,null,1)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `受講率ノート_${todayStr()}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  $('#menu').close(); toast('控えを保存しました');
});
$('#impBtn').addEventListener('click', ()=>$('#impFile').click());
$('#impFile').addEventListener('change', async ()=>{
  const f = $('#impFile').files[0]; if(!f) return;
  try{
    const d = JSON.parse(await f.text());
    if(!d || typeof d.entries!=='object') throw 0;
    let n=0;
    for(const [k,e] of Object.entries(d.entries)){
      if(!/^\d{4}-\d{2}-\d{2}$/.test(k) || !e) continue;
      const cur = db.entries[k];
      if(!cur || (e.t||0) > (cur.t||0)){ db.entries[k]=e; n++; }
    }
    persist(); renderAll(); fillForm($('#date').value||todayStr());
    toast(n ? `${n}日分を戻しました` : '新しい記録はありませんでした');
  }catch(e){ toast('このファイルは読めませんでした'); }
  $('#impFile').value=''; $('#menu').close();
});

/* ---------- 知らせ ---------- */
let tt; function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('on'),2200); }

function renderAll(){ renderChips(); renderChart(); renderTable(); }
renderAll();
fillForm(todayStr());
})();
</script>
<!-- tsumiki-back-button -->
<style>
  #tsumikiEdge{position:fixed; top:0; bottom:0; left:0; width:22px; z-index:999;}
  #tsumikiPeek{
    position:fixed; top:50%; left:0; z-index:1001; margin-top:-23px;
    width:46px; height:46px; display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.92);
    -webkit-backdrop-filter:saturate(180%) blur(14px); backdrop-filter:saturate(180%) blur(14px);
    border:1px solid rgba(0,0,0,.06); border-radius:50%;
    box-shadow:0 6px 20px rgba(0,0,0,.18);
    color:#0071e3; font-size:24px; font-weight:600; line-height:1;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Helvetica Neue",Arial,sans-serif;
    transform:translateX(-70px) scale(.8); opacity:0; pointer-events:none;
  }
</style>
<div id="tsumikiEdge"></div>
<div id="tsumikiPeek">‹</div>
<script>
  (function(){
    var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
      || window.navigator.standalone === true;
    var fromTsumiki = false;
    try{
      if(document.referrer){
        var r = new URL(document.referrer);
        fromTsumiki = (r.origin === location.origin);
      }
    }catch(e){}
    if(!(standalone && fromTsumiki)) return;

    var peek = document.getElementById('tsumikiPeek');
    var edge = document.getElementById('tsumikiEdge');

    function goBack(){ location.href = 'index.html'; }

    /* --- 左端エッジスワイプで戻る（iOS純正の戻る操作。見えるボタンは置かない） --- */
    var sx=0, sy=0, prog=0, dragging=false, W=window.innerWidth;
    var TRIGGER = Math.min(120, W*0.32);
    window.addEventListener('resize', function(){ W=window.innerWidth; TRIGGER=Math.min(120, W*0.32); });

    function reset(){
      dragging = false; prog = 0;
      peek.style.transition = 'transform .25s ease, opacity .25s ease';
      peek.style.transform = 'translateX(-70px) scale(.8)';
      peek.style.opacity = 0;
    }
    function start(e){
      var t = e.touches ? e.touches[0] : e;
      if(t.clientX > 26) return;
      sx = t.clientX; sy = t.clientY; prog = 0; dragging = true;
      peek.style.transition = 'none';
    }
    function move(e){
      if(!dragging) return;
      var t = e.touches ? e.touches[0] : e;
      var dx = t.clientX - sx, dy = t.clientY - sy;
      if(Math.abs(dy) > Math.abs(dx) + 12){ reset(); return; }
      if(dx < 0) dx = 0;
      prog = Math.min(dx / TRIGGER, 1);
      peek.style.transform = 'translateX(' + (-70 + prog*82) + 'px) scale(' + (0.8 + prog*0.2) + ')';
      peek.style.opacity = prog;
      if(dx > 6 && e.cancelable) e.preventDefault();
    }
    function end(){
      if(!dragging) return;
      dragging = false;
      if(prog >= 0.999){
        peek.style.transition = 'transform .25s ease, opacity .25s ease';
        peek.style.transform = 'translateX(20px) scale(1.05)';
        peek.style.opacity = 1;
        goBack();
      }else{
        reset();
      }
    }
    edge.addEventListener('touchstart', start, {passive:true});
    window.addEventListener('touchmove', move, {passive:false});
    window.addEventListener('touchend', end, {passive:true});
    window.addEventListener('touchcancel', end, {passive:true});
  })();
</script>
<!-- /tsumiki-back-button -->
</body>
