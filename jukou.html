<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f4f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f0d07" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icons/icon-jukou.png?v=2">
<meta name="apple-mobile-web-app-title" content="Training board">
<title>Training board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>
:root{
  --paper:#f5f4f0;--surface:#fffefb;--surface-2:#efece5;--ink:#1d1a15;--ink-mid:#5b554a;--ink-soft:#666154;
  --ghost:#887f70;--line:#e2ded4;--line-2:#d8d3c7;--accent:#b06f26;--accent-2:#8a5a24;--accent-wash:#f0e4d1;
  --good-ink:#416845;--warn-ink:#974624;--warn-wash:#f2e0d4;
  --s1:#2a78d6;--s2:#eb6834;--s3:#11968f;--s4:#b97a00;--s5:#d6578a;--s6:#008300;--s7:#6250d6;
  --hi:#33669e;--lo:#cdc6b6;--mark:#8a5a24;--tip:#1d1a15;--tip-ink:#f5f4f0;--tip-sub:#d8d3c7;
  --fill:#8a5a24;--on-fill:#f5f4f0;
  --h0:#e1edf4;--h1:#b9d2e6;--h2:#8bb2d6;--h3:#3d72a8;--h4:#24507f;--h0i:#1d1a15;--h1i:#1d1a15;--h2i:#1d1a15;--h3i:#fffefb;--h4i:#fffefb;
  --pr-1:#33669e;--pr-2:#c08a2e;--pr-3:#7a4fa0;--pr-4:#b0503c;--pr-lo:#bdb5a3;
  --pr-ink:#1d1a15;--pr-soft:#666154;--pr-line:#e2ded4;--pr-mark:#8a5a24;--pr-wash:#f0e4d1;--pr-paper:#fffefb;
  --sh-1:rgba(40,32,18,.12);--sh-2:rgba(0,0,0,.45);--sh-3:rgba(0,0,0,.2);--scrim:rgba(0,0,0,.4);
  --hov:#efece5;--tg-gray:#eeece7;--tg-gray-i:#57544d;--tg-red:#fbe5e3;--tg-red-i:#a63d35;--tg-or:#fae7d6;--tg-or-i:#97511a;
  --tg-yl:#f8eed2;--tg-yl-i:#7a5d0f;--tg-gr:#e6efe5;--tg-gr-i:#38664c;--tg-bl:#e1edf4;--tg-bl-i:#2a6088;--tg-pu:#efe9f5;--tg-pu-i:#704797;--tg-pk:#f7e7ef;--tg-pk-i:#9a3f6e;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#0f0d07;--surface:#211d14;--surface-2:#2b2619;--ink:#efe8da;--ink-mid:#a89e8b;--ink-soft:#9f988a;
  --ghost:#8a8170;--line:#36301f;--line-2:#443d2b;--accent:#d59a4d;--accent-2:#e0ab63;--accent-wash:#362a19;
  --good-ink:#7fae82;--warn-ink:#d9825a;--warn-wash:#39251a;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#0ca30c;--s7:#9085e9;
  --hi:#7fa8dc;--lo:#5a5241;--mark:#e0ab63;--tip:#efe8da;--tip-ink:#1d1a15;--tip-sub:#5b554a;
  --fill:#d59a4d;--on-fill:#1d1a15;
  --h0:#1e2f3e;--h1:#284a68;--h2:#3a6a94;--h3:#6b9ccd;--h4:#a3c8e8;--h0i:#efe8da;--h1i:#efe8da;--h2i:#efe8da;--h3i:#1d1a15;--h4i:#1d1a15;
  --hov:#2b2619;--tg-gray:#34302a;--tg-gray-i:#c9c4ba;--tg-red:#3e2320;--tg-red-i:#eb9c95;--tg-or:#3d2b1c;--tg-or-i:#e7aa72;
  --tg-yl:#38311b;--tg-yl-i:#dcc070;--tg-gr:#22332a;--tg-gr-i:#94c3a3;--tg-bl:#1e2f3e;--tg-bl-i:#93bfe2;--tg-pu:#2f2539;--tg-pu-i:#c6a8de;--tg-pk:#3a2230;--tg-pk-i:#e3a2c4;
}}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;font-size:16px;line-height:1.6;
  min-height:100dvh;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
.wrap{width:100%;max-width:720px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(48px + env(safe-area-inset-bottom))}
@media (min-width:600px){.wrap{padding-left:24px;padding-right:24px}}
.vh{position:absolute;width:1px;height:1px;margin:-1px;clip-path:inset(50%);white-space:nowrap}
header{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin:4px 4px 4px}
.apptitle{margin-right:auto;display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700;line-height:1.3;min-width:0;padding-left:2px}
.apptitle .logo{flex:none;width:24px;height:21px}
.apptitle .logo g{fill:var(--paper);stroke:var(--ink)}
h1{font-size:24px;font-weight:700;line-height:1.35}
.icobtn{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:14px;color:var(--ink-mid)}
.icobtn:active{background:var(--surface-2)}
.icobtn svg{width:22px;height:22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:16px}
@media (min-width:600px){.card{padding:20px}}
h2{font-size:17px;font-weight:700;line-height:1.4}
.meta{font-size:13px;color:var(--ink-soft)}

/* 切り替え（ATLAS／Learning・期間） */
.seg{display:flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px}
.seg button{flex:1;min-height:44px;border-radius:999px;font-size:15px;font-weight:500;color:var(--ink-mid);padding:0 12px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px var(--sh-1)}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.bar .seg{flex:1 1 200px}
.bar .seg.small{flex:0 1 220px}

/* 指標のチップ（押すと強調） */
@media (min-width:600px){  border:1px solid var(--line);background:var(--surface);text-align:left}

/* グラフ */
.band-h,.heat-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 2px 10px}
.band{display:flex;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.band .tot{flex:0 0 84px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;gap:6px;padding:10px;min-height:44px;
  background:var(--ink);color:var(--paper);text-align:left}
.band .tot .nm{font-size:12px;font-weight:700}
.band .tot .v{font-size:24px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.band .tot .d{font-size:11px;opacity:.85}
.band .tot[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--accent)}
.band .sc{flex:1;min-width:0;overflow-x:auto;-webkit-overflow-scrolling:touch;scroll-snap-type:x mandatory;scroll-behavior:smooth;overscroll-behavior-x:contain}
.band .c{scroll-snap-align:start}
@media (prefers-reduced-motion:reduce){.band .sc{scroll-behavior:auto}}
.band .in{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));min-width:532px}
.band .gh{font-size:12px;font-weight:700;text-align:center;padding:3px 0}
.band .ga{grid-column:span 3;background:var(--tg-bl);color:var(--tg-bl-i)}
.band .gl{grid-column:span 4;background:var(--tg-yl);color:var(--tg-yl-i)}
.band .c{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;gap:6px;padding:8px;min-height:96px;text-align:left;
  border-left:1px solid var(--line);background:var(--surface);color:var(--ink)}
.band .c .nm{font-size:12px;line-height:1.3;color:var(--ink-mid)}
.band .c .v{font-size:20px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.band .c .v small,.band .tot .v small{font-size:12px;font-weight:500;margin-left:1px}
.band .c .d{font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.band .c[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--hi)}
.band .c[aria-pressed="true"] .nm{color:var(--ink)}
.heat-sc{overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.heat{display:grid;grid-template-columns:44px repeat(8,minmax(72px,1fr));gap:3px;font-size:12px}
.heat .g{text-align:center;font-size:12px;font-weight:700;border-radius:6px;padding:2px 0}
.heat .ga{grid-column:3/span 3;background:var(--tg-bl);color:var(--tg-bl-i)}
.heat .gl{grid-column:6/span 4;background:var(--tg-yl);color:var(--tg-yl-i)}
.heat .hd{font-size:12px;line-height:1.25;overflow-wrap:anywhere;color:var(--ink-mid);text-align:center;align-self:end;padding-bottom:2px}
.heat .row{display:contents}
.heat .dt,.heat .row>.hd:first-child,.heat>span:first-child{position:sticky;left:0;z-index:1;background:var(--surface)}
.heat .row>.hd:first-child{align-self:stretch;display:flex;align-items:flex-end;justify-content:flex-start}
.heat .dt{align-self:stretch;display:flex;align-items:center;color:var(--ink-mid);font-variant-numeric:tabular-nums;font-size:12px}
.heat .v{min-height:44px;border-radius:6px;display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums;font-size:12px;letter-spacing:-.02em}
.heat .v.na{background:var(--surface-2);color:var(--ink-soft);font-weight:500}
.heat .sel .v{box-shadow:inset 0 0 0 2px var(--ink)}
.v.k0{background:var(--h0);color:var(--h0i)}.v.k1{background:var(--h1);color:var(--h1i)}.v.k2{background:var(--h2);color:var(--h2i)}.v.k3{background:var(--h3);color:var(--h3i)}.v.k4{background:var(--h4);color:var(--h4i)}
.lg{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:10px;font-size:12px;color:var(--ink-mid)}
.lg span{display:inline-flex;align-items:center;gap:4px}
.lg i{width:14px;height:14px;border-radius:4px;display:inline-block}
.heat-more{margin-top:8px}
.plot{position:relative;width:100%;touch-action:pan-y}
.plot svg{display:block;width:100%;overflow:visible}
.plot text{font-family:inherit}
.tip{position:absolute;z-index:3;background:var(--tip);color:var(--tip-ink);border-radius:12px;padding:8px 12px;
  font-size:13px;line-height:1.5;max-width:min(270px,100%);pointer-events:none;box-shadow:0 8px 24px -12px var(--sh-2)}
.tip .td{color:var(--tip-sub);font-size:12px}
.tip .tc{font-weight:500;font-size:14px;margin:2px 0 4px;white-space:pre-wrap;overflow-wrap:anywhere}
.tip .tv{display:grid;grid-template-columns:auto auto;gap:0 12px;font-variant-numeric:tabular-nums}
.tip .tv .on{font-weight:700}
.tip .t3{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:2px 8px;align-items:center;font-variant-numeric:tabular-nums}
.tip .t3 .gl{grid-column:1/-1;color:var(--tip-sub);font-size:12px;margin-top:4px}
.tip .t3 .on{font-weight:700}
.sw{display:inline-block;width:16px;height:0;border-top:3px solid;border-radius:2px;flex:none}
.sw.dsh{border-top-style:dashed}
.tip .swb{display:inline-flex;align-items:center;justify-content:center;width:22px;height:12px;border-radius:4px;background:var(--surface)}.tip .swb .sw{width:16px}
.serchips small{font-size:12px;font-weight:700;color:var(--hi)}
.plot-sel{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-mid);margin:0 2px 6px;min-height:20px}
#serBtn[aria-expanded="true"]{background:var(--surface-2);color:var(--ink)}
.sertray{border:1px solid var(--line);border-radius:12px;padding:6px 10px 12px;margin:0 0 12px}
.sertray .gl{font-size:12px;font-weight:700;color:var(--ink-mid);margin:8px 2px 6px}
.serchips{display:flex;flex-wrap:wrap;gap:6px}
.serchips button{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-size:15px;display:inline-flex;align-items:center;gap:8px;color:var(--ink);text-align:left}
.serchips button[aria-pressed="false"]{color:var(--ink-soft);background:transparent;border-style:dashed}
.serchips button[aria-pressed="false"] .sw{opacity:.3}
.serchips button.is-hi{box-shadow:inset 0 0 0 2px var(--hi)}
.yrow{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.yrow>span{font-size:15px;font-weight:700;color:var(--ink-mid)}
.yrow .seg{flex:1 1 220px}
.empty{padding:32px 8px;text-align:center;color:var(--ink-soft);font-size:14px}

/* 入力 */
.date-in{min-height:44px;font-size:16px;padding:0 12px;border:1px solid var(--line-2);border-radius:12px;background:var(--surface);color:var(--ink)}
.grp{margin-top:8px}
.grp h3{font-size:15px;font-weight:700;color:var(--ink-mid);margin:8px 2px 6px}
textarea{width:100%;min-height:76px;font-size:16px;padding:10px 12px;border:1px solid var(--line-2);border-radius:12px;background:var(--surface);
  color:var(--ink);resize:vertical;line-height:1.6}
textarea:focus{border-color:var(--accent-2);outline:none;box-shadow:0 0 0 2px var(--accent-wash)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.sw-label{display:flex;align-items:center;gap:10px;font-size:15px;cursor:pointer;min-height:44px}
.tg{appearance:none;-webkit-appearance:none;flex:none;font-size:16px;width:48px;height:28px;border-radius:999px;background:var(--line-2);position:relative;cursor:pointer;transition:background .15s}
.tg::before{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px var(--sh-3);transition:left .15s}
.tg:checked{background:var(--fill)}
.tg:checked::before{left:23px}
.btn{min-height:44px;padding:0 18px;border-radius:12px;font-size:15px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-main{background:var(--fill);color:var(--on-fill);font-weight:700;flex:1}
.btn-quiet{background:var(--surface-2);color:var(--ink)}
.btn-ic{width:44px;padding:0;flex:none}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.hint{font-size:13px;color:var(--ink-mid);margin-top:6px}
.hint.warn{color:var(--warn-ink)}

/* 記録の一覧 */
.tbl{overflow-x:auto;margin-top:8px;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;font-size:13px;min-width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 8px;height:44px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-weight:500;color:var(--ink-mid);font-size:12px;vertical-align:bottom;line-height:1.35;white-space:normal;min-width:84px}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
td.cm{text-align:left;white-space:normal;min-width:180px;color:var(--ink)}
td.cm .off{color:var(--ink-soft);font-size:12px;margin-left:4px}
tr.pick{cursor:pointer}
tr.pick:active td{background:var(--surface-2)}
@media (hover:hover){tr.pick:hover td{background:var(--surface-2)}}
tr.pick:focus-visible{outline:2px solid var(--hi);outline-offset:-2px}
.gh{border-left:1px solid var(--line-2)}

/* 削除（その場で確かめる） */
.del{display:inline-flex;align-items:center;gap:4px}
.del .yes,.del .no{display:none}
.del.ask .yes,.del.ask .no{display:inline-flex}
.del.ask .go{display:none}
.btn-warn{background:var(--warn-wash);color:var(--warn-ink)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;
  background:var(--tip);color:var(--tip-ink);padding:10px 18px;border-radius:999px;font-size:14px;transition:all .2s;z-index:50;pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{transform:translate(-50%,0);opacity:1}

/* メニュー（書き出し・読み込み・印刷） */
dialog.sheet{border:0;border-radius:20px;padding:0;background:var(--surface);color:var(--ink);width:min(420px,calc(100% - 32px));margin:auto}
dialog.sheet::backdrop{background:var(--scrim)}
.sheet-body{padding:20px;display:flex;flex-direction:column;gap:8px}
.sheet-body .btn{justify-content:flex-start;width:100%}
.sheet-body .btn svg{width:20px;height:20px;flex:none}

/* 切り替え（店全体／ひとりずつ） */
.views{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:-4px 0 16px;overflow-x:auto}
.views a{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;min-width:44px;padding:0 10px;font-size:15px;color:var(--ink-soft);text-decoration:none;white-space:nowrap}
@media (max-width:369px){.views a{padding:0 5px;gap:4px;font-size:13px}.views{gap:2px}}
@media (max-width:459px){.views a{padding:0 8px}.views a svg{display:none}}
@media (max-width:519px){.views .lg{display:none}}
.views a[aria-current="page"]{color:var(--ink);font-weight:700;box-shadow:inset 0 -2px 0 var(--ink)}
.views svg{width:17px;height:17px;flex:none}

/* ひとりずつ（Notion の表のかたち） */
.p-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.p-top .meta{flex:1 1 180px;font-size:13px}
.p-tools{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.p-search{flex:1;min-width:0;position:relative}
.p-search input{width:100%;min-height:44px;font-size:16px;padding:0 12px 0 36px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.p-search input:focus{outline:none;border-color:var(--accent-2);box-shadow:0 0 0 2px var(--accent-wash)}
.p-search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--ink-soft);pointer-events:none}
.p-sel{min-height:44px;font-size:16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:0 8px;max-width:46%}
.ptbl{font-size:15px}
.ptr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr) 88px;align-items:center;border-bottom:1px solid var(--line);min-height:48px}
.ptr>*{padding:6px 6px;min-width:0}
.ptr.head{min-height:40px;font-size:13px;color:var(--ink-soft)}
.ptr.head button{white-space:nowrap;display:inline-flex;align-items:center;gap:5px;min-height:40px;color:inherit;font-size:13px;padding:0}
.ptr.head button[aria-sort]:not([aria-sort="none"]){color:var(--ink);font-weight:700}
.ptr.head svg{width:15px;height:15px;flex:none}
.ptr.head .r{justify-content:flex-end;display:flex}
button.ptr{width:100%;text-align:left;cursor:pointer}
button.ptr:active,button.ptr:hover{background:var(--hov)}
.ptr .nm{font-weight:500;overflow-wrap:anywhere}
.ptr .pill{white-space:normal;overflow-wrap:anywhere}
.ptr .r{text-align:right;display:flex;justify-content:flex-end;align-items:center;gap:6px}
.ptr.w4{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr) 72px 48px}
div.ptr[data-k]{cursor:pointer}
@media (hover:hover){div.ptr[data-k]:hover{background:var(--hov)}}
.ptr .pn{display:block;width:100%;text-align:left;font:inherit;color:inherit;font-weight:500;overflow-wrap:anywhere;min-height:36px;padding:0}
.ptr .cw{font-size:11px;color:var(--ink-soft);font-weight:400;font-variant-numeric:tabular-nums;display:block;margin-top:1px}
.ptr>.cc{padding:0;display:flex;justify-content:center}
.callck{width:44px;height:44px;display:grid;place-items:center;border-radius:999px;color:var(--ink-soft)}
.callck svg{width:24px;height:24px}
.callck[aria-pressed="true"]{color:var(--hi)}
.callck.old[aria-pressed="true"]{color:var(--ink-soft)}
.callck:focus-visible{outline:2px solid var(--hi);outline-offset:-2px}
.callrow{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px 0 6px;border-radius:999px;border:1px solid var(--line-2);font-size:15px;color:var(--ink-mid)}
.callrow svg{width:22px;height:22px;flex:none;color:var(--ink-soft)}
.callrow[aria-pressed="true"]{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.callrow[aria-pressed="true"] svg{color:var(--hi)}
.dl{font-size:12px;color:var(--good-ink);font-variant-numeric:tabular-nums}
.dl.up{color:var(--warn-ink)}
.pill{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle;font-size:13px;line-height:1.55;border-radius:4px;padding:1px 7px;font-variant-numeric:tabular-nums}
.t-gray{background:var(--tg-gray);color:var(--tg-gray-i)}.t-red{background:var(--tg-red);color:var(--tg-red-i)}.t-or{background:var(--tg-or);color:var(--tg-or-i)}
.t-yl{background:var(--tg-yl);color:var(--tg-yl-i)}.t-gr{background:var(--tg-gr);color:var(--tg-gr-i)}.t-bl{background:var(--tg-bl);color:var(--tg-bl-i)}
.t-pu{background:var(--tg-pu);color:var(--tg-pu-i)}.t-pk{background:var(--tg-pk);color:var(--tg-pk-i)}
.p-sum{font-size:13px;color:var(--ink-soft);text-align:right;padding:10px 6px}
.p-empty{padding:28px 8px;text-align:center;color:var(--ink-mid);font-size:14px;line-height:1.8}
.p-empty svg{width:40px;height:40px;color:var(--ink-soft);margin-bottom:6px}
.p-note{font-size:13px;color:var(--ink-mid);margin:10px 6px 0;line-height:1.6}
.p-foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

/* 右下の＋ */
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right));bottom:calc(20px + env(safe-area-inset-bottom));z-index:20;width:60px;height:60px;border-radius:999px;
  background:var(--fill);color:var(--on-fill);display:grid;place-items:center;box-shadow:0 6px 18px -4px var(--sh-2)}
.fab svg{width:28px;height:28px}
.fab:focus{outline:none}
.fab:focus-visible{outline:3px solid var(--hi);outline-offset:3px}
@media (hover:hover){.fab:hover{filter:brightness(1.08)}}
#vStore{padding-bottom:72px}
#vTask{padding-bottom:calc(100px + env(safe-area-inset-bottom))}
/* 記録のページ（帯の形） */
.rc{padding:calc(8px + env(safe-area-inset-top)) 16px 0;max-width:720px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.rc-bar{display:flex;align-items:center;gap:8px;margin:0 -4px 12px}
.rc-bar h2{flex:1;min-width:0;font-size:20px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc-bar .date-in{max-width:9.5em}
@media (max-width:369px){.rc-bar h2{font-size:17px}.rc-bar .date-in{max-width:8.4em;padding:0 8px}}
.rb-tot{display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--paper);border-radius:14px;padding:10px 14px}
.rb-tot label{font-size:15px;font-weight:700;flex:1}
.rb-tot .in{position:relative;width:118px}
.rb-tot input{width:100%;min-height:52px;font-size:30px;font-weight:700;text-align:right;padding:0 24px 0 8px;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--paper);font-variant-numeric:tabular-nums}
.rb-tot input::placeholder{color:var(--paper);opacity:.62;font-weight:500}
.rb-tot .pct{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:15px;opacity:.8;pointer-events:none}
.rb-tot .dd{width:3.6em;text-align:right;font-size:12px;line-height:1.35;opacity:.9;font-variant-numeric:tabular-nums}
.rb-tot input:focus{outline:none;border-color:var(--paper)}
.rb-tot input.bad{border-color:var(--warn-wash);box-shadow:0 0 0 2px var(--warn-ink)}
.rb-g{margin-top:10px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.rb-g .gh{font-size:12px;font-weight:700;text-align:center;padding:4px 0}
.rb-g.a .gh{background:var(--tg-bl);color:var(--tg-bl-i)}
.rb-g.l .gh{background:var(--tg-yl);color:var(--tg-yl-i)}
.rb-cs{display:grid;background:var(--surface)}
.rb-g.a .rb-cs{grid-template-columns:repeat(3,minmax(0,1fr))}
.rb-g.l .rb-cs{grid-template-columns:repeat(4,minmax(0,1fr))}
.rb-c{position:relative;border-left:1px solid var(--line);padding:8px 6px 6px;display:flex;flex-direction:column;gap:4px;min-height:112px}
.rb-c:first-child{border-left:0}
@media (max-width:369px){.rb-g.l .rb-cs{grid-template-columns:repeat(2,minmax(0,1fr))}.rb-g.l .rb-c:nth-child(3){border-left:0}.rb-g.l .rb-c:nth-child(n+3){border-top:1px solid var(--line)}}
.rb-c label{font-size:12px;line-height:1.3;color:var(--ink-mid);flex:1;overflow-wrap:break-word}
.rb-c .in{position:relative}
.rb-c input{width:100%;min-height:44px;font-size:21px;font-weight:700;padding:0 18px 0 6px;border:1px solid var(--line-2);border-radius:12px;background:var(--paper);color:var(--ink);font-variant-numeric:tabular-nums}
.rb-c input::placeholder{color:var(--ghost);font-weight:500}
.rb-c .pct{position:absolute;right:5px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--ink-soft);pointer-events:none}
.rb-c input:focus{outline:none;border-color:var(--hi);box-shadow:0 0 0 2px var(--accent-wash)}
.rb-c input.bad{border-color:var(--warn-ink)}
.rb-c .dd{font-size:12px;min-height:1.3em;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.dd.up{color:var(--tg-gr-i);font-weight:700}
.dd.dn{color:var(--warn-ink);font-weight:700}
.rb-tot .dd.up,.rb-tot .dd.dn{color:var(--paper)}
@media (min-width:600px){.rb-c input{font-size:24px}}
.rc .grp{margin-top:14px}
.rc #delRow{margin-bottom:16px}
.rc>.grp{margin-bottom:16px}
.rc-foot{position:sticky;bottom:0;margin:auto -16px 0;padding:10px 16px calc(12px + env(safe-area-inset-bottom));background:var(--paper);border-top:1px solid var(--line);display:flex;gap:8px}
.rc-foot .btn{flex:1}
dialog.rec{overflow-y:auto}

/* 連絡 */
.rm-row{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;min-height:52px;padding:6px 0;border-top:1px solid var(--line)}
.rm-row:first-child{border-top:0}
.rm-row .nm{flex:1;min-width:0;font-weight:700;overflow-wrap:anywhere}
.rm-ts{order:3;flex:1 1 100%;display:flex;gap:8px}
.rm-ts label{flex:1;min-width:0;display:flex;align-items:center;gap:4px;font-size:16px}
.rm-ts label span{flex:none}
.rm-row input[type="time"]{flex:1;min-width:0;width:auto;padding:0 8px}
@media (min-width:600px){.rm-ts{order:0;flex:0 1 auto}.rm-row input[type="time"]{width:8.2em;flex:none}}
.rm-rem{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.rm-rem .btn{flex:1 1 0;min-width:0;padding:0 10px;white-space:nowrap}
.rm-rem .meta{flex:1 1 100%}
.rm-rem .meta:empty{display:none}
dialog#lImg{width:min(560px,calc(100% - 24px));max-height:92dvh;overflow-y:auto}
.li-body{padding:16px;display:flex;flex-direction:column;gap:12px}
.li-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.li-h h2{font-size:17px;font-weight:700}
.li-imgs{display:flex;flex-direction:column;gap:10px}
.li-imgs img{width:100%;height:auto;display:block;border-radius:10px;border:1px solid var(--line)}
.li-acts{display:flex;gap:8px;position:sticky;bottom:0;margin:0 -16px -16px;padding:10px 16px 16px;background:var(--surface)}.li-acts .btn{flex:1}
.rm-rem .meta.warn{color:var(--warn-ink);font-weight:700}
.rm-row .icobtn{flex:none}
.rm-tg{display:flex;align-items:center;gap:8px;min-height:44px;padding:0;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.rm-row.fold .rm-tg{flex:1;min-width:0}
.rm-tg .tm{margin-left:auto;display:flex;align-items:center;gap:4px;flex:none;font-size:14px;font-variant-numeric:tabular-nums;color:var(--ink-mid)}
.rm-tg .tm span:last-child{margin-left:8px}
.rm-fromb{min-height:44px;padding:0 4px;border:0;background:none;font:inherit;font-size:13px;color:var(--ink-soft);cursor:pointer}
.rm-h{align-items:center;min-height:44px}
.rm-h .del .btn{min-height:44px;padding:0 14px}
.rm-load{display:flex;margin-top:10px}.rm-load .btn{flex:1}
.rm-from{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:15px;font-weight:700}
.rm-from input{flex:1;min-width:0;font-weight:500}
.rm-slot{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.rm-slot.next{border-color:var(--fill);box-shadow:0 0 0 1px var(--fill)}
.rm-sh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.rm-sh b{font-size:20px;font-variant-numeric:tabular-nums}
.rm-sh .st{margin-left:auto;font-size:12px;font-weight:700}
.rm-sh .st.ok{color:var(--good-ink)}.rm-sh .st.nx{color:var(--warn-ink)}
.rm-names{margin:6px 0 10px;line-height:1.6;overflow-wrap:anywhere}
.rm-slot .btn{width:100%}
.rm-slot.done .btn-main{background:var(--hov);color:var(--ink);font-weight:500}
.rm-miss{margin:12px 2px 0}
.rm-all{display:flex;margin:12px 0 0}.rm-all[hidden]{display:none}.rm-all .btn{flex:1}.rm-all-n{margin-left:6px;font-weight:500;opacity:.8}
/* タスク */
.tk-sec{display:flex;justify-content:space-between;align-items:baseline;margin:18px 6px 6px;font-size:15px;font-weight:700}
.tk-sec:first-child{margin-top:0}
#tkBody section+section{margin-top:22px}
.tk-sec-b{margin-top:6px;margin-bottom:0}
.tk-sec-b button{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:44px;padding:0;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.tk-sec-b .meta{display:inline-flex;align-items:center;gap:4px}
.tk-sec-b svg{width:16px;height:16px;transition:transform .2s}
.tk-sec-b [aria-expanded="true"]{margin-bottom:6px}
.tk-sec-b [aria-expanded="true"] svg{transform:rotate(180deg)}
.tk-sec .meta{font-weight:500}
.tk-list{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface)}
.tk{position:relative;overflow:hidden;border-top:1px solid var(--line)}
.tk:first-child{border-top:0}
.tk-bg{position:absolute;inset:0;display:flex;align-items:center;padding:0 18px;font-size:15px;font-weight:700;color:var(--paper);visibility:hidden}
.tk-bg.r{background:var(--hi)}.tk-bg.l{background:var(--good-ink);justify-content:flex-end}
.tk-bg.on{visibility:visible}
.tk-bg{gap:10px}
.tk-ic{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:transparent;box-shadow:inset 0 0 0 2px currentColor;font-size:14px;transition:background-color .15s ease,color .15s ease}
.tk-bg.far .tk-ic{background:var(--paper);box-shadow:none}.tk-bg.r.far .tk-ic{color:var(--hi)}.tk-bg.l.far .tk-ic{color:var(--good-ink)}
.tk-fg{position:relative;display:flex;align-items:center;gap:4px;min-height:60px;padding:4px 8px 4px 4px;background:var(--surface);touch-action:pan-y;user-select:none;-webkit-user-select:none}
.tk-fg.drag{box-shadow:0 2px 12px -4px var(--sh-2)}
.tk-ck{flex:none;width:44px;height:44px;display:grid;place-items:center;border-radius:12px}
.tk-ck i{width:24px;height:24px;border-radius:50%;border:2px solid var(--ghost);display:grid;place-items:center}
.tk-ck i svg{width:14px;height:14px;display:none}
.tk[data-st="doing"] .tk-ck i{border-color:var(--hi);background:linear-gradient(90deg,var(--hi) 50%,transparent 50%)}
.tk[data-st="done"] .tk-ck i{border-color:var(--good-ink);background:var(--good-ink);color:var(--paper)}
.tk[data-st="done"] .tk-ck i svg{display:block}
.tk-tx{flex:1;min-width:0;min-height:44px;display:flex;flex-direction:column;justify-content:center;gap:3px;text-align:left;padding:4px 0}
.tk-tx .t{font-size:16px;font-weight:700;line-height:1.4;overflow-wrap:anywhere}
.tk[data-st="done"] .tk-tx .t{color:var(--ink-soft);text-decoration:line-through;font-weight:500}
.tk-tx .r{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:13px;color:var(--ink-soft)}
.tk-tx .r .late{color:var(--warn-ink);font-weight:700}
.tk-tx .r .chip{font-size:12px;font-weight:700;border-radius:6px;padding:1px 6px;background:var(--tg-bl);color:var(--tg-bl-i)}
.tk-tx .r svg{width:13px;height:13px;vertical-align:-2px}
.tk-empty{padding:18px 6px 4px;color:var(--ink-soft)}
.tk-hint{margin:12px 6px 0}
dialog#tkPp{position:fixed;inset:auto;margin:0;border:0;padding:0;border-radius:14px;background:var(--surface);color:var(--ink);box-shadow:0 10px 30px -8px var(--sh-2);width:min(240px,calc(100% - 32px));overflow:hidden}
.pp-h{margin:0;padding:10px 14px 4px;font-size:12px;color:var(--sub)}
.pp-b{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:48px;padding:0 14px;border:0;border-top:1px solid var(--line);background:none;color:inherit;font:inherit;font-size:15px;font-weight:700;text-align:left;cursor:pointer}
.pp-b .meta{font-weight:500}
.pp-b input{font:inherit;font-size:16px;font-weight:500;border:0;background:var(--surface-2);color:inherit;border-radius:8px;padding:4px 6px;min-width:0;max-width:60%}
.tk-fg{-webkit-touch-callout:none}
.tk-fg.hold{transform:scale(.975);background:var(--surface-2);transition:transform .45s cubic-bezier(.3,.7,.4,1) .1s,background-color .45s ease .1s}
dialog#tkPp::backdrop{background:rgba(0,0,0,.08)}
dialog#tkSheet{width:min(480px,100%);max-width:100%;max-height:92dvh;overflow-y:auto;margin:auto auto 0;border-radius:20px 20px 0 0;background:var(--paper)}
@media (min-width:600px){dialog#tkSheet{margin:auto;border-radius:20px}}
.tks{padding:10px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.tks-grab{position:relative;width:40px;height:5px;border-radius:9px;background:var(--line-2);margin:0 auto 2px;touch-action:none;cursor:grab}
.tks-grab::before{content:"";position:absolute;top:-10px;bottom:-16px;left:-110px;right:-110px}
.tks-box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 14px}
.tks-f{display:flex;align-items:center;gap:10px;min-height:48px;border-top:1px solid var(--line)}
.tks-f:first-child{border-top:0}
.tks-f>span{flex:none;width:3.5em;color:var(--ink-soft);font-size:15px}
.tks-f input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;min-height:44px;padding:0}
.tks-f input.ttl{font-weight:700;font-size:17px}
.tks-f .clr{flex:none}
.tks h3{font-size:15px;font-weight:700;margin:0 2px}
.tks-opts{display:flex;flex-wrap:wrap;gap:6px}
.tks-opts label{position:relative}
.tks-opts input{position:absolute;opacity:0;width:1px;height:1px}
.tks-opts span{display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-size:15px}
.tks-opts input:checked+span{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700}
.tks-opts input:focus-visible+span{outline:2px solid var(--accent-2);outline-offset:2px}
.tks-opts.st input:checked+span{background:var(--fill);color:var(--on-fill);border-color:var(--fill)}
.tks-opts.wd{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.tks-opts.wd span{padding:0;min-width:0;border-radius:12px;width:100%}
.tks-foot{display:flex;gap:8px;align-items:center}
.tks-foot .btn-main{flex:1}

/* 人のページ（右から出る） */
dialog.peek{border:0;padding:0;margin:0 0 0 auto;height:100dvh;max-height:100dvh;width:100%;max-width:100%;background:var(--paper);color:var(--ink)}
@media (min-width:900px){dialog.peek{width:520px;box-shadow:0 0 0 1px var(--line),-12px 0 32px -16px var(--sh-2)}dialog#logPage{width:760px}}
dialog.peek:focus{outline:none}
dialog.peek::backdrop{background:var(--scrim)}
.pk{padding:calc(8px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
.pk-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.pk h2{font-size:20px;line-height:1.4;margin:2px 4px 10px;word-break:break-word}
.pk .rc-bar h2{margin:0}
.props{font-size:14px;margin:0 4px 12px}
.pp{display:grid;grid-template-columns:96px minmax(0,1fr);align-items:center;min-height:34px;gap:8px}
.pp>span:first-child{display:flex;align-items:center;gap:6px;color:var(--ink-soft)}
.pp svg{width:16px;height:16px;flex:none}
.pp .v{overflow-wrap:anywhere}
.callout{display:flex;gap:10px;background:var(--hov);border-radius:8px;padding:12px 14px;font-size:14px;line-height:1.6;margin:4px 0 12px}
.callout svg{width:18px;height:18px;flex:none;margin-top:2px;color:var(--ink-mid)}
details.tog{margin:2px 0}
details.tog>summary{list-style:none;display:flex;align-items:center;gap:6px;min-height:44px;cursor:pointer;font-weight:700;font-size:15px;padding:0 4px;border-radius:6px}
details.tog>summary::-webkit-details-marker{display:none}
details.tog>summary:active{background:var(--hov)}
details.tog>summary .tri{width:14px;height:14px;flex:none;color:var(--ink-mid);transition:transform .15s}
details.tog[open]>summary .tri{transform:rotate(90deg)}
details.tog>summary .n{font-weight:400;color:var(--ink-soft);font-size:13px}
details.tog>summary .k{font-weight:500;font-size:12px}
.ck{display:flex;gap:10px;align-items:flex-start;padding:6px 4px 6px 26px;font-size:15px;line-height:1.5}
.ck i{flex:none;width:16px;height:16px;border:1.5px solid var(--ink-soft);border-radius:3px;margin-top:3px}
button.ckb{width:100%;text-align:left;font:inherit;color:inherit;min-height:44px;cursor:pointer;border-radius:8px}
button.ckb:focus-visible{outline:2px solid var(--hi);outline-offset:-2px}
@media (hover:hover){button.ckb:hover{background:var(--hov)}}
.ck i.on{background:var(--hi);border-color:var(--hi);position:relative}
.ck i.on::after{content:"";position:absolute;left:4.5px;top:1px;width:4px;height:8px;border:solid var(--surface);border-width:0 2px 2px 0;transform:rotate(45deg)}
.ck.mk>span{color:var(--ink-soft)}
.ck .sub.mk{color:var(--ink-mid)}
.pg-box{margin:0 0 10px;border:1px solid var(--line);border-radius:12px;padding:2px 10px}
.pg-box summary{min-height:44px;display:flex;align-items:center;gap:6px;font-size:15px;font-weight:700;cursor:pointer;list-style:none}
.pg-box summary::-webkit-details-marker{display:none}
.pg-box summary svg{width:12px;height:12px;flex:none;transition:transform .15s}
.pg-box[open] summary svg{transform:rotate(90deg)}
.pg-box .meta{font-weight:400}
.pg-list{display:flex;flex-wrap:wrap;gap:8px;padding:0 0 10px}
.pg-list button,.pg-list span.x{min-height:44px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-size:15px;display:inline-flex;align-items:center;gap:6px}
.pg-list span.x{color:var(--ink-soft)}
.pg-list b{font-variant-numeric:tabular-nums}
.ck.done{color:var(--ink-soft);text-decoration:line-through}
.ck.done i{background:var(--hi);border-color:var(--hi)}
.ck .sub{display:block;font-size:12px;color:var(--ink-soft);text-decoration:none}
.ck .pill{margin-left:6px;font-size:12px}

/* 研修の予定 */
.rchips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px 6px;-webkit-overflow-scrolling:touch}
.rchips button{flex:none;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-size:15px;color:var(--ink);white-space:nowrap}
.rchips button[aria-pressed="true"]{background:var(--accent-wash);color:var(--accent-2);border-color:transparent;font-weight:700}
.l-h{font-size:15px;font-weight:700;color:var(--ink-mid);margin:10px 4px 8px}
.l-h .n,details.lend>summary .n{font-weight:400;color:var(--ink-soft);font-size:13px;margin-left:4px}
.plc{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:8px;cursor:pointer}
.plc:active,.plc:hover{background:var(--hov)}
.plc .r1{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:24px}
.plc .r1 .mada{margin-left:auto}
.plc .t{font-weight:700;font-size:15px;line-height:1.45;overflow-wrap:anywhere}
.rl{display:flex;gap:4px;flex-wrap:wrap}
.pbar{display:block;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent)}
details.lend{margin-top:12px}
details.lend>summary{list-style:none;display:flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;margin-bottom:8px;border:1px dashed var(--line-2);border-radius:12px;color:var(--ink-mid);font-size:15px;font-weight:700;cursor:pointer}
details.lend>summary::-webkit-details-marker{display:none}
details.lend>summary .tri{width:14px;height:14px;flex:none;transition:transform .15s}
details.lend[open]>summary .tri{transform:rotate(90deg)}
.pk .acts{display:flex;gap:8px;flex-wrap:wrap;margin:16px 4px 0}
.pk .rl{margin-top:2px}
.ck.ln{padding-left:4px}
.ck.ln svg{width:16px;height:16px;flex:none;margin-top:3px;color:var(--ink-soft)}
.fm{display:flex;flex-direction:column;gap:12px;margin:4px}
.fl{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-mid)}
.fm input,.fm select,.l-q{width:100%;min-height:44px;font-size:16px;padding:0 12px;border:1px solid var(--line-2);border-radius:12px;background:var(--surface);color:var(--ink)}
.fm input:focus,.fm select:focus,.l-q:focus{outline:none;border-color:var(--accent-2);box-shadow:0 0 0 2px var(--accent-wash)}
.fm .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.fm .addr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.rolerow{display:grid;grid-template-columns:minmax(0,1fr) 116px;gap:8px;align-items:center;min-height:52px;border-bottom:1px solid var(--line);font-size:15px;overflow-wrap:anywhere}
.l-q{margin:4px 0 8px}
label.pick{display:flex;gap:10px;align-items:flex-start;min-height:44px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;font-size:15px;line-height:1.45;overflow-wrap:anywhere}
label.pick input{width:20px;height:20px;flex:none;margin-top:2px;accent-color:var(--fill);font-size:16px}
label.pick .sub{display:block;font-size:12px;color:var(--ink-soft)}
.l-sec{font-size:15px;font-weight:700;color:var(--ink-mid);margin:14px 4px 2px}
.l-save{position:sticky;bottom:0;background:var(--paper);padding:10px 4px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;margin-top:8px}

/* 印刷用（画面では隠す） */
#printArea{display:none}
#pvBar{display:none}
body.pv #pvBar{display:flex;position:sticky;top:0;z-index:5;gap:8px;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:var(--paper);border-bottom:1px solid var(--line)}
#pvBar .t{font-size:14px;font-weight:700;white-space:nowrap}
@media (max-width:599px){#pvBar .t{display:none}#pvBar .bs{flex:1;flex-wrap:nowrap}#pvBar .bs .btn{flex:1;padding:0 10px;white-space:nowrap}}
#pvBar .bs{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
@media screen{body.pv #printArea{width:1050px;padding:24px 28px 40px;background:var(--pr-paper)}}
body.pv{overflow-x:hidden}
body.pv #printArea svg{max-width:100%;height:auto}
@media print{ #pvBar{display:none!important} }
@media print{
  @page{size:A4 landscape;margin:12mm}
  :root{--ink:var(--pr-ink);--ink-mid:var(--pr-soft);--ink-soft:var(--pr-soft);--line:var(--pr-line);--line-2:var(--pr-line);--surface:var(--pr-paper);--paper:var(--pr-paper)}
  body{background:var(--pr-paper);min-height:0}
  .wrap,.toast,dialog,#tsumikiEdge,#tsumikiPeek{display:none!important}
  #printArea{display:block;color:var(--pr-ink)}
  .pr-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6mm}
  .pr-h h1{font-size:18pt}
  .pr-h .meta{font-size:10pt}
  .pr-sec{break-inside:avoid;margin-bottom:5mm}
  .pr-sec h2{font-size:13pt;margin-bottom:2mm}
  .pr-leg{display:flex;gap:6mm;font-size:9pt;margin-bottom:2mm;color:var(--pr-soft);flex-wrap:wrap}
  .pr-leg i{display:inline-block;width:5mm;height:1mm;border-radius:1px;vertical-align:middle;margin-right:1.5mm}
  .pr-sec>svg{width:100%;height:auto;display:block}
  .pr-tbl{break-before:page}
  .pr-tbl table{font-size:9pt;width:100%}
  .pr-tbl th,.pr-tbl td{padding:1.5mm 2mm;height:auto}
  .pr-tbl td.cm{min-width:0}
  .pr-ppl table{font-size:9pt;width:100%}
  .pr-ppl th,.pr-ppl td{padding:1.5mm 2mm;height:auto;text-align:left;white-space:normal;vertical-align:top;position:static}
  .pr-ppl td.n{text-align:right;white-space:nowrap}
  .pr-ppl tr{break-inside:avoid}
}
</style>

<div class="toast" id="toast" role="status"></div>

<script>
(function(){
'use strict';
const KEY = 'jukou.v1';
const GROUPS = {
  a:{name:'ATLAS', m:[
    {nm:'Total（全体）', en:'Total'},
    {nm:'New Required (<30 days)（新しい必須・30日以内）', en:'New Required (<30 days)'},
    {nm:'Required (>30 days)（必須・30日超え）', en:'Required (>30 days)'},
    {nm:'Required（必須）', en:'Required'}]},
  l:{name:'Learning', m:[
    {nm:'Onboarding (Core)（オンボーディング・共通）', en:'Onboarding (Core)'},
    {nm:'Onboarding (Role)（オンボーディング・職種別）', en:'Onboarding (Role)'},
    {nm:'New Required (<30 days)（新しい必須・30日以内）', en:'New Required (<30 days)'},
    {nm:'Required (>30 days)（必須・30日超え）', en:'Required (>30 days)'}]}
};
const WD = '日月火水木金土';
const $ = s => document.querySelector(s);

/* ---------- 保存 ---------- */
function load(){
  try{ const d = JSON.parse(localStorage.getItem(KEY)||'null'); if(d && d.entries) return d; }catch(e){}
  return {v:1, entries:{}};
}
let db = load();
function persist(){ localStorage.setItem(KEY, JSON.stringify(db)); }

/* ---------- 日付 ---------- */
function todayStr(){ const d=new Date(); return ymd(d); }
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parse(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function md(s){ const d=parse(s); return (d.getMonth()+1)+'/'+d.getDate(); }
function mdw(s){ const d=parse(s); return md(s)+'（'+WD[d.getDay()]+'）'; }
function dayNum(s){ return Math.round(parse(s).getTime()/864e5); }
const sortedDates = () => Object.keys(db.entries).sort();

/* ---------- 状態 ---------- */
const st = {g:'a', r:30, hi:0, tipDate:null};

/* ---------- 入力欄 ---------- */
const fieldsEl = $('#fields');
/* 店全体の帯と同じ並び：Total｜ATLAS 3｜Learning 4 */
const RB_NM = {a:['Total','New Required<br>(&lt;30 days)','Required<br>(&gt;30 days)','Required'], l:['Onboarding<br>(Core)','Onboarding<br>(Role)','New Required<br>(&lt;30 days)','Required<br>(&gt;30 days)']};
function buildFields(){
  const inp=(g,i)=>`<input id="v_${g}${i}" data-g="${g}" data-i="${i}" type="text" inputmode="decimal" enterkeyhint="next" autocomplete="off" aria-describedby="dd_${g}${i} hint"><span class="pct" aria-hidden="true">%</span>`;
  const cell=(g,i)=>`<div class="rb-c"><label for="v_${g}${i}" title="${esc(GROUPS[g].m[i].nm)}">${RB_NM[g][i]}</label><div class="in">${inp(g,i)}</div><span class="dd" id="dd_${g}${i}"></span></div>`;
  fieldsEl.innerHTML =
    `<div class="rb-tot"><label for="v_a0">Total</label><div class="in">${inp('a',0)}</div><span class="dd" id="dd_a0"></span></div>`+
    `<div class="rb-g a" role="group" aria-label="ATLAS"><div class="gh" aria-hidden="true">ATLAS</div><div class="rb-cs">${[1,2,3].map(i=>cell('a',i)).join('')}</div></div>`+
    `<div class="rb-g l" role="group" aria-label="Learning"><div class="gh" aria-hidden="true">Learning</div><div class="rb-cs">${[0,1,2,3].map(i=>cell('l',i)).join('')}</div></div>`;
}
/* 前回との差をその場で出す */
function showDiff(el){
  const dd=$('#dd_'+el.dataset.g+el.dataset.i); if(!dd) return;
  const p=db.entries[prevOf($('#date').value||todayStr())];
  const pv=p&&p[el.dataset.g]?p[el.dataset.g][+el.dataset.i]:null;
  const n=readNum(el);
  dd.className='dd';
  if(n==null||Number.isNaN(n)){ dd.textContent = pv==null?'':'前回 '+pv; return; }
  if(pv==null){ dd.textContent=''; return; }
  const x=Math.round((n-pv)*10)/10;
  dd.textContent = x>0?'+'+x : x<0?'−'+Math.abs(x) : '±0';
  if(x) dd.classList.add(x>0?'up':'dn');
}
buildFields();
const inputs = [...fieldsEl.querySelectorAll('input')];
inputs.forEach((el,idx)=>{
  el.addEventListener('keydown', e=>{
    if(e.key==='Enter'){ e.preventDefault(); (inputs[idx+1]||$('#cm')).focus(); }
  });
  el.addEventListener('input', ()=>{ el.value = el.value.replace(/[０-９．]/g, c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[^0-9.]/g,''); el.classList.remove('bad'); setHint(''); showDiff(el); });
});

function readNum(el){
  const s = el.value.trim(); if(s==='') return null;
  const n = Number(s); if(!isFinite(n) || n<0 || n>100) return NaN;
  return Math.round(n*10)/10;
}
function prevOf(date){
  const ds = sortedDates().filter(d=>d<date); return ds.length ? ds[ds.length-1] : null;
}
function setHint(t,warn){ const h=$('#hint'); h.textContent=t; h.classList.toggle('warn',!!warn); }

function fillForm(date){
  $('#date').value = date;
  const e = db.entries[date];
  const isToday = date===todayStr();
  $('#entTitle').textContent = isToday?'今日の記録':mdw(date)+'の記録';
  const p = db.entries[prevOf(date)];
  inputs.forEach(el=>{
    const g=el.dataset.g, i=+el.dataset.i;
    const v = e && e[g] ? e[g][i] : null;
    el.value = v==null ? '' : String(v);
    const pv = p && p[g] ? p[g][i] : null;
    el.placeholder = pv==null ? '' : String(pv);
    el.classList.remove('bad'); showDiff(el);
  });
  $('#cm').value = e ? (e.c||'') : '';
  $('#show').checked = e ? e.show!==false : true;
  $('#delRow').hidden = !e;
  $('#del').classList.remove('ask');
  $('#copyPrev').hidden = !p;
  setHint((e?'保存済み。直して保存し直せます。':'')+(p && !e ? `薄い数字は前回（${md(prevOf(date))}）の値。打ったマスだけ濃くなります。` : ''));
}
$('#date').addEventListener('change', ()=>{ if($('#date').value) fillForm($('#date').value); });
$('#copyPrev').addEventListener('click', ()=>{
  const p = db.entries[prevOf($('#date').value)]; if(!p) return;
  inputs.forEach(el=>{ if(el.value.trim()==='' ){ const v=p[el.dataset.g]?.[+el.dataset.i]; if(v!=null) el.value=String(v);} });
  inputs.forEach(showDiff);
  setHint('空いている欄に前回の数字を入れました');
});
$('#save').addEventListener('click', ()=>{
  const date = $('#date').value;
  if(!date){ setHint('日付を選んでください',true); return; }
  const rec = {a:[null,null,null,null], l:[null,null,null,null]};
  let bad=null, any=false;
  inputs.forEach(el=>{
    const n = readNum(el);
    if(Number.isNaN(n)){ el.classList.add('bad'); bad = bad||el; }
    else { rec[el.dataset.g][+el.dataset.i]=n; if(n!=null) any=true; }
  });
  if(bad){ setHint('0〜100 の数字で入れてください',true); bad.focus(); return; }
  const c = $('#cm').value.trim();
  if(!any && !c){ setHint('数字かコメントを1つ以上入れてください',true); return; }
  rec.c = c; rec.show = $('#show').checked; rec.t = Date.now();
  db.entries[date] = rec; persist();
  st.tipDate = date;
  renderAll(); fillForm(date); closeRec();
  toast(mdw(date)+' を保存しました');
});
/* 記録のページを開く・閉じる */
/* 開く動き：押したところ（＋）から円が広がって画面になり、中身が上から順に出る。閉じると＋へ縮む。
   ばね＝design_refs の基準（stiffness 200 / damping 28）。動きを減らす設定では出さない */
const MV = (()=>{ const k=200,c=28; let x=0,v=0,t=0; const dt=1/600, o=[];
  while(t<1.6){ v+=(-k*(x-1)-c*v)*dt; x+=v*dt; t+=dt; o.push(x); if(t>.25 && Math.abs(x-1)<.001 && Math.abs(v)<.01) break; }
  const pts=[]; for(let i=0;i<=32;i++) pts.push(+o[Math.round(i*(o.length-1)/32)].toFixed(4));
  const ok = window.CSS && CSS.supports && CSS.supports('animation-timing-function','linear(0, 1)');
  return {ease: ok ? 'linear('+pts.join(',')+')' : 'cubic-bezier(.2,.9,.25,1)', ms: Math.round(t*1000)}; })();
const calm = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
let recFrom=null, recAnims=[], recClosing=false;
function recStop(){ recAnims.forEach(a=>{ try{ a.cancel(); }catch(e){} }); recAnims=[]; }
function recCircle(r){
  const vis = el => el && el.isConnected && el.getClientRects().length && getComputedStyle(el).visibility!=='hidden';
  const el = vis(recFrom) ? recFrom : vis($('#addRec')) ? $('#addRec') : null, d=r.getBoundingClientRect();
  const b = el ? el.getBoundingClientRect() : {left:d.left+d.width/2-30, top:d.top+d.height/2-30, width:60, height:60};
  const cx=b.left+b.width/2-d.left, cy=b.top+b.height/2-d.top;
  const R=Math.ceil(Math.hypot(Math.max(cx, d.width-cx), Math.max(cy, d.height-cy)));
  return {cx, cy, r0:Math.max(12, Math.min(b.width, b.height)/2), R, fab: el && el.id==='addRec' ? el : null};
}
function openRec(date, from){
  fillForm(date||todayStr());
  const r=$('#rec'); recStop(); recClosing=false; r.inert=false; recFrom=from||null;
  if(!r.open) r.showModal(); r.scrollTop=0;
  const first=inputs.find(el=>el.value===''); if(matchMedia('(hover:hover)').matches) (first||inputs[0]).focus({preventScroll:true}); else r.focus();
  if(calm() || !r.animate) return;
  const g=recCircle(r), at=`at ${g.cx}px ${g.cy}px`;
  const fill = g.fab ? getComputedStyle(g.fab).backgroundColor : getComputedStyle(r).backgroundColor;
  recAnims.push(r.animate([{clipPath:`circle(${g.r0}px ${at})`, backgroundColor:fill}, {backgroundColor:getComputedStyle(r).backgroundColor, offset:.35}, {clipPath:`circle(${g.R}px ${at})`}], {duration:MV.ms, easing:MV.ease}));
  try{ recAnims.push(r.animate([{opacity:0},{opacity:1}], {duration:MV.ms*.6, pseudoElement:'::backdrop'})); }catch(e){}
  if(g.fab) recAnims.push(g.fab.animate([{transform:'rotate(0)'},{transform:'rotate(90deg) scale(.6)', opacity:0}], {duration:180, easing:'ease-in', fill:'forwards'}));
  r.querySelectorAll('.rc > *:not(#fields):not([hidden]), #fields > *').forEach((it,i)=>recAnims.push(
    it.animate([{opacity:0, transform:'translateY(12px)'},{opacity:1, transform:'none'}], {duration:280, delay:120+i*45, easing:'cubic-bezier(.2,.8,.2,1)', fill:'backwards'})));
}
function closeRec(){
  const r=$('#rec'); if(!r.open || recClosing) return;
  if(calm() || !r.animate){ recStop(); r.close(); return; }
  const cur=getComputedStyle(r).clipPath; recStop(); recClosing=true; r.inert=true;
  const g=recCircle(r), at=`at ${g.cx}px ${g.cy}px`;
  const a=r.animate([{clipPath:(cur && cur!=='none') ? cur : `circle(${g.R}px ${at})`},{clipPath:`circle(${g.r0}px ${at})`}], {duration:260, easing:'cubic-bezier(.4,0,.8,.4)', fill:'forwards'});
  recAnims.push(a);
  try{ recAnims.push(r.animate([{opacity:1},{opacity:0}], {duration:260, pseudoElement:'::backdrop', fill:'forwards'})); }catch(e){}
  if(g.fab) recAnims.push(g.fab.animate([{transform:'rotate(90deg) scale(.6)', opacity:0},{transform:'none', opacity:1}], {duration:200, delay:140, easing:'cubic-bezier(.2,.8,.2,1)', fill:'backwards'}));
  const done=()=>{ if(recClosing && r.open) r.close(); };
  a.finished.then(done).catch(()=>{}); setTimeout(done, 500);
}
$('#rec').addEventListener('cancel', e=>{ if(calm() || recClosing) return; e.preventDefault(); closeRec(); });
$('#addRec').addEventListener('click', e=>openRec(todayStr(), e.currentTarget));
$('#recClose').addEventListener('click', closeRec);
let byKey=false; addEventListener('keydown',()=>{byKey=true},true); addEventListener('pointerdown',()=>{byKey=false},true);
$('#rec').addEventListener('close', ()=>{ recClosing=false; $('#rec').inert=false; recAnims.filter(a=>a.effect && a.effect.target===$('#rec')).forEach(a=>a.cancel()); const f=$('#addRec'); if(!f) return; if(view==='store' && byKey) f.focus({preventScroll:true}); else f.blur(); });
/* 削除：その場で確かめる（confirm を使わない） */
const delEl = $('#del');
delEl.querySelector('.go').addEventListener('click', ()=>delEl.classList.add('ask'));
delEl.querySelector('.no').addEventListener('click', ()=>delEl.classList.remove('ask'));
delEl.querySelector('.yes').addEventListener('click', ()=>{
  const date=$('#date').value; delete db.entries[date]; persist();
  st.tipDate=null; renderAll(); fillForm(date); closeRec(); toast(mdw(date)+' を消しました');
});

/* ---------- 切り替え ---------- */
document.querySelectorAll('[data-r]').forEach(b=>b.addEventListener('click',()=>{ st.r=+b.dataset.r; st.tipDate=null; document.querySelectorAll('[data-r]').forEach(x=>x.setAttribute('aria-pressed',x===b)); renderChart(); }));

/* ---------- チップ（最新値） ---------- */
function latest(g,i){
  const ds = sortedDates();
  for(let k=ds.length-1;k>=0;k--){ const v=db.entries[ds[k]][g]?.[i]; if(v!=null){
    let prev=null; for(let j=k-1;j>=0;j--){ const pv=db.entries[ds[j]][g]?.[i]; if(pv!=null){prev=pv;break;} }
    return {v, d:ds[k], diff: prev==null?null:Math.round((v-prev)*10)/10};
  } }
  return null;
}
const BAND = [['a',1],['a',2],['a',3],['l',0],['l',1],['l',2],['l',3]];
const heatK = x => { const v=Math.round(x); return v>=97?4 : v>=95?3 : v>=90?2 : v>=80?1 : 0; };
const HEAT_LG = [['k4','97〜'],['k3','95〜96'],['k2','90〜94'],['k1','80〜89'],['k0','〜79']];
const hs = {all:false};
function diffTxt(L){ return L&&L.diff!=null ? (L.diff>0?`＋${L.diff}`:L.diff<0?`−${Math.abs(L.diff)}`:'±0') : ''; }
function renderChips(){
  const ds=sortedDates(); $('#bandDate').textContent = ds.length ? mdw(ds[ds.length-1])+' まで' : '';
  const cell=(g,i,cls)=>{ const L=latest(g,i), m=GROUPS[g].m[i], dt=diffTxt(L);
    return `<button class="${cls}" data-g2="${g}" data-i="${i}" aria-pressed="${g===st.g&&i===st.hi}" aria-label="${esc(GROUPS[g].name+' '+m.en)} ${L?L.v+'%':'記録なし'}">`+
      `<span class="nm">${esc(cls==='tot'?'Total':m.en)}</span><span class="v">${L?L.v:'—'}${L?'<small>%</small>':''}</span><span class="d">${L?md(L.d)+(dt?' '+dt:''):'まだ'}</span></button>`; };
  $('#band').innerHTML = `<div class="band">${cell('a',0,'tot')}<div class="sc"><div class="in"><div class="gh ga">ATLAS</div><div class="gh gl">Learning</div>`+
    BAND.map(([g,i])=>cell(g,i,'c')).join('')+`</div></div></div>`;
  $('#band').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{ st.g=b.dataset.g2; st.hi=+b.dataset.i; st.tipDate=null; renderChips(); renderChart(); }));
  const sel=$('#band').querySelector('.c[aria-pressed="true"]'), sc=$('#band .sc'); if(sel && sc){ const l=sel.getBoundingClientRect().left-sc.getBoundingClientRect().left+sc.scrollLeft, r=l+sel.offsetWidth; if(l<sc.scrollLeft || r>sc.scrollLeft+sc.clientWidth) sc.scrollTo({left:l, behavior:'instant'}); }
  $('#plotSel').innerHTML = `${swHTML(st.g,st.hi)}<span>太線：${esc(serName(st.g,st.hi))}</span>`;
  renderSerTray();
}
function renderHeat(){
  const ds=sortedDates().filter(d=>{ const e=db.entries[d]; return ['a','l'].some(g=>(e[g]||[]).some(v=>v!=null)); }).reverse();
  if(!ds.length){ $('#heat').innerHTML=`<div class="empty">まだ記録がありません</div>`; $('#heatMeta').textContent=''; return; }
  const LIM=14, show = hs.all ? ds : ds.slice(0,LIM);
  $('#heatMeta').textContent = `${show.length}日分・濃いほど高い`;
  const cols=[['a',0],...BAND];
  let h=`<div class="heat-sc"><div class="heat" role="table" aria-label="日ごとの受講率"><span aria-hidden="true"></span><span aria-hidden="true"></span><span class="g ga" aria-hidden="true">ATLAS</span><span class="g gl" aria-hidden="true">Learning</span>`;
  h+=`<div class="row" role="row"><span role="columnheader" class="hd">日付</span>`+cols.map(([g,i])=>`<span role="columnheader" class="hd" aria-label="${esc((g==='a'&&i===0)?'Total':GROUPS[g].name+' '+GROUPS[g].m[i].en)}">${RB_NM[g][i]}</span>`).join('')+`</div>`;
  show.forEach(d=>{ const e=db.entries[d];
    h+=`<div class="row ${d===st.tipDate?'sel':''}" role="row"><span class="dt" role="rowheader">${md(d)}</span>`+cols.map(([g,i])=>{ const v=e[g]?.[i];
      return v==null ? `<span class="v na" role="cell" aria-label="記録なし">—</span>` : `<span class="v k${heatK(v)}" role="cell" title="${esc(GROUPS[g].m[i].en)} ${v}%" aria-label="${v}%">${v}</span>`; }).join('')+`</div>`; });
  h+=`</div></div><div class="lg" aria-hidden="true">${HEAT_LG.map(([k,t])=>`<span><i class="v ${k}"></i>${t}</span>`).join('')}</div>`;
  if(ds.length>LIM) h+=`<button class="btn btn-quiet heat-more" id="heatMore">${hs.all?'新しい14日だけにする':'前の日も見る（'+ds.length+'日）'}</button>`;
  $('#heat').innerHTML=h;
  $('#heatMore')?.addEventListener('click',()=>{ hs.all=!hs.all; renderHeat(); });
}

/* ---------- グラフ（共通の描画） ---------- */
function niceMin(vals){ const mn=Math.min(...vals); let f=Math.floor((mn-2)/10)*10; return Math.max(0,Math.min(f,90)); }
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* opts: g, hi(-1=全部同じ濃さ), dates[], W, mode('screen'|'print'), colors */
function chartSVG(o){
  const {g,dates,W,mode,col} = o;
  const pr = mode==='print';
  const flags = pr ? dates.filter(d=>{const e=db.entries[d]; return e.c && e.show!==false;}) : [];
  const fs = pr?11:11;
  const L=34, R=pr?34:14, B=26;
  // 旗の段組み（印刷）：左から順に、重ならない段へ
  const ctx = document.createElement('canvas').getContext('2d'); ctx.font = `500 ${fs}px "Zen Maru Gothic", sans-serif`;
  const d0 = dates.length?dayNum(dates[0]):0, d1 = dates.length?dayNum(dates[dates.length-1]):1;
  const span = Math.max(1,d1-d0);
  const px = d => L + (dates.length===1 ? (W-L-R)/2 : (dayNum(d)-d0)*(W-L-R)/span);
  let rows=[], placed=[];
  for(const d of flags){
    let t = db.entries[d].c.replace(/\s+/g,' ');
    if(t.length>40) t=t.slice(0,39)+'…';
    const lab = md(d)+'  '+t;
    const w = Math.ceil(ctx.measureText(lab).width)+16;
    const X = px(d);
    let x0 = Math.min(Math.max(X-w/2, 0), W-w);
    let r=0; while(rows[r]!=null && rows[r] > x0-6) r++;

  const flagH = placed.length ? (rows.length*22+8) : 0;

  const ph = H-T-B;
  const all=[]; dates.forEach(d=>{ (db.entries[d][g]||[]).forEach(v=>{ if(v!=null) all.push(v); }); });

    s += `<text x="${L-6}" y="${py(v)+4}" text-anchor="end" font-size="11" fill="${col.soft}">${v}</text>`;
  }
  // 日付の目盛り（多すぎないように）
  if(dates.length){
    const maxTicks = Math.max(2, Math.floor((W-L-R)/56));
    const every = Math.max(1, Math.ceil(dates.length/maxTicks));
    const ticks = dates.filter((d,i)=>i%every===0);
    if(ticks[ticks.length-1]!==dates[dates.length-1] && dates.length>1){
      const last=dates[dates.length-1]; if(px(last)-px(ticks[ticks.length-1])<40) ticks.pop(); ticks.push(last);

  }
  // 旗（印刷）
  placed.forEach(p=>{
    const y = 4 + p.r*22;
    s += `<line x1="${p.X}" x2="${p.X}" y1="${y+20}" y2="${T+ph}" stroke="${col.mark}" stroke-width="1" stroke-dasharray="3 3"/>`;
    s += `<rect x="${p.x0}" y="${y}" width="${p.w}" height="20" rx="10" fill="${col.wash}"/>`;
    s += `<text x="${p.x0+8}" y="${y+14}" font-size="${fs}" font-weight="500" fill="${col.mark}">${esc(p.lab)}</text>`;
  });
  // 線（強調以外を先に）
  const order = [0,1,2,3].filter(i=>i!==o.hi); if(o.hi>=0) order.push(o.hi);
  const ends=[];
  order.forEach(i=>{
    const on = o.hi<0 || i===o.hi;
    const color = o.hi<0 ? col.series[i] : (on?col.hi:col.lo);
    let path='', pen=false;
    dates.forEach(d=>{ const v=db.entries[d][g]?.[i]; if(v==null){pen=false;return;} path += (pen?'L':'M')+px(d).toFixed(1)+','+py(v).toFixed(1); pen=true; });
    const dash = (o.hi<0 && col.dash && col.dash[i]) ? ` stroke-dasharray="${col.dash[i]}"` : '';

    const pts = dates.filter(d=>db.entries[d][g]?.[i]!=null);

  ends.sort((p,q)=>p.y-q.y);

  ends.forEach(e=>{ s += `<text x="${e.x}" y="${e.y+4}" font-size="10" font-weight="700" fill="${col.ink}">${e.v}</text>`; });
  // コメントの印（画面）

    dates.forEach(d=>{ const e=db.entries[d]; if(!e.c || e.show===false) return;
      const v = e[g]?.[o.hi]; const y = v==null ? T+ph : py(v);
      s += `<circle cx="${px(d)}" cy="${y}" r="7" fill="${col.surface}" stroke="${col.mark}" stroke-width="2"/><circle cx="${px(d)}" cy="${y}" r="2.6" fill="${col.mark}"/>`;
    });
    if(st.tipDate && dates.includes(st.tipDate)){
      s += `<line x1="${px(st.tipDate)}" x2="${px(st.tipDate)}" y1="${T}" y2="${T+ph}" stroke="${col.soft}" stroke-width="1" stroke-dasharray="2 3"/>`;
    }
  }
  s += `</svg>`;
  return {svg:s, px, py, T, ph, H};
}

function yScale(vals, allVals){

const OPEN_STATES = ['未完了','期限切れ'];

function csvParse(t){
  t = t.replace(/^﻿/,''); const out=[]; let row=[], f='', q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; continue; }
    if(c==='"') q=true; else if(c===','){ row.push(f); f=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&t[i+1]==='\n') i++; row.push(f); f=''; if(row.some(x=>x.trim()!=='')) out.push(row); row=[]; }
    else f+=c;
  }
  row.push(f); if(row.some(x=>x.trim()!=='')) out.push(row);
  return out;
}
function nz(s){ return String(s||'').normalize('NFKC').replace(/\s+/g,'').replace(/[｜]/g,'|').toLowerCase(); }
function stripEll(s){ return String(s||'').replace(/(…|\.\.\.)\s*$/,'').trim(); }

/* セッション一覧（.txt）を区分つきの並びにする */
function parseList(text){
  const items=[]; let cat=null, sub=null, subFromDash=false;
  for(const raw of text.split(/\r?\n/)){
    const l=raw.trim(); if(!l || /^=+$/.test(l)) continue;
    let m;
    if((m=l.match(/^([①②③④⑤])\s*(.+)$/))){ cat={no:m[1], name:m[2].trim()}; sub=null; subFromDash=false; continue; }
    if((m=l.match(/^-{2,}\s*(.+?)\s*-{2,}$/))){ sub=m[1].replace(/[（(]カリキュラム[)）]/,'').replace(/の内訳$/,'').trim(); subFromDash=true; continue; }
    if((m=l.match(/^\[(.+)\]$/))){ if(!subFromDash) sub=m[1].trim(); continue; }
    if((m=l.match(/^-\s+(.+)$/)) && cat){ items.push({t:m[1].trim(), cat:cat.no, catName:cat.name, sub:sub||cat.name}); }
  }
  return items;
}
let listCache=null;
function listItems(){ if(!pdb.list) return []; if(!listCache) listCache=parseList(pdb.list.text); return listCache; }
function matchTitle(title){
  const items=listItems(); if(!items.length) return null;
  const p=nz(stripEll(title)); if(!p) return null;
  const cut=/(…|\.\.\.)\s*$/.test(title);
  return items.find(it=>nz(it.t)===p) || (cut ? items.find(it=>nz(it.t).startsWith(p)) : null) || null;
}

function snapDates(){ return Object.keys(pdb.snaps).sort(); }
function curDate(){ const ds=snapDates(); if(!ds.length) return null; return (ps.date && pdb.snaps[ps.date]) ? ps.date : ds[ds.length-1]; }
const CALL_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/></svg>';
const CALL_ON='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="M7.5 12.3l3 3 6-6.4" fill="none" stroke="var(--surface)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function callOf(k){ const c=pdb.calls&&pdb.calls[k]; return c&&c.at ? c : null; }
function callStamp(c){ return c ? Math.max(c.at||0, c.off||0) : 0; }
function callOld(c, d){ return !!(c && d && ymd(new Date(c.at)) < d); }
function callTxt(at){ const d=new Date(at); const p=n=>String(n).padStart(2,'0'); return mdw(ymd(d))+' '+p(d.getHours())+':'+p(d.getMinutes()); }
function callTxtS(at){ const d=new Date(at); const p=n=>String(n).padStart(2,'0'); return md(ymd(d))+' '+p(d.getHours())+':'+p(d.getMinutes()); }
function toggleCall(k, name){
  if(!pdb.calls) pdb.calls={};
  const was=callOf(k);
  const prev=pdb.calls[k];
  pdb.calls[k] = was ? {at:0, off:Date.now()} : {at:Date.now()};
  if(!ppersist()){ if(prev) pdb.calls[k]=prev; else delete pdb.calls[k]; return; }
  toast(was ? '声かけの記録を外しました' : '声かけ '+callTxt(pdb.calls[k].at));
}
function mkKey(title){ const it=matchTitle(title); return nz(it?it.t:title); }
/* 手で済み：押したときの最新の取り込み日（d）より前の画面には出さない */
function markOf(k,t,view){ const m=pdb.marks&&pdb.marks[k]&&pdb.marks[k][t]; if(!(m&&m.at)) return null; if(view && m.d && view<m.d) return null; return m; }
function markCount(p){ return p.rows.filter(r=>OPEN_STATES.includes(r[6]) && markOf(p.key, mkKey(r[5]), p.d)).length; }
function toggleMark(k,t,view){
  if(!pdb.marks) pdb.marks={}; if(!pdb.marks[k]) pdb.marks[k]={};
  const prev=pdb.marks[k][t], was=markOf(k,t,view);
  const ds=snapDates(); pdb.marks[k][t] = was ? {at:0, off:Date.now()} : {at:Date.now(), d:view||ds[ds.length-1]||''};
  if(!ppersist()){ if(prev) pdb.marks[k][t]=prev; else delete pdb.marks[k][t]; return undefined; }
  return markOf(k,t,view);
}
/* 前の取り込みでまだだったものが、次の取り込みで「完了」か一覧から消えていれば「進んだ」。
   ・人はメールと姓名の両方で照らす（今回いない人は数えない＝別に出す）
   ・「…」で切れた名前は頭で照らし、まだの行が残っていれば進んだにしない
   ・最新の取り込みでまだ残っている項目は外す
   ・行数が前回の半分を切ったら、欠けた取り込みとみなして数えない */
const pgCache=new Map(); let pgVer=0;
function nameKey(r){ return 'n:'+nz(r[2]+r[3]); }
function tKey(t){ return nz(stripEll(t)); }
function tCompat(a, b){ if(!a.k || !b.k) return a.k===b.k && a.r[5]===b.r[5]; if(a.k===b.k) return true; return (a.cut && b.k.startsWith(a.k)) || (b.cut && a.k.startsWith(b.k)); }
function tInfo(r){ return {k:tKey(r[5]), cut:/(…|\.\.\.)\s*$/.test(r[5]), r}; }
function personIndex(date){
  const by=new Map();
  for(const p of people(date)){ by.set(p.key,p); if(p.rows[0]) by.set(nameKey(p.rows[0]),p); if(p.mail) by.set('m:'+p.mail.toLowerCase(),p); }
  return by;
}
function findPerson(idx, pp){ return idx.get(pp.key) || (pp.rows[0] && idx.get(nameKey(pp.rows[0]))) || (pp.mail && idx.get('m:'+pp.mail.toLowerCase())) || null; }
function progressOf(prevD, d){
  const empty=Object.assign(new Map(), {absent:[], short:false});
  if(!prevD || !pdb.snaps[prevD] || !pdb.snaps[d]) return empty;
  const ck=pgVer+'|'+prevD+'|'+d; if(pgCache.has(ck)) return pgCache.get(ck);
  const out=Object.assign(new Map(), {absent:[], short:false});
  const pn=pdb.snaps[prevD].rows.length, cn=pdb.snaps[d].rows.length;
  if(pn>=10 && cn*2<pn){ out.short=true; pgCache.set(ck,out); return out; }
  const cur=personIndex(d);
  const ds=snapDates(), last=ds[ds.length-1], lastIdx= last===d ? cur : personIndex(last);
  for(const pp of people(prevD)){
    const open=pp.rows.filter(r=>OPEN_STATES.includes(r[6])); if(!open.length) continue;
    const cp=findPerson(cur, pp);
    if(!cp){ out.absent.push(pp); continue; }
    const ct=cp.rows.map(tInfo);
    const lp=findPerson(lastIdx, pp), lt=lp ? lp.rows.filter(r=>OPEN_STATES.includes(r[6])).map(tInfo) : [];
    const items=[];
    for(const r of open){
      const a=tInfo(r);
      const hit=ct.filter(c=>tCompat(a,c));
      if(hit.some(c=>c.r[6]!=='完了')) continue;
      if(lt.some(c=>tCompat(a,c))) continue;
      const done=hit.find(c=>c.r[6]==='完了');
      items.push({r, on: done ? (done.r[8]||'') : ''});
    }
    if(items.length) out.set(cp.key, {p:cp, items});
  }
  pgCache.set(ck,out); return out;
}
function personKey(r){ return r[1] ? 'm:'+r[1].toLowerCase() : 'n:'+r[2]+' '+r[3]; }
function people(date){
  const snap=pdb.snaps[date]; if(!snap) return [];
  const map=new Map();
  for(const r of snap.rows){
    const k=personKey(r);
    if(!map.has(k)) map.set(k,{key:k, mail:r[1], sei:r[2], mei:r[3], role:r[4], rows:[]});
    const p=map.get(k); if(!p.mail && r[1]) p.mail=r[1]; if(!p.role && r[4]) p.role=r[4];
    p.rows.push(r);
  }
  const arr=[...map.values()];
  arr.forEach(p=>{ p.d=date; p.left=p.rows.filter(r=>OPEN_STATES.includes(r[6])).length; p.name=(p.sei+' '+p.mei).trim()||p.mail||'（名前なし）'; });
  return arr;
}
const ROLE_TONES=['t-bl','t-gr','t-pu','t-yl','t-or','t-pk','t-gray'];
function roleTone(role){ let h=0; for(const c of String(role)) h=(h*31+c.charCodeAt(0))>>>0; return ROLE_TONES[h%ROLE_TONES.length]; }
function leftTone(n){ return n>=10?'t-red':n>=5?'t-or':n>=1?'t-yl':'t-gr'; }

function renderPeople(){
  listCache=null;
  const ds=snapDates(), d=curDate();
  const sel=$('#pDate');
  sel.hidden = ds.length<2;
  sel.innerHTML = ds.slice().reverse().map(x=>`<option value="${x}" ${x===d?'selected':''}>${mdw(x)}</option>`).join('');
  $('#pDel').hidden = !d;
  const note=$('#pNote');
  if(!d){
    $('#pMeta').textContent='';
    $('#pBody').innerHTML = `<div class="p-empty">${IC.file}<br>iMac で作った <b>learning_日付.csv</b> を読み込むと、<br>ひとりずつの残りが並びます。<br><span class="meta">セッション一覧（.txt）も一緒に読み込むと、区分ごとに分かれます。</span></div>`;
    note.hidden=true; return;
  }
  const arr=people(d);
  const prevD=ds.filter(x=>x<d).pop();
  const prevMap = prevD ? new Map(people(prevD).map(p=>[p.key,p.left])) : null;
  const total=arr.reduce((a,p)=>a+p.left,0);
  $('#pMeta').textContent = `${mdw(d)}・${arr.length}人・残り ${total}件`;
  const roles=[...new Set(arr.map(p=>p.role).filter(Boolean))].sort();
  if(ps.role && !roles.includes(ps.role)) ps.role='';
  const q=nz(ps.q);
  let list=arr.filter(p=>(!ps.role||p.role===ps.role) && (!q || nz(p.name+p.mail).includes(q)));
  list.sort((a,b)=>{
    let c = ps.sort==='left' ? (a.left-b.left) : ps.sort==='role' ? String(a.role).localeCompare(String(b.role),'ja') : a.name.localeCompare(b.name,'ja');
    if(c===0) c = (b.left-a.left) || a.name.localeCompare(b.name,'ja');
    return c*(ps.sort==='left'?ps.dir:ps.sort==='name'||ps.sort==='role'?-ps.dir:1);
  });
  const arrow = k => ps.sort===k ? (ps.dir<0?IC.down:IC.up) : '';
  const srt = k => ps.sort===k ? (ps.dir<0?'descending':'ascending') : 'none';
  let h = `<div class="p-tools"><label class="p-search">${IC.search}<input type="search" id="pQ" placeholder="名前で探す" value="${esc(ps.q)}" enterkeyhint="search" autocomplete="off"></label>`+
    `<select class="p-sel" id="pRole" aria-label="職種でしぼる"><option value="">すべての職種</option>${roles.map(r=>`<option ${r===ps.role?'selected':''}>${esc(r)}</option>`).join('')}</select></div>`;
  const prog=progressOf(prevD, d);
  if(prevD){
    const pl=[...prog.values()].sort((a,b)=>b.items.length-a.items.length);
    const nItems=pl.reduce((a,x)=>a+x.items.length,0);
    const ab=prog.absent.length ? `<p class="meta" style="padding:0 0 10px">今回の一覧にいない人 ${prog.absent.length}人（${prog.absent.slice(0,5).map(x=>esc(x.name)).join('・')}${prog.absent.length>5?' ほか':''}）。全部済んだか、取り込みの抜けです。進んだには数えていません。</p>` : '';
    h += prog.short ? `<div class="pg-box"><p class="meta" style="padding:12px 0">今回の取り込みは前回（${md(prevD)}）の半分より少ない行数です。欠けているかもしれないので、進んだ人は数えていません。</p></div>`
      : pl.length ? `<details class="pg-box" id="pgBox" ${ps.pgOpen?'open':''}><summary>${IC.tri}前回（${md(prevD)}）から進んだ人 ${pl.length}人・${nItems}件</summary><div class="pg-list">`+
      pl.map(x=>`<button data-pk="${esc(x.p.key)}">${esc(x.p.name)} <b>+${x.items.length}</b></button>`).join('')+`</div>${ab}</details>`
      : `<div class="pg-box"><p class="meta" style="padding:12px 0">前回（${md(prevD)}）から進んだ人はいません</p>${ab}</div>`;
  }
  h += `<div class="ptbl" role="table"><div class="ptr head w4" role="row">`+
    `<span role="columnheader"><button data-s="name" aria-sort="${srt('name')}">${IC.name}名前${arrow('name')}</button></span>`+
    `<span role="columnheader"><button data-s="role" aria-sort="${srt('role')}">${IC.sel}職種${arrow('role')}</button></span>`+
    `<span role="columnheader" class="r"><button data-s="left" aria-sort="${srt('left')}">${IC.hash}残り${arrow('left')}</button></span><span role="columnheader" class="r" style="justify-content:center;white-space:nowrap">声かけ</span></div>`;
  for(const p of list){
    let dl='';
    if(prevMap && prevMap.has(p.key)){ const x=p.left-prevMap.get(p.key); if(x) dl=`<span class="dl ${x>0?'up':''}">${x>0?'+':'−'}${Math.abs(x)}</span>`; }
    const cl=callOf(p.key), old=callOld(cl,d), pg=prog.get(p.key), mc=markCount(p);
    const cw=[cl?`${old?'前回 ':'声かけ '}${callTxtS(cl.at)}`:'', pg?`進んだ ${pg.items.length}件`:'', mc?`手で済み ${mc}`:''].filter(Boolean).join('・');

function openPerson(key){

  const cl=callOf(p.key);
  h += `<div style="margin:0 4px 14px"><button class="callrow" id="pkCall" aria-pressed="${!!cl}">${cl?CALL_ON:CALL_OFF}<span>${cl?'声かけ '+callTxt(cl.at):'声かけした'}</span></button></div>`;

  if(p.left && top) h += `<div class="callout">${IC.info}<span>まだ ${p.left}件<span id="pkMc">${mc?`（うち手で済み ${mc}件）`:''}</span>。いちばん多いのは「${esc(top.name)}」（${top.items.length}件）。まだの項目を押すと、手で「済み」にできます。</span></div>`;

    const it2 = (x,g) => { const t=matchTitle(x.r[5]); const after = cl2 && ymd(new Date(cl2.at))>g.from && ymd(new Date(cl2.at))<=g.to;

    if(rec.length && rec[0].to===d) h += `<details class="tog" open><summary>${IC.tri}前回（${md(rec[0].from)}）から進んだ <span class="n">${rec[0].items.length}</span></summary>${rec[0].items.map(x=>it2(x,rec[0])).join('')}</details>`;
    const older=rec.filter(g=>g.to!==d);

  if(done.length) h += `<details class="tog"><summary>${IC.tri}完了 <span class="n">${done.length}</span></summary>${done.map(r=>{ const it=matchTitle(r[5]); return `<div class="ck done"><i aria-hidden="true"></i><span>${esc(it?it.t:r[5])}${r[8]?`<span class="sub">${md(r[8])} 完了</span>`:''}</span></div>`; }).join('')}</details>`;
  $('#pk').innerHTML=h;
  $('#pkClose').addEventListener('click', ()=>$('#peek').close());
  document.querySelectorAll('#pk button.ckb[data-mt]').forEach(b=>b.addEventListener('click', ()=>{
    const m=toggleMark(p.key, b.dataset.mt, d); if(m===undefined) return;
    b.classList.toggle('mk', !!m); b.setAttribute('aria-pressed', !!m); b.querySelector('i').className = m?'on':'';
    b.querySelector('.sub.mk').textContent = m ? '手で済み '+callTxt(m.at) : '';
    const mc2=markCount(p), mo=$('#pkMc'); if(mo) mo.textContent = mc2?`（うち手で済み ${mc2}件）`:'';
    toast(m ? '手で済みにしました' : '手の済みを外しました');
    if(view==='people'){ const y=scrollY; renderPeople(); scrollTo(0,y); }
  }));
  $('#pkCall').addEventListener('click', ()=>{
    toggleCall(p.key, p.name); const c=callOf(p.key), b=$('#pkCall');
    b.setAttribute('aria-pressed', !!c); b.innerHTML=(c?CALL_ON:CALL_OFF)+`<span>${c?'声かけ '+callTxt(c.at):'声かけした'}</span>`;
    if(view==='people'){ const y=scrollY; renderPeople(); scrollTo(0,y); }
  });
  showPeek();
}

function importCSV(text){
  const rows=csvParse(text); if(!rows.length) throw 'empty';
  const head=rows[0].map(x=>x.trim());
  const ix=COLS.map(c=>head.indexOf(c));
  if(ix[5]<0 || ix[6]<0 || (ix[1]<0 && ix[2]<0)) throw 'head';
  const by={}; let bad=0;
  for(const r of rows.slice(1)){
    const v=ix.map(i=>i<0?'':String(r[i]??'').trim());
    if(!v[5]){ bad++; continue; }
    let d=v[0]; if(!/^\d{4}-\d{2}-\d{2}$/.test(d)) d=todayStr();
    (by[d]=by[d]||[]).push(v);
  }
  const ds=Object.keys(by); if(!ds.length) throw 'empty';
  ds.forEach(d=>pdb.snaps[d]={at:Date.now(), rows:by[d]});
  return {ds, n:ds.reduce((a,d)=>a+by[d].length,0), bad};
}

function mergePeople(src){
  mergePeople.calls=0; if(!src || typeof src!=='object') return 0; let n=0;
  for(const [d,sn] of Object.entries(src.snaps||{})){
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d) || !sn || !Array.isArray(sn.rows)) continue;
    const cur=pdb.snaps[d]; if(!cur || (sn.at||0)>(cur.at||0)){ pdb.snaps[d]=sn; n++; }
  }
  if(src.list && src.list.text && (!pdb.list || (src.list.at||0)>(pdb.list.at||0))){ pdb.list=src.list; listCache=null; }
  mergePeople.calls=0;
  if(src.calls && typeof src.calls==='object'){ if(!pdb.calls) pdb.calls={};
    for(const [k,c] of Object.entries(src.calls)){ if(!c || !Number.isFinite(callStamp(c)) || !callStamp(c)) continue; if(callStamp(c)>callStamp(pdb.calls[k])){ pdb.calls[k]=c.at?{at:c.at}:{at:0,off:c.off}; mergePeople.calls++; } } }
  if(src.marks && typeof src.marks==='object'){ if(!pdb.marks) pdb.marks={};
    for(const [k,o] of Object.entries(src.marks)){ if(!o || typeof o!=='object') continue; if(!pdb.marks[k]) pdb.marks[k]={};
      for(const [t,m] of Object.entries(o)){ const st=callStamp(m); if(!st || !Number.isFinite(st)) continue; if(st>callStamp(pdb.marks[k][t])){ pdb.marks[k][t]=m.at?(/^\d{4}-\d{2}-\d{2}$/.test(m.d||'')?{at:m.at,d:m.d}:{at:m.at}):{at:0,off:m.off}; mergePeople.calls++; } } } }
  ppersist(); return n;
}
