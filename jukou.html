/* ---------- 研修の予定 ---------- */
const LKEY = KEY==='jukou.v1' ? 'jukou.plan.v1' : KEY+'.plan';
function lload(){ try{ const d=JSON.parse(localStorage.getItem(LKEY)||'null'); if(d && Array.isArray(d.items)) return Object.assign({roles:[], map:{}, role:'*'}, d); }catch(e){} return {v:1, at:0, items:[], roles:[], map:{}, role:'*'}; }
let ldb = lload();
function lpersist(keepAt){ if(!keepAt) ldb.at=Date.now(); try{ localStorage.setItem(LKEY, JSON.stringify(ldb)); return true; }catch(e){ toast('保存できませんでした（端末の空きが足りません）'); return false; } }
const PTONE = {P1:'t-pk', P2:'t-bl', P3:'t-gr'};
const ptag = p => p ? `<span class="pill ${PTONE[p]||'t-gray'}">${esc(p)}</span>` : '';
const rtag = (r,p) => `<span class="pill ${PTONE[p]||'t-gray'}">${p?esc(p)+'・':''}${esc(r)}</span>`;
const uid = () => 'i'+Date.now().toString(36)+Math.floor(performance.now()*1000%1e6).toString(36)+(uidN++);
let uidN = 0;
const ls = {id:null, q:'', sel:null, names:null};
function planRoles(){ const out=[...(ldb.roles||[])]; for(const it of ldb.items) for(const r of Object.keys(it.roles||{})) if(!out.includes(r)) out.push(r); return out; }
function lstate(it){ const t=dayNum(todayStr()), s=dayNum(it.s), e=dayNum(it.e); if(e<t) return {k:'end'}; if(s>t) return {k:'soon', n:s-t}; return {k:'now', n:e-t, p:(t-s+1)/(e-s+1)}; }
function stTxt(it){ const x=lstate(it); return x.k==='end' ? '終了' : x.k==='soon' ? md(it.s)+' から' : x.n===0 ? '今日まで' : 'あと '+x.n+'日'; }
function stPill(it){ const x=lstate(it); const c = x.k!=='now' ? 't-gray' : x.n===0 ? 't-red' : x.n<=7 ? 't-or' : 't-yl'; return `<span class="pill ${c}">${stTxt(it)}</span>`; }
function lenTxt(m){ m=+m||0; if(!m) return ''; if(m%60===0) return (m/60)+'時間'; return m>60 ? Math.floor(m/60)+'時間'+(m%60)+'分' : m+'分'; }
function periodTxt(it){ return [lenTxt(it.min), md(it.s)+'〜'+md(it.e)].filter(Boolean).join('・'); }
function sessKey(t){ const it=matchTitle(t); return nz(it?it.t:t); }
function remainFor(it){
  const ss=ldb.map[nz(it.t)]; const d=curDate();
  if(!ss || !ss.length) return {linked:false, d, list:[]};
  if(!d) return {linked:true, d:null, list:[]};
  const set=new Set(ss.map(nz)); const list=[];
  for(const p of people(d)){ const n=p.rows.filter(r=>OPEN_STATES.includes(r[6]) && set.has(sessKey(r[5]))).length; if(n) list.push({p, n}); }
  list.sort((a,b)=>(b.n-a.n)||a.p.name.localeCompare(b.p.name,'ja'));
  return {linked:true, d, list};
}
function madaPill(rm){ return rm.linked && rm.d ? `<span class="pill ${leftTone(rm.list.length)} mada">${rm.list.length?'まだ '+rm.list.length+'人':'まだの人なし'}</span>` : ''; }

function renderPlan(){
  listCache=null;
  const roles=planRoles();
  if(ldb.role!=='*' && !roles.includes(ldb.role)) ldb.role='*';
  const box=$('#lBody'), note=$('#lNote');
  $('#lDel').hidden = !ldb.items.length;
  if(!ldb.items.length){
    $('#lChips').innerHTML='';
    box.innerHTML = `<div class="p-empty">${IC.cal24}<br>iMac で作った <b>研修の予定_日付.csv</b> を読み込むと、<br>職種ごとの研修としめきりが並びます。<br><span class="meta">「研修を足す」で1件ずつ入れることもできます。</span></div>`;
    note.hidden=true; return;
  }
  const all = ldb.role==='*';
  $('#lChips').innerHTML = ['*',...roles].map(r=>`<button data-r="${esc(r)}" aria-pressed="${r===ldb.role}">${r==='*'?'全部':esc(r)}</button>`).join('');
  const its = ldb.items.filter(it=>all || (it.roles||{})[ldb.role]!==undefined);
  const live = its.filter(it=>lstate(it).k!=='end').sort((a,b)=>a.e.localeCompare(b.e)||a.s.localeCompare(b.s));
  const done = its.filter(it=>lstate(it).k==='end').sort((a,b)=>b.e.localeCompare(a.e));
  let anyLinked=false, dUsed=null;
  const card = it => {
    const x=lstate(it), rm=remainFor(it); if(rm.linked){ anyLinked=true; dUsed=rm.d; }
    const rl = all ? `<span class="rl">${Object.entries(it.roles||{}).map(([r,p])=>rtag(r,p)).join('')}</span>` : '';
    return `<button class="plc" data-id="${esc(it.id)}"><span class="r1">${all?'':ptag(it.roles[ldb.role])}${stPill(it)}${madaPill(rm)}</span>`+
      `<span class="t">${esc(it.t)}</span><span class="meta">${esc(periodTxt(it))}</span>${rl}`+
      (x.k==='now' ? `<span class="pbar" aria-hidden="true"><i style="width:${Math.round(x.p*100)}%"></i></span>` : '')+`</button>`;
  };
  let h = `<div class="l-h">受講中・これから<span class="n">${live.length}</span></div>`;
  h += live.length ? live.map(card).join('') : `<div class="p-empty" style="padding:16px">いま受ける研修はありません</div>`;
  if(done.length) h += `<details class="lend" id="lEnd" ${ls.endOpen?'open':''}><summary>${IC.tri}終わった研修<span class="n">${done.length}</span></summary>${done.map(card).join('')}</details>`;
  box.innerHTML = h;
  const msgs=[];
  if(anyLinked && dUsed) msgs.push(`「まだ」の人数は ${mdw(dUsed)} の取り込み（ひとりずつ）から数えています。`);
  else if(anyLinked) msgs.push('「ひとりずつ」に learning の CSV を読み込むと、まだの人数が出ます。');
  else msgs.push('研修を押して「セッションをつなぐ」と、まだの人数が出ます。');
  note.hidden=false; note.textContent=msgs.join(' ');
  document.querySelectorAll('#lChips button').forEach(b=>b.addEventListener('click', ()=>{ ldb.role=b.dataset.r; lpersist(true); renderPlan(); }));
  document.querySelectorAll('button.plc').forEach(b=>b.addEventListener('click', ()=>openPlan(b.dataset.id)));
  const end=$('#lEnd'); if(end) end.addEventListener('toggle', ()=>{ ls.endOpen=end.open; });

/* セッションをつなぐ */
const MONTHS=['january','february','march','april','may','june','july','august','september','october','november','december'];
const STOP=new Set(['apple','the','and','with','for','your','from','about','into','training','lab','quick','new','all','other']);
function hintTokens(t){
  const s=String(t).toLowerCase(); const out=new Set();
  (s.match(/[a-z][a-z0-9]{2,}/g)||[]).forEach(w=>{ if(!STOP.has(w) && !MONTHS.includes(w)) out.add(w); });
  const m=s.match(new RegExp('('+MONTHS.join('|')+')\\s+(\\d{4})')); if(m) out.add(m[2]+'年'+(MONTHS.indexOf(m[1])+1)+'月');
  return [...out].map(nz);
}
function sessionPool(){
  const m=new Map();
  for(const it of listItems()) if(!m.has(nz(it.t))) m.set(nz(it.t), {t:it.t, g:it.cat+' '+it.sub});
  const d=curDate();
  if(d) for(const r of pdb.snaps[d].rows){ const it=matchTitle(r[5]); const t=it?it.t:r[5]; const k=nz(t); if(k && !m.has(k)) m.set(k, {t, g:'取り込みにあるセッション'}); }
  return [...m.values()];
}
function planLink(){
  const it=getItem(ls.id); if(!it) return;
  const pool=sessionPool();
  if(!ls.sel){ const cur=ldb.map[nz(it.t)]||[]; ls.sel=new Set(cur.map(nz)); ls.names=new Map(cur.map(t=>[nz(t),t])); }
  pool.forEach(s=>{ if(!ls.names.has(nz(s.t))) ls.names.set(nz(s.t), s.t); });
  let h = pkBar('研修の予定 / セッションをつなぐ') + `<h2>セッションをつなぐ</h2><p class="meta" style="margin:-4px 4px 8px">${esc(it.t)}</p>`;
  if(!pool.length && !ls.sel.size){
    h += `<div class="callout">${IC.info}<span>「ひとりずつ」でセッション一覧（.txt）か learning の CSV を読み込むと、ここから選べます。</span></div><div class="acts"><button class="btn btn-quiet" id="lkBack">もどる</button></div>`;
    $('#pk').innerHTML=h; wireClose(); $('#lkBack').addEventListener('click', planView); return;
  }
  h += `<input type="search" class="l-q" id="lkQ" placeholder="セッション名で探す" value="${esc(ls.q)}" enterkeyhint="search" autocomplete="off"><div id="lkList"></div>`+
    `<div class="l-save"><button class="btn btn-quiet" id="lkBack">やめる</button><button class="btn btn-main" id="lkSave"></button></div>`;
  $('#pk').innerHTML=h; wireClose();
  const toks=hintTokens(it.t);
  const sc = s => toks.reduce((a,k)=>a+(nz(s.t).includes(k)?1:0),0);
  const row = s => `<label class="pick"><input type="checkbox" data-k="${esc(nz(s.t))}" ${ls.sel.has(nz(s.t))?'checked':''}><span>${esc(s.t)}<span class="sub">${esc(s.g)}</span></span></label>`;
  const keep = [...ls.sel].filter(k=>!pool.some(s=>nz(s.t)===k)).map(k=>({t:ls.names.get(k)||k, g:'いまの一覧にないセッション'}));
  const drawList = () => {
    const q=nz(ls.q); const vis=[...keep,...pool].filter(s=>!q || nz(s.t).includes(q));
    const chosen=vis.filter(s=>ls.sel.has(nz(s.t)));
    const cand=vis.filter(s=>!ls.sel.has(nz(s.t)) && sc(s)>0).sort((a,b)=>sc(b)-sc(a));
    const rest=vis.filter(s=>!ls.sel.has(nz(s.t)) && !(sc(s)>0));
    let x='';
    if(chosen.length) x += `<div class="l-sec">選んだセッション</div>`+chosen.map(row).join('');
    if(cand.length) x += `<div class="l-sec">名前が似ている候補</div>`+cand.map(row).join('');
    if(rest.length){
      if(q) x += `<div class="l-sec">見つかったセッション</div>`+rest.map(row).join('');
      else { const gs=new Map(); rest.forEach(s=>{ if(!gs.has(s.g)) gs.set(s.g,[]); gs.get(s.g).push(s); });
        x += `<div class="l-sec">すべてのセッション</div>`+[...gs].map(([g,a])=>`<details class="tog"><summary>${IC.tri}${esc(g)} <span class="n">${a.length}</span></summary>${a.map(row).join('')}</details>`).join(''); }
    }
    if(!vis.length) x = `<div class="p-empty" style="padding:20px">あてはまるセッションがありません</div>`;
    $('#lkList').innerHTML=x;
    $('#lkList').querySelectorAll('input[type=checkbox]').forEach(c=>c.addEventListener('change', ()=>{
      if(c.checked) ls.sel.add(c.dataset.k); else ls.sel.delete(c.dataset.k);
      $('#lkList').querySelectorAll('input[type=checkbox]').forEach(o=>{ if(o.dataset.k===c.dataset.k) o.checked=c.checked; });
      saveLabel();
    }));
  };
  const had = (ldb.map[nz(it.t)]||[]).length;
  const saveLabel = () => { const b=$('#lkSave'); b.textContent = ls.sel.size ? `つなぐ（${ls.sel.size}件）` : had ? 'つながりを外す' : 'つなぐ'; b.disabled = !ls.sel.size && !had; b.style.opacity = b.disabled ? .5 : ''; };
  drawList(); saveLabel();
  $('#lkQ').addEventListener('input', e=>{ ls.q=e.target.value; drawList(); });
  $('#lkBack').addEventListener('click', planView);
  $('#lkSave').addEventListener('click', ()=>{
    const k=nz(it.t);
    if(ls.sel.size) ldb.map[k]=[...ls.sel].map(x=>ls.names.get(x)||x); else delete ldb.map[k];
    if(lpersist()){ toast(ls.sel.size?`${ls.sel.size}件のセッションをつなぎました`:'つながりを外しました'); }
    renderPlan(); planView(); $('#peek').scrollTop=0;
  });
}

/* 読み込み（研修の予定_日付.csv） */
const LCOLS=['職種','研修名','優先','時間','開始','終了'];
function okYmd(y,m,d){ const x=new Date(y,m-1,d); return (x.getFullYear()===y && x.getMonth()===m-1 && x.getDate()===d) ? ymd(x) : null; }
function toYmd(v, ref){
  v=String(v||'').normalize('NFKC').trim(); let m;
  if((m=v.match(/^(\d{4})[-\/.年](\d{1,2})[-\/.月](\d{1,2})日?$/))) return okYmd(+m[1],+m[2],+m[3]);
  if((m=v.match(/^(\d{1,2})[\/月](\d{1,2})日?$/))){ const y=(ref?parse(ref):new Date()).getFullYear(); let s=okYmd(y,+m[1],+m[2]); if(ref && s && s<ref) s=okYmd(y+1,+m[1],+m[2]); return s; }
  return null;
}
function importPlan(text){
  const rows=csvParse(text); if(rows.length<2) throw 'empty';
  const head=rows[0].map(x=>x.normalize('NFKC').trim().replace(/\s*\(.*\)$/,''));
  const ix=LCOLS.map(c=>head.indexOf(c));
  if(ix[1]<0 || ix[4]<0 || ix[5]<0) throw 'head';
  const map=new Map(), roles=[]; let bad=0;
  for(const r of rows.slice(1)){
    const v=ix.map(i=>i<0?'':String(r[i]??'').trim());
    const s=toYmd(v[4]), e=toYmd(v[5], s);
    if(!v[1] || !s || !e || e<s){ bad++; continue; }
    const k=nz(v[1])+'|'+s+'|'+e;
    const mn=parseInt(v[3].normalize('NFKC'),10)||0;
    if(!map.has(k)) map.set(k,{id:uid(), t:v[1], min:mn, s, e, roles:{}});
    const it=map.get(k); if(!it.min && mn) it.min=mn;
    if(v[0]){ if(!roles.includes(v[0])) roles.push(v[0]); it.roles[v[0]]=(v[2].normalize('NFKC').toUpperCase().match(/P[1-3]/)||[''])[0]; }
  }
  if(!map.size) throw 'empty';
  ldb.items=[...map.values()]; ldb.roles=roles;
  return {n:map.size, roles:roles.length, bad};
}

function mergePlan(src){

/* ---------- 連絡（時間帯ごとにリーダーへ送る文章） ---------- */
const RKEY = KEY==='jukou.v1' ? 'jukou.remind.v1' : KEY+'.remind';
function rload(){ try{ const d=JSON.parse(localStorage.getItem(RKEY)||'null'); if(d && Array.isArray(d.ps)) return {d:d.d||'', at:d.at||0, ps:d.ps.filter(p=>p&&typeof p.n==='string'&&p.n.trim()).map(p=>({n:p.n.trim(), t:/^\d{2}:\d{2}$/.test(p.t||'')?p.t:'', l:/^\d{2}:\d{2}$/.test(p.l||'')?p.l:''})), cp:(d.cp&&typeof d.cp==='object')?d.cp:{}, from:typeof d.from==='string'?d.from:'', rm:(d.rm&&typeof d.rm==='object')?d.rm:null}; }catch(e){} return {d:'', at:0, ps:[], cp:{}, from:'', rm:null}; }
let rdb = rload();
let rmBusy=false; /* 作っている間は2回目を受けない（途中の再描画でボタンが押せる状態に戻っても） */
function rsave(){ rdb.at=Date.now(); try{ localStorage.setItem(RKEY, JSON.stringify(rdb)); return true; }catch(e){ toast('保存できませんでした（端末の空きが足りません）'); return false; } }
function mergeRemind(r){ if(!r || !Array.isArray(r.ps) || (r.at||0) <= (rdb.at||0)) return 0;
  const keep=rdb, raw=localStorage.getItem(RKEY);
  try{ localStorage.setItem(RKEY, JSON.stringify(r)); rdb=rload(); rdb.from = keep.from || rdb.from;
    if(keep.d===rdb.d) for(const [t,c] of Object.entries(keep.cp||{})){ if(!rdb.cp[t] || (c.at||0)>(rdb.cp[t].at||0)) rdb.cp[t]=c; }
    localStorage.setItem(RKEY, JSON.stringify(rdb)); return 1;
  }catch(e){ rdb=keep; try{ if(raw!=null) localStorage.setItem(RKEY, raw); }catch(_){} return 0; } }
const LSC = 'Learningを登録';
/* k: 't'＝出勤（リーダーへ催促）／'l'＝Learning（リーダーへ見回り） */
function rSlots(k='t'){ const m=new Map(); rdb.ps.forEach(p=>{ const t=p[k]; if(!t) return; if(!m.has(t)) m.set(t,[]); m.get(t).push(p.n); }); return [...m.entries()].sort((a,b)=>a[0]<b[0]?-1:1); }
const rSig = (names,k='t') => k==='l' ? 'L\n'+names.join('\n') : rdb.from+'\n'+names.join('\n');
const rKey = (t,k) => k==='l' ? 'L'+t : t;
/* リマインダーへ渡す行：yyyy/MM/dd HH:mm｜名前（Learning の時刻が入っている人だけ・時刻順） */
const nowHM = () => { const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };
function rRemLines(){ const d=todayStr().replace(/-/g,'/'), now=nowHM(); rRemLines.past=0;
  return rdb.ps.filter(p=>p.l).filter(p=>{ if(p.l<=now){ rRemLines.past++; return false; } return true; }).slice().sort((a,b)=>a.l<b.l?-1:a.l>b.l?1:0).map(p=>d+' '+p.l+'｜'+p.n.replace(/[｜\r\n]/g,' ')); }
const rStale = () => !!rdb.d && rdb.d!==todayStr();
const rToday = c => !!c && ymd(new Date(c.at||0))===todayStr();
function rNames(t){

let tkDay=todayStr(); const tkRe=()=>{ if(!document.hidden && view==='task' && !$('#tkSheet').open && !$('#tkPp').open && !tkDrag){ tkDay=todayStr(); renderTask(); } };
document.addEventListener('visibilitychange', tkRe); setInterval(()=>{ if(todayStr()!==tkDay) tkRe(); }, 60000);
let view='task';
function route(){
  const was=view;
  view = location.hash==='#people' ? 'people' : location.hash==='#plan' ? 'plan' : location.hash==='#remind' ? 'remind' : location.hash==='#store' ? 'store' : 'task';
  $('#vStore').hidden = view!=='store'; $('#vPeople').hidden = view!=='people'; $('#vPlan').hidden = view!=='plan'; $('#vRemind').hidden = view!=='remind'; $('#vTask').hidden = view!=='task';
  const first=!route.n++; if(first || was!==view) use('見る:'+view);
  ['Store','People','Plan','Remind','Task'].forEach(k=>$('#tab'+k).removeAttribute('aria-current'));
  if(view==='store'){ $('#tabStore').setAttribute('aria-current','page'); renderChips(); renderChart(); }
  else if(view==='people'){ $('#tabPeople').setAttribute('aria-current','page'); renderPeople(); }
  else if(view==='remind'){ $('#tabRemind').setAttribute('aria-current','page'); renderRemind(); }
  else if(view==='task'){ $('#tabTask').setAttribute('aria-current','page'); renderTask(); }
  else { $('#tabPlan').setAttribute('aria-current','page'); renderPlan(); }
}
route.n=0;
$('#tabTask').addEventListener('click', e=>{ e.preventDefault(); history.replaceState(null,'',location.pathname+location.search); route(); });
window.addEventListener('hashchange', route);

/* ---------- 知らせ ---------- */
let tt; function toast(t){ const el=$('#toast'); const dl=[...document.querySelectorAll('dialog[open]')].pop(); const home=dl||document.body; if(el.parentNode!==home) home.appendChild(el); el.textContent=t; el.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('on'),2200); }

function renderAll(){ renderChips(); renderChart(); renderTable(); }
renderAll();
fillForm(todayStr());
route();
})();
</script>
<!-- tsumiki-back-button -->
<style>
  #tsumikiEdge{position:fixed; top:0; bottom:0; left:0; width:22px; z-index:999;}
  #tsumikiPeek{
    position:fixed; top:50%; left:0; z-index:1001; margin-top:-23px;
    width:46px; height:46px; display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.92);
    -webkit-backdrop-filter:saturate(180%) blur(14px); backdrop-filter:saturate(180%) blur(14px);
    border:1px solid rgba(0,0,0,.06); border-radius:50%;
    box-shadow:0 6px 20px rgba(0,0,0,.18);
    color:#0071e3; font-size:24px; font-weight:600; line-height:1;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Helvetica Neue",Arial,sans-serif;
    transform:translateX(-70px) scale(.8); opacity:0; pointer-events:none;
  }
</style>
<div id="tsumikiEdge"></div>
<div id="tsumikiPeek">‹</div>
<script>
  (function(){
    var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
      || window.navigator.standalone === true;
    var fromTsumiki = false;
    try{
      if(document.referrer){
        var r = new URL(document.referrer);
        fromTsumiki = (r.origin === location.origin);
      }
    }catch(e){}
    if(!(standalone && fromTsumiki)) return;

    var peek = document.getElementById('tsumikiPeek');
    var edge = document.getElementById('tsumikiEdge');

    function goBack(){ location.href = 'index.html'; }

    /* --- 左端エッジスワイプで戻る（iOS純正の戻る操作。見えるボタンは置かない） --- */
    var sx=0, sy=0, prog=0, dragging=false, W=window.innerWidth;
    var TRIGGER = Math.min(120, W*0.32);
    window.addEventListener('resize', function(){ W=window.innerWidth; TRIGGER=Math.min(120, W*0.32); });

    function reset(){
      dragging = false; prog = 0;
      peek.style.transition = 'transform .25s ease, opacity .25s ease';
      peek.style.transform = 'translateX(-70px) scale(.8)';
      peek.style.opacity = 0;
    }
    function start(e){
      var t = e.touches ? e.touches[0] : e;
      if(t.clientX > 26) return;
      sx = t.clientX; sy = t.clientY; prog = 0; dragging = true;
      peek.style.transition = 'none';
    }
    function move(e){
      if(!dragging) return;
      var t = e.touches ? e.touches[0] : e;
      var dx = t.clientX - sx, dy = t.clientY - sy;
      if(Math.abs(dy) > Math.abs(dx) + 12){ reset(); return; }
      if(dx < 0) dx = 0;
      prog = Math.min(dx / TRIGGER, 1);
      peek.style.transform = 'translateX(' + (-70 + prog*82) + 'px) scale(' + (0.8 + prog*0.2) + ')';
      peek.style.opacity = prog;
      if(dx > 6 && e.cancelable) e.preventDefault();
    }
    function end(){
      if(!dragging) return;
      dragging = false;
      if(prog >= 0.999){
        peek.style.transition = 'transform .25s ease, opacity .25s ease';
        peek.style.transform = 'translateX(20px) scale(1.05)';
        peek.style.opacity = 1;
        goBack();
      }else{
        reset();
      }
    }
    edge.addEventListener('touchstart', start, {passive:true});
    window.addEventListener('touchmove', move, {passive:false});
    window.addEventListener('touchend', end, {passive:true});
    window.addEventListener('touchcancel', end, {passive:true});
  })();
</script>
<!-- /tsumiki-back-button -->
