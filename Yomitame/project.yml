name: Yomitame
options:
  bundleIdPrefix: com.tsumiki
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: Z5GQV8PMK7
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

# 楽天の資格情報は Secrets.xcconfig（.gitignore 済み）から流し込む。
configFiles:
  Debug: Secrets.xcconfig
  Release: Secrets.xcconfig

targets:
  Yomitame:
    type: application
    platform: iOS
    sources:
      - path: Yomitame
      - path: Shared
    dependencies:
      - target: Monitor
      - target: ShieldConfig
      - target: ShieldAction
    entitlements:
      path: Yomitame/Resources/Yomitame.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.tsumiki.yomitame
    info:
      path: Yomitame/Resources/Info.plist
      properties:
        CFBundleDisplayName: よみため
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: 本のバーコードを読み取って本棚に登録するためにカメラを使います。
        RakutenAppID: $(RAKUTEN_APP_ID)
        RakutenAccessKey: $(RAKUTEN_ACCESS_KEY)
        RakutenOrigin: $(RAKUTEN_ORIGIN)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tsumiki.yomitame
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent

  # 解放時間が切れたら再ロックする係。Apple 側の不発に備え、アプリ復帰時にも検算する。
  Monitor:
    type: app-extension
    platform: iOS
    sources:
      - path: Monitor
      - path: Shared
    entitlements:
      path: Monitor/Monitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.tsumiki.yomitame
    info:
      path: Monitor/Info.plist
      properties:
        CFBundleDisplayName: Monitor
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MonitorExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tsumiki.yomitame.monitor

  # ロック画面の見た目。表示できるのはアイコン・見出し・本文・ボタン2つだけ（Apple 固定）。
  ShieldConfig:
    type: app-extension
    platform: iOS
    sources:
      - path: ShieldConfig
      - path: Shared
    entitlements:
      path: ShieldConfig/ShieldConfig.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.tsumiki.yomitame
    info:
      path: ShieldConfig/Info.plist
      properties:
        CFBundleDisplayName: ShieldConfig
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tsumiki.yomitame.shieldconfig

  # ロック画面のボタンが押されたときの処理。ここでも期限を検算して二重に守る。
  ShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - path: ShieldAction
      - path: Shared
    entitlements:
      path: ShieldAction/ShieldAction.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.tsumiki.yomitame
    info:
      path: ShieldAction/Info.plist
      properties:
        CFBundleDisplayName: ShieldAction
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tsumiki.yomitame.shieldaction
