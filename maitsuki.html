<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F4F2EE">
<link rel="apple-touch-icon" href="icons/icon-maitsuki.png">
<meta name="apple-mobile-web-app-title" content="まいつき">
<title>まいつき</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F4F2EE; --surface:#ECE9E3; --ink:#242321; --muted:#77736B;
    --hair:#D8D4CC; --ghost:#BEB9B0; --control:#F8F7F4;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    font-family:'Zen Maru Gothic',-apple-system,BlinkMacSystemFont,"Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
    background:var(--paper); color:var(--ink);
    min-height:100vh; min-height:100dvh;
    padding:max(18px,env(safe-area-inset-top)) 20px calc(40px + env(safe-area-inset-bottom));
    max-width:520px; margin:0 auto;
    -webkit-font-smoothing:antialiased;
  }

  /* header */
  header{display:flex; align-items:center; justify-content:center; gap:9px; padding:6px 0 2px; position:relative; min-height:30px;}
  .logo{width:13px; height:13px; border-radius:50%; background:var(--ink);}
  .logo.hide{display:none;}
  .back{position:absolute; left:-6px; top:50%; transform:translateY(-50%);
    appearance:none; border:none; background:none; font-family:inherit;
    font-size:28px; line-height:1; color:var(--ink); cursor:pointer; padding:2px 12px; display:none;}
  .back.show{display:block;}
  .brand{max-width:60%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .brand{font-size:15px; font-weight:700; letter-spacing:.16em;}
  .sync{position:absolute; right:0; top:50%; transform:translateY(-50%);
    display:inline-flex; align-items:center; gap:5px; font-size:10.5px; color:var(--muted);}
  .sync .dot{width:6px; height:6px; border-radius:50%; background:var(--ghost); flex:none; transition:.3s;}
  .sync.ok .dot{background:#7E9A8C;} .sync.off .dot{background:#C17A52;}

  /* hero / donut */
  .hero{display:flex; flex-direction:column; align-items:center; margin:18px 0 6px;}
  .chartwrap{position:relative; width:240px; height:240px;}
  svg.donut{width:100%; height:100%; transform:rotate(-90deg);}
  svg.donut circle{fill:none; stroke-linecap:round;
    transition:stroke-dasharray .6s cubic-bezier(.4,0,.1,1), stroke-dashoffset .6s cubic-bezier(.4,0,.1,1), stroke .3s;}
  .center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;}
  .kicker{font-size:11px; letter-spacing:.22em; color:var(--muted);}
  .total{font-size:34px; font-weight:700; letter-spacing:.01em; line-height:1; display:flex; align-items:baseline; gap:1px;}
  .total .yen{font-size:18px; font-weight:500; color:var(--muted);}
  .total.empty{color:var(--ghost);}

  /* month/year toggle */
  .toggle{display:inline-flex; background:var(--surface); border:1px solid var(--hair);
    border-radius:999px; padding:3px; margin-top:14px; gap:2px;}
  .toggle button{appearance:none; border:none; background:none; font-family:inherit;
    font-size:12.5px; color:var(--muted); padding:6px 18px; border-radius:999px; cursor:pointer; letter-spacing:.1em; transition:.2s;}
  .toggle button.on{background:var(--paper); color:var(--ink); font-weight:700; box-shadow:0 1px 3px rgba(36,35,33,.08);}

  /* list */
  .list{margin-top:24px; display:flex; flex-direction:column;}
  .row{display:flex; align-items:center; gap:10px; padding:13px 4px; border-bottom:1px solid var(--hair); position:relative;}
  .row:first-child{border-top:1px solid var(--hair);}
  .swatch{width:11px; height:11px; border-radius:50%; flex:none; transition:background .3s;}
  /* 長押しドラッグで並べ替え：つかんだ行は浮き上がって指/カーソルに追従 */
  .row.dragging{background:var(--paper); box-shadow:0 8px 22px rgba(0,0,0,.16); border-radius:12px;
    border-bottom-color:transparent; z-index:10; transition:none;}
  body.reordering{cursor:grabbing; -webkit-user-select:none; user-select:none;}
  body.reordering .name, body.reordering .amt{pointer-events:none;}  /* ドラッグ中は入力にフォーカスさせない */
  .name{flex:1; min-width:0; appearance:none; border:none; background:none; font-family:inherit;
    font-size:16px; color:var(--ink); padding:2px 0; letter-spacing:.02em;}
  .name::placeholder{color:var(--ghost);}
  .amt{appearance:none; border:none; background:none; font-family:inherit; text-align:right;
    font-size:16px; font-weight:500; color:var(--ink); width:88px; padding:2px 0;}
  .amt::placeholder{color:var(--ghost); font-weight:400;}
  .amt-text{text-align:right; font-size:16px; font-weight:500; color:var(--ink); width:88px; padding:2px 0; font-variant-numeric:tabular-nums;}
  .pct{font-size:11px; color:var(--muted); width:30px; text-align:right; flex:none; font-variant-numeric:tabular-nums;}
  .chev{appearance:none; border:none; background:none; color:var(--ghost); font-size:22px; line-height:1;
    width:18px; height:30px; flex:none; cursor:pointer; padding:0; transition:.2s; text-align:right;}
  .chev.has{color:var(--muted);}
  .chev:active{color:var(--ink); transform:translateX(2px);}
  /* 編集中(focus)＝iPhone、ホバー(hover)＝MacBookマウス、どちらでも × を右端へ出し
     その分 › を左へ寄せて重なりを防ぐ。hoverを入れることでマウスでも消えず確実に押せる */
  .row:focus-within .chev, .row:hover .chev{margin-right:32px;}
  .del{appearance:none; border:none; position:absolute; right:-2px; top:50%; transform:translateY(-50%);
    color:var(--ghost); font-size:18px; line-height:1; width:30px; height:34px; cursor:pointer;
    opacity:0; pointer-events:none; transition:opacity .2s; border-radius:50%; padding:0; background:var(--paper);}
  .row:focus-within .del, .row:hover .del{opacity:1; pointer-events:auto;}
  .del:active{color:var(--ink);}
  input:focus{outline:none;}

  /* add */
  .add{display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
    margin-top:18px; padding:14px; border:1px dashed var(--ghost); border-radius:16px;
    background:none; font-family:inherit; font-size:14px; color:var(--muted); cursor:pointer;
    letter-spacing:.08em; transition:.2s;}
  .add:active{background:var(--surface);}
  .add .plus{font-size:17px; line-height:1;}

  /* empty hint */
  .hint{text-align:center; color:var(--ghost); font-size:12.5px; letter-spacing:.1em; margin-top:22px;}
  .hint.hide{display:none;}

  /* save tools + records */
  .tools{display:none; gap:10px; margin-top:14px;}
  .tools.show{display:flex;}
  .tool{flex:1; appearance:none; font-family:inherit; cursor:pointer; padding:12px; border-radius:14px;
    font-size:13.5px; letter-spacing:.1em; background:var(--ink); color:var(--paper); border:1px solid var(--ink);
    transition:.2s;}
  .tool:active{opacity:.82;}
  .tool.ghost{background:none; color:var(--muted); border:1px solid var(--hair);}
  .tool.ghost:active{background:var(--surface); color:var(--ink); opacity:1;}

  .saved{display:none; margin-top:32px;}
  .saved.show{display:block;}
  .saved-h{font-size:11px; letter-spacing:.2em; color:var(--muted); margin:0 4px 4px; display:flex; align-items:center; gap:8px;}
  .saved-h b{font-weight:400; color:var(--ghost);}
  .rec{padding:14px 4px; border-bottom:1px solid var(--hair);}
  .rec:first-of-type{border-top:1px solid var(--hair);}
  .rec .top{display:flex; align-items:baseline; gap:12px;}
  .rec .rname{flex:1; min-width:0; font-size:15px; color:var(--ink); letter-spacing:.02em;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .rec .rtotal{flex:none; font-size:15px; font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums;}
  .rec .bot{display:flex; align-items:center; justify-content:space-between; margin-top:9px;}
  .rec .rdate{font-size:11px; color:var(--ghost); letter-spacing:.04em;}
  .rec .acts{display:flex; align-items:center; gap:8px;}
  .rec .rback{appearance:none; border:1px solid var(--hair); background:none; font-family:inherit;
    font-size:12px; color:var(--muted); padding:6px 13px; border-radius:10px; cursor:pointer; letter-spacing:.06em; transition:.2s;}
  .rec .rback:active{background:var(--surface); color:var(--ink);}
  .rec .rdel{appearance:none; border:none; background:none; color:var(--ghost); font-size:17px; line-height:1;
    cursor:pointer; width:24px; height:24px; padding:0;}
  .rec .rdel:active{color:var(--ink);}

  /* toast */
  .toast{position:fixed; left:50%; bottom:calc(26px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(16px);
    background:rgba(36,35,33,.94); color:var(--paper); font-size:13px; padding:10px 18px; border-radius:12px;
    opacity:0; pointer-events:none; transition:.25s; z-index:99; letter-spacing:.04em;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
  <header>
    <button class="back" id="back" type="button" aria-label="戻る">‹</button>
    <span class="logo" id="logo"></span>
    <span class="brand" id="brand">まいつき</span>
    <span class="sync" id="sync"><span class="dot"></span><span id="syncText"></span></span>
  </header>

  <div class="hero">
    <div class="chartwrap">
      <svg class="donut" viewBox="0 0 120 120" id="donut" aria-hidden="true">
        <circle cx="60" cy="60" r="50" stroke="var(--hair)" stroke-width="13"></circle>
        <g id="segs"></g>
      </svg>
      <div class="center">
        <span class="kicker" id="kicker">毎月</span>
        <span class="total empty" id="total"><span class="yen">¥</span><span id="totalNum">0</span></span>
      </div>
    </div>
    <div class="toggle" id="toggle">
      <button data-v="month" class="on">月</button>
      <button data-v="year">年</button>
    </div>
  </div>

  <div class="list" id="list"></div>
  <button class="add" id="add"><span class="plus">＋</span>こうもくを ついか</button>
  <div class="hint" id="hint">毎月かかるお金を ひとつずつ</div>

  <div class="tools" id="tools">
    <button class="tool" id="saveBtn" type="button">保存</button>
    <button class="tool ghost" id="newBtn" type="button">あたらしく</button>
  </div>
  <div class="saved" id="saved"></div>

  <div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";

/* ===== palette (earth) ===== */
var COLORS = ['#C17A52','#A9A06B','#7E9A8C','#C9A36A','#9E6B57','#9A8FA0','#B5806F','#6F8377'];
function colorAt(i){ return COLORS[i % COLORS.length]; }

/* ===== state ===== */
var KEY = "fixed-cost-v1";
var state = load();
var path = [];                       // ドリルダウンの現在地（idの配列）

function load(){
  try{ var s = JSON.parse(localStorage.getItem(KEY)); if(s && s.items){ normalize(s.items); return s; } }catch(e){}
  return { items:[ mk() ], view:"month" };
}
function normalize(items){ items.forEach(function(it){ if(!it.children) it.children = []; normalize(it.children); }); }
function mk(){ return { id: id(), name:"", amount:0, children:[] }; }
function id(){ return "i" + Math.floor(performance.now()*1000).toString(36) + Math.floor(performance.now()).toString(36); }
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
  if(window.FixedSync) FixedSync.schedule();
}

/* ===== format ===== */
function fmt(n){ return (n||0).toLocaleString("ja-JP"); }
function digits(s){ return String(s).replace(/[^0-9]/g,""); }

/* ===== tree helpers =====
   方針：各項目の「金額」は固定の枠。子（内訳）はその枠の中身を説明するだけで、
   親の金額は子の合計で上書きしない（＝データが消えない）。 */
function nodeAt(p){
  var arr = state.items, node = null;
  for(var i=0;i<p.length;i++){
    node = null;
    for(var j=0;j<arr.length;j++){ if(arr[j].id === p[i]){ node = arr[j]; break; } }
    if(!node) return null;
    arr = node.children;
  }
  return node;
}
function listAt(){
  if(!path.length) return state.items;
  var n = nodeAt(path); return n ? n.children : state.items;
}
function sumAmt(arr){ return arr.reduce(function(s,it){ return s + (it.amount||0); }, 0); }
function frameTotal(){                 // 円の分母（枠）
  if(!path.length) return sumAmt(state.items);
  var n = nodeAt(path); var amt = n ? (n.amount||0) : 0;
  return Math.max(amt, sumAmt(listAt()));
}
function centerVal(){                   // 中央に出す金額
  if(!path.length) return sumAmt(state.items);
  var n = nodeAt(path); return n ? (n.amount||0) : 0;
}
function remainder(){                   // のこり（枠 − 内訳合計）。マイナスは使いすぎ
  if(!path.length) return 0;
  var n = nodeAt(path); return (n ? (n.amount||0) : 0) - sumAmt(listAt());
}

/* ===== render ===== */
var C = 2*Math.PI*50;

function renderHeader(){
  document.getElementById("back").classList.toggle("show", path.length > 0);
  document.getElementById("logo").classList.toggle("hide", path.length > 0);
  var brand = document.getElementById("brand");
  if(path.length){ var n = nodeAt(path); brand.textContent = (n && n.name) ? n.name : "うちわけ"; }
  else brand.textContent = "まいつき";
}

function renderChart(){
  var items = listAt();
  var denom = frameTotal();
  var segs = document.getElementById("segs");
  segs.innerHTML = "";
  var acc = 0;
  items.forEach(function(it,i){
    var v = it.amount||0; if(!v) return;
    var len = (denom>0 ? v/denom : 0) * C;
    var gap = Math.min(2.2, len*0.4);
    var draw = Math.max(0.5, len - gap);
    var c = document.createElementNS("http://www.w3.org/2000/svg","circle");
    c.setAttribute("cx","60"); c.setAttribute("cy","60"); c.setAttribute("r","50");
    c.setAttribute("stroke", colorAt(i));
    c.setAttribute("stroke-width","13");
    c.setAttribute("fill","none");
    c.setAttribute("stroke-linecap", draw < 3 ? "butt" : "round");
    c.setAttribute("stroke-dasharray", draw + " " + (C - draw));
    c.setAttribute("stroke-dashoffset", String(-acc));
    segs.appendChild(c);
    acc += len;
  });
  // のこり（枠の未使用ぶん）は背景の薄いリングがそのまま見える＝描画不要
  var mult = state.view === "year" ? 12 : 1;
  var shown = centerVal() * mult;
  document.getElementById("totalNum").textContent = fmt(shown);
  document.getElementById("total").classList.toggle("empty", shown === 0);
  document.getElementById("kicker").textContent = state.view === "year" ? "1年で" : "毎月";
}

function restRow(over, val, denom){
  var row = document.createElement("div"); row.className = "row rest"; row.id = "restRow";
  var sw = document.createElement("span"); sw.className = "swatch";
  sw.style.background = over ? "#C17A52" : "var(--hair)";
  var name = document.createElement("span"); name.className = "name rest-t"; name.textContent = over ? "つかいすぎ" : "のこり";
  var amt = document.createElement("span"); amt.className = "amt-text rest-t"; amt.textContent = fmt(Math.abs(val));
  var pct = document.createElement("span"); pct.className = "pct"; pct.textContent = denom>0 ? Math.round(Math.abs(val)/denom*100)+"%" : "";
  var sp = document.createElement("span"); sp.className = "chev"; sp.style.visibility = "hidden"; sp.textContent = "›";
  row.append(sw, name, amt, pct, sp);
  return row;
}

/* ===== 長押しドラッグで並べ替え（iPhone PWA・MacBookマウス両対応） =====
   ・行を約260ms長押し（iOSのテキスト拡大鏡=約500msより早く発火）→ ふわっと浮いてドラッグ開始
   ・指/カーソルに追従し、中点を越えた行と入れ替え。離した位置で確定＆保存
   ・短いタップは従来どおり編集にフォーカス。ボタン(› ×)やスクロールは邪魔しない */
var DnD = (function(){
  var LONG = 260, CANCEL = 8;
  var mode = 0;          // 0:なし 1:長押し待ち 2:ドラッグ中
  var row = null, timer = null, sx = 0, sy = 0;

  function clear(){ if(timer){ clearTimeout(timer); timer = null; } }
  function reset(){ clear(); if(row) row.style.transform = ""; if(row) row.classList.remove("dragging"); document.body.classList.remove("reordering"); mode = 0; row = null; }
  function enter(){
    mode = 2; timer = null;
    if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
    row.classList.add("dragging");
    document.body.classList.add("reordering");
  }
  function start(r, x, y, target){
    if(mode !== 0) return;
    if(target && target.closest && target.closest("button")) return;   // › × は通常動作
    row = r; sx = x; sy = y; mode = 1; clear();
    timer = setTimeout(enter, LONG);
  }
  function move(x, y){
    if(mode === 1){ if(Math.abs(x-sx) > CANCEL || Math.abs(y-sy) > CANCEL){ reset(); } return false; }
    if(mode !== 2 || !row) return false;
    var list = document.getElementById("list");
    var sibs = Array.prototype.slice.call(list.querySelectorAll(".row[data-id]")).filter(function(z){ return z !== row; });
    var ref = null;
    for(var i=0;i<sibs.length;i++){ var rc = sibs[i].getBoundingClientRect(); if(y < rc.top + rc.height/2){ ref = sibs[i]; break; } }
    if(ref){ list.insertBefore(row, ref); }
    else { var rest = list.querySelector(".row.rest"); if(rest) list.insertBefore(row, rest); else list.appendChild(row); }
    // つかんだ行を指/カーソルの位置へ追従（中央を合わせる）
    row.style.transform = "translateY(0px)";
    var rc2 = row.getBoundingClientRect();
    row.style.transform = "translateY(" + (y - (rc2.top + rc2.height/2)) + "px)";
    return true;
  }
  function end(){
    var wasDrag = (mode === 2);
    reset();
    if(wasDrag){ commitReorder(); swallowNextClick(); }
  }
  function swallowNextClick(){
    var fn = function(e){ e.preventDefault(); e.stopPropagation(); document.removeEventListener("click", fn, true); };
    document.addEventListener("click", fn, true);
    setTimeout(function(){ document.removeEventListener("click", fn, true); }, 400);
  }
  return { start:start, move:move, end:end, dragging:function(){ return mode === 2; } };
})();

/* 行ごとの開始フック（renderListから各行に付与） */
function attachDrag(row){
  row.addEventListener("mousedown", function(e){ if(e.button !== 0) return; DnD.start(row, e.clientX, e.clientY, e.target); });
  row.addEventListener("touchstart", function(e){
    if(e.touches.length !== 1){ DnD.end(); return; }
    var t = e.touches[0]; DnD.start(row, t.clientX, t.clientY, e.target);
  }, {passive:true});
}

/* ドラッグ中の移動/終了はドキュメント全体で拾う（行外へ出ても追従。1度だけ登録） */
if(!window.__dndGlobals){
  window.__dndGlobals = true;
  document.addEventListener("mousemove", function(e){ DnD.move(e.clientX, e.clientY); });
  document.addEventListener("mouseup", function(){ DnD.end(); });
  document.addEventListener("touchmove", function(e){
    var t = e.touches[0]; if(!t) return;
    if(DnD.dragging()) e.preventDefault();        // ドラッグ中だけスクロールを止める
    DnD.move(t.clientX, t.clientY);
  }, {passive:false});
  document.addEventListener("touchend", function(){ DnD.end(); }, {passive:true});
  document.addEventListener("touchcancel", function(){ DnD.end(); }, {passive:true});
}

function commitReorder(){
  var list = document.getElementById("list");
  var ids = Array.prototype.map.call(list.querySelectorAll(".row[data-id]"), function(r){ return r.dataset.id; });
  var arr = listAt();
  arr.sort(function(a,b){ return ids.indexOf(a.id) - ids.indexOf(b.id); });
  save(); renderChart(); renderList();   // 色は並び順で決まるので作り直して反映
}

function renderList(){
  var list = document.getElementById("list");
  var items = listAt();
  var denom = frameTotal();
  list.innerHTML = "";
  items.forEach(function(it,i){
    var v = it.amount||0;
    var hasKids = !!(it.children && it.children.length);
    var row = document.createElement("div"); row.className = "row"; row.dataset.id = it.id;

    var sw = document.createElement("span"); sw.className = "swatch";
    sw.style.background = v ? colorAt(i) : "var(--ghost)";

    attachDrag(row);

    var name = document.createElement("input");
    name.className = "name"; name.type = "text"; name.placeholder = "こうもく";
    name.value = it.name; name.maxLength = 18;
    name.addEventListener("input", function(){ it.name = name.value; if(path.length) renderHeader(); save(); });

    var amtEl = document.createElement("input");
    amtEl.className = "amt"; amtEl.type = "text"; amtEl.inputMode = "numeric"; amtEl.placeholder = "0";
    amtEl.value = it.amount ? fmt(it.amount) : "";
    amtEl.addEventListener("input", function(){
      var d = digits(amtEl.value);
      it.amount = d ? parseInt(d,10) : 0;
      amtEl.value = d ? fmt(it.amount) : "";
      sw.style.background = it.amount ? colorAt(i) : "var(--ghost)";
      refreshAux(); save();
    });

    var pct = document.createElement("span"); pct.className = "pct";
    pct.textContent = (denom>0 && v) ? Math.round(v/denom*100) + "%" : "";

    var chev = document.createElement("button");
    chev.className = "chev" + (hasKids ? " has" : ""); chev.type = "button"; chev.textContent = "›";
    chev.setAttribute("aria-label","ひらく");
    chev.addEventListener("click", function(){ drill(it.id); });

    var del = document.createElement("button");
    del.className = "del"; del.type = "button"; del.textContent = "×";
    del.setAttribute("aria-label","削除");
    del.addEventListener("click", function(){ remove(it.id); });

    row.append(sw, name, amtEl, pct, chev, del);
    list.appendChild(row);
  });

  if(path.length){
    var rem = remainder();
    if(rem > 0) list.appendChild(restRow(false, rem, denom));
    else if(rem < 0) list.appendChild(restRow(true, rem, denom));
  }

  var hint = document.getElementById("hint");
  hint.textContent = path.length ? "ここに うちわけを ついか" : "毎月かかるお金を ひとつずつ";
  var hide = path.length ? (items.length > 0) : (items.length > 1 || sumAmt(state.items) > 0);
  hint.classList.toggle("hide", hide);
}

/* 金額編集中に、フォーカスを保ったまま円・％・のこり行だけ更新 */
function refreshAux(){
  renderChart();
  var denom = frameTotal();
  var items = listAt();
  var rows = document.getElementById("list").querySelectorAll(".row:not(.rest)");
  items.forEach(function(it,i){
    var pctEl = rows[i] && rows[i].querySelector(".pct");
    if(pctEl) pctEl.textContent = (denom>0 && it.amount) ? Math.round(it.amount/denom*100)+"%" : "";
  });
  var old = document.getElementById("restRow"); if(old) old.remove();
  if(path.length){
    var rem = remainder();
    if(rem > 0) document.getElementById("list").appendChild(restRow(false, rem, denom));
    else if(rem < 0) document.getElementById("list").appendChild(restRow(true, rem, denom));
  }
}
function renderAll(){ renderHeader(); renderChart(); renderList(); buildSaved(); window.scrollTo(0,0); }

function toast(msg){
  var t = document.getElementById("toast"); if(!t) return;
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._t); t._t = setTimeout(function(){ t.classList.remove("show"); }, 1800);
}

/* ===== actions ===== */
function add(){
  listAt().push(mk());
  save(); renderChart(); renderList();
  var rows = document.getElementById("list").children;
  var last = rows[rows.length-1]; if(last) last.querySelector(".name").focus();
}
function remove(itemId){
  var arr = listAt();
  for(var i=arr.length-1;i>=0;i--){ if(arr[i].id === itemId) arr.splice(i,1); }
  if(!path.length && state.items.length === 0) state.items.push(mk());
  save(); renderAll();
}
function drill(itemId){ path.push(itemId); renderAll(); }
function back(){ path.pop(); renderAll(); }

/* ===== 保存した記録（きろく） ===== */
var SAVED_KEY = "fixed-saved-v1";
var savedList = [];
function loadSaved(){
  try{ var r = localStorage.getItem(SAVED_KEY); var a = r ? JSON.parse(r) : []; if(Array.isArray(a)) savedList = a; }catch(e){}
}
function persistSaved(){
  try{ localStorage.setItem(SAVED_KEY, JSON.stringify(savedList)); }catch(e){}
  if(window.FixedSync) FixedSync.schedule();
}
function shortDate(ts){ var d = new Date(ts); return (d.getMonth()+1) + "/" + d.getDate(); }

function saveCurrent(){
  var tot = sumAmt(state.items);
  if(tot <= 0){ alert("ほぞんする固定費がありません"); return; }
  var d = new Date(); var def = (d.getMonth()+1) + "/" + d.getDate();
  var name = prompt("名前をつけて ほぞん", def);
  if(name === null) return;
  name = (name||"").trim() || def;
  savedList.unshift({
    id: id(), name: name, savedAt: Date.now(),
    items: JSON.parse(JSON.stringify(state.items)), total: tot
  });
  persistSaved(); buildSaved(); toast("ほぞんしました");
}
function restoreRec(rec){
  if(!confirm("「" + (rec.name||"きろく") + "」に もどしますか？\n（いまの内容は うわがきされます）")) return;
  var items = Array.isArray(rec.items) ? JSON.parse(JSON.stringify(rec.items)) : [];
  normalize(items);
  state.items = items.length ? items : [ mk() ];
  path = [];
  save(); renderAll();
}
function deleteRec(recId){
  var rec = savedList.find(function(r){ return r.id === recId; });
  if(rec && !confirm("「" + (rec.name||"きろく") + "」を けしますか？")) return;
  savedList = savedList.filter(function(r){ return r.id !== recId; });
  persistSaved(); buildSaved();
}
function clearAll(){
  if(sumAmt(state.items) <= 0) return;
  if(!confirm("ぜんぶ消して あたらしく作りますか？\n（ほぞんした きろくは のこります）")) return;
  state.items = [ mk() ]; path = [];
  save(); renderAll();
}
function buildSaved(){
  var toolsEl = document.getElementById("tools");
  var savedEl = document.getElementById("saved");
  var atRoot = !path.length;
  toolsEl.classList.toggle("show", atRoot && sumAmt(state.items) > 0);
  savedEl.classList.toggle("show", atRoot && savedList.length > 0);
  savedEl.innerHTML = "";
  if(!(atRoot && savedList.length)) return;
  var h = document.createElement("div"); h.className = "saved-h";
  h.innerHTML = "きろく <b>" + savedList.length + "</b>";
  savedEl.appendChild(h);
  savedList.forEach(function(rec){
    var div = document.createElement("div"); div.className = "rec";
    div.innerHTML =
      '<div class="top"><span class="rname"></span><span class="rtotal">¥' + fmt(rec.total||0) + '</span></div>' +
      '<div class="bot"><span class="rdate">' + shortDate(rec.savedAt) + '</span>' +
        '<span class="acts"><button class="rback" type="button">もどす</button>' +
        '<button class="rdel" type="button" aria-label="けす">×</button></span></div>';
    div.querySelector(".rname").textContent = rec.name || "（むめい）";
    div.querySelector(".rback").addEventListener("click", function(){ restoreRec(rec); });
    div.querySelector(".rdel").addEventListener("click", function(){ deleteRec(rec.id); });
    savedEl.appendChild(div);
  });
}

document.getElementById("add").addEventListener("click", add);
document.getElementById("back").addEventListener("click", back);
document.getElementById("saveBtn").addEventListener("click", saveCurrent);
document.getElementById("newBtn").addEventListener("click", clearAll);
document.getElementById("toggle").addEventListener("click", function(e){
  var b = e.target.closest("button"); if(!b) return;
  state.view = b.dataset.v;
  Array.prototype.forEach.call(this.children, function(x){ x.classList.toggle("on", x === b); });
  save(); renderChart();
});

loadSaved();
renderAll();

/* ===== cloud sync (money_state を別IDで再利用) ===== */
(function(){
  var SUPABASE_URL = "https://okbjqtdirrathscctyvx.supabase.co";
  var SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9rYmpxdGRpcnJhdGhzY2N0eXZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzMjI4NTIsImV4cCI6MjA5NTg5ODg1Mn0.T-1AOK6vCD6uGdqrVGXjPui3L6WPSNrnygS-IHyfZ6Y";
  var sb = (window.supabase && window.supabase.createClient)
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON) : null;

  var META = "fixed-sync-meta-v1", TABLE = "money_state", ID = "kodai-fixed";
  var KEYS = [KEY, SAVED_KEY];           // 固定費本体＋ほぞんした記録
  var online = null, pending = false, timer = null, lastPushed = "";

  function meta(){ try{ return JSON.parse(localStorage.getItem(META)) || {}; }catch(e){ return {}; } }
  function setMeta(m){ try{ localStorage.setItem(META, JSON.stringify(m)); }catch(e){} }
  function hasLocal(){ return !!localStorage.getItem(KEY); }
  function blob(){
    var b = { updatedAt: meta().updatedAt || 0 };
    KEYS.forEach(function(k){
      var raw = localStorage.getItem(k);
      if(raw){ try{ b[k] = JSON.parse(raw); }catch(e){} }
    });
    return b;
  }
  function schedule(){
    setMeta({ updatedAt: Date.now() });
    if(!sb){ chip(); return; }
    pending = true; clearTimeout(timer); timer = setTimeout(flush, 400);
  }
  function flush(){
    if(!sb || !pending) return;
    clearTimeout(timer); pending = false;
    var b = blob(); b.updatedAt = meta().updatedAt || Date.now();
    lastPushed = JSON.stringify(b);
    sb.from(TABLE).upsert({ id: ID, state: b, updated_at: new Date().toISOString() })
      .then(function(r){ if(r && r.error){ online=false; pending=true; } else online=true; chip(); })
      .catch(function(){ online=false; pending=true; chip(); });
  }
  function applyRemote(inc, msg){
    KEYS.forEach(function(k){
      if(inc[k] != null){ try{ localStorage.setItem(k, JSON.stringify(inc[k])); }catch(e){} }
    });
    setMeta({ updatedAt: inc.updatedAt || Date.now() });
    if(msg){ toast(msg); setTimeout(function(){ location.reload(); }, 900); }
    else location.reload();
  }
  function editing(){
    var a = document.activeElement;
    return !!(a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA"));
  }
  function init(){
    if(!sb){ online=false; chip(); return; }
    sb.from(TABLE).select("state").eq("id", ID).maybeSingle()
      .then(function(res){
        if(res && res.error){ online=false; chip(); return; }
        online = true;
        var row = res && res.data, localT = meta().updatedAt || 0;
        if(row && row.state && typeof row.state === "object"){
          var remoteT = row.state.updatedAt || 0;
          if(remoteT > localT){
            if(!localT && hasLocal()){
              var useRemote = confirm("クラウドに保存ずみの固定費が見つかりました。\n\nOK：クラウドのデータをこの端末に反映\nキャンセル：この端末のデータをクラウドへ送る");
              if(!useRemote){ touch(); subscribe(); chip(); return; }
            }
            applyRemote(row.state, null); return;
          }
          if(localT > remoteT){ pending=true; flush(); }
        } else if(hasLocal()){
          if(!localT) setMeta({ updatedAt: Date.now() });
          pending=true; flush();
        }
        subscribe(); chip();
      })
      .catch(function(){ online=false; chip(); });
  }
  function touch(){ setMeta({ updatedAt: Date.now() }); pending=true; flush(); }
  function subscribe(){
    sb.channel("fixed-rt")
      .on("postgres_changes", { event:"*", schema:"public", table:TABLE, filter:"id=eq."+ID }, function(p){
        var inc = p.new && p.new.state; if(!inc) return;
        if(JSON.stringify(inc) === lastPushed) return;
        if((inc.updatedAt || 0) <= (meta().updatedAt || 0)) return;
        if(editing()) return;
        applyRemote(inc);
      }).subscribe();
  }
  function chip(){
    var el = document.getElementById("sync"), txt = document.getElementById("syncText");
    if(!el) return;
    el.classList.remove("ok","off");
    if(!sb){ txt.textContent = "この端末"; return; }
    if(online === true){ el.classList.add("ok"); txt.textContent = "同期"; }
    else if(online === false){ el.classList.add("off"); txt.textContent = "オフライン"; }
    else txt.textContent = "接続中";
  }
  function toast(msg){
    var t = document.getElementById("toast"); if(!t) return;
    t.textContent = msg; t.classList.add("show");
    clearTimeout(t._t); t._t = setTimeout(function(){ t.classList.remove("show"); }, 1800);
  }
  document.addEventListener("visibilitychange", function(){ if(document.visibilityState === "hidden") flush(); });
  window.addEventListener("pagehide", flush);
  window.FixedSync = { schedule: schedule };
  init();
})();
</script>
<!-- tsumiki-back-button -->
<style>
  #tsumikiEdge{position:fixed; top:0; bottom:0; left:0; width:22px; z-index:999;}
  #tsumikiPeek{
    position:fixed; top:50%; left:0; z-index:1001; margin-top:-23px;
    width:46px; height:46px; display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.92);
    -webkit-backdrop-filter:saturate(180%) blur(14px); backdrop-filter:saturate(180%) blur(14px);
    border:1px solid rgba(0,0,0,.06); border-radius:50%;
    box-shadow:0 6px 20px rgba(0,0,0,.18);
    color:#0071e3; font-size:24px; font-weight:600; line-height:1;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Helvetica Neue",Arial,sans-serif;
    transform:translateX(-70px) scale(.8); opacity:0; pointer-events:none;
  }
</style>
<div id="tsumikiEdge"></div>
<div id="tsumikiPeek">‹</div>
<script>
  (function(){
    var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
      || window.navigator.standalone === true;
    var fromTsumiki = false;
    try{
      if(document.referrer){
        var r = new URL(document.referrer);
        fromTsumiki = (r.origin === location.origin);
      }
    }catch(e){}
    if(!(standalone && fromTsumiki)) return;

    var peek = document.getElementById('tsumikiPeek');
    var edge = document.getElementById('tsumikiEdge');

    function goBack(){ location.href = 'index.html'; }

    /* --- 左端エッジスワイプで戻る（iOS純正の戻る操作。見えるボタンは置かない） --- */
    var sx=0, sy=0, prog=0, dragging=false, W=window.innerWidth;
    var TRIGGER = Math.min(120, W*0.32);
    window.addEventListener('resize', function(){ W=window.innerWidth; TRIGGER=Math.min(120, W*0.32); });

    function reset(){
      dragging = false; prog = 0;
      peek.style.transition = 'transform .25s ease, opacity .25s ease';
      peek.style.transform = 'translateX(-70px) scale(.8)';
      peek.style.opacity = 0;
    }
    function start(e){
      var t = e.touches ? e.touches[0] : e;
      if(t.clientX > 26) return;
      sx = t.clientX; sy = t.clientY; prog = 0; dragging = true;
      peek.style.transition = 'none';
    }
    function move(e){
      if(!dragging) return;
      var t = e.touches ? e.touches[0] : e;
      var dx = t.clientX - sx, dy = t.clientY - sy;
      if(Math.abs(dy) > Math.abs(dx) + 12){ reset(); return; }
      if(dx < 0) dx = 0;
      prog = Math.min(dx / TRIGGER, 1);
      peek.style.transform = 'translateX(' + (-70 + prog*82) + 'px) scale(' + (0.8 + prog*0.2) + ')';
      peek.style.opacity = prog;
      if(dx > 6 && e.cancelable) e.preventDefault();
    }
    function end(){
      if(!dragging) return;
      dragging = false;
      if(prog >= 0.999){
        peek.style.transition = 'transform .25s ease, opacity .25s ease';
        peek.style.transform = 'translateX(20px) scale(1.05)';
        peek.style.opacity = 1;
        goBack();
      }else{
        reset();
      }
    }
    edge.addEventListener('touchstart', start, {passive:true});
    window.addEventListener('touchmove', move, {passive:false});
    window.addEventListener('touchend', end, {passive:true});
    window.addEventListener('touchcancel', end, {passive:true});
  })();
</script>
<!-- /tsumiki-back-button -->
</body>
