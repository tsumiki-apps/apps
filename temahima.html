<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="apple-touch-icon" href="icons/icon-temahima.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="てまひま">
<meta name="theme-color" content="#f5f4f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131109" media="(prefers-color-scheme: dark)">
<title>てまひま</title>
<style>
  :root{
    --paper:#f5f4f0; --surface:#fffefb; --surface-2:#efece5; --ink:#1d1a15;
    --ink-mid:#5b554a; --ink-soft:#8f8877; --line:#e2ded4; --line-2:#d8d3c7;
    --accent:#b06f26; --accent-2:#8a5a24; --accent-wash:#f0e4d1;
    --good:#4c7a51; --good-wash:#dde9dd; --warn:#b0522a; --warn-wash:#f2e0d4;
    --cell-empty:#e6e1d6;
    --shadow:0 1px 2px rgba(40,32,18,.05), 0 10px 26px -16px rgba(40,32,18,.18);
    --serif:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Songti SC",serif;
    --sans:"Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,Meiryo,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#131109; --surface:#1d1a12; --surface-2:#26221a; --ink:#efe8da;
      --ink-mid:#a89e8b; --ink-soft:#7d7566; --line:#2f2b21; --line-2:#3a352a;
      --accent:#d59a4d; --accent-2:#e0ab63; --accent-wash:#362a19;
      --good:#7fae82; --good-wash:#23301f; --warn:#d9825a; --warn-wash:#39251a;
      --cell-empty:#2c281e;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 30px -18px rgba(0,0,0,.65);
    }
  }
  :root[data-theme="light"]{
    --paper:#f5f4f0; --surface:#fffefb; --surface-2:#efece5; --ink:#1d1a15;
    --ink-mid:#5b554a; --ink-soft:#8f8877; --line:#e2ded4; --line-2:#d8d3c7;
    --accent:#b06f26; --accent-2:#8a5a24; --accent-wash:#f0e4d1;
    --good:#4c7a51; --good-wash:#dde9dd; --warn:#b0522a; --warn-wash:#f2e0d4;
    --cell-empty:#e6e1d6;
    --shadow:0 1px 2px rgba(40,32,18,.05), 0 10px 26px -16px rgba(40,32,18,.18);
  }
  :root[data-theme="dark"]{
    --paper:#131109; --surface:#1d1a12; --surface-2:#26221a; --ink:#efe8da;
    --ink-mid:#a89e8b; --ink-soft:#7d7566; --line:#2f2b21; --line-2:#3a352a;
    --accent:#d59a4d; --accent-2:#e0ab63; --accent-wash:#362a19;
    --good:#7fae82; --good-wash:#23301f; --warn:#d9825a; --warn-wash:#39251a;
    --cell-empty:#2c281e;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 30px -18px rgba(0,0,0,.65);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink); font-family:var(--sans);
    line-height:1.6; -webkit-font-smoothing:antialiased; font-feature-settings:"palt" 1; -webkit-text-size-adjust:100%;
  }
  .tnum{font-variant-numeric:tabular-nums;}

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--paper) 88%, transparent);
    backdrop-filter:saturate(1.3) blur(10px); -webkit-backdrop-filter:saturate(1.3) blur(10px);
    border-bottom:1px solid var(--line); padding:calc(env(safe-area-inset-top) + 12px) 0 12px;
  }
  .topbar .inner{max-width:560px; margin:0 auto; padding:0 16px; display:flex; align-items:center; gap:10px;}
  .brand{display:flex; align-items:center; gap:10px; min-width:0;}
  .brand .mark{  /* つみき公式ロゴ（アイソメの積み木3つ）＝index.html と同一座標 */
    width:22px; height:22px; flex:none; display:block; border-radius:5px;
    box-shadow:0 2px 7px rgba(36,35,33,.18);
  }
  .brand h1{font-family:var(--serif); font-weight:600; font-size:1.1rem; margin:0; letter-spacing:.02em; white-space:nowrap;}
  .spacer{flex:1;}
  .iconbtn{
    width:34px; height:34px; flex:none; border:1px solid var(--line); background:var(--surface);
    border-radius:9px; color:var(--ink-mid); display:grid; place-items:center; cursor:pointer;
    text-decoration:none; padding:0;
  }
  .iconbtn:active{transform:scale(.94);}
  .backbtn{
    display:none; align-items:center; gap:3px; flex:none; border:1px solid var(--line); background:var(--surface);
    border-radius:9px; height:34px; padding:0 11px 0 8px; color:var(--ink-mid); cursor:pointer;
    font-family:var(--sans); font-size:.88rem; font-weight:700;
  }
  .backbtn:active{transform:scale(.96);}
  body.detail .backbtn{display:flex;}
  .sync-dot{width:8px; height:8px; border-radius:50%; background:var(--ink-soft); flex:none;}
  .sync-dot.ok{background:var(--good);} .sync-dot.off{background:var(--accent);}

  /* ---------- layout ---------- */
  main{max-width:560px; margin:0 auto; padding:16px 16px calc(env(safe-area-inset-bottom) + 46px); display:grid; gap:15px; min-width:0;}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow); padding:18px 19px;}
  /* text-transform:uppercase は付けない。「計 6.5h」が「6.5H」に化けるため */
  .label{font-size:.74rem; font-weight:700; letter-spacing:.06em; color:var(--ink-mid);}
  .page{display:none; gap:15px; min-width:0;}
  .page.active{display:grid;}

  .tabs{
    display:grid; grid-template-columns:1fr 1fr; gap:4px; background:var(--surface-2);
    border:1px solid var(--line); border-radius:13px; padding:5px;
  }
  .tabs button{
    border:none; background:transparent; color:var(--ink-mid); font-family:var(--sans);
    font-size:.95rem; font-weight:700; padding:10px 6px; border-radius:9px; cursor:pointer;
  }
  .tabs button.active{background:var(--surface); color:var(--ink); box-shadow:var(--shadow);}

  /* ---------- 案件カード（リスト） ---------- */
  .job{
    display:block; width:100%; text-align:left; font-family:var(--sans); color:var(--ink);
    background:var(--surface); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow);
    padding:16px 17px; cursor:pointer; -webkit-user-select:none; user-select:none;
  }
  .job:active{transform:scale(.995);}
  .job.over{border-color:var(--warn);}
  .job-head{display:flex; align-items:center; gap:8px; min-width:0;}
  .job-head .nm{flex:1; min-width:0; font-weight:700; font-size:1rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .tag{
    flex:none; font-size:.68rem; font-weight:700; letter-spacing:.03em; color:var(--ink-soft);
    border:1px solid var(--line-2); border-radius:99px; padding:2px 8px; white-space:nowrap;
  }
  .tag.route{color:var(--accent-2); border-color:var(--accent); background:var(--accent-wash);}

  .rate{display:flex; align-items:baseline; gap:7px; margin:12px 0 2px; flex-wrap:wrap;}
  .rate .big{font-family:var(--serif); font-weight:600; font-size:2.5rem; line-height:1; letter-spacing:.01em;}
  .rate .unit{font-size:.9rem; color:var(--ink-mid); font-weight:700;}
  .rate.none .big{color:var(--ink-soft); font-size:1.9rem;}
  .rate-sub{font-size:.78rem; color:var(--ink-soft); margin-bottom:12px;}

  .bar{display:block; height:9px; background:var(--cell-empty); border-radius:99px; overflow:hidden;}
  .bar i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--good),#3f6a44); border-radius:99px; transition:width .35s ease;}
  .bar.near i{background:linear-gradient(90deg,var(--accent),var(--accent-2));}
  .bar.over i{background:linear-gradient(90deg,#c4482a,#8e2f1f);}
  .bar-foot{display:flex; align-items:baseline; gap:10px; margin-top:8px; font-size:.8rem; color:var(--ink-mid);}
  .bar-foot .rest{margin-left:auto; font-weight:700; white-space:nowrap;}
  .bar-foot .rest.over{color:var(--warn);}
  .bar-foot .rest.near{color:var(--accent-2);}

  .empty{display:grid; gap:10px; justify-items:center; text-align:center; padding:10px 0 4px;}
  .empty .em{font-size:2rem;}
  .empty p{margin:0; color:var(--ink-mid); font-size:.94rem;}
  .empty .hint{font-size:.8rem; color:var(--ink-soft);}

  /* ---------- ボタン ---------- */
  .btnrow{display:flex; gap:10px; width:100%;}
  .btn{
    flex:1; border-radius:12px; padding:14px; font-size:1rem; font-weight:700; font-family:var(--sans);
    cursor:pointer; border:1.5px solid var(--line); background:var(--surface); color:var(--ink-mid);
  }
  .btn.primary{background:linear-gradient(155deg,var(--accent),var(--accent-2)); color:#fff; border-color:transparent;}
  .btn.ghost{background:var(--surface); color:var(--ink-mid);}
  .btn.danger{background:var(--surface); color:var(--warn); border-color:var(--warn);}
  .btn.sm{padding:10px 14px; font-size:.9rem; border-radius:10px;}
  .btn:active{transform:scale(.98);}
  .btn[disabled]{opacity:.4; pointer-events:none;}
  .edit-link{border:none; background:transparent; color:var(--ink-soft); font-size:.82rem; cursor:pointer; text-decoration:underline; text-underline-offset:3px; font-family:var(--sans); padding:2px 4px;}
  .card-foot{display:flex; justify-content:center; gap:14px; margin-top:13px;}

  /* ---------- フォーム ---------- */
  .editor label{display:block; font-size:.76rem; font-weight:700; color:var(--ink-mid); margin:0 0 6px;}
  .ed-field{margin-bottom:14px;}
  .editor input[type=text], .editor input[type=number], .editor input[type=date], .editor select{
    width:100%; border:1.5px solid var(--line); background:var(--surface-2); border-radius:11px;
    padding:11px 13px; font-size:16px; color:var(--ink); font-family:var(--sans); line-height:1.5;
    -webkit-appearance:none; appearance:none;
  }
  .editor select{
    background-image:linear-gradient(45deg,transparent 50%,var(--ink-soft) 50%),linear-gradient(135deg,var(--ink-soft) 50%,transparent 50%);
    background-position:calc(100% - 18px) calc(50% + 1px),calc(100% - 13px) calc(50% + 1px);
    background-size:5px 5px,5px 5px; background-repeat:no-repeat; padding-right:36px;
  }
  .editor input:focus, .editor select:focus{outline:2px solid var(--accent-wash); border-color:var(--accent);}
  .ed-actions{display:flex; gap:10px; margin-top:16px;}
  .two{display:flex; gap:10px;} .two > *{flex:1; min-width:0;}
  .seg2{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .seg2 button{
    border:1.5px solid var(--line); background:var(--surface-2); border-radius:11px; padding:12px 6px;
    font-family:var(--sans); font-size:.92rem; font-weight:700; color:var(--ink-mid); cursor:pointer;
  }
  .seg2 button.on{background:var(--accent-wash); border-color:var(--accent); color:var(--accent-2);}
  .hint-line{font-size:.76rem; color:var(--ink-soft); margin:-8px 0 14px;}

  /* ---------- 時間の ＋/− ---------- */
  .hrow{display:flex; align-items:center; gap:10px;}
  /* 375px で「+0.5」が2行に折れないよう、全角記号は使わず幅を確保する */
  .hbtn{
    width:66px; height:52px; flex:none; border:1.5px solid var(--line); background:var(--surface-2);
    border-radius:13px; color:var(--ink-mid); font-family:var(--sans); font-size:1.02rem; font-weight:700;
    cursor:pointer; display:grid; place-items:center; padding:0; white-space:nowrap; letter-spacing:0;
  }
  .hbtn:active{transform:scale(.94);}
  .hbtn[disabled]{opacity:.35; pointer-events:none;}
  .hval{
    flex:1; min-width:0; height:52px; border:1.5px solid var(--line); background:var(--surface-2);
    border-radius:13px; display:flex; align-items:baseline; justify-content:center; gap:4px;
  }
  .hval input{
    width:3em; border:none; background:transparent; text-align:right; padding:0;
    font-family:var(--serif); font-weight:600; font-size:1.6rem; color:var(--ink); line-height:1;
    -webkit-appearance:none; appearance:none; -moz-appearance:textfield;
  }
  .hval input::-webkit-outer-spin-button, .hval input::-webkit-inner-spin-button{-webkit-appearance:none; margin:0;}
  .hval input:focus{outline:none;}
  .hval .u{font-size:.9rem; color:var(--ink-mid); font-weight:700;}

  /* ---------- タイマー ---------- */
  .timer{display:flex; align-items:center; gap:12px;}
  .timer .el{flex:1; min-width:0; font-family:var(--serif); font-weight:600; font-size:1.55rem; line-height:1.1;}
  .timer .el small{display:block; font-family:var(--sans); font-size:.74rem; font-weight:400; color:var(--ink-soft); letter-spacing:0;}
  .timer .btn{flex:none; max-width:150px;}
  .timer.idle .el{color:var(--ink-soft); font-size:1.05rem; font-family:var(--sans); font-weight:700;}

  /* ---------- ログ履歴 ---------- */
  .logs{display:grid; gap:8px; margin-top:12px;}
  .log{
    display:flex; align-items:flex-start; gap:10px; background:var(--surface-2); border:1px solid var(--line);
    border-radius:12px; padding:10px 11px;
  }
  .log .d{flex:none; width:52px; font-size:.8rem; color:var(--ink-soft); font-weight:700; padding-top:2px;}
  .log .h{flex:none; width:52px; font-family:var(--serif); font-weight:600; font-size:1rem; text-align:right; padding-top:1px;}
  .log .m{flex:1; min-width:0; font-size:.86rem; color:var(--ink-mid); word-break:break-word; padding-top:2px;}
  .log .m.none{color:var(--ink-soft);}
  .log .rm{flex:none; border:none; background:transparent; color:var(--ink-soft); font-size:1.15rem; line-height:1; cursor:pointer; padding:2px 2px 2px 6px;}
  .log-empty{color:var(--ink-soft); font-size:.88rem; margin-top:10px;}

  /* ---------- 完了案件の表 ---------- */
  .tblwrap{overflow-x:auto; -webkit-overflow-scrolling:touch; margin-top:12px;}
  table.done-tbl{width:100%; min-width:296px; border-collapse:collapse; font-variant-numeric:tabular-nums;}
  table.done-tbl th{
    font-size:.68rem; font-weight:700; color:var(--ink-soft); letter-spacing:.04em; text-align:right;
    padding:0 0 7px 8px; border-bottom:1px solid var(--line-2); white-space:nowrap;
  }
  table.done-tbl th:first-child{text-align:left; padding-left:0;}
  table.done-tbl td{
    font-size:.82rem; text-align:right; padding:9px 0 9px 8px; border-bottom:1px solid var(--line); white-space:nowrap;
  }
  table.done-tbl td:first-child{
    text-align:left; padding-left:0; white-space:normal; word-break:break-word; font-weight:700; min-width:80px;
  }
  table.done-tbl td .pl{display:block; font-size:.7rem; font-weight:400; color:var(--ink-soft);}
  table.done-tbl td.rate-c{font-family:var(--serif); font-weight:600; font-size:.95rem;}
  table.done-tbl tr.over td.act-c{color:var(--warn); font-weight:700;}
  table.done-tbl tfoot td{border-bottom:none; border-top:1.5px solid var(--line-2); font-weight:700; padding-top:11px;}
  table.done-tbl tfoot td:first-child{color:var(--ink-mid);}
  .tbl-note{font-size:.76rem; color:var(--ink-soft); margin-top:11px; line-height:1.55;}

  /* ---------- 詳細ヘッダ ---------- */
  .dt-head{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:2px;}
  /* 案件名は1行ぜんぶ使い、チップ（経路・プラン）は次の行へ回す */
  .dt-head .nm{font-family:var(--serif); font-weight:600; font-size:1.25rem; line-height:1.35; word-break:break-word; flex:1 1 100%;}
  .dt-money{display:flex; gap:16px; flex-wrap:wrap; font-size:.8rem; color:var(--ink-mid); margin-top:10px;}
  .dt-money b{font-family:var(--serif); font-size:.98rem; color:var(--ink); font-weight:600; margin:0 3px;}

  /* ---------- toast ---------- */
  #toast{
    position:fixed; left:16px; right:16px; margin:0 auto; width:max-content; max-width:calc(100vw - 32px);
    bottom:calc(env(safe-area-inset-bottom) + 22px); transform:translateY(20px);
    background:var(--ink); color:var(--paper); padding:11px 17px; border-radius:12px; font-size:.9rem;
    display:flex; align-items:center; gap:12px; opacity:0; pointer-events:none; transition:.25s; z-index:40;
    box-shadow:0 10px 34px -8px rgba(0,0,0,.45);
  }
  #toast.show{opacity:1; transform:translateY(0);}
  #toast.act{pointer-events:auto;}
  #toast .t-act{
    flex:none; border:1px solid color-mix(in srgb, var(--paper) 55%, transparent); background:transparent;
    color:var(--paper); font-family:var(--sans); font-size:.84rem; font-weight:700; cursor:pointer;
    padding:5px 12px; border-radius:9px; white-space:nowrap;
  }
  #toast .t-act:active{transform:scale(.96);}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }

  /* ---------- 広い画面 ---------- */
  @media (min-width:900px){
    main{max-width:820px; padding-top:22px;}
    .topbar .inner{max-width:820px;}
    #pageActive .joblist{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:15px;}
  }
</style>
</head>
<body>
  <header class="topbar">
    <div class="inner">
      <button class="backbtn" id="backBtn" type="button">‹ 案件</button>
      <div class="brand"><svg class="mark" viewBox="0 0 100 100" aria-label="つみき"><rect width="100" height="100" rx="24" fill="#242321"/><g fill="#242321" stroke="#F4F2EE" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"><polygon points="35,46 50,53.5 35,61 20,53.5"/><polygon points="20,53.5 35,61 35,76 20,68.5"/><polygon points="50,53.5 35,61 35,76 50,68.5"/><polygon points="65,46 80,53.5 65,61 50,53.5"/><polygon points="50,53.5 65,61 65,76 50,68.5"/><polygon points="80,53.5 65,61 65,76 80,68.5"/><polygon points="50,24 65,31.5 50,39 35,31.5"/><polygon points="35,31.5 50,39 50,54 35,46.5"/><polygon points="65,31.5 50,39 50,54 65,46.5"/></g></svg><h1 id="appTitle">てまひま</h1></div>
      <span class="spacer"></span>
      <span class="sync-dot" id="syncDot" title="同期状態"></span>
      <button class="iconbtn" id="themeBtn" type="button" aria-label="表示切替">
        <svg viewBox="0 0 24 24" style="width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round"><path d="M19 13.5A7 7 0 1 1 10.5 5a5.5 5.5 0 0 0 8.5 8.5z"/></svg>
      </button>
    </div>
  </header>

  <main>
    <!-- ===== 画面① 案件リスト ===== -->
    <section class="page active" id="pageList">
      <div class="tabs">
        <button type="button" id="tabActive" class="active">進行中</button>
        <button type="button" id="tabDone">完了</button>
      </div>
      <div id="pageActive"></div>
      <div id="pageDoneList" style="display:none"></div>
    </section>

    <!-- ===== 画面② 案件詳細 ===== -->
    <section class="page" id="pageDetail"></section>
  </main>

  <div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ===================== Supabase（つみき共通プロジェクト） ===================== */
const SUPABASE_URL  = 'https://okbjqtdirrathscctyvx.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9rYmpxdGRpcnJhdGhzY2N0eXZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzMjI4NTIsImV4cCI6MjA5NTg5ODg1Mn0.T-1AOK6vCD6uGdqrVGXjPui3L6WPSNrnygS-IHyfZ6Y';
const sb = (window.supabase && window.supabase.createClient) ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON) : null;
const STATE_TABLE = 'temahima_state';
const STATE_ID = 'kodai';
const KEY = 'tsumiki_temahima_v1';
const THEME_KEY = 'tsumiki_temahima_theme';
const TIMER_KEY = 'tsumiki_temahima_timer';   /* タイマーは端末ローカル。同期しない */

/* ===================== プラン（Decisions/2026-08-08-hourly-rate.md が正本） =====================
   金額と上限時間は「初期値」。案件ごとに詳細画面で編集できる。 */
const PLANS = [
  { key:'p1basic',    label:'①ベーシック',    short:'①ベ',  amount: 30000, capH:  8 },
  { key:'p1standard', label:'①スタンダード',  short:'①スタ', amount: 60000, capH: 14 },
  { key:'p1premium',  label:'①プレミアム',    short:'①プレ', amount:100000, capH: 22 },
  { key:'p2basic',    label:'②ベーシック',    short:'②ベ',  amount:162000, capH: 35 },
  { key:'p4basic',    label:'④ベーシック',    short:'④ベ',  amount:250000, capH: 60 },
  { key:'custom',     label:'カスタム',        short:'—',    amount:     0, capH:  0 },
];
function planOf(k){ return PLANS.find(p=>p.key===k) || PLANS[PLANS.length-1]; }

/* 手取り率。ランサーズは手数料16.5%が税込額にかかるので 0.9185（直請けは 1.0） */
const ROUTES = {
  lancers:{ label:'ランサーズ', net:0.9185 },
  direct :{ label:'直請け',     net:1      },
};

/* ===================== ユーティリティ ===================== */
function uid(){ return Date.now().toString(36) + Math.floor(Math.random()*1e6).toString(36); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function nowISO(){ return new Date().toISOString(); }
function iso(d){ const z=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate()); }
function todayISO(){ return iso(new Date()); }
function isDate(s){ return typeof s==='string' && /^\d{4}-\d{2}-\d{2}$/.test(s); }
function fmtMD(s){ if(!isDate(s)) return '—'; const [,m,d]=s.split('-'); return (+m)+'/'+(+d); }
function yen(n){ return Math.round(n||0).toLocaleString('ja-JP'); }
/* 6.5 → "6.5" / 8 → "8" / 0.25 → "0.25"（末尾の0を出さない） */
function fmtH(h){ const n=Math.round((h||0)*100)/100; return String(n); }

function toast(msg, act){
  const t=document.getElementById('toast');
  clearTimeout(t._t); t.innerHTML='';
  const s=document.createElement('span'); s.textContent=msg; t.appendChild(s);
  t.classList.toggle('act', !!act);
  if(act){
    const b=document.createElement('button');
    b.type='button'; b.className='t-act'; b.textContent=act.label;
    b.addEventListener('click', ()=>{ clearTimeout(t._t); t.classList.remove('show','act'); act.fn(); });
    t.appendChild(b);
  }
  t.classList.add('show');
  t._t=setTimeout(()=>t.classList.remove('show','act'), act?6000:1700);
}

/* ===================== 計算（純粋関数。ここだけでテストできる） ===================== */
/* 手取り＝金額（税抜） × 経路の手取り率 */
function netOf(job){ const r=ROUTES[job&&job.route]||ROUTES.direct; return (job&&+job.amount||0) * r.net; }
/* いまの時給＝手取り ÷ 累計実働。実働0なら null（まだ出せない） */
function rateOf(net, hours){ return hours>0 ? net/hours : null; }
/* タイマーの実測を 0.25h 単位に丸める（最低 0.25h） */
function roundQuarter(h){ return Math.max(0.25, Math.round((h||0)/0.25)*0.25); }
/* 0.5h 単位に丸める（＋/−ボタン用） */
function roundHalf(h){ return Math.max(0, Math.round((h||0)/0.5)*0.5); }
/* 上限に対する使用率。上限0（カスタム未設定）は null */
function usageOf(hours, capH){ return capH>0 ? hours/capH : null; }
/* 残量バーの状態: ok（〜80%未満）/ near（80%〜100%）/ over（100%超） */
function zoneOf(pct){ if(pct==null) return 'ok'; if(pct>1) return 'over'; if(pct>=0.8) return 'near'; return 'ok'; }

/* ===================== データ ===================== */
/* jobs: {id,name,route,plan,capH,amount,status,createdAt,doneAt,updatedAt}
   logs: {id,jobId,date,hours,memo,createdAt,updatedAt}
   delJobs / delLogs: id → 削除時刻（tombstone＝削除マーカー）。
   丸ごと全置換の同期はデータ消失を起こすので、採用は必ず id単位の和集合マージ＋tombstone。
   → Knowledge/supabase-sync-whole-doc-data-loss.md */
function blank(){ return { jobs:[], logs:[], delJobs:{}, delLogs:{} }; }
let db = blank();
let online = null, lastPushed = '', pushing = false, saveTimer = null;

const TOMB_KEEP_MS = 400*24*3600*1000;   /* 古すぎる削除マーカーは捨てる（際限なく増やさない） */

function normJob(j){
  const o = {};
  o.id = String(j.id||uid());
  o.name = String(j.name||'').slice(0,80);
  o.route = ROUTES[j.route] ? j.route : 'lancers';
  o.plan = PLANS.some(p=>p.key===j.plan) ? j.plan : 'custom';
  o.capH = Math.max(0, Math.round((+j.capH||0)*2)/2);
  o.amount = Math.max(0, Math.round(+j.amount||0));
  o.status = j.status==='done' ? 'done' : 'active';
  o.createdAt = typeof j.createdAt==='string' ? j.createdAt : nowISO();
  o.doneAt = typeof j.doneAt==='string' ? j.doneAt : '';
  o.updatedAt = typeof j.updatedAt==='string' ? j.updatedAt : o.createdAt;
  return o;
}
function normLog(l){
  const o = {};
  o.id = String(l.id||uid());
  o.jobId = String(l.jobId||'');
  o.date = isDate(l.date) ? l.date : todayISO();
  o.hours = Math.max(0, Math.round((+l.hours||0)*4)/4);
  o.memo = String(l.memo||'').slice(0,200);
  o.createdAt = typeof l.createdAt==='string' ? l.createdAt : nowISO();
  o.updatedAt = typeof l.updatedAt==='string' ? l.updatedAt : o.createdAt;
  return o;
}
function normTomb(t){
  const o={}, cut = Date.now() - TOMB_KEEP_MS;
  Object.keys(t||{}).forEach(k=>{
    const v = t[k];
    if(typeof v!=='string') return;
    const ms = Date.parse(v);
    if(!Number.isFinite(ms) || ms < cut) return;
    o[k]=v;
  });
  return o;
}
function norm(d){
  const o = blank();
  o.jobs = (Array.isArray(d&&d.jobs)?d.jobs:[]).filter(x=>x&&typeof x==='object').map(normJob);
  o.logs = (Array.isArray(d&&d.logs)?d.logs:[]).filter(x=>x&&typeof x==='object').map(normLog);
  o.delJobs = normTomb(d&&d.delJobs);
  o.delLogs = normTomb(d&&d.delLogs);
  return o;
}

/* ---- マージ（id単位の和集合。片方にしか無い行を消さない） ---- */
function mergeById(a, b, tomb){
  const m = new Map();
  (a||[]).forEach(x=>{ if(x&&x.id) m.set(x.id, x); });
  (b||[]).forEach(x=>{
    if(!x||!x.id) return;
    const cur = m.get(x.id);
    if(!cur || String(x.updatedAt||'') > String(cur.updatedAt||'')) m.set(x.id, x);
  });
  /* tombstone より後に更新されたものは「消したあとに直した＝復活」とみなして残す */
  return [...m.values()].filter(x=>{
    const t = tomb[x.id];
    return !(t && String(t) >= String(x.updatedAt||''));
  });
}
function mergeTomb(a, b){
  const t = Object.assign({}, a||{});
  Object.keys(b||{}).forEach(k=>{ if(!t[k] || String(b[k])>String(t[k])) t[k]=b[k]; });
  return t;
}
function mergeState(x, y){
  const dj = mergeTomb(x.delJobs, y.delJobs);
  const dl = mergeTomb(x.delLogs, y.delLogs);
  return {
    jobs: mergeById(x.jobs, y.jobs, dj),
    logs: mergeById(x.logs, y.logs, dl),
    delJobs: dj, delLogs: dl,
  };
}
/* 内容の指紋。ping-pong（同じ内容を送り合う）を防ぐ */
function sig(d){
  const f = a => (a||[]).map(x=>x.id+'@'+(x.updatedAt||'')).sort().join(',');
  const g = o => Object.keys(o||{}).sort().map(k=>k+'@'+o[k]).join(',');
  return f(d.jobs)+'|'+f(d.logs)+'|'+g(d.delJobs)+'|'+g(d.delLogs);
}

/* ===================== 永続化・同期 ===================== */
function loadLocal(){
  try{ const s=localStorage.getItem(KEY); if(s) db = norm(JSON.parse(s)); }catch(e){}
}
function writeLocal(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){} }
function save(){
  writeLocal();
  if(!sb) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(pushRemote, 400);
}
/* 押す前にクラウドを読んでマージしてから上書きする＝相手の行を消さない */
async function pushRemote(){
  if(!sb || pushing) return;
  pushing = true;
  try{
    const { data, error } = await sb.from(STATE_TABLE).select('state').eq('id',STATE_ID).maybeSingle();
    if(error) throw error;
    if(data && data.state && typeof data.state==='object'){
      const merged = mergeState(db, norm(data.state));
      if(sig(merged) !== sig(db)){ db = merged; writeLocal(); renderSoft(); }
    }
    lastPushed = sig(db);
    const r = await sb.from(STATE_TABLE).upsert({ id:STATE_ID, state:db, updated_at:nowISO() });
    if(r.error) throw r.error;
    online = true;
  }catch(e){ online = false; }
  pushing = false;
  renderSync();
}
async function loadRemote(){
  if(!sb){ online=false; renderSync(); return; }
  try{
    const { data, error } = await sb.from(STATE_TABLE).select('state').eq('id',STATE_ID).maybeSingle();
    if(error) throw error;
    online = true;
    const remote = (data && data.state && typeof data.state==='object') ? norm(data.state) : blank();
    const merged = mergeState(db, remote);
    if(sig(merged) !== sig(db)){ db = merged; writeLocal(); renderSoft(); }
    /* こちらにしか無い行があればクラウドへ押し戻す＝どれか1台に残っていれば自己修復 */
    if(sig(merged) !== sig(remote)) save();
  }catch(e){ online = false; }
  renderSync();
}
function subscribeRealtime(){
  if(!sb) return;
  sb.channel('temahima-rt')
    .on('postgres_changes', { event:'*', schema:'public', table:STATE_TABLE, filter:'id=eq.'+STATE_ID }, (p)=>{
      const st = p.new && p.new.state;
      if(!st || typeof st!=='object') return;
      const remote = norm(st);
      if(sig(remote) === lastPushed) return;
      const merged = mergeState(db, remote);
      if(sig(merged) === sig(db)) return;
      db = merged; writeLocal(); renderSoft();
    }).subscribe();
}
function renderSync(){
  const dot=document.getElementById('syncDot');
  dot.classList.remove('ok','off');
  if(!sb){ dot.title='この端末に保存'; return; }
  if(online===true){ dot.classList.add('ok'); dot.title='クラウド同期中'; }
  else if(online===false){ dot.classList.add('off'); dot.title='オフライン'; }
}

/* ===================== 参照 ===================== */
function jobById(id){ return db.jobs.find(j=>j.id===id) || null; }
function logsOf(jobId){
  return db.logs.filter(l=>l.jobId===jobId).sort((a,b)=> a.date===b.date ? String(b.createdAt).localeCompare(String(a.createdAt)) : b.date.localeCompare(a.date));
}
function hoursOf(jobId){ return db.logs.reduce((s,l)=> l.jobId===jobId ? s+l.hours : s, 0); }
function statsOf(job){
  const hours = hoursOf(job.id);
  const net = netOf(job);
  const rate = rateOf(net, hours);
  const pct = usageOf(hours, job.capH);
  return { hours, net, rate, pct, zone: zoneOf(pct), rest: job.capH>0 ? job.capH-hours : null };
}

function fmtClock(ms){
  const s = Math.floor(ms/1000), z=n=>String(n).padStart(2,'0');
  return z(Math.floor(s/3600))+':'+z(Math.floor(s/60)%60)+':'+z(s%60);

function renderSoft(){

  render();
}

  document.body.classList.toggle('detail', view.name==='detail');

/* ---------- 残量バー ---------- */
function barHTML(st){
  const w = st.pct==null ? 0 : Math.min(100, st.pct*100);
  return '<span class="bar '+st.zone+'"><i style="width:'+w.toFixed(1)+'%"></i></span>';
}
function restHTML(job, st){
  if(job.capH<=0) return '<span class="rest">上限 未設定</span>';
  if(st.rest < 0) return '<span class="rest over">'+fmtH(-st.rest)+'h 超過</span>';
  return '<span class="rest '+(st.zone==='near'?'near':'')+'">あと '+fmtH(st.rest)+'h</span>';
}

  h += '<div class="card">'
    + '<div class="label">タイマー（おまけ）</div>'
    + '<div style="height:10px"></div>'
    + '<div class="timer '+(running?'':'idle')+'">'
    +   '<span class="el tnum" id="tElapsed">'+(running ? fmtClock(elapsedMs())+'<small>止めると 0.25h きざみで上の欄に入ります</small>' : (otherTimer?'ほかの案件で計測中':'いまは動いていません'))+'</span>'
    +   (otherTimer ? '' : '<button class="btn '+(running?'danger':'ghost')+' sm" id="tBtn">'+(running?'止める':'計測を始める')+'</button>')
    + '</div>'
    + '</div>';

  /* ログ履歴 */
  h += '<div class="card">'
    + '<div class="label">記録（'+logs.length+'件・計 '+fmtH(st.hours)+'h）</div>';
  if(!logs.length){
    h += '<p class="log-empty">まだ記録がありません。</p>';
  }else{
    h += '<div class="logs">';
    logs.forEach(l=>{
      h += '<div class="log">'
        + '<span class="d tnum">'+fmtMD(l.date)+'</span>'
        + '<span class="h tnum">'+fmtH(l.hours)+'h</span>'
        + '<span class="m'+(l.memo?'':' none')+'">'+esc(l.memo||'—')+'</span>'
        + '<button class="rm" type="button" data-rmlog="'+esc(l.id)+'" aria-label="この記録を消す">×</button>'
        + '</div>';
    });
    h += '</div>';
  }
  h += '</div>';

  /* 完了・削除 */
  h += '<div class="card">'
    + '<div class="btnrow">'
    +   (j.status==='done'
        ? '<button class="btn ghost" id="reopenJob">進行中に戻す</button>'
        : '<button class="btn primary" id="doneJob">この案件を完了にする</button>')
    + '</div>'
    + '<div class="card-foot"><button class="edit-link" id="delJob">この案件を削除する</button></div>'
    + '</div>';

  box.innerHTML = h;
  bindDetail(j);
}

function bindDetail(j){
  const box = document.getElementById('pageDetail');
  const dHours = box.querySelector('#dHours');
  const setH = v => { draft.hours = Math.max(0, Math.round(v*4)/4); dHours.value = fmtH(draft.hours); };

  box.querySelector('#dDate').addEventListener('change', e=>{ draft.date = isDate(e.target.value) ? e.target.value : todayISO(); });
  box.querySelector('#dMemo').addEventListener('input', e=>{ draft.memo = e.target.value; });
  dHours.addEventListener('input', e=>{ const v=+e.target.value; if(Number.isFinite(v)) draft.hours = Math.max(0,v); });
  dHours.addEventListener('blur', ()=> setH(draft.hours));
  box.querySelector('#hMinus').addEventListener('click', ()=> setH(Math.max(0, roundHalf(draft.hours) - 0.5)));
  box.querySelector('#hPlus').addEventListener('click', ()=> setH(roundHalf(draft.hours) + 0.5));

  box.querySelector('#addLog').addEventListener('click', ()=>{
    const hrs = Math.round((+draft.hours||0)*4)/4;
    if(hrs <= 0){ toast('時間が 0 のままです'); return; }
    const t = nowISO();
    db.logs.push(normLog({ id:uid(), jobId:j.id, date:draft.date, hours:hrs, memo:draft.memo, createdAt:t, updatedAt:t }));
    draft = { jobId:j.id, date:todayISO(), hours:0.5, memo:'' };
    save(); render();
    const st = statsOf(jobById(j.id));
    toast(st.rate==null ? '記録しました' : '記録しました。いまの時給 '+yen(st.rate)+'円/h');
  });

  box.querySelectorAll('[data-rmlog]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const id = b.dataset.rmlog;
      const gone = db.logs.find(l=>l.id===id);
      if(!gone) return;
      db.logs = db.logs.filter(l=>l.id!==id);
      db.delLogs[id] = nowISO();
      save(); render();
      toast('記録を消しました', { label:'取り消す', fn:()=>{
        delete db.delLogs[id];
        db.logs.push(Object.assign({}, gone, { updatedAt: nowISO() }));   /* 削除マーカーより新しくして復活させる */
        save(); render();
      }});
    });
  });

  const tBtn = box.querySelector('#tBtn');
  if(tBtn) tBtn.addEventListener('click', ()=>{
    if(timer && timer.jobId===j.id){
      const h = roundQuarter(elapsedMs()/3600000);
      timer = null; persistTimer(); stopTick();
      draft.hours = h; render();
      toast(fmtH(h)+'h を入力欄に入れました（まだ保存していません）');
    }else{
      timer = { jobId:j.id, startedAt:Date.now() };
      persistTimer(); render(); startTick();
    }
  });

  const doneBtn = box.querySelector('#doneJob');
  if(doneBtn) doneBtn.addEventListener('click', ()=>{
    j.status='done'; j.doneAt=todayISO(); j.updatedAt=nowISO();
    if(timer && timer.jobId===j.id){ timer=null; persistTimer(); stopTick(); }
    save();
    listTab='done'; backToList();
    toast('完了にしました');
  });
  const reBtn = box.querySelector('#reopenJob');
  if(reBtn) reBtn.addEventListener('click', ()=>{
    j.status='active'; j.doneAt=''; j.updatedAt=nowISO();
    save(); render(); toast('進行中に戻しました');
  });

  box.querySelector('#editJob').addEventListener('click', ()=>{
    form = { mode:'edit', v:{ id:j.id, name:j.name, route:j.route, plan:j.plan, capH:j.capH, amount:j.amount } };
    render();
  });

  box.querySelector('#delJob').addEventListener('click', ()=>{
    const n = db.logs.filter(l=>l.jobId===j.id).length;
    if(!confirm('「'+(j.name||'（名前なし）')+'」を削除します。記録'+n+'件も一緒に消えます。よろしいですか？')) return;
    const t = nowISO();
    db.delJobs[j.id] = t;
    db.logs.filter(l=>l.jobId===j.id).forEach(l=>{ db.delLogs[l.id] = t; });
    db.jobs = db.jobs.filter(x=>x.id!==j.id);
    db.logs = db.logs.filter(l=>l.jobId!==j.id);
    if(timer && timer.jobId===j.id){ timer=null; persistTimer(); stopTick(); }
    save(); backToList(); toast('削除しました');
  });
}

/* ---------- 案件フォーム（新規／編集で共用） ---------- */
function openNewForm(){
  const p = planOf('p1basic');
  form = { mode:'new', v:{ id:'', name:'', route:'lancers', plan:p.key, capH:p.capH, amount:p.amount } };
  window.scrollTo(0,0);
  render();
}
function jobFormHTML(){
  const v = form.v;
  const opts = PLANS.map(p=>'<option value="'+p.key+'"'+(p.key===v.plan?' selected':'')+'>'+esc(p.label)+(p.key==='custom'?'':'（'+yen(p.amount)+'円 / '+fmtH(p.capH)+'h）')+'</option>').join('');

    + '<div style="height:12px"></div>'
    + '<div class="ed-field"><label for="fName">案件名</label>'

    + '<div class="hint-line">お客様の名前はイニシャルで。ここは公開の置き場にあるので実名は書かない。</div>'
    + '<div class="ed-field"><label>経路</label>'
    +   '<div class="seg2">'
    +     '<button type="button" data-route="lancers" class="'+(v.route==='lancers'?'on':'')+'">ランサーズ</button>'
    +     '<button type="button" data-route="direct" class="'+(v.route==='direct'?'on':'')+'">直請け</button>'
    +   '</div></div>'
    + '<div class="hint-line">手取り＝ランサーズ 金額×0.9185／直請け 金額そのまま。</div>'
    + '<div class="ed-field"><label for="fPlan">プラン</label><select id="fPlan">'+opts+'</select></div>'
    + '<div class="ed-field two">'
    +   '<div><label for="fAmount">金額（税抜・円）</label><input type="number" id="fAmount" inputmode="numeric" step="1000" min="0" value="'+(v.amount||'')+'"></div>'
    +   '<div><label for="fCap">上限時間（h）</label><input type="number" id="fCap" inputmode="decimal" step="0.5" min="0" value="'+(v.capH||'')+'"></div>'
    + '</div>'
    + '<div class="hint-line">プランを選ぶと初期値が入る。案件ごとに変えてよい。</div>'
    + '<div class="ed-actions">'
    +   '<button class="btn ghost" id="fCancel">やめる</button>'
    +   '<button class="btn primary" id="fSave">'+(form.mode==='new'?'追加する':'保存する')+'</button>'
    + '</div>'
    + '</div>';
}
function bindJobForm(box){
  const v = form.v;
  const $ = s => box.querySelector(s);
  $('#fName').addEventListener('input', e=>{ v.name = e.target.value; });
  box.querySelectorAll('[data-route]').forEach(b=>{
    b.addEventListener('click', ()=>{
      v.route = b.dataset.route;
      box.querySelectorAll('[data-route]').forEach(x=>x.classList.toggle('on', x===b));
    });
  });
  $('#fPlan').addEventListener('change', e=>{
    v.plan = e.target.value;
    const p = planOf(v.plan);
    if(p.key!=='custom'){ v.amount = p.amount; v.capH = p.capH; $('#fAmount').value = p.amount; $('#fCap').value = p.capH; }
  });
  $('#fAmount').addEventListener('input', e=>{ v.amount = Math.max(0, +e.target.value||0); });
  $('#fCap').addEventListener('input', e=>{ v.capH = Math.max(0, +e.target.value||0); });

  $('#fCancel').addEventListener('click', ()=>{ form=null; render(); });
  $('#fSave').addEventListener('click', ()=>{
    if(!String(v.name||'').trim()){ toast('案件名を入れてください'); $('#fName').focus(); return; }
    const t = nowISO();
    if(form.mode==='new'){
      const j = normJob({ id:uid(), name:v.name, route:v.route, plan:v.plan, capH:v.capH, amount:v.amount, status:'active', createdAt:t, updatedAt:t });
      db.jobs.push(j);
      form=null; save(); openDetail(j.id); toast('案件を追加しました');
    }else{
      const j = jobById(v.id);
      if(!j){ form=null; backToList(); return; }
      Object.assign(j, normJob(Object.assign({}, j, { name:v.name, route:v.route, plan:v.plan, capH:v.capH, amount:v.amount, updatedAt:t })));
      form=null; save(); render(); toast('保存しました');
    }
  });
}

/* ---------- タイマーの秒表示 ---------- */
function startTick(){
  stopTick();
  tick = setInterval(()=>{
    const el = document.getElementById('tElapsed');
    if(!timer || !el || view.name!=='detail' || view.jobId!==timer.jobId){ return; }
    el.innerHTML = fmtClock(elapsedMs())+'<small>止めると 0.25h きざみで上の欄に入ります</small>';
  }, 1000);
}
function stopTick(){ if(tick){ clearInterval(tick); tick=null; } }

/* ===================== 操作 ===================== */
document.getElementById('backBtn').addEventListener('click', backToList);
document.getElementById('tabActive').addEventListener('click', ()=>{ listTab='active'; form=null; render(); });
document.getElementById('tabDone').addEventListener('click', ()=>{ listTab='done'; form=null; render(); });

/* ===================== テーマ ===================== */
function applyTheme(t){ if(t) document.documentElement.setAttribute('data-theme',t); else document.documentElement.removeAttribute('data-theme'); }
(function(){ const s=localStorage.getItem(THEME_KEY); if(s) applyTheme(s); })();
document.getElementById('themeBtn').addEventListener('click', ()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const isDark = cur ? cur==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  const next = isDark?'light':'dark';
  applyTheme(next); localStorage.setItem(THEME_KEY, next);
});

/* ===================== 起動 ===================== */
loadLocal();
loadTimer();
render();
if(timer) startTick();
if(sb){ loadRemote(); subscribeRealtime(); }
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && sb) loadRemote(); });

/* 純粋関数だけ外に出しておく（実データに触れずロジックを検算するため） */
window.__temahima = { netOf, rateOf, roundQuarter, roundHalf, usageOf, zoneOf, mergeState, mergeById, mergeTomb, sig, norm, blank, PLANS, ROUTES };

<!-- tsumiki-back-button -->
<style>
  #tsumikiEdge{position:fixed; top:0; bottom:0; left:0; width:22px; z-index:999;}
  #tsumikiPeek{
    position:fixed; top:50%; left:0; z-index:1001; margin-top:-23px;
    width:46px; height:46px; display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.92);
    -webkit-backdrop-filter:saturate(180%) blur(14px); backdrop-filter:saturate(180%) blur(14px);
    border:1px solid rgba(0,0,0,.06); border-radius:50%;
    box-shadow:0 6px 20px rgba(0,0,0,.18);
    color:#0071e3; font-size:24px; font-weight:600; line-height:1;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Helvetica Neue",Arial,sans-serif;
    transform:translateX(-70px) scale(.8); opacity:0; pointer-events:none;
  }
</style>
<div id="tsumikiEdge"></div>
<div id="tsumikiPeek">‹</div>
<script>
  (function(){
    var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
      || window.navigator.standalone === true;
    var fromTsumiki = false;
    try{
      if(document.referrer){
        var r = new URL(document.referrer);
        fromTsumiki = (r.origin === location.origin);
      }
    }catch(e){}
    if(!(standalone && fromTsumiki)) return;

    var peek = document.getElementById('tsumikiPeek');
    var edge = document.getElementById('tsumikiEdge');

    function goBack(){ location.href = 'index.html'; }

    /* --- 左端エッジスワイプで戻る（iOS純正の戻る操作。見えるボタンは置かない） --- */
    var sx=0, sy=0, prog=0, dragging=false, W=window.innerWidth;
    var TRIGGER = Math.min(120, W*0.32);
    window.addEventListener('resize', function(){ W=window.innerWidth; TRIGGER=Math.min(120, W*0.32); });

    function reset(){
      dragging = false; prog = 0;
      peek.style.transition = 'transform .25s ease, opacity .25s ease';
      peek.style.transform = 'translateX(-70px) scale(.8)';
      peek.style.opacity = 0;
    }
    function start(e){
      var t = e.touches ? e.touches[0] : e;
      if(t.clientX > 26) return;
      sx = t.clientX; sy = t.clientY; prog = 0; dragging = true;
      peek.style.transition = 'none';
    }
    function move(e){
      if(!dragging) return;
      var t = e.touches ? e.touches[0] : e;
      var dx = t.clientX - sx, dy = t.clientY - sy;
      if(Math.abs(dy) > Math.abs(dx) + 12){ reset(); return; }
      if(dx < 0) dx = 0;
      prog = Math.min(dx / TRIGGER, 1);
      peek.style.transform = 'translateX(' + (-70 + prog*82) + 'px) scale(' + (0.8 + prog*0.2) + ')';
      peek.style.opacity = prog;
      if(dx > 6 && e.cancelable) e.preventDefault();
    }
    function end(){
      if(!dragging) return;
      dragging = false;
      if(prog >= 0.999){
        peek.style.transition = 'transform .25s ease, opacity .25s ease';
        peek.style.transform = 'translateX(20px) scale(1.05)';
        peek.style.opacity = 1;
        goBack();
      }else{
        reset();
      }
    }
    edge.addEventListener('touchstart', start, {passive:true});
    window.addEventListener('touchmove', move, {passive:false});
    window.addEventListener('touchend', end, {passive:true});
    window.addEventListener('touchcancel', end, {passive:true});
  })();
</script>
