<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="apple-touch-icon" href="icons/icon-shirofuchi.png">
<meta name="apple-mobile-web-app-title" content="しろふち">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>しろふち</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F4F2EE; --card:#FBFAF7; --surface:#ECE9E3;
    --ink:#242321; --sub:#77736B; --line:#D8D4CC; --ghost:#BEB9B0;
    /* 画面のふちからの逃げ（iPhoneの丸い角・ホームバーにパネルがかからないように） */
    --gutter:22px;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:'Zen Maru Gothic',-apple-system,BlinkMacSystemFont,"Hiragino Maru Gothic ProN","Hiragino Sans","Helvetica Neue",Arial,sans-serif;
    background:var(--paper); color:var(--ink);
    -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
    height:100dvh; overflow:hidden; overscroll-behavior:none;
    display:flex; flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 16px)
            calc(env(safe-area-inset-right) + var(--gutter))
            calc(env(safe-area-inset-bottom) + 18px)
            calc(env(safe-area-inset-left) + var(--gutter));
  }
  .screen{flex:1; min-height:0; display:flex; flex-direction:column; width:100%; max-width:520px; margin:0 auto;}
  .hide{display:none !important;}

  /* ---- えらぶ画面：写真 / 動画 の2択だけ・文字なし ---- */
  #view1{justify-content:center;}
  .picks{display:flex; gap:14px; align-items:center; justify-content:center; width:100%;}
  /* 正方形のボタン。画面が低いときは max-height ではみ出しを防ぐ */
  .pick{flex:1; aspect-ratio:1/1; max-height:100%;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    background:var(--card); border:1px solid var(--line); border-radius:26px;
    transition:transform .16s ease, border-color .16s ease, background .16s ease;}
  .pick:active{transform:scale(.965); border-color:var(--ghost); background:var(--surface);}
  .pick svg{width:54%; height:auto; color:var(--ghost); transition:color .16s ease;}
  .pick:active svg{color:var(--sub);}
  input[type=file]{display:none;}

  /* ---- プレビュー ---- */
  .stage{flex:1; min-height:0; display:flex; align-items:center; justify-content:center; padding-bottom:16px;}
  .frame{position:relative; background:#fff; overflow:hidden; box-shadow:0 12px 34px rgba(36,35,33,.15); border-radius:5px;}
  .frame > *{position:absolute; object-fit:cover; display:block;}

  /* ---- 操作パネル ---- */
  .panel{flex:0 0 auto; background:var(--card); border:1px solid var(--line);
    border-radius:22px; padding:12px 16px 14px;}
  .ctl{display:grid; grid-template-columns:24px 1fr 44px; align-items:center; gap:10px;}
  .ctl .ic{width:24px; height:24px; color:var(--sub); display:block;}
  .ctl .val{font-size:12px; color:var(--sub); text-align:right; font-variant-numeric:tabular-nums;}
  input[type=range]{-webkit-appearance:none; appearance:none; width:100%; height:36px; background:transparent; display:block;}
  input[type=range]::-webkit-slider-runnable-track{height:6px; border-radius:999px; background:var(--surface); border:1px solid var(--line);}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:28px; height:28px; border-radius:50%;
    margin-top:-12px; background:#fff; border:1px solid var(--line); box-shadow:0 2px 6px rgba(36,35,33,.18);}

  .actions{display:flex; gap:10px; margin-top:8px;}
  .btn{flex:1; display:flex; align-items:center; justify-content:center; gap:8px;
    font-family:inherit; font-size:16px; font-weight:700; letter-spacing:.02em;
    padding:15px 10px; border-radius:16px; border:1px solid var(--ink); background:var(--ink); color:#fff;
    cursor:pointer; transition:transform .15s ease, opacity .15s ease;}
  .btn:active{transform:scale(.97);}
  .btn[disabled]{opacity:.55;}
  /* 書き出しずみ＝あとは押すだけの状態。もう一度おしてほしいので、そっと目立たせる */
  .btn.ready{animation:ready 1.6s ease-in-out infinite;}
  @keyframes ready{0%,100%{box-shadow:0 0 0 0 rgba(36,35,33,.26);} 50%{box-shadow:0 0 0 7px rgba(36,35,33,0);}}
  .btn.ghost{flex:0 0 auto; width:58px; padding:15px 0; background:var(--card);
    color:var(--sub); border-color:var(--line);}
  .btn svg{width:22px; height:22px; display:block;}
  .bar{height:5px; border-radius:999px; background:var(--surface); overflow:hidden; margin-top:10px; display:none;}
  .hint{display:none; margin-top:8px; text-align:center; font-size:12px; line-height:1.5; color:var(--sub); white-space:pre-line;}
  .bar i{display:block; height:100%; width:0%; background:var(--ink); transition:width .2s linear;}

  #toast{position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 100px); transform:translateX(-50%) translateY(12px);
    background:rgba(36,35,33,.94); color:#fff; font-size:13.5px; padding:11px 18px; border-radius:999px;
    opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease; z-index:50; max-width:84vw; text-align:center;}
  #toast.on{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<!-- えらぶ画面：左＝写真だけ／右＝動画だけ（iPhoneの写真アプリが絞り込まれて開く） -->
<div class="screen" id="view1">
  <div class="picks">
    <label class="pick" for="filePhoto">
      <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="4.5"
           stroke-linecap="round" stroke-linejoin="round" aria-label="写真をえらぶ">
        <rect x="18" y="18" width="64" height="64" rx="13"/>
        <circle cx="37" cy="38" r="3.4"/>
        <path d="M21,72 L41,50 L52,61 L79,34"/>
      </svg>
    </label>
    <label class="pick" for="fileVideo">
      <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="4.5"
           stroke-linecap="round" stroke-linejoin="round" aria-label="動画をえらぶ">
        <rect x="18" y="18" width="64" height="64" rx="13"/>
        <path d="M42,36 L68,50 L42,64 Z"/>
      </svg>
    </label>
  </div>
</div>
<input type="file" id="filePhoto" accept="image/*">
<input type="file" id="fileVideo" accept="video/*">

<!-- 編集画面：1画面ぴったり。スクロールなし -->
<div class="screen hide" id="view2">
  <div class="stage" id="stage"><div class="frame" id="frame"></div></div>

  <div class="panel">
    <!-- ふちの太さ -->
    <div class="ctl">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2"
           stroke-linejoin="round"><rect x="2.6" y="2.6" width="18.8" height="18.8" rx="3.4"/></svg>
      <input type="range" id="w" min="0.5" max="8" step="0.1" value="2" aria-label="ふちの太さ">
      <span class="val" id="wv">2.0%</span>
    </div>
    <!-- かどの丸み -->
    <div class="ctl">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
           stroke-linecap="round"><path d="M3.5,21 L3.5,10 A6.5,6.5 0 0 1 10,3.5 L21,3.5"/></svg>
      <input type="range" id="r" min="0" max="24" step="1" value="2" aria-label="かどの丸み">
      <span class="val" id="rv">2%</span>
    </div>

    <div class="actions">
      <button class="btn ghost" id="again" aria-label="えらびなおす">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.5,12a8.5,8.5 0 1 1-2.5-6"/><path d="M20.5,4.5v5.5h-5.5"/></svg>
      </button>
      <button class="btn" id="save">保存</button>
    </div>
    <div class="bar" id="bar"><i></i></div>
    <div class="hint" id="hint"></div>
  </div>
</div>

<div id="toast"></div>

<script>
/* =========================================================
   しろふち — どんな比率の写真/動画も 9:16 の白い台紙にのせて「写真」に保存する
   ・出来上がりはいつも 9:16（たて長）。ふちの太さは出来上がりの横幅に対する％
   ・写真は切らずに全部のせる（横位置なら上下に、9:16より細長いなら左右に白がふえる）
   ・ただし切れるのが 3% までで収まるとき（＝ほぼ9:16の写真）は、
     いままで通り4辺のふちをぴったりそろえる（cover）
   ・画面は1画面ぴったり（スクロールなし）。プレビューの大きさはJSで実測して決める
   ========================================================= */
const el = id => document.getElementById(id);
const KEY = 'shirofuchi_w', KEY_R = 'shirofuchi_r', KEY_NA = 'shirofuchi_noaudio';

/* 版番号。直したのに直っていないように見える事故を防ぐため、画面にも出す。
   ⚠️ ホーム画面に置いたアプリは古い版が居座りやすいので、起動時に最新の版番号を
   見に行き、自分より新しければ一度だけ読み直す（?v= を付けるとキャッシュを外せる） */
const VER = 8;
(async () => {
  try{
    if(sessionStorage.getItem('shirofuchi_verchecked')) return;
    sessionStorage.setItem('shirofuchi_verchecked', '1');
    const res = await fetch(location.pathname + '?cb=' + Date.now(), {cache:'no-store'});
    const txt = await res.text();
    const m = txt.match(/const VER = (\d+)/);
    if(m && Number(m[1]) > VER) location.replace(location.pathname + '?v=' + m[1]);
  }catch(e){}
})();

let kind = null;      // 'image' | 'video'
let url  = null;      // objectURL
let media = null;     // <img> or <video>
let srcW = 0, srcH = 0;
let busy = false;

/* ---------- ふちの太さ・かどの丸み ----------
   太さ ＝ 出来上がりの「横幅」に対する％。かど ＝ 中身（写真部分）の「横幅」に対する％。
   どちらも％なので、プレビューでも書き出しでも見た目が同じになる。 */
let pct = parseFloat(localStorage.getItem(KEY) || '2');
if(!(pct >= 0.5 && pct <= 8)) pct = 2;
/* はじめて開いたときは 太さ2% / かど2%（＝ふつうの丸み）
   ふつうの丸みを 6%→2% に変えたので、前のふつう(6)のまま残っている端末だけ一度きりで戻す
   （自分でずらした値には触らない・フラグで二度目は走らない） */
if(localStorage.getItem('shirofuchi_r_std2') !== '1'){
  if(localStorage.getItem(KEY_R) === '6') localStorage.removeItem(KEY_R);
  localStorage.setItem('shirofuchi_r_std2', '1');
}
let rad = parseFloat(localStorage.getItem(KEY_R) || '2');
if(!(rad >= 0 && rad <= 24)) rad = 2;
el('w').value = pct;
el('r').value = rad;

/* ---------- 出来上がりの形 ----------
   いつも 9:16（たて長）の白い台紙。その真ん中に写真をのせる。
   写真が台紙とちがう比率なら、あまった場所はぜんぶ白になる（＝白い背景）。 */
const AR = 9 / 16;          // 出来上がりの 横 ÷ たて
const CROP_MAX = 0.03;      // これ以内しか切れないなら、4辺のふちをそろえる（＝いままでの見た目）

/* 台紙（W×H）の中で、写真をどこに・どの大きさで置くかを求める。
   もどり値の x,y,w,h は写真の場所。s は元の写真にかかる倍率（出来上がりサイズを決めるのに使う） */
function geom(W, H, sw, sh){
  const b  = W * pct / 100;
  const iw = Math.max(1, W - b * 2), ih = Math.max(1, H - b * 2);
  const sc = Math.max(iw / sw, ih / sh);                        // ふち内いっぱいに満たす倍率
  const crop = Math.max(sw * sc / iw, sh * sc / ih) - 1;         // そのとき切れる割合
  if(crop <= CROP_MAX) return {x:b, y:b, w:iw, h:ih, s:sc};      // ほぼ9:16 → 4辺そろえる
  const sf = Math.min(iw / sw, ih / sh);                         // それ以外 → 切らずに全部のせる
  const w = sw * sf, h = sh * sf;
  return {x:(W - w) / 2, y:(H - h) / 2, w, h, s:sf};
}

/* プレビューの大きさは、余った場所を実測してぴったり収まるように決める（＝スクロールしない） */
function layout(){
  el('wv').textContent = pct.toFixed(1) + '%';
  el('rv').textContent = Math.round(rad) + '%';
  const f = el('frame'), st = el('stage');
  if(!srcW || !srcH || !st.clientWidth) return;
  const w = Math.floor(Math.min(st.clientWidth, st.clientHeight * AR));
  const h = Math.round(w / AR);
  f.style.width  = w + 'px';
  f.style.height = h + 'px';
  const kid = f.firstElementChild;
  if(!kid) return;
  const g = geom(w, h, srcW, srcH);
  kid.style.left   = g.x + 'px';
  kid.style.top    = g.y + 'px';
  kid.style.width  = g.w + 'px';
  kid.style.height = g.h + 'px';
  kid.style.borderRadius = (g.w * rad / 100) + 'px';
}
el('w').addEventListener('input', e => {
  pct = parseFloat(e.target.value);
  localStorage.setItem(KEY, String(pct));
  if(pending) disarmSave();   // 見た目を変えたら、書き出しずみのファイルは作り直し
  layout();
});
el('r').addEventListener('input', e => {
  rad = parseFloat(e.target.value);
  localStorage.setItem(KEY_R, String(rad));
  if(pending) disarmSave();
  layout();
});
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => setTimeout(layout, 250));

/* ---------- ファイルをえらぶ ----------
   写真用・動画用で入力欄を分けている。accept を絞っておくと、
   iPhoneの写真アプリが「写真だけ」「ビデオだけ」に絞り込まれた状態で開く */
['filePhoto','fileVideo'].forEach(id => {
  el(id).addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    if(f) load(f, id === 'fileVideo' ? 'video' : 'image');
    e.target.value = '';
  });
});
el('again').addEventListener('click', () => { if(!busy) reset(); });

function reset(){
  stopMonitor();
  el('hint').style.display = 'none';
  el('hint').textContent = '';
  if(url) URL.revokeObjectURL(url);
  url = null; media = null; kind = null; srcW = 0; srcH = 0;
  disarmSave();
  el('frame').innerHTML = '';
  el('view2').classList.add('hide');
  el('view1').classList.remove('hide');
}

function load(file, hint){
  stopMonitor();
  fileInfo = (file.type || '種類不明') + '・' + (file.size / 1048576).toFixed(0) + 'MB';
  el('hint').style.display = 'none';
  el('hint').textContent = '';
  if(url) URL.revokeObjectURL(url);
  url = URL.createObjectURL(file);
  // 種類はファイル自身の型で判定。型が空のときは押したボタン（hint）を使う
  kind = /^video\//.test(file.type) ? 'video'
       : /^image\//.test(file.type) ? 'image'
       : (hint || 'image');
  disarmSave();
  el('frame').innerHTML = '';

  if(kind === 'image'){
    const img = new Image();
    img.onload = () => { srcW = img.naturalWidth; srcH = img.naturalHeight; media = img; ready(); };
    img.onerror = () => toast('この画像は読み込めませんでした');
    img.src = url;
  } else {
    const v = document.createElement('video');
    v.playsInline = true; v.setAttribute('playsinline','');
    v.muted = true; v.loop = true; v.preload = 'auto';
    v.onloadedmetadata = () => {
      srcW = v.videoWidth; srcH = v.videoHeight; media = v; ready();
      v.play().catch(()=>{});
    };
    v.onerror = () => toast('この動画は読み込めませんでした');
    v.src = url;
  }
}

/* 同じファイルから <video> を作り直す。
   createMediaElementSource でWebAudioにつないだ要素は、二度と切り離せない。
   音なしでやり直すには要素そのものを取り替えるしかない。 */
function reloadMedia(){
  return new Promise((res, rej) => {
    const nv = document.createElement('video');
    nv.playsInline = true; nv.setAttribute('playsinline','');
    nv.muted = true; nv.loop = true; nv.preload = 'auto';
    nv.onloadedmetadata = () => {
      const old = media;
      srcW = nv.videoWidth; srcH = nv.videoHeight;
      media = nv;
      el('frame').innerHTML = '';
      el('frame').appendChild(nv);
      try{ old.pause(); old.removeAttribute('src'); old.load(); }catch(e){}
      layout();
      nv.play().catch(()=>{});
      res();
    };
    nv.onerror = () => rej(new Error('動画を読み直せませんでした'));
    nv.src = url;
  });
}

function ready(){
  if(!srcW || !srcH){ toast('サイズが読み取れませんでした'); return; }
  el('frame').appendChild(media);
  el('view1').classList.add('hide');
  el('view2').classList.remove('hide');
  layout();
  startMonitor();
}

/* ---------- 再生モニター ----------
   「書き出し以前に、そもそも再生できているのか」を実機で見るための実況表示。
   コマの通知を数えて実効fpsを出し、再生位置・読み込み状態・待ち回数を出す。 */
let mon = 0, monFrames = 0, monWait = 0, fileInfo = '';
function onMonWait(){ monWait++; }
function stopMonitor(){
  if(mon){ clearInterval(mon); mon = 0; }
  if(media){
    media.removeEventListener('waiting', onMonWait);
    media.removeEventListener('stalled', onMonWait);
  }
}
function startMonitor(){
  stopMonitor();
  if(kind !== 'video' || !media) return;
  const v = media;
  monFrames = 0; monWait = 0;
  v.addEventListener('waiting', onMonWait);
  v.addEventListener('stalled', onMonWait);
  if(typeof v.requestVideoFrameCallback === 'function'){
    const cb = () => { if(!mon) return; monFrames++; v.requestVideoFrameCallback(cb); };
    v.requestVideoFrameCallback(cb);
  }
  let last = performance.now(), lastN = 0;
  const render = fps => {
    el('hint').textContent =
      'v' + VER + '・元 ' + srcW + '×' + srcH + '・' + (isFinite(v.duration) ? v.duration.toFixed(1) : '?') + '秒・' + fileInfo + '\n'
      + '再生 ' + v.currentTime.toFixed(1) + '秒・' + fps.toFixed(0) + 'fps・読込' + v.readyState
      + (v.paused ? '・とまってる' : '') + '・待ち' + monWait + '回・コマ計' + monFrames;
  };
  el('hint').style.display = 'block';
  render(0);
  layout();                      // 実況の行ぶんパネルが伸びるので、プレビューを測り直す
  mon = setInterval(() => {
    if(busy) return;
    const now = performance.now(), dt = (now - last) / 1000;
    const fps = dt > 0 ? (monFrames - lastN) / dt : 0;
    lastN = monFrames; last = now;
    render(fps);
  }, 700);
}
/* プレビューを押したら再生／一時停止。自動再生が止められている端末でも動かせるように */
el('frame').addEventListener('click', () => {
  if(busy || kind !== 'video' || !media) return;
  if(media.paused) media.play().catch(()=>{}); else media.pause();
});

/* ---------- 描画（ふちをつける） ---------- */
/* かどの丸みぶんの「白い三日月」を1つ描く。
   まるごと切り抜く（clip）かわりに、はみ出た角だけを白でふさぐ作戦。 */
function cornerFill(ctx, px, py, cx, cy, r, a0, a1){
  ctx.beginPath();
  ctx.moveTo(px, py);
  ctx.arc(cx, cy, r, a0, a1, true);
  ctx.closePath();
  ctx.fill();
}

/* 1コマぶんを描く。
   ⚠️ iPhoneでは「毎コマ clip する」「毎コマ台紙ぜんぶを白でぬる」がとても重く、
      動画のコマ落ちの原因になる。そこで
      ・切り抜き → drawImage の9引数（元のどこを使うか）で代用＝clip なし
      ・白ぬり  → 最初の1回だけ（keepBg=true で省略）。かどの丸みは角4つを白でふさぐ
   にしている。写真1枚の書き出しでは重さは問題にならないが、同じ道を通す。 */
function paint(ctx, src, W, H, keepBg){
  const sw = src.videoWidth || src.naturalWidth, sh = src.videoHeight || src.naturalHeight;
  if(!keepBg){
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, W, H);               // 台紙ぜんぶを白でぬる（＝白い背景）
  }
  const g = geom(W, H, sw, sh);
  // 置き場所を満たす倍率。切らない側では ぴったり一致するので、切り出しは起きない
  const s  = Math.max(g.w / sw, g.h / sh);
  const cw = Math.min(sw, g.w / s), ch = Math.min(sh, g.h / s);
  ctx.drawImage(src, (sw - cw) / 2, (sh - ch) / 2, cw, ch, g.x, g.y, g.w, g.h);
  const r = Math.min(g.w * rad / 100, g.w / 2, g.h / 2);
  if(r > 0.5){
    const P = Math.PI;
    ctx.fillStyle = '#fff';
    cornerFill(ctx, g.x,       g.y,       g.x + r,       g.y + r,       r, -P/2, -P);
    cornerFill(ctx, g.x + g.w, g.y,       g.x + g.w - r, g.y + r,       r, 0,    -P/2);
    cornerFill(ctx, g.x + g.w, g.y + g.h, g.x + g.w - r, g.y + g.h - r, r, P/2,  0);
    cornerFill(ctx, g.x,       g.y + g.h, g.x + r,       g.y + g.h - r, r, P,    P/2);
  }
}

/* ---------- 保存 ---------- */
el('save').addEventListener('click', () => { if(!busy) save(); });

/* 書き出しずみで、まだ写真アプリに入れていないファイル。
   動画は書き出しに時間がかかり、その間に「タップの権利」（＝ユーザー操作の有効時間・数秒）が
   切れてしまうので、共有シートは次のタップで開く。それまでここに置いておく。 */
let pending = null;

async function save(){
  const btn = el('save');
  // 2回目のタップ＝書き出しずみのファイルを、そのまま共有シートへ（押した瞬間に開く）
  if(pending){ handOver(pending); return; }

  busy = true;
  stopMonitor();
  btn.disabled = true; el('again').disabled = true;
  try{
    if(kind === 'image'){
      btn.textContent = '…';
      const blob = await makeImage();
      handOver(new File([blob], stamp() + '.jpg', {type:'image/jpeg'}));
    } else {
      const prog = (p, left) => {
        btn.textContent = Math.round(p * 100) + '%';
        el('bar').querySelector('i').style.width = (p * 100) + '%';
        const m = Math.floor(left / 60), sec = Math.round(left % 60);
        el('hint').textContent = '画面はこのままでお待ちください（のこり ' + (m ? m + '分' : '') + sec + '秒・v' + VER + '）';
      };
      /* 音を拾うと再生ごと止まる端末がある（iOSの持病）。
         止まったら「音なし」で自動的にやり直し、以後この端末では音なしで書き出す。 */
      let useAudio = localStorage.getItem(KEY_NA) !== '1';
      let blob;
      try{
        blob = await makeVideo(prog, useAudio);
      }catch(e){
        if(e && e.stalled && useAudio){
          toast('音の取り込みで再生が止まりました。音なしでやり直します');
          await reloadMedia();          // WebAudioにつながれた動画を作り直して縁を切る
          blob = await makeVideo(prog, false);
          localStorage.setItem(KEY_NA, '1');   // 音なしで成功したときだけ覚える
        }else{
          throw e;
        }
      }
      const mp4 = blob.type.indexOf('mp4') >= 0;
      if(!mp4) toast('この端末はmp4を作れないため、webmで書き出しました');
      handOver(new File([blob], stamp() + (mp4 ? '.mp4' : '.webm'), {type: mp4 ? 'video/mp4' : 'video/webm'}));
    }
  }catch(e){
    toast((e && e.message) ? e.message : '保存できませんでした');
    btn.textContent = '保存';
  }
  el('bar').style.display = 'none';
  el('bar').querySelector('i').style.width = '0%';
  // 診断行（◯コマ／◯秒＝◯fps）は消さずに残す。次に写真/動画をえらんだ時に消える
  btn.disabled = false; el('again').disabled = false;
  busy = false;
}

/* 書き出したファイルの受け渡し。待ちの状態は保存ボタンの見た目で伝える */
function armSave(file){
  pending = file;
  const btn = el('save');
  btn.textContent = '写真に保存';
  btn.classList.add('ready');
}
function disarmSave(){
  pending = null;
  const btn = el('save');
  btn.textContent = '保存';
  btn.classList.remove('ready');
}

function stamp(){
  const d = new Date(), p = n => String(n).padStart(2,'0');
  return 'shirofuchi_' + d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
}

/* 出来上がり（9:16の台紙）の大きさ。写真が元の細かさのまま入るサイズを選ぶ。
   geom は比率だけで決まるので、仮の1000pxで倍率を出して逆算できる */
function outSize(){
  const s = geom(1000, 1000 / AR, srcW, srcH).s / 1000;
  const W = Math.max(2, Math.round(1 / s));
  return {W, H: Math.max(2, Math.round(W / AR))};
}

function makeImage(){
  // iOS の canvas 上限（約16.7M画素）を超えないように縮小する
  let {W, H} = outSize();
  const maxPx = 16700000;
  if(W * H > maxPx){ const k = Math.sqrt(maxPx / (W * H)); W = Math.round(W * k); H = Math.round(H * k); }
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  paint(c.getContext('2d'), media, W, H);
  return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('画像を作れませんでした')), 'image/jpeg', 0.95));
}

function pickMime(){
  if(typeof MediaRecorder === 'undefined') return null;
  const list = ['video/mp4;codecs=avc1.640028','video/mp4;codecs=h264','video/mp4','video/webm;codecs=vp9','video/webm'];
  for(const m of list){ try{ if(MediaRecorder.isTypeSupported(m)) return m; }catch(e){} }
  return null;
}

let audioCtx = null;

function makeVideo(onProgress, useAudio){
  return new Promise(async (resolve, reject) => {
    const v = media;
    const mime = pickMime();
    if(!mime || !HTMLCanvasElement.prototype.captureStream){
      return reject(new Error('この端末では動画のふちづけに対応していません（写真は使えます）'));
    }
    // 書き出しサイズ（9:16の台紙・長辺1920まで・H.264のため偶数に）
    let {W, H} = outSize();
    const k = Math.min(1, 1920 / Math.max(W, H));
    W = Math.max(2, Math.round(W * k / 2) * 2);
    H = Math.max(2, Math.round(H * k / 2) * 2);

    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const ctx = c.getContext('2d', {alpha:false});
    paint(ctx, v, W, H);

    /* ⚠️ 元の動画は「見えたまま」で再生する。
       透明にしたり隠したりすると、iOSはコマの通知（requestVideoFrameCallback）を
       ほとんど出さなくなり、書き出しが数秒で固まる（2026-08-25 実機で確認）。 */

    /* 画面が消えると iOS は処理ごと止めてしまうので、書き出しの間だけ消えないようにする */
    let wake = null;
    try{ if(navigator.wakeLock && navigator.wakeLock.request) wake = await navigator.wakeLock.request('screen'); }catch(e){}

    /* 録画への取り込み方
       ・「毎秒30コマ、自動で取り込む」方式は、iPhoneが描き終えていないコマをそのまま捨てる＝コマ落ちの正体。
       ・そこで captureStream(0)（＝自動では取り込まない）にして、
         動画のコマが1枚できあがるたびに requestFrame() で1枚ずつ手渡す。取りこぼしが起きない。
       ・requestVideoFrameCallback / requestFrame が無い端末だけ、これまで通りの自動30コマにする */
    const hasRVFC = typeof v.requestVideoFrameCallback === 'function';
    let stream = c.captureStream(0);
    let vtrack = stream.getVideoTracks()[0];
    const manual = hasRVFC && vtrack && typeof vtrack.requestFrame === 'function';
    if(!manual){
      try{ stream.getTracks().forEach(t => t.stop()); }catch(e){}
      stream = c.captureStream(30);
      vtrack = stream.getVideoTracks()[0];
    }

    // 音を拾う（元の音声を録画ストリームに合流させる）
    // createMediaElementSource は1つの<video>につき1回だけなので、要素そのものに覚えさせる
    /* 音の取り込み。
       ⚠️ createMediaElementSource でWebAudioにつなぐと、動画の再生ごと止まることがある
          （iOSの持病。2026-08-25 実機で「16秒の動画が0.5秒で停止」を確認）。
       そこで ①動画そのものから音のトラックを取れるならそれを使い（WebAudioを通さない）、
              ②だめならWebAudio、③それもだめなら音なし、の順で試す。
       止まってしまった場合は呼び出し側が「音なし」でやり直す。 */
    let audioTap = null, audioOn = false, audioWay = 'なし';
    if(useAudio){
      try{
        const cap = v.captureStream || v.mozCaptureStream || v.webkitCaptureStream;
        if(typeof cap === 'function'){
          const ms = cap.call(v);
          const at = ms && ms.getAudioTracks && ms.getAudioTracks()[0];
          if(at){ stream.addTrack(at); audioOn = true; audioWay = '直'; }
        }
      }catch(e){ audioOn = false; }
      if(!audioOn){
        try{
          if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          if(audioCtx.state !== 'running') await audioCtx.resume();
          if(audioCtx.state === 'running'){
            if(!v.__srcNode) v.__srcNode = audioCtx.createMediaElementSource(v);
            audioTap = audioCtx.createMediaStreamDestination();
            v.__srcNode.connect(audioTap);
            audioTap.stream.getAudioTracks().forEach(t => stream.addTrack(t));
            audioOn = true; audioWay = 'WA';
          }
        }catch(e){ audioTap = null; audioOn = false; }
      }
    }

    let rec;
    try{
      rec = new MediaRecorder(stream, {mimeType:mime, videoBitsPerSecond: 8000000, audioBitsPerSecond: 128000});
    }catch(e){ return reject(new Error('この端末では動画を書き出せませんでした')); }

    const chunks = [];
    rec.ondataavailable = e => { if(e.data && e.data.size) chunks.push(e.data); };

    const dur = isFinite(v.duration) && v.duration > 0 ? v.duration : 0;
    let stopped = false, raf = 0, timer = 0;
    el('bar').style.display = 'block';
    el('hint').style.display = 'block';
    el('hint').textContent = '画面はこのままでお待ちください（v' + VER + '）';
    layout();   // 進捗バーのぶんパネルが伸びるので、プレビューの大きさを取り直す

    const finish = () => {
      if(stopped) return; stopped = true;
      endPos = v.currentTime;          // 診断用：どこまで再生できたか（この後 0 に戻すので先に控える）
      cancelAnimationFrame(raf);
      clearInterval(timer);
      try{ rec.stop(); }catch(e){}
    };
    rec.onstop = () => {
      if(!endPos) endPos = v.currentTime;
      try{ if(wake) wake.release(); }catch(e){}
      wake = null;
      stream.getTracks().forEach(t => { try{ t.stop(); }catch(e){} });
      if(audioTap){ try{ v.__srcNode.disconnect(audioTap); }catch(e){} }
      v.pause();
      v.muted = true; v.loop = true; v.currentTime = 0;
      v.play().catch(()=>{});
      const blob = new Blob(chunks, {type: chunks.length && chunks[0].type ? chunks[0].type : mime});
      // 診断：実機のどこが遅いのかを見えるようにしておく（コマ落ちの切り分け用）
      const secs = t0 ? (performance.now() - t0) / 1000 : 0;
      el('hint').textContent =
        'v' + VER + '・' + W + '×' + H + '・' + (manual ? '手わたし' : '自動') + '・音' + (audioOn ? 'あり(' + audioWay + ')' : 'なし') + '\n'
        + frames + 'コマ(通知' + byRVFC + '/保険' + byRAF + ')／' + secs.toFixed(1) + '秒＝'
        + (secs ? (frames / secs).toFixed(1) : '0') + 'fps\n'
        + '描画' + (frames ? (paintMs / frames).toFixed(1) : '0') + 'ms・空白'
        + (maxGap / 1000).toFixed(1) + '秒・位置' + endPos.toFixed(1) + '/' + dur.toFixed(1)
        + '秒・再開' + retries + '回';
      if(stalledOut){
        const err = new Error('再生が' + endPos.toFixed(1) + '秒で止まりました');
        err.stalled = true;
        reject(err);
        return;
      }
      if(!blob.size) reject(new Error('動画を作れませんでした'));
      else resolve(blob);
    };

    // 1フレームごとに白ふち付きで描き直す。
    // requestVideoFrameCallback があれば動画のフレームに正確に合わせ、無ければ rAF。
    // どちらも止まる環境の保険として、タイマーでも描き直す（＝進捗表示も兼ねる）
    /* 描くきっかけは2本立てにする。
       ①コマの通知（requestVideoFrameCallback）＝いちばん正確
       ②画面の描き替え（requestAnimationFrame）＝①が来なくても30コマ/秒は確保する保険
       iPhoneでは①がほとんど来ないことがあり（＝2.8fpsの正体）、②が無いと動画が固まる。 */
    let lastAt = 0, frames = 0, t0 = 0;
    let byRVFC = 0, byRAF = 0, paintMs = 0, maxGap = 0, retries = 0, endPos = 0, stalledOut = false;
    const drawFrame = src => {
      const t = performance.now();
      if(lastAt) maxGap = Math.max(maxGap, t - lastAt);
      paint(ctx, v, W, H, true);
      paintMs += performance.now() - t;
      lastAt = performance.now();
      frames++;
      if(src === 1) byRVFC++; else byRAF++;
      if(manual){ try{ vtrack.requestFrame(); }catch(e){} }
    };
    const tick = () => {
      if(stopped) return;
      raf = requestAnimationFrame(tick);
      if(performance.now() - lastAt >= 30) drawFrame(2);   // 30コマ/秒までに間引く
    };
    const startPainting = () => {
      if(hasRVFC){
        const cb = () => { if(stopped) return; drawFrame(1); v.requestVideoFrameCallback(cb); };
        v.requestVideoFrameCallback(cb);
      }
      tick();
      let seen = -1, still = 0;
      timer = setInterval(() => {
        if(stopped) return;
        // 再生が進んでいるか見張る。進まなければ鳴らし直し、それでもだめなら「止まった」で打ち切る
        if(v.currentTime <= seen + 0.02 && !v.ended && !v.paused){
          still++;
          if(still === 5){                      // 1.0秒すすまない → 鳴らし直す
            retries++;
            try{ if(audioCtx && audioCtx.state !== 'running') audioCtx.resume(); }catch(e){}
            v.play().catch(()=>{});
          }
          if(still >= 13){                      // 2.6秒すすまない → 止まったと判断して打ち切る
            stalledOut = true; finish(); return;
          }
        } else { still = 0; seen = v.currentTime; }
        if(dur) onProgress(Math.min(1, v.currentTime / dur), Math.max(0, dur - v.currentTime));
        if(v.ended) finish();
      }, 200);
    };

    v.pause();
    v.loop = false;
    v.muted = !audioOn;   // 音を拾えないときは鳴らさない（意味なく音が出るだけなので）
    v.onended = finish;
    try{ v.currentTime = 0; }catch(e){}
    const start = () => {
      rec.start();
      t0 = performance.now();
      frames = 0;
      startPainting();
      v.play().then(() => {
        // 保険：長さ＋2秒で必ず止める
        if(dur) setTimeout(finish, (dur + 2) * 1000);
      }).catch(err => {
        stopped = true;
        try{ rec.stop(); }catch(e){}
        reject(new Error('動画を再生できませんでした'));
      });
    };
    if(v.readyState >= 2) start();
    else v.oncanplay = () => { v.oncanplay = null; start(); };
  });
}

/* 共有シート（＝iPhoneの「写真に保存」が出るところ）へ渡す。
   ⚠️ navigator.share は「タップしてから数秒以内」でないと開けない決まりがある。
   そのため await を1つも挟まずに呼ぶこと。開けなかったときはボタンを
   「写真に保存」に変えて待機し、次のタップで開く（書き出しはやり直さない）。 */
function handOver(file){
  const tries = (file.__tries || 0) + 1;
  file.__tries = tries;

  let can = false;
  try{ can = !!(navigator.canShare && navigator.canShare({files:[file]})); }catch(e){}
  if(can){
    const failed = e => {
      // AbortError＝共有シートを閉じただけ。それ以外＝タップの権利ぎれなど
      if(e && e.name === 'AbortError'){ armSave(file); return; }
      if(tries >= 2){ download(file); return; }   // 2回だめなら行き止まりにせず受け取り方を変える
      armSave(file);
      toast('できました。もう一度おしてください');
    };
    try{
      navigator.share({files:[file]}).then(() => { disarmSave(); toast('保存しました'); }).catch(failed);
      return;
    }catch(e){ failed(e); return; }
  }
  // 共有シートが使えない端末（パソコンなど）はダウンロードで受け取る
  download(file);
}

function download(file){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file);
  a.download = file.name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 3000);
  disarmSave();
  toast('保存しました');
}

/* ---------- トースト ---------- */
let tt = null;
function toast(msg){
  const t = el('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2600);
}
</script>

<style>
  #tsumikiEdge{position:fixed; top:0; bottom:0; left:0; width:22px; z-index:999;}
  #tsumikiPeek{
    position:fixed; top:50%; left:0; z-index:1001; margin-top:-23px;
    width:46px; height:46px; display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.92);
    -webkit-backdrop-filter:saturate(180%) blur(14px); backdrop-filter:saturate(180%) blur(14px);
    border:1px solid rgba(0,0,0,.06); border-radius:50%;
    box-shadow:0 6px 20px rgba(0,0,0,.18);
    color:#0071e3; font-size:24px; font-weight:600; line-height:1;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Helvetica Neue",Arial,sans-serif;
    transform:translateX(-70px) scale(.8); opacity:0; pointer-events:none;
  }
</style>
<div id="tsumikiEdge"></div>
<div id="tsumikiPeek">‹</div>
<script>
  (function(){
    var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
      || window.navigator.standalone === true;
    var fromTsumiki = false;
    try{
      if(document.referrer){
        var r = new URL(document.referrer);
        fromTsumiki = (r.origin === location.origin);
      }
    }catch(e){}
    if(!(standalone && fromTsumiki)) return;

    var peek = document.getElementById('tsumikiPeek');
    var edge = document.getElementById('tsumikiEdge');

    function goBack(){ location.href = 'index.html'; }

    /* --- 左端エッジスワイプで戻る（iOS純正の戻る操作。見えるボタンは置かない） --- */
    var sx=0, sy=0, prog=0, dragging=false, W=window.innerWidth;
    var TRIGGER = Math.min(120, W*0.32);
    window.addEventListener('resize', function(){ W=window.innerWidth; TRIGGER=Math.min(120, W*0.32); });

    function reset(){
      dragging = false; prog = 0;
      peek.style.transition = 'transform .25s ease, opacity .25s ease';
      peek.style.transform = 'translateX(-70px) scale(.8)';
      peek.style.opacity = 0;
    }
    function start(e){
      var t = e.touches ? e.touches[0] : e;
      if(t.clientX > 26) return;
      sx = t.clientX; sy = t.clientY; prog = 0; dragging = true;
      peek.style.transition = 'none';
    }
    function move(e){
      if(!dragging) return;
      var t = e.touches ? e.touches[0] : e;
      var dx = t.clientX - sx, dy = t.clientY - sy;
      if(Math.abs(dy) > Math.abs(dx) + 12){ reset(); return; }
      if(dx < 0) dx = 0;
      prog = Math.min(dx / TRIGGER, 1);
      peek.style.transform = 'translateX(' + (-70 + prog*82) + 'px) scale(' + (0.8 + prog*0.2) + ')';
      peek.style.opacity = prog;
      if(dx > 6 && e.cancelable) e.preventDefault();
    }
    function end(){
      if(!dragging) return;
      dragging = false;
      if(prog >= 0.999){
        peek.style.transition = 'transform .25s ease, opacity .25s ease';
        peek.style.transform = 'translateX(20px) scale(1.05)';
        peek.style.opacity = 1;
        goBack();
      }else{
        reset();
      }
    }
    edge.addEventListener('touchstart', start, {passive:true});
    window.addEventListener('touchmove', move, {passive:false});
    window.addEventListener('touchend', end, {passive:true});
    window.addEventListener('touchcancel', end, {passive:true});
  })();
</script>
