<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="apple-touch-icon" href="icons/icon-dokuritsu.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="独立">
<meta name="theme-color" content="#f5f4f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131109" media="(prefers-color-scheme: dark)">
<title>独立ロードマップ</title>
<style>
  :root{
    --paper:#f5f4f0; --surface:#fffefb; --surface-2:#efece5; --ink:#1d1a15;
    --ink-mid:#5b554a; --ink-soft:#8f8877; --line:#e2ded4; --line-2:#d8d3c7;
    --accent:#b06f26; --accent-2:#8a5a24; --accent-wash:#f0e4d1;
    --good:#4c7a51; --good-wash:#dde9dd; --warn:#b0522a; --warn-wash:#f2e0d4;
    --cell-empty:#e6e1d6;
    --shadow:0 1px 2px rgba(40,32,18,.05), 0 10px 26px -16px rgba(40,32,18,.18);
    --serif:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Songti SC",serif;
    --sans:"Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,Meiryo,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#131109; --surface:#1d1a12; --surface-2:#26221a; --ink:#efe8da;
      --ink-mid:#a89e8b; --ink-soft:#7d7566; --line:#2f2b21; --line-2:#3a352a;
      --accent:#d59a4d; --accent-2:#e0ab63; --accent-wash:#362a19;
      --good:#7fae82; --good-wash:#23301f; --warn:#d9825a; --warn-wash:#39251a;
      --cell-empty:#2c281e;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 30px -18px rgba(0,0,0,.65);
    }
  }
  :root[data-theme="light"]{
    --paper:#f5f4f0; --surface:#fffefb; --surface-2:#efece5; --ink:#1d1a15;
    --ink-mid:#5b554a; --ink-soft:#8f8877; --line:#e2ded4; --line-2:#d8d3c7;
    --accent:#b06f26; --accent-2:#8a5a24; --accent-wash:#f0e4d1;
    --good:#4c7a51; --good-wash:#dde9dd; --warn:#b0522a; --warn-wash:#f2e0d4;
    --cell-empty:#e6e1d6;
    --shadow:0 1px 2px rgba(40,32,18,.05), 0 10px 26px -16px rgba(40,32,18,.18);
  }
  :root[data-theme="dark"]{
    --paper:#131109; --surface:#1d1a12; --surface-2:#26221a; --ink:#efe8da;
    --ink-mid:#a89e8b; --ink-soft:#7d7566; --line:#2f2b21; --line-2:#3a352a;
    --accent:#d59a4d; --accent-2:#e0ab63; --accent-wash:#362a19;
    --good:#7fae82; --good-wash:#23301f; --warn:#d9825a; --warn-wash:#39251a;
    --cell-empty:#2c281e;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 30px -18px rgba(0,0,0,.65);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink); font-family:var(--sans);
    line-height:1.6; -webkit-font-smoothing:antialiased; font-feature-settings:"palt" 1; -webkit-text-size-adjust:100%;
  }
  .tnum{font-variant-numeric:tabular-nums;}

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--paper) 88%, transparent);
    backdrop-filter:saturate(1.3) blur(10px); -webkit-backdrop-filter:saturate(1.3) blur(10px);
    border-bottom:1px solid var(--line); padding:calc(env(safe-area-inset-top) + 12px) 0 12px;
  }
  /* ヘッダーの中身は本文と同じ幅・同じ左右余白に揃える */
  .topbar .inner{
    max-width:560px; margin:0 auto; padding:0 16px;
    display:flex; align-items:center; gap:10px;
  }
  .brand{display:flex; align-items:center; gap:10px; min-width:0;}
  .brand .cube{
    width:22px; height:22px; flex:none;
    background:
      linear-gradient(var(--accent),var(--accent)) left top/9px 9px no-repeat,
      linear-gradient(var(--accent),var(--accent)) right top/9px 9px no-repeat,
      linear-gradient(var(--accent-2),var(--accent-2)) center bottom/9px 9px no-repeat;
  }
  .brand h1{font-family:var(--serif); font-weight:600; font-size:1.1rem; margin:0; letter-spacing:.02em; white-space:nowrap;}
  .spacer{flex:1;}
  .iconbtn{
    width:34px; height:34px; flex:none; border:1px solid var(--line); background:var(--surface);
    border-radius:9px; color:var(--ink-mid); display:grid; place-items:center; cursor:pointer;
    text-decoration:none; padding:0;
  }
  .iconbtn:active{transform:scale(.94);}
  .iconbtn.on{color:var(--accent); border-color:var(--accent); background:var(--accent-wash);}
  .sync-dot{width:8px; height:8px; border-radius:50%; background:var(--ink-soft); flex:none;}
  .sync-dot.ok{background:var(--good);} .sync-dot.off{background:var(--accent);}

  /* ---------- メニュー（三本線 → 引き出し） ----------
     z-index は戻るボタン（#tsumikiEdge=999 / #tsumikiPeek=1001）より上。
     開いている間は左端エッジスワイプ（戻る）を覆って誤爆を防ぐ。 */
  .menu-mask{
    position:fixed; inset:0; background:rgba(24,19,10,.42); z-index:1010;
    opacity:0; pointer-events:none; transition:opacity .22s;
  }
  .menu-mask.show{opacity:1; pointer-events:auto;}
  .drawer{
    position:fixed; top:0; left:0; bottom:0; width:min(80vw,286px); z-index:1011;
    background:var(--surface); border-right:1px solid var(--line);
    box-shadow:0 0 44px -10px rgba(24,19,10,.4);
    transform:translateX(-101%); transition:transform .26s cubic-bezier(.22,.61,.36,1);
    padding:calc(env(safe-area-inset-top) + 14px) 12px calc(env(safe-area-inset-bottom) + 14px);
    display:flex; flex-direction:column; gap:12px; overflow-y:auto; overscroll-behavior:contain;
  }
  .drawer.show{transform:none;}
  .dr-head{display:flex; align-items:center; gap:9px; padding:2px 8px 12px; border-bottom:1px solid var(--line);}
  .dr-head .cube{
    width:18px; height:18px; flex:none;
    background:
      linear-gradient(var(--accent),var(--accent)) left top/7px 7px no-repeat,
      linear-gradient(var(--accent),var(--accent)) right top/7px 7px no-repeat,
      linear-gradient(var(--accent-2),var(--accent-2)) center bottom/7px 7px no-repeat;
  }
  .dr-head b{font-family:var(--serif); font-weight:600; font-size:.98rem; letter-spacing:.02em;}
  .dr-nav{display:grid; gap:3px;}
  .dr-item{
    display:flex; align-items:center; gap:11px; padding:12px 11px; border-radius:12px;
    text-decoration:none; color:var(--ink); font-size:.95rem; font-weight:700; line-height:1.35;
    width:100%; text-align:left; background:transparent; border:none; font-family:var(--sans); cursor:pointer;
  }
  .dr-item svg{
    width:19px; height:19px; flex:none; color:var(--ink-soft);
    stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round;
  }
  .dr-item:active{background:var(--surface-2);}
  .dr-item.current{background:var(--accent-wash); color:var(--accent-2);}
  .dr-item.current svg{color:var(--accent-2);}
  .dr-item.soon{color:var(--ink-soft); font-weight:600;}
  .dr-item .soon-tag{
    margin-left:auto; flex:none; font-size:.66rem; font-weight:700; letter-spacing:.04em;
    color:var(--ink-soft); border:1px solid var(--line-2); border-radius:99px; padding:2px 7px;
  }
  .dr-note{margin-top:auto; padding:12px 10px 0; font-size:.72rem; color:var(--ink-soft); line-height:1.5;}

  /* ---------- tabs / layout ---------- */
  main{max-width:560px; margin:0 auto; padding:16px 16px calc(env(safe-area-inset-bottom) + 40px); display:grid; gap:15px;}
  .tabs{
    display:grid; grid-template-columns:1fr 1fr; gap:5px; background:var(--surface-2);
    border:1px solid var(--line); border-radius:13px; padding:5px;
  }
  .tabs button{
    border:none; background:transparent; color:var(--ink-mid); font-family:var(--sans);
    font-size:.95rem; font-weight:700; padding:10px 6px; border-radius:9px; cursor:pointer;
  }
  .tabs button.active{background:var(--surface); color:var(--ink); box-shadow:var(--shadow);}
  .page{display:none; gap:15px; min-width:0;}
  .page.active{display:grid;}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow); padding:18px 19px;}

  /* ---------- 道具箱（別ページに飛ばず、この画面の中で開く） ---------- */
  #toolPane{display:none; grid-column:1/-1;}
  .tool-frame{display:none; width:100%; border:0; background:var(--paper);}
  .tool-frame.active{display:block;}
  body.tool-on #toolPane{display:block;}
  body.tool-on main{max-width:none; padding:0; grid-template-columns:1fr; gap:0;}
  body.tool-on .tabs{display:none !important;}
  body.tool-on .page{display:none !important;}
  body.tool-on{overflow:hidden;}
  #backBtn{display:none;}
  body.tool-on #backBtn{display:grid;}
  body.tool-on #notifyBtn, body.tool-on #syncDot{display:none;}
  .label{font-size:.74rem; font-weight:700; letter-spacing:.06em; color:var(--accent-2); text-transform:uppercase;}

  @media (min-width:1080px){
    main{
      max-width:1180px; grid-template-columns:minmax(0,1.06fr) minmax(0,.94fr);
      align-items:start; gap:22px; padding-top:22px;
    }
    .topbar .inner{max-width:1180px;}
    .tabs{display:none;}
    .page{display:grid !important;}
    /* 右カラム（卒業まで）は短く終わるので、左を読み進めても付いてくる */
    #pageGrad{
      position:sticky; top:82px; align-self:start;
      max-height:calc(100vh - 100px); overflow-y:auto; overscroll-behavior:contain;
      padding:2px 3px 4px 0; scrollbar-width:thin;
    }
    #pageGrad::-webkit-scrollbar{width:7px;}
    #pageGrad::-webkit-scrollbar-thumb{background:var(--line-2); border-radius:99px;}
    #pageGrad::-webkit-scrollbar-track{background:transparent;}
  }
  /* サブディスプレイ（iPad mini 縦置き等）：縦長の広め画面はタブなしで縦積み常時表示 */
  @media (min-width:600px) and (max-width:1079px) and (orientation:portrait){
    main{max-width:660px;}
    .topbar .inner{max-width:660px;}
    .tabs{display:none;}
    .page{display:grid !important;}
  }

  /* ---------- progress bar ---------- */
  .bar{height:9px; background:var(--cell-empty); border-radius:99px; overflow:hidden;}
  .bar i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--accent),var(--accent-2)); border-radius:99px; transition:width .35s ease;}
  .bar.good i{background:linear-gradient(90deg,var(--good),#3f6a44);}

  /* ---------- week card ---------- */
  .week-top{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:baseline; gap:4px 10px; margin-bottom:4px;}
  .week-range{font-size:.78rem; color:var(--ink-soft);}
  .week-pct{display:flex; align-items:baseline; gap:8px; margin:8px 0 8px;}
  .week-pct .big{font-family:var(--serif); font-weight:600; font-size:2rem; line-height:1;}
  .week-pct .sub{font-size:.82rem; color:var(--ink-mid); font-weight:700;}
  .week-done-msg{margin-top:10px; text-align:center; font-weight:700; color:var(--good); font-size:.93rem;}

  /* ---------- tasks ---------- */
  .tasks{display:grid; gap:11px;}
  .task{
    display:flex; align-items:center; gap:13px; width:100%; cursor:pointer;
    background:var(--surface-2); border:1.5px solid var(--line); border-radius:14px; padding:13px 14px;
    transition:background .18s, border-color .18s; -webkit-user-select:none; user-select:none;
  }
  .task:active{transform:scale(.99);}
  .task .tick{
    width:34px; height:34px; flex:none; border:2px solid var(--line-2); border-radius:50%;
    display:grid; place-items:center; font-size:.82rem; font-weight:700; color:var(--ink-mid);
    background:var(--surface); transition:.18s;
  }
  .task.some .tick{border-color:var(--accent); color:var(--accent-2);}
  .task.done{background:var(--good-wash); border-color:var(--good);}
  .task.done .tick{background:linear-gradient(155deg,var(--good),#3f6a44); border-color:transparent; color:#fff;}
  .task .tbody{flex:1; min-width:0; display:grid; gap:7px;}
  .task .ttext{font-size:1.02rem; line-height:1.4; word-break:break-word;}
  .task.done .ttext{color:var(--ink-mid);}
  .task .tbar{height:6px;}
  .task .tcount{flex:none; font-size:.84rem; font-weight:700; color:var(--ink-mid); min-width:2.6em; text-align:right;}
  .task .dec{
    flex:none; width:32px; height:32px; border-radius:9px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink-soft); font-size:1.15rem; line-height:1; cursor:pointer;
    display:grid; place-items:center;
  }
  .task .dec:active{transform:scale(.92);}
  .task .dec[disabled]{opacity:.35; pointer-events:none;}

  /* ---------- 枝分かれAction（タスク直下に縦ラインでぶら下げる） ---------- */
  .taskwrap{display:grid; gap:0;}
  .acts{
    display:grid; gap:2px; margin:6px 0 0 14px; padding:2px 0 2px 11px;
    border-left:2px solid var(--line);
  }
  .act{
    display:flex; align-items:center; gap:8px; padding:7px 6px; border-radius:10px;
    background:transparent; border:1px solid transparent; cursor:pointer;
    -webkit-user-select:none; user-select:none; transition:background .15s, border-color .15s;
  }
  @media (hover:hover){ .act:hover{background:var(--surface-2);} }
  .act:active{transform:scale(.99);}
  .act .adot{
    width:20px; height:20px; flex:none; border:1.5px solid var(--line-2); border-radius:50%;
    display:grid; place-items:center; color:transparent; background:var(--surface); transition:.15s;
  }
  .act.done{border-color:var(--good); background:var(--good-wash);}
  .act.done .adot{background:var(--good); border-color:transparent; color:#fff;}
  .act .atext{flex:1; min-width:0; font-size:.88rem; line-height:1.4; color:var(--ink); word-break:break-word;}
  .act.done .atext{color:var(--ink-soft); text-decoration:line-through; text-decoration-color:var(--line-2);}
  .act .amemo{
    flex:none; width:30px; height:30px; border:none; background:transparent; border-radius:8px;
    color:var(--ink-soft); display:grid; place-items:center; cursor:pointer; opacity:.75;
  }
  .act .amemo.has{color:var(--accent-2); opacity:1;}
  .act .amemo:active{transform:scale(.9);}
  .anote{
    display:block; margin:-1px 0 5px 34px; padding:0 6px 0 0; font-size:.8rem; line-height:1.5;
    color:var(--ink-soft); white-space:pre-wrap; word-break:break-word; cursor:pointer;
  }
  .anote-ed{display:grid; gap:8px; margin-left:34px; padding:2px 0 6px;}
  .anote-ed textarea{
    width:100%; border:1.5px solid var(--accent); background:var(--surface); border-radius:10px;
    padding:9px 12px; font-size:16px; color:var(--ink); font-family:var(--sans); resize:none; line-height:1.5;
  }
  .anote-ed .row{display:flex; gap:8px; justify-content:flex-end;}
  .btn.sm{flex:none; padding:9px 16px; font-size:.88rem; border-radius:10px;}
  .aprog{font-size:.72rem; color:var(--ink-soft); font-weight:700; letter-spacing:.04em; padding:0 0 3px 9px;}
  .aprog.full{color:var(--good);}
  .autochip{
    flex:none; align-self:flex-start; font-size:.66rem; font-weight:700; letter-spacing:.03em;
    color:var(--good); background:var(--good-wash); border:1px solid var(--good);
    border-radius:999px; padding:2px 7px; line-height:1.4; white-space:nowrap;
  }

  .empty-week{display:grid; gap:12px; justify-items:center; text-align:center; padding:8px 0 2px;}
  .empty-week .em{font-size:2rem;}
  .empty-week p{margin:0; color:var(--ink-mid); font-size:.94rem;}
  .empty-week .hint{font-size:.8rem; color:var(--ink-soft);}
  .btnrow{display:flex; gap:10px; width:100%;}
  .btn{flex:1; border-radius:12px; padding:14px; font-size:1rem; font-weight:700; font-family:var(--sans); cursor:pointer; border:1.5px solid var(--line);}
  .btn.primary{background:linear-gradient(155deg,var(--accent),var(--accent-2)); color:#fff; border-color:transparent;}
  .btn.ghost{background:var(--surface); color:var(--ink-mid);}
  .btn:active{transform:scale(.98);}
  .edit-link{border:none; background:transparent; color:var(--ink-soft); font-size:.82rem; cursor:pointer; text-decoration:underline; text-underline-offset:3px; font-family:var(--sans); padding:2px 4px;}
  .card-foot{display:flex; justify-content:center; gap:14px; margin-top:13px;}

  /* ---------- review ---------- */
  .review-banner{
    display:flex; align-items:center; gap:12px; background:var(--warn-wash); border:1.5px solid var(--warn);
    border-radius:15px; padding:14px 15px; cursor:pointer;
  }
  .review-banner .rb-t{flex:1; min-width:0;}
  .review-banner b{font-size:.98rem;}
  .review-banner p{margin:2px 0 0; font-size:.8rem; color:var(--ink-mid);}
  .review-banner .go{flex:none; font-weight:700; color:var(--warn); font-size:.9rem; white-space:nowrap;}
  .review-sum{display:grid; gap:8px;}
  .review-sum .rs-head{display:flex; align-items:center; gap:9px;}
  .chip{display:inline-flex; align-items:center; gap:5px; font-size:.8rem; font-weight:700; padding:3px 11px; border-radius:99px; border:1.5px solid var(--line); color:var(--ink-mid); white-space:nowrap;}
  .chip.done{background:var(--good-wash); border-color:var(--good); color:var(--good);}
  .chip.partial{background:var(--accent-wash); border-color:var(--accent); color:var(--accent-2);}
  .chip.miss{background:var(--warn-wash); border-color:var(--warn); color:var(--warn);}
  .review-sum .growth{font-size:.93rem; color:var(--ink); white-space:pre-wrap; word-break:break-word;}
  .review-sum .nextnote{font-size:.85rem; color:var(--ink-mid); white-space:pre-wrap; word-break:break-word;}

  /* ---------- editors ---------- */
  .editor label{display:block; font-size:.76rem; font-weight:700; color:var(--ink-mid); margin:0 0 6px;}
  .ed-field{margin-bottom:15px;}
  .editor textarea, .editor input[type=text], .editor input[type=number]{
    width:100%; border:1.5px solid var(--line); background:var(--surface-2); border-radius:11px;
    padding:11px 13px; font-size:16px; color:var(--ink); font-family:var(--sans); resize:none; line-height:1.5;
  }
  .editor textarea:focus, .editor input:focus{outline:2px solid var(--accent-wash); border-color:var(--accent);}
  .task-in-row{display:flex; align-items:center; gap:8px; margin-bottom:9px;}
  .task-in-row input[type=text]{flex:1; min-width:0;}
  .task-in-row .num{width:74px; flex:none; text-align:center;}
  .task-in-row .numlab{flex:none; font-size:.74rem; color:var(--ink-soft);}
  .task-in-row .rm{border:none; background:transparent; color:var(--ink-soft); font-size:1.3rem; cursor:pointer; padding:2px 6px; flex:none;}
  .editor .acts-in{margin:0 0 14px; padding:9px 12px; font-size:16px; line-height:1.5; border-style:dashed;}
  .add-row{border:none; background:transparent; color:var(--accent-2); font-weight:700; font-size:.88rem; cursor:pointer; padding:3px 0;}
  .ed-actions{display:flex; gap:10px; margin-top:18px;}
  .seg{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .seg button{
    border:1.5px solid var(--line); background:var(--surface-2); border-radius:11px; padding:12px 6px;
    font-family:var(--sans); font-size:.92rem; font-weight:700; color:var(--ink-mid); cursor:pointer;
  }
  .seg button.sel-done{background:var(--good-wash); border-color:var(--good); color:var(--good);}
  .seg button.sel-partial{background:var(--accent-wash); border-color:var(--accent); color:var(--accent-2);}
  .seg button.sel-miss{background:var(--warn-wash); border-color:var(--warn); color:var(--warn);}
  .rv-auto{background:var(--surface-2); border:1px solid var(--line); border-radius:11px; padding:10px 13px; font-size:.86rem; color:var(--ink-mid); margin-bottom:15px;}

  /* ---------- page2: vision / countdown ---------- */
  .vision-slogan{font-family:var(--serif); font-weight:600; font-size:1.3rem; line-height:1.5; letter-spacing:.01em; margin:6px 0 8px; text-wrap:balance;}
  .vision-title{font-size:.95rem; color:var(--ink-mid);}
  .count-wrap{display:flex; align-items:baseline; gap:10px; margin:8px 0 4px; flex-wrap:wrap;}
  .count-wrap .big{font-family:var(--serif); font-weight:600; font-size:2.6rem; line-height:1;}
  .count-wrap .unit{font-size:.95rem; color:var(--ink-mid); font-weight:700;}
  .count-wrap .weeks{font-size:.88rem; color:var(--ink-soft);}
  .count-foot{display:flex; justify-content:space-between; font-size:.74rem; color:var(--ink-soft); margin-top:7px;}

  /* ---------- months ---------- */
  .months{display:grid; gap:9px; margin-top:12px;}
  .month{
    display:flex; align-items:center; gap:12px; background:var(--surface-2); border:1.5px solid var(--line);
    border-radius:13px; padding:12px 14px; cursor:pointer; transition:border-color .18s;
  }
  .month:active{transform:scale(.995);}

  /* ---------- toast ---------- */

<script>
/* ===================== Supabase（つみき共通プロジェクト） ===================== */
const SUPABASE_URL  = 'https://okbjqtdirrathscctyvx.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9rYmpxdGRpcnJhdGhzY2N0eXZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzMjI4NTIsImV4cCI6MjA5NTg5ODg1Mn0.T-1AOK6vCD6uGdqrVGXjPui3L6WPSNrnygS-IHyfZ6Y';
const sb = (window.supabase && window.supabase.createClient) ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON) : null;
const STATE_TABLE = 'tsumiki_roadmap_state';
const STATE_ID = 'kodai_sotsugyo_v1';           /* 旧 習慣トラッカー(id:'kodai')とは別の行。旧データは残す */
const KEY = 'tsumiki_dokuritsu_v3';
const NKEY = 'tsumiki_dokuritsu_notify';
const NSTAMP = 'tsumiki_dokuritsu_notified';

/* ===================== ユーティリティ ===================== */
function uid(){ return Date.now().toString(36) + Math.floor(Math.random()*1e6).toString(36); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function autoGrow(el){ el.style.height='auto'; el.style.height=(el.scrollHeight+2)+'px'; }
const WD = ['日','月','火','水','木','金','土'];
function iso(d){ const z=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate()); }
function todayISO(){ return iso(new Date()); }
function parseISO(s){ const [y,m,d]=String(s).split('-').map(Number); return new Date(y,(m||1)-1,d||1); }
function addDays(s,n){ const d=parseISO(s); d.setDate(d.getDate()+n); return iso(d); }
function sundayOf(s){ const d=parseISO(s); d.setDate(d.getDate()-d.getDay()); return iso(d); }
function fmtMD(s){ const d=parseISO(s); return (d.getMonth()+1)+'/'+d.getDate(); }
function ymNow(){ return todayISO().slice(0,7); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1700); }

/* ===================== 状態 ===================== */
function blank(){
  return {
    v:3,
    vision:{
      slogan:'カチカチ → 勝ち価値 → 勝って価値をつくる',
      title:'Appleを卒業して、つみき事業へ完全移行する',
      deadline:'2026-12-31'
    },
    months:['2026-08','2026-09','2026-10','2026-11','2026-12'].map(ym=>({ym, goal:'', status:'', note:''})),
    weeks:{},          /* key = 週の始まり（日曜）のISO日付 */
    settings:{ reviewHour:17 }
  };
}
let db = blank();
let online = null;
let lastPushed = '';
let mode = null;          /* null | 'tasks' | 'review' | {type:'month', ym} */
let draft = null;
let activeTab = 'week';

function migrate(){
  const b=blank();
  if(!db.vision || typeof db.vision!=='object') db.vision=b.vision;
  ['slogan','title','deadline'].forEach(k=>{ if(typeof db.vision[k]!=='string') db.vision[k]=b.vision[k]; });
  if(!Array.isArray(db.months)) db.months=b.months;
  db.months=db.months.filter(m=>m && m.ym);
  db.months.forEach(m=>{ if(typeof m.goal!=='string') m.goal=''; if(typeof m.status!=='string') m.status=''; if(typeof m.note!=='string') m.note=''; });
  db.months.sort((a,b2)=>a.ym<b2.ym?-1:1);
  if(!db.weeks || typeof db.weeks!=='object') db.weeks={};
  Object.keys(db.weeks).forEach(k=>{
    const w=db.weeks[k];
    if(!w || typeof w!=='object'){ delete db.weeks[k]; return; }
    if(!Array.isArray(w.tasks)) w.tasks=[];
    w.tasks.forEach(t=>{
      if(!t.id) t.id=uid();
      if(typeof t.text!=='string') t.text='';
      t.target=Math.max(1, Math.floor(+t.target||1));
      t.count=Math.min(Math.max(0, Math.floor(+t.count||0)), t.target);
      t.autoDone=!!t.autoDone;
      t.autoPrev=Math.min(Math.max(0, Math.floor(+t.autoPrev||0)), t.target);
      if(!Array.isArray(t.actions)) t.actions=[];
      t.actions=t.actions.filter(a=>a && typeof a.text==='string' && a.text);
      t.actions.forEach(a=>{ if(!a.id) a.id=uid(); a.done=!!a.done; if(typeof a.note!=='string') a.note=''; });
    });
    if(w.review && typeof w.review!=='object') w.review=null;
  });
  if(!db.settings || typeof db.settings!=='object') db.settings=b.settings;
  /* 旧「声かけタブ」の名残を掃除（声かけメモは koekake.html に独立） */
  if('people' in db) delete db.people;
}

/* ===================== 永続化・同期 ===================== */
function loadLocal(){ try{ const s=localStorage.getItem(KEY); if(s){ db=Object.assign(blank(), JSON.parse(s)); migrate(); } }catch(e){} }
let saveTimer=null;
function save(){
  localStorage.setItem(KEY, JSON.stringify(db));
  if(!sb) return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    lastPushed = JSON.stringify(db);
    const { error } = await sb.from(STATE_TABLE).upsert({ id:STATE_ID, state:db, updated_at:new Date().toISOString() });
    if(error){ online=false; } else if(online!==true){ online=true; }
    renderSync();
  }, 350);
}
async function loadRemote(){
  if(!sb){ online=false; renderSync(); return; }
  const { data, error } = await sb.from(STATE_TABLE).select('state').eq('id',STATE_ID).maybeSingle();
  if(error){ online=false; renderSync(); return; }
  online=true;
  if(data && data.state && typeof data.state==='object'){
    db=Object.assign(blank(), data.state); migrate();
    localStorage.setItem(KEY, JSON.stringify(db));
    if(!mode) render();
  } else if(Object.keys(db.weeks).length || db.months.some(m=>m.goal)){ save(); }
  renderSync();
}
function subscribeRealtime(){
  if(!sb) return;
  sb.channel('tsumiki-dokuritsu-rt')
    .on('postgres_changes', { event:'*', schema:'public', table:STATE_TABLE, filter:'id=eq.'+STATE_ID }, (payload)=>{
      const incoming = JSON.stringify((payload.new && payload.new.state) || {});
      if(incoming === lastPushed) return;
      if(mode) return;
      const active=document.activeElement;
      if(active && /INPUT|TEXTAREA/.test(active.tagName)) return;
      if(payload.new && payload.new.state){
        db=Object.assign(blank(), payload.new.state); migrate();
        localStorage.setItem(KEY, JSON.stringify(db));
        render();
      }
    }).subscribe();
}
function renderSync(){
  const dot=document.getElementById('syncDot');
  dot.classList.remove('ok','off');
  if(!sb){ dot.title='この端末に保存'; return; }
  if(online===true){ dot.classList.add('ok'); dot.title='クラウド同期中'; }
  else if(online===false){ dot.classList.add('off'); dot.title='オフライン'; }
}

/* ===================== 計算 ===================== */
function weekKey(){ return sundayOf(todayISO()); }
function getWeek(k){ return db.weeks[k] || {tasks:[], review:null}; }
function ensureWeek(k){ if(!db.weeks[k]) db.weeks[k]={tasks:[], review:null}; return db.weeks[k]; }
function weekStats(w){
  let done=0, total=0;
  (w.tasks||[]).forEach(t=>{ done+=Math.min(t.count,t.target); total+=t.target; });
  return { done, total, pct: total ? Math.round(done/total*100) : 0 };
}
/* 枝分かれAction が全部おわったら、元のタスクも自動で「達成」にする。
   自動で達成にした分だけは、枝分かれを外したときに元のカウントへ戻す（手動達成には触れない）。
   戻り値: 'done'（自動達成した）/ 'undone'（自動達成を取り消した）/ null（変化なし） */
function syncAutoDone(t){
  const acts=t.actions||[];
  if(!acts.length){ t.autoDone=false; return null; }
  if(acts.every(a=>a.done)){
    if(t.count>=t.target) return null;      // すでに手動で達成済みなら触らない
    t.autoPrev=t.count; t.count=t.target; t.autoDone=true;
    return 'done';
  }
  if(t.autoDone){
    t.count=Math.min(Math.max(0, t.autoPrev||0), t.target); t.autoDone=false;
    return 'undone';
  }
  return null;
}
function prevWeekWithTasks(){
  const cur=weekKey();
  const keys=Object.keys(db.weeks).filter(k=>k<cur && (db.weeks[k].tasks||[]).length).sort();
  return keys.length ? keys[keys.length-1] : null;
}
function daysLeft(){
  const dl=db.vision.deadline||'2026-12-31';
  return Math.max(0, Math.round((parseISO(dl) - parseISO(todayISO())) / 864e5));
}
function reviewBannerOn(){
  const wd=new Date().getDay();
  return (wd===5 || wd===6) && !getWeek(weekKey()).review;
}

/* ===================== 描画 ===================== */
const pageWeek=document.getElementById('pageWeek');
const pageGrad=document.getElementById('pageGrad');
function render(){ renderWeekPage(); renderGradPage(); renderNotifyBtn(); renderSync(); }

function renderWeekPage(){
  if(mode==='tasks'){ pageWeek.innerHTML=taskEditorHTML(); focusEnd('#tin-0'); return; }
  if(mode==='review'){ pageWeek.innerHTML=reviewEditorHTML(); const g=document.getElementById('rvGrowth'); if(g) autoGrow(g); const n=document.getElementById('rvNext'); if(n) autoGrow(n); return; }

  const k=weekKey();
  const w=getWeek(k);
  const st=weekStats(w);
  const today=parseISO(todayISO());
  let h='';

  /* 金曜バナー */
  if(reviewBannerOn()){
    h+=`<div class="review-banner" data-act="open-review">
      <span style="font-size:1.5rem;">🗓</span>
      <span class="rb-t"><b>金曜の振り返り</b><p>今週の目標、どうだった？ 達成・未達・成長を記録しよう。</p></span>
      <span class="go">書く ›</span>
    </div>`;
  }

  /* 今週の目標カード */
  h+=`<div class="card">
    <div class="week-top">
      <span class="label">今週の目標</span>
      <span class="week-range tnum">${fmtMD(k)}(日) – ${fmtMD(addDays(k,6))}(土) ・ 今日 ${today.getMonth()+1}/${today.getDate()}(${WD[today.getDay()]})</span>
    </div>`;

  if(w.tasks.length){
    h+=`<div class="week-pct"><span class="big tnum">${st.pct}<span style="font-size:1.1rem;">%</span></span><span class="sub tnum">${st.done} / ${st.total}</span></div>
    <div class="bar ${st.pct>=100?'good':''}" style="margin-bottom:15px;"><i style="width:${st.pct}%"></i></div>
    <div class="tasks">`;
    w.tasks.forEach(t=>{
      const full=t.count>=t.target;
      const cls=full?'done':(t.count>0?'some':'');
      const pct=Math.round(Math.min(t.count,t.target)/t.target*100);
      const tick = full
        ? `<svg viewBox="0 0 24 24" style="width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round"><path d="M5 12.5l4 4 10-10"/></svg>`
        : (t.target>1 ? `<span class="tnum">${t.count}</span>` : '');
      const acts=t.actions||[];
      let actsH='';
      if(acts.length){
        const aDone=acts.filter(a=>a.done).length;
        const aAll=aDone===acts.length;
        actsH=`<div class="acts"><span class="aprog tnum ${aAll?'full':''}">枝分かれ ${aDone}/${acts.length}${aAll?' ・完了':''}</span>`+acts.map(a=>{
          let s=`<span class="act ${a.done?'done':''}" data-act="act-toggle" data-tid="${t.id}" data-aid="${a.id}" role="button" tabindex="0" aria-label="${esc(a.text)}${a.done?'（済）':''}">
            <span class="adot"><svg viewBox="0 0 24 24" style="width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round"><path d="M5 12.5l4 4 10-10"/></svg></span>
            <span class="atext">${esc(a.text)}</span>
            <button class="amemo ${a.note?'has':''}" data-act="act-note" data-tid="${t.id}" data-aid="${a.id}" aria-label="メモ${a.note?'を編集':'を書く'}">
              <svg viewBox="0 0 24 24" style="width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
            </button>
          </span>`;
          if(mode && typeof mode==='object' && mode.type==='actnote' && mode.tid===t.id && mode.aid===a.id){
            s+=`<span class="anote-ed"><textarea id="anoteIn" rows="2" placeholder="このActionのメモ（気づき・結果・連絡先など）">${esc(draft.note)}</textarea>
              <span class="row"><button class="btn ghost sm" data-act="anote-cancel">キャンセル</button><button class="btn primary sm" data-act="anote-save">保存</button></span></span>`;
          } else if(a.note){
            s+=`<span class="anote" data-act="act-note" data-tid="${t.id}" data-aid="${a.id}" role="button" tabindex="0" aria-label="メモを編集">${esc(a.note)}</span>`;
          }
          return s;
        }).join('')+`</div>`;
      }
      h+=`<div class="taskwrap"><div class="task ${cls}" data-act="inc" data-id="${t.id}" role="button" tabindex="0" aria-label="${esc(t.text)} ${t.count}/${t.target}">
        <span class="tick">${tick}</span>
        <span class="tbody"><span class="ttext">${esc(t.text)}</span>${t.autoDone?'<span class="autochip">枝分かれ完了で自動達成</span>':''}${t.target>1?`<span class="bar tbar ${full?'good':''}"><i style="width:${pct}%"></i></span>`:''}</span>
        ${t.target>1?`<span class="tcount tnum">${t.count}/${t.target}</span>`:''}
        <button class="dec" data-act="dec" data-id="${t.id}" ${t.count===0?'disabled':''} aria-label="1つ戻す">−</button>
      </div>${actsH}</div>`;
    });
    h+=`</div>`;
    if(st.pct>=100) h+=`<div class="week-done-msg">🎉 今週の目標 すべて達成！</div>`;
    h+=`<div class="card-foot"><button class="edit-link" data-act="edit-tasks">目標を編集</button>${w.review?'':'<button class="edit-link" data-act="open-review">振り返りを書く</button>'}</div>`;
  } else {
    const prev=prevWeekWithTasks();
    h+=`<div class="empty-week">
      <span class="em">🧱</span>
      <p>今週の目標がまだ決まっていません。</p>
      <div class="btnrow">
        ${prev?`<button class="btn ghost" data-act="copy-prev">先週からコピー</button>`:''}
        <button class="btn primary" data-act="edit-tasks">＋ 目標を決める</button>
      </div>
      <span class="hint">Claudeとの週次セッションで決めると、ここに反映されます</span>
    </div>`;
  }
  h+=`</div>`;

  /* 振り返り済みカード */
  if(w.review){
    const r=w.review;
    const lab={done:'○ 達成', partial:'△ 一部達成', miss:'× 未達'}[r.result]||'記録済み';
    h+=`<div class="card" data-act="open-review" style="cursor:pointer;">
      <div class="review-sum">
        <div class="rs-head"><span class="label">今週の振り返り</span><span class="chip ${r.result}">${lab}</span><span style="margin-left:auto;font-size:.76rem;color:var(--ink-soft);">タップで編集</span></div>
        ${r.growth?`<div class="growth">🌱 ${esc(r.growth)}</div>`:''}
        ${r.next?`<div class="nextnote">→ ${esc(r.next)}</div>`:''}
      </div>
    </div>`;
  }

  /* 声かけメモへの導線は三本線メニューに集約したので、ここには置かない */

  pageWeek.innerHTML=h;
}

function renderGradPage(){
  const dl=daysLeft();
  const wl=Math.ceil(dl/7);
  const start=parseISO('2026-01-01');
  const end=parseISO(db.vision.deadline||'2026-12-31');
  const total=Math.max(1,(end-start)/864e5);
  const elapsed=Math.min(total, Math.max(0,(parseISO(todayISO())-start)/864e5));
  const timePct=Math.round(elapsed/total*100);
  let h='';

  /* ビジョン */
  h+=`<div class="card">
    <span class="label">目指す姿</span>
    <div class="vision-slogan">${esc(db.vision.slogan)}</div>
    <div class="vision-title">${esc(db.vision.title)}</div>
  </div>`;

  /* カウントダウン */
  h+=`<div class="card">
    <span class="label">Apple卒業まで</span>
    <div class="count-wrap"><span class="big tnum">${dl}</span><span class="unit">日</span><span class="weeks tnum">（残り ${wl} 週）</span></div>
    <div class="bar"><i style="width:${timePct}%"></i></div>
    <div class="count-foot tnum"><span>2026年 ${timePct}% 経過</span><span>卒業予定 ${fmtMD(db.vision.deadline||'2026-12-31')}</span></div>
  </div>`;

  /* 月別マイルストーン */
  h+=`<div class="card"><span class="label">月別マイルストーン</span><div class="months">`;
  const nowYm=ymNow();
  let anyGoal=false;
  db.months.forEach(m=>{
    if(mode && typeof mode==='object' && mode.type==='month' && mode.ym===m.ym){
      h+=monthEditorHTML(m); return;
    }
    if(m.goal) anyGoal=true;
    const mm=+m.ym.slice(5,7);
    const cur=m.ym===nowYm;
    let chip='';
    if(m.status==='done') chip=`<span class="chip done">○ 達成</span>`;
    else if(m.status==='partial') chip=`<span class="chip partial">△ 一部</span>`;
    else if(m.status==='miss') chip=`<span class="chip miss">× 未達</span>`;
    else if(cur) chip=`<span class="chip">進行中</span>`;
    h+=`<div class="month ${cur?'now':''}" data-act="month-open" data-ym="${m.ym}" role="button" tabindex="0">
      <span class="m tnum">${mm}月</span>
      <span class="mg ${m.goal?'':'unset'}">${m.goal?esc(m.goal):'タップして目標を設定'}</span>
      ${chip}
    </div>`;
  });
  h+=`</div>`;
  if(!anyGoal) h+=`<div class="hist-empty" style="margin-top:11px;">各月の目標は、Claudeとの目標セッションで決めて流し込めます。</div>`;
  h+=`</div>`;

  /* 週次振り返りの履歴 */
  const keys=Object.keys(db.weeks).filter(k=>db.weeks[k].review || (db.weeks[k].tasks||[]).length).sort().reverse();
  const withReview=keys.filter(k=>db.weeks[k].review);
  const cnt={done:0,partial:0,miss:0};
  withReview.forEach(k=>{ const r=db.weeks[k].review.result; if(cnt[r]!=null) cnt[r]++; });
  h+=`<div class="card"><span class="label">週次振り返りの記録</span>`;
  if(withReview.length){
    h+=`<div class="stat-row tnum"><span>○ 達成 <b>${cnt.done}</b></span><span>△ 一部 <b>${cnt.partial}</b></span><span>× 未達 <b>${cnt.miss}</b></span></div>`;
    h+=`<div class="hist">`;
    withReview.slice(0,12).forEach(k=>{
      const w=db.weeks[k]; const r=w.review; const st=weekStats(w);
      const lab={done:'○ 達成', partial:'△ 一部', miss:'× 未達'}[r.result]||'';
      h+=`<div class="hist-item">
        <div class="h-top"><span class="chip ${r.result}">${lab}</span><span class="h-range tnum">${fmtMD(k)}–${fmtMD(addDays(k,6))}</span><span class="h-pct tnum">${st.total?st.pct+'%':''}</span></div>
        ${r.growth?`<div class="h-growth">🌱 ${esc(r.growth)}</div>`:''}
      </div>`;
    });
    h+=`</div>`;
  } else {
    h+=`<div class="hist-empty">毎週金曜に振り返りを書くと、ここに積み上がっていきます。</div>`;
  }
  h+=`</div>`;
  pageGrad.innerHTML=h;
}

/* ===================== 操作 ===================== */
document.querySelector('main').addEventListener('click', e=>{
  const btn=e.target.closest('[data-act]'); if(!btn) return;
  const act=btn.dataset.act;

  /* --- 枝分かれActionのメモ --- */
  if(act==='act-note'){
    e.stopPropagation();
    const t=getWeek(weekKey()).tasks.find(x=>x.id===btn.dataset.tid); if(!t) return;
    const a=(t.actions||[]).find(x=>x.id===btn.dataset.aid); if(!a) return;
    draft={ note:a.note||'' };
    mode={type:'actnote', tid:btn.dataset.tid, aid:btn.dataset.aid};
    render();
    const ta=document.getElementById('anoteIn'); if(ta){ autoGrow(ta); ta.focus(); try{ ta.setSelectionRange(ta.value.length, ta.value.length); }catch(err){} }
    return;
  }
  if(act==='anote-cancel'){ mode=null; draft=null; render(); return; }
  if(act==='anote-save'){
    const ta=document.getElementById('anoteIn'); if(ta) draft.note=ta.value;
    const w=ensureWeek(weekKey());
    const t=w.tasks.find(x=>x.id===mode.tid);
    const a=t ? (t.actions||[]).find(x=>x.id===mode.aid) : null;
    if(a) a.note=draft.note.trim();
    mode=null; draft=null; save(); render();
    toast('メモを保存しました');
    return;
  }

  /* --- 枝分かれActionのチェック --- */
  if(act==='act-toggle'){
    e.stopPropagation();
    const w=ensureWeek(weekKey());
    const t=w.tasks.find(x=>x.id===btn.dataset.tid); if(!t) return;
    const a=(t.actions||[]).find(x=>x.id===btn.dataset.aid); if(!a) return;
    a.done=!a.done;
    const r=syncAutoDone(t);
    save(); render();
    if(r==='done') toast('枝分かれ全部クリア！「'+t.text+'」を達成にしました');
    else if(r==='undone') toast('枝分かれを外したので「'+t.text+'」の自動達成を取り消しました');
    else if(a.done && t.actions.every(x=>x.done)) toast('枝分かれ全部クリア！');
    return;
  }

  /* --- タスクのカウント --- */
  if(act==='inc' || act==='dec'){
    if(act==='inc' && e.target.closest('[data-act="dec"]')) return;
    const k=weekKey(); const w=ensureWeek(k);
    const t=w.tasks.find(x=>x.id===btn.dataset.id); if(!t) return;
    if(act==='inc'){ if(t.count>=t.target) return; t.count++; }
    else { e.stopPropagation(); if(t.count<=0) return; t.count--; }
    t.autoDone=false;   // 手で数えたら自動達成の管理から外す（枝分かれを外しても巻き戻さない）
    save(); render();
    if(act==='inc' && t.count>=t.target) toast('「'+t.text+'」達成！');
    return;
  }

  /* --- タスク編集 --- */
  if(act==='edit-tasks'){
    const w=getWeek(weekKey());
    draft={ tasks: w.tasks.length ? w.tasks.map(t=>({id:t.id,text:t.text,target:t.target,count:t.count,actsText:(t.actions||[]).map(a=>a.text).join('\n')})) : [{id:uid(),text:'',target:1,count:0,actsText:''}] };
    mode='tasks'; render(); return;
  }
  if(act==='copy-prev'){
    const pk=prevWeekWithTasks(); if(!pk) return;
    draft={ tasks: db.weeks[pk].tasks.map(t=>({id:uid(),text:t.text,target:t.target,count:0,actsText:(t.actions||[]).map(a=>a.text).join('\n')})) };
    mode='tasks'; render(); return;
  }
  if(act==='add-task'){ syncTaskDraft(); draft.tasks.push({id:uid(),text:'',target:1,count:0,actsText:''}); render(); focusEnd('#tin-'+(draft.tasks.length-1)); return; }
  if(act==='rm-task'){ syncTaskDraft(); draft.tasks.splice(+btn.dataset.i,1); render(); return; }
  if(act==='ed-cancel'){ mode=null; draft=null; render(); return; }
  if(act==='ed-save'){
    syncTaskDraft();
    const w=ensureWeek(weekKey());
    const orig=w.tasks;
    w.tasks=draft.tasks.map(t=>{
      const target=Math.max(1,Math.floor(+t.target||1));
      // 枝分かれ：1行=1Action。既存と同じ文言はチェック状態(done)を引き継ぐ
      const prev=((orig.find(x=>x.id===t.id)||{}).actions)||[];
      const used=new Set();
      const actions=String(t.actsText||'').split('\n').map(s=>s.trim()).filter(Boolean).map(line=>{
        const m=prev.find(p=>!used.has(p.id) && p.text===line);
        if(m){ used.add(m.id); return {id:m.id, text:line, done:!!m.done, note:m.note||''}; }
        return {id:uid(), text:line, done:false, note:''};
      });
      const o=orig.find(x=>x.id===t.id)||{};
      const nt={id:t.id, text:t.text.trim(), target, count:Math.min(t.count||0, target), actions,
                autoDone:!!o.autoDone, autoPrev:Math.min(Math.max(0, Math.floor(+o.autoPrev||0)), target)};
      syncAutoDone(nt);   // 編集で枝分かれが全部済みになった／崩れた場合もここで合わせる
      return nt;
    }).filter(t=>t.text);
    mode=null; draft=null; save(); render();
    toast('今週の目標を保存しました');
    return;
  }

  /* --- 振り返り --- */
  if(act==='open-review'){
    const w=getWeek(weekKey());
    const r=w.review||{};
    draft={ result:r.result||'', growth:r.growth||'', next:r.next||'' };
    mode='review'; render(); return;
  }
  if(act==='rv-result'){ syncReviewDraft(); draft.result=btn.dataset.v; render(); return; }
  if(act==='rv-cancel'){ mode=null; draft=null; render(); return; }
  if(act==='rv-save'){
    syncReviewDraft();
    if(!draft.result){ toast('達成・一部達成・未達 のどれかを選んでね'); return; }
    const w=ensureWeek(weekKey());
    w.review={ result:draft.result, growth:draft.growth.trim(), next:draft.next.trim(), at:todayISO() };
    mode=null; draft=null; save(); render();
    toast('振り返りを保存しました 🌱');
    return;
  }

  /* --- 月別マイルストーン --- */
  if(act==='month-open'){
    const m=db.months.find(x=>x.ym===btn.dataset.ym); if(!m) return;
    draft={ goal:m.goal, status:m.status };
    mode={type:'month', ym:m.ym}; render();
    return;
  }
  if(act==='m-status'){ syncMonthDraft(); draft.status=btn.dataset.v; render(); return; }
  if(act==='m-cancel'){ mode=null; draft=null; render(); return; }
  if(act==='m-save'){
    syncMonthDraft();
    const m=db.months.find(x=>x.ym===mode.ym);
    if(m){ m.goal=draft.goal.trim(); m.status=draft.status; }
    mode=null; draft=null; save(); render();
    toast('マイルストーンを保存しました');
    return;
  }
});

function syncTaskDraft(){
  document.querySelectorAll('.tin').forEach(inp=>{ const i=+inp.dataset.i; if(draft.tasks[i]) draft.tasks[i].text=inp.value; });
  document.querySelectorAll('.tnin').forEach(inp=>{ const i=+inp.dataset.i; if(draft.tasks[i]) draft.tasks[i].target=inp.value; });
  document.querySelectorAll('.acts-in').forEach(inp=>{ const i=+inp.dataset.i; if(draft.tasks[i]) draft.tasks[i].actsText=inp.value; });
}
function syncReviewDraft(){
  const g=document.getElementById('rvGrowth'); if(g) draft.growth=g.value;
  const n=document.getElementById('rvNext'); if(n) draft.next=n.value;
}
function syncMonthDraft(){
  const g=document.getElementById('mGoal'); if(g) draft.goal=g.value;
}
document.querySelector('main').addEventListener('input', e=>{
  if(!draft) return;
  if(e.target.classList.contains('tin')){ const i=+e.target.dataset.i; if(draft.tasks[i]) draft.tasks[i].text=e.target.value; }
  else if(e.target.classList.contains('tnin')){ const i=+e.target.dataset.i; if(draft.tasks[i]) draft.tasks[i].target=e.target.value; }
  else if(e.target.classList.contains('acts-in')){ autoGrow(e.target); const i=+e.target.dataset.i; if(draft.tasks[i]) draft.tasks[i].actsText=e.target.value; }
  else if(e.target.id==='anoteIn'){ autoGrow(e.target); draft.note=e.target.value; }
  else if(e.target.id==='rvGrowth'){ autoGrow(e.target); draft.growth=e.target.value; }
  else if(e.target.id==='rvNext'){ autoGrow(e.target); draft.next=e.target.value; }
  else if(e.target.id==='mGoal'){ draft.goal=e.target.value; }
});

/* ===================== 道具箱（別ページに飛ばず、この画面の中で開く） =====================
   声かけメモ・時給計算・学んだことは、それぞれ独立したHTML（＝別々の保存先・同期先）のまま、
   この画面の中に <iframe> で読み込んで表示する。ページ遷移が起きないので「別サイトに飛んだ」
   感じにならず、一度開いた道具は入力途中のままタブのように行き来できる。 */
const TOOLS = {
  koekake:{ title:'声かけメモ', src:'koekake.html' },
  jikyu  :{ title:'時給計算',   src:'jikyu.html'   },
  manabi :{ title:'学んだこと', src:'manabi.html'  },
};
let activeTool = '';

function currentTheme(){ return document.documentElement.getAttribute('data-theme') || ''; }
function sizeToolFrames(){
  const h=document.querySelector('.topbar').offsetHeight;
  document.querySelectorAll('.tool-frame').forEach(f=>{ f.style.height='calc(100dvh - '+h+'px)'; });
}
function postToTool(f){ try{ f.contentWindow.postMessage({type:'tsumiki-embed-theme', theme:currentTheme()}, '*'); }catch(e){} }
function broadcastTheme(){ document.querySelectorAll('.tool-frame').forEach(postToTool); }

function openTool(id, histMode){   /* histMode: 'push'(既定) / 'replace' / 'none' */
  const t=TOOLS[id]||null;
  activeTool = t ? id : '';
  document.body.classList.toggle('tool-on', !!t);
  document.getElementById('appTitle').textContent = t ? t.title : '独立ロードマップ';
  document.querySelectorAll('.dr-item[data-tool]').forEach(x=>{
    const on = (x.dataset.tool||'') === activeTool;
    x.classList.toggle('current', on);
    if(on) x.setAttribute('aria-current','page'); else x.removeAttribute('aria-current');
  });
  const pane=document.getElementById('toolPane');
  if(t){
    let f=pane.querySelector('.tool-frame[data-tool="'+id+'"]');
    if(!f){   /* 初回だけ読み込む。2回目からは開いたままのものを見せる */
      f=document.createElement('iframe');
      f.className='tool-frame'; f.dataset.tool=id; f.title=t.title;
      f.src=t.src+'?embed=1'+(currentTheme()?'&theme='+currentTheme():'');
      f.addEventListener('load', ()=>postToTool(f));
      pane.appendChild(f);
    }
    pane.querySelectorAll('.tool-frame').forEach(x=>x.classList.toggle('active', x===f));
    sizeToolFrames();
    window.scrollTo(0,0);
  }
  /* URLの #jikyu などを合わせる → 端末の「戻る」でロードマップへ帰れる */
  if(histMode!=='none'){
    const url = activeTool ? '#'+activeTool : location.pathname+location.search;
    if(histMode==='replace') history.replaceState(null,'',url);
    else if((location.hash||'') !== (activeTool?'#'+activeTool:'')) history.pushState(null,'',url);
  }
}
/* ヘッダーの「‹」は、道具をどれだけ行き来していても必ずロードマップへ戻る */
document.getElementById('backBtn').addEventListener('click', ()=> openTool(''));
window.addEventListener('popstate', ()=>{
  const id=(location.hash||'').replace('#','');
  openTool(TOOLS[id]?id:'', 'none');
});
window.addEventListener('resize', ()=>{ if(activeTool) sizeToolFrames(); });

/* ===================== 金曜の振り返り通知 ===================== */
function notifyEnabled(){ return localStorage.getItem(NKEY)==='1' && ('Notification' in window) && Notification.permission==='granted'; }
function renderNotifyBtn(){
  const b=document.getElementById('notifyBtn');
  b.classList.toggle('on', notifyEnabled());
  b.title = notifyEnabled() ? '金曜の振り返り通知：オン' : '金曜の振り返り通知：オフ（タップで有効化）';
}
document.getElementById('notifyBtn').addEventListener('click', async ()=>{
  if(!('Notification' in window)){ toast('この環境は通知に対応していません'); return; }
  if(notifyEnabled()){
    localStorage.setItem(NKEY,'0'); renderNotifyBtn(); toast('振り返り通知をオフにしました'); return;
  }
  let perm=Notification.permission;
  if(perm==='default') perm=await Notification.requestPermission();
  if(perm==='granted'){
    localStorage.setItem(NKEY,'1'); renderNotifyBtn();
    toast('毎週金曜 '+(db.settings.reviewHour||17)+'時以降に振り返りをお知らせします');
  } else {
    toast('通知が許可されませんでした（ブラウザ設定を確認）');
  }
});
function checkNotify(){
  if(!notifyEnabled()) return;
  const now=new Date();
  if(now.getDay()!==5) return;
  if(now.getHours()<(db.settings.reviewHour||17)) return;
  if(getWeek(weekKey()).review) return;
  if(localStorage.getItem(NSTAMP)===todayISO()) return;
  localStorage.setItem(NSTAMP, todayISO());
  try{ new Notification('🧱 金曜の振り返り', { body:'今週の目標、どうだった？ 達成・未達・成長を記録しよう。', tag:'tsumiki-dokuritsu-review' }); }catch(e){}
}

/* 日付またぎ（サブディスプレイ常時表示）でも表示を更新 */
let lastDay=todayISO();
setInterval(()=>{
  checkNotify();
  if(todayISO()!==lastDay){ lastDay=todayISO(); if(!mode) render(); }
}, 60000);

/* ===================== テーマ ===================== */
function applyTheme(t){ if(t) document.documentElement.setAttribute('data-theme',t); else document.documentElement.removeAttribute('data-theme'); }
(function(){ const s=localStorage.getItem('tsumiki_roadmap_theme'); if(s) applyTheme(s); })();
document.getElementById('themeBtn').addEventListener('click', ()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const isDark = cur ? cur==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  const next=isDark?'light':'dark'; applyTheme(next); localStorage.setItem('tsumiki_roadmap_theme', next);
  broadcastTheme();   /* 開いている道具（iframe）の表示も一緒に切り替える */
});

/* ===================== 起動 ===================== */
loadLocal();
render();
checkNotify();
/* 直リンク（#jikyu など）で開かれたときも、飛ばずにこの画面の中で開く */
(function(){ const id=(location.hash||'').replace('#',''); if(TOOLS[id]) openTool(id,'replace'); })();
if(sb){ loadRemote(); subscribeRealtime(); }
</script>

<style>
  #tsumikiEdge{position:fixed; top:0; bottom:0; left:0; width:22px; z-index:999;}
  #tsumikiPeek{
    position:fixed; top:50%; left:0; z-index:1001; margin-top:-23px;
    width:46px; height:46px; display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.92);
    -webkit-backdrop-filter:saturate(180%) blur(14px); backdrop-filter:saturate(180%) blur(14px);
    border:1px solid rgba(0,0,0,.06); border-radius:50%;
    box-shadow:0 6px 20px rgba(0,0,0,.18);
    color:#0071e3; font-size:24px; font-weight:600; line-height:1;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Helvetica Neue",Arial,sans-serif;
    transform:translateX(-70px) scale(.8); opacity:0; pointer-events:none;
  }
</style>
<div id="tsumikiEdge"></div>
<div id="tsumikiPeek">‹</div>
<script>
  (function(){
    var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
      || window.navigator.standalone === true;
    var fromTsumiki = false;
    try{
      if(document.referrer){
        var r = new URL(document.referrer);
        fromTsumiki = (r.origin === location.origin);
      }
    }catch(e){}
    if(!(standalone && fromTsumiki)) return;

    var peek = document.getElementById('tsumikiPeek');
    var edge = document.getElementById('tsumikiEdge');

    function goBack(){ location.href = 'index.html'; }

    /* --- 左端エッジスワイプで戻る（iOS純正の戻る操作。見えるボタンは置かない） --- */
    var sx=0, sy=0, prog=0, dragging=false, W=window.innerWidth;
    var TRIGGER = Math.min(120, W*0.32);
    window.addEventListener('resize', function(){ W=window.innerWidth; TRIGGER=Math.min(120, W*0.32); });

    function reset(){
      dragging = false; prog = 0;
      peek.style.transition = 'transform .25s ease, opacity .25s ease';
      peek.style.transform = 'translateX(-70px) scale(.8)';
      peek.style.opacity = 0;
    }
    function start(e){
      var t = e.touches ? e.touches[0] : e;
      if(t.clientX > 26) return;
      sx = t.clientX; sy = t.clientY; prog = 0; dragging = true;
      peek.style.transition = 'none';
    }
    function move(e){
      if(!dragging) return;
      var t = e.touches ? e.touches[0] : e;
      var dx = t.clientX - sx, dy = t.clientY - sy;
      if(Math.abs(dy) > Math.abs(dx) + 12){ reset(); return; }
      if(dx < 0) dx = 0;
      prog = Math.min(dx / TRIGGER, 1);
      peek.style.transform = 'translateX(' + (-70 + prog*82) + 'px) scale(' + (0.8 + prog*0.2) + ')';
      peek.style.opacity = prog;
      if(dx > 6 && e.cancelable) e.preventDefault();
    }
    function end(){
      if(!dragging) return;
      dragging = false;
      if(prog >= 0.999){
        peek.style.transition = 'transform .25s ease, opacity .25s ease';
        peek.style.transform = 'translateX(20px) scale(1.05)';
        peek.style.opacity = 1;
        goBack();
      }else{
        reset();
      }
    }
    edge.addEventListener('touchstart', start, {passive:true});
    window.addEventListener('touchmove', move, {passive:false});
    window.addEventListener('touchend', end, {passive:true});
    window.addEventListener('touchcancel', end, {passive:true});
  })();
</script>
<!-- /tsumiki-back-button -->
