/* 対話は三本線メニュー専用なので、新着はメニュー側だけで知らせる */
function renderTalkBadge(){
  const ts=talkStats();
  const btn=document.getElementById('menuBtn');
  const bg=document.getElementById('drTalkBadge');
  if(btn) btn.classList.toggle('has-new', ts.unseen>0);
  if(!bg) return;
  if(ts.unseen){ bg.textContent='新着 '+ts.unseen; bg.classList.remove('wait'); bg.hidden=false; }
  else if(ts.reply){ bg.textContent='返信待ち '+ts.reply; bg.classList.add('wait'); bg.hidden=false; }
  else if(ts.waiting){ bg.textContent='Claude待ち '+ts.waiting; bg.classList.add('wait'); bg.hidden=false; }
  else { bg.textContent=''; bg.hidden=true; }
}

function renderWeekPage(){
  if(mode==='tasks'){ pageWeek.innerHTML=taskEditorHTML(); focusEnd('#tin-0'); return; }
  if(mode==='review'){ pageWeek.innerHTML=reviewEditorHTML(); const g=document.getElementById('rvGrowth'); if(g) autoGrow(g); const n=document.getElementById('rvNext'); if(n) autoGrow(n); return; }

  const k=currentViewKey();
  const w=getWeek(k);
  const st=weekStats(w);
  const today=parseISO(todayISO());
  const off=weekOffset(k);
  const lab=weekLabel(k);
  let h='';

  /* 金曜バナー（今週を見ているときだけ） */
  if(off===0 && reviewBannerOn()){
    h+=`<div class="review-banner" data-act="open-review">
      <span style="font-size:1.5rem;">🗓</span>
      <span class="rb-t"><b>金曜の振り返り</b><p>今週の目標、どうだった？ 達成・未達・成長を記録しよう。</p></span>
      <span class="go">書く ›</span>
    </div>`;
  }

  /* 対話は三本線メニューからだけ開く（今週ページには導線を置かない）。
     新着は menuBtn の赤い点とメニュー内のバッジで知らせる → renderTalkBadge() */

  /* 週バー：カードをやめて1行に。「今どの週を見ているか」と進み具合だけを伝える */
  const canPrev = k>oldestWeekKey();
  const canNext = weekOffset(addDays(k,7))<=WEEK_AHEAD_MAX;
  h+=`<div class="weekbar">
    <button class="wnav" data-act="week-prev" aria-label="前の週へ" ${canPrev?'':'disabled'}>‹</button>
    <span class="wb">
      <span class="wb-t">
        <span class="n">${lab}</span>
        <span class="r tnum">${fmtMD(k)}–${fmtMD(addDays(k,6))}${off===0?` ・今日 ${today.getMonth()+1}/${today.getDate()}(${WD[today.getDay()]})`:''}</span>
        ${st.total?`<span class="p tnum">${st.pct}% <em>${st.done}/${st.total}</em></span>`:''}
      </span>
      ${st.total?`<span class="bar ${st.pct>=100?'good':''}"><i style="width:${st.pct}%"></i></span>`:''}
    </span>
    <button class="wnav" data-act="week-next" aria-label="次の週へ" ${canNext?'':'disabled'}>›</button>
  </div>`;
  if(off!==0) h+=`<div class="week-jump"><button class="edit-link" data-act="week-today">今週へ戻る</button></div>`;

  /* 今週の状態：勝ち条件 ＋ 動いた記録 ＋ 止まっている時の合図（1枚にまとめる） */
  h+=weekTopHTML(k, w, off);

  /* 今日やる：今週を見ている時だけ。ここが「次に手を動かす1つ」を出す唯一の場所 */
  if(off===0 && w.tasks.length){
    const td=todayActs(3);
    h+=`<div class="card today"><span class="label">今日やる</span>`;
    if(td.list.length){
      h+=`<div class="today-list">`+td.list.map(todayItemHTML).join('')+`</div>`;
      if(td.rest) h+=`<div class="gnote" style="margin-top:9px;">ほか ${td.rest}件は、下の目標をひらくと出ます</div>`;
    } else {
      h+=`<div class="today-none">今日ぶんは片づきました 🎉　下の目標から次を選べます。</div>`;
    }
    h+=`</div>`;
  }

  /* 目標：1行ずつ畳んでおき、押した目標だけ枝分かれを開く（同時に1つだけ） */
  h+=`<div class="card">`;
  if(w.tasks.length){
    /* 終わった目標は一覧から抜いて、下の「完了 ◯件」にまとめて畳む（消さない＝%も記録も残る）。
       依頼中（＝残りの枝分かれが全部Claude待ち）も同じように抜いて畳む。
       ここに出ているのは「いま自分が動かせる目標」だけ、という状態を守るため。 */
    const undone=w.tasks.filter(t=>t.count<t.target);
    const openT=undone.filter(t=>!isTaskAsk(t));
    const askT =undone.filter(t=>isTaskAsk(t));
    const doneT=w.tasks.filter(t=>t.count>=t.target);
    h+=`<span class="label">${lab}の目標${openT.length?' ・ 残り'+openT.length+'件':''}</span>`;
    if(openT.length) h+=`<div class="goals" style="margin-top:11px;">`+openT.map(t=>goalHTML(t,k)).join('')+`</div>`;
    else if(askT.length) h+=`<div class="today-none" style="margin-top:11px;">いま自分が動かせる目標はありません。下の依頼が返ってくるのを待つだけです。</div>`;
    if(askT.length){
      h+=`<button class="done-fold ask ${showAsk?'open':''}" data-act="toggle-ask" aria-expanded="${showAsk}">
        ${ICON_SEND}<span>依頼中 ${askT.length}件</span><span class="fcar">▾</span>
      </button>`;
      if(showAsk) h+=`<div class="goals ask-list">`+askT.map(t=>goalHTML(t,k)).join('')+`</div>`;
    }
    if(doneT.length){
      h+=`<button class="done-fold ${showDone?'open':''}${foldPulse?' pulse':''}" data-act="toggle-done" aria-expanded="${showDone}">
        <svg viewBox="0 0 24 24"><path d="M5 12.5l4 4 10-10"/></svg>
        <span>完了 ${doneT.length}件</span><span class="fcar">▾</span>
      </button>`;
      if(showDone) h+=`<div class="goals done-list">`+doneT.map(t=>goalHTML(t,k)).join('')+`</div>`;
    }
    foldPulse=false;
    if(st.pct>=100) h+=`<div class="week-done-msg">🎉 ${lab}の目標 すべて達成！</div>`;
    h+=`<div class="card-foot"><button class="edit-link" data-act="edit-tasks">目標を編集</button>${w.review?'':'<button class="edit-link" data-act="open-review">振り返りを書く</button>'}</div>`;
  } else {
    const prev=prevWeekWithTasks(k);
    h+=`<div class="empty-week">
      <span class="em">🧱</span>
      <p>${lab}の目標がまだ決まっていません。</p>
      <div class="btnrow">
        ${prev?`<button class="btn ghost" data-act="copy-prev">前の週をコピー</button>`:''}
        <button class="btn primary" data-act="edit-tasks">＋ 目標を決める</button>
      </div>
      <span class="hint">${off>0?'先に決めておくと、その週になった時そのまま始められます':'Claudeとの週次セッションで決めると、ここに反映されます'}</span>
    </div>`;
  }
  h+=`</div>`;

  /* この先の予定：ふだんは1行。押した時だけ中身を出す（忘れないための保険なので、常時は要らない） */
  const fut=futureActs();
  if(fut.length){
    h+=`<button class="futrow ${showFut?'open':''}" data-act="toggle-fut" aria-expanded="${showFut}">
      ${ICON_CAL}<span>この先の予定 ${fut.length}件</span>
      <span class="fnext tnum">${showFut?'':'次は '+fmtMDW(fut[0].a.due)}</span><span class="fcar">▾</span>
    </button>`;
    if(showFut){
      h+=`<div class="fut">`;
      fut.slice(0,8).forEach(o=>{
        h+=`<button class="fut-i" data-act="fut-go" data-wk="${o.k}" data-tid="${o.t.id}">
          <span class="d tnum">${fmtMDW(o.a.due)}${(o.a.dueTo&&o.a.dueTo>o.a.due)?'<br>〜'+fmtMDW(o.a.dueTo):''}</span>
          <span class="b"><span class="x">${esc(o.a.text)}</span><span class="g">${esc(o.t.text)}</span></span>
        </button>`;
      });
      h+=`</div>${fut.length>8?`<div class="gnote" style="margin-top:9px;">ほか ${fut.length-8}件</div>`:''}`;
    }
  }

  /* 振り返り済みカード */
  if(w.review){
    const r=w.review;
    const rlab={done:'○ 達成', partial:'△ 一部達成', miss:'× 未達'}[r.result]||'記録済み';
    h+=`<div class="card" data-act="open-review" style="cursor:pointer;">
      <div class="review-sum">
        <div class="rs-head"><span class="label">${lab}の振り返り</span><span class="chip ${r.result}">${rlab}</span><span style="margin-left:auto;font-size:.76rem;color:var(--ink-soft);">タップで編集</span></div>
        ${r.growth?`<div class="growth">🌱 ${esc(r.growth)}</div>`:''}
        ${r.next?`<div class="nextnote">→ ${esc(r.next)}</div>`:''}
      </div>
    </div>`;
  }

  /* 声かけメモへの導線は三本線メニューに集約したので、ここには置かない */

  pageWeek.innerHTML=h;
  requestAnimationFrame(syncMoreBtns);   /* 文字が並び終わってから測る */
}

/* 文字数で「長い」を仮判定して「…」を出しているので、実際に折り返していない時は消す。
   （画面が広いと2行に収まりきることがある＝押しても何も起きない「…」を残さない） */
function syncMoreBtns(){
  document.querySelectorAll('#pageWeek .more:not(.open)').forEach(b=>{
    const box=b.previousElementSibling;
    b.style.display = (box && box.scrollHeight - box.clientHeight > 2) ? '' : 'none';
  });
}
window.addEventListener('resize', ()=>requestAnimationFrame(syncMoreBtns));
if(document.fonts && document.fonts.ready) document.fonts.ready.then(syncMoreBtns);

/* ---------- 今週の状態（勝ち条件・動いた記録・止まっている合図） ----------
   目標を並べるだけだと「どれが取れたら勝ちか」が消えるので、週に1行だけ勝ち条件を置く。
   その下に「動いた日」の点を出して、金曜の振り返りを待たずに止まりに気づけるようにする。 */
const ICON_EDIT_S = `<svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>`;
function isEditingWin(k){ return !!(mode && typeof mode==='object' && mode.type==='win' && mode.wk===k); }
function weekTopHTML(k, w, off){
  const win=winOf(k);
  const editing=isEditingWin(k);
  const done=!!(win && win.done);
  let h=`<div class="card win ${done?'ok':''}"><span class="label">${weekLabel(k)}の勝ち条件</span>`;

  if(editing){
    h+=`<div class="win-ed">
      <input type="text" class="win-in" value="${esc(draft.text)}" placeholder="例：金額を書いた見積りを1本送る">
      <div class="win-hint">「送った／会った／決めた」で終われる形にする。取れたか取れなかったかが、その日のうちに分かる1行に。</div>
      <div class="row">
        ${win?`<button class="edit-link" data-act="win-del" data-wk="${k}">消す</button>`:''}<span class="sp"></span>
        <button class="btn ghost sm" data-act="win-cancel">やめる</button>
        <button class="btn primary sm" data-act="win-save" data-wk="${k}">保存</button>
      </div>
    </div>`;
  } else if(win){
    h+=`<div class="win-row">
      <button class="win-tick" data-act="win-toggle" data-wk="${k}" aria-label="${done?'取れた（押すと戻す）':'取れたことにする'}">${done?CHK_M:''}</button>
      <span class="win-t">${esc(win.text)}</span>
      <button class="win-ed-btn" data-act="win-edit" data-wk="${k}" aria-label="勝ち条件を書き直す">${ICON_EDIT_S}</button>
    </div>`;
    if(done) h+=`<div class="win-done">🎉 ${weekLabel(k)}は勝ち。ここで一度、区切りがつきました。</div>`;
  } else {
    h+=`<button class="win-set" data-act="win-edit" data-wk="${k}">＋ これが取れたら勝ち、を1行で決める</button>`;
  }

  /* 動いた記録は「今週」を見ている時だけ（過去・未来の週で出しても意味がない） */
  if(off===0 && !editing){
    const dots=moveDots(14);
    const today=movesOn(todayISO());
    const stall=stallDays();
    h+=`<div class="mv">
      <span class="mv-dots">${dots.map(x=>`<i class="${x.n>0?'on':''} ${x.d===todayISO()?'now':''}" title="${fmtMD(x.d)} ${x.n}件"></i>`).join('')}</span>
      <span class="mv-n tnum">${today ? '今日 '+today+'件' : '今日はまだ'}</span>
    </div>`;
    if(stall>=3){
      h+=`<div class="stall">
        <b>${stall}日、手が止まっています</b>
        <p>${win ? '今週の勝ち条件は「'+esc(win.text)+'」。' : ''}下の「今日やる」から、いちばん小さい1件を選んで終わらせる。</p>
      </div>`;
    }
  }
  return h+`</div>`;
}

/* ---------- 今日やる の1件 ---------- */
const CHK_S = `<svg viewBox="0 0 24 24" style="width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round"><path d="M5 12.5l4 4 10-10"/></svg>`;
const CHK_M = `<svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round"><path d="M5 12.5l4 4 10-10"/></svg>`;
function todayItemHTML(o){
  const t=o.t;
  /* 枝分かれを持たない目標は、目標そのものを1件として出す（◯＝1つ達成） */
  if(o.isTask){
    return `<span class="ti" data-act="inc" data-id="${t.id}" role="button" tabindex="0" aria-label="${esc(t.text)} を1つ達成にする">
      <span class="adot"></span>
      <span class="tib">
        <span class="tix">${clampHTML(t.text, 't:'+t.id, 2)}</span>
        <span class="tig">今週の目標${t.target>1?' ・ '+t.count+'/'+t.target:''}</span>
      </span>
    </span>`;
  }
  const a=o.a;
  let head='';
  if(isOverdue(a)) head=`<span class="hot">予定 ${dueLabel(a)}（過ぎています）</span> ・ `;
  else if(isDueToday(a)) head=`<span class="now">今日の予定</span> ・ `;
  let s=`<span class="ti ${a.done?'done':''}" data-act="act-toggle" data-wk="${o.k}" data-tid="${t.id}" data-aid="${a.id}" role="button" tabindex="0" aria-label="${esc(a.text)}${a.done?'（済）':''}">
    <span class="adot">${CHK_S}</span>
    <span class="tib">
      <span class="tix">${clampHTML(a.text, a.id, 2)}</span>
      <span class="tig">${head}${esc(t.text)}</span>
    </span>
    ${a.done?'':draftBtnHTML(a)}
    ${memoBtnHTML(a, o.k, t.id)}
  </span>`;
  /* ラリーはふだん出さない（吹き出しボタンの数字で足りる）。
     ひらいた時・書いている時だけ、この下に出す＝ここから返事も書ける */
  if(openThreads.has(a.id) || isEditingThread(o.k, t.id, a.id)) s+=threadHTML(a, o.k, t.id, {});
  return s;
}

/* ---------- 目標1件（畳んだ行 ＋ 開いた時の中身） ---------- */
function goalHTML(t, k){
  const full=t.count>=t.target;
  const open=openGoalId===t.id;
  const acts=t.actions||[];
  const undone=acts.filter(a=>!a.done);
  const later=undone.filter(isLater);
  const nowActs=undone.filter(a=>!isLater(a));
  const doneActs=acts.filter(a=>a.done);
  const cls=(full?'done':(t.count>0?'some':''))+(open?' open':'');
  let h=`<div class="goalwrap"><div class="goal ${cls}" data-act="goal-toggle" data-id="${t.id}" role="button" tabindex="0" aria-expanded="${open}" aria-label="${esc(t.text)} ${t.count}/${t.target}">
    <button class="gtick" data-act="inc" data-id="${t.id}" aria-label="${full?'達成ずみ':'1つ達成にする'}">${full?CHK_M:''}</button>
    <span class="gtext ${open?'':'cl1'}">${dimText(t.text)}</span>
    ${t.target>1?`<span class="gcount tnum">${t.count}/${t.target}</span>`:''}
    ${nowActs.length?`<span class="gleft tnum">◇${nowActs.length}</span>`:''}
    <span class="fcar">▾</span>
  </div>`;
  if(open){
    const row=a=>actHTML(a, k, t.id, {compact:true});
    h+=`<div class="gbody">
      <div class="gchips">
        ${acts.length?`<span class="gchip flat">枝分かれ ${doneActs.length}/${acts.length}</span>`:''}
        ${later.length?`<button class="gchip ${openLater.has(t.id)?'on':''}" data-act="toggle-later" data-tid="${t.id}" aria-expanded="${openLater.has(t.id)}">📅 予定 ${later.length}</button>`:''}
        ${doneActs.length?`<button class="gchip ${openActs.has(t.id)?'on':''}" data-act="toggle-acts" data-tid="${t.id}" aria-expanded="${openActs.has(t.id)}">✓ 済み ${doneActs.length}</button>`:''}
        ${t.count>0?`<button class="gchip" data-act="dec" data-id="${t.id}">− 1つ戻す</button>`:''}
      </div>`;
    if(nowActs.length) h+=`<div class="acts">`+nowActs.map(row).join('')+`</div>`;
    if(later.length && openLater.has(t.id)) h+=`<div class="acts">`+later.map(row).join('')+`</div>`;
    if(doneActs.length && openActs.has(t.id)) h+=`<div class="acts">`+doneActs.map(row).join('')+`</div>`;
    if(!acts.length) h+=`<div class="gnote">枝分かれはありません。左の◯を押すと達成になります。</div>`;
    else if(!nowActs.length) h+=`<div class="gnote">いま手を動かす枝分かれはありません。</div>`;
    h+=`</div>`;
  }
  return h+`</div>`;
}

/* ---------- 卒業の条件（4メーター） ----------
   「退職届を出せる状態」の定義そのものを点数板にする。押すと その場で数字を更新できる。
   主役は現在値ではなく **あと何件・あと何万** ＝ 次に取りにいく量。 */
function isEditingMeter(k){ return !!(mode && typeof mode==='object' && mode.type==='meter' && mode.k===k); }
function metersHTML(left){
  const ed=METERS.find(mt=>isEditingMeter(mt.k));
  let h=`<div class="mets">`;
  if(ed){
    const m=meterOf(ed.k);
    h+=`<div class="met-ed">
      <div class="me-h">${ed.name}<span>${esc(ed.hint)}</span></div>
      <div class="me-row">
        <button class="me-pm" data-act="met-step" data-v="-1" aria-label="減らす">−</button>
        <input type="number" class="me-in" value="${m.v}" min="0" inputmode="decimal" aria-label="いまの数">
        <button class="me-pm" data-act="met-step" data-v="1" aria-label="増やす">＋</button>
        <span class="me-u">${ed.unit}</span>
      </div>
      <div class="me-goal">
        <label>目標</label>
        <input type="number" class="me-gin" value="${m.goal}" min="1" inputmode="decimal" aria-label="目標">
        <span class="me-u">${ed.unit}</span>
      </div>
      <div class="ed-actions">
        <button class="btn ghost sm" data-act="met-cancel">やめる</button>
        <button class="btn primary sm" data-act="met-save" data-k="${ed.k}">保存</button>
      </div>
    </div>`;
    return h+`</div>`;
  }
  METERS.forEach(mt=>{
    const m=meterOf(mt.k);
    const ok=m.v>=m.goal;
    const pct=Math.min(100, Math.round(m.v/Math.max(1,m.goal)*100));
    const rest=Math.max(0, Math.round((m.goal-m.v)*10)/10);
    h+=`<button class="met ${ok?'ok':''}" data-act="met-open" data-k="${mt.k}" aria-label="${mt.name} ${m.v}/${m.goal}${mt.unit}（押すと更新）">
      <span class="mt-n">${mt.name}</span>
      <span class="mt-v tnum"><b>${m.v}</b><i>/${m.goal}${mt.unit}</i></span>
      <span class="bar ${ok?'good':''}"><i style="width:${pct}%"></i></span>
      <span class="mt-r">${ok?'そろった':'あと '+rest+mt.unit}</span>
    </button>`;
  });
  h+=`</div>`;
  h+= left
    ? `<div class="met-foot"><span>この4つがそろったら退職届を出せる状態</span><b>残り ${left}つ</b></div>`
    : `<div class="met-foot done">🎉 4つそろいました。退職届を出せる状態です。</div>`;
  return h;
}

/* ===================== ガント（週軸の帯） =====================
   横軸＝週（日曜はじまり）。縦に ①各月の目標 ②予定日の入っている枝分かれ を並べる。
   枝分かれは a.due（始まり）〜 a.dueTo（終わり・任意）を**そのまま**帯にするので、
   このために新しく入力してもらうデータはない。帯を押すとその週・その目標へ飛ぶ。 */
const GT_COL = 34;          /* 1週の幅(px) */
const GT_LAB = 127;         /* 左の見出し列の幅(px)。CSSの .gt-lab と合わせる */
const GT_MAXROW = 40;       /* 行が増えすぎた時の打ち止め */
const GT_BACK = 28;         /* 過去へさかのぼる上限（日） */
let gtScroll = null;        /* 横スクロール位置。再描画でも保つ（保存はしない） */
let gtNowX = 0;             /* 今日の線のx座標。初回だけここへ寄せる */

function monthEndISO(ym){ const y=+ym.slice(0,4), m=+ym.slice(5,7); return iso(new Date(y, m, 0)); }
function gtX(gs, d){ return (parseISO(d)-parseISO(gs))/864e5/7*GT_COL; }

/* 帯にする行を集める。月の目標が先、そのあと予定日順に枝分かれ */
function gtRows(){
  const months=[];
  db.months.forEach(m=>{
    if(!m.goal) return;
    months.push({ kind:'month', ym:m.ym, text:m.goal, sub:(+m.ym.slice(5,7))+'月の目標',
                  s:m.ym+'-01', e:monthEndISO(m.ym), cls:'m-'+(m.status||'none') });
  });
  const acts=[];
  const t0=todayISO();
  const back=addDays(sundayOf(t0), -GT_BACK);
  eachAct((a,t,k)=>{
    if(!isDate(a.due)) return;         /* 日付として読めないものは幅の計算が壊れるので出さない */
    const e=(isDate(a.dueTo) && a.dueTo>a.due) ? a.dueTo : a.due;
    if(e<back) return;                 /* ずっと前に終わった予定は帯に出さない（左端に潰れて並ぶだけ） */
    let cls='s-plan';
    if(a.done) cls='s-done';
    else if(isAsk(a)) cls='s-ask';
    else if(isOverdue(a)) cls='s-over';
    else if(a.due<=t0 && e>=t0) cls='s-today';
    acts.push({ kind:'act', text:a.text, sub:t.text, s:a.due, e, cls, wk:k, tid:t.id, fin:!!a.done });
  });
  acts.sort((x,y)=> x.s<y.s ? -1 : (x.s>y.s ? 1 : (x.e<y.e ? -1 : 1)));
  return { rows: months.concat(acts.slice(0, GT_MAXROW)), hidden: Math.max(0, acts.length-GT_MAXROW) };
}

function ganttHTML(){
  const {rows, hidden}=gtRows();
  if(!rows.length){
    return `<div class="card"><span class="label">予定の帯</span>
      <div class="hist-empty" style="margin-top:11px;">枝分かれに予定日（カレンダーの印）を入れると、ここに帯で並びます。月の目標を決めても出ます。</div>
    </div>`;
  }
  const today=todayISO();
  /* 横の範囲＝今週〜卒業日。はみ出す分だけ広げる。
     月の帯はロードマップそのものなので必ず全部入れる／枝分かれは過去4週までしか遡らない。 */
  let gs=sundayOf(today), ge=db.vision.deadline||'2026-12-31';
  const back=addDays(sundayOf(today), -GT_BACK);
  rows.forEach(r=>{
    const s = (r.kind==='month') ? r.s : (r.s<back ? back : r.s);
    if(s<gs) gs=s;
    if(r.e>ge) ge=r.e;
  });
  gs=sundayOf(gs);
  const cols=Math.min(80, Math.max(2, Math.ceil((parseISO(ge)-parseISO(gs))/864e5/7)+1));
  const W=cols*GT_COL;
  gtNowX=gtX(gs, today);

  /* 見出し：月の帯（1つおきに薄い下地）と、週の始まりの日 */
  let mh='', dh='', bands='', bi=0, i=0;
  while(i<cols){
    const ym=addDays(gs, i*7).slice(0,7);
    let j=i; while(j<cols && addDays(gs, j*7).slice(0,7)===ym) j++;
    const left=i*GT_COL, w=(j-i)*GT_COL;
    mh+=`<span class="gt-m" style="left:${left}px;width:${w}px">${+ym.slice(5,7)}月</span>`;
    if(bi%2) bands+=`<div class="gt-band" style="left:${GT_LAB+left}px;width:${w}px"></div>`;
    bi++; i=j;
  }
  const thisWk=sundayOf(today);
  for(let c=0;c<cols;c++){
    const d=addDays(gs, c*7);
    dh+=`<span class="gt-d ${d===thisWk?'now':''}" style="left:${c*GT_COL}px;width:${GT_COL}px">${+d.slice(8,10)}</span>`;
  }

  let rh='';
  rows.forEach(r=>{
    const x1=Math.max(0, gtX(gs, r.s));
    const x2=Math.min(W, Math.max(x1+12, gtX(gs, addDays(r.e,1))));   /* 1日だけの予定も指で押せる太さを残す */
    const attr = r.kind==='month'
      ? `data-act="gt-month" data-ym="${r.ym}"`
      : `data-act="gt-go" data-wk="${r.wk}" data-tid="${r.tid}"`;
    const range = r.s===r.e ? fmtMD(r.s) : fmtMD(r.s)+'〜'+fmtMD(r.e);
    rh+=`<div class="gt-row ${r.kind==='month'?'m':''}">
      <button class="gt-lab ${r.fin?'fin':''}" ${attr} aria-label="${esc(firstLine(r.text))} ${range}">
        <span class="t">${esc(firstLine(r.text))}</span><span class="s">${esc(firstLine(r.sub))}</span>
      </button>
      <div class="gt-track" style="width:${W}px">
        <button class="gt-bar ${r.cls}" ${attr} style="left:${x1}px;width:${x2-x1}px" aria-label="${esc(firstLine(r.text))} ${range}"></button>
      </div>
    </div>`;
  });

  return `<div class="card">
    <span class="label">予定の帯</span>
    <div class="gt-scroll">
      <div class="gt" style="--gtcol:${GT_COL}px">
        ${bands}
        <div class="gt-now" style="left:${GT_LAB+gtNowX}px"></div>
        <div class="gt-row head">
          <div class="gt-lab" style="cursor:default"><span class="s">週のはじまり</span></div>
          <div class="gt-track" style="width:${W}px">
            <div class="gt-mrow">${mh}</div>
            <div class="gt-drow">${dh}</div>
          </div>
        </div>
        ${rh}
      </div>
    </div>
    <div class="gt-legend">

/* 横スクロールの位置を保つ。初回だけ今日の線が左から少し入った所に来るよう寄せる */
function gtRestoreScroll(){
  const sc=pageGrad.querySelector('.gt-scroll'); if(!sc) return;
  sc.scrollLeft = (gtScroll==null) ? Math.max(0, gtNowX-40) : gtScroll;
  sc.addEventListener('scroll', ()=>{ gtScroll=sc.scrollLeft; }, {passive:true});
}

function renderGradPage(){
  const dl=daysLeft();
  const wl=Math.ceil(dl/7);
  const start=parseISO('2026-01-01');
  const end=parseISO(db.vision.deadline||'2026-12-31');
  const total=Math.max(1,(end-start)/864e5);
  const elapsed=Math.min(total, Math.max(0,(parseISO(todayISO())-start)/864e5));
  const timePct=Math.round(elapsed/total*100);
  let h='';

  /* 目指す姿＋カウントダウン＋卒業の条件（4メーター）を1枚に。
     日数だけ減っていく画面にしないため、「あと何が足りないか」を必ず同じカードに並べる。 */
  const left=metersLeft();
  h+=`<div class="card">
    <span class="label">Apple卒業まで</span>
    <div class="vision-slogan">${esc(db.vision.slogan)}</div>
    <div class="vision-title">${esc(db.vision.title)}</div>
    <div class="count-wrap"><span class="big tnum">${dl}</span><span class="unit">日</span><span class="weeks tnum">（残り ${wl} 週）</span></div>
    <div class="bar"><i style="width:${timePct}%"></i></div>
    <div class="count-foot tnum"><span>2026年 ${timePct}% 経過</span><span>卒業予定 ${fmtMD(db.vision.deadline||'2026-12-31')}</span></div>
    ${metersHTML(left)}
  </div>`;

  /* ガント（週軸の帯）＝いつ何が走っているかの俯瞰。下の月別マイルストーンが編集側 */
  h+=ganttHTML();

  /* 月別マイルストーン */
  h+=`<div class="card"><span class="label">月別マイルストーン</span><div class="months">`;
  const nowYm=ymNow();
  let anyGoal=false;
  db.months.forEach(m=>{
    if(mode && typeof mode==='object' && mode.type==='month' && mode.ym===m.ym){
      h+=monthEditorHTML(m); return;
    }
    if(m.goal) anyGoal=true;
    const mm=+m.ym.slice(5,7);
    const cur=m.ym===nowYm;
    let chip='';
    if(m.status==='done') chip=`<span class="chip done">○ 達成</span>`;
    else if(m.status==='partial') chip=`<span class="chip partial">△ 一部</span>`;
    else if(m.status==='miss') chip=`<span class="chip miss">× 未達</span>`;
    else if(cur) chip=`<span class="chip">進行中</span>`;
    const md=(m.must||[]).filter(x=>x.done).length, mt=(m.must||[]).length;
    const isOpen=openMonth===m.ym;
    h+=`<div class="month ${cur?'now':''} ${isOpen?'op':''}" data-act="month-open" data-ym="${m.ym}" role="button" tabindex="0" aria-expanded="${isOpen}">
      <span class="m tnum">${mm}月</span>
      <span class="mg ${m.goal?'':'unset'}">${m.goal?esc(m.goal):'タップして目標を設定'}</span>
      ${mt?`<span class="mcnt tnum">${md}/${mt}</span>`:''}
      ${chip}
    </div>`;
    if(isOpen) h+=monthOpenHTML(m);
  });
  h+=`</div>`;
  if(!anyGoal) h+=`<div class="hist-empty" style="margin-top:11px;">各月の目標は、Claudeとの目標セッションで決めて流し込めます。</div>`;
  h+=`</div>`;

  /* 週次振り返りの履歴 */
  const keys=Object.keys(db.weeks).filter(k=>db.weeks[k].review || (db.weeks[k].tasks||[]).length).sort().reverse();
  const withReview=keys.filter(k=>db.weeks[k].review);
  const cnt={done:0,partial:0,miss:0};
  withReview.forEach(k=>{ const r=db.weeks[k].review.result; if(cnt[r]!=null) cnt[r]++; });
  h+=`<div class="card"><span class="label">週次振り返りの記録</span>`;
  if(withReview.length){
    h+=`<div class="stat-row tnum"><span>○ 達成 <b>${cnt.done}</b></span><span>△ 一部 <b>${cnt.partial}</b></span><span>× 未達 <b>${cnt.miss}</b></span></div>`;
    /* 中身はふだん畳んでおく（読むものを増やさない）。振り返りたい時だけ開く */
    h+=`<button class="done-fold ${showHist?'open':''}" data-act="toggle-hist" aria-expanded="${showHist}" style="margin-top:11px;">
      ${ICON_CAL}<span>1週ずつ見る（${withReview.length}件）</span><span class="fcar">▾</span>
    </button>`;
    if(showHist) h+=`<div class="hist">`;
    if(showHist) withReview.slice(0,12).forEach(k=>{
      const w=db.weeks[k]; const r=w.review; const st=weekStats(w);
      const lab={done:'○ 達成', partial:'△ 一部', miss:'× 未達'}[r.result]||'';
      h+=`<div class="hist-item">
        <div class="h-top"><span class="chip ${r.result}">${lab}</span><span class="h-range tnum">${fmtMD(k)}–${fmtMD(addDays(k,6))}</span><span class="h-pct tnum">${st.total?st.pct+'%':''}</span></div>
        ${r.growth?`<div class="h-growth">🌱 ${esc(r.growth)}</div>`:''}
      </div>`;
    });
    if(showHist) h+=`</div>`;
  } else {
    h+=`<div class="hist-empty">毎週金曜に振り返りを書くと、ここに積み上がっていきます。</div>`;
  }
  h+=`</div>`;
  pageGrad.innerHTML=h;
  gtRestoreScroll();
}

/* 吹き出し（ラリー）ボタン。書いたことがあれば件数、まだなら鉛筆 */
function memoBtnHTML(a, k, tid){
  const th=threadOf(a);
  const un=unseenOf(a);
  return th.length
    ? `<button class="amemo has" data-act="thr-toggle" data-wk="${k}" data-tid="${tid}" data-aid="${a.id}" aria-label="ラリー ${th.length}件${un?'・新着あり':''}">
        ${ICON_BUBBLE}<span class="tnum">${th.length}</span>${un?'<i class="dot"></i>':''}
      </button>`
    : `<button class="amemo" data-act="thr-add" data-wk="${k}" data-tid="${tid}" data-aid="${a.id}" aria-label="メモを書く">${ICON_PENCIL}</button>`;
}
/* 枝分かれ1行（今の一覧・予定・済み・対話ビューで共通に使う）
   opt.compact=true（トップページ）… 文は2行で畳み、ラリーは最新の1つだけ・既読は3行で切る */
function actHTML(a, k, tid, opt){
  opt=opt||{};
  /* 依頼中は「いつやるか」を出さない（自分の予定ではないので決めようがない）。
     代わりに旗を出し、押せば自分のボールに戻せる。 */
  const ask=isAsk(a);
  let s=`<span class="act ${a.done?'done':''}${ask?' asked':''}" data-act="act-toggle" data-wk="${k}" data-tid="${tid}" data-aid="${a.id}" role="button" tabindex="0" aria-label="${esc(a.text)}${a.done?'（済）':''}">
    <span class="adot">${CHK_S}</span>
    <span class="atext">${opt.compact ? clampHTML(a.text, a.id, 2) : esc(a.text)}</span>
    ${a.done?'':(ask ? askBtnHTML(a, k, tid) : dueBtnHTML(a, k, tid))}
    ${a.done?'':draftBtnHTML(a)}
    ${memoBtnHTML(a, k, tid)}
  </span>`;
  if(isEditingDue(k,tid,a.id)) s+=dueEditorHTML();
  s+=threadHTML(a, k, tid, {compact:!!opt.compact});
  return s;
}
/* 依頼中の旗。押すと自分のボールに戻す（＝今日やる・達成率に返ってくる） */
function askBtnHTML(a, wk, tid){
  return `<button class="aask" data-act="ask-off" data-wk="${wk}" data-tid="${tid}" data-aid="${a.id}" aria-label="依頼中（押すと自分に戻します）">${ICON_SEND}<span>依頼中</span></button>`;
}
function dueBtnHTML(a, wk, tid){
  const attr=`data-act="due-open" data-wk="${wk}" data-tid="${tid}" data-aid="${a.id}"`;
  return a.due
    ? `<button class="adue ${dueCls(a)}" ${attr} aria-label="予定 ${dueLabel(a)}（押すと変えられます）">${ICON_CAL}<span class="tnum">${dueLabel(a)}</span></button>`
    : `<button class="adue none" ${attr} aria-label="いつやるかを決める">${ICON_CAL}</button>`;
}
function isEditingDue(wk,tid,aid){
  return !!(mode && typeof mode==='object' && mode.type==='due' && mode.wk===wk && mode.tid===tid && mode.aid===aid);
}
function dueEditorHTML(){
  return `<span class="due-ed">
    <span class="lab">いつやる？　決めるとこの枝分かれは「予定」に畳まれ、その日が来たら自動で戻ってきます。</span>
    <span class="dates">
      <input type="date" class="due-in" value="${esc(draft.due)}" aria-label="始める日">
      <span class="tilde">〜</span>
      <input type="date" class="due-in2" value="${esc(draft.dueTo)}" aria-label="終わりの日（任意）">
    </span>
    <span class="quick">
      <button type="button" data-act="due-q" data-v="0">今日</button>
      <button type="button" data-act="due-q" data-v="1">明日</button>
      <button type="button" data-act="due-q" data-v="sat">今週末</button>
      <button type="button" data-act="due-q" data-v="7">1週間後</button>
    </span>
    <span class="row">
      ${draft.had?`<button class="edit-link" data-act="due-clear">予定を外す</button>`:''}<span class="sp"></span>
      <button class="btn ghost sm" data-act="due-cancel">キャンセル</button>
      <button class="btn primary sm" data-act="due-save">保存</button>

/* 今週カードと対話ビューは同時にDOMへ描かれるので、書き込み欄は「今見えている方」を掴む */
function thrInput(){
  const list=[...document.querySelectorAll('.thr-in')];
  return list.find(el=>el.offsetParent!==null) || list[0] || null;
}
function dueInput(sel){
  const list=[...document.querySelectorAll(sel)];
  return list.find(el=>el.offsetParent!==null) || list[0] || null;
}
function isEditingThread(wk,tid,aid){
  return !!(mode && typeof mode==='object' && mode.type==='thread' && mode.wk===wk && mode.tid===tid && mode.aid===aid);
}
function composerHTML(){
  const chips=Object.keys(TAGS).map(k=>
    `<button type="button" class="tagchip ${TAGS[k].cls} ${draft.tag===k?'on':''}" data-act="thr-tag" data-v="${k}" aria-label="${TAGS[k].label}" aria-pressed="${draft.tag===k?'true':'false'}">${tagSvg(k,'')}</button>`
  ).join('');
  return `<span class="thr-ed">
    <textarea class="thr-in" rows="2" placeholder="いま考えていること・やってみた結果・聞きたいこと">${esc(draft.text)}</textarea>
    <span class="row">
      <span class="chips">${chips}</span><span class="sp"></span>
      <button class="btn ghost sm" data-act="thr-cancel">キャンセル</button>
      <button class="btn primary sm" data-act="thr-save">${draft.mid?'保存':'書き足す'}</button>
    </span>
    <button type="button" class="askchip ${draft.ask?'on':''}" data-act="thr-ask" aria-pressed="${draft.ask?'true':'false'}">
      ${ICON_SEND}<span>${draft.ask?'これはClaudeへの依頼（自分の残タスクから外す）':'これはClaudeへの依頼にする'}</span>
    </button>
  </span>`;
}
/* 既読ボタン。Claudeの返事で終わっている時だけ出す（＝自分が返す番のものだけ）。
   押すと そのラリーを丸ごと片づける（＝消す）。枝分かれ（やること）自体は残る。
   押した直後だけトーストの「取り消す」で戻せる。置くのは対話ページだけ（今週カードには出さない）。 */
function ackBtnHTML(a, wk, tid){
  const m=lastMsg(a);
  if(!m || m.who!=='ai') return '';
  return `<button class="thr-ack" data-act="thr-ack" data-wk="${wk}" data-tid="${tid}" data-aid="${a.id}">${CHK_S}既読にして片づける</button>`;
}
function bubbleHTML(m, a, wk, tid, opt){
  const cls=['bub', m.who==='me'?'me':'ai'];
  if(opt.last && m.who==='me') cls.push('wait');          /* 自分で終わっている＝Claudeの返事待ち */
  if(m.who==='ai' && !m.seen) cls.push('unseen');
  if(opt.cut) cls.push('cut');                            /* 3行で切ってある＝押すと全部ひらく */
  const tap = opt.cut
    ? ` data-act="thr-toggle" data-wk="${wk}" data-tid="${tid}" data-aid="${a.id}" role="button" tabindex="0" aria-label="このやりとりを全部ひらく"`
    : (m.who==='me'
      ? ` data-act="thr-edit" data-wk="${wk}" data-tid="${tid}" data-aid="${a.id}" data-mid="${m.id}" role="button" tabindex="0" aria-label="この書き込みを直す"`
      : '');
  return `<span class="brow ${m.who==='me'?'me':'ai'}">
    ${(m.who==='me'&&m.tag)?tagSvg(m.tag,'btag'):''}
    <span class="${cls.join(' ')}"${tap}>${m.who==='ai'?'<span class="bwho">Claude</span>':''}${esc(m.text)}</span>
  </span>`;
}
/* opt.full=true なら常に全部ひらく（対話ビュー用）。畳んでいる時は最新の1つだけ見せる。
   opt.compact=true（トップページ）… 最新の1つだけ・しかも読んだあとなら3行で切る。
   未読＝Claudeの新しい返事だけは全文のまま見せる（読み逃さないため）。 */
function threadHTML(a, wk, tid, opt){
  opt=opt||{};
  const th=threadOf(a);
  const editing=isEditingThread(wk,tid,a.id);
  const full = opt.full===true || openThreads.has(a.id) || editing;
  if(!th.length && !editing) return '';
  if(opt.compact && !full){
    const m=th[th.length-1];
    const fresh = m.who==='ai' && !m.seen;
    return `<span class="thr">${bubbleHTML(m, a, wk, tid, { last:true, cut:!fresh })}</span>`;
  }
  let h='<span class="thr">';
  if(!full && th.length>1){
    h+=`<button class="thr-more" data-act="thr-toggle" data-wk="${wk}" data-tid="${tid}" data-aid="${a.id}">前のやりとり ${th.length-1}件をひらく</button>`;
  }
  (full?th:th.slice(-1)).forEach(m=>{
    if(editing && mode.mid===m.id){ h+=composerHTML(); return; }
    /* 見えている吹き出しは畳まない＝最新の返信はいつでも最後まで読める（畳むのは「前のやりとり」だけ） */
    h+=bubbleHTML(m, a, wk, tid, { last:m===th[th.length-1] });
  });
  if(editing && !mode.mid) h+=composerHTML();
  else h+=`<span class="thr-foot">
    <button class="thr-add" data-act="thr-add" data-wk="${wk}" data-tid="${tid}" data-aid="${a.id}">＋ 書き足す</button>
    ${opt.full===true ? ackBtnHTML(a, wk, tid) : ''}
  </span>`;
  if(full && th.length>1 && opt.full!==true){
    h+=`<button class="thr-more" data-act="thr-toggle" data-wk="${wk}" data-tid="${tid}" data-aid="${a.id}">畳む</button>`;
  }
  return h+'</span>';
}

/* ---------- 対話ビュー（週をまたいで、ラリーだけを縦に並べる） ---------- */
function renderTalk(){
  const pane=document.getElementById('talkPane');
  if(!pane) return;
  const ts=talkStats();
  let h=`<div class="card">
    <span class="label">週をまたいだやりとり</span>
    <div class="talk-head" style="margin-top:9px;">
      ${ts.unseen?`<span class="tb-badge new">新着 ${ts.unseen}</span>`:''}
      ${ts.reply?`<span class="tb-badge wait">返信待ち ${ts.reply}</span>`:''}
      ${ts.waiting?`<span class="tb-badge wait">Claude待ち ${ts.waiting}</span>`:''}
      <span class="tb-sub tnum">ラリー ${ts.msgs}件</span>
    </div>
    ${ts.waiting?`<div class="card-foot" style="margin-top:13px;"><button class="edit-link" data-act="talk-copy">Claude待ちのメモをコピー（Claudeに貼る用）</button></div>`:''}
  </div>`;

  const keys=Object.keys(db.weeks).filter(k=>(db.weeks[k].tasks||[]).some(t=>(t.actions||[]).some(a=>threadOf(a).length))).sort().reverse();
  if(!keys.length){
    h+=`<div class="talk-empty"><span style="font-size:1.8rem;">💬</span><p style="margin:0;">まだラリーがありません。<br>枝分かれの吹き出しアイコンから書き始めると、ここに集まります。</p></div>`;
    pane.innerHTML=h;
    return;
  }
  keys.forEach(k=>{
    h+=`<div class="talk-wk"><div class="wk-lab"><span class="n">${weekLabel(k)}</span><span class="r tnum">${fmtMD(k)}–${fmtMD(addDays(k,6))}</span></div><div class="talk-cols">`;
    (db.weeks[k].tasks||[]).forEach(t=>{
      const acts=(t.actions||[]).filter(a=>threadOf(a).length || isEditingThread(k,t.id,a.id));
      if(!acts.length) return;
      h+=`<div class="talk-task"><div class="talk-t">${esc(t.text)}</div>`;
      acts.forEach(a=>{
        h+=`<div class="talk-a">
          <div class="a-name act ${a.done?'done':''}" style="cursor:default;background:transparent;border:none;padding:0;">
            <span class="adot"><svg viewBox="0 0 24 24" style="width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round"><path d="M5 12.5l4 4 10-10"/></svg></span>
            <span style="flex:1;min-width:0;">${esc(a.text)}</span>
            ${a.done?'':dueBtnHTML(a, k, t.id)}
          </div>
          ${isEditingDue(k,t.id,a.id)?dueEditorHTML():''}
          ${threadHTML(a, k, t.id, {full:true})}
        </div>`;
      });
      h+=`</div>`;
    });
    h+=`</div></div>`;
  });
  pane.innerHTML=h;
}
/* Claude待ち（自分が最後に書いたまま）のメモだけを Markdown にまとめる（貼るだけでラリーを再開できる形） */
function talkMarkdown(){
  let out='# 独立ロードマップ／Claude待ちのメモ（'+fmtMD(todayISO())+'時点）\n';
  const keys=Object.keys(db.weeks).sort().reverse();
  keys.forEach(k=>{
    const rows=[];
    (db.weeks[k].tasks||[]).forEach(t=>{
      const acts=(t.actions||[]).filter(isWaiting);
      if(!acts.length) return;
      let s='### 目標：'+t.text+'\n';
      acts.forEach(a=>{
        s+='- 枝分かれ：'+a.text+(a.done?'（済）':'')+'\n';
        threadOf(a).slice(-4).forEach(m=>{   /* 直近4往復だけ渡す（長くなりすぎないように） */
          const who=m.who==='ai'?'Claude':'自分';
          const tag=m.tag&&TAGS[m.tag]?'['+TAGS[m.tag].label+'] ':'';
          s+='  - '+who+'：'+tag+m.text.replace(/\n/g,' / ')+'\n';
        });
      });
      rows.push(s);
    });
    if(rows.length) out+='\n## '+weekLabel(k)+'（'+fmtMD(k)+'–'+fmtMD(addDays(k,6))+'）\n'+rows.join('');
  });
  return out;
}

function draftsOf(){ if(!Array.isArray(db.drafts)) db.drafts=[]; return db.drafts; }

function liveDrafts(){ return draftsOf().filter(d=>!d.archived); }

  return list.slice().sort((a,b)=> a.at===b.at ? 0 : (a.at<b.at ? 1 : -1));

/* ---------- 旧「自由帳」からの引き継ぎ（一度だけ） ----------
   自由帳(jiyucho.html)は下書きに統合した。中身は同じ Supabase の別の行にあるので、
   起動時に一度だけ読み込んで下書きへ移す。取り込み元のidを d.src に控えるので、
   何度走っても同じメモが二重に増えることはない。 */
const JIYU_ID='kodai_jiyucho_v1', JIYU_KEY='tsumiki_jiyucho_v1';
function importJiyucho(notes){
  if(!Array.isArray(notes)) return 0;
  const have=new Set(draftsOf().map(d=>d.src).filter(Boolean));
  let n=0;
  notes.forEach(x=>{
    if(!x || typeof x!=='object') return;
    const src='jiyucho:'+(x.id||'');
    if(have.has(src)) return;
    const title=String(x.title||''), text=String(x.body||'');
    if(!title.trim() && !text.trim()) return;
    draftsOf().push({
      id:uid(), title, text,
      at:isDate(x.date)?x.date:todayISO(),
      archived:!!x.archived, src
    });
    have.add(src); n++;
  });
  return n;
}
async function pullJiyucho(){
  if(db.jiyuIn) return;
  let notes=null;
  if(sb){
    try{
      const { data, error } = await sb.from(STATE_TABLE).select('state').eq('id',JIYU_ID).maybeSingle();
      if(error) return;                                  /* つながらない時は何もしない（次の起動でやり直す） */
      notes=(data && data.state && Array.isArray(data.state.notes)) ? data.state.notes : [];
    }catch(e){ return; }
  } else {
    try{ const s=localStorage.getItem(JIYU_KEY); notes=s ? (JSON.parse(s).notes||[]) : []; }catch(e){ notes=[]; }
  }
  const n=importJiyucho(notes);
  db.jiyuIn=true;
  save();
  if(n){
    if(draftsOpen()) renderDrafts();
    toast('自由帳の '+n+'件を下書きに引き継ぎました');
  }
}

/* ===================== 操作 ===================== */
document.querySelector('main').addEventListener('click', e=>{
  const btn=e.target.closest('[data-act]'); if(!btn) return;
  const act=btn.dataset.act;

  /* --- 週の行き来 --- */
  if(act==='week-prev' || act==='week-next' || act==='week-today'){
    viewKey = act==='week-today' ? weekKey() : clampWeek(addDays(currentViewKey(), act==='week-next'?7:-7));
    mode=null; draft=null; editKey=null;
    resetFolds();
    render();
    return;
  }

  /* --- 完了したものの畳み／展開（表示だけ。データは触らない） --- */
  if(act==='toggle-done'){ showDone=!showDone; render(); return; }
  if(act==='toggle-ask'){ showAsk=!showAsk; render(); return; }
  if(act==='toggle-fut'){ showFut=!showFut; render(); return; }
  /* 目標をひらく／閉じる。同時にひらくのは1つだけ＝画面が伸びない */
  if(act==='goal-toggle'){
    const id=btn.dataset.id;
    openGoalId = (openGoalId===id) ? null : id;
    render(); return;
  }
  /* 長い文を全部出す／畳む（表示だけ） */
  if(act==='txt-more'){
    e.stopPropagation();
    const kk=btn.dataset.k;
    if(openText.has(kk)) openText.delete(kk); else openText.add(kk);
    render(); return;
  }
  if(act==='toggle-acts'){
    e.stopPropagation();
    const id=btn.dataset.tid;
    if(openActs.has(id)) openActs.delete(id); else openActs.add(id);
    render(); return;
  }
  if(act==='toggle-later'){
    e.stopPropagation();
    const id=btn.dataset.tid;
    if(openLater.has(id)) openLater.delete(id); else openLater.add(id);
    render(); return;
  }

  /* --- 予定日（いつやるかを決めて「今」から外す） --- */
  if(act==='due-open'){
    e.stopPropagation();
    const wk=btn.dataset.wk, tid=btn.dataset.tid, aid=btn.dataset.aid;
    const a=findAct(wk,tid,aid); if(!a) return;
    draft={ due:a.due||'', dueTo:a.dueTo||'', had:!!a.due };
    mode={type:'due', wk, tid, aid};
    openLater.add(tid);   /* 予定に畳まれていても、編集中は見えたままにする */
    render(); return;
  }
  if(act==='due-q'){
    e.stopPropagation();
    const v=btn.dataset.v;
    let d;
    if(v==='sat'){ const t=parseISO(todayISO()); d=addDays(todayISO(), (6-t.getDay()+7)%7); }
    else d=addDays(todayISO(), +v);
    draft.due=d; draft.dueTo='';                   /* 1日で決め直す。幅を持たせたい時は右の欄で足す */
    const i=dueInput('.due-in'); if(i) i.value=d;   /* render()するとピッカーが閉じるので、その場で入れる */
    const i2=dueInput('.due-in2'); if(i2) i2.value='';
    return;
  }
  if(act==='due-clear'){
    e.stopPropagation();
    const a=findAct(mode.wk, mode.tid, mode.aid);
    if(a){ a.due=''; a.dueTo=''; }
    mode=null; draft=null; save(); render();
    toast('予定を外して、今のタスクに戻しました');
    return;
  }
  if(act==='due-cancel'){ e.stopPropagation(); mode=null; draft=null; render(); return; }
  if(act==='due-save'){
    e.stopPropagation();
    const i1=dueInput('.due-in'), i2=dueInput('.due-in2');
    let d1=i1?i1.value:draft.due, d2=i2?i2.value:draft.dueTo;
    if(!isDate(d1)) d1='';
    if(!isDate(d2) || !d1 || d2<d1) d2='';
    const a=findAct(mode.wk, mode.tid, mode.aid);
    if(a){ a.due=d1; a.dueTo=d2; }
    const wasLater = a && isLater(a);
    mode=null; draft=null; save(); render();
    toast(!d1 ? '予定を外しました' : (wasLater ? fmtMDW(d1)+' の予定にしました（今のタスクから外します）' : fmtMDW(d1)+' の予定にしました'));
    return;
  }
  /* --- ガントの帯を押した --- */
  if(act==='gt-go'){
    gotoTab('week');                   /* 卒業まで画面から押されるので、今週の画面へ切り替える */
    viewKey=btn.dataset.wk;
    mode=null; draft=null; editKey=null;
    resetFolds();
    openGoalId=btn.dataset.tid;
    openLater.add(btn.dataset.tid);
    render(); window.scrollTo(0,0);
    return;
  }
  if(act==='gt-month'){
    const ym=btn.dataset.ym;
    openMonth = (openMonth===ym) ? null : ym;
    mItemEdit=null; mode=null; draft=null;
    render();
    if(openMonth){
      const el=pageGrad.querySelector('.month[data-ym="'+ym+'"]');
      if(el) el.scrollIntoView({block:'center', behavior:'smooth'});
    }
    return;
  }
  if(act==='fut-go'){
    viewKey=btn.dataset.wk;
    mode=null; draft=null; editKey=null;
    resetFolds();
    openGoalId=btn.dataset.tid;        /* その目標をひらいた状態で見せる */
    openLater.add(btn.dataset.tid);
    render(); window.scrollTo(0,0);
    return;
  }

  /* --- 今週の勝ち条件（週に1行だけの「取れたら勝ち」） --- */
  if(act==='win-edit'){
    const wk=btn.dataset.wk;
    const w0=getWeek(wk);
    draft={ text:(w0.win && w0.win.text) || '' };
    mode={type:'win', wk};
    render();
    const el=document.querySelector('.win-in'); if(el){ el.focus(); try{ el.setSelectionRange(el.value.length, el.value.length); }catch(err){} }
    return;
  }
  if(act==='win-cancel'){ mode=null; draft=null; render(); return; }
  if(act==='win-save'){
    const wk=btn.dataset.wk;
    const el=document.querySelector('.win-in');
    const text=(el ? el.value : (draft&&draft.text)||'').trim();
    if(!text){ toast('1行だけ書いてから保存してね'); return; }
    const w2=ensureWeek(wk);
    w2.win = { text, done: !!(w2.win && w2.win.done) };
    mode=null; draft=null; save(); render();
    toast('勝ち条件を決めました');
    return;
  }
  if(act==='win-del'){
    const wk=btn.dataset.wk;
    const w2=ensureWeek(wk);
    const keep=w2.win;
    w2.win=null; mode=null; draft=null; save(); render();
    toast('勝ち条件を消しました', { label:'取り消す', fn:()=>{ ensureWeek(wk).win=keep; save(); render(); } });
    return;
  }
  if(act==='win-toggle'){
    const wk=btn.dataset.wk;
    const w2=ensureWeek(wk); if(!w2.win) return;
    w2.win.done=!w2.win.done;
    bumpMove(w2.win.done?1:-1);
    save(); render();
    if(w2.win.done) toast('🎉 '+weekLabel(wk)+'の勝ち条件を取りました');
    return;
  }

  /* --- 卒業の条件（4メーター） --- */
  if(act==='met-open'){
    const k2=btn.dataset.k; const m=meterOf(k2);
    draft={ v:m.v, goal:m.goal };
    mode={type:'meter', k:k2};
    render(); return;
  }
  if(act==='met-step'){
    /* render() すると入力欄から手が離れるので、その場で数字だけ書き換える */
    const el=document.querySelector('.me-in'); if(!el) return;
    const mt=METERS.find(x=>isEditingMeter(x.k)); const step=mt?mt.step:1;
    const v=Math.max(0, (+el.value||0) + step*(+btn.dataset.v));
    el.value=Math.round(v*10)/10;
    return;
  }
  if(act==='met-cancel'){ mode=null; draft=null; render(); return; }
  if(act==='met-save'){
    const k2=btn.dataset.k;
    const vi=document.querySelector('.me-in'), gi=document.querySelector('.me-gin');
    const was=meterDone(k2);
    const v=Math.max(0, +(vi?vi.value:0)||0);
    const goal=Math.max(1, +(gi?gi.value:1)||1);
    db.meters[k2]={ v:Math.round(v*10)/10, goal:Math.round(goal*10)/10 };
    mode=null; draft=null; save(); render();
    const mt=METERS.find(x=>x.k===k2);
    if(!was && meterDone(k2)) toast('🎉 '+mt.name+' がそろいました（残り '+metersLeft()+'つ）');
    else toast(mt.name+' を更新しました');
    return;
  }

  /* --- 週次振り返りの記録を1週ずつ開く --- */
  if(act==='toggle-hist'){ showHist=!showHist; render(); return; }

  /* --- 結んである文面をコピー（送るまでを1タップに） --- */
  if(act==='act-copy'){
    e.stopPropagation();
    const d=findDraft(btn.dataset.id);
    if(!d){ toast('その文面は見つかりませんでした'); return; }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(d.text).then(
        ()=>toast('コピーしました。あとは送るだけ'),
        ()=>toast('コピーできませんでした')
      );
    } else { toast('この環境ではコピーできません'); }
    return;
  }

  /* --- 下書き（旧・自由帳もここ） --- */
  if(act==='dft-link'){ linkPick=btn.dataset.id; renderDrafts(); return; }
  if(act==='dft-link-cancel'){ linkPick=null; renderDrafts(); return; }
  if(act==='dft-link-set'){
    const id=btn.dataset.id;
    const a=findAct(btn.dataset.wk, btn.dataset.tid, btn.dataset.aid); if(!a) return;
    eachAct(x=>{ if(x.draftId===id) x.draftId=''; });   /* 結び先は1つだけ */
    a.draftId=id;
    linkPick=null; save(); render(); renderDrafts();
    toast('結びました。今日やるの行から1タップでコピーできます');
    return;
  }
  if(act==='dft-unlink'){
    const id=btn.dataset.id;
    eachAct(x=>{ if(x.draftId===id) x.draftId=''; });
    linkPick=null; save(); render(); renderDrafts();
    toast('結びを外しました');
    return;
  }
  if(act==='dft-new'){
    const d={ id:uid(), title:'', text:'', at:todayISO(), archived:false, src:'' };
    draftsOf().unshift(d);
    showArcDft=false; openDraft=d.id;
    save(); renderDrafts();
    const t=document.querySelector('.dft-title'); if(t) t.focus();
    return;
  }
  if(act==='dft-arc'){
    const d=findDraft(btn.dataset.id); if(!d) return;
    d.archived=true;
    if(openDraft===d.id) openDraft=null;
    save(); renderDrafts();
    toast('しまいました', { label:'取り消す', fn:()=>{ d.archived=false; save(); renderDrafts(); } });
    return;
  }
  if(act==='dft-unarc'){
    const d=findDraft(btn.dataset.id); if(!d) return;
    d.archived=false;
    if(openDraft===d.id) openDraft=null;
    if(!arcDrafts().length) showArcDft=false;   /* 最後の1件を戻したら、空の棚に取り残されないよう書く画面へ */
    save(); renderDrafts();
    toast('書く画面に戻しました');
    return;
  }
  if(act==='dft-arc-on' || act==='dft-arc-off'){
    showArcDft = act==='dft-arc-on';
    openDraft=null; renderDrafts(); window.scrollTo(0,0);
    return;
  }
  if(act==='dft-toggle'){
    const id=btn.dataset.id;
    openDraft = (openDraft===id) ? null : id;
    renderDrafts();
    return;
  }
  if(act==='dft-copy'){
    const d=findDraft(btn.dataset.id); if(!d) return;
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(d.text).then(()=>toast('本文をコピーしました'), ()=>toast('コピーできませんでした'));
    } else { toast('この環境ではコピーできません'); }
    return;
  }
  if(act==='dft-del'){
    const d=findDraft(btn.dataset.id); if(!d) return;
    if(!confirm('「'+(d.title||'（無題）')+'」を消します。よろしいですか？\n\n※消さずに残すなら「しまう」を使ってください。')) return;
    db.drafts=draftsOf().filter(x=>x.id!==d.id);
    if(openDraft===d.id) openDraft=null;
    save(); renderDrafts();
    toast('下書きを消しました');
    return;
  }

  /* --- ラリー（枝分かれメモの往復） --- */
  if(act==='talk-copy'){
    const md=talkMarkdown();
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(md).then(()=>toast('コピーしました。Claudeに貼ってください'), ()=>toast('コピーできませんでした'));
    } else { toast('この環境ではコピーできません'); }
    return;
  }
  if(act==='thr-toggle'){
    e.stopPropagation();
    const aid=btn.dataset.aid;
    if(openThreads.has(aid)) openThreads.delete(aid);
    else{
      openThreads.add(aid);
      const a=findAct(btn.dataset.wk, btn.dataset.tid, aid);   /* ひらいた＝Claudeの返信を読んだ */
      if(a && markSeen(a)) save();
    }
    render(); return;
  }
  /* 既読＝片づける。やりとりを丸ごと消して、対話ページには「まだ動いている話」だけを残す。
     消えるのはラリーだけで、枝分かれ（やること）は残る。依頼中の旗も外す（ボールは自分に戻る）。 */
  if(act==='thr-ack'){
    e.stopPropagation();
    const wk=btn.dataset.wk, tid=btn.dataset.tid, aid=btn.dataset.aid;
    const a=findAct(wk, tid, aid); if(!a) return;
    const m=lastMsg(a); if(!m || m.who!=='ai') return;
    const keep={ thread:a.thread, ask:!!a.ask };   /* 直後だけ戻せるように控えておく */
    a.thread=[]; a.ask=false; delete a.ack;
    openThreads.delete(aid);
    save(); render();
    toast('やりとりを片づけました', { label:'取り消す', fn:()=>{
      const b=findAct(wk, tid, aid); if(!b) return;
      b.thread=keep.thread; b.ask=keep.ask;
      save(); render(); toast('戻しました');
    }});
    return;
  }
  if(act==='thr-add' || act==='thr-edit'){
    e.stopPropagation();
    const wk=btn.dataset.wk, tid=btn.dataset.tid, aid=btn.dataset.aid;
    const a=findAct(wk,tid,aid); if(!a) return;
    const mid = act==='thr-edit' ? btn.dataset.mid : null;
    const m = mid ? threadOf(a).find(x=>x.id===mid) : null;
    if(mid && !m) return;
    draft={ text:m?m.text:'', tag:m?m.tag:'', mid:mid||null, ask:!!a.ask };
    mode={type:'thread', wk, tid, aid};
    openThreads.add(aid);
    render();
    const ta=thrInput(); if(ta){ autoGrow(ta); ta.focus(); try{ ta.setSelectionRange(ta.value.length, ta.value.length); }catch(err){} }
    return;
  }
  if(act==='thr-tag'){
    /* ここで render() すると入力欄のフォーカスが外れてキーボードが閉じてしまうので、その場で塗り替える */
    draft.tag = draft.tag===btn.dataset.v ? '' : btn.dataset.v;   /* もう一度押すと解除 */
    const box=btn.closest('.thr-ed');
    if(box) box.querySelectorAll('.tagchip').forEach(c=>{
      const on = c.dataset.v===draft.tag;
      c.classList.toggle('on', on);
      c.setAttribute('aria-pressed', on?'true':'false');
    });
    return;
  }
  if(act==='thr-ask'){
    /* ここで render() すると入力欄のフォーカスが外れてキーボードが閉じるので、その場で塗り替える */
    e.stopPropagation();
    draft.ask=!draft.ask;
    btn.classList.toggle('on', draft.ask);
    btn.setAttribute('aria-pressed', draft.ask?'true':'false');
    const lab=btn.querySelector('span');
    if(lab) lab.textContent = draft.ask ? 'これはClaudeへの依頼（自分の残タスクから外す）' : 'これはClaudeへの依頼にする';
    return;
  }
  if(act==='ask-off'){
    e.stopPropagation();
    const a=findAct(btn.dataset.wk, btn.dataset.tid, btn.dataset.aid); if(!a) return;
    delete a.ask; save(); render();
    toast('自分のボールに戻しました');
    return;
  }
  if(act==='thr-cancel'){ mode=null; draft=null; render(); return; }
  if(act==='thr-save'){
    const ta=thrInput(); if(ta) draft.text=ta.value;
    const a=findAct(mode.wk, mode.tid, mode.aid);
    const txt=String(draft.text||'').trim();
    let msg='書き足しました';
    if(a){
      if(draft.mid){
        const th=threadOf(a);
        if(!txt){ a.thread=th.filter(x=>x.id!==draft.mid); msg='書き込みを消しました'; }
        else{ const m=th.find(x=>x.id===draft.mid); if(m){ m.text=txt; m.tag=draft.tag; } msg='直しました'; }
      } else if(txt){
        a.thread=threadOf(a).concat([{ id:uid(), who:'me', text:txt, tag:draft.tag||'', at:todayISO(), seen:true }]);
      } else { mode=null; draft=null; render(); return; }
      /* 依頼の旗はここで立てる／降ろす＝「投げた時点で自分のボールは離れる」 */
      const was=!!a.ask;
      if(draft.ask) a.ask=true; else delete a.ask;
      if(!was && a.ask) msg='依頼中にしました（今日やる・達成率から外れます）';
      else if(was && !a.ask) msg='依頼を外しました（自分のボールに戻ります）';
    }
    mode=null; draft=null; save(); render();
    toast(msg);
    return;
  }

  /* --- 枝分かれActionのチェック --- */
  if(act==='act-toggle'){
    e.stopPropagation();
    /* 「今日やる」は他の週の枝分かれも拾ってくるので、行に書いてある週を使う */
    const w=ensureWeek(btn.dataset.wk || currentViewKey());
    const t=w.tasks.find(x=>x.id===btn.dataset.tid); if(!t) return;
    const a=(t.actions||[]).find(x=>x.id===btn.dataset.aid); if(!a) return;
    a.done=!a.done;
    bumpMove(a.done?1:-1);           /* 今日の「動いた記録」に1つ足す／戻す */
    const r=syncAutoDone(t);
    if(t.count>=t.target) foldPulse=true;   /* 完了して「完了◯件」へ畳まれる時だけ光らせる */
    save(); render();
    if(r==='done') toast('枝分かれ全部クリア！「'+t.text+'」を達成にしました');
    else if(r==='undone') toast('枝分かれを外したので「'+t.text+'」を達成前に戻しました');
    else if(a.done && t.actions.every(x=>x.done)) toast('枝分かれ全部クリア！');
    return;
  }

  /* --- タスクのカウント --- */
  if(act==='inc' || act==='dec'){
    if(act==='inc' && e.target.closest('[data-act="dec"]')) return;
    const k=currentViewKey(); const w=ensureWeek(k);
    const t=w.tasks.find(x=>x.id===btn.dataset.id); if(!t) return;
    let filled=0, unfilled=0;
    if(act==='inc'){
      if(t.count>=t.target) return;
      t.count++;
      bumpMove(1);
      if(t.count>=t.target){ foldPulse=true; filled=fillActs(t); }   // 枝元が終わったら枝分かれも全部済みにする
    } else {
      e.stopPropagation();
      if(t.count<=0) return;
      const was=t.count>=t.target;
      t.count--;
      bumpMove(-1);
      if(was && t.count<t.target) unfilled=unfillActs(t);            // 戻したら、つられてチェックした分だけ外す
    }
    t.autoDone=false;   // 手で数えたら自動達成の管理から外す（枝分かれを外しても巻き戻さない）
    save(); render();
    if(act==='inc' && t.count>=t.target) toast('「'+t.text+'」達成！'+(filled?'（枝分かれ'+filled+'件もチェック）':''));
    else if(unfilled) toast('枝分かれ'+unfilled+'件のチェックも外しました');
    return;
  }

  /* --- タスク編集 --- */
  if(act==='edit-tasks'){
    editKey=currentViewKey();
    const w=getWeek(editKey);
    draft={ tasks: w.tasks.length ? w.tasks.map(t=>({id:t.id,text:t.text,target:t.target,count:t.count,actsText:(t.actions||[]).map(a=>a.text).join('\n')})) : [{id:uid(),text:'',target:1,count:0,actsText:''}] };
    mode='tasks'; render(); return;
  }
  if(act==='copy-prev'){
    editKey=currentViewKey();
    const pk=prevWeekWithTasks(editKey); if(!pk) return;
    draft={ tasks: db.weeks[pk].tasks.map(t=>({id:uid(),text:t.text,target:t.target,count:0,actsText:(t.actions||[]).map(a=>a.text).join('\n')})) };
    mode='tasks'; render(); return;
  }
  if(act==='add-task'){ syncTaskDraft(); draft.tasks.push({id:uid(),text:'',target:1,count:0,actsText:''}); render(); focusEnd('#tin-'+(draft.tasks.length-1)); return; }
  if(act==='rm-task'){ syncTaskDraft(); draft.tasks.splice(+btn.dataset.i,1); render(); return; }
  if(act==='ed-cancel'){ mode=null; draft=null; editKey=null; render(); return; }
  if(act==='ed-save'){
    syncTaskDraft();
    const ek=editKey||currentViewKey();
    const w=ensureWeek(ek);
    const orig=w.tasks;
    w.tasks=draft.tasks.map(t=>{
      const target=Math.max(1,Math.floor(+t.target||1));
      // 枝分かれ：1行=1Action。既存と同じ文言はチェック状態(done)を引き継ぐ
      const prev=((orig.find(x=>x.id===t.id)||{}).actions)||[];
      const used=new Set();
      const actions=String(t.actsText||'').split('\n').map(s=>s.trim()).filter(Boolean).map(line=>{
        const m=prev.find(p=>!used.has(p.id) && p.text===line);
        /* 文言が同じなら、ラリー・予定日・依頼中の旗・文面の結びを丸ごと引き継ぐ。
           ⚠️ ここで ask を落とすと、目標を編集し直すたびに「依頼中」が全部外れて
              Claudeに投げたものが自分の残タスクに戻ってきてしまう（2026-08-16 に発覚して修正）。 */
        if(m){ used.add(m.id); return {id:m.id, text:line, done:!!m.done, due:m.due||'', dueTo:m.dueTo||'', ask:!!m.ask, draftId:m.draftId||'', thread:threadOf(m)}; }
        return {id:uid(), text:line, done:false, due:'', dueTo:'', ask:false, draftId:'', thread:[]};
      });
      const o=orig.find(x=>x.id===t.id)||{};
      const alive=new Set(actions.map(a=>a.id));
      const nt={id:t.id, text:t.text.trim(), target, count:Math.min(t.count||0, target), actions,
                autoDone:!!o.autoDone, autoPrev:Math.min(Math.max(0, Math.floor(+o.autoPrev||0)), target),
                autoActs:(o.autoActs||[]).filter(id=>alive.has(id))};
      syncAutoDone(nt);   // 編集で枝分かれが全部済みになった／崩れた場合もここで合わせる
      return nt;
    }).filter(t=>t.text);
    const savedLab=weekLabel(ek);
    mode=null; draft=null; editKey=null; save(); render();
    toast(savedLab+'の目標を保存しました');
    return;
  }

  /* --- 振り返り --- */
  if(act==='open-review'){
    editKey=currentViewKey();
    const w=getWeek(editKey);
    const r=w.review||{};
    draft={ result:r.result||'', growth:r.growth||'', next:r.next||'' };
    mode='review'; render(); return;
  }
  if(act==='rv-result'){ syncReviewDraft(); draft.result=btn.dataset.v; render(); return; }
  if(act==='rv-cancel'){ mode=null; draft=null; editKey=null; render(); return; }
  if(act==='rv-save'){
    syncReviewDraft();
    if(!draft.result){ toast('達成・一部達成・未達 のどれかを選んでね'); return; }
    const w=ensureWeek(editKey||currentViewKey());
    w.review={ result:draft.result, growth:draft.growth.trim(), next:draft.next.trim(), at:todayISO() };
    mode=null; draft=null; editKey=null; save(); render();
    toast('振り返りを保存しました 🌱');
    return;
  }

  /* --- 月別マイルストーン --- */
  /* 月をタップ＝ひらく／閉じる。中身（やるべきこと・やれたら良いこと）はその場でチェックできる。
     目標そのものの編集は、開いた中の「目標と結果を書き直す」から入る（＝誤って上書きしない）。 */
  if(act==='month-open'){
    const ym=btn.dataset.ym;
    openMonth = (openMonth===ym) ? null : ym;
    mItemEdit=null; mode=null; draft=null;
    render();
    return;
  }
  if(act==='month-close'){ openMonth=null; mItemEdit=null; render(); return; }
  if(act==='month-edit'){
    const m=db.months.find(x=>x.ym===btn.dataset.ym); if(!m) return;
    draft={ goal:m.goal, status:m.status };
    mode={type:'month', ym:m.ym}; mItemEdit=null; render();
    return;
  }
  if(act==='mi-toggle'){
    const m=db.months.find(x=>x.ym===btn.dataset.ym); if(!m) return;
    const it=(m[btn.dataset.kind]||[]).find(x=>x.id===btn.dataset.id); if(!it) return;
    it.done=!it.done;
    bumpMove(it.done?1:-1);
    save(); render();
    return;
  }
  if(act==='mi-add'){ mItemEdit={ym:btn.dataset.ym, kind:btn.dataset.kind, id:null}; render(); focusEnd('.mi-text'); return; }
  if(act==='mi-edit'){ mItemEdit={ym:btn.dataset.ym, kind:btn.dataset.kind, id:btn.dataset.id}; render(); focusEnd('.mi-text'); return; }
  if(act==='mi-cancel'){ mItemEdit=null; render(); return; }
  if(act==='mi-save'){
    const m=db.months.find(x=>x.ym===btn.dataset.ym); if(!m) return;
    const kind=btn.dataset.kind, el=document.querySelector('.mi-text');
    const text=(el ? el.value : '').trim();
    if(!text){ toast('ひとこと書いてから保存してね'); return; }
    if(!Array.isArray(m[kind])) m[kind]=[];
    if(btn.dataset.id){
      const it=m[kind].find(x=>x.id===btn.dataset.id); if(it) it.text=text;
    } else {
      m[kind].push({ id:uid(), text, done:false });
    }
    mItemEdit=null; save(); render();
    return;
  }
  if(act==='mi-del'){
    const m=db.months.find(x=>x.ym===btn.dataset.ym); if(!m) return;
    const kind=btn.dataset.kind, id=btn.dataset.id;
    const i=(m[kind]||[]).findIndex(x=>x.id===id); if(i<0) return;
    const removed=m[kind][i];
    m[kind].splice(i,1);
    mItemEdit=null; save(); render();
    toast('消しました', { label:'取り消す', fn:()=>{ m[kind].splice(i,0,removed); save(); render(); } });
    return;
  }
  if(act==='m-status'){ syncMonthDraft(); draft.status=btn.dataset.v; render(); return; }
  if(act==='m-cancel'){ mode=null; draft=null; render(); return; }
  if(act==='m-save'){
    syncMonthDraft();
    const m=db.months.find(x=>x.ym===mode.ym);
    if(m){ m.goal=draft.goal.trim(); m.status=draft.status; }
    mode=null; draft=null; save(); render();
    toast('マイルストーンを保存しました');
    return;
  }
});

/* ===================== 下書きの箇条書きショートカット（旧・自由帳から引き継ぎ） =====================
   ・「-」「*」＋スペース → 「• 」箇条書きに変換、Enterで継続（空のままEnter＝解除）
   ・「1.」＋スペース → 番号リスト、Enterで自動採番（1) 形式もOK）
   ・「[]」＋スペース → 「- [ ] 」チェック項目に変換、Enterで継続
   ★keydown ではなく beforeinput で判定：iOSのソフトキーボードは keydown をまともに発火しないため。 */
const RE_CHECK=/^(\s*)([-*])\s+\[[ xX]?\]\s+/, RE_NUM=/^(\s*)(\d+)([.)])\s+/, RE_BUL=/^(\s*)([-*•])\s+/;
function lineHeadStart(v,pos){ return v.lastIndexOf('\n',pos-1)+1; }
function listContinue(ta,e){
  if(ta.selectionStart!==ta.selectionEnd) return false;
  const v=ta.value, pos=ta.selectionStart, start=lineHeadStart(v,pos), line=v.slice(start,pos);
  let m, marker=null, cs=0;
  if((m=line.match(RE_CHECK))){ marker=m[1]+m[2]+' [ ] '; cs=m[0].length; }
  else if((m=line.match(RE_NUM))){ marker=m[1]+(parseInt(m[2],10)+1)+m[3]+' '; cs=m[0].length; }
  else if((m=line.match(RE_BUL))){ marker=m[1]+m[2]+' '; cs=m[0].length; }
  else return false;
  if(line.slice(cs).trim()===''){            /* 中身が空 → マーカーを消してリスト解除 */
    e.preventDefault(); ta.value=v.slice(0,start)+v.slice(pos); ta.selectionStart=ta.selectionEnd=start; return true;
  }
  e.preventDefault(); const ins='\n'+marker; ta.value=v.slice(0,pos)+ins+v.slice(pos);
  ta.selectionStart=ta.selectionEnd=pos+ins.length; return true;
}
function listSpace(ta,e){
  if(ta.selectionStart!==ta.selectionEnd) return false;
  const v=ta.value, pos=ta.selectionStart, start=lineHeadStart(v,pos), line=v.slice(start,pos);
  let m, r=null;
  if((m=line.match(/^(\s*)\[( ?)\]$/))) r=m[1]+'- [ ] ';
  else if((m=line.match(/^(\s*)[-*•]$/))) r=m[1]+'• ';
  else return false;
  e.preventDefault(); ta.value=v.slice(0,start)+r+v.slice(pos);
  ta.selectionStart=ta.selectionEnd=start+r.length; return true;
}
document.querySelector('main').addEventListener('beforeinput', e=>{
  const ta=e.target;
  if(!ta || ta.tagName!=='TEXTAREA' || !ta.classList.contains('dft-text')) return;
  if(e.isComposing) return;              /* 日本語変換の確定Enter等は無視 */
  let handled=false;
  const t=e.inputType;
  if(t==='insertLineBreak'||t==='insertParagraph') handled=listContinue(ta,e);
  else if(t==='insertText'&&(e.data===' '||e.data==='　')) handled=listSpace(ta,e);
  if(!handled) return;
  /* preventDefault したぶん input イベントが出ないので、高さ調整と保存は自分でやる */
  autoGrow(ta);
  const d=findDraft(ta.dataset.id);
  if(d){ d.text=ta.value; save(); }
});

function syncTaskDraft(){
  document.querySelectorAll('.tin').forEach(inp=>{ const i=+inp.dataset.i; if(draft.tasks[i]) draft.tasks[i].text=inp.value; });
  document.querySelectorAll('.tnin').forEach(inp=>{ const i=+inp.dataset.i; if(draft.tasks[i]) draft.tasks[i].target=inp.value; });
  document.querySelectorAll('.acts-in').forEach(inp=>{ const i=+inp.dataset.i; if(draft.tasks[i]) draft.tasks[i].actsText=inp.value; });
}
function syncReviewDraft(){
  const g=document.getElementById('rvGrowth'); if(g) draft.growth=g.value;
  const n=document.getElementById('rvNext'); if(n) draft.next=n.value;
}
function syncMonthDraft(){
  const g=document.getElementById('mGoal'); if(g) draft.goal=g.value;
}
/* 月の中の1行・勝ち条件は、改行キーでそのまま保存できる（スマホで足しやすくするため） */
document.querySelector('main').addEventListener('keydown', e=>{
  if(e.key!=='Enter') return;
  if(e.target.classList.contains('mi-text')){
    e.preventDefault();
    const b=document.querySelector('[data-act="mi-save"]'); if(b) b.click();
    return;
  }
  if(e.target.classList.contains('win-in')){
    e.preventDefault();
    const b=document.querySelector('[data-act="win-save"]'); if(b) b.click();
  }
});
document.querySelector('main').addEventListener('input', e=>{
  /* 下書きは編集した端から保存する（描き直さないので、入力中もカーソルが飛ばない） */
  if(e.target.classList.contains('dft-title')){
    const d=findDraft(e.target.dataset.id);
    if(d){
      d.title=e.target.value;
      const head=e.target.closest('.dft').querySelector('.dft-t');
      if(head) head.textContent = d.title || '（無題）';
      save();
    }
    return;
  }
  if(e.target.classList.contains('dft-date')){
    const d=findDraft(e.target.dataset.id);
    if(d && isDate(e.target.value)){
      d.at=e.target.value;
      const head=e.target.closest('.dft').querySelector('.dft-d');
      if(head) head.textContent=fmtMD(d.at);   /* 並び替えは閉じたあと（書いている最中にカードが飛ばないように） */
      save();
    }
    return;
  }
  if(e.target.classList.contains('dft-text')){
    autoGrow(e.target);
    const d=findDraft(e.target.dataset.id);
    if(d){ d.text=e.target.value; save(); }
    return;
  }
  if(!draft) return;
  if(e.target.classList.contains('due-in')){ draft.due=e.target.value; return; }
  if(e.target.classList.contains('due-in2')){ draft.dueTo=e.target.value; return; }
  if(e.target.classList.contains('tin')){ const i=+e.target.dataset.i; if(draft.tasks[i]) draft.tasks[i].text=e.target.value; }
  else if(e.target.classList.contains('tnin')){ const i=+e.target.dataset.i; if(draft.tasks[i]) draft.tasks[i].target=e.target.value; }
  else if(e.target.classList.contains('acts-in')){ autoGrow(e.target); const i=+e.target.dataset.i; if(draft.tasks[i]) draft.tasks[i].actsText=e.target.value; }
  else if(e.target.classList.contains('thr-in')){ autoGrow(e.target); draft.text=e.target.value; }
  else if(e.target.classList.contains('win-in')){ draft.text=e.target.value; }
  else if(e.target.id==='rvGrowth'){ autoGrow(e.target); draft.growth=e.target.value; }
  else if(e.target.id==='rvNext'){ autoGrow(e.target); draft.next=e.target.value; }
  else if(e.target.id==='mGoal'){ draft.goal=e.target.value; }
});

/* ===================== メニュー（引き出し） ===================== */
(function(){
  const btn=document.getElementById('menuBtn');
  const dr=document.getElementById('drawer');
  const mask=document.getElementById('menuMask');
  function setOpen(on){
    dr.classList.toggle('show', on);
    mask.classList.toggle('show', on);
    dr.setAttribute('aria-hidden', on?'false':'true');
    btn.setAttribute('aria-expanded', on?'true':'false');
    document.body.style.overflow = on ? 'hidden' : '';
    if(on){ const f=dr.querySelector('.dr-item'); if(f) f.focus({preventScroll:true}); }
  }
  btn.addEventListener('click', ()=> setOpen(!dr.classList.contains('show')));
  mask.addEventListener('click', ()=> setOpen(false));
  dr.addEventListener('click', e=>{
    const it=e.target.closest('.dr-item'); if(!it) return;
    setOpen(false);
    if(it.hasAttribute('data-tool')) openTool(it.dataset.tool);
  });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape' && dr.classList.contains('show')) setOpen(false); });
})();

/* ===================== 道具箱（別ページに飛ばず、この画面の中で開く） =====================
   声かけメモ・時給計算・学んだことは、それぞれ独立したHTML（＝別々の保存先・同期先）のまま、
   この画面の中に <iframe> で読み込んで表示する。ページ遷移が起きないので「別サイトに飛んだ」
   感じにならず、一度開いた道具は入力途中のままタブのように行き来できる。 */
const TOOLS = {
  /* 対話だけは iframe ではなく、この画面のデータをそのまま描く（同じ db を触るので別HTMLにできない） */
  talk   :{ title:'対話',       local:true        },
  drafts :{ title:'下書き',     local:true        },
  koekake:{ title:'声かけメモ', src:'koekake.html' },
  jikyu  :{ title:'時給計算',   src:'jikyu.html'   },
  manabi :{ title:'学んだこと', src:'manabi.html'  },
};
/* 旧アドレスの受け皿。自由帳は下書きに統合したので、#jiyucho で来ても下書きを開く
   （ほかの道具の引き出しや、ホーム画面に残っているリンクを迷子にしないため） */
const TOOL_ALIAS = { jiyucho:'drafts' };
function toolId(id){ return TOOL_ALIAS[id] || id; }
let activeTool = '';

function currentTheme(){ return document.documentElement.getAttribute('data-theme') || ''; }
function sizeToolFrames(){
  const h=document.querySelector('.topbar').offsetHeight;
  document.querySelectorAll('.tool-frame').forEach(f=>{ f.style.height='calc(100dvh - '+h+'px)'; });
}
function postToTool(f){ try{ f.contentWindow.postMessage({type:'tsumiki-embed-theme', theme:currentTheme()}, '*'); }catch(e){} }
function broadcastTheme(){ document.querySelectorAll('.tool-frame').forEach(postToTool); }

function openTool(id, histMode){   /* histMode: 'push'(既定) / 'replace' / 'none' */
  id=toolId(id);
  const t=TOOLS[id]||null;
  activeTool = t ? id : '';
  document.body.classList.toggle('tool-on', !!t);
  document.getElementById('appTitle').textContent = t ? t.title : '独立ロードマップ';
  document.querySelectorAll('.dr-item[data-tool]').forEach(x=>{
    const on = (x.dataset.tool||'') === activeTool;
    x.classList.toggle('current', on);
    if(on) x.setAttribute('aria-current','page'); else x.removeAttribute('aria-current');
  });
  const pane=document.getElementById('toolPane');
  const talk=document.getElementById('talkPane');
  const dfts=document.getElementById('draftPane');
  document.body.classList.toggle('tool-local', !!(t && t.local));
  if(t && t.local){
    pane.querySelectorAll('.tool-frame').forEach(x=>x.classList.remove('active'));
    talk.classList.toggle('active', id==='talk');
    dfts.classList.toggle('active', id==='drafts');
    if(id==='talk'){
      let seen=0; eachAct(a=>{ seen+=markSeen(a); });   /* 全部見える画面なので、開いた時点で既読にする */
      if(seen) save();
      renderTalk();
      renderTalkBadge();   /* 開いた＝既読なので、メニュー側の新着表示も消す */
    } else {
      renderDrafts();
    }
    window.scrollTo(0,0);
  } else if(t){
    talk.classList.remove('active');
    dfts.classList.remove('active');
    let f=pane.querySelector('.tool-frame[data-tool="'+id+'"]');
    if(!f){   /* 初回だけ読み込む。2回目からは開いたままのものを見せる */
      f=document.createElement('iframe');
      f.className='tool-frame'; f.dataset.tool=id; f.title=t.title;
      f.src=t.src+'?embed=1'+(currentTheme()?'&theme='+currentTheme():'');
      f.addEventListener('load', ()=>postToTool(f));
      pane.appendChild(f);
    }
    pane.querySelectorAll('.tool-frame').forEach(x=>x.classList.toggle('active', x===f));
    sizeToolFrames();
    window.scrollTo(0,0);
  } else {
    talk.classList.remove('active');
    dfts.classList.remove('active');
  }
  /* URLの #jikyu などを合わせる → 端末の「戻る」でロードマップへ帰れる */
  if(histMode!=='none'){
    const url = activeTool ? '#'+activeTool : location.pathname+location.search;
    if(histMode==='replace') history.replaceState(null,'',url);
    else if((location.hash||'') !== (activeTool?'#'+activeTool:'')) history.pushState(null,'',url);
  }
}
/* 道具を開いている間の「左端から右へスワイプ＝ロードマップへ戻る」。
   つみきトップへ戻るスワイプ（#tsumikiEdge）より手前に置き、道具→ロードマップ→つみき の順で戻れるようにする。 */
(function(){
  const edge=document.getElementById('toolEdge'), peek=document.getElementById('toolPeek');
  let sx=0, sy=0, prog=0, dragging=false, W=innerWidth, TRIGGER=Math.min(120, W*0.32);
  addEventListener('resize', ()=>{ W=innerWidth; TRIGGER=Math.min(120, W*0.32); });
  function reset(){
    dragging=false; prog=0;
    peek.style.transition='transform .25s ease, opacity .25s ease';
    peek.style.transform='translateX(-70px) scale(.8)'; peek.style.opacity=0;
  }
  edge.addEventListener('touchstart', e=>{
    const t=e.touches[0]; if(t.clientX>26) return;
    sx=t.clientX; sy=t.clientY; prog=0; dragging=true; peek.style.transition='none';
  }, {passive:true});
  addEventListener('touchmove', e=>{
    if(!dragging) return;
    const t=e.touches[0]; let dx=t.clientX-sx; const dy=t.clientY-sy;
    if(Math.abs(dy)>Math.abs(dx)+12){ reset(); return; }
    if(dx<0) dx=0;
    prog=Math.min(dx/TRIGGER, 1);
    peek.style.transform='translateX('+(-70+prog*82)+'px) scale('+(0.8+prog*0.2)+')';
    peek.style.opacity=prog;
    if(dx>6 && e.cancelable) e.preventDefault();
  }, {passive:false});
  function end(){
    if(!dragging) return;
    dragging=false;
    if(prog>=0.999){ reset(); openTool(''); } else reset();
  }
  addEventListener('touchend', end, {passive:true});
  addEventListener('touchcancel', end, {passive:true});
})();
window.addEventListener('popstate', ()=>{
  const id=toolId((location.hash||'').replace('#',''));
  openTool(TOOLS[id]?id:'', 'none');
});
window.addEventListener('resize', ()=>{ if(activeTool) sizeToolFrames(); });

/* ===================== 金曜の振り返り通知 ===================== */
function notifyEnabled(){ return localStorage.getItem(NKEY)==='1' && ('Notification' in window) && Notification.permission==='granted'; }
function renderNotifyBtn(){
  const b=document.getElementById('notifyBtn');
  b.classList.toggle('on', notifyEnabled());
  b.title = notifyEnabled() ? '金曜の振り返り通知：オン' : '金曜の振り返り通知：オフ（タップで有効化）';
}
document.getElementById('notifyBtn').addEventListener('click', async ()=>{
  if(!('Notification' in window)){ toast('この環境は通知に対応していません'); return; }
  if(notifyEnabled()){
    localStorage.setItem(NKEY,'0'); renderNotifyBtn(); toast('振り返り通知をオフにしました'); return;
  }
  let perm=Notification.permission;
  if(perm==='default') perm=await Notification.requestPermission();
  if(perm==='granted'){
    localStorage.setItem(NKEY,'1'); renderNotifyBtn();
    toast('毎週金曜 '+(db.settings.reviewHour||17)+'時以降に振り返りをお知らせします');
  } else {
    toast('通知が許可されませんでした（ブラウザ設定を確認）');
  }
});
function checkNotify(){
  if(!notifyEnabled()) return;
  const now=new Date();
  if(now.getDay()!==5) return;
  if(now.getHours()<(db.settings.reviewHour||17)) return;
  if(getWeek(weekKey()).review) return;
  if(localStorage.getItem(NSTAMP)===todayISO()) return;
  localStorage.setItem(NSTAMP, todayISO());
  try{ new Notification('🧱 金曜の振り返り', { body:'今週の目標、どうだった？ 達成・未達・成長を記録しよう。', tag:'tsumiki-dokuritsu-review' }); }catch(e){}
}

/* ===================== 日付またぎ =====================
   開きっぱなし・バックグラウンドのどちらでも、日付が変わったら表示を今日基準に作り直す。
   「今週」を見ていたなら、日曜になった瞬間に新しい今週の目標へ自動で切り替わる
   （先の週を覗いていた時は、そのまま覗いた週にとどまる）。 */
let lastDay=todayISO();
function checkDayRollover(){
  const t=todayISO();
  if(t===lastDay) return;
  const wasWeek=sundayOf(lastDay);
  lastDay=t;
  if(!viewKey || viewKey===wasWeek){ viewKey=weekKey(); resetFolds(); }   /* 今週を見ていた場合だけ追従（編集中の保存先=editKeyは動かさない） */
  if(!mode) render();
}
setInterval(()=>{ checkDayRollover(); checkNotify(); }, 30000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ checkDayRollover(); checkNotify(); } });
window.addEventListener('focus', ()=>{ checkDayRollover(); });
window.addEventListener('pageshow', ()=>{ checkDayRollover(); });

/* ===================== テーマ ===================== */
function applyTheme(t){ if(t) document.documentElement.setAttribute('data-theme',t); else document.documentElement.removeAttribute('data-theme'); }
(function(){ const s=localStorage.getItem('tsumiki_roadmap_theme'); if(s) applyTheme(s); })();
document.getElementById('themeBtn').addEventListener('click', ()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const isDark = cur ? cur==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  const next=isDark?'light':'dark'; applyTheme(next); localStorage.setItem('tsumiki_roadmap_theme', next);
  broadcastTheme();   /* 開いている道具（iframe）の表示も一緒に切り替える */
});

/* ===================== 起動 ===================== */
loadLocal();
render();
checkNotify();
/* 直リンク（#jikyu など）で開かれたときも、飛ばずにこの画面の中で開く */
(function(){ const id=toolId((location.hash||'').replace('#','')); if(TOOLS[id]) openTool(id,'replace'); })();
/* 旧・自由帳の中身は、クラウドの中身を読み終えてから一度だけ引き継ぐ
   （先にやると「引き継ぎ済み」の印が上書きされて、二重に増えるおそれがある） */
if(sb){ loadRemote().then(pullJiyucho); subscribeRealtime(); }
else { pullJiyucho(); }
</script>

<style>
  #tsumikiEdge{position:fixed; top:0; bottom:0; left:0; width:22px; z-index:999;}
  #tsumikiPeek{
    position:fixed; top:50%; left:0; z-index:1001; margin-top:-23px;

    background:rgba(255,255,255,.92);

    border:1px solid rgba(0,0,0,.06); border-radius:50%;
    box-shadow:0 6px 20px rgba(0,0,0,.18);
    color:#0071e3; font-size:24px; font-weight:600; line-height:1;

    transform:translateX(-70px) scale(.8); opacity:0; pointer-events:none;
  }
</style>
<div id="tsumikiEdge"></div>

<script>
  (function(){
    var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
      || window.navigator.standalone === true;
    var fromTsumiki = false;
    try{
      if(document.referrer){
        var r = new URL(document.referrer);
        fromTsumiki = (r.origin === location.origin);
      }
    }catch(e){}
    if(!(standalone && fromTsumiki)) return;

    var peek = document.getElementById('tsumikiPeek');
    var edge = document.getElementById('tsumikiEdge');

    function goBack(){ location.href = 'index.html'; }

    /* --- 左端エッジスワイプで戻る（iOS純正の戻る操作。見えるボタンは置かない） --- */
    var sx=0, sy=0, prog=0, dragging=false, W=window.innerWidth;
    var TRIGGER = Math.min(120, W*0.32);
    window.addEventListener('resize', function(){ W=window.innerWidth; TRIGGER=Math.min(120, W*0.32); });

    function reset(){
      dragging = false; prog = 0;
      peek.style.transition = 'transform .25s ease, opacity .25s ease';
      peek.style.transform = 'translateX(-70px) scale(.8)';
      peek.style.opacity = 0;
    }
    function start(e){
      var t = e.touches ? e.touches[0] : e;
      if(t.clientX > 26) return;
      sx = t.clientX; sy = t.clientY; prog = 0; dragging = true;
      peek.style.transition = 'none';
    }
    function move(e){
      if(!dragging) return;
      var t = e.touches ? e.touches[0] : e;
      var dx = t.clientX - sx, dy = t.clientY - sy;
      if(Math.abs(dy) > Math.abs(dx) + 12){ reset(); return; }
      if(dx < 0) dx = 0;
      prog = Math.min(dx / TRIGGER, 1);
      peek.style.transform = 'translateX(' + (-70 + prog*82) + 'px) scale(' + (0.8 + prog*0.2) + ')';
      peek.style.opacity = prog;
      if(dx > 6 && e.cancelable) e.preventDefault();
    }
    function end(){
      if(!dragging) return;
      dragging = false;
      if(prog >= 0.999){
        peek.style.transition = 'transform .25s ease, opacity .25s ease';
        peek.style.transform = 'translateX(20px) scale(1.05)';
        peek.style.opacity = 1;
        goBack();
      }else{
        reset();
      }
    }
    edge.addEventListener('touchstart', start, {passive:true});
    window.addEventListener('touchmove', move, {passive:false});
    window.addEventListener('touchend', end, {passive:true});
    window.addEventListener('touchcancel', end, {passive:true});
  })();
</script>
