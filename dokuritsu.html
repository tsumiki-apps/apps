<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="apple-touch-icon" href="icons/icon-dokuritsu.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="独立">
<meta name="theme-color" content="#f5f4f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131109" media="(prefers-color-scheme: dark)">
<title>独立ロードマップ</title>
<style>
  :root{
    --paper:#f5f4f0; --surface:#fffefb; --surface-2:#efece5; --ink:#1d1a15;
    --ink-mid:#5b554a; --ink-soft:#8f8877; --line:#e2ded4; --line-2:#d8d3c7;
    --accent:#b06f26; --accent-2:#8a5a24; --accent-wash:#f0e4d1;
    --good:#4c7a51; --good-wash:#dde9dd; --warn:#b0522a; --warn-wash:#f2e0d4;
    --cell-empty:#e6e1d6;
    --shadow:0 1px 2px rgba(40,32,18,.05), 0 10px 26px -16px rgba(40,32,18,.18);
    --serif:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Songti SC",serif;
    --sans:"Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,Meiryo,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#131109; --surface:#1d1a12; --surface-2:#26221a; --ink:#efe8da;
      --ink-mid:#a89e8b; --ink-soft:#7d7566; --line:#2f2b21; --line-2:#3a352a;
      --accent:#d59a4d; --accent-2:#e0ab63; --accent-wash:#362a19;
      --good:#7fae82; --good-wash:#23301f; --warn:#d9825a; --warn-wash:#39251a;
      --cell-empty:#2c281e;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 30px -18px rgba(0,0,0,.65);
    }
  }
  :root[data-theme="light"]{
    --paper:#f5f4f0; --surface:#fffefb; --surface-2:#efece5; --ink:#1d1a15;
    --ink-mid:#5b554a; --ink-soft:#8f8877; --line:#e2ded4; --line-2:#d8d3c7;
    --accent:#b06f26; --accent-2:#8a5a24; --accent-wash:#f0e4d1;
    --good:#4c7a51; --good-wash:#dde9dd; --warn:#b0522a; --warn-wash:#f2e0d4;
    --cell-empty:#e6e1d6;
    --shadow:0 1px 2px rgba(40,32,18,.05), 0 10px 26px -16px rgba(40,32,18,.18);
  }
  :root[data-theme="dark"]{
    --paper:#131109; --surface:#1d1a12; --surface-2:#26221a; --ink:#efe8da;
    --ink-mid:#a89e8b; --ink-soft:#7d7566; --line:#2f2b21; --line-2:#3a352a;
    --accent:#d59a4d; --accent-2:#e0ab63; --accent-wash:#362a19;
    --good:#7fae82; --good-wash:#23301f; --warn:#d9825a; --warn-wash:#39251a;
    --cell-empty:#2c281e;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 30px -18px rgba(0,0,0,.65);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink); font-family:var(--sans);
    line-height:1.6; -webkit-font-smoothing:antialiased; font-feature-settings:"palt" 1; -webkit-text-size-adjust:100%;
  }
  .tnum{font-variant-numeric:tabular-nums;}

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--paper) 88%, transparent);
    backdrop-filter:saturate(1.3) blur(10px); -webkit-backdrop-filter:saturate(1.3) blur(10px);
    border-bottom:1px solid var(--line); padding:calc(env(safe-area-inset-top) + 12px) 0 12px;
  }
  /* ヘッダーの中身は本文と同じ幅・同じ左右余白に揃える */
  .topbar .inner{
    max-width:560px; margin:0 auto; padding:0 16px;
    display:flex; align-items:center; gap:10px;
  }
  .brand{display:flex; align-items:center; gap:10px; min-width:0;}
  .brand .cube{
    width:22px; height:22px; flex:none;
    background:
      linear-gradient(var(--accent),var(--accent)) left top/9px 9px no-repeat,
      linear-gradient(var(--accent),var(--accent)) right top/9px 9px no-repeat,
      linear-gradient(var(--accent-2),var(--accent-2)) center bottom/9px 9px no-repeat;
  }
  .brand h1{font-family:var(--serif); font-weight:600; font-size:1.1rem; margin:0; letter-spacing:.02em; white-space:nowrap;}
  .spacer{flex:1;}
  .iconbtn{
    width:34px; height:34px; flex:none; border:1px solid var(--line); background:var(--surface);
    border-radius:9px; color:var(--ink-mid); display:grid; place-items:center; cursor:pointer;
    text-decoration:none; padding:0;
  }
  .iconbtn:active{transform:scale(.94);}
  .iconbtn.on{color:var(--accent); border-color:var(--accent); background:var(--accent-wash);}
  /* 三本線の右上の点＝対話に新着（未読）がある合図 */
  #menuBtn{position:relative;}
  #menuBtn.has-new::after{
    content:""; position:absolute; top:-3px; right:-3px; width:9px; height:9px; border-radius:50%;
    background:var(--accent); border:2px solid var(--surface);
  }
  .sync-dot{width:8px; height:8px; border-radius:50%; background:var(--ink-soft); flex:none;}
  .sync-dot.ok{background:var(--good);} .sync-dot.off{background:var(--accent);}

  /* ---------- メニュー（三本線 → 引き出し） ----------
     z-index は戻るボタン（#tsumikiEdge=999 / #tsumikiPeek=1001）より上。
     開いている間は左端エッジスワイプ（戻る）を覆って誤爆を防ぐ。 */
  .menu-mask{
    position:fixed; inset:0; background:rgba(24,19,10,.42); z-index:1010;
    opacity:0; pointer-events:none; transition:opacity .22s;
  }
  .menu-mask.show{opacity:1; pointer-events:auto;}
  .drawer{
    position:fixed; top:0; left:0; bottom:0; width:min(80vw,286px); z-index:1011;
    background:var(--surface); border-right:1px solid var(--line);
    box-shadow:0 0 44px -10px rgba(24,19,10,.4);
    transform:translateX(-101%); transition:transform .26s cubic-bezier(.22,.61,.36,1);
    padding:calc(env(safe-area-inset-top) + 14px) 12px calc(env(safe-area-inset-bottom) + 14px);
    display:flex; flex-direction:column; gap:12px; overflow-y:auto; overscroll-behavior:contain;
  }
  .drawer.show{transform:none;}
  .dr-head{display:flex; align-items:center; gap:9px; padding:2px 8px 12px; border-bottom:1px solid var(--line);}
  .dr-head .cube{
    width:18px; height:18px; flex:none;
    background:
      linear-gradient(var(--accent),var(--accent)) left top/7px 7px no-repeat,
      linear-gradient(var(--accent),var(--accent)) right top/7px 7px no-repeat,
      linear-gradient(var(--accent-2),var(--accent-2)) center bottom/7px 7px no-repeat;
  }
  .dr-head b{font-family:var(--serif); font-weight:600; font-size:.98rem; letter-spacing:.02em;}
  .dr-nav{display:grid; gap:3px;}
  .dr-item{
    display:flex; align-items:center; gap:11px; padding:12px 11px; border-radius:12px;
    text-decoration:none; color:var(--ink); font-size:.95rem; font-weight:700; line-height:1.35;
    width:100%; text-align:left; background:transparent; border:none; font-family:var(--sans); cursor:pointer;
  }
  .dr-item svg{
    width:19px; height:19px; flex:none; color:var(--ink-soft);
    stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round;
  }
  .dr-item:active{background:var(--surface-2);}
  .dr-item.current{background:var(--accent-wash); color:var(--accent-2);}
  .dr-item.current svg{color:var(--accent-2);}
  .dr-item.soon{color:var(--ink-soft); font-weight:600;}
  .dr-item .soon-tag{
    margin-left:auto; flex:none; font-size:.66rem; font-weight:700; letter-spacing:.04em;
    color:var(--ink-soft); border:1px solid var(--line-2); border-radius:99px; padding:2px 7px;
  }
  /* メニュー内の対話バッジ（新着 / 返信待ち） */
  .dr-item .dr-badge{
    margin-left:auto; flex:none; font-size:.68rem; font-weight:700; letter-spacing:.02em;
    border-radius:99px; padding:2px 8px; white-space:nowrap;
    background:var(--accent-wash); border:1px solid var(--accent); color:var(--accent-2);
  }
  .dr-item .dr-badge.wait{background:var(--surface-2); border-color:var(--line-2); color:var(--ink-mid);}
  .dr-note{margin-top:auto; padding:12px 10px 0; font-size:.72rem; color:var(--ink-soft); line-height:1.5;}

  /* ---------- tabs / layout ---------- */
  main{max-width:560px; margin:0 auto; padding:16px 16px calc(env(safe-area-inset-bottom) + 40px); display:grid; gap:15px;}
  .tabs{
    display:grid; grid-template-columns:1fr 1fr; gap:5px; background:var(--surface-2);
    border:1px solid var(--line); border-radius:13px; padding:5px;
  }
  .tabs button{
    border:none; background:transparent; color:var(--ink-mid); font-family:var(--sans);
    font-size:.95rem; font-weight:700; padding:10px 6px; border-radius:9px; cursor:pointer;
  }
  .tabs button.active{background:var(--surface); color:var(--ink); box-shadow:var(--shadow);}
  /* grid-template-columns:minmax(0,1fr) ＝ 中に横長のもの（ガントの帯）が入っても
     列がそれに合わせて伸びない＝カードは画面幅どまり、はみ出す分はその中で横スクロールになる */
  .page{display:none; gap:15px; min-width:0; grid-template-columns:minmax(0,1fr);}
  .page.active{display:grid;}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow); padding:18px 19px;}

  /* ---------- 道具箱（別ページに飛ばず、この画面の中で開く） ---------- */
  #toolPane{display:none; grid-column:1/-1;}
  .tool-frame{display:none; width:100%; border:0; background:var(--paper);}
  .tool-frame.active{display:block;}
  body.tool-on #toolPane{display:block;}
  body.tool-on main{max-width:none; padding:0; grid-template-columns:1fr; gap:0;}
  body.tool-on .tabs{display:none !important;}
  body.tool-on .page{display:none !important;}
  body.tool-on{overflow:hidden;}
  body.tool-on #notifyBtn, body.tool-on #syncDot{display:none;}
  /* 道具を開いている間だけ、左端スワイプでロードマップへ戻る（見えるボタンは置かない） */
  #toolEdge{display:none; position:fixed; top:0; bottom:0; left:0; width:22px; z-index:1000;}
  body.tool-on #toolEdge{display:block;}
  #toolPeek{
    position:fixed; top:50%; left:0; z-index:1002; margin-top:-23px;
    width:46px; height:46px; display:flex; align-items:center; justify-content:center;
    background:var(--surface); border:1px solid var(--line); border-radius:50%;
    box-shadow:0 6px 20px rgba(24,19,10,.28); color:var(--accent-2);
    font-size:24px; font-weight:600; line-height:1; font-family:var(--sans);
    transform:translateX(-70px) scale(.8); opacity:0; pointer-events:none;
  }
  /* ラベルは既定でグレー。accent（茶）は「今日やる」専用にして、目立つ場所を1つに絞る */
  .label{font-size:.74rem; font-weight:700; letter-spacing:.06em; color:var(--ink-mid); text-transform:uppercase;}

  @media (min-width:1080px){
    main{
      max-width:1180px; grid-template-columns:minmax(0,1.06fr) minmax(0,.94fr);
      align-items:start; gap:22px; padding-top:22px;
    }
    .topbar .inner{max-width:1180px;}
    .tabs{display:none;}
    .page{display:grid !important;}
    /* 右カラム（卒業まで）は短く終わるので、左を読み進めても付いてくる */
    #pageGrad{
      position:sticky; top:82px; align-self:start;
      max-height:calc(100vh - 100px); overflow-y:auto; overscroll-behavior:contain;
      padding:2px 3px 4px 0; scrollbar-width:thin;
    }
    #pageGrad::-webkit-scrollbar{width:7px;}
    #pageGrad::-webkit-scrollbar-thumb{background:var(--line-2); border-radius:99px;}
    #pageGrad::-webkit-scrollbar-track{background:transparent;}
  }
  /* サブディスプレイ（iPad mini 縦置き等）：縦長の広め画面はタブなしで縦積み常時表示 */
  @media (min-width:600px) and (max-width:1079px) and (orientation:portrait){
    main{max-width:660px;}
    .topbar .inner{max-width:660px;}
    .tabs{display:none;}
    .page{display:grid !important;}
  }

  /* ---------- progress bar ---------- */
  .bar{display:block; height:9px; background:var(--cell-empty); border-radius:99px; overflow:hidden;}
  .bar i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--accent),var(--accent-2)); border-radius:99px; transition:width .35s ease;}
  .bar.good i{background:linear-gradient(90deg,var(--good),#3f6a44);}

  /* ---------- 週バー（カードをやめて1行に。「今どの週か」だけを伝える） ---------- */
  .weekbar{display:flex; align-items:center; gap:9px; padding:1px 2px 0;}
  .weekbar .wb{flex:1; min-width:0; display:grid; gap:6px;}
  .weekbar .wb-t{display:flex; align-items:baseline; gap:8px; min-width:0;}
  .weekbar .wb-t .n{flex:none; font-family:var(--serif); font-weight:600; font-size:1rem;}
  .weekbar .wb-t .r{flex:1; min-width:0; font-size:.73rem; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .weekbar .wb-t .p{flex:none; font-size:.78rem; font-weight:700; color:var(--ink-mid);}
  .weekbar .wb-t .p em{font-style:normal; font-weight:400; color:var(--ink-soft);}
  .weekbar .bar{height:5px;}
  .wnav{
    width:30px; height:30px; flex:none; border:1px solid var(--line); background:var(--surface);
    border-radius:9px; color:var(--ink-mid); font-size:1.1rem; line-height:1; cursor:pointer;
    display:grid; place-items:center; font-family:var(--sans); padding:0;
  }
  .wnav:active{transform:scale(.92);}
  .wnav[disabled]{opacity:.28; pointer-events:none;}
  .week-jump{display:flex; justify-content:center;}
  .week-done-msg{margin-top:10px; text-align:center; font-weight:700; color:var(--good); font-size:.93rem;}

  /* ---------- 今日やる（トップページの主役。ここだけ accent を使う） ---------- */
  .card.today{border-color:var(--accent);}
  .card.today .label{color:var(--accent-2);}
  .today-list{display:grid; gap:8px; margin-top:11px;}
  .ti{
    display:flex; align-items:flex-start; gap:10px; width:100%; cursor:pointer; text-align:left;
    background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:10px 11px;
    font-family:var(--sans); color:var(--ink); -webkit-user-select:none; user-select:none;
  }
  .ti:active{transform:scale(.995);}
  .ti .adot{
    width:21px; height:21px; flex:none; margin-top:2px; border:1.5px solid var(--line-2); border-radius:50%;
    display:grid; place-items:center; color:transparent; background:var(--surface); transition:.15s;
  }
  .ti.done{background:var(--good-wash); border-color:var(--good);}
  .ti .tib{flex:1; min-width:0; display:grid; gap:3px;}
  .ti .tix{font-size:.92rem; line-height:1.45; word-break:break-word;}
  .ti .tig{font-size:.71rem; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .ti .tig .hot{font-weight:700; color:var(--warn);}
  .ti .tig .now{font-weight:700; color:var(--good);}
  .today-none{margin-top:11px; font-size:.88rem; color:var(--ink-mid);}

  /* ---------- 目標＝1行。押した時だけ枝分かれが開く（同時に1つだけ） ---------- */
  .goals{display:grid; gap:9px;}
  .goalwrap{display:grid;}
  .goal{
    display:flex; align-items:center; gap:10px; width:100%; cursor:pointer; padding:10px 11px;
    background:var(--surface-2); border:1.5px solid var(--line); border-radius:13px;
    -webkit-user-select:none; user-select:none; transition:border-color .18s;
  }
  .goal:active{transform:scale(.996);}
  .goal.open{background:var(--surface); border-color:var(--line-2); border-bottom-left-radius:0; border-bottom-right-radius:0; border-bottom-color:transparent;}
  .gtick{
    width:30px; height:30px; flex:none; border:2px solid var(--line-2); border-radius:50%;
    display:grid; place-items:center; color:var(--ink-mid); background:var(--surface);
    cursor:pointer; padding:0; transition:.18s;
  }
  .gtick:active{transform:scale(.9);}
  .goal.some .gtick{border-color:var(--accent); color:var(--accent-2);}
  .goal.done .gtick{background:linear-gradient(155deg,var(--good),#3f6a44); border-color:transparent; color:#fff;}
  .gtext{flex:1; min-width:0; font-size:.95rem; line-height:1.45; word-break:break-word;}
  .goal.done .gtext{color:var(--ink-mid);}
  .gcount{flex:none; font-size:.79rem; font-weight:700; color:var(--ink-mid);}
  .gleft{flex:none; font-size:.72rem; font-weight:700; color:var(--ink-soft);}
  .goal .fcar{flex:none; color:var(--ink-soft); font-size:.85rem; transition:transform .2s;}
  .goal.open .fcar{transform:rotate(180deg);}
  .gbody{
    background:var(--surface); border:1.5px solid var(--line-2); border-top:none;
    border-radius:0 0 13px 13px; padding:2px 11px 10px; display:grid; gap:7px;
  }
  .gchips{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .gchip{
    display:inline-flex; align-items:center; gap:4px; flex:none; font-family:var(--sans);
    font-size:.71rem; font-weight:700; color:var(--ink-soft); white-space:nowrap;
    background:var(--surface-2); border:1px solid var(--line); border-radius:99px; padding:4px 10px; cursor:pointer;
  }
  .gchip.flat{cursor:default;}
  .gchip.on{border-color:var(--line-2); color:var(--ink-mid); background:var(--surface);}
  .gchip:active{transform:scale(.95);}
  .gnote{font-size:.75rem; color:var(--ink-soft);}

  /* ---------- 長い文は畳む（データは触らず、表示だけ短くする） ---------- */
  .cl1,.cl2{display:-webkit-box; -webkit-box-orient:vertical; overflow:hidden;}
  .cl1{-webkit-line-clamp:1;}
  .cl2{-webkit-line-clamp:2;}
  .dim{color:var(--ink-soft);}   /* （　）の中＝補足。主文を立たせるために薄くする */
  /* 「…」は最後の行の右端に重ねて置く＝畳んでも行が増えない */
  .tix, .atext{position:relative; --tx-bg:var(--surface-2);}
  .gbody .atext{--tx-bg:var(--surface);}
  .more{
    position:absolute; right:0; bottom:0; border:none; cursor:pointer;
    color:var(--ink-soft); font-family:var(--sans); font-size:.8rem; font-weight:700; line-height:1.45;
    padding:0 1px 0 22px; letter-spacing:.06em;
    background:linear-gradient(90deg, transparent, var(--tx-bg) 45%);
  }
  .more.open{position:static; display:inline-block; padding:0 6px 0 2px; background:transparent; font-size:.72rem;}
  .more:active{opacity:.5;}

  /* ---------- 枝分かれAction（開いた目標の中に並べる） ---------- */
  .acts{display:grid; gap:3px;}
  .act{
    display:flex; align-items:flex-start; gap:8px; padding:6px 4px; border-radius:10px;
    background:transparent; border:1px solid transparent; cursor:pointer;
    -webkit-user-select:none; user-select:none; transition:background .15s, border-color .15s;
  }
  @media (hover:hover){ .act:hover{background:var(--surface-2);} }
  .act:active{transform:scale(.99);}
  .act .adot{
    width:19px; height:19px; flex:none; margin-top:2px; border:1.5px solid var(--line-2); border-radius:50%;
    display:grid; place-items:center; color:transparent; background:var(--surface); transition:.15s;
  }
  .act.done{border-color:var(--good); background:var(--good-wash);}
  .act.done .adot, .ti.done .adot{background:var(--good); border-color:transparent; color:#fff;}
  .act .atext{flex:1; min-width:0; font-size:.88rem; line-height:1.45; color:var(--ink); word-break:break-word;}
  .act.done .atext{color:var(--ink-soft); text-decoration:line-through; text-decoration-color:var(--line-2);}
  .act .amemo, .ti .amemo{
    position:relative; flex:none; min-width:32px; height:32px; padding:0 5px; border:none;
    background:transparent; border-radius:8px; color:var(--ink-soft);
    display:flex; align-items:center; gap:3px; justify-content:center; cursor:pointer; opacity:.75;
    font-family:var(--sans); font-size:.72rem; font-weight:700;
  }
  .amemo.has{color:var(--ink-mid); opacity:1;}
  .amemo.has:has(.dot){color:var(--accent-2);}   /* 新着があるものだけ色をつける */
  .amemo:active{transform:scale(.9);}
  /* 未読（Claudeの返信をまだ見ていない）の赤ぽち */
  .amemo .dot{
    position:absolute; top:1px; right:0; width:7px; height:7px; border-radius:50%;
    background:var(--accent); border:1.5px solid var(--surface-2);
  }

  /* ---------- ラリー（メモの往復＝スレッド） ---------- */
  .thr{display:grid; gap:7px; margin:1px 0 7px 27px; padding-right:2px;}
  .brow{display:flex; align-items:flex-start; gap:6px;}
  .brow.me{justify-content:flex-end;}
  .brow.ai{justify-content:flex-start;}
  .bub{
    max-width:min(90%, 420px); padding:8px 11px; border-radius:13px; font-size:.85rem; line-height:1.55;
    white-space:pre-wrap; word-break:break-word; cursor:pointer; border:1px solid transparent;
  }
  .bub.me{background:var(--surface-2); border-color:var(--line); border-bottom-right-radius:4px; color:var(--ink);}
  .bub.ai{
    background:var(--accent-wash); border-bottom-left-radius:4px; cursor:default;
    font-family:var(--serif); font-size:.9rem; color:var(--ink);
  }
  .bub.wait{border-style:dashed; border-color:var(--line-2);}
  .bub.unseen{box-shadow:0 0 0 1.5px var(--accent);}
  /* 読み終わった吹き出しはトップページでは3行で切る（未読＝Claudeの新しい返事だけ全文のまま） */
  /* 3行ぶん(1.55em×3)＋上下の余白。ai は「Claude」の1行があるのでその分を足す */
  .bub.cut{position:relative; max-height:calc(4.65em + 18px); overflow:hidden;}
  .bub.ai.cut{max-height:calc(4.65em + 37px);}
  .bub.cut::after{
    content:""; position:absolute; left:0; right:0; bottom:0; height:1.5em; pointer-events:none;
    background:linear-gradient(180deg, transparent, var(--surface-2));
  }
  .bub.ai.cut::after{background:linear-gradient(180deg, transparent, var(--accent-wash));}
  .bub .bwho{display:block; font-family:var(--sans); font-size:.66rem; font-weight:700; letter-spacing:.04em; color:var(--accent-2); margin-bottom:3px;}
  .btag{flex:none; width:16px; height:16px; margin-top:9px; stroke:currentColor; fill:none; stroke-width:2.1; stroke-linecap:round; stroke-linejoin:round;}
  .btag.t-mayoi{color:var(--accent);}
  .btag.t-yatta{color:var(--good);}
  .btag.t-toi{color:var(--accent-2);}
  .thr-more{
    justify-self:center; border:none; background:transparent; color:var(--ink-soft); font-family:var(--sans);
    font-size:.72rem; font-weight:700; cursor:pointer; padding:1px 6px 2px;
    text-decoration:underline; text-underline-offset:3px;
  }
  .thr-more:active{transform:scale(.96);}
  .thr-add{
    justify-self:start; border:1px dashed var(--line-2); background:transparent; color:var(--ink-soft);
    font-family:var(--sans); font-size:.76rem; font-weight:700; cursor:pointer;
    padding:6px 12px; border-radius:9px;
  }
  .thr-add:active{transform:scale(.97);}
  /* 書き足すボタンの並び。既読ボタンは右端に静かに置く（押すとやりとりを片づける＝消す） */
  .thr-foot{display:flex; align-items:center; gap:8px;}
  .thr-foot .thr-add{flex:none;}
  .thr-ack{
    margin-left:auto; border:1px solid var(--line-2); background:transparent; color:var(--ink-soft);
    font-family:var(--sans); font-size:.74rem; font-weight:700; cursor:pointer; white-space:nowrap;
    padding:6px 11px; border-radius:9px; display:inline-flex; align-items:center; gap:4px;
  }
  .thr-ack:active{transform:scale(.97);}

  /* ---------- 予定日（いつやるか決まった枝分かれは「今」から外す） ---------- */
  .act .adue{
    flex:none; height:30px; padding:0 8px; border:1px solid var(--line-2); background:var(--surface);
    border-radius:8px; color:var(--ink-soft); display:flex; align-items:center; gap:4px; cursor:pointer;
    font-family:var(--sans); font-size:.72rem; font-weight:700; white-space:nowrap;
  }
  .act .adue svg{width:14px; height:14px; flex:none; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;}
  .act .adue:active{transform:scale(.92);}
  .act .adue.none{opacity:.42; border-style:dashed; padding:0 6px;}
  /* 先の予定はグレー（急がない）。今日＝緑・過ぎている＝赤だけ色をつける */
  .act .adue.set{border-color:var(--line-2); color:var(--ink-mid); background:var(--surface-2);}
  .act .adue.today{border-color:var(--good); color:var(--good); background:var(--good-wash);}
  .act .adue.over{border-color:var(--warn); color:var(--warn); background:var(--warn-wash);}
  /* ---------- 依頼中（Claudeにボールを渡した枝分かれ） ----------
     予定日ボタンと同じ場所・同じ大きさに出す。押すと自分のボールに戻る。 */
  .act .aask{
    flex:none; height:30px; padding:0 9px; border:1px solid var(--accent); background:var(--accent-wash);
    border-radius:8px; color:var(--accent-2); display:flex; align-items:center; gap:4px; cursor:pointer;
    font-family:var(--sans); font-size:.72rem; font-weight:700; white-space:nowrap;
  }
  .act .aask svg{width:14px; height:14px;}
  .act .aask:active{transform:scale(.92);}
  .act.asked .atext{color:var(--ink-soft);}   /* 自分の手は離れている＝主張を弱める */

  /* 書き込み欄の下の「これはClaudeへの依頼にする」 */
  .askchip{
    display:flex; align-items:center; gap:7px; width:100%; text-align:left; cursor:pointer;
    border:1.5px dashed var(--line-2); background:transparent; border-radius:10px; padding:8px 10px;
    color:var(--ink-soft); font-family:var(--sans); font-size:.76rem; font-weight:700; line-height:1.4;
  }
  .askchip svg{width:15px; height:15px; flex:none;}
  .askchip:active{transform:scale(.99);}
  .askchip.on{border-style:solid; border-color:var(--accent); background:var(--accent-wash); color:var(--accent-2);}

  .done-fold.ask{color:var(--accent-2); border-color:var(--accent);}
  .done-fold.ask svg{color:var(--accent-2);}
  .ask-list{margin-top:11px;}

  .due-ed{
    display:grid; gap:9px; margin:1px 0 9px 27px; padding:11px 12px;
    background:var(--surface-2); border:1.5px solid var(--accent); border-radius:12px;
  }
  .talk-a .due-ed{margin-left:0;}
  .due-ed .lab{font-size:.74rem; font-weight:700; color:var(--ink-mid); line-height:1.5;}
  .due-ed .dates{display:flex; align-items:center; gap:7px;}
  .due-ed input[type=date]{
    flex:1; min-width:0; border:1.5px solid var(--line); background:var(--surface); border-radius:10px;
    padding:9px 10px; font-size:16px; color:var(--ink); font-family:var(--sans);
  }
  .due-ed .tilde{flex:none; font-size:.8rem; color:var(--ink-soft);}
  .due-ed .quick{display:flex; gap:6px; flex-wrap:wrap;}
  .due-ed .quick button{
    border:1px solid var(--line-2); background:var(--surface); color:var(--ink-mid); border-radius:99px;
    padding:6px 12px; font-size:.78rem; font-weight:700; font-family:var(--sans); cursor:pointer;
  }
  .due-ed .quick button:active{transform:scale(.95);}
  .due-ed .row{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .due-ed .sp{flex:1; min-width:0;}

  /* ---------- この先の予定（ふだんは1行。押した時だけ中身を出す） ---------- */
  .futrow{
    display:flex; align-items:center; gap:9px; width:100%; cursor:pointer; text-align:left;
    background:transparent; border:1.5px dashed var(--line-2); border-radius:13px; padding:11px 14px;
    color:var(--ink-mid); font-family:var(--sans); font-size:.85rem; font-weight:700;
  }
  .futrow svg{width:15px; height:15px; flex:none; color:var(--ink-soft); stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;}
  .futrow .fnext{margin-left:auto; font-size:.76rem; font-weight:700; color:var(--ink-soft);}
  .futrow .fcar{flex:none; font-size:.85rem; color:var(--ink-soft); transition:transform .2s;}
  .futrow.open{border-style:solid; border-color:var(--line); background:var(--surface-2);}
  .futrow.open .fcar{transform:rotate(180deg);}
  .futrow:active{transform:scale(.99);}
  .fut{display:grid; gap:8px; margin-top:9px;}
  .fut-i{
    display:flex; align-items:flex-start; gap:10px; width:100%; cursor:pointer; text-align:left;
    background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:10px 12px;
    font-family:var(--sans); color:var(--ink);
  }
  .fut-i:active{transform:scale(.995);}
  .fut-i .d{flex:none; min-width:5.4em; padding-top:1px; font-size:.76rem; font-weight:700; color:var(--ink-mid);}
  .fut-i .b{flex:1; min-width:0; display:grid; gap:2px;}
  .fut-i .b .x{font-size:.86rem; line-height:1.45; word-break:break-word;}
  .fut-i .b .g{font-size:.72rem; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  /* 書き込み欄（アイコンだけのチップ＋本文） */
  .thr-ed{display:grid; gap:9px; padding:2px 0 4px;}
  .thr .thr-ed{margin:0;}
  .thr-ed textarea{
    width:100%; border:1.5px solid var(--accent); background:var(--surface); border-radius:11px;
    padding:9px 12px; font-size:16px; color:var(--ink); font-family:var(--sans); resize:none; line-height:1.5;
  }
  .thr-ed .row{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .thr-ed .chips{display:flex; gap:8px;}
  .thr-ed .sp{flex:1; min-width:0;}
  .tagchip{
    width:36px; height:36px; flex:none; border:1.5px solid var(--line); background:var(--surface-2);
    border-radius:10px; color:var(--ink-soft); display:grid; place-items:center; cursor:pointer; padding:0;
  }
  .tagchip svg{width:19px; height:19px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}
  .tagchip:active{transform:scale(.92);}
  .tagchip.on.t-mayoi{background:var(--accent-wash); border-color:var(--accent); color:var(--accent);}
  .tagchip.on.t-yatta{background:var(--good-wash); border-color:var(--good); color:var(--good);}
  .tagchip.on.t-toi{background:var(--accent-wash); border-color:var(--accent-2); color:var(--accent-2);}
  .btn.sm{flex:none; padding:9px 16px; font-size:.88rem; border-radius:10px;}

  /* ---------- 対話の見出しバッジ（対話ビューの上） ---------- */
  .tb-badge{
    flex:none; font-size:.7rem; font-weight:700; letter-spacing:.02em; padding:3px 9px; border-radius:99px;
    border:1px solid var(--line-2); color:var(--ink-mid); white-space:nowrap;
  }
  .tb-badge.new{background:var(--accent-wash); border-color:var(--accent); color:var(--accent-2);}
  .tb-badge.wait{background:var(--surface-2);}

  /* ---------- 対話ビュー（週をまたいでラリーだけを縦に並べる） ---------- */
  #talkPane{display:none;}
  #talkPane.active{
    display:grid; gap:14px; max-width:640px; margin:0 auto;
    padding:16px 16px calc(env(safe-area-inset-bottom) + 48px);
  }
  body.tool-local{overflow:auto;}
  .talk-head{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .talk-wk{display:grid; gap:11px;}
  .talk-wk .wk-lab{
    display:flex; align-items:baseline; gap:9px; padding:2px 2px 0;
    border-top:1px solid var(--line); padding-top:13px;
  }
  .talk-wk .wk-lab .n{font-family:var(--serif); font-weight:600; font-size:1.02rem;}
  .talk-wk .wk-lab .r{font-size:.75rem; color:var(--ink-soft);}
  /* 目標ごとのまとまり。広い画面ではこれを何列かに並べる（スマホは1列のまま） */
  .talk-cols{display:grid; gap:11px;}
  .talk-task{display:grid; gap:11px; align-content:start;}
  .talk-t{font-size:.8rem; font-weight:700; color:var(--ink-mid); padding:0 2px;}
  .talk-a{display:grid; gap:0; background:var(--surface); border:1px solid var(--line); border-radius:15px; padding:13px 14px 11px; box-shadow:var(--shadow);}
  .talk-a .a-name{display:flex; align-items:center; gap:8px; font-size:.9rem; line-height:1.4; margin-bottom:9px;}
  .talk-a .a-name .adot{
    width:18px; height:18px; flex:none; border:1.5px solid var(--line-2); border-radius:50%;
    display:grid; place-items:center; color:transparent; background:var(--surface-2);
  }
  .talk-a .a-name.done .adot{background:var(--good); border-color:transparent; color:#fff;}
  .talk-a .a-name.done span{color:var(--ink-soft); text-decoration:line-through; text-decoration-color:var(--line-2);}
  .talk-a .thr, .talk-a .thr-ed{margin-left:0;}
  .talk-empty{display:grid; gap:10px; justify-items:center; text-align:center; padding:26px 0; color:var(--ink-soft); font-size:.9rem;}

  /* ---------- 下書き（Claudeが作った文面＋自分の考えごと。旧「自由帳」もここに統合） ---------- */
  #draftPane{display:none;}
  #draftPane.active{
    display:grid; gap:12px; max-width:640px; margin:0 auto;
    padding:16px 16px calc(env(safe-area-inset-bottom) + 48px);
  }
  .dft-list{display:grid; gap:12px; align-items:start;}
  .dft{background:var(--surface); border:1px solid var(--line); border-radius:15px; box-shadow:var(--shadow); overflow:hidden;}
  .dft.open{border-color:var(--accent);}
  .dft-top{
    display:flex; align-items:center; gap:10px; width:100%; padding:13px 15px; cursor:pointer;
    background:transparent; border:none; font-family:var(--sans); color:var(--ink); text-align:left;
  }
  .dft-top:active{transform:scale(.997);}
  .dft-top .dft-t{flex:none; max-width:54%; font-size:.94rem; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .dft-top .dft-sub{flex:1; min-width:0; font-size:.78rem; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .dft-top .fcar{flex:none; color:var(--ink-soft); font-size:.9rem; transition:transform .2s;}
  .dft.open .dft-top .fcar{transform:rotate(180deg);}
  .dft.arc .dft-top .dft-t{color:var(--ink-mid);}
  .dft-body{padding:0 15px 14px; display:grid; gap:10px;}
  /* 日付＋タイトル（旧・自由帳の「いつ書いたか」をそのまま引き継ぐ） */
  .dft-meta{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .dft-meta input.dft-date{
    flex:none; border:1.5px solid var(--line); background:var(--surface-2); border-radius:11px;
    padding:10px 11px; font-size:16px; color:var(--ink-mid); font-family:var(--sans);
  }
  .dft-meta input.dft-title{flex:1; min-width:150px;}
  .dft-top .dft-d{flex:none; font-size:.72rem; color:var(--ink-soft); font-variant-numeric:tabular-nums;}
  .dft-body input.dft-title{
    width:100%; border:1.5px solid var(--line); background:var(--surface-2); border-radius:11px;
    padding:11px 13px; font-size:16px; font-weight:700; color:var(--ink); font-family:var(--sans);
  }
  .dft-body textarea.dft-text{
    width:100%; min-height:190px; border:1.5px solid var(--line); background:var(--surface-2); border-radius:11px;
    padding:11px 13px; font-size:16px; color:var(--ink); font-family:var(--sans); line-height:1.7; resize:none;
  }
  .dft-body input:focus, .dft-body textarea:focus{outline:2px solid var(--accent-wash); border-color:var(--accent);}
  .dft-foot{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .dft-foot .sp{flex:1; min-width:0;}
  .dft-lab{font-size:.72rem; color:var(--ink-soft);}
  /* しまった分（旧・自由帳の「しまう」）。消さずに棚へ移すだけ */
  .arcbar{display:flex; justify-content:center; margin-top:2px;}
  .arcbar button{
    display:inline-flex; align-items:center; gap:7px; border:1.5px dashed var(--line-2);
    background:transparent; border-radius:12px; padding:10px 16px; cursor:pointer;
    color:var(--ink-soft); font-family:var(--sans); font-size:.84rem; font-weight:700;
  }
  .arcbar button svg{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;}
  .arcbar button:active{transform:scale(.98);}
  .arc-head{display:flex; align-items:center; gap:10px;}
  .arc-head b{font-family:var(--serif); font-weight:600; font-size:1.02rem;}
  .arc-head .sp{flex:1;}

  /* ---------- 完了したものは畳む（消さずに隠す） ---------- */
  .done-fold{
    display:flex; align-items:center; gap:9px; width:100%; margin-top:11px;
    background:transparent; border:1.5px dashed var(--line-2); border-radius:13px; padding:11px 14px;
    color:var(--ink-soft); font-family:var(--sans); font-size:.86rem; font-weight:700; cursor:pointer;
  }
  .done-fold svg{width:16px; height:16px; flex:none; color:var(--good); stroke:currentColor; fill:none; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round;}
  .done-fold .fcar{margin-left:auto; font-size:.9rem; transition:transform .2s;}
  .done-fold.open{border-style:solid; border-color:var(--line); background:var(--surface-2);}
  .done-fold.open .fcar{transform:rotate(180deg);}
  .done-fold:active{transform:scale(.99);}
  .done-list{margin-top:11px;}
  @keyframes foldPop{0%{transform:scale(1);}35%{transform:scale(1.025);}100%{transform:scale(1);}}
  .done-fold.pulse{animation:foldPop .34s ease; border-color:var(--good); color:var(--good);}

  .empty-week{display:grid; gap:12px; justify-items:center; text-align:center; padding:8px 0 2px;}
  .empty-week .em{font-size:2rem;}
  .empty-week p{margin:0; color:var(--ink-mid); font-size:.94rem;}
  .empty-week .hint{font-size:.8rem; color:var(--ink-soft);}
  .btnrow{display:flex; gap:10px; width:100%;}
  .btn{flex:1; border-radius:12px; padding:14px; font-size:1rem; font-weight:700; font-family:var(--sans); cursor:pointer; border:1.5px solid var(--line);}
  /* 375px幅でも2つ並んだボタンが折れないように（空の週の「コピー」「目標を決める」） */
  .empty-week .btn{font-size:.93rem; padding:14px 8px; white-space:nowrap;}
  .btn.primary{background:linear-gradient(155deg,var(--accent),var(--accent-2)); color:#fff; border-color:transparent;}
  .btn.ghost{background:var(--surface); color:var(--ink-mid);}
  .btn:active{transform:scale(.98);}
  .edit-link{border:none; background:transparent; color:var(--ink-soft); font-size:.82rem; cursor:pointer; text-decoration:underline; text-underline-offset:3px; font-family:var(--sans); padding:2px 4px;}
  .card-foot{display:flex; justify-content:center; gap:14px; margin-top:13px;}

  /* ---------- review ---------- */
  .review-banner{
    display:flex; align-items:center; gap:12px; background:var(--warn-wash); border:1.5px solid var(--warn);
    border-radius:15px; padding:14px 15px; cursor:pointer;
  }
  .review-banner .rb-t{flex:1; min-width:0;}
  .review-banner b{font-size:.98rem;}
  .review-banner p{margin:2px 0 0; font-size:.8rem; color:var(--ink-mid);}
  .review-banner .go{flex:none; font-weight:700; color:var(--warn); font-size:.9rem; white-space:nowrap;}
  .review-sum{display:grid; gap:8px;}
  .review-sum .rs-head{display:flex; align-items:center; gap:9px;}
  .chip{display:inline-flex; align-items:center; gap:5px; font-size:.8rem; font-weight:700; padding:3px 11px; border-radius:99px; border:1.5px solid var(--line); color:var(--ink-mid); white-space:nowrap;}
  .chip.done{background:var(--good-wash); border-color:var(--good); color:var(--good);}
  .chip.partial{background:var(--accent-wash); border-color:var(--accent); color:var(--accent-2);}
  .chip.miss{background:var(--warn-wash); border-color:var(--warn); color:var(--warn);}
  .review-sum .growth{font-size:.93rem; color:var(--ink); white-space:pre-wrap; word-break:break-word;}
  .review-sum .nextnote{font-size:.85rem; color:var(--ink-mid); white-space:pre-wrap; word-break:break-word;}

  /* ---------- editors ---------- */
  .editor label{display:block; font-size:.76rem; font-weight:700; color:var(--ink-mid); margin:0 0 6px;}
  .ed-field{margin-bottom:15px;}
  .editor textarea, .editor input[type=text], .editor input[type=number]{
    width:100%; border:1.5px solid var(--line); background:var(--surface-2); border-radius:11px;
    padding:11px 13px; font-size:16px; color:var(--ink); font-family:var(--sans); resize:none; line-height:1.5;
  }
  .editor textarea:focus, .editor input:focus{outline:2px solid var(--accent-wash); border-color:var(--accent);}
  .task-in-row{display:flex; align-items:center; gap:8px; margin-bottom:9px;}
  .task-in-row input[type=text]{flex:1; min-width:0;}
  /* input.num と書かないと、上の .editor input[type=number]{width:100%} に負けて回数欄が横いっぱいに広がる */
  .task-in-row input.num{width:74px; flex:none; text-align:center;}
  .task-in-row .numlab{flex:none; font-size:.74rem; color:var(--ink-soft);}
  .task-in-row .rm{border:none; background:transparent; color:var(--ink-soft); font-size:1.3rem; cursor:pointer; padding:2px 6px; flex:none;}
  .editor .acts-in{margin:0 0 14px; padding:9px 12px; font-size:16px; line-height:1.5; border-style:dashed;}
  .add-row{border:none; background:transparent; color:var(--accent-2); font-weight:700; font-size:.88rem; cursor:pointer; padding:3px 0;}
  .ed-actions{display:flex; gap:10px; margin-top:18px;}
  .seg{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .seg button{
    border:1.5px solid var(--line); background:var(--surface-2); border-radius:11px; padding:12px 6px;
    font-family:var(--sans); font-size:.92rem; font-weight:700; color:var(--ink-mid); cursor:pointer;
  }
  .seg button.sel-done{background:var(--good-wash); border-color:var(--good); color:var(--good);}
  .seg button.sel-partial{background:var(--accent-wash); border-color:var(--accent); color:var(--accent-2);}
  .seg button.sel-miss{background:var(--warn-wash); border-color:var(--warn); color:var(--warn);}
  .rv-auto{background:var(--surface-2); border:1px solid var(--line); border-radius:11px; padding:10px 13px; font-size:.86rem; color:var(--ink-mid); margin-bottom:15px;}

  /* ---------- page2: vision / countdown ---------- */
  .vision-slogan{font-family:var(--serif); font-weight:600; font-size:1.3rem; line-height:1.5; letter-spacing:.01em; margin:6px 0 8px; text-wrap:balance;}
  .vision-title{font-size:.95rem; color:var(--ink-mid);}
  .count-wrap{display:flex; align-items:baseline; gap:10px; margin:8px 0 4px; flex-wrap:wrap;}
  .count-wrap .big{font-family:var(--serif); font-weight:600; font-size:2.6rem; line-height:1;}
  .count-wrap .unit{font-size:.95rem; color:var(--ink-mid); font-weight:700;}
  .count-wrap .weeks{font-size:.88rem; color:var(--ink-soft);}
  .count-foot{display:flex; justify-content:space-between; font-size:.74rem; color:var(--ink-soft); margin-top:7px;}

  /* ---------- months ---------- */
  .months{display:grid; gap:9px; margin-top:12px;}
  .month{
    display:flex; align-items:center; gap:12px; background:var(--surface-2); border:1.5px solid var(--line);
    border-radius:13px; padding:12px 14px; cursor:pointer; transition:border-color .18s;
  }
  .month:active{transform:scale(.995);}
  .month.now{border-color:var(--accent);}
  .month .m{flex:none; width:44px; font-family:var(--serif); font-weight:600; font-size:1.02rem; text-align:center;}
  .month .mg{flex:1; min-width:0; font-size:.93rem; line-height:1.45; word-break:break-word;}
  .month .mg.unset{color:var(--ink-soft);}
  .month .chip{flex:none;}
  .month .mcnt{flex:none; font-size:.74rem; color:var(--ink-soft); font-family:var(--sans); font-weight:700;}
  .month.op{border-bottom-left-radius:0; border-bottom-right-radius:0; border-bottom-color:transparent;}
  .m-editor{background:var(--surface-2); border:1.5px solid var(--accent); border-radius:13px; padding:14px;}

  /* ---------- 今週の勝ち条件・動いた記録 ---------- */
  .card.win{border-color:var(--line-2);}
  .card.win.ok{border-color:var(--good);}
  .win-row{display:flex; align-items:flex-start; gap:11px; margin-top:11px;}
  .win-tick{
    width:30px; height:30px; flex:none; margin-top:1px; border:2px solid var(--line-2); border-radius:50%;
    background:var(--surface); color:var(--good); display:grid; place-items:center; cursor:pointer; padding:0;
  }
  .card.win.ok .win-tick{border-color:var(--good); background:var(--good-wash);}
  .win-t{flex:1; min-width:0; font-family:var(--serif); font-size:1.12rem; line-height:1.5; font-weight:600; word-break:break-word;}
  .card.win.ok .win-t{color:var(--ink-mid);}
  .win-ed-btn{
    flex:none; width:28px; height:28px; margin-top:2px; border:1px solid var(--line); border-radius:8px;
    background:var(--surface-2); color:var(--ink-soft); display:grid; place-items:center; cursor:pointer; padding:0;
  }
  .win-done{margin-top:9px; font-size:.84rem; color:var(--good); font-weight:700;}
  .win-set{
    display:block; width:100%; margin-top:11px; padding:12px 13px; border:1.5px dashed var(--line-2);
    border-radius:13px; background:transparent; color:var(--ink-mid); font-family:var(--sans); font-size:.9rem;
    font-weight:700; cursor:pointer; text-align:left;
  }
  .win-set:active{background:var(--surface-2);}
  .win-ed{margin-top:11px; display:grid; gap:9px;}
  .win-in{
    width:100%; font-size:16px; font-family:var(--sans); color:var(--ink); background:var(--surface);
    border:1.5px solid var(--accent); border-radius:11px; padding:11px 12px;
  }
  .win-hint{font-size:.74rem; color:var(--ink-soft); line-height:1.55;}
  .win-ed .row{display:flex; align-items:center; gap:9px;}
  .win-ed .row .sp{flex:1;}
  /* 動いた日の点＝金曜の振り返りを待たずに「止まっている」に気づくためだけの1行 */
  .mv{display:flex; align-items:center; gap:10px; margin-top:13px; padding-top:11px; border-top:1px solid var(--line);}
  .mv-dots{display:flex; align-items:center; gap:4px; flex:1; min-width:0;}
  .mv-dots i{
    width:9px; height:9px; flex:none; border-radius:50%;
    background:var(--cell-empty); border:1px solid transparent;
  }
  .mv-dots i.on{background:var(--accent);}
  .mv-dots i.now{border-color:var(--accent-2);}
  .mv-dots i.now:not(.on){background:var(--surface);}
  .mv-n{flex:none; font-size:.76rem; font-weight:700; color:var(--ink-soft);}
  .stall{
    margin-top:11px; padding:11px 12px; border-radius:12px;
    background:var(--warn-wash); border:1px solid var(--warn);
  }
  .stall b{display:block; font-size:.92rem; color:var(--warn);}
  .stall p{margin:4px 0 0; font-size:.78rem; line-height:1.6; color:var(--ink-mid);}
  .rv-win{
    margin-top:9px; font-size:.82rem; font-weight:700; color:var(--warn);
    background:var(--warn-wash); border-radius:9px; padding:8px 10px;
  }
  .rv-win.ok{color:var(--good); background:var(--good-wash);}

  /* ---------- 卒業の条件（4メーター） ---------- */
  .mets{display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:15px;}
  .met{
    display:grid; gap:5px; text-align:left; padding:11px 12px; cursor:pointer;
    background:var(--surface-2); border:1.5px solid var(--line); border-radius:13px;
    font-family:var(--sans); color:var(--ink);
  }
  .met:active{transform:scale(.99);}
  .met.ok{border-color:var(--good); background:var(--good-wash);}
  .mt-n{font-size:.76rem; font-weight:700; color:var(--ink-mid);}
  .mt-v{display:flex; align-items:baseline; gap:2px;}
  .mt-v b{font-family:var(--serif); font-size:1.32rem; font-weight:600; line-height:1;}
  .mt-v i{font-style:normal; font-size:.74rem; color:var(--ink-soft);}
  .met .bar{height:5px;}
  .mt-r{font-size:.72rem; font-weight:700; color:var(--accent-2);}
  .met.ok .mt-r{color:var(--good);}
  .met-foot{
    display:flex; align-items:baseline; gap:10px; margin-top:11px;
    font-size:.78rem; color:var(--ink-soft);
  }
  .met-foot span{flex:1; min-width:0;}
  .met-foot b{flex:none; color:var(--ink-mid);}
  .met-foot.done{color:var(--good); font-weight:700;}
  .met-ed{
    grid-column:1/-1; display:grid; gap:11px; padding:13px;
    background:var(--surface-2); border:1.5px solid var(--accent); border-radius:13px;
  }
  .me-h{font-size:.92rem; font-weight:700;}
  .me-h span{display:block; font-size:.74rem; font-weight:400; color:var(--ink-soft); margin-top:2px;}
  .me-row{display:flex; align-items:center; gap:9px;}
  .me-pm{
    width:42px; height:42px; flex:none; border:1.5px solid var(--line-2); border-radius:11px;
    background:var(--surface); color:var(--ink-mid); font-size:1.2rem; line-height:1; cursor:pointer; padding:0;
  }
  .me-pm:active{background:var(--surface-2);}
  .me-in, .me-gin{
    width:100%; min-width:0; font-size:16px; font-family:var(--sans); color:var(--ink); text-align:center;
    background:var(--surface); border:1.5px solid var(--line-2); border-radius:11px; padding:10px 8px;
  }
  .me-in{flex:1; font-family:var(--serif); font-size:1.2rem; font-weight:600;}
  .me-u{flex:none; font-size:.82rem; color:var(--ink-soft);}
  .me-goal{display:flex; align-items:center; gap:9px;}
  .me-goal label{flex:none; font-size:.78rem; font-weight:700; color:var(--ink-mid);}
  .me-goal .me-gin{flex:1;}

  /* ---------- 文面（下書き）の結び ---------- */
  .adft{
    display:inline-flex; align-items:center; gap:3px; flex:none; align-self:flex-start; margin-top:4px;
    border:1px solid var(--accent); background:var(--accent-wash); color:var(--accent-2);
    border-radius:99px; padding:4px 8px; font-size:.72rem; font-weight:700; cursor:pointer;
    font-family:var(--sans); white-space:nowrap;
  }
  .adft:active{transform:scale(.96);}
  .adft svg{flex:none;}
  .link-add{
    display:block; width:100%; margin-top:10px; padding:10px 12px; border:1.5px dashed var(--line-2);
    border-radius:11px; background:transparent; color:var(--ink-mid); font-family:var(--sans);
    font-size:.82rem; font-weight:700; cursor:pointer; text-align:left;
  }
  .linked{
    display:flex; align-items:center; gap:8px; margin-top:10px; padding:9px 11px;
    background:var(--accent-wash); border:1px solid var(--accent); border-radius:11px;
  }
  .linked .lk-i{flex:none; color:var(--accent-2); display:grid; place-items:center;}
  .linked .lk-t{flex:1; min-width:0; font-size:.78rem; color:var(--ink-mid); line-height:1.5; word-break:break-word;}
  .linked .lk-t b{color:var(--ink);}
  .pick{margin-top:10px; padding:11px; background:var(--surface-2); border:1.5px solid var(--accent); border-radius:13px;}
  .pick-h{font-size:.8rem; font-weight:700; color:var(--ink-mid); margin-bottom:8px;}
  .pick-none{font-size:.78rem; color:var(--ink-soft);}
  .pick-i{
    display:grid; gap:2px; width:100%; text-align:left; margin-bottom:6px; padding:9px 11px;
    background:var(--surface); border:1px solid var(--line); border-radius:11px; cursor:pointer; font-family:var(--sans);
  }
  .pick-i:active{background:var(--surface-2);}
  .pick-i .x{font-size:.86rem; color:var(--ink); line-height:1.45;}
  .pick-i .g{font-size:.72rem; color:var(--ink-soft);}
  .pick-f{display:flex; justify-content:flex-end;}

  /* ---------- ガント（週軸の帯） ----------
     左＝見出し（横スクロールしても貼り付いて残る）／右＝週の目盛り。カード幅いっぱいまで使う。 */
  .gt-scroll{
    /* 幅は「カードいっぱい＋左右のpadding分」で固定する。中身（帯の長さ）で決めさせると
       カードごと横に伸びてしまうため、width を明示するのが要点。 */
    width:calc(100% + 38px); max-width:calc(100% + 38px); min-width:0;
    margin:12px -19px 0; overflow-x:auto; overflow-y:hidden;
    -webkit-overflow-scrolling:touch; scrollbar-width:thin; overscroll-behavior-x:contain;
  }
  .gt-scroll::-webkit-scrollbar{height:7px;}
  .gt-scroll::-webkit-scrollbar-thumb{background:var(--line-2); border-radius:99px;}
  .gt-scroll::-webkit-scrollbar-track{background:transparent;}
  .gt{position:relative; display:grid; width:max-content; padding-right:19px;}
  .gt-band{position:absolute; top:0; bottom:0; background:var(--surface-2); z-index:0; pointer-events:none;}
  /* 今日の線。帯の上に薄く重ねる（下に敷くと週の区切り線と重なって見えなくなる日がある） */
  .gt-now{position:absolute; top:14px; bottom:0; width:1.5px; z-index:3; pointer-events:none;}
  .gt-now::after{content:''; position:absolute; inset:0; background:var(--accent); opacity:.42;}
  .gt-now::before{content:''; position:absolute; left:-3px; top:-6px; width:8px; height:8px; border-radius:50%; background:var(--accent);}
  /* 行に z-index を付けない＝中の見出し列（z:4）を今日の線（z:3）より上に出せる */
  .gt-row{display:flex; align-items:stretch; position:relative; min-height:36px;}
  .gt-row + .gt-row .gt-lab, .gt-row + .gt-row .gt-track{border-top:1px solid var(--line);}
  .gt-lab{
    position:sticky; left:0; z-index:4; flex:none; width:127px; box-sizing:border-box;
    padding:6px 9px 6px 19px; background:var(--surface); border:none; border-right:1px solid var(--line-2);
    display:grid; align-content:center; gap:1px; text-align:left; cursor:pointer;
    font-family:var(--sans); color:var(--ink); -webkit-appearance:none;
  }
  .gt-lab:active{background:var(--surface-2);}
  .gt-lab .t{font-size:.78rem; line-height:1.3; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .gt-lab .s{font-size:.65rem; line-height:1.3; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .gt-lab.fin .t{color:var(--ink-soft); text-decoration:line-through;}
  .gt-row.m .gt-lab .t{font-weight:700;}
  .gt-track{position:relative; flex:none; background-image:linear-gradient(90deg,var(--line) 1px, transparent 1px); background-size:var(--gtcol) 100%;}
  /* 見出し行（月／週の始まりの日） */
  .gt-row.head{min-height:0;}
  .gt-row.head .gt-lab{padding-top:2px; padding-bottom:4px;}
  .gt-row.head .gt-track{background-image:none;}
  .gt-mrow{position:relative; height:17px;}
  .gt-drow{position:relative; height:17px;}
  .gt-m{position:absolute; top:0; font-size:.68rem; font-weight:700; color:var(--ink-mid); padding-left:4px; box-sizing:border-box; border-left:1px solid var(--line-2);}
  .gt-d{position:absolute; top:0; font-size:.62rem; color:var(--ink-soft); text-align:center; font-variant-numeric:tabular-nums;}
  .gt-d.now{color:var(--accent-2); font-weight:700;}
  /* 帯 */
  .gt-bar{
    position:absolute; top:50%; transform:translateY(-50%); height:15px; min-width:12px;
    border-radius:99px; border:1.5px solid var(--accent); background:var(--accent-wash);
    padding:0; cursor:pointer; -webkit-appearance:none;
  }
  .gt-bar:active{filter:brightness(.96);}
  .gt-bar.s-today{background:var(--accent); border-color:var(--accent-2);}
  .gt-bar.s-over{background:var(--warn-wash); border-color:var(--warn);}
  .gt-bar.s-over::after{content:''; position:absolute; inset:0; border-radius:99px; background:repeating-linear-gradient(45deg,transparent 0 3px,var(--warn) 3px 4px); opacity:.5;}
  .gt-bar.s-done{background:var(--good-wash); border-color:var(--good); opacity:.72;}
  .gt-bar.s-ask{background:transparent; border-style:dashed;}
  .gt-row.m .gt-bar{height:19px; border-radius:6px; border-width:1.5px; background:var(--surface-2); border-color:var(--line-2);}
  .gt-row.m .gt-bar.m-done{background:var(--good-wash); border-color:var(--good);}
  .gt-row.m .gt-bar.m-partial{background:var(--accent-wash); border-color:var(--accent);}
  .gt-row.m .gt-bar.m-miss{background:var(--warn-wash); border-color:var(--warn);}
  .gt-row.m + .gt-row:not(.m) .gt-lab, .gt-row.m + .gt-row:not(.m) .gt-track{border-top:1.5px solid var(--line-2);}
  /* 凡例 */
  .gt-legend{display:flex; flex-wrap:wrap; gap:4px 12px; margin-top:10px; font-size:.68rem; color:var(--ink-soft);}
  .gt-legend span{display:inline-flex; align-items:center; gap:5px;}
  .gt-legend i{width:15px; height:9px; border-radius:99px; border:1.5px solid var(--accent); background:var(--accent-wash);}
  .gt-legend i.s-today{background:var(--accent); border-color:var(--accent-2);}
  .gt-legend i.s-over{background:var(--warn-wash); border-color:var(--warn);}
  .gt-legend i.s-done{background:var(--good-wash); border-color:var(--good);}
  .gt-legend i.s-ask{background:transparent; border-style:dashed;}
  .gt-more{margin-top:8px; font-size:.72rem; color:var(--ink-soft);}

  /* ---------- 月をひらいた中身（やるべきこと／やれたら良いこと） ---------- */
  .mo-open{
    background:var(--surface); border:1.5px solid var(--line-2); border-top:none;
    border-radius:0 0 13px 13px; padding:11px 13px 13px; margin:-11px 0 2px; display:grid; gap:13px;
  }
  .mo-phase{
    display:inline-flex; align-items:center; gap:6px; align-self:start; justify-self:start; font-size:.72rem; font-weight:700;
    color:var(--ink-mid); background:var(--surface-2); border:1px solid var(--line); border-radius:999px; padding:4px 10px;
  }
  .mo-sec{display:grid; gap:2px;}
  .mo-head{display:flex; align-items:center; gap:7px; margin-bottom:3px;}
  .mo-head .t{font-size:.78rem; font-weight:700; color:var(--ink-mid);}
  .mo-head .n{font-size:.72rem; color:var(--ink-soft); font-family:var(--sans); font-weight:700;}
  .mo-head .t.want{color:var(--ink-soft);}
  .mo-empty{font-size:.82rem; color:var(--ink-soft); padding:3px 4px 5px;}
  .mo-edit{
    border:none; background:transparent; color:var(--ink-soft); cursor:pointer; flex:none;
    padding:3px 6px; border-radius:8px; display:flex; align-items:center;
  }
  .mo-edit svg{width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;}
  .mo-edit:active{transform:scale(.9);}
  .mo-in{display:grid; gap:8px; padding:8px 4px 4px;}
  .mo-in input[type=text]{
    width:100%; border:1.5px solid var(--accent); background:var(--surface-2); border-radius:11px;
    padding:10px 12px; font-size:16px; color:var(--ink); font-family:var(--sans); line-height:1.5;
  }
  .mo-in input:focus{outline:2px solid var(--accent-wash);}
  .mo-in .row{display:flex; gap:8px; align-items:center;}
  .mo-in .row .btn{padding:9px 14px; font-size:.86rem;}
  .mo-in .del{margin-left:auto; border:none; background:transparent; color:var(--warn); font-size:.82rem; font-weight:700; cursor:pointer; padding:6px;}
  .mo-foot{display:flex; align-items:center; gap:12px; flex-wrap:wrap; border-top:1px solid var(--line); padding-top:9px;}

  /* ---------- history ---------- */
  .hist{display:grid; gap:9px; margin-top:12px;}
  .hist-item{background:var(--surface-2); border:1px solid var(--line); border-radius:13px; padding:11px 14px; display:grid; gap:5px;}
  .hist-item .h-top{display:flex; align-items:center; gap:9px;}
  .hist-item .h-range{font-size:.82rem; color:var(--ink-mid); font-weight:700;}
  .hist-item .h-pct{font-size:.8rem; color:var(--ink-soft); margin-left:auto;}
  .hist-item .h-growth{font-size:.87rem; color:var(--ink); white-space:pre-wrap; word-break:break-word;}
  .hist-empty{color:var(--ink-soft); font-size:.88rem; margin-top:10px;}
  .stat-row{display:flex; gap:14px; margin-top:12px; font-size:.82rem; color:var(--ink-mid); flex-wrap:wrap;}
  .stat-row b{font-family:var(--serif); font-size:1rem; color:var(--ink);}

  /* ---------- toast ---------- */
  /* left:50% だと「右半分の幅」までしか広がれず、文が1文字ずつ折り返してしまう。
     左右16pxの中で margin:auto に中央寄せさせて、内容ぶんの幅（max-content）を確保する。 */
  #toast{
    position:fixed; left:16px; right:16px; margin:0 auto; width:max-content; max-width:calc(100vw - 32px);
    bottom:calc(env(safe-area-inset-bottom) + 22px); transform:translateY(20px);
    background:var(--ink); color:var(--paper); padding:11px 17px; border-radius:12px; font-size:.9rem;
    display:flex; align-items:center; gap:12px; opacity:0; pointer-events:none; transition:.25s; z-index:40; box-shadow:0 10px 34px -8px rgba(0,0,0,.45);
  }
  #toast.show{opacity:1; transform:translateY(0);}
  /* 「取り消す」つきのトーストだけ押せるようにする（ふだんは触れない＝下のボタンを邪魔しない） */
  #toast.act{pointer-events:auto;}
  #toast .t-act{
    flex:none; border:1px solid color-mix(in srgb, var(--paper) 55%, transparent); background:transparent;
    color:var(--paper); font-family:var(--sans); font-size:.84rem; font-weight:700; cursor:pointer;
    padding:5px 12px; border-radius:9px; white-space:nowrap;
  }
  #toast .t-act:active{transform:scale(.96);}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }

  /* ---------- 広い画面での対話・下書き（#talkPane / #draftPane の定義より後ろに置く） ----------
     どちらも縦1列だと右半分が空くので、目標ごと／下書きごとに横へ並べて画面を使い切る。 */
  @media (min-width:600px) and (max-width:1079px) and (orientation:portrait){
    #talkPane.active, #draftPane.active{max-width:660px;}
  }
  @media (min-width:1080px){
    #talkPane.active, #draftPane.active{max-width:1180px; padding-top:22px;}
    /* 対話は段組み（新聞と同じ流し込み）。grid だと長いラリーの隣が空いてしまう */
    .talk-cols{display:block; columns:2; column-gap:20px;}
    .talk-task{break-inside:avoid; margin:0 0 16px;}
    .dft-list{grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px;}
    .dft.open{grid-column:1/-1;}              /* 開いた下書きは横いっぱいに広げて書く */

/* ===================== ユーティリティ ===================== */
function uid(){ return Date.now().toString(36) + Math.floor(Math.random()*1e6).toString(36); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function todayISO(){ return iso(new Date()); }
function parseISO(s){ const [y,m,d]=String(s).split('-').map(Number); return new Date(y,(m||1)-1,d||1); }
function addDays(s,n){ const d=parseISO(s); d.setDate(d.getDate()+n); return iso(d); }

/* トースト。act={label, fn} を渡すと「取り消す」などのボタンを添えて、消えるまでの時間を長くする */

/* ===================== ラリー（枝分かれメモの往復） =====================
   1つの枝分かれAction に、自分とClaudeの吹き出しが時系列で積まれる。

const TAGS = {
  mayoi:{ label:'迷ってる', cls:'t-mayoi', path:'<path d="M12 21v-5.4"/><path d="M12 15.6 6.6 9.7V3.8"/><path d="m12 15.6 5.4-5.9V3.8"/>' },

  toi  :{ label:'聞きたい', cls:'t-toi',   path:'<path d="M9.3 9.1a2.9 2.9 0 1 1 3.9 2.8c-.8.3-1.2.9-1.2 1.8v.6"/><circle cx="12" cy="18.2" r=".95" fill="currentColor" stroke="none"/>' }
};
function tagSvg(k, cls){ const t=TAGS[k]; if(!t) return ''; return `<svg viewBox="0 0 24 24" class="${cls||''} ${t.cls}" aria-hidden="true">${t.path}</svg>`; }
function threadOf(a){ return Array.isArray(a && a.thread) ? a.thread : []; }
/* Claudeの返信のうち、まだ見ていないもの */
function unseenOf(a){ return threadOf(a).filter(m=>m.who==='ai' && !m.seen).length; }
/* いちばん最後の書き込み */
function lastMsg(a){ const th=threadOf(a); return th.length ? th[th.length-1] : null; }
/* 既読＝「Claudeの返事は読んだ。もう返さない」＝そのラリーごと片づける（＝消す）。
   やりとりの中身は Obsidian 側に残るので、アプリには「まだ動いている話」だけを残す。 */
/* Claudeが最後に書いたまま＝自分が返す番（＝返信待ち）。片づけたものは消えるので数えようがない */
function needsReply(a){ const m=lastMsg(a); return !!(m && m.who==='ai'); }
/* 自分が最後に書いたまま＝Claudeの返事を待っている */
function isWaiting(a){ const m=lastMsg(a); return !!(m && m.who==='me'); }
function eachAct(fn){
  Object.keys(db.weeks).forEach(k=>{
    (db.weeks[k].tasks||[]).forEach(t=>{ (t.actions||[]).forEach(a=>fn(a,t,k)); });
  });
}
function talkStats(){
  let uns=0, rep=0, wait=0, msgs=0;
  eachAct(a=>{
    const th=threadOf(a); if(!th.length) return;
    msgs+=th.length; uns+=unseenOf(a);
    if(needsReply(a)) rep++;         /* 自分が返す番＝返信待ち */
    if(isWaiting(a)) wait++;         /* Claudeの返事を待っている */
  });
  return { unseen:uns, reply:rep, waiting:wait, msgs };
}
function findAct(wk, tid, aid){
  const w=db.weeks[wk]; if(!w) return null;
  const t=(w.tasks||[]).find(x=>x.id===tid); if(!t) return null;
  return (t.actions||[]).find(x=>x.id===aid) || null;
}
function markSeen(a){
  let n=0;
  threadOf(a).forEach(m=>{ if(m.who==='ai' && !m.seen){ m.seen=true; n++; } });
  return n;
}

/* ===================== 予定日（いま抱えているタスクと、先の日程が決まったものを分ける） =====================
   a.due（開始日）／a.dueTo（終わりの日・任意）を入れると、その日が来るまで「予定」に畳まれる。
   当日になったら自動で「今」の一覧に戻ってくる（毎回 todayISO() と比べるだけなので取りこぼさない）。 */
function isLater(a){ return !a.done && !!a.due && a.due>todayISO(); }      /* まだ先＝今のタスクから外す */
function isDueToday(a){ return !a.done && !!a.due && a.due===todayISO(); }
function isOverdue(a){ const t=todayISO(); return !a.done && !!a.due && (a.dueTo||a.due)<t; }
/* ===================== 依頼中（Claudeにボールを渡した枝分かれ） =====================
   運用ルール＝「吹き出しに投げた時点で、自分のボールは離れる」。
   ここで判定できるようにしておけば、今日やる・この先の予定・達成率の**すべて**から
   自動で外れる（他人のボールで自分の進捗が下がらないようにするため）。
   Claudeが返事を書いた時点で、旗が立ったままでもボールは自分に戻る。 */
function isAsk(a){
  if(!a || a.done || !a.ask) return false;
  const m=lastMsg(a);
  return !(m && m.who==='ai');   /* 最後がClaudeの返事＝もう待っていない */
}
/* 目標まるごとが「Claude待ち」か。残っている枝分かれが全部 依頼中 のときだけ。
   1つでも自分で動かせる枝が残っているなら、それはまだ自分のボール。 */
function isTaskAsk(t){
  const rest=(t.actions||[]).filter(a=>!a.done);
  return rest.length>0 && rest.every(isAsk);
}

function dueCls(a){
  if(!a.due) return 'none';
  if(isOverdue(a)) return 'over';
  if(isDueToday(a) || (a.due<=todayISO() && (a.dueTo||a.due)>=todayISO())) return 'today';
  return 'set';
}
function dueLabel(a){
  if(!a.due) return '';
  const t=todayISO();
  const e=(a.dueTo && a.dueTo>a.due) ? a.dueTo : '';
  if(!e){
    if(a.due===t) return '今日';
    if(a.due===addDays(t,1)) return '明日';
  }
  /* 同じ月なら「8/7–8」と短くする（1行に収めて、枝分かれの文字を削らない） */
  const tail = e ? (e.slice(0,7)===a.due.slice(0,7) ? '–'+parseISO(e).getDate() : '–'+fmtMD(e)) : '';
  return fmtMD(a.due)+tail;
}
/* この先に予定されている枝分かれを、週をまたいで日付順に集める */
function futureActs(){
  const out=[];
  eachAct((a,t,k)=>{ if(isLater(a) && !isAsk(a)) out.push({a,t,k}); });   /* 依頼中は自分の予定ではない */
  out.sort((x,y)=> x.a.due<y.a.due ? -1 : (x.a.due>y.a.due ? 1 : 0));
  return out;
}

/* ===================== 今日やる（トップページの主役） =====================
   毎朝ここだけ見れば動ける状態にするための自動抽出。手でピン留めする手間はかけない。
   優先順： ①期限が過ぎている（週をまたいで拾う） → ②今日が予定日 → ③見ている週の各目標の先頭1件。
   枝分かれを持たない目標は、目標そのものを1件として出す（◯を押せば達成になる）。 */
function todayActs(limit){
  const out=[]; const seen=new Set();
  const push=o=>{ const id=o.a?o.a.id:('t:'+o.t.id); if(seen.has(id)) return; seen.add(id); out.push(o); };
  /* 依頼中（＝Claudeにボールを渡したもの）は、どの経路でもここに出さない */
  eachAct((a,t,k)=>{ if(isOverdue(a) && !isAsk(a)) push({a,t,k}); });
  eachAct((a,t,k)=>{ if(isDueToday(a) && !isAsk(a)) push({a,t,k}); });
  const k=currentViewKey();
  (getWeek(k).tasks||[]).forEach(t=>{
    if(t.count>=t.target || isTaskAsk(t)) return;
    const acts=t.actions||[];
    if(!acts.length){ push({a:null, t, k, isTask:true}); return; }
    const a=acts.find(x=>!x.done && !isLater(x) && !isAsk(x));
    if(a) push({a,t,k});
  });
  const n=limit||3;
  return { list: out.slice(0,n), rest: Math.max(0, out.length-n) };
}

/* ===================== 文字を減らす（表示だけ。db の文言は一切書き換えない） =====================
   （　）の中は補足なので薄くして主文を立たせる。長い文は指定行数で畳み、「…」で全文に開く。 */
function dimText(s){
  const t=String(s==null?'':s);
  const i=t.search(/[（(]/);
  if(i<=0) return esc(t);
  return esc(t.slice(0,i))+'<span class="dim">'+esc(t.slice(i))+'</span>';
}
function clampHTML(text, key, lines){
  const t=String(text==null?'':text);
  const long = t.length > (lines===1 ? 14 : 26);   /* 375px幅で1行＝おおよそ15文字 */
  const open = openText.has(key);
  const body = `<span class="${(long && !open) ? 'cl'+lines : ''}">${dimText(t)}</span>`;
  if(!long) return body;
  return body+`<button class="more ${open?'open':''}" data-act="txt-more" data-k="${key}" aria-label="${open?'畳む':'全部読む'}">${open?'畳む':'…'}</button>`;
}

function migrate(){
  const b=blank();
  if(!db.vision || typeof db.vision!=='object') db.vision=b.vision;
  ['slogan','title','deadline'].forEach(k=>{ if(typeof db.vision[k]!=='string') db.vision[k]=b.vision[k]; });
  if(!Array.isArray(db.months)) db.months=b.months;
  db.months=db.months.filter(m=>m && m.ym);
  db.months.forEach(m=>{
    if(typeof m.goal!=='string') m.goal=''; if(typeof m.status!=='string') m.status=''; if(typeof m.note!=='string') m.note='';
    if(typeof m.phase!=='string' || !m.phase) m.phase=PHASE_OF[m.ym]||'';
    ['must','want'].forEach(kind=>{
      if(!Array.isArray(m[kind])) m[kind]=[];
      m[kind]=m[kind].filter(x=>x && typeof x==='object' && typeof x.text==='string' && x.text.trim());
      m[kind].forEach(x=>{ if(!x.id) x.id=uid(); x.text=String(x.text); x.done=!!x.done; });
    });
  });
  db.months.sort((a,b2)=>a.ym<b2.ym?-1:1);
  /* 卒業の条件（4メーター）。目標値も変えられる＝カーブを引き直した時に追従できる */
  if(!db.meters || typeof db.meters!=='object') db.meters={};
  METERS.forEach(mt=>{
    const cur=(db.meters[mt.k] && typeof db.meters[mt.k]==='object') ? db.meters[mt.k] : {};
    db.meters[mt.k]={ v:Math.max(0, +cur.v||0), goal:Math.max(1, +cur.goal||mt.goal) };
  });
  /* 動いた記録。日付キー以外と0以下は捨て、120日より前は落とす（増え続けないように） */
  if(!db.moves || typeof db.moves!=='object') db.moves={};
  const movesFrom=addDays(todayISO(), -120);
  Object.keys(db.moves).forEach(k=>{
    const n=Math.floor(+db.moves[k]);
    if(!isDate(k) || !(n>0) || k<movesFrom) delete db.moves[k]; else db.moves[k]=n;
  });
  if(!db.weeks || typeof db.weeks!=='object') db.weeks={};
  Object.keys(db.weeks).forEach(k=>{
    const w=db.weeks[k];
    if(!w || typeof w!=='object'){ delete db.weeks[k]; return; }
    if(!Array.isArray(w.tasks)) w.tasks=[];
    /* 勝ち条件＝その週これが取れたら勝ち、という1行。無ければ null */
    if(!w.win || typeof w.win!=='object' || typeof w.win.text!=='string' || !w.win.text.trim()) w.win=null;
    else w.win={ text:w.win.text.trim(), done:!!w.win.done };
    w.tasks.forEach(t=>{
      if(!t.id) t.id=uid();
      if(typeof t.text!=='string') t.text='';
      t.target=Math.max(1, Math.floor(+t.target||1));
      t.count=Math.min(Math.max(0, Math.floor(+t.count||0)), t.target);
      t.autoDone=!!t.autoDone;
      t.autoPrev=Math.min(Math.max(0, Math.floor(+t.autoPrev||0)), t.target);
      if(!Array.isArray(t.autoActs)) t.autoActs=[];   /* 親の達成につられて自動でチェックした枝分かれのid */
      if(!Array.isArray(t.actions)) t.actions=[];
      t.actions=t.actions.filter(a=>a && typeof a.text==='string' && a.text);
      t.actions.forEach(a=>{
        if(!a.id) a.id=uid();
        a.done=!!a.done;
        /* 予定日（いつやるか決まったもの）。空文字＝いま抱えているタスク */
        if(!isDate(a.due)) a.due='';
        if(!isDate(a.dueTo) || !a.due || a.dueTo<a.due) a.dueTo='';
        if(typeof a.draftId!=='string') a.draftId='';   /* 使う文面（下書き）の結び先 */
        if(!Array.isArray(a.thread)) a.thread=[];
        delete a.ack;   /* 旧「既読フラグ」。今の既読は“片づける（消す）”なので持たない */
        /* 旧データ：メモ1枚(note) → スレッドの最初の吹き出しとして引き継ぐ（消さない） */
        if(typeof a.note==='string' && a.note.trim() && !a.thread.length){
          a.thread=[{ id:uid(), who:'me', text:a.note.trim(), tag:'', at:'', seen:true }];
        }
        delete a.note;
        a.thread=a.thread.filter(m=>m && typeof m.text==='string' && m.text.trim());
        a.thread.forEach(m=>{
          if(!m.id) m.id=uid();
          m.who = m.who==='ai' ? 'ai' : 'me';
          m.text=String(m.text);
          if(!TAGS[m.tag]) m.tag='';
          if(typeof m.at!=='string') m.at='';
          m.seen = m.who==='me' ? true : !!m.seen;   /* 自分の書き込みは常に既読 */
        });
      });
    });
    if(w.review && typeof w.review!=='object') w.review=null;
  });
  if(!Array.isArray(db.drafts)) db.drafts=[];
  db.drafts=db.drafts.filter(d=>d && typeof d==='object');
  db.drafts.forEach(d=>{
    if(!d.id) d.id=uid();
    ['title','text','at'].forEach(k=>{ if(typeof d[k]!=='string') d[k]=''; });
    if(!isDate(d.at)) d.at=todayISO();
    d.archived=!!d.archived;                              /* しまった分（旧・自由帳の「しまう」） */
    if(typeof d.src!=='string') d.src='';                 /* 取り込み元（jiyucho:<id>）。二重取り込みを防ぐ印 */
  });
  db.jiyuIn=!!db.jiyuIn;   /* 自由帳からの引き継ぎ済みフラグ */
  if(!db.settings || typeof db.settings!=='object') db.settings=b.settings;
  /* 旧「声かけタブ」の名残を掃除（声かけメモは koekake.html に独立） */
  if('people' in db) delete db.people;
}

/* ===================== 永続化・同期 ===================== */
function loadLocal(){ try{ const s=localStorage.getItem(KEY); if(s){ db=Object.assign(blank(), JSON.parse(s)); migrate(); } }catch(e){} }
let saveTimer=null;
function save(){
  localStorage.setItem(KEY, JSON.stringify(db));
  if(!sb) return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    lastPushed = JSON.stringify(db);
    const { error } = await sb.from(STATE_TABLE).upsert({ id:STATE_ID, state:db, updated_at:new Date().toISOString() });
    if(error){ online=false; } else if(online!==true){ online=true; }
    renderSync();
  }, 350);
}
async function loadRemote(){
  if(!sb){ online=false; renderSync(); return; }
  const { data, error } = await sb.from(STATE_TABLE).select('state').eq('id',STATE_ID).maybeSingle();
  if(error){ online=false; renderSync(); return; }
  online=true;
  if(data && data.state && typeof data.state==='object'){
    db=Object.assign(blank(), data.state); migrate();
    localStorage.setItem(KEY, JSON.stringify(db));
    if(!mode) render();
  } else if(Object.keys(db.weeks).length || db.months.some(m=>m.goal)){ save(); }
  renderSync();
}
function subscribeRealtime(){
  if(!sb) return;
  sb.channel('tsumiki-dokuritsu-rt')
    .on('postgres_changes', { event:'*', schema:'public', table:STATE_TABLE, filter:'id=eq.'+STATE_ID }, (payload)=>{
      const incoming = JSON.stringify((payload.new && payload.new.state) || {});
      if(incoming === lastPushed) return;
      if(mode) return;
      const active=document.activeElement;
      if(active && /INPUT|TEXTAREA/.test(active.tagName)) return;
      if(payload.new && payload.new.state){
        db=Object.assign(blank(), payload.new.state); migrate();
        localStorage.setItem(KEY, JSON.stringify(db));
        render();
      }
    }).subscribe();
}
function renderSync(){
  const dot=document.getElementById('syncDot');
  dot.classList.remove('ok','off');
  if(!sb){ dot.title='この端末に保存'; return; }
  if(online===true){ dot.classList.add('ok'); dot.title='クラウド同期中'; }
  else if(online===false){ dot.classList.add('off'); dot.title='オフライン'; }
}

/* ===================== 計算 ===================== */
function weekKey(){ return sundayOf(todayISO()); }
function getWeek(k){ return db.weeks[k] || {tasks:[], review:null}; }
function ensureWeek(k){ if(!db.weeks[k]) db.weeks[k]={tasks:[], review:null}; return db.weeks[k]; }
/* 達成率は「自分のボールだけ」で数える。
   依頼中の目標は、残りぶんを分母から外す＝すでに進めた分はそのまま残しつつ、
   Claudeが持っている仕事のせいで自分の週の%が下がらないようにする。 */
function weekStats(w){
  let done=0, total=0, ask=0;
  (w.tasks||[]).forEach(t=>{
    const d=Math.min(t.count,t.target);
    done+=d;
    if(isTaskAsk(t)){ ask++; total+=d; return; }   /* 自分がやった分だけを分母に */
    total+=t.target;
  });
  return { done, total, ask, pct: total ? Math.round(done/total*100) : 0 };
}
/* 枝分かれAction が全部おわったら、元のタスクも自動で「達成」にする。
   自動で達成にした分だけは、枝分かれを外したときに元のカウントへ戻す（手動達成には触れない）。
   戻り値: 'done'（自動達成した）/ 'undone'（自動達成を取り消した）/ null（変化なし） */
function syncAutoDone(t){
  const acts=t.actions||[];
  if(!acts.length){ t.autoDone=false; return null; }
  if(acts.every(a=>a.done)){
    if(t.count>=t.target) return null;      // すでに手動で達成済みなら触らない
    t.autoPrev=t.count; t.count=t.target; t.autoDone=true;
    return 'done';
  }
  if(t.autoDone){
    t.count=Math.min(Math.max(0, t.autoPrev||0), t.target); t.autoDone=false;
    return 'undone';
  }
  return null;
}
/* 親タスク（枝元）を達成にしたら、ぶら下がっている枝分かれAction も全部チェックする。
   自分でチェックした分と区別するため、ここで自動チェックしたidだけ t.autoActs に控えておき、
   親を「1つ戻す」で未達成に戻したときは、その控えた分だけ外して元の状態に戻す。
   戻り値: 自動でチェック／解除した件数 */
function fillActs(t){
  const acts=t.actions||[];
  const ids=acts.filter(a=>!a.done).map(a=>a.id);
  if(!ids.length){ t.autoActs=[]; return 0; }
  acts.forEach(a=>{ if(ids.includes(a.id)) a.done=true; });
  t.autoActs=ids;
  return ids.length;
}
function unfillActs(t){
  const ids=t.autoActs||[];
  if(!ids.length) return 0;
  let n=0;
  (t.actions||[]).forEach(a=>{ if(ids.includes(a.id) && a.done){ a.done=false; n++; } });
  t.autoActs=[];
  return n;
}
function prevWeekWithTasks(before){
  const cur=before||viewKey||weekKey();
  const keys=Object.keys(db.weeks).filter(k=>k<cur && (db.weeks[k].tasks||[]).length).sort();
  return keys.length ? keys[keys.length-1] : null;
}
/* ---- 週の行き来（先の週の目標も、あとから見返す週も、同じカードの中で切り替える） ---- */
const WEEK_AHEAD_MAX = 8;   /* 何週先まで見に行けるか（先の目標を仕込む用） */
function weekOffset(k){ return Math.round((parseISO(k)-parseISO(weekKey()))/864e5/7); }
function weekLabel(k){
  const n=weekOffset(k);
  if(n===0) return '今週';
  if(n===1) return '来週';
  if(n===2) return '再来週';
  if(n===-1) return '先週';
  if(n===-2) return '先々週';
  return n>0 ? n+'週後' : (-n)+'週前';
}
function oldestWeekKey(){
  const cur=weekKey();
  const keys=Object.keys(db.weeks).filter(k=>db.weeks[k].review || (db.weeks[k].tasks||[]).length).sort();
  return (keys.length && keys[0]<cur) ? keys[0] : cur;
}
function clampWeek(k){
  const min=oldestWeekKey(), max=addDays(weekKey(), WEEK_AHEAD_MAX*7);
  if(k<min) return min;
  if(k>max) return max;
  return k;
}
function currentViewKey(){ if(!viewKey) viewKey=weekKey(); return viewKey; }
function daysLeft(){
  const dl=db.vision.deadline||'2026-12-31';
  return Math.max(0, Math.round((parseISO(dl) - parseISO(todayISO())) / 864e5));
}
function reviewBannerOn(){
  const wd=new Date().getDay();
  return (wd===5 || wd===6) && !getWeek(weekKey()).review;
}

/* ===================== 動いた記録（止まっている事にその日のうちに気づくため） =====================
   1件片づけるたびに今日の数を1つ増やす（取り消したら1つ減らす）。中身は数だけ＝何をしたかは持たない。
   目的は集計ではなく、「何日 手が止まっているか」を自分で見えるようにすること。 */
function bumpMove(n){
  if(!db.moves || typeof db.moves!=='object') db.moves={};
  const d=todayISO();
  const v=(db.moves[d]||0)+n;
  if(v>0) db.moves[d]=v; else delete db.moves[d];
}
function movesOn(d){ return (db.moves && db.moves[d]) || 0; }
/* 最後に動いた日から何日たったか。0＝今日すでに動いた／3＝3日前が最後。
   記録が1つもない時は 0 を返す＝まだ判断できないので何も言わない（使い始めにいきなり責めない）。 */
function stallDays(){
  const keys=Object.keys(db.moves||{}).filter(isDate).sort();
  if(!keys.length) return 0;
  const last=keys[keys.length-1];
  return Math.max(0, Math.round((parseISO(todayISO())-parseISO(last))/864e5));
}
/* 直近14日ぶんの点（古い→新しい）。画面では「動いた日＝塗り」で出す */
function moveDots(days){
  const out=[]; const n=days||14;
  for(let i=n-1;i>=0;i--){ const d=addDays(todayISO(), -i); out.push({d, n:movesOn(d)}); }
  return out;
}

/* ===================== 卒業の条件（4メーター） ===================== */
function meterOf(k){ return (db.meters && db.meters[k]) || {v:0, goal:1}; }
function meterDone(k){ const m=meterOf(k); return m.v>=m.goal; }
function metersLeft(){ return METERS.filter(mt=>!meterDone(mt.k)).length; }

/* ===================== 今週の勝ち条件 =====================
   目標が並ぶだけだと「どれが取れたら勝ちか」が消える。週に1行だけ置く。 */
function winOf(k){ const w=getWeek(k); return (w.win && w.win.text) ? w.win : null; }

/* ===================== 文面（下書き）の結び ===================== */
function draftOfAct(a){ return (a && a.draftId) ? findDraft(a.draftId) : null; }
/* この下書きを使うタスクを探す（結び先は1つだけ） */
function actOfDraft(id){
  let found=null;
  eachAct((a,t,k)=>{ if(!found && a.draftId===id) found={a,t,k}; });
  return found;
}
