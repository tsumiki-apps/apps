<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="apple-touch-icon" href="icons/icon-dokuritsu.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="独立">
<meta name="theme-color" content="#f5f4f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131109" media="(prefers-color-scheme: dark)">
<title>独立ロードマップ</title>
<style>
  :root{
    --paper:#f5f4f0; --surface:#fffefb; --surface-2:#efece5; --ink:#1d1a15;
    --ink-mid:#5b554a; --ink-soft:#8f8877; --line:#e2ded4; --line-2:#d8d3c7;
    --accent:#b06f26; --accent-2:#8a5a24; --accent-wash:#f0e4d1;
    --good:#4c7a51; --good-wash:#dde9dd; --flame:#d67a2a; --cell-empty:#e6e1d6;
    --shadow:0 1px 2px rgba(40,32,18,.05), 0 10px 26px -16px rgba(40,32,18,.18);
    --serif:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Songti SC",serif;
    --sans:"Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,Meiryo,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#131109; --surface:#1d1a12; --surface-2:#26221a; --ink:#efe8da;
      --ink-mid:#a89e8b; --ink-soft:#7d7566; --line:#2f2b21; --line-2:#3a352a;
      --accent:#d59a4d; --accent-2:#e0ab63; --accent-wash:#362a19;
      --good:#7fae82; --good-wash:#23301f; --flame:#e8944a; --cell-empty:#2c281e;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 30px -18px rgba(0,0,0,.65);
    }
  }
  :root[data-theme="light"]{
    --paper:#f5f4f0; --surface:#fffefb; --surface-2:#efece5; --ink:#1d1a15;
    --ink-mid:#5b554a; --ink-soft:#8f8877; --line:#e2ded4; --line-2:#d8d3c7;
    --accent:#b06f26; --accent-2:#8a5a24; --accent-wash:#f0e4d1;
    --good:#4c7a51; --good-wash:#dde9dd; --flame:#d67a2a; --cell-empty:#e6e1d6;
    --shadow:0 1px 2px rgba(40,32,18,.05), 0 10px 26px -16px rgba(40,32,18,.18);
  }
  :root[data-theme="dark"]{
    --paper:#131109; --surface:#1d1a12; --surface-2:#26221a; --ink:#efe8da;
    --ink-mid:#a89e8b; --ink-soft:#7d7566; --line:#2f2b21; --line-2:#3a352a;
    --accent:#d59a4d; --accent-2:#e0ab63; --accent-wash:#362a19;
    --good:#7fae82; --good-wash:#23301f; --flame:#e8944a; --cell-empty:#2c281e;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 30px -18px rgba(0,0,0,.65);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink); font-family:var(--sans);
    line-height:1.6; -webkit-font-smoothing:antialiased; font-feature-settings:"palt" 1; -webkit-text-size-adjust:100%;
  }
  .tnum{font-variant-numeric:tabular-nums;}

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--paper) 88%, transparent);
    backdrop-filter:saturate(1.3) blur(10px); -webkit-backdrop-filter:saturate(1.3) blur(10px);
    border-bottom:1px solid var(--line); padding:calc(env(safe-area-inset-top) + 12px) 18px 12px;
    display:flex; align-items:center; gap:12px;
  }
  .brand{display:flex; align-items:center; gap:10px; min-width:0;}
  .brand .cube{
    width:22px; height:22px; flex:none;
    background:
      linear-gradient(var(--accent),var(--accent)) left top/9px 9px no-repeat,
      linear-gradient(var(--accent),var(--accent)) right top/9px 9px no-repeat,
      linear-gradient(var(--accent-2),var(--accent-2)) center bottom/9px 9px no-repeat;
  }
  .brand h1{font-family:var(--serif); font-weight:600; font-size:1.1rem; margin:0; letter-spacing:.02em; white-space:nowrap;}
  .spacer{flex:1;}
  .streak-badge{
    display:inline-flex; align-items:center; gap:5px; font-size:.82rem; font-weight:700; color:var(--flame);
    background:var(--surface); border:1px solid var(--line); padding:5px 11px; border-radius:100px; white-space:nowrap;
  }
  .streak-badge.zero{color:var(--ink-soft);}
  .streak-badge .n{font-family:var(--serif); font-size:1rem;}
  .iconbtn{
    width:34px; height:34px; flex:none; border:1px solid var(--line); background:var(--surface);
    border-radius:9px; color:var(--ink-mid); display:grid; place-items:center; cursor:pointer;
  }
  .iconbtn:active{transform:scale(.94);}
  .sync-dot{width:8px; height:8px; border-radius:50%; background:var(--ink-soft); flex:none;}
  .sync-dot.ok{background:var(--good);} .sync-dot.off{background:var(--accent);}

  /* ---------- layout ---------- */
  main{max-width:560px; margin:0 auto; padding:18px 16px calc(env(safe-area-inset-bottom) + 40px); display:grid; gap:15px;}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow); padding:18px 19px;}
  .label{font-size:.74rem; font-weight:700; letter-spacing:.06em; color:var(--accent-2); text-transform:uppercase;}

  /* ---------- goal card ---------- */
  .goal-card .goal-top{display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:9px;}
  .goal-week{font-size:.76rem; color:var(--ink-soft);}
  .goal-text{font-family:var(--serif); font-weight:600; font-size:1.4rem; line-height:1.35; letter-spacing:.01em; text-wrap:balance;}
  .goal-empty{color:var(--ink-soft); font-size:1rem; font-family:var(--sans); font-weight:400;}
  .goal-card{cursor:pointer;}
  .goal-card:active{transform:scale(.995);}

  /* ---------- today card ---------- */
  .today-head{display:flex; align-items:baseline; gap:10px; margin-bottom:14px;}
  .today-head .d{font-family:var(--serif); font-weight:600; font-size:1.05rem;}
  .today-head .prog{margin-left:auto; font-size:.8rem; color:var(--ink-mid); font-weight:700;}
  .habits{display:grid; gap:11px;}
  .habit{
    display:flex; align-items:center; gap:14px; width:100%; text-align:left; cursor:pointer;
    background:var(--surface-2); border:1.5px solid var(--line); border-radius:14px; padding:15px 16px;
    font-family:var(--sans); font-size:1.02rem; color:var(--ink); transition:background .18s, border-color .18s;
  }
  .habit:active{transform:scale(.99);}
  .habit .tick{
    width:30px; height:30px; flex:none; border:2px solid var(--line-2); border-radius:50%;
    display:grid; place-items:center; color:transparent; transition:.18s;
  }
  .habit.done{background:var(--good-wash); border-color:var(--good);}
  .habit.done .tick{background:linear-gradient(155deg,var(--good),#3f6a44); border-color:transparent; color:#fff;}
  .habit.done .htext{color:var(--ink-mid);}
  .htext{line-height:1.4;}
  .today-done{margin-top:14px; text-align:center; font-weight:700; color:var(--good); font-size:.94rem; opacity:0; height:0; overflow:hidden; transition:opacity .3s;}
  .today-done.show{opacity:1; height:auto; margin-top:15px;}
  .set-week-btn{
    width:100%; border:1.5px dashed var(--line-2); background:transparent; color:var(--accent-2);
    border-radius:14px; padding:16px; font-size:1rem; font-weight:700; font-family:var(--sans); cursor:pointer;
  }
  .set-week-btn:active{background:var(--accent-wash);}

  /* ---------- week strip ---------- */
  .week-card .wc-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:13px;}
  .weekstrip{display:grid; grid-template-columns:repeat(7,1fr); gap:7px;}
  .wday{display:flex; flex-direction:column; align-items:center; gap:6px;}
  .wday .wl{font-size:.66rem; color:var(--ink-soft);}
  .wday .wd{
    width:100%; aspect-ratio:1; max-width:40px; border-radius:11px; background:var(--cell-empty);
    display:grid; place-items:center; font-size:.8rem; color:var(--ink-soft); font-variant-numeric:tabular-nums;
  }
  .wday.done .wd{background:linear-gradient(155deg,var(--accent),var(--accent-2)); color:#fff; font-weight:700;}
  .wday.today .wd{outline:2px solid var(--accent); outline-offset:2px;}
  .wday.future .wd{opacity:.5;}

  /* ---------- heatmap ---------- */
  .heat-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:13px;}
  .heat-stat{font-size:.78rem; color:var(--ink-mid);}
  .heat-stat b{color:var(--ink); font-family:var(--serif); font-size:.95rem;}
  .heatmap{display:flex; gap:4px; overflow-x:auto; padding-bottom:2px;}
  .heat-col{display:grid; grid-template-rows:repeat(7,1fr); gap:4px;}
  .heat-cell{width:15px; height:15px; border-radius:4px; background:var(--cell-empty);}
  .heat-cell.l1{background:color-mix(in srgb, var(--accent) 40%, var(--cell-empty));}
  .heat-cell.l2{background:color-mix(in srgb, var(--accent) 70%, var(--cell-empty));}
  .heat-cell.l3{background:linear-gradient(155deg,var(--accent),var(--accent-2));}
  .heat-cell.future{background:transparent;}

  /* ---------- editor ---------- */
  .editor .ed-field{margin-bottom:15px;}
  .editor label{display:block; font-size:.76rem; font-weight:700; color:var(--ink-mid); margin-bottom:6px;}
  .editor textarea, .editor input[type=text]{
    width:100%; border:1.5px solid var(--line); background:var(--surface-2); border-radius:11px;
    padding:11px 13px; font-size:16px; color:var(--ink); font-family:var(--sans); resize:none; line-height:1.5;
  }
  .editor textarea:focus, .editor input:focus{outline:2px solid var(--accent-wash); border-color:var(--accent);}
  .editor .goal-in{background:var(--accent-wash); font-weight:600; font-family:var(--serif); font-size:1.15rem;}
  .hab-in-row{display:flex; align-items:center; gap:9px; margin-bottom:9px;}
  .hab-in-row input{flex:1;}
  .hab-in-row .rm{border:none; background:transparent; color:var(--ink-soft); font-size:1.3rem; cursor:pointer; padding:2px 6px;}
  .add-hab{border:none; background:transparent; color:var(--accent-2); font-weight:700; font-size:.88rem; cursor:pointer; padding:3px 0;}
  .ed-actions{display:flex; gap:10px; margin-top:20px;}
  .btn{flex:1; border-radius:12px; padding:14px; font-size:1rem; font-weight:700; font-family:var(--sans); cursor:pointer; border:1.5px solid var(--line);}
  .btn.primary{background:linear-gradient(155deg,var(--accent),var(--accent-2)); color:#fff; border-color:transparent;}
  .btn.ghost{background:var(--surface); color:var(--ink-mid);}
  .btn:active{transform:scale(.98);}
  .newweek{display:flex; justify-content:center; margin-top:2px;}
  .newweek button{border:none; background:transparent; color:var(--ink-soft); font-size:.82rem; cursor:pointer; text-decoration:underline; text-underline-offset:3px; font-family:var(--sans);}

  /* ---------- toast ---------- */
  #toast{
    position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 22px); transform:translate(-50%,20px);
    background:var(--ink); color:var(--paper); padding:11px 17px; border-radius:12px; font-size:.9rem;
    display:flex; align-items:center; gap:12px; opacity:0; pointer-events:none; transition:.25s; z-index:40; max-width:90vw; box-shadow:0 10px 34px -8px rgba(0,0,0,.45);
  }
  #toast.show{opacity:1; transform:translate(-50%,0);}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="cube"></span><h1>独立ロードマップ</h1></div>
    <span class="spacer"></span>
    <span class="streak-badge zero" id="streakBadge"><span>🔥</span><span class="n" id="streakN">0</span>日</span>
    <span class="sync-dot" id="syncDot" title="同期状態"></span>
    <button class="iconbtn" id="themeBtn" aria-label="表示切替">
      <svg viewBox="0 0 24 24" style="width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round"><path d="M19 13.5A7 7 0 1 1 10.5 5a5.5 5.5 0 0 0 8.5 8.5z"/></svg>
    </button>
  </header>

  <main id="app"></main>
  <div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ===================== Supabase（つみき共通プロジェクト） ===================== */
const SUPABASE_URL  = 'https://okbjqtdirrathscctyvx.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9rYmpxdGRpcnJhdGhzY2N0eXZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzMjI4NTIsImV4cCI6MjA5NTg5ODg1Mn0.T-1AOK6vCD6uGdqrVGXjPui3L6WPSNrnygS-IHyfZ6Y';
const sb = (window.supabase && window.supabase.createClient) ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON) : null;
const STATE_TABLE = 'tsumiki_roadmap_state';
const STATE_ID = 'kodai';
const KEY = 'tsumiki_roadmap_v2';

/* ===================== ユーティリティ ===================== */
function uid(){ return Date.now().toString(36) + Math.floor(Math.random()*1e6).toString(36); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function autoGrow(el){ el.style.height='auto'; el.style.height=(el.scrollHeight+2)+'px'; }
const WD = ['日','月','火','水','木','金','土'];
function iso(d){ const z=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate()); }
function todayISO(){ return iso(new Date()); }
function parseISO(s){ const [y,m,d]=String(s).split('-').map(Number); return new Date(y,(m||1)-1,d||1); }
function addDays(s,n){ const d=parseISO(s); d.setDate(d.getDate()+n); return iso(d); }
function mondayOf(s){ const d=parseISO(s); const wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd); return iso(d); }
function fmtMD(s){ const d=parseISO(s); return (d.getMonth()+1)+'/'+d.getDate(); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1700); }

/* ===================== 状態 ===================== */
function blank(){ return { week:{start:'', goal:'', habits:[]}, log:{}, history:[] }; }
let db = blank();
let online = null;
let lastPushed = '';
let editing = false;
let editDraft = null;

function migrate(){
  if(!db.week || typeof db.week!=='object') db.week={start:'',goal:'',habits:[]};
  if(!Array.isArray(db.week.habits)) db.week.habits=[];
  if(!db.log || typeof db.log!=='object') db.log={};
  if(!Array.isArray(db.history)) db.history=[];
  // 旧モデル（weeks[0]）が残っていて新モデル未設定なら引き継ぐ
  if(!db.week.goal && Array.isArray(db.weeks) && db.weeks[0]){
    const w=db.weeks[0];
    db.week.goal = w.goal||'';
    db.week.habits = (w.actions||[]).slice(0,3).map(a=>({id:uid(),text:a.text})).filter(h=>h.text);
    if(!db.week.start) db.week.start = mondayOf(w.date||todayISO());
  }
  if(!db.week.start) db.week.start = mondayOf(todayISO());
  db.week.habits.forEach(h=>{ if(!h.id) h.id=uid(); });
}

/* ===================== 永続化・同期 ===================== */
function loadLocal(){ try{ const s=localStorage.getItem(KEY); if(s){ db=Object.assign(blank(), JSON.parse(s)); migrate(); } }catch(e){} }
let saveTimer=null;
function save(){
  localStorage.setItem(KEY, JSON.stringify(db));
  if(!sb) return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    lastPushed = JSON.stringify(db);
    const { error } = await sb.from(STATE_TABLE).upsert({ id:STATE_ID, state:db, updated_at:new Date().toISOString() });
    if(error){ online=false; } else if(online!==true){ online=true; }
    renderSync();
  }, 350);
}
async function loadRemote(){
  if(!sb){ online=false; renderSync(); return; }
  const { data, error } = await sb.from(STATE_TABLE).select('state').eq('id',STATE_ID).maybeSingle();
  if(error){ online=false; renderSync(); return; }
  online=true;
  if(data && data.state && typeof data.state==='object'){
    db=Object.assign(blank(), data.state); migrate();
    localStorage.setItem(KEY, JSON.stringify(db));
    if(!editing) render();
  } else if(db.week.goal || Object.keys(db.log).length){ save(); }
  renderSync();
}
function subscribeRealtime(){
  if(!sb) return;
  sb.channel('tsumiki-roadmap-rt')
    .on('postgres_changes', { event:'*', schema:'public', table:STATE_TABLE, filter:'id=eq.'+STATE_ID }, (payload)=>{
      const incoming = JSON.stringify((payload.new && payload.new.state) || {});
      if(incoming === lastPushed) return;
      if(editing) return;
      const active=document.activeElement;
      if(active && /INPUT|TEXTAREA/.test(active.tagName)) return;
      if(payload.new && payload.new.state){
        db=Object.assign(blank(), payload.new.state); migrate();
        localStorage.setItem(KEY, JSON.stringify(db));
        render();
      }
    }).subscribe();
}
function renderSync(){
  const dot=document.getElementById('syncDot');
  dot.classList.remove('ok','off');
  if(!sb){ dot.title='この端末に保存'; return; }
  if(online===true){ dot.classList.add('ok'); dot.title='クラウド同期中'; }
  else if(online===false){ dot.classList.add('off'); dot.title='オフライン'; }
}

/* ===================== 計算 ===================== */
function doneList(dateStr){ return db.log[dateStr]||[]; }
function doneCount(dateStr){ return doneList(dateStr).length; }
function isDoneDay(dateStr){ return doneCount(dateStr)>0; }
function currentStreak(){
  let s=0, cur=todayISO();
  if(!isDoneDay(cur)) cur=addDays(cur,-1);
  while(isDoneDay(cur)){ s++; cur=addDays(cur,-1); }
  return s;
}
function bestStreak(){
  const days=Object.keys(db.log).filter(d=>isDoneDay(d)).sort();
  let best=0, run=0, prev=null;
  days.forEach(d=>{ run = (prev && addDays(prev,1)===d) ? run+1 : 1; best=Math.max(best,run); prev=d; });
  return best;
}
function totalDays(){ return Object.keys(db.log).filter(d=>isDoneDay(d)).length; }

/* ===================== 描画 ===================== */
const app = document.getElementById('app');
function render(){
  if(editing){ renderEditor(); return; }
  const today=todayISO();
  const habits=db.week.habits;
  const goal=db.week.goal;

  // streak badge
  const cs=currentStreak();
  const badge=document.getElementById('streakBadge');
  document.getElementById('streakN').textContent=cs;
  badge.classList.toggle('zero', cs===0);

  let h='';

  /* 今週の目標 */
  const wStart=db.week.start||mondayOf(today);
  const wEnd=addDays(wStart,6);
  h+=`<div class="card goal-card" data-act="edit">
    <div class="goal-top"><span class="label">今週の目標</span><span class="goal-week tnum">${fmtMD(wStart)}–${fmtMD(wEnd)}</span></div>
    <div class="goal-text ${goal?'':'goal-empty'}">${goal?esc(goal):'タップして今週の目標を決める'}</div>
  </div>`;

  /* 今日 */
  if(habits.length){
    const doneToday=doneList(today);
    const nDone=habits.filter(x=>doneToday.includes(x.id)).length;
    const allDone=nDone===habits.length && habits.length>0;
    const td=parseISO(today);
    h+=`<div class="card today-card">
      <div class="today-head"><span class="d tnum">今日 ${td.getMonth()+1}/${td.getDate()}(${WD[td.getDay()]})</span><span class="prog tnum">${nDone}/${habits.length}</span></div>
      <div class="habits">`;
    habits.forEach(hb=>{
      const on=doneToday.includes(hb.id);
      h+=`<button class="habit ${on?'done':''}" data-act="toggle" data-id="${hb.id}">
        <span class="tick"><svg viewBox="0 0 24 24" style="width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round"><path d="M5 12.5l4 4 10-10"/></svg></span>
        <span class="htext">${esc(hb.text)}</span>
      </button>`;
    });
    h+=`</div><div class="today-done ${allDone?'show':''}">🎉 今日ぶん完了。続けよう。</div></div>`;
  } else {
    h+=`<button class="set-week-btn" data-act="edit">＋ 今週の目標と習慣を決める</button>`;
  }

  /* 今週の7日 */
  if(habits.length){
    h+=`<div class="card week-card">
      <div class="wc-head"><span class="label">今週の記録</span></div>
      <div class="weekstrip">`;
    for(let i=0;i<7;i++){
      const ds=addDays(wStart,i); const dd=parseISO(ds);
      const cls=(ds===today?'today ':'')+(isDoneDay(ds)?'done ':'')+(ds>today?'future':'');
      h+=`<div class="wday ${cls}"><span class="wl">${WD[dd.getDay()]}</span><span class="wd tnum">${dd.getDate()}</span></div>`;
    }
    h+=`</div></div>`;
  }

  /* 継続ヒートマップ */
  if(totalDays()>0 || habits.length){
    h+=`<div class="card heat-card">
      <div class="heat-head"><span class="label">継続</span><span class="heat-stat">今 <b class="tnum">${cs}</b>日連続 ・ 最長 <b class="tnum">${bestStreak()}</b>日 ・ 累計 <b class="tnum">${totalDays()}</b>日</span></div>
      <div class="heatmap">${heatmapHTML()}</div>
    </div>`;
  }

  /* 週の更新導線 */
  if(habits.length){
    h+=`<div class="newweek"><button data-act="newweek">今週が終わった → 新しい週をはじめる</button></div>`;
  }

  app.innerHTML=h;
  renderSync();
}

function heatmapHTML(){
  const WEEKS=12;
  const today=todayISO();
  const startMon=addDays(mondayOf(today), -(WEEKS-1)*7);
  const maxH=Math.max(1, db.week.habits.length||1);
  let cols='';
  for(let w=0;w<WEEKS;w++){
    let cells='';
    for(let dOff=0;dOff<7;dOff++){
      const ds=addDays(startMon, w*7+dOff);
      if(ds>today){ cells+=`<div class="heat-cell future"></div>`; continue; }
      const c=doneCount(ds);
      let lvl=''; if(c>0){ const r=c/maxH; lvl=r>=1?'l3':(r>=0.5?'l2':'l1'); }
      cells+=`<div class="heat-cell ${lvl}"></div>`;
    }
    cols+=`<div class="heat-col">${cells}</div>`;
  }
  return cols;
}

/* ---------- エディタ（週の目標＋習慣の設定：入力はここだけ） ---------- */
function renderEditor(){
  const d=editDraft;
  let habs='';
  d.habits.forEach((hb,i)=>{
    habs+=`<div class="hab-in-row"><input type="text" class="hab-in" data-i="${i}" value="${esc(hb.text)}" placeholder="今週つづける習慣">${d.habits.length>1?'<button class="rm" data-act="rmhab" data-i="'+i+'">×</button>':''}</div>`;
  });
  const addBtn = d.habits.length<3 ? `<button class="add-hab" data-act="addhab">＋ 習慣を追加（最大3つ）</button>` : '';
  app.innerHTML=`<div class="card editor">
    <div class="ed-field"><label>今週の目標（1つ）</label><textarea class="goal-in" id="edGoal" rows="2" placeholder="今週いちばん進めたいこと">${esc(d.goal)}</textarea></div>
    <div class="ed-field"><label>今週つづける習慣（1〜3つ・毎日チェック）</label>${habs}${addBtn}</div>
    <div class="ed-actions"><button class="btn ghost" data-act="cancel">キャンセル</button><button class="btn primary" data-act="savew">保存</button></div>
  </div>`;
  const g=document.getElementById('edGoal'); if(g){ autoGrow(g); }
}

/* ===================== 操作 ===================== */
app.addEventListener('click', e=>{
  const btn=e.target.closest('[data-act]'); if(!btn) return;
  const act=btn.dataset.act;

  if(act==='toggle'){
    const id=btn.dataset.id; const t=todayISO();
    const arr=db.log[t]||(db.log[t]=[]);
    const idx=arr.indexOf(id);
    if(idx>=0) arr.splice(idx,1); else arr.push(id);
    if(arr.length===0) delete db.log[t];
    save(); render();
    return;
  }
  if(act==='edit'){
    editDraft={ goal:db.week.goal||'', habits:(db.week.habits.length?db.week.habits.map(h=>({id:h.id,text:h.text})):[{id:uid(),text:''}]) };
    editing=true; render(); return;
  }
  if(act==='newweek'){
    // 現在の週を履歴へ退避し、習慣は引き継いで目標だけ決め直す
    if(db.week.goal || db.week.habits.length){ db.history.unshift({start:db.week.start, goal:db.week.goal, habits:db.week.habits.map(h=>({...h}))}); }
    db.week.start=mondayOf(todayISO());
    editDraft={ goal:'', habits:(db.week.habits.length?db.week.habits.map(h=>({id:uid(),text:h.text})):[{id:uid(),text:''}]) };
    editing=true; save(); render(); return;
  }
  if(act==='addhab'){ if(editDraft.habits.length<3){ editDraft.habits.push({id:uid(),text:''}); syncDraftFromInputs(); renderEditor(); } return; }
  if(act==='rmhab'){ editDraft.habits.splice(+btn.dataset.i,1); syncDraftFromInputs(true); renderEditor(); return; }
  if(act==='cancel'){ editing=false; editDraft=null; render(); return; }
  if(act==='savew'){
    syncDraftFromInputs();
    db.week.goal = editDraft.goal.trim();
    db.week.habits = editDraft.habits.map(h=>({id:h.id,text:h.text.trim()})).filter(h=>h.text);
    if(!db.week.start) db.week.start=mondayOf(todayISO());
    editing=false; editDraft=null; save(); render();
    toast('今週を保存しました');
    return;
  }
});
// エディタのテキストを editDraft に取り込む（再描画で消えないように）
function syncDraftFromInputs(skipRemoved){
  const g=document.getElementById('edGoal'); if(g) editDraft.goal=g.value;
  if(skipRemoved) return;
  document.querySelectorAll('.hab-in').forEach(inp=>{ const i=+inp.dataset.i; if(editDraft.habits[i]) editDraft.habits[i].text=inp.value; });
}
app.addEventListener('input', e=>{
  if(e.target.id==='edGoal'){ autoGrow(e.target); editDraft.goal=e.target.value; }
  else if(e.target.classList.contains('hab-in')){ const i=+e.target.dataset.i; if(editDraft.habits[i]) editDraft.habits[i].text=e.target.value; }
});

/* ===================== テーマ ===================== */
function applyTheme(t){ if(t) document.documentElement.setAttribute('data-theme',t); else document.documentElement.removeAttribute('data-theme'); }
(function(){ const s=localStorage.getItem('tsumiki_roadmap_theme'); if(s) applyTheme(s); })();
document.getElementById('themeBtn').addEventListener('click', ()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const isDark = cur ? cur==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  const next=isDark?'light':'dark'; applyTheme(next); localStorage.setItem('tsumiki_roadmap_theme', next);
});

/* ===================== 起動 ===================== */
loadLocal();
render();
renderSync();
if(sb){ loadRemote(); subscribeRealtime(); }
</script>
<!-- tsumiki-back-button -->
<style>
  #tsumikiEdge{position:fixed; top:0; bottom:0; left:0; width:22px; z-index:999;}
  #tsumikiPeek{
    position:fixed; top:50%; left:0; z-index:1001; margin-top:-23px;
    width:46px; height:46px; display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.92);
    -webkit-backdrop-filter:saturate(180%) blur(14px); backdrop-filter:saturate(180%) blur(14px);
    border:1px solid rgba(0,0,0,.06); border-radius:50%;
    box-shadow:0 6px 20px rgba(0,0,0,.18);
    color:#0071e3; font-size:24px; font-weight:600; line-height:1;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Helvetica Neue",Arial,sans-serif;
    transform:translateX(-70px) scale(.8); opacity:0; pointer-events:none;
  }
</style>
<div id="tsumikiEdge"></div>
<div id="tsumikiPeek">‹</div>
<script>
  (function(){
    var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
      || window.navigator.standalone === true;
    var fromTsumiki = false;
    try{
      if(document.referrer){
        var r = new URL(document.referrer);
        fromTsumiki = (r.origin === location.origin);
      }
    }catch(e){}
    if(!(standalone && fromTsumiki)) return;

    var peek = document.getElementById('tsumikiPeek');
    var edge = document.getElementById('tsumikiEdge');

    function goBack(){ location.href = 'index.html'; }

    /* --- 左端エッジスワイプで戻る（iOS純正の戻る操作。見えるボタンは置かない） --- */
    var sx=0, sy=0, prog=0, dragging=false, W=window.innerWidth;
    var TRIGGER = Math.min(120, W*0.32);
    window.addEventListener('resize', function(){ W=window.innerWidth; TRIGGER=Math.min(120, W*0.32); });

    function reset(){
      dragging = false; prog = 0;
      peek.style.transition = 'transform .25s ease, opacity .25s ease';
      peek.style.transform = 'translateX(-70px) scale(.8)';
      peek.style.opacity = 0;
    }
    function start(e){
      var t = e.touches ? e.touches[0] : e;
      if(t.clientX > 26) return;
      sx = t.clientX; sy = t.clientY; prog = 0; dragging = true;
      peek.style.transition = 'none';
    }
    function move(e){
      if(!dragging) return;
      var t = e.touches ? e.touches[0] : e;
      var dx = t.clientX - sx, dy = t.clientY - sy;
      if(Math.abs(dy) > Math.abs(dx) + 12){ reset(); return; }
      if(dx < 0) dx = 0;
      prog = Math.min(dx / TRIGGER, 1);
      peek.style.transform = 'translateX(' + (-70 + prog*82) + 'px) scale(' + (0.8 + prog*0.2) + ')';
      peek.style.opacity = prog;
      if(dx > 6 && e.cancelable) e.preventDefault();
    }
    function end(){
      if(!dragging) return;
      dragging = false;
      if(prog >= 0.999){
        peek.style.transition = 'transform .25s ease, opacity .25s ease';
        peek.style.transform = 'translateX(20px) scale(1.05)';
        peek.style.opacity = 1;
        goBack();
      }else{
        reset();
      }
    }
    edge.addEventListener('touchstart', start, {passive:true});
    window.addEventListener('touchmove', move, {passive:false});
    window.addEventListener('touchend', end, {passive:true});
    window.addEventListener('touchcancel', end, {passive:true});
  })();
</script>
<!-- /tsumiki-back-button -->
