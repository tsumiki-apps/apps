<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="apple-touch-icon" href="icons/icon-dokuritsu.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="独立">
<meta name="theme-color" content="#f5f4f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131109" media="(prefers-color-scheme: dark)">
<title>独立ロードマップ</title>
<style>
  :root{
    --paper:#f5f4f0; --surface:#fffefb; --surface-2:#efece5; --ink:#1d1a15;
    --ink-mid:#5b554a; --ink-soft:#8f8877; --line:#e2ded4; --line-2:#d8d3c7;
    --accent:#b06f26; --accent-2:#8a5a24; --accent-wash:#f0e4d1;
    --good:#4c7a51; --good-wash:#dde9dd; --block-empty:#e6e1d6;
    --shadow:0 1px 2px rgba(40,32,18,.05), 0 8px 22px -14px rgba(40,32,18,.16);
    --serif:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Songti SC",serif;
    --sans:"Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,Meiryo,sans-serif;
    --tabh:64px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#131109; --surface:#1d1a12; --surface-2:#26221a; --ink:#efe8da;
      --ink-mid:#a89e8b; --ink-soft:#7d7566; --line:#2f2b21; --line-2:#3a352a;
      --accent:#d59a4d; --accent-2:#e0ab63; --accent-wash:#362a19;
      --good:#7fae82; --good-wash:#23301f; --block-empty:#2c281e;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -16px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="light"]{
    --paper:#f5f4f0; --surface:#fffefb; --surface-2:#efece5; --ink:#1d1a15;
    --ink-mid:#5b554a; --ink-soft:#8f8877; --line:#e2ded4; --line-2:#d8d3c7;
    --accent:#b06f26; --accent-2:#8a5a24; --accent-wash:#f0e4d1;
    --good:#4c7a51; --good-wash:#dde9dd; --block-empty:#e6e1d6;
    --shadow:0 1px 2px rgba(40,32,18,.05), 0 8px 22px -14px rgba(40,32,18,.16);
  }
  :root[data-theme="dark"]{
    --paper:#131109; --surface:#1d1a12; --surface-2:#26221a; --ink:#efe8da;
    --ink-mid:#a89e8b; --ink-soft:#7d7566; --line:#2f2b21; --line-2:#3a352a;
    --accent:#d59a4d; --accent-2:#e0ab63; --accent-wash:#362a19;
    --good:#7fae82; --good-wash:#23301f; --block-empty:#2c281e;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -16px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink); font-family:var(--sans);
    line-height:1.6; -webkit-font-smoothing:antialiased; font-feature-settings:"palt" 1;
    -webkit-text-size-adjust:100%;
  }
  .tnum{font-variant-numeric:tabular-nums;}

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--paper) 88%, transparent);
    backdrop-filter:saturate(1.3) blur(10px); -webkit-backdrop-filter:saturate(1.3) blur(10px);
    border-bottom:1px solid var(--line);
    padding:calc(env(safe-area-inset-top) + 12px) 18px 12px;
    display:flex; align-items:center; gap:12px;
  }
  .brand{display:flex; align-items:center; gap:10px; min-width:0;}
  .brand .cube{
    width:22px; height:22px; flex:none;
    background:
      linear-gradient(var(--accent),var(--accent)) left top/9px 9px no-repeat,
      linear-gradient(var(--accent),var(--accent)) right top/9px 9px no-repeat,
      linear-gradient(var(--accent-2),var(--accent-2)) center bottom/9px 9px no-repeat;
  }
  .brand h1{font-family:var(--serif); font-weight:600; font-size:1.12rem; margin:0; letter-spacing:.02em; white-space:nowrap;}
  .spacer{flex:1;}
  .sync{
    display:inline-flex; align-items:center; gap:6px; font-size:.72rem; color:var(--ink-mid);
    padding:4px 9px; border-radius:100px; border:1px solid var(--line); background:var(--surface); white-space:nowrap;
  }
  .sync .dot{width:7px; height:7px; border-radius:50%; background:var(--ink-soft);}
  .sync.ok .dot{background:var(--good);}
  .sync.off .dot{background:var(--accent);}
  .iconbtn{
    width:34px; height:34px; flex:none; border:1px solid var(--line); background:var(--surface);
    border-radius:9px; color:var(--ink-mid); display:grid; place-items:center; cursor:pointer;
  }
  .iconbtn:active{transform:scale(.94);}

  /* ---------- layout ---------- */
  main{max-width:680px; margin:0 auto; padding:18px 16px calc(var(--tabh) + env(safe-area-inset-bottom) + 24px);}
  .view-head{margin:2px 0 16px;}
  .view-head h2{font-family:var(--serif); font-weight:600; font-size:1.28rem; margin:0 0 4px; letter-spacing:.01em;}
  .view-head p{margin:0; color:var(--ink-mid); font-size:.86rem;}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:15px; box-shadow:var(--shadow);}
  .stack,.list{display:grid; gap:13px;}

  /* ---------- summary banner ---------- */
  .summary{padding:15px 17px; display:flex; align-items:center; gap:14px; margin-bottom:14px;}
  .summary .ring{
    --p:0; width:52px; height:52px; flex:none; border-radius:50%;
    background:conic-gradient(var(--accent) calc(var(--p)*1%), var(--block-empty) 0);
    display:grid; place-items:center;
  }
  .summary .ring b{background:var(--surface); width:40px; height:40px; border-radius:50%; display:grid; place-items:center; font-family:var(--serif); font-size:1rem; color:var(--accent-2);}
  .summary .txt{font-size:.9rem; color:var(--ink-mid);}
  .summary .txt b{color:var(--ink); font-size:1rem;}
  .summary.done{background:var(--good-wash); border-color:var(--good);}
  .summary.done .txt b{color:var(--good);}

  /* ---------- meter ---------- */
  .meter{padding:15px 17px;}
  .meter-top{display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:5px;}
  .meter-name{font-weight:700; font-size:.98rem;}
  .meter-name .hint{display:block; font-weight:400; color:var(--ink-mid); font-size:.76rem; margin-top:1px;}
  .meter-val{font-family:var(--serif); font-size:1.15rem; color:var(--accent-2); white-space:nowrap;}
  .meter-val small{font-family:var(--sans); font-size:.76rem; color:var(--ink-mid);}
  .meter.done{border-color:var(--good);}
  .meter.done .meter-val{color:var(--good);}
  .blocks{display:flex; gap:5px; margin:11px 0 13px;}
  .blk{flex:1 1 0; min-width:10px; height:18px; border-radius:4px; background:var(--block-empty); transition:background .35s ease;}
  .blk.on{background:linear-gradient(155deg,var(--accent),var(--accent-2));}
  .blk.on.g{background:linear-gradient(155deg,var(--good),#3f6a44);}
  .meter-ctrl{display:flex; align-items:center; gap:10px;}
  .step{
    width:38px; height:38px; flex:none; border:1px solid var(--line-2); background:var(--surface-2);
    border-radius:10px; font-size:1.3rem; color:var(--ink); display:grid; place-items:center; cursor:pointer; line-height:1;
  }
  .step:active{transform:scale(.93);} .step:disabled{opacity:.35;}
  .meter-num{flex:1; text-align:center;}
  .meter-num input{
    width:3.4em; text-align:center; font-family:var(--serif); font-size:1.25rem; color:var(--ink);
    border:none; background:transparent; padding:2px 0; -moz-appearance:textfield;
  }
  .meter-num input::-webkit-outer-spin-button,.meter-num input::-webkit-inner-spin-button{-webkit-appearance:none;}
  .meter-num .of{font-size:.78rem; color:var(--ink-soft);}
  .meter-note{
    margin-top:11px; width:100%; border:1px solid var(--line); background:var(--surface-2);
    border-radius:9px; padding:8px 11px; font-size:16px; color:var(--ink); font-family:var(--sans); resize:none; line-height:1.45;
  }
  .meter-note::placeholder{color:var(--ink-soft);}

  /* ---------- add button ---------- */
  .add-btn{
    width:100%; border:1px dashed var(--line-2); background:var(--surface); color:var(--accent-2);
    border-radius:13px; padding:14px; font-size:.95rem; font-weight:700; font-family:var(--sans);
    cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:14px;
  }
  .add-btn:active{transform:scale(.99); background:var(--accent-wash);}

  /* ---------- week card ---------- */
  .entry{padding:0; overflow:hidden;}
  .entry-head{display:flex; align-items:center; gap:10px; padding:12px 15px; background:var(--surface-2); border-bottom:1px solid var(--line);}
  .entry-head .badge{font-family:var(--serif); font-weight:600; color:var(--accent-2); font-size:.98rem; flex:none;}
  .entry-head input[type=date],.entry-head input[type=month]{
    border:none; background:transparent; color:var(--ink-mid); font-size:.86rem; font-family:var(--sans); flex:1; min-width:0;
  }
  .entry-body{padding:14px 15px; display:grid; gap:13px;}
  .field label{display:block; font-size:.74rem; font-weight:700; letter-spacing:.03em; color:var(--ink-mid); margin-bottom:5px;}
  .field textarea, .field input[type=text]{
    width:100%; border:1px solid var(--line); background:var(--surface); border-radius:9px;
    padding:9px 11px; font-size:16px; color:var(--ink); font-family:var(--sans); resize:none; line-height:1.5;
  }
  .field textarea:focus, .field input:focus, .meter-note:focus{outline:2px solid var(--accent-wash); outline-offset:1px; border-color:var(--accent);}
  .goal-field textarea{background:var(--accent-wash); border-color:var(--line-2); font-weight:600;}
  .acts{display:grid; gap:8px;}
  .act-row{display:flex; align-items:flex-start; gap:10px;}
  .chk{
    width:26px; height:26px; flex:none; margin-top:5px; border:1.6px solid var(--line-2); border-radius:8px;
    background:var(--surface); cursor:pointer; display:grid; place-items:center; color:transparent;
  }
  .chk.on{background:linear-gradient(155deg,var(--good),#3f6a44); border-color:transparent; color:#fff;}
  .act-row input{flex:1; min-width:0;}
  .act-row.done input{color:var(--ink-soft); text-decoration:line-through;}
  .row-del{border:none; background:transparent; color:var(--ink-soft); font-size:1.2rem; cursor:pointer; padding:4px 6px; align-self:flex-start; margin-top:2px;}
  .mini-add{border:none; background:transparent; color:var(--accent-2); font-size:.84rem; font-weight:700; cursor:pointer; padding:2px 0; justify-self:start;}
  .entry-foot{display:flex; justify-content:flex-end; padding:0 15px 13px;}
  .del-entry{border:1px solid var(--line); background:var(--surface); color:var(--ink-mid); border-radius:8px; padding:6px 13px; font-size:.8rem; cursor:pointer;}

  /* ---------- kpi trend ---------- */
  .trend{padding:15px 16px; margin-bottom:14px;}
  .trend h3{font-size:.82rem; color:var(--ink-mid); font-weight:700; margin:0 0 12px; letter-spacing:.02em;}
  .trend-row{display:grid; grid-template-columns:5.2em 1fr; align-items:end; gap:10px; margin-bottom:12px;}
  .trend-row:last-child{margin-bottom:0;}
  .trend-lbl{font-size:.78rem; color:var(--ink-mid); padding-bottom:3px;}
  .trend-lbl b{display:block; color:var(--ink); font-family:var(--serif); font-size:1.05rem;}
  .bars{display:flex; align-items:flex-end; gap:4px; height:44px;}
  .bar{flex:1 1 0; min-width:5px; background:linear-gradient(var(--accent),var(--accent-2)); border-radius:3px 3px 0 0; min-height:2px; position:relative;}
  .bar.last{background:linear-gradient(var(--accent-2),var(--accent-2));}
  .bar span{position:absolute; top:-15px; left:50%; transform:translateX(-50%); font-size:.6rem; color:var(--ink-soft); white-space:nowrap;}
  .kpi-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .kpi-cell label{display:block; font-size:.7rem; color:var(--ink-mid); margin-bottom:4px; text-align:center;}
  .kpi-cell input{width:100%; text-align:center; border:1px solid var(--line); background:var(--surface); border-radius:9px; padding:8px 4px; font-size:16px; color:var(--ink); font-family:var(--serif); -moz-appearance:textfield;}
  .kpi-cell input::-webkit-outer-spin-button,.kpi-cell input::-webkit-inner-spin-button{-webkit-appearance:none;}

  /* ---------- prospects ---------- */
  .p-head{display:flex; align-items:center; gap:9px; padding:12px 14px; background:var(--surface-2); border-bottom:1px solid var(--line);}
  .p-head input{flex:1; min-width:0; border:none; background:transparent; font-size:1rem; font-weight:700; color:var(--ink); font-family:var(--sans);}
  .stage-sel{border:1px solid var(--line-2); background:var(--surface); border-radius:100px; padding:5px 9px; font-size:.76rem; color:var(--accent-2); font-weight:700; font-family:var(--sans); flex:none;}
  .p-body{padding:13px 14px; display:grid; gap:11px;}
  .p-2{display:grid; grid-template-columns:1fr 1fr; gap:11px;}
  .voice-tag{display:inline-block; font-size:.66rem; font-weight:700; padding:2px 7px; border-radius:5px;}

  /* ---------- tab bar ---------- */
  .tabbar{
    position:fixed; left:0; right:0; bottom:0; z-index:20; display:flex;
    background:color-mix(in srgb, var(--paper) 90%, transparent);
    backdrop-filter:saturate(1.3) blur(12px); -webkit-backdrop-filter:saturate(1.3) blur(12px);
    border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom);
  }
  .tab{
    flex:1; border:none; background:none; padding:9px 4px 10px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--ink-soft); font-family:var(--sans);
  }
  .tab svg{width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round;}
  .tab span{font-size:.66rem; font-weight:600; letter-spacing:.02em;}
  .tab.on{color:var(--accent);}
  .tab.on span{color:var(--accent-2);}

  .empty{text-align:center; color:var(--ink-soft); font-size:.88rem; padding:34px 20px; line-height:1.7;}
  .empty b{color:var(--ink-mid);}

  /* ---------- toast ---------- */
  #toast{
    position:fixed; left:50%; bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 16px); transform:translate(-50%,20px);
    background:var(--ink); color:var(--paper); padding:11px 16px; border-radius:11px; font-size:.86rem;
    display:flex; align-items:center; gap:12px; opacity:0; pointer-events:none; transition:.25s; z-index:40; max-width:90vw; box-shadow:0 8px 30px -8px rgba(0,0,0,.4);
  }
  #toast.show{opacity:1; transform:translate(-50%,0); pointer-events:auto;}
  #toast .undo{border:none; background:none; color:var(--accent-2); font-weight:700; font-size:.86rem; cursor:pointer; font-family:var(--sans); padding:0;}
  @media (prefers-color-scheme: dark){ #toast .undo{color:var(--accent);} }

  /* ---------- PC（横幅フル活用・多カラム） ---------- */
  @media (min-width: 900px){
    main{max-width:1180px; padding-left:32px; padding-right:32px; padding-top:26px;}
    .topbar{padding-left:32px; padding-right:32px;}
    .view-head h2{font-size:1.5rem;}
    .stack{grid-template-columns:repeat(2, minmax(0,1fr)); align-items:start;}
    .list{grid-template-columns:repeat(auto-fill, minmax(360px,1fr)); align-items:start;}
    .add-btn{max-width:420px;}
    .tabbar{justify-content:center; gap:8px;}
    .tab{flex:0 0 150px;}
  }
  @media (min-width: 1320px){
    main{max-width:1320px;}
    .list{grid-template-columns:repeat(3, minmax(0,1fr));}
  }
  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="cube"></span><h1>独立ロードマップ</h1></div>
    <span class="spacer"></span>
    <span class="sync" id="syncChip"><span class="dot"></span><span id="syncText">接続中…</span></span>
    <button class="iconbtn" id="themeBtn" aria-label="表示切替">
      <svg viewBox="0 0 24 24" style="width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round"><path d="M19 13.5A7 7 0 1 1 10.5 5a5.5 5.5 0 0 0 8.5 8.5z"/></svg>
    </button>
  </header>

  <main id="view"></main>

  <nav class="tabbar" id="tabbar">
    <button class="tab" data-tab="meter">
      <svg viewBox="0 0 24 24"><rect x="4" y="13" width="6" height="7" rx="1"/><rect x="14" y="9" width="6" height="11" rx="1"/><rect x="9" y="4" width="6" height="6" rx="1"/></svg>
      <span>メーター</span>
    </button>
    <button class="tab" data-tab="week">
      <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 9h16M8 3v4M16 3v4M9 14l2 2 4-4"/></svg>
      <span>週次</span>
    </button>
    <button class="tab" data-tab="kpi">
      <svg viewBox="0 0 24 24"><path d="M4 20V4M4 20h16M8 16l3-4 3 2 4-6"/></svg>
      <span>数値</span>
    </button>
    <button class="tab" data-tab="prospect">
      <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0M16 6.5a3 3 0 0 1 0 5.6M17 20a5 5 0 0 0-3-4.6"/></svg>
      <span>見込み</span>
    </button>
  </nav>

  <div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ===================== Supabase（つみき共通プロジェクト） ===================== */
const SUPABASE_URL  = 'https://okbjqtdirrathscctyvx.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9rYmpxdGRpcnJhdGhzY2N0eXZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzMjI4NTIsImV4cCI6MjA5NTg5ODg1Mn0.T-1AOK6vCD6uGdqrVGXjPui3L6WPSNrnygS-IHyfZ6Y';
const sb = (window.supabase && window.supabase.createClient) ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON) : null;
const STATE_TABLE = 'tsumiki_roadmap_state';
const STATE_ID = 'kodai';
const KEY = 'tsumiki_roadmap_v1';

/* ===================== 定義 ===================== */
const TRIGGERS = [
  { key:'paid',   name:'有料納品',           hint:'＝売れる証明',                 unit:'件',   def:5 },
  { key:'floor',  name:'保守の床',           hint:'＝寝てても入る足（1万/月×件）', unit:'万・月', def:5 },
  { key:'months', name:'月商≈40万 連続',     hint:'＝新独立ラインを超えた月数',    unit:'ヶ月', def:2 },
  { key:'fund',   name:'生活防衛資金',       hint:'＝同棲後バーンで約110〜130万', unit:'ヶ月', def:6 },
];
const STAGES = ['①声かけ前','②ヒアリング','③見積・提案','④成約','⑤納品','⑥保守'];
const VOICES = ['voice未','voice依頼中','voice取得'];

/* ===================== ユーティリティ ===================== */
function uid(){ return Date.now().toString(36) + Math.floor(Math.random()*1e6).toString(36); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function autoGrow(el){ el.style.height='auto'; el.style.height=(el.scrollHeight+2)+'px'; }
function todayISO(){ const d=new Date(); const z=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate()); }
function thisMonth(){ return todayISO().slice(0,7); }
function fmtDate(iso){ if(!iso) return ''; const [y,m,d]=iso.split('-'); return y+'/'+m+'/'+d; }
function toast(msg){ const t=document.getElementById('toast'); t.innerHTML=''; t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1700); }
function undoToast(msg, undoFn){
  const t=document.getElementById('toast'); t.innerHTML='';
  const s=document.createElement('span'); s.textContent=msg; t.appendChild(s);
  const b=document.createElement('button'); b.className='undo'; b.textContent='取り消す'; t.appendChild(b);
  t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),4200);
  b.onclick=()=>{ clearTimeout(t._t); t.classList.remove('show'); undoFn(); };
}

/* ===================== 状態 ===================== */
function blankTriggers(){ const o={}; TRIGGERS.forEach(t=>o[t.key]={current:0, target:t.def, note:''}); return o; }
function blank(){ return { triggers:blankTriggers(), weeks:[], kpis:[], prospects:[] }; }
let db = blank();
let online = null;      // null=確認中 true=同期 false=オフライン
let lastPushed = '';
let tab = localStorage.getItem('tsumiki_roadmap_tab') || 'meter';

function migrate(){
  if(!db.triggers) db.triggers = blankTriggers();
  TRIGGERS.forEach(t=>{ if(!db.triggers[t.key]) db.triggers[t.key]={current:0,target:t.def,note:''}; });
  if(!Array.isArray(db.weeks)) db.weeks=[];
  if(!Array.isArray(db.kpis)) db.kpis=[];
  if(!Array.isArray(db.prospects)) db.prospects=[];
}

/* ===================== 永続化・同期（yarukoto等と同じ方式） ===================== */
function loadLocal(){ try{ const s=localStorage.getItem(KEY); if(s){ db=Object.assign(blank(), JSON.parse(s)); migrate(); } }catch(e){} }
let saveTimer=null;
function save(){
  localStorage.setItem(KEY, JSON.stringify(db));
  if(!sb) return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    lastPushed = JSON.stringify(db);
    const { error } = await sb.from(STATE_TABLE).upsert({ id:STATE_ID, state:db, updated_at:new Date().toISOString() });
    if(error){ online=false; } else if(online!==true){ online=true; }
    renderSync();
  }, 350);
}
async function loadRemote(){
  if(!sb){ online=false; renderSync(); return; }
  const { data, error } = await sb.from(STATE_TABLE).select('state').eq('id',STATE_ID).maybeSingle();
  if(error){ online=false; renderSync(); return; }
  online=true;
  if(data && data.state && typeof data.state==='object'){
    db=Object.assign(blank(), data.state); migrate();
    localStorage.setItem(KEY, JSON.stringify(db));
    render();
  } else {
    if(db.weeks.length||db.kpis.length||db.prospects.length) save();
  }
  renderSync();
}
function subscribeRealtime(){
  if(!sb) return;
  sb.channel('tsumiki-roadmap-rt')
    .on('postgres_changes', { event:'*', schema:'public', table:STATE_TABLE, filter:'id=eq.'+STATE_ID }, (payload)=>{
      const incoming = JSON.stringify((payload.new && payload.new.state) || {});
      if(incoming === lastPushed) return;
      if(payload.new && payload.new.state){
        const active=document.activeElement;
        if(active && /INPUT|TEXTAREA|SELECT/.test(active.tagName)) return; // 編集中は上書きしない
        db=Object.assign(blank(), payload.new.state); migrate();
        localStorage.setItem(KEY, JSON.stringify(db));
        render();
      }
    }).subscribe();
}
function renderSync(){
  const chip=document.getElementById('syncChip'), txt=document.getElementById('syncText');
  chip.classList.remove('ok','off');
  if(!sb){ txt.textContent='この端末に保存'; return; }
  if(online===true){ chip.classList.add('ok'); txt.textContent='クラウド同期中'; }
  else if(online===false){ chip.classList.add('off'); txt.textContent='オフライン'; }
  else{ txt.textContent='接続中…'; }
}

/* ===================== 描画 ===================== */
const view = document.getElementById('view');
function render(){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on', b.dataset.tab===tab));
  if(tab==='meter') renderMeter();
  else if(tab==='week') renderWeek();
  else if(tab==='kpi') renderKpi();
  else renderProspect();
  view.querySelectorAll('textarea').forEach(autoGrow);
}

/* ---- メーター ---- */
function renderMeter(){
  const done = TRIGGERS.filter(t=>db.triggers[t.key].current>=db.triggers[t.key].target).length;
  const pct = Math.round(done/TRIGGERS.length*100);
  const allDone = done===TRIGGERS.length;
  let h = `<div class="view-head"><h2>退職トリガー</h2><p>4つ揃った月末に退職届。急ぐのは退職日でなく、このメーター。</p></div>`;
  h += `<div class="card summary ${allDone?'done':''}">
    <div class="ring" style="--p:${pct}"><b>${done}<span style="font-size:.6em;color:var(--ink-soft)">/4</span></b></div>
    <div class="txt">${allDone ? '<b>4メーター達成 — 辞めていい状態です</b><br>退職トリガーの4条件が揃いました。' : '<b>あと '+(TRIGGERS.length-done)+' メーター</b><br>1つずつ積み上げる。数字は下のボタンで更新。'}</div>
  </div>`;
  h += `<div class="stack">`;
  TRIGGERS.forEach(t=>{
    const v=db.triggers[t.key]; const isDone=v.current>=v.target;
    const n=Math.min(v.target,10);
    let blocks=''; for(let i=0;i<n;i++){ const on=i<v.current; blocks+=`<div class="blk ${on?'on':''} ${on&&isDone?'g':''}"></div>`; }
    h+=`<div class="card meter ${isDone?'done':''}" data-key="${t.key}">
      <div class="meter-top">
        <div class="meter-name">${esc(t.name)}<span class="hint">${esc(t.hint)}</span></div>
        <div class="meter-val tnum">${v.current} <small>/ ${v.target}${esc(t.unit)}</small></div>
      </div>
      <div class="blocks">${blocks}</div>
      <div class="meter-ctrl">
        <button class="step" data-act="dec" ${v.current<=0?'disabled':''}>−</button>
        <div class="meter-num"><input type="text" inputmode="numeric" data-field="current" value="${v.current}"> <span class="of">/ ${v.target}${esc(t.unit)}</span></div>
        <button class="step" data-act="inc">＋</button>
      </div>
      <textarea class="meter-note" data-field="note" rows="1" placeholder="メモ（例：目標130万／現在◯万・◯◯さん納品済 など）">${esc(v.note||'')}</textarea>
    </div>`;
  });
  h+=`</div>`;
  view.innerHTML=h;
}

/* ---- 週次 ---- */
function renderWeek(){
  let h = `<div class="view-head"><h2>週次ログ</h2><p>毎週15分。①今週の数値目標 ②具体行動3つ ③先週の結果 ④来週へ繰り越し。</p></div>`;
  h += `<button class="add-btn" data-act="add-week">＋ 今週をはじめる</button>`;
  if(!db.weeks.length){
    h += `<div class="empty">まだ週がありません。<br><b>「＋ 今週をはじめる」</b>で最初の週を作りましょう。<br>W1の目標例：<b>打診・声かけ 合計3件を送信</b></div>`;
  }
  h += `<div class="list">`;
  db.weeks.forEach((w,i)=>{
    const no = db.weeks.length - i; // 新しいものが上、番号は古い方がW1
    let acts='';
    (w.actions||[]).forEach((a,ai)=>{
      acts+=`<div class="act-row ${a.done?'done':''}" data-ai="${ai}">
        <button class="chk ${a.done?'on':''}" data-act="toggle-act"><svg viewBox="0 0 24 24" style="width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round"><path d="M5 12.5l4 4 10-10"/></svg></button>
        <input type="text" class="field-input" data-field="act" value="${esc(a.text)}" placeholder="行動（誰に・何を・いつ）">
        <button class="row-del" data-act="del-act" aria-label="削除">×</button>
      </div>`;
    });
    h+=`<div class="card entry" data-id="${w.id}">
      <div class="entry-head">
        <span class="badge">W${no}</span>
        <input type="date" data-field="date" value="${esc(w.date||'')}">
      </div>
      <div class="entry-body">
        <div class="field goal-field"><label>今週の数値目標（1つ）</label><textarea data-field="goal" rows="1" placeholder="例：ヒアリング1件を実施 / 見積1件を提示">${esc(w.goal||'')}</textarea></div>
        <div class="field"><label>具体行動</label><div class="acts">${acts}<button class="mini-add" data-act="add-act">＋ 行動を追加</button></div></div>
        <div class="field"><label>先週の結果（できた／できない＋なぜ）</label><textarea data-field="result" rows="1" placeholder="ふり返り">${esc(w.result||'')}</textarea></div>
        <div class="field"><label>来週への繰り越し</label><textarea data-field="carry" rows="1" placeholder="次に持ち越すこと">${esc(w.carry||'')}</textarea></div>
        <div class="field"><label>メモ</label><textarea data-field="memo" rows="1" placeholder="気づき・自由メモ">${esc(w.memo||'')}</textarea></div>
      </div>
      <div class="entry-foot"><button class="del-entry" data-act="del-week">この週を削除</button></div>
    </div>`;
  });
  h += `</div>`;
  view.innerHTML=h;
}

/* ---- 数値(KPI) ---- */
function renderKpi(){
  let h = `<div class="view-head"><h2>数値の記録</h2><p>月ごとに 月商・ヒアリング数・有料受注数 を入れて推移で見る。</p></div>`;
  const rows=[...db.kpis].sort((a,b)=>(a.month||'').localeCompare(b.month||''));
  if(rows.length){
    const metrics=[{k:'sales',lbl:'月商',unit:'万'},{k:'hearings',lbl:'ヒアリング',unit:'件'},{k:'orders',lbl:'有料受注',unit:'件'}];
    let tr='<div class="card trend"><h3>推移（古い→新しい）</h3>';
    metrics.forEach(m=>{
      const vals=rows.map(r=>Number(r[m.k])||0); const max=Math.max(1,...vals); const latest=vals[vals.length-1];
      let bars=''; vals.forEach((v,i)=>{ bars+=`<div class="bar ${i===vals.length-1?'last':''}" style="height:${Math.max(2,v/max*100)}%"></div>`; });
      tr+=`<div class="trend-row"><div class="trend-lbl">${m.lbl}<b class="tnum">${latest}<span style="font-size:.6em;color:var(--ink-soft)">${m.unit}</span></b></div><div class="bars">${bars}</div></div>`;
    });
    tr+='</div>'; h+=tr;
  }
  h += `<button class="add-btn" data-act="add-kpi">＋ 月を追加</button>`;
  if(!db.kpis.length){
    h += `<div class="empty">まだ記録がありません。<br><b>「＋ 月を追加」</b>で今月から記録を。</div>`;
  }
  h += `<div class="list">`;
  [...db.kpis].sort((a,b)=>(b.month||'').localeCompare(a.month||'')).forEach(k=>{
    h+=`<div class="card entry" data-id="${k.id}">
      <div class="entry-head"><span class="badge">月</span><input type="month" data-field="month" value="${esc(k.month||'')}"><button class="del-entry" data-act="del-kpi" style="margin-left:auto">削除</button></div>
      <div class="entry-body">
        <div class="kpi-grid">
          <div class="kpi-cell"><label>月商（万）</label><input type="text" inputmode="decimal" data-field="sales" value="${esc(k.sales||'')}"></div>
          <div class="kpi-cell"><label>ヒアリング</label><input type="text" inputmode="numeric" data-field="hearings" value="${esc(k.hearings||'')}"></div>
          <div class="kpi-cell"><label>有料受注</label><input type="text" inputmode="numeric" data-field="orders" value="${esc(k.orders||'')}"></div>
        </div>
        <div class="field"><label>メモ</label><textarea data-field="memo" rows="1" placeholder="その月の気づき">${esc(k.memo||'')}</textarea></div>
      </div>
    </div>`;
  });
  h += `</div>`;
  view.innerHTML=h;
}

/* ---- 見込み客 ---- */
function renderProspect(){
  let h = `<div class="view-head"><h2>見込み客</h2><p>相手・ステージ・提示額・次の一手・voice を1件ずつ。</p></div>`;
  h += `<button class="add-btn" data-act="add-prospect">＋ 見込み客</button>`;
  if(!db.prospects.length){
    h += `<div class="empty">まだ見込み客がいません。<br><b>「＋ 見込み客」</b>で最初の1件（例：知人のお店・事務所）を追加。</div>`;
  }
  h += `<div class="list">`;
  db.prospects.forEach(p=>{
    const stageOpts=STAGES.map(s=>`<option ${s===p.stage?'selected':''}>${s}</option>`).join('');
    const voiceOpts=VOICES.map(s=>`<option ${s===p.voice?'selected':''}>${s}</option>`).join('');
    const vtag = p.voice==='voice取得' ? 'background:var(--good-wash);color:var(--good)' : 'background:var(--surface-2);color:var(--ink-mid)';
    h+=`<div class="card entry" data-id="${p.id}">
      <div class="p-head">
        <input type="text" data-field="name" value="${esc(p.name||'')}" placeholder="お名前・会社名">
        <select class="stage-sel" data-field="stage">${stageOpts}</select>
      </div>
      <div class="p-body">
        <div class="p-2">
          <div class="field"><label>流入元</label><input type="text" data-field="source" value="${esc(p.source||'')}" placeholder="紹介 / 直接 など"></div>
          <div class="field"><label>提示額</label><input type="text" data-field="amount" value="${esc(p.amount||'')}" placeholder="例：5万 / 3万"></div>
        </div>
        <div class="field"><label>次の一手</label><input type="text" data-field="next" value="${esc(p.next||'')}" placeholder="例：打診メール送付"></div>
        <div class="field"><label>メモ</label><textarea data-field="memo" rows="1" placeholder="困りごと・決裁者・経緯">${esc(p.memo||'')}</textarea></div>
        <div style="display:flex;align-items:center;gap:10px">
          <span class="voice-tag" style="${vtag}">${esc(p.voice||'voice未')}</span>
          <select class="stage-sel" data-field="voice" style="color:var(--ink-mid)">${voiceOpts}</select>
          <button class="del-entry" data-act="del-prospect" style="margin-left:auto">削除</button>
        </div>
      </div>
    </div>`;
  });
  h += `</div>`;
  view.innerHTML=h;
}

/* ===================== 参照ヘルパ ===================== */
function weekOf(el){ const c=el.closest('.entry'); return db.weeks.find(w=>w.id===c.dataset.id); }
function kpiOf(el){ const c=el.closest('.entry'); return db.kpis.find(k=>k.id===c.dataset.id); }
function prospectOf(el){ const c=el.closest('.entry'); return db.prospects.find(p=>p.id===c.dataset.id); }

/* ===================== 入力（編集：再描画しない） ===================== */
view.addEventListener('input', e=>{
  const el=e.target; const f=el.dataset.field; if(!f) return;
  if(el.tagName==='TEXTAREA') autoGrow(el);
  // メーター
  const meterCard=el.closest('.meter');
  if(meterCard){
    const key=meterCard.dataset.key; const t=db.triggers[key];
    if(f==='current'){ let n=parseInt(el.value.replace(/[^0-9]/g,''),10); if(isNaN(n))n=0; t.current=Math.max(0,n); updateMeterVis(meterCard,key); }
    else if(f==='note'){ t.note=el.value; }
    save(); return;
  }
  // 週次
  if(el.closest('.entry') && tab==='week'){
    const w=weekOf(el); if(!w) return;
    if(f==='act'){ const ai=+el.closest('.act-row').dataset.ai; w.actions[ai].text=el.value; }
    else w[f]=el.value;
    save(); return;
  }
  // KPI
  if(el.closest('.entry') && tab==='kpi'){
    const k=kpiOf(el); if(!k) return; k[f]=el.value; save(); return;
  }
  // 見込み
  if(el.closest('.entry') && tab==='prospect'){
    const p=prospectOf(el); if(!p) return; p[f]=el.value; save(); return;
  }
});

view.addEventListener('change', e=>{
  const el=e.target; const f=el.dataset.field; if(!f) return;
  if(el.closest('.entry') && tab==='prospect'){
    const p=prospectOf(el); if(!p) return; p[f]=el.value; save(); render(); return;
  }
  if(el.closest('.entry') && (tab==='week'||tab==='kpi')){
    const obj = tab==='week'?weekOf(el):kpiOf(el); if(obj){ obj[f]=el.value; save(); }
  }
});

function updateMeterVis(card,key){
  const t=db.triggers[key]; const isDone=t.current>=t.target; const n=Math.min(t.target,10);
  card.classList.toggle('done',isDone);
  card.querySelector('.meter-val').innerHTML=`${t.current} <small>/ ${t.target}${esc(TRIGGERS.find(x=>x.key===key).unit)}</small>`;
  const blks=card.querySelectorAll('.blk');
  blks.forEach((b,i)=>{ const on=i<t.current; b.classList.toggle('on',on); b.classList.toggle('g',on&&isDone); });
  const dec=card.querySelector('[data-act=dec]'); if(dec) dec.disabled=t.current<=0;
}

/* ===================== クリック（ボタン） ===================== */
view.addEventListener('click', e=>{
  const btn=e.target.closest('[data-act]'); if(!btn) return;
  const act=btn.dataset.act;

  if(act==='inc'||act==='dec'){
    const card=btn.closest('.meter'); const key=card.dataset.key; const t=db.triggers[key];
    const was=t.current>=t.target;
    t.current=Math.max(0, t.current + (act==='inc'?1:-1));
    const input=card.querySelector('input[data-field=current]'); if(input) input.value=t.current;
    updateMeterVis(card,key); save();
    if(!was && t.current>=t.target){ toast(t.name+' 達成！'); renderMeter(); view.querySelectorAll('textarea').forEach(autoGrow); }
    return;
  }
  if(act==='add-week'){
    db.weeks.unshift({ id:uid(), date:todayISO(), goal:'', actions:[{text:'',done:false},{text:'',done:false},{text:'',done:false}], result:'', carry:'', memo:'' });
    save(); render(); view.scrollIntoView({behavior:'smooth',block:'start'}); return;
  }
  if(act==='del-week'){
    const w=weekOf(btn); const idx=db.weeks.indexOf(w); db.weeks.splice(idx,1); save(); render();
    undoToast('週を削除しました', ()=>{ db.weeks.splice(idx,0,w); save(); render(); }); return;
  }
  if(act==='toggle-act'){
    const w=weekOf(btn); const ai=+btn.closest('.act-row').dataset.ai; w.actions[ai].done=!w.actions[ai].done;
    btn.classList.toggle('on', w.actions[ai].done); btn.closest('.act-row').classList.toggle('done', w.actions[ai].done); save(); return;
  }
  if(act==='add-act'){ const w=weekOf(btn); w.actions.push({text:'',done:false}); save(); render(); return; }
  if(act==='del-act'){ const w=weekOf(btn); const ai=+btn.closest('.act-row').dataset.ai; w.actions.splice(ai,1); save(); render(); return; }

  if(act==='add-kpi'){
    if(db.kpis.some(k=>k.month===thisMonth())){ toast('今月はもうあります'); }
    db.kpis.unshift({ id:uid(), month:thisMonth(), sales:'', hearings:'', orders:'', memo:'' }); save(); render(); return;
  }
  if(act==='del-kpi'){ const k=kpiOf(btn); const idx=db.kpis.indexOf(k); db.kpis.splice(idx,1); save(); render(); undoToast('削除しました',()=>{db.kpis.splice(idx,0,k);save();render();}); return; }

  if(act==='add-prospect'){
    db.prospects.unshift({ id:uid(), name:'', source:'', stage:STAGES[0], amount:'', next:'', voice:VOICES[0], memo:'' }); save(); render(); return;
  }
  if(act==='del-prospect'){ const p=prospectOf(btn); const idx=db.prospects.indexOf(p); db.prospects.splice(idx,1); save(); render(); undoToast('削除しました',()=>{db.prospects.splice(idx,0,p);save();render();}); return; }
});

/* ===================== タブ ===================== */
document.getElementById('tabbar').addEventListener('click', e=>{
  const b=e.target.closest('.tab'); if(!b) return;
  tab=b.dataset.tab; localStorage.setItem('tsumiki_roadmap_tab', tab); render();
  window.scrollTo({top:0});
});

/* ===================== テーマ ===================== */
function applyTheme(t){ if(t) document.documentElement.setAttribute('data-theme',t); else document.documentElement.removeAttribute('data-theme');
  document.querySelector('meta[name=theme-color]');
}
(function initTheme(){ const saved=localStorage.getItem('tsumiki_roadmap_theme'); if(saved) applyTheme(saved); })();
document.getElementById('themeBtn').addEventListener('click', ()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const isDark = cur ? cur==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  const next = isDark?'light':'dark'; applyTheme(next); localStorage.setItem('tsumiki_roadmap_theme', next);
});

/* ===================== 起動 ===================== */
loadLocal();
render();
renderSync();
if(sb){ loadRemote(); subscribeRealtime(); }
</script>
<!-- tsumiki-back-button -->
<style>
  #tsumikiEdge{position:fixed; top:0; bottom:0; left:0; width:22px; z-index:999;}
  #tsumikiPeek{
    position:fixed; top:50%; left:0; z-index:1001; margin-top:-23px;
    width:46px; height:46px; display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.92);
    -webkit-backdrop-filter:saturate(180%) blur(14px); backdrop-filter:saturate(180%) blur(14px);
    border:1px solid rgba(0,0,0,.06); border-radius:50%;
    box-shadow:0 6px 20px rgba(0,0,0,.18);
    color:#0071e3; font-size:24px; font-weight:600; line-height:1;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Helvetica Neue",Arial,sans-serif;
    transform:translateX(-70px) scale(.8); opacity:0; pointer-events:none;
  }
</style>
<div id="tsumikiEdge"></div>
<div id="tsumikiPeek">‹</div>
<script>
  (function(){
    var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
      || window.navigator.standalone === true;
    var fromTsumiki = false;
    try{
      if(document.referrer){
        var r = new URL(document.referrer);
        fromTsumiki = (r.origin === location.origin);
      }
    }catch(e){}
    if(!(standalone && fromTsumiki)) return;

    var peek = document.getElementById('tsumikiPeek');
    var edge = document.getElementById('tsumikiEdge');

    function goBack(){ location.href = 'index.html'; }

    /* --- 左端エッジスワイプで戻る（iOS純正の戻る操作。見えるボタンは置かない） --- */
    var sx=0, sy=0, prog=0, dragging=false, W=window.innerWidth;
    var TRIGGER = Math.min(120, W*0.32);
    window.addEventListener('resize', function(){ W=window.innerWidth; TRIGGER=Math.min(120, W*0.32); });

    function reset(){
      dragging = false; prog = 0;
      peek.style.transition = 'transform .25s ease, opacity .25s ease';
      peek.style.transform = 'translateX(-70px) scale(.8)';
      peek.style.opacity = 0;
    }
    function start(e){
      var t = e.touches ? e.touches[0] : e;
      if(t.clientX > 26) return;
      sx = t.clientX; sy = t.clientY; prog = 0; dragging = true;
      peek.style.transition = 'none';
    }
    function move(e){
      if(!dragging) return;
      var t = e.touches ? e.touches[0] : e;
      var dx = t.clientX - sx, dy = t.clientY - sy;
      if(Math.abs(dy) > Math.abs(dx) + 12){ reset(); return; }
      if(dx < 0) dx = 0;
      prog = Math.min(dx / TRIGGER, 1);
      peek.style.transform = 'translateX(' + (-70 + prog*82) + 'px) scale(' + (0.8 + prog*0.2) + ')';
      peek.style.opacity = prog;
      if(dx > 6 && e.cancelable) e.preventDefault();
    }
    function end(){
      if(!dragging) return;
      dragging = false;
      if(prog >= 0.999){
        peek.style.transition = 'transform .25s ease, opacity .25s ease';
        peek.style.transform = 'translateX(20px) scale(1.05)';
        peek.style.opacity = 1;
        goBack();
      }else{
        reset();
      }
    }
    edge.addEventListener('touchstart', start, {passive:true});
    window.addEventListener('touchmove', move, {passive:false});
    window.addEventListener('touchend', end, {passive:true});
    window.addEventListener('touchcancel', end, {passive:true});
  })();
</script>
<!-- /tsumiki-back-button -->
</body>
</html>
