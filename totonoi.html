<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="apple-touch-icon" href="icons/icon-totonoi.png">
<meta name="apple-mobile-web-app-title" content="ととのい">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>ととのい — サウナの写真に、心拍の記録を重ねる</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=Inter:wght@600;800&family=Montserrat:wght@600;800&family=Oswald:wght@500;700&family=Barlow+Condensed:wght@600;800&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f5f4f0; --surface:#fffefb; --surface-2:#efece5;
    --ink:#1d1a15; --ink-mid:#5b554a; --ink-soft:#666154; --ghost:#887f70;
    --line:#e2ded4; --line-2:#d8d3c7;
    --accent:#b06f26; --accent-2:#8a5a24; --accent-wash:#f0e4d1;
    --warn-wash:#f2e0d4; --warn-ink:#974624;
    --btn-bg:var(--accent-2); --btn-ink:var(--paper);
    --shadow:0 1px 2px rgba(40,32,18,.05), 0 10px 26px -16px rgba(40,32,18,.18);
    /* 心拍の色分け（低い→高い）。書き出す画像の中だけで使う色で、画面には使わない。
       帳面の「グラデーションを使わない」の例外（写真の上の線と下の帯は Strava の見た目に合わせる） */
    --hr-1:#4c9be8; --hr-2:#3cc4a0; --hr-3:#f2c84b; --hr-4:#fc8a2c; --hr-5:#f2453d;
    --ph-a:#2b2619; --ph-b:#0f0d07;   /* 写真を入れる前の下地（夜の帳面の色・白い字が読める）*/
    --quick:120ms; --ease:cubic-bezier(0.2,0,0,1);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#0f0d07; --surface:#211d14; --surface-2:#2b2619;
      --ink:#efe8da; --ink-mid:#a89e8b; --ink-soft:#9f988a;
      --line:#36301f; --line-2:#443d2b;
      --accent:#d59a4d; --accent-2:#e0ab63; --accent-wash:#362a19;
      --warn-wash:#39251a; --warn-ink:#d9825a;
      --btn-bg:#d59a4d; --btn-ink:#1d1a15;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 30px -18px rgba(0,0,0,.65);
    }
  }
  @media (prefers-reduced-motion: reduce){ :root{ --quick:0ms; } }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
    background:var(--paper); color:var(--ink); line-height:1.6; min-height:100dvh;
    -webkit-font-smoothing:antialiased;
  }
  button,input{font-family:inherit;color:inherit}
  svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

  .wrap{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 32px)}
  header{display:flex;align-items:center;gap:8px;min-height:44px;margin-bottom:8px}
  header h1{font-size:20px;font-weight:700;margin:0;letter-spacing:.04em}
  header svg.i{color:var(--accent-2)}
  header .icon{margin-left:auto;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:0;border-radius:12px;background:none;cursor:pointer}
  header .icon svg.i{color:var(--ink-mid)}
  header .icon:active{background:var(--surface-2)}

  .stage{display:flex;justify-content:center}
  .pv{position:relative;width:min(100%, calc(64dvh * 9 / 16));aspect-ratio:9/16;border-radius:20px;overflow:hidden;
      background:var(--surface-2);box-shadow:var(--shadow);touch-action:pan-y}
  .pv.has-photo{touch-action:none;cursor:grab}
  .stack{display:flex;flex-direction:column;align-items:center;width:100%}
  .dots{display:flex;justify-content:center;gap:6px;margin-top:10px}
  .dots i{width:6px;height:6px;border-radius:50%;background:var(--line-2);transition:background var(--quick) var(--ease)}
  .dots i.on{background:var(--accent)}
  .pv canvas{display:block;width:100%;height:100%}

  .panel{margin-top:16px;display:flex;flex-direction:column;gap:16px}
  .picks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .pick{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:8px 12px;
        background:var(--surface);border:1px solid var(--line);border-radius:12px;font-size:15px;font-weight:500;cursor:pointer;
        transition:background var(--quick) var(--ease)}
  .pick:active{background:var(--surface-2)}
  .pick input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:16px}
  .pick .dot{width:8px;height:8px;border-radius:50%;background:var(--line-2)}
  .pick.ok .dot{background:var(--accent)}
  .pick.busy .dot{background:var(--accent);animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:.25}}

  .fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .f{display:flex;flex-direction:column;gap:4px;min-width:0}
  .f.wide{grid-column:1/-1}
  .f span{font-size:13px;color:var(--ink-mid);display:flex;align-items:center;gap:4px}
  .f span svg.i{width:16px;height:16px}
  .f input{width:100%;min-width:0;height:44px;padding:0 12px;font-size:16px;background:var(--surface);
           border:1px solid var(--line);border-radius:12px;outline:none}
  .f input:focus{border-color:var(--accent)}

  .seg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
  .seg.two{grid-template-columns:repeat(2,minmax(0,1fr))}
  .seg.two button{flex-direction:row;justify-content:center;min-height:48px;font-size:14px}
  .seg.two button svg{width:32px;height:22px}
  .seg.six{grid-template-columns:repeat(3,minmax(0,1fr))}
  .seg.six button{min-height:48px;font-size:18px;color:var(--ink)}
  .seg button{display:flex;flex-direction:column;align-items:center;gap:4px;min-height:64px;padding:8px 2px;font-size:13px;white-space:nowrap;
              background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;color:var(--ink-mid);
              transition:background var(--quick) var(--ease)}
  .seg button svg{width:22px;height:32px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .seg button[aria-pressed="true"]{background:var(--accent-wash);border-color:var(--accent);color:var(--accent-2)}

  .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:12px;border:0;
       font-size:15px;font-weight:700;white-space:nowrap;cursor:pointer;transition:opacity var(--quick) var(--ease)}
  .btn.main{background:var(--btn-bg);color:var(--btn-ink)}
  .btn.quiet{background:var(--surface-2);color:var(--ink)}
  .btn:disabled{opacity:.45;cursor:default}

  .note{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 12px;border-radius:8px;background:var(--warn-wash);color:var(--warn-ink);font-size:14px}
  .note[hidden]{display:none}
  .note{flex-wrap:wrap}
  .note span{flex:1 1 100%;min-width:0}
  .note button{flex:1 1 0}
  .note button{min-height:44px;padding:0 12px;border:0;border-radius:12px;background:var(--surface);color:var(--ink);font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translateX(-50%);
         max-width:calc(100% - 32px);padding:10px 16px;border-radius:12px;background:var(--ink);color:var(--paper);
         font-size:14px;opacity:0;pointer-events:none;transition:opacity 200ms var(--ease);z-index:50}
  .toast.on{opacity:1}

  /* 見た目・書体・線は、スクロールしなくても選べるよう画面の下に貼りつける（広い画面では右の列にそのまま置く） */
  .tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;border-radius:12px;background:var(--surface-2)}
  .tabs button{min-height:44px;border:0;border-radius:9px;background:none;font-size:14px;font-weight:700;color:var(--ink-mid);cursor:pointer}
  .tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
  .tools{display:flex;flex-direction:column;gap:8px}
  .tools [role="tabpanel"][hidden]{display:none}
  .tools .seg button{min-height:48px;padding:4px 2px}
  .tools #seg{grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
  .tools #seg button{gap:2px;font-size:12px;line-height:1.2}
  .tools #seg button svg{width:12px;height:18px}
  .tools .seg.six{grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
  .tools .seg.six button{font-size:15px}
  @media (max-width:899px) and (min-height:500px){
    .tools{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,520px);z-index:5;
           padding:10px 16px calc(env(safe-area-inset-bottom) + 12px);background:var(--paper);border-radius:20px 20px 0 0;box-shadow:0 -6px 20px rgba(0,0,0,.10)}
    .wrap{padding-bottom:calc(env(safe-area-inset-bottom) + 220px)}
    .pv{width:min(100%, calc(min(64dvh, 100dvh - 345px - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * 9 / 16))}
    .toast{bottom:calc(env(safe-area-inset-bottom) + 205px)}
    body:has(.fields input:focus) .tools{display:none}   /* 打っている間はキーボードの上に出さない */
    body:has(#note:not([hidden])) .tools{display:none}   /* 読み取りの確認や「元に戻す」をバーで隠さない */
  }
  @media (min-width:900px){
    .wrap{max-width:960px;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:32px;align-items:start}
    header{grid-column:1/-1}
    .pv{width:min(100%, calc(78dvh * 9 / 16))}
    .panel{margin-top:0}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4c-1 1.3 1 2.4 0 3.8M12 4c-1 1.3 1 2.4 0 3.8M16 4c-1 1.3 1 2.4 0 3.8"/><path d="M4 11h16v8a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/><path d="M4 15h16"/></svg>

    <button type="button" class="icon" id="btnNew" aria-label="新しく始める（写真・線・数字を消す）"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/></svg></button>

    <div class="picks">

        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2-5 3 10 2-5h7"/></svg>

      </div>
      <div class="seg" id="seg" role="tabpanel" aria-labelledby="tab0">
        <button type="button" data-l="row" aria-pressed="true"><svg viewBox="0 0 22 32" aria-hidden="true"><rect x="1" y="1" width="20" height="30" rx="3"/><path d="M5 20c2-3 3 1 5-1s3 1 7-1"/><path d="M5 25h3M10 25h2M14 25h3"/></svg>横一列</button>
        <button type="button" data-l="col" aria-pressed="false"><svg viewBox="0 0 22 32" aria-hidden="true"><rect x="1" y="1" width="20" height="30" rx="3"/><path d="M8 6h6M8 10h6M8 14h6"/><path d="M5 20c2-3 3 1 5-1s3 1 7-1"/></svg>縦</button>
        <button type="button" data-l="band" aria-pressed="false"><svg viewBox="0 0 22 32" aria-hidden="true"><rect x="1" y="1" width="20" height="30" rx="3"/><path d="M1 19h20"/><path d="M4 23c2-2 3 1 5-1s3 1 9-1"/><path d="M4 27h4M10 27h3M15 27h3"/></svg>帯</button>
        <button type="button" data-l="line" aria-pressed="false"><svg viewBox="0 0 22 32" aria-hidden="true"><rect x="1" y="1" width="20" height="30" rx="3"/><path d="M4 17l3-1 2-5 3 10 2-6 2 2h2"/></svg>線</button>

        <button type="button" data-l="frame" aria-pressed="false"><svg viewBox="0 0 22 32" aria-hidden="true"><rect x="1" y="1" width="20" height="30" rx="3"/><rect x="4" y="4" width="14" height="17"/><path d="M5 25h4M11 25h3"/></svg>フチ</button>
        <button type="button" data-l="ticket" aria-pressed="false"><svg viewBox="0 0 22 32" aria-hidden="true"><rect x="1" y="1" width="20" height="30" rx="3"/><path d="M6 7h10"/><path d="M6 11h3M13 11h3M6 15h3M13 15h3"/></svg>チケット</button>
        <button type="button" data-l="annot" aria-pressed="false"><svg viewBox="0 0 22 32" aria-hidden="true"><rect x="1" y="1" width="20" height="30" rx="3"/><path d="M4 19l3-1 2-6 3 10 2-6 2 2h2"/><circle cx="9" cy="12" r="1.4"/></svg>書き込み</button>

      <div class="seg six" id="segF" role="tabpanel" aria-labelledby="tab1">

      </div>

    <div class="acts">
      <button class="btn main" id="btnShare" type="button"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M8 8l4-4 4 4"/><path d="M6 12H5v8h14v-8h-1"/></svg>保存</button>
      <button class="btn quiet" id="btnSticker" type="button"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v9l-6 7H5z"/><path d="M13 20v-5a2 2 0 0 1 2-2h4"/></svg>ステッカー</button>
    </div>

</div>
<div class="toast" id="toast" role="status"></div>

<script>
const $ = id => document.getElementById(id);
const W = 1080, H = 1920;
const LINE = '#fc5200';           // 心拍の線（Strava のコースの線と同じ橙）
const S = { photo:null, pan:{x:.5,y:.5}, curve:null, layout:'row', color:'mono', font:'inter' };
const LAYOUTS = ['row','col','band','line','corner','card','line1','frame','ticket','annot'];
const store = {
  get(k,d){ try{ const v = localStorage.getItem('totonoi.'+k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem('totonoi.'+k, JSON.stringify(v)); }catch(e){} }
};

/* 写真・線・数字は、開き直しても戻るようにこの端末の中に残す（写真は大きいので IndexedDB） */
const idb = {
  open(){ return this.p || (this.p = new Promise((res,rej)=>{ const r=indexedDB.open('totonoi',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); })
    .catch(e=>{ this.p=null; throw e; })); },
  async get(k){ try{ const d=await this.open(); return await new Promise(res=>{ const q=d.transaction('kv').objectStore('kv').get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>res(undefined); }); }catch(e){ return undefined; } },
  async set(k,v){ try{ const d=await this.open(), tx=d.transaction('kv','readwrite'); tx.objectStore('kv').put(v,k);
    tx.onerror=tx.onabort=()=>idb.warn(); }catch(e){ idb.warn(); } },
  warn(){ if(!this.warned){ this.warned=true; toast('この端末に残せませんでした'); } }
};
/* 書き出した画像の「指紋」＝32×32 に縮めた明るさ。選ばれた画像と比べて、ととのいの書き出しかを見分ける
   （縮めて保存し直された画像やステッカーにも当たり、ほかのアプリの 1080×1920 には当たらない） */
function fprint(src){
  const w=src.naturalWidth||src.width, h=src.naturalHeight||src.height;
  // 一気に縮めると数点を拾うだけになるので、半分ずつ縮めてから 32×32 のマスごとに平均する（細い字も拾える細かさ）
  let cur=src, cw=w, ch=h;
  while(cw>512 || ch>512){
    const n=document.createElement('canvas'); n.width=Math.max(128,Math.round(cw/2)); n.height=Math.max(128,Math.round(ch/2));
    const ng=n.getContext('2d'); ng.fillStyle='rgb(0,0,0)'; ng.fillRect(0,0,n.width,n.height); ng.imageSmoothingQuality='high';
    ng.drawImage(cur,0,0,n.width,n.height); cur=n; cw=n.width; ch=n.height;
  }
  const S2=128, c=document.createElement('canvas'); c.width=c.height=S2; const g=c.getContext('2d',{willReadFrequently:true});
  g.fillStyle='rgb(0,0,0)'; g.fillRect(0,0,S2,S2); g.imageSmoothingQuality='high'; g.drawImage(cur,0,0,S2,S2);
  const d=g.getImageData(0,0,S2,S2).data, a=new Array(1024).fill(0), q=S2/32;
  for(let y=0;y<S2;y++) for(let x=0;x<S2;x++){ const k=(y*S2+x)*4; a[(y/q|0)*32+(x/q|0)] += (d[k]+d[k+1]+d[k+2])/3; }
  return { r:w/h, a:a.map(v=>Math.round(v/(q*q))) };
}
const fpDiff=(a,b)=>a.reduce((s,v,i)=>s+Math.abs(v-b[i]),0)/a.length;
/* 書き出し（e）と、同じ写真を数字なしで描いた物（b）を組で覚える。ステッカーの b は黒一色 */
function pairOf(exp, base){
  const e=fprint(exp), b=base ? fprint(base) : { r:e.r, a:new Array(e.a.length).fill(0) };
  return {e,b};
}
/* ステッカーは写真アプリで白地に平らにされることもあるので、黒地と白地の2組を作る */
function stickerPairs(cv){
  const white=document.createElement('canvas'); white.width=cv.width; white.height=cv.height;
  const g=white.getContext('2d'); g.fillStyle='rgb(255,255,255)'; g.fillRect(0,0,cv.width,cv.height); g.drawImage(cv,0,0);
  const w=pairOf(white, null); w.b.a=w.b.a.map(()=>255);
  return [pairOf(cv, null), w];
}
function remember(pairs){
  let list=store.get('fps',[]).filter(x=>x && x.e);
  pairs.forEach(p=>{ list=[p, ...list.filter(x=>!(Math.abs(x.e.r-p.e.r)<.02 && fpDiff(x.e.a,p.e.a)<2))]; });   // 同じ書き出しは重ねない
  store.set('fps', list.slice(0,30));
}
function photoOnly(){ const c=document.createElement('canvas'); c.width=W; c.height=H; paintPhoto(c.getContext('2d')); return c; }
/* 選ばれた画像が、数字を描いたマスで「書き出し」と「元の写真」のどちらに近いかで決める。
   元の写真を選び直したときは必ず元の写真の側に寄るので、明るい写真や字の少ないデザインでも取り違えない */
function isOurs(im){
  const r=im.naturalWidth/im.naturalHeight, list=store.get('fps',[]);
  if(!list.some(x=>x && x.e && Math.abs(x.e.r-r)<.02)) return false;   // 縦横比の合う書き出しが無ければ、重い指紋は取らない
  const f=fprint(im);
  return list.some(x=>{
    if(!x || !x.e || !x.b || Math.abs(x.e.r-f.r)>=.02 || x.e.a.length!==f.a.length) return false;
    if(fpDiff(x.e.a,f.a) > 12) return false;
    const mask=[]; x.e.a.forEach((v,i)=>{ if(Math.abs(v-x.b.a[i])>8) mask.push(i); });
    if(mask.length<3) return false;
    const near=mask.filter(i=>Math.abs(f.a[i]-x.e.a[i]) < Math.abs(f.a[i]-x.b.a[i])).length;
    return near/mask.length >= .8;
  });
}

function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove('on'),2400); }

/* ---------- 画像を読む ---------- */
function loadImage(file){
  return new Promise((res,rej)=>{ const u=URL.createObjectURL(file), im=new Image();
    im.onload=()=>{ URL.revokeObjectURL(u); res(im); }; im.onerror=e=>{ URL.revokeObjectURL(u); rej(e); }; im.src=u; });
}

/* Zepp Life のスクショから心拍の線・数字を拾う */
function pixels(im){
  const c=document.createElement('canvas'); c.width=im.naturalWidth; c.height=im.naturalHeight;
  const g=c.getContext('2d',{willReadFrequently:true}); g.drawImage(im,0,0);
  return { c, g, w:c.width, h:c.height, d:g.getImageData(0,0,c.width,c.height).data };
}
const isRed = (d,k) => d[k]>190 && d[k+1]<130 && d[k+2]<130;

function findCurve(P){
  const {w,h,d}=P;
  // 行ごとに赤い点の左端・右端を見て、横に長く続く帯＝グラフを探す
  const span=new Array(h);
  for(let y=0;y<h;y++){ let a=-1,b=-1;
    for(let x=0;x<w;x++){ if(isRed(d,(y*w+x)*4)){ if(a<0)a=x; b=x; } }
    span[y]=a<0?null:[a,b]; }
  let best=null;
  for(let y=0;y<h;){
    if(!span[y]){ y++; continue; }
    let y2=y, x0=span[y][0], x1=span[y][1];
    while(y2+1<h && (span[y2+1] || (span[y2+2]&&y2+2<h))){ y2++; if(span[y2]){ x0=Math.min(x0,span[y2][0]); x1=Math.max(x1,span[y2][1]); } }
    // 左右の端だけ赤い（ロゴとQRの色など）帯を除くため、赤のある列の数で比べる
    let cols=0; for(let x=x0;x<=x1;x++){ for(let yy=y;yy<=y2;yy++){ if(isRed(d,(yy*w+x)*4)){ cols++; break; } } }
    if(cols > w*.4 && (!best || cols > best.cols)) best={y0:y,y1:y2,x0,x1,cols};
    y=y2+1;
  }
  if(!best) return null;
  const pts=[];
  for(let x=best.x0;x<=best.x1;x++){ let s=0,n=0;
    for(let y=best.y0;y<=best.y1;y++){ if(isRed(d,(y*w+x)*4)){ s+=y; n++; } }
    if(n) pts.push([x, s/n]); }
  return {...best, pts};
}

function crop(P,x,y,cw,ch,scale){
  const c=document.createElement('canvas'); c.width=Math.round(cw*scale); c.height=Math.round(ch*scale);
  const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height);
  g.imageSmoothingQuality='high'; g.drawImage(P.c,x,y,cw,ch,0,0,c.width,c.height);
  return c;
}

/* 濃い背景の帯（見出し）の下にある、最初の文字の行＝「時間・平均・最大」の数字 */
function findStatsBand(P, stopY){
  const {w,d}=P, bright=y=>{ let s=0; for(let x=0;x<w;x+=4){ const k=(y*w+x)*4; s+=d[k]+d[k+1]+d[k+2]; } return s/(3*Math.ceil(w/4)); };
  let y=0; while(y<stopY && bright(y)>150) y++;           // 上の白い余白を飛ばす
  while(y<stopY && bright(y)<150) y++;                     // 濃い見出しの帯を抜ける
  const ink=y=>{ let n=0; for(let x=0;x<w;x+=2){ const k=(y*w+x)*4; if(d[k]+d[k+1]+d[k+2]<200) n++; } return n; };
  while(y<stopY && ink(y)===0) y++;
  const top=y; while(y<stopY && ink(y)>0) y++;
  return y>top ? {y0:top,y1:y} : null;
}

let workerP=null;
const limit=(p,ms)=>Promise.race([p, new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms))]);
function getWorker(){
  if(!workerP) workerP=Tesseract.createWorker('eng').catch(e=>{ workerP=null; throw e; });
  return workerP;
}
async function ocr(canvas, chars){
  if(!window.Tesseract) throw new Error('ocr');
  let w;
  try{ w=await limit(getWorker(), 30000); }catch(e){ workerP=null; throw e; }   // 回線が止まったら次は作り直す
  await w.setParameters({ tessedit_char_whitelist: chars, tessedit_pageseg_mode: '11' });
  const r = await limit(w.recognize(canvas), 20000);
  return r.data.words.map(o=>({t:o.text, x:o.bbox.x0, y:(o.bbox.y0+o.bbox.y1)/2}));
}

const okBpm=v=>v>=30 && v<=230;

async function readRecord(file, im0){
  const im=im0 || await loadImage(file), P=pixels(im), out={};
  S.curve=null;                                            // 前の記録の線を残さない
  const cv=findCurve(P);
  if(cv){
    // 曲線の向きだけ先に描けるように 0..1 で持つ（上＝高い心拍）
    const ys=cv.pts.map(p=>p[1]), lo=Math.min(...ys), hi=Math.max(...ys);
    S.curve=cv.pts.map(p=>[(p[0]-cv.x0)/(cv.x1-cv.x0), hi-lo<2 ? .5 : (p[1]-lo)/(hi-lo)]);   // 平らな記録は真ん中に
    draw();
  }
  const sb=findStatsBand(P, cv ? cv.y0 : P.h);
  if(sb){
    const pad=Math.round((sb.y1-sb.y0)*.3);
    const words=(await ocr(crop(P,0,sb.y0-pad,P.w,sb.y1-sb.y0+pad*2,2),'0123456789:')).sort((a,b)=>a.x-b.x);
    const t=words.find(o=>/^\d{1,3}:\d{2}(:\d{2})?$/.test(o.t));
    // 「時間・平均・最大」の3つが並んでいるときだけ、右端を最大心拍数として使う
    const ints=words.filter(o=>/^\d{1,3}$/.test(o.t));   // 平均は「9」のように欠けて読めることがある
    if(t) out.time=t.t;
    if(t && ints.length===2 && ints[1].x > P.w*2*.6 && okBpm(+ints[1].t)) out.max=+ints[1].t;
  }
  if(cv){
    // 左の目盛り（170・142…）を読んで、線のいちばん低いところを心拍に直す
    const m=Math.round(P.w*.06), x1=Math.max(10,cv.x0-4), yA=Math.max(0,cv.y0-m), yB=Math.min(P.h,cv.y1+Math.round(m*.5));
    const ticks=(await ocr(crop(P,0,yA,x1,yB-yA,3),'0123456789'))
      .filter(o=>/^\d{2,3}$/.test(o.t) && +o.t>=30 && +o.t<=230)
      .map(o=>({v:+o.t, y:yA+o.y/3})).sort((a,b)=>a.y-b.y);
    // 目盛りが3つ以上あり、どれも1本の直線に乗るときだけ信じる（1つ読み違えたら使わない）
    if(ticks.length>=3){
      const a=ticks[0], b=ticks[ticks.length-1];
      const toBpm=y=>a.v+(y-a.y)*(b.v-a.v)/(b.y-a.y);
      if(b.v<a.v && ticks.every(k=>Math.abs(toBpm(k.y)-k.v)<=3)){
        const ys=cv.pts.map(p=>p[1]);
        const lo=Math.round(toBpm(Math.max(...ys))), hi=Math.round(toBpm(Math.min(...ys)));
        if(!out.max && okBpm(hi)) out.max=hi;
        if(okBpm(lo) && (!out.max || lo<out.max)) out.min=lo;
      }
    }
  }
  return out;
}

/* ---------- 描く ---------- */
/* 数字の書体（l＝Time などの小見出しの太さ・v＝数字と TOTONOI の太さ）。どれも読めなければ下の予備で描く */
const FONTS = {
  inter:{f:'"Inter"', l:600, v:800}, mont:{f:'"Montserrat"', l:600, v:800}, oswald:{f:'"Oswald"', l:500, v:700},
  barlow:{f:'"Barlow Condensed"', l:600, v:800}, mono:{f:'"Roboto Mono"', l:500, v:700}, maru:{f:'"Zen Maru Gothic"', l:500, v:900}
};
const NF = () => { const o=FONTS[S.font]||FONTS.inter; return {f:o.f+', "Helvetica Neue", Arial, sans-serif', l:o.l, v:o.v}; };
const loadFont = k => { const o=FONTS[k]; return Promise.all([document.fonts.load(`${o.v} 80px ${o.f}`,'0123456789:bpmTOIN'), document.fonts.load(`${o.l} 32px ${o.f}`,'TimeMaxMin')]); };
const F = { jp:'"Zen Maru Gothic", "Hiragino Maru Gothic ProN", sans-serif' };
const val = () => ({ name:$('fName').value.trim(), time:$('fTime').value.trim(), max:$('fMax').value.trim(), min:$('fMin').value.trim() });

function shadowOn(g){ g.shadowColor='rgba(0,0,0,.35)'; g.shadowBlur=14; g.shadowOffsetY=2; }

function text(g, s, x, y, font, align){ g.font=font; g.textAlign=align||'center'; g.textBaseline='alphabetic'; g.fillStyle='#fff'; g.fillText(s,x,y); }
/* 幅に収まるまで字を小さくする（横につぶさない） */
function fitText(g, s, x, y, weight, size, family, maxW){
  let z=size; g.font=`${weight} ${z}px ${family}`;
  const w=g.measureText(s).width; if(w>maxW) z=Math.floor(size*maxW/w);
  text(g, s, x, y, `${weight} ${z}px ${family}`);
}

function hrColors(){ const cs=getComputedStyle(document.documentElement); return [1,2,3,4,5].map(n=>cs.getPropertyValue('--hr-'+n).trim() || LINE); }

/* 心拍の線を (x0,y) から幅 w・高さ h に描く。fill＝下を薄く塗って白い線にする */
function drawCurve(g, x0, y, w, h, fill, lw){
  if(!S.curve) return;
  const pad=10, path=()=>{ g.beginPath(); S.curve.forEach((p,i)=>{ const X=x0+p[0]*w, Y=y+pad+p[1]*(h-pad*2); i?g.lineTo(X,Y):g.moveTo(X,Y); }); };
  g.save(); path();
  g.lineJoin='round'; g.lineCap='round'; g.lineWidth=lw || (fill?7:9);
  const hr=S.color==='hr' ? hrColors() : null;
  if(fill){ const sc=g.shadowColor; g.shadowColor='transparent'; g.lineTo(x0+w,y+h); g.lineTo(x0,y+h); g.closePath(); g.fillStyle='rgba(255,255,255,.18)'; g.fill(); g.shadowColor=sc; path(); }
  if(hr){
    // StatMaps のように、心拍の高さで線の色を変える（上＝高い心拍＝赤、下＝低い心拍＝青）
    //   線の高さ＝心拍なので、縦のグラデーション1本で塗れば点ごとの色分けと同じになる（1本で描くので軽い）
    const gr=g.createLinearGradient(0,y+pad,0,y+h-pad);
    [...hr].reverse().forEach((c,i)=>gr.addColorStop(i/4,c));
    g.strokeStyle=gr; g.stroke();
  }else{ g.strokeStyle=fill?'#fff':LINE; g.stroke(); }
  g.restore();
}
function curveBlock(w,h,fill){ return { h, draw(g,y){ drawCurve(g,(W-w)/2,y,w,h,fill); } }; }
const gap = h => ({h, draw(){}});
const label = (s,size) => ({h:size*1.25, draw(g,y){ { const n=NF(); text(g,s,W/2,y+size,`${n.l} ${size}px ${n.f}`); } }});
const value = (s,size) => ({h:size*1.08, draw(g,y){ { const n=NF(); fitText(g,s,W/2,y+size*.92,n.v,size,n.f,960); } }});
const nameB = (s,size) => ({h:size*1.4, draw(g,y){ fitText(g,s,W/2,y+size*1.05,700,size,F.jp,960); }});
const mark = size => ({h:size*1.3, draw(g,y){ g.save(); const n=NF(); g.font=`${n.v} ${size}px ${n.f}`; g.letterSpacing=(size*.12)+'px'; text(g,'TOTONOI',W/2+size*.06,y+size,g.font); g.restore(); }});
function rowB(items, lab, num){
  const cols=items.length, cw=Math.min(240, 900/cols);
  return { h:lab*1.25+num*1.1, draw(g,y){
    // 長い Time だけ縮むとばらついて見えるので、いちばん長い数字に合わせて全部同じ大きさにする
    const n=NF(); g.font=`${n.v} ${num}px ${n.f}`;
    const z=Math.min(num, ...items.map(it=>Math.floor(num*(cw-16)/g.measureText(it[1]).width)));
    items.forEach((it,i)=>{ const x=W/2+(i-(cols-1)/2)*cw;
      text(g,it[0],x,y+lab,`${n.l} ${lab}px ${n.f}`); text(g,it[1],x,y+lab*1.25+num*.92,`${n.v} ${z}px ${n.f}`); }); } };
}

function blocks(v, layout){
  const stats=[['Time',v.time],['Max',v.max],['Min',v.min]].filter(s=>s[1]);
  const B=[];
  if(layout==='row'){
    if(v.name) B.push(nameB(v.name,46), gap(18));
    if(S.curve) B.push(curveBlock(780,190), gap(30));
    if(stats.length) B.push(rowB(stats,32,64), gap(28));
    B.push(mark(30));
  }else if(layout==='col'){
    if(v.name) B.push(nameB(v.name,36), gap(18));
    stats.forEach(s=>B.push(label(s[0],24), value(s[0]==='Time'?s[1]:s[1]+' bpm',52), gap(18)));
    if(S.curve) B.push(gap(8), curveBlock(440,200), gap(30));
    B.push(mark(32));
  }else if(layout==='band'){
    if(S.curve) B.push(curveBlock(940,220), gap(34));
    if(stats.length) B.push(rowB(stats,30,70), gap(24));
    if(v.name) B.push(nameB(v.name,40), gap(10));
    B.push(mark(26));
  }else if(layout==='line'){
    if(S.curve) B.push(curveBlock(940,420), gap(40));
    if(stats.length) B.push(rowB(stats,28,56), gap(20));
    if(v.name) B.push(nameB(v.name,36), gap(8));
    B.push(mark(26));
  }
  return B;
}
const tops = { row:null, col:200, band:null, line:'mid' };

function paintStack(g, B, top){
  shadowOn(g); let y=top; B.forEach(b=>{ b.draw(g,y); y+=b.h; }); g.shadowColor='transparent';
}

/* 写真を描く枠（フチだけ白い余白の内側） */
const photoBox = () => S.layout==='frame' ? {x:56, y:56, w:W-112, h:1500} : {x:0, y:0, w:W, h:H};
function paintPhoto(g, x=0, y=0, w=W, h=H){
  g.save(); g.beginPath(); g.rect(x,y,w,h); g.clip();
  if(!S.photo){
    const gr=g.createLinearGradient(0,y,0,y+h); const cs=getComputedStyle(document.documentElement); gr.addColorStop(0,cs.getPropertyValue('--ph-a')); gr.addColorStop(1,cs.getPropertyValue('--ph-b'));
    g.fillStyle=gr; g.fillRect(x,y,w,h);
  }else{
    const im=S.photo, s=Math.max(w/im.naturalWidth, h/im.naturalHeight), dw=im.naturalWidth*s, dh=im.naturalHeight*s;
    g.drawImage(im, x+(w-dw)*S.pan.x, y+(h-dh)*S.pan.y, dw, dh);
  }
  g.restore();
}

/* ---------- 文字を好きな位置に置く見た目（四隅・カード・1行・フチ・チケット・書き込み） ----------
   st＝ステッカー用（写真も暗い下地も描かず、透明の上に字と線だけ） */
function T(g, s, x, y, weight, size, opt={}){
  const fam=opt.jp ? F.jp : NF().f; let z=size; g.save();
  g.font=`${weight} ${z}px ${fam}`; if(opt.ls) g.letterSpacing=opt.ls+'px';
  const w=g.measureText(s).width; if(opt.maxW && w>opt.maxW){ z=Math.floor(size*opt.maxW/w); g.font=`${weight} ${z}px ${fam}`; }
  g.textAlign=opt.al||'center'; g.textBaseline='alphabetic'; g.fillStyle=opt.col||'#fff'; g.fillText(s,x,y); g.restore();
}
function shade(g, y0, y1, a0, a1){ const gr=g.createLinearGradient(0,y0,0,y1); gr.addColorStop(0,`rgba(0,0,0,${a0})`); gr.addColorStop(1,`rgba(0,0,0,${a1})`); g.fillStyle=gr; g.fillRect(0,y0,W,y1-y0); }
function rr(g, x, y, w, h, r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function hair(g, x0, x1, y, a){ g.save(); g.shadowColor='transparent'; g.strokeStyle=`rgba(255,255,255,${a||.55})`; g.lineWidth=2; g.beginPath(); g.moveTo(x0,y); g.lineTo(x1,y); g.stroke(); g.restore(); }
const bpmPair = v => v.max && v.min ? `${v.max} / ${v.min}` : (v.max || v.min);
const bpmLab = v => v.max && v.min ? 'MAX / MIN bpm' : v.max ? 'MAX bpm' : 'MIN bpm';
const bpmTxt = v => (v.max && v.min ? '' : v.max ? 'MAX ' : 'MIN ')+bpmPair(v)+' bpm';   // 片方だけのときは最大か最小かを添える
const statsOf = v => [['Time',v.time],['Max',v.max],['Min',v.min]].filter(s=>s[1]);
const FREE = {
  corner(g, v, st){
    const n=NF();
    if(!st){ shade(g,0,360,.45,0); shade(g,H-360,H,0,.5); }
    shadowOn(g);
    if(v.time){ T(g,'TIME',80,130,n.l,22,{al:'left',ls:3}); T(g,v.time,80,190,n.v,48,{al:'left',maxW:440}); }
    if(v.max || v.min){ T(g,bpmLab(v),1000,130,n.l,22,{al:'right',ls:3}); T(g,bpmPair(v),1000,190,n.v,48,{al:'right',maxW:440}); }
    drawCurve(g,80,1740,320,80,false,5);
    if(v.name) T(g,v.name,1000,1770,700,32,{al:'right',jp:true,maxW:520});
    T(g,'TOTONOI',1000,1820,n.v,24,{al:'right',ls:3});
  },
  card(g, v, st){
    const n=NF(), x=70, w=940, stats=statsOf(v);
    const h=(stats.length?150:0) + (S.curve?130:0) + 80 + (stats.length||S.curve?0:20), y=H-100-h;
    g.save(); rr(g,x,y,w,h,40); g.clip();
    if(!st){ const ok='filter' in CanvasRenderingContext2D.prototype; if(ok) g.filter='blur(28px)'; paintPhoto(g); if(ok) g.filter='none';
      g.fillStyle=`rgba(0,0,0,${ok?.4:.58})`; }      // ぼかしが効かない端末では少し濃く敷く
    else g.fillStyle='rgba(0,0,0,.58)';
    g.fillRect(x,y,w,h); g.restore();

    let yy=y;
    if(stats.length){

    if(v.name) T(g,v.name,x+50,y+h-34,700,28,{al:'left',jp:true,maxW:620});

  line1(g, v, st){

      g.save(); rr(g,x0-50,y-70,x1-x0+100,yEnd-y+70,36); g.fillStyle='rgba(0,0,0,.38)'; g.fill(); g.restore(); }

/* ステッカーは字の入っている所だけを切り出す */
function cropAlpha(c, m){
  const d=c.getContext('2d').getImageData(0,0,c.width,c.height).data; let x0=c.width, y0=c.height, x1=-1, y1=-1;
  for(let y=0;y<c.height;y++) for(let x=0;x<c.width;x++) if(d[(y*c.width+x)*4+3]>8){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
  if(x1<0) return c;
  x0=Math.max(0,x0-m); y0=Math.max(0,y0-m); x1=Math.min(c.width-1,x1+m); y1=Math.min(c.height-1,y1+m);
  const o=document.createElement('canvas'); o.width=x1-x0+1; o.height=y1-y0+1; o.getContext('2d').drawImage(c,-x0,-y0); return o;
}

function stackTop(B){ const h=B.reduce((s,b)=>s+b.h,0), t=tops[S.layout]; return t==null ? H-150-h : t==='mid' ? (H-h)/2 : t; }

function draw(){
  const g=$('cv').getContext('2d'); g.clearRect(0,0,W,H);
  if(FREE[S.layout]){
    if(S.layout!=='frame') paintPhoto(g);
    FREE[S.layout](g, val(), false); g.shadowColor='transparent';
    prepare(); return;
  }
  paintPhoto(g);
  const B=blocks(val(), S.layout), top=stackTop(B);
  if(S.layout==='band'){
    // 下に暗い帯を敷いて、明るい写真でも字が読めるようにする（ステッカーには入れない）
    const y0=top-140, gr=g.createLinearGradient(0,y0,0,H);
    gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(.35,'rgba(0,0,0,.45)'); gr.addColorStop(1,'rgba(0,0,0,.7)');
    g.fillStyle=gr; g.fillRect(0,y0,W,H-y0);
  }
  paintStack(g, B, top);
  prepare();
}

/* 押した瞬間に共有を開けるよう、絵が変わるたびに画像を作っておく（iOS は await を挟むと共有が拒否される） */
const ready={full:null, sticker:null};
let ver=0;
function prepare(){
  clearTimeout(prepare.h);
  ready.full=ready.sticker=null; const v=++ver;            // 作り直している間は「準備中」にし、古い結果は捨てる
  if(S.fontWait) return;
  prepare.h=setTimeout(()=>{
    $('cv').toBlob(b=>{ if(v===ver) ready.full=b; }, 'image/jpeg', .92);
    let c=document.createElement('canvas');
    if(FREE[S.layout]){ c.width=W; c.height=H; FREE[S.layout](c.getContext('2d'), val(), true); c=cropAlpha(c, 30); }
    else{
      const B=blocks(val(), S.layout), h=Math.ceil(B.reduce((s,b)=>s+b.h,0))+60;
      c.width=W; c.height=h; paintStack(c.getContext('2d'), B, 30);
    }
    c.toBlob(b=>{ if(v===ver){ ready.sticker=b; ready.stickerCv=c; } }, 'image/png');
  }, 150);
}

function stamp(){ const d=new Date(), p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`; }

async function share(blob, name, type){
  if(!blob){ toast('準備中。もう一度押してください'); return; }
  const file=new File([blob], name, {type});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file]}); return true; }
    catch(e){ if(e && e.name==='AbortError') return false; }
  }
  const a=document.createElement('a'), u=URL.createObjectURL(blob); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u), 4000);
  return true;
}

(()=>{
  const pv=$('pv'); let st=null;
  pv.addEventListener('pointerdown', e=>{ if(st) return; st={id:e.pointerId,x:e.clientX,y:e.clientY,t:performance.now(),p:{...S.pan}}; pv.setPointerCapture(e.pointerId); });
  pv.addEventListener('pointermove', e=>{ if(!st || e.pointerId!==st.id || !S.photo) return;
    const im=S.photo, b=photoBox(), s=Math.max(b.w/im.naturalWidth,b.h/im.naturalHeight), k=W/pv.clientWidth;
    const ox=b.w-im.naturalWidth*s, oy=b.h-im.naturalHeight*s, cl=v=>Math.min(1,Math.max(0,v));
    S.pan.x = ox ? cl(st.p.x + (e.clientX-st.x)*k/ox) : .5;
    S.pan.y = oy ? cl(st.p.y + (e.clientY-st.y)*k/oy) : .5;
    draw(); });
  // 横にさっとはらう＝デザインを替える（Strava の共有画面と同じ）。ゆっくり動かす＝写真をずらす
  pv.addEventListener('pointerup', e=>{
    if(!st || e.pointerId!==st.id) return; const dx=e.clientX-st.x, dy=e.clientY-st.y, dt=performance.now()-st.t;
    // 横長の写真は横にずらすのが本当の位置合わせなので、はらう判定を厳しくする
    const im=S.photo, b=photoBox(), panX = im && b.w-im.naturalWidth*Math.max(b.w/im.naturalWidth,b.h/im.naturalHeight) < -1;
    const need = panX ? {d:Math.max(80, pv.clientWidth*.3), t:250} : {d:40, t:450};
    if(Math.abs(dx)>need.d && Math.abs(dx)>Math.abs(dy)*1.5 && dt<need.t){
      S.pan=st.p; const i=LAYOUTS.indexOf(S.layout), n=LAYOUTS.length;
      setLayout(LAYOUTS[(i+(dx<0?1:-1)+n)%n]);
    }else if(S.photo) saveState();
    st=null; });
  pv.addEventListener('pointercancel', e=>{ if(st && e.pointerId===st.id) st=null; });
})();

/* 前に開いたときの写真・線・数字を戻す（読むだけ。ここでは書かない） */
/*   戻すのは18時間以内の物だけ（次のサウナに前回の線が乗らないように）。古い物は「新しく始める」と同じ白紙 */
(async()=>{

  // 期限は最後に触った時刻（state.at）ひとつで決め、写真も線も数字もまとめて戻すか、まとめて捨てる
  if(!st || typeof st.at!=='number' || Date.now()-st.at >= 18*3600*1000) return;

  if(ph && ph.blob){ try{ im=await loadImage(ph.blob); }catch(e){} }
  if(gen!==g0) return;                                     // 読み込み中に操作されたら、古い物で上書きしない
  if(im && !S.photo){ S.photo=im; S.photoBlob=ph.blob; $('pkPhoto').classList.add('ok'); $('pv').classList.add('has-photo'); }
  {
    const c01=v=>Number.isFinite(+v) ? Math.min(1,Math.max(0,+v)) : .5;
    if(st.pan && im) S.pan={x:c01(st.pan.x), y:c01(st.pan.y)};
    if(Array.isArray(st.curve) && !S.curve){ S.curve=st.curve; $('pkRec').classList.add('ok'); }
    [['fTime','time'],['fMax','max'],['fMin','min'],['fName','name']].forEach(([id,k])=>{ if(!$(id).value && typeof st[k]==='string') $(id).value=st[k]; });
  }
  draw();
  const nm=$('fName').value; if(nm) document.fonts.load(`700 44px ${F.jp}`, nm).then(draw, ()=>{});   // 戻した施設名の字を読み込んでから描き直す
})();
</script>
<!-- tsumiki-back-button -->
<style>
  #tsumikiEdge{position:fixed; top:0; bottom:0; left:0; width:22px; z-index:999;}
  #tsumikiPeek{
    position:fixed; top:50%; left:0; z-index:1001; margin-top:-23px;
    width:46px; height:46px; display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.92);
    -webkit-backdrop-filter:saturate(180%) blur(14px); backdrop-filter:saturate(180%) blur(14px);
    border:1px solid rgba(0,0,0,.06); border-radius:50%;
    box-shadow:0 6px 20px rgba(0,0,0,.18);
    color:#0071e3; font-size:24px; font-weight:600; line-height:1;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Helvetica Neue",Arial,sans-serif;
    transform:translateX(-70px) scale(.8); opacity:0; pointer-events:none;
  }
</style>
<div id="tsumikiEdge"></div>
<div id="tsumikiPeek">‹</div>
<script>
  (function(){
    var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
      || window.navigator.standalone === true;
    var fromTsumiki = false;
    try{
      if(document.referrer){
        var r = new URL(document.referrer);
        fromTsumiki = (r.origin === location.origin);
      }
    }catch(e){}
    if(!(standalone && fromTsumiki)) return;

    var peek = document.getElementById('tsumikiPeek');
    var edge = document.getElementById('tsumikiEdge');

    function goBack(){ location.href = 'index.html'; }

    /* --- 左端エッジスワイプで戻る（iOS純正の戻る操作。見えるボタンは置かない） --- */
    var sx=0, sy=0, prog=0, dragging=false, W=window.innerWidth;
    var TRIGGER = Math.min(120, W*0.32);
    window.addEventListener('resize', function(){ W=window.innerWidth; TRIGGER=Math.min(120, W*0.32); });

    function reset(){
      dragging = false; prog = 0;
      peek.style.transition = 'transform .25s ease, opacity .25s ease';
      peek.style.transform = 'translateX(-70px) scale(.8)';
      peek.style.opacity = 0;
    }
    function start(e){
      var t = e.touches ? e.touches[0] : e;
      if(t.clientX > 26) return;
      sx = t.clientX; sy = t.clientY; prog = 0; dragging = true;
      peek.style.transition = 'none';
    }
    function move(e){
      if(!dragging) return;
      var t = e.touches ? e.touches[0] : e;
      var dx = t.clientX - sx, dy = t.clientY - sy;
      if(Math.abs(dy) > Math.abs(dx) + 12){ reset(); return; }
      if(dx < 0) dx = 0;
      prog = Math.min(dx / TRIGGER, 1);
      peek.style.transform = 'translateX(' + (-70 + prog*82) + 'px) scale(' + (0.8 + prog*0.2) + ')';
      peek.style.opacity = prog;
      if(dx > 6 && e.cancelable) e.preventDefault();
    }
    function end(){
      if(!dragging) return;
      dragging = false;
      if(prog >= 0.999){
        peek.style.transition = 'transform .25s ease, opacity .25s ease';
        peek.style.transform = 'translateX(20px) scale(1.05)';
        peek.style.opacity = 1;
        goBack();
      }else{
        reset();
      }
    }
    edge.addEventListener('touchstart', start, {passive:true});
    window.addEventListener('touchmove', move, {passive:false});
    window.addEventListener('touchend', end, {passive:true});
    window.addEventListener('touchcancel', end, {passive:true});
  })();
</script>
<!-- /tsumiki-back-button -->
</body>
