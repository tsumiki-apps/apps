<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="apple-touch-icon" href="icons/icon-dakoku.png">
<meta name="apple-mobile-web-app-title" content="打刻">
<title>打刻 — 出勤・退勤</title>
<style>
  :root{
    --bg:#eef3f8; --card:#ffffff; --ink:#1a2734; --sub:#7488a0;
    --line:#e2e9f1; --accent:#2f6fd6; --accent2:#5a95ea;
    --in:#2f9e6b; --out:#e0663b; --ok:#34c759; --radius:20px;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  [hidden]{display:none !important;}
  html,body{overscroll-behavior-y:none;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Helvetica Neue",Arial,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.6;
    padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 20px);
    -webkit-font-smoothing:antialiased; min-height:100vh;
  }
  .wrap{max-width:520px; margin:0 auto; padding:0 16px;}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
  input,select,textarea{font-family:inherit; font-size:16px;}

  /* ===== ログイン ===== */
  .login{min-height:80vh; display:flex; flex-direction:column; justify-content:center; gap:16px; text-align:center;}
  .login .logo{font-size:52px;}
  .login h1{font-size:24px; font-weight:800; letter-spacing:-.02em;}
  .login p{color:var(--sub); font-size:14px;}
  .login .codebox{display:flex; flex-direction:column; gap:12px; background:var(--card);
    border:1px solid var(--line); border-radius:var(--radius); padding:22px 18px;}
  .login input{border:2px solid var(--line); border-radius:14px; padding:14px 16px;
    font-size:22px; text-align:center; letter-spacing:.28em; font-weight:700; text-transform:uppercase;}
  .login input:focus{outline:none; border-color:var(--accent);}
  .btn-primary{background:var(--accent); color:#fff; font-weight:800; font-size:17px;
    border-radius:14px; padding:15px; width:100%;}
  .btn-primary:disabled{opacity:.5;}
  .err{color:var(--out); font-size:13px; min-height:18px;}

  /* ===== ヘッダー ===== */
  header{padding:22px 4px 8px; display:flex; align-items:center; gap:10px;}
  header .who{min-width:0;}
  header h1{font-size:19px; font-weight:800; letter-spacing:-.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  header .site{font-size:12px; color:var(--sub);}
  header .sync{margin-left:auto; display:flex; align-items:center; gap:6px; flex:0 0 auto;
    font-size:11px; color:var(--sub); background:var(--card); border:1px solid var(--line);
    border-radius:999px; padding:5px 10px;}
  .sync .dot{width:7px; height:7px; border-radius:50%; background:var(--ok);}
  .sync .dot.off{background:#c7c7cc;}

  .tabs{display:flex; gap:6px; background:var(--card); border:1px solid var(--line);
    border-radius:14px; padding:5px; margin:6px 0 12px;}
  .tabs button{flex:1; padding:10px; border-radius:10px; font-weight:700; font-size:14px; color:var(--sub);}
  .tabs button.on{background:var(--accent); color:#fff;}

  /* ===== 打刻画面 ===== */
  .clockface{text-align:center; padding:8px 0 0;}
  .nowclock{font-size:44px; font-weight:800; letter-spacing:-.02em; font-variant-numeric:tabular-nums;}
  .nowdate{color:var(--sub); font-size:14px; margin-bottom:20px;}
  .bigbtn{width:230px; height:230px; border-radius:50%; margin:6px auto 8px; display:flex;
    flex-direction:column; align-items:center; justify-content:center; gap:4px; color:#fff;
    font-weight:800; box-shadow:0 12px 30px rgba(0,0,0,.14); transition:transform .1s ease;}
  .bigbtn:active{transform:scale(.96);}
  .bigbtn .lead{font-size:15px; font-weight:700; opacity:.9;}
  .bigbtn .main{font-size:40px; letter-spacing:.04em;}
  .bigbtn.toIn{background:linear-gradient(160deg,#33a873,#2f9e6b);}
  .bigbtn.toOut{background:linear-gradient(160deg,#ef7a51,#e0663b);}
  .statusline{font-size:15px; font-weight:700; margin-top:6px;}
  .statusline.on{color:var(--in);}
  .statusline.off{color:var(--sub);}
  .today{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 18px; margin-top:18px; display:flex; justify-content:space-around; text-align:center;}
  .today .cell .lbl{font-size:11px; color:var(--sub);}
  .today .cell .val{font-size:20px; font-weight:800; font-variant-numeric:tabular-nums;}

  /* ===== 記録画面 ===== */
  .monthbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .monthbar button{width:38px; height:38px; border-radius:12px; background:var(--card);
    border:1px solid var(--line); font-size:18px; font-weight:800; color:var(--accent);}
  .monthbar .mlabel{font-size:17px; font-weight:800;}
  .sumcard{background:var(--accent); color:#fff; border-radius:var(--radius); padding:16px 18px;
    display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
  .sumcard .k{font-size:13px; opacity:.9;}
  .sumcard .v{font-size:26px; font-weight:800; font-variant-numeric:tabular-nums;}
  .sumcard .sub{font-size:12px; opacity:.85;}
  .reclist{display:flex; flex-direction:column; gap:8px;}
  .rec{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px;
    display:flex; align-items:center; gap:12px;}
  .rec .d{width:52px; flex:0 0 auto;}
  .rec .d .day{font-size:17px; font-weight:800;}
  .rec .d .wd{font-size:11px; color:var(--sub);}
  .rec .d .wd.sat{color:#3a7bd5;} .rec .d .wd.sun{color:#e0663b;}
  .rec .io{flex:1; font-size:14px; font-variant-numeric:tabular-nums;}
  .rec .io .open{color:var(--out); font-weight:700;}
  .rec .net{font-weight:800; font-variant-numeric:tabular-nums; font-size:15px;}
  .rec .net.zero{color:var(--sub); font-weight:600;}
  .empty{text-align:center; color:var(--sub); padding:40px 0; font-size:14px;}
  .addrow{margin-top:12px; text-align:center;}
  .addrow button{color:var(--accent); font-weight:700; font-size:14px; padding:10px 16px;
    border:1px dashed var(--accent); border-radius:12px;}
  .logout{margin-top:26px; text-align:center;}
  .logout button{color:var(--sub); font-size:13px; text-decoration:underline;}

  /* ===== モーダル ===== */
  .modal{position:fixed; inset:0; background:rgba(20,30,44,.42); display:flex; align-items:flex-end;
    justify-content:center; z-index:50;}
  .sheet{background:var(--card); border-radius:22px 22px 0 0; width:100%; max-width:520px;
    padding:20px 18px calc(env(safe-area-inset-bottom) + 20px); animation:up .22s ease;}
  @keyframes up{from{transform:translateY(30px); opacity:.5;} to{transform:none; opacity:1;}}
  .sheet h3{font-size:17px; font-weight:800; margin-bottom:14px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; color:var(--sub); margin-bottom:5px; font-weight:700;}
  .field input{width:100%; border:2px solid var(--line); border-radius:12px; padding:11px 12px;}
  .field input:focus{outline:none; border-color:var(--accent);}
  .sheet .row{display:flex; gap:10px; margin-top:6px;}
  .sheet .row .btn-primary{flex:1;}
  .btn-ghost{flex:0 0 auto; padding:15px 16px; border-radius:14px; background:var(--bg);
    color:var(--sub); font-weight:700;}
  .btn-del{color:var(--out); font-size:13px; text-decoration:underline; margin-top:12px; display:block; text-align:center; width:100%;}
  .toast{position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 26px); transform:translateX(-50%);
    background:#1a2734; color:#fff; padding:11px 18px; border-radius:999px; font-size:14px; font-weight:700;
    z-index:80; opacity:0; transition:opacity .2s; pointer-events:none;}
  .toast.show{opacity:1;}
</style>
</head>
<body>

<!-- ログイン -->
<div class="wrap login" id="loginView">
  <div class="logo">🕓</div>
  <h1>打刻</h1>
  <p>管理者から受け取った<br>打刻コードを入力してください</p>
  <div class="codebox">
    <input id="codeInput" maxlength="6" autocomplete="off" autocapitalize="characters" placeholder="コード" inputmode="text">
    <button class="btn-primary" id="loginBtn">はじめる</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<!-- アプリ -->
<div class="wrap" id="appView" hidden>
  <header>
    <div class="who">
      <h1 id="hName">—</h1>
      <div class="site" id="hSite"></div>
    </div>
    <div class="sync"><span class="dot" id="syncDot"></span><span id="syncTxt">同期</span></div>
  </header>

  <div class="tabs">
    <button id="tabPunch" class="on">打刻</button>
    <button id="tabRec">記録</button>
  </div>

  <!-- 打刻タブ -->
  <section id="punchTab">
    <div class="clockface">
      <div class="nowclock" id="nowClock">--:--</div>
      <div class="nowdate" id="nowDate"></div>
      <button class="bigbtn toIn" id="bigBtn">
        <span class="lead" id="bigLead">タップで</span>
        <span class="main" id="bigMain">出勤</span>
      </button>
      <div class="statusline off" id="statusLine">未出勤</div>
      <div class="today">
        <div class="cell"><div class="lbl">出勤</div><div class="val" id="tIn">--:--</div></div>
        <div class="cell"><div class="lbl">退勤</div><div class="val" id="tOut">--:--</div></div>
        <div class="cell"><div class="lbl">実働</div><div class="val" id="tNet">--</div></div>
      </div>
    </div>
  </section>

  <!-- 記録タブ -->
  <section id="recTab" hidden>
    <div class="monthbar">
      <button id="mPrev">‹</button>
      <div class="mlabel" id="mLabel">—</div>
      <button id="mNext">›</button>
    </div>
    <div class="sumcard">
      <div><div class="k">今月の実働合計</div><div class="sub" id="sumDays">—</div></div>
      <div class="v" id="sumTotal">—</div>
    </div>
    <div class="reclist" id="recList"></div>
    <div class="addrow"><button id="addBtn">＋ 手動で記録を追加</button></div>
    <div class="logout"><button id="logoutBtn">別のコードでログインし直す</button></div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://okbjqtdirrathscctyvx.supabase.co';
const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9rYmpxdGRpcnJhdGhzY2N0eXZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzMjI4NTIsImV4cCI6MjA5NTg5ODg1Mn0.T-1AOK6vCD6uGdqrVGXjPui3L6WPSNrnygS-IHyfZ6Y';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON);
const LS_KEY='dakoku_worker_code';

/* ===== 共通：計算ロジック（15分・最近接丸め / 昼休憩1h控除 / 日またぎOK） ===== */
const BREAK_MIN=60, ROUND_MIN=15;
function round15(d){ const ms=ROUND_MIN*60*1000; return new Date(Math.round(new Date(d).getTime()/ms)*ms); }
function netMinutes(inTs,outTs){
  if(!inTs||!outTs) return null;
  let g=(round15(outTs)-round15(inTs))/60000;
  if(g<=0) return 0;
  if(g>BREAK_MIN) g-=BREAK_MIN;     // 1時間超なら昼休憩を控除。1時間以下は控除なし
  return Math.max(0,Math.round(g));
}
function fmtHM(min){ if(min==null) return '--'; const h=Math.floor(min/60), m=min%60; return h+':'+String(m).padStart(2,'0'); }
function fmtClock(ts){ if(!ts) return '--:--'; const d=new Date(ts); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
const WD=['日','月','火','水','木','金','土'];

/* ===== 状態 ===== */
let code=null, me=null, viewMonth=null;

async function rpc(fn,params){
  const {data,error}=await sb.rpc(fn,params);
  setSync(!error);
  if(error) throw error;
  return data;
}
function setSync(ok){ const d=document.getElementById('syncDot'), t=document.getElementById('syncTxt');
  if(!d) return; d.classList.toggle('off',!ok); t.textContent=ok?'同期':'オフライン'; }
let toastT;
function toast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),1800); }

/* ===== ログイン ===== */
const codeInput=document.getElementById('codeInput');
codeInput.addEventListener('input',()=>{ codeInput.value=codeInput.value.toUpperCase().replace(/[^A-Z0-9]/g,''); });
document.getElementById('loginBtn').addEventListener('click',doLogin);
codeInput.addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });

async function doLogin(){
  const c=codeInput.value.trim().toUpperCase();
  const err=document.getElementById('loginErr');
  err.textContent='';
  if(c.length<4){ err.textContent='コードを入力してください'; return; }
  try{
    const info=await rpc('dakoku_worker_login',{p_code:c});
    if(!info){ err.textContent='そのコードは見つかりません'; return; }
    code=c; me=info; localStorage.setItem(LS_KEY,c);
    enterApp();
  }catch(e){ err.textContent='通信に失敗しました。時間をおいて再度お試しください'; }
}

function enterApp(){
  document.getElementById('loginView').hidden=true;
  document.getElementById('appView').hidden=false;
  document.getElementById('hName').textContent=me.name;
  document.getElementById('hSite').textContent=me.site||'';
  viewMonth=new Date(); viewMonth.setDate(1);
  renderPunch();
  tickClock();
}

/* ===== タブ ===== */
const tabPunch=document.getElementById('tabPunch'), tabRec=document.getElementById('tabRec');
tabPunch.addEventListener('click',()=>switchTab('punch'));
tabRec.addEventListener('click',()=>switchTab('rec'));
function switchTab(t){
  const p=t==='punch';
  tabPunch.classList.toggle('on',p); tabRec.classList.toggle('on',!p);
  document.getElementById('punchTab').hidden=!p;
  document.getElementById('recTab').hidden=p;
  if(p){ renderPunch(); } else { loadMonth(); }
}

/* ===== 時計 ===== */
function tickClock(){
  const d=new Date();
  document.getElementById('nowClock').textContent=fmtClock(d);
  document.getElementById('nowDate').textContent=`${d.getMonth()+1}月${d.getDate()}日(${WD[d.getDay()]})`;
  setTimeout(tickClock,1000*10);
}

/* ===== 打刻表示 ===== */
function renderPunch(){
  const btn=document.getElementById('bigBtn');
  const open=me.open;
  btn.className='bigbtn '+(open?'toOut':'toIn');
  document.getElementById('bigMain').textContent=open?'退勤':'出勤';
  const sl=document.getElementById('statusLine');
  if(open){
    sl.className='statusline on';
    sl.textContent='出勤中 — '+fmtClock(me.open_since)+' から';
  }else{
    sl.className='statusline off'; sl.textContent='未出勤';
  }
  renderTodayCells();
}
async function renderTodayCells(){
  // 今日（出勤日基準）の記録を取得して出退勤・実働を表示
  try{
    const from=new Date(); from.setHours(0,0,0,0);
    const to=new Date(from); to.setDate(to.getDate()+1);
    const recs=await rpc('dakoku_worker_records',{p_code:code,p_from:from.toISOString(),p_to:to.toISOString()});
    const last=recs.length?recs[recs.length-1]:null;
    document.getElementById('tIn').textContent=last?fmtClock(last.clock_in):'--:--';
    document.getElementById('tOut').textContent=last&&last.clock_out?fmtClock(last.clock_out):'--:--';
    const nm=last?netMinutes(last.clock_in,last.clock_out):null;
    document.getElementById('tNet').textContent=nm==null?'--':fmtHM(nm);
  }catch(e){}
}

document.getElementById('bigBtn').addEventListener('click',doPunch);
let punching=false;
async function doPunch(){
  if(punching) return; punching=true;
  try{
    const res=await rpc('dakoku_punch',{p_code:code});
    if(res.action==='in'){ me.open=true; me.open_since=res.record.clock_in; toast('出勤しました 🟢'); }
    else{ me.open=false; me.open_since=null; toast('退勤しました 🟠'); }
    renderPunch();
  }catch(e){ toast('打刻に失敗しました'); }
  finally{ punching=false; }
}

/* ===== 記録タブ ===== */
document.getElementById('mPrev').addEventListener('click',()=>{ viewMonth.setMonth(viewMonth.getMonth()-1); loadMonth(); });
document.getElementById('mNext').addEventListener('click',()=>{ viewMonth.setMonth(viewMonth.getMonth()+1); loadMonth(); });

async function loadMonth(){
  const from=new Date(viewMonth.getFullYear(),viewMonth.getMonth(),1);
  const to=new Date(viewMonth.getFullYear(),viewMonth.getMonth()+1,1);
  document.getElementById('mLabel').textContent=`${from.getFullYear()}年${from.getMonth()+1}月`;
  let recs=[];
  try{ recs=await rpc('dakoku_worker_records',{p_code:code,p_from:from.toISOString(),p_to:to.toISOString()}); }
  catch(e){ toast('読み込みに失敗しました'); }
  renderRecList(recs);
}
function renderRecList(recs){
  const list=document.getElementById('recList');
  list.innerHTML='';
  let total=0, workdays=0;
  if(!recs.length){ list.innerHTML='<div class="empty">この月の記録はまだありません</div>'; }
  recs.forEach(r=>{
    const din=new Date(r.clock_in);
    const nm=netMinutes(r.clock_in,r.clock_out);
    if(nm!=null){ total+=nm; if(nm>0) workdays++; }
    const wd=din.getDay();
    const wdc=wd===0?'sun':wd===6?'sat':'';
    const el=document.createElement('div'); el.className='rec';
    const ioHtml=r.clock_out
      ? `${fmtClock(r.clock_in)} → ${fmtClock(r.clock_out)}`
      : `${fmtClock(r.clock_in)} → <span class="open">退勤未</span>`;
    el.innerHTML=`
      <div class="d"><div class="day">${din.getDate()}</div><div class="wd ${wdc}">${WD[wd]}</div></div>
      <div class="io">${ioHtml}</div>
      <div class="net ${nm?'':'zero'}">${nm==null?'—':fmtHM(nm)}</div>`;
    el.addEventListener('click',()=>openEdit(r));
    list.appendChild(el);
  });
  document.getElementById('sumTotal').textContent=fmtHM(total);
  document.getElementById('sumDays').textContent=`稼働 ${workdays} 日`;
}

/* ===== 記録の編集/追加/削除 ===== */
const modalRoot=document.createElement('div');
document.body.appendChild(modalRoot);
function toLocalInput(ts){ // ISO -> yyyy-MM-ddTHH:mm (local)
  const d=ts?new Date(ts):new Date();
  const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
function fromLocalInput(v){ return v?new Date(v).toISOString():null; }

function openEdit(rec){
  const isNew=!rec;
  const def=viewMonth ? new Date(viewMonth.getFullYear(),viewMonth.getMonth(),new Date().getDate(),9,0) : new Date();
  modalRoot.innerHTML=`
    <div class="modal" id="mBack">
      <div class="sheet">
        <h3>${isNew?'記録を追加':'記録を修正'}</h3>
        <div class="field"><label>出勤</label><input type="datetime-local" id="eIn" value="${toLocalInput(rec?rec.clock_in:def)}"></div>
        <div class="field"><label>退勤（未入力なら出勤中のまま）</label><input type="datetime-local" id="eOut" value="${rec&&rec.clock_out?toLocalInput(rec.clock_out):''}"></div>
        <div class="row">
          <button class="btn-ghost" id="eCancel">閉じる</button>
          <button class="btn-primary" id="eSave">保存</button>
        </div>
        ${isNew?'':'<button class="btn-del" id="eDel">この記録を削除</button>'}
      </div>
    </div>`;
  document.getElementById('mBack').addEventListener('click',e=>{ if(e.target.id==='mBack') closeModal(); });
  document.getElementById('eCancel').addEventListener('click',closeModal);
  document.getElementById('eSave').addEventListener('click',()=>saveEdit(rec));
  if(!isNew) document.getElementById('eDel').addEventListener('click',()=>delRec(rec));
}
function closeModal(){ modalRoot.innerHTML=''; }

async function saveEdit(rec){
  const inV=fromLocalInput(document.getElementById('eIn').value);
  const outV=fromLocalInput(document.getElementById('eOut').value);
  if(!inV){ toast('出勤時刻を入れてください'); return; }
  if(outV && new Date(outV)<=new Date(inV)){ toast('退勤は出勤より後にしてください'); return; }
  try{
    await rpc('dakoku_worker_save_record',{p_code:code,p_id:rec?rec.id:null,p_in:inV,p_out:outV});
    closeModal(); toast('保存しました');
    await refreshAfterEdit();
  }catch(e){ toast('保存に失敗しました'); }
}
async function delRec(rec){
  if(!confirm('この記録を削除しますか？')) return;
  try{
    await rpc('dakoku_worker_delete_record',{p_code:code,p_id:rec.id});
    closeModal(); toast('削除しました');
    await refreshAfterEdit();
  }catch(e){ toast('削除に失敗しました'); }
}
async function refreshAfterEdit(){
  // 出勤中フラグを更新
  try{ const info=await rpc('dakoku_worker_login',{p_code:code}); if(info){ me.open=info.open; me.open_since=info.open_since; } }catch(e){}
  loadMonth();
}

document.getElementById('addBtn').addEventListener('click',()=>openEdit(null));
document.getElementById('logoutBtn').addEventListener('click',()=>{
  if(!confirm('ログアウトしますか？（打刻コードの入力からやり直します）')) return;
  localStorage.removeItem(LS_KEY); location.reload();
});

/* ===== 起動：保存済みコードで自動ログイン ===== */
(async function init(){
  const saved=localStorage.getItem(LS_KEY);
  if(saved){
    try{
      const info=await rpc('dakoku_worker_login',{p_code:saved});
      if(info){ code=saved; me=info; enterApp(); return; }
    }catch(e){}
  }
  codeInput.focus();
})();
</script>
<!-- tsumiki-back-button -->
<style>
  #tsumikiEdge{position:fixed; top:0; bottom:0; left:0; width:22px; z-index:999;}
  #tsumikiPeek{
    position:fixed; top:50%; left:0; z-index:1001; margin-top:-23px;
    width:46px; height:46px; display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.92);
    -webkit-backdrop-filter:saturate(180%) blur(14px); backdrop-filter:saturate(180%) blur(14px);
    border:1px solid rgba(0,0,0,.06); border-radius:50%;
    box-shadow:0 6px 20px rgba(0,0,0,.18);
    color:#0071e3; font-size:24px; font-weight:600; line-height:1;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Helvetica Neue",Arial,sans-serif;
    transform:translateX(-70px) scale(.8); opacity:0; pointer-events:none;
  }
</style>
<div id="tsumikiEdge"></div>
<div id="tsumikiPeek">‹</div>
<script>
  (function(){
    var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
      || window.navigator.standalone === true;
    var fromTsumiki = false;
    try{
      if(document.referrer){
        var r = new URL(document.referrer);
        fromTsumiki = (r.origin === location.origin);
      }
    }catch(e){}
    if(!(standalone && fromTsumiki)) return;

    var peek = document.getElementById('tsumikiPeek');
    var edge = document.getElementById('tsumikiEdge');

    function goBack(){ location.href = 'index.html'; }

    /* --- 左端エッジスワイプで戻る（iOS純正の戻る操作。見えるボタンは置かない） --- */
    var sx=0, sy=0, prog=0, dragging=false, W=window.innerWidth;
    var TRIGGER = Math.min(120, W*0.32);
    window.addEventListener('resize', function(){ W=window.innerWidth; TRIGGER=Math.min(120, W*0.32); });

    function reset(){
      dragging = false; prog = 0;
      peek.style.transition = 'transform .25s ease, opacity .25s ease';
      peek.style.transform = 'translateX(-70px) scale(.8)';
      peek.style.opacity = 0;
    }
    function start(e){
      var t = e.touches ? e.touches[0] : e;
      if(t.clientX > 26) return;
      sx = t.clientX; sy = t.clientY; prog = 0; dragging = true;
      peek.style.transition = 'none';
    }
    function move(e){
      if(!dragging) return;
      var t = e.touches ? e.touches[0] : e;
      var dx = t.clientX - sx, dy = t.clientY - sy;
      if(Math.abs(dy) > Math.abs(dx) + 12){ reset(); return; }
      if(dx < 0) dx = 0;
      prog = Math.min(dx / TRIGGER, 1);
      peek.style.transform = 'translateX(' + (-70 + prog*82) + 'px) scale(' + (0.8 + prog*0.2) + ')';
      peek.style.opacity = prog;
      if(dx > 6 && e.cancelable) e.preventDefault();
    }
    function end(){
      if(!dragging) return;
      dragging = false;
      if(prog >= 0.999){
        peek.style.transition = 'transform .25s ease, opacity .25s ease';
        peek.style.transform = 'translateX(20px) scale(1.05)';
        peek.style.opacity = 1;
        goBack();
      }else{
        reset();
      }
    }
    edge.addEventListener('touchstart', start, {passive:true});
    window.addEventListener('touchmove', move, {passive:false});
    window.addEventListener('touchend', end, {passive:true});
    window.addEventListener('touchcancel', end, {passive:true});
  })();
</script>
<!-- /tsumiki-back-button -->
</body>
</html>
