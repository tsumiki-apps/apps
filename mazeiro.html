<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="apple-touch-icon" href="icons/icon-mazeiro.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="まぜいろ">
<title>まぜいろ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F4F2EE; --surface:#ECE9E3; --ink:#242321; --muted:#77736B;
    --hair:#D8D4CC; --ghost:#BEB9B0; --control:#F8F7F4;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:'Zen Maru Gothic',-apple-system,BlinkMacSystemFont,"Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
    line-height:1.6; -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
    padding:env(safe-area-inset-top) 20px calc(48px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:560px; margin:0 auto;}
  svg{display:block; stroke:var(--ink); fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round;}

  /* header */
  header{display:flex; align-items:center; justify-content:space-between; padding:26px 2px 30px;}
  .brand{display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:.06em; font-size:16px;}
  .brand svg{width:22px; height:22px;}
  .iconbtn{appearance:none; -webkit-appearance:none; background:none; border:1px solid var(--hair);
    width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:transform .12s ease;}
  .iconbtn:active{transform:scale(.92);}
  .iconbtn svg{width:17px; height:17px; stroke:var(--muted);}

  /* card */
  .card{background:var(--control); border:1px solid var(--hair); border-radius:24px;
    padding:22px 18px; margin-bottom:16px;}
  .cap{display:flex; align-items:center; gap:8px; margin-bottom:18px;}
  .cap svg{width:20px; height:20px;}
  .cap span{font-size:12.5px; font-weight:700; letter-spacing:.14em; color:var(--muted);}

  /* 1剤: 全体量 */
  .total{display:flex; align-items:baseline; justify-content:center; gap:8px; margin-bottom:22px;}
  .total input{width:150px; border:none; border-bottom:2px solid var(--hair); border-radius:0;
    background:none; text-align:center; font-family:inherit; font-weight:700; font-size:40px;
    color:var(--ink); padding:0 4px 2px; caret-color:var(--ink);}
  .total input:focus{outline:none; border-bottom-color:var(--ink);}
  .total input::placeholder{color:var(--ghost); font-weight:500;}
  .total .u{font-size:16px; font-weight:700; color:var(--muted);}

  /* 1剤: 比率カラム */
  .cols{display:flex; flex-wrap:wrap; align-items:flex-start; justify-content:center;
    gap:14px 6px; padding-top:2px;}
  .col{display:flex; flex-direction:column; align-items:center; gap:7px; position:relative;}
  .col input{width:58px; height:54px; border:1px solid var(--hair); border-radius:16px;
    background:#fff; text-align:center; font-family:inherit; font-weight:700; font-size:20px;
    color:var(--ink);}
  .col input:focus{outline:none; border-color:var(--ink);}
  .col input::placeholder{color:var(--ghost); font-weight:400;}
  .col .g{font-size:14px; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap;}
  .col .g small{font-size:10.5px; font-weight:500; color:var(--muted); margin-left:1px;}
  .col .g.off{color:var(--ghost); font-weight:500;}
  .col .x{position:absolute; top:-8px; right:-8px; width:20px; height:20px; border-radius:50%;
    background:var(--surface); border:1px solid var(--hair); color:var(--muted);
    display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0;}
  .col .x svg{width:9px; height:9px; stroke:var(--muted); stroke-width:2;}
  .sep{height:54px; display:flex; align-items:center; color:var(--ghost);
    font-size:18px; font-weight:700;}
  .addc{width:36px; height:54px; display:flex; align-items:center; justify-content:center;
    background:none; border:none; cursor:pointer; transition:transform .12s ease;}
  .addc:active{transform:scale(.9);}
  .addc svg{width:26px; height:26px; stroke:var(--ghost);}

  /* 2剤 */
  .dev{display:flex; align-items:center; justify-content:center; gap:12px;}
  .dev .x{font-size:20px; font-weight:700; color:var(--muted);}
  .dev input{width:86px; height:54px; border:1px solid var(--hair); border-radius:16px;
    background:#fff; text-align:center; font-family:inherit; font-weight:700; font-size:22px;
    color:var(--ink);}
  .dev input:focus{outline:none; border-color:var(--ink);}
  .dev input::placeholder{color:var(--ghost); font-weight:400;}
  .dev .arrow svg{width:18px; height:18px; stroke:var(--ghost);}
  .dev .g{font-size:21px; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap;}
  .dev .g small{font-size:12px; font-weight:500; color:var(--muted); margin-left:2px;}
  .dev .g.off{color:var(--ghost); font-weight:500;}
  .pills{display:flex; gap:8px; margin-top:16px; justify-content:center;}
  .pills button{flex:0 1 76px; border:1px solid var(--hair); background:none; color:var(--muted);
    font-family:inherit; border-radius:999px; padding:8px 0; font-size:14px; font-weight:700;
    cursor:pointer; transition:transform .12s ease;}
  .pills button:active{transform:scale(.94);}
  .pills button.on{background:var(--ink); border-color:var(--ink); color:var(--paper);}

  /* 合計 */
  .sum{display:flex; align-items:center; justify-content:center; gap:10px;
    padding:26px 0 4px; flex-wrap:wrap;}
  .sum .pc{display:flex; align-items:center; gap:5px; font-size:15px; font-weight:700;
    font-variant-numeric:tabular-nums; color:var(--muted);}
  .sum .pc svg{width:16px; height:16px; stroke:var(--muted);}
  .sum .op{color:var(--ghost); font-size:14px; font-weight:700;}
  .sum .tot{display:flex; align-items:baseline; gap:3px; font-size:30px; font-weight:700;
    font-variant-numeric:tabular-nums;}
  .sum .tot small{font-size:14px; font-weight:500; color:var(--muted);}
  .sum.off{opacity:.35;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <svg viewBox="0 0 24 24"><path d="M12 21a9 9 0 1 1 9-9c0 2-1.5 3-3 3h-2a2.5 2.5 0 0 0-2 4c.5.8 0 2-2 2z"/><circle cx="8" cy="10" r=".6"/><circle cx="12" cy="7.5" r=".6"/><circle cx="16" cy="10" r=".6"/></svg>
      まぜいろ
    </div>
    <button class="iconbtn" id="resetBtn" title="リセット">
      <svg viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1-1 5"/><path d="M4 4v6h6"/></svg>
    </button>
  </header>

  <!-- 1剤 -->
  <section class="card">
    <div class="cap">
      <svg viewBox="0 0 24 24"><path d="M10 3h4v4h-4z"/><path d="M10 7h4l1.5 3v9a2 2 0 0 1-2 2h-3a2 2 0 0 1-2-2v-9z"/><path d="M8.5 14h7"/></svg>
      <span>1剤</span>
    </div>
    <div class="total">
      <input id="totalG" type="number" inputmode="decimal" min="0" placeholder="0">
      <span class="u">g</span>
    </div>
    <div class="cols" id="cols"></div>
  </section>

  <!-- 2剤 -->
  <section class="card">
    <div class="cap">
      <svg viewBox="0 0 24 24"><path d="M12 3c3.5 4.6 6 7.7 6 10.7a6 6 0 0 1-12 0C6 10.7 8.5 7.6 12 3z"/></svg>
      <span>2剤</span>
    </div>
    <div class="dev">
      <span class="x">×</span>
      <input id="devMult" type="number" inputmode="decimal" min="0" step="0.1" placeholder="0">
      <span class="arrow"><svg viewBox="0 0 24 24"><path d="M5 12h13"/><path d="M13 6l6 6-6 6"/></svg></span>
      <span class="g off" id="devG">–<small>g</small></span>
    </div>
    <div class="pills" id="pills">
      <button data-v="1">×1</button>
      <button data-v="1.5">×1.5</button>
      <button data-v="2">×2</button>
      <button data-v="3">×3</button>
    </div>
  </section>

  <!-- 合計 -->
  <div class="sum off" id="sumLine">
    <span class="pc"><svg viewBox="0 0 24 24"><path d="M10 3h4v4h-4z"/><path d="M10 7h4l1.5 3v9a2 2 0 0 1-2 2h-3a2 2 0 0 1-2-2v-9z"/></svg><span id="sum1">–</span></span>
    <span class="op">＋</span>
    <span class="pc"><svg viewBox="0 0 24 24"><path d="M12 3c3.5 4.6 6 7.7 6 10.7a6 6 0 0 1-12 0C6 10.7 8.5 7.6 12 3z"/></svg><span id="sum2">–</span></span>
    <span class="op">＝</span>
    <span class="tot"><span id="sumT">–</span><small>g</small></span>
  </div>
</div>

<script>
(function(){
  const KEY = "mazeiro_v1";
  const $ = id => document.getElementById(id);
  const colsEl = $("cols");

  // ---- 状態（旧形式 {name,ratio} からの引き継ぎあり） ----
  let state = { total:"", ratios:["",""], mult:"" };
  try{
    const saved = JSON.parse(localStorage.getItem(KEY) || "null");
    if(saved){
      if(Array.isArray(saved.ratios) && saved.ratios.length >= 2){
        state = { total:saved.total||"", ratios:saved.ratios, mult:saved.mult||"" };
      }else if(Array.isArray(saved.parts) && saved.parts.length >= 2){
        state = { total:saved.total||"", ratios:saved.parts.map(p=>p.ratio||""), mult:saved.mult||"" };
      }
    }
  }catch(e){}
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

  // ---- 整形（0.1g単位） ----
  function fmt(n){
    if(!isFinite(n)) return "–";
    const r = Math.round(n*10)/10;
    return (Math.abs(r - Math.round(r)) < 1e-9) ? String(Math.round(r)) : r.toFixed(1);
  }

  const XSVG = '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';

  // ---- 比率カラムの描画 ----
  function renderCols(){
    colsEl.innerHTML = "";
    state.ratios.forEach((r, i) => {
      if(i > 0){
        const sep = document.createElement("span");
        sep.className = "sep"; sep.textContent = ":";
        colsEl.appendChild(sep);
      }
      const col = document.createElement("div");
      col.className = "col";
      col.innerHTML = '<input type="number" inputmode="decimal" min="0" step="0.1" placeholder="0">' +
                      '<span class="g off">–<small>g</small></span>';
      const inp = col.querySelector("input");
      inp.value = r;
      inp.addEventListener("input", () => { state.ratios[i] = inp.value; save(); calc(); });
      if(state.ratios.length > 2){
        const x = document.createElement("button");
        x.className = "x"; x.innerHTML = XSVG;
        x.addEventListener("click", () => { state.ratios.splice(i,1); save(); renderCols(); calc(); });
        col.appendChild(x);
      }
      colsEl.appendChild(col);
    });
    if(state.ratios.length < 8){
      const add = document.createElement("button");
      add.className = "addc";
      add.innerHTML = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8.5v7M8.5 12h7"/></svg>';
      add.addEventListener("click", () => {
        state.ratios.push(""); save(); renderCols(); calc();
      });
      colsEl.appendChild(add);
    }
  }

  // ---- 計算 ----
  function calc(){
    const total = parseFloat(state.total);
    const nums = state.ratios.map(r => parseFloat(r));
    const sum = nums.reduce((a,b) => a + (isFinite(b) && b > 0 ? b : 0), 0);
    const mult = parseFloat(state.mult);
    const okTotal = isFinite(total) && total > 0 && sum > 0;

    // 各色のグラム
    colsEl.querySelectorAll(".col .g").forEach((el, i) => {
      const r = nums[i];
      const ok = okTotal && isFinite(r) && r > 0;
      el.innerHTML = (ok ? fmt(total * r / sum) : "–") + "<small>g</small>";
      el.classList.toggle("off", !ok);
    });

    // 2剤
    const okDev = isFinite(total) && total > 0 && isFinite(mult) && mult > 0;
    const devG = okDev ? total * mult : NaN;
    $("devG").innerHTML = (okDev ? fmt(devG) : "–") + "<small>g</small>";
    $("devG").classList.toggle("off", !okDev);
    document.querySelectorAll("#pills button").forEach(b => {
      b.classList.toggle("on", isFinite(mult) && parseFloat(b.dataset.v) === mult);
    });

    // 合計
    const okSum = isFinite(total) && total > 0;
    $("sum1").textContent = okSum ? fmt(total) : "–";
    $("sum2").textContent = okDev ? fmt(devG) : "–";
    $("sumT").textContent = okSum ? fmt(total + (okDev ? devG : 0)) : "–";
    $("sumLine").classList.toggle("off", !okSum);
  }

  // ---- イベント ----
  $("totalG").value = state.total;
  $("totalG").addEventListener("input", e => { state.total = e.target.value; save(); calc(); });

  $("devMult").value = state.mult;
  $("devMult").addEventListener("input", e => { state.mult = e.target.value; save(); calc(); });

  document.querySelectorAll("#pills button").forEach(b => {
    b.addEventListener("click", () => {
      state.mult = b.dataset.v;
      $("devMult").value = state.mult;
      save(); calc();
    });
  });

  $("resetBtn").addEventListener("click", () => {
    state = { total:"", ratios:["",""], mult:"" };
    save();
    $("totalG").value = ""; $("devMult").value = "";
    renderCols(); calc();
  });

  renderCols();
  calc();
})();
</script>
<!-- tsumiki-back-button -->
<style>
  #tsumikiEdge{position:fixed; top:0; bottom:0; left:0; width:22px; z-index:999;}
  #tsumikiPeek{
    position:fixed; top:50%; left:0; z-index:1001; margin-top:-23px;
    width:46px; height:46px; display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.92);
    -webkit-backdrop-filter:saturate(180%) blur(14px); backdrop-filter:saturate(180%) blur(14px);
    border:1px solid rgba(0,0,0,.06); border-radius:50%;
    box-shadow:0 6px 20px rgba(0,0,0,.18);
    color:#0071e3; font-size:24px; font-weight:600; line-height:1;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Helvetica Neue",Arial,sans-serif;
    transform:translateX(-70px) scale(.8); opacity:0; pointer-events:none;
  }
</style>
<div id="tsumikiEdge"></div>
<div id="tsumikiPeek">‹</div>
<script>
  (function(){
    var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
      || window.navigator.standalone === true;
    var fromTsumiki = false;
    try{
      if(document.referrer){
        var r = new URL(document.referrer);
        fromTsumiki = (r.origin === location.origin);
      }
    }catch(e){}
    if(!(standalone && fromTsumiki)) return;

    var peek = document.getElementById('tsumikiPeek');
    var edge = document.getElementById('tsumikiEdge');

    function goBack(){ location.href = 'index.html'; }

    /* --- 左端エッジスワイプで戻る（iOS純正の戻る操作。見えるボタンは置かない） --- */
    var sx=0, sy=0, prog=0, dragging=false, W=window.innerWidth;
    var TRIGGER = Math.min(120, W*0.32);
    window.addEventListener('resize', function(){ W=window.innerWidth; TRIGGER=Math.min(120, W*0.32); });

    function reset(){
      dragging = false; prog = 0;
      peek.style.transition = 'transform .25s ease, opacity .25s ease';
      peek.style.transform = 'translateX(-70px) scale(.8)';
      peek.style.opacity = 0;
    }
    function start(e){
      var t = e.touches ? e.touches[0] : e;
      if(t.clientX > 26) return;
      sx = t.clientX; sy = t.clientY; prog = 0; dragging = true;
      peek.style.transition = 'none';
    }
    function move(e){
      if(!dragging) return;
      var t = e.touches ? e.touches[0] : e;
      var dx = t.clientX - sx, dy = t.clientY - sy;
      if(Math.abs(dy) > Math.abs(dx) + 12){ reset(); return; }
      if(dx < 0) dx = 0;
      prog = Math.min(dx / TRIGGER, 1);
      peek.style.transform = 'translateX(' + (-70 + prog*82) + 'px) scale(' + (0.8 + prog*0.2) + ')';
      peek.style.opacity = prog;
      if(dx > 6 && e.cancelable) e.preventDefault();
    }
    function end(){
      if(!dragging) return;
      dragging = false;
      if(prog >= 0.999){
        peek.style.transition = 'transform .25s ease, opacity .25s ease';
        peek.style.transform = 'translateX(20px) scale(1.05)';
        peek.style.opacity = 1;
        goBack();
      }else{
        reset();
      }
    }
    edge.addEventListener('touchstart', start, {passive:true});
    window.addEventListener('touchmove', move, {passive:false});
    window.addEventListener('touchend', end, {passive:true});
    window.addEventListener('touchcancel', end, {passive:true});
  })();
</script>
<!-- /tsumiki-back-button -->
</body>
</html>
