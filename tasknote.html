<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<link rel="apple-touch-icon" href="icons/icon-tasknote.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="たすくノート">
<meta name="theme-color" content="#ffffff">
<title>たすくノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff; --bg-soft:#fbfbfa; --panel:#ffffff; --card:#ffffff;
    --ink:#37352f; --sub:#060606; --faint:#9b9a97;
    --line:#ecebe9; --line-strong:#e0dfdc; --hover:#f1f1ef; --active:#e9e9e7;
    --accent:#2f80c2; --accent-2:#030709; /* 文字と塗りに使う濃い側 */ --accent-soft:#e7f0f7;
    --danger:#e03e3e;
    --shadow:0 8px 30px rgba(15,15,15,.12), 0 2px 8px rgba(15,15,15,.06);
    --radius:8px;
    /* priority */
    --pri-high:#e0574b; --pri-mid:#e5a13b; --pri-low:#7aa0bd;
    /* tag palette (light) */
    --c-gray-bg:#e3e2e0; --c-gray-tx:#4a4a47;
    --c-brown-bg:#eedfd8; --c-brown-tx:#7a4b39;
    --c-orange-bg:#fadec9; --c-orange-tx:#9a5b26; --c-orange-tx-ink:#895529; /* 洗い色の上に置く文字用の濃い側 */
    --c-yellow-bg:#fdecc8; --c-yellow-tx:#83671b;
    --c-green-bg:#dbeddb; --c-green-tx:#2e6b3e;
    --c-blue-bg:#d3e5ef; --c-blue-tx:#265f7d;
    --c-purple-bg:#e8deee; --c-purple-tx:#5b3b7a;
    --c-pink-bg:#f5e0e9; --c-pink-tx:#8a3b5c;
    --c-red-bg:#ffe2dd; --c-red-tx:#9a3b2e;
  }
  html[data-theme="dark"]{
    --bg:#191919; --bg-soft:#191919; --panel:#202020; --card:#202020;
    --ink:#e9e9e7; --sub:#9b9b9b; --faint:#6f6f6f;
    --line:#2b2b2b; --line-strong:#333; --hover:#252525; --active:#2e2e2e;
    --accent:#5a9bd8; --accent-soft:#22303d;
    --danger:#e56a6a;
    --shadow:0 10px 34px rgba(0,0,0,.5), 0 2px 10px rgba(0,0,0,.35);
    --pri-high:#e0574b; --pri-mid:#d9973a; --pri-low:#7f9fb8;
    --c-gray-bg:#5a5a5a; --c-gray-tx:#e4e4e4;
    --c-brown-bg:#5c4030; --c-brown-tx:#e6cdc0;
    --c-orange-bg:#603a1b; --c-orange-tx:#f2c79c;
    --c-yellow-bg:#5a4a1a; --c-yellow-tx:#efd68e;
    --c-green-bg:#1f3f2b; --c-green-tx:#a8d8b0;
    --c-blue-bg:#1c3a4d; --c-blue-tx:#a4cee2;
    --c-purple-bg:#3a2a4d; --c-purple-tx:#cbb0e2;
    --c-pink-bg:#4d2a38; --c-pink-tx:#e6adc6;
    --c-red-bg:#4d251e; --c-red-tx:#e6ab9f;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Helvetica Neue",Arial,sans-serif;
    background:var(--bg); color:var(--ink);
    -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
    line-height:1.55; overflow:hidden;
  }
  button{font-family:inherit; cursor:pointer; -webkit-appearance:none; appearance:none; border:none; background:none; color:inherit;}
  input,textarea{font-family:inherit; color:inherit;}
  ::-webkit-scrollbar{width:8px; height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line-strong); border-radius:8px;}
  ::-webkit-scrollbar-track{background:transparent;}

  #app{display:flex; flex-direction:column; height:100vh; height:100dvh;}

  /* ===== ヘッダー ===== */
  header{
    flex:0 0 auto; padding:env(safe-area-inset-top) 0 0;
    background:var(--bg); border-bottom:1px solid var(--line); z-index:20;
  }
  .hbar{display:flex; align-items:center; gap:10px; padding:12px 16px 10px;}
  .brand{display:flex; align-items:center; gap:9px; min-width:0;}
  .logo{width:26px; height:26px; border-radius:7px; flex:0 0 auto;
    background:linear-gradient(135deg,#3a86c8,#2f6ea8); position:relative; box-shadow:0 2px 6px rgba(47,110,168,.35);}
  .logo::before,.logo::after{content:""; position:absolute; background:#fff; border-radius:1.5px;}
  .logo::before{left:6px; top:7px; width:9px; height:2.4px; box-shadow:0 4.6px 0 rgba(255,255,255,.9), 0 9.2px 0 rgba(255,255,255,.9);}
  .logo::after{left:15px; top:6px; width:5px; height:5px; border-radius:50%; background:rgba(255,255,255,.95); box-shadow:0 9px 0 rgba(255,255,255,.6);}
  h1{font-size:17px; font-weight:700; letter-spacing:.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .hbar .spacer{flex:1;}
  .icon-btn{width:44px; height:44px; border-radius:8px; display:flex; align-items:center; justify-content:center;
    color:var(--sub); flex:0 0 auto; transition:background .12s;}
  .icon-btn:active{background:var(--active);}
  @media(hover:hover){ .icon-btn:hover{background:var(--hover); color:var(--ink);} }
  .icon-btn svg{width:20px; height:20px;}

  .sync{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; color:var(--sub);
    padding:4px 9px; border-radius:999px; background:var(--hover); white-space:nowrap;}
  .sync .dot{width:7px; height:7px; border-radius:50%; background:var(--faint);}
  .sync.ok .dot{background:#3fa34d;} .sync.off .dot{background:#d1a02a;} .sync.local .dot{background:var(--faint);}

  /* ツールバー */
  .toolbar{display:flex; align-items:center; gap:8px; padding:0 12px 10px;}
  .search{flex:1; display:flex; align-items:center; gap:7px; background:var(--hover); border-radius:8px; padding:0 11px; min-width:0;}
  .search svg{width:16px; height:16px; color:var(--faint); flex:0 0 auto;}
  .search input{flex:1; min-height:44px; border:none; background:none; outline:none; font-size:16px; min-width:0;}
  .search input::placeholder{color:var(--faint);}

  /* サマリー帯 */
  .summary{display:flex; gap:8px; padding:0 12px 10px; overflow-x:auto;}
  .summary::-webkit-scrollbar{display:none;}
  .sm{display:flex; align-items:center; gap:6px; min-height:44px; padding:6px 14px; border-radius:9px; font-size:12.5px; font-weight:500;
    color:var(--sub); background:var(--hover); white-space:nowrap; flex:0 0 auto; border:1px solid transparent;}
  .sm b{font-size:14px; font-weight:700; color:var(--ink);}
  .sm.zero{opacity:.5;}
  .sm.s-wait.on{background:var(--c-red-bg); color:var(--c-red-tx); border-color:transparent;} .sm.s-wait.on b{color:var(--c-red-tx);}
  .sm.s-over.on{background:var(--c-red-bg); color:var(--c-red-tx);} .sm.s-over.on b{color:var(--c-red-tx);}
  .sm.s-over b{color:var(--danger);}
  .sm:active{transform:scale(.96);}


  .toast-undo{margin-left:8px; min-height:44px; color:var(--accent-soft); font-weight:700; font-size:13.5px; background:none; padding:0 8px;}

  /* ===== メイン ===== */
  main{flex:1; overflow:hidden; position:relative;}
  .view{height:100%; overflow:auto; -webkit-overflow-scrolling:touch;}

  /* ---- 共通チップ ---- */
  .tagchip{font-size:11px; font-weight:500; padding:2px 8px; border-radius:5px; white-space:nowrap; max-width:120px; overflow:hidden; text-overflow:ellipsis;}
  .pri{display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:600;}
  .pri .pd{width:7px; height:7px; border-radius:50%;}
  .pri.high{color:var(--pri-high);} .pri.high .pd{background:var(--pri-high);}
  .pri.mid{color:var(--pri-mid);} .pri.mid .pd{background:var(--pri-mid);}
  .pri.low{color:var(--pri-low);} .pri.low .pd{background:var(--pri-low);}
  .due{display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:500; color:var(--sub);}
  .due svg{width:11px; height:11px;}
  .due.over{color:var(--danger);} .due.today{color:var(--accent);}

  /* ---- リスト ---- */
  .list{padding:8px 0 60px; max-width:760px; margin:0 auto;}
  .col-dot{width:9px; height:9px; border-radius:3px; flex:0 0 auto;}
  .col-name{font-size:13.5px; font-weight:600; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .col-count{font-size:12px; color:var(--faint); font-weight:500;}
  .src-dot{display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--accent); margin-right:6px; vertical-align:middle;}
  .lgroup{margin-bottom:6px;}
  .lgroup-head{display:flex; align-items:center; gap:8px; width:100%; min-height:44px; padding:8px 16px; text-align:left; position:sticky; top:0; background:var(--bg); z-index:2;}
  .lgroup-head .chev{width:16px; height:16px; color:var(--faint); transition:transform .15s; flex:0 0 auto;}
  .lgroup.collapsed .chev{transform:rotate(-90deg);}
  .lrows{display:flex; flex-direction:column;}
  .lgroup.collapsed .lrows{display:none;}
  .lrow{display:flex; align-items:flex-start; gap:2px; padding:2px 16px 2px 4px; border-top:1px solid var(--line); cursor:pointer;}
  .lrow:active{background:var(--hover);}
  .check{width:44px; height:44px; flex:0 0 auto; display:flex; align-items:center; justify-content:center;}
  .check i{width:20px; height:20px; border-radius:50%; border:1.6px solid var(--line-strong); display:flex; align-items:center; justify-content:center; transition:background .12s, border-color .12s;}
  .check svg{width:12px; height:12px; color:var(--bg); opacity:0; transition:opacity .12s;}
  .check.done i{background:var(--c-green-tx); border-color:var(--c-green-tx);}
  .check.done svg{opacity:1;}
  .l-body{flex:1; min-width:0; padding:11px 0 9px;}
  .lrow .l-title{font-size:15px; line-height:1.45; word-break:break-word;}
  .lrow .l-title.done{color:var(--faint); text-decoration:line-through;}
  .lrow .l-meta{display:flex; flex-wrap:wrap; align-items:center; gap:5px 8px; margin-top:5px;}
  .lrow .l-meta:empty{display:none;}

  /* 空状態 */
  .empty{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:60px 30px; text-align:center; color:var(--faint);}
  .empty .e-ill{width:56px; height:56px; color:var(--faint);}
  .empty .e-btn{display:inline-flex; align-items:center; gap:6px; min-height:44px; margin-top:6px; padding:0 18px; border-radius:8px; background:var(--accent-2); color:var(--bg); font-size:14px; font-weight:600;}
  .empty .e-btn svg{width:16px; height:16px;}

  /* ===== 詳細ページ（シート） ===== */
  .sheet{position:fixed; inset:0; z-index:100; background:var(--bg); display:flex; flex-direction:column;
    transform:translateY(100%); transition:transform .28s cubic-bezier(.32,.72,0,1); overscroll-behavior:contain;}
  .sheet.show{transform:translateY(0);}
  .sheet-bar{flex:0 0 auto; display:flex; align-items:center; gap:6px; padding:calc(env(safe-area-inset-top) + 8px) 10px 8px; border-bottom:1px solid var(--line);}
  .sheet-bar .sp{flex:1;}
  .page{flex:1; overflow:auto; -webkit-overflow-scrolling:touch; padding:18px 20px 120px; max-width:720px; width:100%; margin:0 auto;}
  .page-title{width:100%; min-height:44px; border:none; outline:none; background:none; resize:none; font-size:27px; font-weight:700;
    line-height:1.3; letter-spacing:.005em; overflow:hidden; margin-bottom:6px;}
  .page-title::placeholder{color:var(--faint);}
  .props{display:flex; flex-direction:column; gap:1px; margin:8px 0 4px;}
  .prop{display:flex; align-items:flex-start; gap:10px; padding:9px 6px; border-radius:6px; min-height:44px;}
  .prop:active{background:var(--hover);}
  .prop .p-label{display:flex; align-items:center; gap:7px; width:96px; flex:0 0 auto; color:var(--sub); font-size:13px; padding-top:3px;}
  .prop .p-label svg{width:15px; height:15px; color:var(--faint);}
  .prop .p-val{flex:1; display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:13.5px; min-height:24px; padding-top:1px;}
  .prop .p-val.empty-v{color:var(--faint);}
  .page-sep{height:1px; background:var(--line); margin:14px 0 6px;}

  /* 本文（読むだけ） */
  .blocks{display:flex; flex-direction:column; gap:2px;}
  .blk{display:flex; align-items:flex-start; gap:6px; padding:1px 0;}
  .blk-gutter{flex:0 0 auto; display:flex; align-items:flex-start; justify-content:center; padding-top:5px; min-width:22px;}
  .blk-text{flex:1; min-width:0; font-size:16px; line-height:1.6; padding:3px 2px; word-break:break-word; white-space:pre-wrap;}
  .blk[data-type="h1"] .blk-text{font-size:20px; font-weight:700; line-height:1.4; padding-top:8px;}
  .blk[data-type="h2"] .blk-text{font-size:17px; font-weight:600; line-height:1.45; padding-top:6px;}
  .blk[data-type="quote"]{border-left:3px solid var(--line-strong); padding-left:10px; margin:2px 0;}
  .blk[data-type="quote"] .blk-text{color:var(--sub);}
  .blk[data-type="bullet"] .blk-gutter::before{content:"•"; font-size:18px; color:var(--ink); line-height:1;}
  .blk-check{width:19px; height:19px; border-radius:4px; border:1.6px solid var(--line-strong); display:flex; align-items:center; justify-content:center;}
  .blk-check svg{width:12px; height:12px; color:var(--bg); opacity:0;}
  .blk-check.done{background:var(--accent); border-color:var(--accent);}
  .blk-check.done svg{opacity:1;}
  .blk-text.done{color:var(--faint); text-decoration:line-through;}
  .blk-divider{flex:1; height:1px; background:var(--line-strong); margin:10px 0;}

  /* ===== ポップオーバー / シート下部 ===== */
  .scrim{position:fixed; inset:0; z-index:200; background:rgba(0,0,0,.28); opacity:0; pointer-events:none; transition:opacity .2s;}
  .scrim.show{opacity:1; pointer-events:auto;}
  html[data-theme="dark"] .scrim{background:rgba(0,0,0,.5);}
  .popsheet{position:fixed; left:0; right:0; bottom:0; z-index:210; background:var(--panel);
    border-radius:16px 16px 0 0; box-shadow:var(--shadow); transform:translateY(100%);
    transition:transform .26s cubic-bezier(.32,.72,0,1); padding:8px 0 calc(env(safe-area-inset-bottom) + 14px);
    max-height:80vh; display:flex; flex-direction:column;}
  .popsheet.show{transform:translateY(0);}
  .ps-grab{width:36px; height:4px; border-radius:2px; background:var(--line-strong); margin:6px auto 4px;}
  .ps-title{font-size:13px; font-weight:600; color:var(--sub); padding:8px 20px 6px;}
  .ps-list{overflow:auto; -webkit-overflow-scrolling:touch; padding:4px 0;}
  .ps-item{display:flex; align-items:center; gap:12px; padding:12px 20px; font-size:15px;}
  .ps-item:active{background:var(--hover);}
  .ps-item .ic{width:22px; display:flex; justify-content:center; flex:0 0 auto; color:var(--sub);}
  .ps-item .ic svg{width:19px; height:19px;}
  .ps-item .sub{font-size:12px; color:var(--faint); margin-left:auto;}
  .ps-item.sel{background:var(--hover);}
  .ps-item .chk{margin-left:auto; color:var(--accent); opacity:0;}
  .ps-item .chk svg{width:18px; height:18px;}
  .ps-item.on .chk{opacity:1;}
  .swatch{width:16px; height:16px; border-radius:5px; flex:0 0 auto;}
  .ps-input-row{display:flex; gap:8px; padding:10px 16px 6px;}
  .ps-input-row input{flex:1; min-height:44px; border:1px solid var(--line-strong); border-radius:8px; padding:10px 12px; font-size:16px; outline:none; background:var(--bg);}
  .ps-input-row button{padding:0 16px; border-radius:8px; background:var(--accent-2); color:var(--bg); font-weight:600; font-size:14px;}
  .ps-danger{color:var(--danger);}
  .ps-danger .ic{color:var(--danger);}

  input[type="date"]{min-height:44px; border:1px solid var(--line-strong); border-radius:8px; padding:9px 12px; font-size:16px; background:var(--bg); outline:none; color:var(--ink);}

  /* トースト */
  .toast{position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 22px); transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:var(--bg); font-size:13.5px; font-weight:500; padding:11px 18px; border-radius:10px;
    box-shadow:var(--shadow); z-index:500; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; max-width:88vw; text-align:center;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .fab{position:fixed; right:18px; bottom:calc(env(safe-area-inset-bottom) + 18px); z-index:60;
    width:54px; height:54px; border-radius:16px; background:var(--accent-2); color:var(--bg);
    display:flex; align-items:center; justify-content:center; box-shadow:0 8px 22px rgba(47,110,168,.42);}
  .fab:active{transform:scale(.94);}
  .fab svg{width:26px; height:26px;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="hbar">
      <div class="brand">
        <div class="logo"></div>
        <h1>たすくノート</h1>
      </div>
      <div class="spacer"></div>
      <div class="sync local" id="syncChip"><span class="dot"></span><span id="syncText">…</span></div>
    </div>
    <div class="toolbar">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="searchInput" type="search" placeholder="検索" aria-label="検索" autocomplete="off">
      </div>
    </div>
    <div class="summary" id="summary"></div>
  </header>
  <main>
    <div class="view" id="viewRoot"></div>
  </main>
  <button class="fab" id="fab" title="追加" aria-label="追加">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>
</div>

<!-- 詳細ページ -->
<div class="sheet" id="sheet">
  <div class="sheet-bar">
    <button class="icon-btn" id="pageBack" aria-label="戻る">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="sp"></div>
    <button class="icon-btn" id="pageArchive"></button>
  </div>
  <div class="page" id="page"></div>
</div>

<div class="scrim" id="scrim"></div>
<div class="popsheet" id="pop">
  <div class="ps-grab"></div>
  <div id="popContent"></div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============================================================
   たすくノート — Claude と共有の「やること」一覧（単一HTML）
   ============================================================ */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const uid = () => 't' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const KEY = 'tasknoteDB';

/* ---- カラーパレット（Notion風10色） ---- */
const COLORS = ['gray','brown','orange','yellow','green','blue','purple','pink','red'];
const COLOR_NAME = {gray:'グレー',brown:'ブラウン',orange:'オレンジ',yellow:'イエロー',green:'グリーン',blue:'ブルー',purple:'パープル',pink:'ピンク',red:'レッド'};
const tagStyle = c => `background:var(--c-${c}-bg); color:var(--c-${c}-tx);`;

/* ---- SVGアイコン ---- */
const IC = {
  status:'<circle cx="12" cy="12" r="8"/>',
  flag:'<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>',
  clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 8v4.5l3 2"/>',
  tag:'<path d="M3 11.5V5a2 2 0 012-2h6.5L21 12.5 12.5 21z"/><circle cx="7.5" cy="7.5" r="1.4"/>',
  check:'<path d="M5 12l4 4L19 7"/>',
  box:'<path d="M3 8h18v11a1 1 0 01-1 1H4a1 1 0 01-1-1z"/><rect x="2" y="4" width="20" height="4" rx="1"/><path d="M10 12h4"/>',
  unbox:'<path d="M3 8h18v11a1 1 0 01-1 1H4a1 1 0 01-1-1z"/><rect x="2" y="4" width="20" height="4" rx="1"/><path d="M12 17v-5M9.5 14.5L12 12l2.5 2.5"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
};
const svg = (p,w) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w||2}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;

/* ---- 既定データ ---- */
function defaultDB(){
  return {
    columns:[
      {id:'waiting', name:'あなた待ち', color:'red',    done:false},

const STATE_TABLE='tasknote_state', STATE_ID='kodai';
let online=null, lastPushed=null, saveTimer=null;
// remoteLoaded＝この端末がクラウドの最新を一度でも読めたか／pendingRemote＝詳細を開いている間に届いたクラウドの中身
let remoteLoaded=false, pendingRemote=null;

function normalize(){
  if(!db.columns || !db.columns.length) db.columns = defaultDB().columns;
  if(!Array.isArray(db.tags)) db.tags=[];
  if(!Array.isArray(db.tasks)) db.tasks=[];
  if(!db.projects || typeof db.projects!=='object' || Array.isArray(db.projects)) db.projects={};
  if(!db.ui) db.ui={view:'board',theme:'auto'};
  const colIds = db.columns.map(c=>c.id);
  db.tasks.forEach(t=>{
    if(!t.id) t.id=uid();
    if(t.title===undefined) t.title='';
    if(!colIds.includes(t.status)) t.status=db.columns[0].id;
    if(!('priority' in t)) t.priority=null;
    // 想定外の優先度（外部ツールからの medium 等）はラベルが undefined になるので寄せる
    if(t.priority && !(t.priority in PRI_LABEL)) t.priority = {medium:'mid',middle:'mid',normal:'mid',none:null}[t.priority] || null;
    if(!('due' in t)) t.due=null;
    if(!Array.isArray(t.tags)) t.tags=[];
    if(!Array.isArray(t.body)) t.body=[];
    t.body.forEach(b=>{ if(!b.id)b.id=uid(); if(b.type===undefined)b.type='text'; if(b.text===undefined)b.text=''; });
    if(!t.created) t.created=Date.now();
    if(!t.updated) t.updated=Date.now();
  });
}
function loadLocal(){ try{ const s=localStorage.getItem(KEY); if(s){ db=Object.assign(defaultDB(), JSON.parse(s)); } }catch(e){} }
function save(){
  adoptPending();
  normalize();
  localStorage.setItem(KEY, JSON.stringify(db));
  if(!sb) return;
  // クラウドの最新をまだ読めていない端末からは送らない（古い中身で丸ごと上書きしないため）
  if(!remoteLoaded){ loadRemote(); return; }
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    const payload=JSON.stringify(db); lastPushed=payload;
    try{
      const {error}=await sb.from(STATE_TABLE).upsert({id:STATE_ID, state:db, updated_at:new Date().toISOString()});
      online = !error;
    }catch(e){ online=false; }
    renderSync();
  },350);
}
async function loadRemote(){
  if(!sb){ online=false; renderSync(); return; }
  try{
    const {data,error}=await sb.from(STATE_TABLE).select('state').eq('id',STATE_ID).maybeSingle();
    if(error){ online=false; renderSync(); return; }
    online=true; remoteLoaded=true;
    if(data && data.state && typeof data.state==='object'){
      applyRemote(data.state);
    }else{
      if(db.tasks.length) save();   // ローカルを種として送る
    }
  }catch(e){ online=false; }
  renderSync();
}
function subscribeRealtime(){
  if(!sb) return;
  sb.channel('tasknote-rt')
    .on('postgres_changes',{event:'*',schema:'public',table:STATE_TABLE,filter:'id=eq.'+STATE_ID},(payload)=>{
      const incoming=JSON.stringify((payload.new&&payload.new.state)||{});
      if(incoming===lastPushed) return;
      if(payload.new && payload.new.state) applyRemote(payload.new.state);
    }).subscribe();
}
// クラウドの中身を取り込む。詳細を開いている間は差し替えず、取っておいて保存・閉じるときに取り込む
function applyRemote(state){
  if(sheetOpen && curTask){ pendingRemote=state; return; }
  db=Object.assign(defaultDB(), state); normalize();
  localStorage.setItem(KEY, JSON.stringify(db));
  renderAll();
}
// 取っておいたクラウドの中身を db にする。この端末で直したカードだけは手元の版を差し込む
function adoptPending(){
  if(!pendingRemote) return;
  const state=pendingRemote; pendingRemote=null;
  const mine=curTask;
  db=Object.assign(defaultDB(), state); normalize();
  if(mine && !mine._new){
    const i=db.tasks.findIndex(t=>t.id===mine.id);
    if(pageDirty){ if(i>=0) db.tasks[i]=mine; else db.tasks.push(mine); }
    else if(i>=0) curTask=db.tasks[i];
  }
  localStorage.setItem(KEY, JSON.stringify(db));
}
function renderSync(){
  const chip=$('#syncChip'), txt=$('#syncText');
  chip.classList.remove('ok','off','local');
  if(!sb){ chip.classList.add('local'); txt.textContent='この端末に保存'; return; }
  if(online===true){ chip.classList.add('ok'); txt.textContent='同期中'; }
  else if(online===false){ chip.classList.add('off'); txt.textContent='オフライン'; }
  else { chip.classList.add('local'); txt.textContent='接続中'; }
}

/* ============================================================

   ============================================================ */
function colById(id){ return db.columns.find(c=>c.id===id) || db.columns[0]; }
function tagById(id){ return db.tags.find(t=>t.id===id); }
function isDoneStatus(sid){ const c=colById(sid); return c && c.done; }
function firstDoneCol(){ return (db.columns.find(c=>c.done)||db.columns[db.columns.length-1]).id; }
function firstOpenCol(){ return (db.columns.find(c=>!c.done)||db.columns[0]).id; }
// 手動で作る新規タスクの既定列（「あなた待ち」ではなく「やること」寄せ。無ければ最初の未完了列）
function defaultOpenCol(){ return db.columns.some(c=>c.id==='todo') ? 'todo' : firstOpenCol(); }

function fmtDue(iso){
  if(!iso) return '';
  const dt=new Date(iso+'T00:00:00'); const t=new Date(); t.setHours(0,0,0,0);
  const diff=Math.round((dt-t)/86400000);
  if(diff===0) return '今日';
  if(diff===1) return '明日';
  if(diff===-1) return '昨日';
  return (dt.getMonth()+1)+'/'+dt.getDate();
}
function dueClass(iso, sid){
  if(!iso) return '';
  if(isDoneStatus(sid)) return '';
  const dt=new Date(iso+'T00:00:00'); const t=new Date(); t.setHours(0,0,0,0);
  const diff=Math.round((dt-t)/86400000);
  if(diff<0) return 'over'; if(diff===0) return 'today'; return '';
}
const PRI_LABEL={high:'高',mid:'中',low:'低'};

function waitingColId(){ return db.columns.some(c=>c.id==='waiting') ? 'waiting' : firstOpenCol(); }
function dueDelta(iso){ if(!iso) return null; const dt=new Date(iso+'T00:00:00'); const t=new Date(); t.setHours(0,0,0,0); return Math.round((dt-t)/86400000); }
function isOverdue(t){ if(!t.due||isDoneStatus(t.status)) return false; return dueDelta(t.due)<0; }

// 並びは固定（2026-09）：期限が近い順（過ぎたものが先頭・期限なしは後ろ）→ 同じなら最近動いた順。完了は最近動いた順だけ
function sortTasks(list, done){
  const due=t=>t.due?dueDelta(t.due):Infinity;
  const upd=t=>t.updated||t.created||0;
  if(done) return list.slice().sort((a,b)=>upd(b)-upd(a));
  return list.slice().sort((a,b)=>(due(a)-due(b)) || (upd(b)-upd(a)));
}

/* アーカイブ＝「一旦しまった」カード。画面にも集計にも出さない（戻すのは tasknote_archive.py --unarchive） */
function liveTasks(){ return db.tasks.filter(t=>!t.archived); }

// 帯のタップと検索の絞り込みは、この端末のこの画面の中だけ（クラウドに書かない）
let quickFilter=null, searchQ='';
function visibleTasks(){
  const q=searchQ.trim().toLowerCase();
  const wcol=waitingColId();
  return liveTasks().filter(t=>{
    if(quickFilter==='waiting' && t.status!==wcol) return false;
    if(quickFilter==='overdue' && !isOverdue(t)) return false;
    if(q){
      const hay=(t.title+' '+t.body.map(b=>b.text).join(' ')).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

function lrowEl(t){

function showUndo(msg,cb){
  const el=$('#toast'); el.innerHTML=`${esc(msg)}<button class="toast-undo">元に戻す</button>`;

}
// 完了/未完了を切り替える。完了にしたら「元に戻す」を出す（戻すと元の列へ）。返信（reply）は付けない
function toggleDone(t){
  const prevStatus=t.status;
  const wasDone=isDoneStatus(prevStatus);
  t.status = wasDone ? defaultOpenCol() : firstDoneCol();
  t.updated=Date.now();
  save(); renderView();
  if(!wasDone) showUndo('完了', ()=>{
    const x=db.tasks.find(k=>k.id===t.id); if(!x) return;
    x.status=prevStatus; x.updated=Date.now(); save(); renderView();
  });
}

function openTask(id){
  if(id){ curTask=db.tasks.find(t=>t.id===id); if(!curTask) return; }
  else{
    const now=Date.now();
    curTask={id:uid(),title:'',status:defaultOpenCol(),priority:null,due:null,tags:[],body:[],created:now,updated:now,_new:true};

function commitNewIfNeeded(){
  if(curTask && curTask._new){
    const hasContent = curTask.title.trim() || curTask.body.some(b=>b.text&&b.text.trim());
    if(hasContent){ delete curTask._new; db.tasks.push(curTask); save(); }
  }else if(curTask && pageDirty){ save(); }   // 開いただけで閉じたら保存しない（古い中身で上書きしないため）
  pageDirty=false;
}

function pickStatus(){

function pickPriority(){
  const opts=[['high','高'],['mid','中'],['low','低'],[null,'なし']];
  let html=`<div class="ps-title">優先度</div><div class="ps-list">`;
  opts.forEach(([v,l])=>{ const dot=v?`<span class="pri ${v}"><span class="pd"></span></span>`:`<span class="swatch" style="background:var(--line-strong)"></span>`;

  $$('#popContent [data-p]').forEach(el=>el.onclick=()=>{ const v=el.dataset.p; curTask.priority=(v==='null')?null:v; touch(); closePop(); refreshProps(); });

function pickDue(){
  const cur=curTask.due||'';
  let html=`<div class="ps-title">期限</div><div class="ps-input-row"><input type="date" id="dueInput" value="${cur}"></div>
    <div class="ps-list"><div class="ps-item" id="dueClear" style="color:var(--danger)"><div class="ic">${svg(IC.x,2)}</div>期限をなしにする</div></div>`;
  openPop(html);
  $('#dueInput').addEventListener('change',e=>{ curTask.due=e.target.value||null; touch(); closePop(); refreshProps(); });
  $('#dueClear').onclick=()=>{ curTask.due=null; touch(); closePop(); refreshProps(); };

function pickTags(){
  const render=()=>{
    let html=`<div class="ps-title">タグ</div><div class="ps-list" id="tagList">`;
    db.tags.forEach(tg=>{ const on=curTask.tags.includes(tg.id);
      html+=`<div class="ps-item ${on?'on':''}" data-tg="${tg.id}"><span class="swatch" style="background:var(--c-${tg.color}-bg)"></span>${esc(tg.name)}<span class="chk">${svg(IC.check,2.4)}</span></div>`; });
    html+=`</div><div class="ps-input-row"><input id="newTag" placeholder="新しいタグを作成…" maxlength="20"><button id="newTagBtn">作成</button></div>`;
    $('#popContent').innerHTML=html;
    $$('#popContent [data-tg]').forEach(el=>el.onclick=()=>{
      const id=el.dataset.tg; const i=curTask.tags.indexOf(id);
      if(i>=0) curTask.tags.splice(i,1); else curTask.tags.push(id);
      touch(); render(); refreshProps();
    });
    $('#newTagBtn').onclick=addTag;
    $('#newTag').addEventListener('keydown',e=>{ if(e.key==='Enter') addTag(); });
    function addTag(){
      const v=$('#newTag').value.trim(); if(!v) return;
      const color=COLORS[db.tags.length % COLORS.length];
      const tg={id:uid(),name:v,color}; db.tags.push(tg); curTask.tags.push(tg.id); touch(); render(); refreshProps();
    }
  };
  openPop(''); render();
}

/* ============================================================
   ポップシート
   ============================================================ */
function openPop(html){ $('#popContent').innerHTML=html; $('#scrim').classList.add('show'); $('#pop').classList.add('show'); }
function closePop(){ $('#scrim').classList.remove('show'); $('#pop').classList.remove('show'); }

/* ============================================================
   トースト
   ============================================================ */
let toastT=null;
function toast(msg){ const el=$('#toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),1600); }


/* ============================================================
   イベント配線
   ============================================================ */
$('#fab').onclick=()=>openTask(null);
$('#pageBack').onclick=closeSheet;
$('#pageArchive').onclick=()=>{
  if(!curTask) return;
  const t=curTask, was=!!t.archived;
  t.archived = was ? undefined : true;
  if(!t.archived) delete t.archived;
  t.updated=Date.now();
  pageDirty=true; commitNewIfNeeded(); adoptPending();
  $('#sheet').classList.remove('show'); sheetOpen=false;
  setTimeout(()=>{ curTask=null; renderView(); },200);
  showUndo(was?'アーカイブから戻しました':'アーカイブしました', ()=>{
    const x=db.tasks.find(k=>k.id===t.id); if(!x) return;   // その間にクラウドから差し替わっていても、id で引き直す
    if(was) x.archived=true; else delete x.archived;
    x.updated=Date.now(); save(); renderView();
  });
};
$('#scrim').onclick=()=>{ closePop(); };
let searchT=null;
$('#searchInput').addEventListener('input',e=>{ searchQ=e.target.value; clearTimeout(searchT); searchT=setTimeout(()=>{ renderView(); },160); });
// 画面に戻ってきたら読み直す（開きっぱなしの古い画面から上書きしないため）
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) loadRemote(); });

/* 起動 */
function boot(){
  loadLocal();
  normalize();
  applyTheme();
  renderAll();
  renderSync();
  loadRemote();
  subscribeRealtime();
}
boot();
</script>
<!-- tsumiki-back-button -->
<style>
  #tsumikiEdge{position:fixed; top:0; bottom:0; left:0; width:22px; z-index:999;}
  #tsumikiPeek{
    position:fixed; top:50%; left:0; z-index:1001; margin-top:-23px;
    width:46px; height:46px; display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.92);
    -webkit-backdrop-filter:saturate(180%) blur(14px); backdrop-filter:saturate(180%) blur(14px);
    border:1px solid rgba(0,0,0,.06); border-radius:50%;
    box-shadow:0 6px 20px rgba(0,0,0,.18);
    color:#0071e3; font-size:24px; font-weight:600; line-height:1;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Helvetica Neue",Arial,sans-serif;
    transform:translateX(-70px) scale(.8); opacity:0; pointer-events:none;
  }
</style>
<div id="tsumikiEdge"></div>
<div id="tsumikiPeek">‹</div>
<script>
  (function(){
    var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
      || window.navigator.standalone === true;
    var fromTsumiki = false;
    try{
      if(document.referrer){
        var r = new URL(document.referrer);
        fromTsumiki = (r.origin === location.origin);
      }
    }catch(e){}
    if(!(standalone && fromTsumiki)) return;

    var peek = document.getElementById('tsumikiPeek');
    var edge = document.getElementById('tsumikiEdge');

    function goBack(){ location.href = 'index.html'; }

    /* --- 左端エッジスワイプで戻る（iOS純正の戻る操作。見えるボタンは置かない） --- */
    var sx=0, sy=0, prog=0, dragging=false, W=window.innerWidth;
    var TRIGGER = Math.min(120, W*0.32);
    window.addEventListener('resize', function(){ W=window.innerWidth; TRIGGER=Math.min(120, W*0.32); });

    function reset(){
      dragging = false; prog = 0;
      peek.style.transition = 'transform .25s ease, opacity .25s ease';
      peek.style.transform = 'translateX(-70px) scale(.8)';
      peek.style.opacity = 0;
    }
    function start(e){
      var t = e.touches ? e.touches[0] : e;
      if(t.clientX > 26) return;
      sx = t.clientX; sy = t.clientY; prog = 0; dragging = true;
      peek.style.transition = 'none';
    }
    function move(e){
      if(!dragging) return;
      var t = e.touches ? e.touches[0] : e;
      var dx = t.clientX - sx, dy = t.clientY - sy;
      if(Math.abs(dy) > Math.abs(dx) + 12){ reset(); return; }
      if(dx < 0) dx = 0;
      prog = Math.min(dx / TRIGGER, 1);
      peek.style.transform = 'translateX(' + (-70 + prog*82) + 'px) scale(' + (0.8 + prog*0.2) + ')';
      peek.style.opacity = prog;
      if(dx > 6 && e.cancelable) e.preventDefault();
    }
    function end(){
      if(!dragging) return;
      dragging = false;
      if(prog >= 0.999){
        peek.style.transition = 'transform .25s ease, opacity .25s ease';
        peek.style.transform = 'translateX(20px) scale(1.05)';
        peek.style.opacity = 1;
        goBack();
      }else{
        reset();
      }
    }
    edge.addEventListener('touchstart', start, {passive:true});
    window.addEventListener('touchmove', move, {passive:false});
    window.addEventListener('touchend', end, {passive:true});
    window.addEventListener('touchcancel', end, {passive:true});
  })();
</script>
<!-- /tsumiki-back-button -->
</body>
