<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<link rel="apple-touch-icon" href="icons/icon-hakari.png">
<meta name="apple-mobile-web-app-title" content="はかり">
<title>はかり — 食事と運動の記録</title>
<style>
  :root{
    --bg:#f5f5f7; --card:#ffffff; --ink:#1d1d1f; --sub:#6e6e73;
    --line:#e8e6e1; --accent:#3f8f6f; --accent-soft:#eaf4ef;
    --p:#c2584f; --f:#d99b3a; --c:#4a7fb5;
    --warn:#b46a12; --warn-soft:#fdf3e2;
    --radius:20px;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{overscroll-behavior-y:none;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Helvetica Neue",Arial,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.6;
    padding:env(safe-area-inset-top) 0 calc(86px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:680px; margin:0 auto; padding:0 16px;}

  /* ===== ヘッダー ===== */
  header{padding:26px 4px 8px; text-align:center; position:relative;}
  h1{font-size:26px; font-weight:700; letter-spacing:-.02em;}
  .tagline{color:var(--sub); font-size:12.5px; margin-top:3px;}
  .cloud{position:absolute; top:30px; right:6px; display:flex; align-items:center; gap:5px;
    font-size:11px; color:var(--sub);}
  .cloud .dot{width:8px; height:8px; border-radius:50%; background:#34c759;}
  .cloud .dot.off{background:#c7c7cc;}

  /* ===== タブ ===== */
  .tab{display:none;}
  .tab.on{display:block;}
  .tabbar{position:fixed; left:0; right:0; bottom:0; z-index:45;
    display:flex; background:rgba(255,255,255,.92); backdrop-filter:blur(12px);
    border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom);}
  .tabbar button{flex:1; border:none; background:none; cursor:pointer; padding:8px 2px 9px;
    display:flex; flex-direction:column; align-items:center; gap:2px;
    font-size:10.5px; font-weight:600; color:var(--sub); font-family:inherit;}
  .tabbar button .ti{font-size:20px; line-height:1.15;}
  .tabbar button.on{color:var(--accent);}

  /* ===== 共通パーツ ===== */
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; margin-top:12px;}
  .sec-head{display:flex; align-items:baseline; gap:8px; margin:22px 2px 8px;}
  .sec-head h2{font-size:15px; font-weight:700;}
  .sec-head .sh-sub{margin-left:auto; font-size:12px; color:var(--sub);}
  .btn{border:none; border-radius:12px; font-size:14px; font-weight:600; cursor:pointer;
    padding:11px 16px; font-family:inherit; transition:transform .1s ease;}
  .btn:active{transform:scale(.97);}
  .btn.primary{background:var(--accent); color:#fff;}
  .btn.sub{background:var(--card); color:var(--ink); border:1px solid var(--line);}
  .btn.danger{background:#fbeceb; color:#c2584f;}
  .btn:disabled{opacity:.5;}
  .bigbtn{width:100%; margin-top:10px; padding:14px; border-radius:16px; border:none;
    font-size:15px; font-weight:700; font-family:inherit; cursor:pointer;
    background:var(--accent); color:#fff; transition:transform .1s ease;}
  .bigbtn:active{transform:scale(.98);}
  .bigbtn.ghost{background:var(--card); color:var(--accent); border:1px solid var(--line);}
  .muted{color:var(--sub); font-size:12.5px;}
  .row{display:flex; align-items:center; gap:10px;}

  /* ===== 日付ナビ ===== */
  .datenav{display:flex; align-items:center; gap:6px; margin-top:14px;}
  .datenav .dn{flex:1; text-align:center; font-size:15px; font-weight:700;}
  .datenav button{border:1px solid var(--line); background:var(--card); color:var(--sub);
    width:38px; height:38px; border-radius:12px; font-size:16px; cursor:pointer; flex:0 0 auto;}
  .datenav button:disabled{opacity:.3;}
  .datenav .today-btn{width:auto; padding:0 12px; font-size:12.5px; font-weight:600;}

  /* ===== リング ===== */
  .ring-card{display:flex; align-items:center; gap:16px;}
  .ring{position:relative; flex:0 0 auto; width:124px; height:124px;}
  .ring svg{transform:rotate(-90deg);}
  .ring .rc{position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;}
  .ring .rn{font-size:27px; font-weight:700; letter-spacing:-.03em; line-height:1.1;}
  .ring .rl{font-size:10.5px; color:var(--sub); margin-top:1px;}
  .ring.over .rn{color:var(--p);}
  .kbreak{flex:1; min-width:0; display:flex; flex-direction:column; gap:7px;}
  .kbreak .kb{display:flex; align-items:baseline; gap:6px; font-size:12.5px; color:var(--sub);}
  .kbreak .kb b{margin-left:auto; font-size:14.5px; font-weight:700; color:var(--ink);
    font-variant-numeric:tabular-nums;}
  .kbreak .kb.eat b{color:var(--ink);}
  .kbreak .kb.burn b{color:var(--accent);}
  .kbreak hr{border:none; border-top:1px solid var(--line); margin:1px 0;}

  /* ===== PFCバー ===== */
  .macros{display:flex; flex-direction:column; gap:11px;}
  .mac .mt{display:flex; align-items:baseline; font-size:12px; color:var(--sub); margin-bottom:4px;}
  .mac .mt b{margin-left:auto; color:var(--ink); font-size:13px; font-variant-numeric:tabular-nums;}
  .mac .mt .mg{font-weight:400; color:var(--sub); font-size:11.5px; margin-left:3px;}
  .bar{height:8px; border-radius:5px; background:#eeece8; overflow:hidden;}
  .bar span{display:block; height:100%; border-radius:5px; transition:width .3s ease;}

  /* ===== 体重 ===== */
  .wcard{display:flex; align-items:center; gap:12px;}
  .wcard .wl{font-size:12.5px; color:var(--sub); flex:0 0 auto;}
  .wcard input{width:96px; font-size:19px; font-weight:700; padding:8px 10px; text-align:right;
    border:1px solid var(--line); border-radius:12px; background:var(--bg); color:var(--ink);
    font-family:inherit; font-variant-numeric:tabular-nums;}
  .wcard .wu{font-size:13px; color:var(--sub); flex:0 0 auto; margin-left:-4px;}
  .wcard .wd{margin-left:auto; font-size:12px; color:var(--sub); text-align:right; line-height:1.45;}
  .wcard .wd b{display:block; font-size:13px; font-weight:700;}
  .wd .dn-{color:var(--accent);} .wd .up-{color:var(--p);}

  /* ===== 記録リスト ===== */
  .slot{margin-top:10px;}
  .slot-h{font-size:12px; font-weight:700; color:var(--sub); margin:0 2px 5px; display:flex;}
  .slot-h span{margin-left:auto; font-weight:600; font-variant-numeric:tabular-nums;}
  .item{background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:11px 13px; margin-bottom:7px; cursor:pointer; transition:transform .1s ease;}
  .item:active{transform:scale(.99);}
  .item .it-1{display:flex; align-items:baseline; gap:8px;}
  .item .it-n{font-size:14px; font-weight:600; flex:1; min-width:0; word-break:break-word;}
  .item .it-k{font-size:14px; font-weight:700; flex:0 0 auto; font-variant-numeric:tabular-nums;}
  .item .it-2{display:flex; gap:9px; margin-top:3px; font-size:11.5px; color:var(--sub); flex-wrap:wrap;}
  .item .it-2 .pf{font-variant-numeric:tabular-nums;}
  .item .it-2 .amt{flex:1; min-width:0;}
  .item.ex .it-k{color:var(--accent);}
  .empty-s{text-align:center; padding:18px 10px; color:var(--sub); font-size:12.5px;}

  /* ===== オーバーレイ／シート ===== */
  .ov{position:fixed; inset:0; background:rgba(0,0,0,.34); backdrop-filter:blur(2px);
    z-index:50; display:none; align-items:flex-end; justify-content:center;}
  .ov.on{display:flex;}
  .sheet{background:var(--bg); width:100%; max-width:680px; max-height:92vh; overflow-y:auto;
    border-radius:22px 22px 0 0; padding:8px 18px calc(28px + env(safe-area-inset-bottom));
    -webkit-overflow-scrolling:touch; animation:up .26s cubic-bezier(.2,.8,.2,1);}
  @keyframes up{from{transform:translateY(100%);} to{transform:translateY(0);}}
  .grab{width:38px; height:5px; border-radius:3px; background:#d3d1cc; margin:8px auto 4px;}
  .sheet-head{display:flex; align-items:center; gap:10px; padding:6px 0 14px; position:sticky; top:0;
    background:var(--bg); z-index:2;}
  .sheet-head h2{font-size:18px; font-weight:700; flex:1;}
  .x{border:none; background:#e8e6e1; color:#555; width:32px; height:32px; border-radius:50%;
    font-size:17px; cursor:pointer; flex:0 0 auto; font-family:inherit;}
  .x:active{transform:scale(.9);}

  /* ===== フォーム ===== */
  .fld{margin-bottom:15px;}
  .fld label{display:block; font-size:12.5px; font-weight:600; color:var(--sub); margin-bottom:7px;}
  .fld input[type=text], .fld input[type=number], .fld input[type=date], .fld textarea, .fld select{
    width:100%; font-size:16px; padding:11px 13px; border:1px solid var(--line);
    border-radius:12px; background:var(--card); color:var(--ink); font-family:inherit; line-height:1.5;
    -webkit-appearance:none; appearance:none;}
  .fld textarea{resize:vertical; min-height:92px;}
  .fld select{background-image:linear-gradient(45deg,transparent 50%,var(--sub) 50%),linear-gradient(135deg,var(--sub) 50%,transparent 50%);
    background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%; background-size:5px 5px,5px 5px;
    background-repeat:no-repeat; padding-right:36px;}
  .fld .hint{font-size:11.5px; color:var(--sub); margin-top:6px; line-height:1.55;}
  .chips{display:flex; flex-wrap:wrap; gap:7px;}
  .chip{font-size:13.5px; font-weight:600; color:var(--sub); background:var(--card);
    border:1px solid var(--line); border-radius:999px; padding:8px 14px; cursor:pointer;
    transition:transform .1s ease; font-family:inherit;}
  .chip:active{transform:scale(.95);}
  .chip.on{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btnrow{display:flex; gap:8px; margin-top:4px;}
  .btnrow .btn{flex:1;}

  /* ===== AI確認 ===== */
  .conf{background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:12px 13px; margin-bottom:9px;}
  .conf .cn{display:flex; gap:8px; align-items:center; margin-bottom:8px;}
  .conf .cn input{flex:1; min-width:0; font-size:15px; font-weight:600; padding:7px 10px;
    border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--ink);
    font-family:inherit;}
  .conf .cn .del{border:none; background:none; color:var(--sub); font-size:17px; cursor:pointer;
    flex:0 0 auto; width:30px; height:30px; border-radius:50%;}
  .conf .camt{font-size:11.5px; color:var(--sub); margin:-3px 0 8px 2px;}
  .nums{display:grid; grid-template-columns:repeat(4,1fr); gap:7px;}
  .nums .nu{display:flex; flex-direction:column; gap:3px;}
  .nums .nu label{font-size:10.5px; font-weight:600; color:var(--sub); text-align:center;}
  .nums .nu input{width:100%; font-size:16px; padding:7px 4px; text-align:center;
    border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--ink);
    font-family:inherit; font-variant-numeric:tabular-nums; -webkit-appearance:none; appearance:none;}
  .nums .nu.kc input{font-weight:700;}
  .nums .nu.pp label{color:var(--p);} .nums .nu.ff label{color:var(--f);} .nums .nu.cc label{color:var(--c);}
  .badge{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600;
    border-radius:999px; padding:5px 11px;}
  .badge.hi{background:var(--accent-soft); color:var(--accent);}
  .badge.mid{background:var(--warn-soft); color:var(--warn);}
  .badge.lo{background:#fbeceb; color:var(--p);}
  .notebox{background:var(--warn-soft); border-radius:12px; padding:10px 12px; margin-bottom:12px;
    font-size:12.5px; color:#6a4a12; line-height:1.6;}
  .loading{text-align:center; padding:34px 12px; color:var(--sub); font-size:13.5px;}
  .loading .sp{display:inline-block; width:22px; height:22px; border:2.5px solid var(--line);
    border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite; margin-bottom:10px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .errbox{background:#fbeceb; color:#8d3a33; border-radius:12px; padding:12px;
    font-size:12.5px; line-height:1.6; margin-bottom:12px;}

  /* ===== マイ料理 ===== */
  .dish{background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:13px 14px; margin-bottom:8px; cursor:pointer; transition:transform .1s ease;}
  .dish:active{transform:scale(.99);}
  .dish .dn{font-size:14.5px; font-weight:700; display:flex; align-items:baseline; gap:8px;}
  .dish .dn b{margin-left:auto; font-variant-numeric:tabular-nums; white-space:nowrap; flex:0 0 auto;}
  .dish .dn span.nm{flex:1; min-width:0; word-break:break-word;}
  .dish .dd{font-size:11.5px; color:var(--sub); margin-top:3px; font-variant-numeric:tabular-nums;}
  .dish .dd .used{margin-left:8px;}

  /* ===== グラフ ===== */
  /* ===== 手順リスト ===== */
  .steps{margin-top:12px; display:flex; flex-direction:column; gap:8px;}
  .step{display:flex; gap:9px; font-size:12.5px; color:var(--ink); line-height:1.55;}
  .step i{flex:0 0 auto; width:19px; height:19px; border-radius:50%; background:var(--accent-soft);
    color:var(--accent); font-style:normal; font-size:11px; font-weight:700;
    display:flex; align-items:center; justify-content:center; margin-top:2px;}
  .step code{background:var(--bg); border-radius:5px; padding:1px 5px; font-size:11.5px; white-space:nowrap;}
  /* ===== 取り込みプレビュー ===== */
  .found{margin-top:14px; background:var(--bg); border-radius:14px; padding:12px 13px;}
  .found .fr{display:flex; align-items:baseline; gap:8px; font-size:12.5px; color:var(--sub);
    padding:5px 0; border-bottom:1px solid var(--line);}
  .found .fr:last-child{border-bottom:none;}
  .found .fr b{margin-left:auto; color:var(--ink); font-size:13.5px; font-variant-numeric:tabular-nums;
    text-align:right;}
  .found .fr.none b{color:var(--sub); font-weight:400;}

  .chart{width:100%; display:block;}
  .chart-legend{display:flex; gap:14px; font-size:11.5px; color:var(--sub); margin-top:8px; flex-wrap:wrap;}
  .chart-legend i{display:inline-block; width:14px; height:3px; border-radius:2px; vertical-align:middle; margin-right:5px;}
  .stats{display:grid; grid-template-columns:repeat(4,1fr); gap:7px; margin-top:12px;}
  .stat{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:11px 4px; text-align:center;}
  .stat .sv{font-size:18px; font-weight:700; letter-spacing:-.03em; font-variant-numeric:tabular-nums;}
  .stat .sl{font-size:10.5px; color:var(--sub); margin-top:2px; line-height:1.35;}

  /* ===== トースト ===== */
  .toast{position:fixed; left:50%; bottom:calc(96px + env(safe-area-inset-bottom));
    transform:translateX(-50%) translateY(14px); background:#1d1d1f; color:#fff;
    font-size:13px; padding:10px 18px; border-radius:999px; opacity:0; pointer-events:none;
    transition:opacity .2s ease, transform .2s ease; z-index:60; max-width:88vw; text-align:center;}
  .toast.show{opacity:.94; transform:translateX(-50%) translateY(0);}

  @media(min-width:520px){ .nums{grid-template-columns:repeat(4,1fr);} }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>はかり</h1>
    <div class="cloud"><span class="dot off" id="cdot"></span><span id="ctxt">…</span></div>
  </header>

  <!-- ============ 今日 ============ -->
  <section class="tab on" id="tab-today">
    <div class="datenav">
      <button onclick="shiftDay(-1)" aria-label="前の日">‹</button>
      <div class="dn" id="dnLabel">—</div>
      <button onclick="shiftDay(1)" id="dnNext" aria-label="次の日">›</button>
      <button class="today-btn" onclick="goToday()">今日</button>
    </div>

    <div class="card ring-card">
      <div class="ring" id="ring">
        <svg width="124" height="124" viewBox="0 0 124 124">
          <circle cx="62" cy="62" r="53" fill="none" stroke="#eeece8" stroke-width="13"/>
          <circle cx="62" cy="62" r="53" fill="none" stroke="var(--accent)" stroke-width="13"
                  stroke-linecap="round" id="ringArc" stroke-dasharray="0 999"/>
        </svg>
        <div class="rc"><div class="rn" id="ringNum">—</div><div class="rl" id="ringLbl">残り</div></div>
      </div>
      <div class="kbreak">
        <div class="kb"><span>目標</span><b id="kGoal">—</b></div>
        <div class="kb eat"><span>食べた</span><b id="kEat">0</b></div>
        <div class="kb burn"><span id="kBurnL">動いた</span><b id="kBurn">0</b></div>
        <hr>
        <div class="kb"><span id="kRestL">残り</span><b id="kRest">—</b></div>
      </div>
    </div>

    <div class="card macros" id="macros"></div>

    <div class="card wcard">
      <span class="wl">体重</span>
      <input type="number" inputmode="decimal" step="0.1" id="wInput" placeholder="—">
      <span class="wu">kg</span>
      <div class="wd" id="wDelta"></div>
    </div>

    <div class="sec-head"><h2>食事</h2><span class="sh-sub" id="mealSum"></span></div>
    <div id="mealList"></div>
    <button class="bigbtn" onclick="openMeal()">🍚 食事を記録</button>

    <div class="sec-head"><h2>運動</h2><span class="sh-sub" id="exSum"></span></div>
    <div id="exList"></div>
    <button class="bigbtn ghost" onclick="openEx()">🏃 運動を記録</button>
  </section>

  <!-- ============ 記録 ============ -->
  <section class="tab" id="tab-log">
    <div class="stats" id="logStats"></div>

    <div class="sec-head"><h2>体重の推移</h2><span class="sh-sub" id="wRange"></span></div>
    <div class="card">
      <svg class="chart" id="wChart" viewBox="0 0 320 150" preserveAspectRatio="none" height="150"></svg>
      <div class="chart-legend">
        <span><i style="background:#c9c7c2"></i>実測</span>
        <span><i style="background:var(--accent)"></i>7日平均</span>
      </div>
    </div>
    <div class="chips" style="margin-top:10px">
      <button class="chip" data-span="30" onclick="setSpan(30)">30日</button>
      <button class="chip" data-span="90" onclick="setSpan(90)">90日</button>
      <button class="chip" data-span="365" onclick="setSpan(365)">全期間</button>
    </div>

    <div class="sec-head"><h2>1日のカロリー収支</h2><span class="sh-sub">直近14日</span></div>
    <div class="card">
      <svg class="chart" id="kChart" viewBox="0 0 320 140" preserveAspectRatio="none" height="140"></svg>
      <div class="chart-legend">
        <span><i style="background:var(--accent)"></i>目標内</span>
        <span><i style="background:var(--p)"></i>目標超過</span>
        <span><i style="background:#1d1d1f"></i>目標線</span>
      </div>
    </div>
  </section>

  <!-- ============ マイ料理 ============ -->
  <section class="tab" id="tab-dish">
    <button class="bigbtn" style="margin-top:12px" onclick="openDish()">＋ 料理を登録</button>
    <div class="sec-head"><h2>登録した料理</h2><span class="sh-sub" id="dishCount"></span></div>
    <div id="dishList"></div>
  </section>

  <!-- ============ 設定 ============ -->
  <section class="tab" id="tab-set">
    <div class="sec-head" style="margin-top:14px"><h2>体のこと</h2></div>
    <div class="card">
      <div class="fld"><label>性別</label>
        <select id="sSex"><option value="m">男性</option><option value="f">女性</option></select></div>
      <div class="fld"><label>年齢</label>
        <input type="number" inputmode="numeric" id="sAge" placeholder="30"></div>
      <div class="fld"><label>身長（cm）</label>
        <input type="number" inputmode="decimal" step="0.1" id="sHeight" placeholder="170"></div>
      <div class="fld" style="margin-bottom:0"><label>普段の活動量</label>
        <select id="sAct">
          <option value="1.2">ほとんど座って過ごす</option>
          <option value="1.375">週1〜3回かるく動く</option>
          <option value="1.55">週3〜5回しっかり動く</option>
          <option value="1.725">毎日よく動く・立ち仕事</option>
        </select>
        <div class="hint">運動を記録する前の、普段の生活だけ</div>
      </div>
    </div>

    <div class="sec-head"><h2>目標</h2></div>
    <div class="card">
      <div class="fld"><label>目標体重（kg）</label>
        <input type="number" inputmode="decimal" step="0.1" id="sGoalW" placeholder="65"></div>
      <div class="fld"><label>減らすペース</label>
        <select id="sPace">
          <option value="0.25">週 0.25 kg</option>
          <option value="0.5">週 0.5 kg</option>
          <option value="0.75">週 0.75 kg</option>
          <option value="1">週 1 kg</option>
        </select>
      </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ================= Supabase（つみき共通プロジェクト・はかり専用テーブル） ================= */
const SUPABASE_URL  = 'https://okbjqtdirrathscctyvx.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9rYmpxdGRpcnJhdGhzY2N0eXZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzMjI4NTIsImV4cCI6MjA5NTg5ODg1Mn0.T-1AOK6vCD6uGdqrVGXjPui3L6WPSNrnygS-IHyfZ6Y';
const sb = (window.supabase && window.supabase.createClient) ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON) : null;
const STATE_TABLE = 'hakari_state';
const STATE_ID = 'main';
const LS_KEY = 'hakari_db_v1';
const AI_URL = SUPABASE_URL + '/functions/v1/hakari-ai';

/* ================= 状態 ================= */
const DEFAULT_PROFILE = {
  sex:'m', age:30, height:170, act:1.375,
  goalW:null, pace:0.5, countEx:1, pkg:2.0, fpct:25
};
let db = { v:1, profile:{...DEFAULT_PROFILE}, weights:[], meals:[], workouts:[], dishes:[], updatedAt:0 };
let online=null, pendingSync=false, saveTimer=null, lastPushed=null;
let curDate = todayYmd();
let curTab = 'today';
let logSpan = 30;
let wSaveTimer = null;

const SLOTS = [{k:'朝',e:'🌅'},{k:'昼',e:'☀️'},{k:'夜',e:'🌙'},{k:'間食',e:'🍪'}];

/* ================= ユーティリティ ================= */
const $  = s=>document.querySelector(s);
const $$ = s=>Array.from(document.querySelectorAll(s));
const uid = ()=> Date.now().toString(36) + Math.random().toString(36).slice(2,7);
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1900);}
function todayYmd(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function ymdShift(ymd,n){const [y,m,d]=ymd.split('-').map(Number);const dt=new Date(y,m-1,d);dt.setDate(dt.getDate()+n);
  return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');}
function fmtDay(ymd){const [y,m,d]=ymd.split('-').map(Number);const dt=new Date(y,m-1,d);
  const w='日月火水木金土'[dt.getDay()];
  if(ymd===todayYmd()) return '今日 '+m+'月'+d+'日('+w+')';
  if(ymd===ymdShift(todayYmd(),-1)) return '昨日 '+m+'月'+d+'日('+w+')';
  return m+'月'+d+'日('+w+')';}
function fmtShort(ymd){const [,m,d]=ymd.split('-').map(Number);return m+'/'+d;}
function n0(v){const n=Number(v);return Number.isFinite(n)?n:0;}
function r1(n){return Math.round(n*10)/10;}
function autoSlot(){const h=new Date().getHours(); return h<10?'朝':h<15?'昼':h<21?'夜':'間食';}

/* ================= クラウド同期 ================= */
function normalize(){
  if(!db || typeof db!=='object') db={};
  db.profile = Object.assign({}, DEFAULT_PROFILE, db.profile||{});
  ['weights','meals','workouts','dishes'].forEach(k=>{ if(!Array.isArray(db[k])) db[k]=[]; });
  db.v = 1;
}
function loadLocal(){ try{ const s=localStorage.getItem(LS_KEY); if(s) db=JSON.parse(s); }catch(e){} normalize(); }
function renderCloud(){ const dot=$('#cdot'), txt=$('#ctxt');
  if(online===true){ dot.classList.remove('off'); txt.textContent='同期'; }
  else { dot.classList.add('off'); txt.textContent = online===false?'この端末':'…'; }
}
function save(){
  db.updatedAt = Date.now();
  normalize();
  try{ localStorage.setItem(LS_KEY, JSON.stringify(db)); }catch(e){}
  if(!sb) return;
  pendingSync=true; clearTimeout(saveTimer); saveTimer=setTimeout(flushSave,350);
}
async function flushSave(){
  if(!sb || !pendingSync) return;
  clearTimeout(saveTimer);
  lastPushed = JSON.stringify(db); pendingSync=false;
  try{
    const { error } = await sb.from(STATE_TABLE).upsert({ id:STATE_ID, state:db, updated_at:new Date().toISOString() });
    if(error){ online=false; pendingSync=true; } else { online=true; }
  }catch(e){ online=false; pendingSync=true; }
  renderCloud();
}
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') flushSave(); });
window.addEventListener('pagehide', ()=>{ flushSave(); });

async function loadRemote(){
  if(!sb){ online=false; renderCloud(); return; }
  try{
    const { data, error } = await sb.from(STATE_TABLE).select('state').eq('id', STATE_ID).maybeSingle();
    if(error){ online=false; renderCloud(); return; }
    online=true;
    if(data && data.state && typeof data.state==='object'){
      const remote = data.state;
      const localT = db.updatedAt||0, remoteT = remote.updatedAt||0;
      if(remoteT >= localT){ db = remote; normalize(); try{localStorage.setItem(LS_KEY, JSON.stringify(db));}catch(e){} }
      else { save(); }
    }
  }catch(e){ online=false; }
  renderCloud(); renderAll();
}
function anySheetOpen(){ return $$('.ov.on').length > 0; }
function subscribeRealtime(){
  if(!sb) return;
  sb.channel('hakari-rt')
    .on('postgres_changes', { event:'*', schema:'public', table:STATE_TABLE, filter:'id=eq.'+STATE_ID },
      (payload)=>{
        const incoming = payload.new && payload.new.state;
        if(!incoming) return;
        if(JSON.stringify(incoming)===lastPushed) return;   // 自分の書き込みのエコー
        if(anySheetOpen()) return;                          // 入力中は上書きしない
        if(document.activeElement === $('#wInput')) return; // 体重入力中も守る
        if((incoming.updatedAt||0) < (db.updatedAt||0)) return;
        db = incoming; normalize();
        try{localStorage.setItem(LS_KEY, JSON.stringify(db));}catch(e){}
        renderAll(); toast('🔄 別の端末の記録を取り込みました');
      }).subscribe();
}

/* ================= 計算 ================= */
function latestWeight(upto){
  const list = db.weights.filter(w=> !upto || w.d<=upto).sort((a,b)=> a.d<b.d?1:-1);
  return list.length ? list[0].kg : null;
}
function weightOn(ymd){ const w = db.weights.find(w=>w.d===ymd); return w? w.kg : null; }
function latestFat(){
  const list = db.weights.filter(w=> w.fat != null).sort((a,b)=> a.d<b.d?1:-1);
  return list.length ? list[0].fat : null;
}
function bmr(w){
  const p = db.profile;
  const base = 10*w + 6.25*n0(p.height) - 5*n0(p.age);
  return p.sex==='f' ? base-161 : base+5;
}
function targets(){
  const p = db.profile;
  const w = latestWeight() || 65;
  const b = bmr(w);
  const tdee = b * n0(p.act||1.375);
  const deficit = n0(p.pace) * 7200 / 7;
  let goal = tdee - deficit;
  const floor = Math.max(b, p.sex==='f' ? 1200 : 1500);   // 安全下限
  const clamped = goal < floor;
  if(clamped) goal = floor;
  goal = Math.round(goal);
  const pg = r1(w * n0(p.pkg||2.0));
  const fg = r1(goal * n0(p.fpct||25) / 100 / 9);
  const cg = Math.max(0, r1((goal - pg*4 - fg*9) / 4));
  return { w, bmr:Math.round(b), tdee:Math.round(tdee), deficit:Math.round(deficit), goal, pg, fg, cg, clamped, floor:Math.round(floor) };
}
function dayMeals(ymd){ return db.meals.filter(m=>m.d===ymd); }
function dayWorkouts(ymd){ return db.workouts.filter(x=>x.d===ymd); }
function dayTotals(ymd){
  const t = {kcal:0,p:0,f:0,c:0};
  dayMeals(ymd).forEach(m=>{ t.kcal+=n0(m.kcal); t.p+=n0(m.p); t.f+=n0(m.f); t.c+=n0(m.c); });
  t.p=r1(t.p); t.f=r1(t.f); t.c=r1(t.c);
  t.burn = dayWorkouts(ymd).reduce((s,x)=>s+n0(x.kcal),0);
  return t;
}

/* ================= 描画：今日 ================= */
function renderToday(){
  $('#dnLabel').textContent = fmtDay(curDate);
  $('#dnNext').disabled = curDate >= todayYmd();

  const T = targets();
  const t = dayTotals(curDate);
  const countEx = String(db.profile.countEx)==='1';
  const allow = T.goal + (countEx ? t.burn : 0);
  const rest = allow - t.kcal;

  $('#kGoal').textContent = T.goal.toLocaleString();
  $('#kEat').textContent  = '−' + Math.round(t.kcal).toLocaleString();
  $('#kBurnL').textContent = countEx ? '動いた' : '動いた（加算しない）';
  $('#kBurn').textContent = (countEx?'＋':'') + Math.round(t.burn).toLocaleString();
  $('#kRestL').textContent = rest>=0 ? '残り' : '超過';
  $('#kRest').textContent = Math.abs(Math.round(rest)).toLocaleString();

  const pct = allow>0 ? Math.min(1, t.kcal/allow) : 0;
  const circ = 2*Math.PI*53;
  const arc = $('#ringArc');
  arc.setAttribute('stroke-dasharray', (circ*pct).toFixed(1)+' '+circ.toFixed(1));
  arc.setAttribute('stroke', rest<0 ? 'var(--p)' : 'var(--accent)');
  $('#ring').classList.toggle('over', rest<0);
  $('#ringNum').textContent = Math.abs(Math.round(rest)).toLocaleString();
  $('#ringLbl').textContent = rest>=0 ? 'kcal 残り' : 'kcal 超過';

  const macs = [
    {k:'たんぱく質', v:t.p, g:T.pg, col:'var(--p)'},
    {k:'脂質',       v:t.f, g:T.fg, col:'var(--f)'},
    {k:'炭水化物',   v:t.c, g:T.cg, col:'var(--c)'},
  ];
  $('#macros').innerHTML = macs.map(m=>{
    const pc = m.g>0 ? Math.min(100, m.v/m.g*100) : 0;
    const over = m.g>0 && m.v>m.g;
    return `<div class="mac"><div class="mt">${m.k}<b>${r1(m.v)}<span class="mg">/ ${r1(m.g)} g</span></b></div>
      <div class="bar"><span style="width:${pc.toFixed(1)}%;background:${over?'var(--p)':m.col}"></span></div></div>`;
  }).join('');

  // 体重
  const wi = $('#wInput');
  if(document.activeElement !== wi){
    const wv = weightOn(curDate);
    wi.value = wv==null ? '' : wv;
  }
  const prev = db.weights.filter(w=>w.d<curDate).sort((a,b)=> a.d<b.d?1:-1)[0];
  const now = weightOn(curDate);
  let wd = '';
  if(now!=null && prev){
    const df = r1(now - prev.kg);
    const cls = df<0?'dn-':df>0?'up-':'';
    wd = `<b class="${cls}">${df>0?'+':''}${df} kg</b>${fmtShort(prev.d)}から`;
  } else if(db.profile.goalW){
    const cur = latestWeight();
    if(cur!=null) wd = `<b>${r1(cur - n0(db.profile.goalW))} kg</b>目標まで`;
  }
  // 体組成計から体脂肪率が入っていれば、増減の代わりにそちらを出す
  const wf = db.weights.find(w=> w.d===curDate && w.fat != null);
  if(wf && now!=null && prev){
    const df = r1(now - prev.kg), cls = df<0?'dn-':df>0?'up-':'';
    wd = `<b class="${cls}">${df>0?'+':''}${df} kg</b>体脂肪 ${r1(wf.fat)}%`;
  } else if(wf){
    wd = `<b>${r1(wf.fat)} %</b>体脂肪`;
  }
  $('#wDelta').innerHTML = wd;

  // 食事リスト
  const meals = dayMeals(curDate);
  $('#mealSum').textContent = meals.length ? `合計 ${Math.round(t.kcal).toLocaleString()} kcal` : '';
  let html = '';
  SLOTS.forEach(s=>{
    const list = meals.filter(m=>m.slot===s.k);
    if(!list.length) return;
    const sum = list.reduce((a,m)=>a+n0(m.kcal),0);
    html += `<div class="slot"><div class="slot-h">${s.e} ${s.k}<span>${Math.round(sum).toLocaleString()} kcal</span></div>`;
    html += list.map(m=>`<div class="item" onclick="editMeal('${m.id}')">
        <div class="it-1"><div class="it-n">${esc(m.name)}</div><div class="it-k">${Math.round(n0(m.kcal)).toLocaleString()}</div></div>
        <div class="it-2"><span class="amt">${esc(m.amount||'')}</span>
          <span class="pf" style="color:var(--p)">P ${r1(n0(m.p))}</span>
          <span class="pf" style="color:var(--f)">F ${r1(n0(m.f))}</span>
          <span class="pf" style="color:var(--c)">C ${r1(n0(m.c))}</span></div>
      </div>`).join('');
    html += '</div>';
  });
  $('#mealList').innerHTML = html || '<div class="empty-s">記録なし</div>';

  // 運動リスト
  const ws = dayWorkouts(curDate);
  $('#exSum').textContent = ws.length ? `合計 ${Math.round(t.burn).toLocaleString()} kcal` : '';
  $('#exList').innerHTML = ws.length ? ws.map(x=>`<div class="item ex" onclick="editEx('${x.id}')">
      <div class="it-1"><div class="it-n">${esc(x.name)}</div><div class="it-k">${Math.round(n0(x.kcal)).toLocaleString()}</div></div>
      <div class="it-2"><span class="amt">${n0(x.min)}分${x.detail?' ・ '+esc(x.detail):''}</span>
        ${x.src==='image'?'<span>📷 画像から</span>':''}</div>
    </div>`).join('') : '<div class="empty-s">記録なし</div>';
}

/* ================= 描画：記録 ================= */
function renderLog(){
  const T = targets();
  const ws = db.weights.slice().sort((a,b)=> a.d<b.d?-1:1);

  // 統計
  let stats = [];
  const cur = latestWeight();
  stats.push({v: cur==null?'—':r1(cur), l:'体重 kg'});
  if(ws.length>=2){
    const df = r1(ws[ws.length-1].kg - ws[0].kg);
    stats.push({v:(df>0?'+':'')+df, l:'増減 kg'});
  } else stats.push({v:'—', l:'増減 kg'});
  const fat = latestFat();
  stats.push({v: fat==null?'—':r1(fat), l:'体脂肪 %'});
  stats.push({v: streak(), l:'連続 日'});
  $('#logStats').innerHTML = stats.map(s=>`<div class="stat"><div class="sv">${s.v}</div><div class="sl">${s.l}</div></div>`).join('');

  $$('.chip[data-span]').forEach(b=> b.classList.toggle('on', Number(b.dataset.span)===logSpan));

  // 体重グラフ
  const from = ymdShift(todayYmd(), -logSpan);
  const pts = ws.filter(w=>w.d>=from);
  $('#wRange').textContent = pts.length ? `${fmtShort(pts[0].d)} 〜 ${fmtShort(pts[pts.length-1].d)}` : '';
  drawWeight(pts);

  // カロリーグラフ
  const days = [];
  for(let i=13;i>=0;i--) days.push(ymdShift(todayYmd(), -i));
  drawKcal(days, T.goal);
}
function streak(){
  const set = new Set();
  db.meals.forEach(m=>set.add(m.d));
  db.weights.forEach(w=>set.add(w.d));
  db.workouts.forEach(x=>set.add(x.d));
  let n=0, d=todayYmd();
  if(!set.has(d)) d = ymdShift(d,-1);           // 今日まだなら昨日から数える
  while(set.has(d)){ n++; d = ymdShift(d,-1); }
  return n;
}
function drawWeight(pts){
  const svg = $('#wChart'); const W=320,H=150, PL=34,PR=8,PT=12,PB=20;
  if(pts.length<1){ svg.innerHTML = `<text x="160" y="78" text-anchor="middle" fill="#9b9b9f" font-size="11">体重を記録すると、ここにグラフが出ます</text>`; return; }
  // 7日移動平均
  const avg = pts.map((p,i)=>{
    const win = pts.filter(q=> q.d<=p.d && q.d>ymdShift(p.d,-7));
    return { d:p.d, kg: win.reduce((s,q)=>s+q.kg,0)/win.length };
  });
  const vals = pts.map(p=>p.kg).concat(avg.map(a=>a.kg));
  let mn=Math.min(...vals), mx=Math.max(...vals);
  if(mx-mn < 1.5){ const c=(mx+mn)/2; mn=c-0.8; mx=c+0.8; }
  const pad=(mx-mn)*0.12; mn-=pad; mx+=pad;
  const t0 = new Date(pts[0].d).getTime(), t1 = new Date(pts[pts.length-1].d).getTime();
  const X = ymd => PL + (t1===t0 ? (W-PL-PR)/2 : (new Date(ymd).getTime()-t0)/(t1-t0)*(W-PL-PR));
  const Y = kg  => PT + (1-(kg-mn)/(mx-mn))*(H-PT-PB);

  let g='';
  // 目標線
  const gw = n0(db.profile.goalW);
  if(gw && gw>=mn && gw<=mx){
    g += `<line x1="${PL}" y1="${Y(gw).toFixed(1)}" x2="${W-PR}" y2="${Y(gw).toFixed(1)}" stroke="var(--accent)" stroke-width="1" stroke-dasharray="3 3" opacity=".55"/>`;
    g += `<text x="${W-PR}" y="${(Y(gw)-4).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--accent)">目標 ${r1(gw)}</text>`;
  }
  // 目盛り
  [mx, (mx+mn)/2, mn].forEach(v=>{
    g += `<line x1="${PL}" y1="${Y(v).toFixed(1)}" x2="${W-PR}" y2="${Y(v).toFixed(1)}" stroke="#eeece8" stroke-width="1"/>`;
    g += `<text x="${PL-5}" y="${(Y(v)+3.5).toFixed(1)}" text-anchor="end" font-size="9" fill="#9b9b9f">${v.toFixed(1)}</text>`;
  });
  // 実測点
  pts.forEach(p=>{ g += `<circle cx="${X(p.d).toFixed(1)}" cy="${Y(p.kg).toFixed(1)}" r="2.2" fill="#c9c7c2"/>`; });
  // 移動平均線
  if(avg.length>1){
    g += `<polyline fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" points="${
      avg.map(a=>X(a.d).toFixed(1)+','+Y(a.kg).toFixed(1)).join(' ')}"/>`;
  } else {
    g += `<circle cx="${X(avg[0].d).toFixed(1)}" cy="${Y(avg[0].kg).toFixed(1)}" r="4" fill="var(--accent)"/>`;
  }
  // 日付
  g += `<text x="${PL}" y="${H-5}" font-size="9" fill="#9b9b9f">${fmtShort(pts[0].d)}</text>`;
  if(pts.length>1) g += `<text x="${W-PR}" y="${H-5}" text-anchor="end" font-size="9" fill="#9b9b9f">${fmtShort(pts[pts.length-1].d)}</text>`;
  svg.innerHTML = g;
}
function drawKcal(days, goal){
  const svg = $('#kChart'); const W=320,H=140, PL=34,PR=8,PT=12,PB=20;
  const vals = days.map(d=> dayTotals(d).kcal);
  const mx = Math.max(goal*1.25, ...vals, 100);
  const bw = (W-PL-PR)/days.length;
  const Y = v => PT + (1-v/mx)*(H-PT-PB);
  let g='';
  [mx, mx/2].forEach(v=>{
    g += `<line x1="${PL}" y1="${Y(v).toFixed(1)}" x2="${W-PR}" y2="${Y(v).toFixed(1)}" stroke="#eeece8" stroke-width="1"/>`;
    g += `<text x="${PL-5}" y="${(Y(v)+3.5).toFixed(1)}" text-anchor="end" font-size="9" fill="#9b9b9f">${Math.round(v)}</text>`;
  });
  days.forEach((d,i)=>{
    const v = vals[i]; if(v<=0) return;
    const x = PL + i*bw + bw*0.18, w = bw*0.64;
    const y = Y(v), h = Math.max(1.5, (H-PB)-y);
    g += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${v>goal?'var(--p)':'var(--accent)'}" opacity=".85"/>`;
  });
  g += `<line x1="${PL}" y1="${Y(goal).toFixed(1)}" x2="${W-PR}" y2="${Y(goal).toFixed(1)}" stroke="#1d1d1f" stroke-width="1.2" stroke-dasharray="4 3"/>`;
  g += `<text x="${PL}" y="${H-5}" font-size="9" fill="#9b9b9f">${fmtShort(days[0])}</text>`;
  g += `<text x="${W-PR}" y="${H-5}" text-anchor="end" font-size="9" fill="#9b9b9f">${fmtShort(days[days.length-1])}</text>`;
  svg.innerHTML = g;
}

async function callAI(payload){
  const r = await fetch(AI_URL, {
    method:'POST',
    headers:{ 'Authorization':'Bearer '+SUPABASE_ANON, 'Content-Type':'application/json' },

function shrinkImage(file, maxSide, q){
  return new Promise((resolve,reject)=>{
    const fr = new FileReader();
    fr.onerror = ()=> reject(new Error('画像を読み込めませんでした'));
    fr.onload = ()=>{
      const img = new Image();
      img.onerror = ()=> reject(new Error('画像を読み込めませんでした'));
      img.onload = ()=>{
        let {width:w, height:h} = img;
        const sc = Math.min(1, maxSide/Math.max(w,h));
        w = Math.round(w*sc); h = Math.round(h*sc);
        const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        resolve(cv.toDataURL('image/jpeg', q));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ================= Appleヘルスケアの書き出しを取り込む =================
   ヘルスケアの書き出しzipは数百MBになることがあるので、
   ①zipの索引だけ読んで目的のXMLの位置を特定 ②その部分だけを解凍しながら
   ③少しずつ文字列にして必要な行だけ拾う、という流れにしてある。
   端末の中だけで処理し、ファイルはどこにも送らない。 */

const HK_WORKOUT = {
  Running:'ランニング', Walking:'ウォーキング', Hiking:'ハイキング', Cycling:'サイクリング',
  Swimming:'水泳', Elliptical:'エリプティカル', Rowing:'ローイング', StairClimbing:'階段',
  Stairs:'階段', TraditionalStrengthTraining:'筋トレ', FunctionalStrengthTraining:'筋トレ',
  CoreTraining:'体幹トレーニング', HighIntensityIntervalTraining:'HIIT', Yoga:'ヨガ',
  Pilates:'ピラティス', Dance:'ダンス', Cooldown:'クールダウン', Flexibility:'ストレッチ',
  MixedCardio:'有酸素運動', Soccer:'サッカー', Basketball:'バスケットボール', Tennis:'テニス',
  Badminton:'バドミントン', TableTennis:'卓球', Golf:'ゴルフ', Baseball:'野球',
  Boxing:'ボクシング', Climbing:'クライミング', Skating:'スケート', Snowboarding:'スノーボード',
  Surfing:'サーフィン', Other:'運動',
};
// 属性の取り出しは何十万回も走るので、正規表現を毎回作らず文字列検索で行う
function hkAttr(s, k){
  const needle = k + '="';
  let from = 0;
  for(;;){
    const i = s.indexOf(needle, from);
    if(i < 0) return null;
    const c = i === 0 ? 32 : s.charCodeAt(i - 1);
    if(c === 32 || c === 10 || c === 13 || c === 9){        // 属性の切れ目であることを確かめる
      const st = i + needle.length;
      const e = s.indexOf('"', st);
      return e < 0 ? null : s.slice(st, e);
    }
    from = i + 1;
  }
}

async function hkOpenXmlStream(file){
  const nm = (file.name || '').toLowerCase();
  if(nm.endsWith('.xml')) return file.stream();
  if(!nm.endsWith('.zip')) throw new Error('「書き出したデータ.zip」か、その中の .xml を選んでください。');
  if(typeof DecompressionStream === 'undefined')
    throw new Error('このブラウザではzipを開けません。zipを展開して、中の .xml を選んでください。');

  const size = file.size;
  const tail = new Uint8Array(await file.slice(Math.max(0, size - 66000)).arrayBuffer());
  let eo = -1;
  for(let i = tail.length - 22; i >= 0; i--)
    if(tail[i]===0x50 && tail[i+1]===0x4b && tail[i+2]===0x05 && tail[i+3]===0x06){ eo = i; break; }
  if(eo < 0) throw new Error('zipの中身を読めませんでした。展開して、中の .xml を選んでください。');

  const tv = new DataView(tail.buffer, tail.byteOffset);
  const cdSize = tv.getUint32(eo + 12, true), cdOff = tv.getUint32(eo + 16, true);
  if(cdOff === 0xffffffff || cdSize === 0xffffffff)
    throw new Error('zipが大きすぎて索引を読めませんでした。展開して、中の .xml を選んでください。');

  const cd = new Uint8Array(await file.slice(cdOff, cdOff + cdSize).arrayBuffer());
  const cv = new DataView(cd.buffer, cd.byteOffset);
  const dec = new TextDecoder('utf-8');
  let p = 0, best = null;
  while(p + 46 <= cd.length && cv.getUint32(p, true) === 0x02014b50){
    const method = cv.getUint16(p + 10, true);
    const comp   = cv.getUint32(p + 20, true);
    const nLen   = cv.getUint16(p + 28, true);
    const eLen   = cv.getUint16(p + 30, true);
    const cLen   = cv.getUint16(p + 32, true);
    const lhOff  = cv.getUint32(p + 42, true);
    const name   = dec.decode(cd.subarray(p + 46, p + 46 + nLen));
    if(/\.xml$/i.test(name) && !/(^|\/)\._/.test(name) && !/_cda\.xml$/i.test(name)){
      // 「export.xml」「書き出したデータ.xml」を優先。無ければいちばん大きいXML
      const base = name.split('/').pop();
      const pref = (base === 'export.xml' || base === '書き出したデータ.xml') ? 1 : 0;
      if(!best || pref > best.pref || (pref === best.pref && comp > best.comp))
        best = { name, method, comp, lhOff, pref };
    }
    p += 46 + nLen + eLen + cLen;
  }
  if(!best) throw new Error('zipの中に、ヘルスケアの書き出しXMLが見つかりませんでした。');

  const lh = new Uint8Array(await file.slice(best.lhOff, best.lhOff + 30).arrayBuffer());
  const lv = new DataView(lh.buffer, lh.byteOffset);
  if(lv.getUint32(0, true) !== 0x04034b50) throw new Error('zipの中身を読めませんでした。');
  const start = best.lhOff + 30 + lv.getUint16(26, true) + lv.getUint16(28, true);
  const part = file.slice(start, start + best.comp);
  if(best.method === 0) return part.stream();
  if(best.method === 8) return part.stream().pipeThrough(new DecompressionStream('deflate-raw'));
  throw new Error('zipの圧縮方式に対応していません。展開して、中の .xml を選んでください。');
}

async function hkScan(stream, onProgress){
  const reader = stream.getReader();
  const td = new TextDecoder('utf-8');
  const out = { sex:null, dob:null, height:null, heightT:'', weights:new Map(), fats:new Map(),
                active:new Map(), basal:new Map(), workouts:[], seen:new Set(), bytes:0 };
  const CARRY = 30000;
  // 末尾の > まで含めて初めて一致させる。そうしないと、読み込みの区切りが記録の途中に
  // 落ちたときに「属性が欠けた記録」に一致してしまい、その1件を取りこぼす
  const reRec = /<Record type="HKQuantityTypeIdentifier(BodyMass|BodyFatPercentage|Height|ActiveEnergyBurned|BasalEnergyBurned)"([^>]*)>/g;
  const reWk  = /<Workout\s([^>]*?)(?:\/>|>([\s\S]*?)<\/Workout>)/g;
  let buf = '', tick = 0;
  // 読み込みの区切りかたは相手まかせ（zipの解凍は大きく、ファイル直読みは細かく届く）。
  // まとめてから処理することで、どちらでも同じ速さになる
  const BATCH = 4 * 1024 * 1024;

  for(;;){
    const { done, value } = await reader.read();
    if(value){ out.bytes += value.length; buf += td.decode(value, { stream:true }); }
    if(done) buf += td.decode();
    if(!done && buf.length < BATCH) continue;

    if(!out.sex){
      const m = /<Me\s([^>]*)>/.exec(buf);
      if(m){
        out.sex = hkAttr(m[1], 'HKCharacteristicTypeIdentifierBiologicalSex');
        out.dob = hkAttr(m[1], 'HKCharacteristicTypeIdentifierDateOfBirth');
      }
    }

    let last = 0, m;
    reRec.lastIndex = 0;
    while((m = reRec.exec(buf))){
      last = reRec.lastIndex;
      const type = m[1], a = m[2];
      const t = hkAttr(a, 'startDate') || '';
      const d = t.slice(0, 10);
      const v = parseFloat(hkAttr(a, 'value'));
      if(!d || !Number.isFinite(v)) continue;
      const u = (hkAttr(a, 'unit') || '').toLowerCase();
      if(type === 'BodyMass'){
        const kg = (u === 'lb') ? v * 0.45359237 : (u === 'st') ? v * 6.35029318 : v;
        const prev = out.weights.get(d);
        if(!prev || t > prev.t) out.weights.set(d, { t, kg });
      } else if(type === 'BodyFatPercentage'){
        const pct = v <= 1 ? v * 100 : v;                 // 0.23 でも 23 でも入ってくる
        const prev = out.fats.get(d);
        if(pct > 1 && pct < 70 && (!prev || t > prev.t)) out.fats.set(d, { t, pct });
      } else if(type === 'Height'){
        const cm = (u === 'm') ? v * 100 : (u === 'in') ? v * 2.54 : v;
        if(!out.height || t > out.heightT){ out.height = cm; out.heightT = t; }
      } else if(type === 'ActiveEnergyBurned'){
        const k = (u === 'kj') ? v / 4.184 : v;
        out.active.set(d, (out.active.get(d) || 0) + k);
      } else if(type === 'BasalEnergyBurned'){
        const k = (u === 'kj') ? v / 4.184 : v;
        out.basal.set(d, (out.basal.get(d) || 0) + k);
      }
    }

    // ワークアウトはファイルの終盤にしか出てこない。含まれない間は重い走査をしない
    const hasWk = buf.indexOf('<Workout ') >= 0;
    reWk.lastIndex = 0;
    while(hasWk && (m = reWk.exec(buf))){
      if(reWk.lastIndex > last) last = reWk.lastIndex;
      const a = m[1], inner = m[2] || '';
      const t = hkAttr(a, 'startDate');
      if(!t || out.seen.has(t)) continue;
      out.seen.add(t);
      const raw = (hkAttr(a, 'workoutActivityType') || '').replace('HKWorkoutActivityType', '');
      let min = parseFloat(hkAttr(a, 'duration')) || 0;
      const du = (hkAttr(a, 'durationUnit') || 'min').toLowerCase();
      if(du === 's' || du === 'sec') min /= 60; else if(du === 'hr' || du === 'h') min *= 60;

      let kcal = parseFloat(hkAttr(a, 'totalEnergyBurned')) || 0;
      let ku = hkAttr(a, 'totalEnergyBurnedUnit') || 'kcal';
      if(!kcal && inner){
        const s = /<WorkoutStatistics[^>]*HKQuantityTypeIdentifierActiveEnergyBurned[^>]*/.exec(inner);
        if(s){ kcal = parseFloat(hkAttr(s[0], 'sum')) || 0; ku = hkAttr(s[0], 'unit') || 'kcal'; }
      }
      if(/^kj$/i.test(ku)) kcal /= 4.184;

      let dist = parseFloat(hkAttr(a, 'totalDistance')) || 0;
      let dunit = hkAttr(a, 'totalDistanceUnit') || 'km';
      if(!dist && inner){
        const s = /<WorkoutStatistics[^>]*HKQuantityTypeIdentifierDistance[A-Za-z]*[^>]*/.exec(inner);
        if(s){ dist = parseFloat(hkAttr(s[0], 'sum')) || 0; dunit = hkAttr(s[0], 'unit') || 'km'; }
      }
      out.workouts.push({
        t, d: t.slice(0, 10),
        name: HK_WORKOUT[raw] || (raw ? raw : '運動'),
        min: Math.round(min), kcal: Math.round(kcal),
        detail: dist > 0 ? (r1(dist) + ' ' + dunit) : ''
      });
    }

    buf = last > 0 ? buf.slice(last) : (buf.length > CARRY ? buf.slice(buf.length - CARRY) : buf);

    if(onProgress && (++tick % 12 === 0 || done))
      onProgress(`${(out.bytes / 1048576).toFixed(0)} MB 読み取り　体重 ${out.weights.size}件　運動 ${out.workouts.length}件`);
    if(done) break;
  }
  return out;
}

// 取り込む内容をまとめる（実際の保存はボタンを押してから）
function hkSummarize(f){
  const s = { sex:null, age:null, height:null, weights:[], workouts:[], act:null, actDays:0, fatCount:0 };
  if(f.sex) s.sex = /Female/i.test(f.sex) ? 'f' : 'm';
  if(f.dob && /^\d{4}-\d{2}-\d{2}/.test(f.dob)){
    const b = new Date(f.dob.slice(0, 10)), n = new Date();
    let age = n.getFullYear() - b.getFullYear();
    const md = (n.getMonth() - b.getMonth()) || (n.getDate() - b.getDate());
    if(md < 0) age--;
    if(age > 0 && age < 120) s.age = age;
  }
  if(f.height && f.height > 100 && f.height < 250) s.height = Math.round(f.height * 10) / 10;

  const today = todayYmd();
  f.weights.forEach((v, d)=>{
    if(d > today || v.kg <= 20 || v.kg >= 400) return;
    const w = { d, kg: Math.round(v.kg * 10) / 10 };
    const ft = f.fats.get(d);
    if(ft) w.fat = Math.round(ft.pct * 10) / 10;
    s.weights.push(w);
  });
  s.weights.sort((a, b)=> a.d < b.d ? -1 : 1);
  s.fatCount = s.weights.filter(w=> w.fat != null).length;

  const from = ymdShift(today, -90);
  s.workouts = f.workouts.filter(w=> w.d >= from && w.d <= today && w.kcal > 0)
                         .sort((a, b)=> a.t < b.t ? -1 : 1);

  // 活動係数＝(基礎代謝＋ワークアウト以外の活動)÷基礎代謝 の実測平均。
  // ワークアウト分は別で加算するので、ここから差し引かないと二重に数えてしまう。
  const wkByDay = new Map();
  f.workouts.forEach(w=> wkByDay.set(w.d, (wkByDay.get(w.d) || 0) + w.kcal));
  const since = ymdShift(today, -60);
  const ratios = [];
  f.basal.forEach((b, d)=>{
    if(d < since || d >= today || b < 800) return;         // 装着が途切れた日は捨てる
    const nonWk = Math.max(0, (f.active.get(d) || 0) - (wkByDay.get(d) || 0));
    ratios.push((b + nonWk) / b);
  });
  if(ratios.length >= 7){
    ratios.sort((a, b)=> a - b);
    const med = ratios[Math.floor(ratios.length / 2)];
    s.act = Math.round(Math.min(1.9, Math.max(1.2, med)) * 1000) / 1000;
    s.actDays = ratios.length;
  }
  return s;
}

function hkShowPreview(s){
  window._hk = s;
  const row = (label, val, none)=>
    `<div class="fr${none ? ' none' : ''}"><span>${label}</span><b>${val}</b></div>`;
  const wRange = s.weights.length
    ? `${s.weights.length}件（${fmtShort(s.weights[0].d)}〜）` : '—';
  const newW = s.weights.filter(w=> !db.weights.some(x=> x.d === w.d)).length;
  const newX = s.workouts.filter(w=> !db.workouts.some(x=> x.id === 'hk' + w.t.replace(/\D/g, ''))).length;

  $('#hkStatus').innerHTML = `
    <div class="found">
      ${row('性別', s.sex ? (s.sex === 'f' ? '女性' : '男性') : '—', !s.sex)}
      ${row('年齢', s.age ? s.age + ' 歳' : '—', !s.age)}
      ${row('身長', s.height ? s.height + ' cm' : '—', !s.height)}
      ${row('体重', wRange, !s.weights.length)}
      ${row('体脂肪率', s.fatCount ? s.fatCount + '件' : '—', !s.fatCount)}
      ${row('運動（90日）', s.workouts.length ? s.workouts.length + '件' : '—', !s.workouts.length)}
      ${row('活動量', s.act ? `×${s.act}` : '—', !s.act)}
    </div>
    <div class="hint" style="margin-top:10px">新しく足すのは 体重${newW}件・運動${newX}件（既存はそのまま）</div>
    <div class="btnrow" style="margin-top:12px">
      <button class="btn primary" onclick="hkApply()">取り込む</button>
      <button class="btn sub" onclick="$('#hkStatus').innerHTML=''">やめる</button>
    </div>`;
}

function hkApply(){
  const s = window._hk; if(!s) return;
  const p = db.profile;
  if(s.sex) p.sex = s.sex;
  if(s.age) p.age = s.age;
  if(s.height) p.height = s.height;
  let aw = 0, ax = 0;
  s.weights.forEach(w=>{
    const ex = db.weights.find(x=> x.d === w.d);
    if(!ex){ db.weights.push(w.fat != null ? { d:w.d, kg:w.kg, fat:w.fat } : { d:w.d, kg:w.kg }); aw++; }
    else if(ex.fat == null && w.fat != null){ ex.fat = w.fat; }   // 体脂肪率だけ後から補う
  });
  s.workouts.forEach(w=>{
    const id = 'hk' + w.t.replace(/\D/g, '');
    if(db.workouts.some(x=> x.id === id)) return;
    db.workouts.push({ id, d:w.d, name:w.name, min:w.min, kcal:w.kcal, detail:w.detail, src:'health' });
    ax++;
  });
  if(s.act){ p.actMeasured = s.act; p.act = s.act; }
  save();
  $('#hkStatus').innerHTML = `<div class="found"><div class="fr"><span>取り込みました</span>
    <b>体重 ${aw}日ぶん / 運動 ${ax}件</b></div></div>`;
  renderAll();
  toast('✅ ヘルスケアから取り込みました');
}

$('#hkFile').addEventListener('change', async function(){
  const f = this.files && this.files[0]; this.value = '';
  if(!f) return;
  const st = $('#hkStatus');
  st.innerHTML = `<div class="loading"><div class="sp"></div><br>読み取っています…
    <div class="muted" id="hkProg" style="margin-top:6px; font-size:11.5px">準備中</div></div>`;
  try{
    const stream = await hkOpenXmlStream(f);
    const found = await hkScan(stream, msg=>{ const e = $('#hkProg'); if(e) e.textContent = msg; });
    const s = hkSummarize(found);
    if(!s.weights.length && !s.workouts.length && !s.height && !s.age)
      throw new Error('このファイルからは記録を読み取れませんでした。ヘルスケアの「すべてのヘルスケアデータを書き出す」で作ったファイルを選んでください。');
    hkShowPreview(s);
  }catch(e){
    st.innerHTML = `<div class="errbox" style="margin-top:12px">${esc(e.message)}</div>`;
  }
});

/* ================= 書き出し・読み込み ================= */
function exportJson(){
  const blob = new Blob([JSON.stringify(db,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'hakari-' + todayYmd() + '.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}
function importJson(input){
  const f = input.files && input.files[0]; input.value='';
  if(!f) return;
  const fr = new FileReader();
  fr.onload = ()=>{
    try{
      const j = JSON.parse(fr.result);
      if(!j || typeof j!=='object') throw new Error();
      // 追加のみ（既存を消さない・id重複はスキップ）
      let add = 0;
      ['meals','workouts','dishes'].forEach(k=>{
        (j[k]||[]).forEach(it=>{ if(!db[k].some(x=>x.id===it.id)){ db[k].push(it); add++; } });
      });
      (j.weights||[]).forEach(w=>{ if(!db.weights.some(x=>x.d===w.d)){ db.weights.push(w); add++; } });
      if(j.profile) db.profile = Object.assign({}, db.profile, j.profile);
      save(); renderAll(); toast(`✅ ${add}件を追加しました`);
    }catch(e){ toast('読み込めませんでした'); }
  };
  fr.readAsText(f);
}

/* ================= 起動 ================= */
loadLocal();
bindSettings();
renderAll();
loadRemote();
subscribeRealtime();
// 日付をまたいで開きっぱなしにしていた場合に「今日」を追従させる
window.addEventListener('focus', ()=>{ if(!anySheetOpen()) renderToday(); });

<style>
  #tsumikiEdge{position:fixed; top:0; bottom:0; left:0; width:22px; z-index:999;}
  #tsumikiPeek{
    position:fixed; top:50%; left:0; z-index:1001; margin-top:-23px;
    width:46px; height:46px; display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.92);
    -webkit-backdrop-filter:saturate(180%) blur(14px); backdrop-filter:saturate(180%) blur(14px);
    border:1px solid rgba(0,0,0,.06); border-radius:50%;
    box-shadow:0 6px 20px rgba(0,0,0,.18);
    color:#0071e3; font-size:24px; font-weight:600; line-height:1;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Helvetica Neue",Arial,sans-serif;
    transform:translateX(-70px) scale(.8); opacity:0; pointer-events:none;
  }
</style>
<div id="tsumikiEdge"></div>
<div id="tsumikiPeek">‹</div>
<script>
  (function(){
    var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
      || window.navigator.standalone === true;
    var fromTsumiki = false;
    try{
      if(document.referrer){
        var r = new URL(document.referrer);
        fromTsumiki = (r.origin === location.origin);
      }
    }catch(e){}
    if(!(standalone && fromTsumiki)) return;

    var peek = document.getElementById('tsumikiPeek');
    var edge = document.getElementById('tsumikiEdge');

    function goBack(){ location.href = 'index.html'; }

    /* --- 左端エッジスワイプで戻る（iOS純正の戻る操作。見えるボタンは置かない） --- */
    var sx=0, sy=0, prog=0, dragging=false, W=window.innerWidth;
    var TRIGGER = Math.min(120, W*0.32);
    window.addEventListener('resize', function(){ W=window.innerWidth; TRIGGER=Math.min(120, W*0.32); });

    function reset(){
      dragging = false; prog = 0;
      peek.style.transition = 'transform .25s ease, opacity .25s ease';
      peek.style.transform = 'translateX(-70px) scale(.8)';
      peek.style.opacity = 0;
    }
    function start(e){
      var t = e.touches ? e.touches[0] : e;
      if(t.clientX > 26) return;
      sx = t.clientX; sy = t.clientY; prog = 0; dragging = true;
      peek.style.transition = 'none';
    }
    function move(e){
      if(!dragging) return;
      var t = e.touches ? e.touches[0] : e;
      var dx = t.clientX - sx, dy = t.clientY - sy;
      if(Math.abs(dy) > Math.abs(dx) + 12){ reset(); return; }
      if(dx < 0) dx = 0;
      prog = Math.min(dx / TRIGGER, 1);
      peek.style.transform = 'translateX(' + (-70 + prog*82) + 'px) scale(' + (0.8 + prog*0.2) + ')';
      peek.style.opacity = prog;
      if(dx > 6 && e.cancelable) e.preventDefault();
    }
    function end(){
      if(!dragging) return;
      dragging = false;
      if(prog >= 0.999){
        peek.style.transition = 'transform .25s ease, opacity .25s ease';
        peek.style.transform = 'translateX(20px) scale(1.05)';
        peek.style.opacity = 1;
        goBack();
      }else{
        reset();
      }
    }
    edge.addEventListener('touchstart', start, {passive:true});
    window.addEventListener('touchmove', move, {passive:false});
    window.addEventListener('touchend', end, {passive:true});
    window.addEventListener('touchcancel', end, {passive:true});
  })();
</script>
<!-- /tsumiki-back-button -->
