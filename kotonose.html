<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="apple-touch-icon" href="icons/icon-kotonose.png">
<meta name="apple-mobile-web-app-title" content="ことのせ">
<title>ことのせ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f5f4f0;--surface:#fffefb;--surface-2:#efece5;--ink:#1d1a15;--ink-mid:#5b554a;--ink-soft:#666154;
  --ghost:#887f70;
  /* 画像の中身の色（画面の配色とは別・ダークでも変えない） */
  --out-ink:#1d1a15;--out-ink-2:#2b2619;--out-box:#ffffff;
  --logo-white:#ffffff;--logo-black:#1d1d1f;--logo-gray:#a1a1a6;--logo-free:#bf4b3c;
  --rb-1:#e0574a;--rb-2:#e8b04a;--rb-3:#5dae6a;--rb-4:#4a8fe0;--rb-5:#9a62d8;--line:#e2ded4;--line-2:#d8d3c7;--accent:#b06f26;--accent-2:#8a5a24;--accent-wash:#f0e4d1;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#0f0d07;--surface:#211d14;--surface-2:#2b2619;--ink:#efe8da;--ink-mid:#a89e8b;--ink-soft:#9f988a;
  --line:#36301f;--line-2:#443d2b;--accent:#d59a4d;--accent-2:#e0ab63;--accent-wash:#362a19;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;
  min-height:100dvh;-webkit-text-size-adjust:100%}
.wrap{max-width:1200px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
h1{font-size:20px;font-weight:700;margin:4px 0 14px}
.grid{display:grid;gap:16px}
@media (min-width:900px){.grid{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);align-items:start}}
.stage{position:relative;border-radius:12px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.stage canvas{display:block;width:100%;height:auto}
.pick{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  background:transparent;border:0;color:var(--ink-mid);font:inherit;font-size:15px;cursor:pointer;min-height:44px}
.pick svg{width:40px;height:40px}
.pick[hidden]{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:grid;gap:14px}
label.f{display:grid;gap:6px;font-size:14px;font-weight:500;color:var(--ink-mid)}
textarea,input[type=text]{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);
  border:1px solid var(--line-2);border-radius:8px;padding:10px 12px;min-height:44px;resize:vertical}
textarea{min-height:76px;line-height:1.5}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sw{width:44px;height:44px;border-radius:9999px;border:1px solid var(--line-2);padding:0;cursor:pointer;position:relative;flex:none}
.sw[aria-pressed=true],.sw.on{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--accent)}
.sw.custom{background:conic-gradient(var(--rb-1),var(--rb-2),var(--rb-3),var(--rb-4),var(--rb-5),var(--rb-1));overflow:hidden}
.sw.custom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface-2);border-radius:12px;padding:4px}
.seg button{display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;border:0;border-radius:9px;
  background:transparent;color:var(--ink-mid);font:inherit;font-size:15px;font-weight:500;cursor:pointer}
.seg button svg{width:20px;height:20px;flex:none}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line-2)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button.b{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;border-radius:12px;border:0;
  font:inherit;font-size:15px;font-weight:500;cursor:pointer;padding:10px 12px}
button.b svg{width:20px;height:20px;flex:none}
.quiet{background:var(--surface-2);color:var(--ink)}
.main{background:var(--accent-2);color:var(--paper)}
button.b:disabled{opacity:.45;cursor:default}
.note{font-size:13px;color:var(--ink-soft);margin:0;min-height:1.5em}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="wrap">
  <h1>ことのせ</h1>
  <div class="grid">
    <div>
      <div class="stage">
        <canvas id="cv" width="1600" height="900" aria-label="仕上がり"></canvas>
        <button class="pick" id="pickBig" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/></svg>
          写真を選ぶ
        </button>
      </div>
      <p class="note" id="note" aria-live="polite"></p>
    </div>
    <div class="card">
      <label class="f">見出し
        <textarea id="t1" rows="2" placeholder="ここに見出し"></textarea>
      </label>
      <label class="f">添え書き
        <textarea id="t2" rows="2" placeholder="なくても大丈夫"></textarea>
      </label>
      <div class="f" style="display:grid;gap:6px;font-size:14px;font-weight:500;color:var(--ink-mid)">四角の位置
        <div class="seg" id="pos" role="group" aria-label="四角の位置">
          <button type="button" data-p="top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><rect x="5.5" y="7.5" width="10" height="3.5" rx="1" fill="currentColor" stroke="none"/></svg>上</button>
          <button type="button" data-p="middle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><rect x="5.5" y="10.25" width="13" height="3.5" rx="1" fill="currentColor" stroke="none"/></svg>中央</button>
          <button type="button" data-p="bottom"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><rect x="5.5" y="13" width="13" height="3.5" rx="1" fill="currentColor" stroke="none"/></svg>下</button>
        </div>
      </div>
      <div class="f" style="display:grid;gap:6px;font-size:14px;font-weight:500;color:var(--ink-mid)">ロゴの色
        <div class="row" id="sws" role="group" aria-label="ロゴの色">
          <button class="sw" type="button" data-v="--logo-white" aria-label="白" style="background:var(--logo-white)"></button>
          <button class="sw" type="button" data-v="--logo-black" aria-label="黒" style="background:var(--logo-black)"></button>
          <button class="sw" type="button" data-v="--logo-gray" aria-label="グレー" style="background:var(--logo-gray)"></button>
          <label class="sw custom"><input type="color" id="cc" aria-label="好きな色"></label>
        </div>
      </div>
      <div class="btns">
        <button class="b quiet" id="pick" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/></svg>写真</button>
        <button class="b main" id="save" type="button" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg>保存</button>
      </div>
    </div>
  </div>
  <input type="file" id="file" accept="image/*" hidden>
</div>
<script>
(()=>{
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
const KEY='kotonose.v1';
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
for(const b of document.querySelectorAll('#sws [data-v]'))b.dataset.c=css(b.dataset.v);
$('cc').value=css('--logo-free');
const st={t1:'',t2:'',logo:css('--logo-white'),pos:'bottom'};
try{const o=JSON.parse(localStorage.getItem(KEY)||'{}')||{};
  for(const k of ['t1','t2'])if(typeof o[k]==='string')st[k]=o[k];
  if(['bottom','middle','top'].includes(o.pos))st.pos=o.pos;
  if(typeof o.logo==='string'&&/^#[0-9a-f]{6}$/i.test(o.logo))st.logo=o.logo;
}catch(e){}
let photo=null; // {img, sx, sy, sw, sh}
let overflow=false,trimmed=false,errMsg='';
function showNote(){
  $('note').textContent=errMsg||(overflow?'文章が長くて入りきりません。短くしてください':(trimmed?'16:9 でないので、真ん中を切り出しました':''));
}
/* 1 保存用の画像は先に作っておく（押したときに待たずに共有を開くため） */
let blob=null,blobVer=0,blobTimer=0,ver=0;
function queueBlob(){
  ver++;blob=null;clearTimeout(blobTimer);
  if(!photo)return;
  const my=ver;
  blobTimer=setTimeout(()=>cv.toBlob(b=>{if(my===ver){blob=b;blobVer=my}},'image/jpeg',0.92),400);
}

const logoImg=new Image();
const logoReady=new Promise(r=>{logoImg.onload=r;logoImg.onerror=r});
logoImg.src=LOGO_SRC;

function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}

function wrap(text,font,maxW){
  ctx.font=font;const out=[];
  for(const para of String(text).split('\n')){
    let line='';
    for(const ch of Array.from(para)){
      const t=line+ch;
      if(ctx.measureText(t).width>maxW&&line){
        // 行頭に句読点・閉じかっこを置かない
        if(/^[、。，．・）」』】！？ー〜…]$/.test(ch)){line=t;continue}
        out.push(line);line=ch;
      }else line=t;
      // 行末に開きかっこを残さない
      if(/[（「『【]$/.test(line)&&line.length>1&&ctx.measureText(line).width>maxW*0.9){out.push(line.slice(0,-1));line=line.slice(-1)}
    }
    out.push(line);
  }
  while(out.length&&out[out.length-1]==='')out.pop();
  return out;
}

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}

function tinted(w,h,color){
  const c=document.createElement('canvas');c.width=Math.ceil(w);c.height=Math.ceil(h);
  const g=c.getContext('2d');g.drawImage(logoImg,0,0,c.width,c.height);
  g.globalCompositeOperation='source-in';g.fillStyle=color;g.fillRect(0,0,c.width,c.height);
  return c;
}

function draw(){
  const W=cv.width,H=cv.height,u=W/1000;
  ctx.clearRect(0,0,W,H);
  // 1. 写真
  if(photo){ctx.drawImage(photo.img,photo.sx,photo.sy,photo.sw,photo.sh,0,0,W,H)}
  // 2. 文章（白50%の四角の上）
  const t1=st.t1.trim(),t2=st.t2.trim();
  overflow=false;
  if(t1||t2){
    const fam='"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif';
    const mx=W*0.04,padX=26*u,padY=20*u,gap=t1&&t2?4*u:0;
    const my=H*0.05,logoZone=H*0.17; // ロゴ（上から約15%）にかからない
    const logoW=H*0.1*(logoImg.naturalWidth/logoImg.naturalHeight||0.8);
    // 上のときは、右上のロゴの手前で四角を止める
    const boxW=st.pos==='top'?W-mx-(W*0.035+logoW+W*0.025):W-mx*2,inner=boxW-padX*2;
    const maxH=st.pos==='top'?H-my*2:st.pos==='middle'?H-logoZone*2:H-my-logoZone;
    let k=1,f1,f2,lh1,lh2,L1,L2,boxH;
    for(;;){
      f1=`700 ${34*u*k}px ${fam}`;f2=`400 ${20*u*k}px ${fam}`;lh1=34*u*k*1.38;lh2=20*u*k*1.6;
      L1=t1?wrap(t1,f1,inner):[];L2=t2?wrap(t2,f2,inner):[];
      boxH=padY*2+L1.length*lh1+gap+L2.length*lh2;
      if(boxH<=maxH||k<=0.45)break;
      k*=0.92;
    }
    overflow=boxH>maxH;
    if(overflow)boxH=maxH;
    const boxY=st.pos==='top'?my:st.pos==='middle'?(H-boxH)/2:H-my-boxH;
    ctx.save();rr(mx,boxY,boxW,boxH,14*u);ctx.clip();
    ctx.fillStyle=css('--out-box');ctx.globalAlpha=0.5;rr(mx,boxY,boxW,boxH,14*u);ctx.fill();ctx.globalAlpha=1;
    ctx.fillStyle=css('--out-ink');ctx.textBaseline='middle';
    let y=boxY+padY;
    ctx.font=f1;for(const l of L1){ctx.fillText(l,mx+padX,y+lh1/2);y+=lh1}
    y+=gap;
    ctx.fillStyle=css('--out-ink-2');ctx.font=f2;for(const l of L2){ctx.fillText(l,mx+padX,y+lh2/2);y+=lh2}
    ctx.restore();
  }
  showNote();
  queueBlob();
  // 3. ロゴ（右上）
  if(logoImg.naturalWidth){
    const lh=H*0.1,lw=lh*logoImg.naturalWidth/logoImg.naturalHeight;
    ctx.drawImage(tinted(lw,lh,st.logo),W-W*0.035-lw,H*0.045,lw,lh);
  }
}

function setPhoto(img){
  const iw=img.naturalWidth,ih=img.naturalHeight,R=16/9;
  let sw=iw,sh=ih,sx=0,sy=0;
  if(iw/ih>R+0.01){sw=ih*R;sx=(iw-sw)/2}else if(iw/ih<R-0.01){sh=iw/R;sy=(ih-sh)/2}
  trimmed=sx>0||sy>0;
  const W=Math.min(3840,Math.round(sw)),H=Math.round(W/R);
  // 切り出し＋縮小を1回だけして、元の大きな写真は手放す
  const keep=document.createElement('canvas');keep.width=W;keep.height=H;
  keep.getContext('2d').drawImage(img,sx,sy,sw,sh,0,0,W,H);
  cv.width=W;cv.height=H;
  photo={img:keep,sx:0,sy:0,sw:W,sh:H};
  $('pickBig').hidden=true;$('save').disabled=false;
  errMsg='';
  draw();
}

function openPicker(){$('file').value='';$('file').click()}
$('pick').onclick=openPicker;$('pickBig').onclick=openPicker;
$('file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const url=URL.createObjectURL(f),img=new Image();
  img.onload=()=>{try{setPhoto(img)}catch(e){errMsg='この写真は大きすぎて読めませんでした';showNote()}URL.revokeObjectURL(url)};
  img.onerror=()=>{errMsg='この写真は読めませんでした';showNote();URL.revokeObjectURL(url)};
  img.src=url;
};

const FAM='"Zen Maru Gothic"';
function loadFont(){const t=st.t1+st.t2+'あ';return Promise.all([document.fonts.load('700 34px '+FAM,t),document.fonts.load('400 20px '+FAM,t)]).catch(()=>{})}
for(const k of ['t1','t2']){$(k).value=st[k];$(k).addEventListener('input',e=>{st[k]=e.target.value;save();draw();loadFont()})}
document.fonts.addEventListener('loadingdone',draw);

const sws=[...document.querySelectorAll('#sws .sw')];
function markSw(){
  let hit=false;
  for(const b of sws){if(b.dataset.c){const on=b.dataset.c===st.logo;b.setAttribute('aria-pressed',on);hit=hit||on}}
  const c=sws[sws.length-1];c.classList.toggle('on',!hit);
  if(!hit){$('cc').value=st.logo;c.style.background=st.logo}else c.style.background='';
}
for(const b of sws)if(b.dataset.c)b.onclick=()=>{st.logo=b.dataset.c;save();markSw();draw()};
$('cc').addEventListener('input',e=>{st.logo=e.target.value;save();markSw();draw()});
markSw();
const posBtns=[...document.querySelectorAll('#pos button')];
function markPos(){for(const b of posBtns)b.setAttribute('aria-pressed',b.dataset.p===st.pos)}
for(const b of posBtns)b.onclick=()=>{st.pos=b.dataset.p;save();markPos();draw()};
markPos();

$('save').onclick=async()=>{
  let b=(blob&&blobVer===ver)?blob:null;
  const ready=!!b;
  if(!b)b=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.92));
  if(!b){errMsg='保存できませんでした';showNote();return}
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  const name=`ことのせ_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}.jpg`;
  const file=new File([b],name,{type:'image/jpeg'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file]});return}
    catch(e){
      if(e.name==='AbortError')return;
      if(!ready){blob=b;blobVer=ver;$('note').textContent='用意できました。もう一度「保存」を押してください';return}
    }
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
};

Promise.all([logoReady,loadFont()]).then(draw,draw);
draw();
})();
</script>

    function goBack(){ location.href = 'index.html'; }

    /* --- 左端エッジスワイプで戻る（iOS純正の戻る操作。見えるボタンは置かない） --- */
    var sx=0, sy=0, prog=0, dragging=false, W=window.innerWidth;
    var TRIGGER = Math.min(120, W*0.32);
    window.addEventListener('resize', function(){ W=window.innerWidth; TRIGGER=Math.min(120, W*0.32); });

    function reset(){
      dragging = false; prog = 0;
      peek.style.transition = 'transform .25s ease, opacity .25s ease';
      peek.style.transform = 'translateX(-70px) scale(.8)';
      peek.style.opacity = 0;
    }
    function start(e){
      var t = e.touches ? e.touches[0] : e;
      if(t.clientX > 26) return;
      sx = t.clientX; sy = t.clientY; prog = 0; dragging = true;
      peek.style.transition = 'none';
    }
    function move(e){
      if(!dragging) return;
      var t = e.touches ? e.touches[0] : e;
      var dx = t.clientX - sx, dy = t.clientY - sy;
      if(Math.abs(dy) > Math.abs(dx) + 12){ reset(); return; }
      if(dx < 0) dx = 0;
      prog = Math.min(dx / TRIGGER, 1);
      peek.style.transform = 'translateX(' + (-70 + prog*82) + 'px) scale(' + (0.8 + prog*0.2) + ')';
      peek.style.opacity = prog;
      if(dx > 6 && e.cancelable) e.preventDefault();
    }
    function end(){
      if(!dragging) return;
      dragging = false;
      if(prog >= 0.999){
        peek.style.transition = 'transform .25s ease, opacity .25s ease';
        peek.style.transform = 'translateX(20px) scale(1.05)';
        peek.style.opacity = 1;
        goBack();
      }else{
        reset();
      }
    }
    edge.addEventListener('touchstart', start, {passive:true});
    window.addEventListener('touchmove', move, {passive:false});
    window.addEventListener('touchend', end, {passive:true});
    window.addEventListener('touchcancel', end, {passive:true});
  })();
</script>
<!-- /tsumiki-back-button -->
</body>
</html>
