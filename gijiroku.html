<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="apple-touch-icon" href="icons/icon-gijiroku.png">
<meta name="apple-mobile-web-app-title" content="議事録">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F4F2EE">
<title>議事録</title>
<style>
  :root{
    --bg:#F4F2EE; --card:#FBFAF8; --text:#242321; --sub:#77736B; --line:#D8D4CC;
    --ink:#242321; --faint:#b8b3a8;
    /* tn.css へ橋渡し（これが無いと tn- 部品が既定の青になる） */
    --paper:#FBFAF8; --accent:#242321; --accent-2:#242321; --radius:13px;
    --decide:#1f7a4d; --decide-bg:#e7f3ec;
    --todo:#b26a00;   --todo-bg:#f6ecdb;
    --point:#7a4bcc;  --point-bg:#efe9f8;
    --say:#5b7085;    --say-bg:#eef1f4;
  }
  *{box-sizing:border-box;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans","Yu Gothic",sans-serif;
    background:var(--bg); color:var(--text); margin:0; padding:22px 16px 120px;
    line-height:1.5; -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:620px; margin:0 auto;}
  h1{font-size:24px; font-weight:600; text-align:center; margin:4px 0 2px;}
  .tagline{text-align:center; color:var(--sub); font-size:12px; margin-bottom:18px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:14px;}

  /* meta */
  .meta-row{display:flex; gap:10px; margin-bottom:10px;}
  .meta-row:last-child{margin-bottom:0;}
  .fld{flex:1; display:flex; flex-direction:column; gap:5px;}
  .fld label{font-size:11px; font-weight:700; color:var(--sub); letter-spacing:.02em; padding-left:2px;}
  .fld input{
    width:100%; border:1px solid var(--line); border-radius:10px; background:#fff; font-family:inherit;
    font-size:16px; color:var(--text); padding:11px 12px; min-height:44px;
  }
  .fld input:focus{outline:none; border-color:var(--ink);}
  #mTitle{font-weight:700;}

  /* compose */
  /* tn.css の部品に、このアプリらしさだけ足し戻す（選ばれた絞り込みは墨ベタ） */
  .tn-chip.on{background:var(--ink); color:var(--paper); border-color:var(--ink);}
  .type-pick{margin-bottom:10px;}
  /* 枠・高さ44px・押し心地は tn.css の .tn-seg。ここは種類ごとの色だけ持つ */
  .type-btn:active{transform:scale(.95);}
  .type-btn.on[data-type="say"]   {background:var(--say-bg);    color:var(--say);    border-color:var(--say);}
  .type-btn.on[data-type="decide"]{background:var(--decide-bg); color:var(--decide); border-color:var(--decide);}
  .type-btn.on[data-type="todo"]  {background:var(--todo-bg);   color:var(--todo);   border-color:var(--todo);}
  .type-btn.on[data-type="point"] {background:var(--point-bg);  color:var(--point);  border-color:var(--point);}

  #compose{
    width:100%; border:1px solid var(--line); border-radius:12px; background:#fff; font-family:inherit;
    font-size:16px; color:var(--text); padding:13px 14px; min-height:70px; resize:vertical; line-height:1.55;
  }
  #compose:focus{outline:none; border-color:var(--ink);}
  .compose-bar{display:flex; align-items:center; gap:8px; margin-top:10px;}
  #speaker{
    width:96px; flex:0 0 auto; border:1px solid var(--line); border-radius:10px; background:#fff; font-family:inherit;
    font-size:16px; color:var(--text); padding:11px 10px; min-height:44px;
  }
  #speaker:focus{outline:none; border-color:var(--ink);}
  .mic-btn{
    flex:0 0 auto; width:46px; height:46px; border:1px solid var(--line); background:#fff; border-radius:12px;
    font-size:19px; cursor:pointer; -webkit-tap-highlight-color:transparent; display:flex; align-items:center; justify-content:center;
  }
  .mic-btn:active{opacity:.6;}
  .mic-btn.rec{background:#fdecec; border-color:#d9534f; animation:pulse 1.1s infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(217,83,79,.4);}50%{box-shadow:0 0 0 6px rgba(217,83,79,0);}}
  #addBtn{
    flex:1; background:var(--ink); color:#fff; border:none; border-radius:12px; padding:14px;
    font-size:16px; font-weight:700; font-family:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent; min-height:46px;
  }
  #addBtn:active{opacity:.7;}
  .mic-hint{font-size:11px; color:var(--sub); margin-top:8px; text-align:center; line-height:1.6;}

  /* filter */
  .filters{display:flex; gap:7px; margin:2px 0 12px; flex-wrap:wrap;}

  /* list */
  .row{
    background:var(--card); border:1px solid var(--line); border-radius:13px; padding:10px 12px; margin-bottom:9px;
    border-left:4px solid var(--line);
  }
  .row[data-type="say"]   {border-left-color:var(--say);}
  .row[data-type="decide"]{border-left-color:var(--decide);}
  .row[data-type="todo"]  {border-left-color:var(--todo);}
  .row[data-type="point"] {border-left-color:var(--point);}
  .row-top{display:flex; align-items:center; gap:8px; margin-bottom:6px;}
  .badge{font-size:11px; font-weight:800; padding:2px 8px; border-radius:999px; letter-spacing:.02em; flex:0 0 auto;}
  .badge.say   {background:var(--say-bg);    color:var(--say);}
  .badge.decide{background:var(--decide-bg); color:var(--decide);}
  .badge.todo  {background:var(--todo-bg);   color:var(--todo);}
  .badge.point {background:var(--point-bg);  color:var(--point);}
  .row-time{
    font-size:13px; font-weight:700; color:var(--text); background:transparent; border:1px solid transparent;
    border-radius:8px; padding:3px 5px; font-family:inherit; width:62px; -webkit-appearance:none; appearance:none;
  }
  .row-time:focus{outline:none; border-color:var(--line); background:#fff;}
  .row-spk{font-size:12px; font-weight:700; color:var(--sub);}
  .row-del{margin-left:auto; background:none; border:none; color:var(--sub); font-size:18px; line-height:1; cursor:pointer; padding:3px 5px; -webkit-tap-highlight-color:transparent;}
  .row-del:active{opacity:.5;}
  .row-body{display:flex; align-items:flex-start; gap:8px;}
  .chk{flex:0 0 auto; margin-top:2px; --tn-fill:var(--todo);}
  .row-text{
    flex:1; width:100%; border:none; background:transparent; font-family:inherit; font-size:16px; color:var(--text);
    padding:0 2px; resize:none; overflow:hidden; line-height:1.5; min-height:24px; display:block;
  }
  .row-text:focus{outline:none;}
  .row.done .row-text{color:var(--faint); text-decoration:line-through;}

  /* export */
  .actions{display:flex; gap:10px; margin-top:18px;}
  .act-btn{
    flex:1; display:inline-flex; align-items:center; justify-content:center; gap:7px; background:#fff; border:1px solid var(--line);
    border-radius:12px; padding:13px; font-size:15px; font-weight:700; color:var(--text); font-family:inherit; cursor:pointer;
    -webkit-tap-highlight-color:transparent; min-height:48px;
  }
  .act-btn:active{opacity:.6;}
  .act-btn svg{width:16px; height:16px;}
  .count{text-align:center; font-size:11px; color:var(--sub); margin-top:14px;}
</style>

<style>
/* ================================================================
   つみき用「ネイティブ部品」CSS  v2  (2026-09-09)
   sashimi UI (MIT / yuto-hasegawa) の作り方を参考に、
   つみきの決まりごと（タップ44px・入力16px・8幅・変数名）へ書き直したもの。
   コードはコピーではなく書き直し。考え方の出どころだけ上に記す。

   使い方：単一HTMLの <style> にこのまま貼る。クラスはすべて tn- 始まり。
   色は既存アプリの変数（--card/--ink/--sub/--line/--accent/--radius など）を
   そのまま使う。無いアプリでも下の既定値で動く。
   ================================================================ */

/* すべてを @layer tn に入れてある。
   層に入れた規則は、層に入っていないアプリ側の規則に**必ず負ける**（順番も詳細度も関係ない）。
   だから tn.css を </head> の直前＝アプリのCSSより後に入れても、
   アプリが持っている見た目が勝つ。上書きに !important は要らない。 */
@layer tn {

:root{
  /* 既存アプリの変数があればそちらが勝つ。無ければ次の候補→最後に既定値。
     ⚠ --accent を持たないアプリに青を差し込まないよう、accent は最後に --ink へ落とす
        （墨色なら何色のアプリに混ぜても浮かない）。 */
  --tn-paper:      var(--paper,  var(--card, var(--surface, #ffffff)));
  --tn-ink:        var(--ink,     var(--text,  #1d1d1f));
  --tn-sub:        var(--sub,     var(--muted, #6e6e73));
  --tn-line:       var(--line,    var(--hair,  #e3e3e6));
  --tn-accent:     var(--accent,  var(--ink,   #0071e3));
  /* 塗りつぶしの地は --accent-2（濃い側）。DESIGN.md いわく --accent に白文字は 4.08:1 で不合格 */
  --tn-fill:       var(--accent-2, var(--tn-accent));
  --tn-on-fill:    var(--paper,    #ffffff);
  --tn-radius:     var(--radius, 14px);
  --tn-good:       var(--good,   var(--ok,   #34c759));
  --tn-warn:       var(--warn,   #ff9500);
  --tn-danger:     var(--danger, var(--red,  #ff3b30));
  /* 洗い色の帯に載せる文字は濃い側を使う（--good をそのまま置くと 3.98:1） */
  --tn-good-ink:   var(--good-ink, var(--tn-good));
  --tn-warn-ink:   var(--warn-ink, var(--tn-warn));

  /* 1色から淡い面を自動でつくる（--accent-soft などを手で持たなくていい） */
  --tn-accent-wash: color-mix(in srgb, var(--tn-accent) 12%, transparent);
  --tn-hover:       color-mix(in srgb, var(--tn-ink)    5%, transparent);

  --tn-tap: 44px;          /* つみきの最小タップ。ここだけ直せば全部そろう */
  --tn-gap: 12px;
}

/* ---- 触れるものすべてに同じフォーカスの輪（キーボード操作のときだけ出る） ---- */
:where(.tn-choice,.tn-optrow):has(:focus-visible),
:where(.tn-chip,.tn-tab,.tn-acc>summary,.tn-check,.tn-radio,.tn-switch,.tn-row):focus-visible{
  outline:2px solid var(--tn-accent); outline-offset:2px; border-radius:8px;
}

/* ================================================================
   1. tn-choice — 押せる選択カード（JS 0行）
   <label class="tn-choice"><input type="radio" class="tn-radio" name="x">
     <b>おまかせ</b><small>その日のおすすめ</small></label>
   選ばれたかどうかは :has(:checked) が見てくれる。
   ================================================================ */
.tn-choice{
  display:grid; grid-template-columns:auto 1fr; align-items:start;
  column-gap:var(--tn-gap); row-gap:2px;
  width:100%; min-height:var(--tn-tap); padding:14px;
  box-sizing:border-box; cursor:pointer;
  background:var(--tn-paper); color:var(--tn-ink);
  border:1px solid var(--tn-line); border-radius:var(--tn-radius);
  transition:background .15s, border-color .15s;
}
.tn-choice > :not(input){ grid-column:2; }
.tn-choice > input{ grid-row:1; margin:0; margin-top:2px; }
@supports (margin-top:1lh){ .tn-choice > input{ margin-top:calc((1lh - 22px) / 2) } }
.tn-choice > small{ color:var(--tn-sub); font-size:13px; line-height:1.5; }
.tn-choice:has(:checked){
  background:var(--tn-accent-wash); border-color:var(--tn-accent);
}
.tn-choice:has(:disabled){ opacity:.5; cursor:default; }
@media (hover:hover){ .tn-choice:hover:not(:has(:disabled)){ background:var(--tn-hover); } }
.tn-choice:active:not(:has(:disabled)){ transform:scale(.99); }

/* ================================================================
   2. tn-check / tn-radio — チェックと丸。画像もJSも使わない
   ✓ は疑似要素2本の線を「短い方 → 長い方」の順に伸ばして描く。
   ※ input 自体は22px。指で押す44pxは必ず親の .tn-optrow / .tn-choice が持つ。
   <label class="tn-optrow"><input type="checkbox" class="tn-check">同意する</label>
   ================================================================ */
.tn-optrow{
  display:flex; align-items:center; gap:10px;
  min-height:var(--tn-tap); padding:4px 2px; cursor:pointer;
}
.tn-optrow:has(:disabled){ opacity:.45; cursor:default }

.tn-check,.tn-radio{
  appearance:none; -webkit-appearance:none; background-color:transparent;
  position:relative; flex:0 0 auto; box-sizing:border-box;
  width:22px; height:22px; min-width:22px; margin:0; padding:0; cursor:pointer;
}

.tn-check{
  border-radius:7px; box-shadow:inset 0 0 0 2px var(--tn-line);
  background-image:radial-gradient(circle, var(--tn-fill) 50%, transparent 50%);
  background-position:center; background-repeat:no-repeat; background-size:0 0;
  transition:box-shadow .15s, background-size 60ms cubic-bezier(1,.35,1,.27);
}
.tn-check:checked{
  box-shadow:inset 0 0 0 2px var(--tn-fill);
  background-size:44px 44px;
  transition:box-shadow .15s, background-size .16s ease-out;
}
.tn-check::before,.tn-check::after{
  content:""; position:absolute; left:7.5px; top:14.2px;
  width:0; height:2.6px; border-radius:1.3px;
  background:var(--tn-on-fill); transform-origin:left center;
}
.tn-check::before{ transform:rotate(-135deg); transition:width 70ms ease-in }
.tn-check::after { transform:rotate(-45deg);  transition:width 90ms ease-in }
.tn-check:checked::before{ width:6.5px;  transition:width 80ms  ease-out }
.tn-check:checked::after { width:11.5px; transition:width 110ms ease-out 70ms }

.tn-radio{
  border-radius:50%; border:2px solid var(--tn-line); transition:border-color .15s;
}
.tn-radio::before{
  content:""; position:absolute; inset:50% auto auto 50%;
  width:0; height:0; border-radius:50%; background:var(--tn-fill);
  transform:translate(-50%,-50%); transition:width .12s ease-out, height .12s ease-out;
}
.tn-radio:checked{ border-color:var(--tn-fill) }
.tn-radio:checked::before{ width:12px; height:12px }

.tn-check:disabled,.tn-radio:disabled{ cursor:default }
.tn-check:disabled:not(:checked),.tn-radio:disabled:not(:checked){ opacity:.45 }

/* ================================================================
   3. tn-switch — 入／切のつまみ（input[type=checkbox] 1個だけ）
   ================================================================ */
.tn-switch{
  appearance:none; -webkit-appearance:none;
  position:relative; flex:0 0 auto; vertical-align:middle;
  width:52px; height:32px; margin:0; border-radius:999px; cursor:pointer;
  background:var(--tn-line); transition:background-color .18s ease;
}
.tn-switch::before{                      /* 当たり判定を縦44pxに */
  content:""; position:absolute; inset:-6px 0; 
}
.tn-switch::after{
  content:""; position:absolute; top:3px; left:3px;
  width:26px; height:26px; border-radius:50%; background:var(--tn-paper);
  box-shadow:0 1px 3px rgba(0,0,0,.25);
  transition:left .18s ease;
}
.tn-switch:checked{ background:var(--tn-fill); }
.tn-switch:checked::after{ left:23px; }
.tn-switch:disabled{ opacity:.45; cursor:default; }

/* ================================================================
   4. tn-acc — 開いて読むところ（details / summary。JS 0行）
   <details class="tn-acc"><summary>くわしく</summary><p>…</p></details>
   ================================================================ */
.tn-acc{
  width:100%; box-sizing:border-box; overflow:hidden;
  background:var(--tn-paper); border:1px solid var(--tn-line);
  border-radius:var(--tn-radius);
}
.tn-acc > summary{
  display:flex; align-items:center; gap:8px;
  min-height:var(--tn-tap); padding:14px 16px;
  font-weight:700; list-style:none; cursor:pointer;
}
.tn-acc > summary::-webkit-details-marker{ display:none; }
.tn-acc > summary::after{                /* ▾ を線2本で作る（画像不要） */
  content:""; width:.5em; height:.5em; margin-inline-start:auto;
  border-right:2px solid currentColor; border-bottom:2px solid currentColor;
  transform:translateY(-2px) rotate(45deg); transition:transform .18s ease-out;
}
.tn-acc[open] > summary::after{ transform:translateY(2px) rotate(225deg); }
.tn-acc > :not(summary){ margin:0 16px 16px; }
@media (hover:hover){ .tn-acc > summary:hover{ background:var(--tn-hover); } }

/* ================================================================
   5. tn-sheet — ダイアログ（<dialog>。Escで閉じる・背面固定はブラウザ任せ）
   出す: el.showModal()   閉じる: el.close()
   ================================================================ */
.tn-sheet{
  border:0; padding:0; max-width:min(560px, calc(100% - 32px));
  width:100%; box-sizing:border-box;
  background:var(--tn-paper); color:var(--tn-ink);
  border-radius:var(--tn-radius);
  box-shadow:0 10px 40px rgba(0,0,0,.18);
}
.tn-sheet::backdrop{ background:rgba(0,0,0,.45); }
.tn-sheet > .tn-sheet-body{ padding:20px; }
/* 幅600px以下では下からせり上がる「シート」にする */
@media (max-width:600px){
  .tn-sheet{
    max-width:100%; margin:auto auto 0; 
    border-radius:var(--tn-radius) var(--tn-radius) 0 0;
    padding-bottom:env(safe-area-inset-bottom);
  }
}

/* ================================================================
   6. tn-kv — 明細（<dl>。合計・内訳・レシート）
   ================================================================ */
.tn-kv{
  display:grid; grid-template-columns:1fr auto;
  column-gap:16px; row-gap:8px; margin:0;
}
.tn-kv dt{ color:var(--tn-sub); }
.tn-kv dd{ margin:0; justify-self:end; font-variant-numeric:tabular-nums; }
.tn-kv .tn-total{ font-weight:700; color:var(--tn-ink); }

/* ================================================================
   7. tn-meter / tn-bar / tn-spin / tn-skel — 量と待ち時間
   <meter class="tn-meter" value=".8" low=".3" high=".7" optimum=".1">
   → しきい値を超えると自動で色が変わる（JSで色を出し分けなくていい）
   ================================================================ */
.tn-meter{
  appearance:none; -webkit-appearance:none;
  width:100%; height:10px; border:0; border-radius:999px; overflow:hidden;
  background:var(--tn-line);
}
.tn-meter::-webkit-meter-bar{ background:var(--tn-line); border:0; border-radius:999px; }
.tn-meter::-webkit-meter-optimum-value        { background:var(--tn-good);   border-radius:999px; }
.tn-meter::-webkit-meter-suboptimum-value     { background:var(--tn-warn);   border-radius:999px; }
.tn-meter::-webkit-meter-even-less-good-value { background:var(--tn-danger); border-radius:999px; }
.tn-meter::-moz-meter-bar{ background:var(--tn-good); border-radius:999px; }
.tn-meter:-moz-meter-sub-optimum::-moz-meter-bar{ background:var(--tn-warn); }
.tn-meter:-moz-meter-sub-sub-optimum::-moz-meter-bar{ background:var(--tn-danger); }

.tn-bar{
  appearance:none; -webkit-appearance:none;
  position:relative; width:100%; height:8px; border:0; border-radius:999px;
  overflow:hidden; background:var(--tn-line);
}
.tn-bar::-webkit-progress-bar{ background:var(--tn-line); }
.tn-bar::-webkit-progress-value{ background:var(--tn-accent); border-radius:999px; }
.tn-bar::-moz-progress-bar{ background:var(--tn-accent); }
.tn-bar:indeterminate::before{
  content:""; position:absolute; inset:0; background:var(--tn-accent);
  transform-origin:0 50%; animation:tn-run 1s linear infinite;
}
@keyframes tn-run{
  0%{ transform:translateX(0) scaleX(0) }
  40%{ transform:translateX(0) scaleX(.4) }
  100%{ transform:translateX(100%) scaleX(.5) }
}

.tn-spin{                                  /* ぐるぐる（画像もJSも無し） */
  width:32px; height:32px; border-radius:50%;
  border:3px solid var(--tn-line); border-top-color:var(--tn-accent);
  animation:tn-turn .8s linear infinite;
}
@keyframes tn-turn{ to{ transform:rotate(360deg) } }

.tn-skel{                                  /* 読み込み中の灰色の板 */
  border-radius:12px; background:var(--tn-line); position:relative; overflow:hidden;
}
.tn-skel::after{
  content:""; position:absolute; inset:0;
  background:linear-gradient(100deg, transparent 20%,
             color-mix(in srgb, var(--tn-paper) 70%, transparent) 50%, transparent 80%);
  animation:tn-sweep 1.1s linear infinite;
}
@keyframes tn-sweep{ from{ transform:translateX(-100%) } to{ transform:translateX(100%) } }

@media (prefers-reduced-motion:reduce){
  .tn-spin,.tn-skel::after,.tn-bar:indeterminate::before{ animation:none }
  *{ transition-duration:.01ms !important }
}

/* ================================================================
   8. tn-note — おしらせの囲み。1色から淡い面を color-mix で作る
   ================================================================ */
.tn-note{
  padding:14px 16px; margin:0; border-radius:var(--tn-radius);
  background:var(--tn-accent-wash);
  border:1px solid color-mix(in srgb, var(--tn-accent) 25%, transparent);
}
.tn-note.tn-good  { background:color-mix(in srgb, var(--tn-good)   12%, transparent);
                    border-color:color-mix(in srgb, var(--tn-good)   28%, transparent); }
.tn-note.tn-warn  { background:color-mix(in srgb, var(--tn-warn)   14%, transparent);
                    border-color:color-mix(in srgb, var(--tn-warn)   32%, transparent); }
.tn-note.tn-danger{ background:color-mix(in srgb, var(--tn-danger) 10%, transparent);
                    border-color:color-mix(in srgb, var(--tn-danger) 28%, transparent); }
.tn-note > :first-child{ margin-top:0 } .tn-note > :last-child{ margin-bottom:0 }

/* ================================================================
   9. tn-chip / tn-tabs — 絞り込みと切り替え（どちらも44px）
   ================================================================ */
.tn-chip{

}

.tn-tabs{ display:flex; gap:4px; border-bottom:1px solid var(--tn-line); overflow-x:auto;

.tn-tab{

/* ================================================================

/* ================================================================

<script>
/* ================================================================
   つみき用「動きの下ごしらえ」JS  v1  (2026-09-09)

   tn.css の相棒。CSS では書けない2つだけを持つ。
     1. rnd()    …… 決定論の擬似乱数（Math.random() の置き換え）
     2. reveal() …… 見えたら再生・押したらもう一度

   考え方の出どころ: lieflat-charts（PolyForm Noncommercial）。
   ライセンスが非商用なので**コードは写していない**。借りたのは
   「デモの乱数は決定論にする」「再生前に必ずタイマーを掃除する」
   という2つの考え方だけで、中身はつみき用に書き直したもの。
   調査 → ~/つみき出力/道具としらべ/lieflat-charts_調査と採用可否_2026-09-08.md

   使い方: 単一HTMLの <script> にこのまま貼る（or python3 inject_tn.py <HTML>）。
   ぶら下がる名前は window.TN の1つだけ。既存コードとぶつからない。
   ================================================================ */
(function (global) {
  'use strict';

  /* ── 1 · 決定論の擬似乱数 ────────────────────────────────
     Math.random() を使わない。リロードのたびに形が変わると、
     スクショも録画も「前と同じか」の見比べも全部あてにならなくなる。
     つみきは「架空データの複製から画面を撮る」運用（お返事カード・IG投稿）
     をしているので、ここが変わると成果物が毎回ちがう絵になる。

     同じ (i, k) を渡せば、いつ・どの端末で呼んでも同じ 0〜1 が返る。
     i = 何番目か、k = 用途の区別（x座標なら 0、y座標なら 1、など）。

     ※ 参考にした式（`((i*73856093)^(k*19349663))%1000/1000`）は
       **k=0 のとき 0.000 / 0.093 / 0.186 … と等差の直線になる**（実測）。
       既定の k=0 でいちばん使うのに散らばらないので、ここは採らずに
       32bit のかき混ぜ（xor と乗算を交互に）に置き換えてある。     */
  function rnd(i, k) {
    var h = Math.imul((i | 0) + 0x9e3779b9, 0x85ebca6b);
    h ^= Math.imul(((k === undefined ? 0 : k) | 0) + 0xc2b2ae35, 0x27d4eb2f);
    h ^= h >>> 15; h = Math.imul(h, 0x2545f491);
    h ^= h >>> 13; h = Math.imul(h, 0x3d73373b);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }

  /* lo〜hi に散らす（rnd の範囲つき版） */
  function rndIn(i, k, lo, hi) {
    return lo + rnd(i, k) * (hi - lo);
  }

  /* 配列から決定論的に1つ選ぶ（アイコン・色・名前のダミー割り当て用） */
  function pick(list, i, k) {
    if (!list || !list.length) return undefined;
    return list[Math.floor(rnd(i, k) * list.length) % list.length];
  }

  /* 配列を決定論的に並べ替える（シャッフルしたいが毎回同じ順がいいとき） */
  function shuffle(list, k) {
    return list
      .map(function (v, i) { return [rnd(i, k), v]; })
      .sort(function (a, b) { return a[0] - b[0]; })
      .map(function (p) { return p[1]; });
  }

  /* ── 2 · 見えたら再生・押したらもう一度 ──────────────────
     画面に入ってから描く。入場アニメが「スクロールする前に終わっていた」
     を防ぐ。押すともう一度。

     肝は**再生前にタイマーを全部消すこと**。消さないと、連打したぶん
     setInterval が積み上がって、だんだん速くなる／二重に描かれる。

       TN.reveal('chart', function (el, ctx) {
         el.innerHTML = '';
         ctx.keep(setInterval(tick, 16));   // ← 自分で作ったタイマーは keep に預ける
         if (ctx.reduced) { drawInstantly(el); return; }   // 動きを減らす設定のとき
         drawWithAnimation(el);
       });

     opt: { threshold: 0.3, replay: true, once: true }
       threshold … どれだけ見えたら再生するか（0〜1）
       replay    … クリックで再生し直すか（既定 true）
       once      … 一度再生したら監視をやめるか（既定 true）             */

  var kept = new Map();   // 要素 → そこで動いているタイマーの控え

  function clearKept(el) {
    var list = kept.get(el) || [];
    for (var i = 0; i < list.length; i++) {
      clearTimeout(list[i]);
      clearInterval(list[i]);
    }
    kept.set(el, []);
  }

  function reduced() {
    return !!(global.matchMedia &&
      global.matchMedia('(prefers-reduced-motion: reduce)').matches);
  }

  function reveal(target, draw, opt) {
    var el = typeof target === 'string' ? document.getElementById(target) : target;
    if (!el || typeof draw !== 'function') return null;

    var o = opt || {};
    var threshold = o.threshold === undefined ? 0.3 : o.threshold;
    var replay = o.replay === undefined ? true : o.replay;
    var once = o.once === undefined ? true : o.once;
    var fallback = o.fallback === undefined ? 1200 : o.fallback;
    var drawn = false;

    function go() {
      drawn = true;
      clearKept(el);   // ← ここで kept.get(el) は必ず空配列になる
      draw(el, {
        rnd: rnd,
        reduced: reduced(),
        keep: function (id) { kept.get(el).push(id); return id; }
      });
    }

    // 動きを減らす設定なら、監視もアニメもせずその場で1回だけ描く
    if (reduced() || !global.IntersectionObserver) {
      go();
    } else {
      var io = new IntersectionObserver(function (entries) {
        if (!entries[0].isIntersecting) return;
        go();
        if (once) io.disconnect();
      }, { threshold: threshold });
      io.observe(el);

      /* 保険。**画面に寸法が無いところでは IntersectionObserver は永久に発火しない**
         （Claude のブラウザペインは innerWidth/innerHeight とも 0・2026-09-09 実測。
          スクショ用のヘッドレス、PDF書き出し、display:none の iframe も同じ）。
         そのまま放っておくと図が白いまま焼き付く。だから寸法が無いときだけ、
         少し待ってから描く。ふつうのブラウザの「下のほうにある要素」は
         寸法があるので、ここは通らない＝スクロールするまで待つ挙動のまま。 */
      if (fallback) {
        setTimeout(function () {
          if (drawn) return;
          if (!global.innerWidth || !global.innerHeight) go();
        }, fallback);
      }
    }

    if (replay) {
      el.style.cursor = 'pointer';
      el.addEventListener('click', go);
    }
    return go;   // 呼び出し側から手で再生したいとき用
  }

  /* 止める（要素を消す前に呼ぶ。タイマーの置き去りを防ぐ） */
  reveal.stop = function (target) {
    var el = typeof target === 'string' ? document.getElementById(target) : target;
    if (el) clearKept(el);
  };

  global.TN = global.TN || {};
  global.TN.rnd = rnd;
  global.TN.rndIn = rndIn;
  global.TN.pick = pick;
  global.TN.shuffle = shuffle;
  global.TN.reveal = reveal;
  global.TN.reduced = reduced;
})(typeof window !== 'undefined' ? window : globalThis);
</script>

<div class="wrap">
  <h1>議事録</h1>
  <p class="tagline">会議しながら要点を。決定・ToDoは自動でまとまり、Markdownで書き出せます。</p>

  <div class="card">

      <button id="addBtn" type="button">記録</button>

    <div class="mic-hint" id="micHint">🎤は自分のマイク音声だけを文字化します（ヘッドホン利用時は相手の声は入りません）</div>

<script>
(function(){
  "use strict";
  var STORAGE_KEY = "gijiroku-v1";

  var TYPE_LABEL = { say:"発言", decide:"決定", todo:"ToDo", point:"論点" };
  var state = {
    title:"", date:"", members:"",
    rows:[]   // { id, type, time:"HH:MM", speaker, text, done, created }
  };
  var curType = "say", curFilter = "all";

  function gid(id){ return document.getElementById(id); }
  function z(n){ return (n<10?"0":"")+n; }
  function nowDate(){ var d=new Date(); return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate()); }
  function nowTime(){ var d=new Date(); return z(d.getHours())+":"+z(d.getMinutes()); }
  function uid(){ return "r"+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];}); }

  /* ---------- 保存 ---------- */
  function load(){
    try{
      var raw=localStorage.getItem(STORAGE_KEY);
      if(raw){
        var s=JSON.parse(raw);
        if(s){
          state.title=s.title||""; state.date=s.date||""; state.members=s.members||"";
          if(Array.isArray(s.rows)) state.rows=s.rows;
        }
      }
    }catch(e){}
  }
  var saveT=null;
  function save(){
    if(saveT) clearTimeout(saveT);
    saveT=setTimeout(function(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){} }, 250);
  }

  /* ---------- 描画 ---------- */
  function speakers(){
    var seen={}, out=[];
    state.rows.forEach(function(r){ var s=(r.speaker||"").trim(); if(s && !seen[s]){ seen[s]=1; out.push(s); } });
    return out;
  }
  function refreshSpeakerList(){
    var dl=gid("spkList");
    dl.innerHTML=speakers().map(function(s){ return '<option value="'+esc(s)+'">'; }).join("");
  }
  function sortedRows(){
    return state.rows.slice().sort(function(a,b){
      if((a.time||"")!==(b.time||"")) return (a.time||"")<(b.time||"")?-1:1;
      return (a.created||0)-(b.created||0);
    });
  }
  function render(){
    var list=gid("list");
    var arr=sortedRows();
    if(curFilter!=="all") arr=arr.filter(function(r){ return r.type===curFilter; });
    if(arr.length===0){
      list.innerHTML='<div class="tn-empty"><span class="tn-empty-em">'+(state.rows.length? "🔍" : "📝")+'</span>'+(state.rows.length? "この分類の記録はまだありません。" : "上の欄から、会議の発言・決定・ToDoを記録しましょう。<br>種類を選んで「記録」を押すだけ。")+'</div>';
      updateCount(); return;
    }
    var html="";
    arr.forEach(function(r){
      var isTodo = r.type==="todo";
      html+='<div class="row'+(r.done?" done":"")+'" data-id="'+esc(r.id)+'" data-type="'+esc(r.type)+'">'+
        '<div class="row-top">'+
          '<span class="badge '+esc(r.type)+'">'+esc(TYPE_LABEL[r.type]||"")+'</span>'+
          '<input type="time" class="row-time" value="'+esc(r.time||"")+'">'+
          (r.speaker? '<span class="row-spk">'+esc(r.speaker)+'</span>' : '')+
          '<button class="row-del" type="button" aria-label="削除">✕</button>'+
        '</div>'+
        '<div class="row-body">'+
          (isTodo? '<input type="checkbox" class="chk tn-check"'+(r.done?" checked":"")+'>' : '')+
          '<textarea class="row-text" rows="1">'+esc(r.text||"")+'</textarea>'+
        '</div>'+
      '</div>';
    });
    list.innerHTML=html;
    Array.prototype.forEach.call(list.querySelectorAll(".row-text"), autoGrow);
    updateCount();
  }
  function autoGrow(ta){ ta.style.height="auto"; ta.style.height=(ta.scrollHeight)+"px"; }
  function updateCount(){
    var d=0,t=0;
    state.rows.forEach(function(r){ if(r.type==="decide")d++; if(r.type==="todo")t++; });
    gid("count").textContent = state.rows.length? ("全"+state.rows.length+"件　決定 "+d+"・ToDo "+t) : "";
  }
  function findRow(id){ for(var i=0;i<state.rows.length;i++){ if(state.rows[i].id===id) return state.rows[i]; } return null; }

  /* ---------- 操作 ---------- */
  function addRow(){
    var t=gid("compose").value.trim();
    if(!t) return;
    var spk=gid("speaker").value.trim();
    state.rows.push({ id:uid(), type:curType, time:nowTime(), speaker:spk, text:t, done:false, created:Date.now() });
    gid("compose").value="";
    save(); refreshSpeakerList(); render();
    gid("compose").focus();
  }

  function bindMeta(){
    gid("mTitle").value=state.title;
    gid("mDate").value=state.date || nowDate();
    state.date=gid("mDate").value;
    gid("mMembers").value=state.members;
    gid("mTitle").addEventListener("input", function(){ state.title=this.value; save(); });
    gid("mDate").addEventListener("change", function(){ state.date=this.value; save(); });
    gid("mMembers").addEventListener("input", function(){ state.members=this.value; save(); });
  }

  function bind(){
    gid("typePick").addEventListener("click", function(e){
      var b=e.target.closest(".type-btn"); if(!b) return;
      curType=b.dataset.type;
      Array.prototype.forEach.call(this.querySelectorAll(".type-btn"), function(x){ x.classList.toggle("on", x===b); });
    });
    gid("addBtn").addEventListener("click", addRow);
    gid("compose").addEventListener("keydown", function(e){
      if((e.metaKey||e.ctrlKey) && e.key==="Enter"){ e.preventDefault(); addRow(); }
    });
    gid("filters").addEventListener("click", function(e){
      var c=e.target.closest(".tn-chip"); if(!c) return;
      curFilter=c.dataset.f;
      Array.prototype.forEach.call(this.querySelectorAll(".tn-chip"), function(x){ x.classList.toggle("on", x===c); });
      render();
    });

    var list=gid("list");
    list.addEventListener("input", function(e){
      var ta=e.target.closest(".row-text");
      if(ta){ var r=findRow(ta.closest(".row").dataset.id); if(r){ r.text=ta.value; autoGrow(ta); save(); } return; }
      var ti=e.target.closest(".row-time");
      if(ti){ var r2=findRow(ti.closest(".row").dataset.id); if(r2){ r2.time=ti.value; save(); } }
    });
    list.addEventListener("change", function(e){
      var ti=e.target.closest(".row-time");
      if(ti){ var r=findRow(ti.closest(".row").dataset.id); if(r){ r.time=ti.value; save(); render(); } return; }
      var ck=e.target.closest(".chk");
      if(ck){ var r2=findRow(ck.closest(".row").dataset.id); if(r2){ r2.done=ck.checked; save(); ck.closest(".row").classList.toggle("done", ck.checked); } }
    });
    list.addEventListener("click", function(e){
      var del=e.target.closest(".row-del"); if(!del) return;
      var id=del.closest(".row").dataset.id;
      if(!confirm("この記録を削除しますか？")) return;
      state.rows=state.rows.filter(function(r){ return r.id!==id; });
      save(); refreshSpeakerList(); render();
    });

    gid("copyBtn").addEventListener("click", function(){ copyText(buildMarkdown()); });
    gid("dlBtn").addEventListener("click", downloadMd);
    gid("micBtn").addEventListener("click", toggleMic);
  }

  /* ---------- Markdown 書き出し ---------- */
  function buildMarkdown(){
    var L=[];
    L.push("# "+(state.title||"議事録"));
    var head=[];
    if(state.date) head.push(state.date);
    if(state.members) head.push("参加者："+state.members);
    if(head.length) L.push(head.join("　／　"));
    L.push("");
    var arr=sortedRows();
    var dec=arr.filter(function(r){return r.type==="decide";});
    var todo=arr.filter(function(r){return r.type==="todo";});
    var point=arr.filter(function(r){return r.type==="point";});

    if(dec.length){ L.push("## 決定事項"); dec.forEach(function(r){ L.push("- "+r.text+(r.speaker?"（"+r.speaker+"）":"")); }); L.push(""); }
    if(todo.length){ L.push("## ToDo"); todo.forEach(function(r){ L.push("- ["+(r.done?"x":" ")+"] "+r.text+(r.speaker?"（担当："+r.speaker+"）":"")); }); L.push(""); }
    if(point.length){ L.push("## 論点・宿題"); point.forEach(function(r){ L.push("- "+r.text+(r.speaker?"（"+r.speaker+"）":"")); }); L.push(""); }

    L.push("## 議事メモ");
    if(arr.length){
      arr.forEach(function(r){
        var mark = r.type==="decide"?"【決定】":r.type==="todo"?"【ToDo】":r.type==="point"?"【論点】":"";
        L.push("- "+(r.time?r.time+" ":"")+(r.speaker?r.speaker+"： ":"")+mark+r.text);
      });
    }else{
      L.push("- （記録なし）");
    }
    return L.join("\n");
  }
  function copyText(txt){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){ toast("コピーしました"); }, function(){ fallbackCopy(txt); });
    }else{ fallbackCopy(txt); }
  }
  function fallbackCopy(txt){
    var ta=document.createElement("textarea"); ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); toast("コピーしました"); }catch(e){ toast("コピーできませんでした"); }
    document.body.removeChild(ta);
  }
  function downloadMd(){
    var txt=buildMarkdown();
    var safe=(state.title||"議事録").replace(/[\\/:*?"<>|]/g,"_");
    var fn=safe+"_"+(state.date||nowDate())+".md";
    var blob=new Blob([txt],{type:"text/markdown;charset=utf-8"});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a"); a.href=url; a.download=fn; document.body.appendChild(a); a.click();
    document.body.removeChild(a); setTimeout(function(){ URL.revokeObjectURL(url); },1500);
    toast("保存しました");
  }

  /* ---------- 音声入力（自分のマイク） ---------- */
  var recog=null, listening=false;
  function toggleMic(){
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){ toast("この端末は音声入力に非対応です"); return; }
    if(listening){ if(recog) recog.stop(); return; }
    recog = new SR();
    recog.lang="ja-JP"; recog.continuous=true; recog.interimResults=true;
    var base = gid("compose").value;
    var finalAdd = "";
    recog.onresult=function(e){
      var interim="";
      for(var i=e.resultIndex;i<e.results.length;i++){
        var tr=e.results[i];
        if(tr.isFinal) finalAdd += tr[0].transcript; else interim += tr[0].transcript;
      }
      gid("compose").value = (base + finalAdd + interim);
    };
    recog.onerror=function(ev){ toast(ev.error==="not-allowed"?"マイクが許可されていません":"音声認識エラー"); };
    recog.onend=function(){
      listening=false; gid("micBtn").classList.remove("rec");
      base = gid("compose").value; // 確定分を土台に
    };
    try{ recog.start(); listening=true; gid("micBtn").classList.add("rec"); toast("聞き取り中…もう一度押すと停止"); }
    catch(e){ toast("音声入力を開始できませんでした"); }
  }

  /* ---------- toast ---------- */
  var toastT=null;
  function toast(msg){
    var el=gid("toast"); el.textContent=msg; el.classList.add("on");
    if(toastT) clearTimeout(toastT);
    toastT=setTimeout(function(){ el.classList.remove("on"); }, 1600);
  }

  /* ---------- init ---------- */
  load();
  bindMeta();
  refreshSpeakerList();
  render();
  bind();
})();
</script>
<!-- tsumiki-back-button -->
<style>
  #tsumikiEdge{position:fixed; top:0; bottom:0; left:0; width:22px; z-index:999;}
  #tsumikiPeek{
    position:fixed; top:50%; left:0; z-index:1001; margin-top:-23px;
    width:46px; height:46px; display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.92);
    -webkit-backdrop-filter:saturate(180%) blur(14px); backdrop-filter:saturate(180%) blur(14px);
    border:1px solid rgba(0,0,0,.06); border-radius:50%;
    box-shadow:0 6px 20px rgba(0,0,0,.18);
    color:#0071e3; font-size:24px; font-weight:600; line-height:1;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Helvetica Neue",Arial,sans-serif;
    transform:translateX(-70px) scale(.8); opacity:0; pointer-events:none;
  }
</style>
<div id="tsumikiEdge"></div>
<div id="tsumikiPeek">‹</div>
<script>
  (function(){
    var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
      || window.navigator.standalone === true;
    var fromTsumiki = false;
    try{
      if(document.referrer){
        var r = new URL(document.referrer);
        fromTsumiki = (r.origin === location.origin);
      }
    }catch(e){}
    if(!(standalone && fromTsumiki)) return;

    var peek = document.getElementById('tsumikiPeek');
    var edge = document.getElementById('tsumikiEdge');

    function goBack(){ location.href = 'index.html'; }

    /* --- 左端エッジスワイプで戻る（iOS純正の戻る操作。見えるボタンは置かない） --- */
    var sx=0, sy=0, prog=0, dragging=false, W=window.innerWidth;
    var TRIGGER = Math.min(120, W*0.32);
    window.addEventListener('resize', function(){ W=window.innerWidth; TRIGGER=Math.min(120, W*0.32); });

    function reset(){
      dragging = false; prog = 0;
      peek.style.transition = 'transform .25s ease, opacity .25s ease';
      peek.style.transform = 'translateX(-70px) scale(.8)';
      peek.style.opacity = 0;
    }
    function start(e){
      var t = e.touches ? e.touches[0] : e;
      if(t.clientX > 26) return;
      sx = t.clientX; sy = t.clientY; prog = 0; dragging = true;
      peek.style.transition = 'none';
    }
    function move(e){
      if(!dragging) return;
      var t = e.touches ? e.touches[0] : e;
      var dx = t.clientX - sx, dy = t.clientY - sy;
      if(Math.abs(dy) > Math.abs(dx) + 12){ reset(); return; }
      if(dx < 0) dx = 0;
      prog = Math.min(dx / TRIGGER, 1);
      peek.style.transform = 'translateX(' + (-70 + prog*82) + 'px) scale(' + (0.8 + prog*0.2) + ')';
      peek.style.opacity = prog;
      if(dx > 6 && e.cancelable) e.preventDefault();
    }
    function end(){
      if(!dragging) return;
      dragging = false;
      if(prog >= 0.999){
        peek.style.transition = 'transform .25s ease, opacity .25s ease';
        peek.style.transform = 'translateX(20px) scale(1.05)';
        peek.style.opacity = 1;
        goBack();
      }else{
        reset();
      }
    }
    edge.addEventListener('touchstart', start, {passive:true});
    window.addEventListener('touchmove', move, {passive:false});
    window.addEventListener('touchend', end, {passive:true});
    window.addEventListener('touchcancel', end, {passive:true});
  })();
</script>
<!-- /tsumiki-back-button -->
</body>
