<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="apple-touch-icon" href="icons/icon-rashinban.png">
<meta name="apple-mobile-web-app-title" content="らしんばん">
<title>らしんばん — 人生の向かう先と、毎日の積み上げ</title>
<style>
  :root{
    --bg:#f4f1ea; --card:#ffffff; --ink:#2a2a28; --sub:#7d7a70;
    --line:#e8e1d3; --accent:#626acb; --accent2:#858ce0;
    --gold:#d9a441; --ok:#3f9368; --fire:#c96e42; --warn:#d98a3d;
    --surf:#faf8f2; --link:#e0d8c8; --tint:#edecf8;
    --radius:20px;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  [hidden]{display:none !important;}
  html,body{overscroll-behavior-y:none;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Helvetica Neue",Arial,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.6;
    padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 82px);
    -webkit-font-smoothing:antialiased; min-height:100vh;
  }
  .wrap{max-width:560px; margin:0 auto; padding:0 16px;}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
  input,select,textarea{font-family:inherit; font-size:16px; color:var(--ink);}
  textarea{resize:none;}

  /* ===== ヘッダー ===== */
  header{padding:22px 4px 6px; display:flex; align-items:center; gap:10px;}
  header .logo{font-size:26px; line-height:1;}
  header h1{font-size:21px; font-weight:800; letter-spacing:-.02em;}
  header .sync{margin-left:auto; display:flex; align-items:center; gap:6px;
    font-size:11px; color:var(--sub); background:var(--card); border:1px solid var(--line);
    border-radius:999px; padding:5px 10px;}
  .sync .dot{width:7px; height:7px; border-radius:50%; background:var(--ok);}
  .sync .dot.off{background:#c7c7cc;} .sync .dot.local{background:#c7c7cc;}

  /* ===== カード共通 ===== */
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; margin-bottom:12px; box-shadow:0 1px 2px rgba(27,34,54,.03);}
  .sec-h{font-size:13px; font-weight:800; color:var(--sub); letter-spacing:.02em;
    margin:18px 4px 10px; display:flex; align-items:center; gap:8px;}
  .sec-h .add{margin-left:auto; font-size:13px; color:var(--accent); font-weight:700;
    background:var(--tint); border-radius:999px; padding:5px 13px;}
  .sec-h .add:active{transform:scale(.95);}

  /* 今日のサマリー（平面・クリーム） */
  .today{background:var(--card); color:var(--ink); border:1px solid var(--line);
    text-align:center; padding:20px 16px;}
  .today .d{font-size:12.5px; font-weight:700; color:var(--sub);}
  .today .big{font-size:46px; font-weight:800; letter-spacing:-.02em; line-height:1.05; margin:4px 0; color:var(--ink);}
  .today .big small{font-size:19px; font-weight:700; color:var(--sub);}
  .today .meta{font-size:12.5px; color:var(--sub); font-weight:700;}

  /* 習慣カード（つむ・最小化） */
  .habit{display:flex; align-items:center; gap:12px; padding:12px; border-radius:15px;
    background:var(--surf); border:1px solid var(--line); margin-bottom:9px;}
  .habit:last-child{margin-bottom:0;}
  .habit .ico{width:44px; height:44px; border-radius:13px; display:flex; align-items:center;
    justify-content:center; font-size:22px; flex:0 0 auto; background:#fff; border:1px solid var(--line);}
  .habit .body{min-width:0; flex:1 1 auto;}
  .habit .nm{font-size:15.5px; font-weight:700; display:flex; align-items:center; gap:7px; min-width:0;}
  .habit .hname{flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .habit .streak{flex:0 0 auto; white-space:nowrap; font-size:12px; font-weight:800; color:var(--fire);}
  .habit .week{display:flex; gap:4px; margin-top:7px;}
  .habit .week i{width:13px; height:13px; border-radius:5px; background:#e7e1d4; position:relative;}
  .habit .week i.on{background:var(--accent);}
  .habit .week i.today{box-shadow:0 0 0 1.6px var(--gold);}
  .habit .chk{flex:0 0 auto; width:38px; height:38px; border-radius:50%; border:2px solid var(--line);
    background:#fff; display:flex; align-items:center; justify-content:center; font-size:19px;
    color:transparent; transition:transform .12s ease;}
  .habit .chk:active{transform:scale(.88);}
  .habit .chk.done{background:var(--ok); border-color:var(--ok); color:#fff;}
  .habit.doneRow{opacity:.62;}

  .empty{text-align:center; color:var(--sub); font-size:14px; padding:26px 16px; line-height:1.8;}
  .empty .e{font-size:34px; display:block; margin-bottom:8px;}

  /* ===== ちず：ヘッダー＋モードトグル ===== */
  .map-head{display:flex; align-items:center; gap:10px; margin:18px 4px 10px;}
  .map-head .sec-h{margin:0; flex:1; min-width:0;}
  .mode-toggle{flex:0 0 auto; display:flex; gap:3px; padding:3px; border:1px solid var(--line);
    border-radius:999px; background:var(--card);}
  .mode-toggle button{height:28px; padding:0 11px; border-radius:999px; font-size:12px; font-weight:800; color:var(--sub);}
  .mode-toggle button.on{background:var(--accent); color:#fff;}

  /* ===== ちず：よむ（縦コンパスツリー） ===== */
  .ctree{position:relative;}
  .croot{display:flex; align-items:center; gap:9px; padding:4px 2px 4px; font-size:15px; font-weight:800;}
  .croot .ce{font-size:19px;}
  .ctrunk{margin-left:17px; border-left:1.5px solid var(--line);}
  .crow{position:relative; padding:6px 0 6px 16px;}
  .crow::before{content:''; position:absolute; left:0; top:21px; width:12px; height:1.5px; background:var(--line);}
  .cgpill{display:inline-flex; align-items:center; gap:8px; padding:8px 13px; border-radius:14px;
    background:#fff; border:1px solid var(--line); font-size:15px; font-weight:700; box-shadow:0 1px 2px rgba(27,34,54,.04);}
  .cgpill .gdot{width:9px; height:9px; border-radius:50%; flex:0 0 auto;}
  .cgpill.unc{color:var(--sub); background:var(--surf); font-weight:600;}
  .cgpill .cv{margin-left:6px; font-size:13px; color:var(--sub); transition:transform .18s ease;}
  .cgpill.open .cv{transform:rotate(180deg);}
  .copen{margin:4px 0 6px 9px; border-left:1.5px solid var(--line); padding-left:0;}
  .csub{position:relative; padding:6px 0 6px 14px;}
  .csub::before{content:''; position:absolute; left:0; top:15px; width:11px; height:1.5px; background:var(--line);}
  .csub .lab{font-size:11.5px; font-weight:800; color:var(--sub); display:flex; align-items:center; gap:5px; margin-bottom:3px;}
  .map-ideal-text{font-size:14px; line-height:1.55; display:-webkit-box; -webkit-line-clamp:2;
    -webkit-box-orient:vertical; overflow:hidden; overflow-wrap:anywhere;}
  .map-ideal-text.ph{color:#aab0c4;}
  .map-habits{display:flex; flex-wrap:wrap; gap:7px; min-width:0;}
  .map-habit-chip{display:inline-flex; align-items:center; gap:5px; max-width:min(100%,220px); min-width:0;
    padding:4px 10px; border-radius:999px; font-size:12.5px; font-weight:600; background:var(--surf); border:1px solid var(--line);}
  .map-habit-chip .name{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .map-habit-chip .s{color:var(--fire); font-weight:800; font-size:11px; flex:0 0 auto;}
  .map-habits .none{font-size:12.5px; color:var(--sub);}
  .goal{display:flex; align-items:flex-start; gap:9px; padding:5px 2px;}
  .goal .gc{flex:0 0 auto; width:21px; height:21px; margin-top:1px; border-radius:7px; border:2px solid var(--line);
    background:#fff; display:flex; align-items:center; justify-content:center; font-size:13px; color:transparent;}
  .goal .gc.done{background:var(--accent); border-color:var(--accent); color:#fff;}
  .goal .gt{flex:1; font-size:14px; line-height:1.5; overflow-wrap:anywhere;}
  .goal.done .gt{text-decoration:line-through; color:var(--sub);}
  .goal .gx{flex:0 0 auto; color:#c7c7cc; font-size:17px; padding:0 2px;}
  .goal-add{display:flex; gap:7px; margin-top:6px;}
  .goal-add input{flex:1; border:1px solid var(--line); border-radius:10px; padding:8px 10px; font-size:16px; background:var(--surf); min-width:0;}
  .goal-add input:focus{outline:none; border-color:var(--accent); background:#fff;}
  .goal-add button{flex:0 0 auto; background:var(--accent); color:#fff; border-radius:10px; padding:0 14px; font-size:14px; font-weight:700;}
  .cadd{margin:8px 0 4px 17px; font-size:13px; color:var(--sub); border:1px dashed var(--line);
    border-radius:12px; padding:10px 12px; display:flex; align-items:center; gap:7px; justify-content:center;}
  .cadd:active{transform:scale(.99);}

  /* ===== ちず：ひろげる（マインドマップ・キャンバス） ===== */
  .canvas-wrap{position:relative; height:calc(100vh - 230px); min-height:360px;
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;}
  .canvas-wrap svg{width:100%; height:100%; display:block; cursor:grab; touch-action:none;}
  .canvas-wrap svg:active{cursor:grabbing;}
  .map-node-rect{fill:var(--card); stroke:var(--line); stroke-width:1;
    filter:drop-shadow(0 1px 2px rgba(27,34,54,.05));}
  .map-node-rect.bundle{fill:var(--surf);}
  .map-node-rect.focus{stroke:var(--accent); stroke-width:1.8;}
  .map-node-title{font-size:13.5px; font-weight:700; fill:var(--ink);}
  .map-node-sub{font-size:11.5px; font-weight:600; fill:var(--sub);}
  .map-link{fill:none; stroke:var(--link); stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round;}
  .zc{position:absolute; right:10px; bottom:10px; display:flex; flex-direction:column; gap:7px;}
  .zc button{width:36px; height:36px; border-radius:10px; background:var(--card); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:19px; font-weight:700; color:var(--ink);
    box-shadow:0 2px 8px rgba(27,34,54,.1);}
  .zc button:active{transform:scale(.94);}
  .cplus{position:absolute; left:10px; bottom:10px; height:36px; padding:0 14px; border-radius:999px;
    background:var(--accent); color:#fff; font-size:14px; font-weight:800; display:flex; align-items:center; gap:6px;
    box-shadow:0 2px 8px rgba(79,87,199,.3);}
  .cplus:active{transform:scale(.97);}

  /* ===== タブバー ===== */
  .tabbar{position:fixed; left:0; right:0; bottom:0; z-index:40;
    background:rgba(255,255,255,.92); backdrop-filter:saturate(180%) blur(20px);
    -webkit-backdrop-filter:saturate(180%) blur(20px); border-top:1px solid var(--line);
    padding:8px 0 calc(env(safe-area-inset-bottom) + 6px); display:flex;}
  .tabbar button{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    color:var(--sub); font-size:10.5px; font-weight:700;}
  .tabbar button .ti{font-size:25px; line-height:1;}
  .tabbar button.on{color:var(--accent);}

  /* ===== モーダル ===== */
  .modal{position:fixed; inset:0; z-index:60; background:rgba(20,24,40,.42);
    display:flex; align-items:flex-end; justify-content:center;}
  @media(min-width:560px){ .modal{align-items:center;} }
  .sheet{background:var(--card); width:100%; max-width:520px; border-radius:22px 22px 0 0;
    padding:20px 18px calc(env(safe-area-inset-bottom) + 20px); max-height:88vh; overflow:auto;}
  @media(min-width:560px){ .sheet{border-radius:22px; margin:0 16px;} }
  .sheet h3{font-size:18px; font-weight:800; margin-bottom:16px; display:flex; align-items:center; gap:8px;}
  .sheet .row{margin-bottom:14px;}
  .sheet .row label{display:block; font-size:12px; font-weight:800; color:var(--sub); margin-bottom:6px;}
  .sheet .row input[type=text], .sheet .row select, .sheet .row textarea{
    width:100%; border:1px solid var(--line); border-radius:12px; padding:11px 13px;
    font-size:16px; background:var(--surf);}
  .sheet .row input:focus, .sheet .row select:focus, .sheet .row textarea:focus{
    outline:none; border-color:var(--accent); background:#fff;}
  .sheet .row textarea{min-height:96px; max-height:none; overflow:hidden; line-height:1.55;}
  .emojirow{display:flex; gap:7px; flex-wrap:wrap; margin-top:8px;}
  .emojirow button{width:40px; height:40px; border-radius:11px; font-size:21px; background:var(--surf);
    border:1px solid var(--line);}
  .emojirow button.on{background:var(--tint); border-color:var(--accent);}
  .colorrow{display:flex; gap:9px; flex-wrap:wrap; margin-top:8px;}
  .colorrow button{width:32px; height:32px; border-radius:50%; border:2px solid transparent;}
  .colorrow button.on{border-color:var(--ink);}
  .sheet .actions{display:flex; gap:10px; margin-top:18px;}
  .sheet .actions .save{flex:1; background:var(--accent); color:#fff; border-radius:13px;
    padding:13px; font-size:16px; font-weight:800;}
  .sheet .actions .save:active{transform:scale(.98);}
  .sheet .menu{display:flex; flex-direction:column; gap:8px;}
  .sheet .menu button{display:flex; align-items:center; gap:11px; width:100%; text-align:left;
    background:var(--surf); border:1px solid var(--line); border-radius:13px; padding:13px 14px;
    font-size:15px; font-weight:700;}
  .sheet .menu button .mi{font-size:19px; width:24px; text-align:center;}
  .sheet .menu button:active{transform:scale(.99);}
  .sheet .del{width:100%; text-align:center; color:#ff3b30; font-size:14px; font-weight:700;
    margin-top:14px; padding:8px;}
  .connlist{display:flex; flex-direction:column; gap:8px; margin-top:4px;}
  .connrow{display:flex; align-items:center; gap:10px; background:var(--surf); border:1px solid var(--line);
    border-radius:13px; padding:11px 13px;}
  .connrow .ce{font-size:18px; flex:0 0 auto;}
  .connrow .cn{flex:1; min-width:0; font-size:14.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .connrow .cs{flex:0 0 auto; font-size:11px; color:var(--fire); font-weight:800;}
  .connrow .ctk{flex:0 0 auto; width:24px; height:24px; border-radius:7px; border:2px solid var(--line);
    background:#fff; display:flex; align-items:center; justify-content:center; font-size:14px; color:transparent;}
  .connrow .ctk.on{background:var(--accent); border-color:var(--accent); color:#fff;}

  .toast{position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 96px); transform:translateX(-50%) translateY(20px);
    background:#1b2236; color:#fff; font-size:13.5px; font-weight:600; padding:11px 18px; border-radius:999px;
    opacity:0; pointer-events:none; transition:all .25s ease; z-index:80; white-space:nowrap;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="logo">🧭</span>
    <h1>らしんばん</h1>
    <span class="sync" id="syncChip"><span class="dot local" id="syncDot"></span><span id="syncText">接続中…</span></span>
  </header>
  <main id="view"></main>
</div>

<nav class="tabbar" id="tabbar">
  <button data-tab="tsumu" class="on" aria-label="つむ"><span class="ti">🔥</span></button>
  <button data-tab="chizu" aria-label="ちず"><span class="ti">🗺️</span></button>
</nav>

<div id="modal" class="modal" hidden><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ===================== Supabase（制作物アプリ共通プロジェクト） ===================== */
const SUPABASE_URL  = 'https://okbjqtdirrathscctyvx.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9rYmpxdGRpcnJhdGhzY2N0eXZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzMjI4NTIsImV4cCI6MjA5NTg5ODg1Mn0.T-1AOK6vCD6uGdqrVGXjPui3L6WPSNrnygS-IHyfZ6Y';
const sb = (window.supabase && window.supabase.createClient) ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON) : null;
const STATE_TABLE = 'rashinban_state';
const STATE_ID = 'kodai';
const KEY = 'rashinban_db_v1';
const MODE_KEY = 'rashinban_mapmode';

/* ===================== ユーティリティ ===================== */
const PALETTE = ['#626acb','#d98aa9','#d9a15b','#5aa879','#5aaeb5','#9586d8','#df8585','#7898cf'];
const WD = ['月','火','水','木','金','土','日'];
function uid(){ return Date.now().toString(36) + Math.floor(Math.random()*1e6).toString(36); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function today(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
function todayKey(){ return ymd(today()); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1700); }

function weekDates(){
  const n=today(); const mon=new Date(n); mon.setDate(n.getDate()-((n.getDay()+6)%7));
  return Array.from({length:7},(_,i)=>{ const x=new Date(mon); x.setDate(mon.getDate()+i); return x; });
}
function streak(h){
  let s=0; const d=today();
  if(!(h.log&&h.log[ymd(d)])) d.setDate(d.getDate()-1);   // 今日まだなら昨日から数える（途切れ扱いにしない）
  while(h.log && h.log[ymd(d)]){ s++; d.setDate(d.getDate()-1); }
  return s;
}
function weekCount(h){ return weekDates().reduce((a,d)=> a + (h.log&&h.log[ymd(d)]?1:0), 0); }

/* ===================== 状態 ===================== */
function blank(){ return { genres:[], habits:[], releases:[], memos:[], v:1 }; }
function seed(){
  const g = (name,emoji)=>({ id:uid(), name, emoji, color:'', ideal:'', current:'', goals:[] });
  const gs = [
    g('お金・資産','💰'), g('住まい・暮らし','🏠'), g('学び・教養','📚'),
    g('健康・からだ','💪'), g('心・余白','🧘')
  ];
  gs.forEach((x,i)=> x.color = PALETTE[i % PALETTE.length]);
  const learn = gs.find(x=>x.name.startsWith('学び'));
  const body  = gs.find(x=>x.name.startsWith('健康'));
  return {
    genres: gs,
    habits: [
      { id:uid(), name:'本を読む', emoji:'📖', genreId:learn.id, goalPerWeek:7, log:{}, created:Date.now() },
      { id:uid(), name:'散歩する', emoji:'🚶', genreId:body.id,  goalPerWeek:7, log:{}, created:Date.now() }
    ],
    releases: [], memos: [], v:1
  };
}
let db = blank();
let online = null;
let lastPushed = '';
let tab = 'tsumu';
let mapMode = (localStorage.getItem(MODE_KEY)==='wide') ? 'wide' : 'read';
let openGenreId = null;                 // よむモードのアコーディオン（揮発）
let cam = { s:1, tx:0, ty:0, init:false }; // ひろげるモードのカメラ（揮発）

/* ===================== 永続化・同期 ===================== */
function migrate(){
  if(!Array.isArray(db.genres)) db.genres=[];
  if(!Array.isArray(db.habits)) db.habits=[];
  if(!Array.isArray(db.releases)) db.releases=[];
  if(!Array.isArray(db.memos)) db.memos=[];
  db.genres.forEach((x,i)=>{ if(!x.color) x.color=PALETTE[i%PALETTE.length]; if(!Array.isArray(x.goals)) x.goals=[]; if(x.ideal==null)x.ideal=''; if(x.current==null)x.current=''; });
  db.habits.forEach(h=>{ if(!h.log||typeof h.log!=='object') h.log={}; if(typeof h.goalPerWeek!=='number') h.goalPerWeek=7; });
  db.memos.forEach(m=>{ if(!m.parentType) m.parentType='self'; if(m.parentId==null) m.parentId='self'; if(m.text==null) m.text=''; });
}
function loadLocal(){ try{ const s=localStorage.getItem(KEY); if(s) db=Object.assign(blank(), JSON.parse(s)); }catch(e){} }

let saveTimer=null;
function save(){
  migrate();
  localStorage.setItem(KEY, JSON.stringify(db));
  render();
  if(!sb) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async()=>{
    lastPushed = JSON.stringify(db);
    const { error } = await sb.from(STATE_TABLE).upsert({ id:STATE_ID, state: db, updated_at:new Date().toISOString() });
    if(error){ online=false; } else if(online!==true){ online=true; }
    renderSync();
  }, 350);
}
async function loadRemote(){
  if(!sb){
    online=false;
    if(!(db.genres.length || db.habits.length || db.releases.length)){
      db = seed(); migrate(); localStorage.setItem(KEY, JSON.stringify(db)); render();
    }
    renderSync(); return;
  }
  const { data, error } = await sb.from(STATE_TABLE).select('state').eq('id', STATE_ID).maybeSingle();
  if(error){ online=false; renderSync(); return; }
  online = true;
  if(data && data.state && typeof data.state==='object' && Array.isArray(data.state.genres)){
    db = Object.assign(blank(), data.state);
    migrate();
    localStorage.setItem(KEY, JSON.stringify(db));
    render();
  } else {
    // リモートに行が無い → 初回。ローカルがあればそれを、無ければ初期サンプルを種にする
    if(!(db.genres.length || db.habits.length || db.releases.length)) db = seed();
    save();
  }
  renderSync();
}
function subscribeRealtime(){
  if(!sb) return;
  sb.channel('rashinban-rt')
    .on('postgres_changes', { event:'*', schema:'public', table:STATE_TABLE, filter:'id=eq.'+STATE_ID },
      (payload)=>{
        const incoming = JSON.stringify((payload.new && payload.new.state) || {});
        if(incoming === lastPushed) return;
        if(payload.new && payload.new.state && Array.isArray(payload.new.state.genres)){
          db = Object.assign(blank(), payload.new.state); migrate();
          localStorage.setItem(KEY, JSON.stringify(db));
          render(); toast('🔄 他の端末から更新');
        }
      }).subscribe();
}
function renderSync(){
  const dot=document.getElementById('syncDot'), txt=document.getElementById('syncText');
  dot.classList.remove('off','local');
  if(!sb){ dot.classList.add('local'); txt.textContent='この端末に保存'; return; }
  if(online===true){ txt.textContent='クラウド同期中'; }
  else if(online===false){ dot.classList.add('off'); txt.textContent='オフライン（この端末に保存）'; }
  else { dot.classList.add('local'); txt.textContent='接続中…'; }
}

function habitsOfGenre(id){ return db.habits.filter(h=>h.genreId===id); }
function memosOf(parentType,parentId){ return db.memos.filter(m=>m.parentType===parentType && m.parentId===parentId); }
function unclassifiedHabits(){ return db.habits.filter(h=>!h.genreId || !genreById(h.genreId)); }

/* ---------- つむ（習慣・ホーム／最小化） ---------- */
function renderHome(){
  const tk = todayKey();
  const habits = db.habits.slice();
  const doneN = habits.filter(h=>h.log[tk]).length;
  const totalN = habits.length;
  const dt = new Date();
  const dStr = (dt.getMonth()+1)+'月'+dt.getDate()+'日（'+WD[(dt.getDay()+6)%7]+'）';

  let html = '<div class="card today">'+
    '<div class="d">'+dStr+'</div>'+
    '<div class="big">'+doneN+'<small> / '+totalN+'</small></div>'+
    '<div class="meta">'+(totalN===0?'習慣をひとつ、積みはじめよう':(doneN===totalN?'今日のつみあげ、ぜんぶ達成 🎉':'今日のつみあげ'))+'</div>'+
  '</div>';

  html += '<div class="sec-h">🔥 今日の習慣<button class="add" onclick="openHabit()">＋ 習慣</button></div>';

  if(!habits.length){
    html += '<div class="card empty"><span class="e">🌱</span>まだ習慣がありません。<br>「本を読む」「散歩する」など、<br>小さく続けたいことを足してみましょう。</div>';
  } else {
    const sorted = habits.sort((a,b)=> (a.log[tk]?1:0)-(b.log[tk]?1:0));
    const wd = weekDates(); const todayIdx = (new Date().getDay()+6)%7;
    html += '<div class="card">';
    html += sorted.map(h=>{
      const done = !!h.log[tk];
      const st = streak(h);
      const week = wd.map((d,i)=>'<i class="'+(h.log[ymd(d)]?'on':'')+(i===todayIdx?' today':'')+'"></i>').join('');
      const sbg = st>0? '<span class="streak">🔥'+st+'</span>' : '';
      return '<div class="habit '+(done?'doneRow':'')+'">'+
        '<div class="ico" onclick="openHabit(\''+h.id+'\')">'+esc(h.emoji||'⭐')+'</div>'+
        '<div class="body" onclick="openHabit(\''+h.id+'\')">'+
          '<div class="nm"><span class="hname">'+esc(h.name)+'</span>'+sbg+'</div>'+
          '<div class="week">'+week+'</div>'+
        '</div>'+
        '<button class="chk '+(done?'done':'')+'" onclick="toggleHabit(\''+h.id+'\')">✓</button>'+
      '</div>';
    }).join('');
    html += '</div>';
  }
  view.innerHTML = html;
}
function toggleHabit(id){
  const h = db.habits.find(x=>x.id===id); if(!h) return;
  const tk = todayKey();
  if(h.log[tk]) delete h.log[tk]; else { h.log[tk]=true; }
  save();
}

/* ---------- ひろげる（マインドマップ・キャンバス／自前SVG） ---------- */
const MAP_NODE = { root:{minW:118,maxW:160}, genre:{minW:142,maxW:190}, bundle:{minW:132,maxW:170}, item:{minW:160,maxW:220} };
const MAP_T = { maxLines:2, padX:12, padY:9, fontSize:13.5, subFontSize:11.5, lineH:18, radius:14, colGap:72, rowGap:14 };
const COLX = [16, 16+186, 16+186+204, 16+186+204+242]; // 列の左x（colGap込みの概算）

let _measEl = null;
function measureText(svg, str, fontSize){
  if(!_measEl){ _measEl=document.createElementNS('http://www.w3.org/2000/svg','text');
    _measEl.setAttribute('x',-9999); _measEl.setAttribute('y',-9999); _measEl.setAttribute('font-weight','700');
    svg.appendChild(_measEl); }
  _measEl.setAttribute('font-size',fontSize); _measEl.textContent=str;
  return _measEl.getComputedTextLength();
}
function fitText(svg, str, kind){
  str = String(str==null?'':str);
  const spec = MAP_NODE[kind]||MAP_NODE.item;
  const fs = MAP_T.fontSize, contentMax = spec.maxW - MAP_T.padX*2;
  const full = measureText(svg, str, fs);
  if(full <= contentMax){
    const w = Math.max(spec.minW, Math.min(spec.maxW, Math.ceil(full)+MAP_T.padX*2));
    return { lines:[str], w };
  }
  // 2行に分割（日本語＝文字単位）
  let line1='', i=0;
  for(; i<str.length; i++){ if(measureText(svg, line1+str[i], fs) > contentMax) break; line1+=str[i]; }
  let rest = str.slice(line1.length);
  if(measureText(svg, rest, fs) <= contentMax){
    return { lines:[line1, rest], w:spec.maxW };
  }
  // 2行目も溢れる → 末尾を削って…
  let line2='';
  for(let j=0; j<rest.length; j++){ if(measureText(svg, line2+rest[j]+'…', fs) > contentMax) break; line2+=rest[j]; }
  return { lines:[line1, line2+'…'], w:spec.maxW };
}

function buildMapModel(svg){
  // ノード木を構築（visibleなものだけ）。各ノード {id,kind,col,fit,w,h,emoji,sub,color,focus,data,children}
  const nodes=[];
  function mk(o){ const f = o.fit; const sub = o.sub; const h = MAP_T.padY*2 + f.lines.length*MAP_T.lineH + (sub?MAP_T.lineH-3:0); nodes.push(o); o.h=h; o.w=f.w; o.children=o.children||[]; return o; }

  const root = mk({ id:'self', kind:'root', col:0, fit:fitText(svg,'🧭 自分','root'), emoji:'' });
  db.genres.forEach(g=>{
    const gf = fitText(svg, (g.emoji||'⭐')+' '+g.name, 'genre');
    const gn = mk({ id:'g:'+g.id, kind:'genre', col:1, fit:gf, color:g.color, data:{type:'genre',gid:g.id} });
    root.children.push(gn);
    // 向かう先（idealがある時のみ）
    if(g.ideal){
      const bf = fitText(svg, '向かう先', 'bundle');
      const idealFit = fitText(svg, g.ideal, 'bundle');
      const node = mk({ id:'id:'+g.id, kind:'bundle', col:2, fit:bf, sub:g.ideal, subLines:idealFit.lines, data:{type:'ideal',gid:g.id} });
      node.w = Math.max(node.w, idealFit.w);
      gn.children.push(node);
    }
    // 目印（goalsがある時のみ束、子=各goal）
    const goals = g.goals||[];
    if(goals.length){
      const bn = mk({ id:'gb:'+g.id, kind:'bundle', col:2, fit:fitText(svg,'目印','bundle'), data:{type:'goalbundle',gid:g.id} });
      gn.children.push(bn);
      goals.forEach(go=>{ bn.children.push(mk({ id:'go:'+go.id, kind:'item', col:3, fit:fitText(svg,(go.done?'✓ ':'')+go.text,'item'), data:{type:'goal',gid:g.id,goid:go.id} })); });
    }
    // 支える習慣（ある時のみ）
    const hs = habitsOfGenre(g.id);
    if(hs.length){
      const bn = mk({ id:'hb:'+g.id, kind:'bundle', col:2, fit:fitText(svg,'支える習慣','bundle'), data:{type:'habitbundle',gid:g.id} });
      gn.children.push(bn);
      hs.forEach(h=>{ const s=streak(h); bn.children.push(mk({ id:'h:'+h.id, kind:'item', col:3, fit:fitText(svg,(h.emoji||'⭐')+' '+h.name+(s>0?' 🔥'+s:''),'item'), data:{type:'habit',hid:h.id} })); });
    }
    // メモ（ある時のみ）
    const gms = memosOf('genre', g.id);
    if(gms.length){
      const bn = mk({ id:'mb:'+g.id, kind:'bundle', col:2, fit:fitText(svg,'メモ','bundle'), data:{type:'membundle',pt:'genre',pid:g.id} });
      gn.children.push(bn);
      gms.forEach(m=>{ bn.children.push(mk({ id:'m:'+m.id, kind:'item', col:3, fit:fitText(svg,'📝 '+m.text,'item'), data:{type:'memo',mid:m.id} })); });
    }
  });
  // 未分類の習慣
  const unc = unclassifiedHabits();
  if(unc.length){
    const un = mk({ id:'unc', kind:'genre', col:1, fit:fitText(svg,'🌱 まだ地図にない習慣','genre'), color:'#c7c7cc', data:{type:'unc'} });
    root.children.push(un);
    unc.forEach(h=>{ const s=streak(h); un.children.push(mk({ id:'h:'+h.id, kind:'item', col:2, fit:fitText(svg,(h.emoji||'⭐')+' '+h.name+(s>0?' 🔥'+s:''),'item'), data:{type:'habit',hid:h.id} })); });
  }
  // 自分直下のメモ
  const sms = memosOf('self','self');
  if(sms.length){
    const bn = mk({ id:'mb:self', kind:'bundle', col:1, fit:fitText(svg,'メモ','bundle'), data:{type:'membundle',pt:'self',pid:'self'} });
    root.children.push(bn);
    sms.forEach(m=>{ bn.children.push(mk({ id:'m:'+m.id, kind:'item', col:2, fit:fitText(svg,'📝 '+m.text,'item'), data:{type:'memo',mid:m.id} })); });
  }
  return { root, nodes };
}

function layoutMap(root){
  let cursor = 20;
  (function place(n){
    n.x = COLX[n.col]!=null ? COLX[n.col] : (16 + n.col*210);
    if(!n.children.length){ n.y = cursor; cursor += n.h + MAP_T.rowGap; }
    else { n.children.forEach(place); const f=n.children[0], l=n.children[n.children.length-1];
      n.y = (f.y + l.y + l.h)/2 - n.h/2; }
    n.cy = n.y + n.h/2;
  })(root);
}

function renderCanvas(){
  view.insertAdjacentHTML('beforeend',
    '<div class="canvas-wrap"><svg id="mmsvg"><g id="cam"></g></svg>'+
    '<div class="zc"><button onclick="zoomCanvas(1.25)">＋</button><button onclick="zoomCanvas(0.8)">−</button><button onclick="fitCanvas()">⤢</button></div>'+
    '<button class="cplus" onclick="openGenre()">＋ ジャンル</button></div>');
  const svg = document.getElementById('mmsvg');
  const camG = document.getElementById('cam');
  _measEl = null;

  if(!db.genres.length && !unclassifiedHabits().length){
    view.querySelector('.canvas-wrap').insertAdjacentHTML('afterbegin',
      '<div class="empty" style="position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;pointer-events:none"><span class="e">🧭</span>左下の「＋ ジャンル」から<br>地図を描きはじめよう</div>');
    return;
  }

  const NS='http://www.w3.org/2000/svg';
  const { root } = buildMapModel(svg);
  layoutMap(root);

  // エッジ
  (function edges(n){ n.children.forEach(c=>{
    const x1=n.x+n.w, y1=n.cy, x2=c.x, y2=c.cy, mx=Math.max(x1+18,(x1+x2)/2);
    const p=document.createElementNS(NS,'path');
    p.setAttribute('class','map-link');
    p.setAttribute('d','M'+x1+','+y1+' C'+mx+','+y1+' '+mx+','+y2+' '+x2+','+y2);
    camG.appendChild(p); edges(c);
  }); })(root);

  // ノード
  (function draw(n){
    const g=document.createElementNS(NS,'g'); g.style.cursor='pointer';
    const r=document.createElementNS(NS,'rect');
    r.setAttribute('x',n.x); r.setAttribute('y',n.y); r.setAttribute('width',n.w); r.setAttribute('height',n.h);
    r.setAttribute('rx',MAP_T.radius);
    r.setAttribute('class','map-node-rect'+(n.kind==='bundle'?' bundle':''));
    g.appendChild(r);
    // ジャンルドット
    let tx0 = n.x + MAP_T.padX;
    if(n.kind==='genre' && n.color){
      const dot=document.createElementNS(NS,'circle');
      dot.setAttribute('cx',n.x+MAP_T.padX+4); dot.setAttribute('cy',n.cy); dot.setAttribute('r',5); dot.setAttribute('fill',n.color);
      g.appendChild(dot); tx0 = n.x + MAP_T.padX + 16;
    }
    // タイトル（最大2行）
    const t=document.createElementNS(NS,'text');
    t.setAttribute('class','map-node-title'); t.setAttribute('x',tx0);
    const totalLines = n.fit.lines.length;
    const blockH = totalLines*MAP_T.lineH + (n.sub? (MAP_T.lineH-3):0);
    let ty = n.y + (n.h-blockH)/2 + MAP_T.fontSize;
    n.fit.lines.forEach((ln,i)=>{ const ts=document.createElementNS(NS,'tspan'); ts.setAttribute('x',tx0); ts.setAttribute('y',ty+i*MAP_T.lineH); ts.textContent=ln; t.appendChild(ts); });
    g.appendChild(t);
    // sub（向かう先本文）
    if(n.sub){
      const s=document.createElementNS(NS,'text'); s.setAttribute('class','map-node-sub'); s.setAttribute('x',tx0);
      const sy = ty + totalLines*MAP_T.lineH;
      (n.subLines||[n.sub]).forEach((ln,i)=>{ const ts=document.createElementNS(NS,'tspan'); ts.setAttribute('x',tx0); ts.setAttribute('y',sy+i*(MAP_T.lineH-3)); ts.textContent=ln; t && s.appendChild(ts); });
      g.appendChild(s);
    }
    g.addEventListener('click', function(){ if(_moved) return; onNodeTap(n); });
    camG.appendChild(g);
    n.children.forEach(draw);
  })(root);

  // カメラ
  if(!cam.init){ fitCanvas(true); } else { applyCam(); }
  wirePanZoom(svg);
}

let _moved=false, _panning=false, _psx=0, _psy=0;
function applyCam(){ const g=document.getElementById('cam'); if(g) g.setAttribute('transform','translate('+cam.tx+','+cam.ty+') scale('+cam.s+')'); }
function clampS(v){ return Math.max(0.35, Math.min(2, v)); }
function zoomCanvas(f){ const svg=document.getElementById('mmsvg'); if(!svg) return; const W=svg.clientWidth/2, H=svg.clientHeight/2;
  const ns=clampS(cam.s*f); const k=ns/cam.s; cam.tx = W - (W-cam.tx)*k; cam.ty = H - (H-cam.ty)*k; cam.s=ns; applyCam(); }
function fitCanvas(initial){
  const svg=document.getElementById('mmsvg'), camG=document.getElementById('cam'); if(!svg||!camG) return;
  const bb = camG.getBBox(); const W=svg.clientWidth, H=svg.clientHeight; if(!bb.width||!bb.height) return;
  const s = clampS(Math.min(W/(bb.width+40), H/(bb.height+40), 1));
  cam.s = s; cam.tx = (W - bb.width*s)/2 - bb.x*s; cam.ty = (H - bb.height*s)/2 - bb.y*s; cam.init=true; applyCam();
}
function wirePanZoom(svg){
  svg.addEventListener('pointerdown', e=>{ _panning=true; _moved=false; _psx=e.clientX; _psy=e.clientY; try{svg.setPointerCapture(e.pointerId);}catch(err){} });
  svg.addEventListener('pointermove', e=>{ if(!_panning) return; const dx=e.clientX-_psx, dy=e.clientY-_psy;
    if(Math.abs(dx)+Math.abs(dy)>6) _moved=true; cam.tx+=dx; cam.ty+=dy; _psx=e.clientX; _psy=e.clientY; applyCam(); });
  const up=()=>{ _panning=false; }; svg.addEventListener('pointerup',up); svg.addEventListener('pointercancel',up);
}

function onNodeTap(n){
  const d=n.data||{};
  if(d.type==='genre') return openGenreMenu(d.gid);
  if(d.type==='ideal') return openIdeal(d.gid);
  if(d.type==='goalbundle') return openGenreMenu(d.gid);
  if(d.type==='habitbundle') return openConnect(d.gid);
  if(d.type==='membundle') return openAddMemo(d.pt, d.pid);
  if(d.type==='goal') return openGoalSheet(d.gid, d.goid);
  if(d.type==='habit') return openHabit(d.hid);
  if(d.type==='memo') return openMemoSheet(d.mid);
  if(d.type==='unc') return; // 未分類は習慣タップで繋ぐ
  if(n.id==='self') return openAddMemo('self','self');
}
function openGenreMenu(gid){
  const g=genreById(gid); if(!g) return;
  openModal('<h3>'+esc(g.emoji+' '+g.name)+'</h3>'+
    '<div class="menu">'+
      '<button onclick="openGenre(\''+gid+'\')"><span class="mi">✎</span>ジャンルを編集</button>'+
      '<button onclick="openIdeal(\''+gid+'\')"><span class="mi">⭐</span>向かう先を書く</button>'+
      '<button onclick="openConnect(\''+gid+'\')"><span class="mi">🔥</span>習慣をつなぐ</button>'+
      '<button onclick="openAddMemo(\'genre\',\''+gid+'\')"><span class="mi">📝</span>メモを足す</button>'+
    '</div>'+
    '<div class="row" style="margin-top:16px"><label>🪜 目印を足す</label>'+
      '<div class="goal-add"><input type="text" id="menuGoal" placeholder="例：年内に貯金を◯◯万円に"><button onclick="addGoalFromMenu(\''+gid+'\')">追加</button></div></div>');
}
function addGoalFromMenu(gid){ const inp=document.getElementById('menuGoal'); const t=inp.value.trim(); if(!t)return;
  const g=genreById(gid); if(!g)return; if(!Array.isArray(g.goals))g.goals=[]; g.goals.push({id:uid(),text:t,done:false}); closeModal(); toast('🪜 目印を足した'); save(); }
function openGoalSheet(gid,goid){
  const g=genreById(gid); if(!g)return; const go=(g.goals||[]).find(x=>x.id===goid); if(!go)return;
  openModal('<h3>🪜 目印</h3><div class="row"><div style="font-size:15px;font-weight:700">'+esc(go.text)+'</div></div>'+
    '<div class="menu"><button onclick="toggleGoal(\''+gid+'\',\''+goid+'\');closeModal()"><span class="mi">'+(go.done?'↩':'✓')+'</span>'+(go.done?'未達成に戻す':'達成にする')+'</button></div>'+
    '<button class="del" onclick="delGoal(\''+gid+'\',\''+goid+'\');closeModal()">この目印を削除</button>');
}
function openConnect(gid){
  const g=genreById(gid); if(!g) return;
  const rows = db.habits.map(h=>{ const on=h.genreId===gid; const s=streak(h);
    return '<div class="connrow" onclick="toggleConnect(\''+h.id+'\',\''+gid+'\',this)">'+
      '<span class="ce">'+esc(h.emoji||'⭐')+'</span><span class="cn">'+esc(h.name)+'</span>'+
      (s>0?'<span class="cs">🔥'+s+'</span>':'')+'<span class="ctk'+(on?' on':'')+'">✓</span></div>'; }).join('');
  openModal('<h3>🔥 '+esc(g.name)+' を支える習慣</h3>'+
    (db.habits.length? '<div class="connlist">'+rows+'</div>' : '<div class="empty" style="padding:14px">まだ習慣がありません</div>')+
    '<div class="actions"><button class="save" onclick="openHabitFor(\''+gid+'\')">＋ 新しい習慣をこのジャンルに</button></div>');
}
function toggleConnect(hid,gid,el){
  const h=db.habits.find(x=>x.id===hid); if(!h) return;
  h.genreId = (h.genreId===gid)? '' : gid;
  const tk=el.querySelector('.ctk'); if(tk) tk.classList.toggle('on', h.genreId===gid);
  localStorage.setItem(KEY, JSON.stringify(db));
  clearTimeout(saveTimer); saveTimer=setTimeout(async()=>{ if(!sb)return; lastPushed=JSON.stringify(db);
    await sb.from(STATE_TABLE).upsert({id:STATE_ID,state:db,updated_at:new Date().toISOString()}); },350);
}
function openHabitFor(gid){ closeModal(); openHabit(null, gid); }
function openAddMemo(pt,pid){
  openModal('<h3>📝 メモを足す</h3>'+
    '<div class="row"><textarea id="memoText" data-autogrow oninput="autoGrow(this)" placeholder="思いついたこと・気づき（例：固定費を見直すと自由が増える）"></textarea></div>'+
    '<div class="actions"><button class="save" onclick="saveNewMemo(\''+pt+'\',\''+pid+'\')">足す</button></div>');
  setTimeout(()=>{ const t=document.getElementById('memoText'); if(t) t.focus(); },50);
}
function saveNewMemo(pt,pid){ const t=document.getElementById('memoText').value.trim(); if(!t){ closeModal(); return; }
  db.memos.push({ id:uid(), parentType:pt, parentId:pid, text:t, created:Date.now() }); closeModal(); toast('📝 メモを足した'); save(); }
function openMemoSheet(mid){
  const m=db.memos.find(x=>x.id===mid); if(!m) return;
  openModal('<h3>📝 メモ</h3>'+
    '<div class="row"><textarea id="memoEdit" data-autogrow oninput="autoGrow(this)">'+esc(m.text)+'</textarea></div>'+
    '<div class="actions"><button class="save" onclick="saveMemo(\''+mid+'\')">保存</button></div>'+
    '<button class="del" onclick="delMemo(\''+mid+'\')">このメモを削除</button>');
}
function saveMemo(mid){ const m=db.memos.find(x=>x.id===mid); if(!m)return; m.text=document.getElementById('memoEdit').value.trim(); closeModal(); save(); }
function delMemo(mid){ db.memos=db.memos.filter(x=>x.id!==mid); closeModal(); save(); }

/* ===================== モーダル ===================== */
const modal=document.getElementById('modal'), sheet=document.getElementById('sheet');
function autoGrow(el){ el.style.height='auto'; el.style.height=el.scrollHeight+'px'; }
function openModal(html){ sheet.innerHTML=html; modal.hidden=false;
  requestAnimationFrame(()=>sheet.querySelectorAll('textarea[data-autogrow]').forEach(autoGrow)); }
function closeModal(){ modal.hidden=true; sheet.innerHTML=''; }
modal.addEventListener('click', e=>{ if(e.target===modal) closeModal(); });

const HABIT_EMOJI = ['📖','🏃','🚶','🧘','💧','💪','🥗','😴','✍️','🧹','🌅','📝','🎸','🗣️','🙏','☀️'];
const GENRE_EMOJI = ['💰','🏠','📚','💪','🧘','❤️','🌍','🎯','👪','🎨','🌱','⛰️'];

/* 習慣の追加・編集（目標ペース選択は廃止） */
let editHabitId=null, tmpHE='';
function openHabit(id, presetGenre){
  editHabitId=id||null;
  const h = id? db.habits.find(x=>x.id===id) : null;
  tmpHE = h? (h.emoji||'⭐') : '📖';
  const selGid = h? h.genreId : (presetGenre||'');
  const gopts = db.genres.map(g=>'<option value="'+g.id+'" '+(selGid===g.id?'selected':'')+'>'+esc(g.emoji+' '+g.name)+'</option>').join('');
  const emo = HABIT_EMOJI.map(e=>'<button class="'+(e===tmpHE?'on':'')+'" onclick="pickHE(this,\''+e+'\')">'+e+'</button>').join('');
  openModal(
    '<h3>'+(id?'習慣を編集':'🔥 習慣を追加')+'</h3>'+
    '<div class="row"><label>絵文字</label><div class="emojirow" id="heRow">'+emo+'</div></div>'+
    '<div class="row"><label>習慣の名前</label><input type="text" id="hName" placeholder="例：本を読む" value="'+(h?esc(h.name):'')+'"></div>'+
    '<div class="row"><label>つながる人生ジャンル</label><select id="hGenre"><option value="">（ジャンルなし）</option>'+gopts+'</select></div>'+
    '<div class="actions"><button class="save" onclick="saveHabit()">'+(id?'保存':'追加する')+'</button></div>'+
    (id?'<button class="del" onclick="deleteHabit()">この習慣を削除</button>':'')
  );
}
function pickHE(btn,e){ tmpHE=e; document.querySelectorAll('#heRow button').forEach(b=>b.classList.remove('on')); btn.classList.add('on'); }
function saveHabit(){
  const name=document.getElementById('hName').value.trim(); if(!name){ toast('名前を入れてね'); return; }
  const genreId=document.getElementById('hGenre').value||'';
  if(editHabitId){
    const h=db.habits.find(x=>x.id===editHabitId);
    Object.assign(h,{ name, emoji:tmpHE, genreId });
  } else {
    db.habits.push({ id:uid(), name, emoji:tmpHE, genreId, goalPerWeek:7, log:{}, created:Date.now() });
  }
  closeModal(); save();
}
function deleteHabit(){
  if(!confirm('この習慣を削除しますか？\n（記録もすべて消えます）')) return;
  db.habits=db.habits.filter(x=>x.id!==editHabitId); closeModal(); save();
}

/* ジャンルの追加・編集 */
let editGenreId=null, tmpGE='💰', tmpGC='';
function openGenre(id){
  editGenreId=id||null;
  const g = id? genreById(id) : null;
  tmpGE = g? (g.emoji||'⭐') : '🎯';
  tmpGC = g? (g.color||PALETTE[db.genres.length%PALETTE.length]) : PALETTE[db.genres.length%PALETTE.length];
  const emo = GENRE_EMOJI.map(e=>'<button class="'+(e===tmpGE?'on':'')+'" onclick="pickGE(this,\''+e+'\')">'+e+'</button>').join('');
  const cols = PALETTE.map(c=>'<button class="'+(c===tmpGC?'on':'')+'" style="background:'+c+'" onclick="pickGC(this,\''+c+'\')"></button>').join('');
  openModal(
    '<h3>'+(id?'ジャンルを編集':'🗺️ 人生ジャンルを追加')+'</h3>'+
    '<div class="row"><label>絵文字</label><div class="emojirow" id="geRow">'+emo+'</div></div>'+
    '<div class="row"><label>色</label><div class="colorrow" id="gcRow">'+cols+'</div></div>'+
    '<div class="row"><label>ジャンル名</label><input type="text" id="gName" placeholder="例：お金・資産 / 健康 / 学び" value="'+(g?esc(g.name):'')+'"></div>'+
    '<div class="actions"><button class="save" onclick="saveGenre()">'+(id?'保存':'追加する')+'</button></div>'+
    (id?'<button class="del" onclick="deleteGenre()">このジャンルを削除</button>':'')
  );
}
function pickGE(btn,e){ tmpGE=e; document.querySelectorAll('#geRow button').forEach(b=>b.classList.remove('on')); btn.classList.add('on'); }
function pickGC(btn,c){ tmpGC=c; document.querySelectorAll('#gcRow button').forEach(b=>b.classList.remove('on')); btn.classList.add('on'); }
function saveGenre(){
  const name=document.getElementById('gName').value.trim(); if(!name){ toast('名前を入れてね'); return; }
  if(editGenreId){
    const g=genreById(editGenreId); Object.assign(g,{ name, emoji:tmpGE, color:tmpGC });
  } else {
    db.genres.push({ id:uid(), name, emoji:tmpGE, color:tmpGC, ideal:'', current:'', goals:[] });
  }
  closeModal(); save();
}
function deleteGenre(){
  const hs=habitsOfGenre(editGenreId);
  const ms=memosOf('genre',editGenreId);
  let msg = 'このジャンルを削除しますか？';
  if(hs.length) msg += '\nつながっている習慣 '+hs.length+'件は「まだ地図にない習慣」になります。';
  if(ms.length) msg += '\nメモ '+ms.length+'件は削除されます。';
  if(!confirm(msg)) return;
  db.habits.forEach(h=>{ if(h.genreId===editGenreId) h.genreId=''; });   // 習慣はジャンルなしに
  db.memos = db.memos.filter(m=>!(m.parentType==='genre' && m.parentId===editGenreId)); // メモは削除
  // releases.genreId は書き換えない（隠れデータを黙って変えない）
  db.genres=db.genres.filter(g=>g.id!==editGenreId);
  if(openGenreId===editGenreId) openGenreId=null;
  closeModal(); save();
}

/* ===================== タブ ===================== */
document.getElementById('tabbar').addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b) return;
  tab=b.dataset.tab;
  document.querySelectorAll('#tabbar button').forEach(x=>x.classList.toggle('on', x.dataset.tab===tab));
  window.scrollTo(0,0); render();
});

/* ===================== 起動 ===================== */
loadLocal(); migrate(); render(); renderSync();
loadRemote(); subscribeRealtime();
</script>
<!-- tsumiki-back-button -->
<style>
  #tsumikiEdge{position:fixed; top:0; bottom:0; left:0; width:22px; z-index:999;}
  #tsumikiPeek{
    position:fixed; top:50%; left:0; z-index:1001; margin-top:-23px;
    width:46px; height:46px; display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.92);
    -webkit-backdrop-filter:saturate(180%) blur(14px); backdrop-filter:saturate(180%) blur(14px);
    border:1px solid rgba(0,0,0,.06); border-radius:50%;
    box-shadow:0 6px 20px rgba(0,0,0,.18);
    color:#0071e3; font-size:24px; font-weight:600; line-height:1;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Helvetica Neue",Arial,sans-serif;
    transform:translateX(-70px) scale(.8); opacity:0; pointer-events:none;
  }
</style>
<div id="tsumikiEdge"></div>
<div id="tsumikiPeek">‹</div>
<script>
  (function(){
    var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
      || window.navigator.standalone === true;
    var fromTsumiki = false;
    try{
      if(document.referrer){
        var r = new URL(document.referrer);
        fromTsumiki = (r.origin === location.origin);
      }
    }catch(e){}
    if(!(standalone && fromTsumiki)) return;

    var peek = document.getElementById('tsumikiPeek');
    var edge = document.getElementById('tsumikiEdge');

    function goBack(){ location.href = 'index.html'; }

    /* --- 左端エッジスワイプで戻る（iOS純正の戻る操作。見えるボタンは置かない） --- */
    var sx=0, sy=0, prog=0, dragging=false, W=window.innerWidth;
    var TRIGGER = Math.min(120, W*0.32);
    window.addEventListener('resize', function(){ W=window.innerWidth; TRIGGER=Math.min(120, W*0.32); });

    function reset(){
      dragging = false; prog = 0;
      peek.style.transition = 'transform .25s ease, opacity .25s ease';
      peek.style.transform = 'translateX(-70px) scale(.8)';
      peek.style.opacity = 0;
    }
    function start(e){
      var t = e.touches ? e.touches[0] : e;
      if(t.clientX > 26) return;
      sx = t.clientX; sy = t.clientY; prog = 0; dragging = true;
      peek.style.transition = 'none';
    }
    function move(e){
      if(!dragging) return;
      var t = e.touches ? e.touches[0] : e;
      var dx = t.clientX - sx, dy = t.clientY - sy;
      if(Math.abs(dy) > Math.abs(dx) + 12){ reset(); return; }
      if(dx < 0) dx = 0;
      prog = Math.min(dx / TRIGGER, 1);
      peek.style.transform = 'translateX(' + (-70 + prog*82) + 'px) scale(' + (0.8 + prog*0.2) + ')';
      peek.style.opacity = prog;
      if(dx > 6 && e.cancelable) e.preventDefault();
    }
    function end(){
      if(!dragging) return;
      dragging = false;
      if(prog >= 0.999){
        peek.style.transition = 'transform .25s ease, opacity .25s ease';
        peek.style.transform = 'translateX(20px) scale(1.05)';
        peek.style.opacity = 1;
        goBack();
      }else{
        reset();
      }
    }
    edge.addEventListener('touchstart', start, {passive:true});
    window.addEventListener('touchmove', move, {passive:false});
    window.addEventListener('touchend', end, {passive:true});
    window.addEventListener('touchcancel', end, {passive:true});
  })();
</script>
<!-- /tsumiki-back-button -->
