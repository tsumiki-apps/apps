<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="apple-touch-icon" href="icons/icon-mitsumori.png">
<meta name="apple-mobile-web-app-title" content="みつもり">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f4f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131109" media="(prefers-color-scheme: dark)">
<title>みつもり</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f5f4f0; --surface:#fffefb; --surface-2:#efece5; --ink:#1d1a15;
    --ink-mid:#5b554a; --ink-soft:#8f8877; --line:#e2ded4; --line-2:#d8d3c7;
    --accent:#b06f26; --accent-2:#8a5a24; --accent-wash:#f0e4d1;
    --good:#4c7a51; --good-wash:#dde9dd; --warn:#b0522a; --warn-wash:#f2e0d4;
    --shadow:0 1px 2px rgba(40,32,18,.05), 0 10px 26px -16px rgba(40,32,18,.18);
    --serif:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Songti SC",serif;
    --sans:"Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,Meiryo,sans-serif;
    /* つみきのブランド名（公式ロゴの横のタイトル）だけに使う公式書体。
       請求書アプリと同じ意匠でそろえる＝2枚は対の道具なので */
    --brand-font:'Zen Maru Gothic',-apple-system,BlinkMacSystemFont,"Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
    --col:620px;      /* 本文の最大幅。固定px幅はここだけ（中央寄せの器） */
    --pv-zoom:1;      /* PCで右に出す紙の縮み具合。900px以上でだけ効く */
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#131109; --surface:#1d1a12; --surface-2:#26221a; --ink:#efe8da;
      --ink-mid:#a89e8b; --ink-soft:#7d7566; --line:#2f2b21; --line-2:#3a352a;
      --accent:#d59a4d; --accent-2:#e0ab63; --accent-wash:#362a19;
      --good:#7fae82; --good-wash:#23301f; --warn:#d9825a; --warn-wash:#39251a;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 30px -18px rgba(0,0,0,.65);
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--paper); color:var(--ink); font-family:var(--sans);
    line-height:1.6; -webkit-font-smoothing:antialiased; font-feature-settings:"palt" 1; -webkit-text-size-adjust:100%;
    min-height:100dvh;
  }
  .tnum{font-variant-numeric:tabular-nums;}

  /* ---------- 上のバー ---------- */
  .topbar{
    position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--paper) 88%, transparent);
    backdrop-filter:saturate(1.3) blur(10px); -webkit-backdrop-filter:saturate(1.3) blur(10px);
    border-bottom:1px solid var(--line); padding:calc(env(safe-area-inset-top) + 8px) 0 8px;
  }
  .topbar .inner{
    max-width:var(--col); margin:0 auto; display:flex; align-items:center; gap:8px;
    padding-left:calc(env(safe-area-inset-left) + 14px); padding-right:calc(env(safe-area-inset-right) + 14px);
  }
  .brand{display:flex; align-items:center; gap:9px; min-width:0;}
  .brand .mark{  /* つみき公式ロゴ（アイソメの積み木3つ）＝index.html と同一座標 */
    width:22px; height:22px; flex:none; display:block; border-radius:5px;
    box-shadow:0 2px 7px rgba(36,35,33,.18);
  }
  .brand h1{font-family:var(--brand-font); font-weight:700; font-size:1.1rem; margin:0; letter-spacing:.02em; white-space:nowrap;}
  .spacer{flex:1;}
  .iconbtn{
    width:44px; height:44px; flex:none; border:1px solid var(--line); background:var(--surface);
    border-radius:11px; color:var(--ink-mid); display:grid; place-items:center; cursor:pointer; padding:0;
  }
  .iconbtn:active{transform:scale(.94);}
  .iconbtn svg{width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round;}
  .backbtn{
    border:0; background:none; color:var(--accent); font-family:var(--sans); font-size:.95rem;
    min-height:44px; padding:0 8px 0 0; cursor:pointer; display:flex; align-items:center; gap:3px;
  }

  /* ---------- 本文 ---------- */
  .stage{
    max-width:var(--col); margin:0 auto;
    padding:14px calc(env(safe-area-inset-right) + 14px) calc(env(safe-area-inset-bottom) + 96px) calc(env(safe-area-inset-left) + 14px);
  }
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:15px;
    padding:14px 14px 15px; box-shadow:var(--shadow); margin-bottom:12px;
  }
  .label{
    display:block; font-size:.7rem; font-weight:700; letter-spacing:.09em;
    color:var(--ink-soft); margin-bottom:2px;
  }
  .label.accent{color:var(--accent-2);}
  .gnote{font-size:.79rem; color:var(--ink-soft); line-height:1.65;}
  .gnote.warn{color:var(--warn);}
  .sec-h{font-family:var(--serif); font-size:1.02rem; font-weight:600; margin:0 0 10px; display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;}

  /* ---------- 入力 ---------- */
  .field{margin-bottom:10px;}
  .field:last-child{margin-bottom:0;}
  .field > span.ft{display:block; font-size:.76rem; color:var(--ink-mid); margin-bottom:4px; font-weight:600;}
  input[type=text], input[type=date], input[type=number], input[type=email], textarea, select{
    width:100%; font-family:var(--sans); font-size:16px;   /* iOSの自動ズーム防止＝16px以上 */
    color:var(--ink); background:var(--surface-2); border:1px solid var(--line);
    border-radius:10px; padding:11px; line-height:1.5; -webkit-appearance:none; appearance:none;
    min-height:44px;
  }
  select{background-image:linear-gradient(45deg,transparent 50%,var(--ink-soft) 50%),linear-gradient(135deg,var(--ink-soft) 50%,transparent 50%);
    background-position:calc(100% - 15px) calc(50% + 1px), calc(100% - 10px) calc(50% + 1px);
    background-size:5px 5px,5px 5px; background-repeat:no-repeat; padding-right:30px;}
  textarea{min-height:88px; resize:vertical; line-height:1.7;}
  input:focus, textarea:focus, select:focus{outline:none; border-color:var(--accent); background:var(--surface);}
  input.num{text-align:right; font-variant-numeric:tabular-nums;}
  .row2{display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:9px;}

  /* 型えらび。7列は320pxに入らないので、必ず折り返す組みにする */
  .plans{display:grid; grid-template-columns:repeat(auto-fit, minmax(132px, 1fr)); gap:8px;}
  .plan{
    border:1px solid var(--line-2); background:var(--surface-2); border-radius:12px;
    padding:10px 10px 11px; text-align:left; cursor:pointer; font-family:var(--sans);
    color:var(--ink); min-height:44px; display:block;
  }
  .plan:active{transform:scale(.98);}
  .plan .pn{display:block; font-size:.9rem; font-weight:700;}
  .plan .pb{display:block; font-size:.74rem; color:var(--ink-soft); margin-top:2px; font-variant-numeric:tabular-nums;}
  .plan.on{background:var(--accent-wash); border-color:var(--accent); color:var(--accent-2);}
  .plan.on .pb{color:var(--accent-2);}

  /* ---------- ボタン ---------- */
  .btn{
    font-family:var(--sans); font-size:.93rem; font-weight:600; border-radius:11px;
    padding:12px 15px; border:1px solid var(--line-2); background:var(--surface);
    color:var(--ink); cursor:pointer; line-height:1.3; min-height:44px;
  }
  .btn:active{transform:scale(.98);}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn.ghost{background:transparent;}
  .btn.sm{font-size:.85rem; padding:9px 12px; border-radius:9px; min-height:44px;}
  .btn[disabled]{opacity:.42; cursor:default;}
  .btnrow{display:flex; gap:9px; flex-wrap:wrap;}
  .edit-link{
    border:0; background:none; color:var(--accent); font-family:var(--sans);
    font-size:.85rem; min-height:44px; padding:0; cursor:pointer; text-align:left;
  }
  .card-foot{display:flex; gap:16px; flex-wrap:wrap; margin-top:10px; padding-top:6px; border-top:1px solid var(--line);}

  /* 画面の下に固定する主ボタン */
  .fab{
    position:fixed; left:0; right:0; bottom:0; z-index:15;
    padding:10px calc(env(safe-area-inset-right) + 14px) calc(env(safe-area-inset-bottom) + 10px) calc(env(safe-area-inset-left) + 14px);
    background:color-mix(in srgb, var(--paper) 90%, transparent);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
  }
  .fab .inner{max-width:var(--col); margin:0 auto; display:flex; gap:9px;}
  .fab .btn{flex:1; white-space:nowrap;}
  /* 320px では「プレビュー / 印刷」が言葉の間で折れて2行になる。桁は足りているので字だけ詰める */
  @media screen and (max-width:360px){ .fab .btn{font-size:.85rem; padding-left:8px; padding-right:8px;} }

  /* ---------- 一覧 ---------- */
  .stats{display:grid; grid-template-columns:repeat(3, 1fr); gap:9px; margin-bottom:12px;}
  .stat{
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:11px 10px 12px; box-shadow:var(--shadow); text-align:center;
  }
  .stat .sv{display:block; font-size:1.5rem; font-weight:700; line-height:1.15; font-variant-numeric:tabular-nums;}
  .stat .sl{display:block; font-size:.7rem; color:var(--ink-soft); margin-top:3px;}
  .stat.hit .sv{color:var(--good);}
  .q{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    border:0; border-bottom:1px solid var(--line); background:none; color:inherit;
    font-family:var(--sans); padding:12px 2px; cursor:pointer; min-height:44px;
  }
  .q:last-child{border-bottom:0;}
  .q:active{background:var(--surface-2);}
  .q .ib{flex:1; min-width:0;}
  .q .cl{display:block; font-size:.95rem; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .q .mt{display:block; font-size:.75rem; color:var(--ink-soft); margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .q .am{font-size:.98rem; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap;}
  .chip{
    font-size:.68rem; font-weight:700; padding:3px 8px; border-radius:99px; white-space:nowrap;
    background:var(--surface-2); color:var(--ink-soft); border:1px solid var(--line);
  }
  .chip.sent{background:var(--accent-wash); color:var(--accent-2); border-color:transparent;}
  .chip.won{background:var(--good-wash); color:var(--good); border-color:transparent;}
  .chip.lost{background:var(--surface-2); color:var(--ink-soft);}
  .chip.over{background:var(--warn-wash); color:var(--warn); border-color:transparent;}
  .empty{text-align:center; color:var(--ink-soft); padding:24px 8px; font-size:.87rem;}
  .empty .em{font-size:1.8rem; display:block; margin-bottom:8px;}

  /* ---------- 明細の行 ---------- */
  .line{border:1px solid var(--line); border-radius:12px; padding:11px; margin-bottom:9px; background:var(--surface-2);}
  .line-h{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
  .line-h .n{font-size:.72rem; font-weight:700; color:var(--ink-soft); letter-spacing:.06em;}
  .line-h .del{margin-left:auto; border:0; background:none; color:var(--ink-soft); font-size:1.2rem; cursor:pointer; width:44px; height:44px; line-height:1;}
  .line input, .line select, .line textarea{background:var(--surface);}
  .line .amtrow{display:grid; grid-template-columns:repeat(auto-fit, minmax(140px,1fr)); gap:8px; margin-top:8px;}
  .line.locked{border-style:dashed; border-color:var(--accent);}

  /* 合計 */
  .sum{margin-top:13px; border-top:1px solid var(--line); padding-top:11px;}
  .sum .r{display:flex; align-items:baseline; gap:10px; font-size:.88rem; padding:3px 0; color:var(--ink-mid);}
  .sum .r .v{margin-left:auto; font-variant-numeric:tabular-nums;}
  .sum .r.total{font-size:1.14rem; font-weight:700; color:var(--ink); margin-top:6px; padding-top:9px; border-top:1px solid var(--line);}

  /* 出す前チェック */
  .chk{display:flex; align-items:flex-start; gap:10px; padding:9px 0; font-size:.87rem; cursor:pointer; min-height:44px;}
  .chk input{width:21px; height:21px; flex:none; margin:3px 0 0; accent-color:var(--accent);}

  /* 特記事項（たたんで置く） */
  details.nt{border-bottom:1px solid var(--line);}
  details.nt:last-of-type{border-bottom:0;}
  details.nt > summary{
    list-style:none; cursor:pointer; padding:12px 2px; font-size:.88rem; font-weight:600;
    display:flex; align-items:center; gap:8px; min-height:44px;
  }
  details.nt > summary::-webkit-details-marker{display:none;}
  details.nt > summary::after{content:'›'; margin-left:auto; color:var(--ink-soft); font-size:1.1rem; transition:transform .15s;}
  details.nt[open] > summary::after{transform:rotate(90deg);}
  details.nt .nb{padding:0 2px 12px;}

  .toast{
    position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 82px); transform:translateX(-50%) translateY(8px);
    background:var(--ink); color:var(--paper); font-size:.84rem; padding:10px 16px; border-radius:99px;
    opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:60; max-width:88vw; text-align:center;
  }
  .toast.show{opacity:1; transform:translateX(-50%);}

  /* ===================== 見積書そのもの（プレビュー＆印刷） =====================
     ここは画面のテーマに追従させない。紙は常に白＋黒で、暗い画面でも
     「印刷したらこう出る」が一致するようにする（印刷事故を防ぐため）。 */
  .sheet{
    display:none; background:#fff; color:#1d1a15; font-family:var(--sans);
    max-width:760px; margin:0 auto; padding:26px 20px 40px; line-height:1.75;
  }
  body.previewing .stage, body.previewing .fab{display:none;}
  body.previewing .sheet{display:block;}
  .sheet .sh-title{
    font-family:var(--serif); font-size:1.6rem; letter-spacing:.32em; text-indent:.32em;
    text-align:center; font-weight:600; margin:4px 0 20px;
  }
  .sheet .meta{width:100%; border-collapse:collapse; font-size:.8rem; margin-left:auto; max-width:300px;}
  .sheet .meta td{padding:2px 0; vertical-align:top;}
  .sheet .meta td:first-child{color:#5b554a; white-space:nowrap; padding-right:12px;}
  .sheet .meta td:last-child{text-align:right; font-variant-numeric:tabular-nums;}
  .sheet .to{font-size:1.16rem; font-weight:600; margin:16px 0 3px; border-bottom:1px solid #1d1a15; padding-bottom:5px; display:inline-block; min-width:56%;}
  .sheet .lead{font-size:.83rem; margin:12px 0 14px; color:#3d382f;}
  .sheet .subj{font-size:.94rem; margin:0 0 14px; font-weight:600;}
  .sheet .grand{
    display:flex; align-items:baseline; gap:12px; border-top:2px solid #1d1a15; border-bottom:2px solid #1d1a15;
    padding:11px 4px; margin-bottom:6px; flex-wrap:wrap;
  }
  .sheet .grand .gl{font-size:.92rem; font-weight:600; letter-spacing:.08em;}
  .sheet .grand .gv{margin-left:auto; font-size:1.45rem; font-weight:700; font-variant-numeric:tabular-nums;}
  .sheet .taxnote{font-size:.75rem; color:#5b554a; margin:0 0 20px;}
  .sheet h3{font-size:.78rem; font-weight:700; letter-spacing:.12em; color:#5b554a; margin:22px 0 8px; border-bottom:1px solid #d8d3c7; padding-bottom:5px;}
  .sheet h4{font-size:.85rem; font-weight:700; margin:15px 0 5px; color:#1d1a15;}
  .tw{overflow-x:auto; -webkit-overflow-scrolling:touch;}
  .sheet table.det{width:100%; border-collapse:collapse; font-size:.8rem; min-width:0;}
  .sheet table.det th{
    background:#f2efe8; font-weight:600; font-size:.72rem; letter-spacing:.05em; color:#5b554a;
    border:1px solid #d8d3c7; padding:6px 7px; text-align:left;
  }
  .sheet table.det td{border:1px solid #d8d3c7; padding:7px; vertical-align:top;}
  .sheet table.det td.no{width:2.2em; text-align:right; color:#8f8877; font-variant-numeric:tabular-nums;}
  .sheet table.det td.nm{font-weight:600; width:30%;}
  .sheet table.det td.am{text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; width:22%;}
  .sheet table.det tr.sub td{background:#faf8f4;}
  .sheet table.det tr.tot td{background:#f2efe8; font-weight:700; font-size:.88rem;}
  .sheet ul.notes{margin:0; padding-left:1.15em; font-size:.81rem;}
  .sheet ul.notes li{margin-bottom:5px;}
  .sheet .maint{border:1px solid #d8d3c7; border-radius:8px; padding:9px 11px; font-size:.81rem; margin-top:10px;}
  .sheet .from{
    margin-top:26px; border-top:1px solid #d8d3c7; border-bottom:1px solid #d8d3c7;
    padding:12px 2px; font-size:.8rem; line-height:1.75;
  }
  .sheet .from b{font-size:.92rem; font-family:var(--serif); letter-spacing:.03em;}
  .sheet .warnbox{
    border:1px dashed #b0522a; color:#b0522a; border-radius:9px; padding:9px 11px;
    font-size:.79rem; margin-bottom:16px;
  }

  /* 画面が狭いときのプレビュー。A4の表をそのまま375pxに入れると「内容」欄が
     1文字ずつ折れるので、ここだけ詰める（印刷はA4のままなので影響しない） */
  @media screen and (max-width:600px){
    .sheet{padding:20px 14px 34px;}
    .sheet table.det{font-size:.74rem;}
    .sheet table.det td{padding:6px 5px;}
    .sheet table.det td.nm{width:27%;}
    .sheet table.det td.am{width:24%;}
    .sheet .sh-title{font-size:1.4rem;}
    .sheet .grand .gv{font-size:1.25rem;}
    .stats{grid-template-columns:repeat(3,1fr); gap:7px;}
    .stat .sv{font-size:1.3rem;}
  }
  @media screen and (max-width:340px){
    .sheet .meta{max-width:none;}
  }

  .pv-bar{
    position:sticky; top:0; z-index:30; display:none; gap:9px; align-items:center;
    padding:calc(env(safe-area-inset-top) + 9px) 14px 9px;
    background:color-mix(in srgb, var(--paper) 92%, transparent);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
  }
  body.previewing .pv-bar{display:flex; flex-wrap:wrap;}
  body.previewing .topbar{display:none;}

  /* ===================== 900px以上＝編集しながら紙を見る =====================
     PCで620pxの一本柱にすると横が丸ごと余る。右に紙を置いて、
     打ったそばから仕上がりが見えるようにする（縮尺は幅に合わせて変える）。 */
  .side{display:none;}
  @media screen and (min-width:900px){
    :root{ --pv-zoom:.60; }
    body.two .stage{
      max-width:1360px; display:grid; grid-template-columns:minmax(360px, 560px) 1fr; gap:22px;
      align-items:start;
    }
    body.two.previewing .stage{display:none;}   /* ← two より後に書く。同じ強さなので順番で決まる */
    body.two .side{display:block; position:sticky; top:76px;}
    body.two .topbar .inner{max-width:1360px;}   /* 本文が広がったらバーも合わせる */
    body.two .side .paper{
      background:#fff; border-radius:14px; box-shadow:var(--shadow); overflow:hidden;
      zoom:var(--pv-zoom);
    }
    body.two .side .paper .sheet{display:block; max-width:none; padding:30px 26px 36px;}
    body.two .side .cap{font-size:.75rem; color:var(--ink-soft); margin:0 0 7px;}
    body.previewing .side{display:none;}
    .fab .inner{max-width:1360px;}
  }
  @media screen and (min-width:1200px){ :root{ --pv-zoom:.74; } }
  @media screen and (min-width:1440px){ :root{ --pv-zoom:.86; } }
  @media screen and (min-width:1700px){ :root{ --pv-zoom:1; } }

  /* 印刷（＝PDFで保存）。A4に紙だけを流す */
  @page{size:A4; margin:15mm 14mm 16mm;}
  @media print{
    body{background:#fff;}
    .topbar, .stage, .fab, .pv-bar, .toast, #tsumikiEdge, #tsumikiPeek{display:none !important;}
    .sheet{display:block !important; max-width:none; margin:0; padding:0;}
    .sheet table.det, .sheet .from, .sheet .maint{break-inside:avoid;}
    .sheet h3, .sheet h4{break-after:avoid;}
    .tw{overflow:visible !important;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="inner">
    <button class="backbtn" id="btnBack" style="display:none;">‹ 一覧</button>

<script>
/* =========================================================================
   みつもり（つみき）
   ねらい＝`契約書ひな形_Tsumiki/02_見積書_ひな形.md` を、毎回そのまま出せる形にする。
   このアプリが守っているのは、ひな形の「役割」の一文：

     つみきの見積書は、金額を伝える紙ではない。
     お客様が最初に読む"約束の書面"であり、特記事項が本体で、金額表はその一部でしかない。

   だから手で書くと必ず抜ける4か所を、機械の側で持つ：
     1. No.1「ヒアリング 0（無償）」と No.6「ライセンス／著作権 委託料に含む(0)」の行
        → 消せない（値引きに見せない・他社の見積書に無い行を見せる）
     2. 提供形態（ライセンス／買い取り）を変えたら「権利について」の文が丸ごと入れ替わる
        → 手で直すと片方だけ残って、書面として矛盾する
     3. 消費税の書き方（適格請求書を出せるか）は、発行日とインボイス登録日で自動で決まる
     4. 有効期限30日・着手金50%・検収後60日以内（フリーランス新法 第4条）

   自分の情報（屋号・住所・登録番号）は**この端末のlocalStorageにだけ**置く。
   ここは公開リポジトリなので、ソースにも、どこかのサーバーにも書き込まない。
   （請求書アプリ seikyu.html と同じ持ち方。2枚で対の道具になる：見積 TSM- / 請求 TSM-I-）
   ========================================================================= */

const KEY='tsumiki_mitsumori_v1';

function blank(){
  return {
    me:{ biz:'', rep:'', zip:'', addr:'', mail:'', web:'', tno:'', tnoFrom:'' },
    prefix:'TSM',        /* 見積は TSM-、請求は TSM-I- で分ける */
    serial:{},           /* {'2026': 3} ＝その年に何件出したか */
    quotes:[]
  };
}
let db=blank();
let view='list';      /* list | edit | set */
let curId=null;

function load(){ try{ const s=localStorage.getItem(KEY); if(s) db=Object.assign(blank(), JSON.parse(s)); }catch(e){} }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){ toast('保存できませんでした'); } }
load();

/* ---------- 小さい道具 ---------- */
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function isoOf(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function todayISO(){ return isoOf(new Date()); }
function addDays(iso,n){ const [y,m,d]=iso.split('-').map(Number); const t=new Date(y,m-1,d); t.setDate(t.getDate()+n); return isoOf(t); }
function fmtJP(iso){ if(!iso) return '—'; const [y,m,d]=iso.split('-'); return `${y}年${Number(m)}月${Number(d)}日`; }
function fmtMD(iso){ if(!iso) return ''; const [,m,d]=iso.split('-'); return `${Number(m)}/${Number(d)}`; }
function yen(n){ return '￥'+Number(n||0).toLocaleString('ja-JP'); }
function man(n){ const v=Number(n||0)/10000; return (Math.round(v*10)/10)+'万'; }
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }

let toastT=null;
function toast(msg){
  const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'), 2200);
}

/* 内訳のひな形。lock:true の行は消せない（ひな形02の要件） */

/* 消費税の章は「発行日にインボイス登録が済んでいるか」で自動で決まる。

function defaultNotes(q){

/* ---------- 見積書の作成 ---------- */
function newQuote(){
  const issue=todayISO();
  const q={
    id:uid(), no:nextNo(issue), issue, validDays:30,
    client:'', subject:'', plan:'small', form:'license', devices:1,
    lines:linesFor('small','license'),
    discLabel:'', discAmount:0, discFull:false,
    maint:0, taxMode:'add',
    status:'draft', sentAt:'', closedAt:'',
    checked:[false,false,false,false,false]
  };
  q.notes=defaultNotes(q);
  return q;
}
function nextNo(iso){
  const y=iso.slice(0,4);
  const n=(db.serial[y]||0)+1;
  return `${db.prefix}-${y}-${String(n).padStart(3,'0')}`;
}
function bumpSerial(iso){ const y=iso.slice(0,4); db.serial[y]=(db.serial[y]||0)+1; }
function cur(){ return db.quotes.find(x=>x.id===curId)||null; }
function validUntil(q){ return addDays(q.issue, Number(q.validDays||30)); }

/* ---------- 金額の計算 ----------
   kind: yen=金額に入れる / incl=委託料に含む(0) / free=無償(0)
   税＝ひな形02はAでもBでも「加算する」書き方。だから既定は加算。
   （請求書アプリ側は免税のあいだ加算しない作りだが、あちらは請求＝実際に受け取る額なので別物） */
function calc(q){
  const sub=q.lines.reduce((s,l)=> s + (l.kind==='yen' ? Number(l.amount||0) : 0), 0);
  /* 値引きは 0〜小計 の間に丸める。マイナスを打つと合計が水増しされるため（テストで出た） */
  const disc=q.discFull ? sub : Math.min(Math.max(0, Number(q.discAmount||0)), sub);
  const base=Math.max(0, sub-disc);
  const taxable=q.taxMode!=='none';
  const tax=taxable?Math.floor(base*0.1):0;
  return {sub, disc, base, taxable, tax, total:base+tax};
}
function statusOf(q){
  if(q.status==='won')  return {k:'won',  t:'決まった'};
  if(q.status==='lost') return {k:'lost', t:'見送り'};
  if(q.status==='sent'){
    if(todayISO()>validUntil(q)) return {k:'over', t:'期限すぎ'};
    return {k:'sent', t:'返事待ち'};
  }
  return {k:'draft', t:'下書き'};
}

/* =========================== 画面 =========================== */
const wrap=document.getElementById('wrap');
const side=document.getElementById('side');
const fab=document.getElementById('fab').querySelector('.inner');

function render(){
  document.getElementById('btnBack').style.display = (view==='list') ? 'none' : '';
  document.getElementById('brand').style.display   = (view==='list') ? '' : 'none';
  document.body.classList.toggle('two', view==='edit');
  if(view==='list') renderList();
  else if(view==='edit') renderEdit();
  else renderSet();
  renderSide();
  window.scrollTo(0,0);
}
function renderSide(){
  if(view!=='edit'){ side.innerHTML=''; return; }
  const q=cur(); if(!q){ side.innerHTML=''; return; }
  side.innerHTML=`<p class="cap">出るかたち</p><div class="paper"><div class="sheet" id="sideSheet"></div></div>`;
  document.getElementById('sideSheet').innerHTML=sheetHTML(q);
}

/* ---------- 一覧 ---------- */
function renderList(){
  const qs=db.quotes.slice().sort((a,b)=> (b.issue||'').localeCompare(a.issue||'') || b.no.localeCompare(a.no));
  const ym=todayISO().slice(0,7);
  const sentThisMonth=qs.filter(x=>x.sentAt && x.sentAt.slice(0,7)===ym).length;
  const waiting=qs.filter(x=>x.status==='sent');
  const won=qs.filter(x=>x.status==='won');
  let h='';

  /* 8月に決めた勝ち条件＝「金額を書いた見積りを1本送った」。
     数えるものを1つに絞る＝ここは点数板であって、読みものにしない */
  h+=`<div class="stats">
    <div class="stat ${sentThisMonth?'hit':''}"><span class="sv tnum">${sentThisMonth}</span><span class="sl">今月 送った</span></div>
    <div class="stat"><span class="sv tnum">${waiting.length}</span><span class="sl">返事待ち</span></div>
    <div class="stat"><span class="sv tnum">${won.length}</span><span class="sl">決まった</span></div>
  </div>`;

  if(!sentThisMonth){
    h+=`<div class="card" style="border-color:var(--accent);">
      <p style="margin:0; font-size:.9rem;">今月はまだ1本も出ていません。<span class="gnote">送ることは自分の都合だけで決まります。</span></p>
    </div>`;
  }else if(waiting.length){
    const sum=waiting.reduce((s,x)=>s+calc(x).total,0);
    const soon=waiting.filter(x=>daysBetween(todayISO(), validUntil(x))<=7 && daysBetween(todayISO(), validUntil(x))>=0).length;
    h+=`<div class="card">
      <span class="label">返事待ちの合計</span>
      <div style="display:flex; align-items:baseline; gap:10px; margin-top:4px;">
        <span style="font-size:1.4rem; font-weight:700;" class="tnum">${yen(sum)}</span>
        <span class="gnote">${waiting.length}件</span>
      </div>
      ${soon?`<div class="gnote warn" style="margin-top:7px;">有効期限まで1週間を切っているものが ${soon}件。一度だけ確認の連絡を。</div>`:''}
    </div>`;
  }

  /* 設定が空のうちは、先に埋めてもらう。ここが空だと書面として成立しない */
  if(!db.me.biz || !db.me.addr){
    h+=`<div class="card" style="border-color:var(--accent);">
      <span class="label accent">さいしょに</span>
      <p style="margin:6px 0 11px; font-size:.88rem;">屋号・住所を一度だけ入れておくと、以後の見積書に自動で入ります。
      <span class="gnote">この端末の中だけに保存され、どこにも送信しません。</span></p>
      <button class="btn primary" data-act="go-set">自分の情報を入れる</button>
    </div>`;
  }

  h+=`<div class="card">`;
  h+=`<span class="label">見積書 ${qs.length?qs.length+'件':''}</span>`;
  if(qs.length){
    h+=`<div style="margin-top:6px;">`+qs.map(x=>{
      const st=statusOf(x), c=calc(x);
      return `<button class="q" data-act="open" data-id="${x.id}">
        <span class="ib">
          <span class="cl">${esc(x.client||'（宛先未記入）')}</span>
          <span class="mt tnum">${esc(x.no)} ・ ${fmtMD(x.issue)}発行${x.status==='sent'?' ・ 期限 '+fmtMD(validUntil(x)):''}</span>
        </span>
        <span class="am">${yen(c.total)}</span>
        <span class="chip ${st.k}">${st.t}</span>
      </button>`;
    }).join('')+`</div>`;
  }else{
    h+=`<div class="empty"><span class="em">📄</span>まだ1枚もありません。<br>金額は、最初の接触で出す。</div>`;
  }
  h+=`</div>`;

  wrap.innerHTML=h;
  fab.innerHTML=`<button class="btn primary" data-act="new">＋ 新しい見積書</button>`;
}

}

/* ---------- メール本文 ----------
   文体は Vault Preferences/business-mail-voice に合わせる：
   ■で章分け・算用数字・過剰に丁寧な段落は書かない・そのまま送れる状態で出す */
function mailText(q){
  const m=db.me, c=calc(q);
  const items=q.lines.filter(l=>l.kind!=='free').map(l=>'・'+l.name).join('\n');
  const L=[];
  L.push(`${q.client||'◯◯'} 御中`);
  L.push('');
  L.push(`お世話になっております。${m.biz||'つみき'}の${m.rep||''}です。`);
  L.push(`${q.subject||'ご相談いただいた件'}について、お見積りをお送りいたします。`);
  L.push('');
  L.push('■ お見積金額');
  L.push(`${yen(c.total)}（${c.taxable?'消費税等 10% を含む':'消費税等の加算なし'}）`);
  L.push(`有効期限：${fmtJP(validUntil(q))}（発行日から${q.validDays||30}日）`);
  if(c.disc) L.push(`※ ${q.discLabel||'値引き'}として ${yen(c.disc)} を差し引いた金額です。`);
  L.push('');
  L.push('■ 含まれるもの');
  L.push(items||'・（内訳をご覧ください）');
  L.push('※ ヒアリングとお見積りは無料です。');
  L.push('');
  L.push('■ お支払い');
  L.push('着手金 50%（ご発注後30日以内）、残金 50%（検収完了後60日以内）でお願いしております。');
  L.push('着手後に金額が増えることはありません。範囲を超える追加をご希望の場合のみ、あらためてお見積りをお出しします。');
  if(Number(q.maint||0)>0){
    L.push('');
    L.push('■ 保守について');
    L.push(`月額 ${yen(q.maint)} の保守を任意でお付けできます。加入されなくても、納品したアプリはそのままお使いいただけます。`);
  }
  L.push('');
  L.push('■ ご相談');
  L.push('削って安くできる箇所もあります。ご予算に合わせて構成を組み直せますので、遠慮なくお申し付けください。');
  L.push('');
  L.push('添付の見積書に、権利・納品物・秘密保持まで書いております。ご確認のうえ、ご不明な点をお聞かせください。');
  L.push('');
  L.push('----');
  L.push(`${m.biz||''}${m.rep?'　'+m.rep:''}`);
  L.push([m.zip,m.addr].filter(Boolean).join('　'));
  L.push([m.mail, m.web].filter(Boolean).join('　／　'));
  return L.join('\n');
}
function copyText(t){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(()=>toast('コピーしました'), ()=>fallbackCopy(t));
  }else fallbackCopy(t);
}
function fallbackCopy(t){
  const ta=document.createElement('textarea');
  ta.value=t; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('コピーしました'); }catch(e){ toast('コピーできませんでした'); }
  document.body.removeChild(ta);
}

/* =========================== 操作 =========================== */
document.addEventListener('click', e=>{
  const btn=e.target.closest('[data-act]'); if(!btn) return;
  const act=btn.dataset.act;
  const q=cur();

  if(act==='new'){
    const x=newQuote();
    db.quotes.push(x); bumpSerial(x.issue); save();
    curId=x.id; view='edit'; render(); return;
  }
  if(act==='open'){ curId=btn.dataset.id; view='edit'; render(); return; }
  if(act==='go-set'){ view='set'; render(); return; }
  if(act==='set-done'){ view='list'; render(); return; }

  if(!q) return;

  if(act==='plan'){
    const k=btn.dataset.k; if(k===q.plan) return;
    q.plan=k;
    q.lines=linesFor(k, q.form);
    if(k==='free'){ q.discFull=true; if(!q.discLabel) q.discLabel='初回実績協力につき'; }
    else q.discFull=false;
    save(); render(); return;
  }
  if(act==='form'){
    const k=btn.dataset.k; if(k===q.form) return;
    q.form=k;
    /* 最後の行（ライセンス／著作権）と、納品・権利の章を入れ替える */
    q.lines=linesFor(q.plan, k);
    q.notes=(q.notes||[]).map(n=> n.key==='kenri' ? noteKenri(k) : (n.key==='nouhin' ? noteNouhin(k) : n));
    save(); render(); toast(k==='buyout'?'買い取りの文に入れ替えました':'ライセンスの文に入れ替えました'); return;
  }
  if(act==='line-add'){
    q.lines.push({id:uid(), name:'', detail:'', kind:'yen', amount:0}); save(); render(); return;
  }
  if(act==='line-del'){
    const l=q.lines.find(x=>x.id===btn.dataset.id);
    if(l&&l.lock){ toast('この行は消せません'); return; }
    q.lines=q.lines.filter(x=>x.id!==btn.dataset.id); save(); render(); return;
  }
  if(act==='notes-reset'){ q.notes=defaultNotes(q); save(); render(); toast('ひな形の文にもどしました'); return; }

  if(act==='mark-sent'){ q.status='sent'; q.sentAt=todayISO(); save(); render(); toast('送りました。今月1本。'); return; }
  if(act==='mark-sent2'){ q.status='sent'; q.closedAt=''; save(); render(); return; }
  if(act==='mark-won'){ q.status='won'; q.closedAt=todayISO(); save(); render(); toast('🎉 決まりました'); return; }
  if(act==='mark-lost'){ q.status='lost'; q.closedAt=todayISO(); save(); render(); return; }
  if(act==='mark-draft'){ q.status='draft'; q.sentAt=''; save(); render(); return; }

  if(act==='del'){
    if(!confirm(`${q.no}（${q.client||'宛先未記入'}）を消します。よろしいですか？`)) return;
    db.quotes=db.quotes.filter(x=>x.id!==q.id); curId=null; save();
    view='list'; render(); toast('消しました'); return;
  }
  if(act==='mail'){ copyText(mailText(q)); return; }
  if(act==='preview'){ renderSheet(q); document.body.classList.add('previewing'); window.scrollTo(0,0); return; }
});

/* 入力は打った端から保存する（全体を描き直さないのでカーソルが飛ばない） */
document.addEventListener('input', e=>{
  const el=e.target;

  if(el.dataset.me!==undefined){
    db.me[el.dataset.me]=el.value; save();
    return;
  }
  if(el.dataset.pref!==undefined){ db.prefix=el.value.trim()||'TSM'; save(); return; }

  const q=cur(); if(!q) return;

  if(el.dataset.chk!==undefined){
    if(!q.checked) q.checked=[false,false,false,false,false];
    q.checked[Number(el.dataset.chk)]=el.checked; save();
    renderEdit(); return;   /* 5つ揃うと「送った」が押せるようになるので描き直す */
  }
  if(el.dataset.full!==undefined){
    q.discFull=el.checked;
    if(q.discFull && !q.discLabel) q.discLabel='初回実績協力につき';
    save(); renderEdit(); renderSide(); return;
  }
  if(el.dataset.note!==undefined){
    const i=Number(el.dataset.note);
    if(q.notes && q.notes[i]){ q.notes[i].b=el.value; save(); refreshSide(); }
    return;
  }
  if(el.dataset.line!==undefined){
    const l=q.lines.find(x=>x.id===el.dataset.line); if(!l) return;
    const f=el.dataset.f;
    if(f==='amount') l.amount=Number(el.value||0); else l[f]=el.value;
    save();
    if(f==='amount') refreshSum();
    refreshSide();
    return;
  }
  const f=el.dataset.f; if(!f) return;
  if(f==='discAmount'){ q.discAmount=Number(el.value||0); save(); refreshSum(); refreshSide(); return; }
  if(f==='maint'){ q.maint=Number(el.value||0); save(); refreshSide(); return; }
  if(f==='validDays'){
    q.validDays=Math.max(1, Number(el.value||30)); save();
    q.notes=(q.notes||[]).map(n=> n.key==='kigen'
      ? {key:'kigen', h:'有効期限', b:'本お見積りの有効期限は、発行日から'+q.validDays+'日間です。\n期限を過ぎた場合は、あらためてお見積りをご提示いたします。'} : n);
    save(); refreshSide(); return;
  }
  q[f]=el.value; save();
  if(f==='issue'){
    /* 発行日をまたぐと消費税の章が変わることがあるので、そこだけ入れ替える */
    q.notes=(q.notes||[]).map(n=> n.key==='zei' ? noteZei(q.issue) : n);
    save();
  }
  refreshSide();
});

document.addEventListener('change', e=>{
  const el=e.target;
  const q=cur(); if(!q) return;
  if(el.dataset.line!==undefined && el.dataset.f==='kind'){
    const l=q.lines.find(x=>x.id===el.dataset.line); if(!l) return;
    l.kind=el.value; if(l.kind!=='yen') l.amount=0;
    save(); renderEdit(); renderSide(); return;
  }
  if(el.dataset.f==='taxMode'){ q.taxMode=el.value; save(); refreshSum(); refreshSide(); return; }
  if(el.dataset.f==='issue'){ refreshSide(); return; }
});

/* 合計だけ差し替える（入力中に全体を描き直すとカーソルが飛ぶ） */
function refreshSum(){
  const q=cur(); if(!q) return;
  const box=document.getElementById('sumBox'); if(box) box.innerHTML=sumHTML(q);
}
/* 右の紙も同じ理由で中身だけ差し替える */
let sideT=null;
function refreshSide(){
  const el=document.getElementById('sideSheet'); if(!el) return;
  clearTimeout(sideT);
  sideT=setTimeout(()=>{ const q=cur(); if(q) el.innerHTML=sheetHTML(q); }, 180);
}

document.getElementById('btnBack').onclick=()=>{ view='list'; curId=null; render(); };
document.getElementById('btnSet').onclick =()=>{ view= (view==='set'?'list':'set'); render(); };
document.getElementById('pvClose').onclick=()=>{ document.body.classList.remove('previewing'); };
document.getElementById('pvPrint').onclick=()=>{ window.print(); };
document.getElementById('pvMail').onclick =()=>{ const q=cur(); if(q) copyText(mailText(q)); };

render();
</script>
<!-- tsumiki-back-button -->
<style>
  #tsumikiEdge{position:fixed; top:0; bottom:0; left:0; width:22px; z-index:999;}
  #tsumikiPeek{
    position:fixed; top:50%; left:0; z-index:1001; margin-top:-23px;
    width:46px; height:46px; display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.92);
    -webkit-backdrop-filter:saturate(180%) blur(14px); backdrop-filter:saturate(180%) blur(14px);
    border:1px solid rgba(0,0,0,.06); border-radius:50%;
    box-shadow:0 6px 20px rgba(0,0,0,.18);
    color:#0071e3; font-size:24px; font-weight:600; line-height:1;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Helvetica Neue",Arial,sans-serif;
    transform:translateX(-70px) scale(.8); opacity:0; pointer-events:none;
  }
</style>
<div id="tsumikiEdge"></div>
<div id="tsumikiPeek">‹</div>
<script>
  (function(){
    var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
      || window.navigator.standalone === true;
    var fromTsumiki = false;
    try{
      if(document.referrer){
        var r = new URL(document.referrer);
        fromTsumiki = (r.origin === location.origin);
      }
    }catch(e){}
    if(!(standalone && fromTsumiki)) return;

    var peek = document.getElementById('tsumikiPeek');
    var edge = document.getElementById('tsumikiEdge');

    function goBack(){ location.href = 'index.html'; }

    /* --- 左端エッジスワイプで戻る（iOS純正の戻る操作。見えるボタンは置かない） --- */
    var sx=0, sy=0, prog=0, dragging=false, W=window.innerWidth;
    var TRIGGER = Math.min(120, W*0.32);
    window.addEventListener('resize', function(){ W=window.innerWidth; TRIGGER=Math.min(120, W*0.32); });

    function reset(){
      dragging = false; prog = 0;
      peek.style.transition = 'transform .25s ease, opacity .25s ease';
      peek.style.transform = 'translateX(-70px) scale(.8)';
      peek.style.opacity = 0;
    }
    function start(e){
      var t = e.touches ? e.touches[0] : e;
      if(t.clientX > 26) return;
      sx = t.clientX; sy = t.clientY; prog = 0; dragging = true;
      peek.style.transition = 'none';
    }
    function move(e){
      if(!dragging) return;
      var t = e.touches ? e.touches[0] : e;
      var dx = t.clientX - sx, dy = t.clientY - sy;
      if(Math.abs(dy) > Math.abs(dx) + 12){ reset(); return; }
      if(dx < 0) dx = 0;
      prog = Math.min(dx / TRIGGER, 1);
      peek.style.transform = 'translateX(' + (-70 + prog*82) + 'px) scale(' + (0.8 + prog*0.2) + ')';
      peek.style.opacity = prog;
      if(dx > 6 && e.cancelable) e.preventDefault();
    }
    function end(){
      if(!dragging) return;
      dragging = false;
      if(prog >= 0.999){
        peek.style.transition = 'transform .25s ease, opacity .25s ease';
        peek.style.transform = 'translateX(20px) scale(1.05)';
        peek.style.opacity = 1;
        goBack();
      }else{
        reset();
      }
    }
    edge.addEventListener('touchstart', start, {passive:true});
    window.addEventListener('touchmove', move, {passive:false});
    window.addEventListener('touchend', end, {passive:true});
    window.addEventListener('touchcancel', end, {passive:true});
  })();
</script>
<!-- /tsumiki-back-button -->
</body>
