<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<link rel="apple-touch-icon" href="icons/icon-cooking.png">
<meta name="apple-mobile-web-app-title" content="ゆずごはん">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ゆずごはん日記">
<meta name="theme-color" content="#fbf7f0">
<title>ゆずごはん日記</title>
<style>
  :root {
    --bg: #fbf7f0;
    --card: #ffffff;
    --text: #2b2622;
    --sub: #8a817a;
    --line: #ece5da;
    --accent: #e8915b;     /* 柚子色っぽいオレンジ */
    --accent-soft: #fdf0e6;
    --green: #5fa86b;
    --red: #e0574d;
    --chip: #f3ede3;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; overflow-x: hidden; }   /* ページを縦スクロールのみに固定（左右のズレを防ぐ） */
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    padding-bottom: calc(96px + env(safe-area-inset-bottom));
  }
  .wrap { max-width: 680px; margin: 0 auto; padding: 0 16px; }

  /* ===== ヘッダー（写真ファースト：常に1行だけ・上に貼りつく） ===== */
  header.app {
    position: sticky; top: 0; z-index: 45;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    padding-top: env(safe-area-inset-top);
  }
  .hbar { max-width: 680px; margin: 0 auto; padding: 4px 12px 4px 16px;
    display: flex; align-items: center; gap: 8px; min-height: 52px; }
  .hbar .logo { font-size: 22px; line-height: 1; flex: none; }
  .hbar h1 { font-size: 16px; font-weight: 700; margin: 0; letter-spacing: .02em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hacts { margin-left: auto; display: flex; gap: 2px; flex: none; }
  #menuBtn { font-size: 26px; padding-bottom: 6px; }
  .iconbtn { position: relative; width: 44px; height: 44px; border: none; background: transparent;
    border-radius: 50%; font-size: 19px; line-height: 1; cursor: pointer; font-family: inherit;
    display: flex; align-items: center; justify-content: center; color: var(--text); }
  .iconbtn:active { background: var(--chip); }
  .iconbtn.on { background: var(--chip); }
  .iconbtn .dot { position: absolute; top: 9px; right: 9px; width: 8px; height: 8px;
    border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--bg); }
  .stat-row {
    display:flex; justify-content:center; gap:26px; padding: 2px 0 14px;
  }
  .stat { text-align:center; }
  .stat .n { font-size: 22px; font-weight: 700; color: var(--accent); }
  .stat .l { font-size: 11px; color: var(--sub); margin-top: 1px; }

  /* ===== 検索 / フィルタ ===== */
  .toolbar { padding: 10px 0 2px; }
  #feedTools { display: none; }
  .search-box { position: relative; }
  .search-box input[type=text] {
    width:100%; font-size: 16px; padding: 11px 14px 11px 46px;
    border: 1px solid var(--line); border-radius: 13px; background: #fff;
    font-family: inherit; color: var(--text);
  }
  .search-box .mag { position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--sub); font-size:15px;}
  .search-box input:focus { outline:none; border-color: var(--accent); }
  .filter-row { display:flex; gap:8px; overflow-x:auto; padding: 12px 0 4px; -webkit-overflow-scrolling:touch; }
  .filter-row::-webkit-scrollbar{display:none;}
  .fchip {
    white-space:nowrap; font-size:13.5px; padding:7px 14px; border-radius:999px;
    background:var(--chip); color:var(--sub); border:none; cursor:pointer; font-family:inherit;
  }
  .fchip.on { background: var(--text); color:#fff; }
  .fchip .cnt { font-size:11px; opacity:.65; margin-left:5px; }

  /* ===== タグページ ===== */
  .tagview { margin-top:14px; }
  .tagview-head { margin:4px 0 6px; }
  .tagview-title { font-size:14px; font-weight:700; color:var(--text); margin:6px 2px 12px; }
  .tag-cloud { display:flex; flex-wrap:wrap; gap:8px; }
  .tag-clear { margin-top:12px; font-size:12.5px; padding:6px 13px; border-radius:999px; background:#fff; border:1px solid var(--line); color:var(--sub); cursor:pointer; font-family:inherit; }
  .tagview-result-head { font-size:12.5px; color:var(--sub); margin:18px 4px 2px; }
  .tagview-result-head b { color:var(--accent); }

  /* ===== 日記フィード ===== */
  .feed { margin-top: 8px; }
  .month-head { font-size: 13px; font-weight:700; color:var(--sub); margin: 22px 4px 10px; letter-spacing:.04em;}
  .entry {
    background: var(--card); border-radius: 20px; overflow:hidden; margin-bottom: 16px;
    box-shadow: 0 2px 10px rgba(120,90,50,.06); cursor:pointer;
  }
  .entry:active { transform: scale(.992); }
  .entry .cover { width:100%; aspect-ratio: 4/3; object-fit:cover; background:var(--accent-soft); display:block;}
  .entry .cover.placeholder { display:flex; align-items:center; justify-content:center; font-size:46px; }
  .entry .multi { position:relative; }
  .entry .multi .count {
    position:absolute; right:10px; bottom:10px; background:rgba(0,0,0,.55); color:#fff;
    font-size:12px; padding:3px 9px; border-radius:999px;
  }
  .entry .body { padding: 11px 14px 12px; }
  .entry .e-top { display:flex; align-items:center; gap:8px; }
  .entry .e-date { font-size: 12px; color: var(--sub); font-weight:600; }
  .entry .e-cmt { margin-left:auto; font-size: 12px; color: var(--sub); }
  .entry .e-name { font-size: 17px; font-weight: 700; margin: 1px 0 4px; }
  .entry .e-note { font-size: 14px; color: var(--sub); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .tags { display:flex; flex-wrap:wrap; gap:6px; margin-top: 10px; }
  .tag { font-size:11.5px; padding:3px 10px; border-radius:999px; background:var(--accent-soft); color:var(--accent); font-weight:600;}

  .empty { text-align:center; color:var(--sub); padding: 60px 24px; font-size:15px; }
  .empty .big { font-size:46px; display:block; margin-bottom:14px; }

  /* ===== 追加ボタン（FAB） ===== */
  .fab {
    position: fixed; right: 20px; bottom: calc(24px + env(safe-area-inset-bottom)); z-index: 40;
    width: 60px; height: 60px; border-radius: 50%; border:none;
    background: var(--accent); color:#fff; font-size: 30px; line-height: 1;
    box-shadow: 0 6px 18px rgba(232,145,91,.45); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    -webkit-touch-callout:none; -webkit-user-select:none; user-select:none;  /* 長押し＝アルバムなので選択メニューを出さない */
  }
  .fab:active { transform: scale(.93); }

  /* ===== 家族モード（いいね・コメントOK／投稿・編集・削除は不可） ===== */
  .view-badge { display:none; margin:10px auto 0; max-width:max-content;
    font-size:12.5px; font-weight:700; color:#9a6a3c;
    background:rgba(232,145,91,.14); border:1px solid rgba(232,145,91,.3);
    padding:5px 12px; border-radius:999px; }
  body.family .view-badge { display:block; }
  /* 投稿・編集・削除だけ隠す（いいね・コメント・スタンプは残す） */
  body.family .fab,
  body.family #editRecBtn,
  body.family #deleteRecordBtn,
  body.family .cmt .del { display:none !important; }
  /* 名前入力カード（家族モードのみ表示） */
  #whoCardFamily { display:none; }
  #whoCardFamily input { width:100%; box-sizing:border-box; font-family:inherit;
    font-size:16px; padding:13px 16px; border:1px solid var(--line);
    border-radius:14px; margin-bottom:12px; }
  #whoCardFamily .btn { width:100%; }
  body.family #whoCardCouple { display:none; }
  body.family #whoCardFamily { display:block; }

  /* ===== モーダル ===== */
  .modal-bg { position:fixed; inset:0; background:rgba(40,30,20,.42); z-index:100; display:flex; align-items:flex-end; justify-content:center;
    opacity:0; visibility:hidden; pointer-events:none; transition:opacity .28s ease, visibility .28s ease;}
  .modal-bg.show { opacity:1; visibility:visible; pointer-events:auto; }
  .modal {
    background:var(--bg); width:100%; max-width:680px; max-height:94vh; overflow-y:auto;
    border-radius: 24px 24px 0 0; padding: 8px 16px calc(28px + env(safe-area-inset-bottom));
    -webkit-overflow-scrolling:touch; animation: slideUp .28s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes slideUp { from{transform:translateY(40px);opacity:.6;} to{transform:translateY(0);opacity:1;} }
  /* PC（広い画面）ではモーダルを画面中央に。iPhoneは従来どおり下からせり出す */
  @media (min-width: 768px){
    .modal-bg{ align-items:center; padding:24px; }
    .modal{ border-radius:24px; max-height:88vh; }
  }
  .grip { width:40px;height:5px;background:#dcd3c6;border-radius:3px;margin:8px auto 14px;}
  .modal-head { display:flex; align-items:center; justify-content:space-between; margin-bottom: 16px;}
  .modal-head h3 { margin:0; font-size:19px; font-weight:700;}
  .modal-head .close { font-size:22px; color:var(--sub); cursor:pointer; padding:4px 8px;}
  #recordModal .modal { overflow-x: hidden; }   /* 記録シートは縦スクロールのみ（横ズレを完全に止める） */

  label.fld { display:block; font-size: 13px; color: var(--sub); margin: 16px 0 6px; font-weight:600;}
  input[type=text], input[type=date], textarea {
    width: 100%; font-size: 16px; padding: 12px 13px;
    border: 1px solid var(--line); border-radius: 12px; background: #fff;
    font-family: inherit; color: var(--text);
  }
  textarea { resize: vertical; min-height: 90px; }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); }

  .btn {
    display:flex; align-items:center; justify-content:center; gap:6px;
    border:none; border-radius: 13px; padding: 14px 18px;
    font-size: 16px; font-weight: 700; font-family: inherit;
    cursor:pointer; background: var(--accent); color:#fff; width:100%;
  }
  .btn:active { opacity:.85; }
  .btn.sec { background:#efe8dd; color:var(--text); }
  .btn.danger { background:transparent; color:var(--red); }

  /* 写真追加 */
  .photo-strip { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .photo-strip .pi { position:relative; width:80px; height:80px; border-radius:12px; overflow:hidden; }
  .photo-strip .pi img { width:100%;height:100%;object-fit:cover; }
  .photo-strip .pi .x { position:absolute; top:3px; right:3px; background:rgba(0,0,0,.6); color:#fff; width:20px;height:20px;border-radius:50%; font-size:12px; display:flex;align-items:center;justify-content:center; cursor:pointer;}
  .addphoto { width:80px;height:80px;border-radius:12px; border:2px dashed var(--line); display:flex;flex-direction:column;align-items:center;justify-content:center; font-size:24px; color:var(--sub); cursor:pointer; background:#fff;}
  .addphoto small{font-size:10px;}
  #shotPhotoBtn { border-style:solid; border-color:var(--accent); color:var(--accent); background:var(--accent-soft); }

  /* くわしく書く（日付・感想・タグ）＝ふだんは畳んでおく */
  .more-toggle {
    display:flex; align-items:center; justify-content:space-between; gap:6px;
    width:100%; margin-top:18px; padding:12px 14px;
    background:#fff; border:1px solid var(--line); border-radius:12px;
    font-family:inherit; font-size:14px; font-weight:600; color:var(--sub);
    cursor:pointer;
  }
  .more-toggle .chev { transition: transform .2s ease; font-size:12px; }
  .more-toggle[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .more-fields { display:none; }
  .more-fields.open { display:block; }

  /* タグ入力 */
  .tag-input-row { display:flex; gap:8px; }
  .tag-input-row input { flex:1; min-width:0; }   /* iOSで入力欄が縮まずモーダルを横に押し広げる（横スクロール）のを防ぐ */
  .tag-input-row button { width:auto; padding:12px 16px; }
  .tag-suggest { display:flex; flex-wrap:wrap; gap:7px; margin-top:10px; }
  .tag-suggest .ts { font-size:13px; padding:6px 12px; border-radius:999px; background:#fff; border:1px solid var(--line); color:var(--sub); cursor:pointer;}
  .tag-suggest .ts.on { background:var(--accent-soft); border-color:var(--accent); color:var(--accent); font-weight:600;}
  .chosen-tags { display:flex; flex-wrap:wrap; gap:7px; margin-top:10px; }
  .chosen-tags .ct { font-size:13px; padding:6px 12px; border-radius:999px; background:var(--accent); color:#fff; cursor:pointer; display:flex; gap:6px; align-items:center;}

  /* 詳細 */
  .detail-photos { display:flex; gap:10px; overflow-x:auto; margin: 0 -16px 4px; padding: 0 16px; scroll-snap-type:x mandatory;}
  .detail-photos::-webkit-scrollbar{display:none;}
  .detail-photos img { height:240px; border-radius:16px; scroll-snap-align:center; object-fit:cover; }
  .detail-photos img:only-child { width:calc(100% - 0px); object-fit:cover; }
  .d-name { font-size:24px; font-weight:700; margin: 14px 0 4px;}
  .d-date { font-size:13px; color:var(--accent); font-weight:600; }
  .d-note { font-size:15.5px; margin-top:14px; white-space:pre-wrap; line-height:1.75;}
  .note-card { background:var(--accent-soft); border-radius:14px; padding:14px 16px; margin-top:14px; }
  .note-card .lab { font-size:11px; color:var(--accent); font-weight:700; margin-bottom:4px;}

  /* ===== ビュー切替 ===== */
  .viewseg { display:inline-flex; gap:2px; background:var(--chip); padding:3px; border-radius:14px; }
  .viewseg button { width:58px; height:44px; border:none; background:transparent; font-family:inherit;
    font-size:18px; line-height:1; color:var(--sub); border-radius:11px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; opacity:.6; }
  .viewseg button.on { opacity:1; background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  .viewseg button.on { background:#fff; color:var(--text); box-shadow:0 1px 4px rgba(0,0,0,.08); }

  /* ===== いいね・コメント数（フィード） ===== */

  /* ===== カレンダー ===== */
  .cal { margin-top:14px; }
  .cal-head { display:flex; align-items:center; justify-content:space-between; margin:6px 4px 12px; }
  .cal-head .mon { font-size:17px; font-weight:700; }
  .cal-head button { border:none; background:var(--chip); width:36px; height:36px; border-radius:50%; font-size:18px; cursor:pointer; color:var(--text); }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
  .cal-grid .wd { text-align:center; font-size:11px; color:var(--sub); padding-bottom:4px; }
  .cal-cell { aspect-ratio:1; border-radius:11px; background:var(--card); position:relative; padding:5px 0 0 6px; font-size:12px; color:var(--sub); overflow:hidden; }
  .cal-cell.empty { background:transparent; }
  .cal-cell.today { outline:2px solid var(--accent); }
  .cal-cell.has { cursor:pointer; color:#fff; }
  .cal-cell.has .thumb { position:absolute; inset:0; object-fit:cover; width:100%; height:100%; z-index:0; }
  .cal-cell.has .shade { position:absolute; inset:0; background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.5)); z-index:1; }
  .cal-cell.has .dnum { position:relative; z-index:2; font-weight:700; text-shadow:0 1px 2px rgba(0,0,0,.5); }
  .cal-cell.has .cnt { position:absolute; right:4px; bottom:3px; z-index:2; font-size:10px; background:rgba(0,0,0,.55); padding:1px 6px; border-radius:999px; color:#fff; }
  .cal-cell.has.nopic { color:var(--accent); }
  .cal-cell.has.nopic .dnum { text-shadow:none; }
  .cal-cell.has.nopic .dot { position:absolute; bottom:6px; left:50%; transform:translateX(-50%); width:6px; height:6px; border-radius:50%; background:var(--accent); z-index:2; }

  /* ===== いいねボタン（詳細） ===== */
  .like-row { display:flex; align-items:center; gap:12px; margin-top:18px; flex-wrap:wrap; }
  .like-btn { display:flex; align-items:center; gap:7px; background:var(--chip); border:none; border-radius:999px; padding:9px 17px; font-size:15px; font-weight:700; font-family:inherit; color:var(--sub); cursor:pointer; }
  .like-btn.on { background:#fde7e4; color:var(--red); }
  .like-who { font-size:12.5px; color:var(--sub); }

  /* ===== コメント ===== */
  .cmt-sec { margin-top:22px; }
  .cmt-sec .lab { font-size:12px; color:var(--sub); font-weight:700; margin-bottom:12px; }
  .cmt { display:flex; gap:9px; margin-bottom:12px; }
  .cmt .av { flex:none; width:30px; height:30px; border-radius:50%; background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; }
  .cmt .bub { background:var(--card); border-radius:13px; padding:8px 12px; flex:1; }
  .cmt .bub .top { display:flex; align-items:baseline; gap:8px; }
  .cmt .bub .who { font-size:12.5px; font-weight:700; }
  .cmt .bub .when { font-size:10.5px; color:var(--sub); }
  .cmt .bub .txt { font-size:14.5px; white-space:pre-wrap; margin-top:2px; }
  .cmt .bub .del { font-size:11px; color:var(--sub); cursor:pointer; margin-top:4px; display:inline-block; }
  .cmt-empty { font-size:13px; color:var(--sub); padding:2px 0 8px; }
  .cmt-input { display:flex; gap:8px; margin-top:6px; }
  .cmt-input input { flex:1; }
  .cmt-input button { width:auto; padding:0 18px; }

  /* ===== ライトボックス ===== */
  .lightbox { position:fixed; inset:0; background:rgba(0,0,0,.93); z-index:300; display:flex; flex-direction:column;
    opacity:0; visibility:hidden; pointer-events:none; transition:opacity .3s ease, visibility .3s ease; }
  .lightbox.show { opacity:1; visibility:visible; pointer-events:auto; }
  .lb-top { display:flex; justify-content:space-between; align-items:center; padding:calc(10px + env(safe-area-inset-top)) 18px 6px; color:#fff; }
  .lb-top .idx { font-size:14px; opacity:.85; }
  .lb-top .x { font-size:26px; cursor:pointer; padding:4px 8px; }
  .lb-track { flex:1; display:flex; overflow-x:auto; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; }
  .lb-track::-webkit-scrollbar{display:none;}
  .lb-slide { flex:none; width:100%; scroll-snap-align:center; display:flex; align-items:center; justify-content:center; padding:0 4px; }
  .lb-slide img { max-width:100%; max-height:100%; object-fit:contain; }
  .lb-dots { display:flex; gap:7px; justify-content:center; padding:14px 0 calc(20px + env(safe-area-inset-bottom)); }
  .lb-dots .d { width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,.35); }
  .lb-dots .d.on { background:#fff; }

  /* ===== 名前選択 ===== */
  .who-card { text-align:center; padding:10px 4px 6px; }
  .who-card h3 { font-size:20px; margin:6px 0 6px; }
  .who-card p { color:var(--sub); font-size:14px; margin:0 0 20px; }
  .who-opts { display:flex; gap:12px; }
  .who-opts button { flex:1; border:1px solid var(--line); background:#fff; border-radius:16px; padding:18px 8px; font-family:inherit; font-size:17px; font-weight:700; color:var(--text); cursor:pointer; }
  .who-opts button:active { background:var(--accent-soft); }
  .who-opts button .em { font-size:30px; display:block; margin-bottom:6px; }

  /* ===== ストーリーズ風「思い出」ビューア ===== */
  .story { position:fixed; inset:0; background:#000; z-index:400; display:flex; flex-direction:column;
    opacity:0; visibility:hidden; pointer-events:none; transition:opacity .3s ease, visibility .3s ease; }
  .story.show { opacity:1; visibility:visible; pointer-events:auto; }
  .st-top { display:flex; flex-direction:column; gap:9px; padding:calc(9px + env(safe-area-inset-top)) 14px 2px; }
  .st-bars { display:flex; gap:4px; }
  .st-bar { flex:1; height:3px; border-radius:3px; background:rgba(255,255,255,.26); }
  .st-bar.on { background:#fff; }
  .st-actions { display:flex; justify-content:flex-end; gap:12px; color:#fff; }
  .st-actions span { font-size:21px; cursor:pointer; padding:2px 5px; opacity:.92; }
  .st-track { flex:1; display:flex; overflow-x:auto; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; }
  .st-track::-webkit-scrollbar { display:none; }
  .st-slide { flex:none; width:100%; scroll-snap-align:center; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:16px; padding:4px 20px 0; }
  .st-photo-wrap { width:100%; max-width:400px; aspect-ratio:1/1; border-radius:30px; overflow:hidden;
    background:#141414; display:flex; align-items:center; justify-content:center; font-size:84px;
    box-shadow:0 14px 46px rgba(0,0,0,.55); }
  .st-photo { width:100%; height:100%; object-fit:cover; display:block; }
  .st-meta { display:flex; align-items:center; gap:10px; width:100%; max-width:400px; color:#fff; }
  .st-ava { flex:none; width:34px; height:34px; border-radius:50%; background:#2a2a2a;
    display:flex; align-items:center; justify-content:center; font-size:18px; }
  .st-name { font-size:15.5px; font-weight:700; line-height:1.3; }

  .st-rx .cnt { position:absolute; bottom:-2px; right:-3px; background:var(--accent); color:#fff;

    display:flex; align-items:center; justify-content:center; padding:0 4px; box-shadow:0 0 0 2px #000; }
  .st-reply { padding:12px 16px calc(14px + env(safe-area-inset-bottom)); }
  .st-reply input { width:100%; font-size:16px; padding:12px 18px; border-radius:999px;

  .st-empty { color:rgba(255,255,255,.85); text-align:center; margin:auto; padding:40px; font-size:15px; }
  /* ===== アプリ内カメラ（正方形プレビュー＋フラッシュ） ===== */
  .cam { position:fixed; inset:0; background:#000; z-index:500; display:flex; flex-direction:column;
    opacity:0; visibility:hidden; pointer-events:none; transition:opacity .3s ease, visibility .3s ease; }
  .cam.show { opacity:1; visibility:visible; pointer-events:auto; }
  .cam-top { display:flex; align-items:center; justify-content:space-between;
    padding:calc(10px + env(safe-area-inset-top)) 16px 8px; color:#fff; }
  .cam-x { font-size:24px; cursor:pointer; padding:4px 10px; opacity:.95; }
  .cam-flash { display:flex; align-items:center; gap:6px; background:rgba(255,255,255,.14);
    border:none; color:#fff; font-family:inherit; font-size:14px; font-weight:700;
    padding:8px 15px; border-radius:999px; cursor:pointer; }
  .cam-flash.on { background:#f5c14b; color:#3a2a10; }
  .cam-stage { flex:1; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .cam-frame { position:relative; width:100%; max-width:520px; aspect-ratio:1/1; overflow:hidden;
    background:#111; }
  .cam-frame video { width:100%; height:100%; object-fit:cover; display:block; background:#111; }
  /* 四隅のブラケット＝ここが正方形の切り取り範囲 */
  .cam-corner { position:absolute; width:22px; height:22px; border:2px solid rgba(255,255,255,.9); }
  .cam-corner.tl { top:8px; left:8px; border-right:none; border-bottom:none; border-radius:6px 0 0 0; }
  .cam-corner.tr { top:8px; right:8px; border-left:none; border-bottom:none; border-radius:0 6px 0 0; }
  .cam-corner.bl { bottom:8px; left:8px; border-right:none; border-top:none; border-radius:0 0 0 6px; }
  .cam-corner.br { bottom:8px; right:8px; border-left:none; border-top:none; border-radius:0 0 6px 0; }
  .cam-bottom { display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
    padding:16px 24px calc(20px + env(safe-area-inset-bottom)); }
  .cam-album { grid-column:1; justify-self:start; width:48px; height:48px; border-radius:12px;
    border:none; background:rgba(255,255,255,.16); color:#fff; font-size:21px; cursor:pointer; }
  .cam-shot { grid-column:2; justify-self:center; width:74px; height:74px; border-radius:50%;
    border:5px solid #fff; background:rgba(255,255,255,.28); cursor:pointer; }
  .cam-shot:active { transform:scale(.92); }
  .cam-hint { grid-column:3; justify-self:end; color:rgba(255,255,255,.72); font-size:11px; text-align:right; line-height:1.35; }

  /* iOS触覚フィードバック用の隠しスイッチ（画面外。display:noneにしないこと） */
  .haptic-switch { position:fixed; left:-9999px; top:0; width:1px; height:1px; opacity:0; }

  /* ===== 新しい版のおしらせ（キャッシュで古いまま固まらないように） ===== */
  .updbar { position:fixed; left:12px; right:12px; bottom:calc(20px + env(safe-area-inset-bottom));
    z-index:180; display:none; align-items:center; gap:10px; min-height:52px;
    background:var(--text); color:#fff; border-radius:16px; padding:10px 14px;
    box-shadow:0 8px 24px rgba(0,0,0,.25); font-size:14.5px; font-weight:700; cursor:pointer; }
  .updbar.show { display:flex; }
  .updbar .go { margin-left:auto; background:var(--accent); color:#fff; border:none; border-radius:999px;
    font-family:inherit; font-size:14px; font-weight:700; height:38px; padding:0 16px; cursor:pointer; }
  @media (min-width:600px){ .updbar { left:auto; right:20px; width:360px; } }

  .toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:rgba(40,30,20,.9);color:#fff;padding:11px 20px;border-radius:999px;font-size:14px;z-index:200;opacity:0;transition:opacity .25s;pointer-events:none;}
  .toast.show{opacity:1;}
  .hidden{display:none !important;}

  /* ===== フィード上部のパネル（1ヶ月前の今日 / お知らせのお願い） ===== */
  .panel { background:var(--card); border-radius:18px; padding:12px 14px 13px; margin-bottom:14px;
    box-shadow:0 2px 10px rgba(120,90,50,.06); }
  .panel .p-title { font-size:11.5px; font-weight:700; color:var(--accent); display:flex;
    align-items:center; gap:6px; margin-bottom:9px; letter-spacing:.02em; }
  .panel .p-title .sub { font-weight:600; color:var(--sub); font-size:11px; margin-left:auto; }
  /* 1ヶ月前の今日 */
  .memo-row { display:flex; gap:12px; align-items:center; cursor:pointer; }
  .memo-row img, .memo-row .ph { flex:none; width:58px; height:58px; border-radius:14px; object-fit:cover;
    background:var(--accent-soft); display:flex; align-items:center; justify-content:center; font-size:26px; }
  .memo-row .nm { font-size:14.5px; font-weight:700; }
  .memo-row .dt { font-size:11.5px; color:var(--sub); margin-top:2px; }

  /* ===== カードの1タップ返事 / またこれ食べたい ===== */
  /* 絵文字だけの1行（❤️ 🤤 👏 🥹 … 🙏）。文字ラベルは持たない＝押せば色がつく */
  .act-row { display:flex; align-items:center; gap:2px; margin-top:8px; }
  .act { flex:none; min-width:44px; height:44px; padding:0 6px; border:none; background:transparent;
    border-radius:14px; font-size:19px; line-height:1; cursor:pointer; font-family:inherit;
    display:inline-flex; align-items:center; justify-content:center; gap:3px; color:var(--sub); }
  /* ⚠️ ここに filter:grayscale を使わないこと。カード×ボタンで数百個になり、
     iPhoneがメモリ不足でページごと落ちる（2026-08-31 実発生）。濃さは opacity だけで表す。 */
  .act .em { display:inline-block; opacity:.38; transition:opacity .15s, transform .15s; }
  .act.has .em, .act.on .em { opacity:1; }
  .act .cnt { font-size:12px; font-weight:700; }
  .act.on { color:var(--accent); background:var(--accent-soft); }
  .act:active .em { transform:scale(.86); }
  .act.want { margin-left:auto; }
  .react-who { font-size:11.5px; color:var(--sub); margin-top:4px; }

  /* ===== 新着バッジ ===== */
  .entry.isnew .cover { }
  .newdot { display:inline-block; width:8px; height:8px; border-radius:50%;
    background:var(--accent); margin-right:7px; vertical-align:middle; }
  .sort-row { display:flex; gap:8px; align-items:center; padding:2px 0 0; }

  /* ===== ☰ メニューシート（思い出・リクエスト・通信・数字をここへ集約） ===== */
  .menu-item { display:flex; align-items:center; gap:13px; width:100%; border:none; background:transparent;
    font-family:inherit; font-size:16px; font-weight:600; color:var(--text); padding:15px 4px;
    border-top:1px solid var(--line); cursor:pointer; text-align:left; min-height:44px; }
  .menu-item:last-of-type { border-bottom:1px solid var(--line); }

  .menu-item .ic { font-size:21px; width:26px; text-align:center; flex:none; }
  .menu-item .n { margin-left:auto; font-size:12px; font-weight:700; color:#fff; background:var(--accent);
    border-radius:999px; min-width:20px; height:20px; display:flex; align-items:center;
    justify-content:center; padding:0 6px; }

  /* ===== 通知シート ===== */
  .menu-item .st { margin-left:auto; font-size:12.5px; font-weight:700; color:var(--sub); }
  .menu-item .st.on { color:var(--green); }
  .nt-lead { font-size:14.5px; color:var(--sub); line-height:1.75; margin:2px 0 18px; }
  .nt-state { display:flex; align-items:center; gap:9px; background:var(--accent-soft);
    border-radius:14px; padding:13px 15px; font-size:14.5px; font-weight:700; color:#9a6a3c; margin-bottom:16px; }
  .nt-state.on { background:#eaf5eb; color:#3f7a4a; }
  .nt-state.ng { background:#fdecea; color:#a8433a; }
  .nt-steps { counter-reset:st; margin:0 0 18px; padding:0; list-style:none; }
  .nt-steps li { position:relative; padding:11px 0 11px 38px; border-top:1px solid var(--line);
    font-size:14.5px; line-height:1.7; }
  .nt-steps li:before { counter-increment:st; content:counter(st); position:absolute; left:0; top:12px;
    width:24px; height:24px; border-radius:50%; background:var(--accent); color:#fff;
    font-size:12.5px; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .nt-note { font-size:12.5px; color:var(--sub); line-height:1.7; margin-top:14px; }
  .panel.ask { background:#fff; border:1px solid rgba(232,145,91,.35); box-shadow:none; }
  .panel.ask .ask-txt { font-size:14px; line-height:1.65; }
  .panel.ask .ask-btns { display:flex; gap:8px; margin-top:11px; }
  .panel.ask .ask-btns button { flex:1; min-height:44px; border:none; border-radius:12px;
    font-family:inherit; font-size:14.5px; font-weight:700; cursor:pointer; }
  .panel.ask .ask-yes { background:var(--accent); color:#fff; }
  .panel.ask .ask-no { background:var(--chip); color:var(--sub); }

  /* ===== リクエスト箱 / 月報 ===== */
  .req-item { display:flex; gap:12px; align-items:center; padding:11px 0;
    border-bottom:1px solid var(--line); cursor:pointer; }
  .req-item img, .req-item .ph { flex:none; width:58px; height:58px; border-radius:13px;
    object-fit:cover; background:var(--accent-soft); display:flex; align-items:center;
    justify-content:center; font-size:23px; }
  .req-item .nm { font-size:15px; font-weight:700; }
  .req-item .sub { font-size:11.5px; color:var(--sub); margin-top:2px; }
  .rep-head { text-align:center; padding:6px 0 18px; }
  .rep-head .mon { font-size:13px; color:var(--accent); font-weight:700; }
  .rep-head .big { font-size:40px; font-weight:700; line-height:1.1; margin-top:6px; }
  .rep-head .unit { font-size:14px; color:var(--sub); font-weight:600; }
  .rep-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .rep-cell { background:var(--card); border-radius:15px; padding:12px 14px; }
  .rep-cell .k { font-size:11px; color:var(--sub); font-weight:600; }
  .rep-cell .v { font-size:16px; font-weight:700; margin-top:3px; }
  .rep-cell .v small { font-size:12px; color:var(--sub); font-weight:600; }
  .rep-photos { display:grid; grid-template-columns:repeat(4,1fr); gap:5px; margin-top:14px; }
  .rep-photos img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:9px; }
  .rep-nav { display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }
  .rep-nav button { border:none; background:var(--chip); width:34px; height:34px; border-radius:50%;
    font-size:17px; cursor:pointer; color:var(--text); font-family:inherit; }
  .rep-sec { font-size:12px; color:var(--sub); font-weight:700; margin:20px 2px 9px; }

  /* ===== フェード演出（シームレスな操作感） ===== */
  /* アプリ起動時のふわっと表示 */
  @keyframes appIn { from{opacity:0;} to{opacity:1;} }
  body { animation: appIn .45s ease both; }
  /* ビュー切替（フィード / カレンダー / タグ）のクロスフェード */
  @keyframes viewFade { from{opacity:0; transform:translateY(5px);} to{opacity:1; transform:none;} }
  .view-fade { animation: viewFade .32s ease both; }
  /* 記録カードのやさしい立ち上がり */
  @keyframes entryIn { from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }
  .feed .entry { animation: entryIn .34s ease both; }
  /* 「動きを減らす」設定の端末では演出を無効化 */
  @media (prefers-reduced-motion: reduce){

  }
</style>

<header class="app">
  <div class="hbar">

    <h1>ゆずごはん日記</h1>
    <div class="hacts">

<main class="wrap">

<button class="fab" id="fab" aria-label="ごはんを撮って記録する">📷</button>
<!-- ＋タップ＝アプリ内カメラ起動。getUserMediaが使えない時だけ下の純正カメラにフォールバック -->
<input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden">

<!-- ===== アプリ内カメラ（正方形固定＋フラッシュ） ===== -->

<!-- ===== ☰ メニュー ===== -->

<!-- ===== リクエスト箱（またこれ食べたい） ===== -->
<div class="modal-bg" id="requestModal">

function urlB64ToUint8Array(base64){
  const pad='='.repeat((4-base64.length%4)%4);
  const b=(base64+pad).replace(/-/g,'+').replace(/_/g,'/');
  const raw=atob(b); const arr=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) arr[i]=raw.charCodeAt(i);
  return arr;
}

/* 保存成功時の通知（やわらかい合成音＋端末バイブ＋OS通知バナー） */
let _audioCtx=null;
function notifySaved(body){
  // OS通知バナー（iPhone等。許可済みのときのみ）
  showOSNotification(body || '日記を保存しました');
  // バイブ（対応端末のみ。PC等は自動で無視される）
  if(navigator.vibrate) navigator.vibrate([40,30,40]);
  // 合成音「ポーン♪」
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    _audioCtx = _audioCtx || new AC();
    if(_audioCtx.state==='suspended') _audioCtx.resume();
    const ctx=_audioCtx, now=ctx.currentTime;
    [880, 1318.51].forEach((freq,i)=>{           // A5 → E6 の2音
      const osc=ctx.createOscillator(), gain=ctx.createGain();
      osc.type='sine'; osc.frequency.value=freq;
      const t0=now+i*0.12;
      gain.gain.setValueAtTime(0, t0);
      gain.gain.linearRampToValueAtTime(0.18, t0+0.02);   // やわらかい立ち上がり
      gain.gain.exponentialRampToValueAtTime(0.0001, t0+0.45);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t0); osc.stop(t0+0.5);
    });
  }catch(e){ /* 音が出せない環境では無視 */ }
}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* よく使うタグの候補 */
const TAG_SUGGEST = ['和食','洋食','中華','イタリアン','エスニック','麺','スープ','お弁当','手が込んでる','あったかい','ヘルシー','がっつり','また食べたい','初めて','定番'];

/* 料理名からタグを推測する辞書（料理名に含まれていたら、そのタグをおすすめ） */
const TAG_RULES = [
  [/おにぎり|むすび/, ['おにぎり','朝食']],
  [/味噌汁|スープ|ポトフ|汁/, ['スープ','あったかい']],

  [/カレー/, ['カレー','がっつり']],

  [/炒め|チャーハン|回鍋肉|青椒|麻婆/, ['中華']],
  [/漬け|浅漬|漬物|キムチ|マリネ/, ['漬物','さっぱり']],
  [/サラダ|野菜|ブロッコリー|きゅうり|トマト|なす|ナス|キャベツ|オクラ|えだまめ|枝豆/, ['野菜','ヘルシー']],
  [/唐揚げ|から揚げ|フライ|天ぷら|揚げ/, ['がっつり','揚げもの']],
  [/煮込み|煮物|肉じゃが|ロールキャベツ/, ['あったかい','手が込んでる']],
  [/弁当/, ['お弁当']],
  [/ケーキ|ドーナツ|だいふく|大福|団子|プリン|アイス|スイーツ|おやつ/, ['スイーツ']],
  [/おつまみ|砂肝|ユッケ|ネギ和え|夜食/, ['おつまみ']],
  [/卵|たまご|TKG/i, ['たまご']],
  [/朝ごはん|朝食|モーニング/, ['朝食']],
];
/* 料理名 → おすすめタグ（辞書＋過去の同じような名前で使ったタグ） */
function suggestTagsFor(name){
  const n=(name||'').trim();
  if(!n) return [];
  const out=[];
  const push=t=>{ if(t && !out.includes(t)) out.push(t); };
  TAG_RULES.forEach(([re,tags])=>{ if(re.test(n)) tags.forEach(push); });
  // 過去に似た名前（2文字以上の共通ワード）で使ったタグを優先的に拾う
  allRecords.forEach(r=>{
    if(!r.tags || !r.tags.length || !r.name) return;
    let hit=false;
    for(let i=0;i+2<=n.length;i++){ if(r.name.includes(n.slice(i,i+2))){ hit=true; break; } }
    if(hit) r.tags.forEach(push);
  });
  return out.slice(0,8);
}

/* ============ Supabase データ層（記録） ============ */
function rowToRec(row){
  return {
    id: row.id, name: row.name, date: row.date, note: row.note,
    tags: Array.isArray(row.tags)? row.tags : [],
    photos: Array.isArray(row.photos)? row.photos : [],
    who: row.who || '',                     // 投稿者（こうだい / ゆずは）。空＝旧データ
    createdAt: row.created_at || 0
  };
}
function recToRow(rec){
  return {
    id: rec.id, name: rec.name, date: rec.date, note: rec.note,
    tags: rec.tags || [], photos: rec.photos || [], who: rec.who || null,
    created_at: rec.createdAt || Date.now()
  };
}
async function dbGetAll(){
  const { data, error } = await sb.from('records').select('*');
  if(error){ console.error(error); throw error; }
  return (data||[]).map(rowToRec);
}
async function dbPut(rec){
  const { error } = await sb.from('records').upsert(recToRow(rec));
  if(error){ console.error(error); throw error; }
}
async function dbDelete(id){
  const { error } = await sb.from('records').delete().eq('id', id);
  if(error){ console.error(error); throw error; }
}

/* 写真をストレージにアップロードして公開URLにする（新規=data:のみ対象。既存URLはそのまま） */
async function uploadPhotos(photos){
  const out=[];
  for(const p of photos){
    if(typeof p==='string' && p.startsWith('data:')){
      const blob = await (await fetch(p)).blob();
      const path = `${Date.now()}-${Math.random().toString(36).slice(2)}.jpg`;
      const { error } = await sb.storage.from(PHOTO_BUCKET).upload(path, blob, { contentType:'image/jpeg', upsert:false });
      if(error){ console.error(error); throw error; }
      out.push(sb.storage.from(PHOTO_BUCKET).getPublicUrl(path).data.publicUrl);
    } else {
      out.push(p);
    }
  }
  return out;
}

/* ============ 旧ローカルデータ（IndexedDB）読み出し：初回引っ越し用 ============ */
const DB_NAME='yuzuGohanDB', STORE='records';
function openLocalDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DB_NAME,1);
    r.onupgradeneeded=e=>{const db=e.target.result; if(!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE,{keyPath:'id'});};
    r.onsuccess=e=>res(e.target.result);
    r.onerror=e=>rej(e.target.error);
  });
}
async function localGetAll(){
  try{
    const db=await openLocalDB();
    return await new Promise((res,rej)=>{const tx=db.transaction(STORE,'readonly');const q=tx.objectStore(STORE).getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>rej(q.error);});
  }catch(e){ return []; }
}
async function migrateLocalIfNeeded(){
  if(localStorage.getItem('yuzuMigratedV1')) return;
  let cloud=[]; try{ cloud=await dbGetAll(); }catch(e){ return; }
  if(cloud.length>0){ localStorage.setItem('yuzuMigratedV1','1'); return; } // クラウドに既にあるなら引っ越し不要
  const local=await localGetAll();
  if(!local.length){ localStorage.setItem('yuzuMigratedV1','1'); return; }
  toast('以前の記録をクラウドへ移行中…');
  for(const r of local){
    try{
      const photos=await uploadPhotos(r.photos||[]);
      await dbPut({ id:r.id, name:r.name, date:r.date, note:r.note, tags:r.tags||[], photos, createdAt:r.createdAt||Date.now() });
    }catch(e){ console.error('migrate fail', e); }
  }
  localStorage.setItem('yuzuMigratedV1','1');
  toast('移行が完了しました 🍋');
}

/* ============ いいね・コメント データ層 ============ */
async function loadLikes(){
  const { data, error } = await sb.from('likes').select('*');
  if(error){ console.error(error); return; }
  allLikes = data || [];
}
async function loadComments(){
  const { data, error } = await sb.from('comments').select('*');
  if(error){ console.error(error); return; }
  allComments = (data||[]).sort((a,b)=>(a.created_at||0)-(b.created_at||0));
}
function likesFor(id){ return allLikes.filter(l=>l.record_id===id); }
function iLiked(id){ return allLikes.some(l=>l.record_id===id && l.who===who); }
function commentsFor(id){ return allComments.filter(c=>c.record_id===id); }
async function toggleLike(id){
  if(!who) return;
  const mine = allLikes.find(l=>l.record_id===id && l.who===who);
  if(mine){ const {error}=await sb.from('likes').delete().eq('id',mine.id); if(error)console.error(error); }
  else {
    const {error}=await sb.from('likes').insert({ id:'l'+Date.now()+Math.random().toString(36).slice(2,6), record_id:id, who, created_at:Date.now() });
    if(error)console.error(error);
    else pushNotify('like', id);   // いいねを付けたときだけ相手に通知
  }
}
async function addComment(id, body){
  const {error}=await sb.from('comments').insert({ id:'c'+Date.now()+Math.random().toString(36).slice(2,6), record_id:id, who, body, created_at:Date.now() });
  if(error){ console.error(error); throw error; }
  pushNotify('comment', id, body);   // コメントを相手に通知
}
async function deleteComment(cid){
  const {error}=await sb.from('comments').delete().eq('id',cid); if(error)console.error(error);
}
/* ===== 絵文字リアクション（思い出ストーリーズ用。2人で共有・記録される） ===== */
async function loadReactions(){
  const { data, error } = await sb.from('reactions').select('*');
  if(error){ allReactions=[]; return; }   // テーブル未作成でもアプリは止めない
  allReactions = data || [];
}
function reactionsFor(id){ return allReactions.filter(r=>r.record_id===id); }

/* ===== カードの1タップ返事（家族もキーボードなしで反応できる）＆「またこれ食べたい」 =====
   保存先は既存の reactions テーブル。絵文字で種類を見分ける。
   🤤👏🥹 ＝ ひとこと返事 ／ 🙏 ＝ またこれ食べたい（リクエスト箱に溜まる）  */
const CARD_REACT = ['🤤','👏','🥹'];
const WANT_EMOJI = '🙏';
function reactCount(id, emoji){ return allReactions.filter(r=>r.record_id===id && r.emoji===emoji).length; }
function iReacted(id, emoji){ return allReactions.some(r=>r.record_id===id && r.emoji===emoji && r.who===who); }
function reactWhoText(id){
  const names=[...new Set(allReactions.filter(r=>r.record_id===id && CARD_REACT.includes(r.emoji)).map(r=>r.who))];
  return names.length? names.join('・')+' が反応' : '';
}
function wantCount(id){ return reactCount(id, WANT_EMOJI); }
/* リクエストの多い順（同数なら新しい順）。1件以上ついた記録だけ */
function wantList(){
  return allRecords
    .filter(r=>wantCount(r.id)>0)
    .sort((a,b)=> wantCount(b.id)-wantCount(a.id) || (b.date||'').localeCompare(a.date||''));
}
/* リアクションを付け外しする（楽観更新→DB→realtimeで相手にも反映） */
async function toggleReaction(id, emoji){
  if(!who) return;
  const mine = allReactions.find(x=>x.record_id===id && x.who===who && x.emoji===emoji);
  if(mine){
    allReactions = allReactions.filter(x=>x!==mine);
    const {error} = await sb.from('reactions').delete().eq('id',mine.id); if(error) console.error(error);
  } else {
    const newR={ id:'x'+Date.now()+Math.random().toString(36).slice(2,6), record_id:id, who, emoji, created_at:Date.now() };
    allReactions.push(newR);
    const {error} = await sb.from('reactions').insert(newR);
    if(error) console.error(error);
    else pushNotify('react', id, emoji);   // 2人の端末へ「○○さんが🤤しました」
  }
}

/* ============ 日付整形 ============ */
const WD=['日','月','火','水','木','金','土'];
function fmtDate(iso){
  if(!iso) return '';
  const d=new Date(iso+'T00:00:00');
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${WD[d.getDay()]}）`;
}
/* カード用の短い日付（8/29（金））。フルの日付は詳細画面だけに残す */
function fmtDateShort(iso){
  if(!iso) return '';
  const d=new Date(iso+'T00:00:00');
  return `${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）`;
}
function monthKey(iso){ return iso? iso.slice(0,7) : '0000-00'; }
function fmtMonth(key){ const [y,m]=key.split('-'); return `${y}年${+m}月`; }
function fmtWhen(ts){ if(!ts) return ''; const d=new Date(ts); const p=n=>String(n).padStart(2,'0'); return `${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`; }
function renderCurrentView(){
  if(viewMode==='calendar'){ renderPanels(); renderCalendar(); }
  else if(viewMode==='tags'){ renderPanels(); renderTagView(); }
  else renderFeed();
}

/* ============ フィード描画 ============ */
function allTags(){
  const set=new Set();
  allRecords.forEach(r=>(r.tags||[]).forEach(t=>set.add(t)));
  return [...set];
}
/* 記録カード（月ごとグループ）を組み立てる。フィードとタグページで共用 */
function recordListHTML(list, {groupByMonth=true}={}){
  let html='', lastMonth='';
  list.forEach(r=>{
    const mk=monthKey(r.date);
    if(groupByMonth && mk!==lastMonth){ html+=`<div class="month-head">${fmtMonth(mk)}</div>`; lastMonth=mk; }
    const photos=r.photos||[];
    const cover = photos.length
      ? `<div class="multi"><img class="cover" src="${photos[0]}" loading="lazy" decoding="async">${photos.length>1?`<span class="count">📷 ${photos.length}</span>`:''}</div>`
      : `<div class="cover placeholder">🍽️</div>`;
    const tags=(r.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('');
    const cc=commentsFor(r.id).length;
    const isNew = (r.createdAt||0) > lastSeen;
    const badge = isNew? `<span class="newdot" aria-label="新着"></span>` : '';
    html+=`
      <div class="entry" data-id="${r.id}">
        ${cover}
        <div class="body">
          <div class="e-top">
            <span class="e-date">${fmtDateShort(r.date)}</span>
            ${cc?`<span class="e-cmt">💬 ${cc}</span>`:''}
          </div>
          <div class="e-name">${badge}${esc(r.name)}</div>
          ${r.note?`<div class="e-note">${esc(r.note)}</div>`:''}
          ${tags?`<div class="tags">${tags}</div>`:''}
          ${actRowHTML(r.id)}
        </div>
      </div>`;
  });
  return html;
}
/* カードの反応列：❤️ 🤤 👏 🥹 …右端に 🙏（またこれ食べたい）。
   ラベル文字は持たせない＝押すと色がつく／数字だけ添える。誰が押したかは詳細画面で見る。 */
function actRowHTML(id, {heart:withHeart=true}={}){
  const liked=iLiked(id), lc=likesFor(id).length;
  const heart=withHeart?`<button class="act ${liked?'on':''} ${lc?'has':''}" data-like="${id}" aria-label="いいね"><span class="em">❤️</span>${lc?`<span class="cnt">${lc}</span>`:''}</button>`:'';
  const btns = CARD_REACT.map(e=>{
    const c=reactCount(id,e);
    return `<button class="act ${iReacted(id,e)?'on':''} ${c?'has':''}" data-rx="${id}" data-e="${e}" aria-label="${e}"><span class="em">${e}</span>${c?`<span class="cnt">${c}</span>`:''}</button>`;
  }).join('');
  const wc=wantCount(id);
  const want=`<button class="act want ${iReacted(id,WANT_EMOJI)?'on':''} ${wc?'has':''}" data-rx="${id}" data-e="${WANT_EMOJI}" aria-label="またこれ食べたい"><span class="em">🙏</span>${wc?`<span class="cnt">${wc}</span>`:''}</button>`;
  return `<div class="act-row">${heart}${btns}${want}</div>`;
}
/* 詳細画面用：反応列（❤️ は上の「いいね」ボタンがあるので出さない）＋ 誰が反応したか */
function actRowDetailHTML(id){
  const whoTxt=reactWhoText(id);
  return actRowHTML(id,{heart:false}) + (whoTxt?`<div class="react-who">${esc(whoTxt)}</div>`:'');
}

/* ============ タグページ（タグで絞り込み） ============ */
function renderTagView(){
  const tv=$('#tagview');
  const tags=allTags();
  selTags=selTags.filter(t=>tags.includes(t));        // 消えたタグは選択から外す
  if(!tags.length){
    tv.innerHTML=`<div class="empty"><span class="big">🏷️</span>まだタグがありません</div>`;
    return;
  }
  const count=t=>allRecords.filter(r=>(r.tags||[]).includes(t)).length;
  const chips=tags.map(t=>`<button class="fchip ${selTags.includes(t)?'on':''}" data-t="${esc(t)}">${esc(t)}<span class="cnt">${count(t)}</span></button>`).join('');
  // 選択タグをすべて含む記録（AND絞り込み）
  let list=allRecords.slice();
  if(selTags.length) list=list.filter(r=>selTags.every(t=>(r.tags||[]).includes(t)));
  const head=selTags.length
    ? `<div class="tagview-result-head">「${selTags.map(esc).join('」「')}」の記録 <b>${list.length}</b>件</div>`
    : `<div class="tagview-result-head">タグを選んで絞りこむ（全${allRecords.length}件）</div>`;
  const body=list.length? recordListHTML(list) : `<div class="empty"><span class="big">🔍</span>該当する記録がありません</div>`;
  tv.innerHTML=`
    <div class="tagview-head">
      <div class="tag-cloud">${chips}</div>
      ${selTags.length?`<button class="tag-clear" id="tagClear">✕ クリア</button>`:''}
    </div>
    ${head}
    ${body}`;
  tv.querySelectorAll('.tag-cloud .fchip').forEach(b=>b.onclick=()=>{
    const t=b.dataset.t;
    if(selTags.includes(t)) selTags=selTags.filter(x=>x!==t); else selTags.push(t);
    renderTagView();
  });
  const clr=$('#tagClear'); if(clr) clr.onclick=()=>{ selTags=[]; renderTagView(); };
  bindEntries(tv);
}

/* 並び順：作った日順（従来）／増えた順（あとから足した記録も上に出る） */
const SORT_MODES=[
  { v:'date',  label:'📅 作った日順' },
  { v:'added', label:'🍋 増えた順' },
];
function renderSortRow(){
  const nNew = allRecords.filter(r=>(r.createdAt||0)>lastSeen).length;
  $('#sortRow').innerHTML = SORT_MODES.map(s=>{
    const cnt = (s.v==='added' && nNew)? `<span class="cnt">${nNew}</span>` : '';

function sortRecords(list){
  const l=list.slice();
  if(sortMode==='added') l.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  else l.sort((a,b)=> (b.date||'').localeCompare(a.date||'') || (b.createdAt||0)-(a.createdAt||0));
  return l;
}

/* 「1年前 / 1ヶ月前の今日」に近い記録を1件だけ返す */
function memoryOfToday(){
  const now=new Date();
  const cands=[
    { lab:'1年前の今日',   d:new Date(now.getFullYear()-1, now.getMonth(), now.getDate()) },
    { lab:'1ヶ月前の今日', d:new Date(now.getFullYear(), now.getMonth()-1, now.getDate()) },
  ];
  for(const c of cands){
    const key = new Date(c.d.getTime()-c.d.getTimezoneOffset()*60000).toISOString().slice(0,10);
    const hit = allRecords.filter(r=>r.date===key);
    if(hit.length) return { label:c.lab, rec:hit[0] };
  }
  return null;
}

let loadedOnce=false;
async function loadRecords(){
  try{
    const [recs] = await Promise.all([ dbGetAll(), loadLikes(), loadComments(), loadReactions() ]);
    allRecords = recs;
  }catch(e){
    console.error(e);
    if(!loadedOnce) $('#feed').innerHTML = `<div class="empty"><span class="big">📡</span>クラウドに接続できませんでした。<br>通信環境を確認して、ページを再読み込みしてください。</div>`;
    toast('接続エラー');
    return;
  }
  loadedOnce=true;
  allRecords.sort((a,b)=> (b.date||'').localeCompare(a.date||'') || (b.createdAt||0)-(a.createdAt||0));
  /* 新着バッジは「前回の訪問以降に増えたもの」。次回のために今の時刻を保存しつつ、
     この画面を開いているあいだはバッジを消さない（lastSeen はメモリ上では据え置き） */
  if(!seenTouched){
    seenTouched=true;
    if(!lastSeen) lastSeen = Date.now();   // 初回起動は全部を既読扱いにする（バッジだらけを防ぐ）
    localStorage.setItem('yuzuLastSeen', String(Date.now()));
  }
  updateStats(); renderCookFilter(); renderSortRow();
  renderCurrentView();
  if(openDetailId) renderDetail(openDetailId);
  if($('#requestModal').classList.contains('show')) renderRequests();
  if($('#reportModal').classList.contains('show')) renderReport();
  if($('#story').classList.contains('show')) refreshStoryReactions();   // ストーリーズ表示中なら相手のリアクションを反映
}

/* ============ 写真圧縮 ============ */
function compressImage(file, {maxDim=1400, quality=0.82, square=false}={}){
  return new Promise(resolve=>{
    const reader=new FileReader();
    reader.onload=ev=>{
      const img=new Image();
      img.onload=()=>{
        const c=document.createElement('canvas');
        if(square){
          // カメラ撮影は必ず正方形に：短辺で中央を切り抜く
          const side=Math.min(img.width,img.height);
          const sx=(img.width-side)/2, sy=(img.height-side)/2;
          const out=Math.min(side,maxDim);
          c.width=out; c.height=out;
          c.getContext('2d').drawImage(img, sx, sy, side, side, 0, 0, out, out);
        }else{
          let w=img.width,h=img.height;
          if(w>h){ if(w>maxDim){h=Math.round(h*maxDim/w);w=maxDim;} }
          else { if(h>maxDim){w=Math.round(w*maxDim/h);h=maxDim;} }
          c.width=w; c.height=h;
          c.getContext('2d').drawImage(img,0,0,w,h);
        }
        resolve(c.toDataURL('image/jpeg',quality));
      };
      img.src=ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ===== アプリ内カメラ（正方形固定＋フラッシュ） ===== */
let camStream=null, camTrack=null, torchOn=false, torchSupported=false;

async function openCamera(){
  // getUserMedia が無い環境（古い端末等）は純正カメラにフォールバック
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ $('#cameraInput').click(); return; }
  try{
    camStream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:{ideal:'environment'}, width:{ideal:1920}, height:{ideal:1920} },
      audio:false
    });
  }catch(err){
    console.warn('getUserMedia失敗→純正カメラへ', err);
    $('#cameraInput').click();     // 権限拒否や未対応時は従来方式で撮る
    return;
  }
  const v=$('#camVideo'); v.srcObject=camStream; try{ await v.play(); }catch(e){}
  camTrack = camStream.getVideoTracks()[0];
  // フラッシュ（torch）対応の端末だけボタンを出す
  torchOn=false; torchSupported=false;
  try{ const caps = camTrack.getCapabilities ? camTrack.getCapabilities() : {}; torchSupported = !!caps.torch; }catch(e){}
  $('#camFlash').hidden = !torchSupported;
  $('#camFlash').classList.remove('on'); $('#camFlashLabel').textContent='オフ';
  $('#cam').classList.add('show'); document.body.style.overflow='hidden';
}
function closeCamera(){
  if(torchOn){ try{ camTrack.applyConstraints({advanced:[{torch:false}]}); }catch(e){} }
  if(camStream){ camStream.getTracks().forEach(t=>t.stop()); }
  camStream=null; camTrack=null; torchOn=false;
  $('#camVideo').srcObject=null;
  $('#cam').classList.remove('show'); document.body.style.overflow='';
}
async function toggleTorch(){
  if(!camTrack) return;
  const next=!torchOn;
  try{
    await camTrack.applyConstraints({advanced:[{torch:next}]});
    torchOn=next;
    $('#camFlash').classList.toggle('on', torchOn);
    $('#camFlashLabel').textContent = torchOn?'オン':'オフ';
  }catch(e){ toast('この端末ではフラッシュを使えません'); $('#camFlash').hidden=true; }
}
function captureSquareFromVideo(){
  const v=$('#camVideo');
  const vw=v.videoWidth||v.clientWidth, vh=v.videoHeight||v.clientHeight;
  const side=Math.min(vw,vh);
  const sx=(vw-side)/2, sy=(vh-side)/2;
  const out=Math.min(side,1400)||1080;
  const c=document.createElement('canvas'); c.width=out; c.height=out;
  c.getContext('2d').drawImage(v, sx, sy, side, side, 0, 0, out, out);   // 枠と同じ中央正方形を切り出す
  return c.toDataURL('image/jpeg',0.82);
}
$('#camFlash').onclick=toggleTorch;
$('#camClose').onclick=closeCamera;
$('#camShotBtn').onclick=()=>{
  haptic(true);
  const d=captureSquareFromVideo();
  const sheetOpen=$('#recordModal').classList.contains('show');
  closeCamera();
  if(!sheetOpen) openRecord(null);      // ＋起点なら新規シートを用意（formPhotosがリセットされる）

};

function renderTagSuggest(){

  const reco = suggestTagsFor($('#rName') ? $('#rName').value : '');

function openReport(){

    // 今月がまだ0件なら、先月を開く
    const k=`${repYear}-${String(repMonth+1).padStart(2,'0')}`;

function renderReport(){
  const key=`${repYear}-${String(repMonth+1).padStart(2,'0')}`;
  const list=allRecords.filter(r=>monthKey(r.date)===key);
  const body=$('#reportBody');
  const nav=`<div class="rep-nav">
      <button id="repPrev" aria-label="前の月">‹</button>
      <div style="font-weight:700">${fmtMonth(key)}</div>
      <button id="repNext" aria-label="次の月">›</button>
    </div>`;
  if(!list.length){
    body.innerHTML = nav + `<div class="empty"><span class="big">📮</span>この月の記録はまだありません</div>`;
    bindReportNav(); return;
  }
  const days=new Set(list.map(r=>r.date)).size;
  const byYuzu=list.filter(r=>r.who==='こうだい').length;   // こうだいが投稿＝ゆずちゃんの手料理
  const byKodai=list.filter(r=>r.who==='ゆずは').length;
  // いちばん多かった料理のことば（2文字以上の連続を数える簡易集計）
  const wordCount={};
  const WORDS=['おにぎり','カレー','鍋','スープ','野菜炒め','炒め','唐揚げ','漬け','マリネ','煮込み',
               'サラダ','おつまみ','パスタ','うどん','チャーハン','たまご','卵','フライ','弁当','肉じゃが'];
  list.forEach(r=>WORDS.forEach(w=>{ if((r.name||'').includes(w)) wordCount[w]=(wordCount[w]||0)+1; }));
  const topWord=Object.entries(wordCount).sort((a,b)=>b[1]-a[1])[0];
  // いちばん愛されたごはん（いいね＋コメント＋スタンプの合計）
  const score=r=>likesFor(r.id).length + commentsFor(r.id).length*2 + reactionsFor(r.id).length;
  const loved=list.slice().sort((a,b)=>score(b)-score(a))[0];
  const photos=list.flatMap(r=>r.photos||[]).slice(0,12);
  const noteCount=list.filter(r=>(r.note||'').trim()).length;

  body.innerHTML = nav + `

function renderCalendar(){
  const cal=$('#calendar');
  if(calYear==null){ const n=new Date(); calYear=n.getFullYear(); calMonth=n.getMonth(); }
  const startWd=new Date(calYear, calMonth, 1).getDay();
  const days=new Date(calYear, calMonth+1, 0).getDate();
  const todayStr=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
  const byDate={};
  allRecords.forEach(r=>{ (byDate[r.date]=byDate[r.date]||[]).push(r); });
  let cells='';
  for(let i=0;i<startWd;i++) cells+=`<div class="cal-cell empty"></div>`;
  for(let d=1; d<=days; d++){
    const ds=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const recs=byDate[ds]||[];
    const today=ds===todayStr?'today':'';
    if(recs.length){
      const pic=recs.map(r=>(r.photos||[])[0]).find(Boolean);
      if(pic){
        cells+=`<div class="cal-cell has ${today}" data-day="${ds}"><img class="thumb" src="${pic}" loading="lazy" decoding="async"><div class="shade"></div><span class="dnum">${d}</span>${recs.length>1?`<span class="cnt">${recs.length}</span>`:''}</div>`;
      } else {
        cells+=`<div class="cal-cell has nopic ${today}" data-day="${ds}"><span class="dnum">${d}</span><span class="dot"></span></div>`;
      }
    } else {
      cells+=`<div class="cal-cell ${today}">${d}</div>`;
    }
  }
  cal.innerHTML = `
    <div class="cal-head">
      <button id="calPrev" aria-label="前の月">‹</button>
      <div class="mon">${calYear}年${calMonth+1}月</div>
      <button id="calNext" aria-label="次の月">›</button>
    </div>
    <div class="cal-grid">
      ${WD.map(w=>`<div class="wd">${w}</div>`).join('')}
      ${cells}
    </div>`;
  $('#calPrev').onclick=()=>{ calMonth--; if(calMonth<0){calMonth=11;calYear--;} renderCalendar(); };
  $('#calNext').onclick=()=>{ calMonth++; if(calMonth>11){calMonth=0;calYear++;} renderCalendar(); };
  cal.querySelectorAll('[data-day]').forEach(el=>el.onclick=()=>openDay(el.dataset.day));
}
function openDay(ds){
  const recs=allRecords.filter(r=>r.date===ds).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  if(!recs.length) return;
  if(recs.length===1){ openDetail(recs[0].id); return; }
  openDetailId=null;
  $('#detailBody').innerHTML =
    `<div class="d-date">${fmtDate(ds)}</div><div class="d-name" style="margin-bottom:10px">この日のごはん（${recs.length}品）</div>` +
    recs.map(r=>{
      const pic=(r.photos||[])[0];
      const cov = pic
        ? `<img src="${pic}" loading="lazy" decoding="async" style="width:64px;height:64px;border-radius:12px;object-fit:cover;flex:none">`
        : `<div style="width:64px;height:64px;border-radius:12px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;flex:none;font-size:26px">🍽️</div>`;
      return `<div class="day-item" data-id="${r.id}" style="display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer">${cov}<div><div style="font-weight:700">${esc(r.name)}</div><div style="font-size:12px;color:var(--sub);margin-top:2px">❤️ ${likesFor(r.id).length}　💬 ${commentsFor(r.id).length}</div></div></div>`;
    }).join('');
  showModal('detailModal');
  $('#detailBody').querySelectorAll('.day-item').forEach(el=>el.onclick=()=>openDetail(el.dataset.id));
}

/* ============ 写真ライトボックス ============ */
function openLightbox(photos, start){
  if(!photos||!photos.length) return;
  const track=$('#lbTrack'), dots=$('#lbDots');
  track.innerHTML = photos.map(p=>`<div class="lb-slide"><img src="${p}" decoding="async"></div>`).join('');
  dots.innerHTML = photos.map((_,i)=>`<span class="d ${i===start?'on':''}"></span>`).join('');
  $('#lbIdx').textContent = `${start+1} / ${photos.length}`;
  $('#lightbox').classList.add('show');
  requestAnimationFrame(()=>{ track.scrollLeft = track.clientWidth*start; });
  track.onscroll=()=>{
    const i=Math.round(track.scrollLeft/track.clientWidth);
    $('#lbIdx').textContent=`${i+1} / ${photos.length}`;
    dots.querySelectorAll('.d').forEach((d,j)=>d.classList.toggle('on', j===i));
  };
}
function closeLightbox(){ $('#lightbox').classList.remove('show'); $('#lbTrack').onscroll=null; }
$('#lbClose').onclick=closeLightbox;
$('#lightbox').addEventListener('click',e=>{ if(e.target.id==='lightbox') closeLightbox(); });

/* ============ 触覚フィードバック ============ */
/* Android等は navigator.vibrate、iOS(17.4+)は隠しスイッチを叩く小ワザで一瞬振動させる */
const _hapticLabel = $('#hapticLabel');
function haptic(strong){
  try{ if(navigator.vibrate) navigator.vibrate(strong?14:8); }catch(e){}
  try{ if(_hapticLabel) _hapticLabel.click(); }catch(e){}
}

/* ============ 思い出ストーリーズ ============ */
const STORY_EMOJI = ['❤️','😋','🔥','🥹','👏','✨'];
let storyList=[], storyIdx=0, storyBound=false;

function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function makerLabel(r){
  if(r.who==='ゆずは') return 'こうだいの手料理';
  if(r.who==='こうだい') return 'ゆずちゃんの手料理';
  return '';
}
function reactionRowHTML(id){
  const rx=reactionsFor(id);
  return STORY_EMOJI.map(e=>{
    const cnt=rx.filter(x=>x.emoji===e).length;
    const mine=rx.some(x=>x.emoji===e && x.who===who);
    return `<button class="st-rx ${mine?'on':''}" data-e="${e}"><span class="em">${e}</span>${cnt?`<span class="cnt">${cnt}</span>`:''}</button>`;
  }).join('');
}
function storySlideHTML(r){
  const photos=r.photos||[];
  const photo = photos.length
    ? `<div class="st-photo-wrap"><img class="st-photo" src="${photos[0]}" loading="lazy" decoding="async"></div>`
    : `<div class="st-photo-wrap">🍽️</div>`;
  const sub=[makerLabel(r), fmtDate(r.date)].filter(Boolean).join('　•　');
  return `<div class="st-slide" data-id="${r.id}">
    ${photo}
    <div class="st-meta">
      <div class="st-ava">🍋</div>
      <div><div class="st-name">${esc(r.name)}</div><div class="st-sub">${esc(sub)}</div></div>
    </div>
    <div class="st-reactions" data-rid="${r.id}">${reactionRowHTML(r.id)}</div>
  </div>`;
}
function bindStorySlide(slide){
  const id=slide.dataset.id;
  slide.querySelectorAll('.st-rx').forEach(btn=>btn.onclick=()=>onReact(id, btn.dataset.e, slide));
}
function refreshStoryReactions(){
  $('#stTrack').querySelectorAll('.st-slide').forEach(slide=>{
    const row=slide.querySelector('.st-reactions');
    if(row){ row.innerHTML=reactionRowHTML(slide.dataset.id); }
    bindStorySlide(slide);
  });
}
function updateStoryBars(){
  $('#stBars').querySelectorAll('.st-bar').forEach((b,j)=>b.classList.toggle('on', j<=storyIdx));
}
function updateReplyPlaceholder(){
  const r=storyList[storyIdx]; const inp=$('#stReplyInput');
  if(inp && r) inp.placeholder=`「${r.name}」にひとこと…`;
}
async function onReact(id, emoji, slide){
  if(!who){ ensureWho(()=>onReact(id,emoji,slide)); return; }
  haptic(true);
  const mine=allReactions.find(x=>x.record_id===id && x.who===who && x.emoji===emoji);
  let popEmoji=null;
  if(mine){
    allReactions=allReactions.filter(x=>x!==mine);
    sb.from('reactions').delete().eq('id',mine.id).then(({error})=>{ if(error)console.error(error); });
  } else {
    const newR={ id:'x'+Date.now()+Math.random().toString(36).slice(2,6), record_id:id, who, emoji, created_at:Date.now() };
    allReactions.push(newR); popEmoji=emoji;
    sb.from('reactions').insert(newR).then(({error})=>{ if(error)console.error(error); });
  }
  // この料理のリアクション行だけ即時更新（ストーリーは閉じない）
  const row=slide.querySelector('.st-reactions');
  row.innerHTML=reactionRowHTML(id);
  bindStorySlide(slide);
  if(popEmoji) row.querySelectorAll('.st-rx').forEach(b=>{ if(b.dataset.e===popEmoji) b.classList.add('pop'); });
}
function openStory(){
  const run=()=>{
    let list=allRecords.filter(r=>(r.photos||[]).length);   // 写真がある料理を中心に
    if(!list.length) list=allRecords.slice();
    if(!list.length){ toast('まだ記録がありません'); return; }
    storyList=shuffle(list); storyIdx=0;
    $('#stBars').innerHTML = storyList.map(()=>`<div class="st-bar"></div>`).join('');
    $('#stTrack').innerHTML = storyList.map(storySlideHTML).join('');
    $('#stTrack').querySelectorAll('.st-slide').forEach(bindStorySlide);
    updateStoryBars(); updateReplyPlaceholder();
    $('#story').classList.add('show'); document.body.style.overflow='hidden';
    requestAnimationFrame(()=>{ $('#stTrack').scrollLeft=0; });
    if(!storyBound){ bindStoryControls(); storyBound=true; }
  };
  if(FAMILY){ run(); } else { ensureWho(run); }   // 家族は名前選択なしで思い出を見られる（反応時に名前入力）
}
function closeStory(){ $('#story').classList.remove('show'); document.body.style.overflow=''; }
function bindStoryControls(){
  const track=$('#stTrack');
  track.addEventListener('scroll', ()=>{
    const i=Math.round(track.scrollLeft/track.clientWidth);
    if(i!==storyIdx && i>=0 && i<storyList.length){
      storyIdx=i; haptic();          // 次の料理へ送ったら振動
      updateStoryBars(); updateReplyPlaceholder();
    }
  }, {passive:true});
  $('#stClose').onclick=closeStory;
  $('#stShuffle').onclick=()=>openStory();   // もう一度シャッフルして見直す
  $('#stReplyInput').addEventListener('keydown',e=>{
    if(e.key!=='Enter') return;
    e.preventDefault();
    const v=e.target.value.trim(); if(!v) return;
    const r=storyList[storyIdx]; if(!r) return;
    ensureWho(async()=>{
      e.target.value=''; e.target.blur();
      try{ await addComment(r.id, v); haptic(); toast('返信しました 🍋'); }
      catch(err){ toast('送信に失敗しました'); }
    });
  });
}
$('#memoryBtn').onclick=openStory;

/* ============ モーダル制御 ============ */
function showModal(id){
  const bg=$('#'+id); bg.classList.add('show');
  const m=bg.querySelector('.modal');            // 開くたびに下からのスライドを再生
  if(m){ m.style.animation='none'; void m.offsetWidth; m.style.animation=''; }
  document.body.style.overflow='hidden';
}
function hideModal(id){
  $('#'+id).classList.remove('show');
  if(id==='detailModal') openDetailId=null;
  // まだ別のシートが開いているなら、背面のスクロールは止めたままにする
  document.body.style.overflow = document.querySelector('.modal-bg.show') ? 'hidden' : '';
}
$$('[data-close]').forEach(el=>el.onclick=()=>hideModal(el.dataset.close));
$$('.modal-bg').forEach(bg=>bg.addEventListener('click',e=>{if(e.target===bg)hideModal(bg.id);}));

/* ============ リアルタイム同期 ============ */
let rtTimer=null;
function scheduleReload(){ clearTimeout(rtTimer); rtTimer=setTimeout(loadRecords, 400); } // 連続変更をまとめて再読み込み
function subscribeRealtime(){
  sb.channel('yuzu-rt')
    .on('postgres_changes', { event:'*', schema:'public', table:'records' }, scheduleReload)
    .on('postgres_changes', { event:'*', schema:'public', table:'likes' }, scheduleReload)
    .on('postgres_changes', { event:'*', schema:'public', table:'comments' }, scheduleReload)
    .on('postgres_changes', { event:'*', schema:'public', table:'reactions' }, scheduleReload)
    .subscribe();
}

/* ============ 新しい版の検知 ============
   GitHub Pages は10分ぶんキャッシュを許すうえ、iPhoneのホーム画面アプリはページを持ち続ける。
   そのせいで「直したのに古いまま」が実際に2回起きた（2026-08-30/08-31）。
   自分で管理するバージョン番号は付け忘れると効かないので、
   サーバーの Last-Modified と、いま読み込んでいるページの last-modified を比べる。
   ・起動直後（まだ何も触っていない）＝黙って読み直す（ただの読み込みに見える）
   ・使っている最中に見つけた＝下にバーを出して、タップで読み直す（勝手に消さない） */
let updFound=false, updLastCheck=0;
function pageLoadedAt(){
  const t = Date.parse(document.lastModified);
  return isNaN(t)? null : t;
}
async function checkForUpdate(){
  if(updFound) return;
  if(Date.now()-updLastCheck < 60000) return;      // 多くても1分に1回
  updLastCheck = Date.now();
  try{
    const res = await fetch(location.pathname + '?_=' + Date.now(), { method:'HEAD', cache:'no-store' });
    const lm = res.headers.get('last-modified');
    const mine = pageLoadedAt();
    if(!lm || mine==null) return;                  // どちらか読めなければ何もしない
    const server = Date.parse(lm);
    if(isNaN(server)) return;
    if(server - mine <= 5000) return;              // 5秒以内の差は誤差として無視
    updFound = true;
    const fresh = (Date.now() - _bootAt) < 12000;  // 起動直後か
    const busy  = !!document.querySelector('.modal-bg.show') || $('#cam').classList.contains('show')
                  || $('#story').classList.contains('show');
    if(fresh && !busy && !sessionStorage.getItem('yuzuReloaded')){
      sessionStorage.setItem('yuzuReloaded','1');  // 読み直しは1セッション1回まで（ループ防止）
      location.reload();
      return;
    }
    $('#updBar').classList.add('show');
  }catch(e){ /* 通信できないときは何もしない */ }
}
const _bootAt = Date.now();
$('#updGo').onclick = ()=>location.reload();
$('#updBar').onclick = ()=>location.reload();
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) checkForUpdate(); });

/* ============ 初期化 ============ */
$('#feed').innerHTML = `<div class="empty"><span class="big">🍳</span>読み込み中…</div>`;
(async()=>{
  await migrateLocalIfNeeded();
  await loadRecords();
  subscribeRealtime();
  ensurePushSubscription();   // 既に許可済みの端末は、起動時に購読を最新化
  syncNotifyUI();
  checkForUpdate();           // 古いページを掴んだままになっていないか確かめる
  if(!who) showModal('whoModal');
})();
</script>

<style>
  #tsumikiEdge{position:fixed; top:0; bottom:0; left:0; width:22px; z-index:999;}
  #tsumikiPeek{
    position:fixed; top:50%; left:0; z-index:1001; margin-top:-23px;
    width:46px; height:46px; display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.92);
    -webkit-backdrop-filter:saturate(180%) blur(14px); backdrop-filter:saturate(180%) blur(14px);
    border:1px solid rgba(0,0,0,.06); border-radius:50%;
    box-shadow:0 6px 20px rgba(0,0,0,.18);
    color:#0071e3; font-size:24px; font-weight:600; line-height:1;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Helvetica Neue",Arial,sans-serif;
    transform:translateX(-70px) scale(.8); opacity:0; pointer-events:none;
  }
</style>
<div id="tsumikiEdge"></div>
<div id="tsumikiPeek">‹</div>
<script>
  (function(){
    var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
      || window.navigator.standalone === true;
    var fromTsumiki = false;
    try{
      if(document.referrer){
        var r = new URL(document.referrer);
        fromTsumiki = (r.origin === location.origin);
      }
    }catch(e){}
    if(!(standalone && fromTsumiki)) return;

    var peek = document.getElementById('tsumikiPeek');
    var edge = document.getElementById('tsumikiEdge');

    function goBack(){ location.href = 'index.html'; }

    /* --- 左端エッジスワイプで戻る（iOS純正の戻る操作。見えるボタンは置かない） --- */
    var sx=0, sy=0, prog=0, dragging=false, W=window.innerWidth;
    var TRIGGER = Math.min(120, W*0.32);
    window.addEventListener('resize', function(){ W=window.innerWidth; TRIGGER=Math.min(120, W*0.32); });

    function reset(){
      dragging = false; prog = 0;
      peek.style.transition = 'transform .25s ease, opacity .25s ease';
      peek.style.transform = 'translateX(-70px) scale(.8)';
      peek.style.opacity = 0;
    }
    function start(e){
      var t = e.touches ? e.touches[0] : e;
      if(t.clientX > 26) return;
      sx = t.clientX; sy = t.clientY; prog = 0; dragging = true;
      peek.style.transition = 'none';
    }
    function move(e){
      if(!dragging) return;
      var t = e.touches ? e.touches[0] : e;
      var dx = t.clientX - sx, dy = t.clientY - sy;
      if(Math.abs(dy) > Math.abs(dx) + 12){ reset(); return; }
      if(dx < 0) dx = 0;
      prog = Math.min(dx / TRIGGER, 1);
      peek.style.transform = 'translateX(' + (-70 + prog*82) + 'px) scale(' + (0.8 + prog*0.2) + ')';
      peek.style.opacity = prog;
      if(dx > 6 && e.cancelable) e.preventDefault();
    }
    function end(){
      if(!dragging) return;
      dragging = false;
      if(prog >= 0.999){
        peek.style.transition = 'transform .25s ease, opacity .25s ease';
        peek.style.transform = 'translateX(20px) scale(1.05)';
        peek.style.opacity = 1;
        goBack();
      }else{
        reset();
      }
    }
    edge.addEventListener('touchstart', start, {passive:true});
    window.addEventListener('touchmove', move, {passive:false});
    window.addEventListener('touchend', end, {passive:true});
    window.addEventListener('touchcancel', end, {passive:true});
  })();
</script>
