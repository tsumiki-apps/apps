  /* つみきポートフォリオの線画語彙（.sc-line / .sc-soft / .sc-accent / .sc-fillsoft）を踏襲 */

<!-- まぜいろ用：はかりの上のカップでカラー剤を混ぜる人。2本のチューブ、2色→混ざった色のチップ。 -->

  <defs>
    <filter color-interpolation-filters="sRGB" id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.14  0 0 0 0 0.13  0 0 0 0 0.12  0 0 0 0.5 0"/>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
    <filter color-interpolation-filters="sRGB" id="stamp" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.14" numOctaves="2" seed="9" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
