<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="apple-touch-icon" href="icons/icon-index.png">
<meta name="apple-mobile-web-app-title" content="つみき">
<title>つみき — こうだいの制作物</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F4F2EE; --card:#FBFAF7; --surface:#ECE9E3;
    --ink:#242321; --sub:#77736B; --line:#D8D4CC; --ghost:#BEB9B0;
    --radius:20px;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  body{
    font-family:'Zen Maru Gothic',-apple-system,BlinkMacSystemFont,"Hiragino Maru Gothic ProN","Hiragino Sans","Helvetica Neue",Arial,sans-serif;
    background:var(--paper); color:var(--ink);
    line-height:1.78; padding:env(safe-area-inset-top) 18px 56px;
    -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:720px; margin:0 auto;}
  header{padding:52px 4px 30px; text-align:center;}
  .kicker{color:var(--sub); font-size:12px; letter-spacing:.18em; margin-bottom:14px;}
  .logo{display:flex; gap:5px; align-items:center; justify-content:center; margin-bottom:16px;}
  .logo i{border-radius:50%; background:var(--ink); display:block;}
  .logo i:nth-child(1),.logo i:nth-child(5){width:5px; height:5px;}
  .logo i:nth-child(2),.logo i:nth-child(4){width:9px; height:9px;}
  .logo i:nth-child(3){width:13px; height:13px;}
  h1{font-size:36px; font-weight:700; letter-spacing:.02em; line-height:1.2;}
  .tagline{color:#3a3833; font-size:15px; margin-top:12px; line-height:1.76;}
  .count{color:var(--sub); font-size:12.5px; letter-spacing:.04em; margin-top:18px;}
  .checkroom{display:inline-flex; align-items:center; gap:6px; margin-top:14px;
    text-decoration:none; font-size:13px; font-weight:500; color:var(--sub);
    background:var(--card); border:1px solid var(--line); border-radius:999px;
    padding:8px 16px; transition:transform .15s ease, border-color .15s ease;}
  .checkroom:active{transform:scale(.96);}
  @media(hover:hover){ .checkroom:hover{color:var(--ink); border-color:var(--ghost);} }
  .section{margin-top:48px;}
  .section h2{font-size:13px; font-weight:700; letter-spacing:.14em; color:var(--sub);
    padding:0 4px 16px; display:flex; align-items:center; gap:10px; text-transform:uppercase;}
  .section h2 .cat-emoji{font-size:18px;}
  .section h2 .badge{margin-left:auto; font-size:12px; font-weight:500; color:var(--sub);
    letter-spacing:.04em; background:var(--card); border:1px solid var(--line);
    border-radius:999px; padding:3px 11px;}
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media(min-width:560px){ .grid{grid-template-columns:repeat(3,1fr);} }
  a.card{
    position:relative;
    display:flex; flex-direction:column; justify-content:space-between; gap:14px;
    text-decoration:none; aspect-ratio:1/1; overflow:hidden;
    background:var(--card); border:1px solid var(--line); border-radius:22px;
    padding:18px 16px; color:var(--ink);
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  a.card:active{transform:scale(.96);}
  @media(hover:hover){ a.card:hover{transform:translateY(-3px); border-color:var(--ghost); box-shadow:0 12px 30px rgba(36,35,33,.10);} }
  .emoji{font-size:27px; flex:0 0 auto; width:50px; height:50px;
    display:flex; align-items:center; justify-content:center;
    background:var(--surface); border-radius:16px;}
  .ico{flex:0 0 auto; width:50px; height:50px; border-radius:14px; display:block;}
  .txt{min-width:0; display:flex; flex-direction:column; gap:4px;}
  .title{display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden; font-size:15px; font-weight:700; letter-spacing:.01em; line-height:1.34;}
  .desc{display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden; font-size:12px; color:var(--sub); line-height:1.5;}
  /* ヘッダーのアクション（チェックルーム／編集） */
  .hdr-actions{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:16px;}
  .hdr-actions .checkroom{margin-top:0;}
  button.checkroom{-webkit-appearance:none; appearance:none; font-family:inherit; cursor:pointer; line-height:1;}
  body.editing #editBtn{color:var(--ink); border-color:var(--ghost); background:var(--surface);}
  /* お気に入りの★トグル（編集モード時のみ表示） */
  .favmark{position:absolute; top:10px; right:10px; width:26px; height:26px; border-radius:50%;
    background:var(--card); box-shadow:0 1px 5px rgba(36,35,33,.14);
    display:flex; align-items:center; justify-content:center;
    opacity:0; transform:scale(.8); transition:opacity .15s ease, transform .15s ease; pointer-events:none;}
  .favmark svg{width:16px; height:16px;}
  .favmark .s{fill:none; stroke:var(--ghost); stroke-width:1.7; stroke-linejoin:round;}
  body.editing .favmark{opacity:1; transform:scale(1);}
  .card.is-fav .favmark .s{fill:var(--ink); stroke:var(--ink);}
  body.editing .card{cursor:pointer;}
  .editing-hint{color:var(--sub); font-size:12px; letter-spacing:.04em; text-align:center; margin-top:12px;}
  .fav-empty{color:var(--sub); font-size:13px; padding:6px 4px 2px; line-height:1.7;}
  footer{text-align:center; color:var(--sub); font-size:12px; letter-spacing:.06em;
    margin-top:56px; padding-top:30px; border-top:1px solid var(--line); line-height:1.8;}
  /* 今週のWork ダッシュボード（テキストなし） */
  .dash{margin-top:22px; background:var(--card); border:1px solid var(--line);
    border-radius:var(--radius); padding:16px 16px 13px; position:relative;}
  .dash .ds{position:absolute; top:13px; right:13px; width:7px; height:7px;
    border-radius:50%; background:var(--ink);}
  .ds.off{background:var(--ghost);}
  /* アプリ×曜日 ヒートマップ（テキストなし・絵文字とセルのみ） */
  .hm{margin:0 0 4px; display:flex; flex-direction:column; gap:4px;}
  .hm-row{display:grid; grid-template-columns:28px repeat(7,1fr);
    gap:4px; align-items:center;}
  @media(max-width:420px){ .hm-row{gap:3px;} }
  .hm-app{display:flex; align-items:center; justify-content:center;
    text-decoration:none; color:inherit;}
  .hm-app:active{opacity:.55;}
  .hm-app .he{font-size:15px;}
  .hm-app .hi{width:18px; height:18px; border-radius:5px; display:block;}
  .hm-cell{aspect-ratio:1/1; max-height:24px; border-radius:5px; background:var(--surface);
    transition:transform .12s ease;}
  .hm-cell.l1{background:#D8D2C7;} .hm-cell.l2{background:#B5AC9E;}
  .hm-cell.l3{background:#857C6F;} .hm-cell.l4{background:#4A463F;}
  .hm-cell.today{box-shadow:0 0 0 1.5px var(--ghost) inset;}
  .hm-cell.today.l1,.hm-cell.today.l2,.hm-cell.today.l3,.hm-cell.today.l4{box-shadow:0 0 0 1.5px var(--ink) inset;}
  .feed-title{font-size:12px; color:var(--sub); font-weight:500; letter-spacing:.04em; margin:18px 4px 4px;}
  a.fitem{display:flex; align-items:center; gap:11px; padding:11px 6px;
    text-decoration:none; color:var(--ink); border-top:1px solid var(--line);}
  a.fitem:first-of-type{border-top:none;}
  a.fitem:active{background:var(--surface);}
  .fitem .fe{font-size:20px; width:30px; text-align:center; flex:0 0 auto;}
  .fitem .ft{min-width:0; flex:1;}
  .fitem .fs{display:block; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .fitem .fm{display:block; font-size:11px; color:var(--sub); margin-top:1px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .fitem .fa{margin-left:auto; color:var(--ghost); font-size:18px; flex:0 0 auto;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="kicker">TSUMIKI — こうだいの制作物</p>
    <h1>つみき</h1>
    <p class="tagline">小さなアプリを、ひとつずつ積み上げる。</p>
    <p class="count" id="count"></p>
    <div class="hdr-actions">
      <a class="checkroom" href="check.html">チェックルーム<span style="opacity:.5">（公開前の確認）</span></a>
      <button type="button" class="checkroom" id="editBtn">編集</button>
    </div>
    <p class="editing-hint" id="editHint" hidden>カードをタップして「よく使う」に追加／解除</p>
  </header>

  <section id="dash" class="dash" hidden></section>

  <section id="favs" class="section" hidden></section>

  <main id="app"></main>

  <footer>
    tsumiki-apps.github.io
  </footer>
</div>

<script src="career.js"></script>
<script>
  const categories = [
    {key:"work", emoji:"💼", label:"Work", apps:[
      {emoji:"🔎", title:"横断検索", desc:"STARS・GROW・5Whys・Recognitionを一括検索", href:"search.html"},
      {emoji:"📊", title:"NPSカウンター", desc:"NPS目標から必要Promoter数を逆算", href:"nps.html"},
      {emoji:"📈", title:"Weekly Recap", desc:"週次リキャップ画像を作成", href:"recap.html"},
      {emoji:"🌟", title:"Recognition", desc:"承認・称賛を記録", href:"recognition.html"},
      {emoji:"🌳", title:"GROW ノート", desc:"1on1の成長に伴走するノート", href:"grownote.html"},
      {emoji:"🔍", title:"5Whys ノート", desc:"連鎖型5Whysで本音を深掘り", href:"team5whys.html"},
      {emoji:"🪞", title:"STARS 振り返り", desc:"面接で使える経験を蓄積", href:"reflection.html"},
      {emoji:"🔐", title:"Password mgr", desc:"パスワードをジャンルごとに保管", href:"vault.html"},
      {emoji:"🎁", title:"おすそわけ", desc:"作ったアプリを誰に届けたか記録", href:"osusowake.html"},
      {emoji:"🗓️", title:"スケジュール→カレンダー", desc:"Excelの予定を.icsに変換して取り込む", href:"schedule.html"},
      {emoji:"🗂️", title:"キャリアログ", desc:"Work活動の足跡を自動で残しレジュメ素材に", href:"career.html"},
      {emoji:"🎤", title:"Interviewノート", desc:"昇進面接の質問・回答・FBを記録", href:"interview.html"},
      {emoji:"📝", title:"メモ帳", desc:"白紙にサッと。カテゴリーとタグで整理。Interviewの記録もここに", href:"memo.html"},
    ]},
    {key:"private", emoji:"🌿", label:"Private", apps:[
      {emoji:"🧭", title:"らしんばん", desc:"人生の地図と毎日の積み上げ。理想→現在地→ゴールを習慣でつなぐ", href:"rashinban.html"},
      {emoji:"🏃", title:"カケル", desc:"ふたりで横浜マラソン完走へ。練習計画・記録・本番サポート", href:"kakeru.html"},
      {emoji:"🍋", title:"ゆずわり", desc:"ふたりの立て替えをプロジェクト別に精算。クラウドで同時編集", href:"yuzuwari.html"},
      {emoji:"⏰", title:"つぎいつ？", desc:"美容室や脱毛など、次に行く日を計算して通知", href:"tsugi.html"},
      {emoji:"🍳", title:"ゆずごはん日記", desc:"ふたりで共有する献立ノート", href:"cooking.html"},
      {emoji:"🌱", title:"ツナグ", desc:"夢と今日をつなぐ努力の記録", href:"tsunagu.html"},
      {emoji:"🌴", title:"たびのき", desc:"ふたりで作る旅のしおり。時刻つきの計画を共有", href:"tabinoki.html"},
      {emoji:"✅", title:"やることばこ", desc:"やること・アプリ構想・買い物を1つの箱で整理", href:"yarukoto.html"},
      {emoji:"🧹", title:"こまめ", desc:"家のおそうじを定期管理。やったら次回を自動計算。片付けたい場所もふたりで共有", href:"komame.html"},
      {emoji:"🛒", title:"おつかいカート", desc:"頼まれた物をAmazonで安い順に探して管理", href:"kaimono.html"},
      {emoji:"🎭", title:"おぼえりふ", desc:"台本のセリフを縦書きで稽古する。練習する役だけ空欄に", href:"serifu.html"},
      {emoji:"🎲", title:"じんせいすごろく", desc:"ふたりで遊ぶ3D人生ゲーム風すごろく", href:"jinsei.html"},
      {emoji:"🃏", title:"トランプ3D", desc:"3Dの本格カード。10種のゲームをふたりでリアルタイム対戦", href:"trump.html"},
      {emoji:"🌾", title:"みのり", desc:"名言・映画・絵画…人生で出会った学びをジャンル別に記録", href:"minori.html"},
    ]},
    {key:"asset", emoji:"💰", label:"Asset", apps:[
      {emoji:"🪙", title:"ちりつも", desc:"使ったお金をサッと記録。今週いくら使ったかすぐ分かる", href:"chiritsumo.html"},
      {emoji:"💳", title:"クレジット明細マネージャー", desc:"立て替え＆クレカ支出を分けて管理", href:"credit.html"},
      {emoji:"💴", title:"お金の残高 計算ツール", desc:"残高をサッと計算", href:"money.html"},
      {emoji:"📉", title:"資産予測グラフ", desc:"資産の推移を予測して可視化", href:"forecast.html"},
      {emoji:"🔁", title:"まいつき", desc:"毎月の固定費を円グラフで見える化", href:"maitsuki.html"},
      {emoji:"📋", title:"コピペ箱", desc:"クレカ・口座・EPP注文などよくコピーする情報を保管", href:"copybox.html"},
    ]},
  ];
  const app = document.getElementById("app");

  /* ===== お気に入り（よく使う）：端末ローカル保存・手動登録 ===== */
  const FAV_KEY = "tsumikiFavs";
  function readFavs(){ try{ return JSON.parse(localStorage.getItem(FAV_KEY) || "[]"); }catch(e){ return []; } }
  function writeFavs(a){ try{ localStorage.setItem(FAV_KEY, JSON.stringify(a)); }catch(e){} }
  let favs = readFavs();

  const stemOf = href => href.replace(/\.html$/i,"");
  const ALL = {};   // stem -> app
  categories.forEach(c => c.apps.forEach(a => { ALL[stemOf(a.href)] = a; }));
  /* 消えたアプリのstemは掃除 */
  favs = favs.filter(s => ALL[s]);

  const STAR = '<span class="favmark"><svg viewBox="0 0 24 24" aria-hidden="true">'+
    '<path class="s" d="M12 3.4l2.6 5.6 6.1.6-4.6 4 1.4 6L12 16.8 6.5 19.6l1.4-6-4.6-4 6.1-.6z"/></svg></span>';

  function cardHTML(a){
    const stem = stemOf(a.href);
    const fav = favs.includes(stem) ? " is-fav" : "";
    return '<a class="card'+fav+'" href="'+a.href+'" data-stem="'+stem+'">'+
      '<img class="ico" src="icons/icon-'+stem+'.png" alt="" loading="lazy">'+
      '<span class="txt"><span class="title">'+a.title+'</span>'+
      '<span class="desc">'+a.desc+'</span></span>'+ STAR +
    '</a>';
  }

  function buildCategories(){
    app.innerHTML = "";
    categories.forEach(cat=>{
      const sec = document.createElement("section");
      sec.className = "section";
      sec.innerHTML =
        '<h2><span class="cat-emoji">'+cat.emoji+'</span>'+cat.label+
        '<span class="badge">'+cat.apps.length+'</span></h2>'+
        '<div class="grid">'+cat.apps.map(cardHTML).join("")+'</div>';
      app.appendChild(sec);
    });
  }

  function renderFavs(){
    const sec = document.getElementById("favs");
    const editing = document.body.classList.contains("editing");
    const items = favs.map(s => ALL[s]).filter(Boolean);
    if(!items.length && !editing){ sec.hidden = true; sec.innerHTML = ""; return; }
    sec.hidden = false;
    const body = items.length
      ? '<div class="grid">'+items.map(cardHTML).join("")+'</div>'
      : '<p class="fav-empty">まだありません。下のカードをタップして追加してください。</p>';
    sec.innerHTML =
      '<h2><span class="cat-emoji">★</span>よく使う'+
      '<span class="badge">'+items.length+'</span></h2>'+ body;
  }

  function toggleFav(stem){
    const i = favs.indexOf(stem);
    if(i >= 0) favs.splice(i,1); else favs.push(stem);
    writeFavs(favs);
    buildCategories();
    renderFavs();
  }

  buildCategories();
  renderFavs();
  document.getElementById("count").textContent = Object.keys(ALL).length + " 個のアプリ";

  /* 編集モード：カードタップでお気に入り付け外し */
  const editBtn = document.getElementById("editBtn");
  const editHint = document.getElementById("editHint");
  editBtn.addEventListener("click", ()=>{
    const editing = document.body.classList.toggle("editing");
    editBtn.textContent = editing ? "完了" : "編集";
    editHint.hidden = !editing;
    renderFavs();
  });
  document.addEventListener("click", e=>{
    if(!document.body.classList.contains("editing")) return;
    const card = e.target.closest(".card");
    if(!card || !card.dataset.stem) return;
    e.preventDefault();
    toggleFav(card.dataset.stem);
  });

  /* ===== 今週のWork ダッシュボード ===== */
  const APP_HREF = {
    nps:"nps.html", recap:"recap.html", recognition:"recognition.html",
    grownote:"grownote.html", team5whys:"team5whys.html", reflection:"reflection.html",
    vault:"vault.html", osusowake:"osusowake.html", schedule:"schedule.html",
  };
  function relTime(ts){
    const diff = Date.now() - ts, m=60000, h=3600000, d=86400000;
    if(diff < m) return "たった今";
    if(diff < h) return Math.floor(diff/m) + "分前";
    if(diff < d) return Math.floor(diff/h) + "時間前";
    if(diff < 7*d) return Math.floor(diff/d) + "日前";
    const dt = new Date(ts); return (dt.getMonth()+1) + "/" + dt.getDate();
  }
  function startOfWeek(){
    const n = new Date(); n.setHours(0,0,0,0);
    n.setDate(n.getDate() - ((n.getDay()+6)%7));   // 月曜始まり
    return n.getTime();
  }
  function esc(s){ return String(s||"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

  (async function(){
    if(!window.Career || !Career.getAll) return;
    let res; try{ res = await Career.getAll(); }catch(e){ return; }
    const items = (res && res.items) || [];
    if(!items.length) return;

    const sow = startOfWeek();
    const week = items.filter(e => (e.ts||0) >= sow);

    const todayIdx = (new Date().getDay()+6)%7;

    /* Workアプリの絵文字・短ラベル（index.htメニューから流用） */
    const workCat = categories.find(c => c.key === "work") || {apps:[]};
    const APP_META = {};
    workCat.apps.forEach(a=>{
      APP_META[a.href.replace(/\.html$/i,"")] = {emoji:a.emoji, label:a.title};
    });

    /* アプリ × 曜日 で全活動（visit＋実績）を集計 */
    const perApp = {};   // app -> {days:[7], total}
    week.forEach(e=>{
      const app = e.app;
      if(!APP_META[app]) return;                 // Workアプリのみ
      const d = (new Date(e.ts).getDay()+6)%7;
      if(!perApp[app]) perApp[app] = {days:[0,0,0,0,0,0,0], total:0};
      perApp[app].days[d]++; perApp[app].total++;
    });
    /* 活動の多い順に上位5アプリだけ表示 */
    const rows = Object.keys(perApp)
      .map(app => ({app, ...perApp[app]}))
      .sort((a,b)=> b.total - a.total)
      .slice(0, 5);

    const lvl = c => c===0 ? "" : (c>=4 ? " l4" : " l"+c);   // 1,2,3,4+
    const bodyRows = rows.map(r=>{
      const m = APP_META[r.app];
      const cells = r.days.map((c,i)=>
        '<div class="hm-cell'+lvl(c)+(i===todayIdx?" today":"")+'"></div>').join("");
      return '<div class="hm-row">'+
        '<a class="hm-app" href="'+esc(r.app)+'.html" title="'+esc(m.label)+'">'+
          '<img class="hi" src="icons/icon-'+esc(r.app)+'.png" alt=""></a>'+
        cells+'</div>';
    }).join("");
    if(!rows.length) return;   // 今週の活動がなければカード自体を出さない

    const dash = document.getElementById("dash");
    dash.innerHTML =
      '<span class="ds'+(res.connected?"":" off")+'" title="'+
        (res.connected ? "クラウド同期中" : "この端末の記録")+'"></span>'+
      '<div class="hm">'+bodyRows+'</div>';
    dash.hidden = false;
  })();
</script>
</body>
</html>
