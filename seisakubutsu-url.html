      try{
        var ta=document.createElement('textarea'); ta.value=t;
        ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta);
        ta.select(); document.execCommand('copy'); document.body.removeChild(ta); done();
      }catch(e){ toast('コピーできませんでした'); }
    }
  }

  /* 相対の u に base をつけて絶対URLにする（データ側を短く保つため） */
  GROUPS.forEach(function(g){
    g.items.forEach(function(it){
      it.url = /^https?:/.test(it.u) ? it.u : (g.base + it.u);
    });
  });

  var total = GROUPS.reduce(function(n,g){ return n + g.items.length; }, 0);

  document.getElementById('list').innerHTML = GROUPS.map(function(g, gi){
    return '<section class="group" data-g="'+gi+'">'
      + '<div class="ghead"><h2>'+esc(g.label)+'</h2>'
      +   '<span class="num">'+g.items.length+'</span>'
      +   '<button class="gcopy" type="button" data-gcopy="'+gi+'">まとめてコピー</button></div>'
      + (g.note ? '<p class="gnote">'+esc(g.note)+'</p>' : '')
      + '<div class="rows">' + g.items.map(function(it){
          return '<div class="row" data-find="'+esc((it.t+' '+(it.d||'')+' '+it.url).toLowerCase())+'">'
            + '<a class="rlink" href="'+esc(it.url)+'" target="_blank" rel="noopener">'
            +   '<span class="rt">'+esc(it.t)+'</span>'
            +   (it.d ? '<span class="rd">'+esc(it.d)+'</span>' : '')
            +   '<span class="ru">'+esc(it.url)+'</span>'
            + '</a>'
            + '<button class="copybtn" type="button" data-copy="'+esc(it.url)+'" aria-label="URLをコピー" title="URLをコピー">'+COPY_SVG+'</button>'
            + '</div>';
        }).join('')
      + '</div></section>';
  }).join('');

  document.getElementById('foot').textContent = '全 ' + total + ' 件';

  /* まとまり／全部のコピーは「名前＋URL」の2行セットで貼れる形にする */
  function groupText(g){
    return g.items.map(function(it){ return it.t + '\n' + it.url; }).join('\n\n');
  }

  document.addEventListener('click', function(e){
    var cb = e.target.closest('[data-copy]');
    if(cb){ copyText(cb.getAttribute('data-copy'), 'URLをコピーしました'); return; }
    var gc = e.target.closest('[data-gcopy]');
    if(gc){
      var g = GROUPS[+gc.getAttribute('data-gcopy')];
      copyText(groupText(g), g.label + ' ' + g.items.length + '件をコピーしました');
    }
  });

  document.getElementById('copyAll').addEventListener('click', function(){
    var txt = GROUPS.map(function(g){
      return '■ ' + g.label + '\n' + groupText(g);
    }).join('\n\n');
    copyText(txt, '全 ' + total + ' 件をコピーしました');
  });

  /* さがす（名前・説明・URLのどれかに当たれば残す） */
  var q = document.getElementById('q');
  var box = document.getElementById('searchBox');
  var emptyEl = document.getElementById('empty');
  function filter(){
    var v = q.value.trim().toLowerCase();
    box.classList.toggle('filled', !!v);
    var hit = 0;
    document.querySelectorAll('.group').forEach(function(sec){
      var n = 0;
      sec.querySelectorAll('.row').forEach(function(r){
        var on = !v || r.getAttribute('data-find').indexOf(v) >= 0;
        r.classList.toggle('hide', !on);
        if(on) n++;
      });
      sec.classList.toggle('hide', n === 0);
      hit += n;
    });
    emptyEl.classList.toggle('show', hit === 0);
    document.getElementById('foot').textContent = v ? (hit + ' 件 / 全 ' + total + ' 件') : ('全 ' + total + ' 件');
  }
  q.addEventListener('input', filter);
  document.getElementById('qClear').addEventListener('click', function(){ q.value=''; filter(); q.focus(); });

  /* ===== メニュー（引き出し）===== */
  (function(){
    var btn=document.getElementById('menuBtn');
    var dr=document.getElementById('drawer');
    var mask=document.getElementById('menuMask');
    function setOpen(on){
      dr.classList.toggle('show', on);
      mask.classList.toggle('show', on);
      dr.setAttribute('aria-hidden', on?'false':'true');
      btn.setAttribute('aria-expanded', on?'true':'false');
      document.body.style.overflow = on ? 'hidden' : '';
      if(on){ var f=dr.querySelector('.dr-item'); if(f) f.focus({preventScroll:true}); }
    }
    btn.addEventListener('click', function(){ setOpen(!dr.classList.contains('show')); });
    mask.addEventListener('click', function(){ setOpen(false); });
    dr.addEventListener('click', function(e){
      var it=e.target.closest('.dr-item'); if(!it) return;
      if(it.classList.contains('current')) e.preventDefault();   /* 現在地は閉じるだけ */
      setOpen(false);
    });
    document.addEventListener('keydown', function(e){
      if(e.key==='Escape' && dr.classList.contains('show')) setOpen(false);
    });
  })();
})();
</script>
<!-- tsumiki-back-button -->
<style>
  #tsumikiEdge{position:fixed; top:0; bottom:0; left:0; width:22px; z-index:999;}
  #tsumikiPeek{
    position:fixed; top:50%; left:0; z-index:1001; margin-top:-23px;
    width:46px; height:46px; display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.92);
    -webkit-backdrop-filter:saturate(180%) blur(14px); backdrop-filter:saturate(180%) blur(14px);
    border:1px solid rgba(0,0,0,.06); border-radius:50%;
    box-shadow:0 6px 20px rgba(0,0,0,.18);
    color:#0071e3; font-size:24px; font-weight:600; line-height:1;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Helvetica Neue",Arial,sans-serif;
    transform:translateX(-70px) scale(.8); opacity:0; pointer-events:none;
  }
</style>
<div id="tsumikiEdge"></div>
<div id="tsumikiPeek">‹</div>
<script>
  (function(){
    var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
      || window.navigator.standalone === true;
    var fromTsumiki = false;
    try{
      if(document.referrer){
        var r = new URL(document.referrer);
        fromTsumiki = (r.origin === location.origin);
      }
    }catch(e){}
    if(!(standalone && fromTsumiki)) return;

    var peek = document.getElementById('tsumikiPeek');
    var edge = document.getElementById('tsumikiEdge');

    function goBack(){ location.href = 'index.html'; }

    /* --- 左端エッジスワイプで戻る（iOS純正の戻る操作。見えるボタンは置かない） --- */
    var sx=0, sy=0, prog=0, dragging=false, W=window.innerWidth;
    var TRIGGER = Math.min(120, W*0.32);
    window.addEventListener('resize', function(){ W=window.innerWidth; TRIGGER=Math.min(120, W*0.32); });

    function reset(){
      dragging = false; prog = 0;
      peek.style.transition = 'transform .25s ease, opacity .25s ease';
      peek.style.transform = 'translateX(-70px) scale(.8)';
      peek.style.opacity = 0;
    }
    function start(e){
      var t = e.touches ? e.touches[0] : e;
      if(t.clientX > 26) return;
      sx = t.clientX; sy = t.clientY; prog = 0; dragging = true;
      peek.style.transition = 'none';
    }
    function move(e){
      if(!dragging) return;
      var t = e.touches ? e.touches[0] : e;
      var dx = t.clientX - sx, dy = t.clientY - sy;
      if(Math.abs(dy) > Math.abs(dx) + 12){ reset(); return; }
      if(dx < 0) dx = 0;
      prog = Math.min(dx / TRIGGER, 1);
      peek.style.transform = 'translateX(' + (-70 + prog*82) + 'px) scale(' + (0.8 + prog*0.2) + ')';
      peek.style.opacity = prog;
      if(dx > 6 && e.cancelable) e.preventDefault();
    }
    function end(){
      if(!dragging) return;
      dragging = false;
      if(prog >= 0.999){
        peek.style.transition = 'transform .25s ease, opacity .25s ease';
        peek.style.transform = 'translateX(20px) scale(1.05)';
        peek.style.opacity = 1;
        goBack();
      }else{
        reset();
      }
    }
    edge.addEventListener('touchstart', start, {passive:true});
    window.addEventListener('touchmove', move, {passive:false});
    window.addEventListener('touchend', end, {passive:true});
    window.addEventListener('touchcancel', end, {passive:true});
  })();
</script>
<!-- /tsumiki-back-button -->
</body>
</html>
