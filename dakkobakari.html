<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="apple-touch-icon" href="icons/icon-dakkobakari.png">
<meta name="apple-mobile-web-app-title" content="だっこばかり">
<title>だっこばかり — 3人の体重記録</title>
<style>
  :root{
    --bg:#f6f4f0; --card:#ffffff; --ink:#1d1d1f; --sub:#6e6e73;
    --line:#e7e2da; --accent:#8a6a4a; --accent-soft:#f2ebe2;
    --dog:#c0793d; --dog-soft:#fbf0e5;
    --human:#4a7fb5; --human-soft:#eaf1f8;
    --nori:#5c8a6a; --nori-soft:#ecf3ee;
    --lo:#3f8f6f; --hi:#c2584f;
    --radius:20px;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{overscroll-behavior-y:none;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Maru Gothic ProN","Hiragino Sans","Helvetica Neue",Arial,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.6;
    padding:env(safe-area-inset-top) 0 calc(40px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:600px; margin:0 auto; padding:0 16px;}

  header{padding:20px 4px 4px; display:flex; align-items:baseline; gap:9px;}
  header h1{font-size:19px; font-weight:700; letter-spacing:.01em;}
  header .sync{margin-left:auto; display:flex; align-items:center; gap:5px;
    font-size:11px; color:var(--sub); white-space:nowrap;}
  header .sync .dot{width:8px; height:8px; border-radius:50%; background:#34c759; flex:0 0 auto;}
  header .sync .dot.off{background:#c7c7cc;}

  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; margin-top:12px;}
  .sec-head{display:flex; align-items:baseline; gap:8px; margin:24px 2px 6px;}
  .sec-head h2{font-size:14.5px; font-weight:700;}
  .sec-head .sh-sub{margin-left:auto; font-size:11.5px; color:var(--sub);}
  .muted{color:var(--sub); font-size:12.5px;}

  /* ===== 入力 ===== */
  .steps{display:flex; flex-direction:column; gap:12px;}
  .step{display:flex; align-items:center; gap:10px;}
  .step .no{flex:0 0 auto; width:22px; height:22px; border-radius:50%;
    background:var(--accent-soft); color:var(--accent); font-size:11.5px; font-weight:700;
    display:flex; align-items:center; justify-content:center; margin-top:2px;}
  .step.opt .no{background:#f0efec; color:#a09a92;}
  .step .body{flex:1; min-width:0;}
  .step .lb{font-size:13px; font-weight:600; line-height:1.45;}
  .step .lb em{font-style:normal; color:var(--sub); font-weight:400; font-size:11.5px; margin-left:5px;}
  .inrow{display:flex; align-items:center; gap:6px; margin-top:6px;}
  .divider{border-top:1px dashed var(--line); margin:2px 0 0;}
  input[type=number],input[type=date],input[type=text]{
    font-family:inherit; font-size:17px; color:var(--ink); background:var(--bg);
    border:1px solid var(--line); border-radius:12px; padding:10px 12px;
    font-variant-numeric:tabular-nums; -webkit-appearance:none; appearance:none;}
  input[type=number]{width:118px; text-align:right; font-weight:700; letter-spacing:-.01em;}
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none; margin:0;}
  input[type=date]{width:100%; font-size:16px; font-weight:600;}
  input[type=text]{width:100%; font-size:16px;}
  input:focus{outline:none; border-color:var(--accent);}
  .unit{font-size:13px; color:var(--sub);}

  .datebox{display:flex; align-items:center; gap:8px;}
  .datebox .dlabel{font-size:12.5px; color:var(--sub); flex:0 0 auto;}
  .datebox .today{flex:0 0 auto; border:1px solid var(--line); background:var(--card);
    color:var(--sub); font-family:inherit; font-size:12px; font-weight:600;
    border-radius:10px; padding:8px 11px; cursor:pointer;}

  /* ===== 計算結果 ===== */
  .result{margin-top:14px; border-top:1px dashed var(--line); padding-top:14px;
    display:flex; gap:9px;}
  .rbox{flex:1; min-width:0; border-radius:15px; padding:11px 10px; text-align:center;}
  .rbox.dog{background:var(--dog-soft);}
  .rbox.human{background:var(--human-soft);}
  .rbox.nori{background:var(--nori-soft);}
  .rbox .rn{font-size:11.5px; font-weight:600; color:var(--sub);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .rbox .rv{font-size:27px; font-weight:700; letter-spacing:-.03em; line-height:1.25;
    font-variant-numeric:tabular-nums; white-space:nowrap;}
  .rbox .rv small{font-size:13px; font-weight:600; margin-left:2px; letter-spacing:0;}
  .rbox.dog .rv{color:var(--dog);} .rbox.human .rv{color:var(--human);} .rbox.nori .rv{color:var(--nori);}
  .rbox .rd{font-size:11px; color:var(--sub); font-variant-numeric:tabular-nums;}
  .rbox .rd .up{color:var(--hi);} .rbox .rd .dn{color:var(--lo);}
  .result.three .rbox{padding:10px 6px;}
  .result.three .rn{font-size:10.5px;}
  .result.three .rv{font-size:21px;}
  .result.three .rv small{font-size:11px;}
  .result.three .rd{font-size:10px;}
  .result .hint{flex:1; text-align:center; color:#b6b0a7; font-size:12.5px; padding:14px 4px;}

  .warn{margin-top:11px; background:#fdf3e2; color:#95590f; border-radius:12px;
    padding:9px 12px; font-size:12.5px; line-height:1.55;}

  .bigbtn{width:100%; margin-top:12px; padding:15px; border-radius:16px; border:none;
    font-size:15.5px; font-weight:700; font-family:inherit; cursor:pointer;
    background:var(--accent); color:#fff; transition:transform .1s ease;}
  .bigbtn:active{transform:scale(.98);}
  .bigbtn:disabled{opacity:.35;}
  .btnrow{display:flex; gap:8px;}
  .btn{border:1px solid var(--line); background:var(--card); color:var(--ink);
    border-radius:12px; font-size:13px; font-weight:600; font-family:inherit;
    padding:10px 14px; cursor:pointer; transition:transform .1s ease;}
  .btn:active{transform:scale(.97);}
  .btn.danger{color:var(--hi); border-color:#f0dcd9; background:#fdf1f0;}
  .editing-note{margin-top:10px; background:var(--accent-soft); color:var(--accent);
    border-radius:12px; padding:9px 12px; font-size:12.5px; display:flex; align-items:center; gap:8px;}
  .editing-note button{margin-left:auto; border:none; background:none; color:var(--accent);
    font-family:inherit; font-size:12px; font-weight:700; cursor:pointer; text-decoration:underline;
    flex:0 0 auto;}

  /* ===== 切替タブ ===== */
  .switch{display:flex; background:var(--accent-soft); border-radius:13px; padding:3px; gap:3px;}
  .switch button{flex:1; min-width:0; border:none; background:none; font-family:inherit; font-size:13px;
    font-weight:600; color:var(--sub); padding:8px 2px; border-radius:10px; cursor:pointer;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .switch button.on{background:var(--card); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.06);}
  .range{display:flex; gap:6px; margin-top:10px;}
  .range button{flex:1; border:1px solid var(--line); background:var(--card); color:var(--sub);
    font-family:inherit; font-size:12px; font-weight:600; padding:7px 2px; border-radius:10px; cursor:pointer;}
  .range button.on{border-color:var(--accent); color:var(--accent); background:var(--accent-soft);}

  /* ===== 最軽・最重 ===== */
  .peaks{display:flex; gap:9px; margin-top:12px;}
  .peak{flex:1; min-width:0; border:1px solid var(--line); border-radius:14px; padding:10px 11px;}
  .peak.lo{border-color:#cfe6db; background:#f1f8f5;}
  .peak.hi{border-color:#f0dcd9; background:#fdf3f2;}
  .peak .pl{font-size:11px; font-weight:700; letter-spacing:.02em;}
  .peak.lo .pl{color:var(--lo);} .peak.hi .pl{color:var(--hi);}
  .peak .pv{font-size:20px; font-weight:700; letter-spacing:-.02em; font-variant-numeric:tabular-nums;}
  .peak .pv small{font-size:12px; font-weight:600; margin-left:1px;}
  .peak .pd{font-size:11px; color:var(--sub); font-variant-numeric:tabular-nums;}

  /* ===== グラフ ===== */
  .chart{margin-top:14px;}
  .chart svg{display:block; width:100%; height:auto; overflow:visible;}
  .empty{padding:26px 8px; text-align:center; color:var(--sub); font-size:13px; line-height:1.8;}

  /* ===== 履歴 ===== */
  .item{background:var(--card); border:1px solid var(--line); border-radius:15px;
    padding:11px 13px; margin-top:8px;}
  .item .i1{display:flex; align-items:center; gap:8px;}
  .item .idate{font-size:12.5px; font-weight:700; color:var(--sub); font-variant-numeric:tabular-nums;
    flex:0 0 auto;}
  .item .tags{display:flex; gap:4px; margin-left:auto; flex-wrap:wrap; justify-content:flex-end;}
  .tag{font-size:10px; font-weight:700; border-radius:999px; padding:2px 7px; white-space:nowrap;}
  .tag.lo{background:#e8f4ee; color:var(--lo);} .tag.hi{background:#fbe9e7; color:var(--hi);}
  .item .i2{display:flex; flex-wrap:wrap; gap:6px 10px; margin-top:7px;}
  .vcell{flex:1 1 calc(50% - 10px); min-width:0; display:flex; align-items:baseline; gap:5px;}
  .vcell .vn{font-size:11px; color:var(--sub); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .vcell .vv{margin-left:auto; font-size:15px; font-weight:700; font-variant-numeric:tabular-nums;}
  .vcell.dog .vv{color:var(--dog);} .vcell.human .vv{color:var(--human);} .vcell.nori .vv{color:var(--nori);}
  .item .i3{display:flex; gap:8px; margin-top:9px; align-items:center;}
  .item .i3 .memo{font-size:11px; color:var(--sub); font-variant-numeric:tabular-nums;
    flex:1; min-width:0; line-height:1.45;}
  .item .i3 .acts{margin-left:auto; display:flex; gap:6px; flex:0 0 auto;}
  .item .i3 button{border:1px solid var(--line); background:var(--card); color:var(--sub);
    font-family:inherit; font-size:12px; font-weight:600; border-radius:10px;
    padding:7px 13px; cursor:pointer; white-space:nowrap;}
  .item .i3 button.del{color:var(--hi); border-color:#f0dcd9;}
  .more{width:100%; margin-top:10px; border:1px solid var(--line); background:var(--card);
    color:var(--sub); font-family:inherit; font-size:12.5px; font-weight:600;
    border-radius:12px; padding:10px; cursor:pointer;}

  /* ===== 設定 ===== */
  details.settings{margin-top:26px;}
  details.settings summary{list-style:none; cursor:pointer; font-size:12.5px; color:var(--sub);
    padding:10px 4px; display:flex; align-items:center; gap:6px;}
  details.settings summary::-webkit-details-marker{display:none;}
  .fld{margin-top:11px;}
  .fld label{display:block; font-size:11.5px; color:var(--sub); margin-bottom:5px;}
  .foot{text-align:center; color:var(--sub); font-size:11px; margin-top:26px; line-height:1.8;}

  .toast{position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom));
    transform:translateX(-50%) translateY(14px); z-index:80;
    background:rgba(29,29,31,.93); color:#fff; font-size:13px; font-weight:600;
    padding:11px 20px; border-radius:999px; opacity:0; pointer-events:none;
    transition:opacity .22s ease, transform .22s ease; white-space:nowrap;}
  .toast.on{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>だっこばかり</h1>
    <div class="sync" id="syncBadge"><span class="dot off"></span><span id="syncTxt">この端末だけ</span></div>
  </header>

  <!-- ===== 入力 ===== -->
  <div class="card">
    <div class="datebox">
      <span class="dlabel">日付</span>
      <input type="date" id="fDate">
      <button class="today" id="btnToday">今日</button>
    </div>

    <div class="steps" style="margin-top:14px">
      <div class="step">
        <div class="no">1</div>
        <div class="body">
          <div class="lb"><span id="lbHuman">みーちゃん</span>だけで乗る<em>1人の体重</em></div>
          <div class="inrow">
            <input type="number" id="fHuman" inputmode="decimal" step="0.1" min="0" max="300" placeholder="0.0">
            <span class="unit">kg</span>
          </div>
        </div>
      </div>
      <div class="step">
        <div class="no">2</div>
        <div class="body">
          <div class="lb"><span id="lbDog">ロイくん</span>を抱っこして乗る<em>2人合わせて</em></div>
          <div class="inrow">
            <input type="number" id="fTotal" inputmode="decimal" step="0.1" min="0" max="300" placeholder="0.0">
            <span class="unit">kg</span>
          </div>
        </div>
      </div>
      <div class="divider"></div>
      <div class="step opt">
        <div class="no">3</div>
        <div class="body">
          <div class="lb"><span id="lbNori">のりちゃん</span>が乗る<em>測った日だけでOK</em></div>
          <div class="inrow">
            <input type="number" id="fNori" inputmode="decimal" step="0.1" min="0" max="300" placeholder="0.0">
            <span class="unit">kg</span>
          </div>
        </div>
      </div>
    </div>

    <div class="result" id="result"></div>

    <div id="warn" class="warn" style="display:none"></div>
    <div id="editNote" class="editing-note" style="display:none">
      <span id="editNoteText"></span><button id="btnCancelEdit">入力を消す</button>
    </div>
    <button class="bigbtn" id="btnSave" disabled>この日の記録を保存</button>
  </div>

  <!-- ===== グラフ ===== -->
  <div class="sec-head"><h2>移り変わり</h2><div class="sh-sub" id="graphCount"></div></div>
  <div class="card">
    <div class="switch" id="switchBar">
      <button data-v="dog" class="on">ロイくん</button>
      <button data-v="human">みーちゃん</button>
      <button data-v="nori">のりちゃん</button>
    </div>
    <div class="range" id="rangeBar">
      <button data-r="30">1ヶ月</button>
      <button data-r="90">3ヶ月</button>
      <button data-r="365">1年</button>
      <button data-r="0" class="on">全部</button>
    </div>
    <div class="peaks" id="peaks"></div>
    <div class="chart" id="chart"></div>
  </div>

  <!-- ===== 履歴 ===== -->
  <div class="sec-head"><h2>これまでの記録</h2><div class="sh-sub" id="logCount"></div></div>
  <div id="logs"></div>
  <button class="more" id="btnMore" style="display:none">もっと見る</button>

  <!-- ===== 設定 ===== -->
  <details class="settings">
    <summary>⚙️ 設定（呼び名・バックアップ）</summary>
    <div class="card">
      <div class="fld">
        <label>抱っこする人の呼び名（1と2に乗る人）</label>
        <input type="text" id="setHuman" maxlength="8" placeholder="みーちゃん">
      </div>
      <div class="fld">
        <label>犬の呼び名（抱っこされる子）</label>
        <input type="text" id="setDog" maxlength="8" placeholder="ロイくん">
      </div>
      <div class="fld">
        <label>もう1人の呼び名（3に乗る人）</label>
        <input type="text" id="setNori" maxlength="8" placeholder="のりちゃん">
      </div>
      <div class="btnrow" style="margin-top:14px">
        <button class="btn" id="btnExport">書き出し</button>
        <button class="btn" id="btnImport">読み込み</button>
        <button class="btn danger" id="btnClear">全部消す</button>
      </div>
      <input type="file" id="fileInput" accept="application/json" style="display:none">
      <div class="muted" style="margin-top:11px">
        記録は3人で共有しています。呼び名の変更・削除・「全部消す」も、3人全員の画面に反映されます。
        「書き出し」で手元にバックアップのファイルを残せます。
      </div>
    </div>
  </details>

  <div class="foot">だっこばかり<br>1人の体重と、抱っこして乗った体重から、2人分を出します。</div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  'use strict';
  var KEY = 'dakkobakari_v1';
  var DEF = {human:'みーちゃん', dog:'ロイくん', nori:'のりちゃん'};

  /* ===== 3人で共有（Supabase・ゆずわり等と同じ1行ブロブ） ===== */
  var SUPABASE_URL = 'https://okbjqtdirrathscctyvx.supabase.co';
  var SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9rYmpxdGRpcnJhdGhzY2N0eXZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzMjI4NTIsImV4cCI6MjA5NTg5ODg1Mn0.T-1AOK6vCD6uGdqrVGXjPui3L6WPSNrnygS-IHyfZ6Y';
  var TABLE = 'dakkobakari_state', ROW = 'family';
  var sb = (window.supabase && window.supabase.createClient)
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON) : null;
  var cloudReady = false, pushTimer = null;

  // ===== 小道具 =====
  function $(id){ return document.getElementById(id); }
  function pad(n){ return (n<10?'0':'')+n; }
  function todayStr(){ var d = new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function r1(n){ return Math.round(n*10)/10; }
  function fmt(n){ return r1(n).toFixed(1); }
  function mdOf(s){ var p = String(s).split('-'); return (+p[1])+'/'+(+p[2]); }
  function ymdOf(s){ var p = String(s).split('-'); return p[0].slice(2)+'.'+(+p[1])+'.'+(+p[2]); }
  function isDate(s){ return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s); }
  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  var toastTimer = null;
  function toast(msg){
    var t = $('toast'); t.textContent = msg; t.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove('on'); }, 1900);
  }
  function w(n){ var v = +n; return (isFinite(v) && v > 0 && v <= 300) ? r1(v) : null; }

  // ===== データ =====
  // 1件＝{date, human, total, ts, nori, tsNori}
  //   human/total … 抱っこする人の体重と、抱っこして乗った体重（ts＝その更新時刻）
  //   nori         … もう1人の体重（tsNori＝その更新時刻）
  //   ※ 2つの組は別々に突き合わせるので、別々の端末から同じ日に足しても消し合わない
  var VIEWS = ['dog','human','nori'];
  var state = load();

  function blank(){
    return {v:3, names:{human:DEF.human, dog:DEF.dog, nori:DEF.nori}, namesTs:0, logs:[], deleted:{}, updatedAt:0};
  }

  function normalize(d){
    var out = blank();
    if(!d || typeof d !== 'object') return out;
    var n = d.names || {};
    var h = n.human, g = n.dog, o = n.nori;
    if(!h || h === 'おかあさん') h = DEF.human;     // 旧バージョンの既定を今の呼び名に
    if(!g || g === 'わんこ') g = DEF.dog;
    if(!o) o = DEF.nori;
    out.names = {human:String(h).slice(0,8), dog:String(g).slice(0,8), nori:String(o).slice(0,8)};
    out.namesTs = +d.namesTs || 0;

    var seen = {};
    (Array.isArray(d.logs) ? d.logs : []).forEach(function(l){
      if(!l || !isDate(l.date)) return;
      var hv = w(l.human), tv = w(l.total), nv = w(l.nori);
      if(hv === null || tv === null || tv <= hv) tv = null;   // 組にならない合計は捨てる
      if(hv === null && nv === null) return;
      var rec = {date:l.date, human:hv, total:tv, ts:(hv===null?0:(+l.ts||1)),
                 nori:nv, tsNori:(nv===null?0:(+l.tsNori|| +l.ts ||1))};
      var cur = seen[l.date];
      if(!cur) seen[l.date] = rec;
      else seen[l.date] = mergeRec(cur, rec);
    });
    out.logs = Object.keys(seen).sort().map(function(k){ return seen[k]; });

    var del = d.deleted && typeof d.deleted === 'object' ? d.deleted : {};
    Object.keys(del).sort().forEach(function(k){ if(isDate(k) && +del[k] > 0) out.deleted[k] = +del[k]; });
    out.updatedAt = +d.updatedAt || 0;
    return out;
  }

  // 同じ日の2件を、組ごとに新しい方で合成する
  function mergeRec(a, b){
    var m = {date:a.date};
    if((b.ts||0) > (a.ts||0)){ m.human = b.human; m.total = b.total; m.ts = b.ts||0; }
    else { m.human = a.human; m.total = a.total; m.ts = a.ts||0; }
    if((b.tsNori||0) > (a.tsNori||0)){ m.nori = b.nori; m.tsNori = b.tsNori||0; }
    else { m.nori = a.nori; m.tsNori = a.tsNori||0; }
    return m;
  }
  function recEmpty(l){ return l.human === null && l.nori === null; }
  function recStamp(l){ return Math.max(l.ts||0, l.tsNori||0); }

  function merge(a, b){
    var out = blank();
    if((b.namesTs||0) > (a.namesTs||0)){ out.names = {human:b.names.human, dog:b.names.dog, nori:b.names.nori}; out.namesTs = b.namesTs||0; }
    else { out.names = {human:a.names.human, dog:a.names.dog, nori:a.names.nori}; out.namesTs = a.namesTs||0; }

    var del = {};
    [a.deleted||{}, b.deleted||{}].forEach(function(m){
      Object.keys(m).forEach(function(d){ if((+m[d]||0) > (del[d]||0)) del[d] = +m[d]; });
    });

    var byDate = {};
    (a.logs||[]).concat(b.logs||[]).forEach(function(l){
      byDate[l.date] = byDate[l.date] ? mergeRec(byDate[l.date], l) : l;
    });
    Object.keys(byDate).sort().forEach(function(d){
      var rec = byDate[d];
      if((del[d]||0) >= recStamp(rec)) return;   // 消したほうが新しければ復活させない
      if(recEmpty(rec)) return;
      out.logs.push(rec);
    });

    var cut = Date.now() - 180*86400000;         // 半年たった削除の印は片づける
    Object.keys(del).sort().forEach(function(d){ if(del[d] >= cut) out.deleted[d] = del[d]; });

    out.updatedAt = Math.max(a.updatedAt||0, b.updatedAt||0);
    return out;
  }

  function canon(st){
    return JSON.stringify([st.names.human, st.names.dog, st.names.nori, st.namesTs,
      st.logs.map(function(l){ return [l.date, l.human, l.total, l.ts, l.nori, l.tsNori]; }),
      Object.keys(st.deleted).sort().map(function(k){ return [k, st.deleted[k]]; })]);
  }

  function load(){
    try{ return normalize(JSON.parse(localStorage.getItem(KEY))); }
    catch(e){ return blank(); }
  }
  function saveLocal(){
    state.updatedAt = Date.now();
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
  }
  function commit(){ saveLocal(); schedulePush(); }

  // ===== クラウド =====
  function setSync(on, label){
    var dot = document.querySelector('#syncBadge .dot');
    if(dot) dot.classList.toggle('off', !on);
    $('syncTxt').textContent = label || (on ? '3人で同期' : 'この端末だけ');
  }
  function schedulePush(){
    if(!sb || !cloudReady) return;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(pushCloud, 500);
  }
  function pushCloud(){
    if(!sb || !cloudReady) return;
    sb.from(TABLE).upsert({id:ROW, state:state, updated_at:new Date().toISOString()})
      .then(function(res){ if(res && res.error){ console.warn(res.error); setSync(false); } })
      .catch(function(e){ console.warn(e); setSync(false); });
  }
  function applyRemote(raw){
    var remote = normalize(raw);
    var merged = merge(state, remote);
    var changed = canon(merged) !== canon(state);
    state = merged;
    saveLocal();
    if(changed){ applyNames(); render(); refreshResult(); }
    if(canon(merged) !== canon(remote)) schedulePush();   // 相手に足りない分を返す
  }
  function loadRemote(){
    if(!sb) return;
    sb.from(TABLE).select('state').eq('id', ROW).maybeSingle()
      .then(function(res){
        if(res.error){ console.warn(res.error); setSync(false); return; }
        cloudReady = true; setSync(true);
        if(res.data && res.data.state) applyRemote(res.data.state);
        else pushCloud();
        subscribeRealtime();
      })
      .catch(function(e){ console.warn(e); setSync(false); });
  }
  function subscribeRealtime(){
    if(!sb) return;
    sb.channel('dakkobakari-rt')
      .on('postgres_changes', {event:'*', schema:'public', table:TABLE, filter:'id=eq.'+ROW},
        function(payload){ if(payload.new && payload.new.state) applyRemote(payload.new.state); })
      .subscribe();
  }
  function refetch(){
    if(!sb) return;
    sb.from(TABLE).select('state').eq('id', ROW).maybeSingle()
      .then(function(res){ if(!res.error && res.data && res.data.state){ setSync(true); applyRemote(res.data.state); } })
      .catch(function(e){ console.warn(e); });
  }
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible' && cloudReady) refetch();
  });
  window.addEventListener('online', function(){ cloudReady ? refetch() : loadRemote(); });

  // ===== 値の取り出し =====
  function valOf(l, v){
    if(v === 'dog')   return (l.human !== null && l.total !== null) ? r1(l.total - l.human) : null;
    if(v === 'human') return l.human !== null ? r1(l.human) : null;
    return l.nori !== null ? r1(l.nori) : null;
  }
  function nameOf(v){ return v === 'dog' ? state.names.dog : v === 'human' ? state.names.human : state.names.nori; }
  function colorOf(v){ return v === 'dog' ? '#c0793d' : v === 'human' ? '#4a7fb5' : '#5c8a6a'; }
  function sortedAsc(){
    return state.logs.slice().sort(function(a,b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
  }
  function logsFor(v){ return sortedAsc().filter(function(l){ return valOf(l, v) !== null; }); }
  function findByDate(d){
    for(var i=0;i<state.logs.length;i++) if(state.logs[i].date === d) return state.logs[i];
    return null;
  }
  // 指定日より前の、いちばん近い記録
  function prevOf(date, v){
    if(!date) return null;
    var arr = logsFor(v).filter(function(l){ return l.date < date; });
    if(!arr.length) return null;
    var l = arr[arr.length-1];
    return {date:l.date, value:valOf(l, v)};
  }

  // ===== 入力まわり =====
  var editingDate = null;

  function num(el){ var v = parseFloat(el.value); return isFinite(v) ? v : null; }

  function refreshResult(){
    var h = num($('fHuman')), t = num($('fTotal')), n = num($('fNori'));
    var date = $('fDate').value, msg = '';

    if(h === null && t !== null) msg = '1（'+state.names.human+'だけの体重）も入れてください。引き算ができません。';
    else if(h !== null && t !== null && t <= h) msg = '抱っこして乗った方が軽くなっています。数字が入れ替わっていないか見てみてください。';

    var pairOk = (h !== null && t !== null && t > h);
    var humanOk = (h !== null);
    var noriOk = (n !== null && n > 0);

    var parts = [];
    if(pairOk) parts.push({v:'dog', val:r1(t - h)});
    if(humanOk) parts.push({v:'human', val:r1(h)});
    if(noriOk) parts.push({v:'nori', val:r1(n)});

    var box = $('result');
    box.classList.toggle('three', parts.length === 3);
    if(!parts.length){
      box.innerHTML = '<div class="hint">体重を入れると、ここに出ます</div>';
    }else{
      box.innerHTML = parts.map(function(p){
        var prev = prevOf(date, p.v), rd = '&nbsp;';
        if(prev){
          var d = r1(p.val - prev.value);
          rd = (d === 0) ? '前回（'+mdOf(prev.date)+'）と同じ'
             : '前回（'+mdOf(prev.date)+'）より <span class="'+(d>0?'up':'dn')+'">'+(d>0?'+':'')+fmt(d)+'kg</span>';
        }
        return '<div class="rbox '+p.v+'"><div class="rn">'+esc(nameOf(p.v))+'</div>'+
          '<div class="rv">'+fmt(p.val)+'<small>kg</small></div><div class="rd">'+rd+'</div></div>';
      }).join('');
    }

    if(!msg && !parts.length && date && findByDate(date)){
      msg = '数字がすべて空です。この日の記録ごと消すときは、下の一覧の「消す」を押してください。';
    }
    $('warn').style.display = msg ? 'block' : 'none';
    $('warn').textContent = msg;

    var canSave = !msg && (humanOk || noriOk) && !!date;
    $('btnSave').disabled = !canSave;
    $('btnSave').textContent = (date && findByDate(date)) ? 'この日の記録を上書きする' : 'この日の記録を保存';
  }

  // その日にすでに記録があれば入力欄に読み込む（あとから1人分だけ足せるように）
  function loadDateIntoForm(){
    var date = $('fDate').value;
    var l = date ? findByDate(date) : null;
    if(l){
      editingDate = date;
      $('fHuman').value = l.human === null ? '' : l.human;
      $('fTotal').value = l.total === null ? '' : l.total;
      $('fNori').value  = l.nori  === null ? '' : l.nori;
      $('editNoteText').textContent = ymdOf(date)+' の記録を読み込みました。足したり直したりできます';
      $('editNote').style.display = 'flex';
    }else{
      editingDate = null;
      $('fHuman').value = ''; $('fTotal').value = ''; $('fNori').value = '';
      $('editNote').style.display = 'none';
    }
    refreshResult();
  }

  $('btnToday').addEventListener('click', function(){ $('fDate').value = todayStr(); loadDateIntoForm(); });
  $('fDate').addEventListener('change', loadDateIntoForm);
  $('fHuman').addEventListener('input', refreshResult);
  $('fTotal').addEventListener('input', refreshResult);
  $('fNori').addEventListener('input', refreshResult);

  $('btnSave').addEventListener('click', function(){
    var date = $('fDate').value, h = num($('fHuman')), t = num($('fTotal')), n = num($('fNori'));
    if(!date) return;
    var hv = (h !== null) ? r1(h) : null;
    var tv = (hv !== null && t !== null && t > hv) ? r1(t) : null;
    var nv = (n !== null && n > 0) ? r1(n) : null;
    if(hv === null && nv === null) return;

    var ex = findByDate(date);
    if(ex && editingDate !== date){
      if(!confirm(mdOf(date)+' の記録はすでにあります。上書きしますか？')) return;
    }
    var now = Date.now();
    if(!ex){ ex = {date:date, human:null, total:null, ts:0, nori:null, tsNori:0}; state.logs.push(ex); }
    if(ex.human !== hv || ex.total !== tv){ ex.human = hv; ex.total = tv; ex.ts = hv === null ? 0 : now; }
    if(ex.nori !== nv){ ex.nori = nv; ex.tsNori = nv === null ? 0 : now; }
    if(recEmpty(ex)){
      state.logs = state.logs.filter(function(l){ return l.date !== date; });
      state.deleted[date] = now;
    }else{
      delete state.deleted[date];
    }
    commit();
    $('fDate').value = date;
    $('fHuman').blur(); $('fTotal').blur(); $('fNori').blur();
    loadDateIntoForm(); render();
    toast(mdOf(date)+' の記録を保存しました');
  });

  $('btnCancelEdit').addEventListener('click', function(){
    editingDate = null;
    $('fHuman').value = ''; $('fTotal').value = ''; $('fNori').value = '';
    $('editNote').style.display = 'none';
    refreshResult();
  });

  function startEdit(date){
    $('fDate').value = date;
    loadDateIntoForm();
    window.scrollTo({top:0, behavior:'smooth'});
  }

  function removeLog(date){
    if(!confirm(ymdOf(date)+' の記録を消しますか？（3人全員の画面から消えます）')) return;
    state.logs = state.logs.filter(function(l){ return l.date !== date; });
    state.deleted[date] = Date.now();
    commit();
    if($('fDate').value === date) loadDateIntoForm();
    render();
    toast('記録を消しました');
  }

  // ===== 表示の状態 =====
  var view = 'dog';
  var range = 0;
  var listLimit = 12;

  Array.prototype.forEach.call($('switchBar').querySelectorAll('button'), function(b){
    b.addEventListener('click', function(){
      view = b.dataset.v;
      Array.prototype.forEach.call($('switchBar').querySelectorAll('button'), function(x){
        x.classList.toggle('on', x === b);
      });
      render();
    });
  });
  Array.prototype.forEach.call($('rangeBar').querySelectorAll('button'), function(b){
    b.addEventListener('click', function(){
      range = +b.dataset.r;
      Array.prototype.forEach.call($('rangeBar').querySelectorAll('button'), function(x){
        x.classList.toggle('on', x === b);
      });
      render();
    });
  });

  function inRange(logs){
    if(!range) return logs;
    var from = new Date();
    from.setDate(from.getDate() - range);
    var s = from.getFullYear()+'-'+pad(from.getMonth()+1)+'-'+pad(from.getDate());
    return logs.filter(function(l){ return l.date >= s; });
  }

  // ===== グラフ =====
  function drawChart(logs){
    var box = $('chart');
    if(!logs.length){
      box.innerHTML = '<div class="empty">'+esc(nameOf(view))+'の記録がまだありません。<br>体重を入れて保存すると、ここにグラフが出ます。</div>';
      return;
    }
    if(logs.length === 1){
      var only = logs[0];
      box.innerHTML = '<div class="empty">記録が1回だけです。<br>'+
        ymdOf(only.date)+' … <b>'+fmt(valOf(only, view))+'kg</b><br>'+
        'もう1回測ると、線でつながります。</div>';
      return;
    }

    var W = 320, H = 174, PL = 32, PR = 14, PT = 22, PB = 32;
    var iw = W - PL - PR, ih = H - PT - PB;
    var vals = logs.map(function(l){ return valOf(l, view); });
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    var span = max - min;
    if(span < 0.4){ var c=(max+min)/2; min = c-0.2; max = c+0.2; span = 0.4; }
    var lo = min - span*0.22, hi = max + span*0.22;

    var t0 = new Date(logs[0].date).getTime();
    var t1 = new Date(logs[logs.length-1].date).getTime();
    var tspan = t1 - t0;
    function px(l){
      if(tspan <= 0) return PL + iw/2;
      return PL + (new Date(l.date).getTime() - t0) / tspan * iw;
    }
    function py(v){ return PT + (hi - v) / (hi - lo) * ih; }

    var pts = logs.map(function(l){ return {x:px(l), y:py(valOf(l, view)), v:valOf(l, view), date:l.date}; });
    var line = pts.map(function(p,i){ return (i?'L':'M')+p.x.toFixed(1)+','+p.y.toFixed(1); }).join(' ');
    var area = line+' L'+pts[pts.length-1].x.toFixed(1)+','+(PT+ih)+' L'+pts[0].x.toFixed(1)+','+(PT+ih)+' Z';
    var col = colorOf(view);

    var grid = '', labels = '';
    for(var g=0; g<3; g++){
      var gv = lo + (hi - lo) * (g/2);
      var gy = py(gv);
      grid += '<line x1="'+PL+'" y1="'+gy.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+gy.toFixed(1)+'" stroke="#eae5dd" stroke-width="1"/>';
      labels += '<text x="'+(PL-6)+'" y="'+(gy+3.5).toFixed(1)+'" text-anchor="end" font-size="9" fill="#a09a92">'+fmt(gv)+'</text>';
    }

    var iMin = vals.indexOf(min), iMax = vals.indexOf(max);
    var dots = '', marks = '';
    pts.forEach(function(p,i){
      if(i === iMin || i === iMax) return;
      dots += '<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="2.6" fill="#fff" stroke="'+col+'" stroke-width="1.6"/>';
    });
    function mark(i, color, label, above){
      var p = pts[i];
      var ly = above ? p.y - 11 : p.y + 16;
      var anchor = 'middle', lx = p.x;
      if(lx < PL + 22){ anchor = 'start'; lx = PL; }
      else if(lx > W - PR - 22){ anchor = 'end'; lx = W - PR; }
      marks += '<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="7" fill="'+color+'" opacity=".14"/>'+
        '<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="4" fill="'+color+'" stroke="#fff" stroke-width="1.6"/>'+
        '<text x="'+lx.toFixed(1)+'" y="'+ly.toFixed(1)+'" text-anchor="'+anchor+'" font-size="9.5" font-weight="700" '+
        'fill="'+color+'" stroke="#fff" stroke-width="2.6" paint-order="stroke" stroke-linejoin="round">'+
        label+' '+fmt(p.v)+'</text>';
    }
    if(iMax !== iMin){
      mark(iMax, '#c2584f', '最重', true);
      mark(iMin, '#3f8f6f', '最軽', false);
    }else{
      mark(iMax, col, '', true);
    }

    var xl = '';
    [0, Math.floor((pts.length-1)/2), pts.length-1].filter(function(v,i,a){ return a.indexOf(v)===i; })
      .forEach(function(i){
        var p = pts[i], anchor = 'middle', x = p.x;
        if(i === 0){ anchor = 'start'; x = PL; }
        if(i === pts.length-1){ anchor = 'end'; x = W - PR; }
        xl += '<text x="'+x.toFixed(1)+'" y="'+(H-10)+'" text-anchor="'+anchor+'" font-size="9" fill="#a09a92">'+mdOf(p.date)+'</text>';
      });

    box.innerHTML =
      '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="体重の移り変わり">'+
        '<defs><linearGradient id="gfill" x1="0" y1="0" x2="0" y2="1">'+
          '<stop offset="0%" stop-color="'+col+'" stop-opacity=".18"/>'+
          '<stop offset="100%" stop-color="'+col+'" stop-opacity="0"/>'+
        '</linearGradient></defs>'+
        grid + labels +
        '<path d="'+area+'" fill="url(#gfill)"/>'+
        '<path d="'+line+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'+
        dots + marks + xl +
      '</svg>';
  }

  // ===== 最軽・最重 =====
  function drawPeaks(logs){
    var box = $('peaks');
    if(logs.length < 2){ box.innerHTML = ''; return; }
    var vals = logs.map(function(l){ return valOf(l, view); });
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    var lmin = logs[vals.indexOf(min)], lmax = logs[vals.indexOf(max)];
    box.innerHTML =
      '<div class="peak lo"><div class="pl">最軽</div>'+
        '<div class="pv">'+fmt(min)+'<small>kg</small></div>'+
        '<div class="pd">'+ymdOf(lmin.date)+'</div></div>'+
      '<div class="peak hi"><div class="pl">最重</div>'+
        '<div class="pv">'+fmt(max)+'<small>kg</small></div>'+
        '<div class="pd">'+ymdOf(lmax.date)+'</div></div>';
  }

  // ===== 履歴 =====
  function drawLogs(){
    var box = $('logs');
    var asc = sortedAsc();
    if(!asc.length){
      box.innerHTML = '<div class="card"><div class="empty">まだ記録がありません。</div></div>';
      $('btnMore').style.display = 'none';
      $('logCount').textContent = '';
      return;
    }
    // それぞれの最軽・最重（全期間）
    var peak = {};
    VIEWS.forEach(function(v){
      var ls = logsFor(v);
      if(ls.length < 2) return;
      var vals = ls.map(function(l){ return valOf(l, v); });
      peak[v] = {min:ls[vals.indexOf(Math.min.apply(null, vals))].date,
                 max:ls[vals.indexOf(Math.max.apply(null, vals))].date};
    });

    var desc = asc.slice().reverse();
    var shown = desc.slice(0, listLimit);
    box.innerHTML = shown.map(function(l){
      var tags = '', cells = '', memo = [];
      VIEWS.forEach(function(v){
        var val = valOf(l, v);
        if(val === null) return;
        cells += '<div class="vcell '+v+'"><span class="vn">'+esc(nameOf(v))+'</span>'+
                 '<span class="vv">'+fmt(val)+'</span></div>';
        if(peak[v]){
          if(l.date === peak[v].min) tags += '<span class="tag lo">'+esc(nameOf(v))+' 最軽</span>';
          if(l.date === peak[v].max) tags += '<span class="tag hi">'+esc(nameOf(v))+' 最重</span>';
        }
        var prev = prevOf(l.date, v);
        if(prev){ var d = r1(val - prev.value); memo.push(esc(nameOf(v))+' '+(d>0?'+':'')+fmt(d)); }
      });
      return '<div class="item">'+
        '<div class="i1"><div class="idate">'+ymdOf(l.date)+'</div><div class="tags">'+tags+'</div></div>'+
        '<div class="i2">'+cells+'</div>'+
        '<div class="i3"><span class="memo">'+(memo.length ? '前回比 '+memo.join(' / ') : '最初の記録')+'</span>'+
          '<span class="acts">'+
            '<button data-edit="'+l.date+'">直す</button>'+
            '<button class="del" data-del="'+l.date+'">消す</button>'+
          '</span></div>'+
      '</div>';
    }).join('');
    $('logCount').textContent = asc.length+'回';
    $('btnMore').style.display = desc.length > listLimit ? 'block' : 'none';
    $('btnMore').textContent = 'もっと見る（あと'+(desc.length - listLimit)+'回）';

    Array.prototype.forEach.call(box.querySelectorAll('[data-edit]'), function(b){
      b.addEventListener('click', function(){ startEdit(b.dataset.edit); });
    });
    Array.prototype.forEach.call(box.querySelectorAll('[data-del]'), function(b){
      b.addEventListener('click', function(){ removeLog(b.dataset.del); });
    });
  }
  $('btnMore').addEventListener('click', function(){ listLimit += 12; drawLogs(); });

  // ===== 呼び名 =====
  function applyNames(){
    $('lbHuman').textContent = state.names.human;
    $('lbDog').textContent = state.names.dog;
    $('lbNori').textContent = state.names.nori;
    Array.prototype.forEach.call($('switchBar').querySelectorAll('button'), function(b){
      b.textContent = nameOf(b.dataset.v);
    });
    [['setHuman','human'],['setDog','dog'],['setNori','nori']].forEach(function(p){
      if(document.activeElement !== $(p[0])){
        $(p[0]).value = state.names[p[1]] === DEF[p[1]] ? '' : state.names[p[1]];
      }
    });
    document.title = 'だっこばかり — '+state.names.dog+'と'+state.names.human+'の体重記録';
  }
  function onNameChange(){
    state.names.human = ($('setHuman').value || '').trim().slice(0,8) || DEF.human;
    state.names.dog   = ($('setDog').value   || '').trim().slice(0,8) || DEF.dog;
    state.names.nori  = ($('setNori').value  || '').trim().slice(0,8) || DEF.nori;
    state.namesTs = Date.now();
    commit(); applyNames(); render(); refreshResult();
  }
  ['setHuman','setDog','setNori'].forEach(function(id){
    $(id).addEventListener('change', onNameChange);
  });

  // ===== バックアップ =====
  $('btnExport').addEventListener('click', function(){
    var blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'dakkobakari-'+todayStr()+'.json';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 400);
  });
  $('btnImport').addEventListener('click', function(){ $('fileInput').click(); });
  $('fileInput').addEventListener('change', function(){
    var f = this.files && this.files[0]; if(!f) return;
    var rd = new FileReader();
    rd.onload = function(){
      try{
        var d = normalize(JSON.parse(rd.result));
        if(!d.logs.length) throw 0;
        if(!confirm('読み込んだ'+d.logs.length+'件を、いまの記録に足し合わせます。（同じ日は新しい方が残ります）')) return;
        state = merge(state, d);
        commit(); applyNames(); render(); loadDateIntoForm();
        toast('読み込みました');
      }catch(e){ alert('このファイルは読み込めませんでした。'); }
    };
    rd.readAsText(f);
    this.value = '';
  });
  $('btnClear').addEventListener('click', function(){
    if(!state.logs.length){ toast('消す記録がありません'); return; }
    if(!confirm('記録を全部消します。3人全員の画面から消え、元に戻せません。よろしいですか？')) return;
    if(!confirm('本当に全部消しますか？')) return;
    var now = Date.now();
    state.logs.forEach(function(l){ state.deleted[l.date] = now; });
    state.logs = [];
    commit(); render(); loadDateIntoForm();
    toast('全部消しました');
  });

  // ===== 描画 =====
  function render(){
    var shown = inRange(logsFor(view));
    drawPeaks(shown);
    drawChart(shown);
    $('graphCount').textContent = shown.length ? shown.length+'回分' : '';
    drawLogs();
  }

  // 起動
  $('fDate').value = todayStr();
  applyNames(); render(); loadDateIntoForm();
  loadRemote();
})();
</script>
<!-- tsumiki-back-button -->
<style>
  #tsumikiEdge{position:fixed; top:0; bottom:0; left:0; width:22px; z-index:999;}
  #tsumikiPeek{
    position:fixed; top:50%; left:0; z-index:1001; margin-top:-23px;
    width:46px; height:46px; display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.92);
    -webkit-backdrop-filter:saturate(180%) blur(14px); backdrop-filter:saturate(180%) blur(14px);
    border:1px solid rgba(0,0,0,.06); border-radius:50%;
    box-shadow:0 6px 20px rgba(0,0,0,.18);
    color:#0071e3; font-size:24px; font-weight:600; line-height:1;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Helvetica Neue",Arial,sans-serif;
    transform:translateX(-70px) scale(.8); opacity:0; pointer-events:none;
  }
</style>
<div id="tsumikiEdge"></div>
<div id="tsumikiPeek">‹</div>
<script>
  (function(){
    var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
      || window.navigator.standalone === true;
    var fromTsumiki = false;
    try{
      if(document.referrer){
        var r = new URL(document.referrer);
        fromTsumiki = (r.origin === location.origin);
      }
    }catch(e){}
    if(!(standalone && fromTsumiki)) return;

    var peek = document.getElementById('tsumikiPeek');
    var edge = document.getElementById('tsumikiEdge');

    function goBack(){ location.href = 'index.html'; }

    /* --- 左端エッジスワイプで戻る（iOS純正の戻る操作。見えるボタンは置かない） --- */
    var sx=0, sy=0, prog=0, dragging=false, W=window.innerWidth;
    var TRIGGER = Math.min(120, W*0.32);
    window.addEventListener('resize', function(){ W=window.innerWidth; TRIGGER=Math.min(120, W*0.32); });

    function reset(){
      dragging = false; prog = 0;
      peek.style.transition = 'transform .25s ease, opacity .25s ease';
      peek.style.transform = 'translateX(-70px) scale(.8)';
      peek.style.opacity = 0;
    }
    function start(e){
      var t = e.touches ? e.touches[0] : e;
      if(t.clientX > 26) return;
      sx = t.clientX; sy = t.clientY; prog = 0; dragging = true;
      peek.style.transition = 'none';
    }
    function move(e){
      if(!dragging) return;
      var t = e.touches ? e.touches[0] : e;
      var dx = t.clientX - sx, dy = t.clientY - sy;
      if(Math.abs(dy) > Math.abs(dx) + 12){ reset(); return; }
      if(dx < 0) dx = 0;
      prog = Math.min(dx / TRIGGER, 1);
      peek.style.transform = 'translateX(' + (-70 + prog*82) + 'px) scale(' + (0.8 + prog*0.2) + ')';
      peek.style.opacity = prog;
      if(dx > 6 && e.cancelable) e.preventDefault();
    }
    function end(){
      if(!dragging) return;
      dragging = false;
      if(prog >= 0.999){
        peek.style.transition = 'transform .25s ease, opacity .25s ease';
        peek.style.transform = 'translateX(20px) scale(1.05)';
        peek.style.opacity = 1;
        goBack();
      }else{
        reset();
      }
    }
    edge.addEventListener('touchstart', start, {passive:true});
    window.addEventListener('touchmove', move, {passive:false});
    window.addEventListener('touchend', end, {passive:true});
    window.addEventListener('touchcancel', end, {passive:true});
  })();
</script>
<!-- /tsumiki-back-button -->
</body>
