<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="apple-touch-icon" href="icons/icon-jiyucho.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="自由帳">
<meta name="theme-color" content="#f5f4f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131109" media="(prefers-color-scheme: dark)">
<title>自由帳</title>
<style>
  :root{
    --paper:#f5f4f0; --surface:#fffefb; --surface-2:#efece5; --ink:#1d1a15;
    --ink-mid:#5b554a; --ink-soft:#8f8877; --line:#e2ded4; --line-2:#d8d3c7;
    --accent:#b06f26; --accent-2:#8a5a24; --accent-wash:#f0e4d1;
    --good:#4c7a51; --good-wash:#dde9dd; --warn:#b0522a; --warn-wash:#f2e0d4;
    --shadow:0 1px 2px rgba(40,32,18,.05), 0 10px 26px -16px rgba(40,32,18,.18);
    --serif:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Songti SC",serif;
    --sans:"Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,Meiryo,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#131109; --surface:#1d1a12; --surface-2:#26221a; --ink:#efe8da;
      --ink-mid:#a89e8b; --ink-soft:#7d7566; --line:#2f2b21; --line-2:#3a352a;
      --accent:#d59a4d; --accent-2:#e0ab63; --accent-wash:#362a19;
      --good:#7fae82; --good-wash:#23301f; --warn:#d9825a; --warn-wash:#39251a;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 30px -18px rgba(0,0,0,.65);
    }
  }
  :root[data-theme="light"]{
    --paper:#f5f4f0; --surface:#fffefb; --surface-2:#efece5; --ink:#1d1a15;
    --ink-mid:#5b554a; --ink-soft:#8f8877; --line:#e2ded4; --line-2:#d8d3c7;
    --accent:#b06f26; --accent-2:#8a5a24; --accent-wash:#f0e4d1;
    --good:#4c7a51; --good-wash:#dde9dd; --warn:#b0522a; --warn-wash:#f2e0d4;
    --shadow:0 1px 2px rgba(40,32,18,.05), 0 10px 26px -16px rgba(40,32,18,.18);
  }
  :root[data-theme="dark"]{
    --paper:#131109; --surface:#1d1a12; --surface-2:#26221a; --ink:#efe8da;
    --ink-mid:#a89e8b; --ink-soft:#7d7566; --line:#2f2b21; --line-2:#3a352a;
    --accent:#d59a4d; --accent-2:#e0ab63; --accent-wash:#362a19;
    --good:#7fae82; --good-wash:#23301f; --warn:#d9825a; --warn-wash:#39251a;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 30px -18px rgba(0,0,0,.65);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink); font-family:var(--sans);
    line-height:1.6; -webkit-font-smoothing:antialiased; font-feature-settings:"palt" 1; -webkit-text-size-adjust:100%;
  }
  .tnum{font-variant-numeric:tabular-nums;}

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--paper) 88%, transparent);
    backdrop-filter:saturate(1.3) blur(10px); -webkit-backdrop-filter:saturate(1.3) blur(10px);
    border-bottom:1px solid var(--line); padding:calc(env(safe-area-inset-top) + 12px) 18px 12px;
    display:flex; align-items:center; gap:10px;
  }
  .brand{display:flex; align-items:center; gap:10px; min-width:0;}
  .brand .mark{  /* つみき公式ロゴ（アイソメの積み木3つ）＝index.html と同一座標 */
    width:22px; height:22px; flex:none; display:block; border-radius:5px;
    box-shadow:0 2px 7px rgba(36,35,33,.18);
  }
  .brand h1{font-family:var(--serif); font-weight:600; font-size:1.1rem; margin:0; letter-spacing:.02em; white-space:nowrap;}
  .spacer{flex:1;}
  .iconbtn{
    width:34px; height:34px; flex:none; border:1px solid var(--line); background:var(--surface);
    border-radius:9px; color:var(--ink-mid); display:grid; place-items:center; cursor:pointer;
  }
  .iconbtn:active{transform:scale(.94);}
  .sync-dot{width:8px; height:8px; border-radius:50%; background:var(--ink-soft); flex:none;}
  .sync-dot.ok{background:var(--good);} .sync-dot.off{background:var(--accent);}

  /* ---------- メニュー（三本線 → 引き出し） ----------
     z-index は戻るボタン（#tsumikiEdge=999 / #tsumikiPeek=1001）より上。
     開いている間は左端エッジスワイプ（戻る）を覆って誤爆を防ぐ。 */
  .menu-mask{
    position:fixed; inset:0; background:rgba(24,19,10,.42); z-index:1010;
    opacity:0; pointer-events:none; transition:opacity .22s;
  }
  .menu-mask.show{opacity:1; pointer-events:auto;}
  .drawer{
    position:fixed; top:0; left:0; bottom:0; width:min(80vw,286px); z-index:1011;
    background:var(--surface); border-right:1px solid var(--line);
    box-shadow:0 0 44px -10px rgba(24,19,10,.4);
    transform:translateX(-101%); transition:transform .26s cubic-bezier(.22,.61,.36,1);
    padding:calc(env(safe-area-inset-top) + 14px) 12px calc(env(safe-area-inset-bottom) + 14px);
    display:flex; flex-direction:column; gap:12px; overflow-y:auto; overscroll-behavior:contain;
  }
  .drawer.show{transform:none;}
  .dr-head{display:flex; align-items:center; gap:9px; padding:2px 8px 12px; border-bottom:1px solid var(--line);}
  .dr-head .mark{  /* つみき公式ロゴ（アイソメの積み木3つ）＝index.html と同一座標 */
    width:18px; height:18px; flex:none; display:block; border-radius:4px;
    box-shadow:0 2px 7px rgba(36,35,33,.18);
  }
  .dr-head b{font-family:var(--serif); font-weight:600; font-size:.98rem; letter-spacing:.02em;}
  .dr-nav{display:grid; gap:3px;}
  .dr-item{
    display:flex; align-items:center; gap:11px; padding:12px 11px; border-radius:12px;
    text-decoration:none; color:var(--ink); font-size:.95rem; font-weight:700; line-height:1.35;
  }
  .dr-item svg{
    width:19px; height:19px; flex:none; color:var(--ink-soft);
    stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round;
  }
  .dr-item:active{background:var(--surface-2);}
  .dr-item.current{background:var(--accent-wash); color:var(--accent-2);}
  .dr-item.current svg{color:var(--accent-2);}

  /* ---------- layout ---------- */
  main{max-width:600px; margin:0 auto; padding:16px 16px calc(env(safe-area-inset-bottom) + 40px); display:grid; gap:15px;}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow); padding:18px 19px;}
  .label{font-size:.74rem; font-weight:700; letter-spacing:.06em; color:var(--accent-2); text-transform:uppercase;}
  .note{font-size:.78rem; color:var(--ink-soft); margin:11px 2px 0; line-height:1.55;}

  /* PC・タブレット幅：横をつかう。本文の行だけは長くなりすぎないよう文字数で止める。 */
  @media (min-width:760px) and (max-width:1079px){
    main{max-width:720px;}
  }
  @media (min-width:1080px){
    main{max-width:1180px; padding:22px 20px calc(env(safe-area-inset-bottom) + 40px); gap:18px;}
    .nlist{gap:14px;}
    .n-body textarea.body{max-width:72ch;}
  }

  /* ---------- 新規作成 ---------- */
  .newbar{display:flex; gap:8px; margin-top:12px;}
  .newbar input{
    flex:1; min-width:0; border:1.5px solid var(--line); background:var(--surface-2); border-radius:11px;
    padding:11px 13px; font-size:16px; color:var(--ink); font-family:var(--sans);
  }
  .newbar input:focus{outline:2px solid var(--accent-wash); border-color:var(--accent);}
  .newbar button{
    flex:none; border:none; border-radius:11px; padding:0 17px; font-weight:700; font-size:.95rem;
    font-family:var(--sans); cursor:pointer; color:#fff; background:linear-gradient(155deg,var(--accent),var(--accent-2));
  }
  .newbar button:active{transform:scale(.97);}
  .newdate{display:flex; align-items:center; gap:9px; margin-top:9px; font-size:.78rem; color:var(--ink-mid); font-weight:700;}
  .newdate input{
    flex:none; border:1.5px solid var(--line); background:var(--surface-2); border-radius:10px;
    padding:8px 11px; font-size:16px; color:var(--ink); font-family:var(--sans);
  }
  .newdate .today{
    margin-left:auto; border:none; background:transparent; color:var(--ink-soft); font-size:.78rem;
    font-weight:700; font-family:var(--sans); cursor:pointer; text-decoration:underline; text-underline-offset:3px;
  }

  /* ---------- しまった分への行き来 ---------- */
  .arcbar{display:flex; justify-content:center;}
  .arcbar button{
    display:flex; align-items:center; gap:8px; border:1px solid var(--line); background:var(--surface);
    border-radius:99px; padding:9px 16px; font-family:var(--sans); font-size:.84rem; font-weight:700;
    color:var(--ink-mid); cursor:pointer;
  }
  .arcbar button:active{background:var(--surface-2);}
  .arcbar svg{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round;}
  .arc-head{display:flex; align-items:center; gap:12px;}
  .arc-head b{font-family:var(--serif); font-weight:600; font-size:1.02rem;}
  .arc-head button{
    margin-left:auto; flex:none; border:none; background:transparent; font-family:var(--sans); font-size:.82rem;
    font-weight:700; color:var(--accent-2); cursor:pointer; text-decoration:underline; text-underline-offset:3px; padding:4px 2px;
  }

  /* ---------- メモカード ---------- */
  .nlist{display:grid; gap:10px;}
  .n-card{background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); overflow:hidden;}
  .n-card.open{border-color:var(--accent);}
  .n-head{display:flex; align-items:center; gap:11px; padding:14px 16px; cursor:pointer;}
  .n-t{flex:1; min-width:0;}
  .n-date{display:block; font-size:.74rem; font-weight:700; color:var(--accent-2); letter-spacing:.03em;}
  .n-title{
    display:block; font-family:var(--serif); font-size:1.04rem; font-weight:600; margin-top:1px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .n-sub{display:block; font-size:.78rem; color:var(--ink-soft); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .caret{flex:none; color:var(--ink-soft); transition:transform .2s;}
  .n-card.open .caret{transform:rotate(180deg);}
  .n-body{padding:2px 16px 16px; border-top:1px solid var(--line);}

  .n-meta{display:flex; gap:8px; margin-top:13px;}
  .n-meta input{
    border:1.5px solid var(--line); background:var(--paper); border-radius:10px;
    padding:9px 11px; font-size:16px; color:var(--ink); font-family:var(--sans); min-width:0;
  }
  .n-meta input.dt{flex:none; width:9.6rem;}
  .n-meta input.tt{flex:1;}
  .n-meta input:focus{outline:2px solid var(--accent-wash); border-color:var(--accent);}

  /* 自由に書く場所：罫線なしの白紙。改行はそのまま残る */
  .n-body textarea.body{
    display:block; width:100%; margin-top:10px; min-height:230px;
    border:1.5px solid var(--line); background:var(--paper); border-radius:12px;
    padding:13px 14px; font-size:16px; color:var(--ink); font-family:var(--sans);
    line-height:1.75; resize:none; overflow:hidden;
  }
  .n-body textarea.body:focus{outline:2px solid var(--accent-wash); border-color:var(--accent);}

  .n-foot{display:flex; justify-content:space-between; align-items:center; margin-top:14px;}
  .n-foot button{
    border:none; background:transparent; font-family:var(--sans); font-size:.82rem; font-weight:700;
    color:var(--ink-soft); cursor:pointer; text-decoration:underline; text-underline-offset:3px; padding:4px 2px;
  }
  .n-foot button.keep{color:var(--accent-2);}
  .n-foot button.del{color:var(--warn);}
  /* 削除ロック：ふだんは鍵つきの地味な見た目。外したときだけ赤く目立たせる */
  .n-foot button.lock{
    color:var(--ink-soft); text-decoration:none; display:inline-flex; align-items:center; gap:5px;
  }
  .n-foot button.lock svg{
    width:14px; height:14px; stroke:currentColor; fill:none;
    stroke-width:2; stroke-linecap:round; stroke-linejoin:round;
  }
  .n-foot button.del.armed{
    text-decoration:none; background:var(--warn); color:#fff;
    border-radius:999px; padding:10px 16px; font-size:.8rem;
  }

  /* ---------- 空・トースト ---------- */
  .empty{display:grid; gap:12px; justify-items:center; text-align:center; padding:16px 0 2px;}
  .empty .em{font-size:2rem;}
  .empty p{margin:0; color:var(--ink-mid); font-size:.94rem;}
  .empty .hint{font-size:.8rem; color:var(--ink-soft);}
  #toast{
    position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 22px); transform:translate(-50%,20px);
    background:var(--ink); color:var(--paper); padding:11px 17px; border-radius:12px; font-size:.9rem;
    display:flex; align-items:center; gap:12px; opacity:0; pointer-events:none; transition:.25s; z-index:40; max-width:90vw;
    box-shadow:0 10px 34px -8px rgba(0,0,0,.45);
  }
  #toast.show{opacity:1; transform:translate(-50%,0);}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>

<!-- 独立ロードマップ(dokuritsu.html)の中に埋め込まれて開かれたときは、
     自分のヘッダー・メニュー・戻るスワイプを隠して中身だけを見せる。
     単体（このURLを直接開く）で使うときは今まで通り何も変わらない。 -->
<style>
  html.embed .topbar,
  html.embed .drawer,
  html.embed .menu-mask,
  html.embed #tsumikiEdge,
  html.embed #tsumikiPeek{display:none !important;}
</style>
<script>
(function(){
  var q; try{ q=new URLSearchParams(location.search); }catch(e){ return; }
  if(q.get('embed')!=='1' || window.parent===window) return;
  var el=document.documentElement;
  el.classList.add('embed');
  function setTheme(t){
    if(t==='light'||t==='dark') el.setAttribute('data-theme',t);
    else el.removeAttribute('data-theme');
  }
  setTheme(q.get('theme'));                 /* 開いた時点の親のテーマに合わせる */
  window.addEventListener('message', function(ev){   /* 親でテーマを切り替えたら追従 */
    if(ev.source!==window.parent) return;
    var d=ev.data;
    if(!d || d.type!=='tsumiki-embed-theme') return;
    setTheme(d.theme);
  });
})();
</script>

const sb = (window.supabase && window.supabase.createClient) ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON) : null;
const STATE_TABLE = 'tsumiki_roadmap_state';
const STATE_ID = 'kodai_jiyucho_v1';         /* ロードマップ／声かけ／時給／学んだこと とは別の行 */
const KEY = 'tsumiki_jiyucho_v1';

/* ===================== ユーティリティ ===================== */
function uid(){ return Date.now().toString(36) + Math.floor(Math.random()*1e6).toString(36); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function z2(n){ return String(n).padStart(2,'0'); }
function iso(d){ return d.getFullYear()+'-'+z2(d.getMonth()+1)+'-'+z2(d.getDate()); }
function todayISO(){ return iso(new Date()); }
function parseISO(s){ const [y,m,d]=String(s).split('-').map(Number); return new Date(y,(m||1)-1,d||1); }
const WD=['日','月','火','水','木','金','土'];
function fmtDate(s){ if(!s) return '日付なし'; const d=parseISO(s); return d.getFullYear()+'/'+z2(d.getMonth()+1)+'/'+z2(d.getDate())+'（'+WD[d.getDay()]+'）'; }
function autoGrow(el){ el.style.height='auto'; el.style.height=(el.scrollHeight+2)+'px'; }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1700); }

/* ===================== 状態 ===================== */
/* note = {id, date, title, body, archived, createdAt} */
function blank(){ return { v:1, notes:[] }; }
let db = blank();
let online = null;
let lastPushed = '';
let openId = null;        /* 開いているメモ（編集中はリアルタイム上書きを止める） */
let showArc = false;      /* しまった分を見ているか（この端末だけの表示状態。同期しない） */
let unlockedId = null;    /* 削除ロックを外しているメモ（この端末だけ・同期しない・保存もしない） */
let unlockTimer = null;
const UNLOCK_MS = 10000;  /* 10秒たったら自動でロックに戻す */

function migrate(){
  if(!Array.isArray(db.notes)) db.notes=[];
  db.notes = db.notes.filter(n=>n && typeof n==='object');
  db.notes.forEach(n=>{
    if(!n.id) n.id=uid();
    ['date','title','body','createdAt'].forEach(k=>{ if(typeof n[k]!=='string') n[k]=''; });
    if(!n.date) n.date=todayISO();
    if(!n.createdAt) n.createdAt=n.date;
    n.archived = !!n.archived;
  });
}

/* ===================== 永続化・同期 ===================== */
function loadLocal(){ try{ const s=localStorage.getItem(KEY); if(s){ db=Object.assign(blank(), JSON.parse(s)); migrate(); } }catch(e){} }
let saveTimer=null;
function save(){
  localStorage.setItem(KEY, JSON.stringify(db));
  if(!sb) return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    lastPushed = JSON.stringify(db);
    const { error } = await sb.from(STATE_TABLE).upsert({ id:STATE_ID, state:db, updated_at:new Date().toISOString() });
    if(error){ online=false; } else if(online!==true){ online=true; }
    renderSync();
  }, 350);
}
async function loadRemote(){
  if(!sb){ online=false; renderSync(); return; }
  const { data, error } = await sb.from(STATE_TABLE).select('state').eq('id',STATE_ID).maybeSingle();
  if(error){ online=false; renderSync(); return; }
  online=true;
  if(data && data.state && typeof data.state==='object'){
    db=Object.assign(blank(), data.state); migrate();
    localStorage.setItem(KEY, JSON.stringify(db));
    if(!openId) render();
  } else if(db.notes.length){ save(); }
  renderSync();
}
function subscribeRealtime(){
  if(!sb) return;
  sb.channel('tsumiki-jiyucho-rt')
    .on('postgres_changes', { event:'*', schema:'public', table:STATE_TABLE, filter:'id=eq.'+STATE_ID }, (payload)=>{
      const incoming = JSON.stringify((payload.new && payload.new.state) || {});
      if(incoming === lastPushed) return;
      if(openId) return;                       /* 編集中は上書きしない */
      const active=document.activeElement;
      if(active && /INPUT|TEXTAREA/.test(active.tagName)) return;
      if(payload.new && payload.new.state){
        db=Object.assign(blank(), payload.new.state); migrate();
        localStorage.setItem(KEY, JSON.stringify(db));
        render();
      }
    }).subscribe();
}
function renderSync(){
  const dot=document.getElementById('syncDot');
  dot.classList.remove('ok','off');
  if(!sb){ dot.title='この端末に保存'; return; }
  if(online===true){ dot.classList.add('ok'); dot.title='クラウド同期中'; }
  else if(online===false){ dot.classList.add('off'); dot.title='オフライン'; }
}

/* ===================== 描画 ===================== */
const ICO_CARET=`<svg class="caret" viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round"><path d="M6 9l6 6 6-6"/></svg>`;
const ICO_BOX=`<svg viewBox="0 0 24 24"><path d="M3.4 7.6h17.2v11.2a1.6 1.6 0 0 1-1.6 1.6H5a1.6 1.6 0 0 1-1.6-1.6z"/><path d="M2.6 4.4h18.8v3.2H2.6z"/><path d="M10 11.6h4"/></svg>`;
const ICO_LOCK=`<svg viewBox="0 0 24 24"><rect x="4.8" y="10.6" width="14.4" height="9.4" rx="2.2"/><path d="M8.2 10.6V7.7a3.8 3.8 0 0 1 7.6 0v2.9"/></svg>`;

/* 削除ボタンだけを差し替える（render() を通さないので、書きかけの本文と入力位置が消えない） */
function delBtnHTML(id, armed){
  return armed
    ? `<button class="del armed" data-act="n-del" data-id="${id}">本当に削除する</button>`
    : `<button class="lock" data-act="n-unlock" data-id="${id}">${ICO_LOCK}削除はロック中</button>`;
}
function setDelBtn(id, armed){
  const b=document.querySelector(`[data-act="${armed?'n-unlock':'n-del'}"][data-id="${id}"]`);
  if(b) b.outerHTML = delBtnHTML(id, armed);
}
function relock(){
  clearTimeout(unlockTimer); unlockTimer=null;
  if(unlockedId){ setDelBtn(unlockedId, false); unlockedId=null; }
}
function note(id){ return db.notes.find(n=>n.id===id) || null; }
function liveNotes(){ return db.notes.filter(n=>!n.archived); }
function arcNotes(){ return db.notes.filter(n=>n.archived); }
function firstLine(s){
  const t=String(s||'').split('\n').map(x=>x.trim()).find(x=>x) || '';
  return t.length>40 ? t.slice(0,40)+'…' : t;
}
function sortNotes(list){
  return list.slice().sort((a,b)=>{
    if(a.date!==b.date) return a.date<b.date ? 1 : -1;
    return a.createdAt<b.createdAt ? 1 : -1;
  });
}

function noteCard(n){
  const open=(openId===n.id);
  const sub = firstLine(n.body) || 'まだ何も書いていません';
  let h=`<div class="n-card ${open?'open':''}">
    <div class="n-head" data-act="n-open" data-id="${n.id}" role="button" tabindex="0">
      <span class="n-t">
        <span class="n-date">${esc(fmtDate(n.date))}</span>
        <span class="n-title">${esc(n.title||'（無題）')}</span>
        ${open?'':`<span class="n-sub">${esc(sub)}</span>`}
      </span>
      ${ICO_CARET}
    </div>`;
  if(!open) return h+`</div>`;

  h+=`<div class="n-body">
    <div class="n-meta">
      <input class="dt" type="date" data-date="${n.id}" value="${esc(n.date)}" aria-label="日付">
      <input class="tt" type="text" data-title="${n.id}" value="${esc(n.title)}" placeholder="タイトル" aria-label="タイトル">
    </div>
    <textarea class="body" data-body="${n.id}" placeholder="ここから自由に書けます">${esc(n.body)}</textarea>
    <div class="n-foot">
      ${ n.archived
          ? `<button class="keep" data-act="n-unarc" data-id="${n.id}">元に戻す</button>`
          : `<button class="keep" data-act="n-arc" data-id="${n.id}">しまう</button>` }
      ${delBtnHTML(n.id, unlockedId===n.id)}
    </div>
  </div></div>`;
  return h;
}

function render(){
  let h='';

  if(showArc){
    h+=`<div class="card">
      <div class="arc-head">
        <b>しまった分</b>
        <button data-act="arc-off">書く画面に戻る</button>
      </div>
      <p class="note">片付いたメモの置き場。開いて書き足せるし、「元に戻す」でいつでも戻せます。</p>
    </div>`;
    const list=arcNotes();
    if(!list.length){
      h+=`<div class="card"><div class="empty">
        <span class="em">🗃️</span>
        <p>しまったメモはまだありません。</p>
        <span class="hint">片付いたメモを開いて「しまう」を押すと、ここに入ります</span>
      </div></div>`;
    } else {
      h+=`<div class="nlist">${sortNotes(list).map(noteCard).join('')}</div>`;
    }
  } else {
    h+=`<div class="card">
      <span class="label">自由帳</span>
      <div class="newbar">
        <input type="text" id="newTitle" placeholder="タイトル（例：8/1 残りタスクの分解）" autocomplete="off" enterkeyhint="done">
        <button data-act="n-add">＋ 作る</button>
      </div>
      <div class="newdate">
        <span>日付</span>
        <input type="date" id="newDate" value="${todayISO()}" aria-label="日付">
        <button class="today" data-act="n-today">今日に戻す</button>
      </div>
      <p class="note">形の決まっていない、まっさらなメモ帳。分解したタスク・考えごと・下書き、なんでもここに。</p>
    </div>`;

    const list=liveNotes();
    if(!list.length){
      h+=`<div class="card"><div class="empty">
        <span class="em">📔</span>
        <p>まだ何もありません。</p>
        <span class="hint">タイトルを決めて作ると、まっさらなページが開きます</span>
      </div></div>`;
    } else {
      h+=`<div class="nlist">${sortNotes(list).map(noteCard).join('')}</div>`;
    }

    const nArc=arcNotes().length;
    if(nArc){
      h+=`<div class="arcbar"><button data-act="arc-on">${ICO_BOX}しまった分を見る（${nArc}）</button></div>`;
    }
  }

  document.getElementById('page').innerHTML=h;
  renderSync();
  document.querySelectorAll('#page textarea').forEach(autoGrow);
}

/* ===================== 操作 ===================== */
document.getElementById('page').addEventListener('click', e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const act=b.dataset.act, id=b.dataset.id;

  if(act==='n-add'){
    const ti=document.getElementById('newTitle');
    const title=(ti.value||'').trim();
    if(!title){ ti.focus(); return; }
    const date=document.getElementById('newDate').value || todayISO();
    const n={id:uid(), date, title, body:'', archived:false, createdAt:new Date().toISOString()};
    db.notes.push(n); save();
    openId=n.id; render();
    const ta=document.querySelector('[data-body="'+n.id+'"]');
    if(ta) ta.focus({preventScroll:true});
    return;
  }
  if(act==='n-today'){ document.getElementById('newDate').value=todayISO(); return; }
  if(act==='n-open'){ relock(); openId = (openId===id) ? null : id; render(); return; }
  if(act==='arc-on'){ relock(); showArc=true; openId=null; render(); window.scrollTo(0,0); return; }
  if(act==='arc-off'){ relock(); showArc=false; openId=null; render(); window.scrollTo(0,0); return; }

  /* 削除ロックを外す：この1件だけ・10秒だけ。ほかのメモは外れない */
  if(act==='n-unlock'){
    if(!note(id)) return;
    relock();
    unlockedId=id;
    setDelBtn(id, true);
    unlockTimer=setTimeout(()=>{
      unlockTimer=null;
      if(unlockedId!==id) return;
      unlockedId=null; setDelBtn(id, false);
      toast('削除ロックをかけ直しました');
    }, UNLOCK_MS);
    toast('10秒だけ削除できます');
    return;
  }

  if(act==='n-arc'){
    const n=note(id); if(!n) return;
    relock();
    n.archived=true; openId=null; save(); render();
    toast('しまいました');
    return;
  }
  if(act==='n-unarc'){
    const n=note(id); if(!n) return;
    relock();
    n.archived=false; openId=null; save();
    if(!arcNotes().length) showArc=false;   /* 最後の1件を戻したら、空の棚に取り残されないよう書く画面へ */
    render();
    toast('書く画面に戻しました');
    return;
  }
  if(act==='n-del'){
    const n=note(id); if(!n) return;
    if(unlockedId!==id){ setDelBtn(id, false); toast('先に削除ロックを外してください'); return; }
    if(!confirm('「'+(n.title||'（無題）')+'」を削除します。元に戻せません。よろしいですか？\n\n※消さずに残すなら「しまう」を使ってください。')) return;
    relock();
    db.notes=db.notes.filter(x=>x.id!==id);
    if(openId===id) openId=null;
    save(); render(); toast('削除しました');
    return;
  }
});

/* タイトル欄でEnter＝作る */
document.getElementById('page').addEventListener('keydown', e=>{
  if(e.target.id==='newTitle' && e.key==='Enter' && !e.isComposing){
    e.preventDefault();
    const btn=document.querySelector('[data-act="n-add"]');
    if(btn) btn.click();
  }
});

/* 入力中の保存（タイトル・日付・本文）。本文の改行はそのまま残す */
document.getElementById('page').addEventListener('input', e=>{
  const el=e.target;
  if(el.tagName==='TEXTAREA') autoGrow(el);
  if(el.dataset && el.dataset.title){
    const n=note(el.dataset.title);
    if(n){
      n.title=el.value; save();
      const card=el.closest('.n-card');
      const t=card && card.querySelector('.n-title');
      if(t) t.textContent = n.title || '（無題）';   /* 再描画せず見出しだけ追従（入力が途切れない） */
    }
    return;
  }
  if(el.dataset && el.dataset.date){ const n=note(el.dataset.date); if(n && el.value){ n.date=el.value; save(); } return; }
  if(el.dataset && el.dataset.body){ const n=note(el.dataset.body); if(n){ n.body=el.value; save(); } return; }
});

/* ===================== リスト入力ショートカット =====================
   本文欄で Markdown 風の箇条書きを楽に打てるように。（ことづてと同じ挙動）
   ・「-」「*」＋スペース → 「• 」箇条書きに変換、Enterで継続（空のままEnter＝解除）
   ・「1.」＋スペース → 番号リスト、Enterで「2.」「3.」…自動採番（1) 形式もOK）
   ・「[]」＋スペース → 「- [ ] 」チェック項目に変換、Enterで継続
   ★keydown ではなく beforeinput で判定：iOSのソフトキーボードは keydown を
     まともに発火せず（Space/Enterが keyCode:229 になる）効かないため。
   ★本文は再描画のたびに作り直されるので、#page への委譲で受ける。 */
const RE_CHECK=/^(\s*)([-*])\s+\[[ xX]?\]\s+/, RE_NUM=/^(\s*)(\d+)([.)])\s+/, RE_BUL=/^(\s*)([-*•])\s+/;
function lineHeadStart(v,pos){ return v.lastIndexOf('\n',pos-1)+1; }
/* Enter（改行が入る直前）：リストを継続 or 解除。処理したら true。 */
function listContinue(ta,e){
  if(ta.selectionStart!==ta.selectionEnd) return false;
  const v=ta.value, pos=ta.selectionStart, start=lineHeadStart(v,pos), line=v.slice(start,pos);
  let m, marker=null, cs=0;
  if((m=line.match(RE_CHECK))){ marker=m[1]+m[2]+' [ ] '; cs=m[0].length; }
  else if((m=line.match(RE_NUM))){ marker=m[1]+(parseInt(m[2],10)+1)+m[3]+' '; cs=m[0].length; }
  else if((m=line.match(RE_BUL))){ marker=m[1]+m[2]+' '; cs=m[0].length; }
  else return false;
  if(line.slice(cs).trim()===''){ // 中身が空 → マーカーを消してリスト解除
    e.preventDefault(); ta.value=v.slice(0,start)+v.slice(pos); ta.selectionStart=ta.selectionEnd=start; return true;
  }
  e.preventDefault(); const ins='\n'+marker; ta.value=v.slice(0,pos)+ins+v.slice(pos);
  ta.selectionStart=ta.selectionEnd=pos+ins.length; return true;
}
/* スペースが入る直前：行頭が [] / - / * なら変換。処理したら true。 */
function listSpace(ta,e){
  if(ta.selectionStart!==ta.selectionEnd) return false;
  const v=ta.value, pos=ta.selectionStart, start=lineHeadStart(v,pos), line=v.slice(start,pos);
  let m, r=null;
  if((m=line.match(/^(\s*)\[( ?)\]$/))) r=m[1]+'- [ ] ';   // [] → チェック項目
  else if((m=line.match(/^(\s*)[-*•]$/))) r=m[1]+'• ';      // - / * → 箇条書き（•に変換）
  else return false;
  e.preventDefault(); ta.value=v.slice(0,start)+r+v.slice(pos);
  ta.selectionStart=ta.selectionEnd=start+r.length; return true;
}
document.getElementById('page').addEventListener('beforeinput', e=>{
  const ta=e.target;
  if(!ta || ta.tagName!=='TEXTAREA' || !ta.dataset || !ta.dataset.body) return;
  if(e.isComposing) return;              /* 日本語変換の確定Enter等は無視 */
  let handled=false;
  const t=e.inputType;
  if(t==='insertLineBreak'||t==='insertParagraph') handled=listContinue(ta,e);
  else if(t==='insertText'&&(e.data===' '||e.data==='　')) handled=listSpace(ta,e);
  if(!handled) return;
  /* preventDefault したぶん input イベントが出ないので、高さ調整と保存は自分でやる */
  autoGrow(ta);
  const n=note(ta.dataset.body);
  if(n){ n.body=ta.value; save(); }
});

/* ===================== メニュー（引き出し） ===================== */
(function(){
  const btn=document.getElementById('menuBtn');
  const dr=document.getElementById('drawer');
  const mask=document.getElementById('menuMask');
  function setOpen(on){
    dr.classList.toggle('show', on);
    mask.classList.toggle('show', on);
    dr.setAttribute('aria-hidden', on?'false':'true');
    btn.setAttribute('aria-expanded', on?'true':'false');
    document.body.style.overflow = on ? 'hidden' : '';
    if(on){ const f=dr.querySelector('a.dr-item'); if(f) f.focus({preventScroll:true}); }
  }
  btn.addEventListener('click', ()=> setOpen(!dr.classList.contains('show')));
  mask.addEventListener('click', ()=> setOpen(false));
  dr.addEventListener('click', e=>{ if(e.target.closest('.dr-item.current')) setOpen(false); });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape' && dr.classList.contains('show')) setOpen(false); });
})();

/* ===================== テーマ ===================== */
const TKEY='tsumiki_theme';
function applyTheme(){
  const t=localStorage.getItem(TKEY);
  if(t==='light'||t==='dark') document.documentElement.setAttribute('data-theme',t);
  else document.documentElement.removeAttribute('data-theme');
}
document.getElementById('themeBtn').addEventListener('click', ()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const next = cur==='light' ? 'dark' : (cur==='dark' ? '' : 'light');
  if(next) localStorage.setItem(TKEY,next); else localStorage.removeItem(TKEY);
  applyTheme();
  toast(next==='light'?'ライト表示':(next==='dark'?'ダーク表示':'端末の設定に合わせます'));
});
applyTheme();

/* ===================== 起動 ===================== */
loadLocal();
render();
if(sb){ loadRemote(); subscribeRealtime(); }
</script>
<!-- tsumiki-back-button -->
<style>
  #tsumikiEdge{position:fixed; top:0; bottom:0; left:0; width:22px; z-index:999;}
  #tsumikiPeek{
    position:fixed; top:50%; left:0; z-index:1001; margin-top:-23px;
    width:46px; height:46px; display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.92);
    -webkit-backdrop-filter:saturate(180%) blur(14px); backdrop-filter:saturate(180%) blur(14px);
    border:1px solid rgba(0,0,0,.06); border-radius:50%;
    box-shadow:0 6px 20px rgba(0,0,0,.18);
    color:#0071e3; font-size:24px; font-weight:600; line-height:1;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Helvetica Neue",Arial,sans-serif;
    transform:translateX(-70px) scale(.8); opacity:0; pointer-events:none;
  }
</style>
<div id="tsumikiEdge"></div>
<div id="tsumikiPeek">‹</div>
<script>
  (function(){
    var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
      || window.navigator.standalone === true;
    var fromTsumiki = false;
    try{
      if(document.referrer){
        var r = new URL(document.referrer);
        fromTsumiki = (r.origin === location.origin);
      }
    }catch(e){}
    if(!(standalone && fromTsumiki)) return;

    var peek = document.getElementById('tsumikiPeek');
    var edge = document.getElementById('tsumikiEdge');

    function goBack(){ location.href = 'index.html'; }

    /* --- 左端エッジスワイプで戻る（iOS純正の戻る操作。見えるボタンは置かない） --- */
    var sx=0, sy=0, prog=0, dragging=false, W=window.innerWidth;
    var TRIGGER = Math.min(120, W*0.32);
    window.addEventListener('resize', function(){ W=window.innerWidth; TRIGGER=Math.min(120, W*0.32); });

    function reset(){
      dragging = false; prog = 0;
      peek.style.transition = 'transform .25s ease, opacity .25s ease';
      peek.style.transform = 'translateX(-70px) scale(.8)';
      peek.style.opacity = 0;
    }
    function start(e){
      var t = e.touches ? e.touches[0] : e;
      if(t.clientX > 26) return;
      sx = t.clientX; sy = t.clientY; prog = 0; dragging = true;
      peek.style.transition = 'none';
    }
    function move(e){
      if(!dragging) return;
      var t = e.touches ? e.touches[0] : e;
      var dx = t.clientX - sx, dy = t.clientY - sy;
      if(Math.abs(dy) > Math.abs(dx) + 12){ reset(); return; }
      if(dx < 0) dx = 0;
      prog = Math.min(dx / TRIGGER, 1);
      peek.style.transform = 'translateX(' + (-70 + prog*82) + 'px) scale(' + (0.8 + prog*0.2) + ')';
      peek.style.opacity = prog;
      if(dx > 6 && e.cancelable) e.preventDefault();
    }
    function end(){
      if(!dragging) return;
      dragging = false;
      if(prog >= 0.999){
        peek.style.transition = 'transform .25s ease, opacity .25s ease';
        peek.style.transform = 'translateX(20px) scale(1.05)';
        peek.style.opacity = 1;
        goBack();
      }else{
        reset();
      }
    }
    edge.addEventListener('touchstart', start, {passive:true});
    window.addEventListener('touchmove', move, {passive:false});
    window.addEventListener('touchend', end, {passive:true});
    window.addEventListener('touchcancel', end, {passive:true});
  })();
</script>
<!-- /tsumiki-back-button -->
</body>
</html>
