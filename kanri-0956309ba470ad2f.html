<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ライセンス管理 — つみき</title>
<link rel="apple-touch-icon" href="icons/icon-kouban.png">
<meta name="apple-mobile-web-app-title" content="ライセンス管理">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{ --paper:#F4F2EE; --surface:#ECE9E3; --ink:#242321; --muted:#77736B;
         --hair:#D8D4CC; --ghost:#BEB9B0; --control:#F8F7F4; --shu:#9C4735; --ok:#5B7052; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--paper); color:var(--ink);
        font-family:"Zen Maru Gothic",-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;
        -webkit-text-size-adjust:100%; }
  a{ color:var(--muted); }
  .wrap{ max-width:1180px; margin:0 auto; padding:20px 16px 64px; }
  #list{ display:grid; grid-template-columns:repeat(auto-fill, minmax(360px, 1fr));
    gap:12px; grid-auto-rows:1fr; }

  /* ロック画面 */
  #lock{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
         background:var(--paper); padding:24px; z-index:10; }
  #lock .card{ width:100%; max-width:340px; text-align:center; }
  .kicker{ font-size:11px; letter-spacing:.18em; color:var(--muted); margin:0 0 6px; }
  #lock h1{ font-size:20px; margin:0 0 18px; }
  input, select{ font-size:16px; font-family:inherit; color:var(--ink);
    background:var(--control); border:1px solid var(--hair); border-radius:12px;
    padding:0 12px; height:48px; line-height:normal; width:100%; outline:none;
    -webkit-appearance:none; appearance:none; }
  select{ background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%2377736B' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat:no-repeat; background-position:right 12px center; padding-right:36px; }
  input:focus, select:focus{ border-color:var(--ghost); }
  button{ font-family:inherit; font-weight:700; cursor:pointer; }
  .btn-primary{ font-size:15px; padding:13px; width:100%; border:none; border-radius:12px;
    background:var(--ink); color:var(--paper); margin-top:12px; }
  .btn-primary:disabled{ opacity:.5; }
  .err{ color:var(--shu); font-size:12.5px; min-height:1.5em; margin:12px 0 0; }

  /* ヘッダ */
  header{ display:flex; align-items:center; gap:10px; margin-bottom:18px; }
  header h1{ font-size:18px; margin:0; }
  header .spacer{ flex:1; }
  .hbtns{ display:flex; gap:8px; }
  .iconbtn{ width:34px; height:34px; flex:none; padding:0; border:1px solid var(--hair);
    background:var(--control); border-radius:9px; color:var(--muted);
    display:grid; place-items:center; cursor:pointer; }
  .iconbtn:active{ transform:scale(.94); }

  /* ---------- メニュー（三本線 → 引き出し） ----------
     z-index は戻るボタン（#tsumikiEdge=999 / #tsumikiPeek=1001）より上。
     開いている間は左端エッジスワイプ（戻る）を覆って誤爆を防ぐ。 */
  .menu-mask{ position:fixed; inset:0; background:rgba(36,35,33,.42); z-index:1010;
    opacity:0; pointer-events:none; transition:opacity .22s; }
  .menu-mask.show{ opacity:1; pointer-events:auto; }
  .drawer{ position:fixed; top:0; left:0; bottom:0; width:min(80vw,286px); z-index:1011;
    background:var(--surface); border-right:1px solid var(--hair);
    box-shadow:0 0 44px -10px rgba(36,35,33,.4);
    transform:translateX(-101%); transition:transform .26s cubic-bezier(.22,.61,.36,1);
    padding:calc(env(safe-area-inset-top) + 14px) 12px calc(env(safe-area-inset-bottom) + 14px);
    display:flex; flex-direction:column; gap:12px; overflow-y:auto; overscroll-behavior:contain; }
  .drawer.show{ transform:none; }
  .dr-head{ display:flex; align-items:center; gap:9px; padding:2px 8px 12px;
    border-bottom:1px solid var(--hair); }
  .dr-head b{ font-size:15px; }
  .dr-nav{ display:grid; gap:3px; }
  .dr-item{ display:flex; align-items:center; gap:11px; padding:12px 11px; border-radius:12px;
    text-decoration:none; color:var(--ink); font-size:14.5px; font-weight:700; line-height:1.35;
    width:100%; text-align:left; background:transparent; border:none; font-family:inherit; cursor:pointer; }
  .dr-item svg{ width:19px; height:19px; flex:none; color:var(--ghost);
    stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  .dr-item:active{ background:var(--control); }
  .dr-item.current{ background:var(--control); color:var(--shu); }
  .dr-item.current svg{ color:var(--shu); }
  .dr-note{ margin-top:auto; padding:12px 10px 0; font-size:11.5px; color:var(--muted); line-height:1.5; }
  .chip{ font-size:12px; font-weight:700; padding:8px 12px; border-radius:999px;
    background:var(--surface); border:1px solid var(--hair); color:var(--ink); }

  /* 発行フォーム */
  details.issue{ background:var(--surface); border:1px solid var(--hair); border-radius:14px;
    padding:14px 16px; margin-bottom:20px; }
  details.issue summary{ font-weight:700; font-size:14px; cursor:pointer; list-style:none; }
  details.issue summary::-webkit-details-marker{ display:none; }
  .field{ margin-top:12px; }
  .field label{ display:block; font-size:12px; color:var(--muted); margin-bottom:5px; }
  .hint{ margin:8px 0 0; font-size:11.5px; line-height:1.55; color:var(--muted); }
  .row2{ display:flex; gap:10px; }
  .row2 .field{ flex:1; }
  .newkey{ margin-top:12px; padding:12px; border-radius:10px; background:var(--control);
    border:1px dashed var(--ghost); font-size:14px; word-break:break-all; display:none; }

  /* カード */
  .card-lic{ background:var(--surface); border:1px solid var(--hair); border-radius:14px;
    padding:14px 16px; }
  .card-lic.off{ opacity:.62; }
  .toprow{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .custwrap{ display:flex; align-items:center; gap:6px; min-width:0; }
  .cust{ font-size:16px; font-weight:700; }
  .editbtn{ flex:none; display:inline-flex; align-items:center; justify-content:center;
    width:26px; height:26px; padding:0; border:none; border-radius:7px;
    background:transparent; color:var(--ghost); cursor:pointer; }
  .editbtn:hover, .editbtn:active{ background:var(--control); color:var(--ink); }
  .badge{ font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; white-space:nowrap; }
  .badge.on{ background:#E6ECE2; color:var(--ok); }
  .badge.off{ background:#F0E2DE; color:var(--shu); }
  .keyrow{ display:flex; align-items:center; gap:8px; margin-top:4px; }
  .keytext{ font-size:13px; color:var(--muted); word-break:break-all; user-select:all; }
  .copybtn{ flex:none; display:inline-flex; align-items:center; justify-content:center;
    width:30px; height:30px; padding:0; border:1px solid var(--hair); border-radius:8px;
    background:var(--control); color:var(--muted); cursor:pointer; }
  .copybtn:active{ background:var(--surface); color:var(--ink); }
  .meta{ display:flex; flex-wrap:wrap; gap:6px 16px; margin-top:10px; font-size:12.5px; color:var(--muted); }
  .meta b{ color:var(--ink); font-weight:700; }
  .meta .warn b{ color:var(--shu); }
  .actions{ display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .act{ font-size:12.5px; font-weight:700; padding:8px 12px; border-radius:10px;
    border:1px solid var(--hair); background:var(--control); color:var(--ink); }
  .act.danger{ color:var(--shu); border-color:#E4D2CD; }
  .empty{ text-align:center; color:var(--muted); font-size:13px; padding:40px 0; }
  .toast{ position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
    background:var(--ink); color:var(--paper); font-size:13px; padding:10px 16px;
    border-radius:999px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:20; }
  .toast.show{ opacity:1; }

  /* キーカード画像モーダル */
  .imgmodal{ position:fixed; inset:0; z-index:30; display:flex; align-items:flex-start; justify-content:center;
    background:rgba(36,35,33,.55); padding:20px 14px; overflow:auto;
    -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px); }
  .imgmodal[hidden]{ display:none; }
  .imgpanel{ width:100%; max-width:420px; background:var(--paper); border-radius:18px;
    padding:16px 16px 20px; box-shadow:0 24px 60px rgba(0,0,0,.3); margin:auto; }
  .imghead{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .imgx{ width:32px; height:32px; border:none; border-radius:8px; background:var(--surface);
    color:var(--muted); font-size:20px; line-height:1; }
  .imgstage{ background:var(--surface); border:1px solid var(--hair); border-radius:14px;
    padding:14px; text-align:center; }
  .imgstage canvas{ width:100%; height:auto; max-width:320px; border-radius:6px;
    box-shadow:0 8px 26px rgba(36,35,33,.16); }
  .imgmodal .field{ margin-top:12px; }
  .imgmodal .field label{ display:block; font-size:12px; color:var(--muted); margin-bottom:5px; }
  .iconrow{ display:flex; align-items:center; gap:10px; }
  .iconprev{ width:48px; height:48px; border-radius:50%; flex:none; background:var(--surface);
    border:1px solid var(--hair); display:flex; align-items:center; justify-content:center;
    overflow:hidden; color:var(--ghost); font-size:11px; }
  .iconprev img{ width:100%; height:100%; object-fit:cover; }
  .imgmodal .act{ font-size:12.5px; font-weight:700; padding:9px 14px; border-radius:10px;
    border:1px solid var(--hair); background:var(--control); color:var(--ink); }
  .imglink{ background:none; border:none; color:var(--muted); font-size:12.5px; text-decoration:underline; padding:6px 2px; }
  .imgmodal .btn-primary{ width:100%; }
</style>
</head>
<body>

<!-- ロック画面 -->
<div id="lock">
  <form class="card" id="lockForm" action="#" method="post">
    <p class="kicker">TSUMIKI ADMIN</p>
    <h1>ライセンス管理</h1>
    <!-- キーチェーン保存用の識別名（画面には出さないが、保存名として使われる） -->
    <input id="user" type="text" name="username" value="tsumiki-admin"
      autocomplete="username" aria-hidden="true" tabindex="-1"
      style="position:absolute; left:-9999px; width:1px; height:1px; opacity:0;">
    <input id="pass" type="password" name="password" placeholder="管理パスワード"
      autocomplete="current-password" enterkeyhint="go">
    <button class="btn-primary" id="lockBtn" type="submit">ひらく</button>
    <p class="err" id="lockErr"></p>
  </form>
</div>

<!-- ダッシュボード -->
<div class="wrap" id="app" hidden>
  <header>
    <button class="iconbtn" id="menuBtn" type="button" aria-label="メニュー" aria-expanded="false" aria-controls="drawer">
      <svg viewBox="0 0 24 24" style="width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/></svg>
    </button>
    <h1>ライセンス管理</h1>
    <span class="spacer"></span>
    <div class="hbtns">
      <button class="chip" id="reloadBtn">更新</button>
      <button class="chip" id="lockNow">ロック</button>
    </div>
  </header>

  <details class="issue">
    <summary>＋ 新しいキーを発行</summary>
    <div class="field">
      <label>お渡し先の名前（透かしに表示）</label>
      <input id="fCustomer" placeholder="お名前">
    </div>
    <div class="row2">
      <div class="field">
        <label>アプリ（ゲートに付けた名前と自動で一致）</label>
        <select id="fApp"></select>
      </div>
      <div class="field">
        <label>台数上限</label>
        <input id="fMax" type="number" inputmode="numeric" value="20" min="1" max="100">
      </div>
    </div>
    <p class="hint">既定20台＝「端末に紐づけない」運用。足りなくなったら無料で増やす（お客様に台数の話はしない）。</p>
    <div class="field">
      <label>メモ（任意・自分用）</label>
      <input id="fNote" placeholder="">
    </div>
    <button class="btn-primary" id="issueBtn" type="button">発行する</button>
    <div class="newkey" id="newKey"></div>
  </details>

  <div id="list"></div>
</div>

<!-- キーカード画像モーダル -->
<div id="imgModal" class="imgmodal" hidden>
  <div class="imgpanel">
    <div class="imghead">
      <p class="kicker" style="margin:0;">キーカード画像を発行</p>
      <button class="imgx" id="imgClose" type="button" aria-label="閉じる">×</button>
    </div>
    <div class="imgstage"><canvas id="imgCanvas" width="1080" height="1350"></canvas></div>
    <div class="field">
      <label>アプリURL（QRコードになります・空欄可）</label>
      <input id="imgUrl" placeholder="https://tools.tsumiki-apps.com/xxx.html" inputmode="url">
    </div>
    <div class="field">
      <label>アイコン画像（任意・正方形PNG推奨）</label>
      <div class="iconrow">
        <div class="iconprev" id="imgIconPrev">なし</div>
        <button type="button" class="act" id="imgIconBtn">画像を選ぶ</button>
        <button type="button" class="imglink" id="imgIconClear" style="display:none">外す</button>
        <input type="file" id="imgIconFile" accept="image/*" hidden>
      </div>
    </div>
    <button class="btn-primary" id="imgSave" type="button">写真に保存</button>
    <button class="act" id="imgDownload" type="button" style="width:100%; margin-top:10px;">ファイルとして保存</button>
  </div>
</div>

<!-- メニュー（三本線 → 引き出し） -->
<div class="menu-mask" id="menuMask"></div>
<aside class="drawer" id="drawer" aria-label="メニュー" aria-hidden="true">
  <div class="dr-head"><b>つみき 管理</b></div>
  <nav class="dr-nav">
    <a class="dr-item current" href="#" aria-current="page">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="10.5" width="17" height="10" rx="2.5"/><path d="M7.5 10.5V7.5a4.5 4.5 0 0 1 9 0v3"/></svg>
      ライセンス管理
    </a>
    <a class="dr-item" href="seisakubutsu-url.html">
      <svg viewBox="0 0 24 24"><path d="M10 13.5a4 4 0 0 0 5.7.3l2.6-2.6a4 4 0 0 0-5.7-5.7l-1.5 1.5"/><path d="M14 10.5a4 4 0 0 0-5.7-.3l-2.6 2.6a4 4 0 0 0 5.7 5.7l1.5-1.5"/></svg>
      制作物URL
    </a>
  </nav>
  <p class="dr-note">つみきの管理まわりのページ。<br>外部には出していません。</p>
</aside>

<div class="toast" id="toast"></div>

<script>
(function(){
  var SUPABASE_URL = 'https://okbjqtdirrathscctyvx.supabase.co';
  var ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9rYmpxdGRpcnJhdGhzY2N0eXZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzMjI4NTIsImV4cCI6MjA5NTg5ODg1Mn0.T-1AOK6vCD6uGdqrVGXjPui3L6WPSNrnygS-IHyfZ6Y';
  var K_PASS = 'tsumiki-admin-pass';
  var secret = localStorage.getItem(K_PASS) || '';

  var lock = document.getElementById('lock');
  var lockForm = document.getElementById('lockForm');
  var passInput = document.getElementById('pass');
  var lockBtn = document.getElementById('lockBtn');
  var lockErr = document.getElementById('lockErr');
  var app = document.getElementById('app');
  var listEl = document.getElementById('list');
  var toastEl = document.getElementById('toast');
  var appMap = {};   // アプリ名(name) → 表示名(label)。画像のアプリ名表示に使う

  function rpc(name, body){
    var ctrl = new AbortController();
    var to = setTimeout(function(){ ctrl.abort(); }, 15000);
    return fetch(SUPABASE_URL + '/rest/v1/rpc/' + name, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'apikey':ANON, 'Authorization':'Bearer '+ANON },
      body: JSON.stringify(body),
      signal: ctrl.signal
    }).then(function(r){
      clearTimeout(to);
      return r.json().then(function(j){ return { ok:r.ok, data:j }; });
    }, function(e){ clearTimeout(to); throw e; });
  }
  var COPY_SVG = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>';
  var EDIT_SVG = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>';

  function copyText(t){
    function done(){ toast('コピーしました'); }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(done).catch(function(){ fallback(); });
    } else { fallback(); }
    function fallback(){
      try{
        var ta=document.createElement('textarea'); ta.value=t;
        ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta);
        ta.select(); document.execCommand('copy'); document.body.removeChild(ta); done();
      }catch(e){ toast('コピーできませんでした'); }
    }
  }
  var toastT;
  function toast(msg){
    toastEl.textContent = msg; toastEl.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(function(){ toastEl.classList.remove('show'); }, 1800);
  }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  function fmtSeen(iso){
    if(!iso) return { text:'未使用', warn:false };
    var d = new Date(iso), now = new Date();
    var days = Math.floor((now - d)/86400000);
    var rel = days<=0 ? '今日' : (days===1 ? '昨日' : days+'日前');
    var s = d.getFullYear()+'/'+('0'+(d.getMonth()+1)).slice(-2)+'/'+('0'+d.getDate()).slice(-2)
          +' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
    return { text: rel+'（'+s+'）', warn:false };
  }

  function render(rows){
    if(!rows.length){ listEl.innerHTML = '<div class="empty">まだキーがありません。上の「＋ 新しいキーを発行」から作れます。</div>'; return; }
    listEl.innerHTML = rows.map(function(r){
      var over = r.device_count >= r.max_devices;
      var seen = fmtSeen(r.last_seen);
      return '<div class="card-lic '+(r.active?'':'off')+'">'
        + '<div class="toprow"><div class="custwrap"><span class="cust">'+esc(r.customer)+'</span>'
        +   '<button class="editbtn" data-act="edit" data-key="'+esc(r.key)+'" data-customer="'+esc(r.customer)+'" data-note="'+esc(r.note||'')+'" title="名前・メモを編集" aria-label="編集">'+EDIT_SVG+'</button></div>'
        +   '<span class="badge '+(r.active?'on':'off')+'">'+(r.active?'有効':'失効中')+'</span></div>'
        + '<div class="keyrow"><span class="keytext">'+esc(r.key)+'</span>'
        +   '<button class="copybtn" data-copy="'+esc(r.key)+'" title="キーをコピー" aria-label="キーをコピー">'+COPY_SVG+'</button></div>'
        + '<div class="meta">'
        +   '<span class="'+(over?'warn':'')+'">端末 <b>'+r.device_count+' / '+r.max_devices+'</b>'+(over?'（満杯）':'')+'</span>'
        +   '<span>アプリ <b>'+esc(r.app)+'</b></span>'
        +   '<span>最終利用 <b>'+esc(seen.text)+'</b></span>'
        +   (r.note ? '<span>メモ '+esc(r.note)+'</span>' : '')
        + '</div>'
        + '<div class="actions">'
        +   '<button class="act" data-act="image" data-key="'+esc(r.key)+'" data-customer="'+esc(r.customer)+'" data-app="'+esc(r.app)+'">画像を発行</button>'
        +   '<button class="act" data-act="toggle" data-key="'+esc(r.key)+'" data-active="'+(r.active?'1':'0')+'">'+(r.active?'無効化する':'復活させる')+'</button>'
        +   '<button class="act" data-act="max" data-key="'+esc(r.key)+'" data-max="'+r.max_devices+'">台数を変更</button>'
        +   '<button class="act danger" data-act="reset" data-key="'+esc(r.key)+'">端末リセット</button>'
        + '</div>'
        + '</div>';
    }).join('');
  }

  // 成否をオブジェクトで返す（例外を投げない）。ok=表示成功／auth=false は通信失敗（パスワードは消さない）
  function load(){
    return rpc('admin_list', { p_secret: secret }).then(function(res){
      if(res.ok){ render(res.data || []); return { ok:true }; }
      return { ok:false, auth:true };
    }, function(){ return { ok:false, auth:false }; });
  }

  function fillApps(apps){
    var sel = document.getElementById('fApp');
    var cur = sel.value;
    appMap = {}; apps.forEach(function(a){ appMap[a.name] = a.label; });
    sel.innerHTML = apps.map(function(a){
      return '<option value="'+esc(a.name)+'">'+esc(a.label)+'（'+esc(a.name)+'）</option>';
    }).join('')
      + '<option value="__all__">全アプリ共通（*）</option>'
      + '<option value="__add__">＋ 新しいアプリを登録…</option>';
    if(cur){ sel.value = cur; }
  }
  function loadApps(){
    return rpc('admin_apps', { p_secret: secret })
      .then(function(res){ if(res.ok) fillApps(res.data || []); }).catch(function(){});
  }

  function openApp(){ lock.style.display='none'; app.hidden=false; loadApps(); }
  function lockScreen(){
    localStorage.removeItem(K_PASS); secret=''; passInput.value='';
    app.hidden=true; lock.style.display='flex';
  }

  // ---- ロック解除 ----
  lockForm.addEventListener('submit', function(e){
    e.preventDefault();
    var v = passInput.value.trim();
    if(!v){ lockErr.textContent='パスワードを入力してください'; return; }
    lockBtn.disabled=true; lockErr.textContent='確認中…';
    secret = v;
    rpc('admin_list', { p_secret: secret }).then(function(res){
      lockBtn.disabled=false;
      if(res.ok){
        localStorage.setItem(K_PASS, secret);
        lockErr.textContent=''; render(res.data||[]); openApp();
      } else {
        secret=''; lockErr.textContent='パスワードが違うようです';
      }
    }).catch(function(){
      lockBtn.disabled=false; secret='';
      lockErr.textContent='接続できませんでした。もう一度「ひらく」を押してください';
    });
  });

  // ---- ダッシュボード操作 ----
  document.getElementById('reloadBtn').addEventListener('click', function(){
    toast('更新中…');
    load().then(function(r){
      if(r.ok){ toast('更新しました'); loadApps(); }
      else if(r.auth){ toast('パスワードが無効になりました'); lockScreen(); }
      else { toast('接続できませんでした。もう一度お試しください'); }
    });
  });
  document.getElementById('lockNow').addEventListener('click', function(){ lockScreen(); });

  // 「＋新しいアプリを登録」を選んだら名簿に追加してドロップダウンへ反映
  document.getElementById('fApp').addEventListener('change', function(){
    var sel = this;
    if(sel.value !== '__add__') return;
    var name = prompt('新しいアプリ名（半角英数と - _ . ／ アプリのゲートに付けた名前と同じにする）');
    if(!name){ sel.value=''; return; }
    var label = prompt('画面に出す表示名（例：まぜいろ）', '') || name;
    rpc('admin_app_add', { p_secret:secret, p_name:name, p_label:label }).then(function(res){
      if(res.ok){ loadApps().then(function(){ sel.value = name.toLowerCase().trim(); }); toast('アプリを登録しました'); }
      else { sel.value=''; toast('登録に失敗しました'); }
    }).catch(function(){ sel.value=''; toast('通信エラー'); });
  });

  document.getElementById('issueBtn').addEventListener('click', function(){
    var c = document.getElementById('fCustomer').value.trim();
    var a = document.getElementById('fApp').value;
    if(a === '__all__'){ a = '*'; }
    if(a === '__add__' || !a){ toast('アプリを選んでください'); return; }
    var m = parseInt(document.getElementById('fMax').value, 10) || 3;
    var n = document.getElementById('fNote').value.trim();
    if(!c || !a){ toast('名前とアプリ名は必須です'); return; }
    var btn = document.getElementById('issueBtn'); btn.disabled=true;
    rpc('admin_issue', { p_secret:secret, p_customer:c, p_app:a, p_max_devices:m, p_note:(n||null) })
      .then(function(res){
        btn.disabled=false;
        if(!res.ok){ toast('発行に失敗しました'); return; }
        var nk = document.getElementById('newKey');
        nk.style.display='block';
        nk.innerHTML = '発行しました'
          + '<div class="keyrow" style="margin-top:6px;"><span class="keytext"><b>'+esc(res.data)+'</b></span>'
          + '<button type="button" class="copybtn" data-copy="'+esc(res.data)+'" title="キーをコピー" aria-label="キーをコピー">'+COPY_SVG+'</button></div>'
          + '<button type="button" class="act" data-act="image" data-key="'+esc(res.data)+'" data-customer="'+esc(c)+'" data-app="'+esc(a)+'" style="margin-top:10px;">画像を発行</button>';
        document.getElementById('fCustomer').value=''; document.getElementById('fNote').value='';
        load();
      }).catch(function(){ btn.disabled=false; toast('通信エラー'); });
  });

  // 委譲：コピー & 各アクション
  document.body.addEventListener('click', function(e){
    var cp = e.target.closest('[data-copy]');
    if(cp){ copyText(cp.getAttribute('data-copy')); return; }
    var b = e.target.closest('[data-act]');
    if(!b) return;
    var act = b.getAttribute('data-act'), key = b.getAttribute('data-key');
    if(act==='edit'){
      var curC = b.getAttribute('data-customer')||'';
      var curN = b.getAttribute('data-note')||'';
      var nc = prompt('お渡し先の名前（透かしに表示）', curC);
      if(nc===null) return;
      if(!nc.trim()){ toast('名前は必須です'); return; }
      var nn = prompt('メモ（自分用・空でもOK）', curN);
      if(nn===null) return;
      rpc('admin_set_info', { p_secret:secret, p_key:key, p_customer:nc, p_note:nn })
        .then(function(res){ if(res.ok){ toast('更新しました'); load(); } else toast('失敗'); });
    } else if(act==='toggle'){
      var makeActive = b.getAttribute('data-active')==='0';
      if(!confirm(makeActive?'このキーを復活させますか？':'このキーを無効化しますか？（次に開いた時にロックされます）')) return;
      rpc('admin_set_active', { p_secret:secret, p_key:key, p_active:makeActive })
        .then(function(res){ if(res.ok){ toast(makeActive?'復活しました':'無効化しました'); load(); } else toast('失敗'); });
    } else if(act==='max'){
      var cur = b.getAttribute('data-max');
      var v = prompt('台数上限を入力（1〜100）', cur);
      if(v===null) return; var m=parseInt(v,10);
      if(!(m>=1 && m<=100)){ toast('1〜100で入力'); return; }
      rpc('admin_set_max', { p_secret:secret, p_key:key, p_max:m })
        .then(function(res){ if(res.ok){ toast('台数を'+m+'台に変更'); load(); } else toast('失敗'); });
    } else if(act==='reset'){
      if(!confirm('このキーの登録端末をすべて消しますか？（お客様は次回また台数枠を使えます）')) return;
      rpc('admin_reset_devices', { p_secret:secret, p_key:key })
        .then(function(res){ if(res.ok){ toast(res.data+'台の端末を解除'); load(); } else toast('失敗'); });
    } else if(act==='image'){
      openImageModal({
        customer: b.getAttribute('data-customer') || '',
        appName:  b.getAttribute('data-app') || '',
        key:      key
      });
    }
  });

  // ===== キーカード画像の発行（かぎふだ描画エンジンを内蔵。端末内で完結・キーは送信しない） =====
  var imgCanvas = document.getElementById('imgCanvas');
  var ictx = imgCanvas.getContext('2d');
  var IMW = 1080, IMH = 1350;
  var C_PAPER='#F4F2EE', C_PANEL='#FBFAF7', C_INK='#242321', C_SUB='#77736B', C_LINE='#D8D4CC';
  var G_HI='#D8BE7E', G_MID='#B08A3E', G_LO='#8A6A2A';
  var imgState = { app:'', customer:'', key:'', url:'', date:'', iconImg:null };
  var fontsReady = false;

  function ensureFonts(cb){
    if(fontsReady){ cb(); return; }
    if(document.fonts && document.fonts.load){
      Promise.all([
        document.fonts.load('700 58px "Zen Maru Gothic"'),
        document.fonts.load('500 24px "Zen Maru Gothic"'),
        document.fonts.load('400 21px "Zen Maru Gothic"')
      ]).then(function(){ fontsReady=true; cb(); }, function(){ cb(); });
    } else { cb(); }
  }
  function iGold(x0,y0,x1,y1){ var g=ictx.createLinearGradient(x0,y0,x1,y1);
    g.addColorStop(0,G_HI); g.addColorStop(.5,G_MID); g.addColorStop(1,G_LO); return g; }
  function iRR(x,y,w,h,r){ ictx.beginPath(); ictx.moveTo(x+r,y);
    ictx.arcTo(x+w,y,x+w,y+h,r); ictx.arcTo(x+w,y+h,x,y+h,r);
    ictx.arcTo(x,y+h,x,y,r); ictx.arcTo(x,y,x+w,y,r); ictx.closePath(); }
  function iSW(text,sp){ var w=0; for(var i=0;i<text.length;i++){ w+=ictx.measureText(text[i]).width; if(i<text.length-1)w+=sp; } return w; }
  function iCenter(text,cx,y,sp){ var t=iSW(text,sp), x=cx-t/2;
    for(var i=0;i<text.length;i++){ ictx.fillText(text[i],x,y); x+=ictx.measureText(text[i]).width+sp; } }
  function iFit(text,weight,maxW,startPx,sp){ var px=startPx;
    while(px>14){ ictx.font=weight+' '+px+'px "Zen Maru Gothic", sans-serif'; if(iSW(text,sp)<=maxW) break; px-=2; } return px; }
  // つみきロゴ（立体キューブ3つ・線画）。stroke に色を渡す
  function iLogo(cx,cy,R,stroke,lw){
    var c = 0.86602540378*R;
    function cube(x,y){
      var V=[[x,y-R],[x+c,y-0.5*R],[x+c,y+0.5*R],[x,y+R],[x-c,y+0.5*R],[x-c,y-0.5*R]];
      ictx.beginPath(); ictx.moveTo(V[0][0],V[0][1]);
      for(var i=1;i<6;i++) ictx.lineTo(V[i][0],V[i][1]);
      ictx.closePath(); ictx.stroke();
      [1,3,5].forEach(function(i){ ictx.beginPath(); ictx.moveTo(x,y); ictx.lineTo(V[i][0],V[i][1]); ictx.stroke(); });
    }
    ictx.save(); ictx.strokeStyle=stroke; ictx.lineWidth=lw; ictx.lineJoin='round'; ictx.lineCap='round';
    cube(cx-c, cy+0.5*R); cube(cx+c, cy+0.5*R); cube(cx, cy-R);
    ictx.restore();
  }
  function iSeal(cx,cy,r){
    ictx.save(); ictx.lineWidth=5; ictx.strokeStyle=iGold(cx-r,cy-r,cx+r,cy+r);
    ictx.beginPath(); ictx.arc(cx,cy,r,0,Math.PI*2); ictx.stroke();
    ictx.lineWidth=2; ictx.beginPath(); ictx.arc(cx,cy,r-9,0,Math.PI*2); ictx.stroke();
    ictx.restore();
    // つみきロゴを金で（リング中央に配置）
    iLogo(cx, cy+0.25*18, 18, iGold(cx-r,cy-r,cx+r,cy+r), 4.5);
  }
  function iQR(url,cx,top,size){
    var qr; try{ qr=qrcode(0,'M'); qr.addData(url); qr.make(); }catch(e){ return top; }
    var n=qr.getModuleCount(), quiet=4, cell=size/(n+quiet*2), x0=cx-size/2, y0=top;
    ictx.save(); ictx.fillStyle='#FFFFFF'; iRR(x0-10,y0-10,size+20,size+20,14); ictx.fill();
    ictx.strokeStyle=C_LINE; ictx.lineWidth=1.5; iRR(x0-10,y0-10,size+20,size+20,14); ictx.stroke();
    ictx.fillStyle=C_INK;
    for(var r=0;r<n;r++){ for(var c=0;c<n;c++){ if(qr.isDark(r,c)){
      var px=x0+(c+quiet)*cell, py=y0+(r+quiet)*cell;
      ictx.fillRect(Math.floor(px),Math.floor(py),Math.ceil(cell)+1,Math.ceil(cell)+1);
    } } }
    ictx.restore(); return y0+size;
  }
  function iDate(v){ if(!v) return ''; var p=v.split('-'); return p.length===3?p[0]+'.'+p[1]+'.'+p[2]:v; }
  function iToday(){ var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
  function iAppUrl(name){ if(!name || name==='*') return ''; return 'https://tools.tsumiki-apps.com/'+name+'.html'; }

  // アプリ名からアイコンURLの候補を作る（-pro等を外した名前・第1トークンもフォールバック）
  function iconCandidates(name){
    if(!name || name==='*') return [];
    var base = name.replace(/-(pro|lite|plus|kanri|std)$/,'');
    var first = name.split('-')[0];
    var stems = []; [name, base, first].forEach(function(n){ if(n && stems.indexOf(n)<0) stems.push(n); });
    var urls = [];
    stems.forEach(function(n){ urls.push('https://tools.tsumiki-apps.com/icon-'+n+'.png'); });
    stems.forEach(function(n){ urls.push('icons/icon-'+n+'.png'); });  // 同一オリジンのフォールバック
    return urls;
  }
  var iconToken = 0;  // 開き直し時に古い読込結果を捨てるための世代番号
  function autoLoadIcon(appName){
    var urls = iconCandidates(appName), i = 0, gen = ++iconToken;
    (function next(){
      if(i >= urls.length || gen !== iconToken) return;   // 全滅＝アイコンなし
      var im = new Image();
      im.crossOrigin = 'anonymous';   // CORS対応。これで書き出しも汚染されない
      im.onload = function(){
        if(gen !== iconToken) return;
        imgState.iconImg = im;
        var p = document.getElementById('imgIconPrev'); p.innerHTML='';
        var pi = new Image(); pi.src = im.src; p.appendChild(pi);
        document.getElementById('imgIconClear').style.display='';
        iRender();
      };
      im.onerror = function(){ i++; next(); };
      im.src = urls[i];
    })();
  }

  function iRender(){
    ictx.clearRect(0,0,IMW,IMH);
    ictx.fillStyle=C_PAPER; ictx.fillRect(0,0,IMW,IMH);
    ictx.fillStyle=C_PANEL; iRR(28,28,IMW-56,IMH-56,26); ictx.fill();
    ictx.save(); ictx.strokeStyle=iGold(56,56,IMW-56,IMH-56); ictx.lineWidth=3;
    iRR(56,56,IMW-112,IMH-112,18); ictx.stroke(); ictx.lineWidth=1.5;
    iRR(70,70,IMW-140,IMH-140,12); ictx.stroke(); ictx.restore();
    var cx=IMW/2, innerL=150, innerR=IMW-150, innerW=innerR-innerL;
    ictx.textBaseline='alphabetic'; ictx.textAlign='left';
    ictx.fillStyle=G_MID; ictx.font='700 22px "Zen Maru Gothic", sans-serif';
    iCenter('CERTIFICATE OF LICENSE',cx,158,5);
    ictx.strokeStyle=iGold(cx-70,0,cx+70,0); ictx.lineWidth=1.5;
    ictx.beginPath(); ictx.moveTo(cx-70,178); ictx.lineTo(cx+70,178); ictx.stroke();
    ictx.fillStyle=C_INK; ictx.font='700 58px "Zen Maru Gothic", sans-serif';
    iCenter('TSUMIKI',cx,262,10);
    ictx.fillStyle=C_SUB; ictx.font='500 22px "Zen Maru Gothic", sans-serif';
    iCenter('プロダクトキー証明書',cx,300,3);
    iSeal(892,250,64);
    ictx.strokeStyle=C_LINE; ictx.lineWidth=1.5;
    ictx.beginPath(); ictx.moveTo(innerL,350); ictx.lineTo(innerR,350); ictx.stroke();
    var appY=470;
    if(imgState.iconImg){
      var ic=118, icx=cx, icy=445;
      ictx.save(); ictx.beginPath(); ictx.arc(icx,icy,ic/2,0,Math.PI*2); ictx.closePath();
      ictx.fillStyle=C_PANEL; ictx.fill(); ictx.clip();
      var im=imgState.iconImg, iw=im.naturalWidth, ih=im.naturalHeight, scl=Math.max(ic/iw,ic/ih);
      ictx.drawImage(im, icx-iw*scl/2, icy-ih*scl/2, iw*scl, ih*scl); ictx.restore();
      ictx.strokeStyle=C_LINE; ictx.lineWidth=2;
      ictx.beginPath(); ictx.arc(icx,icy,ic/2,0,Math.PI*2); ictx.stroke();
      appY=560;
    }
    var appName=imgState.app||'アプリ名';
    ictx.fillStyle=imgState.app?C_INK:'#C7C2B8';
    var apx=iFit(appName,'700',innerW,42,1); ictx.font='700 '+apx+'px "Zen Maru Gothic", sans-serif';
    iCenter(appName,cx,appY,1);
    ictx.fillStyle=C_SUB; ictx.font='700 20px "Zen Maru Gothic", sans-serif';
    iCenter('PRODUCT KEY',cx,636,6);
    var boxY=662, boxH=108;
    ictx.fillStyle='#F1EEE8'; iRR(innerL,boxY,innerW,boxH,16); ictx.fill();
    ictx.strokeStyle=C_LINE; ictx.lineWidth=1.5; iRR(innerL,boxY,innerW,boxH,16); ictx.stroke();
    var keyText=imgState.key||'TSUMIKI-XXXX-XXXX-XXXX';
    ictx.fillStyle=imgState.key?C_INK:'#BEB9B0';
    var kpx=iFit(keyText,'700',innerW-60,46,3); ictx.font='700 '+kpx+'px "Zen Maru Gothic", sans-serif';
    iCenter(keyText,cx,boxY+boxH/2+kpx*0.36,3);
    if(imgState.customer){
      var label=imgState.customer+' 専用';   // 発行時に入れた名前をそのまま出す（敬称は付けない）
      var lpx=iFit(label,'500',innerW-40,34,1); ictx.font='500 '+lpx+'px "Zen Maru Gothic", sans-serif';
      var lw=iSW(label,1); ictx.strokeStyle=C_LINE; ictx.lineWidth=1.5; var deco=34;
      ictx.beginPath(); ictx.moveTo(cx-lw/2-16-deco,848); ictx.lineTo(cx-lw/2-16,848); ictx.stroke();
      ictx.beginPath(); ictx.moveTo(cx+lw/2+16,848); ictx.lineTo(cx+lw/2+16+deco,848); ictx.stroke();
      ictx.fillStyle=C_INK; iCenter(label,cx,858,1);
    }
    if(imgState.url){
      iQR(imgState.url,cx,916,196);
    }
    ictx.fillStyle=C_SUB; ictx.font='400 21px "Zen Maru Gothic", sans-serif';
    iCenter('発行日 '+iDate(imgState.date),cx,1246,2);
  }

  var imgModal = document.getElementById('imgModal');
  function openImageModal(d){
    imgState.customer = d.customer || '';
    imgState.app = appMap[d.appName] || (d.appName && d.appName!=='*' ? d.appName : '');
    imgState.key = d.key || '';
    imgState.url = iAppUrl(d.appName);
    imgState.date = iToday();
    imgState.iconImg = null;
    document.getElementById('imgUrl').value = imgState.url;
    document.getElementById('imgIconPrev').textContent = 'なし';
    document.getElementById('imgIconClear').style.display = 'none';
    document.getElementById('imgIconFile').value = '';
    imgModal.hidden = false;
    ensureFonts(iRender);
    autoLoadIcon(d.appName);   // アイコンを自動取得（見つかれば差し込む）
  }
  function closeImageModal(){ imgModal.hidden = true; imgState.iconImg = null; }
  document.getElementById('imgClose').addEventListener('click', closeImageModal);
  imgModal.addEventListener('click', function(e){ if(e.target === imgModal) closeImageModal(); });
  document.getElementById('imgUrl').addEventListener('input', function(){ imgState.url = this.value.trim(); iRender(); });
  document.getElementById('imgIconBtn').addEventListener('click', function(){ document.getElementById('imgIconFile').click(); });
  document.getElementById('imgIconFile').addEventListener('change', function(){
    var f = this.files && this.files[0]; if(!f) return;
    iconToken++;   // 手動アップロードを優先（自動取得の途中結果を無効化）
    var rd = new FileReader();
    rd.onload = function(e){
      var im = new Image();
      im.onload = function(){
        imgState.iconImg = im;
        var p = document.getElementById('imgIconPrev'); p.innerHTML='';
        var pi = new Image(); pi.src = e.target.result; p.appendChild(pi);
        document.getElementById('imgIconClear').style.display=''; iRender();
      };
      im.src = e.target.result;
    };
    rd.readAsDataURL(f);
  });
  document.getElementById('imgIconClear').addEventListener('click', function(){
    iconToken++;   // 自動取得の途中結果も無効化
    imgState.iconImg = null; document.getElementById('imgIconFile').value='';
    document.getElementById('imgIconPrev').textContent='なし'; this.style.display='none'; iRender();
  });
  function imgFilename(){
    var ap = (imgState.app||'app').replace(/[\/\\:*?"<>|\s]+/g,'_');
    var cu = (imgState.customer||'').replace(/[\/\\:*?"<>|\s]+/g,'_');
    return 'TSUMIKIキー_'+ap+(cu?'_'+cu:'')+'.png';
  }
  // キャンバスを同期でBlob化（iOSの共有はタップ操作の中で呼ぶ必要があるため、非同期のtoBlobは使わない）
  function canvasBlobSync(){
    var dataurl = imgCanvas.toDataURL('image/png');
    var bin = atob(dataurl.split(',')[1]);
    var arr = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], {type:'image/png'});
  }
  function downloadBlob(blob, name){
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }
  // 写真に保存（iOS: 共有シート→「画像を保存」でカメラロールへ直接。未対応ならダウンロード）
  document.getElementById('imgSave').addEventListener('click', function(){
    iRender();
    var name = imgFilename();
    var blob = canvasBlobSync();
    var file = null;
    try{ file = new File([blob], name, {type:'image/png'}); }catch(e){ file = null; }
    if(file && navigator.canShare && navigator.canShare({files:[file]})){
      navigator.share({ files:[file] }).catch(function(err){
        if(err && err.name === 'AbortError') return;   // ユーザーがキャンセルしただけ
        downloadBlob(blob, name);                        // それ以外は保険でダウンロード
      });
    } else {
      downloadBlob(blob, name);   // 共有非対応（主にPC）はダウンロード
    }
  });
  document.getElementById('imgDownload').addEventListener('click', function(){
    iRender();
    downloadBlob(canvasBlobSync(), imgFilename());
  });

  // 保存済みパスワードがあれば自動で開く（通信失敗ではログアウトしない＝毎回入力を避ける）
  if(secret){
    openApp();
    (function tryLoad(n){
      load().then(function(r){
        if(r.ok) return;
        if(r.auth){ lockScreen(); return; }        // パスワードが本当に無効な時だけロック
        if(n > 0){ setTimeout(function(){ tryLoad(n-1); }, 2000); }  // 通信失敗は少し待って再試行
      });
    })(2);
  }
})();
</script>
<script>
/* ===== メニュー（引き出し）===== */
(function(){
  var btn=document.getElementById('menuBtn');
  var dr=document.getElementById('drawer');
  var mask=document.getElementById('menuMask');
  function setOpen(on){
    dr.classList.toggle('show', on);
    mask.classList.toggle('show', on);
    dr.setAttribute('aria-hidden', on?'false':'true');
    btn.setAttribute('aria-expanded', on?'true':'false');
    document.body.style.overflow = on ? 'hidden' : '';
    if(on){ var f=dr.querySelector('.dr-item'); if(f) f.focus({preventScroll:true}); }
  }
  btn.addEventListener('click', function(){ setOpen(!dr.classList.contains('show')); });
  mask.addEventListener('click', function(){ setOpen(false); });
  /* 現在地（ライセンス管理）はページ遷移せず、メニューを閉じるだけ */
  dr.addEventListener('click', function(e){
    var it=e.target.closest('.dr-item'); if(!it) return;
    if(it.classList.contains('current')) e.preventDefault();
    setOpen(false);
  });
  document.addEventListener('keydown', function(e){
    if(e.key==='Escape' && dr.classList.contains('show')) setOpen(false);
  });
})();
</script>
<!-- tsumiki-back-button -->
<style>
  #tsumikiEdge{position:fixed; top:0; bottom:0; left:0; width:22px; z-index:999;}
  #tsumikiPeek{
    position:fixed; top:50%; left:0; z-index:1001; margin-top:-23px;
    width:46px; height:46px; display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.92);
    -webkit-backdrop-filter:saturate(180%) blur(14px); backdrop-filter:saturate(180%) blur(14px);
    border:1px solid rgba(0,0,0,.06); border-radius:50%;
    box-shadow:0 6px 20px rgba(0,0,0,.18);
    color:#0071e3; font-size:24px; font-weight:600; line-height:1;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Helvetica Neue",Arial,sans-serif;
    transform:translateX(-70px) scale(.8); opacity:0; pointer-events:none;
  }
</style>
<div id="tsumikiEdge"></div>
<div id="tsumikiPeek">‹</div>
<script>
  (function(){
    var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
      || window.navigator.standalone === true;
    var fromTsumiki = false;
    try{
      if(document.referrer){
        var r = new URL(document.referrer);
        fromTsumiki = (r.origin === location.origin);
      }
    }catch(e){}
    if(!(standalone && fromTsumiki)) return;

    var peek = document.getElementById('tsumikiPeek');
    var edge = document.getElementById('tsumikiEdge');

    function goBack(){ location.href = 'index.html'; }

    /* --- 左端エッジスワイプで戻る（iOS純正の戻る操作。見えるボタンは置かない） --- */
    var sx=0, sy=0, prog=0, dragging=false, W=window.innerWidth;
    var TRIGGER = Math.min(120, W*0.32);
    window.addEventListener('resize', function(){ W=window.innerWidth; TRIGGER=Math.min(120, W*0.32); });

    function reset(){
      dragging = false; prog = 0;
      peek.style.transition = 'transform .25s ease, opacity .25s ease';
      peek.style.transform = 'translateX(-70px) scale(.8)';
      peek.style.opacity = 0;
    }
    function start(e){
      var t = e.touches ? e.touches[0] : e;
      if(t.clientX > 26) return;
      sx = t.clientX; sy = t.clientY; prog = 0; dragging = true;
      peek.style.transition = 'none';
    }
    function move(e){
      if(!dragging) return;
      var t = e.touches ? e.touches[0] : e;
      var dx = t.clientX - sx, dy = t.clientY - sy;
      if(Math.abs(dy) > Math.abs(dx) + 12){ reset(); return; }
      if(dx < 0) dx = 0;
      prog = Math.min(dx / TRIGGER, 1);
      peek.style.transform = 'translateX(' + (-70 + prog*82) + 'px) scale(' + (0.8 + prog*0.2) + ')';
      peek.style.opacity = prog;
      if(dx > 6 && e.cancelable) e.preventDefault();
    }
    function end(){
      if(!dragging) return;
      dragging = false;
      if(prog >= 0.999){
        peek.style.transition = 'transform .25s ease, opacity .25s ease';
        peek.style.transform = 'translateX(20px) scale(1.05)';
        peek.style.opacity = 1;
        goBack();
      }else{
        reset();
      }
    }
    edge.addEventListener('touchstart', start, {passive:true});
    window.addEventListener('touchmove', move, {passive:false});
    window.addEventListener('touchend', end, {passive:true});
    window.addEventListener('touchcancel', end, {passive:true});
  })();
</script>
<!-- /tsumiki-back-button -->
</body>
