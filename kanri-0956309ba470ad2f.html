<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ライセンス管理 — つみき</title>
<link rel="apple-touch-icon" href="icons/icon-kouban.png">
<meta name="apple-mobile-web-app-title" content="ライセンス管理">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{ --paper:#F4F2EE; --card:#FBFAF7; --ink:#242321; --muted:#77736B;
         --hair:#E3DFD8; --ghost:#BEB9B0; --control:#EBE8E1; --shu:#9C4735;
         --shu-bg:#F3E7E3; --ok:#5B7052; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--paper); color:var(--ink);
        font-family:"Zen Maru Gothic",-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;
        -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent; }
  button{ font-family:inherit; font-weight:700; color:inherit; background:none;
          border:none; padding:0; cursor:pointer; }
  input, select{ font-size:16px; font-family:inherit; color:var(--ink);
    background:var(--card); border:1px solid var(--hair); border-radius:13px;
    padding:0 14px; height:50px; line-height:normal; width:100%; outline:none;
    -webkit-appearance:none; appearance:none; }
  select{ font-weight:700;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%2377736B' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat:no-repeat; background-position:right 14px center; padding-right:40px; }
  input:focus, select:focus{ border-color:var(--ghost); }
  input::placeholder{ color:var(--ghost); }

  /* 丸アイコンボタン（44px＝指の当たり判定） */
  .ico{ width:44px; height:44px; flex:none; display:grid; place-items:center;
    border-radius:13px; color:var(--muted); }
  .ico svg{ width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.8;
    stroke-linecap:round; stroke-linejoin:round; }
  .ico:active{ background:var(--control); color:var(--ink); }
  .ico.sm svg{ width:18px; height:18px; }

  /* ============ ロック ============ */
  #lock{ position:fixed; inset:0; z-index:40; display:flex; align-items:center;
    justify-content:center; background:var(--paper); padding:24px; min-height:100dvh; }
  #lock form{ width:100%; max-width:320px; }
  #lock .logo{ width:66px; height:66px; margin:0 auto 26px; display:block; border-radius:20px; }
  .pwrow{ position:relative; }
  .pwrow input{ padding-right:56px; text-align:center; }
  .go{ position:absolute; right:6px; top:6px; width:38px; height:38px; border-radius:11px;
    background:var(--ink); color:var(--paper); display:grid; place-items:center; }
  .go svg{ width:19px; height:19px; stroke:currentColor; fill:none; stroke-width:2.2;
    stroke-linecap:round; stroke-linejoin:round; }
  .go:disabled{ opacity:.35; }
  .err{ color:var(--shu); font-size:12.5px; min-height:1.5em; margin:14px 0 0; text-align:center; }

  /* ============ 骨格 ============ */
  .wrap{ max-width:620px; margin:0 auto; padding:0 12px 110px; }
  header{ position:sticky; top:0; z-index:12; display:flex; align-items:center; gap:2px;
    padding:calc(env(safe-area-inset-top) + 4px) 0 4px; margin-bottom:4px;
    background:rgba(244,242,238,.88);
    -webkit-backdrop-filter:saturate(180%) blur(12px); backdrop-filter:saturate(180%) blur(12px); }
  header h1{ font-size:15px; font-weight:700; margin:0 0 0 4px; }
  .sp{ flex:1; }

  /* さがす（キーが増えたときだけ出る） */
  .srch{ position:relative; margin:2px 0 10px; }
  .srch input{ height:44px; padding-left:40px; background:var(--control); border-color:transparent; font-size:16px; }
  .srch svg{ position:absolute; left:14px; top:14px; width:16px; height:16px; color:var(--ghost);
    stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; }

  /* ============ カード ============ */
  #list{ display:flex; flex-direction:column; gap:10px; }
  .c{ background:var(--card); border:1px solid var(--hair); border-radius:17px; padding:11px 10px 12px 14px; }
  .c.off{ opacity:.66; }
  .c-top{ display:flex; align-items:center; gap:9px; }
  .dot{ width:9px; height:9px; border-radius:50%; background:var(--ok); flex:none; }
  .c.off .dot{ background:var(--ghost); }
  .nm{ font-size:16.5px; font-weight:700; flex:1; min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .c-top .ico{ margin:-8px 0; }
  .c-meta{ display:flex; flex-wrap:wrap; align-items:center; gap:7px 10px;
    margin:7px 0 0 18px; font-size:12.5px; color:var(--muted); }
  .mi{ display:inline-flex; align-items:center; gap:4px; }
  .c-meta svg{ width:13px; height:13px; flex:none; color:var(--ghost);
    stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
  .dev{ position:relative; display:inline-flex; align-items:center; gap:5px;
    height:30px; padding:0 10px; border-radius:9px; background:var(--control);
    font-size:12.5px; font-weight:700; color:var(--muted); font-variant-numeric:tabular-nums; }
  .dev::after{ content:""; position:absolute; inset:-7px -6px; }
  .dev.full{ color:var(--shu); background:var(--shu-bg); }
  .dev.open{ background:var(--ink); color:var(--paper); }
  .dev.open svg{ color:var(--paper); }
  .dev[disabled]{ opacity:.5; }
  .offpill{ font-size:11px; font-weight:700; color:var(--shu);
    background:var(--shu-bg); border-radius:999px; padding:4px 9px; }
  .memo{ display:flex; gap:6px; margin:7px 0 0 18px; font-size:12px; color:var(--ghost); line-height:1.5; }
  .memo svg{ width:13px; height:13px; flex:none; margin-top:2px;
    stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
  .keybtn{ display:flex; align-items:center; gap:9px; width:100%; height:44px; margin-top:10px;
    padding:0 12px; border-radius:12px; background:var(--control); color:var(--muted);
    font-size:13px; font-weight:700; text-align:left; }
  .keybtn span{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .keybtn svg{ width:16px; height:16px; flex:none; color:var(--ghost);
    stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
  .keybtn:active{ background:#E2DED6; color:var(--ink); }

  /* 端末の内訳 */
  .devbox{ margin-top:11px; padding-top:11px; border-top:1px solid var(--hair); display:grid; gap:9px; }
  .devbox[hidden]{ display:none; }
  .devrow{ display:flex; align-items:center; gap:9px; font-size:12.5px; color:var(--muted); }
  .devno{ width:22px; height:22px; flex:none; border-radius:7px; background:var(--control);
    display:grid; place-items:center; font-size:11px; font-weight:700; color:var(--muted); }
  .devrow b{ color:var(--ink); font-weight:700; }
  .devrow .abs{ font-size:11.5px; color:var(--ghost); }
  .devrow .since{ margin-left:auto; font-size:11px; color:var(--ghost); white-space:nowrap; }
  .devnote{ font-size:11.5px; line-height:1.6; color:var(--ghost); }
  .devnote[hidden]{ display:none; }
  .empty{ text-align:center; color:var(--ghost); font-size:13px; padding:70px 0 40px; }
  .empty p{ margin:0; }
  .empty svg{ width:34px; height:34px; margin:0 auto 12px; display:block; color:var(--hair);
    stroke:currentColor; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }

  /* ＋ボタン */
  .fab{ position:fixed; right:16px; bottom:calc(env(safe-area-inset-bottom) + 18px);
    width:58px; height:58px; border-radius:20px; background:var(--ink); color:var(--paper);
    display:grid; place-items:center; z-index:15; box-shadow:0 10px 26px rgba(36,35,33,.26);
    transition:opacity .2s, transform .12s; }
  .fab svg{ width:26px; height:26px; stroke:currentColor; fill:none; stroke-width:2.2; stroke-linecap:round; }
  .fab:active{ transform:scale(.93); }
  .fab[hidden]{ display:none; }

  /* ============ 下から出るシート ============ */
  .mask{ position:fixed; inset:0; background:rgba(36,35,33,.45); z-index:1010;
    opacity:0; transition:opacity .22s; }
  .mask.show{ opacity:1; }
  .mask[hidden]{ display:none; }
  .sheet{ position:fixed; left:0; right:0; bottom:0; z-index:1012; background:var(--paper);
    border-radius:24px 24px 0 0; padding:8px 16px calc(env(safe-area-inset-bottom) + 18px);
    max-height:88dvh; overflow-y:auto; overscroll-behavior:contain;
    transform:translateY(101%); transition:transform .26s cubic-bezier(.22,.61,.36,1);
    box-shadow:0 -10px 44px rgba(36,35,33,.2); }
  .sheet.show{ transform:none; }
  .sheet[hidden]{ display:none; }
  .grab{ width:38px; height:4px; border-radius:2px; background:var(--hair); margin:2px auto 14px; }
  .sh-h{ display:flex; align-items:center; gap:9px; padding:0 4px 12px;
    font-size:15px; font-weight:700; }
  .sh-h .dot{ margin-right:-2px; }
  .sh-sub{ margin:-6px 4px 12px; padding:0; font-size:12.5px; color:var(--muted); line-height:1.6;
    word-break:break-all; }
  .sh-item{ display:flex; align-items:center; gap:13px; width:100%; min-height:54px;
    padding:0 12px; border-radius:14px; font-size:15px; font-weight:700; text-align:left; }
  .sh-item svg{ width:20px; height:20px; flex:none; color:var(--ghost);
    stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .sh-item:active{ background:var(--control); }
  .sh-item.danger{ color:var(--shu); }
  .sh-item.danger svg{ color:var(--shu); }
  .sh-field{ margin-top:10px; }
  .pri{ width:100%; height:52px; border-radius:15px; background:var(--ink); color:var(--paper);
    font-size:15px; margin-top:14px; }
  .pri:disabled{ opacity:.4; }
  .pri.danger{ background:var(--shu); }
  .ghost{ width:100%; height:46px; border-radius:14px; color:var(--muted); font-size:13.5px; margin-top:6px; }
  .ghost:active{ background:var(--control); }
  .ghost:disabled{ opacity:.4; }

  /* 数をふやす／へらす */
  .step{ display:flex; align-items:center; justify-content:center; gap:16px; margin:6px 0 2px; }
  .step button{ width:56px; height:56px; border-radius:19px; background:var(--control);
    display:grid; place-items:center; color:var(--ink); }
  .step button:active{ background:var(--hair); }
  .step button:disabled{ opacity:.35; }
  .step svg{ width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:2.2; stroke-linecap:round; }
  .step b{ font-size:36px; min-width:96px; text-align:center; font-variant-numeric:tabular-nums; }

  /* 長おしで削除 */
  .hold{ position:relative; overflow:hidden; width:100%; height:54px; border-radius:15px;
    background:var(--shu-bg); color:var(--shu); font-size:15px; display:grid; place-items:center;
    margin-top:14px; user-select:none; -webkit-user-select:none; }
  .hold i{ position:absolute; left:0; top:0; bottom:0; width:0; background:var(--shu); opacity:.2; }
  .hold span{ position:relative; }

  /* できあがったキー */
  .bigkey{ display:flex; align-items:center; gap:10px; width:100%; min-height:60px; padding:0 14px;
    border-radius:15px; background:var(--card); border:1px dashed var(--ghost);
    font-size:15px; font-weight:700; text-align:left; word-break:break-all; }
  .bigkey span{ flex:1; }
  .bigkey svg{ width:18px; height:18px; flex:none; color:var(--ghost);
    stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }

  /* お知らせ（取り消しつき） */
  .toast{ position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 90px); z-index:1200;
    transform:translate(-50%,10px); background:var(--ink); color:var(--paper);
    font-size:13.5px; font-weight:700; border-radius:999px; height:46px;
    display:flex; align-items:center; gap:10px; padding:0 8px 0 18px;
    max-width:calc(100vw - 24px); opacity:0; pointer-events:none;
    transition:opacity .2s, transform .2s; }
  .toast.show{ opacity:1; transform:translate(-50%,0); pointer-events:auto; }
  .toast button{ flex:none; height:32px; padding:0 14px; border-radius:999px;
    background:rgba(255,255,255,.18); color:var(--paper); font-size:13px; }
  .toast button[hidden]{ display:none; }

  /* ============ 引き出しメニュー ============ */
  .drawer{ position:fixed; top:0; left:0; bottom:0; width:min(78vw,282px); z-index:1011;
    background:var(--paper); border-right:1px solid var(--hair);
    box-shadow:0 0 44px -10px rgba(36,35,33,.4);
    transform:translateX(-101%); transition:transform .26s cubic-bezier(.22,.61,.36,1);
    padding:calc(env(safe-area-inset-top) + 16px) 12px calc(env(safe-area-inset-bottom) + 14px);
    display:flex; flex-direction:column; gap:4px; overflow-y:auto; overscroll-behavior:contain; }
  .drawer.show{ transform:none; }
  .dr-logo{ width:34px; height:34px; margin:0 8px 14px; display:block; border-radius:11px; }
  .dr-item{ display:flex; align-items:center; gap:12px; min-height:50px; padding:0 12px;
    border-radius:14px; text-decoration:none; color:var(--ink); font-size:15px; font-weight:700;
    width:100%; text-align:left; }
  .dr-item svg{ width:19px; height:19px; flex:none; color:var(--ghost);
    stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .dr-item:active{ background:var(--control); }
  .dr-item.current{ background:var(--control); color:var(--shu); }
  .dr-item.current svg{ color:var(--shu); }

  /* ============ キーカード画像 ============ */
  .imgstage{ background:var(--card); border:1px solid var(--hair); border-radius:16px;
    padding:14px; text-align:center; }
  .imgstage canvas{ width:100%; height:auto; max-width:300px; border-radius:6px;
    box-shadow:0 8px 26px rgba(36,35,33,.16); }
  .urlchk{ font-size:12px; line-height:1.6; margin:7px 2px 0; color:var(--muted); min-height:1.2em; }
  .urlchk.ok{ color:var(--ok); font-weight:700; }
  .urlchk.ng, .urlchk.warn{ color:var(--shu); font-weight:700; }
  .iconrow{ display:flex; align-items:center; gap:12px; margin-top:10px; }
  .iconprev{ width:52px; height:52px; border-radius:50%; flex:none; background:var(--control);
    display:grid; place-items:center; overflow:hidden; color:var(--ghost); font-size:11px; }
  .iconprev img{ width:100%; height:100%; object-fit:cover; }
  .pickbtn{ height:44px; padding:0 16px; border-radius:13px; background:var(--control);
    color:var(--ink); font-size:13.5px; }
  .pickbtn:active{ background:var(--hair); }

  /* ============ 幅ごとの見え方（600 / 900 の2本） ============ */
  @media (min-width:600px){
    .wrap{ padding:0 16px 120px; }
    .c{ padding:13px 12px 14px 16px; }
    .mask{ -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px); }
    .sheet{ left:50%; right:auto; bottom:auto; top:50%; width:min(430px,92vw);
      border-radius:22px; padding:16px 20px 20px; max-height:86dvh;
      transform:translate(-50%,-46%); opacity:0;
      transition:transform .24s cubic-bezier(.22,.61,.36,1), opacity .2s; }
    .sheet.show{ transform:translate(-50%,-50%); opacity:1; }
    .grab{ display:none; }
    .toast{ bottom:calc(env(safe-area-inset-bottom) + 26px); }
  }
  @media (min-width:900px){
    .wrap{ max-width:700px; }
    header h1{ font-size:16px; }
    .nm{ font-size:17px; }
  }
</style>
</head>
<body>

<!-- ロック -->
<div id="lock">
  <form id="lockForm" action="#" method="post">
    <svg class="logo" viewBox="0 0 100 100" aria-label="つみき">
      <rect width="100" height="100" rx="24" fill="#242321"/>
      <g fill="#242321" stroke="#F4F2EE" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round">
        <polygon points="35,46 50,53.5 35,61 20,53.5"/>
        <polygon points="20,53.5 35,61 35,76 20,68.5"/>
        <polygon points="50,53.5 35,61 35,76 50,68.5"/>
        <polygon points="65,46 80,53.5 65,61 50,53.5"/>
        <polygon points="50,53.5 65,61 65,76 50,68.5"/>
        <polygon points="80,53.5 65,61 65,76 80,68.5"/>
        <polygon points="50,24 65,31.5 50,39 35,31.5"/>
        <polygon points="35,31.5 50,39 50,54 35,46.5"/>
        <polygon points="65,31.5 50,39 50,54 65,46.5"/>
      </g>
    </svg>
    <!-- キーチェーン保存用の識別名（画面には出さないが、保存名として使われる） -->
    <input id="user" type="text" name="username" value="tsumiki-admin"
      autocomplete="username" aria-hidden="true" tabindex="-1"
      style="position:absolute; left:-9999px; width:1px; height:1px; opacity:0;">
    <div class="pwrow">
      <input id="pass" type="password" name="password" placeholder="パスワード"
        autocomplete="current-password" enterkeyhint="go">
      <button class="go" id="lockBtn" type="submit" aria-label="ひらく">
        <svg viewBox="0 0 24 24"><path d="M5 12h13"/><path d="M12 5l7 7-7 7"/></svg>
      </button>
    </div>
    <p class="err" id="lockErr"></p>
  </form>
</div>

<!-- 本体 -->
<div class="wrap" id="app" hidden>
  <header>
    <button class="ico" id="menuBtn" type="button" aria-label="メニュー" aria-expanded="false" aria-controls="drawer">
      <svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/></svg>
    </button>
    <h1>ライセンス</h1>
    <span class="sp"></span>
    <button class="ico" id="reloadBtn" type="button" aria-label="読みこみ直す">
      <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 5v6h-6"/></svg>
    </button>
    <button class="ico" id="lockNow" type="button" aria-label="ロックする">
      <svg viewBox="0 0 24 24"><rect x="4" y="10.5" width="16" height="9.5" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>
    </button>
  </header>

  <div class="srch" id="searchWrap" hidden>
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
    <input id="q" type="search" placeholder="さがす" enterkeyhint="search" aria-label="さがす">
  </div>

  <div id="list"></div>
</div>

<button class="fab" id="fab" type="button" aria-label="新しいキーを発行" hidden>
  <svg viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
</button>

<!-- キーカード画像 -->
<div class="sheet" id="imgSheet" role="dialog" aria-label="キーカード" hidden>
  <div class="grab"></div>
  <div class="sh-h">
    キーカード
    <span class="sp"></span>
    <button class="ico sm" id="imgClose" type="button" aria-label="とじる">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="imgstage"><canvas id="imgCanvas" width="1080" height="1350"></canvas></div>
  <div class="sh-field">
    <input id="imgUrl" placeholder="https://…（QRになります）" inputmode="url">
    <p id="imgUrlCheck" class="urlchk">—</p>
  </div>
  <div class="iconrow">
    <div class="iconprev" id="imgIconPrev">
      <svg viewBox="0 0 24 24" style="width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><circle cx="9" cy="9.5" r="1.8"/><path d="M4 17l4.5-4.5 4 3.5 3-2.5L20 18"/></svg>
    </div>
    <button type="button" class="pickbtn" id="imgIconBtn">アイコン</button>
    <button type="button" class="ico sm" id="imgIconClear" aria-label="アイコンを外す" style="display:none">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>
    </button>
    <input type="file" id="imgIconFile" accept="image/*" hidden>
  </div>
  <button class="pri" id="imgSave" type="button">写真に保存</button>
  <button class="ghost" id="imgDownload" type="button">ファイルで保存</button>
</div>

<!-- 汎用シート（メニュー・編集・確認・発行） -->
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden><div id="sheetIn"></div></div>

<!-- 引き出しメニュー -->
<aside class="drawer" id="drawer" aria-label="メニュー" aria-hidden="true">
  <svg class="dr-logo" viewBox="0 0 100 100" aria-label="つみき">
    <rect width="100" height="100" rx="24" fill="#242321"/>
    <g fill="#242321" stroke="#F4F2EE" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round">
      <polygon points="35,46 50,53.5 35,61 20,53.5"/>

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  /* ---------- お知らせ（取り消しつき） ---------- */
  var toastT;
  function toast(msg, undo){
    toastMsg.textContent = msg;
    toastBtn.hidden = !undo;
    toastBtn.onclick = undo ? function(){ toastEl.classList.remove('show'); undo(); } : null;
    toastEl.classList.add('show');
    clearTimeout(toastT);
    toastT = setTimeout(function(){ toastEl.classList.remove('show'); }, undo ? 5000 : 1900);
  }
  function copyText(t){
    function done(){ toast('コピーしました'); }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(done).catch(fallback);
    } else { fallback(); }
    function fallback(){
      try{
        var ta=document.createElement('textarea'); ta.value=t;
        ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta);
        ta.select(); document.execCommand('copy'); document.body.removeChild(ta); done();
      }catch(e){ toast('コピーできませんでした'); }
    }
  }

  /* ---------- 重ねもの（シート・引き出し・おおい） ---------- */
  function anyOpen(){
    return sheet.classList.contains('show') || imgSheet.classList.contains('show')
        || drawer.classList.contains('show');
  }
  function syncMask(){
    var open = anyOpen();
    fab.style.opacity = open ? '0' : '';
    fab.style.pointerEvents = open ? 'none' : '';
    if(open){
      mask.hidden = false;
      requestAnimationFrame(function(){ mask.classList.add('show'); });
      document.body.style.overflow = 'hidden';
    }else{
      mask.classList.remove('show');
      document.body.style.overflow = '';
      setTimeout(function(){ if(!mask.classList.contains('show')) mask.hidden = true; }, 260);
    }
  }
  function openPanel(el){
    el.hidden = false; el.style.transform = '';
    requestAnimationFrame(function(){ el.classList.add('show'); syncMask(); });
  }
  function closePanel(el){
    el.classList.remove('show'); el.style.transform = '';
    syncMask();
    setTimeout(function(){ if(!el.classList.contains('show')) el.hidden = true; }, 320);
  }
  function openSheet(html){
    sheetIn.innerHTML = html;
    sheet.scrollTop = 0;
    openPanel(sheet);
  }

    if(imgSheet.classList.contains('show')) closePanel(imgSheet);
    else if(sheet.classList.contains('show')) closeSheet();

  });
  document.addEventListener('keydown', function(e){
    if(e.key !== 'Escape') return;
    if(imgSheet.classList.contains('show')) closePanel(imgSheet);
    else if(sheet.classList.contains('show')) closeSheet();
    else if(drawer.classList.contains('show')) setDrawer(false);

  /* 下へはらって閉じる（幅600未満・いちばん上まで戻っているときだけ） */
  [sheet, imgSheet].forEach(function(el){
    var y0=0, dy=0, on=false;
    el.addEventListener('touchstart', function(e){
      if(window.innerWidth >= 600 || el.scrollTop > 0) { on=false; return; }
      on = true; y0 = e.touches[0].clientY; dy = 0; el.style.transition = 'none';
    }, {passive:true});
    el.addEventListener('touchmove', function(e){
      if(!on) return;
      dy = e.touches[0].clientY - y0;
      if(dy < 0) dy = 0;
      el.style.transform = 'translateY('+dy+'px)';
    }, {passive:true});
    el.addEventListener('touchend', function(){
      if(!on) return;
      on = false; el.style.transition = '';
      if(dy > 90) closePanel(el); else el.style.transform = '';
    }, {passive:true});
  });

  /* ---------- 日付 ---------- */
  var WD = ['日','月','火','水','木','金','土'];
  function relDays(iso){
    if(!iso) return '';
    /* 「昨日の夜」を今日と数えないよう、時刻ではなく日付の差で見る */
    var a = new Date(iso), b = new Date();
    a = new Date(a.getFullYear(), a.getMonth(), a.getDate());
    b = new Date(b.getFullYear(), b.getMonth(), b.getDate());
    var days = Math.round((b - a)/86400000);
    return days<=0 ? '今日' : (days===1 ? '昨日' : days+'日前');
  }
  function fmtStamp(iso){
    var d = new Date(iso);
    return (d.getMonth()+1)+'/'+d.getDate()+'('+WD[d.getDay()]+') '
         + ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
  }
  function fmtShortDay(iso){
    if(!iso) return '';
    var d = new Date(iso);
    return (d.getMonth()+1)+'/'+d.getDate();
  }

  /* ---------- 一覧 ---------- */
  function appLabel(name){
    if(!name || name==='*') return 'すべて';
    return appMap[name] || name;
  }
  function byKey(k){
    for(var i=0;i<ROWS.length;i++){ if(ROWS[i].key===k) return ROWS[i]; }
    return null;
  }
  function visibleRows(){
    var q = (qInput.value||'').trim().toLowerCase();
    var rows = ROWS.slice();
    if(q){
      rows = rows.filter(function(r){
        return (r.customer+' '+r.app+' '+r.key+' '+(r.note||'')).toLowerCase().indexOf(q) >= 0;
      });
    }
    rows.sort(function(a,b){
      if(!!a.active !== !!b.active) return a.active ? -1 : 1;
      var A=a.last_seen||'', B=b.last_seen||'';
      return A<B ? 1 : (A>B ? -1 : 0);
    });
    return rows;
  }
  function paint(){
    var rows = visibleRows();
    searchWrap.hidden = ROWS.length <= 6;
    if(!rows.length){
      listEl.innerHTML = '<div class="empty">'
        + (ROWS.length ? '<p>見つかりません</p>'
                       : S.key + '<p>＋ でキーを発行</p>')
        + '</div>';
      return;
    }
    listEl.innerHTML = rows.map(function(r){
      var over = r.device_count >= r.max_devices;
      var seen = r.last_seen ? relDays(r.last_seen) : '未使用';
      return '<article class="c'+(r.active?'':' off')+'">'
        + '<div class="c-top">'
        +   '<span class="dot"></span>'
        +   '<span class="nm">'+esc(r.customer)+'</span>'
        +   '<button class="ico sm" data-act="image" data-key="'+esc(r.key)+'" aria-label="キーカードをつくる">'+S.image+'</button>'
        +   '<button class="ico sm" data-act="more" data-key="'+esc(r.key)+'" aria-label="そのほか">'+S.more+'</button>'
        + '</div>'
        + '<div class="c-meta">'
        +   '<span class="mi">'+esc(appLabel(r.app))+'</span>'
        +   '<button class="dev'+(over?' full':'')+'" data-act="devices" data-key="'+esc(r.key)+'"'
        +     (r.device_count?'':' disabled')+' aria-label="端末の内訳">'+S.phone+r.device_count+'/'+r.max_devices+'</button>'
        +   '<span class="mi">'+S.clock+esc(seen)+'</span>'
        +   (r.active ? '' : '<span class="offpill">停止中</span>')
        + '</div>'
        + (r.note ? '<div class="memo">'+S.note+'<span>'+esc(r.note)+'</span></div>' : '')
        + '<button class="keybtn" data-copy="'+esc(r.key)+'"><span>'+esc(r.key)+'</span>'+S.copy+'</button>'
        + '<div class="devbox" hidden></div>'
        + '</article>';
    }).join('');
  }
  function renderDevices(list){
    if(!list.length) return '<div class="devnote">まだどこでも使われていません。</div>';
    return list.map(function(d, i){
      return '<div class="devrow">'
        + '<span class="devno">'+(i+1)+'</span>'
        + (d.last_seen
            ? '<b>'+esc(relDays(d.last_seen))+'</b><span class="abs">'+esc(fmtStamp(d.last_seen))+'</span>'
            : '<b>未使用</b>')
        + '<span class="since">'+esc(fmtShortDay(d.created_at))+'〜</span>'
        + '</div>';
    }).join('')
    + '<button class="ico sm" data-act="devinfo" aria-label="端末の数えかた" style="margin-left:-8px">'+S.info+'</button>'
    + '<div class="devnote" hidden>「端末」はブラウザごとの数えかたです。'
    + '同じ人でもデータを消すと別の端末になります。電波の無い所で開いた分は記録されません。</div>';
  }

  function load(){
    return rpc('admin_list', { p_secret: secret }).then(function(res){
      if(res.ok){ ROWS = res.data || []; paint(); return { ok:true }; }
      return { ok:false, auth:true };
    }, function(){ return { ok:false, auth:false }; });

  function loadApps(){
    return rpc('admin_apps', { p_secret: secret }).then(function(res){
      if(res.ok){
        APPS = res.data || [];
        appMap = {}; APPS.forEach(function(a){ appMap[a.name] = a.label; });
        paint();
      }
    }).catch(function(){});

  function openApp(){ lock.style.display='none'; app.hidden=false; fab.hidden=false; loadApps(); }

  /* ---------- ロック解除 ---------- */

    rpc('admin_list', { p_secret: secret }).then(function(res){

        lockErr.textContent=''; ROWS = res.data||[]; paint(); openApp();
      } else {
        secret=''; lockErr.textContent='パスワードが違うようです';

    var b = e.target.closest('[data-act]');

    if(act==='more'){ sheetMore(key); return; }
    if(act==='devinfo'){
      var n = b.parentNode.querySelector('.devnote'); if(n) n.hidden = !n.hidden; return;
    }
    if(act==='devices'){
      var card = b.closest('.c'); if(!card) return;
      var box = card.querySelector('.devbox'); if(!box) return;
      if(!box.hidden){ box.hidden = true; b.classList.remove('open'); return; }
      box.hidden = false; b.classList.add('open');
      if(box.getAttribute('data-loaded')==='1') return;
      box.innerHTML = '<div class="devnote">読みこみ中…</div>';
      rpc('admin_devices', { p_secret:secret, p_key:key }).then(function(res){
        if(!res.ok || !Array.isArray(res.data)){
          box.innerHTML = '<div class="devnote">読めませんでした。もう一度</div>'; return;
        }
        box.setAttribute('data-loaded','1');
        box.innerHTML = renderDevices(res.data);
      }, function(){
        box.innerHTML = '<div class="devnote">つながりませんでした。もう一度</div>';
      });
    }
  });

  function stepper(id, val, min, max){
    return '<div class="step">'
      + '<button type="button" data-step="-1" aria-label="へらす">'+S.minus+'</button>'
      + '<b id="'+id+'" data-v="'+val+'" data-min="'+min+'" data-max="'+max+'">'+val+'</b>'
      + '<button type="button" data-step="1" aria-label="ふやす">'+S.plus+'</button>'
      + '</div>';
  }
  function wireStepper(root, id){
    var out = root.querySelector('#'+id);
    var box = out.parentNode;
    var timer, hold;
    function bump(d){
      var v = parseInt(out.getAttribute('data-v'),10) + d;
      var mn = parseInt(out.getAttribute('data-min'),10), mx = parseInt(out.getAttribute('data-max'),10);
      if(v<mn) v=mn; if(v>mx) v=mx;
      out.setAttribute('data-v', v); out.textContent = v;
    }
    box.querySelectorAll('[data-step]').forEach(function(btn){
      var d = parseInt(btn.getAttribute('data-step'),10);
      btn.addEventListener('click', function(){ bump(d); });
      function startHold(){ clearTimeout(hold); hold = setTimeout(function(){
        timer = setInterval(function(){ bump(d); }, 90); }, 450); }
      function endHold(){ clearTimeout(hold); clearInterval(timer); }
      btn.addEventListener('touchstart', startHold, {passive:true});
      btn.addEventListener('mousedown', startHold);
      ['touchend','touchcancel','mouseup','mouseleave'].forEach(function(ev){
        btn.addEventListener(ev, endHold);
      });
    });
    return function(){ return parseInt(out.getAttribute('data-v'),10); };
  }
  function sheetMax(r){
    openSheet('<div class="grab"></div><div class="sh-h">台数</div>'
      + stepper('mV', r.max_devices, 1, 100)

    var get = wireStepper(sheetIn, 'mV');
    document.getElementById('mS').addEventListener('click', function(){
      var m = get();
      this.disabled = true;
      rpc('admin_set_max', { p_secret:secret, p_key:r.key, p_max:m })
        .then(function(res){ closeSheet(); if(res.ok){ toast(m+'台にしました'); load(); } else toast('できませんでした'); },
              function(){ closeSheet(); toast('つながりませんでした'); });
    });
  }
  function setActive(key, on, quiet){

  function sheetDelete(r){
    openSheet('<div class="grab"></div><div class="sh-h">削除</div>'
      + '<p class="sh-sub">'+esc(r.customer)+'<br>'+esc(r.key)+'<br>'
      +   'もどせません' + (r.device_count ? ' ・ 端末'+r.device_count+'台も消えます' : '')
      +   '<br>お客様は次に開いたときロックされます</p>'
      + '<button class="hold" id="dH"><i></i><span>長おしで削除</span></button>'
      + '<button class="ghost" data-close>やめる</button>');
    var btn = document.getElementById('dH');
    var bar = btn.querySelector('i'), lab = btn.querySelector('span');
    var t1, fired=false;
    function start(e){
      if(e.cancelable) e.preventDefault();
      fired = false;
      bar.style.transition = 'width 1.2s linear'; bar.style.width = '100%';
      t1 = setTimeout(function(){
        fired = true; lab.textContent = '消しています…';
        rpc('admin_delete', { p_secret:secret, p_key:r.key })
          .then(function(res){
            closeSheet();
            if(res.ok && res.data === true){ toast('削除しました'); load(); }
            else if(res.ok){ toast('見つかりませんでした'); load(); }
            else { toast('できませんでした'); }
          }, function(){ closeSheet(); toast('つながりませんでした'); });
      }, 1200);
    }
    function stop(){
      clearTimeout(t1);
      if(fired) return;
      bar.style.transition = 'width .18s ease'; bar.style.width = '0';
    }
    btn.addEventListener('touchstart', start, {passive:false});
    btn.addEventListener('mousedown', start);
    ['touchend','touchcancel','mouseup','mouseleave'].forEach(function(ev){ btn.addEventListener(ev, stop); });
  }

  sheetIn.addEventListener('click', function(e){
    if(e.target.closest('[data-close]')){ closeSheet(); return; }
    var cp = e.target.closest('[data-copy]');
    if(cp){ copyText(cp.getAttribute('data-copy')); return; }
    var m = e.target.closest('[data-m]');
    if(!m) return;

    var w = m.getAttribute('data-m');

    else if(w==='reset') sheetReset(r);
    else if(w==='delete') sheetDelete(r);
    else if(w==='toggle'){ closeSheet(); setActive(r.key, !r.active); }
  });

  /* ===== キーカード画像（かぎふだ描画エンジンを内蔵。端末内で完結・キーは送信しない） ===== */
  var imgCanvas = document.getElementById('imgCanvas');
  var ictx = imgCanvas.getContext('2d');
  var IMW = 1080, IMH = 1350;
  var C_PAPER='#F4F2EE', C_PANEL='#FBFAF7', C_INK='#242321', C_SUB='#77736B', C_LINE='#D8D4CC';
  var G_HI='#D8BE7E', G_MID='#B08A3E', G_LO='#8A6A2A';
  var imgState = { app:'', appName:'', customer:'', key:'', url:'', date:'', iconImg:null };
  var imgUrlKnown = false;
  var fontsReady = false;
  var iconPrevEl = document.getElementById('imgIconPrev');
  var ICON_PH = iconPrevEl.innerHTML;

  function ensureFonts(cb){
    if(fontsReady){ cb(); return; }
    if(document.fonts && document.fonts.load){
      Promise.all([
        document.fonts.load('700 58px "Zen Maru Gothic"'),
        document.fonts.load('500 24px "Zen Maru Gothic"'),
        document.fonts.load('400 21px "Zen Maru Gothic"')
      ]).then(function(){ fontsReady=true; cb(); }, function(){ cb(); });
    } else { cb(); }
  }
  function iGold(x0,y0,x1,y1){ var g=ictx.createLinearGradient(x0,y0,x1,y1);
    g.addColorStop(0,G_HI); g.addColorStop(.5,G_MID); g.addColorStop(1,G_LO); return g; }
  function iRR(x,y,w,h,r){ ictx.beginPath(); ictx.moveTo(x+r,y);
    ictx.arcTo(x+w,y,x+w,y+h,r); ictx.arcTo(x+w,y+h,x,y+h,r);
    ictx.arcTo(x,y+h,x,y,r); ictx.arcTo(x,y,x+w,y,r); ictx.closePath(); }
  function iSW(text,sp){ var w=0; for(var i=0;i<text.length;i++){ w+=ictx.measureText(text[i]).width; if(i<text.length-1)w+=sp; } return w; }
  function iCenter(text,cx,y,sp){ var t=iSW(text,sp), x=cx-t/2;
    for(var i=0;i<text.length;i++){ ictx.fillText(text[i],x,y); x+=ictx.measureText(text[i]).width+sp; } }
  function iFit(text,weight,maxW,startPx,sp){ var px=startPx;
    while(px>14){ ictx.font=weight+' '+px+'px "Zen Maru Gothic", sans-serif'; if(iSW(text,sp)<=maxW) break; px-=2; } return px; }
  // つみきロゴ（立体キューブ3つ・線画）。stroke に色を渡す
  function iLogo(cx,cy,R,stroke,lw){
    var c = 0.86602540378*R;
    function cube(x,y){
      var V=[[x,y-R],[x+c,y-0.5*R],[x+c,y+0.5*R],[x,y+R],[x-c,y+0.5*R],[x-c,y-0.5*R]];
      ictx.beginPath(); ictx.moveTo(V[0][0],V[0][1]);
      for(var i=1;i<6;i++) ictx.lineTo(V[i][0],V[i][1]);
      ictx.closePath(); ictx.stroke();
      [1,3,5].forEach(function(i){ ictx.beginPath(); ictx.moveTo(x,y); ictx.lineTo(V[i][0],V[i][1]); ictx.stroke(); });
    }
    ictx.save(); ictx.strokeStyle=stroke; ictx.lineWidth=lw; ictx.lineJoin='round'; ictx.lineCap='round';
    cube(cx-c, cy+0.5*R); cube(cx+c, cy+0.5*R); cube(cx, cy-R);
    ictx.restore();
  }
  function iSeal(cx,cy,r){
    ictx.save(); ictx.lineWidth=5; ictx.strokeStyle=iGold(cx-r,cy-r,cx+r,cy+r);
    ictx.beginPath(); ictx.arc(cx,cy,r,0,Math.PI*2); ictx.stroke();
    ictx.lineWidth=2; ictx.beginPath(); ictx.arc(cx,cy,r-9,0,Math.PI*2); ictx.stroke();
    ictx.restore();
    iLogo(cx, cy+0.25*18, 18, iGold(cx-r,cy-r,cx+r,cy+r), 4.5);
  }
  function iQR(url,cx,top,size){
    var qr; try{ qr=qrcode(0,'M'); qr.addData(url); qr.make(); }catch(e){ return top; }
    var n=qr.getModuleCount(), quiet=4, cell=size/(n+quiet*2), x0=cx-size/2, y0=top;
    ictx.save(); ictx.fillStyle='#FFFFFF'; iRR(x0-10,y0-10,size+20,size+20,14); ictx.fill();
    ictx.strokeStyle=C_LINE; ictx.lineWidth=1.5; iRR(x0-10,y0-10,size+20,size+20,14); ictx.stroke();
    ictx.fillStyle=C_INK;
    for(var r=0;r<n;r++){ for(var c=0;c<n;c++){ if(qr.isDark(r,c)){
      var px=x0+(c+quiet)*cell, py=y0+(r+quiet)*cell;
      ictx.fillRect(Math.floor(px),Math.floor(py),Math.ceil(cell)+1,Math.ceil(cell)+1);
    } } }
    ictx.restore(); return y0+size;
  }
  function iDate(v){ if(!v) return ''; var p=v.split('-'); return p.length===3?p[0]+'.'+p[1]+'.'+p[2]:v; }
  function iToday(){ var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
  /* ⚠️ 2026-08-31 のやらかしを二度とやらないための仕掛け。
     もとは 'https://tools.tsumiki-apps.com/'+アプリ名+'.html' と**推測**していた。
     ライセンスのアプリ名は `tsumiki-senya` だが、鍵がかかっている本体は
     `tsumiki-senya-kanri.html`（店長用）。推測は `tsumiki-senya.html`（スタッフ用・鍵なし）を
     指してしまい、**鍵の証明書のQRが、鍵のかかっていない別のアプリに飛ぶ**状態でキーカードを発行した。
     → ①分かっているものは下の表から引く ②表に無ければ推測するが「推測です」と出す
       ③どちらの場合も**実際にそのURLを取りに行って、鍵（tsumiki-license-gate）があるか確かめる**。
     新しいアプリで名前とファイル名がちがうときは、APP_URL に1行足すこと。 */
  var APP_URL = {
    /* 2026-08-31 実測：~/tsumiki-tools の各HTMLの APP='…' と実ファイル名を突き合わせ、
       ぜんぶ本番URLを取りに行って鍵を確認した。名前とファイル名がちがうのは下の3つ。 */
    'tsumiki-senya': 'https://tools.tsumiki-apps.com/tsumiki-senya-kanri.html',
    'teppari':       'https://tools.tsumiki-apps.com/teppari-board.html',
    'kouban':        'https://tools.tsumiki-apps.com/kouban-pro.html',
    'dakoku':        'https://tools.tsumiki-apps.com/dakoku.html',
    'dakoku-kanri':  'https://tools.tsumiki-apps.com/dakoku-kanri.html',
    'mazeiro':       'https://tools.tsumiki-apps.com/mazeiro.html'
  };
  function iAppUrlGuess(name){ if(!name || name==='*') return ''; return 'https://tools.tsumiki-apps.com/'+name+'.html'; }
  function iAppUrl(name){ if(!name || name==='*') return ''; return APP_URL[name] || iAppUrlGuess(name); }
  function iAppUrlIsKnown(name){ return !!(name && APP_URL[name]); }

  /* URLを実際に取りに行って、配布用の本体（鍵つき）かどうかを見る。
     tools 側は access-control-allow-origin:* なので、ブラウザから読める（2026-08-31 実測）。 */
  var urlChkToken = 0, urlChkTimer = 0;
  var imgUrlState = 'empty';   // empty / checking / ok / bad / unknown
  function setUrlChk(cls, msg){
    var el = document.getElementById('imgUrlCheck');
    if(!el) return;
    el.className = 'urlchk ' + (cls||'');
    el.textContent = msg;
  }
  /* 鍵の無いURL・404のままでは保存させない（お客様が入れない紙を渡さないため）。
     つながらなくて確かめられなかったときは、警告だけ出して保存はできる。 */
  function setSaveable(){
    var block = (imgUrlState === 'bad' || imgUrlState === 'checking');
    document.getElementById('imgSave').disabled = block;
    document.getElementById('imgDownload').disabled = block;
    iRender();   // 行き先がだめな間はQRも描かない（見た目でも分かるように）
  }
  function fetchGate(url){
    return fetch(url, {cache:'no-store'}).then(function(r){
      if(!r.ok) return { gate:false, status:r.status };
      return r.text().then(function(t){ return { gate: t.indexOf('tsumiki-license-gate') >= 0 }; });
    });
  }
  /* 行き先の候補。必ず tools.tsumiki-apps.com の中だけを見る（外のURLは組み立てない） */
  function urlCandidates(name){
    if(!name || name === '*') return [];
    var base = 'https://tools.tsumiki-apps.com/';
    var stems = [name];
    stems.push(name.indexOf('tsumiki-') === 0 ? name.slice(8) : 'tsumiki-' + name);
    var suf = ['', '-board', '-pro', '-kanri', '-plus', '-lite', '-app'];
    var out = [];
    stems.forEach(function(s){ suf.forEach(function(x){
      var u = base + s + x + '.html'; if(out.indexOf(u) < 0) out.push(u);
    }); });
    return out;
  }
  function findUrl(tried, my){
    var cands = urlCandidates(imgState.appName).filter(function(u){ return u !== tried; });
    var i = 0;
    setUrlChk('', '鍵つきの本体をさがしています…');
    (function next(){
      if(my !== urlChkToken) return;
      if(i >= cands.length){
        imgUrlState = 'bad';
        setUrlChk('ng', '⚠ 鍵つきの本体が見つかりません。URLを手で入れてください');
        setSaveable(); return;
      }
      var u = cands[i++];
      fetchGate(u).then(function(r){
        if(my !== urlChkToken) return;
        if(r.gate){
          imgState.url = u;
          document.getElementById('imgUrl').value = u;
          imgUrlState = 'ok';
          setUrlChk('ok', '✓ ' + u.split('/').pop() + ' に鍵がありました（こちらに直しました）');
          setSaveable();
          if(!iconManual) autoLoadIcon(imgState.appName);   // 絵も本当の行き先に合わせ直す
          iRender(); return;
        }
        next();
      }, next);
    })();
  }
  function checkUrl(url, known, allowFind){
    clearTimeout(urlChkTimer);
    var my = ++urlChkToken;
    if(!url){
      imgUrlState = 'empty';
      setUrlChk('', 'URLを入れるとQRになります（空でも発行できます）'); setSaveable(); return;
    }
    if(!/^https:\/\//.test(url)){
      imgUrlState = 'bad'; setUrlChk('ng', '⚠ https:// から始まるURLを'); setSaveable(); return;
    }
    imgUrlState = 'checking'; setUrlChk('', '確かめています…'); setSaveable();
    urlChkTimer = setTimeout(function(){
      fetchGate(url).then(function(r){
        if(my !== urlChkToken) return;
        if(r.gate){
          imgUrlState = 'ok';
          setUrlChk('ok', '✓ 鍵つきの本体です' + (known ? '' : '（推測ですが鍵は確認できました）'));
          setSaveable(); return;
        }
        if(allowFind){ findUrl(url, my); return; }
        imgUrlState = 'bad';
        setUrlChk('ng', r.status ? ('⚠ そのURLはありません（http ' + r.status + '）')
                                 : '⚠ このURLに鍵がありません。受け取った方はキーを入れられません');
        setSaveable();
      }, function(e){
        if(my !== urlChkToken) return;
        imgUrlState = 'unknown';
        setUrlChk('warn', '⚠ 確かめられませんでした（' + e.message + '）。URLをお確かめください');
        setSaveable();
      });
    }, 450);
  }

  // アプリ名からアイコンURLの候補を作る（-pro等を外した名前・第1トークンもフォールバック）
  function iconCandidates(name){
    if(!name || name==='*') return [];
    var base = name.replace(/-(pro|lite|plus|kanri|std)$/,'');
    var first = name.split('-')[0];
    /* まず「QRが実際に開くファイル名」から探す。名前とファイル名がちがうアプリ
       （tsumiki-senya → tsumiki-senya-kanri）で、別アプリの絵が載るのを防ぐ。 */
    var fromUrl = (imgState.url || '').split('/').pop().replace(/\.html$/, '');
    var stems = []; [fromUrl, name, base, first].forEach(function(n){ if(n && stems.indexOf(n)<0) stems.push(n); });
    var urls = [];
    stems.forEach(function(n){ urls.push('https://tools.tsumiki-apps.com/icon-'+n+'.png'); });
    stems.forEach(function(n){ urls.push('icons/icon-'+n+'.png'); });
    return urls;
  }
  var iconToken = 0;
  var iconManual = false;   // 手で選んだアイコンは自動取得で上書きしない
  function autoLoadIcon(appName){
    var urls = iconCandidates(appName), i = 0, gen = ++iconToken;
    (function next(){
      if(i >= urls.length || gen !== iconToken) return;
      var im = new Image();
      im.crossOrigin = 'anonymous';
      im.onload = function(){
        if(gen !== iconToken) return;
        imgState.iconImg = im;
        iconPrevEl.innerHTML='';
        var pi = new Image(); pi.src = im.src; iconPrevEl.appendChild(pi);
        document.getElementById('imgIconClear').style.display='';
        iRender();
      };
      im.onerror = function(){ i++; next(); };
      im.src = urls[i];
    })();
  }

  function iRender(){
    ictx.clearRect(0,0,IMW,IMH);
    ictx.fillStyle=C_PAPER; ictx.fillRect(0,0,IMW,IMH);
    ictx.fillStyle=C_PANEL; iRR(28,28,IMW-56,IMH-56,26); ictx.fill();
    ictx.save(); ictx.strokeStyle=iGold(56,56,IMW-56,IMH-56); ictx.lineWidth=3;
    iRR(56,56,IMW-112,IMH-112,18); ictx.stroke(); ictx.lineWidth=1.5;
    iRR(70,70,IMW-140,IMH-140,12); ictx.stroke(); ictx.restore();
    var cx=IMW/2, innerL=150, innerR=IMW-150, innerW=innerR-innerL;
    ictx.textBaseline='alphabetic'; ictx.textAlign='left';
    ictx.fillStyle=G_MID; ictx.font='700 22px "Zen Maru Gothic", sans-serif';
    iCenter('CERTIFICATE OF LICENSE',cx,158,5);
    ictx.strokeStyle=iGold(cx-70,0,cx+70,0); ictx.lineWidth=1.5;
    ictx.beginPath(); ictx.moveTo(cx-70,178); ictx.lineTo(cx+70,178); ictx.stroke();
    ictx.fillStyle=C_INK; ictx.font='700 58px "Zen Maru Gothic", sans-serif';
    iCenter('TSUMIKI',cx,262,10);
    ictx.fillStyle=C_SUB; ictx.font='500 22px "Zen Maru Gothic", sans-serif';
    iCenter('プロダクトキー証明書',cx,300,3);
    iSeal(892,250,64);
    ictx.strokeStyle=C_LINE; ictx.lineWidth=1.5;
    ictx.beginPath(); ictx.moveTo(innerL,350); ictx.lineTo(innerR,350); ictx.stroke();
    var appY=470;
    if(imgState.iconImg){
      var ic=118, icx=cx, icy=445;
      ictx.save(); ictx.beginPath(); ictx.arc(icx,icy,ic/2,0,Math.PI*2); ictx.closePath();
      ictx.fillStyle=C_PANEL; ictx.fill(); ictx.clip();
      var im=imgState.iconImg, iw=im.naturalWidth, ih=im.naturalHeight, scl=Math.max(ic/iw,ic/ih);
      ictx.drawImage(im, icx-iw*scl/2, icy-ih*scl/2, iw*scl, ih*scl); ictx.restore();
      ictx.strokeStyle=C_LINE; ictx.lineWidth=2;
      ictx.beginPath(); ictx.arc(icx,icy,ic/2,0,Math.PI*2); ictx.stroke();
      appY=560;
    }
    var appName=imgState.app||'アプリ名';
    ictx.fillStyle=imgState.app?C_INK:'#C7C2B8';
    var apx=iFit(appName,'700',innerW,42,1); ictx.font='700 '+apx+'px "Zen Maru Gothic", sans-serif';
    iCenter(appName,cx,appY,1);
    ictx.fillStyle=C_SUB; ictx.font='700 20px "Zen Maru Gothic", sans-serif';
    iCenter('PRODUCT KEY',cx,636,6);
    var boxY=662, boxH=108;
    ictx.fillStyle='#F1EEE8'; iRR(innerL,boxY,innerW,boxH,16); ictx.fill();
    ictx.strokeStyle=C_LINE; ictx.lineWidth=1.5; iRR(innerL,boxY,innerW,boxH,16); ictx.stroke();
    var keyText=imgState.key||'TSUMIKI-XXXX-XXXX-XXXX';
    ictx.fillStyle=imgState.key?C_INK:'#BEB9B0';
    var kpx=iFit(keyText,'700',innerW-60,46,3); ictx.font='700 '+kpx+'px "Zen Maru Gothic", sans-serif';
    iCenter(keyText,cx,boxY+boxH/2+kpx*0.36,3);
    if(imgState.customer){
      var label=imgState.customer+' 専用';   // 発行時に入れた名前をそのまま出す（敬称は付けない）
      var lpx=iFit(label,'500',innerW-40,34,1); ictx.font='500 '+lpx+'px "Zen Maru Gothic", sans-serif';
      var lw=iSW(label,1); ictx.strokeStyle=C_LINE; ictx.lineWidth=1.5; var deco=34;
      ictx.beginPath(); ictx.moveTo(cx-lw/2-16-deco,848); ictx.lineTo(cx-lw/2-16,848); ictx.stroke();
      ictx.beginPath(); ictx.moveTo(cx+lw/2+16,848); ictx.lineTo(cx+lw/2+16+deco,848); ictx.stroke();
      ictx.fillStyle=C_INK; iCenter(label,cx,858,1);
    }
    if(imgState.url && imgUrlState !== 'bad'){
      iQR(imgState.url,cx,916,196);
    }
    ictx.fillStyle=C_SUB; ictx.font='400 21px "Zen Maru Gothic", sans-serif';
    iCenter('発行日 '+iDate(imgState.date),cx,1246,2);
  }

  function openImageSheet(d){
    imgState.customer = d.customer || '';
    imgState.app = appMap[d.appName] || (d.appName && d.appName!=='*' ? d.appName : '');
    imgState.appName = d.appName || '';   // 生のアプリ名（行き先さがしに使う）
    imgState.key = d.key || '';
    imgState.url = iAppUrl(d.appName);
    imgUrlKnown = iAppUrlIsKnown(d.appName);
    imgState.date = iToday();
    imgState.iconImg = null; iconManual = false;
    document.getElementById('imgUrl').value = imgState.url;
    checkUrl(imgState.url, imgUrlKnown, true);
    iconPrevEl.innerHTML = ICON_PH;
    document.getElementById('imgIconClear').style.display = 'none';

  document.getElementById('imgClose').addEventListener('click', function(){ closePanel(imgSheet); });
  document.getElementById('imgUrl').addEventListener('input', function(){

    iRender();
  });
  document.getElementById('imgIconBtn').addEventListener('click', function(){ document.getElementById('imgIconFile').click(); });
  document.getElementById('imgIconFile').addEventListener('change', function(){
    var f = this.files && this.files[0]; if(!f) return;
    iconToken++;   // 手動アップロードを優先（自動取得の途中結果を無効化）
    iconManual = true;
    var rd = new FileReader();
    rd.onload = function(e){
      var im = new Image();
      im.onload = function(){
        imgState.iconImg = im;
        iconPrevEl.innerHTML='';

        document.getElementById('imgIconClear').style.display=''; iRender();
      };
      im.src = e.target.result;
    };
    rd.readAsDataURL(f);
  });
  document.getElementById('imgIconClear').addEventListener('click', function(){
    iconToken++; iconManual = false;
    imgState.iconImg = null; document.getElementById('imgIconFile').value='';
    iconPrevEl.innerHTML = ICON_PH; this.style.display='none'; iRender();
  });
  function imgFilename(){
    var ap = (imgState.app||'app').replace(/[\/\\:*?"<>|\s]+/g,'_');
    var cu = (imgState.customer||'').replace(/[\/\\:*?"<>|\s]+/g,'_');
    return 'TSUMIKIキー_'+ap+(cu?'_'+cu:'')+'.png';
  }
  // キャンバスを同期でBlob化（iOSの共有はタップ操作の中で呼ぶ必要があるため、非同期のtoBlobは使わない）
  function canvasBlobSync(){
    var dataurl = imgCanvas.toDataURL('image/png');
    var bin = atob(dataurl.split(',')[1]);
    var arr = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], {type:'image/png'});
  }
  function downloadBlob(blob, name){
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }
  // 写真に保存（iOS: 共有シート→「画像を保存」でカメラロールへ直接。未対応ならダウンロード）
  document.getElementById('imgSave').addEventListener('click', function(){
    iRender();
    var name = imgFilename();
    var blob = canvasBlobSync();
    var file = null;
    try{ file = new File([blob], name, {type:'image/png'}); }catch(e){ file = null; }
    if(file && navigator.canShare && navigator.canShare({files:[file]})){
      navigator.share({ files:[file] }).catch(function(err){
        if(err && err.name === 'AbortError') return;
        downloadBlob(blob, name);
      });
    } else {
      downloadBlob(blob, name);
    }
  });
  document.getElementById('imgDownload').addEventListener('click', function(){
    iRender();
    downloadBlob(canvasBlobSync(), imgFilename());
  });

  /* ---------- 引き出しメニュー ---------- */
  var menuBtn = document.getElementById('menuBtn');
  function setDrawer(on){
    drawer.classList.toggle('show', on);
    drawer.setAttribute('aria-hidden', on?'false':'true');
    menuBtn.setAttribute('aria-expanded', on?'true':'false');
    syncMask();
  }
  window.__setDrawer = setDrawer;
  menuBtn.addEventListener('click', function(){ setDrawer(!drawer.classList.contains('show')); });
  drawer.addEventListener('click', function(e){
    var it=e.target.closest('.dr-item'); if(!it) return;
    if(it.classList.contains('current')) e.preventDefault();
    setDrawer(false);
  });

  /* ---------- 保存済みパスワードがあれば自動で開く ---------- */
  if(secret){
    openApp();
    (function tryLoad(n){
      load().then(function(r){
        if(r.ok) return;
        if(r.auth){ lockScreen(); return; }        // パスワードが本当に無効な時だけロック
        if(n > 0){ setTimeout(function(){ tryLoad(n-1); }, 2000); }  // 通信失敗は少し待って再試行
      });
    })(2);
  }
})();
</script>
<!-- tsumiki-back-button -->
<style>
  #tsumikiEdge{position:fixed; top:0; bottom:0; left:0; width:22px; z-index:999;}
  #tsumikiPeek{
    position:fixed; top:50%; left:0; z-index:1001; margin-top:-23px;
    width:46px; height:46px; display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.92);
    -webkit-backdrop-filter:saturate(180%) blur(14px); backdrop-filter:saturate(180%) blur(14px);
    border:1px solid rgba(0,0,0,.06); border-radius:50%;
    box-shadow:0 6px 20px rgba(0,0,0,.18);
    color:#0071e3; font-size:24px; font-weight:600; line-height:1;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Helvetica Neue",Arial,sans-serif;
    transform:translateX(-70px) scale(.8); opacity:0; pointer-events:none;
  }
</style>
<div id="tsumikiEdge"></div>
<div id="tsumikiPeek">‹</div>
<script>
  (function(){
    var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
      || window.navigator.standalone === true;
    var fromTsumiki = false;
    try{
      if(document.referrer){
        var r = new URL(document.referrer);
        fromTsumiki = (r.origin === location.origin);
      }
    }catch(e){}
    if(!(standalone && fromTsumiki)) return;

    var peek = document.getElementById('tsumikiPeek');
    var edge = document.getElementById('tsumikiEdge');

    function goBack(){ location.href = 'index.html'; }

    /* --- 左端エッジスワイプで戻る（iOS純正の戻る操作。見えるボタンは置かない） --- */
    var sx=0, sy=0, prog=0, dragging=false, W=window.innerWidth;
    var TRIGGER = Math.min(120, W*0.32);
    window.addEventListener('resize', function(){ W=window.innerWidth; TRIGGER=Math.min(120, W*0.32); });

    function reset(){
      dragging = false; prog = 0;
      peek.style.transition = 'transform .25s ease, opacity .25s ease';
      peek.style.transform = 'translateX(-70px) scale(.8)';
      peek.style.opacity = 0;
    }
    function start(e){
      var t = e.touches ? e.touches[0] : e;
      if(t.clientX > 26) return;
      sx = t.clientX; sy = t.clientY; prog = 0; dragging = true;
      peek.style.transition = 'none';
    }
    function move(e){
      if(!dragging) return;
      var t = e.touches ? e.touches[0] : e;
      var dx = t.clientX - sx, dy = t.clientY - sy;
      if(Math.abs(dy) > Math.abs(dx) + 12){ reset(); return; }
      if(dx < 0) dx = 0;
      prog = Math.min(dx / TRIGGER, 1);
      peek.style.transform = 'translateX(' + (-70 + prog*82) + 'px) scale(' + (0.8 + prog*0.2) + ')';
      peek.style.opacity = prog;
      if(dx > 6 && e.cancelable) e.preventDefault();
    }
    function end(){
      if(!dragging) return;
      dragging = false;
      if(prog >= 0.999){
        peek.style.transition = 'transform .25s ease, opacity .25s ease';
        peek.style.transform = 'translateX(20px) scale(1.05)';
        peek.style.opacity = 1;
        goBack();
      }else{
        reset();
      }
    }
    edge.addEventListener('touchstart', start, {passive:true});
    window.addEventListener('touchmove', move, {passive:false});
    window.addEventListener('touchend', end, {passive:true});
    window.addEventListener('touchcancel', end, {passive:true});
  })();
</script>
<!-- /tsumiki-back-button -->
</body>
