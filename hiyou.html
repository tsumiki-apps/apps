<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="apple-touch-icon" href="icons/icon-hiyou.png">
<meta name="apple-mobile-web-app-title" content="費用図鑑">
<title>費用の分解</title>
<style>
  :root{
    color-scheme: light;
    --paper:#fbfaf7;
    --card:#ffffff;
    --ink:#14130f;
    --ink-2:#57554d;
    --muted:#9b988f;
    --line:#c9c5b8;
    --hair:#eceae3;
    --mark:#c2410c;
  }
  @media (prefers-color-scheme: dark){
    :root:where(:not([data-theme="light"])){
      color-scheme: dark;
      --paper:#0f0f0e; --card:#1a1a18; --ink:#f5f4f0;
      --ink-2:#b3b0a6; --muted:#807d75; --line:#4a4945; --hair:#2a2a27;
      --mark:#f0834f;
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --paper:#0f0f0e; --card:#1a1a18; --ink:#f5f4f0;
    --ink-2:#b3b0a6; --muted:#807d75; --line:#4a4945; --hair:#2a2a27;
    --mark:#f0834f;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper); color:var(--ink);
    font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
    font-size:16px; line-height:1.7; -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:640px;margin:0 auto;padding:40px 20px 80px}

  header{margin:0 0 16px}
  .kicker{font-size:11px;letter-spacing:.18em;color:var(--muted);margin:0 0 8px}
  h1{font-size:22px;font-weight:600;margin:0 0 12px;letter-spacing:.02em}
  .intro{font-size:13.5px;color:var(--ink-2);margin:0 0 40px;line-height:1.85}

  .card{
    background:var(--card);
    border:1px solid var(--hair);
    border-radius:16px;
    padding:24px 20px 22px;
    margin:0 0 16px;
  }
  .card.origin{border-color:var(--line);background:transparent}
  .name{font-size:14px;font-weight:600;margin:0 0 22px;letter-spacing:.03em}
  .card.origin .name{color:var(--ink-2)}

  /* 分野の区切り */
  .cat{
    font-size:11px;letter-spacing:.18em;color:var(--muted);
    margin:34px 0 12px;padding-left:4px;
  }
  .cat:first-child{margin-top:0}

  /* 前のカードとの対 */
  .pair{
    display:flex;gap:8px;align-items:flex-start;
    margin:-4px 4px 14px;font-size:12.5px;color:var(--muted);line-height:1.65;
  }
  .pair span:first-child{flex:0 0 auto}

  /* ── 分解の木 ── */
  .tree{position:relative;display:grid;grid-template-columns:auto 1fr;align-items:start}
  .wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  .root{font-size:13.5px;line-height:1.55;font-weight:600;color:var(--ink-2);white-space:nowrap}
  .arms{padding-left:40px;display:flex;flex-direction:column;gap:18px}
  .arm{display:grid;grid-template-columns:auto 1fr;align-items:start}
  .kind{font-size:13.5px;line-height:1.55;font-weight:600;white-space:nowrap;color:var(--ink-2)}
  .leaves{padding-left:32px;display:flex;flex-direction:column;gap:10px}
  .leaf .t{font-size:15px;line-height:1.55;color:var(--ink);display:block}
  .leaf.none .t{color:var(--muted)}
  .leaf.key .t{font-weight:650}

  .twist{
    margin:8px 0 2px;
    padding:0 0 0 13px;
    border-left:2px solid var(--mark);
    font-size:14px; line-height:1.8; color:var(--ink-2);
  }
  .twist b{color:var(--ink);font-weight:650}

  .src{
    margin:20px 0 0;padding-top:12px;border-top:1px solid var(--hair);
    font-size:11px;color:var(--muted);line-height:1.7;
  }
  .src a{color:inherit}

  footer{margin:34px 0 0;font-size:12px;color:var(--muted);line-height:1.9}

  .themebtn{
    appearance:none;background:transparent;color:var(--muted);
    border:1px solid var(--hair);border-radius:999px;
    font:inherit;font-size:11px;padding:5px 12px;cursor:pointer;
    float:right;margin-top:-2px;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <button class="themebtn" id="themebtn" type="button">表示</button>
    <p class="kicker">費用構造図鑑</p>
    <h1>費用の分解</h1>
    <p class="intro">枝は、その商売にしかない費用を選んでいます。<br>色のついた枝が、名前から想像するのとは違う動きをするところ。</p>
  </header>

  <div id="list"></div>

  <footer>
    最初の1枚は、この図鑑のお手本にした航空会社です。<br>
    いまは小売・流通13業種と、飲食7業種。ここに他の業界を足していきます。
  </footer>
</div>

function leaves(items){
  return items.map(x => {
    const cls = 'leaf' + (x.key?' key':'') + (x.none?' none':'');
    const twist = x.twist ? '<p class="twist">'+x.twist+'</p>' : '';
    return '<div class="'+cls+'"><span class="t">'+x.t+'</span>'+twist+'</div>';
  }).join('');
}
function source(d){
  const s = d.src;
  const t = s.url ? `<a href="${s.url}" target="_blank" rel="noopener">${s.title}</a>` : s.title;
  return `<p class="src">出典：${t}（${s.year}）　／　確信度 ${d.conf}</p>`;
}

    <div class="tree">
      <svg class="wires" aria-hidden="true"></svg>
      <div class="root">費用</div>
      <div class="arms">
        <div class="arm">
          <span class="kind">変動費</span>
          <div class="leaves">${leaves(d.hen)}</div>
        </div>
        <div class="arm">
          <span class="kind">固定費</span>
          <div class="leaves">${leaves(d.kotei)}</div>
        </div>
      </div>
    </div>
    ${source(d)}
  </article>
`).join('');


/* ───────────────────────────────────────────
   線を引く。
   置いたあとに実寸を測り、角を丸めた経路を引く。
   形はノートと同じ：親は最初の子と同じ高さで結び、
   2つ目以降は、その線から下へ落ちて └ で受ける。
   ─────────────────────────────────────────── */
const R = 9;
const SVGNS = "http://www.w3.org/2000/svg";
const crisp = n => Math.round(n) + 0.5;

function firstLineCenter(el, box){
  const r  = el.getBoundingClientRect();
  const lh = parseFloat(getComputedStyle(el).lineHeight);
  return r.top - box.top + lh / 2;
}
function edges(el, box){
  const r = el.getBoundingClientRect();
  return { left: r.left - box.left, right: r.right - box.left };
}
function path(cls, d){
  const p = document.createElementNS(SVGNS, "path");
  p.setAttribute("d", d);
  p.setAttribute("class", cls);
  return p;
}
/* 親の高さ x0 から、子たちの y へ配る経路。keyIndex の1本だけ別に返す */
function segments(x0, xJoin, xEnd, ys, keyIndex){
  const normal = [], keyed = [];
  const push = (i, s) => (i === keyIndex ? keyed : normal).push(s);
  push(0, `M ${crisp(x0)} ${crisp(ys[0])} L ${crisp(xEnd)} ${crisp(ys[0])}`);
  for (let i = 1; i < ys.length; i++){
    const jx = crisp(xJoin), y = crisp(ys[i]), yPrev = crisp(ys[i-1]);
    push(i, `M ${jx} ${yPrev} L ${jx} ${y - R} Q ${jx} ${y} ${jx + R} ${y} L ${crisp(xEnd)} ${y}`);
  }
  return { normal, keyed };
}

function drawTree(tree){
  const svg  = tree.querySelector('svg.wires');
  const root = tree.querySelector('.root');
  const arms = [...tree.querySelectorAll('.arm')];

  root.style.transform = '';
  arms.forEach(a => a.querySelector('.kind').style.transform = '');

  const box = tree.getBoundingClientRect();
  if (!box.width) return;

  /* 1. 枝のラベルを、最初の葉と同じ高さにそろえる */
  const info = arms.map(arm => {
    const kind  = arm.querySelector('.kind');
    const nodes = [...arm.querySelectorAll('.leaf')];
    const texts = nodes.map(n => n.querySelector('.t'));
    const ys    = texts.map(t => firstLineCenter(t, box));
    const kc    = firstLineCenter(kind, box);
    kind.style.transform = `translateY(${(ys[0] - kc).toFixed(2)}px)`;
    return { kind, y: ys[0], ys,
             leafLeft: edges(texts[0], box).left,
             kindRight: edges(kind, box).right,
             keyIndex: nodes.findIndex(n => n.classList.contains('key')) };
  });

  /* 2. 幹のラベルを、最初の枝と同じ高さにそろえる */
  const rc = firstLineCenter(root, box);
  root.style.transform = `translateY(${(info[0].y - rc).toFixed(2)}px)`;

  /* 3. 引く */
  svg.setAttribute('viewBox', `0 0 ${box.width} ${box.height}`);
  svg.setAttribute('width',  box.width);
  svg.setAttribute('height', box.height);
  while (svg.firstChild) svg.removeChild(svg.firstChild);

  const rootRight = edges(root, box).right;
  const armLeft   = Math.min(...info.map(a => edges(a.kind, box).left));
  const trunkX    = rootRight + (armLeft - rootRight) / 2;

  const trunk = segments(rootRight + 6, trunkX, armLeft - 6, info.map(a => a.y), -1);
  svg.appendChild(path('w', trunk.normal.join(' ')));

  info.forEach(a => {
    const branchX = a.kindRight + (a.leafLeft - a.kindRight) / 2;
    const s = segments(a.kindRight + 6, branchX, a.leafLeft - 6, a.ys, a.keyIndex);
    if (s.normal.length) svg.appendChild(path('w', s.normal.join(' ')));
    if (s.keyed.length)  svg.appendChild(path('w key', s.keyed.join(' ')));
  });
}

function drawAll(){ document.querySelectorAll('.tree').forEach(drawTree); }

const style = document.createElement('style');
style.textContent = `
  .wires .w{ fill:none; stroke:var(--line); stroke-width:1; stroke-linecap:round; stroke-linejoin:round; }
  .wires .w.key{ stroke:var(--mark); stroke-width:1.5; }
`;
document.head.appendChild(style);

drawAll();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawAll);
window.addEventListener('resize', drawAll);
new ResizeObserver(drawAll).observe(document.getElementById('list'));

document.getElementById('themebtn').addEventListener('click',()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const sys=window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme',
    cur ? (cur==='dark'?'light':'dark') : (sys?'light':'dark'));
});
</script>
<!-- tsumiki-back-button -->
<style>
  #tsumikiEdge{position:fixed; top:0; bottom:0; left:0; width:22px; z-index:999;}
  #tsumikiPeek{
    position:fixed; top:50%; left:0; z-index:1001; margin-top:-23px;
    width:46px; height:46px; display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.92);
    -webkit-backdrop-filter:saturate(180%) blur(14px); backdrop-filter:saturate(180%) blur(14px);
    border:1px solid rgba(0,0,0,.06); border-radius:50%;
    box-shadow:0 6px 20px rgba(0,0,0,.18);
    color:#0071e3; font-size:24px; font-weight:600; line-height:1;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Helvetica Neue",Arial,sans-serif;
    transform:translateX(-70px) scale(.8); opacity:0; pointer-events:none;
  }
</style>
<div id="tsumikiEdge"></div>
<div id="tsumikiPeek">‹</div>
<script>
  (function(){
    var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
      || window.navigator.standalone === true;
    var fromTsumiki = false;
    try{
      if(document.referrer){
        var r = new URL(document.referrer);
        fromTsumiki = (r.origin === location.origin);
      }
    }catch(e){}
    if(!(standalone && fromTsumiki)) return;

    var peek = document.getElementById('tsumikiPeek');
    var edge = document.getElementById('tsumikiEdge');

    function goBack(){ location.href = 'index.html'; }

    /* --- 左端エッジスワイプで戻る（iOS純正の戻る操作。見えるボタンは置かない） --- */
    var sx=0, sy=0, prog=0, dragging=false, W=window.innerWidth;
    var TRIGGER = Math.min(120, W*0.32);
    window.addEventListener('resize', function(){ W=window.innerWidth; TRIGGER=Math.min(120, W*0.32); });

    function reset(){
      dragging = false; prog = 0;
      peek.style.transition = 'transform .25s ease, opacity .25s ease';
      peek.style.transform = 'translateX(-70px) scale(.8)';
      peek.style.opacity = 0;
    }
    function start(e){
      var t = e.touches ? e.touches[0] : e;
      if(t.clientX > 26) return;
      sx = t.clientX; sy = t.clientY; prog = 0; dragging = true;
      peek.style.transition = 'none';
    }
    function move(e){
      if(!dragging) return;
      var t = e.touches ? e.touches[0] : e;
      var dx = t.clientX - sx, dy = t.clientY - sy;
      if(Math.abs(dy) > Math.abs(dx) + 12){ reset(); return; }
      if(dx < 0) dx = 0;
      prog = Math.min(dx / TRIGGER, 1);
      peek.style.transform = 'translateX(' + (-70 + prog*82) + 'px) scale(' + (0.8 + prog*0.2) + ')';
      peek.style.opacity = prog;
      if(dx > 6 && e.cancelable) e.preventDefault();
    }
    function end(){
      if(!dragging) return;
      dragging = false;
      if(prog >= 0.999){
        peek.style.transition = 'transform .25s ease, opacity .25s ease';
        peek.style.transform = 'translateX(20px) scale(1.05)';
        peek.style.opacity = 1;
        goBack();
      }else{
        reset();
      }
    }
    edge.addEventListener('touchstart', start, {passive:true});
    window.addEventListener('touchmove', move, {passive:false});
    window.addEventListener('touchend', end, {passive:true});
    window.addEventListener('touchcancel', end, {passive:true});
  })();
</script>
<!-- /tsumiki-back-button -->
</body>
